schema_version: 2
id: build
version: 4.0.0
input_schema:
  title:
    type: string
    default_value: ''
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  documents:
    type: artifact_map
    default_value: {}
  require_verification:
    type: boolean
    default_value: false
  max_iterations:
    type: number
    default_value: 4
  resume_from:
    type: string
    default_value: ''
  type:
    type: string
    default_value: build
    description: Workflow selected by c2j; this entrypoint handles build.
  model:
    type: string
    default_value: ''
  reasoning_effort:
    type: string
    default_value: ''
inputs:
  title: ${{ inputs.title }}
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  documents: ${{ inputs.documents }}
  require_verification: ${{ inputs.require_verification }}
  max_iterations: ${{ inputs.max_iterations }}
  resume_from: ${{ inputs.resume_from }}
  type: ${{ inputs.type }}
  model: ${{ inputs.model }}
  reasoning_effort: ${{ inputs.reasoning_effort }}
sequence:
- id: workflow
  include: ./adaptive3.yaml
  inputs:
    title: ${{ inputs.title }}
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    documents: ${{ inputs.documents }}
    require_verification: ${{ inputs.require_verification }}
    max_iterations: ${{ inputs.max_iterations }}
    resume_from: ${{ inputs.resume_from }}
    model: ${{ inputs.model }}
    reasoning_effort: ${{ inputs.reasoning_effort }}
outputs:
  summary: ${{ sequence.workflow.outputs.summary }}
  work_kind: ${{ sequence.workflow.outputs.work_kind }}
  artifact_refs: ${{ sequence.workflow.outputs.artifact_refs }}
  reviews: ${{ sequence.workflow.outputs.reviews }}
  merge: ${{ sequence.workflow.outputs.merge }}
  publication: ${{ sequence.workflow.outputs.publication }}
