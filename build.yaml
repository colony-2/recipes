id: build
version: 0.3.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  type:
    type: string
    default_value: build
  bootstrap_mandate:
    type: boolean
    default_value: false
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  type: ${{ inputs.type }}
  bootstrap_mandate: ${{ inputs.bootstrap_mandate }}
desc: Ensure cell setup, design, review tests, implement, verify, and squash merge approved code changes
sequence:
- id: setup
  include: ./recipes/develop/cell-setup.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    bootstrap_mandate: ${{ inputs.bootstrap_mandate }}
- id: develop
  include: ./recipes/develop/develop.yaml
  inputs:
    prompt: ${{ sequence.setup.outputs.prompt }}
    mode: build
    target_directory: '${{ inputs.bootstrap_mandate ? "." : inputs.target_directory }}'
outputs:
  merged: ${{ sequence.develop.outputs.merged }}
  merged_hash: ${{ sequence.develop.outputs.merged_hash }}
  target_branch: ${{ sequence.develop.outputs.target_branch }}
  session_id: ${{ sequence.develop.outputs.session_id }}
  assistant_summary: ${{ sequence.develop.outputs.assistant_summary }}
  result: ${{ sequence.develop.outputs.result }}
  verification: ${{ sequence.develop.outputs.verification }}
  artifact_refs: ${{ sequence.develop.outputs.artifact_refs }}
  dependencies: ${{ sequence.develop.outputs.dependencies }}
  design: ${{ sequence.develop.outputs.design }}
  consultations: ${{ sequence.develop.outputs.consultations }}
  disposition: ${{ sequence.develop.outputs.disposition }}
  session: ${{ sequence.develop.outputs.session }}
  reviews: ${{ sequence.develop.outputs.reviews }}
  review_documents: ${{ sequence.develop.outputs.review_documents }}
