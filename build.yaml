id: build
version: 1.0.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
    default_value: ''
  root_ref:
    type: string
    default_value: ''
  consultation_recipe:
    type: string
    default_value: git+https://github.com/colony-2/recipes.git//recipes/kernel/consultation.yaml@main
  build_recipe:
    type: string
    default_value: build
  create_recipe:
    type: string
    default_value: git+https://github.com/colony-2/recipes.git//create.yaml@main
  type:
    type: string
    default_value: build
    description: 'Deprecated compatibility input: c2j v0.0.82 injects this field. Ignored; build is the only
      development workflow.'
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
sequence:
- id: develop
  workspace:
    cell: ${{ context.git.repo }}
    ref: ${{ context.git.ref }}
  include: ./recipes/develop/develop.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    session: ${{ inputs.session }}
    documents: ${{ inputs.documents }}
    root_cell: ${{ inputs.root_cell }}
    root_ref: ${{ inputs.root_ref }}
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: ${{ inputs.build_recipe }}
    create_recipe: ${{ inputs.create_recipe }}
outputs:
  merged: ${{ sequence.develop.outputs.merged }}
  merged_hash: ${{ sequence.develop.outputs.merged_hash }}
  target_branch: ${{ sequence.develop.outputs.target_branch }}
  session: ${{ sequence.develop.outputs.session }}
  assistant_summary: ${{ sequence.develop.outputs.assistant_summary }}
  disposition: ${{ sequence.develop.outputs.disposition }}
  result: ${{ sequence.develop.outputs.result }}
  artifact_refs: ${{ sequence.develop.outputs.artifact_refs }}
  consultations: ${{ sequence.develop.outputs.consultations }}
  dependencies: ${{ sequence.develop.outputs.dependencies }}
  reviews: ${{ sequence.develop.outputs.reviews }}
  verification: ${{ sequence.develop.outputs.verification }}
