schema_version: 2
id: build
version: 2.0.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  session:
    type: checkpoint
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
    default_value: ''
  root_ref:
    type: string
    default_value: ''
  consultation_recipe:
    type: string
    default_value: git+https://github.com/colony-2/recipes.git//recipes/adaptive/consultation.yaml@main
  build_recipe:
    type: string
    default_value: build
  create_recipe:
    type: string
    default_value: git+https://github.com/colony-2/recipes.git//create.yaml@main
  type:
    type: string
    default_value: build
    description: 'Deprecated compatibility input: c2j v0.0.82 injects this field. Ignored; build is the only development
      workflow.'
  require_verification:
    type: boolean
    default_value: false
  max_iterations:
    type: number
    default_value: 12
  annotations:
    type: array
    default_value: []
    items:
      type: object
      properties:
        id:
          type: string
          required: true
        ref:
          type: artifact
          required: true
        descriptor:
          type: object
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ref:
                type: artifact
sequence:
- id: workflow
  include: ./recipes/adaptive/build.yaml
  inputs:
    annotations: ${{ inputs.annotations }}
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    session: ${{ inputs.?session.orValue({}) }}
    documents: ${{ inputs.documents }}
    root_cell: ${{ inputs.root_cell }}
    root_ref: ${{ inputs.root_ref }}
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: ${{ inputs.build_recipe }}
    create_recipe: ${{ inputs.create_recipe }}
    type: ${{ inputs.type }}
    require_verification: ${{ inputs.require_verification }}
    max_iterations: ${{ inputs.max_iterations }}
outputs:
  annotations: ${{ sequence.workflow.outputs.annotations }}
  merged: ${{ sequence.workflow.outputs.merged }}
  merged_hash: ${{ sequence.workflow.outputs.merged_hash }}
  target_branch: ${{ sequence.workflow.outputs.target_branch }}
  session: ${{ sequence.workflow.outputs.session }}
  assistant_summary: ${{ sequence.workflow.outputs.assistant_summary }}
  disposition: ${{ sequence.workflow.outputs.disposition }}
  result: ${{ sequence.workflow.outputs.result }}
  artifact_refs: ${{ sequence.workflow.outputs.artifact_refs }}
  consultations: ${{ sequence.workflow.outputs.consultations }}
  dependencies: ${{ sequence.workflow.outputs.dependencies }}
  reviews: ${{ sequence.workflow.outputs.reviews }}
  verification: ${{ sequence.workflow.outputs.verification }}
  process: ${{ sequence.workflow.outputs.process }}
  classification: ${{ sequence.workflow.outputs.classification }}
  publication: ${{ sequence.workflow.outputs.publication }}
  rebase_repairs: ${{ sequence.workflow.outputs.rebase_repairs }}
inputs:
  annotations: ${{ inputs.annotations }}
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  type: ${{ inputs.type }}
  require_verification: ${{ inputs.require_verification }}
  max_iterations: ${{ inputs.max_iterations }}
