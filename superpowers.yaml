id: superpowers
version: 0.2.0
desc: Primary same-job C2 Superpowers workflow orchestrator
input_schema:
  prompt:
    type: string
    required: true
  mode:
    type: string
    required: false
  design_json:
    type: string
    required: false
  plan_json:
    type: string
    required: false
  task_id:
    type: string
    required: false
  execution_result_json:
    type: string
    required: false
  verification_result_json:
    type: string
    required: false
  verification_commands:
    type: string
    required: false
  completion_action:
    type: string
    required: false
  bug_report:
    type: string
    required: false
  repro_command:
    type: string
    required: false
  failure_context_json:
    type: string
    required: false
  attempt_count:
    type: string
    required: false
  local_hash:
    type: string
    required: false
  upstream_repo:
    type: string
    required: false
  upstream_branch:
    type: string
    required: false
  commit_message:
    type: string
    required: false
  skill_bundle_ref:
    type: string
    required: false
inputs:
  prompt: "{{ inputs.prompt }}"
  mode: '${{ first_nonempty(inputs.?mode, "auto") }}'
  design_json: '${{ first_nonempty(inputs.?design_json, "") }}'
  plan_json: '${{ first_nonempty(inputs.?plan_json, "") }}'
  task_id: '${{ first_nonempty(inputs.?task_id, "") }}'
  execution_result_json: '${{ first_nonempty(inputs.?execution_result_json, "{}") }}'
  verification_result_json: '${{ first_nonempty(inputs.?verification_result_json, "") }}'
  verification_commands: '${{ first_nonempty(inputs.?verification_commands, "") }}'
  completion_action: '${{ first_nonempty(inputs.?completion_action, "recommend") }}'
  bug_report: '${{ first_nonempty(inputs.?bug_report, "") }}'
  repro_command: '${{ first_nonempty(inputs.?repro_command, "") }}'
  failure_context_json: '${{ first_nonempty(inputs.?failure_context_json, "{}") }}'
  attempt_count: '${{ first_nonempty(inputs.?attempt_count, "0") }}'
  local_hash: '${{ first_nonempty(inputs.?local_hash, context.git.?hash.orValue(""), "") }}'
  upstream_repo: '${{ first_nonempty(inputs.?upstream_repo, context.git.?repo.orValue(""), "") }}'
  upstream_branch: '${{ first_nonempty(inputs.?upstream_branch, context.git.?ref.orValue(""), "") }}'
  commit_message: '${{ first_nonempty(inputs.?commit_message, "Complete Superpowers workflow") }}'
  skill_bundle_ref: '${{ first_nonempty(inputs.?skill_bundle_ref, "") }}'
state:
  initial: route
  states:
    route:
      op: command_execution
      transitions:
        - to: needs_user_input
          when: json_parse(outputs.stdout).workflow_route == "needs_user_input"
        - to: debug_work
          when: json_parse(outputs.stdout).workflow_route == "debug"
        - to: finish_work
          when: json_parse(outputs.stdout).workflow_route == "finish"
        - to: verify_work
          when: json_parse(outputs.stdout).workflow_route == "verify"
        - to: review_plan
          when: json_parse(outputs.stdout).workflow_route == "review_plan"
        - to: execute_plan
          when: json_parse(outputs.stdout).workflow_route == "execute_plan"
        - to: write_plan
          when: json_parse(outputs.stdout).workflow_route == "write_plan"
        - to: brainstorm_design
          when: true
      inputs:
        timeout: 30s
        env:
          C2_MODE: "{{ inputs.mode }}"
          C2_DESIGN_JSON: "{{ inputs.design_json }}"
          C2_PLAN_JSON: "{{ inputs.plan_json }}"
          C2_VERIFICATION_JSON: "{{ inputs.verification_result_json }}"
          C2_BUG_REPORT: "{{ inputs.bug_report }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers"
          python3 - <<'PY'
          import json
          import os

          mode = (os.environ.get("C2_MODE") or "auto").strip()
          has_design = bool((os.environ.get("C2_DESIGN_JSON") or "").strip())
          has_plan = bool((os.environ.get("C2_PLAN_JSON") or "").strip())
          has_verification = bool((os.environ.get("C2_VERIFICATION_JSON") or "").strip())
          has_bug = bool((os.environ.get("C2_BUG_REPORT") or "").strip())

          allowed = {
              "auto",
              "brainstorm",
              "write_plan",
              "review_plan",
              "execute_plan",
              "verify",
              "finish",
              "debug",
              "needs_user_input",
          }
          if mode not in allowed:
              route = "needs_user_input"
              reason = f"Unknown mode {mode!r}."
          elif mode != "auto":
              route = mode
              reason = "Explicit mode selected."
          elif has_verification:
              route = "finish"
              reason = "Verification artifact is already present."
          elif has_plan and has_design:
              route = "review_plan"
              reason = "Design and plan artifacts are present."
          elif has_plan:
              route = "execute_plan"
              reason = "Task plan artifact is already present."
          elif has_design:
              route = "write_plan"
              reason = "Design artifact is already present."
          elif has_bug:
              route = "debug"
              reason = "Bug report was supplied."
          else:
              route = "brainstorm"
              reason = "Feature request needs design before planning."

          if route == "debug" and not has_bug:
              route = "needs_user_input"
              reason = "Debug mode requires a bug_report input."

          result = {
              "workflow_route": route,
              "reason": reason,
              "needs_user_input": route == "needs_user_input",
              "user_question": "Which Superpowers phase should run next?" if route == "needs_user_input" else "",
              "has_design": has_design,
              "has_plan": has_plan,
              "has_verification": has_verification,
          }
          out = "{{ context.environment.op.outbox }}/superpowers/route.json"
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(result, fh, sort_keys=True)
              fh.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

    needs_user_input:
      op: input
      transitions: []
      inputs:
        form:
          title: "Superpowers routing needs input"
          fields:
            - id: response
              type: paragraph_text
              question: '${{ state_exists("debug_work") && state_output("debug_work", "debug_status", "") == "needs_repro_command" ? "Provide a reproduction command for debugging." : json_parse(state_output("route", "stdout", "{\"user_question\":\"Which Superpowers phase should run next?\"}")).user_question }}'
              required: true

    brainstorm_design:
      include: ./superpowers-brainstorm.yaml
      transitions:
        - to: write_plan
          when: outputs.approved_for_planning
        - to: needs_user_input
          when: true
      inputs:
        prompt: "{{ inputs.prompt }}"
        route_json: "{{ states.route.outputs.stdout }}"
        user_feedback: ""
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"

    write_plan:
      include: ./superpowers-write-plan.yaml
      transitions:
        - to: review_plan
          when: true
      inputs:
        prompt: "{{ inputs.prompt }}"
        design_json: '${{ first_nonempty(inputs.?design_json.orValue(""), state_output("brainstorm_design", "design_json", "{}"), "{}") }}'
        user_feedback: '${{ state_output("review_plan", "blocking_feedback", "") }}'
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"

    review_plan:
      include: ./superpowers-plan-review.yaml
      transitions:
        - to: execute_plan
          when: outputs.plan_approved
        - to: replan_required
          when: true
      inputs:
        prompt: "{{ inputs.prompt }}"
        design_json: '${{ first_nonempty(inputs.?design_json.orValue(""), state_output("brainstorm_design", "design_json", "{}"), "{}") }}'
        plan_json: '${{ first_nonempty(inputs.?plan_json.orValue(""), state_output("write_plan", "plan_json", "{}"), "{}") }}'
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"

    replan_required:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        env:
          BLOCKING_FEEDBACK: '${{ state_output("review_plan", "blocking_feedback", "") }}'
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/plan-review"
          python3 - <<'PY'
          import json
          import os

          result = {
              "workflow_status": "requires_replan",
              "blocking_feedback": os.environ.get("BLOCKING_FEEDBACK", ""),
          }
          out = "{{ context.environment.op.outbox }}/superpowers/plan-review/action.json"
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(result, fh, sort_keys=True)
              fh.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

    execute_plan:
      include: ./superpowers-execute-plan.yaml
      transitions:
        - to: child_boundary_required
          when: outputs.child_job_required
        - to: mark_plan_after_task
          when: outputs.task_done
        - to: needs_user_input
          when: outputs.selected_task_id == ""
        - to: task_needs_revision
          when: true
      inputs:
        plan_json: '${{ first_nonempty(inputs.?plan_json.orValue(""), state_output("write_plan", "plan_json", "{}"), "{}") }}'
        task_id: "{{ inputs.task_id }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"

    child_boundary_required:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        env:
          SELECTED_TASK_JSON: "{{ states.execute_plan.outputs.selected_task_json }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          printf '%s\n' "$SELECTED_TASK_JSON" > "{{ context.environment.op.outbox }}/superpowers/execution/child-boundary-required.json"
          printf '%s\n' "$SELECTED_TASK_JSON"

    task_needs_revision:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          cat > "{{ context.environment.op.outbox }}/superpowers/execution/action.json" <<'JSON'
          {"workflow_status":"needs_revision","message":"Task implementation or review gate failed."}
          JSON
          cat "{{ context.environment.op.outbox }}/superpowers/execution/action.json"

    mark_plan_after_task:
      op: command_execution
      transitions:
        - to: verify_work
          when: true
      inputs:
        timeout: 30s
        env:
          PLAN_JSON: '${{ first_nonempty(inputs.?plan_json.orValue(""), state_output("write_plan", "plan_json", "{}"), "{}") }}'
          SELECTED_TASK_JSON: "{{ states.execute_plan.outputs.selected_task_json }}"
          IMPLEMENTATION_JSON: "{{ states.execute_plan.outputs.implementation_raw_output }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          python3 - <<'PY'
          import json
          import os

          plan = json.loads(os.environ["PLAN_JSON"])
          selected = json.loads(os.environ["SELECTED_TASK_JSON"])
          implementation = json.loads(os.environ.get("IMPLEMENTATION_JSON") or "{}")
          task_id = selected.get("task_id", implementation.get("task_id", ""))

          for task in plan.get("tasks", []):
              if task.get("id") == task_id:
                  task["status"] = "done"
                  task["implementation_summary"] = implementation.get("summary", "")
          ready = [tid for tid in plan.get("ready_task_ids", []) if tid != task_id]
          plan["ready_task_ids"] = ready

          execution = {
              "task_id": task_id,
              "status": implementation.get("status", "done"),
              "summary": implementation.get("summary", ""),
              "validation_commands_run": implementation.get("validation_commands_run", []),
          }
          result = {
              "workflow_status": "task_done",
              "task_id": task_id,
              "updated_plan": plan,
              "updated_plan_json": json.dumps(plan, sort_keys=True),
              "execution_result": execution,
              "execution_result_json": json.dumps(execution, sort_keys=True),
          }
          with open("{{ context.environment.op.outbox }}/superpowers/execution/updated-plan.json", "w", encoding="utf-8") as fh:
              json.dump(plan, fh, sort_keys=True)
              fh.write("\n")
          with open("{{ context.environment.op.outbox }}/superpowers/execution/result.json", "w", encoding="utf-8") as fh:
              json.dump(execution, fh, sort_keys=True)
              fh.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

    verify_work:
      include: ./superpowers-verify.yaml
      transitions:
        - to: finish_work
          when: outputs.verification_gate_ok
        - to: debug_needed
          when: true
      inputs:
        plan_json: '${{ first_nonempty(inputs.?plan_json.orValue(""), json_parse(state_output("mark_plan_after_task", "stdout", "{\"updated_plan_json\":\"\"}")).updated_plan_json, state_output("write_plan", "plan_json", "{}"), "{}") }}'
        execution_result_json: '${{ first_nonempty(inputs.?execution_result_json.orValue(""), json_parse(state_output("mark_plan_after_task", "stdout", "{\"execution_result_json\":\"{}\"}")).execution_result_json, "{}") }}'
        verification_commands: "{{ inputs.verification_commands }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"

    debug_needed:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/debug"
          cat > "{{ context.environment.op.outbox }}/superpowers/debug/action.json" <<'JSON'
          {"workflow_status":"needs_debug","message":"Fresh verification failed; route to debug mode with the failing command evidence."}
          JSON
          cat "{{ context.environment.op.outbox }}/superpowers/debug/action.json"

    debug_work:
      include: ./superpowers-debug.yaml
      transitions: []
      inputs:
        bug_report: "{{ inputs.bug_report }}"
        repro_command: "{{ inputs.repro_command }}"
        failure_context_json: "{{ inputs.failure_context_json }}"
        attempt_count: "{{ inputs.attempt_count }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"

    finish_work:
      include: ./superpowers-finish.yaml
      transitions: []
      inputs:
        plan_json: '${{ first_nonempty(inputs.?plan_json.orValue(""), json_parse(state_output("mark_plan_after_task", "stdout", "{\"updated_plan_json\":\"\"}")).updated_plan_json, state_output("write_plan", "plan_json", "{}"), "{}") }}'
        verification_result_json: '${{ first_nonempty(inputs.?verification_result_json.orValue(""), state_output("verify_work", "verification_result_json", "{}"), "{}") }}'
        execution_result_json: '${{ first_nonempty(inputs.?execution_result_json.orValue(""), json_parse(state_output("mark_plan_after_task", "stdout", "{\"execution_result_json\":\"{}\"}")).execution_result_json, "{}") }}'
        completion_action: "{{ inputs.completion_action }}"
        local_hash: "{{ inputs.local_hash }}"
        upstream_repo: "{{ inputs.upstream_repo }}"
        upstream_branch: "{{ inputs.upstream_branch }}"
        commit_message: "{{ inputs.commit_message }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"

outputs:
  workflow_status: '${{ state_exists("finish_work") ? state_output("finish_work", "finish_decision", "finished") : (state_exists("debug_work") ? state_output("debug_work", "debug_status", "") : (state_exists("debug_needed") ? "needs_debug" : (state_exists("task_needs_revision") ? "needs_revision" : (state_exists("child_boundary_required") ? "child_job_required" : (state_exists("replan_required") ? "requires_replan" : (state_exists("needs_user_input") ? "needs_user_input" : "incomplete")))))) }}'
  route: '${{ json_parse(state_output("route", "stdout", "{\"workflow_route\":\"\"}")).workflow_route }}'
  selected_task_id: "${{ state_output('execute_plan', 'selected_task_id', '') }}"
  child_job_required: "${{ state_output('execute_plan', 'child_job_required', false) }}"
  child_job_reason: "${{ state_output('execute_plan', 'child_job_reason', '') }}"
  task_done: "${{ state_exists('mark_plan_after_task') }}"
  updated_plan_json: '${{ json_parse(state_output("mark_plan_after_task", "stdout", "{\"updated_plan_json\":\"\"}")).updated_plan_json }}'
  execution_result_json: '${{ json_parse(state_output("mark_plan_after_task", "stdout", "{\"execution_result_json\":\"{}\"}")).execution_result_json }}'
  verification_result_json: "${{ state_output('verify_work', 'verification_result_json', '') }}"
  verification_ok: "${{ state_output('verify_work', 'verification_ok', false) }}"
  verification_gate_ok: "${{ state_output('verify_work', 'verification_gate_ok', false) }}"
  finish_decision: "${{ state_output('finish_work', 'finish_decision', '') }}"
  merge_ready: "${{ state_output('finish_work', 'merge_ready', false) }}"
  finish_gate_ok: "${{ state_output('finish_work', 'finish_gate_ok', false) }}"
  action_taken: "${{ state_output('finish_work', 'action_taken', '') }}"
  brainstorm_session_id: "${{ state_output('brainstorm_design', 'brainstorm_session_id', '') }}"
  write_plan_session_id: "${{ state_output('write_plan', 'write_plan_session_id', '') }}"
  plan_review_session_id: "${{ state_output('review_plan', 'plan_review_session_id', '') }}"
  implementer_session_id: "${{ state_output('execute_plan', 'implementer_session_id', '') }}"
  revision_session_id: "${{ state_output('execute_plan', 'revision_session_id', '') }}"
  revision_attempted: "${{ state_output('execute_plan', 'revision_attempted', false) }}"
  spec_reviewer_session_id: "${{ state_output('execute_plan', 'spec_reviewer_session_id', '') }}"
  quality_reviewer_session_id: "${{ state_output('execute_plan', 'quality_reviewer_session_id', '') }}"
  tdd_evidence_ok: "${{ state_output('execute_plan', 'tdd_evidence_ok', false) }}"
  tdd_red_exit_code: "${{ state_output('execute_plan', 'tdd_red_exit_code', -1) }}"
  tdd_green_exit_code: "${{ state_output('execute_plan', 'tdd_green_exit_code', -1) }}"
  tdd_refactor_exit_code: "${{ state_output('execute_plan', 'tdd_refactor_exit_code', -1) }}"
  verify_session_id: "${{ state_output('verify_work', 'verify_session_id', '') }}"
  finish_session_id: "${{ state_output('finish_work', 'finish_session_id', '') }}"
  debug_status: "${{ state_output('debug_work', 'debug_status', '') }}"
  debug_session_id: "${{ state_output('debug_work', 'debug_session_id', '') }}"
