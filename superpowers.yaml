id: superpowers
version: 0.1.0
desc: Primary same-job C2 Superpowers workflow orchestrator
input_schema:
  prompt:
    type: string
    required: true
  mode:
    type: string
    required: false
  design_json:
    type: string
    required: false
  plan_json:
    type: string
    required: false
  task_id:
    type: string
    required: false
  execution_result_json:
    type: string
    required: false
  verification_result_json:
    type: string
    required: false
  verification_commands:
    type: string
    required: false
  completion_action:
    type: string
    required: false
  bug_report:
    type: string
    required: false
  local_hash:
    type: string
    required: false
  upstream_repo:
    type: string
    required: false
  upstream_branch:
    type: string
    required: false
  commit_message:
    type: string
    required: false
  skill_bundle_ref:
    type: string
    required: false
inputs:
  prompt: "{{ inputs.prompt }}"
  mode: '${{ first_nonempty(inputs.?mode, "auto") }}'
  design_json: '${{ first_nonempty(inputs.?design_json, "") }}'
  plan_json: '${{ first_nonempty(inputs.?plan_json, "") }}'
  task_id: '${{ first_nonempty(inputs.?task_id, "") }}'
  execution_result_json: '${{ first_nonempty(inputs.?execution_result_json, "{}") }}'
  verification_result_json: '${{ first_nonempty(inputs.?verification_result_json, "") }}'
  verification_commands: '${{ first_nonempty(inputs.?verification_commands, "") }}'
  completion_action: '${{ first_nonempty(inputs.?completion_action, "recommend") }}'
  bug_report: '${{ first_nonempty(inputs.?bug_report, "") }}'
  local_hash: '${{ first_nonempty(inputs.?local_hash, context.git.?hash.orValue(""), "") }}'
  upstream_repo: '${{ first_nonempty(inputs.?upstream_repo, context.git.?repo.orValue(""), "") }}'
  upstream_branch: '${{ first_nonempty(inputs.?upstream_branch, context.git.?ref.orValue(""), "") }}'
  commit_message: '${{ first_nonempty(inputs.?commit_message, "Complete Superpowers workflow") }}'
  skill_bundle_ref: '${{ first_nonempty(inputs.?skill_bundle_ref, "") }}'
state:
  initial: route
  states:
    route:
      op: command_execution
      transitions:
        - to: needs_user_input
          when: json_parse(outputs.stdout).workflow_route == "needs_user_input"
        - to: debug_recipe_required
          when: json_parse(outputs.stdout).workflow_route == "debug"
        - to: finish_work
          when: json_parse(outputs.stdout).workflow_route == "finish"
        - to: verify_work
          when: json_parse(outputs.stdout).workflow_route == "verify"
        - to: review_plan
          when: json_parse(outputs.stdout).workflow_route == "review_plan"
        - to: select_task
          when: json_parse(outputs.stdout).workflow_route == "execute_plan"
        - to: write_plan
          when: json_parse(outputs.stdout).workflow_route == "write_plan"
        - to: brainstorm_design
          when: true
      inputs:
        timeout: 30s
        env:
          C2_MODE: "{{ inputs.mode }}"
          C2_DESIGN_JSON: "{{ inputs.design_json }}"
          C2_PLAN_JSON: "{{ inputs.plan_json }}"
          C2_VERIFICATION_JSON: "{{ inputs.verification_result_json }}"
          C2_BUG_REPORT: "{{ inputs.bug_report }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers"
          python3 - <<'PY'
          import json
          import os

          mode = (os.environ.get("C2_MODE") or "auto").strip()
          has_design = bool((os.environ.get("C2_DESIGN_JSON") or "").strip())
          has_plan = bool((os.environ.get("C2_PLAN_JSON") or "").strip())
          has_verification = bool((os.environ.get("C2_VERIFICATION_JSON") or "").strip())
          has_bug = bool((os.environ.get("C2_BUG_REPORT") or "").strip())

          allowed = {
              "auto",
              "brainstorm",
              "write_plan",
              "review_plan",
              "execute_plan",
              "verify",
              "finish",
              "debug",
              "needs_user_input",
          }
          if mode not in allowed:
              route = "needs_user_input"
              reason = f"Unknown mode {mode!r}."
          elif mode != "auto":
              route = mode
              reason = "Explicit mode selected."
          elif has_verification:
              route = "finish"
              reason = "Verification artifact is already present."
          elif has_plan and has_design:
              route = "review_plan"
              reason = "Design and plan artifacts are present."
          elif has_plan:
              route = "execute_plan"
              reason = "Task plan artifact is already present."
          elif has_design:
              route = "write_plan"
              reason = "Design artifact is already present."
          elif has_bug:
              route = "debug"
              reason = "Bug report was supplied."
          else:
              route = "brainstorm"
              reason = "Feature request needs design before planning."

          if route == "debug" and not has_bug:
              route = "needs_user_input"
              reason = "Debug mode requires a bug_report input."

          result = {
              "workflow_route": route,
              "reason": reason,
              "needs_user_input": route == "needs_user_input",
              "user_question": "Which Superpowers phase should run next?" if route == "needs_user_input" else "",
              "has_design": has_design,
              "has_plan": has_plan,
              "has_verification": has_verification,
          }
          out = "{{ context.environment.op.outbox }}/superpowers/route.json"
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(result, fh, sort_keys=True)
              fh.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

    needs_user_input:
      op: input
      transitions: []
      inputs:
        form:
          title: "Superpowers routing needs input"
          fields:
            - id: response
              type: paragraph_text
              question: '${{ json_parse(state_output("route", "stdout", "{\"user_question\":\"Which Superpowers phase should run next?\"}")).user_question }}'
              required: true

    debug_recipe_required:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/debug"
          cat > "{{ context.environment.op.outbox }}/superpowers/debug/action.json" <<'JSON'
          {"workflow_status":"debug_recipe_required","message":"Run superpowers-debug.yaml for systematic reproduction and root-cause routing."}
          JSON
          cat "{{ context.environment.op.outbox }}/superpowers/debug/action.json"

    brainstorm_design:
      op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
      transitions:
        - to: write_plan
          when: outputs.parsed_output.approved_for_planning
        - to: needs_user_input
          when: true
      inputs:
        skill: c2-superpowers-brainstorm
        input:
          ticket_prompt: "{{ inputs.prompt }}"
          route_json: "{{ states.route.outputs.stdout }}"
          user_feedback: ""
          skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
        prompt: |
          Produce a C2 Superpowers design artifact before any implementation or
          task planning starts.

          Use the `c2-superpowers-brainstorm` contract. Recipes own routing,
          gates, child-job decisions, and git persistence.

          Write:
          - `superpowers/brainstorm/design.md`
          - `superpowers/brainstorm/result.json`
          - `superpowers/brainstorm/latest-status.json`

          Do not implement code, create child jobs, create git worktrees, or
          make manual git commits.
        status_contract:
          path: superpowers/brainstorm/latest-status.json
        output:
          from: artifact
          path: superpowers/brainstorm/result.json
          format: json
          schema:
            type: object
            required:
              - summary
              - recommended_approach
              - alternatives
              - open_questions
              - approved_for_planning
              - plan_inputs
            properties:
              summary:
                type: string
                minLength: 1
              recommended_approach:
                type: string
              alternatives:
                type: array
                items: {}
              open_questions:
                type: array
                items:
                  type: string
              approved_for_planning:
                type: boolean
              plan_inputs:
                type: object
            additionalProperties: true

    write_plan:
      op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
      transitions:
        - to: review_plan
          when: true
      inputs:
        skill: c2-superpowers-write-plan
        input:
          ticket_prompt: "{{ inputs.prompt }}"
          design_json: '${{ first_nonempty(inputs.?design_json.orValue(""), state_output("brainstorm_design", "raw_output", "{}")) }}'
          user_feedback: '${{ state_output("review_plan", "blocking_feedback", "") }}'
          skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
        prompt: |
          Convert the approved design into a C2 Superpowers task plan.

          Use the `c2-superpowers-write-plan` contract. Do not add manual commit
          steps. Do not create child jobs for ordinary dependent tasks. Mark a
          task `requires_child_job=true` only for a real C2 job boundary such as
          target-ref advancement, cross-cell work, reuse, true parallelism, or
          lifecycle isolation.

          Write:
          - `superpowers/plan/plan.md`
          - `superpowers/plan/plan.json`
          - `superpowers/plan/latest-status.json`
        status_contract:
          path: superpowers/plan/latest-status.json
        output:
          from: artifact
          path: superpowers/plan/plan.json
          format: json
          schema:
            type: object
            required:
              - plan_id
              - summary
              - tasks
              - ready_task_ids
              - validation_strategy
              - child_job_boundaries
            properties:
              plan_id:
                type: string
                minLength: 1
              summary:
                type: string
                minLength: 1
              tasks:
                type: array
                minItems: 1
                items:
                  type: object
              ready_task_ids:
                type: array
                minItems: 1
                items:
                  type: string
              validation_strategy:
                type: object
              child_job_boundaries:
                type: array
                items: {}
            additionalProperties: true

    review_plan:
      op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
      transitions:
        - to: select_task
          when: outputs.parsed_output.ok
        - to: replan_required
          when: true
      inputs:
        skill: c2-superpowers-plan-review
        input:
          ticket_prompt: "{{ inputs.prompt }}"
          design_json: '${{ first_nonempty(inputs.?design_json.orValue(""), state_output("brainstorm_design", "raw_output", "{}")) }}'
          plan_json: '${{ first_nonempty(inputs.?plan_json.orValue(""), state_output("write_plan", "raw_output", "{}")) }}'
          skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
        prompt: |
          Review this C2 Superpowers task plan before execution starts.

          Use the `c2-superpowers-plan-review` contract. Recipes own routing,
          gates, child-job decisions, and git persistence. Do not rewrite the
          plan, implement code, create child jobs, create git worktrees, or make
          manual commits.

          Write:
          - `superpowers/plan-review/review.md`
          - `superpowers/plan-review/result.json`
          - `superpowers/plan-review/latest-status.json`
        status_contract:
          path: superpowers/plan-review/latest-status.json
        output:
          from: artifact
          path: superpowers/plan-review/result.json
          format: json
          schema:
            type: object
            required:
              - ok
              - issues
              - recommendations
              - blocking_feedback
              - requires_replan
            properties:
              ok:
                type: boolean
              issues:
                type: array
                items:
                  type: string
              recommendations:
                type: array
                items:
                  type: string
              blocking_feedback:
                type: string
              requires_replan:
                type: boolean
            additionalProperties: true

    replan_required:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        env:
          BLOCKING_FEEDBACK: '${{ state_output("review_plan", "blocking_feedback", "") }}'
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/plan-review"
          python3 - <<'PY'
          import json
          import os

          result = {
              "workflow_status": "requires_replan",
              "blocking_feedback": os.environ.get("BLOCKING_FEEDBACK", ""),
          }
          out = "{{ context.environment.op.outbox }}/superpowers/plan-review/action.json"
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(result, fh, sort_keys=True)
              fh.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

    select_task:
      op: command_execution
      transitions:
        - to: child_boundary_required
          when: json_parse(outputs.stdout).requires_child_job == true
        - to: run_tdd_task_boundary
          when: json_parse(outputs.stdout).selected_task.?requires_tdd.orValue(false) == true
        - to: run_task_boundary
          when: json_parse(outputs.stdout).selected == true
        - to: needs_user_input
          when: true
      inputs:
        timeout: 30s
        env:
          C2_PLAN_JSON: '${{ first_nonempty(inputs.?plan_json.orValue(""), state_output("write_plan", "raw_output", "{}")) }}'
          C2_TASK_ID: "{{ inputs.task_id }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          python3 - <<'PY'
          import json
          import os
          import sys

          plan = json.loads(os.environ["C2_PLAN_JSON"])
          requested = os.environ.get("C2_TASK_ID", "")
          tasks = plan.get("tasks", [])
          by_id = {task.get("id", ""): task for task in tasks}

          selected = by_id.get(requested) if requested else None
          if selected is None:
              for task_id in plan.get("ready_task_ids", []):
                  selected = by_id.get(task_id)
                  if selected is not None:
                      break
          if selected is None:
              for task in tasks:
                  if task.get("status", "pending") == "pending" and not task.get("dependencies", []):
                      selected = task
                      break
          if selected is None:
              result = {
                  "selected": False,
                  "task_id": "",
                  "requires_child_job": False,
                  "child_job_reason": "",
                  "selected_task": {},
              }
              print(json.dumps(result, sort_keys=True))
              sys.exit(0)

          result = {
              "selected": True,
              "task_id": selected.get("id", ""),
              "requires_child_job": bool(selected.get("requires_child_job", False)),
              "child_job_reason": selected.get("child_job_reason", ""),
              "selected_task": selected,
          }
          out = "{{ context.environment.op.outbox }}/superpowers/execution/selected-task.json"
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(result, fh, sort_keys=True)
              fh.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

    child_boundary_required:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        env:
          SELECTED_TASK_JSON: "{{ states.select_task.outputs.stdout }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          printf '%s\n' "$SELECTED_TASK_JSON" > "{{ context.environment.op.outbox }}/superpowers/execution/child-boundary-required.json"
          printf '%s\n' "$SELECTED_TASK_JSON"

    run_task_boundary:
      inputs:
        selected_task_json: "{{ states.select_task.outputs.stdout }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
      state:
        initial: implement_task
        states:
          implement_task:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: spec_review
                when: true
            inputs:
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Implement exactly the selected task inside the current C2 job.

                The selected task JSON is provided in the invocation input.
                Do not create child jobs, create git worktrees, or make manual
                git commits. C2 owns git persistence and gates.

                Write:
                - `superpowers/tasks/<task-id>/implementation-summary.md`
                - `superpowers/tasks/latest-status.json`
                - `superpowers/tasks/result.json`
            status_contract:
              path: superpowers/tasks/latest-status.json
            output:
              from: artifact
              path: superpowers/tasks/result.json
              format: json
              schema: &task_result_schema
                type: object
                required:
                  - task_id
                  - status
                  - summary
                  - validation_commands_run
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - done
                      - done_with_concerns
                      - needs_context
                      - blocked
                      - needs_revision
                  summary:
                    type: string
                  validation_commands_run:
                    type: array
                    items:
                      type: string
                additionalProperties: true

          spec_review:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: quality_review
                when: outputs.parsed_output.?ok.orValue(false)
              - to: revise_after_spec
                when: outputs.parsed_output.?requires_revision.orValue(false) || !outputs.parsed_output.?ok.orValue(false)
            inputs:
              skill: c2-superpowers-spec-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.implement_task.outputs.raw_output }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Review the selected task for spec compliance only.

                Do not implement fixes. Do not create child jobs, worktrees, or
                manual commits. Write the spec review result artifact.
            status_contract:
              path: superpowers/tasks/spec-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/spec-review.json
              format: json
              schema: &review_result_schema
                type: object
                required:
                  - ok
                  - blocking_issues
                  - feedback
                  - requires_revision
                properties:
                  ok:
                    type: boolean
                  blocking_issues:
                    type: array
                    items:
                      type: string
                  feedback:
                    type: string
                  requires_revision:
                    type: boolean
                additionalProperties: true

          quality_review:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: task_gate
                when: outputs.parsed_output.?ok.orValue(false)
              - to: revise_after_quality
                when: outputs.parsed_output.?requires_revision.orValue(false) || !outputs.parsed_output.?ok.orValue(false)
            inputs:
              skill: c2-superpowers-quality-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.implement_task.outputs.raw_output }}"
                spec_review: "{{ states.spec_review.outputs.raw_output }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Review the selected task for quality, maintainability, test
                quality, compatibility, and C2 safety.

                Do not implement fixes. Do not create child jobs, worktrees, or
                manual commits. Write the quality review result artifact.
            status_contract:
              path: superpowers/tasks/quality-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/quality-review.json
              format: json
              schema: *review_result_schema

          revise_after_spec:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: spec_review_after_revision
                when: true
            inputs:
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.implement_task.outputs.raw_output }}"
                spec_review: "{{ states.spec_review.outputs.raw_output }}"
                revision_reason: spec_review
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Revise the selected task to resolve the blocking spec review
                feedback. Do not create child jobs, create worktrees, or make
                manual commits. Write the normal task result artifact after the
                revision.
            status_contract:
              path: superpowers/tasks/latest-status.json
            output:
              from: artifact
              path: superpowers/tasks/result.json
              format: json
              schema: *task_result_schema

          revise_after_quality:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: spec_review_after_revision
                when: true
            inputs:
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.implement_task.outputs.raw_output }}"
                spec_review: "{{ states.spec_review.outputs.raw_output }}"
                quality_review: "{{ states.quality_review.outputs.raw_output }}"
                revision_reason: quality_review
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Revise the selected task to resolve the blocking quality review
                feedback while preserving spec compliance. Do not create child
                jobs, create worktrees, or make manual commits. Write the normal
                task result artifact after the revision.
            status_contract:
              path: superpowers/tasks/latest-status.json
            output:
              from: artifact
              path: superpowers/tasks/result.json
              format: json
              schema: *task_result_schema

          spec_review_after_revision:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: quality_review_after_revision
                when: outputs.parsed_output.?ok.orValue(false)
              - to: task_needs_revision
                when: true
            inputs:
              skill: c2-superpowers-spec-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "${{ first_nonempty(state_output('revise_after_spec', 'raw_output', ''), state_output('revise_after_quality', 'raw_output', ''), state_output('implement_task', 'raw_output', '')) }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Re-review the revised task for spec compliance only.

                Do not implement fixes. Do not create child jobs, worktrees, or
                manual commits. Write the spec review result artifact.
            status_contract:
              path: superpowers/tasks/spec-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/spec-review.json
              format: json
              schema: *review_result_schema

          quality_review_after_revision:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: task_gate_after_revision
                when: outputs.parsed_output.?ok.orValue(false)
              - to: task_needs_revision
                when: true
            inputs:
              skill: c2-superpowers-quality-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "${{ first_nonempty(state_output('revise_after_spec', 'raw_output', ''), state_output('revise_after_quality', 'raw_output', ''), state_output('implement_task', 'raw_output', '')) }}"
                spec_review: "{{ states.spec_review_after_revision.outputs.raw_output }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Re-review the revised task for quality, maintainability, test
                quality, compatibility, and C2 safety. Do not implement fixes,
                create child jobs, create worktrees, or make manual commits.
            status_contract:
              path: superpowers/tasks/quality-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/quality-review.json
              format: json
              schema: *review_result_schema

          task_gate:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions: []
            inputs:
              rules:
                - id: implementation_done
                  type: assert
                  value: '${{ states.implement_task.outputs.parsed_output.?status.orValue("") == "done" }}'
                  message: Implementer must report task status done.
                - id: spec_review_ok
                  type: assert
                  value: '${{ states.spec_review.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Spec review must pass.
                - id: quality_review_ok
                  type: assert
                  value: '${{ states.quality_review.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Quality review must pass.

          task_gate_after_revision:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions: []
            inputs:
              rules:
                - id: implementation_done_after_revision
                  type: assert
                  value: '${{ first_nonempty(state_output("revise_after_spec", "parsed_output.status", ""), state_output("revise_after_quality", "parsed_output.status", "")) == "done" }}'
                  message: Revision must report task status done.
                - id: spec_review_ok_after_revision
                  type: assert
                  value: '${{ states.spec_review_after_revision.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Spec review must pass after revision.
                - id: quality_review_ok_after_revision
                  type: assert
                  value: '${{ states.quality_review_after_revision.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Quality review must pass after revision.
      transitions:
        - to: mark_plan_after_task
          when: outputs.task_gate_ok
        - to: task_needs_revision
          when: true
      outputs:
        implementer_session_id: "${{ first_nonempty(state_output('revise_after_spec', 'sessionId', ''), state_output('revise_after_quality', 'sessionId', ''), state_output('implement_task', 'sessionId', '')) }}"
        revision_session_id: "${{ first_nonempty(state_output('revise_after_spec', 'sessionId', ''), state_output('revise_after_quality', 'sessionId', '')) }}"
        spec_reviewer_session_id: "${{ first_nonempty(state_output('spec_review_after_revision', 'sessionId', ''), state_output('spec_review', 'sessionId', '')) }}"
        quality_reviewer_session_id: "${{ first_nonempty(state_output('quality_review_after_revision', 'sessionId', ''), state_output('quality_review', 'sessionId', '')) }}"
        implementation_raw_output: "${{ first_nonempty(state_output('revise_after_spec', 'raw_output', ''), state_output('revise_after_quality', 'raw_output', ''), state_output('implement_task', 'raw_output', '')) }}"
        implementation_status: "${{ first_nonempty(state_output('revise_after_spec', 'parsed_output.status', ''), state_output('revise_after_quality', 'parsed_output.status', ''), state_output('implement_task', 'parsed_output.status', '')) }}"
        spec_review_ok: "${{ state_output('spec_review_after_revision', 'parsed_output.ok', false) || state_output('spec_review', 'parsed_output.ok', false) }}"
        quality_review_ok: "${{ state_output('quality_review_after_revision', 'parsed_output.ok', false) || state_output('quality_review', 'parsed_output.ok', false) }}"
        task_gate_ok: "${{ state_output('task_gate_after_revision', 'ok', false) || state_output('task_gate', 'ok', false) }}"
        revision_attempted: "${{ state_output('revise_after_spec', 'sessionId', '') != '' || state_output('revise_after_quality', 'sessionId', '') != '' }}"

    run_tdd_task_boundary:
      inputs:
        selected_task_json: "{{ states.select_task.outputs.stdout }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
      state:
        initial: collect_tdd_plan
        states:
          collect_tdd_plan:
            op: command_execution
            transitions:
              - to: write_red_test
                when: true
            inputs:
              timeout: 30s
              env:
                SELECTED_TASK_JSON: "{{ inputs.selected_task_json }}"
              run: |
                set -euo pipefail
                mkdir -p "{{ context.environment.op.outbox }}/superpowers/tasks/tdd"
                python3 - <<'PY'
                import json
                import os

                selected = json.loads(os.environ["SELECTED_TASK_JSON"])
                task = selected.get("selected_task", selected)
                tdd = task.get("tdd", {}) or {}
                validation_commands = task.get("validation_commands", []) or []
                first_validation = next((str(cmd).strip() for cmd in validation_commands if str(cmd).strip()), "")

                red_command = (
                    task.get("tdd_red_command")
                    or tdd.get("red_command")
                    or task.get("red_command")
                    or first_validation
                )
                green_command = (
                    task.get("tdd_green_command")
                    or tdd.get("green_command")
                    or task.get("green_command")
                    or red_command
                )
                refactor_command = (
                    task.get("tdd_refactor_command")
                    or tdd.get("refactor_verification_command")
                    or task.get("refactor_verification_command")
                    or green_command
                )
                expected_failure = (
                    task.get("tdd_expected_failure")
                    or tdd.get("red_expected_failure")
                    or task.get("red_expected_failure")
                    or ""
                )
                result = {
                    "task_id": task.get("id", selected.get("task_id", "")),
                    "requires_tdd": bool(task.get("requires_tdd", False)),
                    "red_command": red_command,
                    "red_expected_failure": expected_failure,
                    "green_command": green_command,
                    "refactor_verification_command": refactor_command,
                }
                out = "{{ context.environment.op.outbox }}/superpowers/tasks/tdd/plan.json"
                with open(out, "w", encoding="utf-8") as fh:
                    json.dump(result, fh, sort_keys=True)
                    fh.write("\n")
                print(json.dumps(result, sort_keys=True))
                PY

          write_red_test:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: run_red_test
                when: true
            inputs:
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                tdd_plan_json: "{{ states.collect_tdd_plan.outputs.stdout }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                RED phase for the selected task. Write only the failing
                behavioral test for the selected behavior. Do not implement
                production code, create child jobs, create worktrees, or make
                manual commits.

                Write `superpowers/tasks/tdd/red-result.json`.
            status_contract:
              path: superpowers/tasks/tdd/red-status.json
            output:
              from: artifact
              path: superpowers/tasks/tdd/red-result.json
              format: json
              schema:
                type: object
                required:
                  - task_id
                  - status
                  - summary
                  - red_command
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                  summary:
                    type: string
                  red_command:
                    type: string
                additionalProperties: true

          run_red_test:
            op: command_execution
            transitions:
              - to: assert_red
                when: true
            inputs:
              timeout: 60m
              continue_on_error: true
              env:
                WT: "{{ context.environment.op.worktree_path }}"
                TDD_PLAN_JSON: "{{ states.collect_tdd_plan.outputs.stdout }}"
              run: |
                set -uo pipefail
                OUT="{{ context.environment.op.outbox }}"
                mkdir -p "$OUT/superpowers/tasks/tdd"
                cd "$WT"

                python3 - <<'PY' > "$OUT/superpowers/tasks/tdd/red-command.sh"
                import json
                import os

                plan = json.loads(os.environ["TDD_PLAN_JSON"])
                command = plan.get("red_command", "").strip()
                print("set -euo pipefail")
                if not command:
                    print("echo 'No RED command was provided.'")
                    print("exit 2")
                else:
                    print(command)
                PY

                set +e
                bash "$OUT/superpowers/tasks/tdd/red-command.sh" 2>&1 | tee "$OUT/superpowers/tasks/tdd/red-output.txt"
                RC=${PIPESTATUS[0]}
                set -e
                exit "$RC"

          assert_red:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions:
              - to: write_green_code
                when: outputs.?ok.orValue(false)
              - to: tdd_failed
                when: true
            inputs:
              rules:
                - id: red_command_present
                  type: assert
                  value: ${{ json_parse(states.collect_tdd_plan.outputs.stdout).red_command != "" }}
                  message: TDD RED command must be present.
                - id: red_command_failed
                  type: assert
                  value: ${{ states.run_red_test.outputs.exit_code != 0 }}
                  message: RED command must fail before GREEN implementation.
                - id: red_expected_failure_observed
                  type: assert
                  value: ${{ json_parse(states.collect_tdd_plan.outputs.stdout).red_expected_failure == "" || states.run_red_test.outputs.stdout.contains(json_parse(states.collect_tdd_plan.outputs.stdout).red_expected_failure) || states.run_red_test.outputs.stderr.contains(json_parse(states.collect_tdd_plan.outputs.stdout).red_expected_failure) }}
                  message: RED failure must match the expected failure when one is supplied.
                - id: red_output_schema_valid
                  type: assert
                  value: '${{ states.write_red_test.outputs.?output_schema_valid.orValue(false) }}'
                  message: RED phase must write the expected result artifact.

          write_green_code:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: run_green_test
                when: true
            inputs:
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                tdd_plan_json: "{{ states.collect_tdd_plan.outputs.stdout }}"
                red_exit_code: "${{ states.run_red_test.outputs.exit_code }}"
                red_stdout: "{{ states.run_red_test.outputs.stdout }}"
                red_stderr: "{{ states.run_red_test.outputs.stderr }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                GREEN phase for the selected task. Implement the minimal code
                necessary to make the RED test pass. Do not create child jobs,
                create worktrees, or make manual commits.

                Write `superpowers/tasks/tdd/green-result.json`.
            status_contract:
              path: superpowers/tasks/tdd/green-status.json
            output:
              from: artifact
              path: superpowers/tasks/tdd/green-result.json
              format: json
              schema:
                type: object
                required:
                  - task_id
                  - status
                  - summary
                  - validation_commands_run
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - done
                      - done_with_concerns
                      - needs_context
                      - blocked
                      - needs_revision
                  summary:
                    type: string
                  validation_commands_run:
                    type: array
                    items:
                      type: string
                additionalProperties: true

          run_green_test:
            op: command_execution
            transitions:
              - to: assert_green
                when: true
            inputs:
              timeout: 60m
              continue_on_error: true
              env:
                WT: "{{ context.environment.op.worktree_path }}"
                TDD_PLAN_JSON: "{{ states.collect_tdd_plan.outputs.stdout }}"
              run: |
                set -uo pipefail
                OUT="{{ context.environment.op.outbox }}"
                mkdir -p "$OUT/superpowers/tasks/tdd"
                cd "$WT"

                python3 - <<'PY' > "$OUT/superpowers/tasks/tdd/green-command.sh"
                import json
                import os

                plan = json.loads(os.environ["TDD_PLAN_JSON"])
                command = plan.get("green_command", "").strip()
                print("set -euo pipefail")
                if not command:
                    print("echo 'No GREEN command was provided.'")
                    print("exit 2")
                else:
                    print(command)
                PY

                set +e
                bash "$OUT/superpowers/tasks/tdd/green-command.sh" 2>&1 | tee "$OUT/superpowers/tasks/tdd/green-output.txt"
                RC=${PIPESTATUS[0]}
                set -e
                exit "$RC"

          assert_green:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions:
              - to: refactor_task
                when: outputs.?ok.orValue(false)
              - to: tdd_failed
                when: true
            inputs:
              rules:
                - id: green_command_present
                  type: assert
                  value: ${{ json_parse(states.collect_tdd_plan.outputs.stdout).green_command != "" }}
                  message: TDD GREEN command must be present.
                - id: green_command_passed
                  type: assert
                  value: ${{ states.run_green_test.outputs.exit_code == 0 }}
                  message: GREEN command must pass after minimal implementation.
                - id: green_output_schema_valid
                  type: assert
                  value: '${{ states.write_green_code.outputs.?output_schema_valid.orValue(false) }}'
                  message: GREEN phase must write the expected result artifact.
                - id: green_status_done
                  type: assert
                  value: '${{ states.write_green_code.outputs.parsed_output.?status.orValue("") == "done" }}'
                  message: GREEN phase must report task status done.

          refactor_task:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: run_refactor_verification
                when: true
            inputs:
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                tdd_plan_json: "{{ states.collect_tdd_plan.outputs.stdout }}"
                green_summary: "{{ states.write_green_code.outputs.raw_output }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                REFACTOR phase for the selected task. Clean up the implementation
                without adding behavior and keep the GREEN test passing. Do not
                create child jobs, create worktrees, or make manual commits.

                Write `superpowers/tasks/tdd/refactor-result.json`.
            status_contract:
              path: superpowers/tasks/tdd/refactor-status.json
            output:
              from: artifact
              path: superpowers/tasks/tdd/refactor-result.json
              format: json
              schema:
                type: object
                required:
                  - task_id
                  - status
                  - summary
                  - validation_commands_run
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - done
                      - done_with_concerns
                      - needs_context
                      - blocked
                      - needs_revision
                  summary:
                    type: string
                  validation_commands_run:
                    type: array
                    items:
                      type: string
                additionalProperties: true

          run_refactor_verification:
            op: command_execution
            transitions:
              - to: assert_refactor
                when: true
            inputs:
              timeout: 60m
              continue_on_error: true
              env:
                WT: "{{ context.environment.op.worktree_path }}"
                TDD_PLAN_JSON: "{{ states.collect_tdd_plan.outputs.stdout }}"
              run: |
                set -uo pipefail
                OUT="{{ context.environment.op.outbox }}"
                mkdir -p "$OUT/superpowers/tasks/tdd"
                cd "$WT"

                python3 - <<'PY' > "$OUT/superpowers/tasks/tdd/refactor-command.sh"
                import json
                import os

                plan = json.loads(os.environ["TDD_PLAN_JSON"])
                command = plan.get("refactor_verification_command", "").strip()
                print("set -euo pipefail")
                if not command:
                    print("echo 'No REFACTOR verification command was provided.'")
                    print("exit 2")
                else:
                    print(command)
                PY

                set +e
                bash "$OUT/superpowers/tasks/tdd/refactor-command.sh" 2>&1 | tee "$OUT/superpowers/tasks/tdd/refactor-output.txt"
                RC=${PIPESTATUS[0]}
                set -e
                exit "$RC"

          assert_refactor:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions:
              - to: spec_review
                when: outputs.?ok.orValue(false)
              - to: tdd_failed
                when: true
            inputs:
              rules:
                - id: refactor_command_present
                  type: assert
                  value: ${{ json_parse(states.collect_tdd_plan.outputs.stdout).refactor_verification_command != "" }}
                  message: TDD refactor verification command must be present.
                - id: refactor_verification_passed
                  type: assert
                  value: ${{ states.run_refactor_verification.outputs.exit_code == 0 }}
                  message: Refactor verification must pass.
                - id: refactor_output_schema_valid
                  type: assert
                  value: '${{ states.refactor_task.outputs.?output_schema_valid.orValue(false) }}'
                  message: REFACTOR phase must write the expected result artifact.
                - id: refactor_status_done
                  type: assert
                  value: '${{ states.refactor_task.outputs.parsed_output.?status.orValue("") == "done" }}'
                  message: REFACTOR phase must report task status done.

          spec_review:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: quality_review
                when: true
            inputs:
              skill: c2-superpowers-spec-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.refactor_task.outputs.raw_output }}"
                tdd_evidence_json: "{{ states.collect_tdd_plan.outputs.stdout }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Review the selected TDD task for spec compliance only. Include
                the RED/GREEN/refactor evidence in your review. Do not implement
                fixes, create child jobs, create worktrees, or make manual
                commits.
            status_contract:
              path: superpowers/tasks/spec-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/spec-review.json
              format: json
              schema:
                type: object
                required:
                  - ok
                  - blocking_issues
                  - feedback
                  - requires_revision
                properties:
                  ok:
                    type: boolean
                  blocking_issues:
                    type: array
                    items:
                      type: string
                  feedback:
                    type: string
                  requires_revision:
                    type: boolean
                additionalProperties: true

          quality_review:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: task_gate
                when: true
            inputs:
              skill: c2-superpowers-quality-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.refactor_task.outputs.raw_output }}"
                spec_review: "{{ states.spec_review.outputs.raw_output }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Review the selected TDD task for quality, maintainability, test
                quality, compatibility, and C2 safety. Do not implement fixes,
                create child jobs, create worktrees, or make manual commits.
            status_contract:
              path: superpowers/tasks/quality-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/quality-review.json
              format: json
              schema:
                type: object
                required:
                  - ok
                  - blocking_issues
                  - feedback
                  - requires_revision
                properties:
                  ok:
                    type: boolean
                  blocking_issues:
                    type: array
                    items:
                      type: string
                  feedback:
                    type: string
                  requires_revision:
                    type: boolean
                additionalProperties: true

          task_gate:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions: []
            inputs:
              rules:
                - id: red_gate_ok
                  type: assert
                  value: '${{ states.assert_red.outputs.?ok.orValue(false) }}'
                  message: RED gate must pass before task review.
                - id: green_gate_ok
                  type: assert
                  value: '${{ states.assert_green.outputs.?ok.orValue(false) }}'
                  message: GREEN gate must pass before task review.
                - id: refactor_gate_ok
                  type: assert
                  value: '${{ states.assert_refactor.outputs.?ok.orValue(false) }}'
                  message: Refactor verification gate must pass before task review.
                - id: spec_review_ok
                  type: assert
                  value: '${{ states.spec_review.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Spec review must pass.
                - id: quality_review_ok
                  type: assert
                  value: '${{ states.quality_review.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Quality review must pass.

          tdd_failed:
            op: command_execution
            transitions: []
            inputs:
              timeout: 30s
              run: |
                set -euo pipefail
                mkdir -p "{{ context.environment.op.outbox }}/superpowers/tasks/tdd"
                cat > "{{ context.environment.op.outbox }}/superpowers/tasks/tdd/action.json" <<'JSON'
                {"task_status":"needs_revision","reason":"TDD gate failed before the task could advance."}
                JSON
                cat "{{ context.environment.op.outbox }}/superpowers/tasks/tdd/action.json"
      transitions:
        - to: mark_plan_after_task
          when: outputs.task_gate_ok
        - to: task_needs_revision
          when: true
      outputs:
        implementer_session_id: "${{ first_nonempty(state_output('refactor_task', 'sessionId', ''), state_output('write_green_code', 'sessionId', '')) }}"
        spec_reviewer_session_id: "${{ state_output('spec_review', 'sessionId', '') }}"
        quality_reviewer_session_id: "${{ state_output('quality_review', 'sessionId', '') }}"
        implementation_raw_output: "${{ first_nonempty(state_output('refactor_task', 'raw_output', ''), state_output('write_green_code', 'raw_output', '')) }}"
        implementation_status: "${{ first_nonempty(state_output('refactor_task', 'parsed_output.status', ''), state_output('write_green_code', 'parsed_output.status', '')) }}"
        spec_review_ok: "${{ state_output('spec_review', 'parsed_output.ok', false) }}"
        quality_review_ok: "${{ state_output('quality_review', 'parsed_output.ok', false) }}"
        task_gate_ok: "${{ state_output('task_gate', 'ok', false) }}"
        tdd_red_exit_code: "${{ state_output('run_red_test', 'exit_code', -1) }}"
        tdd_green_exit_code: "${{ state_output('run_green_test', 'exit_code', -1) }}"
        tdd_refactor_exit_code: "${{ state_output('run_refactor_verification', 'exit_code', -1) }}"
        tdd_evidence_ok: "${{ state_output('assert_refactor', 'ok', false) && state_output('assert_red', 'ok', false) && state_output('assert_green', 'ok', false) }}"

    task_needs_revision:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          cat > "{{ context.environment.op.outbox }}/superpowers/execution/action.json" <<'JSON'
          {"workflow_status":"needs_revision","message":"Task implementation or review gate failed."}
          JSON
          cat "{{ context.environment.op.outbox }}/superpowers/execution/action.json"

    mark_plan_after_task:
      op: command_execution
      transitions:
        - to: verify_work
          when: true
      inputs:
        timeout: 30s
        env:
          PLAN_JSON: '${{ first_nonempty(inputs.?plan_json.orValue(""), state_output("write_plan", "raw_output", "{}")) }}'
          SELECTED_TASK_JSON: "{{ states.select_task.outputs.stdout }}"
          IMPLEMENTATION_JSON: "${{ first_nonempty(state_output('run_task_boundary', 'implementation_raw_output', ''), state_output('run_tdd_task_boundary', 'implementation_raw_output', '')) }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          python3 - <<'PY'
          import json
          import os

          plan = json.loads(os.environ["PLAN_JSON"])
          selected = json.loads(os.environ["SELECTED_TASK_JSON"])
          implementation = json.loads(os.environ.get("IMPLEMENTATION_JSON") or "{}")
          task_id = selected.get("task_id", implementation.get("task_id", ""))

          for task in plan.get("tasks", []):
              if task.get("id") == task_id:
                  task["status"] = "done"
                  task["implementation_summary"] = implementation.get("summary", "")
          ready = [tid for tid in plan.get("ready_task_ids", []) if tid != task_id]
          plan["ready_task_ids"] = ready

          execution = {
              "task_id": task_id,
              "status": implementation.get("status", "done"),
              "summary": implementation.get("summary", ""),
              "validation_commands_run": implementation.get("validation_commands_run", []),
          }
          result = {
              "workflow_status": "task_done",
              "task_id": task_id,
              "updated_plan": plan,
              "updated_plan_json": json.dumps(plan, sort_keys=True),
              "execution_result": execution,
              "execution_result_json": json.dumps(execution, sort_keys=True),
          }
          with open("{{ context.environment.op.outbox }}/superpowers/execution/updated-plan.json", "w", encoding="utf-8") as fh:
              json.dump(plan, fh, sort_keys=True)
              fh.write("\n")
          with open("{{ context.environment.op.outbox }}/superpowers/execution/result.json", "w", encoding="utf-8") as fh:
              json.dump(execution, fh, sort_keys=True)
              fh.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

    verify_work:
      inputs:
        plan_json: '${{ first_nonempty(inputs.?plan_json.orValue(""), json_parse(state_output("mark_plan_after_task", "stdout", "{\"updated_plan_json\":\"\"}")).updated_plan_json, state_output("write_plan", "raw_output", "{}")) }}'
        execution_result_json: '${{ first_nonempty(inputs.?execution_result_json.orValue(""), json_parse(state_output("mark_plan_after_task", "stdout", "{\"execution_result_json\":\"{}\"}")).execution_result_json, "{}") }}'
        verification_commands: "{{ inputs.verification_commands }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
      sequence:
        - id: collect_verification_inputs
          op: command_execution
          inputs:
            timeout: 30s
            env:
              PLAN_JSON: "{{ inputs.plan_json }}"
              EXECUTION_RESULT_JSON: "{{ inputs.execution_result_json }}"
              VERIFICATION_COMMANDS: "{{ inputs.verification_commands }}"
            run: |
              set -euo pipefail
              mkdir -p "{{ context.environment.op.outbox }}/superpowers/verify"
              python3 - <<'PY'
              import json
              import os

              plan = json.loads(os.environ["PLAN_JSON"])
              execution = json.loads(os.environ.get("EXECUTION_RESULT_JSON") or "{}")
              override = os.environ.get("VERIFICATION_COMMANDS", "")

              commands = [line.strip() for line in override.splitlines() if line.strip()]
              if not commands:
                  strategy = plan.get("validation_strategy") or {}
                  commands = [str(cmd).strip() for cmd in strategy.get("commands", []) if str(cmd).strip()]
              if not commands:
                  seen = set()
                  for task in plan.get("tasks", []):
                      for cmd in task.get("validation_commands", []):
                          cmd = str(cmd).strip()
                          if cmd and cmd not in seen:
                              seen.add(cmd)
                              commands.append(cmd)

              result = {
                  "plan_id": plan.get("plan_id", ""),
                  "task_ids": [task.get("id", "") for task in plan.get("tasks", []) if task.get("id")],
                  "commands_required": commands,
                  "execution_status": execution.get("status", ""),
                  "execution_task_id": execution.get("task_id", ""),
              }
              out = "{{ context.environment.op.outbox }}/superpowers/verify/verification-inputs.json"
              with open(out, "w", encoding="utf-8") as fh:
                  json.dump(result, fh, sort_keys=True)
                  fh.write("\n")
              print(json.dumps(result, sort_keys=True))
              PY

        - id: run_verification_commands
          op: command_execution
          inputs:
            timeout: 60m
            continue_on_error: true
            env:
              WT: "{{ context.environment.op.worktree_path }}"
              VERIFICATION_INPUTS_JSON: "{{ sequence.collect_verification_inputs.outputs.stdout }}"
            run: |
              set -uo pipefail

              OUT="{{ context.environment.op.outbox }}"
              mkdir -p "$OUT/superpowers/verify"
              cd "$WT"

              python3 - <<'PY' > "$OUT/superpowers/verify/commands.sh"
              import json
              import os

              data = json.loads(os.environ["VERIFICATION_INPUTS_JSON"])
              commands = data.get("commands_required", [])
              print("set -euo pipefail")
              if not commands:
                  print("echo 'No verification commands were provided.'")
                  print("exit 2")
              for command in commands:
                  print(command)
              PY

              set +e
              bash "$OUT/superpowers/verify/commands.sh" 2>&1 | tee "$OUT/superpowers/verify/output.txt"
              RC=${PIPESTATUS[0]}
              set -e
              tail -n 120 "$OUT/superpowers/verify/output.txt" > "$OUT/superpowers/verify/output-tail.txt" || true
              exit "$RC"

        - id: summarize_verification
          op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
          inputs:
            skill: c2-superpowers-verify
            input:
              plan_json: "{{ inputs.plan_json }}"
              execution_result_json: "{{ inputs.execution_result_json }}"
              verification_inputs_json: "{{ sequence.collect_verification_inputs.outputs.stdout }}"
              validation_exit_code: "${{ sequence.run_verification_commands.outputs.exit_code }}"
              validation_stdout: "{{ sequence.run_verification_commands.outputs.stdout }}"
              validation_stderr: "{{ sequence.run_verification_commands.outputs.stderr }}"
              skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
            prompt: |
              Interpret the fresh verification command evidence for this C2
              Superpowers workflow. Recipes already ran the verification
              commands. Do not rerun commands, create child jobs, create
              worktrees, or make manual commits.

              Write:
              - `superpowers/verify/evidence.md`
              - `superpowers/verify/result.json`
              - `superpowers/verify/latest-status.json`
          status_contract:
            path: superpowers/verify/latest-status.json
          output:
            from: artifact
            path: superpowers/verify/result.json
            format: json
            schema:
              type: object
              required:
                - ok
                - commands_required
                - commands_observed
                - evidence_summary
                - blocking_issues
              properties:
                ok:
                  type: boolean
                commands_required:
                  type: array
                  items:
                    type: string
                commands_observed:
                  type: array
                  items: {}
                evidence_summary:
                  type: string
                blocking_issues:
                  type: array
                  items:
                    type: string
              additionalProperties: true

        - id: verification_gate
          op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
          inputs:
            rules:
              - id: commands_required
                type: assert
                value: ${{ size(json_parse(sequence.collect_verification_inputs.outputs.stdout).commands_required) > 0 }}
                message: Verification must have at least one required command.
              - id: command_exit_zero
                type: assert
                value: ${{ sequence.run_verification_commands.outputs.exit_code == 0 }}
                message: Verification commands must exit zero.
              - id: verify_output_schema_valid
                type: assert
                value: ${{ sequence.summarize_verification.outputs.output_schema_valid }}
                message: Verify result artifact must match schema.
              - id: verify_status_contract_valid
                type: assert
                value: ${{ sequence.summarize_verification.outputs.status_contract_present && sequence.summarize_verification.outputs.status_contract_valid }}
                message: Verify status contract must be present and valid.
              - id: verify_ok
                type: assert
                value: ${{ sequence.summarize_verification.outputs.parsed_output.ok }}
                message: Verify skill must report ok=true only for proven completion.
      transitions:
        - to: finish_work
          when: outputs.verification_gate_ok
        - to: debug_needed
          when: true
      outputs:
        plan_id: "${{ json_parse(sequence.collect_verification_inputs.outputs.stdout).plan_id }}"
        commands_required: "${{ json_parse(sequence.collect_verification_inputs.outputs.stdout).commands_required }}"
        validation_exit_code: "${{ sequence.run_verification_commands.outputs.exit_code }}"
        validation_passed: "${{ sequence.run_verification_commands.outputs.exit_code == 0 }}"
        verification_result_json: "{{ sequence.summarize_verification.outputs.raw_output }}"
        verification_ok: "${{ sequence.summarize_verification.outputs.parsed_output.ok }}"
        verification_blocking_issues: "${{ sequence.summarize_verification.outputs.parsed_output.blocking_issues }}"
        verification_gate_ok: "${{ sequence.verification_gate.outputs.ok }}"
        verify_session_id: "{{ sequence.summarize_verification.outputs.sessionId }}"

    debug_needed:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/debug"
          cat > "{{ context.environment.op.outbox }}/superpowers/debug/action.json" <<'JSON'
          {"workflow_status":"needs_debug","message":"Fresh verification failed; route to superpowers-debug.yaml with the failing command evidence."}
          JSON
          cat "{{ context.environment.op.outbox }}/superpowers/debug/action.json"

    finish_work:
      inputs:
        plan_json: '${{ first_nonempty(inputs.?plan_json.orValue(""), json_parse(state_output("mark_plan_after_task", "stdout", "{\"updated_plan_json\":\"\"}")).updated_plan_json, state_output("write_plan", "raw_output", "{}")) }}'
        verification_result_json: '${{ first_nonempty(inputs.?verification_result_json.orValue(""), state_output("verify_work", "verification_result_json", "{}")) }}'
        execution_result_json: '${{ first_nonempty(inputs.?execution_result_json.orValue(""), json_parse(state_output("mark_plan_after_task", "stdout", "{\"execution_result_json\":\"{}\"}")).execution_result_json, "{}") }}'
        completion_action: "{{ inputs.completion_action }}"
        local_hash: "{{ inputs.local_hash }}"
        upstream_repo: "{{ inputs.upstream_repo }}"
        upstream_branch: "{{ inputs.upstream_branch }}"
        commit_message: "{{ inputs.commit_message }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
      sequence:
        - id: collect_finish_inputs
          op: command_execution
          inputs:
            timeout: 30s
            env:
              PLAN_JSON: "{{ inputs.plan_json }}"
              VERIFICATION_RESULT_JSON: "{{ inputs.verification_result_json }}"
              EXECUTION_RESULT_JSON: "{{ inputs.execution_result_json }}"
              COMPLETION_ACTION: "{{ inputs.completion_action }}"
              LOCAL_HASH: "{{ inputs.local_hash }}"
              UPSTREAM_REPO: "{{ inputs.upstream_repo }}"
              UPSTREAM_BRANCH: "{{ inputs.upstream_branch }}"
              COMMIT_MESSAGE: "{{ inputs.commit_message }}"
            run: |
              set -euo pipefail
              mkdir -p "{{ context.environment.op.outbox }}/superpowers/finish"
              python3 - <<'PY'
              import json
              import os

              plan = json.loads(os.environ["PLAN_JSON"])
              verification = json.loads(os.environ["VERIFICATION_RESULT_JSON"])
              execution = json.loads(os.environ.get("EXECUTION_RESULT_JSON") or "{}")
              action = os.environ.get("COMPLETION_ACTION") or "recommend"

              tasks = plan.get("tasks", [])
              complete_statuses = {"done", "complete", "completed", "skipped"}
              incomplete = [
                  task.get("id", "")
                  for task in tasks
                  if task.get("status", "pending") not in complete_statuses
              ]
              completed = [
                  task.get("id", "")
                  for task in tasks
                  if task.get("status", "pending") in complete_statuses
              ]
              blocking = list(verification.get("blocking_issues", []) or [])

              result = {
                  "plan_id": plan.get("plan_id", ""),
                  "task_count": len(tasks),
                  "completed_tasks": [task for task in completed if task],
                  "incomplete_tasks": [task for task in incomplete if task],
                  "all_tasks_complete": bool(tasks) and not incomplete,
                  "verification_present": "ok" in verification,
                  "verification_ok": bool(verification.get("ok", False)),
                  "verification_blocking_issues": blocking,
                  "verification_summary": verification.get("evidence_summary", ""),
                  "execution_status": execution.get("status", ""),
                  "completion_action": action,
                  "local_hash_present": bool(os.environ.get("LOCAL_HASH", "")),
                  "upstream_repo_present": bool(os.environ.get("UPSTREAM_REPO", "")),
                  "upstream_branch_present": bool(os.environ.get("UPSTREAM_BRANCH", "")),
                  "commit_message_present": bool(os.environ.get("COMMIT_MESSAGE", "")),
              }
              out = "{{ context.environment.op.outbox }}/superpowers/finish/finish-inputs.json"
              with open(out, "w", encoding="utf-8") as fh:
                  json.dump(result, fh, sort_keys=True)
                  fh.write("\n")
              print(json.dumps(result, sort_keys=True))
              PY

        - id: write_finish_summary
          op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
          inputs:
            skill: c2-superpowers-finish
            input:
              plan_json: "{{ inputs.plan_json }}"
              verification_result_json: "{{ inputs.verification_result_json }}"
              execution_result_json: "{{ inputs.execution_result_json }}"
              finish_inputs_json: "{{ sequence.collect_finish_inputs.outputs.stdout }}"
              requested_action: "{{ inputs.completion_action }}"
              skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
            prompt: |
              Summarize this verified C2 Superpowers workflow and recommend the
              finish decision. Recipes own verification gates, merge choices,
              and git operations. Do not rerun tests, create child jobs, create
              worktrees, merge, or make manual commits.

              Write:
              - `superpowers/finish/summary.md`
              - `superpowers/finish/result.json`
              - `superpowers/finish/latest-status.json`
          status_contract:
            path: superpowers/finish/latest-status.json
          output:
            from: artifact
            path: superpowers/finish/result.json
            format: json
            schema:
              type: object
              required:
                - decision
                - summary
                - completed_tasks
                - verification_summary
                - remaining_risks
                - merge_ready
              properties:
                decision:
                  type: string
                  enum:
                    - merge_ready
                    - hold_for_user
                    - needs_revision
                    - cancel
                summary:
                  type: string
                  minLength: 1
                completed_tasks:
                  type: array
                  items:
                    type: string
                verification_summary:
                  type: string
                remaining_risks:
                  type: array
                  items:
                    type: string
                merge_ready:
                  type: boolean
              additionalProperties: true

        - id: finish_gate
          op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
          inputs:
            rules:
              - id: finish_output_schema_valid
                type: assert
                value: ${{ sequence.write_finish_summary.outputs.output_schema_valid == true }}
                message: Finish result artifact must match schema.
              - id: finish_status_contract_valid
                type: assert
                value: ${{ sequence.write_finish_summary.outputs.status_contract_present == true && sequence.write_finish_summary.outputs.status_contract_valid == true }}
                message: Finish status contract must be present and valid.
              - id: verification_present
                type: assert
                value: ${{ json_parse(sequence.collect_finish_inputs.outputs.stdout).verification_present == true }}
                message: Finish requires verification evidence.
              - id: merge_ready_requires_verification_ok
                type: assert
                value: ${{ sequence.write_finish_summary.outputs.parsed_output.merge_ready != true || json_parse(sequence.collect_finish_inputs.outputs.stdout).verification_ok == true }}
                message: Finish cannot be merge-ready unless verification passed.
              - id: merge_ready_requires_no_blockers
                type: assert
                value: ${{ sequence.write_finish_summary.outputs.parsed_output.merge_ready != true || size(json_parse(sequence.collect_finish_inputs.outputs.stdout).verification_blocking_issues) == 0 }}
                message: Finish cannot be merge-ready while verification has blocking issues.
              - id: merge_ready_requires_completed_tasks
                type: assert
                value: ${{ sequence.write_finish_summary.outputs.parsed_output.merge_ready != true || json_parse(sequence.collect_finish_inputs.outputs.stdout).all_tasks_complete == true }}
                message: Finish cannot be merge-ready until all planned tasks are complete.
      transitions:
        - to: merge
          when: outputs.completion_action == "merge" && outputs.finish_gate_ok && outputs.merge_ready && outputs.local_hash_present && outputs.upstream_repo_present && outputs.upstream_branch_present
        - to: merge_blocked
          when: outputs.completion_action == "merge"
        - to: cancel
          when: outputs.completion_action == "cancel"
        - to: hold
          when: outputs.completion_action == "hold_for_user"
        - to: recommend
          when: true
      outputs:
        completion_action: "${{ json_parse(sequence.collect_finish_inputs.outputs.stdout).completion_action }}"
        finish_decision: "${{ sequence.write_finish_summary.outputs.parsed_output.decision }}"
        finish_summary: "${{ sequence.write_finish_summary.outputs.parsed_output.summary }}"
        completed_tasks: "${{ sequence.write_finish_summary.outputs.parsed_output.completed_tasks }}"
        remaining_risks: "${{ sequence.write_finish_summary.outputs.parsed_output.remaining_risks }}"
        merge_ready: "${{ sequence.write_finish_summary.outputs.parsed_output.merge_ready }}"
        finish_gate_ok: "${{ sequence.finish_gate.outputs.ok }}"
        finish_failed_rule_ids: "${{ sequence.finish_gate.outputs.failed_rule_ids }}"
        local_hash_present: "${{ json_parse(sequence.collect_finish_inputs.outputs.stdout).local_hash_present }}"
        upstream_repo_present: "${{ json_parse(sequence.collect_finish_inputs.outputs.stdout).upstream_repo_present }}"
        upstream_branch_present: "${{ json_parse(sequence.collect_finish_inputs.outputs.stdout).upstream_branch_present }}"
        verification_ok: "${{ json_parse(sequence.collect_finish_inputs.outputs.stdout).verification_ok }}"
        finish_session_id: "{{ sequence.write_finish_summary.outputs.sessionId }}"

    recommend:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/finish"
          printf '{"action_taken":"recommend","merged":false}\n' > "{{ context.environment.op.outbox }}/superpowers/finish/action.json"
          cat "{{ context.environment.op.outbox }}/superpowers/finish/action.json"

    hold:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/finish"
          printf '{"action_taken":"hold_for_user","merged":false}\n' > "{{ context.environment.op.outbox }}/superpowers/finish/action.json"
          cat "{{ context.environment.op.outbox }}/superpowers/finish/action.json"

    cancel:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/finish"
          printf '{"action_taken":"cancel","merged":false}\n' > "{{ context.environment.op.outbox }}/superpowers/finish/action.json"
          cat "{{ context.environment.op.outbox }}/superpowers/finish/action.json"

    merge_blocked:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/finish"
          printf '{"action_taken":"merge_blocked","merged":false}\n' > "{{ context.environment.op.outbox }}/superpowers/finish/action.json"
          cat "{{ context.environment.op.outbox }}/superpowers/finish/action.json"

    merge:
      op: squashrebasemerge
      transitions: []
      inputs:
        repo_path: "{{ context.environment.op.worktree_path }}"
        local_hash: '${{ first_nonempty(inputs.?local_hash.orValue(""), context.git.?hash.orValue(""), "0000000000000000000000000000000000000000") }}'
        upstream_repo: '${{ first_nonempty(inputs.?upstream_repo.orValue(""), context.git.?repo.orValue(""), "missing-upstream-repo") }}'
        upstream_branch: '${{ first_nonempty(inputs.?upstream_branch.orValue(""), context.git.?ref.orValue(""), "missing-upstream-branch") }}'
        rebase: true
        author: '${{ context.git.?author.orValue("") }}'
        commit_message: '${{ first_nonempty(inputs.?commit_message.orValue(""), "Complete Superpowers workflow") }}'

outputs:
  workflow_status: '${{ state_exists("finish_work") ? (state_output("finish_work", "finish_decision", "finished")) : (state_exists("debug_needed") ? "needs_debug" : (state_exists("task_needs_revision") ? "needs_revision" : (state_exists("child_boundary_required") ? "child_job_required" : (state_exists("replan_required") ? "requires_replan" : (state_exists("debug_recipe_required") ? "debug_recipe_required" : (state_exists("needs_user_input") ? "needs_user_input" : "incomplete")))))) }}'
  route: '${{ json_parse(state_output("route", "stdout", "{\"workflow_route\":\"\"}")).workflow_route }}'
  selected_task_id: "${{ json_parse(state_output('select_task', 'stdout', '{\"task_id\":\"\"}')).task_id }}"
  child_job_required: "${{ json_parse(state_output('select_task', 'stdout', '{\"requires_child_job\":false}')).requires_child_job }}"
  child_job_reason: "${{ json_parse(state_output('select_task', 'stdout', '{\"child_job_reason\":\"\"}')).child_job_reason }}"
  task_done: "${{ state_exists('mark_plan_after_task') }}"
  updated_plan_json: '${{ json_parse(state_output("mark_plan_after_task", "stdout", "{\"updated_plan_json\":\"\"}")).updated_plan_json }}'
  execution_result_json: '${{ json_parse(state_output("mark_plan_after_task", "stdout", "{\"execution_result_json\":\"{}\"}")).execution_result_json }}'
  verification_ok: "${{ state_output('verify_work', 'verification_ok', false) }}"
  verification_gate_ok: "${{ state_output('verify_work', 'verification_gate_ok', false) }}"
  finish_decision: "${{ state_output('finish_work', 'finish_decision', '') }}"
  merge_ready: "${{ state_output('finish_work', 'merge_ready', false) }}"
  finish_gate_ok: "${{ state_output('finish_work', 'finish_gate_ok', false) }}"
  action_taken: '${{ state_exists("merge") ? "merge" : (state_exists("merge_blocked") ? "merge_blocked" : (state_exists("cancel") ? "cancel" : (state_exists("hold") ? "hold_for_user" : (state_exists("recommend") ? "recommend" : "")))) }}'
  brainstorm_session_id: "${{ state_output('brainstorm_design', 'sessionId', '') }}"
  write_plan_session_id: "${{ state_output('write_plan', 'sessionId', '') }}"
  plan_review_session_id: "${{ state_output('review_plan', 'sessionId', '') }}"
  implementer_session_id: "${{ first_nonempty(state_output('run_task_boundary', 'implementer_session_id', ''), state_output('run_tdd_task_boundary', 'implementer_session_id', '')) }}"
  revision_session_id: "${{ state_output('run_task_boundary', 'revision_session_id', '') }}"
  revision_attempted: "${{ state_output('run_task_boundary', 'revision_attempted', false) }}"
  spec_reviewer_session_id: "${{ first_nonempty(state_output('run_task_boundary', 'spec_reviewer_session_id', ''), state_output('run_tdd_task_boundary', 'spec_reviewer_session_id', '')) }}"
  quality_reviewer_session_id: "${{ first_nonempty(state_output('run_task_boundary', 'quality_reviewer_session_id', ''), state_output('run_tdd_task_boundary', 'quality_reviewer_session_id', '')) }}"
  tdd_evidence_ok: "${{ state_output('run_tdd_task_boundary', 'tdd_evidence_ok', false) }}"
  tdd_red_exit_code: "${{ state_output('run_tdd_task_boundary', 'tdd_red_exit_code', -1) }}"
  tdd_green_exit_code: "${{ state_output('run_tdd_task_boundary', 'tdd_green_exit_code', -1) }}"
  tdd_refactor_exit_code: "${{ state_output('run_tdd_task_boundary', 'tdd_refactor_exit_code', -1) }}"
  verify_session_id: "${{ state_output('verify_work', 'verify_session_id', '') }}"
  finish_session_id: "${{ state_output('finish_work', 'finish_session_id', '') }}"
