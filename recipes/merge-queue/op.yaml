name: adaptive3-merge-queue
version: 2.0.0
description: Assemble and evaluate Adaptive3 merge queue candidates and receipts.
python:
  requires-python: ">=3.10"
  dependencies: []
command: [python3, -B, main.py]
input_schema:
  type: object
  required: [action, request, worktree, inbox, outbox]
  additionalProperties: false
  properties:
    action:
      type: string
      enum: [prepare, identify, intake, assemble, install, reuse_verification, capture_repair, plan_probes, record_probes, landing_results, publication_context, caller_receipt, confirm_landed]
    request: {type: object}
    worktree:
      type: string
      default: '${{ context.environment.op.worktree_path }}'
    inbox:
      type: string
      default: '${{ context.environment.op.inbox }}'
    outbox:
      type: string
      default: '${{ context.environment.op.outbox }}'
output_schema:
  type: object
  required: [result]
  additionalProperties: false
  properties:
    result: {type: object}
