id: c2-response-schemas
inputs:
  participant: ${{ inputs.?participant.orValue('consultant') }}
vars:
  agent:
    type: object
    additionalProperties: false
    required:
    - next
    - summary
    - files
    - questions
    - review_title
    - requests
    - packages
    properties:
      next:
        type: string
        enum:
        - continue
        - review
        - ask_user
        - blocked
        - fail
        - redesign
        - outside
        - coordinate
        - wait
      summary:
        type: string
        minLength: 1
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - path
          - description
          - title
          - role
          - order
          - source_paths
          properties:
            path:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
            title:
              type:
              - string
              - 'null'
            role:
              type:
              - string
              - 'null'
            order:
              type:
              - number
              - 'null'
            source_paths:
              type:
              - array
              - 'null'
              items:
                type: string
      questions:
        type:
        - array
        - 'null'
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - type
          - question
          - required
          - options
          properties:
            id:
              type: string
              minLength: 1
            type:
              type: string
              enum:
              - paragraph_text
              - short_answer
              - multiple_choice
              - checkboxes
            question:
              type: string
              minLength: 1
            required:
              type: boolean
            options:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - value
                - label
                properties:
                  value:
                    type: string
                  label:
                    type: string
      review_title:
        type:
        - string
        - 'null'
        minLength: 1
        maxLength: 120
      requests:
        type:
        - array
        - 'null'
        items:
          type: object
          additionalProperties: false
          required:
          - action
          - cell
          - request
          - ref
          - role
          - kind
          - handoff
          - replaces
          properties:
            action:
              type: string
              enum:
              - consult
              - execute
            cell:
              type:
              - string
              - 'null'
            request:
              type:
              - string
              - 'null'
            ref:
              type:
              - string
              - 'null'
            role:
              type:
              - string
              - 'null'
            kind:
              type:
              - string
              - 'null'
              enum:
              - feature
              - create
              -
            handoff:
              type:
              - string
              - 'null'
              description: Selected artifact directory ending in /. Must contain handoff.md; only its contents are
                sent to this recipient.
            replaces:
              type:
              - string
              - 'null'
              description: Native job ID of the unsuccessful execution being replaced. Omit for a new assignment.
      packages:
        type:
        - array
        - 'null'
        items:
          type: object
          additionalProperties: false
          required:
          - reference
          - check
          properties:
            reference:
              type: string
              minLength: 1
            check:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
  inspect:
    type: object
    additionalProperties: false
    required:
    - verdict
    - summary
    - next
    - subject
    - files
    properties:
      verdict:
        type: string
        enum:
        - approve
        - revise
      summary:
        type: string
        minLength: 1
      next:
        type:
        - string
        - 'null'
        enum:
        - implementation
        - validation
        - intervention
        - complete
        -
      subject:
        type: string
        maxLength: 72
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - path
          - description
          - title
          - role
          - order
          - source_paths
          properties:
            path:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
            title:
              type:
              - string
              - 'null'
            role:
              type:
              - string
              - 'null'
            order:
              type:
              - number
              - 'null'
            source_paths:
              type:
              - array
              - 'null'
              items:
                type: string
  consultation:
    type: object
    additionalProperties: false
    required:
    - outcome
    - thinking
    - files
    - requests
    - review_title
    properties:
      outcome:
        type: string
        enum: |-
          ${{ inputs.participant == 'consultant' ? ['continue','answered','agreed','declined','redirected','needs_review'] : ['continue','answered','needs_review','cancelled'] }}
      thinking:
        type: string
        minLength: 1
        description: Concise response and shareable explanation, including questions and remaining disagreements.
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - path
          - description
          - title
          - role
          - order
          - source_paths
          properties:
            path:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
            title:
              type:
              - string
              - 'null'
            role:
              type:
              - string
              - 'null'
            order:
              type:
              - number
              - 'null'
            source_paths:
              type:
              - array
              - 'null'
              items:
                type: string
      requests:
        type:
        - array
        - 'null'
        items:
          type: object
          additionalProperties: false
          required:
          - cell
          - request
          - ref
          - role
          - action
          properties:
            cell:
              type: string
              minLength: 1
            request:
              type: string
              minLength: 1
            ref:
              type:
              - string
              - 'null'
            role:
              type:
              - string
              - 'null'
            action:
              type: string
              enum:
              - consult
              - execute
      review_title:
        type:
        - string
        - 'null'
  creation:
    type: object
    additionalProperties: false
    required:
    - outcome
    - summary
    - cells
    - files
    - questions
    properties:
      outcome:
        type: string
        enum:
        - review
        - ask_user
        - declined
        - redirected
      summary:
        type: string
        minLength: 1
      cells:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - name
          - repo
          - purpose_path
          properties:
            name:
              type: string
              minLength: 1
              pattern: ^[a-zA-Z0-9][a-zA-Z0-9_-]*$
            repo:
              type: string
              minLength: 1
            purpose_path:
              type: string
              minLength: 1
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - path
          - description
          - title
          - role
          - order
          - source_paths
          properties:
            path:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
            title:
              type:
              - string
              - 'null'
            role:
              type:
              - string
              - 'null'
            order:
              type:
              - number
              - 'null'
            source_paths:
              type:
              - array
              - 'null'
              items:
                type: string
      questions:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - type
          - question
          - required
          - options
          properties:
            id:
              type: string
              minLength: 1
            type:
              type: string
              enum:
              - paragraph_text
              - short_answer
              - multiple_choice
              - checkboxes
            question:
              type: string
              minLength: 1
            required:
              type: boolean
            options:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - value
                - label
                properties:
                  value:
                    type: string
                  label:
                    type: string
sequence: []
outputs:
  agent: ${{ vars.agent }}
  inspect: ${{ vars.inspect }}
  consultation: ${{ vars.consultation }}
  creation: ${{ vars.creation }}
