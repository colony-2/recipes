name: render-review-brief
description: Render review artifacts and return structured presentation metadata.
version: 1.0.0
command:
- python3
- -c
- |
  import json, os, runpy, sys
  paths = json.load(sys.stdin)
  os.environ['INBOX'] = paths['inbox']
  os.environ['OUTBOX'] = paths['outbox']
  sys.argv = [os.path.join(paths['inbox'], 'producer.py'), 'render']
  runpy.run_path(sys.argv[0], run_name='__main__')
input_schema:
  type: object
  additionalProperties: false
  required: [inbox, outbox]
  properties:
    inbox: {type: string}
    outbox: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required: [prefix, mode, reason, presentation]
  properties:
    prefix: {type: string}
    mode: {type: string, enum: [fallback, synthesis]}
    reason: {type: string}
    presentation: {type: object}
