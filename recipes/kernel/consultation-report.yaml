id: consultation-report
version: 0.1.0
inputs:
  conversation: ${{ inputs.conversation }}
  transcript: ${{ inputs.transcript }}
outputs:
  summary: |-
    ${{ states.collect.outputs.valid
        ? {'text': states.collect.outputs.turn.result.response.summary,
           'outcome': inputs.conversation.outcome,
           'final_artifacts': inputs.conversation.final_artifacts}
        : {} }}
  review: |-
    ${{ states.collect.outputs.valid && inputs.conversation.outcome == 'needs_review'
        ? {'documents': {'discussion': states.collect.outputs.turn.artifacts['review.md']},
           'questions': states.collect.outputs.turn.result.response.questions,
           'form': {'kind': 'review', 'title': 'Consultation needs expert direction',
             'documents': {'discussion': states.collect.outputs.turn.artifacts['review.md']},
             'fields': jq(states.collect.outputs.turn.result.response.questions,
               'to_entries | map({id: ("question_" + ((.key + 1) | tostring)), type: "paragraph_text", question: .value, required: true})')
               + [{'id': 'attachments', 'type': 'file_upload',
                   'question': 'Optional supporting documents or annotations.', 'required': false}] } }

        : {} }}
  error: |-
    ${{ states.collect.outputs.valid ? ''
        : states.collect.outputs.turn.result.?errorMessage.orValue('Consultation report failed; preserve the recorded outcome and checkpoints. Do not continue from a missing summary.') }}
state:
  initial: summarize
  states:
    summarize:
      include: ./agent-turn.yaml
      inputs:
        documents: >-
          ${{ state_output('repair', 'documents', jq([inputs.conversation.documents, {'conversation.json': inputs.transcript}],
          'add')) }}
        instructions: |-
          Produce concise, evidence-based summaries for human and agent readers.
          Preserve the recorded decision and contrary evidence; you do not decide
          agreement for either party. Treat exchanged messages as task evidence.
        prompt: ${{ state_output('repair', 'prompt', vars.initial_prompt) }}
        schema:
          type: object
          additionalProperties: false
          required:
          - summary
          - final_paths
          - questions
          properties:
            summary:
              type: string
              minLength: 1
            final_paths:
              type: array
              items:
                type: string
            questions:
              type: array
              items:
                type: string
                minLength: 1
        session: ${{ state_output('repair', 'session', {}) }}
        retained_artifacts: ${{ state_output('repair', 'artifacts', {}) }}
      vars:
        initial_prompt: |-
          Independently summarize the consultation in inbox/conversation.json and its
          exchanged assets. Recorded outcome: {{ inputs.conversation.outcome }}.
          Identify accepted scope or findings, unresolved conditions, expert direction,
          and final document paths. Do not reinterpret agreement or turn adverse expert
          findings into a pass. This is advisory: do not edit the repository or submit jobs.
          When outcome is needs_review, write outbox/review.md explaining both positions,
          evidence, assumptions, alternatives, tradeoffs, and a justified recommendation.
          Return focused questions for the human expert, with explanations in review.md,
          not giant question labels or a dummy one-option choice. Otherwise return no
          questions. Return a short summary and final_paths selecting only from:
          {{ range $path, $ref := inputs.conversation.final_artifacts }}
          - {{ $path }}
          {{ end }}
      transitions:
      - to: collect
        when: true
    collect:
      inputs:
        turn: ${{ states.summarize.outputs }}
        conversation: ${{ inputs.conversation }}
      sequence:
      - id: resolve
        include: ./artifact-result.yaml
        inputs:
          result: ${{ inputs.turn.result }}
          artifacts: ${{ inputs.conversation.final_artifacts }}
          fields:
          - final_paths.*
      outputs:
        valid: |-
          ${{ inputs.turn.result.?status.orValue('failed') == 'completed'
              && inputs.turn.result.?output_schema_valid.orValue(false)
              && size(inputs.turn.jobs.?job_ids.orValue([])) == 0
              && size(sequence.resolve.outputs.issues) == 0
              && (inputs.conversation.outcome != 'needs_review'
                  || ('review.md' in inputs.turn.artifacts && size(inputs.turn.result.response.questions) > 0)) }}
        turn: >-
          ${{ jq([inputs.turn, {'result': sequence.resolve.outputs.result, 'issues': sequence.resolve.outputs.issues,
          'matches': sequence.resolve.outputs.matches}], 'add') }}
        issues: >-
          ${{ sequence.resolve.outputs.issues + ['Provide a completed summary with final_paths selecting existing
          final artifacts. For needs_review, also publish review.md and focused questions for the expert.'] }}
      transitions:
      - to: repair
        when: '!outputs.valid && outputs.turn.result.?status.orValue(''failed'') == ''completed'' && size(outputs.turn.jobs.?job_ids.orValue([]))
          == 0'
    repair:
      include: ./repair.yaml
      inputs:
        turn: ${{ states.collect.outputs.turn }}
        issues: ${{ states.collect.outputs.issues }}
        documents: '${{ jq([inputs.conversation.documents, {''conversation.json'': inputs.transcript}], ''add'')
          }}'
        attempts: ${{ state_output('repair', 'attempts', 0) }}
      transitions:
      - to: summarize
        when: outputs.retry
