# Shared fail-closed predicate, exported for use inside state catches. Evaluating
# it must never replace the native failure with a missing-field/template error.
id: rebase-policy
version: 1.0.0
inputs:
  failure: ${{ inputs.?failure.orValue({}) }}
  rebase_repairs: ${{ inputs.?rebase_repairs.orValue(0) }}
vars:
  predicate: |-
    try (.kind == "task_error" and .code == "REBASE_CONFLICT" and
      .node.op == "rebase" and .node.id == "rebase_candidate" and
      (.node.path | endswith("/rebase/sequence/rebase_candidate")) and
      (.attrs.rebase | .version == 1 and .phase == "replay" and
        .workspace_restored == true and (.cleanup_error // "") == "" and
        ([.base_hash, .candidate_hash, .target_base_hash] |
          all(.[]; type == "string" and test("^[0-9a-f]{40}([0-9a-f]{24})?$"))) and
        (.conflicts | type == "array" and length > 0 and
          all(.[]; (.path | type == "string" and length > 0) and
            (.status | IN("DD", "AU", "UD", "UA", "DU", "AA", "UU")))) and
        (.diagnostics | type == "object" and
          has("_c2j/rebase/conflict-index.z") and has("_c2j/rebase/conflict.diff") and
          has("_c2j/rebase/replayed-commit.patch") and
          all(to_entries[]; (.key | startswith("_c2j/rebase/") and (contains("..") | not)) and
            .value.kind == "stored" and (.value.stored.key | type == "object" and
              (.jobId | type == "string" and length > 0) and
              (.name | type == "string" and length > 0) and
              (.taskOrdinal | type == "number" and . >= 0 and . == floor) and
              (.sizeBytes | type == "number" and . >= -1 and . == floor)))))) catch false
sequence: []
outputs:
  predicate: ${{ vars.predicate }}
  eligible: ${{ inputs.rebase_repairs < 2 && jq(inputs.failure, vars.predicate) }}
