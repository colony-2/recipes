id: kernel-review
version: 0.1.0
inputs:
  title: ${{ inputs.title }}
  documents: ${{ inputs.documents }}
  fields: ${{ inputs.fields }}
sequence:
- id: request_human_review
  op: input
  inputs:
    form:
      kind: review
      title: ${{ inputs.title }}
      documents: >-
        ${{ jq(inputs.documents, 'with_entries(select((.key | split("/") | last) as $name | ["context.json",
        "feedback.json", "conversation.json"] | index($name) | not))') }}
      fields: >-
        ${{ jq(inputs.fields, 'map(if .type == "multiple_choice" or .type == "checkboxes"
        then . else del(.options) end)') }}
outputs:
  response: ${{ sequence.request_human_review.outputs }}
  documents: |-
    ${{ jq([sequence.request_human_review.outputs.?artifact_refs.orValue({}), {'feedback.json': {'kind': 'value', 'name': 'feedback.json', 'format': 'json', 'value': {'questions': inputs.fields, 'response': sequence.request_human_review.outputs} } }], 'add') }}
  changed: |-
    ${{ nonempty(sequence.request_human_review.outputs.fields.?feedback.orValue(''))
        || size(sequence.request_human_review.outputs.?artifact_refs.orValue({})) > 0 }}
