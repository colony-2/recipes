id: job-validate
version: 0.2.0
desc: Run validation commands (tests/lint/build) in the current cell and summarize results
input_schema:
  commands:
    type: string
    required: false
inputs:
  commands: '${{ first_nonempty(inputs.?commands, "") }}'
state:
  initial: detect_validation_command
  states:
    detect_validation_command:
      id: detect_validation_command
      op: command_execution
      transitions:
        - to: run_provided_validation
          when: 'nonempty(inputs.?commands.orValue(""))'
        - to: choose_validation_mode
          when: "true"
      inputs:
        timeout: 15m
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          wt = Path(os.environ.get("WT") or ".").resolve()
          d = wt

          cmds = []
          if (d / "package.json").exists():
            cmds.append("npm test")
          if (d / "go.mod").exists():
            cmds.append("go test ./...")
          if (d / "Cargo.toml").exists():
            cmds.append("cargo test")
          if (d / "pyproject.toml").exists() or (d / "pytest.ini").exists():
            cmds.append("python3 -m pytest -q")
          if (d / "Makefile").exists():
            cmds.append("make test")

          if not cmds:
            cmds = ["echo 'No default validation commands detected for this cell.'"]

          print(json.dumps({"suggested_commands": "\\n".join(cmds)}, ensure_ascii=False))
          PY
        env:
          WT: "{{ context.environment.op.worktree_path }}"

    choose_validation_mode:
      id: choose_validation_mode
      op: input
      transitions:
        switch: outputs.response
        cases:
          - value: use_suggested
            to: run_suggested_validation
        default:
          to: collect_validation_command
      inputs:
        form:
          title: "Validation commands"
          question: |
            Suggestions (detected):
            ${{ json_parse(states.detect_validation_command.outputs.stdout).suggested_commands }}
          type: multiple_choice
          options:
            - value: use_suggested
              label: Use suggested commands
            - value: provide_custom
              label: Provide custom commands

    collect_validation_command:
      id: collect_validation_command
      op: input
      transitions:
        - to: run_custom_validation
          when: "true"
      inputs:
        form:
          title: "Custom validation commands"
          question: |
            Enter the validation commands to run (newline-separated).

            Suggestions (detected):
            ${{ json_parse(states.detect_validation_command.outputs.stdout).suggested_commands }}
          type: paragraph_text

    run_provided_validation:
      id: run_provided_validation
      op: command_execution
      transitions: []
      inputs:
        timeout: 60m
        continue_on_error: true
        env:
          WT: "{{ context.environment.op.worktree_path }}"
        run: |
          set -uo pipefail

          OUT="{{ context.environment.op.outbox }}"
          mkdir -p "$OUT/validation"

          DIR="$WT"
          cd "$DIR"

          cat > "$OUT/validation/commands.sh" <<'EOF'
          {{ inputs.commands }}
          EOF

          set +e
          bash -euo pipefail "$OUT/validation/commands.sh" 2>&1 | tee "$OUT/validation/output.txt"
          RC=${PIPESTATUS[0]}
          set -e
          tail -n 120 "$OUT/validation/output.txt" > "$OUT/validation/output-tail.txt" || true
          exit $RC

    run_suggested_validation:
      id: run_suggested_validation
      op: command_execution
      transitions: []
      inputs:
        timeout: 60m
        continue_on_error: true
        env:
          WT: "{{ context.environment.op.worktree_path }}"
        run: |
          set -uo pipefail

          OUT="{{ context.environment.op.outbox }}"
          mkdir -p "$OUT/validation"

          DIR="$WT"
          cd "$DIR"

          cat > "$OUT/validation/commands.sh" <<EOF
          ${{ json_parse(states.detect_validation_command.outputs.stdout).suggested_commands }}
          EOF

          set +e
          bash -euo pipefail "$OUT/validation/commands.sh" 2>&1 | tee "$OUT/validation/output.txt"
          RC=${PIPESTATUS[0]}
          set -e
          tail -n 120 "$OUT/validation/output.txt" > "$OUT/validation/output-tail.txt" || true
          exit $RC

    run_custom_validation:
      id: run_custom_validation
      op: command_execution
      transitions: []
      inputs:
        timeout: 60m
        continue_on_error: true
        env:
          WT: "{{ context.environment.op.worktree_path }}"
        run: |
          set -uo pipefail

          OUT="{{ context.environment.op.outbox }}"
          mkdir -p "$OUT/validation"

          DIR="$WT"
          cd "$DIR"

          cat > "$OUT/validation/commands.sh" <<'EOF'
          {{ states.collect_validation_command.outputs.response }}
          EOF

          set +e
          bash -euo pipefail "$OUT/validation/commands.sh" 2>&1 | tee "$OUT/validation/output.txt"
          RC=${PIPESTATUS[0]}
          set -e
          tail -n 120 "$OUT/validation/output.txt" > "$OUT/validation/output-tail.txt" || true
          exit $RC

outputs:
  exit_code: "${{ state_exists('run_provided_validation') ? state_output('run_provided_validation', 'exit_code', 1) : (state_exists('run_suggested_validation') ? state_output('run_suggested_validation', 'exit_code', 1) : state_output('run_custom_validation', 'exit_code', 1)) }}"
  passed: "${{ state_exists('run_provided_validation') ? state_output('run_provided_validation', 'exit_code', 1) == 0 : (state_exists('run_suggested_validation') ? state_output('run_suggested_validation', 'exit_code', 1) == 0 : state_output('run_custom_validation', 'exit_code', 1) == 0) }}"
  suggested_commands: "${{ json_parse(state_output('detect_validation_command', 'stdout', '{\"suggested_commands\":\"\"}')).suggested_commands }}"
  output_tail_artifact: "validation/output-tail.txt"
  output_artifact: "validation/output.txt"
