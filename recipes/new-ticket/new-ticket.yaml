id: new-ticket
version: 0.8.0
desc: "Checkpoint-centric job recipe with skill-based implementation supervision"
input_schema:
  prompt:
    type: string
    required: false
  validate_commands:
    type: string
    required: false
  local_hash:
    type: string
    required: false
  upstream_repo:
    type: string
    required: false
  upstream_branch:
    type: string
    required: false
inputs:
  prompt: '${{ first_nonempty(inputs.?prompt, "") }}'
  validate_commands: '${{ first_nonempty(inputs.?validate_commands, "") }}'
  local_hash: '${{ first_nonempty(inputs.?local_hash, context.git.?hash.orValue(""), "") }}'
  upstream_repo: '${{ first_nonempty(inputs.?upstream_repo, context.git.?repo.orValue(""), "") }}'
  upstream_branch: '${{ first_nonempty(inputs.?upstream_branch, context.git.?ref.orValue(""), "") }}'
vars:
  prompt: '${{ first_nonempty(inputs.?prompt.orValue(""), "") }}'
  local_hash: '${{ first_nonempty(context.git.?hash.orValue(""), inputs.?local_hash.orValue(""), "") }}'
state:
  initial: triage_ticket
  states:
    triage_ticket:
      id: triage_ticket
      op: recipe.run_and_get_result
      transitions:
        - to: launch_reassigned_ticket
          when: '!states["triage_ticket"]["outputs"]["outputs"].cell_is_appropriate && states["triage_ticket"]["outputs"]["outputs"].recommended_cell_is_valid'
        - to: plan_ticket_requirements
          when: "true"
      inputs:
        name: new-ticket-triage
        artifacts: '${{ context.artifacts.map(k, context.artifacts[k]) }}'
        inputs:
          prompt: "${{ vars.prompt }}"

    launch_reassigned_ticket:
      id: launch_reassigned_ticket
      op: recipes.run
      transitions:
        - to: finish_ticket_reassignment
          when: "true"
      inputs:
        git_ref: '${{ has(context.git.hash) && context.git.hash != "" ? context.git.hash : context.git.ref }}'
        recipes:
          - name: new-ticket
            cell_name: '${{ state_output("triage_ticket", "outputs.recommended_cell_final", context.workflow.cell) }}'
            inputs:
              prompt: "${{ vars.prompt }}"
            artifacts: '${{ context.artifacts.map(k, context.artifacts[k]) }}'

    finish_ticket_reassignment:
      id: finish_ticket_reassignment
      op: sleep
      transitions: []
      inputs:
        duration: 1ms

    plan_ticket_requirements:
      id: plan_ticket_requirements
      op: recipe.run_and_get_result
      vars:
        user_feedback: '${{ transition.?payload.user_feedback.orValue("") }}'
      transitions:
        - to: review_implementation_plan
          when: "has(outputs.api_review_ok) && !outputs.api_review_ok"
        - to: plan_ticket_implementation
          when: "true"
      inputs:
        name: new-ticket-requirements-planning
        artifacts: >-
          ${{
            context.artifacts.map(k, context.artifacts[k]) +
            (state_exists("plan_ticket_requirements")
              ? [
                  states.plan_ticket_requirements.artifacts["requirements/plan.json"],
                  states.plan_ticket_requirements.artifacts["requirements/api-review.json"]
                ]
              : [])
          }}
        inputs:
          prompt: >-
            ${{ vars.prompt }}
          user_feedback: "${{ vars.user_feedback }}"

    plan_ticket_implementation:
      id: plan_ticket_implementation
      op: recipe.run_and_get_result
      vars:
        user_feedback: '${{ transition.?payload.user_feedback.orValue("") }}'
      transitions:
        - to: review_implementation_plan
          when: "has(outputs.compat_review_ok) && !outputs.compat_review_ok"
        - to: launch_prerequisite_jobs
          when: "has(outputs.requires_dependency_jobs) && outputs.requires_dependency_jobs"
        - to: define_ticket_outcomes
          when: "true"
      inputs:
        name: new-ticket-implementation-planning
        artifacts: >-
          ${{
            context.artifacts.map(k, context.artifacts[k]) +
            [
              states.plan_ticket_requirements.artifacts["requirements/plan.json"],
              states.plan_ticket_requirements.artifacts["requirements/index.md"]
            ]
          }}
        inputs:
          prompt: >-
            ${{ vars.prompt }}
          user_feedback: "${{ vars.user_feedback }}"

    define_ticket_outcomes:
      id: define_ticket_outcomes
      op: recipe.run_and_get_result
      vars:
        user_feedback: '${{ transition.?payload.user_feedback.orValue("") }}'
      transitions:
        - to: review_implementation_plan
          when: "true"
      inputs:
        name: new-ticket-outcome-determination
        artifacts: >-
          ${{
            context.artifacts.map(k, context.artifacts[k]) +
            [
              states.plan_ticket_requirements.artifacts["requirements/plan.json"],
              states.plan_ticket_requirements.artifacts["requirements/index.md"],
              states.plan_ticket_implementation.artifacts["implementation/plan.json"],
              states.plan_ticket_implementation.artifacts["implementation/index.md"]
            ]
          }}
        inputs:
          prompt: >-
            ${{ vars.prompt }}
          user_feedback: "${{ vars.user_feedback }}"

    launch_prerequisite_jobs:
      id: launch_prerequisite_jobs
      op: recipes.run
      transitions:
        - to: record_dependency_wait
          when: 'has(context.workflow.job_id) && context.workflow.job_id != ""'
        - to: hold_for_dependencies
          when: "true"
      inputs:
        git_ref: '${{ has(context.git.hash) && context.git.hash != "" ? context.git.hash : context.git.ref }}'
        recipes: >-
          ${{
            jq(
              json_parse(
                '{"current_cell":' +
                json_stringify(context.workflow.cell) +
                ',"job_id":' +
                json_stringify(has(context.workflow.job_id) ? context.workflow.job_id : "") +
                ',"plan":' +
                states.plan_ticket_implementation.outputs.outputs.plan_json +
                '}'
              ),
              '. as $root | ($root.current_cell // "") as $current_cell | ($root.job_id // "") as $job_id | ($root.plan.dependency_job_specs // []) | map(select((.target_cell // "") != "" and .target_cell != $current_cell) | {name:"new-ticket", cell_name:.target_cell, inputs:{prompt:("Parent job: " + $job_id + "\n\nDependency work: " + (((.id // "") | if . != "" then "[" + . + "] " else "" end) + ((.title // "") | if . != "" then . else "Dependency work" end)) + "\n\nRequirement ID: " + (.id // "(none)") + "\n\nDepends on requirement IDs:\n" + ((.depends_on_markdown // "- (none)")) + "\n\n## Scope\n" + ((.scope // "(tbd)")) + "\n\n## Acceptance criteria\n" + ((.acceptance_criteria_markdown // "- (none)")) + "\n\n## Risks\n" + ((.risks_markdown // "- (none)")) + "\n\n## Notes\n" + ((.notes // "(none)")))}, artifacts:[]})'
            )
          }}

    record_dependency_wait:
      id: record_dependency_wait
      op: sleep
      transitions:
        - to: hold_for_dependencies
          when: "true"
      inputs:
        duration: 1ms

    hold_for_dependencies:
      id: hold_for_dependencies
      op: sleep
      transitions: []
      inputs:
        duration: 1ms

    review_implementation_plan:
      id: review_implementation_plan
      op: input
      transitions:
        switch: outputs.fields.decision
        cases:
          - value: cancel_job
            to: route_ticket_cancellation
          - value: revise_current_stage
            switch:
              switch: outputs.fields.target_stage
              cases:
                - value: requirements
                  to: plan_ticket_requirements
                  payload:
                    user_feedback: "${{ outputs.fields.feedback }}"
                    reason: revise_current_stage
                - value: implementation_planning
                  to: plan_ticket_implementation
                  payload:
                    user_feedback: "${{ outputs.fields.feedback }}"
                    reason: revise_current_stage
              default:
                to: define_ticket_outcomes
                payload:
                  user_feedback: "${{ outputs.fields.feedback }}"
                  reason: revise_current_stage
          - value: back_up_requirements
            to: plan_ticket_requirements
            payload:
              user_feedback: "${{ outputs.fields.feedback }}"
              reason: back_up_requirements
          - value: back_up_implementation_planning
            to: plan_ticket_implementation
            payload:
              user_feedback: "${{ outputs.fields.feedback }}"
              reason: back_up_implementation_planning
        default:
          to: implement
      inputs:
        form:
          title: "Pre-implementation review"
          fields:
            - id: decision
              type: multiple_choice
              question: |
                Review status before implementation:

                Requirements summary:
                ${{ state_output("plan_ticket_requirements", "outputs.summary", "") }}
                Requirements API review ok:
                ${{ state_output("plan_ticket_requirements", "outputs.api_review_ok", false) }}
                Requirements blocking issues:
                ${{ state_output("plan_ticket_requirements", "outputs.api_review_blocking_issues", []) }}

                Implementation plan summary:
                ${{ state_output("plan_ticket_implementation", "outputs.summary", "") }}
                Implementation compat review ok:
                ${{ state_output("plan_ticket_implementation", "outputs.compat_review_ok", false) }}
                Implementation blocking issues:
                ${{ state_output("plan_ticket_implementation", "outputs.compat_review_blocking_issues", []) }}

                Outcome summary:
                ${{ state_output("define_ticket_outcomes", "outputs.summary", "") }}
                Outcome review ok:
                ${{ state_output("define_ticket_outcomes", "outputs.review_ok", false) }}
                Outcome blocking issues:
                ${{ state_output("define_ticket_outcomes", "outputs.review_blocking_issues", []) }}
                Test statements location:
                ${{ state_output("define_ticket_outcomes", "outputs.test_statement_repo_glob", ".c2/tests/*.md") }}

                Implementation clarification request (if any):
                ${{
                  nonempty(state_output("implement", "incompleteCategory", ""))
                    ? state_output("implement", "incompleteReason", "")
                    : ""
                }}
              required: true
              options:
                - value: continue
                  label: Continue to implementation
                - value: revise_current_stage
                  label: Revise current stage
                - value: back_up_implementation_planning
                  label: Back up to implementation planning
                - value: back_up_requirements
                  label: Back up to requirements
                - value: cancel_job
                  label: Cancel job
            - id: target_stage
              type: multiple_choice
              question: "For revise current stage, select the stage to run (optional)"
              required: false
              options:
                - value: outcome_determination
                  label: Outcome determination
                - value: implementation_planning
                  label: Implementation planning
                - value: requirements
                  label: Requirements
            - id: feedback
              type: paragraph_text
              question: "Revision/restart feedback for the selected stage (optional)"
              required: false
            - id: implementation_answers
              type: paragraph_text
              question: "If Codex requested clarification, provide numbered answers (optional)"
              required: false

    review_revised_plan:
      id: review_revised_plan
      op: input
      transitions:
        switch: outputs.fields.decision
        cases:
          - value: cancel_job
            to: route_ticket_cancellation
          - value: continue
            to: implement_resume
            when: 'nonempty(outputs.fields.implementation_answers)'
            payload:
              implementation_answers: "${{ outputs.fields.implementation_answers }}"
              guidance: "${{ outputs.fields.feedback }}"
        default:
          to: implement
          payload:
            implementation_answers: "${{ outputs.fields.implementation_answers }}"
            guidance: "${{ outputs.fields.feedback }}"
      inputs:
        form:
          title: "Implementation follow-up review"
          fields:
            - id: decision
              type: multiple_choice
              question: |
                Codex paused implementation and needs direction.

                Latest clarification/update request:
                ${{
                  first_nonempty(
                    state_output("implement_resume", "incompleteReason", ""),
                    state_output("implement", "incompleteReason", ""),
                    ""
                  )
                }}
              required: true
              options:
                - value: continue
                  label: Continue implementation
                - value: cancel_job
                  label: Cancel job
            - id: feedback
              type: paragraph_text
              question: "Optional implementation guidance"
              required: false
            - id: implementation_answers
              type: paragraph_text
              question: "If Codex requested clarification, provide numbered answers (optional)"
              required: false

    implement:
      inputs:
        session: |-
          ${{
            state_exists("implement")
              ? state_output("implement", "session", null)
              : null
          }}
        review_artifacts:
          submitted/: ${{ context.artifacts }}
          requirements/plan.json: ${{ states.plan_ticket_requirements.artifacts["requirements/plan.json"] }}
          requirements/index.md: ${{ states.plan_ticket_requirements.artifacts["requirements/index.md"] }}
          implementation/plan.json: ${{ states.plan_ticket_implementation.artifacts["implementation/plan.json"] }}
          implementation/index.md: ${{ states.plan_ticket_implementation.artifacts["implementation/index.md"] }}
          outcome/plan.json: ${{ states.define_ticket_outcomes.artifacts["outcome/plan.json"] }}
          outcome/tests-index.md: ${{ states.define_ticket_outcomes.artifacts["outcome/tests-index.md"] }}
          outcome/validation-commands.txt: ${{ states.define_ticket_outcomes.artifacts["outcome/validation-commands.txt"]
            }}
        ticket_prompt: ${{ vars.prompt }}
        had_validate: ${{ state_exists("validate_ticket_implementation") }}
        previous_reason: ${{ state_output("implement", "incompleteReason", "") }}
        answers: ${{ first_nonempty(transition.?payload.implementation_answers, state_field("review_implementation_plan",
          "implementation_answers", ""), "") }}
        guidance: ${{ first_nonempty(transition.?payload.guidance, state_field("review_revised_plan",
          "feedback", ""), "") }}
      state:
        initial:
        - to: resume_implementation_session
          when: inputs.session != null
        - to: start_implementation_session
          when: true
        states:
          start_implementation_session:
            id: start_implementation_session
            op: nix:github:colony-2/c2ops/published#skill-run
            artifacts:
              submitted/: ${{ inputs.review_artifacts["submitted/"] }}
              requirements/plan.json: ${{ inputs.review_artifacts["requirements/plan.json"] }}
              requirements/index.md: ${{ inputs.review_artifacts["requirements/index.md"] }}
              implementation/plan.json: ${{ inputs.review_artifacts["implementation/plan.json"] }}
              implementation/index.md: ${{ inputs.review_artifacts["implementation/index.md"] }}
              outcome/plan.json: ${{ inputs.review_artifacts["outcome/plan.json"] }}
              outcome/tests-index.md: ${{ inputs.review_artifacts["outcome/tests-index.md"] }}
              outcome/validation-commands.txt: ${{ inputs.review_artifacts["outcome/validation-commands.txt"] }}
            inputs:
              api:
                api_key: ${{ context.secrets.?codex_api_key.orValue(null) }}
              worktree_path: '{{ context.environment.op.worktree_path }}'
              workdir_path: '{{ context.environment.op.workdir }}'
              artifact_inbox_path: '{{ context.environment.op.inbox }}'
              artifact_outbox_path: '{{ context.environment.op.outbox }}'
              skill: c2-implementation-loop
              skills:
              - gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7
              return_on:
              - needs_user_input
              - needs_test_statement_update
              - needs_dependency_jobs
              - ready_for_validation
              - blocked
              status_contract:
                path: implementation/latest-status.json
              prompt: "Follow the `c2-implementation-loop` skill contract.\nYou are implementing a software job in the\
                \ c2 system.\n\nTicket prompt:\n${{ inputs.ticket_prompt }}\n\nSubmitted artifacts directory:\n`{{ context.environment.op.inbox\
                \ }}/submitted`\n\nDo not expect submitted file contents to be embedded in this prompt. If\nsubmitted\
                \ artifacts are present, read them from the submitted artifacts\ndirectory.\n\nRequirements plan artifact\
                \ path:\n`{{ context.environment.op.inbox }}/requirements/plan.json`\n\nRequirements index artifact\
                \ path:\n`{{ context.environment.op.inbox }}/requirements/index.md`\n\nImplementation plan artifact\
                \ path:\n`{{ context.environment.op.inbox }}/implementation/plan.json`\n\nImplementation index artifact\
                \ path:\n`{{ context.environment.op.inbox }}/implementation/index.md`\n\nOutcome plan artifact path:\n\
                `{{ context.environment.op.inbox }}/outcome/plan.json`\n\nOutcome tests index artifact path:\n`{{ context.environment.op.inbox\
                \ }}/outcome/tests-index.md`\n\nAuthoritative test statement files (repo path):\n`.c2/tests/*.md`\n\n\
                Outcome validation commands artifact path:\n`{{ context.environment.op.inbox }}/outcome/validation-commands.txt`\n\
                \nValidation feedback from the last attempt (if any):\n${{ inputs.had_validate ? 'See validation artifacts:\
                \ validation/output-tail.txt and validation/output.txt' : '' }}\n\nPrior clarification request (if any):\n\
                ${{ inputs.previous_reason }}\n\nUser clarification answers (if provided):\n${{ inputs.answers }}\n\n\
                Constraints:\n- Keep changes scoped to the current cell\u2019s code.\n- Never introduce backwards-incompatible\
                \ changes.\n- Do NOT write requirements/plan/review docs into the git repo.\n- If notes are needed,\
                \ write artifacts under `{{ context.environment.op.outbox }}/implementation/`.\n- Input artifacts are\
                \ available under `{{ context.environment.op.inbox }}`.\n- If you discover bugs in other cells, write\
                \ `implementation/dependency-job-specs.json` and add one entry per bug to `pendingDependencies`:\n \
                \ - `component`: exact target cell name.\n  - `requestedChanges`: bug summary, impact, and concrete\
                \ repro/fix guidance.\n- If you need user clarification before continuing, write `implementation/questions.json`\
                \ and set:\n  - `incompleteCategory`: `needs_user_input`\n  - `incompleteReason`: numbered list of questions\
                \ for the user.\n- Align implementation with `.c2/tests/*.md` in the cell repo.\n- Do NOT modify `.c2/tests/*.md`\
                \ during implementation.\n- If test statements appear incorrect/incomplete, write `implementation/test-statement-change-request.md`\
                \ and set:\n  - `incompleteCategory`: `needs_test_statement_update`\n  - `incompleteReason`: concrete\
                \ requested changes for the test statement writer.\n- Set `incompleteCategory` to `ready_for_validation`\
                \ only when code is ready for validation.\n- Set `incompleteCategory` to `blocked` when work cannot\
                \ proceed safely.\n- Update/add tests if appropriate.\n- Prefer small, safe changes.\n\nDeliverables:\n\
                - Make the code changes in-repo.\n- Leave the workspace in a state where validation commands are likely\
                \ to pass.\n"
          resume_implementation_session:
            id: resume_implementation_session
            op: nix:github:colony-2/c2ops/published#skill-run
            artifacts:
              submitted/: ${{ inputs.review_artifacts["submitted/"] }}
              requirements/plan.json: ${{ inputs.review_artifacts["requirements/plan.json"] }}
              requirements/index.md: ${{ inputs.review_artifacts["requirements/index.md"] }}
              implementation/plan.json: ${{ inputs.review_artifacts["implementation/plan.json"] }}
              implementation/index.md: ${{ inputs.review_artifacts["implementation/index.md"] }}
              outcome/plan.json: ${{ inputs.review_artifacts["outcome/plan.json"] }}
              outcome/tests-index.md: ${{ inputs.review_artifacts["outcome/tests-index.md"] }}
              outcome/validation-commands.txt: ${{ inputs.review_artifacts["outcome/validation-commands.txt"] }}
            inputs:
              api:
                api_key: ${{ context.secrets.?codex_api_key.orValue(null) }}
              worktree_path: '{{ context.environment.op.worktree_path }}'
              workdir_path: '{{ context.environment.op.workdir }}'
              artifact_inbox_path: '{{ context.environment.op.inbox }}'
              artifact_outbox_path: '{{ context.environment.op.outbox }}'
              skill: c2-implementation-loop
              skills:
              - gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7
              return_on:
              - needs_user_input
              - needs_test_statement_update
              - needs_dependency_jobs
              - ready_for_validation
              - blocked
              status_contract:
                path: implementation/latest-status.json
              prompt: "Follow the `c2-implementation-loop` skill contract.\nYou are implementing a software job in the\
                \ c2 system.\n\nTicket prompt:\n${{ inputs.ticket_prompt }}\n\nSubmitted artifacts directory:\n`{{ context.environment.op.inbox\
                \ }}/submitted`\n\nDo not expect submitted file contents to be embedded in this prompt. If\nsubmitted\
                \ artifacts are present, read them from the submitted artifacts\ndirectory.\n\nRequirements plan artifact\
                \ path:\n`{{ context.environment.op.inbox }}/requirements/plan.json`\n\nRequirements index artifact\
                \ path:\n`{{ context.environment.op.inbox }}/requirements/index.md`\n\nImplementation plan artifact\
                \ path:\n`{{ context.environment.op.inbox }}/implementation/plan.json`\n\nImplementation index artifact\
                \ path:\n`{{ context.environment.op.inbox }}/implementation/index.md`\n\nOutcome plan artifact path:\n\
                `{{ context.environment.op.inbox }}/outcome/plan.json`\n\nOutcome tests index artifact path:\n`{{ context.environment.op.inbox\
                \ }}/outcome/tests-index.md`\n\nAuthoritative test statement files (repo path):\n`.c2/tests/*.md`\n\n\
                Outcome validation commands artifact path:\n`{{ context.environment.op.inbox }}/outcome/validation-commands.txt`\n\
                \nValidation feedback from the last attempt (if any):\n${{ inputs.had_validate ? 'See validation artifacts:\
                \ validation/output-tail.txt and validation/output.txt' : '' }}\n\nPrior clarification request (if any):\n\
                ${{ inputs.previous_reason }}\n\nUser clarification answers (if provided):\n${{ inputs.answers }}\n\n\
                Constraints:\n- Keep changes scoped to the current cell\u2019s code.\n- Never introduce backwards-incompatible\
                \ changes.\n- Do NOT write requirements/plan/review docs into the git repo.\n- If notes are needed,\
                \ write artifacts under `{{ context.environment.op.outbox }}/implementation/`.\n- Input artifacts are\
                \ available under `{{ context.environment.op.inbox }}`.\n- If you discover bugs in other cells, write\
                \ `implementation/dependency-job-specs.json` and add one entry per bug to `pendingDependencies`:\n \
                \ - `component`: exact target cell name.\n  - `requestedChanges`: bug summary, impact, and concrete\
                \ repro/fix guidance.\n- If you need user clarification before continuing, write `implementation/questions.json`\
                \ and set:\n  - `incompleteCategory`: `needs_user_input`\n  - `incompleteReason`: numbered list of questions\
                \ for the user.\n- Align implementation with `.c2/tests/*.md` in the cell repo.\n- Do NOT modify `.c2/tests/*.md`\
                \ during implementation.\n- If test statements appear incorrect/incomplete, write `implementation/test-statement-change-request.md`\
                \ and set:\n  - `incompleteCategory`: `needs_test_statement_update`\n  - `incompleteReason`: concrete\
                \ requested changes for the test statement writer.\n- Set `incompleteCategory` to `ready_for_validation`\
                \ only when code is ready for validation.\n- Set `incompleteCategory` to `blocked` when work cannot\
                \ proceed safely.\n- Update/add tests if appropriate.\n- Prefer small, safe changes.\n\nDeliverables:\n\
                - Make the code changes in-repo.\n- Leave the workspace in a state where validation commands are likely\
                \ to pass.\n"
              session: ${{ inputs.session }}
      outputs:
        status: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?status.orValue("error") : states.start_implementation_session.outputs.?status.orValue("error")
          }}'
        session: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?session.orValue(null) : states.start_implementation_session.outputs.?session.orValue(null)
          }}'
        sessionId: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?sessionId.orValue("") : states.start_implementation_session.outputs.?sessionId.orValue("")
          }}'
        assistantSummary: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?assistantSummary.orValue("") : states.start_implementation_session.outputs.?assistantSummary.orValue("")
          }}'
        incompleteReason: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?incompleteReason.orValue("") : states.start_implementation_session.outputs.?incompleteReason.orValue("")
          }}'
        incompleteCategory: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?incompleteCategory.orValue("") : states.start_implementation_session.outputs.?incompleteCategory.orValue("")
          }}'
        pendingDependencies: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?pendingDependencies.orValue([]) :
          states.start_implementation_session.outputs.?pendingDependencies.orValue([]) }}'
      transitions:
      - to: review_revised_plan
        when: has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_user_input"
      - to: review_revised_plan
        when: has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_test_statement_update"
      - to: review_revised_plan
        when: has(outputs.incompleteCategory) && outputs.incompleteCategory == "blocked"
      - to: launch_implementation_bug_jobs
        when: has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_dependency_jobs"
      - to: launch_implementation_bug_jobs
        when: has(outputs.pendingDependencies) && size(outputs.pendingDependencies) > 0
      - to: validate_ticket_implementation
        when: 'true'

    launch_implementation_bug_jobs:
      id: launch_implementation_bug_jobs
      op: recipes.run
      transitions:
        - to: validate_ticket_implementation
          when: "true"
      inputs:
        git_ref: '${{ has(context.git.hash) && context.git.hash != "" ? context.git.hash : context.git.ref }}'
        recipes: >-
          ${{
            jq(
              json_parse(
                '{"current_cell":' +
                json_stringify(context.workflow.cell) +
                ',"pending":' +
                json_stringify(states.implement.outputs.pendingDependencies) +
                '}'
              ),
              '. as $root | ($root.current_cell // "") as $current_cell | ($root.pending // []) | map(select((.component // "") != "" and .component != $current_cell) | {name:"new-ticket", cell_name:.component, inputs:{prompt:("[BUG][" + .component + "] follow-up\n\n" + (.requestedChanges // "Bug details were not provided."))}, artifacts:[]})'
            )
          }}

    implement_resume:
      inputs:
        session: |-
          ${{
            state_exists("implement_resume")
              ? state_output("implement_resume", "session", null)
              : (state_exists("implement") ? state_output("implement", "session", null) : null)
          }}
        review_artifacts:
          submitted/: ${{ context.artifacts }}
          requirements/plan.json: ${{ states.plan_ticket_requirements.artifacts["requirements/plan.json"] }}
          requirements/index.md: ${{ states.plan_ticket_requirements.artifacts["requirements/index.md"] }}
          implementation/plan.json: ${{ states.plan_ticket_implementation.artifacts["implementation/plan.json"] }}
          implementation/index.md: ${{ states.plan_ticket_implementation.artifacts["implementation/index.md"] }}
          outcome/plan.json: ${{ states.define_ticket_outcomes.artifacts["outcome/plan.json"] }}
          outcome/tests-index.md: ${{ states.define_ticket_outcomes.artifacts["outcome/tests-index.md"] }}
          outcome/validation-commands.txt: ${{ states.define_ticket_outcomes.artifacts["outcome/validation-commands.txt"]
            }}
        ticket_prompt: ${{ vars.prompt }}
        had_validate: ${{ state_exists("validate_ticket_implementation") }}
        previous_reason: ${{ state_output("implement", "incompleteReason", "") }}
        answers: ${{ first_nonempty(transition.?payload.implementation_answers, state_field("review_revised_plan",
          "implementation_answers", ""), "") }}
        guidance: ${{ first_nonempty(transition.?payload.guidance, state_field("review_revised_plan",
          "feedback", ""), "") }}
      state:
        initial:
        - to: resume_implementation_session
          when: inputs.session != null
        - to: start_implementation_session
          when: true
        states:
          start_implementation_session:
            id: start_implementation_session
            op: nix:github:colony-2/c2ops/published#skill-run
            artifacts:
              submitted/: ${{ inputs.review_artifacts["submitted/"] }}
              requirements/plan.json: ${{ inputs.review_artifacts["requirements/plan.json"] }}
              requirements/index.md: ${{ inputs.review_artifacts["requirements/index.md"] }}
              implementation/plan.json: ${{ inputs.review_artifacts["implementation/plan.json"] }}
              implementation/index.md: ${{ inputs.review_artifacts["implementation/index.md"] }}
              outcome/plan.json: ${{ inputs.review_artifacts["outcome/plan.json"] }}
              outcome/tests-index.md: ${{ inputs.review_artifacts["outcome/tests-index.md"] }}
              outcome/validation-commands.txt: ${{ inputs.review_artifacts["outcome/validation-commands.txt"] }}
            inputs:
              api:
                api_key: ${{ context.secrets.?codex_api_key.orValue(null) }}
              worktree_path: '{{ context.environment.op.worktree_path }}'
              workdir_path: '{{ context.environment.op.workdir }}'
              artifact_inbox_path: '{{ context.environment.op.inbox }}'
              artifact_outbox_path: '{{ context.environment.op.outbox }}'
              skill: c2-implementation-loop
              skills:
              - gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7
              return_on:
              - needs_user_input
              - needs_test_statement_update
              - needs_dependency_jobs
              - ready_for_validation
              - blocked
              status_contract:
                path: implementation/latest-status.json
              prompt: |
                Continue implementation using the same c2 skill contract and previous session context.

                Ticket prompt:
                ${{ inputs.ticket_prompt }}

                Submitted artifacts directory:
                `{{ context.environment.op.inbox }}/submitted`

                Do not expect submitted file contents to be embedded in this prompt. If
                submitted artifacts are present, read them from the submitted artifacts
                directory.

                User clarification answers:
                ${{ inputs.answers }}

                Guidance:
                ${{ inputs.guidance }}
          resume_implementation_session:
            id: resume_implementation_session
            op: nix:github:colony-2/c2ops/published#skill-run
            artifacts:
              submitted/: ${{ inputs.review_artifacts["submitted/"] }}
              requirements/plan.json: ${{ inputs.review_artifacts["requirements/plan.json"] }}
              requirements/index.md: ${{ inputs.review_artifacts["requirements/index.md"] }}
              implementation/plan.json: ${{ inputs.review_artifacts["implementation/plan.json"] }}
              implementation/index.md: ${{ inputs.review_artifacts["implementation/index.md"] }}
              outcome/plan.json: ${{ inputs.review_artifacts["outcome/plan.json"] }}
              outcome/tests-index.md: ${{ inputs.review_artifacts["outcome/tests-index.md"] }}
              outcome/validation-commands.txt: ${{ inputs.review_artifacts["outcome/validation-commands.txt"] }}
            inputs:
              api:
                api_key: ${{ context.secrets.?codex_api_key.orValue(null) }}
              worktree_path: '{{ context.environment.op.worktree_path }}'
              workdir_path: '{{ context.environment.op.workdir }}'
              artifact_inbox_path: '{{ context.environment.op.inbox }}'
              artifact_outbox_path: '{{ context.environment.op.outbox }}'
              skill: c2-implementation-loop
              skills:
              - gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7
              return_on:
              - needs_user_input
              - needs_test_statement_update
              - needs_dependency_jobs
              - ready_for_validation
              - blocked
              status_contract:
                path: implementation/latest-status.json
              prompt: |
                Continue implementation using the same c2 skill contract and previous session context.

                Ticket prompt:
                ${{ inputs.ticket_prompt }}

                Submitted artifacts directory:
                `{{ context.environment.op.inbox }}/submitted`

                Do not expect submitted file contents to be embedded in this prompt. If
                submitted artifacts are present, read them from the submitted artifacts
                directory.

                User clarification answers:
                ${{ inputs.answers }}

                Guidance:
                ${{ inputs.guidance }}
              session: ${{ inputs.session }}
      outputs:
        status: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?status.orValue("error") : states.start_implementation_session.outputs.?status.orValue("error")
          }}'
        session: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?session.orValue(null) : states.start_implementation_session.outputs.?session.orValue(null)
          }}'
        sessionId: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?sessionId.orValue("") : states.start_implementation_session.outputs.?sessionId.orValue("")
          }}'
        assistantSummary: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?assistantSummary.orValue("") : states.start_implementation_session.outputs.?assistantSummary.orValue("")
          }}'
        incompleteReason: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?incompleteReason.orValue("") : states.start_implementation_session.outputs.?incompleteReason.orValue("")
          }}'
        incompleteCategory: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?incompleteCategory.orValue("") : states.start_implementation_session.outputs.?incompleteCategory.orValue("")
          }}'
        pendingDependencies: '${{ state_exists("resume_implementation_session") ? states.resume_implementation_session.outputs.?pendingDependencies.orValue([]) :
          states.start_implementation_session.outputs.?pendingDependencies.orValue([]) }}'
      transitions:
      - to: review_revised_plan
        when: has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_user_input"
      - to: review_revised_plan
        when: has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_test_statement_update"
      - to: review_revised_plan
        when: has(outputs.incompleteCategory) && outputs.incompleteCategory == "blocked"
      - to: launch_followup_bug_jobs
        when: has(outputs.incompleteCategory) && outputs.incompleteCategory == "needs_dependency_jobs"
      - to: launch_followup_bug_jobs
        when: has(outputs.pendingDependencies) && size(outputs.pendingDependencies) > 0
      - to: validate_ticket_implementation
        when: 'true'

    launch_followup_bug_jobs:
      id: launch_followup_bug_jobs
      op: recipes.run
      transitions:
        - to: validate_ticket_implementation
          when: "true"
      inputs:
        git_ref: '${{ has(context.git.hash) && context.git.hash != "" ? context.git.hash : context.git.ref }}'
        recipes: >-
          ${{
            jq(
              json_parse(
                '{"current_cell":' +
                json_stringify(context.workflow.cell) +
                ',"pending":' +
                json_stringify(states.implement_resume.outputs.pendingDependencies) +
                '}'
              ),
              '. as $root | ($root.current_cell // "") as $current_cell | ($root.pending // []) | map(select((.component // "") != "" and .component != $current_cell) | {name:"new-ticket", cell_name:.component, inputs:{prompt:("[BUG][" + .component + "] follow-up\n\n" + (.requestedChanges // "Bug details were not provided."))}, artifacts:[]})'
            )
          }}

    validate_ticket_implementation:
      id: validate_ticket_implementation
      op: recipe.run_and_get_result
      transitions:
        - to: review_ticket_outcome
          when: "true"
      inputs:
        name: job-validate
        inputs:
          commands: >-
            ${{
              first_nonempty(
                inputs.?validate_commands.orValue(""),
                state_output("define_ticket_outcomes", "outputs.validation_commands", ""),
                ""
              )
            }}

    review_ticket_outcome:
      id: review_ticket_outcome
      op: input
      transitions:
        switch: outputs.fields.decision
        cases:
          - value: cancel_job
            to: route_ticket_cancellation
          - value: back_up_requirements
            to: plan_ticket_requirements
            payload:
              user_feedback: "${{ outputs.fields.feedback }}"
              reason: back_up_requirements
          - value: back_up_implementation_planning
            to: plan_ticket_implementation
            payload:
              user_feedback: "${{ outputs.fields.feedback }}"
              reason: back_up_implementation_planning
          - value: back_up_outcome
            to: define_ticket_outcomes
            payload:
              user_feedback: "${{ outputs.fields.feedback }}"
              reason: back_up_outcome
          - value: revise_current_stage
            to: implement_resume
            payload:
              guidance: "${{ outputs.fields.feedback }}"
              reason: revise_current_stage
          - value: merge
            to: publish_ticket_changes
            when: 'nonempty(first_nonempty(context.git.?hash.orValue(""), inputs.?local_hash.orValue(""), ""))'
            payload:
              upstream_repo: "${{ outputs.fields.upstream_repo }}"
              upstream_branch: "${{ outputs.fields.upstream_branch }}"
              commit_message: "${{ outputs.fields.commit_message }}"
        default:
          to: implement_resume
          payload:
            guidance: "${{ outputs.fields.feedback }}"
            reason: "${{ outputs.fields.decision }}"
      inputs:
        form:
          title: "Ready-to-merge review"
          fields:
            - id: decision
              type: multiple_choice
              question: |
                Validation passed: ${{ state_output("validate_ticket_implementation", "outputs.passed", false) }}

                Validation artifacts:
                - `validation/output-tail.txt`
                - `validation/output.txt`

                Test statements:
                - `.c2/tests/*.md`

                Current local hash: `${{ first_nonempty(context.git.?hash.orValue(""), inputs.?local_hash.orValue(""), "") }}`

                Decide whether to merge, revise current implementation, or back up to an earlier stage.
              required: true
              options:
                - value: merge
                  label: Merge
                - value: revise_current_stage
                  label: Revise current stage
                - value: back_up_outcome
                  label: Back up to outcome determination
                - value: back_up_implementation_planning
                  label: Back up to implementation planning
                - value: back_up_requirements
                  label: Back up to requirements
                - value: cancel_job
                  label: Cancel job
            - id: feedback
              type: paragraph_text
              question: "Revision/backtrack feedback for selected stage (optional)"
              required: false
            - id: upstream_repo
              type: short_answer
              question: "Upstream repo override (optional; default uses configured git context)"
              required: false
            - id: upstream_branch
              type: short_answer
              question: "Upstream branch override (optional; default uses configured git context)"
              required: false
            - id: commit_message
              type: paragraph_text
              question: "Squash commit message override (optional)"
              required: false

    publish_ticket_changes:
      id: publish_ticket_changes
      op: squashrebasemerge
      vars:
        upstream_repo: '${{ first_nonempty(transition.?payload.upstream_repo, inputs.?upstream_repo.orValue(""), "") }}'
        upstream_branch: '${{ first_nonempty(transition.?payload.upstream_branch, inputs.?upstream_branch.orValue(""), "") }}'
        commit_message: '${{ first_nonempty(transition.?payload.commit_message, "Update") }}'
      transitions:
        - to: route_ticket_completion
          when: "true"
      inputs:
        repo_path: "{{ context.environment.op.worktree_path }}"
        local_hash: "${{ vars.local_hash }}"
        upstream_repo: "${{ vars.upstream_repo }}"
        upstream_branch: "${{ vars.upstream_branch }}"
        rebase: true
        author: '${{ context.git.?author.orValue("") }}'
        commit_message: "${{ vars.commit_message }}"

    route_ticket_cancellation:
      id: route_ticket_cancellation
      op: sleep
      transitions:
        - to: record_ticket_cancellation
          when: "true"
      inputs:
        duration: 1ms

    record_ticket_cancellation:
      id: record_ticket_cancellation
      op: sleep
      transitions:
        - to: complete_ticket_cancellation
          when: "true"
      inputs:
        duration: 1ms

    complete_ticket_cancellation:
      id: complete_ticket_cancellation
      op: sleep
      transitions: []
      inputs:
        duration: 1ms

    route_ticket_completion:
      id: route_ticket_completion
      op: sleep
      transitions:
        - to: record_ticket_completion
          when: "true"
      inputs:
        duration: 1ms

    record_ticket_completion:
      id: record_ticket_completion
      op: sleep
      transitions:
        - to: finish_completed_ticket
          when: "true"
      inputs:
        duration: 1ms

    finish_completed_ticket:
      id: finish_completed_ticket
      op: sleep
      transitions: []
      inputs:
        duration: 1ms

outputs:
  cell_is_appropriate: "${{ state_output('triage_ticket', 'outputs.cell_is_appropriate', false) }}"
  recommended_cell: "${{ state_output('triage_ticket', 'outputs.recommended_cell', '') }}"
  recommended_cell_is_valid: "${{ state_output('triage_ticket', 'outputs.recommended_cell_is_valid', false) }}"
  recommended_cell_final: "${{ state_output('triage_ticket', 'outputs.recommended_cell_final', '') }}"
  rationale: "${{ state_output('triage_ticket', 'outputs.rationale', '') }}"
  reassign_performed: "${{ state_exists('triage_ticket') ? (!state_output('triage_ticket', 'outputs.cell_is_appropriate', false) && state_output('triage_ticket', 'outputs.recommended_cell_is_valid', false)) : false }}"
  reassigned_job_id: "${{ size(state_output('launch_reassigned_ticket', 'job_ids', [])) > 0 ? state_output('launch_reassigned_ticket', 'job_ids', [])[0] : \"\" }}"
  requirements_plan_json: "${{ state_output('plan_ticket_requirements', 'outputs.plan_json', '') }}"
  requirements_dependency_order: "${{ state_output('plan_ticket_requirements', 'outputs.dependency_order', []) }}"
  requirements: "${{ state_output('plan_ticket_requirements', 'outputs.requirements', []) }}"
  requirements_approved: "${{ state_exists('plan_ticket_implementation') || state_exists('define_ticket_outcomes') || state_exists('implement') || state_exists('validate_ticket_implementation') || state_exists('review_ticket_outcome') || state_exists('publish_ticket_changes') }}"
  requirements_user_feedback: "${{ (state_field('review_implementation_plan', 'decision', '') == \"back_up_requirements\" || (state_field('review_implementation_plan', 'decision', '') == \"revise_current_stage\" && state_field('review_implementation_plan', 'target_stage', '') == \"requirements\")) ? state_field('review_implementation_plan', 'feedback', '') : (state_field('review_ticket_outcome', 'decision', '') == \"back_up_requirements\" ? state_field('review_ticket_outcome', 'feedback', '') : \"\") }}"
  cross_cell_required: "${{ state_output('plan_ticket_requirements', 'outputs.requirements', []).exists(r, has(r.target_cell) && r.target_cell != \"\" && r.target_cell != context.workflow.cell) }}"
  implementation_plan_json: "${{ state_output('plan_ticket_implementation', 'outputs.plan_json', '') }}"
  implementation_dependency_order: "${{ state_output('plan_ticket_implementation', 'outputs.dependency_order', []) }}"
  implementation_requires_dependency_jobs: "${{ state_output('plan_ticket_implementation', 'outputs.requires_dependency_jobs', false) }}"
  implementation_dependency_job_specs: "${{ state_output('plan_ticket_implementation', 'outputs.dependency_job_specs', []) }}"
  outcome_plan_json: "${{ state_output('define_ticket_outcomes', 'outputs.plan_json', '') }}"
  outcome_current_test_statements_summary: "${{ state_output('define_ticket_outcomes', 'outputs.current_test_statements_summary', '') }}"
  outcome_test_statement_updates_required: "${{ state_output('define_ticket_outcomes', 'outputs.test_statement_updates_required', false) }}"
  outcome_test_statement_repo_glob: "${{ state_output('define_ticket_outcomes', 'outputs.test_statement_repo_glob', \".c2/tests/*.md\") }}"
  outcome_validation_commands: "${{ state_output('define_ticket_outcomes', 'outputs.validation_commands', '') }}"
  outcome_review_ok: "${{ state_output('define_ticket_outcomes', 'outputs.review_ok', false) }}"
  outcome_approved: "${{ state_field('review_implementation_plan', 'decision', '') == \"continue\" }}"
  implementation_requested_test_statement_update: "${{ state_output('implement', 'incompleteCategory', '') == \"needs_test_statement_update\" || state_output('implement_resume', 'incompleteCategory', '') == \"needs_test_statement_update\" }}"
  implementation_bug_job_ids_initial: "${{ state_output('launch_implementation_bug_jobs', 'job_ids', []) }}"
  implementation_bug_job_ids_resume: "${{ state_output('launch_followup_bug_jobs', 'job_ids', []) }}"
  implementation_user_questions_requested: "${{ state_output('implement', 'incompleteCategory', '') == \"needs_user_input\" || state_output('implement_resume', 'incompleteCategory', '') == \"needs_user_input\" }}"
  dependency_waiting: "${{ state_exists('hold_for_dependencies') }}"
  validation_selected_commands: "${{ first_nonempty(inputs.?validate_commands.orValue(''), state_output('define_ticket_outcomes', 'outputs.validation_commands', ''), '') }}"
  validation_passed: "${{ state_output('validate_ticket_implementation', 'outputs.passed', false) }}"
  merged: "${{ nonempty(state_output('publish_ticket_changes', 'merged_hash', '')) }}"
  merged_hash: "${{ state_output('publish_ticket_changes', 'merged_hash', '') }}"
  canceled: "${{ state_exists('complete_ticket_cancellation') }}"
  job_done: "${{ state_exists('finish_completed_ticket') }}"
