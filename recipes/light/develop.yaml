id: light-develop
version: 1.0.0
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  session: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.?create_recipe.orValue('git+https://github.com/colony-2/recipes.git//create.yaml@main') }}
  hook_settings: ${{ inputs.?hook_settings.orValue({}) }}
  settings_artifact: ${{ inputs.?settings_artifact.orValue(null) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
state:
  initial: discover_root_cell
  states:
    discover_root_cell:
      id: discover_root_cell
      op: command_execution
      const: true
      inputs:
        run: |
          if [ -f .c2/config.yaml ] && command -v c2j >/dev/null 2>&1; then
            c2j self --json
          else
            printf '{}'
          fi
      transitions:
      - to: start
        when: true
    start:
      inputs:
        request: ${{ inputs.prompt }}
        directory: ${{ inputs.target_directory }}
        session: ${{ inputs.session }}
        documents: ${{ jq([json_parse(json_stringify(context.artifacts)), inputs.documents], 'add |
          with_entries(select(.key != "__git_state_thin_pack__" and .key != "diff_from_parent.diff" and .key
          != "diff_from_base.diff"))') }}
        root_cell: '${{ inputs.root_cell != '''' ? inputs.root_cell : json_parse(states.discover_root_cell.outputs.stdout).?root_repo.orValue('''')
          }}'
        root_ref: '${{ inputs.root_ref != '''' ? inputs.root_ref : json_parse(states.discover_root_cell.outputs.stdout).?root_ref.orValue(''main'')
          }}'
        build_recipe: ${{ inputs.build_recipe }}
        create_recipe: ${{ inputs.create_recipe }}
        hook_settings: ${{ inputs.hook_settings }}
        settings_artifact: ${{ inputs.settings_artifact }}
        require_verification: ${{ inputs.require_verification }}
      sequence: []
      outputs:
        valid: ${{ nonempty(inputs.directory) && !inputs.directory.startsWith('/') &&
          !inputs.directory.matches('(^|/)[.][.](/|$)') }}
        flow: '${{ jq([{''message'': inputs.request, ''request'': inputs.request, ''target_directory'': inputs.directory,
          ''session'': inputs.session, ''documents'': inputs.documents, ''threads'': {}, ''jobs'': {}, ''merge_chases'':
          0, ''reviews'': {}, ''root_cell'': inputs.root_cell, ''root_ref'': inputs.root_ref, ''build_recipe'':
          inputs.build_recipe, ''create_recipe'': inputs.create_recipe}, {''hook_settings'': inputs.hook_settings, ''settings_artifact'': inputs.settings_artifact,
          ''require_verification'': inputs.require_verification}], ''add'') }}'
      transitions:
      - to: reject_invalid_build_request
        when: '!outputs.valid'
        payload:
          reason: Target directory must be a nonempty repository-relative path without parent traversal.
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    work:
      inputs:
        flow: ${{ jq(transition.payload.flow, 'del(.review_hint, .reuse_merge_approval, .chase_pending)') }}
      sequence:
      - id: agent
        include: ./agent.yaml
        inputs:
          flow: ${{ inputs.flow }}
          documents: "${{ jq([inputs.flow.documents, {'context.json': {'kind': 'value', 'name': 'context.json',
            'format': 'json', 'value': jq(inputs.flow, 'del(.session, .documents, .result)')} }], 'add') }}"
      outputs:
        flow: ${{ inputs.flow }}
        turn: ${{ sequence.agent.outputs.turn }}
      transitions:
      - to: record
        when: true
    record:
      inputs:
        previous: ${{ states.work.outputs.flow }}
        turn: ${{ states.work.outputs.turn }}
      sequence: []
      outputs:
        valid: ${{ size(vars.issues) == 0 }}
        flow: |-
          ${{ inputs.turn.result.?output_schema_valid.orValue(false) ? (jq([inputs.previous, {
           'repair_attempts': 0, 'repair_artifacts': {}, 'session': inputs.turn.result.?session.orValue(inputs.previous.session),

           'result': inputs.turn.result.?response.orValue({}),
           'documents': jq([inputs.previous.?repair_base_documents.orValue(inputs.previous.documents),
             jq({'files': inputs.turn.result.?response.orValue({}).?files.orValue([]), 'artifacts': inputs.turn.artifacts},
                '. as $v | $v.files | map(select(.path as $p | $v.artifacts | has($p)) | {key: .path, value: $v.artifacts[.path]}) | from_entries')], 'add')}], 'add | del(.repair_base_documents)')) : inputs.previous }}
        issues: ${{ vars.issues }}
        turn: ${{ inputs.turn }}
        previous: ${{ inputs.previous }}
      transitions:
      - to: reject_invalid_build_request
        when: '!outputs.valid && (outputs.turn.result.?status.orValue(''failed'') != ''completed'' || size(outputs.turn.jobs.?job_ids.orValue([]))
          > 0)'
        payload:
          reason: ${{ jq(outputs.issues, 'join("; ")') }}
      - to: repair
        when: '!outputs.valid'
        payload:
          flow: ${{ outputs.previous }}
          turn: ${{ outputs.turn }}
          issues: ${{ outputs.issues }}
      - to: questions
        when: outputs.flow.result.next == 'ask_user'
        payload:
          flow: ${{ outputs.flow }}
      - to: coordinate
        when: outputs.flow.result.next in ['consult', 'blocked']
        payload:
          flow: ${{ outputs.flow }}
          action: ${{ outputs.flow.result.next }}
          requests: ${{ outputs.flow.result.consultations }}
          keys: ${{ outputs.flow.result.keys }}
      - to: work
        when: outputs.flow.result.next == 'continue'
        payload:
          flow: '${{ jq([outputs.flow, {''message'': ''Continue the bounded request.''}], ''add'') }}'
      - to: finish
        when: true
        payload:
          flow: ${{ outputs.flow }}
      vars:
        issues: |-
          ${{ (states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'ask_user' ? [] : states.work.outputs.turn.?issues.orValue([]))
           + (states.work.outputs.turn.result.?status.orValue('failed') != 'completed' ? ['Agent did not complete: ' + states.work.outputs.turn.result.?errorMessage.orValue('No completed response.')] : [])
           + (!states.work.outputs.turn.result.?output_schema_valid.orValue(false) ? ['The operation did not produce a schema-valid response. Correct the response using the supplied schema.'] : [])
           + (states.work.outputs.turn.result.?session.orValue(null) == null ? ['The response has no resumable session checkpoint.'] : [])
           + (size(states.work.outputs.turn.jobs.?job_ids.orValue([])) > 0 ? ['The agent submitted jobs directly; stop and review these effects before continuing.'] : [])
           + (states.work.outputs.turn.result.?status.orValue('failed') == 'completed' && states.work.outputs.turn.result.?output_schema_valid.orValue(false) ?
              (states.work.outputs.turn.result.response.next != 'ask_user' && states.work.outputs.turn.result.response.files.exists(f, f.path.startsWith('/') || f.path.contains('..') || f.path.contains('\\') || f.path in ['context.json', 'feedback.json', '__git_state_thin_pack__']) ? ['Select only safe deliverable artifact names, excluding workflow control files.'] : [])
            + (states.work.outputs.turn.result.response.next != 'ask_user' && size(states.work.outputs.turn.result.response.files.map(f, f.path)) != size(jq(states.work.outputs.turn.result.response.files, 'map(.path) | unique')) ? ['List each resolved artifact only once.'] : [])
            + (states.work.outputs.turn.result.response.next == 'ask_user' && (size(states.work.outputs.turn.result.response.questions) == 0 || states.work.outputs.turn.result.response.questions.exists(q, q.id == 'annotations')) ? ['ask_user requires focused questions; annotations is a reserved question id.'] : [])
            + (states.work.outputs.turn.result.response.next == 'consult' && size(states.work.outputs.turn.result.response.consultations) == 0 ? ['consult requires at least one consultation request.'] : [])
            + (states.work.outputs.turn.result.response.next == 'review' && (!states.work.outputs.turn.result.response.subject.matches('^[^[:cntrl:]]{1,72}$') || !states.work.outputs.turn.result.response.subject.matches('.*[^[:space:]].*') || !states.work.outputs.turn.result.response.review_message.matches('(?s).*[^[:space:]].*')) ? ['Review requires a single-line subject of at most 72 characters and a substantive review message.'] : [])
           : []) }}
    coordinate:
      inputs:
        flow: ${{ transition.payload.flow }}
        action: ${{ transition.payload.action }}
        requests: ${{ transition.payload.requests }}
        keys: ${{ transition.payload.keys }}
      sequence:
      - id: coordinate
        include: ./coordinate.yaml
        inputs:
          flow: ${{ inputs.flow }}
          action: ${{ inputs.action }}
          requests: ${{ inputs.requests }}
          keys: ${{ inputs.keys }}
      outputs:
        valid: ${{ sequence.coordinate.outputs.valid }}
        flow: '${{ jq([sequence.coordinate.outputs.flow, {''message'': ''Coordination state changed. Read context.json
          and new evidence; continue independent work before waiting.''}], ''add'') }}'
      transitions:
      - to: repair
        when: '!outputs.valid'
        payload:
          flow: '${{ jq([outputs.flow, {''repair_attempts'': states.work.outputs.flow.?repair_attempts.orValue(0),
            ''repair_base_documents'': states.work.outputs.flow.?repair_base_documents.orValue(states.work.outputs.flow.documents)}],
            ''add'') }}'
          turn: '${{ jq([states.work.outputs.turn, {''result'': jq([states.work.outputs.turn.result, {''session'':
            outputs.flow.session}], ''add'')}], ''add'') }}'
          issues: ${{ ['Coordination rejected the requested keys or action. Use known keys and distinct
            requests to existing serving cells. Never resubmit recorded jobs.'] }}
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    questions:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: review
        include: ../kernel/review.yaml
        inputs:
          title: Clarify the current build
          documents: ${{ jq(inputs.flow.documents, 'del(."build-settings.json", ."configuration.md",
            ."design-context.md")') }}
          fields: '${{ inputs.flow.result.questions + [{''id'': ''annotations'', ''type'': ''file_upload'', ''question'':
            ''Optional supporting documents or annotations.'', ''required'': false}] }}'
      outputs:
        flow: '${{ jq([inputs.flow, {''documents'': jq([inputs.flow.documents, sequence.review.outputs.documents],
          ''add''), ''message'': ''Read feedback.json and the attachments, then continue the bounded request.''}],
          ''add'') }}'
      transitions:
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    rebase:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: resolve_upstream_head
        op: command_execution
        const: true
        inputs:
          env:
            REPO: ${{ context.git.repo }}
            BRANCH: ${{ context.git.ref }}
          run: |
            set -eu
            git ls-remote --exit-code -- "$REPO" "refs/heads/${BRANCH#refs/heads/}"
      - id: rebase_candidate
        op: rebase
        inputs:
          target_base_hash: ${{ jq(sequence.resolve_upstream_head.outputs.stdout, 'split("\t")[0]') }}
      outputs:
        flow: ${{ inputs.flow }}
      transitions:
      - to: prepare
        when: 'true'
        payload:
          flow: ${{ outputs.flow }}
    inspect_chased_candidate:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: candidate
        include: ../kernel/git-candidate.yaml
      outputs:
        reusable: >-
          ${{ (size(sequence.candidate.outputs.candidate.files) == 0 || sequence.candidate.outputs.candidate.change_digest
          == inputs.flow.reviewed_change_digest) && inputs.flow.hook_digest == inputs.flow.?reviewed_hook_digest.orValue('')
          }}
        flow: >-
          ${{ jq([inputs.flow, {'chase_pending': false,
          'candidate_changed': size(sequence.candidate.outputs.candidate.files) > 0,
          'documents': jq([inputs.flow.documents, sequence.candidate.outputs.documents], 'add')}], 'add') }}
      transitions:
      - to: specialists
        when: outputs.reusable
        payload:
          flow: >-
            ${{ jq([outputs.flow, {'reuse_merge_approval': true}], 'add') }}
      - to: specialists
        when: true
        payload:
          flow: >-
            ${{ jq(outputs.flow,
            'del(.reviews.outcome, .assessment, .commit_message, .reviewed_change_digest, .reuse_merge_approval)')
            }}
    verify:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: verify
        include: ../develop/verify.yaml
        inputs:
          request: ${{ inputs.flow.request }}
          target_directory: ${{ inputs.flow.target_directory }}
          documents: ${{ inputs.flow.documents }}
          settings: ${{ inputs.flow.settings_artifact }}
          round: ${{ inputs.flow.validation_round }}
          require_verification: ${{ inputs.flow.require_verification }}
      outputs:
        ok: ${{ sequence.verify.outputs.allowed }}
        flow: '${{ jq([inputs.flow, {''verification'': sequence.verify.outputs.evidence, ''documents'': jq([inputs.flow.documents,
          sequence.verify.outputs.artifact_refs], ''add''), ''message'': ''Verification did not pass. Read verification.md
          and its attached evidence, resolve the issue, and request inspection again.''}], ''add'') }}'
      transitions:
      - to: reject_invalid_build_request
        when: outputs.flow.require_verification && outputs.flow.verification.status == 'skipped'
        payload:
          reason: Verification is required, but the repository verify hook is absent or skipped. Configure
            .c2/recipes/hooks/build/verify.yaml.
      - to: stopped
        when: outputs.ok && !outputs.flow.candidate_changed && size(outputs.flow.jobs) > 0
        payload:
          flow: "${{ jq([outputs.flow, {'disposition': 'delegated'}], 'add') }}"
      - to: stopped
        when: outputs.ok && outputs.flow.?reuse_merge_approval.orValue(false) &&
          !outputs.flow.candidate_changed
        payload:
          flow: >-
            ${{ jq([outputs.flow, {'disposition': size(outputs.flow.jobs) > 0 ? 'delegated' : 'unchanged'}], 'add')
            }}
      - to: merge
        when: outputs.ok && outputs.flow.?reuse_merge_approval.orValue(false) &&
          outputs.flow.candidate_changed
        payload:
          flow: ${{ outputs.flow }}
      - to: synopsis
        when: outputs.ok
        payload:
          flow: ${{ outputs.flow }}
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    accept:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: outcome_review
        include: ../kernel/review.yaml
        inputs:
          title: '${{ inputs.flow.candidate_changed ? ''Review change synopsis and verification evidence'' : ''Review
            no-change rationale and verification evidence'' }}'
          documents: ${{ inputs.flow.documents }}
          fields:
          - id: decision
            type: multiple_choice
            question: '${{ inputs.flow.candidate_changed ? ''Accept the synopsis, reported verification status,
              and proposed commit message, and merge this candidate?'' : ''Accept the rationale in synopsis.md that
              this request is satisfied without repository changes, and complete this job?'' }}'
            required: true
            options:
            - value: accept
              label: '${{ inputs.flow.candidate_changed ? ''Accept and merge'' : ''Accept no-change outcome'' }}'
            - value: revise
              label: Revise implementation
            - value: cancel
              label: Cancel
          - id: feedback
            type: paragraph_text
            question: ${{ inputs.flow.?review_hint.orValue('Requested changes or guidance (required when
              requesting changes).') }}
            required: false
          - id: annotations
            type: file_upload
            question: Optional annotated documents; uploads request revision and another review.
            required: false
      outputs:
        response: ${{ sequence.outcome_review.outputs.response }}
        changed: ${{ sequence.outcome_review.outputs.changed }}
        flow: '${{ jq([inputs.flow, {''documents'': jq([inputs.flow.documents, sequence.outcome_review.outputs.documents],
          ''add''), ''reviews'': jq([inputs.flow.reviews, {''outcome'': sequence.outcome_review.outputs.response.?receipt.orValue({})}],
          ''add''), ''message'': ''Read feedback.json and attachments, revise the implementation, and request inspection
          again.''}], ''add'') }}'
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''cancelled''}], ''add'') }}'
      - to: stopped
        when: outputs.response.fields.decision == 'accept' && !outputs.changed &&
          !outputs.flow.candidate_changed && outputs.flow.verification.status in ['passed', 'skipped']
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''unchanged''}], ''add'') }}'
      - to: merge
        when: outputs.response.fields.decision == 'accept' && !outputs.changed &&
          outputs.flow.verification.status in ['passed', 'skipped'] && outputs.flow.candidate_changed
        payload:
          flow: ${{ outputs.flow }}
      - to: work
        when: outputs.changed
        payload:
          flow: ${{ outputs.flow }}
      - to: accept
        when: true
        payload:
          flow: '${{ jq([outputs.flow, {''review_hint'': ''Please describe the requested changes or attach annotated
            documents before requesting revision.''}], ''add'') }}'
    merge:
      retry:
        maximum_attempts: 1
      inputs:
        flow: ${{ transition.payload.flow }}
        base: ${{ context.git.execution.base_hash }}
      sequence:
      - id: squash_reviewed_candidate
        op: squash
        inputs:
          author: ${{ context.git.?author.orValue('') }}
          commit_message: ${{ inputs.flow.commit_message }}
      - id: merge_reviewed_candidate
        op: merge
        retry:
          maximum_attempts: 1
        inputs:
          repo_path: ${{ context.environment.op.worktree_path }}
          upstream_repo: ${{ context.git.repo }}
          upstream_branch: ${{ context.git.ref }}
      - id: publish
        include: ../build/hooks/publish.yaml
        workspace:
          cell: ${{ context.git.repo }}
          ref: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        inputs:
          request: ${{ inputs.flow.request }}
          target_directory: ${{ inputs.flow.target_directory }}
          documents: ${{ inputs.flow.documents }}
          settings: ${{ inputs.flow.settings_artifact }}
          round: ${{ inputs.flow.validation_round }}
          merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
          target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
          base: ${{ inputs.base }}
      outputs:
        flow: '${{ jq([inputs.flow, {''disposition'': ''implemented'', ''publication'': sequence.publish.outputs.result,
          ''documents'': jq([inputs.flow.documents, sequence.publish.outputs.artifact_refs], ''add'')}], ''add'')
          }}'
        merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
      catch:
      - id: chase_advanced_upstream
        # State catches read the incoming transition, outside sequence inputs.
        when: >-
          failure.kind == 'task_error' && failure.code == 'MERGE_UPSTREAM_ADVANCED' &&
          failure.node.op == 'merge' && failure.node.id == 'merge_reviewed_candidate' &&
          transition.payload.flow.merge_chases < 3
        to: rebase
        payload:
          flow: >-
            ${{ jq([transition.payload.flow, {'merge_chases': int(transition.payload.flow.merge_chases) + 1, 'chase_pending':
            true}],
            'add | del(.verification, .reuse_merge_approval, .review_hint)') }}
    stopped:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: ${{ inputs.flow }}
    reject_invalid_build_request:
      id: reject_invalid_build_request
      op: command_execution
      inputs:
        run: exit 1
      catch:
      - when: true
        fail:
          code: BUILD_REJECTED
          message: ${{ transition.payload.reason }}
    repair:
      inputs:
        flow: ${{ transition.payload.flow }}
        turn: ${{ transition.payload.turn }}
        issues: ${{ transition.payload.issues }}
      sequence:
      - id: repair
        include: ../kernel/repair.yaml
        inputs:
          turn: ${{ inputs.turn }}
          issues: ${{ inputs.issues }}
          documents: ${{ inputs.flow.documents }}
          session: ${{ inputs.flow.session }}
          attempts: ${{ inputs.flow.?repair_attempts.orValue(0) }}
      outputs:
        retry: ${{ sequence.repair.outputs.retry }}
        flow: '${{ jq([inputs.flow, {''result'': inputs.turn.result.?response.orValue(inputs.flow.?result.orValue({})),
          ''session'': sequence.repair.outputs.session, ''documents'': sequence.repair.outputs.documents, ''repair_base_documents'':
          inputs.flow.?repair_base_documents.orValue(inputs.flow.documents), ''repair_artifacts'': sequence.repair.outputs.artifacts,
          ''repair_attempts'': sequence.repair.outputs.attempts, ''message'': sequence.repair.outputs.prompt}],
          ''add'') }}'
      transitions:
      - to: work
        when: outputs.retry
        payload:
          flow: ${{ outputs.flow }}
      - to: stopped
        when: true
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''cancelled''}], ''add'') }}'
    finish:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: ${{ inputs.flow }}
      transitions:
      - to: wait_children
        when: outputs.flow.jobs.exists(k, outputs.flow.jobs[k].status == 'running')
        payload:
          flow: ${{ outputs.flow }}
      - to: dependency_recovery
        when: '!outputs.flow.jobs.all(k, outputs.flow.jobs[k].status == ''completed'' && (outputs.flow.jobs[k].kind == ''create'' ? outputs.flow.jobs[k].?ready.orValue(false) : (outputs.flow.jobs[k].result.?merged.orValue(false)
          || outputs.flow.jobs[k].result.?disposition.orValue('''') in [''delegated'', ''unchanged''])))'
        payload:
          flow: ${{ outputs.flow }}
      - to: handoff
        when: outputs.flow.result.next == 'heavy'
        payload:
          flow: ${{ outputs.flow }}
      - to: stopped
        when: outputs.flow.result.next == 'outside'
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''outside''}], ''add'') }}'
      - to: work
        when: outputs.flow.threads.exists(k, outputs.flow.threads[k].result.outcome != 'agreed')
        payload:
          flow: '${{ jq([outputs.flow, {''message'': ''A serving-cell consultation did not agree. Resolve the outstanding
            scope, ask the user, or escalate to heavy; do not claim the request is complete.''}], ''add'') }}'
      - to: inspect
        when: true
        payload:
          flow: ${{ outputs.flow }}
    dependency_recovery:
      include: ../kernel/recovery.yaml
      # Completed effects are retained. This gate never resubmits children.
      inputs:
        stage: child coordination
        evidence: ${{ states.finish.outputs.flow.jobs }}
        documents: ${{ states.finish.outputs.flow.documents }}
        safe_retry: false
      transitions:
      - to: work
        when: outputs.retry
        payload:
          flow: "${{ jq([states.finish.outputs.flow, {'documents': outputs.documents, 'message': 'Read recovery evidence and human direction. Reconcile failed dependencies; do not duplicate recorded jobs.'}], 'add') }}"
      - to: stopped
        when: true
        payload:
          flow: "${{ jq([states.finish.outputs.flow, {'disposition': 'cancelled', 'documents': outputs.documents}], 'add') }}"
    wait_children:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: children
        include: ./coordinate.yaml
        inputs:
          flow: ${{ inputs.flow }}
          action: ${{ 'blocked' }}
          requests: ${{ [] }}
          keys: ${{ jq(inputs.flow.jobs, 'to_entries | map(select(.value.status == "running") | .key)') }}
      outputs:
        flow: ${{ sequence.children.outputs.flow }}
      transitions:
      - to: finish
        when: true
        payload:
          flow: ${{ outputs.flow }}
    inspect:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: candidate
        include: ../kernel/git-candidate.yaml
      outputs:
        flow: ${{ inputs.flow }}
        changed: ${{ size(sequence.candidate.outputs.candidate.files) > 0 }}
      transitions:
      - to: rebase
        when: 'true'
        payload:
          flow: ${{ outputs.flow }}
    synopsis:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: synopsis
        include: ./synopsis.yaml
        inputs:
          flow: ${{ inputs.flow }}
      outputs:
        flow: '${{ jq([inputs.flow, {''reviewed_hook_digest'': inputs.flow.hook_digest, ''reviewed_change_digest'':
          sequence.synopsis.outputs.change_digest, ''candidate_changed'': sequence.synopsis.outputs.changed, ''commit_message'':
          sequence.synopsis.outputs.commit_message, ''documents'': jq([inputs.flow.documents, sequence.synopsis.outputs.documents],
          ''add'')}], ''add'') }}'
      transitions:
      - to: accept
        when: true
        payload:
          flow: ${{ outputs.flow }}
    handoff:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: "${{ jq([inputs.flow, {'disposition': 'heavy', 'documents': jq([inputs.flow.documents, {'light-handoff.json':
          {'kind': 'value', 'name': 'light-handoff.json', 'format': 'json', 'value': jq(inputs.flow, 'del(.session,
          .documents)')} }], 'add')}], 'add') }}"
    prepare:
      inputs:
        flow: "${{ jq([transition.payload.flow, {'validation_round': int(transition.payload.flow.?validation_round.orValue(0))
          + 1}], 'add') }}"
      sequence:
      - id: prepare
        include: ../build/hooks/prepare.yaml
        inputs:
          request: ${{ inputs.flow.request }}
          target_directory: ${{ inputs.flow.target_directory }}
          documents: ${{ inputs.flow.documents }}
          settings: ${{ inputs.flow.settings_artifact }}
          round: ${{ inputs.flow.validation_round }}
      - id: candidate
        include: ../kernel/git-candidate.yaml
      - id: identity
        include: ../build/hooks/identity.yaml
      outputs:
        passed: ${{ sequence.prepare.outputs.result.status in ['passed', 'skipped'] }}
        flow: "${{ jq([inputs.flow, {'candidate_changed': size(sequence.candidate.outputs.candidate.files) > 0,
          'hook_digest': sequence.identity.outputs.digest, 'documents': jq([inputs.flow.documents, sequence.prepare.outputs.artifact_refs,
          sequence.candidate.outputs.documents], 'add'), 'message': 'Preparation did not pass. Read preparation.md
          and its evidence, correct the issue, and request inspection again.'}], 'add') }}"
      transitions:
      - to: work
        when: '!outputs.passed'
        payload:
          flow: ${{ outputs.flow }}
      - to: inspect_chased_candidate
        when: outputs.flow.?chase_pending.orValue(false)
        payload:
          flow: ${{ outputs.flow }}
      - to: specialists
        when: true
        payload:
          flow: ${{ outputs.flow }}
    specialists:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: specialists
        include: ../build/hooks/specialists.yaml
        inputs:
          flow: ${{ inputs.flow }}
          checkpoint: outcome_assessment
      outputs:
        flow: ${{ sequence.specialists.outputs.flow }}
        passed: ${{ sequence.specialists.outputs.passed }}
      transitions:
      - to: verify
        when: outputs.passed
        payload:
          flow: ${{ outputs.flow }}
      - to: work
        when: 'true'
        payload:
          flow: ${{ outputs.flow }}
outputs:
  merged: ${{ nonempty(state_output('merge', 'merged_hash', '')) }}
  merged_hash: ${{ state_output('merge', 'merged_hash', '') }}
  target_branch: ${{ state_output('merge', 'target_branch', '') }}
  session: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff', 'flow',
    state_output('record', 'flow', {})))).session }}
  assistant_summary: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff',
    'flow', state_output('record', 'flow', {})))).result.?summary.orValue('') }}
  disposition: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff',
    'flow', state_output('record', 'flow', {})))).?disposition.orValue('incomplete') }}
  result: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff', 'flow',
    state_output('record', 'flow', {})))).result }}
  artifact_refs: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff',
    'flow', state_output('record', 'flow', {})))).documents }}
  consultations: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff',
    'flow', state_output('record', 'flow', {})))).threads }}
  dependencies: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff',
    'flow', state_output('record', 'flow', {})))).jobs }}
  reviews: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff', 'flow',
    state_output('record', 'flow', {})))).reviews }}
  verification: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff',
    'flow', state_output('record', 'flow', {})))).?verification.orValue({}) }}
  merge_chases: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('handoff',
    'flow', state_output('record', 'flow', {})))).?merge_chases.orValue(0) }}
  escalate: ${{ state_exists('handoff') }}
  publication: ${{ state_output('merge', 'flow', {}).?publication.orValue({}) }}
