id: light-coordinate
version: 1.0.0
inputs:
  flow: ${{ inputs.flow }}
  action: ${{ inputs.action }}
  requests: ${{ inputs.?requests.orValue([]) }}
  keys: ${{ inputs.?keys.orValue([]) }}
state:
  initial: pick
  states:
    pick:
      inputs:
        flow: ${{ transition.payload.?flow.orValue(inputs.flow) }}
        index: ${{ transition.payload.?index.orValue(0) }}
        items: '${{ inputs.action == ''consult'' ? inputs.requests : inputs.keys }}'
        action: ${{ inputs.action }}
      sequence: []
      outputs:
        flow: ${{ inputs.flow }}
        index: ${{ int(inputs.index) }}
        key: '${{ size(inputs.items) > int(inputs.index) ? (inputs.action == ''consult'' ? inputs.items[int(inputs.index)].key
          : inputs.items[int(inputs.index)]) : '''' }}'
        item: '${{ size(inputs.items) > int(inputs.index) && inputs.action == ''consult'' ? inputs.items[int(inputs.index)]
          : {} }}'
        available: ${{ int(inputs.index) < size(inputs.items) }}
      transitions:
      - to: invalid
        when: '!outputs.available'
      - to: invalid
        when: inputs.action == 'consult' && (!(outputs.item.kind in ['feature', 'create']) || outputs.item.ref ==
          '' || (outputs.item.kind == 'feature' && outputs.item.cell == ''))
      - to: invalid
        when: inputs.action == 'consult' && outputs.key in outputs.flow.threads && outputs.flow.threads[outputs.key].request
          != outputs.item
      - to: skip
        when: inputs.action == 'consult' && outputs.key in outputs.flow.threads
      - to: route
        when: inputs.action == 'consult'
      - to: invalid
        when: '!(outputs.key in outputs.flow.jobs)'
      - to: await_child_build
        when: outputs.flow.jobs[outputs.key].status == 'running'
      - to: skip
        when: true
    consult:
      include: ../kernel/consultation.yaml
      inputs:
        thread: ${{ states.pick.outputs.key }}
        request: ${{ states.pick.outputs.item.request }}
        consultant_role: ${{ states.pick.outputs.item.role }}
        requester_session: ${{ states.route.outputs.flow.session }}
        documents: ${{ states.route.outputs.flow.documents }}
        consultant_cell: ${{ states.route.outputs.target.repo }}
        consultant_ref: ${{ states.route.outputs.target.ref }}
      transitions:
      - to: agreed
        when: true
    submit:
      workspace:
        cell: ${{ states.agreed.outputs.flow.threads[states.pick.outputs.key].target.repo }}
        ref: ${{ states.agreed.outputs.flow.threads[states.pick.outputs.key].target.ref }}
      inputs:
        flow: ${{ states.agreed.outputs.flow }}
        thread: ${{ states.agreed.outputs.flow.threads[states.pick.outputs.key] }}
      sequence:
      - id: starter
        include: ../kernel/artifact-namespace.yaml
        inputs:
          prefix: consultation/
          documents: '${{ {''conversation.json'': inputs.thread.result.continuation} }}'
      - id: launch_child_build
        op: recipes.run
        inputs:
          recipes: '${{ [{''cell_name'': context.workspace.cell, ''git'': {''base_repo'': context.git.repo, ''base_ref'':
            context.git.ref, ''base_hash'': context.git.resolved_hash}, ''name'': inputs.flow.build_recipe, ''inputs'':
            {''prompt'': ''Execute the agreed prerequisite work. Consultation is complete; this is a fresh execution
            session. Read consultation/conversation.json and the supplied final agreement documents for the accepted
            scope. Implement that scope rather than repeating the scope agreement. Original consultation request:
            '' + inputs.thread.request.request, ''documents'': jq([inputs.thread.result.final_artifacts, sequence.starter.outputs.documents],
            ''add''), ''root_cell'': inputs.flow.root_cell, ''root_ref'': inputs.flow.root_ref} }] }}'
      outputs:
        job_id: ${{ sequence.launch_child_build.outputs.job_ids[0] }}
      transitions:
      - to: record
        when: true
        payload:
          patch: '${{ {''threads'': states.agreed.outputs.flow.threads, ''session'': states.agreed.outputs.flow.session,
            ''documents'': states.consult.outputs.final_artifacts, ''jobs'': jq([states.agreed.outputs.flow.jobs,
            {states.pick.outputs.key: {''job_id'': outputs.job_id, ''status'': ''running'', ''kind'': ''feature'',
            ''cell'': states.pick.outputs.item.cell} }], ''add'')} }}'
    await_child_build:
      id: await_child_build
      op: recipe.await_result_soft
      inputs:
        target:
          job: ${{ states.pick.outputs.flow.jobs[states.pick.outputs.key].job_id }}
        wait:
          'on': job
          condition: complete
        return_when: terminal
      transitions:
      - to: record
        when: true
        payload:
          patch: '${{ {''jobs'': jq([states.pick.outputs.flow.jobs, {states.pick.outputs.key: jq([states.pick.outputs.flow.jobs[states.pick.outputs.key],
            {''status'': outputs.status, ''result'': outputs.outputs, ''failure'': outputs.failure_message}], ''add'')}],
            ''add''), ''documents'': outputs.outputs.?artifact_refs.orValue({})} }}'
    skip:
      sequence: []
      transitions:
      - to: record
        when: true
        payload:
          patch: ${{ {} }}
    record:
      inputs:
        key: ${{ states.pick.outputs.key }}
        action: ${{ inputs.action }}
        flow: ${{ states.pick.outputs.flow }}
        patch: ${{ transition.payload.patch }}
      sequence:
      - id: namespace
        include: ../kernel/artifact-namespace.yaml
        inputs:
          prefix: '${{ (inputs.action == ''blocked'' && inputs.key in inputs.flow.jobs ? ''jobs/'' : ''consultations/'')
            + inputs.key + ''/'' }}'
          documents: ${{ inputs.patch.?documents.orValue({}) }}
      outputs:
        flow: '${{ jq([inputs.flow, inputs.patch, {''documents'': jq([inputs.flow.documents, sequence.namespace.outputs.documents],
          ''add'')}], ''add'') }}'
      transitions:
      - to: pick
        when: 'int(states.pick.outputs.index) + 1 < size(inputs.action == ''consult'' ? inputs.requests : inputs.keys)'
        payload:
          flow: ${{ outputs.flow }}
          index: ${{ int(states.pick.outputs.index) + 1 }}
    invalid:
      sequence: []
      outputs:
        error: 'Invalid light coordination request: use a distinct stable key, a serving target or configured root creation recipe,
          and known child keys when waiting.'
    agreed:
      inputs:
        flow: ${{ states.route.outputs.flow }}
        key: ${{ states.pick.outputs.key }}
        request: ${{ states.pick.outputs.item }}
        consultation: ${{ states.consult.outputs }}
        target: ${{ states.route.outputs.target }}
      sequence: []
      outputs:
        flow: '${{ jq([inputs.flow, {''threads'': jq([inputs.flow.threads, {inputs.key: {''request'': inputs.request,
          ''target'': inputs.target, ''status'': ''completed'', ''result'': inputs.consultation} }], ''add''), ''session'':
          inputs.consultation.requester_session}], ''add'') }}'
      transitions:
      - to: submit
        when: states.consult.outputs.outcome == 'agreed'
      - to: record
        when: true
        payload:
          patch: '${{ {''threads'': outputs.flow.threads, ''session'': outputs.flow.session, ''documents'': states.consult.outputs.final_artifacts}
            }}'
    route:
      include: ../kernel/route-target.yaml
      inputs:
        flow: ${{ states.pick.outputs.flow }}
        request: ${{ states.pick.outputs.item }}
      transitions:
      - to: invalid
        when: '!outputs.valid'
      - to: record
        when: outputs.handled
        payload:
          patch: '${{ {''jobs'': outputs.flow.jobs, ''threads'': outputs.flow.threads, ''documents'': outputs.flow.documents}
            }}'
      - to: consult
        when: true
outputs:
  flow: ${{ state_output('record', 'flow', inputs.flow) }}
  valid: ${{ !state_exists('invalid') }}
  error: ${{ state_output('invalid', 'error', '') }}
