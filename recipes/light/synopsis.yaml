id: light-synopsis
version: 1.0.0
inputs:
  flow: ${{ inputs.flow }}
sequence:
- id: candidate
  include: ../kernel/git-candidate.yaml
- id: render_change_synopsis
  op: command_execution
  const: true
  execution_needs:
    packages:
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ json_stringify(sequence.candidate.outputs.candidate) }}
      RESPONSE: ${{ json_stringify(inputs.flow.result) }}
      VERIFICATION: ${{ json_stringify(inputs.flow.verification) }}
    run: |
      python3 - <<'PY'
      import json, os, pathlib
      candidate = json.loads(os.environ['CANDIDATE'])
      response = json.loads(os.environ['RESPONSE'])
      verification = json.loads(os.environ['VERIFICATION'])
      subject, message = response['subject'].strip(), response['review_message'].strip()
      if not subject or len(subject) > 72 or '\n' in subject or '\r' in subject or not message:
          raise ValueError('Synopsis requires a one-line subject (<=72 characters) and review message')
      if verification['status'] not in ('passed', 'skipped'):
          raise ValueError('Synopsis cannot proceed after failed verification')
      verification_note = (
          'Verification passed. See verification.md and build.log for commands and results.'
          if verification['status'] == 'passed' else
          'Verification skipped: no build.sh or explicit check command. See verification.md. No automated verification was performed.')
      commit = subject + '\n\n' + message + '\n\nJob: ' + candidate['job_url']
      heading = '## Proposed squash commit' if candidate['files'] else '## No-change rationale'
      explanation = commit if candidate['files'] else message
      lines = ['# Change synopsis', '', response['summary'], '', heading, '', explanation,
               '', '## Candidate and verification', '', 'Base: `' + candidate['base'] + '`',
               'Candidate: `' + candidate['head'] + '`', '',
               verification_note,
               '', '## Files included', '']
      for f in candidate['files']:
          lines.append('- ' + f['change'] + ': ' + json.dumps(f['path'], ensure_ascii=False))
      if not candidate['files']:
          lines.append('No repository changes. Human acceptance is required to complete this job; no commit will be created.')
      (pathlib.Path(os.environ['OUTBOX']) / 'synopsis.md').write_text('\n'.join(lines) + '\n')
      print(json.dumps({'commit_message': commit}))
      PY
outputs:
  changed: ${{ size(sequence.candidate.outputs.candidate.files) > 0 }}
  change_digest: ${{ sequence.candidate.outputs.candidate.change_digest }}
  commit_message: ${{ json_parse(sequence.render_change_synopsis.outputs.stdout).commit_message }}
  documents: >-
    ${{ jq([sequence.candidate.outputs.documents, {'synopsis.md': sequence.render_change_synopsis.artifacts['synopsis.md']}], 'add') }}
