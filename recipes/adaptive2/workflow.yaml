id: adaptive2-workflow
version: 1.0.0
inputs:
  title: ${{ inputs.?title.orValue('') }}
  annotations: ${{ inputs.annotations }}
  prompt: "${{ inputs.?title.orValue('') == '' ? inputs.prompt : 'Title: ' + inputs.title + '\\n\\n' + inputs.prompt
    }}"
  target_directory: ${{ inputs.target_directory }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  require_verification: ${{ inputs.require_verification }}
  max_iterations: ${{ inputs.max_iterations }}
  resume_from: ${{ inputs.?resume_from.orValue('') }}
sequence:
- id: initial_candidate
  op: command_execution
  const: true
  inputs:
    run: |
      set -eu
      case "$MAX_ITERATIONS" in ""|*[!0-9]*) echo 'max_iterations must be a nonnegative integer' >&2; exit 1;; esac
      set -eu
      case "$TARGET" in ""|/*|..|../*|*/../*|*/..) echo 'Invalid repository-relative target directory' >&2; exit 1;; esac
      test -d "$TARGET" || { echo 'Target directory does not exist' >&2; exit 1; }
      git rev-parse HEAD
    env:
      TARGET: ${{ inputs.target_directory }}
      MAX_ITERATIONS: ${{ string(inputs.max_iterations) }}
- id: configure
  include: ../adaptive/hook-configure.yaml
  inputs:
    request: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    documents: ${{ inputs.documents }}
    candidate: ${{ jq(sequence.initial_candidate.outputs.stdout, 'split("\\n")[0]') }}
- id: configuration_gate
  state:
    initial:
    - to: ok
      when: inputs.status in ['passed', 'skipped']
    - to: invalid
      when: true
    states:
      ok:
        sequence: []
      invalid:
        include: ../adaptive/operational-failure.yaml
        inputs:
          code: BUILD_CONFIGURATION_INVALID
          reason: ${{ inputs.reason }}
          documents: ${{ inputs.documents }}
  inputs:
    status: "${{ size(sequence.configure.outputs.settings.consultations.map(c, c.key)) == size(jq(sequence.configure.outputs.settings.consultations,
      'map(.key) | unique')) ? sequence.configure.outputs.result.status : 'failed' }}"
    reason: "${{ sequence.configure.outputs.result.status == 'failed' ? sequence.configure.outputs.result.summary : 'Configure hook declared duplicate consultation keys.' }}"
    documents: ${{ sequence.configure.outputs.artifact_refs }}
- id: run
  inputs:
    annotations: ${{ inputs.annotations }}
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    session: ${{ inputs.?session.orValue({}) }}
    documents: ${{ jq([inputs.documents, sequence.configure.outputs.artifact_refs], 'add') }}
    root_cell: ${{ inputs.root_cell }}
    root_ref: ${{ inputs.root_ref }}
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: ${{ inputs.build_recipe }}
    create_recipe: ${{ inputs.create_recipe }}
    settings_artifact: ${{ sequence.configure.outputs.settings_artifact }}
    require_verification: ${{ inputs.require_verification }}
    design_required: true
    max_iterations: ${{ inputs.max_iterations }}
    prompt_additions: ${{ sequence.configure.outputs.settings.prompt_additions }}
    consultations: ${{ sequence.configure.outputs.settings.consultations }}
    resume_from: ${{ inputs.resume_from }}
  include: ./develop.yaml
- id: current_annotations
  include: ./current-annotations.yaml
  inputs:
    documents: ${{ sequence.run.outputs.artifact_refs }}
    annotations: ${{ sequence.run.outputs.annotations }}
outputs:
  annotations: ${{ sequence.current_annotations.outputs.annotations }}
  merged: ${{ sequence.run.outputs.merged }}
  merged_hash: ${{ sequence.run.outputs.merged_hash }}
  target_branch: ${{ sequence.run.outputs.target_branch }}
  session: ${{ sequence.run.outputs.session }}
  assistant_summary: ${{ sequence.run.outputs.assistant_summary }}
  disposition: ${{ sequence.run.outputs.disposition }}
  result: ${{ sequence.run.outputs.result }}
  artifact_refs: ${{ sequence.run.outputs.artifact_refs }}
  reviews: ${{ sequence.run.outputs.reviews }}
  verification: ${{ sequence.run.outputs.verification }}
  process: adaptive2
  classification: ${{ sequence.run.outputs.work_kind }}
  publication: ${{ sequence.run.outputs.publication }}
  rebase_repairs: ${{ sequence.run.outputs.rebase_repairs }}
  coordination: ${{ sequence.run.outputs.coordination }}
  work_kind: ${{ sequence.run.outputs.work_kind }}
