id: adaptive2-review
inputs:
  title: ${{ inputs.title }}
  documents: ${{ inputs.documents }}
  fields: ${{ inputs.fields }}
  annotations: ${{ inputs.?annotations.orValue([]) }}
  summary: ${{ inputs.?summary.orValue('') }}
  overview: ${{ inputs.overview }}
  brief: ${{ inputs.?brief.orValue(null) }}
  required_documents: ${{ inputs.?required_documents.orValue([]) }}
sequence:
- id: prompts
  include: ./prompts.yaml
- id: select
  sequence: []
  outputs:
    documents: ${{
      jq({'overview':inputs.overview,'brief':inputs.brief,'documents':inputs.documents,'annotations':inputs.annotations,'required':inputs.required_documents,'title':inputs.title,'summary':inputs.summary,'fields':inputs.fields},
      vars.selection) }}
  inputs:
    overview: ${{ inputs.overview }}
    brief: ${{ inputs.brief }}
    documents: ${{ inputs.documents }}
    annotations: ${{ inputs.annotations }}
    required_documents: ${{ inputs.required_documents }}
    title: ${{ inputs.title }}
    summary: ${{ inputs.summary }}
    fields: ${{ inputs.fields }}
- id: request_human_review
  op: input
  inputs:
    form:
      kind: review
      title: ${{ inputs.title }}
      documents: ${{ sequence.select.outputs.documents }}
      fields: ${{ jq(inputs.fields, vars.form_fields) }}
      document_metadata: "${{ jq({'overview': inputs.overview, 'documents': sequence.select.outputs.documents, 'annotations':
        inputs.annotations, 'titles': sequence.prompts.outputs.human.document_titles}, vars.metadata_query) }}"
      overview_document_id: '${{ inputs.overview in sequence.select.outputs.documents ? inputs.overview : "" }}'
vars:
  metadata_query: |
    def safe_text($limit):
      type == "string" and length > 0 and length <= $limit and
      (test("[[:cntrl:]]") | not);

    def descriptor:
      (if type == "object" then . else {} end) |
      with_entries(select(
        (.key == "title" and (.value | safe_text(120))) or
        (.key == "description" and (.value | safe_text(300))) or
        (.key == "role" and (.value | IN("primary", "supporting", "diagnostic"))) or
        (.key == "order" and (.value | type == "number" and . >= 0 and . <= 1000000 and . == floor))
      ));

    . as $context |
    # Names can change during binding; content identities must still match.
    def current_document:
      (.id | type) == "string" and
      (.id as $id | $context.documents | has($id)) and
      (($context.documents[.id] | del(.name)) == (.ref | del(.name)));

    def source_ids($id):
      [(.sources | if type == "array" then .[] else empty end) |
       select(type == "object" and .id != $id) |
       select(current_document) | .id] | unique | .[:128];

    # Last valid annotation for the current artifact wins; stale ones are ignored.
    reduce (.annotations[] | select(type == "object") | select(current_document)) as $annotation ({};
      .[$annotation.id] = ($annotation.descriptor | descriptor) +
        {source_document_ids: ($annotation | source_ids(.id))}
    ) |
    # Required review documents retain their roles and order, even with custom titles.
    reduce ($context.documents | keys[]) as $id (.;
      (if $id == $context.overview then {role: "primary", order: 0}
       elif $id == "approved/merge-review.md" then {role: "supporting", order: 1}
       elif $id == "approved/merge-candidate.diff" or $id == "approved/merge-candidate.json" or
            $id == "merge-candidate.diff" or $id == "merge-candidate.json" then {role: "diagnostic", order: 20}
       elif $id == "test-statements.md" then {role: "supporting", order: 1}
       elif $id == "test-results.md" then {role: "supporting", order: 2}
       elif $id == "assessment.md" then {role: "supporting", order: 3}
       elif $id == "design.md" then {role: "supporting", order: 4}
       elif $id == "implementation.md" then {role: "supporting", order: 5}
       else {role: (if .[$id].role == "diagnostic" then "diagnostic" else "supporting" end)} end) as $priority |
      if $priority == null then . else
        .[$id] = {title: ($context.titles[$id] // $id)} + (.[$id] // {}) + $priority
      end
    )
  form_fields: |
    map(if .type == "multiple_choice" or .type == "checkboxes"
        then . else del(.options) end)
  selection: |
    . as $v |
      ($v.brief // {kind:"value",name:$v.overview,format:"text",
        value:("# " + $v.title + "\n\n## Decision\n\n" +
          ($v.fields | map(select(.id != "annotations" and .id != "feedback") | .question) | join("\n\n")) +
          "\n\n## Context\n\n" + $v.summary)}) as $brief |
      ($v.annotations | map(select(.id == $v.overview and (.ref|del(.name)) == ($brief|del(.name)))) |
        map(.sources // []) | add // [] |
        map(select(type == "object" and (.id | type) == "string") |
              select(.id as $id | $v.documents | has($id)) |
              select(($v.documents[.id]|del(.name)) == (.ref|del(.name))) | .id)) as $sources |
      ($v.documents | with_entries(select(.key as $k | ($v.required + $sources) | index($k)))) +
      {($v.overview):($brief + {name:$v.overview})}
outputs:
  response: ${{ sequence.request_human_review.outputs }}
  documents: ${{
    jq([sequence.select.outputs.documents,sequence.request_human_review.outputs.?artifact_refs.orValue({})],'add')
    }}
  changed: ${{ nonempty(sequence.request_human_review.outputs.fields.?feedback.orValue('')) ||
    size(sequence.request_human_review.outputs.?artifact_refs.orValue({})) > 0 }}
