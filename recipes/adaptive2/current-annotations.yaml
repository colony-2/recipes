id: adaptive2-current-annotations
inputs:
  documents: ${{ inputs.documents }}
  annotations: ${{ inputs.annotations }}
sequence: []
outputs:
  annotations: ${{ jq({'documents':inputs.documents,'annotations':inputs.annotations}, vars.current) }}
vars:
  current: |
    .documents as $documents |
    # Match the same ID and immutable identity used by review metadata. A newer
    # descriptor replaces an older one only for that exact current document.
    reduce (.annotations[] | select(type == "object") |
      select((.id | type) == "string" and (.ref | type) == "object") |
      select(.id as $id | $documents | has($id)) |
      select((.ref | del(.name)) == ($documents[.id] | del(.name)))) as $annotation
      ({}; .[$annotation.id] = $annotation) | [.[]]
