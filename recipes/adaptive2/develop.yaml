id: adaptive2-develop
version: 1.0.0
inputs:
  annotations: ${{ inputs.?annotations.orValue([]) }}
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  session: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  prior_rebase_repairs: ${{ inputs.?prior_rebase_repairs.orValue(0) }}
  prior_merge_chases: ${{ inputs.?prior_merge_chases.orValue(0) }}
  settings_artifact: ${{ inputs.?settings_artifact.orValue(null) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  design_required: ${{ inputs.design_required }}
  max_iterations: ${{ inputs.max_iterations }}
  prompt_additions: ${{ inputs.?prompt_additions.orValue({}) }}
  consultations: ${{ inputs.?consultations.orValue([]) }}
state:
  initial: prompts
  states:
    prompts:
      include: ./prompts.yaml
      transitions:
      - to: start
        when: true
    start:
      inputs:
        documents: |-
          ${{ jq([json_parse(json_stringify(context.artifacts)), inputs.documents, {'request.md': {'kind':'value','name':'request.md','format':'text','value':inputs.prompt} }], 'add | with_entries(select(.key != "__git_state_thin_pack__" and .key != "diff_from_parent.diff" and .key != "diff_from_base.diff"))') }}
        root_cell: "${{ inputs.root_cell != '' ? inputs.root_cell : 'root' }}"
        root_ref: "${{ inputs.root_ref != '' ? inputs.root_ref : 'main' }}"
      sequence:
      - id: rebase_policy
        include: ../adaptive/rebase-policy.yaml
        inputs: {}
      outputs:
        documents: ${{ inputs.documents }}
        root_cell: ${{ inputs.root_cell }}
        root_ref: ${{ inputs.root_ref }}
        rebase_policy: ${{ sequence.rebase_policy.outputs.predicate }}
      transitions:
      - to: reject_invalid_build_request
        when: "!nonempty(inputs.target_directory) || inputs.target_directory.startsWith('/') || inputs.target_directory.matches('(^|/)[.][.](/|$)')"
        payload:
          reason: Target directory must be a nonempty repository-relative path without parent traversal.
      - to: design_context
        when: true
        payload:
          phase: design
          documents: ${{ outputs.documents }}
    dispatch:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.?annotations.orValue(inputs.annotations) }}
        phase: ${{ transition.payload.?phase.orValue(state_output('dispatch','phase',inputs.design_required ?
          'design':'test-plan')) }}
        session: ${{ transition.payload.?session.orValue(state_output('record','session',inputs.session)) }}
        assignment: ${{ transition.payload.?assignment.orValue('') }}
        evidence_documents: ${{ transition.payload.?evidence_documents.orValue({}) }}
        retained_artifacts: ${{ transition.payload.?retained_artifacts.orValue({}) }}
        base_documents: ${{ transition.payload.?base_documents.orValue(transition.payload.documents) }}
        repair_attempts: ${{ transition.payload.?repair_attempts.orValue(0) }}
        request_prefix: "${{ 'request-' + string(state_exists('work') ? size(states.work.runs) + 1 : 0) }}"
        receipts: "${{ (state_exists('questions') ? states.questions.runs.map(r,r.outputs.response.receipt) + [states.questions.outputs.response.receipt]
          : []) + (state_exists('direction') ? states.direction.runs.map(r,r.outputs.response.receipt) + [states.direction.outputs.response.receipt]
          : []) + (state_exists('accept') ? states.accept.runs.map(r,r.outputs.response.receipt) + [states.accept.outputs.response.receipt]
          : []) + (state_exists('packages') ? states.packages.runs.map(r,r.outputs.review_receipts) + [states.packages.outputs.review_receipts]
          : []) + (state_exists('coordinate') ? states.coordinate.runs.map(r,r.outputs.review_receipts) + [states.coordinate.outputs.review_receipts]
          : []) }}"
        work: "${{ state_exists('work') ? (states.work.runs.map(r,r.outputs) + [states.work.outputs]).map(w, {'phase':w.phase,'assignment':w.assignment,'next':w.next,'human_round':w.human_round,'human_reply':w.human_reply}) : [] }}"
        limit: ${{ inputs.max_iterations }}
      sequence:
      - id: budget
        include: ./autonomous-budget.yaml
        inputs:
          receipts: ${{ inputs.receipts }}
          work: ${{ inputs.work }}
          phase: ${{ inputs.phase }}
          assignment: ${{ inputs.assignment }}
          limit: ${{ inputs.limit }}
      outputs:
        phase: ${{ inputs.phase }}
        session: ${{ inputs.session }}
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
        assignment: ${{ inputs.assignment }}
        evidence_documents: ${{ inputs.evidence_documents }}
        retained_artifacts: ${{ inputs.retained_artifacts }}
        base_documents: ${{ inputs.base_documents }}
        repair_attempts: ${{ inputs.repair_attempts }}
        request_prefix: ${{ inputs.request_prefix }}
        human_round: ${{ sequence.budget.outputs.human_round }}
        human_reply: ${{ sequence.budget.outputs.human_reply }}
        used: ${{ sequence.budget.outputs.used }}
        exhausted: ${{ sequence.budget.outputs.exhausted }}
      transitions:
      - to: autonomous_limit
        when: outputs.exhausted
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          used: ${{ outputs.used }}
      - to: work
        when: true
    work:
      inputs:
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        guidance: ${{
          inputs.prompt_additions[?{'design':'design','test-plan':'test_plan','implement':'implementation'}[states.dispatch.outputs.phase]].orValue('')
          }}
        phase: ${{ states.dispatch.outputs.phase }}
        session: ${{ states.dispatch.outputs.session }}
        assignment: ${{ states.dispatch.outputs.assignment }}
        documents: |-
          ${{ jq([states.dispatch.outputs.documents, state_exists('direction_approved') ? {'approved-direction/one-pager.md':jq([states.direction_approved.outputs.one_pager,{'name':'approved-direction/one-pager.md'}],'add')} : {}], 'add') }}
        evidence_documents: ${{ states.dispatch.outputs.evidence_documents }}
        retained_artifacts: ${{ states.dispatch.outputs.retained_artifacts }}
        pending_jobs: "${{ jq(state_output('work','pending_jobs',[]) + state_output('record','pending_jobs',[]),'unique').filter(j,!((state_exists('coordinate')
          ? jq(states.coordinate.runs.map(r,r.outputs.records) + [states.coordinate.outputs.records],'add') : [])
          + (state_exists('work') ? jq(states.work.runs.map(r,r.outputs.child_results) + [states.work.outputs.child_results],'add').map(r,{'action':'await','job_id':r.job_id,'result':r})
          : []) + (state_exists('wait_children') ? jq(states.wait_children.runs.map(r,r.outputs.results) + [states.wait_children.outputs.results],'add').map(r,{'action':'await','job_id':r.job_id,'result':r})
          : [])).exists(h,h.action == 'await' && h.job_id == j)) }}"
        human_round: ${{ states.dispatch.outputs.human_round }}
        human_reply: ${{ states.dispatch.outputs.human_reply }}
      sequence:
      - id: agent
        include: ./agent.yaml
        inputs:
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          phase: ${{ inputs.phase }}
          session: ${{ inputs.session }}
          assignment: ${{ inputs.assignment }}
          documents: ${{ inputs.documents }}
          evidence_documents: ${{ inputs.evidence_documents }}
          retained_artifacts: ${{ inputs.retained_artifacts }}
          guidance: ${{ inputs.guidance }}
      - id: children
        include: ../adaptive/child-results.yaml
        inputs:
          jobs: ${{ sequence.agent.outputs.turn.jobs }}
          allowed: ${{ inputs.phase == 'implement' && inputs.assignment != 'repair' }}
          pending: ${{ inputs.pending_jobs }}
          wait: false
      - id: expectations
        include: ../adaptive/expectations.yaml
        inputs:
          baseline: ${{ inputs.documents[?'test-statements.md'].orValue(null) }}
          proposed: "${{ inputs.phase == 'implement' ? sequence.agent.outputs.turn.documents[?'test-statements.md'].orValue(null)
            : null }}"
      outputs:
        turn: ${{ sequence.agent.outputs.turn }}
        documents: ${{ jq([inputs.documents,sequence.children.outputs.documents], 'add') }}
        children_failed: ${{ sequence.children.outputs.failed }}
        expectations_changed: ${{ sequence.expectations.outputs.changed }}
        assignment: ${{ inputs.assignment }}
        pending_jobs: ${{ sequence.children.outputs.pending }}
        child_results: ${{ sequence.children.outputs.results }}
        phase: ${{ inputs.phase }}
        next: ${{ sequence.agent.outputs.turn.result.?response.orValue({}).?next.orValue('') }}
        child_documents: ${{ sequence.children.outputs.documents }}
        human_round: ${{ inputs.human_round }}
        human_reply: ${{ inputs.human_reply }}
      transitions:
      - to: record
        when: true
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') &&
          states.dispatch.outputs.evidence_documents.exists(k, failure.message.contains('"' + k + '"'))
        to: dispatch
        payload:
          documents: ${{ states.dispatch.outputs.documents }}
          annotations: ${{ states.dispatch.outputs.annotations }}
          evidence_documents: "${{ {'error/artifact-binding.md': {'kind':'value','name':'error/artifact-binding.md','format':'text','value':failure.message
            + '\\nThe evidence could not be read. Repair or rerun the producing check; missing evidence is not success.'}
            } }}"
    record:
      inputs:
        turn: ${{ states.work.outputs.turn }}
        session: ${{ states.dispatch.outputs.session }}
        assignment: ${{ states.dispatch.outputs.assignment }}
        base_documents: ${{ states.dispatch.outputs.base_documents }}
        documents: ${{ states.work.outputs.documents }}
        annotations: ${{ states.dispatch.outputs.annotations }}
        phase: ${{ states.dispatch.outputs.phase }}
        coordination: "${{ (state_exists('coordinate') ? jq(states.coordinate.runs.map(r,r.outputs.records) + [states.coordinate.outputs.records],'add')
          : []) + (state_exists('work') ? jq(states.work.runs.map(r,r.outputs.child_results) + [states.work.outputs.child_results],'add').map(r,{'action':'await','job_id':r.job_id,'result':r})
          : []) + (state_exists('wait_children') ? jq(states.wait_children.runs.map(r,r.outputs.results) + [states.wait_children.outputs.results],'add').map(r,{'action':'await','job_id':r.job_id,'result':r})
          : []) }}"
        child_documents: ${{ states.work.outputs.child_documents }}
        direct_pending: ${{ states.work.outputs.pending_jobs }}
        original_request: ${{ states.start.outputs.documents['request.md'] }}
        approved_direction: ${{ state_output('direction_approved','one_pager',null) }}
      sequence: []
      outputs:
        issues: ${{ vars.issues }}
        session: ${{ inputs.turn.result.?session.orValue(inputs.session) }}
        documents: |-
          ${{ jq([inputs.turn.result.?output_schema_valid.orValue(false) ? jq([jq(inputs.documents, 'with_entries(select(.key == "test-statements.md" or .key == "handoff.md" or .key == "request.md" or .key == "one-pager.md" or (.key | startswith("coordination/"))))'), inputs.turn.documents, inputs.child_documents], 'add') : inputs.documents,
           {'request.md':inputs.original_request}, inputs.approved_direction != null ? {'approved-direction/one-pager.md':jq([inputs.approved_direction,{'name':'approved-direction/one-pager.md'}],'add')} : {}], 'add') }}
        annotations: ${{ inputs.annotations + inputs.turn.?annotations.orValue([]) }}
        pending_jobs: ${{ jq(inputs.coordination.filter(e,e.action == 'execute' &&
          !inputs.coordination.exists(n,n.action == 'execute' && n.?replaces.orValue('') ==
          e.job_id)).filter(e,!inputs.coordination.exists(a,a.action == 'await' && a.job_id ==
          e.job_id)).map(e,e.job_id) + inputs.direct_pending, 'unique') }}
        failed_jobs: ${{ inputs.coordination.filter(e,e.action == 'execute' &&
          !inputs.coordination.exists(n,n.action == 'execute' && n.?replaces.orValue('') ==
          e.job_id)).filter(e,inputs.coordination.exists(a,a.action == 'await' && a.job_id == e.job_id &&
          (a.result.status != 'completed' || !(a.result.?outputs.orValue({}).?merged.orValue(false) ||
          a.result.?outputs.orValue({}).?disposition.orValue('') in
          ['unchanged','delegated'])))).map(e,e.job_id) }}
      vars:
        issues: |-
          ${{ (size(states.work.outputs.turn.result.?response.orValue({}).?packages.orValue([])) > 0 && states.work.outputs.turn.result.response.next != 'blocked' ? ['Use next: blocked with a package request so the recipe can authorize and validate it before continuing.'] : []) + (states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'ask_user' ? [] : states.work.outputs.turn.?issues.orValue([]))
           + (states.work.outputs.turn.result.?status.orValue('failed') != 'completed' ? ['Agent did not complete: ' + states.work.outputs.turn.result.?errorMessage.orValue('No completed response.')] : [])
           + (!states.work.outputs.turn.result.?output_schema_valid.orValue(false) ? ['The operation did not produce a schema-valid response. Correct the response using the supplied schema.'] : [])
           + (states.work.outputs.turn.result.?session.orValue(null) == null ? ['The response has no resumable session checkpoint.'] : [])
           + (size(states.work.outputs.turn.jobs.?job_ids.orValue([])) > 0 && (states.dispatch.outputs.phase != 'implement' || states.dispatch.outputs.assignment == 'repair') ? ['The agent submitted jobs directly; stop and review these effects before continuing.'] : [])
           + (states.work.outputs.turn.result.?status.orValue('failed') == 'completed' && states.work.outputs.turn.result.?output_schema_valid.orValue(false) ?
              (states.work.outputs.turn.result.response.next != 'ask_user' && states.work.outputs.turn.result.response.?files.orValue([]).exists(f, f.path.startsWith('/') || f.path.contains('..') || f.path.contains('\\') || f.path in ['__git_state_thin_pack__']) ? ['Select only safe deliverable artifact names, excluding workflow control files.'] : [])
            + (states.work.outputs.turn.result.response.next != 'ask_user' && size(states.work.outputs.turn.result.response.?files.orValue([]).map(f, f.path)) != size(jq(states.work.outputs.turn.result.response.?files.orValue([]), 'map(.path) | unique')) ? ['List each resolved artifact only once.'] : [])
            + (states.work.outputs.turn.result.response.next == 'review' && !states.work.outputs.turn.result.response.?files.orValue([]).exists(f, f.path == {'design': (states.work.outputs.turn.result.response.?work_kind.orValue('') == 'explanation' && 'answer.md' in states.work.outputs.turn.documents ? 'answer.md' : 'one-pager.md'), 'test-plan': 'test-statements.md', 'implement': 'implementation.md'}[states.dispatch.outputs.phase]) ? ['Review requires ' + {'design': (states.work.outputs.turn.result.response.?work_kind.orValue('') == 'explanation' && 'answer.md' in states.work.outputs.turn.documents ? 'answer.md' : 'one-pager.md'), 'test-plan': 'test-statements.md', 'implement': 'implementation.md'}[states.dispatch.outputs.phase] + ' in the returned files.'] : [])
            + (states.work.outputs.turn.result.response.next == 'ask_user' && (!nonempty(states.work.outputs.turn.result.response.?review_title.orValue('')) || size(states.work.outputs.turn.result.response.?questions.orValue([])) == 0 || states.work.outputs.turn.result.response.?questions.orValue([]).exists(q, q.id == 'annotations')) ? ['ask_user requires review_title naming the decision and focused questions; annotations is a reserved question id.'] : [])
           : []) + (states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'coordinate' && size(states.work.outputs.turn.result.response.?requests.orValue([])) == 0 ? ['Return at least one consultation or execution request.'] : []) + (states.dispatch.outputs.phase == 'implement' && states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'review' && !states.work.outputs.turn.result.response.?files.orValue([]).exists(f, f.path == 'test-results.md') ? ['Publish test-results.md mapping statement IDs to results and evidence.'] : []) + (states.work.outputs.expectations_changed && states.work.outputs.turn.result.response.next != 'redesign' ? ['Formal expectations are fixed before implementation. Return redesign to update their plan with preserved expectations and any required deprecation.'] : []) + (states.dispatch.outputs.phase == 'test-plan' && states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'review' && !('handoff.md' in states.work.outputs.turn.documents) ? ['Publish handoff.md synthesized from the settled design and consultation outcomes for the new implementation session.'] : []) + (states.dispatch.outputs.phase == 'design' && states.work.outputs.turn.result.response.next == 'review' && (!(states.work.outputs.turn.result.response.?work_kind.orValue('') in ['feature','bug','explanation','oversight']) || !nonempty(states.work.outputs.turn.result.response.?review_title.orValue(''))) ? ['Name the work kind and a descriptive review_title identifying the cell and intended outcome.'] : []) }}
      transitions:
      - to: reject_invalid_build_request
        when: size(outputs.issues) > 0 && (states.work.outputs.turn.result.?status.orValue('failed') !=
          'completed' || size(states.work.outputs.turn.jobs.?job_ids.orValue([])) > 0)
        payload:
          reason: ${{ jq(outputs.issues,'join("; ")') }}
      - to: repair
        when: size(outputs.issues) > 0
        payload:
          turn: ${{ states.work.outputs.turn }}
          issues: ${{ outputs.issues }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: operational_failure
        when: states.work.outputs.turn.result.response.next == 'fail'
        payload:
          reason: ${{ states.work.outputs.turn.result.response.summary }}
          documents: ${{ outputs.documents }}
      - to: recover_work
        when: states.work.outputs.children_failed
        payload:
          reason: A child finished unsuccessfully. Read error/ and results/, diagnose the problem, and choose
            a correction or a fresh attempt.
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: design_next
        when: states.work.outputs.turn.result.response.next == 'redesign'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: questions
        when: states.work.outputs.turn.result.response.next == 'ask_user'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: packages
        when: states.work.outputs.turn.result.response.next == 'blocked' &&
          size(states.work.outputs.turn.result.response.?packages.orValue([])) > 0
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: coordinate
        when: states.work.outputs.turn.result.response.next == 'coordinate'
        payload:
          requests: ${{ states.work.outputs.turn.result.response.requests }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: wait_children
        when: states.work.outputs.turn.result.response.next in ['review','outside','blocked','wait'] &&
          size(outputs.pending_jobs)>0
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          jobs: ${{ outputs.pending_jobs }}
      - to: recover_work
        when: states.work.outputs.turn.result.response.next in ['review','outside'] &&
          size(outputs.failed_jobs) > 0
        payload:
          reason: "${{ 'Required child work is incomplete. Read coordination/ and error/; request a fresh execution
            with corrected instructions for the failed assignment. Jobs: ' + jq(outputs.failed_jobs,'join(\", \"\
            )') }}"
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: recover_work
        when: states.work.outputs.turn.result.response.next == 'blocked'
        payload:
          reason: ${{ states.work.outputs.turn.result.response.summary }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: stopped
        when: states.work.outputs.turn.result.response.next == 'outside'
        payload:
          disposition: outside
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: scheduling
        when: states.work.outputs.turn.result.response.next == 'continue' && size(outputs.pending_jobs)>0
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          jobs: ${{ outputs.pending_jobs }}
      - to: repair
        when: states.work.outputs.turn.result.response.next == 'wait'
        payload:
          turn: ${{ states.work.outputs.turn }}
          issues:
          - There are no pending child jobs. Continue useful local work or return the actual outcome.
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: states.work.outputs.turn.result.response.next == 'continue'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: stopped
        when: states.dispatch.outputs.phase == 'design' && states.work.outputs.turn.result.response.work_kind
          == 'explanation' && 'answer.md' in outputs.documents
        payload:
          disposition: unchanged
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: direction
        when: states.dispatch.outputs.phase == 'design'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: rebase
        when: states.dispatch.outputs.phase == 'implement'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: specialists
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    design_next:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
      sequence: []
      transitions:
      - to: design_context
        when: true
        payload:
          phase: design
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      outputs:
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
    test_next:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
      sequence: []
      transitions:
      - to: dispatch
        when: true
        payload:
          phase: test-plan
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          session: {}
      outputs:
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
    implementation_next:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
      sequence: []
      transitions:
      - to: dispatch
        when: true
        payload:
          phase: implement
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          session: {}
      outputs:
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
    coordinate:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        requests: ${{ transition.payload.requests }}
        consultation_recipe: ${{ inputs.consultation_recipe }}
        build_recipe: ${{ inputs.build_recipe }}
        create_recipe: ${{ inputs.create_recipe }}
        phase: ${{ states.dispatch.outputs.phase }}
        session: ${{ states.record.outputs.session }}
        root_cell: ${{ states.start.outputs.root_cell }}
        root_ref: ${{ states.start.outputs.root_ref }}
        history: "${{ (state_exists('coordinate') ? jq(states.coordinate.runs.map(r,r.outputs.records) + [states.coordinate.outputs.records],'add')
          : []) + (state_exists('work') ? jq(states.work.runs.map(r,r.outputs.child_results) + [states.work.outputs.child_results],'add').map(r,{'action':'await','job_id':r.job_id,'result':r})
          : []) + (state_exists('wait_children') ? jq(states.wait_children.runs.map(r,r.outputs.results) + [states.wait_children.outputs.results],'add').map(r,{'action':'await','job_id':r.job_id,'result':r})
          : []) }}"
        prefix: ${{ states.dispatch.outputs.request_prefix }}
      sequence:
      - id: coordinate
        include: ./coordinate.yaml
        inputs:
          phase: ${{ inputs.phase }}
          session: ${{ inputs.session }}
          documents: ${{ inputs.documents }}
          annotations: ${{ inputs.annotations }}
          root_cell: ${{ inputs.root_cell }}
          root_ref: ${{ inputs.root_ref }}
          consultation_recipe: ${{ inputs.consultation_recipe }}
          build_recipe: ${{ inputs.build_recipe }}
          create_recipe: ${{ inputs.create_recipe }}
          requests: ${{ inputs.requests }}
          history: ${{ inputs.history }}
          prefix: ${{ inputs.prefix }}
      outputs:
        valid: ${{ sequence.coordinate.outputs.valid }}
        session: ${{ sequence.coordinate.outputs.session }}
        documents: ${{
          jq([sequence.coordinate.outputs.documents,sequence.coordinate.outputs.restored_documents,sequence.coordinate.outputs.rejected_documents],'add')
          }}
        annotations: ${{ sequence.coordinate.outputs.annotations }}
        records: ${{ sequence.coordinate.outputs.records }}
        issues: ${{ sequence.coordinate.outputs.issues }}
        restored_documents: ${{ sequence.coordinate.outputs.restored_documents }}
        review_receipts: ${{ sequence.coordinate.outputs.review_receipts }}
      transitions:
      - to: repair
        when: '!outputs.valid'
        payload:
          turn: ${{
            jq([states.work.outputs.turn,{'result':jq([states.work.outputs.turn.result,{'session':outputs.session}],'add'),
            'documents':jq([states.work.outputs.turn.documents,outputs.restored_documents],'add'),
            'repair_documents':jq([states.work.outputs.turn.?repair_documents.orValue({}),outputs.restored_documents],'add'),
            'artifacts':jq([states.work.outputs.turn.artifacts,outputs.restored_documents],'add')}], 'add') }}
          issues: ${{ outputs.issues }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: recover_work
        when: "outputs.records.exists(r,r.action == 'create' ? !r.ready : r.action == 'await' && (r.result.status
