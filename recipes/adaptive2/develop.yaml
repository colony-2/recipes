          evidence_documents: ${{ inputs.agent_artifacts }}
          guidance: ${{ inputs.guidance }}
      outputs:
        documents: ${{ jq([sequence.review.outputs.documents,sequence.prior_approval.outputs.documents],'add')
          }}
        annotations: ${{ inputs.annotations + sequence.review.outputs.annotations }}
        approved: ${{ sequence.review.outputs.approved }}
        response: ${{ sequence.review.outputs.response }}
        commit_message: ${{
          jq([sequence.review.outputs.response.subject,sequence.review.outputs.response.summary,inputs.candidate.job_url],
          'join([10,10] | implode)') }}
      transitions:
      - to: accept
        when: outputs.approved
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') &&
          states.verify.outputs.agent_artifacts.exists(k, failure.message.contains('"' + k + '"'))
        to: dispatch
        payload:
          documents: ${{ transition.payload.documents }}
          annotations: ${{ transition.payload.annotations }}
          evidence_documents: "${{ {'error/artifact-binding.md': {'kind':'value','name':'error/artifact-binding.md','format':'text','value':failure.message
            + '\\nThe evidence could not be read. Repair or rerun the producing check; missing evidence is not success.'}
            } }}"
    rebase:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        merge_chases: "${{ (size(jq((state_exists('questions') ? states.questions.runs.map(r,r.outputs.response.receipt)
          + [states.questions.outputs.response.receipt] : []) + (state_exists('direction') ? states.direction.runs.map(r,r.outputs.response.receipt)
          + [states.direction.outputs.response.receipt] : []) + (state_exists('accept') ? states.accept.runs.map(r,r.outputs.response.receipt)
          + [states.accept.outputs.response.receipt] : []) + (state_exists('packages') ? states.packages.runs.map(r,r.outputs.review_receipts)
          + [states.packages.outputs.review_receipts] : []) + (state_exists('coordinate') ? states.coordinate.runs.map(r,r.outputs.review_receipts)
          + [states.coordinate.outputs.review_receipts] : []), 'flatten | map(select(.submission_id? != null)) |
          unique_by(.request_id, .submission_id)')) == state_output('rebase','human_round',0) ? state_output('rebase','merge_chases',inputs.prior_merge_chases)
          : 0) + (transition.from == 'merge' ? 1 : 0) }}"
        human_round: "${{ size(jq((state_exists('questions') ? states.questions.runs.map(r,r.outputs.response.receipt)
          + [states.questions.outputs.response.receipt] : []) + (state_exists('direction') ? states.direction.runs.map(r,r.outputs.response.receipt)
          + [states.direction.outputs.response.receipt] : []) + (state_exists('accept') ? states.accept.runs.map(r,r.outputs.response.receipt)
          + [states.accept.outputs.response.receipt] : []) + (state_exists('packages') ? states.packages.runs.map(r,r.outputs.review_receipts)
          + [states.packages.outputs.review_receipts] : []) + (state_exists('coordinate') ? states.coordinate.runs.map(r,r.outputs.review_receipts)
          + [states.coordinate.outputs.review_receipts] : []), 'flatten | map(select(.submission_id? != null)) |
          unique_by(.request_id, .submission_id)')) }}"
      sequence:
      - id: resolve_upstream_head
        op: command_execution
        const: true
