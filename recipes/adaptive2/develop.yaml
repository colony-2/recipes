        human_round: "${{ size(jq((state_exists('questions') ? states.questions.runs.map(r,r.outputs.response.receipt)
          + [states.questions.outputs.response.receipt] : []) + (state_exists('direction') ? states.direction.runs.map(r,r.outputs.response.receipt)
          + [states.direction.outputs.response.receipt] : []) + (state_exists('accept') ? states.accept.runs.map(r,r.outputs.response.receipt)
          + [states.accept.outputs.response.receipt] : []) + (state_exists('packages') ? states.packages.runs.map(r,r.outputs.review_receipts)
          + [states.packages.outputs.review_receipts] : []) + (state_exists('coordinate') ? states.coordinate.runs.map(r,r.outputs.review_receipts)
          + [states.coordinate.outputs.review_receipts] : []), 'flatten | map(select(.submission_id? != null)) |
          unique_by(.request_id, .submission_id)')) }}"
        previous_human_round: ${{ state_output('assessment','human_round',-1) }}
      sequence:
      - id: prior_approval
