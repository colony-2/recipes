            type: file_upload
            question: ${{ sequence.prompts.outputs.human.accept.annotations_question }}
            required: false
          overview: merge-review.md
          brief: ${{ inputs.documents['merge-review.md'] }}
          required_documents: ${{
            ['test-statements.md','test-results.md','assessment.md','implementation.md','merge-candidate.diff','merge-candidate.json']
            + inputs.artifact_refs.map(k,k) + sequence.prior_approval.outputs.documents.map(k,k) }}
      - id: feedback
        include: ../adaptive/feedback-documents.yaml
        inputs:
          fields: ${{ sequence.outcome_review.outputs.response.fields }}
          documents: ${{ sequence.outcome_review.outputs.response.?artifact_refs.orValue({}) }}
      outputs:
        candidate: ${{ inputs.candidate }}
        review: ${{ inputs.documents['merge-review.md'] }}
        candidate_diff: ${{ inputs.candidate_diff }}
        candidate_inventory: ${{ inputs.candidate_inventory }}
        documents: ${{
          jq([inputs.documents,sequence.outcome_review.outputs.response.?artifact_refs.orValue({}),sequence.feedback.outputs.documents],
          'add') }}
        annotations: ${{ inputs.annotations }}
        response: ${{ sequence.outcome_review.outputs.response }}
        changed: ${{ sequence.outcome_review.outputs.changed }}
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          disposition: cancelled
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: stopped
        when: outputs.response.fields.decision == 'accept' && !outputs.changed &&
          size(states.prepare.outputs.candidate.files) == 0 && states.verify.outputs.allowed &&
          states.assessment.outputs.approved
        payload:
          disposition: unchanged
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: merge
        when: outputs.response.fields.decision == 'accept' && !outputs.changed &&
          size(states.prepare.outputs.candidate.files) > 0 && states.verify.outputs.allowed &&
          states.assessment.outputs.approved
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: outputs.changed
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          assignment: feedback
      - to: accept
        when: true
        payload:
          review_hint: ${{ states.prompts.outputs.human.revision_hint }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    merge:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        base: ${{ context.git.execution.base_hash }}
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ inputs.settings_artifact }}
        commit_message: ${{ states.accounting.outputs.commit_message }}
        artifact_refs: ${{ states.verify.outputs.artifact_refs }}
      sequence:
      - id: squash_reviewed_candidate
        op: squash
        inputs:
          author: ${{ context.git.?author.orValue('') }}
          commit_message: ${{ inputs.commit_message }}
      - id: merge_reviewed_candidate
        op: merge
        retry:
          maximum_attempts: 1
        inputs:
          repo_path: ${{ context.environment.op.worktree_path }}
          upstream_repo: ${{ context.git.repo }}
          upstream_branch: ${{ context.git.ref }}
      - id: publish
        include: ../adaptive/hook-publish.yaml
        workspace:
          cell: ${{ context.workflow.cell }}
          ref: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        inputs:
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          documents: ${{ jq([inputs.documents, inputs.artifact_refs], 'add') }}
          settings: ${{ inputs.settings }}
          merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
          target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
          base: ${{ inputs.base }}
        catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              result: ${{
                {'status':'failed','ok':false,'summary':failure.message,'failure':json_parse(json_stringify(failure))}
                }}
              artifact_refs: {}
      outputs:
        documents: ${{ jq([inputs.documents,sequence.publish.outputs.artifact_refs], 'add') }}
        annotations: ${{ inputs.annotations }}
        publication: ${{ sequence.publish.outputs.result }}
        merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
      transitions:
      - to: reject_invalid_build_request
        when: outputs.publication.status == 'failed'
        payload:
          reason: "${{ 'Merge succeeded but publication failed: ' + outputs.publication.summary }}"
      retry:
        maximum_attempts: 1
      catch:
      - id: chase_advanced_upstream
        when: "failure.kind == 'task_error' && failure.code == 'MERGE_UPSTREAM_ADVANCED' && failure.node.op == 'merge'
          && failure.node.id == 'merge_reviewed_candidate' && (size(jq((state_exists('questions') ? states.questions.runs.map(r,r.outputs.response.receipt)
          + [states.questions.outputs.response.receipt] : []) + (state_exists('direction') ? states.direction.runs.map(r,r.outputs.response.receipt)
          + [states.direction.outputs.response.receipt] : []) + (state_exists('accept') ? states.accept.runs.map(r,r.outputs.response.receipt)
          + [states.accept.outputs.response.receipt] : []) + (state_exists('packages') ? states.packages.runs.map(r,r.outputs.review_receipts)
          + [states.packages.outputs.review_receipts] : []) + (state_exists('coordinate') ? states.coordinate.runs.map(r,r.outputs.review_receipts)
          + [states.coordinate.outputs.review_receipts] : []), 'flatten | map(select(.submission_id? != null)) |
          unique_by(.request_id, .submission_id)')) > state_output('rebase','human_round',0) || state_output('rebase','merge_chases',inputs.prior_merge_chases)
          < 3)"
        to: rebase
        payload:
          documents: ${{ transition.payload.documents }}
          annotations: ${{ transition.payload.annotations }}
    stopped:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        disposition: ${{ transition.payload.disposition }}
      sequence: []
      outputs:
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
        disposition: ${{ inputs.disposition }}
    reject_invalid_build_request:
      id: reject_invalid_build_request
      op: command_execution
      inputs:
        run: exit 1
      catch:
      - when: true
        fail:
          code: BUILD_REJECTED
          message: ${{ transition.payload.reason }}
    repair:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        turn: ${{ transition.payload.turn }}
        issues: ${{ transition.payload.issues }}
        session: ${{ states.dispatch.outputs.session }}
        assignment: ${{ states.dispatch.outputs.assignment }}
        base_documents: ${{ states.dispatch.outputs.base_documents }}
        repair_attempts: ${{ states.dispatch.outputs.repair_attempts }}
      sequence:
      - id: errors
        include: ../adaptive/error-documents.yaml
        inputs:
          name: response-corrections.md
          summary: ${{ jq(inputs.issues,'map("- " + .) | join("\n")') }}
      outputs:
        session: ${{ inputs.turn.result.?session.orValue(inputs.session) }}
        documents: ${{
          jq([inputs.documents,inputs.turn.documents,inputs.turn.?repair_documents.orValue({}),{'error/previous-response.json':{'kind':'value','name':'error/previous-response.json','format':'json','value':inputs.turn.result.?response.orValue({})}
          }], 'add') }}
        base_documents: "${{ inputs.assignment == 'repair' ? inputs.base_documents : inputs.documents }}"
        error_documents: ${{ sequence.errors.outputs.documents }}
        retained_artifacts: ${{ inputs.turn.artifacts }}
        attempts: ${{ inputs.repair_attempts + 1 }}
        annotations: ${{ inputs.annotations }}
        issues: ${{ inputs.issues }}
      transitions:
      - to: response_repair_exhausted
        when: outputs.attempts > 2
        payload:
          assignment: repair
          session: ${{ outputs.session }}
          base_documents: ${{ outputs.base_documents }}
          evidence_documents: ${{ outputs.error_documents }}
          retained_artifacts: ${{ outputs.retained_artifacts }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          issues: ${{ outputs.issues }}
      - to: dispatch
        when: true
        payload:
          assignment: repair
          session: ${{ outputs.session }}
          base_documents: ${{ outputs.base_documents }}
          evidence_documents: ${{ outputs.error_documents }}
          retained_artifacts: ${{ outputs.retained_artifacts }}
          repair_attempts: ${{ outputs.attempts }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    intervention:
      include: ../adaptive/operational-failure.yaml
      inputs:
        reason: ${{ transition.payload.reason }}
        documents: ${{ transition.payload.documents }}
    packages:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        packages: ${{ states.work.outputs.turn.result.response.packages }}
        summary: ${{ states.work.outputs.turn.result.response.summary }}
        decisions: "${{ state_exists('packages') ? states.packages.runs.map(r,r.outputs.decision) + [states.packages.outputs.decision]
          : [] }}"
      sequence:
      - id: request
        include: ./packages.yaml
        inputs:
          packages: ${{ inputs.packages }}
          summary: ${{ inputs.summary }}
          decisions: ${{ inputs.decisions }}
      outputs:
        documents: "${{ jq([inputs.documents, sequence.request.outputs.?errors.orValue({}), {'feedback/packages.md':{'kind':'value','name':'feedback/packages.md','format':'text','value':sequence.request.outputs.feedback
          + '\\nJob: ' + sequence.request.outputs.job_id + '\\n' + sequence.request.outputs.review.?fields.orValue({}).?feedback.orValue('')}
          }], 'add') }}"
        annotations: ${{ inputs.annotations }}
        decision: ${{ sequence.request.outputs.decision }}
        errors: ${{ sequence.request.outputs.errors }}
        review_receipts: ${{ [sequence.request.outputs.review.?receipt.orValue({})] }}
      transitions:
      - to: dispatch
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          evidence_documents: ${{ outputs.errors }}
      catch:
      - when: failure.kind != 'cancellation'
        to: recover_work
        payload:
          reason: ${{ failure.message }}
          failure: ${{ json_parse(json_stringify(failure)) }}
          documents: ${{ states.record.outputs.documents }}
          annotations: ${{ states.record.outputs.annotations }}
    operational_failure:
      include: ../adaptive/operational-failure.yaml
      inputs:
        reason: ${{ transition.payload.reason }}
        documents: ${{ transition.payload.?documents.orValue({}) }}
        code: ${{ transition.payload.?code.orValue('ADAPTIVE_RECOVERY_REQUIRED') }}
    recover_work:
      inputs:
        reason: ${{ transition.payload.reason }}
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        candidate: "${{ context.git.hash != '' ? context.git.hash : context.git.resolved_hash }}"
        failure: ${{ transition.payload.?failure.orValue({}) }}
        previous_candidate: ${{ state_output('recover_work','candidate','') }}
        previous_attempts: ${{ state_output('recover_work','attempts',0) }}
        work_turn: "${{ state_exists('work') ? size(states.work.runs)+1 : 0 }}"
        previous_work_turn: ${{ state_output('recover_work','work_turn',-1) }}
        human_round: "${{ size(jq((state_exists('questions') ? states.questions.runs.map(r,r.outputs.response.receipt)
          + [states.questions.outputs.response.receipt] : []) + (state_exists('direction') ? states.direction.runs.map(r,r.outputs.response.receipt)
          + [states.direction.outputs.response.receipt] : []) + (state_exists('accept') ? states.accept.runs.map(r,r.outputs.response.receipt)
          + [states.accept.outputs.response.receipt] : []) + (state_exists('packages') ? states.packages.runs.map(r,r.outputs.review_receipts)
          + [states.packages.outputs.review_receipts] : []) + (state_exists('coordinate') ? states.coordinate.runs.map(r,r.outputs.review_receipts)
          + [states.coordinate.outputs.review_receipts] : []), 'flatten | map(select(.submission_id? != null)) |
          unique_by(.request_id, .submission_id)')) }}"
        previous_human_round: ${{ state_output('recover_work','human_round',-1) }}
      sequence:
      - id: errors
        include: ../adaptive/error-documents.yaml
        inputs:
          summary: ${{ inputs.reason }}
          failure: ${{ inputs.failure }}
      outputs:
        reason: ${{ inputs.reason }}
        candidate: ${{ inputs.candidate }}
        attempts: '${{ inputs.human_round == inputs.previous_human_round && inputs.work_turn == inputs.previous_work_turn+1
          && inputs.previous_candidate == inputs.candidate ? inputs.previous_attempts+1 : 1 }}'
        documents: ${{
          jq([inputs.documents,sequence.errors.outputs.documents,{'feedback/recovery.md':{'kind':'value','name':'feedback/recovery.md','format':'text','value':inputs.reason}
          }],'add') }}
        annotations: ${{ inputs.annotations }}
        work_turn: ${{ inputs.work_turn }}
        human_round: ${{ inputs.human_round }}
      transitions:
      - to: operational_failure
        when: outputs.attempts > 3
        payload:
          reason: ${{ 'Three correction turns did not resolve the blocker. ' + outputs.reason }}
          documents: ${{ outputs.documents }}
          code: ADAPTIVE_OPERATIONAL_RECOVERY_EXHAUSTED
      - to: dispatch
        when: true
        payload:
          assignment: recovery
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    scheduling:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        jobs: ${{ transition.payload.jobs }}
        summary: ${{ states.work.outputs.turn.result.response.summary }}
      sequence:
      - id: intent
        include: ./scheduling.yaml
        inputs:
          summary: ${{ inputs.summary }}
      outputs:
        decision: ${{ sequence.intent.outputs.decision }}
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
        jobs: ${{ inputs.jobs }}
      transitions:
      - to: wait_children
        when: outputs.decision == 'wait'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          jobs: ${{ outputs.jobs }}
      - to: dispatch
        when: outputs.decision == 'continue'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: repair
        when: true
        payload:
          turn: ${{ states.work.outputs.turn }}
          issues:
          - State the concrete independent action for continue, or return wait when only child results remain.
            The scheduling intent could not be determined.
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    wait_children:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        jobs: ${{ transition.payload.jobs }}
      sequence:
      - id: children
        include: ../adaptive/child-results.yaml
        inputs:
          jobs: ${{ {'job_ids':inputs.jobs} }}
          allowed: true
          wait: true
      outputs:
        results: ${{ sequence.children.outputs.results }}
        pending: ${{ sequence.children.outputs.pending }}
        failed: ${{ sequence.children.outputs.failed ||
          sequence.children.outputs.results.exists(r,r.?outputs.orValue({}).?disposition.orValue('') in
          ['incomplete','blocked']) }}
        documents: ${{ jq([inputs.documents,sequence.children.outputs.documents],'add') }}
        annotations: ${{ inputs.annotations }}
      transitions:
      - to: recover_work
        when: outputs.failed
        payload:
          reason: A child did not finish its assignment. Inspect its outputs, correct the handoff, and request
            a fresh attempt when useful.
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    direction:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        title: ${{ states.work.outputs.turn.result.response.review_title }}
        work_kind: ${{ states.work.outputs.turn.result.response.work_kind }}
        summary: ${{ states.work.outputs.turn.result.response.summary }}
      sequence:
      - id: prompts
        include: ./prompts.yaml
      - id: review
        include: ./review.yaml
        inputs:
          title: ${{ inputs.title }}
          summary: ${{ inputs.summary }}
          documents: ${{ inputs.documents }}
          annotations: ${{ inputs.annotations }}
          overview: one-pager.md
          brief: ${{ inputs.documents['one-pager.md'] }}
          required_documents:
          - request.md
          fields: ${{ sequence.prompts.outputs.human.direction_fields }}
      - id: feedback
        include: ../adaptive/feedback-documents.yaml
        inputs:
          fields: ${{ sequence.review.outputs.response.fields }}
          documents: ${{ sequence.review.outputs.response.?artifact_refs.orValue({}) }}
      outputs:
        response: ${{ sequence.review.outputs.response }}
        changed: ${{ sequence.review.outputs.changed }}
        one_pager: ${{ inputs.documents['one-pager.md'] }}
        work_kind: ${{ inputs.work_kind }}
        title: ${{ inputs.title }}
        annotations: ${{ inputs.annotations }}
        documents: ${{ jq([inputs.documents, sequence.feedback.outputs.documents,
          sequence.review.outputs.response.?artifact_refs.orValue({})], 'add') }}
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          disposition: cancelled
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: direction_approved
        when: outputs.response.fields.decision == 'accept' && !outputs.changed
      - to: dispatch
        when: outputs.changed
        payload:
          phase: design
          session: {}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: direction
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    direction_approved:
      sequence: []
      outputs:
        work_kind: ${{ inputs.work_kind }}
        one_pager: ${{ inputs.one_pager }}
        receipt: ${{ inputs.receipt }}
      transitions:
      - to: test_next
        when: true
        payload:
          documents: "${{ jq([states.direction.outputs.documents, {'approved-direction/one-pager.md': jq([states.direction.outputs.one_pager,
            {'name':'approved-direction/one-pager.md'}], 'add')}], 'add') }}"
          annotations: ${{ states.direction.outputs.annotations }}
      inputs:
        work_kind: ${{ states.direction.outputs.work_kind }}
        one_pager: ${{ states.direction.outputs.one_pager }}
        receipt: ${{ states.direction.outputs.response.?receipt.orValue({}) }}
    autonomous_limit:
      include: ../adaptive/operational-failure.yaml
      inputs:
        code: ADAPTIVE_AUTONOMOUS_LIMIT
        reason: ${{ 'The configured allowance of ' + string(inputs.max_iterations) + ' autonomous
          implementation turns was exhausted. No new human response was collected during this attempt. Inspect
          the retained work before continuing.' }}
        documents: ${{ transition.payload.documents }}
    response_repair_exhausted:
      include: ../adaptive/operational-failure.yaml
      inputs:
        code: ADAPTIVE_RESPONSE_REPAIR_EXHAUSTED
        reason: "${{ 'Two automatic response corrections did not resolve: ' + jq(transition.payload.issues,'join(\"\
          ; \")') }}"
        documents: ${{ jq([transition.payload.documents,transition.payload.evidence_documents],'add') }}
outputs:
  annotations: ${{
    state_output('merge','annotations',state_output('stopped','annotations',state_output('record','annotations',inputs.annotations)))
    }}
  merged: ${{ nonempty(state_output('merge','merged_hash','')) }}
  merged_hash: ${{ state_output('merge','merged_hash','') }}
  target_branch: ${{ state_output('merge','target_branch','') }}
  session: ${{ state_output('record','session',inputs.session) }}
  assistant_summary: ${{ state_output('work','turn.result.response.summary','') }}
  disposition: "${{ state_exists('merge') ? 'implemented' : state_output('stopped','disposition','incomplete') }}"
  result: ${{ state_output('work','turn.result.response',{}) }}
  artifact_refs: ${{
    jq([state_output('merge','documents',state_output('stopped','documents',state_output('record','documents',states.start.outputs.documents))),state_output('verify','artifact_refs',{})],
    'add') }}
  reviews: "${{ jq([state_exists('accept') ? {'outcome':states.accept.outputs.response.?receipt.orValue({})} : {},
    state_exists('direction_approved') ? {'direction':states.direction_approved.outputs.receipt} : {}], 'add') }}"
  verification: ${{ state_output('verify','result',{}) }}
  publication: ${{ state_output('merge','publication',{}) }}
  rebase_repairs: "${{ inputs.prior_rebase_repairs + (state_exists('rebase_repair') ? size(states.rebase_repair.runs)
    + 1 : 0) }}"
  coordination: "${{ (state_exists('coordinate') ? jq(states.coordinate.runs.map(r,r.outputs.records) + [states.coordinate.outputs.records],'add')
    : []) + (state_exists('work') ? jq(states.work.runs.map(r,r.outputs.child_results) + [states.work.outputs.child_results],'add').map(r,{'action':'await','job_id':r.job_id,'result':r})
    : []) + (state_exists('wait_children') ? jq(states.wait_children.runs.map(r,r.outputs.results) + [states.wait_children.outputs.results],'add').map(r,{'action':'await','job_id':r.job_id,'result':r})
    : []) }}"
  work_kind: ${{
    state_output('direction_approved','work_kind',state_output('work','turn.result.response.work_kind','')) }}
