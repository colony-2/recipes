        inputs:
          role: assessment
          request: ${{ inputs.request }}
          documents: ${{ jq([inputs.documents,sequence.prior_approval.outputs.documents],'add') }}
          evidence_documents: ${{ inputs.agent_artifacts }}
          guidance: ${{ inputs.guidance }}
      outputs:
        documents: ${{ sequence.assess.outputs.documents }}
        annotations: ${{ inputs.annotations + sequence.assess.outputs.annotations }}
        approved: ${{ sequence.assess.outputs.approved }}
        response: ${{ sequence.assess.outputs.response }}
        candidate: ${{ inputs.candidate }}
        next: ${{ sequence.assess.outputs.next }}
        previous_candidate: "${{ inputs.human_round == inputs.previous_human_round ? inputs.previous_candidate :
          '' }}"
        human_round: ${{ inputs.human_round }}
      transitions:
      - to: dispatch
        when: outputs.next == 'intervention' && outputs.previous_candidate != outputs.candidate.head
        payload:
          assignment: feedback
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: recover_work
        when: '!outputs.approved && outputs.previous_candidate == outputs.candidate.head'
        payload:
          reason: Assessment remains unapproved without a candidate change. Resolve the missing evidence,
