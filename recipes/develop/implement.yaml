id: development-implement
version: 0.4.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  mode:
    type: string
    default_value: build
  feedback:
    type: string
    default_value: ''
  context_json:
    type: string
    default_value: '{}'
  evidence_json:
    type: string
    default_value: '{}'
  dependency_history_json:
    type: string
    default_value: '{}'
  consultation_history_json:
    type: string
    default_value: '{}'
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
  review_response_json:
    type: string
    default_value: '{}'
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  mode: ${{ inputs.mode }}
  feedback: ${{ inputs.feedback }}
  context_json: ${{ inputs.context_json }}
  evidence_json: ${{ inputs.evidence_json }}
  dependency_history_json: ${{ inputs.dependency_history_json }}
  consultation_history_json: ${{ inputs.consultation_history_json }}
  session: ${{ inputs.?session.orValue(null) }}
  review_response_json: ${{ inputs.review_response_json }}
vars:
  result_schema:
    type: object
    additionalProperties: false
    required:
    - summary
    - next
    properties:
      summary:
        type: string
        pattern: \S
      next:
        enum:
        - review
        - continue
        - consult
        - ask_user
        - redesign
      consultation:
        type: object
        additionalProperties: false
        required:
        - cell
        - message
        properties:
          cell:
            type: string
            pattern: \S
          message:
            type: string
            pattern: \S
          ref:
            type: string
            pattern: \S
    allOf:
    - if:
        properties:
          next:
            const: consult
      then:
        required:
        - consultation
      else:
        not:
          required:
          - consultation
sequence:
- id: agent
  inputs:
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    mode: ${{ inputs.mode }}
    feedback: ${{ inputs.feedback }}
    context_json: ${{ inputs.context_json }}
    evidence_json: ${{ inputs.evidence_json }}
    dependency_history_json: ${{ inputs.dependency_history_json }}
    consultation_history_json: ${{ inputs.consultation_history_json }}
    session: ${{ inputs.?session.orValue(null) }}
    review_response_json: ${{ inputs.review_response_json }}
    instructions: |-
      Implement the human-approved design and maintained .c2j/test-plan.md. Read the approved design from the inbox. Preserve the test expectations; use Git history from the job's starting revision to identify removed or weakened expectations and unauthorized mandate changes. Describe concerns to the reviewer; do not create a baseline ledger.
      If new external work emerges, use next=consult with consultation {cell,message,ref?}. Continue the conversation in separate sessions. Use next=redesign before submitting work outside the approved design. Submit approved prerequisite work with its agreed Markdown brief; no handoff IDs or certificates are required.
      Write implementation.md in the outbox with the changes, outcomes, tests performed and remaining limitations. Keep this summary out of the repository. Maintain the test plan in the repo; if expectations need to change, request redesign and explain the deprecation plan.
      Provide a build.sh verification hook in the target directory when appropriate, or preserve the project's specialized verification op. Use next=review when ready for inspection, ask_user for a blocked decision, continue to keep working, or redesign for changed requirements.
    result_schema_json: ${{ json_stringify(vars.result_schema) }}
    allow_child_jobs: true
    document: implementation.md
    document_key: implement
  state:
    initial:
    - to: resume
      when: inputs.session != null
    - to: fresh
      when: true
    states:
      fresh:
        include: ./phase.yaml
        inputs:
          prompt: ${{ inputs.prompt }}
          target_directory: ${{ inputs.target_directory }}
          mode: ${{ inputs.mode }}
          feedback: ${{ inputs.feedback }}
          context_json: ${{ inputs.context_json }}
          evidence_json: ${{ inputs.evidence_json }}
          dependency_history_json: ${{ inputs.dependency_history_json }}
          consultation_history_json: ${{ inputs.consultation_history_json }}
          review_response_json: ${{ inputs.review_response_json }}
          instructions: ${{ inputs.instructions }}
          result_schema_json: ${{ inputs.result_schema_json }}
          allow_child_jobs: ${{ inputs.allow_child_jobs }}
          document: ${{ inputs.document }}
          document_key: ${{ inputs.document_key }}
      resume:
        include: ./phase.yaml
        inputs:
          prompt: ${{ inputs.prompt }}
          target_directory: ${{ inputs.target_directory }}
          mode: ${{ inputs.mode }}
          feedback: ${{ inputs.feedback }}
          context_json: ${{ inputs.context_json }}
          evidence_json: ${{ inputs.evidence_json }}
          dependency_history_json: ${{ inputs.dependency_history_json }}
          consultation_history_json: ${{ inputs.consultation_history_json }}
          review_response_json: ${{ inputs.review_response_json }}
          instructions: ${{ inputs.instructions }}
          result_schema_json: ${{ inputs.result_schema_json }}
          allow_child_jobs: ${{ inputs.allow_child_jobs }}
          document: ${{ inputs.document }}
          document_key: ${{ inputs.document_key }}
          session: ${{ inputs.session }}
  outputs:
    result: '${{ state_exists("resume") ? states.resume.outputs.result : states.fresh.outputs.result }}'
    session_id: '${{ state_exists("resume") ? states.resume.outputs.session_id : states.fresh.outputs.session_id
      }}'
    completed: '${{ state_exists("resume") ? states.resume.outputs.completed : states.fresh.outputs.completed }}'
    dependencies: '${{ state_exists("resume") ? states.resume.outputs.dependencies : states.fresh.outputs.dependencies
      }}'
    session: '${{ state_exists("resume") ? states.resume.outputs.session : states.fresh.outputs.session }}'
    artifact_refs: '${{ state_exists("resume") ? states.resume.outputs.artifact_refs : states.fresh.outputs.artifact_refs
      }}'
    valid: '${{ state_exists("resume") ? states.resume.outputs.valid : states.fresh.outputs.valid }}'
    consultations: '${{ state_exists("resume") ? states.resume.outputs.consultations : states.fresh.outputs.consultations
      }}'
    review_response: '${{ state_exists("resume") ? states.resume.outputs.review_response : states.fresh.outputs.review_response
      }}'
    review_documents: '${{ state_exists("resume") ? states.resume.outputs.review_documents : states.fresh.outputs.review_documents
      }}'
outputs:
  result: ${{ sequence.agent.outputs.result }}
  session_id: ${{ sequence.agent.outputs.session_id }}
  completed: ${{ sequence.agent.outputs.completed }}
  dependencies: ${{ sequence.agent.outputs.dependencies }}
  session: ${{ sequence.agent.outputs.session }}
  artifact_refs: ${{ sequence.agent.outputs.artifact_refs }}
  valid: ${{ sequence.agent.outputs.valid }}
  consultations: ${{ sequence.agent.outputs.consultations }}
  review_response: ${{ sequence.agent.outputs.review_response }}
  review_documents: ${{ sequence.agent.outputs.review_documents }}
