id: development-implement
version: 0.3.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  mode:
    type: string
    default_value: build
  feedback:
    type: string
    default_value: ''
  context_json:
    type: string
    default_value: '{}'
  evidence_json:
    type: string
    default_value: '{}'
  dependency_history_json:
    type: string
    default_value: '{}'
  consultation_history_json:
    type: string
    default_value: '{}'
  additional_consultation_history_json:
    type: string
    default_value: '{}'
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
  review_response_json:
    type: string
    default_value: '{}'
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  mode: ${{ inputs.mode }}
  feedback: ${{ inputs.feedback }}
  context_json: ${{ inputs.context_json }}
  evidence_json: ${{ inputs.evidence_json }}
  dependency_history_json: ${{ inputs.dependency_history_json }}
  consultation_history_json: ${{ inputs.consultation_history_json }}
  additional_consultation_history_json: ${{ inputs.additional_consultation_history_json }}
  session: ${{ inputs.?session.orValue(null) }}
  review_response_json: ${{ inputs.review_response_json }}
vars:
  result_schema:
    type: object
    additionalProperties: false
    required:
    - status
    - summary
    - blocking_issues
    - questions
    - changes
    - statement_tests
    - consultation
    - proposed_handoffs
    properties:
      status:
        type: string
        enum:
        - ready
        - revise
        - needs_input
        - redesign
      summary: &id001
        type: string
        pattern: \S
      blocking_issues:
        type: array
        items: *id001
        minItems: 0
      questions:
        type: array
        items: *id001
        minItems: 0
      changes:
        type: array
        items: *id001
        minItems: 0
      statement_tests:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - statement_id
          - files
          properties:
            statement_id: *id001
            files:
              type: array
              items: *id001
              minItems: 1
        minItems: 1
      consultation:
        anyOf:
        - type: 'null'
        - type: object
          additionalProperties: false
          required:
          - thread_id
          - cell
          - ref
          - message
          properties:
            thread_id: &id002
              type: string
              pattern: \S
            cell: *id002
            ref: *id002
            message: *id002
      proposed_handoffs:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - thread_id
          - cell
          - mode
          - outcome_ids
          - design_markdown
          properties:
            thread_id: &id003
              type: string
              pattern: \S
            cell: *id003
            mode:
              enum:
              - build
              - evolve
            outcome_ids:
              type: array
              items: *id003
            design_markdown: *id003
outputs:
  valid: ${{ state_output("agent", "valid", false) && state_exists("contract") }}
  completed: ${{ state_output("agent", "completed", false) }}
  session_id: ${{ state_output("agent", "session_id", "") }}
  dependencies: ${{ state_output("agent", "dependencies", {}) }}
  result: ${{ json_parse(state_output("contract", "stdout", "{}")).?result.orValue({}) }}
  consultations: ${{ json_parse(state_output("record", "stdout", json_stringify(states.history.outputs.history)))
    }}
  session: ${{ state_output("agent", "session", null) }}
  review_response: ${{ json_parse(inputs.review_response_json) }}
  review_documents: '${{ state_exists("contract") ? {"implement": states.contract.artifacts["implementation.md"]} : {} }}'
state:
  initial: history
  states:
    history:
      include: ./consultation-history.yaml
      inputs:
        history_json: ${{ inputs.consultation_history_json }}
        additional_json: ${{ inputs.additional_consultation_history_json }}
      transitions:
      - to: agent
        when: true
    agent:
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ inputs.feedback }}
        context_json: ${{ inputs.context_json }}
        evidence_json: ${{ inputs.evidence_json }}
        instructions: |
          Implement the approved design and test plan provided in context_json. Write the tests and implementation. Map every approved test statement to test files in statement_tests. Preserve approved expectations; changes to existing expectations require the deprecation process. Address supplied review feedback. The current approved design and test plan supersede prior feedback when requirements have changed. Remain in the same implementation session on revision. Implement only locally owned requirements. Submit the approved design.handoffs to their owning cells before declaring ready, carrying the refined design and consultation provenance as the child request. Track each handoff against the dependency ledger to avoid duplicate submissions. Do not implement external outcomes here. New or changed external work requires returning to design approval. Return status redesign when a new dependency, changed handoff, or changed requirement needs design approval; explain the necessary decision in questions.
          At any time, including after discovering a dependency bug or missing feature, set consultation to
          {thread_id,cell,ref,message} to discuss it with a separate agent in the owning cell. Supply reproduction
          evidence and interface expectations in the message. You need not return to design merely to ask a question.
          Consultations from earlier phases appear in context.consultations. Reuse the same thread ID, cell and original
          ref to continue that pinned session, or use a new thread for another cell or a fresh revision. Your local edits,
          implementation session and dependency ledger survive each consultation. Never send your session checkpoint to B.
          Use a schema-valid needs_input result while requesting consultation; do not submit new work during that turn.
          After feedback, set consultation null. If an existing interface or local fix meets the approved design, continue
          implementation without redesign. If external code must change, return proposed_handoffs containing the exact
          latest agreed B design, mode, thread ID, cell and outcome IDs (empty for newly discovered supporting work).
          The recipe returns such new work to design approval before submission. Unresolved B questions may be answered
          through another turn; disagreement may yield needs_input or redesign with an explanation. Do not hide missing
          external work by returning ready. The consultation limit is eight foreign turns per implementation pass.
        result_schema_json: ${{ json_stringify(vars.result_schema) }}
        writable: true
        dependency_history_json: ${{ json_stringify(state_output("agent", "dependencies", json_parse(inputs.dependency_history_json)))
          }}
        consultation_history_json: ${{ state_output("record", "stdout", json_stringify(states.history.outputs.history))
          }}
        session: ${{ state_output("agent", "session", inputs.session) }}
      state:
        initial:
        - to: resume
          when: inputs.session != null
        - to: fresh
          when: true
        states:
          fresh:
            include: ./agent.yaml
            inputs: &id004
              prompt: ${{ inputs.prompt }}
              target_directory: ${{ inputs.target_directory }}
              mode: ${{ inputs.mode }}
              feedback: ${{ inputs.feedback }}
              context_json: ${{ inputs.context_json }}
              evidence_json: ${{ inputs.evidence_json }}
              instructions: ${{ inputs.instructions }}
              result_schema_json: ${{ inputs.result_schema_json }}
              writable: ${{ inputs.writable }}
              dependency_history_json: ${{ inputs.dependency_history_json }}
              consultation_history_json: ${{ inputs.consultation_history_json }}
          resume:
            include: ./agent.yaml
            inputs:
              <<: *id004
              session: ${{ inputs.session }}
      outputs:
        valid: '${{ state_exists("resume") ? states.resume.outputs.valid : states.fresh.outputs.valid }}'
        result: '${{ state_exists("resume") ? states.resume.outputs.result : states.fresh.outputs.result }}'
        session_id: '${{ state_exists("resume") ? states.resume.outputs.session_id : states.fresh.outputs.session_id
          }}'
        completed: '${{ state_exists("resume") ? states.resume.outputs.completed : states.fresh.outputs.completed
          }}'
        dependencies: '${{ state_exists("resume") ? states.resume.outputs.dependencies : states.fresh.outputs.dependencies
          }}'
        session: '${{ state_exists("resume") ? states.resume.outputs.session : states.fresh.outputs.session }}'
      transitions:
      - to: contract
        when: outputs.valid
    contract:
      op: command_execution
      inputs:
        timeout: 10s
        env:
          RESULT_JSON: ${{ json_stringify(states.agent.outputs.result) }}
          CONTEXT_JSON: ${{ inputs.context_json }}
          HISTORY_JSON: ${{ state_output("record", "stdout", json_stringify(states.history.outputs.history)) }}
          INITIAL_HISTORY_JSON: ${{ json_stringify(states.history.outputs.history) }}
          SESSION: ${{ json_stringify(states.agent.outputs.session) }}
          OUTBOX: '{{ context.environment.op.outbox }}'
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib
          r=json.loads(os.environ['RESULT_JSON']); context=json.loads(os.environ['CONTEXT_JSON']); history=json.loads(os.environ['HISTORY_JSON'])
          request=r['consultation']; selection={}
          if request:
              if not json.loads(os.environ['SESSION']): raise ValueError('Consultation requires an originating session')
              thread=history.get(request['thread_id'])
              if thread and (thread['cell']!=request['cell'] or thread['ref']!=request['ref']): raise ValueError('Cannot retarget a consultation thread')
              if sum(len(t['turns']) for t in history.values())-sum(len(t['turns']) for t in json.loads(os.environ['INITIAL_HISTORY_JSON']).values())>=8:
                  r.update(status='needs_input',questions=r['questions']+['Consultation limit reached; resolve the open design decisions before continuing.'],consultation=None)
              else:
                  selection={**request,'workspace_ref':thread['commit'] if thread else request['ref'],'session':thread['session'] if thread else None,'session_id':thread['session_id'] if thread else ''}
          approved=context.get('design',{}).get('handoffs',[])
          new_work=False
          for handoff in r['proposed_handoffs']:
              thread=history.get(handoff['thread_id']); reply=thread['response'] if thread else {}
              if not thread or handoff['cell']!=thread['cell'] or reply.get('status')!='ready' or reply.get('fit')!='fits' or reply['questions'] or reply['blocking_issues'] or handoff['design_markdown']!=reply['design_markdown']: raise ValueError('Proposed handoff requires the latest agreed foreign design')
              fields=['thread_id','cell','mode','outcome_ids','design_markdown']
              if not any(all(handoff[k]==old[k] for k in fields) and old.get('provenance',{}).get('commit')==thread['commit'] for old in approved): new_work=True
              handoff['provenance']={'cell':thread['mandate']['cell'],'commit':thread['commit'],'mandate_sha256':thread['mandate']['sha256']}
          if new_work and not selection:
              r.update(status='redesign',questions=r['questions']+['Review the newly discovered external work and update the design/test plan before submission.'])
          if r['status']=='ready' and (r['questions'] or r['blocking_issues']): raise ValueError('Ready implementation has unresolved decisions')
          out=pathlib.Path(os.environ['OUTBOX']);(out/'proposed-handoffs.json').write_text(json.dumps(r['proposed_handoffs']));(out/'consultations.json').write_text(json.dumps(history))
          (out/'implementation.md').write_text('# Implementation\n\n'+r['summary']+'\n\n'+'\n'.join('- '+change for change in r['changes'])+'\n')
          print(json.dumps({'result':r,'selection':selection}))
          PYCODE
      transitions:
      - to: record
        when: size(json_parse(outputs.stdout).selection) > 0
    record:
      include: ./consultation-turn.yaml
      inputs:
        selection_json: ${{ json_stringify(json_parse(states.contract.outputs.stdout).selection) }}
        history_json: ${{ state_output("record", "stdout", json_stringify(states.history.outputs.history)) }}
      transitions:
      - to: agent
        when: true
