id: build-agent
version: 1.0.0
inputs:
  flow: ${{ inputs.flow }}
  documents: ${{ inputs.documents }}
vars:
  schema:
    type: object
    additionalProperties: false
    required:
    - next
    - summary
    - files
    - questions
    - consultations
    - keys
    properties:
      next:
        type: string
        enum:
        - continue
        - review
        - ask_user
        - consult
        - submit
        - blocked
        - redesign
        - outside
      summary:
        type: string
        minLength: 1
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - path
          - description
          properties:
            path:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
      questions:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - type
          - question
          - required
          - options
          properties:
            id:
              type: string
              minLength: 1
            type:
              type: string
              enum:
              - paragraph_text
              - short_answer
              - multiple_choice
              - checkboxes
            question:
              type: string
              minLength: 1
            required:
              type: boolean
            options:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - value
                - label
                properties:
                  value:
                    type: string
                  label:
                    type: string
      consultations:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - key
          - kind
          - cell
          - ref
          - request
          - role
          properties:
            key:
              type: string
              pattern: ^[a-zA-Z0-9_-]+$
            kind:
              type: string
              enum:
              - feature
              - create
              - expert
            cell:
              type: string
            ref:
              type: string
            request:
              type: string
              minLength: 1
            role:
              type: string
              minLength: 1
      keys:
        type: array
        items:
          type: string
          minLength: 1
  instructions: |
    A cell encompasses the entire repository. Read AGENTS.md and root PURPOSE.md if
    present; otherwise infer responsibilities from repository evidence and history.
    Missing purpose documentation is not a blocker or a reason to initialize a mandate.
    A target directory scopes the task, not cell membership. Discover dependencies
    through ordinary tooling; c2j cells lists relationships we may influence.
  phases:
    design: |
      Design the requested behavior. Inspect repository purpose and relevant interfaces.
      Write outbox/design.md describing scope, compatibility, alternatives, acceptance
      outcomes, and any external requests. Consult serving cells for proposed dependency
      changes and configured root for creation eligibility. Record agreed request keys
      in the design and return those keys with review. Include only prerequisites in
      this proposal; omit probes and rejected alternatives. Do not implement. Return review when the proposal is ready.
    test-plan: |
      Read the design and write outbox/test-statements.md before implementation.
      Use Markdown statements of at most 30 words, annotated with filenames, priority,
      unit/integration level and dependencies. Include positive and negative critical
      cases and meaningful integration boundaries. Preserve existing expectations;
      explain changes and deprecation plans. Do not implement. Return review when ready.
    implement: |
      Implement the approved design and test statements. Preserve their expectations;
      changed requirements or new external scope require redesign and renewed approval.
      Submit approved prerequisites through the submit route using their request keys.
      Implement useful independent work before blocked; list exactly which known keys
      must complete. Do not resubmit existing jobs. Consult newly created cells about
      feature work before submitting their builds. Creation alone does not build features.
      Maintain the repository's existing test plan where applicable. Run meaningful
      checks and provide build.sh in the target directory when appropriate. Write
      outbox/implementation.md with outcomes, tests, and limitations. Return review
      when ready for independent inspection and verification.
  prompt: |
    {{ inputs.flow.message }}
    Target directory: {{ inputs.flow.target_directory }}
    Read inbox/context.json for current request keys, approvals and job outcomes.
    Relevant documents and human feedback are in inbox. Only listed outbox files are
    exchanged. Use consult for new dialogue, submit for approved prerequisite work,
    and blocked only after independent work is exhausted. ask_user requests
    clarification with focused questions; files may be empty.
    Ask before producing deliverables when needed. Optional documents are welcome;
    review requires the current phase's document.
  setup: |
    During a build, design and define test expectations before implementation. Work
    within approved scope. Do not commit, push, merge, or submit jobs yourself:
    recipes own those actions. Request consultation before changes in a serving cell,
    and root eligibility before creating cells. Use distinct stable keys for distinct
    requests. Continue all independent local work and consultations before blocked.
    Use the workflow's supplied output schema; put substantial explanations in files.
    Ask focused questions alongside review assets; avoid JSON dumps and dummy choices.
    Annotations request changes and another review, never implicit approval.
sequence:
- id: turn
  include: ../kernel/agent-turn.yaml
  inputs:
    prompt: >-
      ${{ (inputs.flow.last_phase == '' && size(inputs.flow.session) > 0 ? vars.setup + '\n' : '') + (inputs.flow.phase
      != inputs.flow.last_phase ? vars.phases[inputs.flow.phase] + '\n' : '') + vars.prompt }}
    instructions: ${{ vars.instructions + '\n\n' + vars.setup }}
    schema: ${{ vars.schema }}
    session: ${{ inputs.flow.session }}
    documents: ${{ inputs.documents }}
    read_only: ${{ inputs.flow.phase != 'implement' || has(inputs.flow.repair_base_documents) }}
    retained_artifacts: ${{ inputs.flow.?repair_artifacts.orValue({}) }}
outputs:
  turn: ${{ sequence.turn.outputs }}
