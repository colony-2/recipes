id: develop
version: 1.0.0
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  session: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  prior_dependencies: ${{ inputs.?prior_dependencies.orValue({}) }}
  prior_consultations: ${{ inputs.?prior_consultations.orValue({}) }}
state:
  initial: discover_root_cell
  states:
    discover_root_cell:
      id: discover_root_cell
      op: command_execution
      const: true
      inputs:
        run: |
          if [ -f .c2/config.yaml ] && command -v c2j >/dev/null 2>&1; then
            c2j self --json
          else
            printf '{}'
          fi
      transitions:
      - to: start
        when: true
    start:
      inputs:
        request: ${{ inputs.prompt }}
        directory: ${{ inputs.target_directory }}
        session: ${{ inputs.session }}
        documents: >-
          ${{ jq([json_parse(json_stringify(context.artifacts)), inputs.documents], 'add | with_entries(select(.key
          != "__git_state_thin_pack__" and .key != "diff_from_parent.diff" and .key != "diff_from_base.diff"))')
          }}
        root_cell: >-
          ${{ inputs.root_cell != '' ? inputs.root_cell : json_parse(states.discover_root_cell.outputs.stdout).?root_repo.orValue('')
          }}
        root_ref: >-
          ${{ inputs.root_ref != '' ? inputs.root_ref : json_parse(states.discover_root_cell.outputs.stdout).?root_ref.orValue('main')
          }}
        consultation_recipe: ${{ inputs.consultation_recipe }}
        build_recipe: ${{ inputs.build_recipe }}
        create_recipe: ${{ inputs.create_recipe }}
        prior_dependencies: ${{ inputs.prior_dependencies }}
        prior_consultations: ${{ inputs.prior_consultations }}
      sequence: []
      outputs:
        valid: >-
          ${{ nonempty(inputs.directory) && !inputs.directory.startsWith('/') && !inputs.directory.matches('(^|/)[.][.](/|$)')
          }}
        flow: >-
          ${{ {'phase': 'design', 'last_phase': '', 'message': inputs.request, 'request': inputs.request, 'target_directory':
          inputs.directory, 'session': inputs.session, 'documents': inputs.documents, 'threads': inputs.prior_consultations,
          'jobs': inputs.prior_dependencies,
          'approved': [], 'plan_keys': [], 'reviews': {}, 'root_cell': inputs.root_cell, 'root_ref': inputs.root_ref,
          'consultation_recipe': inputs.consultation_recipe, 'build_recipe': inputs.build_recipe, 'create_recipe':
          inputs.create_recipe} }}
      transitions:
      - to: reject_invalid_build_request
        when: '!outputs.valid'
        payload:
          reason: Target directory must be a nonempty repository-relative path without parent traversal.
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    work:
      inputs:
        flow: ${{ jq(transition.payload.flow, 'del(.review_hint)') }}
      sequence:
      - id: write_build_context
        op: command_execution
        const: true
        inputs:
          env:
            OUTBOX: ${{ context.environment.op.outbox }}
            CONTEXT: ${{ json_stringify(jq(inputs.flow, 'del(.session, .documents, .result)')) }}
          run: |
            printf '%s\n' "$CONTEXT" > "$OUTBOX/context.json"
      - id: agent
        include: ./agent.yaml
        inputs:
          flow: ${{ inputs.flow }}
          documents: >-
            ${{ jq([inputs.flow.documents, {'context.json': sequence.write_build_context.artifacts['context.json']}], 'add')
            }}
      outputs:
        flow: ${{ inputs.flow }}
        turn: ${{ sequence.agent.outputs.turn }}
      transitions:
      - to: record
        when: true
    record:
      inputs:
        previous: ${{ states.work.outputs.flow }}
        turn: ${{ states.work.outputs.turn }}
      sequence: []
      outputs:
        valid: ${{ size(vars.issues) == 0 }}
        flow: |-
          ${{ inputs.turn.result.?output_schema_valid.orValue(false) ? (jq([inputs.previous, {
           'repair_attempts': 0, 'repair_artifacts': {}, 'session': inputs.turn.result.?session.orValue(inputs.previous.session),
           'last_phase': inputs.previous.phase,
           'plan_keys': inputs.previous.phase == 'design' && inputs.turn.result.?response.orValue({}).?next.orValue('') == 'review' ? inputs.turn.result.response.keys : inputs.previous.plan_keys,
           'result': inputs.turn.result.?response.orValue({}),
           'documents': jq([inputs.previous.?repair_base_documents.orValue(inputs.previous.documents),
             jq({'files': inputs.turn.result.?response.orValue({}).?files.orValue([]), 'artifacts': inputs.turn.artifacts},
                '. as $v | $v.files | map(select(.path as $p | $v.artifacts | has($p)) | {key: .path, value: $v.artifacts[.path]}) | from_entries')], 'add')}], 'add | del(.repair_base_documents)')) : inputs.previous }}
        issues: ${{ vars.issues }}
        turn: ${{ inputs.turn }}
        previous: ${{ inputs.previous }}
      transitions:
      - to: reject_invalid_build_request
        when: '!outputs.valid && (outputs.turn.result.?status.orValue(''failed'') != ''completed'' || size(outputs.turn.jobs.?job_ids.orValue([]))
          > 0)'
        payload:
          reason: ${{ jq(outputs.issues, 'join("; ")') }}
      - to: repair
        when: '!outputs.valid'
        payload:
          flow: '${{ jq([outputs.previous, {''last_phase'': outputs.previous.phase}], ''add'') }}'
          turn: ${{ outputs.turn }}
          issues: ${{ outputs.issues }}
      - to: stopped
        when: outputs.flow.result.next == 'outside'
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''outside''}], ''add'') }}'
      - to: design_next
        when: outputs.flow.result.next == 'redesign'
        payload:
          flow: ${{ outputs.flow }}
      - to: questions
        when: outputs.flow.result.next == 'ask_user'
        payload:
          flow: ${{ outputs.flow }}
      - to: coordinate
        when: outputs.flow.result.next in ['consult', 'submit', 'blocked']
        payload:
          action: ${{ outputs.flow.result.next }}
          requests: ${{ outputs.flow.result.consultations }}
          keys: ${{ outputs.flow.result.keys }}
          flow: ${{ outputs.flow }}
      - to: work
        when: outputs.flow.result.next == 'continue'
        payload:
          flow: '${{ jq([outputs.flow, {''message'': ''Continue the current phase.''}], ''add'') }}'
      - to: coordinate
        when: outputs.flow.threads.exists(k, outputs.flow.threads[k].status == 'running') || outputs.flow.jobs.exists(k,
          outputs.flow.jobs[k].status == 'running')
        payload:
          action: ${{ 'blocked' }}
          requests: ${{ [] }}
          keys: >-
            ${{ jq([outputs.flow.threads, outputs.flow.jobs], 'add | to_entries | map(select(.value.status == "running")
            | .key)') }}
          flow: ${{ outputs.flow }}
      - to: repair
        when: 'outputs.flow.phase == ''implement'' && !outputs.flow.approved.all(k, k in outputs.flow.jobs && outputs.flow.jobs[k].status
          == ''completed'' && (outputs.flow.jobs[k].kind == ''create'' ? outputs.flow.jobs[k].result.?disposition.orValue('''')
          == ''created'' : (outputs.flow.jobs[k].result.?merged.orValue(false) || outputs.flow.jobs[k].result.?disposition.orValue('''') in [''delegated'', ''unchanged''])))'
        payload:
          flow: ${{ outputs.previous }}
          turn: ${{ outputs.turn }}
          issues: >-
            ${{ ['Prerequisite gate rejected this result. Review context.json: plan keys must have serving-cell
            agreement; implementation review requires every approved dependency to have completed successfully.']
            }}
      - to: repair
        when: |-
          outputs.flow.phase in ['design', 'test-plan'] && !outputs.flow.plan_keys.all(k,
            k in outputs.flow.threads && outputs.flow.threads[k].request.kind != 'expert'
            && outputs.flow.threads[k].?result.orValue({}).?outcome.orValue('') == 'agreed')
        payload:
          flow: ${{ outputs.previous }}
          turn: ${{ outputs.turn }}
          issues: >-
            ${{ ["Design prerequisite keys must identify this build's agreed non-expert serving requests in context.json. "
            + "Parent request identifiers are not local prerequisites. Return keys: [] when none are needed. "
            + (outputs.flow.phase == 'design' ? "Correct the design review response before advancing to test-plan."
            : "Return next: redesign to correct the design's prerequisite list before requesting test-plan review again.")] }}
      - to: test_next
        when: outputs.flow.phase == 'design'
        payload:
          flow: ${{ outputs.flow }}
      - to: rebase
        when: outputs.flow.phase == 'implement'
        payload:
          flow: ${{ outputs.flow }}
      - to: assessment
        when: true
        payload:
          flow: ${{ outputs.flow }}
      vars:
        issues: |-
          ${{ (states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'ask_user' ? [] : states.work.outputs.turn.?issues.orValue([]))
           + (states.work.outputs.turn.result.?status.orValue('failed') != 'completed' ? ['Agent did not complete: ' + states.work.outputs.turn.result.?errorMessage.orValue('No completed response.')] : [])
           + (!states.work.outputs.turn.result.?output_schema_valid.orValue(false) ? ['The operation did not produce a schema-valid response. Correct the response using the supplied schema.'] : [])
           + (states.work.outputs.turn.result.?session.orValue(null) == null ? ['The response has no resumable session checkpoint.'] : [])
           + (size(states.work.outputs.turn.jobs.?job_ids.orValue([])) > 0 ? ['The agent submitted jobs directly; stop and review these effects before continuing.'] : [])
           + (states.work.outputs.turn.result.?status.orValue('failed') == 'completed' && states.work.outputs.turn.result.?output_schema_valid.orValue(false) ?
              (states.work.outputs.turn.result.response.next != 'ask_user' && states.work.outputs.turn.result.response.files.exists(f, f.path.startsWith('/') || f.path.contains('..') || f.path.contains('\\') || f.path in ['context.json', 'feedback.json', '__git_state_thin_pack__']) ? ['Select only safe deliverable artifact names, excluding workflow control files.'] : [])
            + (states.work.outputs.turn.result.response.next != 'ask_user' && size(states.work.outputs.turn.result.response.files.map(f, f.path)) != size(jq(states.work.outputs.turn.result.response.files, 'map(.path) | unique')) ? ['List each resolved artifact only once.'] : [])
            + (states.work.outputs.turn.result.response.next == 'review' && !states.work.outputs.turn.result.response.files.exists(f, f.path == {'design': 'design.md', 'test-plan': 'test-statements.md', 'implement': 'implementation.md'}[states.work.outputs.flow.phase]) ? ['Review requires ' + {'design': 'design.md', 'test-plan': 'test-statements.md', 'implement': 'implementation.md'}[states.work.outputs.flow.phase] + ' in the returned files.'] : [])
            + (states.work.outputs.turn.result.response.next == 'ask_user' && (size(states.work.outputs.turn.result.response.questions) == 0 || states.work.outputs.turn.result.response.questions.exists(q, q.id == 'annotations')) ? ['ask_user requires focused questions; annotations is a reserved question id.'] : [])
            + (states.work.outputs.turn.result.response.next == 'consult' && size(states.work.outputs.turn.result.response.consultations) == 0 ? ['consult requires at least one consultation request.'] : [])
            + (states.work.outputs.turn.result.response.next in ['blocked', 'submit'] && size(states.work.outputs.turn.result.response.keys) == 0 ? ['blocked and submit require explicit prerequisite keys.'] : [])
           : []) }}
    design_next:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: >-
          ${{ jq([inputs.flow, {'phase': 'design', 'approved': [], 'message': 'Revise the design and scope; previous
          approval is no longer current.'}], 'add') }}
      transitions:
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    test_next:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: >-
          ${{ jq([inputs.flow, {'phase': 'test-plan', 'approved': [], 'message': 'Define test statements for this
          design.'}], 'add') }}
      transitions:
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    coordinate:
      inputs:
        flow: ${{ transition.payload.flow }}
        action: ${{ transition.payload.action }}
        requests: ${{ transition.payload.requests }}
        keys: ${{ transition.payload.keys }}
      sequence:
      - id: coordinate
        include: ./coordinate.yaml
        inputs:
          flow: ${{ inputs.flow }}
          action: ${{ inputs.action }}
          requests: ${{ inputs.requests }}
          keys: ${{ inputs.keys }}
      outputs:
        valid: ${{ sequence.coordinate.outputs.valid }}
        flow: >-
          ${{ jq([sequence.coordinate.outputs.flow, {'message': 'Coordination state changed. Read context.json and
          new evidence; continue independent work before waiting.'}], 'add') }}
      transitions:
      - to: repair
        when: '!outputs.valid'
        payload:
          flow: >-
            ${{ jq([outputs.flow, {'repair_attempts': states.work.outputs.flow.?repair_attempts.orValue(0), 'repair_base_documents':
            states.work.outputs.flow.?repair_base_documents.orValue(states.work.outputs.flow.documents)}], 'add')
            }}
          turn: >-
            ${{ jq([states.work.outputs.turn, {'result': jq([states.work.outputs.turn.result, {'session': outputs.flow.session}],
            'add')}], 'add') }}
          issues: >-
            ${{ ['Coordination rejected the requested keys or action. Use known request keys, consult before submission,
            and submit only agreed prerequisites explicitly approved for implementation. Do not resubmit jobs already
            recorded in context.json.'] }}
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    questions:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: review
        include: ../kernel/review.yaml
        inputs:
          title: Clarify the current build
          documents: ${{ inputs.flow.documents }}
          fields: >-
            ${{ inputs.flow.result.questions + [{'id': 'annotations', 'type': 'file_upload', 'question': 'Optional
            supporting documents or annotations.', 'required': false}] }}
      outputs:
        flow: >-
          ${{ jq([inputs.flow, {'documents': jq([inputs.flow.documents, sequence.review.outputs.documents], 'add'),
          'message': 'Read feedback.json and the attachments, then continue the phase that asked these questions.'}],
          'add') }}
      transitions:
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    assessment:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: consult
        include: ../kernel/consultation.yaml
        inputs:
          thread: '${{ inputs.flow.phase == ''test-plan'' ? ''plan-assessment'' : ''outcome-assessment'' }}'
          request: >-
            ${{ inputs.flow.phase == 'test-plan' ? 'Independently assess the proposed design and test statements
            before human approval.' : 'Independently inspect the implemented candidate against the approved design,
            test statements, and quality requirements.' }}
          consultant_role: |
            Inspect the current candidate and bound evidence in this repository. Evaluate
            purpose, approved scope, compatibility, correctness, test coverage, and preserved
            expectations. For planning assess feasible test statements before implementation;
            for completed work inspect code and tests for missing behavior and regressions.
            Publish a concise review document with concrete findings. Report assessment=pass
            only when no blocking issues remain; otherwise assessment=revise. Agreement on
            findings does not make the candidate pass. Consult the requester to resolve
            questions; request human deconfliction when needed. Do not edit the repository.
          requester_session: ${{ inputs.flow.session }}
          documents: ${{ inputs.flow.documents }}
      outputs:
        result: ${{ sequence.consult.outputs }}
        flow: >-
          ${{ jq([inputs.flow, {'session': sequence.consult.outputs.requester_session, 'documents': jq([inputs.flow.documents,
          sequence.consult.outputs.final_artifacts], 'add'), 'message': sequence.consult.outputs.state.message,
          'assessment': sequence.consult.outputs.assessment}], 'add') }}
      transitions:
      - to: reject_invalid_build_request
        when: outputs.result.outcome in ['failed', 'needs_review']
        payload:
          reason: >-
            ${{ outputs.result.report_error != '' ? outputs.result.report_error
              : outputs.result.state.?error.orValue('Independent assessment did not complete.') }}
      - to: approval
        when: outputs.result.outcome == 'agreed' && outputs.result.assessment == 'pass' && outputs.flow.phase ==
          'test-plan'
        payload:
          flow: ${{ outputs.flow }}
      - to: verify
        when: outputs.result.outcome == 'agreed' && outputs.result.assessment == 'pass'
        payload:
          flow: ${{ outputs.flow }}
      - to: design_next
        when: outputs.flow.phase == 'test-plan'
        payload:
          flow: ${{ outputs.flow }}
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    approval:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: plan_review
        include: ../kernel/review.yaml
        inputs:
          title: Review design and test statements
          documents: ${{ inputs.flow.documents }}
          fields:
          - id: decision
            type: multiple_choice
            question: Approve this design and test plan before implementation and the listed prerequisite jobs?
            required: true
            options:
            - value: approve
              label: Approve
            - value: revise
              label: Request changes
            - value: cancel
              label: Cancel
          - id: feedback
            type: paragraph_text
            question: >-
              ${{ inputs.flow.?review_hint.orValue('Requested changes or guidance (required when requesting changes).')
              }}
            required: false
          - id: annotations
            type: file_upload
            question: Optional annotated documents; uploads request revision and another review.
            required: false
      outputs:
        response: ${{ sequence.plan_review.outputs.response }}
        changed: ${{ sequence.plan_review.outputs.changed }}
        flow: >-
          ${{ jq([inputs.flow, {'documents': jq([inputs.flow.documents, sequence.plan_review.outputs.documents],
          'add'), 'reviews': jq([inputs.flow.reviews, {'plan': sequence.plan_review.outputs.response.?receipt.orValue({})}],
          'add')}], 'add') }}
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''cancelled''}], ''add'') }}'
      - to: implementation_next
        when: outputs.response.fields.decision == 'approve' && !outputs.changed
        payload:
          flow: ${{ outputs.flow }}
      - to: design_next
        when: outputs.changed
        payload:
          flow: >-
            ${{ jq([outputs.flow, {'message': 'Read feedback.json and revise the design and tests for another review.'}],
            'add') }}
      - to: approval
        when: true
        payload:
          flow: >-
            ${{ jq([outputs.flow, {'review_hint': 'Please describe the requested changes or attach annotated documents
            before requesting revision.'}], 'add') }}
    implementation_next:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: >-
          ${{ jq([inputs.flow, {'phase': 'implement', 'message': 'The design and test statements are approved. Implement
          them; submit agreed approved prerequisites as needed.', 'approved': inputs.flow.plan_keys}], 'add') }}
      transitions:
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    rebase:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: resolve_upstream_head
        op: command_execution
        const: true
        inputs:
          env:
            REPO: ${{ context.git.repo }}
            BRANCH: ${{ context.git.ref }}
          run: |
            set -eu
            git ls-remote --exit-code -- "$REPO" "refs/heads/${BRANCH#refs/heads/}"
      - id: rebase_candidate
        op: rebase
        inputs:
          target_base_hash: ${{ jq(sequence.resolve_upstream_head.outputs.stdout, 'split("\t")[0]') }}
      outputs:
        flow: ${{ inputs.flow }}
      transitions:
      - to: assessment
        when: true
        payload:
          flow: ${{ outputs.flow }}
    verify:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: verify
        include: ./verify.yaml
        inputs:
          target_directory: ${{ inputs.flow.target_directory }}
      outputs:
        ok: ${{ sequence.verify.outputs.result.status in ['passed', 'skipped'] }}
        flow: >-
          ${{ jq([inputs.flow, {'verification': sequence.verify.outputs.evidence, 'documents': jq([inputs.flow.documents,
          sequence.verify.outputs.artifact_refs], 'add'), 'message': 'Verification did not pass. Read verification.md
          and build.log, resolve the issue, and request inspection again.'}], 'add') }}
      transitions:
      - to: accounting
        when: outputs.ok
        payload:
          flow: ${{ outputs.flow }}
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    accounting:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: review
        include: ./merge-review.yaml
        inputs:
          request: ${{ inputs.flow.request }}
          documents: ${{ inputs.flow.documents }}
      outputs:
        approved: ${{ sequence.review.outputs.approved }}
        flow: >-
          ${{ jq([inputs.flow, {'commit_message': sequence.review.outputs.commit_message,
          'documents': jq([inputs.flow.documents, sequence.review.outputs.documents], 'add'),
          'message': 'The independent file accounting requested revision. Read merge-review.md, correct the inappropriate changes, and request inspection again.'}], 'add') }}
      transitions:
      - to: accept
        when: outputs.approved
        payload:
          flow: ${{ outputs.flow }}
      - to: work
        when: true
        payload:
          flow: ${{ outputs.flow }}
    accept:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: outcome_review
        include: ../kernel/review.yaml
        inputs:
          title: Review outcome, verification evidence, and file accounting
          documents: ${{ inputs.flow.documents }}
          fields:
          - id: decision
            type: multiple_choice
            question: Accept the file accounting, reported verification status, and proposed commit message in merge-review.md, and merge this candidate into the target branch?
            required: true
            options:
            - value: accept
              label: Accept and merge
            - value: revise
              label: Revise implementation
            - value: redesign
              label: Change requirements or design
            - value: cancel
              label: Cancel
          - id: feedback
            type: paragraph_text
            question: >-
              ${{ inputs.flow.?review_hint.orValue('Requested changes or guidance (required when requesting changes).')
              }}
            required: false
          - id: annotations
            type: file_upload
            question: Optional annotated documents; uploads request revision and another review.
            required: false
      outputs:
        response: ${{ sequence.outcome_review.outputs.response }}
        changed: ${{ sequence.outcome_review.outputs.changed }}
        flow: >-
          ${{ jq([inputs.flow, {'documents': jq([inputs.flow.documents, sequence.outcome_review.outputs.documents],
          'add'), 'reviews': jq([inputs.flow.reviews, {'outcome': sequence.outcome_review.outputs.response.?receipt.orValue({})}],
          'add'), 'message': 'Read feedback.json and attachments, revise the implementation, and request inspection
          again.'}], 'add') }}
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''cancelled''}], ''add'') }}'
      - to: merge
        when: outputs.response.fields.decision == 'accept' && !outputs.changed && outputs.flow.verification.status
          in ['passed', 'skipped'] && outputs.flow.assessment == 'pass'
        payload:
          flow: ${{ outputs.flow }}
      - to: design_next
        when: outputs.response.fields.decision == 'redesign' && outputs.changed
        payload:
          flow: ${{ outputs.flow }}
      - to: work
        when: outputs.changed
        payload:
          flow: ${{ outputs.flow }}
      - to: accept
        when: true
        payload:
          flow: >-
            ${{ jq([outputs.flow, {'review_hint': 'Please describe the requested changes or attach annotated documents
            before requesting revision.'}], 'add') }}
    merge:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: squash_reviewed_candidate
        op: squash
        inputs:
          author: ${{ context.git.?author.orValue('') }}
          commit_message: ${{ inputs.flow.commit_message }}
      - id: merge_reviewed_candidate
        op: merge
        inputs:
          repo_path: ${{ context.environment.op.worktree_path }}
          upstream_repo: ${{ context.git.repo }}
          upstream_branch: ${{ context.git.ref }}
      outputs:
        flow: '${{ jq([inputs.flow, {''disposition'': ''implemented''}], ''add'') }}'
        merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
    stopped:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: ${{ inputs.flow }}
    # Only semantic rejections reach this state. Execution errors propagate directly.
    # c2j currently has no standalone fail node; classify this deliberate rejection
    # with catch.fail so the terminal diagnostic is the rejection reason.
    reject_invalid_build_request:
      id: reject_invalid_build_request
      op: command_execution
      inputs:
        run: exit 1
      catch:
      - when: true
        fail:
          code: BUILD_REJECTED
          message: ${{ transition.payload.reason }}
    repair:
      inputs:
        flow: ${{ transition.payload.flow }}
        turn: ${{ transition.payload.turn }}
        issues: ${{ transition.payload.issues }}
      sequence:
      - id: repair
        include: ../kernel/repair.yaml
        inputs:
          turn: ${{ inputs.turn }}
          issues: ${{ inputs.issues }}
          documents: ${{ inputs.flow.documents }}
          session: ${{ inputs.flow.session }}
          attempts: ${{ inputs.flow.?repair_attempts.orValue(0) }}
      outputs:
        retry: ${{ sequence.repair.outputs.retry }}
        flow: >-
          ${{ jq([inputs.flow, {'last_phase': size(sequence.repair.outputs.session) > 0 ? inputs.flow.phase : '',
          'result': inputs.turn.result.?response.orValue(inputs.flow.?result.orValue({})), 'session': sequence.repair.outputs.session,
          'documents': sequence.repair.outputs.documents, 'repair_base_documents': inputs.flow.?repair_base_documents.orValue(inputs.flow.documents),
          'repair_artifacts': sequence.repair.outputs.artifacts, 'repair_attempts': sequence.repair.outputs.attempts,
          'message': sequence.repair.outputs.prompt}], 'add') }}
      transitions:
      - to: work
        when: outputs.retry
        payload:
          flow: ${{ outputs.flow }}
      - to: stopped
        when: true
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''cancelled''}], ''add'') }}'
outputs:
  merged: ${{ nonempty(state_output('merge', 'merged_hash', '')) }}
  merged_hash: ${{ state_output('merge', 'merged_hash', '') }}
  target_branch: ${{ state_output('merge', 'target_branch', '') }}
  session: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).session
    }}
  assistant_summary: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).result.?summary.orValue('')
    }}
  disposition: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).?disposition.orValue('incomplete')
    }}
  result: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).result
    }}
  artifact_refs: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).documents
    }}
  consultations: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).threads
    }}
  dependencies: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).jobs
    }}
  reviews: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).reviews
    }}
  verification: >-
    ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).?verification.orValue({})
    }}
