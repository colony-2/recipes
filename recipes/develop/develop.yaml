id: develop
version: 0.3.0
input_schema:
  prompt:
    type: string
    required: true
  mode:
    type: string
    default_value: build
  target_directory:
    type: string
    default_value: .
inputs:
  prompt: ${{ inputs.prompt }}
  mode: ${{ inputs.mode }}
  target_directory: ${{ inputs.target_directory }}
state:
  initial: prepare
  states:
    prepare:
      op: command_execution
      inputs:
        timeout: 10s
        env:
          TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
        run: |
          mkdir -p "$TARGET"
      transitions:
      - to: design
        when: true
    design:
      include: ./agent.yaml
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ transition.payload.?review.orValue({}).?fields.orValue({}).?feedback.orValue("") }}
        context_json: ${{ '{"design":' + json_stringify(state_output("design", "result", {})) + ',"design_review":'
          + json_stringify(state_output("design_review", "result", {})) + ',"test_plan":' + json_stringify(state_output("test_plan",
          "result", {})) + ',"test_review":' + json_stringify(state_output("test_review", "result", {})) + ',"implementation":'
          + json_stringify(state_output("implementation", "result", {})) + '}' }}
        evidence_json: '${{ json_stringify(jq(json_parse(''['' + json_stringify(state_exists("verify") ? states.verify.outputs.artifact_refs
          : context.artifacts) + "," + json_stringify(state_output("design", "review_documents", {})) + "," + json_stringify(state_output("test_plan",
          "review_documents", {})) + "," + json_stringify(state_output("implementation", "review_documents", {}))
          + "," + json_stringify((transition.payload.?review.orValue({})).?artifact_refs.orValue({})) + '']''),
          ".[4] as $uploads | .[0:4] | add | with_entries(.key = .value.name) | . + ($uploads | with_entries(.key
          = (\"review/\" + .key) | .value.name = .key))")) }}'
        dependency_history_json: ${{ json_stringify(state_output("design", "dependencies", {})) }}
        consultation_history_json: ${{ json_stringify(transition.payload.?consultations.orValue(state_output("design",
          "consultations", {}))) }}
        review_response_json: ${{ json_stringify(transition.payload.?review.orValue({})) }}
        phase: design
      transitions:
      - to: outside
        when: outputs.valid && outputs.completed && outputs.result.next == "outside"
      - to: design_review
        when: outputs.valid && outputs.completed && outputs.result.next == "review"
      - to: failed
        when: '!outputs.valid'
      - to: plan_feedback
        when: true
        payload:
          consultations: ${{ state_output("design", "consultations", {}) }}
    design_review:
      include: ./agent.yaml
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ states.design.outputs.review_response.?fields.orValue({}).?feedback.orValue("") }}
        context_json: ${{ '{"design":' + json_stringify(state_output("design", "result", {})) + '}' }}
        evidence_json: '${{ json_stringify(jq(json_parse(''['' + json_stringify(state_exists("verify") ? states.verify.outputs.artifact_refs
          : context.artifacts) + "," + json_stringify(state_output("design", "review_documents", {})) + "," + json_stringify(state_output("test_plan",
          "review_documents", {})) + "," + json_stringify(state_output("implementation", "review_documents", {}))
          + "," + json_stringify((states.design.outputs.review_response).?artifact_refs.orValue({})) + '']''), ".[4]
          as $uploads | .[0:4] | add | with_entries(.key = .value.name) | . + ($uploads | with_entries(.key = (\"review/\"
          + .key) | .value.name = .key))")) }}'
        dependency_history_json: ${{ json_stringify(state_output("design_review", "dependencies", {})) }}
        phase: review-design
      transitions:
      - to: test_plan
        when: outputs.valid && outputs.completed && outputs.result.next == "done"
      - to: failed
        when: '!outputs.valid'
      - to: plan_feedback
        when: true
        payload:
          consultations: ${{ state_output("design", "consultations", {}) }}
    test_plan:
      include: ./agent.yaml
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ states.design.outputs.review_response.?fields.orValue({}).?feedback.orValue("") }}
        context_json: ${{ '{"design":' + json_stringify(state_output("design", "result", {})) + '}' }}
        evidence_json: '${{ json_stringify(jq(json_parse(''['' + json_stringify(state_exists("verify") ? states.verify.outputs.artifact_refs
          : context.artifacts) + "," + json_stringify(state_output("design", "review_documents", {})) + "," + json_stringify(state_output("test_plan",
          "review_documents", {})) + "," + json_stringify(state_output("implementation", "review_documents", {}))
          + "," + json_stringify((states.design.outputs.review_response).?artifact_refs.orValue({})) + '']''), ".[4]
          as $uploads | .[0:4] | add | with_entries(.key = .value.name) | . + ($uploads | with_entries(.key = (\"review/\"
          + .key) | .value.name = .key))")) }}'
        dependency_history_json: ${{ json_stringify(state_output("test_plan", "dependencies", {})) }}
        phase: test-plan
      transitions:
      - to: test_review
        when: outputs.valid && outputs.completed && outputs.result.next == "review"
      - to: plan_feedback
        when: true
        payload:
          consultations: ${{ state_output("design", "consultations", {}) }}
    test_review:
      include: ./agent.yaml
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ states.design.outputs.review_response.?fields.orValue({}).?feedback.orValue("") }}
        context_json: ${{ '{"design":' + json_stringify(state_output("design", "result", {})) + ',"test_plan":'
          + json_stringify(state_output("test_plan", "result", {})) + '}' }}
        evidence_json: '${{ json_stringify(jq(json_parse(''['' + json_stringify(state_exists("verify") ? states.verify.outputs.artifact_refs
          : context.artifacts) + "," + json_stringify(state_output("design", "review_documents", {})) + "," + json_stringify(state_output("test_plan",
          "review_documents", {})) + "," + json_stringify(state_output("implementation", "review_documents", {}))
          + "," + json_stringify((states.design.outputs.review_response).?artifact_refs.orValue({})) + '']''), ".[4]
          as $uploads | .[0:4] | add | with_entries(.key = .value.name) | . + ($uploads | with_entries(.key = (\"review/\"
          + .key) | .value.name = .key))")) }}'
        dependency_history_json: ${{ json_stringify(state_output("test_review", "dependencies", {})) }}
        phase: review-test-plan
      transitions:
      - to: approve_plan
        when: outputs.valid && outputs.completed && outputs.result.next == "done"
      - to: failed
        when: '!outputs.valid'
      - to: plan_feedback
        when: true
        payload:
          consultations: ${{ state_output("design", "consultations", {}) }}
    approve_plan:
      op: input
      inputs:
        form:
          kind: review
          title: Approve design and test plan
          documents: ${{ jq(json_parse('[' + json_stringify(state_output("design", "review_documents", {})) + ","
            + json_stringify(state_output("test_plan", "review_documents", {})) + ']'), "add") }}
          fields:
          - id: decision
            type: multiple_choice
            question: |-
              {{ vars.scope_explanation }}

              Mode: {{ inputs.mode }}; target: {{ inputs.target_directory }}

              ${{ states.design.outputs.result.summary }}

              Review the attached design and test statements before implementation.

              How should we proceed? Uploaded edits require another revision and review.
            required: true
            options:
            - value: approve
              label: Approve design and test plan
            - value: revise
              label: Revise the plan
          - &id001
            id: feedback
            type: paragraph_text
            question: Feedback or answers to open questions. Select a revision decision to request changes.
          - &id002
            id: annotated_design
            type: file_upload
            question: Optional annotated design (Markdown may include CriticMarkup).
          - &id003
            id: annotated_test_statements
            type: file_upload
            question: Optional annotated test statements.
      transitions:
      - to: implementation
        when: outputs.fields.decision == "approve" && size(outputs.?artifact_refs.orValue({})) == 0
        payload:
          review: ${{ outputs }}
          consultations: ${{ state_output("design", "consultations", {}) }}
      - to: design
        when: outputs.fields.decision in ["approve", "revise"] && (outputs.fields.?feedback.orValue("").matches("[^[:space:]]")
          || size(outputs.?artifact_refs.orValue({})) > 0)
        payload:
          review: ${{ outputs }}
          consultations: ${{ state_output("design", "consultations", {}) }}
      - to: plan_feedback
        when: outputs.fields.decision == "revise"
        payload:
          consultations: ${{ state_output("design", "consultations", {}) }}
      - to: approve_plan
        when: true
    plan_feedback:
      op: input
      inputs:
        form:
          kind: review
          title: Design or test-plan feedback
          documents: ${{ jq(json_parse('[' + json_stringify(state_output("design", "review_documents", {})) + ","
            + json_stringify(state_output("test_plan", "review_documents", {})) + ']'), "add") }}
          fields:
          - id: decision
            type: multiple_choice
            question: |-
              {{ vars.scope_explanation }}

              Resolve questions and review findings before implementation.

              Design:
              ${{ json_stringify(state_output("design", "result", {})) }}

              Design review:
              ${{ json_stringify(state_output("design_review", "result", {})) }}

              Test plan:
              ${{ json_stringify(state_output("test_plan", "result", {})) }}

              Test review:
              ${{ json_stringify(state_output("test_review", "result", {})) }}

              Implementation:
              ${{ json_stringify(state_output("implementation", "result", {})) }}

              What should change or what is the answer to the open questions?

              How should we proceed? Uploaded edits require another revision and review.
            required: true
            options:
            - value: revise
              label: Revise the plan
          - *id001
          - *id002
          - *id003
      transitions:
      - to: design
        when: outputs.fields.decision == "revise" && (outputs.fields.?feedback.orValue("").matches("[^[:space:]]")
          || size(outputs.?artifact_refs.orValue({})) > 0)
        payload:
          review: ${{ outputs }}
          consultations: ${{ transition.payload.?consultations.orValue(state_output("implementation", "consultations",
            state_output("design", "consultations", {}))) }}
      - to: plan_feedback
        when: true
        payload:
          consultations: ${{ transition.payload.?consultations.orValue(state_output("implementation", "consultations",
            state_output("design", "consultations", {}))) }}
    implementation:
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ transition.payload.?review.orValue({}).?fields.orValue({}).?feedback.orValue("") }}
        context_json: ${{ '{"previous_implementation":' + json_stringify(state_output("implementation", "result",
          {})) + ',"design":' + json_stringify(state_output("design", "result", {})) + ',"test_plan":' + json_stringify(state_output("test_plan",
          "result", {})) + ',"specification":' + json_stringify(state_output("specification", "result", {})) + ',"quality":'
          + json_stringify(state_output("quality", "result", {})) + ',"verify":' + json_stringify(state_output("verify",
          "result", {})) + '}' }}
        evidence_json: '${{ json_stringify(jq(json_parse(''['' + json_stringify(state_exists("verify") ? states.verify.outputs.artifact_refs
          : context.artifacts) + "," + json_stringify(state_output("design", "review_documents", {})) + "," + json_stringify(state_output("test_plan",
          "review_documents", {})) + "," + json_stringify(state_output("implementation", "review_documents", {}))
          + "," + json_stringify((transition.payload.?review.orValue({})).?artifact_refs.orValue({})) + '']''),
          ".[4] as $uploads | .[0:4] | add | with_entries(.key = .value.name) | . + ($uploads | with_entries(.key
          = (\"review/\" + .key) | .value.name = .key))")) }}'
        dependency_history_json: ${{ json_stringify(state_output("implementation", "dependencies", {})) }}
        consultation_history_json: ${{ json_stringify(transition.payload.?consultations.orValue(state_output("design",
          "consultations", {}))) }}
        session: ${{ state_output("implementation", "session", null) }}
        review_response_json: ${{ json_stringify(transition.payload.?review.orValue({})) }}
      state:
        initial:
        - to: resume
          when: inputs.session != null
        - to: fresh
          when: true
        states:
          fresh:
            include: ./agent.yaml
            inputs:
              prompt: ${{ inputs.prompt }}
              target_directory: ${{ inputs.target_directory }}
              mode: ${{ inputs.mode }}
              feedback: ${{ inputs.feedback }}
              context_json: ${{ inputs.context_json }}
              evidence_json: ${{ inputs.evidence_json }}
              dependency_history_json: ${{ inputs.dependency_history_json }}
              consultation_history_json: ${{ inputs.consultation_history_json }}
              review_response_json: ${{ inputs.review_response_json }}
              phase: implement
          resume:
            include: ./agent.yaml
            inputs:
              prompt: ${{ inputs.prompt }}
              target_directory: ${{ inputs.target_directory }}
              mode: ${{ inputs.mode }}
              feedback: ${{ inputs.feedback }}
              context_json: ${{ inputs.context_json }}
              evidence_json: ${{ inputs.evidence_json }}
              dependency_history_json: ${{ inputs.dependency_history_json }}
              consultation_history_json: ${{ inputs.consultation_history_json }}
              session: ${{ inputs.session }}
              review_response_json: ${{ inputs.review_response_json }}
              phase: implement
      outputs:
        valid: '${{ state_exists("resume") ? states.resume.outputs.valid : states.fresh.outputs.valid }}'
        completed: '${{ state_exists("resume") ? states.resume.outputs.completed : states.fresh.outputs.completed
          }}'
        session_id: '${{ state_exists("resume") ? states.resume.outputs.session_id : states.fresh.outputs.session_id
          }}'
        dependencies: '${{ state_exists("resume") ? states.resume.outputs.dependencies : states.fresh.outputs.dependencies
          }}'
        result: '${{ state_exists("resume") ? states.resume.outputs.result : states.fresh.outputs.result }}'
        consultations: '${{ state_exists("resume") ? states.resume.outputs.consultations : states.fresh.outputs.consultations
          }}'
        session: '${{ state_exists("resume") ? states.resume.outputs.session : states.fresh.outputs.session }}'
        review_response: '${{ state_exists("resume") ? states.resume.outputs.review_response : states.fresh.outputs.review_response
          }}'
        review_documents: '${{ state_exists("resume") ? states.resume.outputs.review_documents : states.fresh.outputs.review_documents
          }}'
      transitions:
      - to: failed
        when: outputs.session == null || !outputs.valid
      - to: plan_feedback
        when: outputs.result.next == "redesign"
        payload:
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
      - to: specification
        when: outputs.valid && outputs.completed && outputs.result.next == "review"
      - to: implementation_feedback
        when: true
        payload:
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
    specification:
      include: ./agent.yaml
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ "" }}
        context_json: ${{ '{"design":' + json_stringify(state_output("design", "result", {})) + ',"test_plan":'
          + json_stringify(state_output("test_plan", "result", {})) + ',"implementation":' + json_stringify(state_output("implementation",
          "result", {})) + '}' }}
        evidence_json: '${{ json_stringify(jq(json_parse(''['' + json_stringify(state_exists("verify") ? states.verify.outputs.artifact_refs
          : context.artifacts) + "," + json_stringify(state_output("design", "review_documents", {})) + "," + json_stringify(state_output("test_plan",
          "review_documents", {})) + "," + json_stringify(state_output("implementation", "review_documents", {}))
          + "," + json_stringify(({}).?artifact_refs.orValue({})) + '']''), ".[4] as $uploads | .[0:4] | add | with_entries(.key
          = .value.name) | . + ($uploads | with_entries(.key = (\"review/\" + .key) | .value.name = .key))")) }}'
        dependency_history_json: ${{ json_stringify(state_output("implementation", "dependencies", {})) }}
        phase: review-specification
      transitions:
      - to: quality
        when: outputs.valid && outputs.completed && outputs.result.next == "done"
      - to: failed
        when: '!outputs.valid'
      - to: implementation_feedback
        when: true
        payload:
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
    quality:
      include: ./agent.yaml
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ "" }}
        context_json: ${{ '{"design":' + json_stringify(state_output("design", "result", {})) + ',"test_plan":'
          + json_stringify(state_output("test_plan", "result", {})) + ',"implementation":' + json_stringify(state_output("implementation",
          "result", {})) + '}' }}
        evidence_json: '${{ json_stringify(jq(json_parse(''['' + json_stringify(state_exists("verify") ? states.verify.outputs.artifact_refs
          : context.artifacts) + "," + json_stringify(state_output("design", "review_documents", {})) + "," + json_stringify(state_output("test_plan",
          "review_documents", {})) + "," + json_stringify(state_output("implementation", "review_documents", {}))
          + "," + json_stringify(({}).?artifact_refs.orValue({})) + '']''), ".[4] as $uploads | .[0:4] | add | with_entries(.key
          = .value.name) | . + ($uploads | with_entries(.key = (\"review/\" + .key) | .value.name = .key))")) }}'
        dependency_history_json: ${{ json_stringify(state_output("implementation", "dependencies", {})) }}
        phase: review-quality
      transitions:
      - to: verify
        when: outputs.valid && outputs.completed && outputs.result.next == "done"
      - to: failed
        when: '!outputs.valid'
      - to: implementation_feedback
        when: true
        payload:
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
    verify:
      include: ./verify.yaml
      inputs:
        target_directory: ${{ inputs.target_directory }}
      transitions:
      - to: accept
        when: outputs.ok
      - to: implementation
        when: true
        payload:
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
    accept:
      op: input
      inputs:
        form:
          kind: review
          title: Review verified outcome
          documents: ${{ jq(json_parse('[' + json_stringify(state_output("design", "review_documents", {})) + ","
            + json_stringify(state_output("test_plan", "review_documents", {})) + "," + json_stringify(state_output("implementation",
            "review_documents", {})) + "," + json_stringify(state_output("verify", "review_documents", {})) + ']'),
            "add") }}
          fields:
          - id: decision
            type: multiple_choice
            question: |-
              {{ vars.scope_explanation }}

              Mode: {{ inputs.mode }}; target: {{ inputs.target_directory }}

              ${{ states.implementation.outputs.result.summary }}

              Review the attached outcome and verification evidence. Satisfied approval squashes and merges this verified candidate into upstream.

              How should we proceed? Uploaded edits require another revision and review.
            required: true
            options:
            - value: satisfied
              label: 'Satisfied: squash and merge'
            - value: revise
              label: Revise implementation
            - value: redesign
              label: Change requirements or design
          - *id001
          - *id002
          - *id003
          - &id004
            id: annotated_outcome
            type: file_upload
            question: Optional annotated implementation summary or verification report.
      transitions:
      - to: finish
        when: outputs.fields.decision == "satisfied" && size(outputs.?artifact_refs.orValue({})) == 0
      - to: design
        when: outputs.fields.decision == "redesign" && (outputs.fields.?feedback.orValue("").matches("[^[:space:]]")
          || size(outputs.?artifact_refs.orValue({})) > 0)
        payload:
          review: ${{ outputs }}
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
      - to: plan_feedback
        when: outputs.fields.decision == "redesign"
        payload:
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
      - to: implementation
        when: outputs.fields.decision in ["satisfied", "revise"] && (outputs.fields.?feedback.orValue("").matches("[^[:space:]]")
          || size(outputs.?artifact_refs.orValue({})) > 0)
        payload:
          review: ${{ outputs }}
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
      - to: implementation_feedback
        when: outputs.fields.decision == "revise"
        payload:
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
      - to: accept
        when: true
    implementation_feedback:
      op: input
      inputs:
        form:
          kind: review
          title: Implementation feedback
          documents: ${{ jq(json_parse('[' + json_stringify(state_output("design", "review_documents", {})) + ","
            + json_stringify(state_output("test_plan", "review_documents", {})) + "," + json_stringify(state_output("implementation",
            "review_documents", {})) + "," + json_stringify(state_output("verify", "review_documents", {})) + ']'),
            "add") }}
          fields:
          - id: decision
            type: multiple_choice
            question: |-
              {{ vars.scope_explanation }}

              Work needs revision before merge.

              Implementation:
              ${{ json_stringify(state_output("implementation", "result", {})) }}

              Specification:
              ${{ json_stringify(state_output("specification", "result", {})) }}

              Quality:
              ${{ json_stringify(state_output("quality", "result", {})) }}

              Verification: ${{ json_stringify(state_output("verify", "evidence", {})) }}

              Provide feedback or answer the outstanding questions. New external scope requires design approval.

              How should we proceed? Uploaded edits require another revision and review.
            required: true
            options:
            - value: revise
              label: Revise implementation
            - value: redesign
              label: Change requirements or design
          - *id001
          - *id002
          - *id003
          - *id004
      transitions:
      - to: design
        when: outputs.fields.decision == "redesign" && (outputs.fields.?feedback.orValue("").matches("[^[:space:]]")
          || size(outputs.?artifact_refs.orValue({})) > 0)
        payload:
          review: ${{ outputs }}
          consultations: ${{ transition.payload.?consultations.orValue(state_output("implementation", "consultations",
            state_output("design", "consultations", {}))) }}
      - to: implementation
        when: outputs.fields.decision == "revise" && (outputs.fields.?feedback.orValue("").matches("[^[:space:]]")
          || size(outputs.?artifact_refs.orValue({})) > 0) && state_output("implementation", "session", null) !=
          null
        payload:
          review: ${{ outputs }}
          consultations: ${{ transition.payload.?consultations.orValue(state_output("implementation", "consultations",
            state_output("design", "consultations", {}))) }}
      - to: implementation_feedback
        when: true
        payload:
          consultations: ${{ transition.payload.?consultations.orValue(state_output("implementation", "consultations",
            state_output("design", "consultations", {}))) }}
    finish:
      inputs:
        target_directory: ${{ inputs.target_directory }}
        summary: ${{ states.implementation.outputs.result.summary }}
        approved: ${{ states.accept.outputs.fields.decision == "satisfied" && size(states.accept.outputs.?artifact_refs.orValue({}))
          == 0 }}
        verified: ${{ states.verify.outputs.ok }}
      transitions:
      - to: failed
        when: '!outputs.merged'
      state:
        initial: gate
        states:
          gate:
            op: nix:github:colony-2/c2ops/main#rule_gate
            inputs:
              rules:
              - id: accepted-outcome
                type: assert
                value: ${{ inputs.approved && inputs.verified }}
                message: Only a human-accepted outcome that passed the verification step may merge.
            transitions:
            - to: merge
              when: outputs.ok
          merge:
            op: squashrebasemerge
            inputs:
              repo_path: '{{ context.environment.op.worktree_path }}'
              local_hash: ${{ context.git.hash }}
              upstream_repo: '{{ context.git.repo }}'
              upstream_branch: '{{ context.git.ref }}'
              rebase: false
              author: ${{ context.git.?author.orValue("") }}
              commit_message: |-
                Complete approved development work

                {{ inputs.summary }}
      outputs:
        merged: ${{ nonempty(state_output("merge", "merged_hash", "")) }}
        merged_hash: ${{ state_output("merge", "merged_hash", "") }}
        target_branch: ${{ state_output("merge", "target_branch", "") }}
    failed:
      op: command_execution
      inputs:
        run: |
          printf '%s\n' 'Development stopped: invalid result, missing session, merge gate failure.' >&2
          exit 1
        timeout: 5s
    outside:
      op: input
      inputs:
        form:
          kind: review
          title: Request belongs outside this cell
          documents: ${{ state_output("design", "review_documents", {}) }}
          fields:
          - id: decision
            type: multiple_choice
            question: |-
              ${{ states.design.outputs.result.summary }}

              No local implementation or merge will be performed.

              How should we proceed? Uploaded edits require another revision and review.
            required: true
            options:
            - value: acknowledge
              label: Acknowledge routing result
            - value: revise
              label: Revise the request
          - *id001
          - *id002
          - *id003
      transitions:
      - to: design
        when: (outputs.fields.decision == "revise" || (outputs.fields.decision == "acknowledge" && size(outputs.?artifact_refs.orValue({}))
          > 0)) && (outputs.fields.?feedback.orValue("").matches("[^[:space:]]") || size(outputs.?artifact_refs.orValue({}))
          > 0)
        payload:
          review: ${{ outputs }}
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
      - to: plan_feedback
        when: outputs.fields.decision == "revise"
        payload:
          consultations: ${{ state_output("implementation", "consultations", state_output("design", "consultations",
            {})) }}
      - to: outside
        when: outputs.fields.decision != "acknowledge"
vars:
  scope_explanation: '${{ inputs.mode == "evolve" ? "Evolve improves workflow recipes and instructions in the selected
    directory. Shared defaults live at github.com/colony-2/recipes; committed local specializations live at .c2j/recipes/build.yaml
    and .c2j/recipes/evolve.yaml. Only missing recipes fall back to shared defaults." : "Build implements the requested
    software behavior in the selected cell directory." }}'
outputs:
  merged: ${{ state_output("finish", "merged", false) }}
  merged_hash: ${{ state_output("finish", "merged_hash", "") }}
  target_branch: ${{ state_output("finish", "target_branch", "") }}
  session_id: ${{ state_output("implementation", "session_id", "") }}
  assistant_summary: '${{ state_exists("implementation") ? states.implementation.outputs.result.?summary.orValue("")
    : state_output("design", "result", {}).?summary.orValue("") }}'
  result: ${{ state_output("implementation", "result", {}) }}
  verification: ${{ state_output("verify", "evidence", {}) }}
  artifact_refs: ${{ state_output("verify", "artifact_refs", {}) }}
  dependencies: '${{ {"design": state_output("design", "dependencies", {}), "design_review": state_output("design_review",
    "dependencies", {}), "test_plan": state_output("test_plan", "dependencies", {}), "test_review": state_output("test_review",
    "dependencies", {}), "implementation": state_output("implementation", "dependencies", {}), "specification":
    state_output("specification", "dependencies", {}), "quality": state_output("quality", "dependencies", {})} }}'
  design: ${{ state_output("design", "result", {}) }}
  consultations: '${{ state_exists("implementation") && state_output("design", "result", {}).?next.orValue("") !=
    "outside" ? states.implementation.outputs.consultations : state_output("design", "consultations", {}) }}'
  disposition: '${{ state_output("finish", "merged", false) ? "implemented" : (state_output("design", "result",
    {}).?next.orValue("") == "outside" ? "outside" : "incomplete") }}'
  session: ${{ state_output("implementation", "session", null) }}
  reviews: '${{ {"plan": state_output("approve_plan", "receipt", {}), "outcome": state_output("accept", "receipt",
    {}), "plan_feedback": state_output("plan_feedback", "receipt", {}), "implementation_feedback": state_output("implementation_feedback",
    "receipt", {}), "outside": state_output("outside", "receipt", {})} }}'
  review_documents: ${{ jq(json_parse('[' + json_stringify(state_output("design", "review_documents", {})) + ","
    + json_stringify(state_output("test_plan", "review_documents", {})) + "," + json_stringify(state_output("implementation",
    "review_documents", {})) + "," + json_stringify(state_output("verify", "review_documents", {})) + ']'), "add")
    }}
