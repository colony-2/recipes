id: development-wait-children
version: 0.1.0
input_schema:
  job_ids_json:
    type: string
    required: true
  history_json:
    type: string
    default_value: '{}'
inputs:
  job_ids_json: ${{ inputs.job_ids_json }}
  history_json: ${{ inputs.history_json }}
outputs:
  results: ${{ state_output("await", "results", json_parse(inputs.history_json)) }}
  ok: ${{ jq(json_parse(('[' + json_stringify(json_parse(inputs.job_ids_json)) + ',' + json_stringify((state_output("await",
    "results", json_parse(inputs.history_json)))) + ']')), ". as $v | all($v[0][]; . as $id | $v[1][$id] | .terminal
    == true and .status == \"completed\" and (.outputs.merged != false))") }}

state:
  initial:
  - to: await
    when: size(jq(json_parse(('[' + json_stringify(json_parse(inputs.job_ids_json)) + ',' + json_stringify(json_parse(inputs.history_json))
      + ']')), ".[0] - (.[1] | keys) | unique")) > 0
  - to: done
    when: true
  states:
    await:
      inputs:
        history: ${{ state_output("await", "results", json_parse(inputs.history_json)) }}
        job_id: ${{ jq(json_parse(('[' + json_stringify(json_parse(inputs.job_ids_json)) + ',' + json_stringify(state_output("await",
          "results", json_parse(inputs.history_json))) + ']')), ".[0] - (.[1] | keys) | unique")[0] }}
      sequence:
      - id: child
        op: recipe.await_result_soft
        inputs:
          job_id: ${{ inputs.job_id }}
          return_when: terminal
      outputs:
        results: ${{ jq(json_parse(('[' + json_stringify(inputs.history) + ',' + '{' + json_stringify(sequence.child.outputs.job_id)
          + ':' + json_stringify(sequence.child.outputs) + '}' + ']')), "add") }}
      transitions:
      - to: await
        when: size(jq(json_parse(('[' + json_stringify(json_parse(inputs.job_ids_json)) + ',' + json_stringify(outputs.results)
          + ']')), ".[0] - (.[1] | keys) | unique")) > 0
    done:
      sequence: []
