id: development-design
version: 0.3.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  mode:
    type: string
    default_value: build
  feedback:
    type: string
    default_value: ''
  context_json:
    type: string
    default_value: '{}'
  evidence_json:
    type: string
    default_value: '{}'
  dependency_history_json:
    type: string
    default_value: '{}'
  consultation_history_json:
    type: string
    default_value: '{}'
  mandate_commit:
    type: string
    default_value: ''
  additional_consultation_history_json:
    type: string
    default_value: '{}'
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
  review_response_json:
    type: string
    default_value: '{}'
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  mode: ${{ inputs.mode }}
  feedback: ${{ inputs.feedback }}
  context_json: ${{ inputs.context_json }}
  evidence_json: ${{ inputs.evidence_json }}
  dependency_history_json: ${{ inputs.dependency_history_json }}
  consultation_history_json: ${{ inputs.consultation_history_json }}
  mandate_commit: ${{ inputs.mandate_commit }}
  additional_consultation_history_json: ${{ inputs.additional_consultation_history_json }}
  session: ${{ inputs.?session.orValue(null) }}
  review_response_json: ${{ inputs.review_response_json }}
vars:
  result_schema:
    type: object
    additionalProperties: false
    required:
    - status
    - summary
    - blocking_issues
    - questions
    - design_markdown
    - requirements
    - assessment
    - consultation
    - handoffs
    properties:
      status:
        type: string
        enum:
        - ready
        - revise
        - needs_input
      summary: &id001
        type: string
        pattern: \S
      blocking_issues:
        type: array
        items: *id001
        minItems: 0
      questions:
        type: array
        items: *id001
        minItems: 0
      design_markdown: *id001
      requirements:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - statement
          properties:
            id: *id001
            statement: *id001
        minItems: 0
      assessment:
        type: object
        additionalProperties: false
        required:
        - assessment_status
        - fit
        - rationale
        - outcomes
        - questions
        properties:
          assessment_status:
            enum:
            - assessed
            - needs_clarification
          fit:
            enum:
            - fits
            - partial
            - outside
            - null
          rationale: &id002
            type: string
            pattern: \S
          outcomes:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required:
              - id
              - statement
              - ownership
              - suggested_owner
              - mandate_evidence
              - reason
              properties:
                id: *id002
                statement: *id002
                ownership:
                  enum:
                  - local
                  - external
                  - unresolved
                suggested_owner:
                  type:
                  - string
                  - 'null'
                  pattern: \S
                mandate_evidence:
                  type: array
                  items: *id002
                  minItems: 1
                reason: *id002
          questions: &id003
            type: array
            items: *id002
      consultation:
        anyOf:
        - type: 'null'
        - type: object
          additionalProperties: false
          required:
          - thread_id
          - cell
          - ref
          - message
          properties:
            thread_id: *id002
            cell: *id002
            ref: *id002
            message: *id002
      handoffs:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - thread_id
          - cell
          - mode
          - outcome_ids
          - design_markdown
          properties:
            thread_id: *id002
            cell: *id002
            mode:
              enum:
              - build
              - evolve
            outcome_ids: *id003
            design_markdown: *id002
outputs:
  valid: ${{ state_output("agent", "valid", false) && state_exists("contract") }}
  result: ${{ json_parse(state_output("contract", "stdout", "{}")).?result.orValue({}) }}
  session_id: ${{ state_output("agent", "session_id", "") }}
  completed: ${{ state_output("agent", "completed", false) }}
  dependencies: ${{ state_output("agent", "dependencies", {}) }}
  consultations: ${{ json_parse(state_output("record", "stdout", json_stringify(states.history.outputs.history)))
    }}
  session: ${{ state_output("agent", "session", null) }}
  review_response: ${{ json_parse(inputs.review_response_json) }}
  review_documents: '${{ state_exists("contract") ? {"design": states.contract.artifacts["design.md"]} : {} }}'
state:
  initial: history
  states:
    mandate:
      include: ./mandate.yaml
      transitions:
      - to: agent
        when: true
      inputs:
        commit: ${{ inputs.mandate_commit }}
    agent:
      inputs:
        prompt: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        mode: ${{ inputs.mode }}
        feedback: ${{ inputs.feedback }}
        evidence_json: ${{ inputs.evidence_json }}
        dependency_history_json: ${{ inputs.dependency_history_json }}
        context_json: ${{ '{"previous":' + inputs.context_json + ',"mandate":' + json_stringify(states.mandate.outputs.mandate)
          + ',"consultations":' + state_output("record", "stdout", json_stringify(states.history.outputs.history))
          + '}' }}
        allow_child_jobs: false
        writable: false
        result_schema_json: ${{ json_stringify(vars.result_schema) }}
        instructions: |-
          Assess every requested outcome against the supplied pinned .c2j/mandate.md before designing.
          Return assessment with stable outcome IDs, reasons and mandate clause references. Use fits for all local,
          partial for mixed local/external, outside for all external. Uncertainty or missing/invalid/conflicting mandate
          requires needs_clarification, null fit and questions, never inferred ownership. Requirements contain exactly
          local outcome IDs; supporting dependencies are separate from the requested outcomes. Do not broaden the mandate.
          Define design_markdown with scope, compatibility, interfaces, deprecation and acceptance outcomes.
          To ask another cell for ownership or design feedback, set consultation to {thread_id,cell,ref,message}.
          Use a resolvable cell selector, an explicit ref (normally main), and a detailed proposed design/question.
          Reuse the thread ID, cell and original ref for follow-up questions; its session and pinned commit are retained.
          You may inspect cell catalogs to choose an existing owner or recommend a new cell. Do not create cells or jobs.
          The recipe runs a separate agent in that cell's workspace, then resumes this session with its response.
          Answer its questions, refine the design and consult again when necessary. There are at most eight turns per design pass.
          When agreement is reached set consultation null. For each actual external change, provide a handoff using the
          thread ID, target cell, build/evolve mode, owned outcome IDs (empty for supporting work), and the exact final
          agreed design_markdown from that cell. A ready handoff requires its latest response ready with fit fits.
          Include all external outcomes for partial requests; outside requests explain routing without local implementation.
          Never submit work during design. Human review of the design/test plan precedes actual child job submission.
          Use needs_input for unresolved decisions; ready requires an assessed mandate and no open questions/issues.
          Do not implement.
        session: ${{ state_output("agent", "session", inputs.session) }}
      state:
        initial:
        - to: resume
          when: inputs.session != null
        - to: fresh
          when: true
        states:
          fresh:
            include: ./agent.yaml
            inputs: &id004
              prompt: ${{ inputs.prompt }}
              target_directory: ${{ inputs.target_directory }}
              mode: ${{ inputs.mode }}
              feedback: ${{ inputs.feedback }}
              evidence_json: ${{ inputs.evidence_json }}
              dependency_history_json: ${{ inputs.dependency_history_json }}
              context_json: ${{ inputs.context_json }}
              allow_child_jobs: ${{ inputs.allow_child_jobs }}
              writable: ${{ inputs.writable }}
              result_schema_json: ${{ inputs.result_schema_json }}
              instructions: ${{ inputs.instructions }}
          resume:
            include: ./agent.yaml
            inputs:
              <<: *id004
              session: ${{ inputs.session }}
      outputs:
        valid: '${{ state_exists("resume") ? states.resume.outputs.valid : states.fresh.outputs.valid }}'
        result: '${{ state_exists("resume") ? states.resume.outputs.result : states.fresh.outputs.result }}'
        session_id: '${{ state_exists("resume") ? states.resume.outputs.session_id : states.fresh.outputs.session_id
          }}'
        completed: '${{ state_exists("resume") ? states.resume.outputs.completed : states.fresh.outputs.completed
          }}'
        dependencies: '${{ state_exists("resume") ? states.resume.outputs.dependencies : states.fresh.outputs.dependencies
          }}'
        session: '${{ state_exists("resume") ? states.resume.outputs.session : states.fresh.outputs.session }}'
      transitions:
      - to: contract
        when: outputs.valid
    contract:
      op: command_execution
      inputs:
        timeout: 10s
        env:
          RESULT_JSON: ${{ json_stringify(states.agent.outputs.result) }}
          MANDATE_JSON: ${{ json_stringify(states.mandate.outputs.mandate) }}
          HISTORY_JSON: ${{ state_output("record", "stdout", json_stringify(states.history.outputs.history)) }}
          PROMPT: ${{ inputs.prompt }}
          FEEDBACK: ${{ inputs.feedback }}
          SESSION: ${{ json_stringify(states.agent.outputs.session) }}
          OUTBOX: '{{ context.environment.op.outbox }}'
          INITIAL_HISTORY_JSON: ${{ json_stringify(states.history.outputs.history) }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib
          r=json.loads(os.environ['RESULT_JSON']); m=json.loads(os.environ['MANDATE_JSON']); history=json.loads(os.environ['HISTORY_JSON'])
          a=r['assessment']; outcomes=a['outcomes']; ids=[o['id'] for o in outcomes]
          if len(ids)!=len(set(ids)): raise ValueError('Duplicate requested outcomes')
          for o in outcomes:
              if m['valid'] and not set(o['mandate_evidence'])<=set(m['clauses']): raise ValueError('Unknown mandate clause')
              if o['ownership']=='local' and o['suggested_owner']!=m['cell']: raise ValueError('Local outcome names another owner')
          local={o['id'] for o in outcomes if o['ownership']=='local'}; external={o['id'] for o in outcomes if o['ownership']=='external'}
          if a['assessment_status']=='assessed':
              expected='partial' if local and external else 'fits' if local else 'outside'
              if not m['valid'] or a['fit']!=expected or len(local|external)!=len(ids) or a['questions']: raise ValueError('Invalid mandate assessment')
          else:
              if a['fit'] is not None or not a['questions'] or r['status']=='ready': raise ValueError('Clarification cannot authorize implementation')
          requirements=[v['id'] for v in r['requirements']]
          if len(requirements)!=len(set(requirements)) or set(requirements)!=local: raise ValueError('Requirements must match locally owned outcomes')
          if r['status']=='ready' and (a['assessment_status']!='assessed' or r['questions'] or r['blocking_issues']): raise ValueError('Ready design has unresolved decisions')
          request=r['consultation']; selection={}
          if request:
              if not json.loads(os.environ['SESSION']): raise ValueError('Consultation requires an originating session')
              thread=history.get(request['thread_id'])
              if thread and (thread['cell']!=request['cell'] or thread['ref']!=request['ref']): raise ValueError('Cannot retarget a consultation thread')
              if sum(len(t['turns']) for t in history.values())-sum(len(t['turns']) for t in json.loads(os.environ['INITIAL_HISTORY_JSON']).values())>=8:
                  r.update(status='needs_input',questions=r['questions']+['Consultation limit reached; resolve the open design decisions before continuing.'],consultation=None)
              else:
                  selection={**request,'workspace_ref':thread['commit'] if thread else request['ref'],'session':thread['session'] if thread else None,'session_id':thread['session_id'] if thread else ''}
          covered=[]
          for h in r['handoffs']:
              t=history.get(h['thread_id']); b=t['response'] if t else {}
              if not t or h['cell']!=t['cell'] or b.get('status')!='ready' or b.get('fit')!='fits' or b['questions'] or b['blocking_issues'] or h['design_markdown']!=b['design_markdown']: raise ValueError('Handoff requires the latest agreed foreign design')
              if not set(h['outcome_ids'])<=external: raise ValueError('Handoff cannot transfer local or unknown outcomes')
              if any(o['suggested_owner']!=t['mandate']['cell'] for o in outcomes if o['id'] in h['outcome_ids']): raise ValueError('Handoff owner differs from assessment')
              covered+=h['outcome_ids']
              h['provenance']={'cell':t['mandate']['cell'],'commit':t['commit'],'mandate_sha256':t['mandate']['sha256']}
          if len(covered)!=len(set(covered)): raise ValueError('External outcome assigned twice')
          if r['status']=='ready' and a['fit']=='partial' and not selection and set(covered)!=external: raise ValueError('Partial request needs agreed handoffs for every external outcome')
          revision=hashlib.sha256((os.environ['PROMPT']+'\n'+os.environ['FEEDBACK']).encode()).hexdigest()
          assessment={'version':'c2.mandate-assessment/v1','request_id':hashlib.sha256(os.environ['PROMPT'].encode()).hexdigest(),'request_revision':revision,'cell':m['cell'],'mandate':{k:m[k] for k in ['path','commit','sha256']},**a,'consultations':list(history)}
          r['assessment']=assessment
          out=pathlib.Path(os.environ['OUTBOX']); (out/'mandate-assessment.json').write_text(json.dumps(assessment)); (out/'design.md').write_text(r['design_markdown']); (out/'consultations.json').write_text(json.dumps(history)); (out/'handoffs.json').write_text(json.dumps(r['handoffs']))
          print(json.dumps({'result':r,'selection':selection}))
          PYCODE
      transitions:
      - to: record
        when: size(json_parse(outputs.stdout).selection) > 0
    record:
      include: ./consultation-turn.yaml
      inputs:
        selection_json: ${{ json_stringify(json_parse(states.contract.outputs.stdout).selection) }}
        history_json: ${{ state_output("record", "stdout", json_stringify(states.history.outputs.history)) }}
      transitions:
      - to: agent
        when: true
    history:
      include: ./consultation-history.yaml
      inputs:
        history_json: ${{ inputs.consultation_history_json }}
        additional_json: ${{ inputs.additional_consultation_history_json }}
      transitions:
      - to: mandate
        when: true
