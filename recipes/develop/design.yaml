id: development-design
version: 0.2.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  mode:
    type: string
    default_value: build
  feedback:
    type: string
    default_value: ''
  context_json:
    type: string
    default_value: '{}'
  session_id:
    type: string
    default_value: ''
  evidence_json:
    type: string
    default_value: '{}'
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  mode: ${{ inputs.mode }}
  feedback: ${{ inputs.feedback }}
  context_json: ${{ inputs.context_json }}
  session_id: ${{ inputs.session_id }}
  evidence_json: ${{ inputs.evidence_json }}
vars:
  result_schema:
    type: object
    additionalProperties: false
    required:
    - status
    - summary
    - blocking_issues
    - questions
    - design_markdown
    - requirements
    properties:
      status:
        type: string
        enum:
        - ready
        - revise
        - needs_input
      summary: &id001
        type: string
        pattern: \S
      blocking_issues:
        type: array
        items: *id001
        minItems: 0
      questions:
        type: array
        items: *id001
        minItems: 0
      design_markdown: *id001
      requirements:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - statement
          properties:
            id: *id001
            statement: *id001
        minItems: 1
sequence:
- id: agent
  include: ./agent.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    mode: ${{ inputs.mode }}
    feedback: ${{ inputs.feedback }}
    context_json: ${{ inputs.context_json }}
    session_id: ${{ inputs.session_id }}
    evidence_json: ${{ inputs.evidence_json }}
    instructions: Define requirements with stable IDs and a concrete design in design_markdown. Include scope, compatibility,
      deprecation needs, and acceptance outcomes. Ask targeted questions when needed. Do not implement.
    result_schema_json: ${{ json_stringify(vars.result_schema) }}
    writable: false
outputs:
  valid: ${{ sequence.agent.outputs.valid }}
  result: ${{ sequence.agent.outputs.result }}
  session_id: ${{ sequence.agent.outputs.session_id }}
  completed: ${{ sequence.agent.outputs.completed }}
