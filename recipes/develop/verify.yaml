id: development-verify
version: 1.0.0
inputs:
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  request: ${{ inputs.?request.orValue('') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  settings: ${{ inputs.?settings.orValue(null) }}
  round: ${{ inputs.?round.orValue(0) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
sequence:
- id: check
  include: ../build/hooks/verify.yaml
  inputs:
    target_directory: ${{ inputs.target_directory }}
    request: ${{ inputs.request }}
    documents: ${{ inputs.documents }}
    settings: ${{ inputs.settings }}
    round: ${{ inputs.round }}
  # Verification errors are repairable outcomes, including hook load/schema,
  # execution, read-only checks, and report errors. Never reuse the failed
  # hook's artifact map to render this fallback: that map may be the defect.
  catch:
  - id: verification_error_requires_implementation
    when: failure.kind != 'cancellation'
    continue:
      outputs:
        result:
          status: failed
          ok: false
          summary: ${{ 'Verification could not complete. Repair the verify hook or its checks. ' + failure.message }}
          candidate: ''
          result_candidate: ''
          failure: ${{ json_parse(json_stringify(failure)) }}
        artifact_refs: >-
          ${{ {
            'verification.md': {'kind': 'value', 'name': 'verification.md', 'format': 'text',
              'value': '# Verification failed\n\nThe verify hook or its validation failed. Repair .c2/recipes/hooks/build/verify.yaml and its referenced checks, then request verification again.\n\n'
                + 'Failure: ' + failure.message + '\n\nOrigin: ' + failure.node.path
                + '\n\nThe structured failure is attached under hooks/verify/. Original task logs remain in the job story. No verification approval was granted.'},
            'hooks/verify/' + string(inputs.round) + '/failure.json': {
              'kind': 'value', 'name': 'hooks/verify/' + string(inputs.round) + '/failure.json',
              'format': 'json', 'value': json_parse(json_stringify(failure))} } }}
outputs:
  ok: ${{ sequence.check.outputs.result.status == 'passed' }}
  allowed: ${{ sequence.check.outputs.result.status == 'passed' || (sequence.check.outputs.result.status ==
    'skipped' && !inputs.require_verification) }}
  result: ${{ sequence.check.outputs.result }}
  evidence: ${{ sequence.check.outputs.result }}
  review_documents: "${{ {'verification': sequence.check.outputs.artifact_refs['verification.md']} }}"
  artifact_refs: ${{ sequence.check.outputs.artifact_refs }}
