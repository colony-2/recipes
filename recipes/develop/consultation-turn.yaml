id: consultation-turn
version: 0.3.0
input_schema:
  selection_json:
    type: string
    required: true
  history_json:
    type: string
    required: true
inputs:
  selection_json: ${{ inputs.selection_json }}
  history_json: ${{ inputs.history_json }}
sequence:
- id: consult
  workspace:
    cell: ${{ json_parse(inputs.selection_json).cell }}
    ref: ${{ json_parse(inputs.selection_json).workspace_ref }}
  inputs:
    message: ${{ json_parse(inputs.selection_json).message }}
    session: ${{ json_parse(inputs.selection_json).session }}
  state:
    initial:
    - to: resume
      when: inputs.session != null
    - to: fresh
      when: true
    states:
      fresh:
        include: ./consult.yaml
        inputs: &id001
          message: ${{ inputs.message }}
      resume:
        include: ./consult.yaml
        inputs:
          <<: *id001
          session: ${{ inputs.session }}
  outputs:
    valid: '${{ state_exists("resume") ? states.resume.outputs.valid : states.fresh.outputs.valid }}'
    result: '${{ state_exists("resume") ? states.resume.outputs.result : states.fresh.outputs.result }}'
    mandate: '${{ state_exists("resume") ? states.resume.outputs.mandate : states.fresh.outputs.mandate }}'
    session_id: '${{ state_exists("resume") ? states.resume.outputs.session_id : states.fresh.outputs.session_id
      }}'
    session: '${{ state_exists("resume") ? states.resume.outputs.session : states.fresh.outputs.session }}'
- op: command_execution
  inputs:
    timeout: 10s
    env:
      HISTORY_JSON: ${{ inputs.history_json }}
      SELECTION_JSON: ${{ inputs.selection_json }}
      TURN_JSON: ${{ json_stringify(sequence.consult.outputs) }}
      OUTBOX: '{{ context.environment.op.outbox }}'
    run: |
      python3 - <<'PYCODE'
      import json, os, pathlib
      history=json.loads(os.environ['HISTORY_JSON']); q=json.loads(os.environ['SELECTION_JSON']); turn=json.loads(os.environ['TURN_JSON'])
      if q.get('session_id') and q['session_id']!=turn['session_id']: raise ValueError('Consultation session changed')
      if not turn['valid']: raise ValueError('Invalid consultation result or missing session')
      t=history.setdefault(q['thread_id'],{'cell':q['cell'],'ref':q['ref'],'commit':turn['mandate']['commit'],'turns':[]})
      if t['commit']!=turn['mandate']['commit']: raise ValueError('Consultation commit changed')
      if not turn['session']: raise ValueError('Missing consultation checkpoint')
      if t.get('session') != q['session']: raise ValueError('Consultation did not resume latest checkpoint')
      t.update(response=turn['result'],session_id=turn['session_id'],session=turn['session'],mandate=turn['mandate'])
      t['turns'].append({'message':q['message'],'response':turn['result'],'input_session':q['session'],'session':turn['session']})
      pathlib.Path(os.environ['OUTBOX'],'consultations.json').write_text(json.dumps(history))
      print(json.dumps(history))
      PYCODE
  id: record
outputs:
  stdout: ${{ sequence.record.outputs.stdout }}
