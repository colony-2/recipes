id: consultation-turn
version: 0.3.0
input_schema:
  history_json:
    type: string
    required: true
  request_json:
    type: string
    required: true
inputs:
  history_json: ${{ inputs.history_json }}
  request_json: ${{ inputs.request_json }}
sequence:
- id: consult
  workspace:
    cell: ${{ json_parse(inputs.request_json).cell }}
    ref: ${{ json_parse(inputs.request_json).?ref.orValue("main") }}
  inputs:
    message: ${{ json_parse(inputs.request_json).message }}
    session: ${{ json_parse(inputs.history_json)[?json_parse(inputs.request_json).cell].orValue({}).?session.orValue(null)
      }}
  state:
    initial:
    - to: resume
      when: inputs.session != null
    - to: fresh
      when: true
    states:
      fresh:
        include: ./consult.yaml
        inputs:
          message: ${{ inputs.message }}
      resume:
        include: ./consult.yaml
        inputs:
          message: ${{ inputs.message }}
          session: ${{ inputs.session }}
  outputs:
    valid: '${{ state_exists("resume") ? states.resume.outputs.valid : states.fresh.outputs.valid }}'
    result: '${{ state_exists("resume") ? states.resume.outputs.result : states.fresh.outputs.result }}'
    session_id: '${{ state_exists("resume") ? states.resume.outputs.session_id : states.fresh.outputs.session_id
      }}'
    session: '${{ state_exists("resume") ? states.resume.outputs.session : states.fresh.outputs.session }}'
outputs:
  consultations: '${{ jq(json_parse(''{"current":'' + inputs.history_json + '',"request":'' + inputs.request_json
    + '',"reply":'' + json_stringify(sequence.consult.outputs) + ''}''), ". as $v | .current + {($v.request.cell):
    {session: $v.reply.session, response: $v.reply.result}}") }}'
  valid: ${{ sequence.consult.outputs.valid }}
