id: development-review-design
version: 0.2.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  mode:
    type: string
    default_value: build
  feedback:
    type: string
    default_value: ''
  context_json:
    type: string
    default_value: '{}'
  session_id:
    type: string
    default_value: ''
  evidence_json:
    type: string
    default_value: '{}'
  dependency_history_json:
    type: string
    default_value: '{}'
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  mode: ${{ inputs.mode }}
  feedback: ${{ inputs.feedback }}
  context_json: ${{ inputs.context_json }}
  session_id: ${{ inputs.session_id }}
  evidence_json: ${{ inputs.evidence_json }}
  dependency_history_json: ${{ inputs.dependency_history_json }}
vars:
  result_schema:
    type: object
    additionalProperties: false
    required:
    - status
    - summary
    - blocking_issues
    - questions
    properties:
      status:
        type: string
        enum:
        - ready
        - revise
        - needs_input
      summary: &id001
        type: string
        pattern: \S
      blocking_issues:
        type: array
        items: *id001
        minItems: 0
      questions:
        type: array
        items: *id001
        minItems: 0
sequence:
- id: agent
  include: ./agent.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    mode: ${{ inputs.mode }}
    feedback: ${{ inputs.feedback }}
    context_json: ${{ inputs.context_json }}
    session_id: ${{ inputs.session_id }}
    evidence_json: ${{ inputs.evidence_json }}
    instructions: Independently review the design against the original request, scope, compatibility and applicable
      instructions. Reject missing requirements or unresolved decisions. Do not implement or rewrite the design.
      Independently check the mandate assessment against .c2j/mandate.md, all requested outcomes, local/external
      allocation, and consultation conclusions. Reject a partial design that silently drops external work or a handoff
      that changes the consulted design.
    result_schema_json: ${{ json_stringify(vars.result_schema) }}
    writable: false
    dependency_history_json: ${{ inputs.dependency_history_json }}
    allow_child_jobs: false
outputs:
  valid: ${{ sequence.agent.outputs.valid }}
  result: ${{ sequence.agent.outputs.result }}
  session_id: ${{ sequence.agent.outputs.session_id }}
  completed: ${{ sequence.agent.outputs.completed }}
  dependencies: ${{ sequence.agent.outputs.dependencies }}
