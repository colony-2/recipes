id: development-review-design
version: 0.4.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  mode:
    type: string
    default_value: build
  feedback:
    type: string
    default_value: ''
  context_json:
    type: string
    default_value: '{}'
  evidence_json:
    type: string
    default_value: '{}'
  dependency_history_json:
    type: string
    default_value: '{}'
  consultation_history_json:
    type: string
    default_value: '{}'
  review_response_json:
    type: string
    default_value: '{}'
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  mode: ${{ inputs.mode }}
  feedback: ${{ inputs.feedback }}
  context_json: ${{ inputs.context_json }}
  evidence_json: ${{ inputs.evidence_json }}
  dependency_history_json: ${{ inputs.dependency_history_json }}
  consultation_history_json: ${{ inputs.consultation_history_json }}
  review_response_json: ${{ inputs.review_response_json }}
vars:
  result_schema:
    type: object
    additionalProperties: false
    required:
    - summary
    - next
    properties:
      summary:
        type: string
        pattern: \S
      next:
        enum:
        - done
        - revise
        - ask_user
sequence:
- id: agent
  include: ./phase.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    mode: ${{ inputs.mode }}
    feedback: ${{ inputs.feedback }}
    context_json: ${{ inputs.context_json }}
    evidence_json: ${{ inputs.evidence_json }}
    dependency_history_json: ${{ inputs.dependency_history_json }}
    consultation_history_json: ${{ inputs.consultation_history_json }}
    review_response_json: ${{ inputs.review_response_json }}
    instructions: Independently review the design in the inbox against the request and .c2j/mandate.md. Assess ownership,
      scope, interfaces, compatibility, acceptance outcomes, and external work agreements. The mandate is prose;
      explain whether the request fits, partially fits, or is outside. Look at Git history for unauthorized mandate
      changes. Use next=done if suitable for human approval, revise with concrete findings, or ask_user for an unresolved
      decision. Do not edit repository files.
    result_schema_json: ${{ json_stringify(vars.result_schema) }}
    allow_child_jobs: false
    document: ''
    document_key: ''
outputs:
  result: ${{ sequence.agent.outputs.result }}
  session_id: ${{ sequence.agent.outputs.session_id }}
  completed: ${{ sequence.agent.outputs.completed }}
  dependencies: ${{ sequence.agent.outputs.dependencies }}
  session: ${{ sequence.agent.outputs.session }}
  artifact_refs: ${{ sequence.agent.outputs.artifact_refs }}
  valid: ${{ sequence.agent.outputs.valid }}
  consultations: ${{ sequence.agent.outputs.consultations }}
  review_response: ${{ sequence.agent.outputs.review_response }}
  review_documents: ${{ sequence.agent.outputs.review_documents }}
