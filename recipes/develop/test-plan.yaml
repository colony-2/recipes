id: development-test-plan
version: 0.4.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  mode:
    type: string
    default_value: build
  feedback:
    type: string
    default_value: ''
  context_json:
    type: string
    default_value: '{}'
  evidence_json:
    type: string
    default_value: '{}'
  dependency_history_json:
    type: string
    default_value: '{}'
  consultation_history_json:
    type: string
    default_value: '{}'
  review_response_json:
    type: string
    default_value: '{}'
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  mode: ${{ inputs.mode }}
  feedback: ${{ inputs.feedback }}
  context_json: ${{ inputs.context_json }}
  evidence_json: ${{ inputs.evidence_json }}
  dependency_history_json: ${{ inputs.dependency_history_json }}
  consultation_history_json: ${{ inputs.consultation_history_json }}
  review_response_json: ${{ inputs.review_response_json }}
vars:
  result_schema:
    type: object
    additionalProperties: false
    required:
    - summary
    - next
    properties:
      summary:
        type: string
        pattern: \S
      next:
        enum:
        - review
        - continue
        - ask_user
sequence:
- id: agent
  include: ./phase.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    target_directory: ${{ inputs.target_directory }}
    mode: ${{ inputs.mode }}
    feedback: ${{ inputs.feedback }}
    context_json: ${{ inputs.context_json }}
    evidence_json: ${{ inputs.evidence_json }}
    dependency_history_json: ${{ inputs.dependency_history_json }}
    consultation_history_json: ${{ inputs.consultation_history_json }}
    review_response_json: ${{ inputs.review_response_json }}
    instructions: |-
      Write outcome-focused test statements BEFORE implementation in the repository's .c2j/test-plan.md. Maintain this one plan; do not create per-job documents in Git. Read the proposed design from the inbox.
      Each statement must be Markdown, at most 30 words, annotated with relevant filenames, importance, unit/integration level, and dependencies. Include positive and negative cases for critical behavior. Use expectation language and meaningful integration coverage; avoid trivial tests and implementation mirroring. No IDs or JSON statement catalog is required.
      Review existing statements using Git history from the job's starting revision. Preserve approved expectations; explain any proposed change and deprecation plan for human review. Recipe tests must use disposable databases, never home-sourced databases. Use next=review when ready, ask_user for questions, or continue to keep working. Do not implement.
    result_schema_json: ${{ json_stringify(vars.result_schema) }}
    allow_child_jobs: false
    document: ''
    document_key: ''
- id: publish
  state:
    initial:
    - to: copy
      when: inputs.ready
    - to: skip
      when: true
    states:
      copy:
        op: command_execution
        inputs:
          timeout: 10s
          continue_on_error: true
          env:
            PLAN: '{{ context.environment.op.worktree_path }}/.c2j/test-plan.md'
            OUTBOX: '{{ context.environment.op.outbox }}'
          run: |
            cp "$PLAN" "$OUTBOX/test-statements.md"
      skip:
        sequence: []
  outputs:
    ok: ${{ state_output("copy", "success", true) }}
    documents: '${{ state_exists("copy") && state_output("copy", "success", false) ? {"test_statements": states.copy.artifacts["test-statements.md"]}
      : {} }}'
  inputs:
    ready: ${{ sequence.agent.outputs.valid && sequence.agent.outputs.completed && sequence.agent.outputs.result.next
      == "review" }}
outputs:
  result: ${{ sequence.agent.outputs.result }}
  session_id: ${{ sequence.agent.outputs.session_id }}
  completed: ${{ sequence.agent.outputs.completed }}
  dependencies: ${{ sequence.agent.outputs.dependencies }}
  session: ${{ sequence.agent.outputs.session }}
  artifact_refs: ${{ sequence.agent.outputs.artifact_refs }}
  valid: ${{ sequence.agent.outputs.valid && sequence.publish.outputs.ok }}
  consultations: ${{ sequence.agent.outputs.consultations }}
  review_response: ${{ sequence.agent.outputs.review_response }}
  review_documents: ${{ sequence.publish.outputs.documents }}
