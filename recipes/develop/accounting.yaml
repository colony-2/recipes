id: accounting-response
version: 1.0.0
inputs:
  turn: ${{ inputs.turn }}
  candidate: ${{ inputs.candidate }}
  documents: ${{ inputs.documents }}
  request: ${{ inputs.request }}
  schema: ${{ inputs.schema }}
  instructions: ${{ inputs.instructions }}
state:
  initial: validate
  states:
    validate:
      inputs:
        turn: ${{ transition.payload.?turn.orValue(inputs.turn) }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        attempts: ${{ transition.payload.?attempts.orValue(0) }}
        candidate: ${{ inputs.candidate }}
        operation_attempts: ${{ transition.payload.?operation_attempts.orValue(0) }}
      sequence:
      - id: validate_accounting
        op: command_execution
        const: true
        execution_needs:
          packages:
          - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
        artifacts:
          candidate.json:
            kind: value
            name: candidate.json
            format: json
            value: ${{ inputs.candidate }}
          turn.json:
            kind: value
            name: turn.json
            format: json
            value: ${{ inputs.turn }}
        inputs:
          env:
            INBOX: ${{ context.environment.op.inbox }}
          run: |
            python3 - <<'PYCODE'
            import collections, json, os, pathlib, subprocess
            inbox = pathlib.Path(os.environ['INBOX'])
            candidate = json.loads((inbox / 'candidate.json').read_text())
            turn = json.loads((inbox / 'turn.json').read_text())
            result = turn.get('result', {})
            issues = list(turn.get('issues', []))
            if result.get('status') != 'completed':
                issues.append('Reviewer did not complete: ' + str(result.get('errorMessage', 'No completed response.')))
            if not result.get('output_schema_valid'):
                issues.append('Return a schema-valid structured review.')
            review = result.get('response') or {}
            if not isinstance(review, dict):
                issues.append('Return the review as a structured object.')
                review = {}
            files = review.get('files')
            if not isinstance(files, list):
                files = []
                issues.append('Return response.files as an array.')
            expected = {f['path']: f['change'] for f in candidate['files']}
            counts = collections.Counter(f.get('path') for f in files if isinstance(f, dict) and isinstance(f.get('path'), str))
            for path in sorted(expected.keys() - counts.keys()):
                issues.append('Missing file: ' + path)
            for path in sorted(counts.keys() - expected.keys()):
                issues.append('Unexpected file: ' + path)
            for path, count in counts.items():
                if count != 1:
                    issues.append('Duplicate file: ' + path)
            for f in files:
                if not isinstance(f, dict) or not isinstance(f.get('path'), str):
                    issues.append('Each accounting entry needs a path, change, and reason.')
                    continue
                if f['path'] in expected and f.get('change') != expected[f['path']]:
                    issues.append('Wrong change code for ' + f['path'] + ': expected ' + expected[f['path']])
                if not isinstance(f.get('reason'), str) or not f['reason'].strip():
                    issues.append('Explain why this file belongs: ' + f['path'])
            subject, message = review.get('subject'), review.get('review_message')
            if not isinstance(subject, str) or not subject.strip() or len(subject.strip()) > 72 or any(ord(c) < 32 for c in subject):
                issues.append('Return a nonblank single-line subject of at most 72 characters.')
            if not isinstance(message, str) or not message.strip():
                issues.append('Return a substantive review_message, including evidence for any no-change outcome.')
            if review.get('verdict') not in ('approve', 'revise'):
                issues.append('Return verdict approve or revise.')
            if turn.get('jobs', {}).get('job_ids'):
                issues.append('Reviewer submitted jobs; reconcile those effects before continuing.')
            head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
            print(json.dumps({'issues': issues, 'stale': head != candidate['head']}))
            PYCODE
          continue_on_error: true
      outputs:
        turn: ${{ inputs.turn }}
        documents: ${{ inputs.documents }}
        attempts: ${{ inputs.attempts }}
        issues: '${{ sequence.validate_accounting.outputs.success ? json_parse(sequence.validate_accounting.outputs.stdout).issues
          : [] }}'
        stale: ${{ sequence.validate_accounting.outputs.success && json_parse(sequence.validate_accounting.outputs.stdout).stale
          }}
        failure: ${{ sequence.validate_accounting.outputs }}
        operation_attempts: ${{ inputs.operation_attempts }}
      transitions:
      - to: recover_validation
        when: '!outputs.failure.success'
      - to: stale
        when: outputs.stale
      - to: repair
        when: size(outputs.issues) > 0
      - to: render
        when: true
    repair:
      include: ../kernel/repair.yaml
      inputs:
        turn: ${{ states.validate.outputs.turn }}
        documents: ${{ states.validate.outputs.documents }}
        issues: ${{ states.validate.outputs.issues }}
        attempts: ${{ states.validate.outputs.attempts }}
      transitions:
      - to: correct
        when: outputs.retry
      - to: cancelled
        when: true
    correct:
      include: ../kernel/agent-turn.yaml
      inputs:
        read_only: true
        artifact_fields: []
        session: ${{ states.repair.outputs.session }}
        documents: ${{ states.repair.outputs.documents }}
        retained_artifacts: ${{ states.repair.outputs.artifacts }}
        schema: ${{ inputs.schema }}
        instructions: ${{ inputs.instructions }}
        prompt: '${{ states.repair.outputs.prompt + ''\nCorrect file accounting for the unchanged candidate. Return
          every inventory entry in response.files; an artifact is not a substitute. Preserve substantive findings and the verdict unless the listed defect requires changing them. Never approve unresolved findings merely to satisfy the schema. Original request: '' + inputs.request
          }}'
      transitions:
      - to: validate
        when: true
        payload:
          turn: ${{ outputs }}
          documents: ${{ states.repair.outputs.documents }}
          attempts: ${{ states.repair.outputs.attempts }}
    render:
      inputs:
        turn: ${{ states.validate.outputs.turn }}
        candidate: ${{ inputs.candidate }}
      sequence:
      - id: render_file_accounting
        op: command_execution
        execution_needs:
          packages:
          - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
        const: true
        inputs:
          env:
            OUTBOX: ${{ context.environment.op.outbox }}
            INBOX: ${{ context.environment.op.inbox }}
          run: |
            python3 - <<'PY'
            import json, os, pathlib
            candidate = json.loads((pathlib.Path(os.environ['INBOX']) / 'candidate.json').read_text())
            result = json.loads((pathlib.Path(os.environ['INBOX']) / 'result.json').read_text())
            review = result['response']
            files = review['files']
            subject, message = review['subject'].strip(), review['review_message'].strip()
            commit_message = subject + '\n\n' + message + '\n\nJob: ' + candidate['job_url']
            lines = ['# Merge review', '', 'Verdict: ' + review['verdict'], '',
                     'Base: `' + candidate['base'] + '`', 'Candidate: `' + candidate['head'] + '`',
                     '', '## Proposed squash commit' if files else '## No-change rationale', '',
                     commit_message if files else message, '', '## File accounting', '']
            labels = {'A': 'Added', 'M': 'Changed', 'D': 'Deleted', 'T': 'Changed type'}
            for f in sorted(files, key=lambda f: f['path']):
                lines.extend(['### ' + labels[f['change']] + ': ' + json.dumps(f['path'], ensure_ascii=False), '', f['reason'].strip(), ''])
            if not files:
                lines.append('No repository changes. Human acceptance is required to complete this job; no commit will be created.')
            (pathlib.Path(os.environ['OUTBOX']) / 'merge-review.md').write_text('\n'.join(lines) + '\n')
            print(json.dumps({'verdict': review['verdict'], 'commit_message': commit_message}))
            PY
        artifacts:
          candidate.json:
            kind: value
            name: candidate.json
            format: json
            value: ${{ inputs.candidate }}
          result.json:
            kind: value
            name: result.json
            format: json
            value: ${{ inputs.turn.result }}
      outputs:
        approved: ${{ json_parse(sequence.render_file_accounting.outputs.stdout).verdict == 'approve' }}
        commit_message: ${{ json_parse(sequence.render_file_accounting.outputs.stdout).commit_message }}
        document: ${{ sequence.render_file_accounting.artifacts['merge-review.md'] }}
    cancelled:
      sequence: []
    recover_validation:
      include: ../kernel/recovery.yaml
      inputs:
        stage: file accounting validation
        evidence: ${{ states.validate.outputs.failure }}
        documents: ${{ states.validate.outputs.documents }}
        attempts: ${{ states.validate.outputs.operation_attempts }}
        safe_retry: true
      transitions:
      - to: validate
        when: outputs.retry
        payload:
          turn: ${{ states.validate.outputs.turn }}
          documents: ${{ outputs.documents }}
          attempts: ${{ states.validate.outputs.attempts }}
          operation_attempts: ${{ outputs.attempts }}
      - to: cancelled
        when: true
    stale:
      sequence: []
outputs:
  cancelled: ${{ state_exists('cancelled') }}
  approved: ${{ state_output('render', 'approved', false) }}
  commit_message: ${{ state_output('render', 'commit_message', '') }}
  documents: '${{ jq([states.validate.outputs.documents, state_output(''repair'', ''documents'', {}), states.validate.outputs.turn.artifacts, state_exists(''render'')
    ? {''merge-review.md'': states.render.outputs.document} : {}], ''add'') }}'
  stale: ${{ state_exists('stale') }}
