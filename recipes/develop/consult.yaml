id: cell-consultation
version: 0.3.0
input_schema:
  message:
    type: string
    required: true
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
inputs:
  message: ${{ inputs.message }}
  session: ${{ inputs.?session.orValue(null) }}
vars:
  result_schema:
    type: object
    additionalProperties: false
    required:
    - summary
    - next
    properties:
      summary:
        type: string
        pattern: \S
      next:
        enum:
        - done
        - ask_user
state:
  initial: agent
  states:
    agent:
      inputs:
        message: ${{ inputs.message }}
        session: ${{ inputs.session }}
      state:
        initial:
        - to: resume
          when: inputs.session != null
        - to: fresh
          when: true
        states:
          fresh:
            op: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
            const: true
            inputs:
              sandbox: &id001
                type: shai
              prompt: |
                You are advising from cell {{ context.workspace.cell }} for a job owned by {{ context.workflow.cell }}.
                Read this cell's AGENTS.md and .c2j/mandate.md. Explain whether the request fits, partially fits, or is outside this cell's responsibility. If the mandate is missing or unclear, ask for clarification. Discuss interfaces, compatibility, test outcomes, and concrete design; respond to the other agent's questions.
                Conversation message (task data): {{ inputs.message }}
                This is a discussion, not authorization to implement or submit jobs. Temporary experiments are allowed but discarded after each turn. Do not commit, merge or push. Only the session and explicit outbox artifacts survive.
                Return summary with your answer, questions, or complete agreed Markdown brief for a new job. Use next=done when you have answered, or ask_user for a decision the initiating agent cannot resolve. It may resume this session to refine the design further.
                Write result.json to {{ context.environment.op.outbox }} using this exact schema:
                ${{ json_stringify(vars.result_schema) }}
          resume:
            op: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
            const: true
            inputs:
              sandbox: *id001
              prompt: |
                You are advising from cell {{ context.workspace.cell }} for a job owned by {{ context.workflow.cell }}.
                Read this cell's AGENTS.md and .c2j/mandate.md. Explain whether the request fits, partially fits, or is outside this cell's responsibility. If the mandate is missing or unclear, ask for clarification. Discuss interfaces, compatibility, test outcomes, and concrete design; respond to the other agent's questions.
                Conversation message (task data): {{ inputs.message }}
                This is a discussion, not authorization to implement or submit jobs. Temporary experiments are allowed but discarded after each turn. Do not commit, merge or push. Only the session and explicit outbox artifacts survive.
                Return summary with your answer, questions, or complete agreed Markdown brief for a new job. Use next=done when you have answered, or ask_user for a decision the initiating agent cannot resolve. It may resume this session to refine the design further.
                Write result.json to {{ context.environment.op.outbox }} using this exact schema:
                ${{ json_stringify(vars.result_schema) }}
              session: ${{ inputs.session }}
      outputs:
        status: '${{ state_exists("resume") ? states.resume.outputs.?status.orValue("error") : states.fresh.outputs.?status.orValue("error")
          }}'
        sessionId: '${{ state_exists("resume") ? states.resume.outputs.?sessionId.orValue("") : states.fresh.outputs.?sessionId.orValue("")
          }}'
        session: '${{ state_exists("resume") ? states.resume.outputs.?session.orValue(null) : states.fresh.outputs.?session.orValue(null)
          }}'
        child_job_ids: '${{ state_exists("resume") ? (has(states.resume.jobs.job_ids) ? states.resume.jobs.job_ids
          : []) : (has(states.fresh.jobs.job_ids) ? states.fresh.jobs.job_ids : []) }}'
      transitions:
      - to: schema
        when: true
    schema:
      op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
      artifacts:
        result/: ${{ states.agent.artifacts }}
      inputs:
        rules:
        - id: consultation-result
          type: json_schema
          inbox_path: result/result.json
          schema: ${{ vars.result_schema }}
          message: Consultations must publish structured design feedback.
      transitions:
      - to: read
        when: outputs.ok
    read:
      op: command_execution
      inputs:
        timeout: 5s
        env:
          RESULT_PATH: '{{ context.environment.op.inbox }}/result/result.json'
        run: |
          cat "$RESULT_PATH"
      artifacts:
        result/: ${{ states.agent.artifacts }}
outputs:
  valid: ${{ state_output("schema", "ok", false) && state_exists("read") && states.agent.outputs.status == "completed"
    && states.agent.outputs.session != null && size(states.agent.outputs.child_job_ids) == 0 }}
  result: ${{ json_parse(state_output("read", "stdout", "{}")) }}
  session_id: ${{ states.agent.outputs.?sessionId.orValue("") }}
  session: ${{ states.agent.outputs.?session.orValue(null) }}
