id: development-finish
version: 0.2.0
input_schema:
  target_directory:
    type: string
    default_value: .
  base_hash:
    type: string
    required: true
  candidate_hash:
    type: string
    required: true
  summary:
    type: string
    required: true
  approved:
    type: boolean
    required: true
  verified:
    type: boolean
    required: true
inputs:
  target_directory: ${{ inputs.target_directory }}
  base_hash: ${{ inputs.base_hash }}
  candidate_hash: ${{ inputs.candidate_hash }}
  summary: ${{ inputs.summary }}
  approved: ${{ inputs.approved }}
  verified: ${{ inputs.verified }}
outputs:
  merged: ${{ nonempty(state_output("merge", "merged_hash", "")) }}
  merged_hash: ${{ state_output("merge", "merged_hash", "") }}
  target_branch: ${{ state_output("merge", "target_branch", "") }}
state:
  initial: scope
  states:
    scope:
      include: ./scope.yaml
      inputs:
        target_directory: ${{ inputs.target_directory }}
        base_hash: ${{ inputs.base_hash }}
      transitions:
      - to: gate
        when: true
    gate:
      op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
      inputs:
        rules:
        - id: accepted-current-candidate
          type: assert
          value: ${{ inputs.approved && inputs.verified && states.scope.outputs.snapshot.head == inputs.candidate_hash
            && states.scope.outputs.snapshot.clean }}
          message: Only the accepted verified candidate may merge.
      transitions:
      - to: merge
        when: outputs.ok
    merge:
      op: squashrebasemerge
      inputs:
        repo_path: '{{ context.environment.op.worktree_path }}'
        local_hash: ${{ inputs.candidate_hash }}
        upstream_repo: '{{ context.git.repo }}'
        upstream_branch: '{{ context.git.ref }}'
        rebase: false
        author: ${{ context.git.?author.orValue("") }}
        commit_message: |-
          Complete approved development work

          {{ inputs.summary }}
