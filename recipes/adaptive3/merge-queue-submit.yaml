id: adaptive3-merge-queue-submit
inputs:
  contribution: ${{ inputs.?contribution.orValue({}) }}
  queue_history: ${{ inputs.?queue_history.orValue({}) }}
  initial_submitted_at: ${{ inputs.?initial_submitted_at.orValue(inputs.?queue_history.orValue({}).?initial_submitted_at.orValue('')) }}
  require_verification: ${{ inputs.require_verification }}
  target_directory: ${{ inputs.target_directory }}
  settings: ${{ inputs.settings }}
  receiver: ${{ inputs.?receiver.orValue('') }}
state:
  initial:
  - to: unchanged_rejection
    when: nonempty(inputs.contribution.?changeid.orValue('')) &&
      inputs.contribution.changeid==inputs.queue_history.?rejected_changeid.orValue('')
  - to: identify
    when: 'true'
  states:
    unchanged_rejection:
      sequence: []
      transitions:
      - to: done
        when: 'true'
        payload:
          result:
            status: stuck
            summary: The candidate still matches the rejected merge queue contribution. Update the work before resubmitting.
            rejected_changeid: ${{ inputs.contribution.changeid }}
            errors: ${{ inputs.queue_history.?errors.orValue({}) }}
    identify:
      op: ./recipes/merge-queue
      const: true
      inputs:
        action: identify
        request:
          expected_head: ${{ inputs.contribution.?head_hash.orValue('') }}
          expected_base: ${{ inputs.contribution.?base_hash.orValue('') }}
          base: ${{ context.git.execution.base_hash }}
          ref: ${{ context.git.ref }}
          target_directory: ${{ inputs.target_directory }}
          submitted_at: ${{ inputs.initial_submitted_at }}
      transitions:
      - to: submit
        when: outputs.result.verified
      - to: done
        when: 'true'
        payload:
          result:
            status: changes
            stage: implementation
            summary: The prepared merge queue candidate must be refreshed, verified, and reviewed before submission.
    submit:
      sequence:
      - id: batch
        op: recipe.run_and_get_result
        retry:
          maximum_attempts: 1
        inputs:
          name: ${{ inputs.receiver }}
          cell_name: ${{ inputs.cell }}
          git_ref: ${{ inputs.branch }}
          inputs:
            branch: ${{ inputs.branch }}
            verification_policy: ${{ inputs.policy }}
          grouping:
            key: ${{ inputs.key }}
            max_items: 50
            content: ${{ jq([inputs.content,{'verification_policy':inputs.policy}], 'add') }}
            artifacts:
            - ${{ inputs.content.thinpack_ref }}
      inputs:
        receiver: >-
          ${{ nonempty(inputs.receiver) ? inputs.receiver :
            'git+' + context.recipe_source.?repo.orValue('https://github.com/colony-2/recipes.git') + '//merge-batch.yaml@' + context.recipe_source.?ref.orValue('main') }}
        cell: ${{ context.workflow.cell }}
        branch: ${{ states.identify.outputs.result.branch }}
        key: >-
          ${{ context.workflow.?cell_id.orValue(context.workflow.cell) + '/' +
            states.identify.outputs.result.branch + '/merge' }}
        policy:
          version: 1
          require_verification: ${{ inputs.require_verification }}
          target_directory: ${{ states.identify.outputs.result.directory }}
          settings: ${{ inputs.settings }}
        content: >-
          ${{ jq([inputs.contribution,{
            'version':1, 'repository':context.git.repo, 'job_id':context.workflow.job_id,
            'branch':states.identify.outputs.result.branch,
            'initial_submitted_at':states.identify.outputs.result.age
          }], 'add | .thinpack_ref.name = "candidate.bundle"') }}
      outputs:
        receipt: ${{ sequence.batch.outputs.outputs }}
      catch:
      - when: failure.kind!='cancellation'
        to: done
        payload:
          result:
            status: stuck
            summary: ${{ failure.message }}
            failure: ${{ json_parse(json_stringify(failure)) }}
      transitions:
      - to: receipt
        when: 'true'
    receipt:
      op: ./recipes/merge-queue
      const: true
      inputs:
        action: caller_receipt
        request:
          receipt: ${{ states.submit.outputs.receipt }}
          own: ${{ inputs.contribution.changeid }}
          branch: ${{ states.identify.outputs.result.branch }}
      transitions:
      - to: confirm
        when: outputs.result.?own.hasValue() && outputs.result.own.status=='success'
        payload:
          hash: ${{ outputs.result.own.hash }}
      - to: done
        when: outputs.result.?own.hasValue()
        payload:
          result:
            status: changes
            stage: implementation
            rejected_changeid: ${{ outputs.result.own.changeid }}
            summary: ${{ 'The merge queue returned '+outputs.result.own.status+' for this change. Repair and reverify the candidate.' }}
            errors: ${{ jq(outputs.result.own.?failure_logs.orValue([]),'to_entries | map({key:("error/merge-queue/"+(.key|tostring)+".log"),value:(.value + {name:("error/merge-queue/"+(.key|tostring)+".log")})}) | from_entries') }}
      - to: done
        when: 'true'
        payload:
          result:
            status: stuck
            summary: The merge queue did not return a valid receipt for this change.
    confirm:
      op: ./recipes/merge-queue
      const: true
      workspace:
        cell: ${{ context.workflow.cell }}
        ref: ${{ states.identify.outputs.result.branch }}
      inputs:
        action: confirm_landed
        request:
          landed: ${{ transition.payload.hash }}
          branch: ${{ states.identify.outputs.result.branch }}
          change_id: ${{ inputs.contribution.changeid }}
      transitions:
      - to: done
        when: outputs.result.confirmed
        payload:
          result:
            status: passed
            publication:
              merged_hash: ${{ states.receipt.outputs.result.own.hash }}
              target_branch: ${{ states.identify.outputs.result.branch }}
      - to: done
        when: 'true'
        payload:
          result:
            status: stuck
            summary: The queue receipt could not be confirmed on the target branch.
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
outputs:
  result: >-
    ${{ jq([states.done.outputs.result,{'initial_submitted_at':
      state_output('identify','result',{}).?age.orValue(inputs.initial_submitted_at)}],'add') }}
