id: adaptive3-backstop
inputs:
  stage: ${{ inputs.stage }}
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
  prior_job: ${{ inputs.?prior_job.orValue('') }}
  automatic: ${{ inputs.?automatic.orValue(true) }}
vars:
  destinations:
    configure:
    - configure
    direction:
    - configure
    - direction
    preparation:
    - configure
    - direction
    - preparation
    implementation:
    - configure
    - direction
    - preparation
    - implementation
    outcome:
    - configure
    - direction
    - preparation
    - implementation
    - outcome
    integration:
    - configure
    - direction
    - preparation
    - implementation
    - outcome
    - integration
    recovery:
    - configure
    - direction
    - preparation
    - implementation
    - outcome
    - integration
state:
  initial: turn
  states:
    turn:
      inputs:
        agent_settings: ${{ transition.payload.?agent_settings.orValue(inputs.agent_settings) }}
        feedback: ${{ transition.payload.?feedback.orValue(inputs.feedback) }}
        session: ${{ transition.payload.?session.orValue({}) }}
        allow_resume: ${{ transition.payload.?allow_resume.orValue(inputs.automatic) }}
        human: ${{ transition.payload.?human.orValue({}) }}
      sequence: []
      outputs:
        agent_settings: ${{ inputs.agent_settings }}
        feedback: ${{ inputs.feedback }}
        session: ${{ inputs.session }}
        allow_resume: ${{ inputs.allow_resume }}
        human: ${{ inputs.human }}
      transitions:
      - to: setup
        when: 'true'
    setup:
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/backstop.yaml
        inputs:
          stage: ${{ inputs.stage }}
          request: ${{ inputs.request }}
          problem: ${{ inputs.problem }}
          feedback: ${{ inputs.feedback }}
          prior_job: ${{ inputs.prior_job }}
      outputs:
        schema: '${{ inputs.prior_job != '''' ? sequence.schemas.outputs.recovery : sequence.schemas.outputs.backstop
          }}'
        text: ${{ sequence.prompts.outputs }}
      transitions:
      - to: investigate
        when: 'true'
      inputs:
        stage: ${{ inputs.stage }}
        request: ${{ inputs.request }}
        problem: ${{ inputs.problem }}
        documents: ${{ inputs.documents }}
        feedback: ${{ states.turn.outputs.feedback }}
        agent_settings: ${{ states.turn.outputs.agent_settings }}
        prior_job: ${{ inputs.prior_job }}
    investigate:
      include: ./agent.yaml
      inputs:
        prompt: ${{ states.setup.outputs.text.task }}
        schema: ${{ jq([states.setup.outputs.schema,vars.destinations[inputs.stage]], '.[1] as $stages | .[0] |
          .properties.stage.enum = ($stages + [null])') }}
        documents: ${{ jq([inputs.documents,inputs.problem.?errors.orValue({}),jq(states.turn.outputs.feedback.?artifact_refs.orValue({}),'with_entries(.key
          = "feedback/" + .key | .value.name = .key)')],"add") }}
        read_only: true
        agent_settings: ${{ states.turn.outputs.agent_settings }}
        session: ${{ states.turn.outputs.session }}
      transitions:
      - to: assess
        when: 'true'
      catch:
      - when: failure.kind != 'cancellation'
        continue:
          outputs:
            response:
              status: stuck
              summary: ${{ failure.message }}
              title: Agent could not start
              primary: null
            artifacts: {}
            session: {}
    assess:
      sequence: []
      inputs:
        response: ${{ states.investigate.outputs.response }}
        stage: ${{ inputs.stage }}
      outputs:
        eligible: ${{ inputs.response.status in ['ask','resume'] && inputs.response.?stage.orValue('') in vars.destinations[inputs.stage]
          && jq(inputs.response, '(.action // "") | if type == "string" then test("[^[:space:]]") else false end') }}
      transitions:
      - to: done
        when: outputs.eligible && states.investigate.outputs.response.status == 'resume' && states.turn.outputs.allow_resume
        payload:
          result: '${{ size(states.turn.outputs.human)>0 ? jq([states.investigate.outputs.response,{''human'':states.turn.outputs.human,''documents'':jq(states.turn.outputs.human.?artifact_refs.orValue({}),''with_entries(.key
            = "feedback/" + .key | .value.name = .key)'')}],''add'') : states.investigate.outputs.response }}'
      - to: prepare_review
        when: 'true'
    ask:
      id: ask
      op: input
      inputs:
        form:
          title: "${{ 'Backstop \u2014 ' + states.investigate.outputs.response.?title.orValue('Agent needs help') }}"
          fields:
          - id: decision
            type: multiple_choice
            question: |-
              ${{ states.prepare_review.outputs.result.status == 'passed' ? states.prepare_review.outputs.message : states.setup.outputs.text.unreadable + '\n' + states.prepare_review.outputs.result.summary }}
              ${{ inputs.problem.?loop.orValue('') != '' && states.assess.outputs.eligible && states.prepare_review.outputs.result.status == 'passed' ? 'Additional attempts for this loop: ' + string(states.investigate.outputs.response.?additional_attempts.orValue(null) != null ? states.investigate.outputs.response.additional_attempts : 4) : '' }}
              ${{ transition.payload.?clarification.orValue('') }}
            required: true
            options: '${{ (states.assess.outputs.eligible && states.prepare_review.outputs.result.status == ''passed'' ?
              [{''value'':''continue'',''label'':inputs.problem.?loop.orValue('''') != '''' ?
              states.setup.outputs.text.retry + '' '' + string(states.investigate.outputs.response.?additional_attempts.orValue(null)
              != null ? states.investigate.outputs.response.additional_attempts : 4) + '' '' + states.setup.outputs.text.attempts
              : states.setup.outputs.text.continue}] : []) +
              [{''value'':''question'',''label'':states.setup.outputs.text.question},{''value'':''revise'',''label'':states.setup.outputs.text.change},
              {''value'':''settings'',''label'':states.setup.outputs.text.model_continue}] }}'
          - id: feedback
            type: paragraph_text
            question: ${{ states.setup.outputs.text.message }}
            required: false
          - id: annotations
            type: file_upload
            question: ${{ states.setup.outputs.text.notes }}
            required: false
          - id: model
            type: short_answer
            question: '${{ ''Model (optional; current: '' + states.turn.outputs.agent_settings.?model.orValue(''worker
              default'') + '')'' }}'
            required: false
          - id: reasoning_effort
            type: short_answer
            question: '${{ ''Reasoning effort (optional; current: '' + states.turn.outputs.agent_settings.?reasoning_effort.orValue(''worker
              default'') + '')'' }}'
            required: false
          kind: review
          documents: '${{ states.prepare_review.outputs.result.status == ''passed'' ? states.prepare_review.outputs.documents
            : {} }}'
          overview_document_id: '${{ states.prepare_review.outputs.result.status == ''passed'' ? states.prepare_review.outputs.primary
            : '''' }}'
      transitions:
      - to: turn
        when: nonempty(outputs.fields.?model.orValue('')) || nonempty(outputs.fields.?reasoning_effort.orValue(''))
        payload:
          agent_settings: ${{ jq([states.turn.outputs.agent_settings,outputs.fields],'.[0] + (.[1] | with_entries(select((.key
            == "model" or .key == "reasoning_effort") and .value != "")))') }}
          feedback: ${{ jq([outputs,{'validation':states.prepare_review.outputs.result}], 'add') }}
          human: ${{ outputs }}
          session: {}
          allow_resume: false
      - to: ask
        when: outputs.fields.decision == 'settings' && !nonempty(outputs.fields.?feedback.orValue(''))
          && size(outputs.?artifact_refs.orValue({})) == 0
        payload:
          clarification: Enter a model or reasoning effort to reconsider the diagnosis. Settings do not authorize stage work.
      - to: ask
        when: outputs.fields.decision == 'continue' && !(states.assess.outputs.eligible && states.prepare_review.outputs.result.status == 'passed')
        payload:
          clarification: There is no readable available action to apply. Ask a question, request changes or reconsider agent settings.
      - to: ask
        when: outputs.fields.decision in ['question','revise'] && !nonempty(outputs.fields.?feedback.orValue(''))
          && size(outputs.?artifact_refs.orValue({})) == 0
        payload:
          clarification: Enter a question or requested change, or attach notes, then confirm.
      - to: done
        when: outputs.fields.decision == 'continue' && states.assess.outputs.eligible && !nonempty(outputs.fields.?feedback.orValue('')) && size(outputs.?artifact_refs.orValue({}))
          == 0 && states.prepare_review.outputs.result.status == 'passed'
        payload:
          result: ${{ jq([states.investigate.outputs.response,{'status':'resume','human':outputs,'documents':jq(outputs.?artifact_refs.orValue({}),'with_entries(.key
            = "feedback/" + .key | .value.name = .key)')}],'add') }}
      - to: turn
        when: 'true'
        payload:
          agent_settings: ${{ states.turn.outputs.agent_settings }}
          feedback: ${{ jq([outputs,{'validation':states.prepare_review.outputs.result}], 'add') }}
          human: ${{ outputs }}
          session: ${{ states.investigate.outputs.session }}
          allow_resume: ${{ outputs.fields.decision == 'continue' && states.assess.outputs.eligible && states.prepare_review.outputs.result.status == 'passed' }}
    done:
      sequence: []
      outputs:
        result: ${{ jq(inputs.result, 'if .approval then .approval as $a | .approval = {result:{status:"accepted",receipt:$a.receipt,source_job:$a.source_job,source_task:$a.source_task},patch:$a.patch}
          else . end') }}
        documents: ${{ jq([inputs.artifacts,inputs.result], '(.[1].approval.patch // "") as $patch | .[0] | with_entries(select((.key
          | startswith("review/")) or .key == $patch))') }}
      inputs:
        result: ${{ transition.payload.result }}
        artifacts: ${{ states.investigate.outputs.artifacts }}
    prepare_review:
      sequence:
      - id: files
        include: ./tools.yaml
        when: size(inputs.documents)>0 || inputs.summary.contains('[') || inputs.summary.contains('<')
        inputs:
          check: review_files
          documents: ${{ inputs.documents }}
          title: ${{ inputs.title }}
          primary: ${{ inputs.primary }}
          message: ${{ inputs.summary }}
        catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              result:
                status: changes
                summary: ${{ failure.message }}
              artifacts: {}
      inputs:
        documents: ${{ jq(states.investigate.outputs.artifacts,'with_entries(select(.key|startswith("review/")))')
          }}
        title: ${{ states.investigate.outputs.response.?title.orValue('Agent needs help') }}
        primary: '${{ states.investigate.outputs.response.?primary.orValue(null) != null ? states.investigate.outputs.response.primary
          : '''' }}'
        summary: '${{ states.investigate.outputs.response.summary + (states.assess.outputs.eligible ? ''\n\nAvailable action: '' + states.investigate.outputs.response.action : '''') }}'
      outputs:
        result: ${{ sequence.?files.orValue({}).?outputs.orValue({}).?result.orValue({'status':'passed'}) }}
        documents: ${{ inputs.documents }}
        primary: ${{ inputs.primary }}
        message: ${{ inputs.summary }}
      transitions:
      - to: ask
        when: 'true'
outputs:
  result: ${{ jq([states.done.outputs.result,states.done.outputs.documents], '.[1] as $files | .[0] | if .approval.patch
    then .approval.patch = $files[.approval.patch] else . end') }}
  agent_settings: ${{ states.turn.outputs.agent_settings }}
  documents: '${{ size(states.done.outputs.documents)>0 ? states.done.outputs.documents : inputs.documents }}'
