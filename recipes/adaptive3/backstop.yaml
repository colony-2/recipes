id: adaptive3-backstop
inputs:
  stage: ${{ inputs.stage }}
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
  prior_job: ${{ inputs.?prior_job.orValue('') }}
  automatic: ${{ inputs.?automatic.orValue(true) }}
  retry: >-
    ${{ inputs.?retry.orValue({'automatic_used':(inputs.?automatic.orValue(true) ? 0 : 2)}) }}
  prerequisites: ${{ inputs.?prerequisites.orValue({}) }}
state:
  initial: turn
  states:
    turn:
      inputs:
        feedback: >-
          ${{ transition.payload.?feedback.orValue(jq([inputs.feedback,inputs.problem,vars.review_instruction],
            'if (.[2]|length)>0 then .[0] + .[2] + (.[1] | {documents,conversation,review_id} | with_entries(select(.value!=null))) else .[0] end')) }}
        session: ${{ transition.payload.?session.orValue(inputs.session) }}
        allow_resume: ${{ transition.payload.?allow_resume.orValue(inputs.automatic) }}
        human: ${{ transition.payload.?human.orValue(vars.review_instruction) }}
        previous: ${{ state_output('turn','retry',inputs.retry) }}
      sequence:
      - id: instruction
        include: ./retry.yaml
        inputs:
          previous: ${{ inputs.previous }}
          receipt: ${{ inputs.human.?receipt.orValue({}) }}
      outputs:
        feedback: ${{ inputs.feedback }}
        session: ${{ inputs.session }}
        allow_resume: ${{ inputs.allow_resume }}
        retry: ${{ sequence.instruction.outputs.change.retry }}
        human: ${{ inputs.human }}
      transitions:
      - to: setup
        when: 'true'
    setup:
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/backstop.yaml
        inputs:
          stage: ${{ inputs.stage }}
          request: ${{ inputs.request }}
          problem: ${{ inputs.problem }}
          feedback: ${{ inputs.feedback }}
          prior_job: ${{ inputs.prior_job }}
      - id: policy
        include: ./review-policy.yaml
        inputs:
          stage: ${{ inputs.stage }}
          recovery: true
          prerequisites: ${{ inputs.prerequisites }}
      outputs:
        schema: '${{ inputs.prior_job != '''' ? sequence.schemas.outputs.recovery : sequence.schemas.outputs.backstop
          }}'
        text: ${{ sequence.prompts.outputs }}
        destinations: ${{ sequence.policy.outputs.destinations }}
        setting: ${{ sequence.policy.outputs.setting }}
      transitions:
      - to: investigate
        when: 'true'
      inputs:
        stage: ${{ inputs.stage }}
        request: ${{ inputs.request }}
        problem: ${{ inputs.problem }}
        documents: ${{ inputs.documents }}
        feedback: ${{ states.turn.outputs.feedback }}
        agent_settings: ${{ inputs.agent_settings }}
        prior_job: ${{ inputs.prior_job }}
        prerequisites: ${{ inputs.prerequisites }}
    investigate:
      include: ./agent.yaml
      inputs:
        prompt: ${{ states.setup.outputs.text.task }}
        schema: ${{ jq([states.setup.outputs.schema,states.setup.outputs.destinations,states.turn.outputs.feedback.?response.orValue({}).?settings.orValue({}).?return_to.orValue('auto')],
          '.[1] as $allowed | .[2] as $choice | .[0] | .properties.stage.enum = ((if $choice == "auto" then $allowed
          else [$choice] end) + [null])') }}
        documents: ${{ jq([inputs.documents,inputs.problem.?errors.orValue({}),states.turn.outputs.feedback.?documents.orValue({})],
          'add') }}
        read_only: true
        agent_settings: ${{ inputs.agent_settings }}
        session: ${{ states.turn.outputs.session }}
      transitions:
      - to: assess
        when: 'true'
      catch:
      - when: failure.kind != 'cancellation'
        continue:
          outputs:
            response:
              status: stuck
              summary: ${{ failure.message }}
              title: Agent could not start
              primary: null
            artifacts: {}
            session: ${{ states.turn.outputs.session }}
    assess:
      include: ./backstop-action.yaml
      inputs:
        response: ${{ states.investigate.outputs.response }}
        destinations: ${{ states.setup.outputs.destinations }}
        human: ${{ states.turn.outputs.human }}
      transitions:
      - to: done
        when: outputs.eligible && states.investigate.outputs.response.status == 'resume' && (states.turn.outputs.allow_resume || (size(states.turn.outputs.human)>0 && states.investigate.outputs.response.?instruction.orValue(null) != null))
        payload:
          result: '${{ size(states.turn.outputs.human)>0 ? jq([states.investigate.outputs.response,{''human'':states.turn.outputs.human,''documents'':states.turn.outputs.feedback.?documents.orValue({})}],
            ''add'') : states.investigate.outputs.response }}'
          session: ${{ states.investigate.outputs.session }}
      - to: prepare_review
        when: 'true'
    done:
      sequence: []
      outputs:
        session: ${{ inputs.session }}
        result: ${{ jq([inputs.result,inputs.presentation], '.[1] as $presentation | .[0] | if $presentation != null then .primary = $presentation.primary | .document_details = ($presentation.document_metadata | to_entries | map(.value + {document_id:.key})) else . end | .additional_attempts = (.additional_attempts // 1) | if .instruction != null and .human != null and .instruction.scope_change then .amendment = {instruction:.instruction.text,human:.human,documents:(.documents // {})} else . end | if .approval then .approval as $a | .approval = {result:{status:"accepted",receipt:$a.receipt,source_job:$a.source_job,source_task:$a.source_task},patch:$a.patch}
          else . end') }}
        documents: ${{ jq([inputs.artifacts,inputs.result], '(.[1].approval.patch // "") as $patch | .[0] | with_entries(select((.key
          | startswith("review/")) or .key == $patch))') }}
      inputs:
        result: ${{ transition.payload.result }}
        session: ${{ transition.payload.session }}
        presentation: >-
          ${{ state_exists('prepare_review') ? states.prepare_review.outputs : null }}
        artifacts: >-
          ${{ state_exists('prepare_review') ? jq([states.prepare_review.outputs.documents,states.investigate.outputs.artifacts,transition.payload.result.?approval.orValue({}).?patch.orValue('')], '.[2] as $patch | .[0] + (.[1] | with_entries(select(.key == $patch)))') : states.investigate.outputs.artifacts }}
    prepare_review:
      sequence:
      - id: files
        include: ./tools.yaml
        when: size(inputs.documents)>0 || size(inputs.document_details)>0 || inputs.primary != '' || inputs.summary.contains('[') || inputs.summary.contains('<')
        inputs:
          check: review_files
          require_document_details: ${{ inputs.primary != '' || size(inputs.document_details)>0 || inputs.documents.exists(k,!(k in inputs.negotiations)) }}
          documents: ${{ inputs.documents }}
          title: ${{ inputs.title }}
          primary: ${{ inputs.primary }}
          message: ${{ inputs.summary }}
          document_details: ${{ inputs.document_details }}
        catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              result:
                status: changes
                summary: ${{ failure.message }}
              artifacts: {}
      - id: report
        include: ./backstop-report.yaml
        inputs:
          request: ${{ inputs.request }}
          problem: ${{ inputs.problem }}
          response: ${{ inputs.response }}
          documents: ${{ inputs.documents }}
          negotiations: ${{ inputs.negotiations }}
          document_metadata: ${{ sequence.?files.orValue({}).?outputs.orValue({}).?document_metadata.orValue({}) }}
          valid: ${{ sequence.?files.orValue({}).?outputs.orValue({}).?result.orValue({'status':'passed'}).status == 'passed' }}
      inputs:
        request: ${{ inputs.request }}
        problem: ${{ inputs.problem }}
        response: ${{ states.investigate.outputs.response }}
        negotiations: ${{ jq(inputs.documents,'with_entries(select(.key|startswith("review/negotiations/")))') }}
        documents: ${{ jq([states.investigate.outputs.artifacts,inputs.documents],'(.[0] | with_entries(select(.key|startswith("review/")))) + (.[1] | with_entries(select(.key|startswith("review/negotiations/"))))')
          }}
        title: ${{ states.investigate.outputs.response.?title.orValue('Agent needs help') }}
        primary: '${{ states.investigate.outputs.response.?primary.orValue(null) != null ? states.investigate.outputs.response.primary
          : jq(inputs.documents,''[keys[] | select(startswith("review/negotiations/") and endswith("/report.md"))][0] // ""'') }}'
        summary: '${{ states.investigate.outputs.response.summary + (states.assess.outputs.eligible ? ''\n\nAvailable
          action: '' + states.investigate.outputs.response.action : '''') }}'
        document_details: ${{ states.investigate.outputs.response.?document_details.orValue([]) }}
      outputs:
        result: ${{ sequence.?files.orValue({}).?outputs.orValue({}).?result.orValue({'status':'passed'}) }}
        documents: ${{ sequence.report.outputs.documents }}
        primary: ${{ sequence.report.outputs.primary }}
        message: ${{ inputs.summary }}
        document_metadata: ${{ sequence.report.outputs.document_metadata }}
      transitions:
      - to: discuss
        when: 'true'
    discuss:
      include: ./discussion.yaml
      inputs:
        instructions: true
        proposed_action: ${{ states.investigate.outputs.response.?action.orValue('') }}
        proposed_stage: ${{ states.investigate.outputs.response.?stage.orValue('') }}
        request: '${{ jq([{''title'':states.investigate.outputs.response.?title.orValue(''Your decision is needed''),''question'':(states.prepare_review.outputs.result.status == ''passed'' ? states.prepare_review.outputs.message
          : states.setup.outputs.text.unreadable + ''\n'' + states.prepare_review.outputs.result.summary),''documents'':states.prepare_review.outputs.documents,''document_metadata'':states.prepare_review.outputs.document_metadata,''directions'':(states.assess.outputs.eligible
          && states.prepare_review.outputs.result.status == ''passed'' ? [{''id'':''continue'',''label'':inputs.problem.?loop.orValue('''') == ''merge'' ? states.setup.outputs.text.retry + '' '' + string(states.investigate.outputs.response.?additional_attempts.orValue(null)
          != null ? states.investigate.outputs.response.additional_attempts : 1) + '' '' + (states.investigate.outputs.response.?additional_attempts.orValue(null) == null || states.investigate.outputs.response.additional_attempts == 1 ? states.setup.outputs.text.attempt : states.setup.outputs.text.attempts)
          : states.setup.outputs.text.continue,''feedback_mode'':''forbidden'',''allow_attachments'':false,''continues_review'':false}]
          : []) + [{''id'':''question'',''label'':states.setup.outputs.text.question,''feedback_mode'':''required'',''allow_attachments'':true,''continues_review'':true},{''id'':''revise'',''label'':states.setup.outputs.text.change,''feedback_mode'':''required'',''allow_attachments'':true,''continues_review'':false}]
          + (states.prepare_review.outputs.result.status == ''passed'' && size(states.prepare_review.outputs.documents)>0
          ? [{''id'':''annotate'',''label'':''Review doc comments'',''feedback_mode'':''required'',''allow_attachments'':true,''continues_review'':false}]
          : []),''feedback'':{''label'':states.setup.outputs.text.message},''settings'':[states.setup.outputs.setting],''conversation'':states.turn.outputs.feedback.?conversation.orValue([])},states.prepare_review.outputs.primary],
          ''.[1] as $primary | .[0] + (if $primary != "" and (.[0].documents|has($primary)) then {overview_document_id:$primary} else {} end)'')
          }}'
        prompt: ${{ states.setup.outputs.text.task }}
        schema: ${{ states.setup.outputs.schema }}
        documents: ${{ jq([inputs.documents,states.prepare_review.outputs.documents], "add") }}
        agent_settings: ${{ inputs.agent_settings }}
        session: ${{ states.investigate.outputs.session }}
      transitions:
      - to: done
        when: outputs.native.response.direction == 'continue' && states.assess.outputs.eligible && states.prepare_review.outputs.result.status
          == 'passed'
        payload:
          result: ${{ jq([states.investigate.outputs.response,{'status':'resume','human':outputs.native,'documents':outputs.documents,'conversation':outputs.conversation,'review_id':outputs.review_id}],
            'add') }}
          session: ${{ outputs.session }}
      - to: turn
        when: 'true'
        payload:
          feedback: ${{ jq([outputs.native,{'validation':states.prepare_review.outputs.result,'documents':outputs.documents,'conversation':outputs.conversation,'review_id':outputs.review_id,'reassessment':outputs.interpretation}],
            'add') }}
          human: >-
            ${{ outputs.native.response.direction != 'question' || outputs.interpretation.?instruction.orValue(null) != null ? outputs.native : {} }}
          session: ${{ outputs.session }}
          allow_resume: ${{ outputs.native.response.direction == 'question' && states.turn.outputs.retry.automatic_used < 2 }}
outputs:
  retry: ${{ states.turn.outputs.retry }}
  session: ${{ states.done.outputs.session }}
  result: ${{ jq([states.done.outputs.result,states.done.outputs.documents], '.[1] as $files | .[0] | if .approval.patch
    then .approval.patch = $files[.approval.patch] else . end') }}
  documents: '${{ size(states.done.outputs.documents)>0 ? states.done.outputs.documents : inputs.documents }}'
vars:
  review_instruction: >-
    ${{ inputs.problem.?status.orValue('') == 'changes' && nonempty(inputs.problem.?human.orValue({}).?receipt.orValue({}).?submission_id.orValue(''))
      && inputs.problem.human.?response.orValue({}).?direction.orValue('') in ['revise','annotate','decline']
      ? inputs.problem.human : {} }}
