id: adaptive3-backstop
inputs:
  stage: ${{ inputs.stage }}
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
  prior_job: ${{ inputs.?prior_job.orValue('') }}
  automatic: ${{ inputs.?automatic.orValue(true) }}
state:
  initial: turn
  states:
    turn:
      inputs:
        feedback: ${{ transition.payload.?feedback.orValue(inputs.feedback) }}
        session: ${{ transition.payload.?session.orValue(inputs.session) }}
        allow_resume: ${{ transition.payload.?allow_resume.orValue(inputs.automatic) }}
        human: ${{ transition.payload.?human.orValue({}) }}
      sequence: []
      outputs:
        feedback: ${{ inputs.feedback }}
        session: ${{ inputs.session }}
        allow_resume: ${{ inputs.allow_resume }}
        human: ${{ inputs.human }}
      transitions:
      - to: setup
        when: 'true'
    setup:
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/backstop.yaml
        inputs:
          stage: ${{ inputs.stage }}
          request: ${{ inputs.request }}
          problem: ${{ inputs.problem }}
          feedback: ${{ inputs.feedback }}
          prior_job: ${{ inputs.prior_job }}
      - id: policy
        include: ./review-policy.yaml
        inputs:
          stage: ${{ inputs.stage }}
          recovery: true
      outputs:
        schema: '${{ inputs.prior_job != '''' ? sequence.schemas.outputs.recovery : sequence.schemas.outputs.backstop
          }}'
        text: ${{ sequence.prompts.outputs }}
        destinations: ${{ sequence.policy.outputs.destinations }}
        setting: ${{ sequence.policy.outputs.setting }}
      transitions:
      - to: investigate
        when: 'true'
      inputs:
        stage: ${{ inputs.stage }}
        request: ${{ inputs.request }}
        problem: ${{ inputs.problem }}
        documents: ${{ inputs.documents }}
        feedback: ${{ states.turn.outputs.feedback }}
        agent_settings: ${{ inputs.agent_settings }}
        prior_job: ${{ inputs.prior_job }}
    investigate:
      include: ./agent.yaml
      inputs:
        prompt: ${{ states.setup.outputs.text.task }}
        schema: ${{ jq([states.setup.outputs.schema,states.setup.outputs.destinations,states.turn.outputs.feedback.?response.orValue({}).?settings.orValue({}).?return_to.orValue('auto')],
          '.[1] as $allowed | .[2] as $choice | .[0] | .properties.stage.enum = ((if $choice == "auto" then $allowed
          else [$choice] end) + [null])') }}
        documents: ${{ jq([inputs.documents,inputs.problem.?errors.orValue({}),states.turn.outputs.feedback.?documents.orValue({})],
          'add') }}
        read_only: true
        agent_settings: ${{ inputs.agent_settings }}
        session: ${{ states.turn.outputs.session }}
      transitions:
      - to: assess
        when: 'true'
      catch:
      - when: failure.kind != 'cancellation'
        continue:
          outputs:
            response:
              status: stuck
              summary: ${{ failure.message }}
              title: Agent could not start
              primary: null
            artifacts: {}
            session: ${{ states.turn.outputs.session }}
    assess:
      sequence: []
      inputs:
        response: ${{ states.investigate.outputs.response }}
        destinations: ${{ states.setup.outputs.destinations }}
        stage: ${{ inputs.stage }}
      outputs:
        eligible: ${{ inputs.response.status in ['ask','resume'] && inputs.response.?stage.orValue('') in inputs.destinations
          && jq(inputs.response, '(.action // "") | if type == "string" then test("[^[:space:]]") else false end')
          }}
      transitions:
      - to: done
        when: outputs.eligible && states.investigate.outputs.response.status == 'resume' && states.turn.outputs.allow_resume
        payload:
          result: '${{ size(states.turn.outputs.human)>0 ? jq([states.investigate.outputs.response,{''human'':states.turn.outputs.human,''documents'':states.turn.outputs.feedback.?documents.orValue({})}],
            ''add'') : states.investigate.outputs.response }}'
          session: ${{ states.investigate.outputs.session }}
      - to: prepare_review
        when: 'true'
    done:
      sequence: []
      outputs:
        session: ${{ inputs.session }}
        result: ${{ jq(inputs.result, 'if .approval then .approval as $a | .approval = {result:{status:"accepted",receipt:$a.receipt,source_job:$a.source_job,source_task:$a.source_task},patch:$a.patch}
          else . end') }}
        documents: ${{ jq([inputs.artifacts,inputs.result], '(.[1].approval.patch // "") as $patch | .[0] | with_entries(select((.key
          | startswith("review/")) or .key == $patch))') }}
      inputs:
        result: ${{ transition.payload.result }}
        session: ${{ transition.payload.session }}
        artifacts: ${{ states.investigate.outputs.artifacts }}
    prepare_review:
      sequence:
      - id: files
        include: ./tools.yaml
        when: size(inputs.documents)>0 || size(inputs.document_details)>0 || inputs.primary != '' || inputs.summary.contains('[') || inputs.summary.contains('<')
        inputs:
          check: review_files
          documents: ${{ inputs.documents }}
          title: ${{ inputs.title }}
          primary: ${{ inputs.primary }}
          message: ${{ inputs.summary }}
          document_details: ${{ inputs.document_details }}
        catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              result:
                status: changes
                summary: ${{ failure.message }}
              artifacts: {}
      inputs:
        documents: ${{ jq([states.investigate.outputs.artifacts,inputs.documents],'(.[0] | with_entries(select(.key|startswith("review/")))) + (.[1] | with_entries(select(.key|startswith("review/negotiations/"))))')
          }}
        title: ${{ states.investigate.outputs.response.?title.orValue('Agent needs help') }}
        primary: '${{ states.investigate.outputs.response.?primary.orValue(null) != null ? states.investigate.outputs.response.primary
          : jq(inputs.documents,''[keys[] | select(startswith("review/negotiations/") and endswith("/report.md"))][0] // ""'') }}'
        summary: '${{ states.investigate.outputs.response.summary + (states.assess.outputs.eligible ? ''\n\nAvailable
          action: '' + states.investigate.outputs.response.action : '''') }}'
        document_details: ${{ states.investigate.outputs.response.?document_details.orValue([]) }}
      outputs:
        result: ${{ sequence.?files.orValue({}).?outputs.orValue({}).?result.orValue({'status':'passed'}) }}
        documents: ${{ inputs.documents }}
        primary: ${{ inputs.primary }}
        message: ${{ inputs.summary }}
        document_metadata: ${{ sequence.?files.orValue({}).?outputs.orValue({}).?document_metadata.orValue({}) }}
      transitions:
      - to: discuss
        when: 'true'
    discuss:
      include: ./discussion.yaml
      inputs:
        request: '${{ jq([{''title'':''Backstop — '' + states.investigate.outputs.response.?title.orValue(''Agent
          needs help''),''question'':(states.prepare_review.outputs.result.status == ''passed'' ? states.prepare_review.outputs.message
          : states.setup.outputs.text.unreadable + ''\n'' + states.prepare_review.outputs.result.summary),''documents'':states.prepare_review.outputs.result.status
          == ''passed'' ? states.prepare_review.outputs.documents : {},''document_metadata'':states.prepare_review.outputs.result.status == ''passed'' ? states.prepare_review.outputs.document_metadata : {},''directions'':(states.assess.outputs.eligible
          && states.prepare_review.outputs.result.status == ''passed'' ? [{''id'':''continue'',''label'':inputs.problem.?loop.orValue('''')
          != '''' ? states.setup.outputs.text.retry + '' '' + string(states.investigate.outputs.response.?additional_attempts.orValue(null)
          != null ? states.investigate.outputs.response.additional_attempts : 4) + '' '' + states.setup.outputs.text.attempts
          : states.setup.outputs.text.continue,''feedback_mode'':''forbidden'',''allow_attachments'':false,''continues_review'':false}]
          : []) + [{''id'':''question'',''label'':states.setup.outputs.text.question,''feedback_mode'':''required'',''allow_attachments'':true,''continues_review'':true},{''id'':''revise'',''label'':states.setup.outputs.text.change,''feedback_mode'':''required'',''allow_attachments'':true,''continues_review'':false}]
          + (states.prepare_review.outputs.result.status == ''passed'' && size(states.prepare_review.outputs.documents)>0
          ? [{''id'':''annotate'',''label'':''Review doc comments'',''feedback_mode'':''required'',''allow_attachments'':true,''continues_review'':false}]
          : []),''feedback'':{''label'':states.setup.outputs.text.message},''settings'':[states.setup.outputs.setting],''conversation'':[]},states.prepare_review.outputs.primary],
          ''.[1] as $primary | .[0] + (if $primary != "" and (.[0].documents|has($primary)) then {overview_document_id:$primary} else {} end)'')
          }}'
        prompt: ${{ states.setup.outputs.text.task }}
        schema: ${{ states.setup.outputs.schema }}
        documents: ${{ jq([inputs.documents,states.prepare_review.outputs.documents], "add") }}
        agent_settings: ${{ inputs.agent_settings }}
        session: ${{ states.investigate.outputs.session }}
      transitions:
      - to: done
        when: outputs.native.response.direction == 'continue' && states.assess.outputs.eligible && states.prepare_review.outputs.result.status
          == 'passed'
        payload:
          result: ${{ jq([states.investigate.outputs.response,{'status':'resume','human':outputs.native,'documents':outputs.documents,'conversation':outputs.conversation,'review_id':outputs.review_id}],
            'add') }}
          session: ${{ outputs.session }}
      - to: turn
        when: 'true'
        payload:
          feedback: ${{ jq([outputs.native,{'validation':states.prepare_review.outputs.result,'documents':outputs.documents,'conversation':outputs.conversation,'review_id':outputs.review_id}],
            'add') }}
          human: ${{ outputs.native }}
          session: ${{ outputs.session }}
          allow_resume: false
outputs:
  session: ${{ states.done.outputs.session }}
  result: ${{ jq([states.done.outputs.result,states.done.outputs.documents], '.[1] as $files | .[0] | if .approval.patch
    then .approval.patch = $files[.approval.patch] else . end') }}
  documents: '${{ size(states.done.outputs.documents)>0 ? states.done.outputs.documents : inputs.documents }}'
