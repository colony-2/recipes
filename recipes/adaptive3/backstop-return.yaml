id: adaptive3-backstop-return
inputs:
  result: ${{ inputs.result }}
  problem: ${{ inputs.problem }}
  retry: ${{ inputs.?retry.orValue({}) }}
sequence:
- id: dispatch
  include: ./retry.yaml
  inputs:
    previous: ${{ inputs.retry }}
    receipt: ${{ inputs.result.?human.orValue({}).?receipt.orValue({}) }}
    dispatch: true
    merge_extension: >-
      ${{ inputs.problem.?loop.orValue('') == 'merge' && inputs.result.stage == 'implementation' ? inputs.result.?additional_attempts.orValue(1) : 0 }}
outputs:
  retry: ${{ sequence.dispatch.outputs.change.retry }}
  result: >-
    ${{ jq([inputs.result, inputs.problem], vars.visit) }}
vars:
  visit: |-
    .[0] as $r | .[1] as $p | $r | del(.budget,.visit_allowance) |
    if $p.budget.stage == $r.stage and ($p.loop | IN("work","consultation","children","packages")) and ($r.additional_attempts // 1)>1
    then .visit_allowance = {($p.loop):$r.additional_attempts} else . end
