id: adaptive3-execute
inputs:
  merge_state: ${{ inputs.?merge_state.orValue({}) }}
  accepted: ${{ inputs.?accepted.orValue({}) }}
  recovery: ${{ inputs.?recovery.orValue(false) }}
  prior_publication: ${{ inputs.?prior_publication.orValue(null) }}
  merge_queue: ${{ inputs.?merge_queue.orValue(false) }}
  refresh: ${{ inputs.?refresh.orValue(false) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  plan: ${{ inputs.?plan.orValue({}) }}
  purpose: ${{ inputs.purpose }}
  contribution: ${{ inputs.?contribution.orValue({}) }}
  verification: ${{ inputs.?verification.orValue({}) }}
  queue_history: ${{ inputs.?queue_history.orValue({}) }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  finding: ${{ inputs.?finding.orValue(null) }}
  review_notes: ${{ inputs.?review_notes.orValue({}) }}
  settings: ${{ inputs.?settings.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: context
  states:
    context:
      inputs:
        resumed_repair: ${{ inputs.purpose == 'implementation' && size(inputs.session)>0 && inputs.finding != null }}
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        feedback: ${{ inputs.feedback }}
        finding: >-
          ${{ inputs.finding != null ? inputs.finding : inputs.feedback }}
        settings: ${{ inputs.settings }}
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/execute.yaml
        inputs:
          purpose: ${{ inputs.purpose }}
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          feedback: ${{ inputs.feedback }}
          finding: ${{ inputs.finding }}
          guidance: ${{ inputs.settings.?prompt_additions.orValue({})[?{'direction':'design','preparation':'test_plan','implementation':'implementation','outcome':'','integration':'','advice':'design'}[inputs.purpose]].orValue('')
            }}
      outputs:
        finding_documents: ${{ inputs.finding.?documents.orValue({}) }}
        errors: ${{ inputs.finding.?errors.orValue({}) }}
        schema: >-
          ${{ inputs.purpose == 'implementation' ? jq(sequence.schemas.outputs.execute,
            '.properties.status.enum += ["repair"]') : sequence.schemas.outputs.execute }}
        task: >-
          ${{ inputs.resumed_repair ? sequence.prompts.outputs.repair : sequence.prompts.outputs.task }}
      transitions:
      - to: queue
        when: inputs.purpose == 'integration' && (has(inputs.feedback.queue_recovery) || (inputs.queue_history.?status.orValue('')=='stuck' && inputs.queue_history.?receiver.orValue(null)!=null))
      - to: receipt
        when: inputs.purpose == 'integration'
      - to: refresh
        when: inputs.purpose == 'implementation' && inputs.refresh
      - to: before_design
        when: inputs.purpose == 'direction'
      - to: work
        when: 'true'
    receipt:
      include: ./merge-receipt.yaml
      inputs:
        merge_state: ${{ inputs.merge_state }}
        accepted: ${{ inputs.accepted }}
        recovery: ${{ inputs.recovery }}
        prior_publication: ${{ inputs.prior_publication }}
        documents: ${{ inputs.documents }}
      transitions:
      - to: done
        when: outputs.result.status == 'stuck'
        payload:
          result: ${{ outputs.result }}
      - to: inline_retry
        when: outputs.merge_state.?queue_result.orValue({}).?publish.orValue({}).?status.orValue('')=='failed' &&
          size(outputs.merge_state.queue_result.?inline_publication.orValue({}))>0
      - to: queue_completed
        when: size(outputs.merge_state.?queue_result.orValue({}))>0
      - to: confirmed
        when: size(outputs.merge_state)>0
      - to: classify
        when: 'true'
    confirmed:
      sequence: []
      inputs:
        merge_state: >-
          ${{ size(states.receipt.outputs.merge_state)>0 ? states.receipt.outputs.merge_state :
            {'binding':states.receipt.outputs.binding,
             'publication':state_exists('queue') ? states.queue.outputs.result.publication : states.merge.outputs.result} }}
      outputs:
        merge_state: ${{ inputs.merge_state }}
      transitions:
      - to: publish
        when: 'true'
    refresh:
      include: ./prepare-candidate.yaml
      inputs:
        refresh_only: true
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        settings: ${{ inputs.settings }}
      transitions:
      - to: done
        when: outputs.result.status == 'stuck'
      - to: work
        when: 'true'
    before_design:
      include: ./hooks.yaml
      inputs:
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        settings: ${{ inputs.settings }}
        hook: before_design
      transitions:
      - to: work
        when: 'true'
    work:
      include: ./agent.yaml
      inputs:
        prompt: >-
          ${{ state_output('refresh','result',{}).?status.orValue('') == 'changes'
            ? states.context.outputs.task + "\n\n" + states.refresh.outputs.result.summary
            : states.context.outputs.task }}
        schema: ${{ states.context.outputs.schema }}
        documents: >-
          ${{ jq([inputs.documents,
            jq(inputs.plan.?documents.orValue({}),'with_entries(.key = "approved/" + .key | .value.name = .key)'),
            states.context.outputs.finding_documents, inputs.review_notes,
            states.context.outputs.errors, state_output('before_design','artifacts',{}), state_output('refresh','artifacts',{})], 'add') }}
        session: ${{ inputs.session }}
        read_only: ${{ inputs.purpose != 'implementation' }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: 'true'
    classify:
      include: ./publisher-scope.yaml
      transitions:
      - to: done
        when: outputs.result.status == 'changes'
        payload:
          result: ${{ jq([outputs.result,{'initial_submitted_at':inputs.queue_history.?initial_submitted_at.orValue('')}],'add') }}
      - to: done
        when: outputs.result.status != 'passed'
        payload:
          result: ${{ outputs.result }}
      - to: queue
        when: inputs.merge_queue
      - to: merge
        when: 'true'
    queue:
      include: ./merge-queue-submit.yaml
      inputs:
        inline: ${{ state_output('classify','kind','') == 'publisher' }}
        contribution: ${{ inputs.contribution }}
        verification: ${{ inputs.verification }}
        queue_history: ${{ inputs.queue_history }}
        recovery: ${{ inputs.feedback.?queue_recovery.orValue({}) }}
        recovering: ${{ has(inputs.feedback.queue_recovery) }}
        documents: ${{ inputs.documents }}
        require_verification: ${{ inputs.require_verification }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ inputs.settings }}
      transitions:
      - to: queue_completed
        when: outputs.result.status == 'passed' || size(outputs.result.?inline_publication.orValue({}))>0
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.result }}
    queue_completed:
      sequence: []
      inputs:
        merge_state: >-
          ${{ size(state_output('receipt','merge_state',{}).?queue_result.orValue({}))>0
            ? states.receipt.outputs.merge_state
            : {'binding':state_output('receipt','binding',{}),
               'publication':states.queue.outputs.result.publication,
               'queue_result':states.queue.outputs.result} }}
      outputs:
        merge_state: ${{ inputs.merge_state }}
        result: ${{ inputs.merge_state.queue_result }}
      transitions:
      - to: done
        when: 'true'
    inline_retry:
      # Only the receipt checker can admit this retained internal state. General
      # feedback and queue history cannot authorize an inline publication retry.
      include: ./hooks.yaml
      inputs:
        hook: publish
        publication: ${{ states.receipt.outputs.merge_state.queue_result.inline_publication.context.source }}
        publication_base: ${{ states.receipt.outputs.merge_state.queue_result.inline_publication.context.base }}
        request: ${{ states.receipt.outputs.merge_state.queue_result.inline_publication.context.request }}
        documents: ${{ states.receipt.outputs.merge_state.queue_result.inline_publication.context.documents }}
        target_directory: ${{ states.receipt.outputs.merge_state.queue_result.inline_publication.policy.target_directory }}
        settings: ${{ states.receipt.outputs.merge_state.queue_result.inline_publication.policy.settings }}
      catch:
      - when: failure.kind != 'cancellation'
        continue:
          outputs:
            result:
              api_version: c2.build-hook/v1
              status: failed
              summary: ${{ failure.message }}
              artifact_refs: {}
              failure: ${{ json_parse(json_stringify(failure)) }}
            artifacts: {}
      transitions:
      - to: inline_recovered
        when: 'true'
    inline_recovered:
      inputs:
        merge_state: ${{ states.receipt.outputs.merge_state }}
        result: >-
          ${{ jq([states.receipt.outputs.merge_state.queue_result,{
            'status':states.inline_retry.outputs.result.status=='failed' ? 'stuck' : 'passed',
            'summary':states.inline_retry.outputs.result.summary,
            'publish':states.inline_retry.outputs.result,
            'queue_publication':jq([states.receipt.outputs.merge_state.queue_result.queue_publication,
              {'result':states.inline_retry.outputs.result}],'add'),
            'errors':jq([states.receipt.outputs.merge_state.queue_result.errors,states.inline_retry.outputs.artifacts],'add')
          }],'add') }}
      sequence: []
      outputs:
        result: ${{ inputs.result }}
        merge_state: ${{ jq([inputs.merge_state,{'queue_result':inputs.result}],'add') }}
      transitions:
      - to: done
        when: 'true'
    merge:
      include: ./integration.yaml
      inputs:
        operation: merge
        message: ${{ inputs.request }}
      transitions:
      - to: confirmed
        when: 'true'
    publish:
      include: ./hooks.yaml
      inputs:
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        settings: ${{ inputs.settings }}
        hook: publish
        publication: ${{ states.confirmed.outputs.merge_state.publication }}
      catch:
      - when: failure.kind != 'cancellation'
        continue:
          outputs:
            result:
              status: failed
              summary: ${{ failure.message }}
              failure: ${{ json_parse(json_stringify(failure)) }}
            artifacts: {}
      transitions:
      - to: done
        when: 'true'
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.?result.orValue({}) }}
outputs:
  merge_state: ${{ state_output('inline_recovered','merge_state',state_output('queue_completed','merge_state',state_output('confirmed','merge_state',inputs.merge_state))) }}
  response: >-
    ${{ inputs.purpose == 'integration'
      ? (state_exists('publish')
        ? {'status':states.publish.outputs.result.status == 'failed' ? 'stuck' : 'ready',
           'summary':states.publish.outputs.result.summary,
           'publication':states.confirmed.outputs.merge_state.publication,
           'initial_submitted_at':state_output('queue','result',{}).?initial_submitted_at.orValue(inputs.queue_history.?initial_submitted_at.orValue('')),
           'publish':states.publish.outputs.result,'errors':states.publish.outputs.artifacts}
        : (state_exists('inline_recovered')
          ? jq([states.inline_recovered.outputs.result,{'status':states.inline_recovered.outputs.result.status=='passed' ? 'ready' : 'stuck'}],'add')
          : (state_exists('queue_completed')
            ? jq([states.queue_completed.outputs.result,{'status':states.queue_completed.outputs.result.status=='passed' ? 'ready' : 'stuck'}],'add')
            : states.done.outputs.result)))
      : (state_output('refresh','result',{}).?status.orValue('') == 'stuck' ? states.refresh.outputs.result :
        (state_output('before_design','result',{}).?status.orValue('') == 'failed' && states.work.outputs.response.status == 'ready'
          ? {'status':'changes','summary':states.before_design.outputs.result.summary,'errors':states.before_design.outputs.artifacts}
          : states.work.outputs.response)) }}
  documents: '${{ state_exists(''work'') && size(jq(states.work.outputs.artifacts,''with_entries(select(.key|startswith("review/")))''))>0
    ? jq([states.work.outputs.artifacts,inputs.documents],''(.[0] | with_entries(select(.key|startswith("review/")))) + (.[1] | with_entries(select(.key|startswith("review/negotiations/"))))'') : inputs.documents
    }}'
  session: ${{ state_output('work','session',{}) }}
  artifacts: >-
    ${{ state_exists('work') ? states.work.outputs.artifacts :
      (state_exists('inline_recovered') ? states.inline_recovered.outputs.result.errors :
        state_output('publish','artifacts',state_output('queue','result',{}).?errors.orValue(
          state_output('queue','result',{}).?publish.orValue({}).?artifact_refs.orValue({})))) }}
  jobs: ${{ state_output('work','jobs',[]) }}
