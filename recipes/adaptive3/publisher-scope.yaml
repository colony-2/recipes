id: adaptive3-publisher-scope
sequence:
- id: inspect
  op: command_execution
  const: true
  inputs:
    env:
      BASE: ${{ context.git.execution.base_hash }}
    run: |
      set -eu
      hook=.c2/recipes/hooks/build/publish
      publisher=$(git diff --no-renames --name-only "$BASE" HEAD -- "$hook.yaml" "$hook/")
      if [ -z "$publisher" ]; then
        printf product
      elif git diff --quiet --no-renames "$BASE" HEAD -- ":(exclude)$hook.yaml" ":(exclude)$hook/"; then
        printf publisher
      else
        test "$?" -eq 1
        printf mixed
      fi
vars:
  results:
    product: &eligible {status: passed}
    publisher: *eligible
    mixed:
      status: changes
      stage: implementation
      summary: Split the publish hook and its private files into a separate contribution from the product changes.
  failure:
    status: stuck
    summary: Could not classify the prepared Git diff for merge.
outputs:
  kind: ${{ sequence.inspect.outputs.stdout }}
  result: >-
    ${{ sequence.inspect.outputs.success
      ? vars.results[?sequence.inspect.outputs.stdout].orValue(vars.failure) : vars.failure }}
