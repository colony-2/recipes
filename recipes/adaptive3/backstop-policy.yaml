# Derive entry eligibility from current native lifecycle outputs. No validity ledger.
id: adaptive3-backstop-policy
inputs:
  direction: ${{ inputs.direction }}
  preparation: ${{ inputs.preparation }}
  implementation: ${{ inputs.implementation }}
  outcome: ${{ inputs.outcome }}
  publication_recovery: ${{ inputs.?publication_recovery.orValue(false) }}
  prior_job_recovery: ${{ inputs.?prior_job_recovery.orValue(false) }}
sequence: []
outputs:
  prerequisites: >-
    ${{ inputs.prior_job_recovery ? {} : jq([inputs.direction,inputs.preparation,inputs.implementation,inputs.outcome,inputs.publication_recovery], vars.program) }}
vars:
  program: |
    .[0] as $d | .[1] as $p | .[2] as $i | .[3] as $o | .[4] as $publication |
    def decision:
      (.decision // .result.receipt // .source) |
      if type == "object" and (has("request_id") or has("submission_id")) then {request_id,submission_id} else . end;
    ($d.result.status == "accepted") as $direction |
    ($direction and ($d|decision) != null and $p.result.status == "accepted" and ($p.basis | decision) == ($d | decision)) as $preparation |
    ($direction and $d.short_path == true) as $short |
    (if $short then $d else $p end | decision) as $assignment |
    (($preparation or $short) and $assignment != null and $i.result.status == "accepted" and ($i.basis | decision) == $assignment) as $implemented |
    {configure:true, direction:true, preparation:$direction, implementation:($preparation or $short),
     outcome:$implemented,
     integration:($implemented and $o.result.receipt != null and ($o.basis.basis | decision) == $assignment
       and $o.basis.candidate == $i.candidate and $o.basis.verification == $i.verification) or $publication}
