id: adaptive3-validate
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  settings: ${{ inputs.?settings.orValue({}) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  work: ${{ inputs.?work.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: files
  states:
    files:
      include: ./tools.yaml
      inputs:
        documents: ${{ inputs.documents }}
        title: ${{ inputs.work.?title.orValue('') }}
        primary: ${{ inputs.work.?primary.orValue('') }}
        check: review_files
      transitions:
      - to: verify
        when: inputs.purpose == 'implementation'
      - to: candidate
        when: inputs.purpose == 'outcome'
      - to: specialists
        when: 'true'
    verify:
      include: ./hooks.yaml
      inputs:
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        settings: ${{ inputs.settings }}
        hook: verify
      transitions:
      - to: specialists
        when: 'true'
    candidate:
      include: ./tools.yaml
      inputs:
        check: approved_change
      transitions:
      - to: specialists
        when: 'true'
    assess:
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        documents: ${{ jq([inputs.documents,states.files.outputs.artifacts,state_output('verify','artifacts',{}),state_output('candidate','artifacts',{}),states.specialists.outputs.artifacts],
          'add') }}
        checks: ${{ {'files':states.files.outputs.result,'verify':state_output('verify','result',{}),'specialists':states.specialists.outputs.result}
          }}
        guidance: ${{ inputs.settings.?prompt_additions.orValue({})[?vars.policies[inputs.purpose].guidance].orValue('')
          }}
        feedback: ${{ inputs.feedback }}
        agent_settings: ${{ inputs.agent_settings }}
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/validate.yaml
        inputs:
          purpose: ${{ inputs.purpose }}
          request: ${{ inputs.request }}
          checks: ${{ inputs.checks }}
          guidance: ${{ inputs.guidance }}
          feedback: ${{ inputs.feedback }}
      - id: agent
        include: ./agent.yaml
        inputs:
          prompt: ${{ sequence.prompts.outputs.task }}
          schema: ${{ sequence.schemas.outputs.validate }}
          documents: ${{ inputs.documents }}
          read_only: true
          agent_settings: ${{ inputs.agent_settings }}
      outputs:
        result: ${{ sequence.agent.outputs.response }}
      transitions:
      - to: done
        when: 'true'
    specialists:
      include: ./specialists.yaml
      inputs:
        settings: ${{ inputs.settings }}
        request: ${{ inputs.request }}
        documents: ${{ inputs.documents }}
        checkpoint: ${{ vars.policies[inputs.purpose].checkpoint }}
        purpose: ${{ inputs.purpose }}
        guidance: ${{ inputs.settings.?prompt_additions.orValue({})[?vars.policies[inputs.purpose].guidance].orValue('')
          }}
        feedback: ${{ inputs.feedback }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: assess
        when: 'true'
    done:
      sequence: []
      outputs:
        findings: ${{ inputs.findings }}
      inputs:
        findings: '${{ (inputs.purpose in [''direction'',''outcome''] && (!nonempty(inputs.work.?primary.orValue(''''))
          || !nonempty(inputs.work.?title.orValue(''''))) ? [''Provide the primary review document and a descriptive
          review title.''] : []) + (inputs.purpose == ''advice'' && nonempty(inputs.work.?assignment.orValue(''''))
          && !nonempty(inputs.work.?title.orValue('''')) ? [''Give the proposed assignment a descriptive title before
          submitting it.''] : []) + (states.files.outputs.result.status != ''passed'' ? [states.files.outputs.result.summary]
          : []) + (inputs.purpose == ''implementation'' && (states.verify.outputs.result.status == ''failed'' ||
          (inputs.require_verification && states.verify.outputs.result.status != ''passed'')) ? [states.verify.outputs.result.summary]
          : []) + states.specialists.outputs.result.assessments.filter(r,r.required && r.result.status != ''passed'').map(r,r.result.summary)
          + (states.assess.outputs.result.status != ''passed'' ? [states.assess.outputs.result.summary] : []) }}'
outputs:
  result: '${{ size(states.done.outputs.findings)>0 ? {''status'':''changes'',''summary'':jq(states.done.outputs.findings,''join("\n\n")'')}
    : states.assess.outputs.result }}'
  artifacts: ${{ jq([states.files.outputs.artifacts,state_output('verify','artifacts',{}),states.specialists.outputs.artifacts],
    'add') }}
  candidate: ${{ state_output('candidate','result',{}) }}
  patch: '${{ state_exists(''candidate'') ? states.candidate.outputs.artifacts[''candidate.diff''] : null }}'
vars:
  policies:
    direction:
      checkpoint: before_design
      guidance: plan_assessment
    preparation:
      checkpoint: plan_assessment
      guidance: plan_assessment
    implementation:
      checkpoint: outcome_assessment
      guidance: outcome_assessment
    outcome:
      checkpoint: ''
      guidance: outcome_assessment
    integration:
      checkpoint: ''
      guidance: ''
    advice:
      checkpoint: ''
      guidance: ''
