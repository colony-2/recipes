id: adaptive3-validate
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  title: ${{ inputs.?title.orValue('') }}
  primary: ${{ inputs.?primary.orValue('') }}
  settings: ${{ inputs.?settings.orValue({}) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
state:
  initial: files
  states:
    files:
      include: ./tools.yaml
      inputs:
        documents: ${{ inputs.documents }}
        title: ${{ inputs.title }}
        primary: ${{ inputs.primary }}
        check: review_files
      transitions:
      - to: verify
        when: inputs.purpose == 'implementation'
      - to: candidate
        when: inputs.purpose == 'outcome'
      - to: assess
        when: 'true'
    verify:
      include: ./hooks.yaml
      inputs:
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        settings: ${{ inputs.settings }}
        hook: verify
      transitions:
      - to: assess
        when: 'true'
    candidate:
      include: ./tools.yaml
      inputs:
        check: approved_change
      transitions:
      - to: assess
        when: 'true'
    assess:
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        documents: ${{ jq([inputs.documents,states.files.outputs.artifacts,state_output('verify','artifacts',{})],
          'add') }}
        checks: ${{ {'files':states.files.outputs.result,'verify':state_output('verify','result',{})} }}
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/validate.yaml
        inputs:
          purpose: ${{ inputs.purpose }}
          request: ${{ inputs.request }}
          checks: ${{ inputs.checks }}
      - id: agent
        include: ./agent.yaml
        inputs:
          prompt: ${{ sequence.prompts.outputs.task }}
          schema: ${{ sequence.schemas.outputs.validate }}
          documents: ${{ inputs.documents }}
          read_only: true
      outputs:
        result: ${{ sequence.agent.outputs.response }}
      transitions:
      - to: specialists
        when: inputs.purpose in ['preparation','implementation']
      - to: done
        when: 'true'
    specialists:
      include: ./specialists.yaml
      inputs:
        settings: ${{ inputs.settings }}
        request: ${{ inputs.request }}
        documents: ${{ inputs.documents }}
        checkpoint: ${{ inputs.purpose == 'preparation' ? 'plan_assessment':'outcome_assessment' }}
      transitions:
      - to: done
        when: 'true'
    done:
      sequence: []
outputs:
  result: '${{ inputs.purpose in [''direction'',''outcome''] && (inputs.primary == '''' || inputs.title == '''')
    ? {''status'':''changes'',''summary'':''Provide the primary review document and a descriptive review title.''}
    : (state_exists(''specialists'') && states.specialists.outputs.result.status != ''passed'' ? states.specialists.outputs.result
    : (states.files.outputs.result.status != ''passed'' ? states.files.outputs.result : (inputs.purpose == ''implementation''
    && (states.verify.outputs.result.status == ''failed'' || (inputs.require_verification && states.verify.outputs.result.status
    != ''passed'')) ? {''status'':''changes'',''summary'':states.verify.outputs.result.summary,''check'':states.verify.outputs.result}
    : states.assess.outputs.result))) }}'
  artifacts: ${{ jq([states.files.outputs.artifacts,state_output('verify','artifacts',{})], 'add') }}
  candidate: ${{ state_output('candidate','result',{}) }}
  patch: '${{ state_exists(''candidate'') ? states.candidate.outputs.artifacts[''candidate.diff''] : null }}'
