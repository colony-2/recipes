id: adaptive3-validate
inputs:
  merge_queue: ${{ inputs.?merge_queue.orValue(false) }}
  plan: ${{ inputs.?plan.orValue({}) }}
  presentation: ${{ inputs.?presentation.orValue({}) }}
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  settings: ${{ inputs.?settings.orValue({}) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  finding: ${{ inputs.?finding.orValue({}) }}
  review_reply: ${{ inputs.?review_reply.orValue({}) }}
  work: ${{ inputs.?work.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  specialists: ${{ inputs.?specialists.orValue({}) }}
  verification: ${{ inputs.?verification.orValue({}) }}
  approval: ${{ inputs.?approval.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: files
  states:
    files:
      include: ./tools.yaml
      inputs:
        documents: ${{ inputs.documents }}
        title: ${{ inputs.work.?title.orValue('') }}
        primary: ${{ inputs.work.?primary.orValue('') }}
        document_details: ${{ inputs.work.?document_details.orValue([]) }}
        require_document_details: >-
          ${{ inputs.purpose != 'integration' && (nonempty(inputs.work.?primary.orValue('')) ||
            !(vars.short_direction || inputs.purpose == 'implementation' ||
              (inputs.purpose == 'advice' && inputs.documents.all(k,k.startsWith('review/negotiations/'))))) }}
        presentation: ${{ inputs.presentation }}
        preparation_packet: ${{ inputs.purpose == 'preparation' }}
        check: review_files
      transitions:
      - to: done
        when: outputs.result.status != 'passed'
        payload:
          result: ${{ outputs.result }}
      - to: done
        when: '!vars.short_direction && size(vars.packet_findings)>0'
        payload:
          result: ${{ {'status':'changes','summary':jq(vars.packet_findings,'join("\n")')} }}
      - to: prepare
        when: inputs.purpose == 'implementation'
      - to: candidate
        when: inputs.purpose == 'outcome'
      - to: specialists
        when: 'true'
    prepare:
      include: ./prepare-candidate.yaml
      inputs:
        merge_queue: ${{ inputs.merge_queue }}
        previous: ${{ inputs.verification.?contribution.orValue({}) }}
        commit: ${{ inputs.work.?commit.orValue(null) }}
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        settings: ${{ inputs.settings }}
      transitions:
      - to: describe
        when: outputs.result.status == 'passed' && !inputs.merge_queue
      - to: verify
        when: outputs.result.status == 'passed'
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.result }}
    describe:
      include: ./commit-message.yaml
      inputs:
        commit: ${{ inputs.work.?commit.orValue(null) }}
      transitions:
      - to: verify
        when: outputs.result.status == 'passed'
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.result }}
    verify:
      include: ./verify-candidate.yaml
      inputs:
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        settings: ${{ inputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        previous: ${{ inputs.verification }}
      transitions:
      - to: done
        when: outputs.result.status == 'changes'
        payload:
          result: >-
            ${{ jq(outputs.result, '. + {failed_checks: [(.checks // {}) | to_entries[] | select(.value == "failed") | .key] | sort}') }}
      - to: compare_approval
        when: size(inputs.approval)>0
      - to: specialists
        when: 'true'
    compare_approval:
      include: ./compare-approval.yaml
      inputs:
        approval: ${{ inputs.approval }}
      transitions:
      - to: done
        when: outputs.equivalent
        payload:
          result:
            status: approved_rebase
            summary: The verified candidate carries the previously approved change.
      - to: specialists
        when: 'true'
    candidate:
      include: ./tools.yaml
      inputs:
        check: approved_change
      transitions:
      - to: specialists
        when: 'true'
    assess:
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        documents: ${{ jq([inputs.finding.?amendment.orValue({}).?documents.orValue({}),inputs.documents,jq(inputs.plan.?documents.orValue({}),'with_entries(.key = "approved/" + .key | .value.name = .key)'),states.files.outputs.artifacts,state_output('verify','artifacts',{}),state_output('candidate','artifacts',{}),states.specialists.outputs.artifacts,inputs.review_reply.?documents.orValue({})],
          'add') }}
        document_details: ${{ jq(states.files.outputs.document_metadata,'to_entries | map(.value + {document_id:.key})') }}
        checks: ${{ {'files':states.files.outputs.result,'verify':state_output('verify','result',{}),'specialists':states.specialists.outputs.result}
          }}
        guidance: ${{ inputs.settings.?prompt_additions.orValue({})[?vars.policies[inputs.purpose].guidance].orValue('')
          }}
        finding: ${{ inputs.finding }}
        approval_guidance: ${{ inputs.plan.?human.orValue({}).?response.orValue({}).?feedback.orValue('') }}
        review_reply: ${{ inputs.review_reply }}
        session: ${{ inputs.session }}
        agent_settings: ${{ inputs.agent_settings }}
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/validate.yaml
        inputs:
          purpose: ${{ inputs.purpose }}
          request: ${{ inputs.request }}
          checks: ${{ inputs.checks }}
          document_details: ${{ inputs.document_details }}
          guidance: ${{ inputs.guidance }}
          finding: ${{ inputs.finding }}
          approval_guidance: ${{ inputs.approval_guidance }}
          review_reply: ${{ inputs.review_reply }}
      - id: agent
        include: ./agent.yaml
        inputs:
          prompt: ${{ sequence.prompts.outputs.task }}
          schema: >-
            ${{ jq([sequence.schemas.outputs.validate,inputs.purpose],
              '.[1] as $stage | .[0] | .properties.status.enum += (if $stage == "outcome" then ["repair_implementation"] elif $stage == "implementation" then ["report_edit"] else [] end)') }}
          documents: ${{ inputs.documents }}
          read_only: true
          session: ${{ inputs.session }}
          agent_settings: ${{ inputs.agent_settings }}
      outputs:
        result: ${{ sequence.agent.outputs.response }}
        session: ${{ sequence.agent.outputs.session }}
      transitions:
      - to: done
        when: 'true'
    specialists:
      include: ./specialists.yaml
      inputs:
        settings: ${{ inputs.settings }}
        sessions: ${{ inputs.specialists }}
        request: ${{ inputs.request }}
        documents: ${{ jq([inputs.documents,inputs.review_reply.?documents.orValue({})],'add') }}
        checkpoint: ${{ vars.policies[inputs.purpose].checkpoint }}
        purpose: ${{ inputs.purpose }}
        guidance: ${{ inputs.settings.?prompt_additions.orValue({})[?vars.policies[inputs.purpose].guidance].orValue('')
          }}
        finding: ${{ inputs.finding }}
        review_reply: ${{ inputs.review_reply }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: assess
        when: 'true'
    done:
      sequence: []
      inputs:
        findings: '${{ state_output(''specialists'',''result'',{}).?assessments.orValue([]).filter(r,r.required && r.result.status != ''passed'').map(r,r.result.summary)
          + (state_output(''assess'',''result'',{}).?status.orValue(''passed'') in [''changes'',''stuck''] ? [states.assess.outputs.result.summary] : []) }}'
        result: ${{ transition.payload.?result.orValue(state_output('assess','result',{})) }}
      outputs:
        findings: ${{ inputs.findings }}
        result: ${{ inputs.result }}
outputs:
  checkpoints: >-
    ${{ jq(state_output('verify','result',{}), '[(if .status == "passed" then "verify" else empty end), ((.checks // {}) | to_entries[] | select(.value == "passed") | "verify/" + .key)]') }}
  document_metadata: ${{ states.files.outputs.document_metadata }}
  result: >-
    ${{ size(states.done.outputs.findings)>0
      ? {'status':'changes','summary':jq(states.done.outputs.findings,'join("\n\n")')}
      : inputs.purpose == 'outcome' && states.done.outputs.result.status == 'repair_implementation'
      ? {'status':'changes','stage':'implementation','summary':states.done.outputs.result.summary}
      : inputs.purpose == 'implementation' && states.done.outputs.result.status == 'report_edit'
      ? {'status':'passed','summary':states.done.outputs.result.summary}
      : states.done.outputs.result.status == 'revise_plan'
      ? {'status':'changes','stage':'preparation','summary':states.done.outputs.result.summary}
      : states.done.outputs.result }}
  session: ${{ state_output('assess','session',inputs.session) }}
  specialists: ${{ state_output('specialists','sessions',inputs.specialists) }}
  verification: >-
    ${{ inputs.merge_queue
      ? jq([state_output('verify','receipt',inputs.verification),{'contribution':
          state_output('prepare','contribution',inputs.verification.?contribution.orValue({}))}],'add')
      : (state_exists('verify') ? jq([states.verify.outputs.receipt,
          {'commit_message':states.describe.outputs.result.?message.orValue('')}],'add') : inputs.verification) }}
  artifacts: ${{ jq([states.files.outputs.artifacts,state_output('prepare','artifacts',{}),state_output('verify','artifacts',{}),state_output('specialists','artifacts',{})],
    'add') }}
  candidate: ${{ state_output('candidate','result',{}) }}
  patch: '${{ state_exists(''candidate'') ? states.candidate.outputs.artifacts[''candidate.diff''] : null }}'
vars:
  # Advice and implementation may finish without authoring a review document.
  # Attached negotiation history still goes through the file and link checks.
  short_direction: >-
    ${{ inputs.purpose == 'direction' && inputs.work.?delivery_route.orValue('') == 'short' && inputs.work.?work_kind.orValue('') != 'explanation' }}
  packet_findings: >-
    ${{ inputs.purpose in ['direction','outcome'] && (!nonempty(inputs.work.?primary.orValue('')) || !nonempty(inputs.work.?title.orValue('')))
      ? ['Provide the primary review document and a descriptive review title.']
      : inputs.purpose == 'preparation' && (inputs.work.?primary.orValue('') != 'review/one-pager.md'
        || !['review/design.md','review/acceptance.md'].all(k,k in inputs.documents))
      ? ['Supply the Preparation one-pager, design and promised behaviors in the required review files.']
      : inputs.purpose == 'advice' && nonempty(inputs.work.?assignment.orValue('')) && !nonempty(inputs.work.?title.orValue(''))
      ? ['Give the proposed assignment a descriptive title before submitting it.'] : [] }}
  policies:
    direction:
      checkpoint: before_design
      guidance: plan_assessment
    preparation:
      checkpoint: plan_assessment
      guidance: plan_assessment
    implementation:
      checkpoint: outcome_assessment
      guidance: outcome_assessment
    outcome:
      checkpoint: ''
      guidance: outcome_assessment
    integration:
      checkpoint: ''
      guidance: ''
    advice:
      checkpoint: ''
      guidance: ''
