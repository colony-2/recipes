schema_version: 2
id: adaptive3-schemas
sequence: []
outputs:
  execute:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - consult
        - packages
        - stuck
      summary:
        type: string
        maxLength: 4000
      title:
        type:
        - string
        - 'null'
        maxLength: 120
      primary:
        type:
        - string
        - 'null'
      work_kind:
        type:
        - string
        - 'null'
        enum:
        - feature
        - bug
        - explanation
        - oversight
        - null
      consultation:
        type:
        - object
        - 'null'
        additionalProperties: false
        properties:
          cell:
            type: string
          request:
            type: string
            maxLength: 8000
          mode:
            type: string
            enum:
            - advice
            - delivery
        required:
        - cell
        - request
        - mode
      packages:
        type:
        - array
        - 'null'
        items:
          type: object
          additionalProperties: false
          properties:
            reference:
              type: string
            check:
              type: array
              items:
                type: string
              minItems: 1
          required:
          - reference
          - check
      assignment:
        type:
        - string
        - 'null'
        maxLength: 8000
      delivery_recipe:
        type:
        - string
        - 'null'
        maxLength: 2048
    required:
    - status
    - summary
    - title
    - primary
    - work_kind
    - consultation
    - packages
    - assignment
    - delivery_recipe
  validate:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - passed
        - changes
        - stuck
      summary:
        type: string
        maxLength: 4000
    required:
    - status
    - summary
  review:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - accepted
        - changes
        - answer
        - stuck
      summary:
        type: string
        maxLength: 4000
      stage:
        type:
        - string
        - 'null'
        enum:
        - direction
        - preparation
        - implementation
        - outcome
        - integration
        - null
    required:
    - status
    - summary
    - stage
  resolver:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - resume
        - ask
      summary:
        type: string
        maxLength: 4000
      stage:
        type: string
        enum:
        - configure
        - direction
        - preparation
        - implementation
        - outcome
        - integration
    required:
    - status
    - summary
    - stage
