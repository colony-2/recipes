schema_version: 2
id: adaptive3-schemas
sequence: []
outputs:
  execute:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - consult
        - packages
        - stuck
      summary:
        type: string
        maxLength: 4000
      title:
        type:
        - string
        - 'null'
        maxLength: 100
      primary:
        type:
        - string
        - 'null'
      work_kind:
        type:
        - string
        - 'null'
        enum:
        - feature
        - bug
        - explanation
        - oversight
        - null
      consultation:
        type:
        - object
        - 'null'
        additionalProperties: false
        properties:
          cell:
            type: string
          request:
            type: string
            maxLength: 8000
          mode:
            type: string
            enum:
            - advice
            - delivery
          job:
            type:
            - string
            - 'null'
            description: Existing active or completed job to consume instead of submitting another.
        required:
        - cell
        - request
        - mode
        - job
      packages:
        type:
        - array
        - 'null'
        items:
          type: object
          additionalProperties: false
          properties:
            reference:
              type: string
            check:
              type: array
              items:
                type: string
              minItems: 1
          required:
          - reference
          - check
      assignment:
        type:
        - string
        - 'null'
        maxLength: 8000
      delivery_recipe:
        type:
        - string
        - 'null'
        maxLength: 2048
    required:
    - status
    - summary
    - title
    - primary
    - work_kind
    - consultation
    - packages
    - assignment
    - delivery_recipe
  validate:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - passed
        - changes
        - stuck
      summary:
        type: string
        maxLength: 4000
    required:
    - status
    - summary
  review:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - accepted
        - changes
        - answer
        - stuck
      summary:
        type: string
        maxLength: 4000
      stage:
        type:
        - string
        - 'null'
        enum:
        - direction
        - preparation
        - implementation
        - outcome
        - integration
        - null
    required:
    - status
    - summary
    - stage
  backstop:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - resume
        - ask
      summary:
        type: string
        maxLength: 8000
      action:
        type:
        - string
        - 'null'
        description: Concrete next action available now and its limited result; null for diagnosis or unavailable future work.
      stage:
        type:
        - string
        - 'null'
        enum:
        - null
        - configure
        - direction
        - preparation
        - implementation
        - outcome
        - integration
      additional_attempts:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 20
        description: Finite extra attempts for the paused loop, when there is a concrete correction or progress.
      title:
        type: string
        minLength: 1
        maxLength: 100
        description: Name the concrete blocker or correction in plain English.
      primary:
        type:
        - string
        - 'null'
        description: An existing review document to open first, if useful; otherwise null.
    required:
    - status
    - summary
    - stage
    - action
    - additional_attempts
    - title
    - primary
  recovery:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - resume
        - ask
      summary:
        type: string
        maxLength: 8000
      action:
        type:
        - string
        - 'null'
        description: Concrete next action available now and its limited result; null for diagnosis or unavailable future work.
      stage:
        type:
        - string
        - 'null'
        enum:
        - null
        - configure
        - direction
        - preparation
        - implementation
        - outcome
        - integration
      approval:
        type:
        - object
        - 'null'
        additionalProperties: false
        properties:
          source_job:
            type: string
          source_task:
            type: string
          receipt:
            type: object
            additionalProperties: false
            properties:
              actor:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                  kind:
                    type: string
                required:
                - id
                - kind
              request_id:
                type: string
              submission_id:
                type: string
              submitted_at:
                type: string
            required:
            - actor
            - request_id
            - submission_id
            - submitted_at
          patch:
            type:
            - string
            - 'null'
        required:
        - source_job
        - source_task
        - receipt
        - patch
      publication:
        type:
        - object
        - 'null'
        additionalProperties: false
        properties:
          source_job:
            type: string
          source_task:
            type: string
          merged_hash:
            type: string
          target_branch:
            type:
            - string
            - 'null'
          publication_branch:
            type:
            - string
            - 'null'
          publication_disposition:
            type:
            - string
            - 'null'
          candidate_sha:
            type:
            - string
            - 'null'
          candidate_subject:
            type:
            - string
            - 'null'
        required:
        - source_job
        - source_task
        - merged_hash
        - target_branch
        - publication_branch
        - publication_disposition
        - candidate_sha
        - candidate_subject
      additional_attempts:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 20
        description: Finite extra attempts for the paused loop, when there is a concrete correction or progress.
      title:
        type: string
        minLength: 1
        maxLength: 100
        description: Name the concrete blocker or correction in plain English.
      primary:
        type:
        - string
        - 'null'
        description: An existing review document to open first, if useful; otherwise null.
    required:
    - status
    - summary
    - stage
    - action
    - approval
    - publication
    - additional_attempts
    - title
    - primary
