schema_version: 2
id: adaptive3-schemas
sequence: []
outputs:
  execute:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - ready
        - revise_plan
        - consult
        - packages
        - stuck
      summary:
        type: string
        maxLength: 4000
      title:
        type:
        - string
        - 'null'
        maxLength: 100
      document_details:
        type: array
        description: Describe new or changed attachments. Unchanged files can reuse their recorded descriptions.
        items:
          type: object
          additionalProperties: false
          properties:
            document_id:
              type: string
              minLength: 1
            title:
              type: string
              minLength: 1
              maxLength: 120
            description:
              type: string
              minLength: 1
              maxLength: 300
            role:
              type: string
              enum: [primary, supporting, diagnostic]
            order:
              type: integer
              minimum: 0
              maximum: 1000000
          required: [document_id, title, description, role, order]
      primary:
        type:
        - string
        - 'null'
      delivery_route:
        type: [string, 'null']
        enum: [standard, short, null]
        description: Direction selects short only for bounded work with concrete acceptance checks.
      work_kind:
        type:
        - string
        - 'null'
        enum:
        - feature
        - bug
        - explanation
        - oversight
        - null
      consultation:
        type:
        - object
        - 'null'
        additionalProperties: false
        properties:
          cell:
            type: string
          request:
            type: string
            maxLength: 8000
          mode:
            type: string
            enum:
            - advice
            - negotiate
            - delivery
          share_review:
            type: boolean
            description: Include the current review reply and its source when it affects this owner.
          thread:
            type: [string, 'null']
            description: ID from the agreement report path for delivery or for amending that agreement.
          job:
            type:
            - string
            - 'null'
            description: Existing active or completed job to consume instead of submitting another.
        required:
        - cell
        - request
        - mode
        - share_review
        - thread
        - job
      packages:
        type:
        - array
        - 'null'
        items:
          type: object
          additionalProperties: false
          properties:
            reference:
              type: string
            check:
              type: array
              items:
                type: string
              minItems: 1
          required:
          - reference
          - check
      negotiation_reply:
        type: [string, 'null']
        enum: [answer, question, alternative, null]
      assignment:
        type:
        - string
        - 'null'
        maxLength: 8000
      delivery_recipe:
        type:
        - string
        - 'null'
        maxLength: 2048
    required:
    - status
    - summary
    - title
    - primary
    - document_details
    - delivery_route
    - work_kind
    - consultation
    - packages
    - negotiation_reply
    - assignment
    - delivery_recipe
  commit:
    type: [object, 'null']
    additionalProperties: false
    properties:
      title: {type: string, minLength: 1}
      body: {type: string, minLength: 1}
    required: [title, body]
  validate:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - passed
        - covered
        - revise_plan
        - changes
        - stuck
      summary:
        type: string
        maxLength: 4000
    required:
    - status
    - summary
  review:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - accepted
        - changes
        - answer
        - stuck
      summary:
        type: string
        maxLength: 4000
      stage:
        type:
        - string
        - 'null'
        enum:
        - direction
        - preparation
        - implementation
        - outcome
        - integration
        - null
    required:
    - status
    - summary
    - stage
  backstop:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - resume
        - ask
      summary:
        type: string
        maxLength: 8000
      action:
        type:
        - string
        - 'null'
        description: Concrete next action available now and its limited result; null for diagnosis or unavailable future work.
      stage:
        type:
        - string
        - 'null'
        enum:
        - null
        - configure
        - direction
        - preparation
        - implementation
        - outcome
        - integration
      report:
        type: [object, 'null']
        description: Required when asking for human help; factual report with unknowns stated explicitly.
        additionalProperties: false
        properties:
          origin: {type: string, minLength: 1}
          work: {type: string, minLength: 1}
          blocker: {type: string, minLength: 1}
          options: {type: array, minItems: 1, items: {type: string, minLength: 1}}
          recommendation: {type: [string, 'null']}
          research: {type: [string, 'null']}
        required: [origin, work, blocker, options, recommendation, research]
      destination:
        type: [string, 'null']
        enum: [direction, preparation, implementation, outcome, integration, null]
        description: Intended phase after Configure; null for other returns.
      instruction:
        type: [object, 'null']
        description: Carry a precise human instruction or one local repair under the current assignment.
        additionalProperties: false
        properties:
          text: {type: string, minLength: 1}
          scope_change: {type: boolean}
        required: [text, scope_change]
      additional_attempts:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 20
        description: Finite extra attempts for the paused loop, when there is a concrete correction or progress.
      title:
        type: string
        minLength: 1
        maxLength: 100
        description: Name the concrete blocker or correction in plain English.
      document_details:
        type: array
        description: Describe new or changed attachments. Unchanged files can reuse their recorded descriptions.
        items:
          type: object
          additionalProperties: false
          properties:
            document_id:
              type: string
              minLength: 1
            title:
              type: string
              minLength: 1
              maxLength: 120
            description:
              type: string
              minLength: 1
              maxLength: 300
            role:
              type: string
              enum: [primary, supporting, diagnostic]
            order:
              type: integer
              minimum: 0
              maximum: 1000000
          required: [document_id, title, description, role, order]
      primary:
        type:
        - string
        - 'null'
        description: An existing review document to open first, if useful; otherwise null.
    required:
    - status
    - summary
    - stage
    - action
    - report
    - destination
    - instruction
    - additional_attempts
    - title
    - primary
    - document_details
  recovery:
    type: object
    additionalProperties: false
    properties:
      status:
        type: string
        enum:
        - resume
        - ask
      summary:
        type: string
        maxLength: 8000
      action:
        type:
        - string
        - 'null'
        description: Concrete next action available now and its limited result; null for diagnosis or unavailable future work.
      stage:
        type:
        - string
        - 'null'
        enum:
        - null
        - configure
        - direction
        - preparation
        - implementation
        - outcome
        - integration
      approval:
        type:
        - object
        - 'null'
        additionalProperties: false
        properties:
          source_job:
            type: string
          source_task:
            type: string
          receipt:
            type: object
            additionalProperties: false
            properties:
              actor:
                type: object
                additionalProperties: false
                properties:
                  id:
                    type: string
                  kind:
                    type: string
                required:
                - id
                - kind
              request_id:
                type: string
              submission_id:
                type: string
              submitted_at:
                type: string
            required:
            - actor
            - request_id
            - submission_id
            - submitted_at
          patch:
            type:
            - string
            - 'null'
        required:
        - source_job
        - source_task
        - receipt
        - patch
      queue_recovery:
        type: [object, 'null']
        additionalProperties: false
        properties:
          repair_job:
            type: [string, 'null']
            description: Exact job ID from the receiver restart receipt, when available.
          receiver:
            type: object
            description: Original native grouped start item; copy from retained task output.
            additionalProperties: false
            properties:
              job_id: {type: string}
              tenant_id: {type: string}
              cell: {type: string}
              cell_id: {type: string}
              cell_repo: {type: string}
              wait:
                type: object
                additionalProperties: false
                properties:
                  'on': {type: string, enum: [job, goal]}
                  condition: {type: string, enum: [complete, success]}
                required: ['on', condition]
            required: [job_id, tenant_id, cell, cell_id, cell_repo, wait]
          branch:
            type: string
          changeid:
            type: string
        required: [receiver, repair_job, branch, changeid]
      publication:
        description: Prior target-cell native producer reference to check before publication-only recovery; never trusted merge state.
        type:
        - object
        - 'null'
        additionalProperties: false
        properties:
          source_job:
            type: string
          source_task:
            type: string
          merged_hash:
            type: string
            pattern: '^[0-9a-f]{40}$'
          target_branch:
            type:
            - string
            - 'null'
          publication_branch:
            type:
            - string
            - 'null'
          publication_disposition:
            type:
            - string
            - 'null'
          candidate_sha:
            type:
            - string
            - 'null'
          candidate_subject:
            type:
            - string
            - 'null'
        required:
        - source_job
        - source_task
        - merged_hash
        - target_branch
        - publication_branch
        - publication_disposition
        - candidate_sha
        - candidate_subject
      report:
        type: [object, 'null']
        description: Required when asking for human help; factual report with unknowns stated explicitly.
        additionalProperties: false
        properties:
          origin: {type: string, minLength: 1}
          work: {type: string, minLength: 1}
          blocker: {type: string, minLength: 1}
          options: {type: array, minItems: 1, items: {type: string, minLength: 1}}
          recommendation: {type: [string, 'null']}
          research: {type: [string, 'null']}
        required: [origin, work, blocker, options, recommendation, research]
      destination:
        type: [string, 'null']
        enum: [direction, preparation, implementation, outcome, integration, null]
        description: Intended phase after Configure; null for other returns.
      instruction:
        type: [object, 'null']
        description: Carry a precise human instruction or one local repair under the current assignment.
        additionalProperties: false
        properties:
          text: {type: string, minLength: 1}
          scope_change: {type: boolean}
        required: [text, scope_change]
      additional_attempts:
        type:
        - integer
        - 'null'
        minimum: 1
        maximum: 20
        description: Finite extra attempts for the paused loop, when there is a concrete correction or progress.
      title:
        type: string
        minLength: 1
        maxLength: 100
        description: Name the concrete blocker or correction in plain English.
      document_details:
        type: array
        description: Describe new or changed attachments. Unchanged files can reuse their recorded descriptions.
        items:
          type: object
          additionalProperties: false
          properties:
            document_id:
              type: string
              minLength: 1
            title:
              type: string
              minLength: 1
              maxLength: 120
            description:
              type: string
              minLength: 1
              maxLength: 300
            role:
              type: string
              enum: [primary, supporting, diagnostic]
            order:
              type: integer
              minimum: 0
              maximum: 1000000
          required: [document_id, title, description, role, order]
      primary:
        type:
        - string
        - 'null'
        description: An existing review document to open first, if useful; otherwise null.
    required:
    - status
    - summary
    - stage
    - action
    - approval
    - publication
    - queue_recovery
    - report
    - destination
    - instruction
    - additional_attempts
    - title
    - primary
    - document_details
