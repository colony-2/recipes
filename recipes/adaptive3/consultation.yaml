id: adaptive3-consultation
inputs:
  objective: ${{ inputs.?objective.orValue(inputs.request) }}
  requester: ${{ inputs.?requester.orValue({}) }}
  agreements: ${{ inputs.?agreements.orValue([]) }}
  cell: ${{ inputs.cell }}
  request: ${{ inputs.request }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  mode: ${{ inputs.?mode.orValue('advice') }}
  max_iterations: ${{ inputs.?max_iterations.orValue(4) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
  job: ${{ inputs.?job.orValue('') }}
  thread: ${{ inputs.?thread.orValue('') }}
  remaining: ${{ inputs.?remaining.orValue(10) }}
state:
  initial:
  - to: wait
    when: inputs.job != ''
  - to: local
    when: inputs.cell == context.workspace.cell
  - to: reuse
    when: inputs.mode == 'delivery' && size(vars.matches) == 1
  - to: select_agreement
    when: inputs.mode == 'delivery' || (nonempty(inputs.thread) && size(vars.matches) != 1)
  - to: call
    when: 'true'
  states:
    select_agreement:
      sequence: []
      transitions:
      - to: done
        when: 'true'
        payload:
          result:
            status: changes
            summary: Select the receiving cell’s accepted agreement by its report folder ID. Open negotiation if the needed work has changed.
          documents: {}
    reuse:
      inputs:
        agreement: ${{ vars.matches[0] }}
      sequence: []
      outputs:
        agreement: ${{ inputs.agreement }}
      transitions:
      - to: wait
        when: nonempty(outputs.agreement.?job.orValue(''))
      - to: submit
        when: 'true'
        payload:
          agreement: ${{ outputs.agreement }}
    call:
      inputs:
        cell: ${{ transition.payload.?cell.orValue(inputs.cell) }}
        thread: ${{ transition.payload.?thread.orValue(inputs.thread) }}
        agreements: ${{ transition.payload.?agreements.orValue(state_output('call','agreements',inputs.agreements)) }}
        started: >-
          ${{ state_output('call','started',0) + (transition.payload.?new_thread.orValue(!state_exists('call') && !nonempty(inputs.thread)) ? 1 : 0) }}
        request: ${{ transition.payload.?request.orValue(inputs.request) }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        feedback: ${{ transition.payload.?feedback.orValue(inputs.feedback) }}
        turns: ${{ transition.payload.?turns.orValue([]) }}
        requester_session: ${{ transition.payload.?requester_session.orValue(inputs.requester) }}
        sender: ${{ transition.payload.?sender.orValue(context.workspace.cell) }}
        mode: ${{ transition.payload.?mode.orValue(inputs.mode) }}
        parents: ${{ transition.payload.?parents.orValue([]) }}
        used: ${{ transition.payload.?used.orValue(0) }}
        session: ${{ transition.payload.?session.orValue({}) }}
      sequence:
      - id: prompts
        include: ./prompts/consultation.yaml
        inputs:
          sender: ${{ inputs.sender }}
          mode: ${{ inputs.mode }}
          request: ${{ inputs.request }}
          feedback: ${{ inputs.feedback }}
      outputs:
        cell: ${{ inputs.cell }}
        request: ${{ inputs.request }}
        documents: ${{ inputs.documents }}
        feedback: ${{ inputs.feedback }}
        mode: ${{ inputs.mode }}
        parents: ${{ inputs.parents }}
        used: ${{ inputs.used }}
        prompt: ${{ sequence.prompts.outputs.task }}
        thread: ${{ inputs.thread }}
        agreements: ${{ inputs.agreements }}
        started: ${{ inputs.started }}
        session: ${{ inputs.session }}
        turns: ${{ inputs.turns }}
        sender: ${{ inputs.sender }}
        requester_session: ${{ inputs.requester_session }}
      transitions:
      - to: exhausted
        when: outputs.used >= vars.limit || outputs.started > inputs.remaining || size(outputs.parents) >= 4
        payload:
          summary: >-
            ${{ outputs.started > inputs.remaining ? 'The phase has used its consultation allowance. The author wants to ask ' + outputs.cell + ': ' + outputs.request :
              size(outputs.parents) >= 4 ? 'The consultation with ' + outputs.cell + ' would exceed the nesting limit.' :
              'The conversation with ' + outputs.cell + ' is still open after ' + string(vars.limit) + ' rounds: ' + outputs.request }}
      - to: select_agreement
        when: nonempty(outputs.thread) && !outputs.agreements.exists(a,a.thread == outputs.thread && a.cell == outputs.cell)
      - to: advice
        when: 'true'
    advice:
      include: ./cycle.yaml
      inputs:
        purpose: advice
        request: |-
          {{ states.call.outputs.prompt }}
          Parent objective: {{ inputs.objective }}
          Previous turns on this request: ${{ json_stringify(states.call.outputs.turns) }}
        documents: ${{ states.call.outputs.documents }}
        finding: ${{ states.call.outputs.feedback }}
        agent_settings: ${{ inputs.agent_settings }}
        session: ${{ states.call.outputs.session }}
      workspace:
        cell: ${{ states.call.outputs.cell }}
      transitions:
      - to: existing_child
        when: outputs.result.status == 'consult' && nonempty(outputs.result.consultation.?job.orValue(''))
      - to: call
        when: outputs.result.status == 'consult' && (outputs.result.consultation.cell == states.call.outputs.cell || outputs.result.consultation.mode == 'delivery')
        payload:
          cell: ${{ states.call.outputs.cell }}
          request: ${{ states.call.outputs.request }}
          thread: ${{ states.call.outputs.thread }}
          mode: ${{ states.call.outputs.mode }}
          turns: ${{ states.call.outputs.turns }}
          sender: ${{ states.call.outputs.sender }}
          requester_session: ${{ states.call.outputs.requester_session }}
          parents: ${{ states.call.outputs.parents }}
          documents: ${{ outputs.documents }}
          feedback:
            status: changes
            summary: >-
              ${{ outputs.result.consultation.cell == states.call.outputs.cell ? 'Resolve the request locally. This cell already owns the work.' :
                'Return the accepted agreement to the requester for delivery. If you need new work from the owner, open a negotiation.' }}
          session: ${{ outputs.session }}
          used: ${{ states.call.outputs.used+1 }}
      - to: call
        when: outputs.result.status == 'consult'
        payload:
          cell: ${{ outputs.result.consultation.cell }}
          request: ${{ outputs.result.consultation.request }}
          mode: ${{ outputs.result.consultation.mode }}
          thread: ${{ outputs.result.consultation.?thread.orValue('') }}
          new_thread: ${{ !nonempty(outputs.result.consultation.?thread.orValue('')) }}
          sender: ${{ states.call.outputs.cell }}
          requester_session: ${{ outputs.session }}
          documents: ${{ outputs.documents }}
          feedback: {}
          parents: ${{ states.call.outputs.parents + [{'thread':states.call.outputs.thread,'cell':states.call.outputs.cell,'request':states.call.outputs.request,'mode':states.call.outputs.mode,'documents':states.call.outputs.documents,'session':outputs.session,'used':states.call.outputs.used+1,'turns':states.call.outputs.turns,'sender':states.call.outputs.sender,'requester_session':states.call.outputs.requester_session}]
            }}
          used: 0
      - to: call
        when: outputs.result.status in ['changes','children']
        payload:
          cell: ${{ states.call.outputs.cell }}
          request: ${{ states.call.outputs.request }}
          thread: ${{ states.call.outputs.thread }}
          mode: ${{ states.call.outputs.mode }}
          turns: ${{ states.call.outputs.turns }}
          sender: ${{ states.call.outputs.sender }}
          requester_session: ${{ states.call.outputs.requester_session }}
          parents: ${{ states.call.outputs.parents }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
          used: ${{ states.call.outputs.used+1 }}
          session: ${{ outputs.session }}
      - to: record
        when: outputs.result.status != 'accepted' && states.call.outputs.mode != 'advice' && size(states.call.outputs.parents)==0
        payload:
          turns: ${{ states.call.outputs.turns + [{'cell':states.call.outputs.sender,'text':states.call.outputs.request},{'cell':inputs.cell,'text':outputs.result.summary}] }}
          resolution: ${{ outputs.result.summary }}
          assignment: ''
          unresolved: true
      - to: stuck
        when: outputs.result.status != 'accepted'
      - to: answer
        when: states.call.outputs.mode == 'advice'
      - to: owner_reply
        when: 'true'
    answer:
      inputs:
        summary: ${{ states.advice.outputs.work.summary }}
        documents: ${{ states.advice.outputs.documents }}
      sequence: []
      outputs:
        result:
          status: ready
          summary: ${{ inputs.summary }}
          assignment: ''
        documents: ${{ inputs.documents }}
      transitions:
      - to: return_to_owner
        when: size(states.call.outputs.parents)>0
        payload: &answer
          result: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
      - to: done
        when: 'true'
        payload: *answer
    owner_reply:
      sequence: []
      inputs:
        turns: >-
          ${{ states.call.outputs.turns + [{'cell':states.call.outputs.sender,'text':states.call.outputs.request},
            {'cell':states.call.outputs.cell,'text':states.advice.outputs.work.summary + (nonempty(states.advice.outputs.work.?assignment.orValue('')) ? '\n\nProposed assignment: ' + states.advice.outputs.work.assignment : '')}] }}
      outputs:
        turns: ${{ inputs.turns }}
      transitions:
      - to: respond
        when: states.advice.outputs.work.?negotiation_reply.orValue('') in ['question','alternative'] || nonempty(states.advice.outputs.work.?assignment.orValue(''))
      - to: record
        when: 'true'
        payload:
          turns: ${{ outputs.turns }}
          resolution: ${{ states.advice.outputs.work.summary }}
          assignment: ${{ states.advice.outputs.work.?assignment.orValue('') }}
    respond:
      include: ./agent.yaml
      workspace:
        cell: ${{ states.call.outputs.sender }}
      inputs:
        prompt: |-
          You represent the requesting cell. Parent objective: {{ inputs.objective }}
          Read the receiving owner's actual reply and proposed terms below. Answer its question,
          give concrete evidence of any remaining gap, agree to the exact offered assignment,
          or close this request with the reason. Accept an alternative only if it serves the
          parent outcome. Return reply, agree, or close with your words in summary.
          ${{ json_stringify(states.owner_reply.outputs.turns) }}
        session: ${{ states.call.outputs.requester_session }}
        read_only: true
        documents: ${{ states.advice.outputs.documents }}
        agent_settings: ${{ inputs.agent_settings }}
        schema:
          type: object
          additionalProperties: false
          properties:
            status: {type: string, enum: [reply, agree, close]}
            summary: {type: string, minLength: 1, maxLength: 4000}
          required: [status, summary]
      transitions:
      - to: call
        when: outputs.response.status == 'reply' && states.call.outputs.used+1 < vars.limit
        payload:
          cell: ${{ states.call.outputs.cell }}
          request: ${{ outputs.response.summary }}
          thread: ${{ states.call.outputs.thread }}
          turns: ${{ states.owner_reply.outputs.turns }}
          sender: ${{ states.call.outputs.sender }}
          requester_session: ${{ outputs.session }}
          parents: ${{ states.call.outputs.parents }}
          mode: ${{ states.call.outputs.mode }}
          documents: ${{ states.advice.outputs.documents }}
          session: ${{ states.advice.outputs.session }}
          used: ${{ states.call.outputs.used+1 }}
      - to: exhausted
        when: outputs.response.status == 'reply'
        payload:
          summary: ${{ 'After ' + string(vars.limit) + ' rounds with ' + states.call.outputs.cell + ', the requester still needs an answer. ' + outputs.response.summary }}
      - to: record
        when: 'true'
        payload:
          turns: ${{ states.owner_reply.outputs.turns + [{'cell':states.call.outputs.sender,'text':outputs.response.summary}] }}
          resolution: ${{ states.advice.outputs.work.summary + '\n\n' + outputs.response.summary }}
          assignment: >-
            ${{ outputs.response.status == 'agree' ? states.advice.outputs.work.?assignment.orValue('') : '' }}
          unresolved: ${{ !(outputs.response.status in ['agree','close']) }}
    record:
      include: ./negotiation-report.yaml
      inputs:
        owner: ${{ states.call.outputs.cell }}
        objective: ${{ inputs.objective }}
        turns: ${{ transition.payload.turns }}
        resolution: ${{ transition.payload.resolution }}
        assignment: ${{ transition.payload.assignment }}
        unresolved: ${{ transition.payload.?unresolved.orValue(false) }}
      transitions:
      - to: negotiated
        when: 'true'
    negotiated:
      sequence: []
      inputs:
        agreement:
          cell: ${{ states.call.outputs.cell }}
          work: ${{ jq(states.advice.outputs.work,'{title,delivery_recipe}|with_entries(select(.value != null))') }}
          support: ${{ jq(states.advice.outputs.documents,'with_entries(select(.key | startswith("review/negotiations/") | not))') }}
          documents: ${{ states.record.outputs.documents }}
          thread: ${{ states.record.outputs.thread }}
          objective: ${{ states.record.outputs.objective }}
          resolution: ${{ states.record.outputs.resolution }}
          assignment: ${{ states.record.outputs.assignment }}
      outputs:
        agreement: ${{ inputs.agreement }}
      transitions:
      - to: return_to_owner
        when: size(states.call.outputs.parents)>0
        payload:
          result: >-
            ${{ jq([states.advice.outputs.work,{'thread':outputs.agreement.thread,'assignment':outputs.agreement.assignment,'summary':states.record.outputs.resolution}],'add') }}
          agreements: ${{ states.call.outputs.agreements.filter(a,a.thread != states.call.outputs.thread || a.cell != states.call.outputs.cell) + [outputs.agreement] }}
          documents: ${{ jq([states.advice.outputs.documents,outputs.agreement.documents],'add') }}
      - to: done
        when: 'true'
        payload:
          agreement: ${{ outputs.agreement }}
          result: >-
            ${{ jq([states.advice.outputs.work,{'thread':outputs.agreement.thread,'assignment':outputs.agreement.assignment,'summary':states.record.outputs.resolution,'status':states.record.outputs.unresolved ? 'stuck' : 'ready'}],'add') }}
          documents: ${{ states.advice.outputs.documents }}
    return_to_owner:
      sequence: []
      outputs:
        parent: ${{ inputs.parent }}
        agreements: ${{ inputs.agreements }}
        reply: ${{ inputs.reply }}
        documents: ${{ inputs.documents }}
      transitions:
      - to: call
        when: 'true'
        payload:
          cell: ${{ outputs.parent.cell }}
          agreements: ${{ outputs.agreements }}
          thread: ${{ outputs.parent.thread }}
          request: ${{ outputs.parent.request }}
          mode: ${{ outputs.parent.mode }}
          documents: ${{ jq([outputs.parent.documents,outputs.agreements], '.[0] + ([.[1][].documents] | add // {})') }}
          feedback: ${{ {'consultation':outputs.reply,'documents':outputs.documents} }}
          parents: ${{ jq(states.call.outputs.parents, ' .[0:-1]') }}
          turns: ${{ outputs.parent.turns }}
          sender: ${{ outputs.parent.sender }}
          requester_session: ${{ outputs.parent.requester_session }}
          used: ${{ outputs.parent.used }}
          session: ${{ outputs.parent.session }}
      inputs:
        agreements: ${{ transition.payload.?agreements.orValue(states.call.outputs.agreements) }}
        parent: ${{ states.call.outputs.parents[size(states.call.outputs.parents)-1] }}
        reply: ${{ transition.payload.?result.orValue(states.advice.outputs.work) }}
        documents: ${{ transition.payload.?documents.orValue(states.advice.outputs.documents) }}
    submit:
      id: submit
      op: recipes.run
      workspace:
        cell: ${{ inputs.cell }}
      inputs:
        git_ref: ${{ context.git.ref }}
        recipes:
        - cell_name: ${{ inputs.cell }}
          name: ${{ transition.payload.agreement.work.?delivery_recipe.orValue('git+https://github.com/colony-2/recipes.git//adaptive3.yaml@main')
            }}
          title: ${{ transition.payload.agreement.work.?title.orValue('Deliver the agreement for ' + inputs.cell) }}
          inputs:
            prompt: ${{ transition.payload.agreement.assignment }}
            documents: ${{ jq([transition.payload.agreement.support,transition.payload.agreement.documents],'add') }}
      transitions:
      - to: wait
        when: 'true'
      catch:
      - when: failure.kind != 'cancellation'
        to: done
        payload:
          result: ${{ {'status':'stuck','summary':failure.message,'failure':failure} }}
          documents: ${{ states.reuse.outputs.agreement.documents }}
    wait:
      include: ./children.yaml
      inputs:
        jobs: '${{ inputs.job != '''' ? [inputs.job] : state_output(''reuse'',''agreement'',{}).?job.orValue('''') != '''' ? [states.reuse.outputs.agreement.job] : states.submit.outputs.job_ids }}'
      transitions:
      - to: delivery_report
        when: state_exists('reuse')
      - to: adopted_report
        when: 'true'
      catch:
      - when: failure.kind != 'cancellation'
        to: done
        payload:
          result: ${{ {'status':'stuck','summary':failure.message,'failure':failure} }}
          documents: ${{ state_output('reuse','agreement',{}).?documents.orValue(inputs.documents) }}
    adopted_report:
      include: ./negotiation-report.yaml
      inputs:
        owner: ${{ inputs.cell }}
        objective: ${{ inputs.objective }}
        turns: ${{ [{'cell':context.workspace.cell,'text':inputs.request}] }}
        resolution: The requester adopted an existing delivery. Inspect that job for the initiating exchange.
        job: ${{ states.wait.outputs.results[0] }}
      transitions:
      - to: received
        when: 'true'
    delivery_report:
      id: delivery_report
      op: command_execution
      const: true
      artifacts:
        ./: ${{ states.reuse.outputs.agreement.documents }}
      inputs:
        env:
          INBOX: ${{ context.environment.op.inbox }}
          OUTBOX: ${{ context.environment.op.outbox }}
          CHILD: ${{ json_stringify(states.wait.outputs.results[0]) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import quote
          child = json.loads(os.environ['CHILD'])
          inbox = Path(os.environ['INBOX'])
          report, = inbox.glob('review/negotiations/*/report.md')
          output = Path(os.environ['OUTBOX'], report.relative_to(inbox))
          output.parent.mkdir(parents=True, exist_ok=True)
          summary = child.get('summary') or child.get('message') or ''
          job = quote(child['job_id'], safe='')
          tenant = quote(os.environ['C2J_CURRENT_TENANT_ID'], safe='')
          delivery = f"\n## Delivery\n\n[Job {job}](https://jobs.colony2.com/{tenant}/jobs/{job}) · "
          # A replay replaces this job's status, even if the request has its own Delivery heading.
          original = report.read_text().partition(delivery)[0].rstrip('\n')
          output.write_text(f"{original}\n{delivery}{child['status']}\n\n{summary}\n")
          PY
      transitions:
      - to: received
        when: 'true'
      catch:
      - when: failure.kind != 'cancellation'
        to: done
        payload:
          result: ${{ {'status':'stuck','summary':failure.message,'child':states.wait.outputs.results[0]} }}
          documents: ${{ states.reuse.outputs.agreement.documents }}
    received:
      sequence: []
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ {'status':'ready','summary':'Review the child outcome and decide what to do next.','child':states.wait.outputs.results[0]} }}
          documents: ${{ states.wait.outputs.documents }}
    exhausted:
      inputs:
        summary: ${{ transition.payload.summary }}
        pending: ${{ states.call.outputs.parents + [{'thread':states.call.outputs.thread,'cell':states.call.outputs.cell,'mode':states.call.outputs.mode}] }}
        agreements: ${{ states.call.outputs.agreements }}
      sequence: []
      outputs:
        summary: ${{ inputs.summary }}
        agreements: ${{ inputs.agreements.filter(a,!inputs.pending.exists(p,p.mode == 'negotiate' && p.thread == a.thread && p.cell == a.cell)) }}
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ {'status':'stuck','loop':'consultation','summary':outputs.summary} }}
          documents: ${{ states.call.outputs.documents }}
    stuck:
      sequence: []
      outputs:
        result: ${{ inputs.result }}
        documents: ${{ inputs.documents }}
      inputs:
        result: '${{ {''status'':''stuck'',''summary'':''Consultation needs resolution; inspect the receiving tasks
          or child result.'',''child'':state_exists(''wait'') ? states.wait.outputs : {},''advice'':state_output(''advice'',''result'',{})}
          }}'
        documents: ${{ state_output('advice','documents',inputs.documents) }}
      transitions:
      - to: return_to_owner
        when: size(states.call.outputs.parents)>0
        payload:
          result: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
      - to: done
        when: inputs.mode == 'advice'
        payload: *answer
      - to: record
        when: 'true'
        payload:
          turns: ${{ states.call.outputs.turns + [{'cell':states.call.outputs.sender,'text':states.call.outputs.request},{'cell':states.call.outputs.cell,'text':outputs.result.summary}] }}
          resolution: ${{ outputs.result.summary }}
          assignment: ''
          unresolved: true
    local:
      sequence: []
      transitions:
      - to: done
        when: 'true'
        payload:
          result:
            status: changes
            summary: Resolve the request locally. This cell already owns the work.
          documents: {}
    done:
      inputs:
        agreement: >-
          ${{ state_exists('adopted_report') ?
            {'thread':states.adopted_report.outputs.thread,'documents':states.adopted_report.outputs.documents,'cell':inputs.cell,'assignment':'','job':inputs.job} :
            state_exists('reuse') ?
            jq([states.reuse.outputs.agreement,state_exists('delivery_report') ? states.delivery_report.artifacts : {},
                state_output('wait','results',[]),state_output('submit','job_ids',[])],
               '.[0] + {documents:(.[0].documents + (.[1]|with_entries(select(.key|startswith("review/negotiations/"))))),job:(.[2][0].job_id // .[3][0] // .[0].job // "")}') : transition.payload.?agreement.orValue({}) }}
      sequence: []
      outputs:
        agreement: ${{ inputs.agreement }}
        result: ${{ transition.payload.result }}
        documents: ${{ transition.payload.documents }}
    existing_child:
      include: ./children.yaml
      inputs:
        jobs: ${{ [states.advice.outputs.result.consultation.job] }}
      transitions:
      - to: call
        when: 'true'
        payload:
          cell: ${{ states.call.outputs.cell }}
          request: ${{ states.call.outputs.request }}
          thread: ${{ states.call.outputs.thread }}
          mode: ${{ states.call.outputs.mode }}
          turns: ${{ states.call.outputs.turns }}
          sender: ${{ states.call.outputs.sender }}
          requester_session: ${{ states.call.outputs.requester_session }}
          parents: ${{ states.call.outputs.parents }}
          documents: ${{ states.advice.outputs.documents }}
          feedback: ${{ {'consultation':{'summary':'Review the existing child outcome and decide what to do next.','child':outputs.results[0]},'documents':outputs.documents}
            }}
          used: ${{ states.call.outputs.used+1 }}
          session: ${{ states.advice.outputs.session }}
outputs:
  agreement: ${{ states.done.outputs.agreement }}
  agreements: >-
    ${{ jq([state_output('exhausted','agreements',state_output('call','agreements',inputs.agreements)),states.done.outputs.agreement,inputs.cell,inputs.thread,inputs.mode],
      vars.update_agreements) }}
  started: ${{ jq([state_output('call','started',0),inputs.remaining], 'min') }}
  result: ${{ states.done.outputs.result }}
  documents: ${{ states.done.outputs.documents }}
vars:
  update_agreements: |
    .[1] as $record | .[2] as $owner | .[3] as $thread | .[4] as $mode |
    (.[0] | map(select(.thread != $record.thread and
      ($mode != "negotiate" or .cell != $owner or .thread != $thread)))) +
    (if $record.thread then [$record] else [] end)
  matches: ${{ inputs.agreements.filter(a,a.cell == inputs.cell && nonempty(a.assignment) && a.thread == inputs.thread) }}
  limit: '${{ inputs.max_iterations >= 1 ? int(inputs.max_iterations) : 4 }}'
