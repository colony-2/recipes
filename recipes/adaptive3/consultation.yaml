id: adaptive3-consultation
inputs:
  cell: ${{ inputs.cell }}
  request: ${{ inputs.request }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  mode: ${{ inputs.?mode.orValue('advice') }}
  max_iterations: ${{ inputs.?max_iterations.orValue(4) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
  job: ${{ inputs.?job.orValue('') }}
state:
  initial:
  - to: wait
    when: inputs.job != ''
  - to: call
    when: 'true'
  states:
    call:
      inputs:
        cell: ${{ transition.payload.?cell.orValue(inputs.cell) }}
        request: ${{ transition.payload.?request.orValue(inputs.request) }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        feedback: ${{ transition.payload.?feedback.orValue(inputs.feedback) }}
        mode: ${{ transition.payload.?mode.orValue(inputs.mode) }}
        parents: ${{ transition.payload.?parents.orValue([]) }}
        used: ${{ transition.payload.?used.orValue(0) }}
        session: ${{ transition.payload.?session.orValue({}) }}
      sequence:
      - id: prompts
        include: ./prompts/consultation.yaml
        inputs:
          sender: '${{ size(inputs.parents)>0 ? inputs.parents[size(inputs.parents)-1].cell : context.workspace.cell
            }}'
          request: ${{ inputs.request }}
          feedback: ${{ inputs.feedback }}
      outputs:
        cell: ${{ inputs.cell }}
        request: ${{ inputs.request }}
        documents: ${{ inputs.documents }}
        feedback: ${{ inputs.feedback }}
        mode: ${{ inputs.mode }}
        parents: ${{ inputs.parents }}
        used: ${{ inputs.used }}
        prompt: ${{ sequence.prompts.outputs.task }}
        session: ${{ inputs.session }}
      transitions:
      - to: stuck
        when: outputs.used >= vars.limit || size(outputs.parents) >= 4
      - to: advice
        when: 'true'
    advice:
      include: ./cycle.yaml
      inputs:
        purpose: advice
        request: ${{ states.call.outputs.prompt }}
        documents: ${{ states.call.outputs.documents }}
        feedback: ${{ states.call.outputs.feedback }}
        agent_settings: ${{ inputs.agent_settings }}
        session: ${{ states.call.outputs.session }}
      workspace:
        cell: ${{ states.call.outputs.cell }}
        ref: main
      transitions:
      - to: existing_child
        when: outputs.result.status == 'consult' && nonempty(outputs.result.consultation.?job.orValue(''))
      - to: call
        when: outputs.result.status == 'consult'
        payload:
          cell: ${{ outputs.result.consultation.cell }}
          request: ${{ outputs.result.consultation.request }}
          mode: advice
          documents: ${{ outputs.documents }}
          feedback: {}
          parents: ${{ states.call.outputs.parents + [{'cell':states.call.outputs.cell,'request':states.call.outputs.request,'mode':states.call.outputs.mode,'documents':states.call.outputs.documents,'session':outputs.session,'used':states.call.outputs.used+1}]
            }}
          used: 0
      - to: call
        when: outputs.result.status in ['changes','children']
        payload:
          cell: ${{ states.call.outputs.cell }}
          request: ${{ states.call.outputs.request }}
          mode: ${{ states.call.outputs.mode }}
          parents: ${{ states.call.outputs.parents }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
          used: ${{ states.call.outputs.used+1 }}
          session: ${{ outputs.session }}
      - to: stuck
        when: outputs.result.status != 'accepted'
      - to: return_to_owner
        when: size(states.call.outputs.parents)>0
      - to: submit
        when: states.call.outputs.mode == 'delivery' && has(outputs.work.assignment) && outputs.work.assignment
          != ''
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.work }}
          documents: ${{ outputs.documents }}
    return_to_owner:
      sequence: []
      outputs:
        parent: ${{ inputs.parent }}
        reply: ${{ inputs.reply }}
        documents: ${{ inputs.documents }}
      transitions:
      - to: call
        when: 'true'
        payload:
          cell: ${{ outputs.parent.cell }}
          request: ${{ outputs.parent.request }}
          mode: ${{ outputs.parent.mode }}
          documents: ${{ outputs.parent.documents }}
          feedback: ${{ {'consultation':outputs.reply,'documents':outputs.documents} }}
          parents: ${{ jq(states.call.outputs.parents, ' .[0:-1]') }}
          used: ${{ outputs.parent.used }}
          session: ${{ outputs.parent.session }}
      inputs:
        parent: ${{ states.call.outputs.parents[size(states.call.outputs.parents)-1] }}
        reply: ${{ transition.payload.?result.orValue(states.advice.outputs.work) }}
        documents: ${{ transition.payload.?documents.orValue(states.advice.outputs.documents) }}
    submit:
      id: submit
      op: recipes.run
      inputs:
        recipes:
        - cell_name: ${{ states.call.outputs.cell }}
          name: ${{ states.advice.outputs.work.?delivery_recipe.orValue('git+https://github.com/colony-2/recipes.git//adaptive3.yaml@main')
            }}
          title: ${{ states.advice.outputs.work.title }}
          inputs:
            prompt: ${{ states.advice.outputs.work.assignment }}
            documents: ${{ states.advice.outputs.documents }}
      transitions:
      - to: wait
        when: 'true'
    wait:
      include: ./children.yaml
      inputs:
        jobs: '${{ inputs.job != '''' ? [inputs.job] : states.submit.outputs.job_ids }}'
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ {'status':'ready','summary':'Review the child outcome and decide what to do next.','child':outputs.results[0]}
            }}
          documents: ${{ outputs.documents }}
    stuck:
      sequence: []
      outputs:
        result: ${{ inputs.result }}
        documents: ${{ inputs.documents }}
      inputs:
        result: '${{ {''status'':''stuck'',''summary'':''Consultation needs resolution; inspect the receiving tasks
          or child result.'',''child'':state_exists(''wait'') ? states.wait.outputs : {},''advice'':state_output(''advice'',''result'',{})}
          }}'
        documents: ${{ state_output('advice','documents',inputs.documents) }}
      transitions:
      - to: return_to_owner
        when: size(states.call.outputs.parents)>0
        payload:
          result: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
        documents: ${{ transition.payload.documents }}
    existing_child:
      include: ./children.yaml
      inputs:
        jobs: ${{ [states.advice.outputs.result.consultation.job] }}
      transitions:
      - to: call
        when: 'true'
        payload:
          cell: ${{ states.call.outputs.cell }}
          request: ${{ states.call.outputs.request }}
          mode: ${{ states.call.outputs.mode }}
          parents: ${{ states.call.outputs.parents }}
          documents: ${{ states.advice.outputs.documents }}
          feedback: ${{ {'consultation':{'summary':'Review the existing child outcome and decide what to do next.','child':outputs.results[0]},'documents':outputs.documents}
            }}
          used: ${{ states.call.outputs.used+1 }}
          session: ${{ states.advice.outputs.session }}
outputs:
  result: '${{ state_exists(''done'') ? states.done.outputs.result : states.stuck.outputs.result }}'
  documents: '${{ state_exists(''done'') ? states.done.outputs.documents : states.stuck.outputs.documents }}'
vars:
  limit: '${{ inputs.max_iterations >= 1 ? int(inputs.max_iterations) : 4 }}'
