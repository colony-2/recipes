# Each native instruction and each verified requirement can renew the allowance once.
id: adaptive3-retry
inputs:
  previous: ${{ inputs.?previous.orValue({}) }}
  receipt: ${{ inputs.?receipt.orValue({}) }}
  checkpoints: ${{ inputs.?checkpoints.orValue([]) }}
  merge_extension: ${{ inputs.?merge_extension.orValue(0) }}
  dispatch: ${{ inputs.?dispatch.orValue(false) }}
sequence: []
outputs:
  change: ${{ jq([inputs.previous,inputs.receipt,inputs.checkpoints,inputs.dispatch,inputs.merge_extension],vars.update) }}
vars:
  update: |-
    .[0] as $previous | .[1] as $receipt | .[2] as $checks | .[3] as $dispatch | .[4] as $extension |
    ($previous.instructions // []) as $instructions |
    ($receipt.submission_id // $receipt.request_id) as $id |
    ($id != null and $id != "" and ($instructions | index($id)) == null) as $fresh |
    (if $fresh then [] else ($previous.checkpoints // []) end) as $seen |
    (if $fresh then [] else ($checks | unique) - $seen end) as $advance |
    ($previous.automatic_used // 0) as $before |
    ((if $fresh or ($advance|length)>0 then 0 else $before end) + (if $dispatch then 1 else 0 end)) as $after |
    {retry:{instructions:(if $fresh then $instructions + [$id] else $instructions end),
     checkpoints:($seen + $advance),
     merge_used:(if $fresh then 0 else ($previous.merge_used // 0) end),
     merge_limit:((if $fresh then 3 else ($previous.merge_limit // 3) end) + $extension),
     automatic_used:$after},
     event:(if $fresh or ($advance|length)>0 or $dispatch then
       {returns_before:([0,2-$before]|max), returns_after:([0,2-$after]|max),
        instruction:(if $fresh then $id else null end), confirmed:$advance, dispatched:$dispatch}
       else null end)}
