id: adaptive3-delegate
status: >-
  ${{ sequence.?check.orValue({}).?outputs.orValue({}).?issue.orValue('invalid') == ''
    ? sequence.choose.outputs.response.?activity.orValue('choosing next step') : 'reconsidering next step' }}
inputs:
  request: ${{ inputs.request }}
  resume_from: ${{ inputs.resume_from }}
  record: ${{ inputs.record }}
  last: ${{ inputs.last }}
  settings: ${{ inputs.settings }}
  session: ${{ inputs.session }}
  agent_settings: ${{ inputs.agent_settings }}
sequence:
- id: choose
  include: ./agent.yaml
  inputs:
    read_only: true
    session: ${{ inputs.session }}
    agent_settings: ${{ inputs.agent_settings }}
    documents: ${{ inputs.record.documents }}
    prompt: |-
      ${{ size(inputs.session)==0 ? vars.principles : 'Choose what this job should do next.' }}
      ${{ size(inputs.session)==0 ? 'Assignment: ' + inputs.request + '\nCell configuration: ' + json_stringify(inputs.settings) : '' }}
      ${{ size(inputs.session)==0 && nonempty(inputs.resume_from) ? 'Inspect the original assignment, native receipts and human instructions in job ' + inputs.resume_from : '' }}
      Latest result: ${{ json_stringify(inputs.last) }}
      ${{ size(inputs.session)==0 ? 'Prior human exchanges: ' + json_stringify(inputs.record.?reviews.orValue([])) : '' }}
      Current work: ${{ json_stringify(jq(inputs.record,'{source,kind,verified,changed:.candidate.changed,assessed:.assessment.status,accepted:(.accepted.result.status // null),completion:.plan.human.response.direction,landed:.integration.status,post_merge_check,jobs,agreements:[.agreements[]? | {cell,thread,assignment,job}]} | with_entries(select(.value!=null))')) }}
      ${{ size(inputs.session)==0 && size(inputs.record.?interview.orValue([]))>0 ? 'Prepared interview: ' + json_stringify(inputs.record.interview) : '' }}
      Available document names: ${{ json_stringify(jq(inputs.record.documents,'keys')) }}
    schema:
      type: object
      additionalProperties: false
      properties:
        primitive:
          type: string
          enum: [configure, direction, preparation, implement, assess, verify, consult, negotiate, deliver, packages, children, outcome, prepare_interview, present, integrate, check_delivery, recover_publication, finish, withdraw]
        coordination:
          description: Request to another cell. Return null to reuse the author's request or for unrelated operations.
          type: [object, 'null']
          additionalProperties: false
          properties:
            cell: {type: string, minLength: 1}
            request: {type: string, minLength: 1}
            thread: {type: [string, 'null']}
            job: {type: [string, 'null']}
            share_review: {type: boolean}
          required: [cell, request, thread, job, share_review]
        recovery:
          description: Publication producer references or the job that repaired a recorded queue receiver. Otherwise return null.
          anyOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            properties:
              repair_job: {type: string, minLength: 1}
            required: [repair_job]
          - type: object
            additionalProperties: false
            properties:
              merge_job: {type: string}
              merge_task: {type: string}
              approval_task: {type: string}
              landed_hash: {type: string}
            required: [merge_job, merge_task, approval_task, landed_hash]
        instruction: {type: string, minLength: 1, description: "Assignment for the next author, exact human message for Present, or final summary for Finish."}
        activity:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '^\S(?:[^\r\n]*\S)?$'
          description: "Public job tag. Use 2–5 plain, lowercase words for what happens next, such as initial planning, revising the plan, fixing bugs, verifying the fix, or awaiting your reply. Use preparing merge before queue admission. Leave out names, IDs and private details."
        documents: {type: array, items: {type: string}, description: "Names from the available documents needed for this action. Direct questions normally use none."}
        presentation: {type: string, enum: [question, plan, result, document, packages, interview], description: "Used only by Present. Plan offers the completion preference. Result asks whether to finish or land this candidate."}
      required: [primitive, instruction, activity, documents, presentation, coordination, recovery]
- id: check
  include: ./dispatch-check.yaml
  inputs:
    action: ${{ sequence.choose.outputs.response }}
    valid: ${{ sequence.choose.outputs.valid_response && ['primitive','instruction','documents','presentation'].all(k,k in sequence.choose.outputs.response) }}
    record: ${{ inputs.record }}
    settings: ${{ inputs.settings }}
outputs:
  patch: ${{ sequence.choose.outputs.artifacts[?'recovery/approved.diff'].orValue(null) }}
  action: >-
    ${{ sequence.choose.outputs.valid_response && ['primitive','instruction','documents','presentation'].all(k,k in sequence.choose.outputs.response) ? sequence.choose.outputs.response : {'primitive':'invalid','instruction':'','documents':[],'presentation':'question'} }}
  allowed: ${{ sequence.check.outputs.issue == '' }}
  issue: ${{ sequence.check.outputs.issue }}
  session: ${{ sequence.choose.outputs.session }}
catch:
- when: failure.kind != 'cancellation'
  continue:
    outputs:
      action: {primitive: invalid, instruction: '', documents: [], presentation: question}
      patch: null
      allowed: false
      issue: ${{ failure.message }}
      session: {}
vars:
  principles: |-
    You are the requester's delegate. Choose one primitive and its handoff. When the request makes the owner and outcome clear, dispatch it before opening the workspace. The author owns source inspection, diagnosis and repair. Look up a job or receipt when its status could change who acts next. You own every message to the person, including the final summary. A direct question offers Reply. Plan offers Revise, Review before Complete and Take to Completion. Result offers Revise and Accept result. Each can carry comments. For a document review choose the primary attachment first. A package decision shows the exact proposed configuration. Read their actual words and who said them. Recordings, plans and test ideas from agents are proposals. Reassess alignment after each result.
    Configure retries the cell configuration hook when its problem has been resolved. Use Direction to understand the need, Preparation for a proposal, and Implement to make or repair a change. Clear local work can start with Implement. Outcome describes the result. The implementation author and planning author each keep their own session. An author can recommend a next step. Decide whether the finding changes the goal or just the method. Reuse the author for a different repair supported by evidence. When returning to the same author, tell them what changed and what you need next.
    Finish a straightforward explanation when the author has answered it. Use Assess for an unresolved concern or an important independent check. Verify prepares, checks and independently reviews an implementation candidate. Integrate lands the verified, accepted candidate and runs configured publication. If a recorded queue receiver needed a separate repair job, give Integrate its repair_job. Use Check_delivery for an explicitly requested fresh-consumer check. Finish with evidence for this assignment. A child asked only for a tested patch can return it.
    Consult for information another cell owns. Negotiate when the requester needs a change. Deliver starts or rejoins work on accepted terms. Supply the cell and request yourself, or reuse the author’s request. Share the current human reply only if it applies to that owner. A delivery needs the accepted agreement thread. Use Packages for an author's exact tool request or collect outstanding Children. Inspect an existing child before starting a replacement.
    Present a direct question when only the person can settle it. Put enough context and the consequence in the message. Choose no documents unless the person is reviewing specific text. Name only changes since their last seen message. Start with the behavior they asked for. Introduce unfamiliar names or versions only if they change the choice. Answer ordinary comments directly, continue on settled guidance, and honor a requested final review. Include the person's words and any annotated documents when sending work back to an author.
    Use Prepare_interview with the whole proposal to explore several meaningful choices in one sitting. Read every returned question and choice. To improve them, prepare again. Present interview sends the prepared batch as written. Give the exact replies to the planner, who decides whether to update the plan or seek more information. For one clear decision use a direct question.
    Treat private planning material as evidence about the proposed experience. Ask about meaningful assumptions, including ones the planner considers settled. When permission is needed to start or land, ask about the action in everyday language. Agreement with preferences alone does not grant permission.
    In a job resuming a failed publication, inspect the native merge and acceptance tasks first. Use Recover_publication with their exact references and the landed contribution hash. Put the previously approved patch in outbox/recovery/approved.diff. The runtime checks the evidence before retrying publication.
    Select only relevant documents by name. Do not send reviewed drafts or diagnostic bundles by default. Use Withdraw only when a sourced human reply explicitly withdraws this whole assignment. Give the implementer the assignment, its sources, and latitude on method. Use the job guide to inspect original records, commits or child jobs if the session was lost. Never run work, start child jobs, or contact the person yourself. Dispatch the primitive.
    A findings-only limit must come from the requester.
