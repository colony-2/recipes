schema_version: 2
id: adaptive3-tools
input_schema:
  prompt: {type: string, default_value: ''}
  check: {type: string, required: true}
  documents: {type: artifact_map, default_value: {}}
  title: {type: string, default_value: ''}
  primary: {type: string, default_value: ''}
  document_details: {type: array, items: {type: object}, default_value: []}
  require_document_details: {type: boolean, default_value: true}
  requests: {type: array, items: {type: object}, default_value: []}
  write: {type: boolean, default_value: false}
  approved: {type: object, default_value: {}}
  message: {type: string, default_value: ''}
inputs:
  check: ${{ inputs.check }}
  documents: ${{ inputs.?documents.orValue({}) }}
  title: ${{ inputs.?title.orValue('') }}
  primary: ${{ inputs.?primary.orValue('') }}
  document_details: ${{ inputs.?document_details.orValue([]) }}
  require_document_details: ${{ inputs.?require_document_details.orValue(true) }}
  requests: ${{ inputs.?requests.orValue([]) }}
  write: ${{ inputs.?write.orValue(false) }}
  approved: ${{ inputs.?approved.orValue({}) }}
  message: ${{ inputs.?message.orValue('') }}
state:
  initial:
  - to: review_files
    when: inputs.check == 'review_files'
  - to: approved_change
    when: inputs.check == 'approved_change'
  - to: package_config
    when: inputs.check == 'package_config'
  states:
    review_files:
      id: review_files
      op: command_execution
      const: true
      execution_needs:
        python:
          requires-python: ">=3.10"
          dependencies:
          - Pillow==12.0.0
        packages:
        - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#cmark
      artifacts:
        ./: ${{ inputs.documents }}
      inputs:
        env:
          INBOX: ${{ context.environment.op.inbox }}
          OUTBOX: ${{ context.environment.op.outbox }}
          TITLE: ${{ inputs.title }}
          PRIMARY: ${{ inputs.primary }}
          DOCUMENT_IDS: ${{ json_stringify(inputs.documents.map(k,k)) }}
          DOCUMENT_DETAILS: ${{ json_stringify(inputs.document_details) }}
          REQUIRE_DOCUMENT_DETAILS: ${{ string(inputs.require_document_details) }}
          MESSAGE: ${{ inputs.message }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          from PIL import Image
          root=pathlib.Path(os.environ['INBOX']).resolve()
          out=pathlib.Path(os.environ['OUTBOX']); (out/'error').mkdir(exist_ok=True)
          issues=[]
          def issue(s): issues.append(s)
          def local(path):
           p=(root/path).resolve()
           if not p.is_relative_to(root) or not p.is_file(): raise ValueError('not a readable local file')
           return p
          class Links(HTMLParser):
           def __init__(self): super().__init__(); self.links=[]; self.ignored=[]
           def handle_starttag(self,tag,attrs):
            if tag in ('pre','code','script','style'): self.ignored.append(tag)
            if not self.ignored:
             key={'a':'href','img':'src'}.get(tag)
             self.links += [v for k,v in attrs if k==key and v]
           def handle_endtag(self,tag):
            if tag in self.ignored: self.ignored=self.ignored[:self.ignored.index(tag)]
          title=os.environ.get('TITLE',''); primary=os.environ.get('PRIMARY','')
          if primary:
           try: local(primary)
           except Exception as ex: issue('Primary document: '+str(ex))
           if not title.strip() or len(title)>100 or any(ord(c)<32 or 127<=ord(c)<=159 for c in title): issue('Choose a nonempty descriptive title of at most 100 characters without control characters.')
          # Validate exact selected IDs before converting the producer list to native metadata.
          selected=json.loads(os.environ['DOCUMENT_IDS']) or []
          details=json.loads(os.environ['DOCUMENT_DETAILS'])
          metadata={}; presentation_bytes=0; detail_start=len(issues)
          if os.environ['REQUIRE_DOCUMENT_DETAILS']=='true':
           if not isinstance(details,list):
            issue('document_details must be an array.'); details=[]
           seen=set()
           for i,item in enumerate(details):
            label='document_details['+str(i)+']'
            if not isinstance(item,dict) or set(item)!={'document_id','title','description','role','order'}:
             issue(label+': require exactly document_id, title, description, role and order.'); continue
            name=item['document_id']
            if not isinstance(name,str) or not name:
             issue(label+': document_id must be a nonempty exact attachment ID.'); continue
            if name in seen: issue(label+': duplicate document_id '+name)
            seen.add(name)
            if name not in selected: issue(label+': unattached document_id '+name)
            for field,limit in (('title',120),('description',300)):
             value=item[field]
             if not isinstance(value,str) or not value.strip() or len(value)>limit or any(ord(c)<32 or ord(c)==127 or 0xd800<=ord(c)<=0xdfff for c in value):
              issue(label+'.'+field+': require nonblank valid Unicode, at most '+str(limit)+' characters, without controls.')
            if item['role'] not in ('primary','supporting','diagnostic'): issue(label+': invalid reading role.')
            if type(item['order']) is not int or not 0<=item['order']<=1000000: issue(label+': order must be an integer from 0 to 1000000.')
            metadata[name]={k:item[k] for k in ('title','description','role','order')}
           for name in selected:
            if name not in seen: issue('Missing document_details for '+name)
           if selected:
            primaries=[name for name,value in metadata.items() if value['role']=='primary']
            if primary not in selected: issue('Primary must be an attached document ID.')
            if len(primaries)!=1 or primaries[0]!=primary: issue('Exactly one primary role must match the primary overview document.')
           elif primary: issue('An empty collection cannot have a primary overview document.')
           # Match Go encoding/json's typed omitempty representation and HTML/line escaping.
           presentation={}
           if metadata: presentation['document_metadata']=metadata
           if primary: presentation['overview_document_id']=primary
           try:
            encoded=json.dumps(presentation,ensure_ascii=False,separators=(',',':'))
            for char in ('<','>','&','\u2028','\u2029'):
             encoded=encoded.replace(char,'\\u%04x'%ord(char))
            presentation_bytes=len(encoded.encode('utf-8'))
            if presentation_bytes>65536: issue('Document presentation exceeds 65536 native JSON bytes; shorten purposes or select a focused collection without dropping material evidence.')
           except UnicodeError: issue('Document presentation must contain valid Unicode attachment IDs and text.')
          detail_findings=issues[detail_start:]
          def links(text, name, parent):
           parser=Links(); parser.feed(text)
           for link in parser.links:
            u=urlsplit(link)
            if u.scheme=='file':
             issue(name+': replace machine-local file URL with an attached relative link '+link); continue
            if u.scheme or u.netloc or not u.path: continue
            try: local(str(parent/unquote(u.path)))
            except Exception: issue(name+': missing or unsafe local link '+link)
          message=os.environ.get('MESSAGE','')
          if message:
           links(subprocess.check_output(['cmark','--unsafe'],input=message,text=True), 'Review question', pathlib.Path('.'))
          for p in sorted(root.rglob('*')):
           if not p.is_file(): continue
           name=str(p.relative_to(root))
           try:
            local(name)
            if p.suffix.lower() in ('.png','.jpg','.jpeg','.webp','.gif'):
             with Image.open(p) as im: im.verify()
            if p.suffix.lower() not in ('.md','.markdown','.html','.htm'): continue
            if p.stat().st_size>5*1024*1024: raise ValueError('Document is too large to inspect; reduce the human review file.')
            text=p.read_text()
            if p.suffix.lower() in ('.md','.markdown'): text=subprocess.check_output(['cmark','--unsafe'],input=text,text=True)
            links(text,name,p.relative_to(root).parent)
           except Exception as ex: issue(name+': '+str(ex))
          (out/'error'/'review-files.log').write_text('\n'.join(issues) if issues else 'All selected review files are readable and locally linked.\n')
          print(json.dumps({'status':'changes' if issues else 'passed','summary':str(len(issues))+' review file issues; '+(detail_findings[0][:120]+'; ' if detail_findings else '')+'see error/review-files.log','count':len(issues),'presentation_bytes':presentation_bytes,'document_metadata':metadata if not issues else {}}))
          PY
    approved_change:
      id: approved_change
      op: command_execution
      const: true
      execution_needs:
        packages:
        - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
      artifacts:
        ./: ${{ inputs.documents }}
      inputs:
        env:
          INBOX: ${{ context.environment.op.inbox }}
          OUTBOX: ${{ context.environment.op.outbox }}
          BASE: ${{ context.git.execution.base_hash }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile
          out=pathlib.Path(os.environ['OUTBOX']); (out/'error').mkdir(exist_ok=True)
          def git(*args,**kwargs): return subprocess.check_output(['git',*args],**kwargs)
          base=os.environ['BASE']; head=git('rev-parse','HEAD',text=True).strip()
          patch=git('diff','--binary','--full-index','--no-ext-diff','--no-textconv','--no-renames',base,head)
          (out/'candidate.diff').write_bytes(patch)
          (out/'error'/'change-counts.tsv').write_bytes(git('diff','--numstat','--no-ext-diff','--no-textconv','--no-renames',base,head))
          approved=pathlib.Path(os.environ['INBOX'])/'approved.diff'
          equivalent=False; reason='No prior approved patch supplied.'
          if approved.is_file():
           try:
            with tempfile.TemporaryDirectory() as tmp:
             env={**os.environ,'GIT_INDEX_FILE':tmp+'/index'}
             subprocess.run(['git','read-tree',base],env=env,check=True,capture_output=True)
             old=approved.read_bytes()
             if old: subprocess.run(['git','apply','--cached','--3way','--whitespace=nowarn','-'],input=old,env=env,check=True,capture_output=True)
             equivalent=git('write-tree',env=env)==git('rev-parse','HEAD^{tree}')
             reason='The approved edit produces this candidate.' if equivalent else 'This candidate differs from the approved edit.'
           except subprocess.CalledProcessError as ex: reason='Cannot establish equivalence: '+(ex.stderr or b'').decode(errors='replace')
          (out/'error'/'approved-change.log').write_text(reason)
          print(json.dumps({'status':'passed','summary':reason[:500],'equivalent':equivalent,'changed':bool(patch)}))
          PY
    package_config:
      id: package_config
      op: command_execution
      execution_needs:
        python:
          requires-python: ">=3.10"
          dependencies:
          - PyYAML==6.0.3
        packages:
        - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#yq-go
      artifacts:
        ./: ${{ jq(inputs.documents, 'with_entries(select(.key | startswith("review/")))') }}
      inputs:
        env:
          INBOX: ${{ context.environment.op.inbox }}
          OUTBOX: ${{ context.environment.op.outbox }}
          REQUESTS: ${{ json_stringify(inputs.requests) }}
          WRITE: ${{ string(inputs.write) }}
          APPROVED: ${{ json_stringify(inputs.approved) }}
          PROPOSAL_REF: ${{ json_stringify(inputs.documents[?'review/config.yaml'].orValue({})) }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, stat, subprocess, tempfile, yaml
          out=pathlib.Path(os.environ['OUTBOX']); (out/'error').mkdir(exist_ok=True)
          path=pathlib.Path('.c2/config.yaml'); directory=path.parent
          def same(left, right):
           # Preserve JSON types: booleans are not numbers. Native JSON transport
           # may serialize integral floats as integers; both have JSON type number.
           if type(left) in (int,float) and type(right) in (int,float): return left==right
           if type(left) is not type(right): return False
           if isinstance(left,dict):
            return left.keys()==right.keys() and all(same(left[k],right[k]) for k in left)
           if isinstance(left,(list,tuple)):
            return len(left)==len(right) and all(same(a,b) for a,b in zip(left,right))
           return left==right
          def parse(raw):
           # Inspect syntax before yq collapses duplicate keys. Do not construct
           # Python values: yq remains responsible for YAML scalar/merge semantics.
           pending=[yaml.compose(raw,Loader=yaml.BaseLoader)]; visited=set()
           while pending:
            node=pending.pop()
            if node is None or id(node) in visited: continue
            visited.add(id(node))
            if isinstance(node,yaml.MappingNode):
             keys=set()
             for key,value in node.value:
              if not isinstance(key,yaml.ScalarNode): raise ValueError('Configuration mapping keys must be scalars')
              if key.value in keys:
               raise ValueError('Duplicate YAML mapping key '+repr(key.value)+' at line '+str(key.start_mark.line+1))
              keys.add(key.value); pending.append(value)
            elif isinstance(node,yaml.SequenceNode): pending.extend(node.value)
           value=json.loads(subprocess.check_output(['yq','-o=json','.','-'],input=raw))
           if not isinstance(value,dict): raise ValueError('Configuration must be a mapping')
           return value
          def current():
           if directory.is_symlink() or (directory.exists() and not directory.is_dir()):
            raise ValueError('Configuration directory must be a real directory')
           if path.is_symlink(): raise ValueError('Configuration must not be a symlink')
           if not path.exists(): return {'present':False,'value':{}}, None, None
           if not path.is_file(): raise ValueError('Configuration must be a regular file')
           raw=path.read_bytes(); st=path.stat()
           identity=(st.st_dev,st.st_ino,st.st_mode,st.st_mtime_ns,st.st_ctime_ns)
           return {'present':True,'value':parse(raw)}, raw, identity
          def packages(config):
           if not isinstance(config,dict): raise ValueError('Configuration must be a mapping')
           values=config.get('packages',[])
           if not isinstance(values,list) or any(not isinstance(v,str) or not v for v in values):
            raise ValueError('Packages must be an array of nonempty references')
           if len(values)!=len(set(values)): raise ValueError('Duplicate package references')
           return values
          issues=[]; approved={}; temporary=None; written=False
          try:
           snapshot, old_bytes, identity=current()
           proposal=pathlib.Path(os.environ['INBOX'])/'review/config.yaml'
           if proposal.parent.is_symlink() or proposal.is_symlink() or not proposal.is_file():
            raise ValueError('No regular proposed configuration')
           raw=proposal.read_bytes(); proposed=parse(raw)
           requested=json.loads(os.environ['REQUESTS'])
           if not isinstance(requested,list) or not requested: raise ValueError('Requests must be a nonempty array')
           refs=[]
           for item in requested:
            if not isinstance(item,dict): raise ValueError('Request must be an object')
            ref=item.get('reference'); check=item.get('check')
            if not isinstance(ref,str) or ':' not in ref or ref.split(':',1)[0] not in ('nix','uv','pnpm') or not ref.split(':',1)[1] or any(c.isspace() or ord(c)<32 for c in ref):
             raise ValueError('Use a portable package reference')
            # Match c2j's repository-package boundary before a proposal can be written.
            manager, spec=ref.split(':',1)
            local_prefixes=('.', '/', '~', 'file:', 'link:', 'workspace:', 'path:', 'git+file:')
            local=spec.startswith(local_prefixes)
            if manager=='nix': local=local or spec.startswith('#')
            if manager=='uv' and '@' in spec: local=local or spec.split('@',1)[1].startswith(local_prefixes)
            if manager=='pnpm' and spec.rfind('@')>0: local=local or spec.rsplit('@',1)[1].startswith(local_prefixes)
            if local or spec.startswith('-') or ('$'+'{'*2) in spec:
             raise ValueError('Use a portable package reference')
            if not isinstance(check,list) or not check or any(not isinstance(x,str) or not x or '\x00' in x for x in check):
             raise ValueError('Probe must be an argument array')
            refs.append(ref)
           if len(refs)!=len(set(refs)): raise ValueError('Duplicate package requests')
           writing=os.environ['WRITE']=='true'
           bound=json.loads(os.environ['APPROVED'])
           reference=json.loads(os.environ['PROPOSAL_REF'])
           digest=hashlib.sha256(raw).hexdigest()
           if writing:
            if not isinstance(bound,dict) or set(bound)!={'baseline','proposed','requests','config','sha256'}:
             raise ValueError('No validated approved proposal binding')
            if not all(same(bound[k],v) for k,v in [('requests',requested),('config',reference),('proposed',proposed),('sha256',digest)]):
             raise ValueError('Approved proposal or requests changed')
            baseline=bound['baseline']
            if not isinstance(baseline,dict) or set(baseline)!={'present','value'} or type(baseline['present']) is not bool:
             raise ValueError('Invalid original configuration binding')
            if not baseline['present'] and not same(baseline['value'],{}): raise ValueError('Invalid absent baseline')
           else: baseline=snapshot
           before=packages(baseline['value']); after=packages(proposed)
           if not same({k:v for k,v in baseline['value'].items() if k!='packages'},{k:v for k,v in proposed.items() if k!='packages'}):
            raise ValueError('Unrelated configuration changed')
           if set(after)!=set(before+refs): raise ValueError('Package configuration differs from requested additions')
           if writing:
            applied=snapshot['present'] and same(snapshot['value'],proposed)
            if not same(snapshot,baseline) and not applied: raise ValueError('Current configuration conflicts with approved baseline')
            if not applied:
             # No proposed package participates in this task's preparation. Only the next task sees it.
             directory.mkdir(exist_ok=True)
             directory_identity=directory.stat()
             with tempfile.NamedTemporaryFile(dir=directory,prefix='.config-',delete=False) as f:
              temporary=f.name
              f.write(raw); f.flush(); os.fsync(f.fileno())
              os.fchmod(f.fileno(),stat.S_IMODE(identity[2]) if identity else 0o644)
             now, now_bytes, now_identity=current()
             parent_now=directory.stat()
             if not same((now,now_bytes,now_identity),(snapshot,old_bytes,identity)) or (parent_now.st_dev,parent_now.st_ino)!=(directory_identity.st_dev,directory_identity.st_ino):
              raise ValueError('Current configuration changed before replacement')
             os.replace(temporary,path); temporary=None; written=True
           approved={'baseline':baseline,'proposed':proposed,'requests':requested,'config':reference,'sha256':digest}
          except Exception as ex: issues.append(str(ex))
          finally:
           if temporary: pathlib.Path(temporary).unlink(missing_ok=True)
          (out/'error'/'package-config.log').write_text('\n'.join(issues) or 'Only approved package additions are present.\n')
          print(json.dumps({'status':'changes' if issues else 'passed','summary':'; '.join(issues)[:700] or 'Only requested package changes.','approved':approved if not issues else {},'written':written}))
          PY
outputs:
  approved: ${{ json_parse(states[inputs.check].outputs.stdout).?approved.orValue({}) }}
  result: ${{ jq(json_parse(states[inputs.check].outputs.stdout),'del(.document_metadata,.approved,.written)') }}
  document_metadata: ${{ json_parse(states[inputs.check].outputs.stdout).?document_metadata.orValue({}) }}
  artifacts: ${{ jq(states[inputs.check].artifacts,'with_entries(select((.key|startswith("error/")) or .key=="candidate.diff"))')
    }}
