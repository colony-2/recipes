id: adaptive3-agent
inputs:
  prompt: ${{ inputs.prompt }}
  schema: ${{ inputs.schema }}
  documents: ${{ inputs.?documents.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  read_only: ${{ inputs.?read_only.orValue(true) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: context
  states:
    context:
      include: ./prompts/context.yaml
      transitions:
      - to: resume_read_only
        when: inputs.read_only && size(inputs.session) > 0
      - to: start_read_only
        when: inputs.read_only
      - to: resume_work
        when: size(inputs.session) > 0
      - to: start_work
        when: 'true'
    start_read_only:
      id: start_read_only
      op: extension_execution
      artifacts:
        work/: ${{ inputs.documents }}
      inputs:
        selector: nix:github:colony-2/c2ops/published#codex
        inputs: '${{ jq([{''prompt'': inputs.prompt + ''\n\n'' + states.context.outputs.identity + ''\n'' + states.context.outputs.directories
          + ''\ninbox: '' + context.environment.op.inbox + ''\noutbox: '' + context.environment.op.outbox, ''output'':
          {''schema'': inputs.schema} }, inputs.agent_settings, {''instructions'':states.context.outputs.instructions}],
          ''add'') }}'
      const: true
      perms:
        inherit: true
        jobdb:
          secrets:
            resolve:
            - codex_api_key
    resume_read_only:
      id: resume_read_only
      op: extension_execution
      artifacts:
        work/: ${{ inputs.documents }}
      inputs:
        selector: nix:github:colony-2/c2ops/published#codex
        inputs: '${{ jq([{''prompt'': inputs.prompt + ''\n\n'' + states.context.outputs.identity + ''\n'' + states.context.outputs.directories
          + ''\ninbox: '' + context.environment.op.inbox + ''\noutbox: '' + context.environment.op.outbox, ''output'':
          {''schema'': inputs.schema} }, inputs.agent_settings, {''session'':inputs.session}], ''add'') }}'
      const: true
      perms:
        inherit: true
        jobdb:
          secrets:
            resolve:
            - codex_api_key
    start_work:
      id: start_work
      op: extension_execution
      artifacts:
        work/: ${{ inputs.documents }}
      inputs:
        selector: nix:github:colony-2/c2ops/published#codex
        inputs: '${{ jq([{''prompt'': inputs.prompt + ''\n\n'' + states.context.outputs.identity + ''\n'' + states.context.outputs.directories
          + ''\ninbox: '' + context.environment.op.inbox + ''\noutbox: '' + context.environment.op.outbox, ''output'':
          {''schema'': inputs.schema} }, inputs.agent_settings, {''instructions'':states.context.outputs.instructions}],
          ''add'') }}'
      perms:
        inherit: true
        jobdb:
          secrets:
            resolve:
            - codex_api_key
    resume_work:
      id: resume_work
      op: extension_execution
      artifacts:
        work/: ${{ inputs.documents }}
      inputs:
        selector: nix:github:colony-2/c2ops/published#codex
        inputs: '${{ jq([{''prompt'': inputs.prompt + ''\n\n'' + states.context.outputs.identity + ''\n'' + states.context.outputs.directories
          + ''\ninbox: '' + context.environment.op.inbox + ''\noutbox: '' + context.environment.op.outbox, ''output'':
          {''schema'': inputs.schema} }, inputs.agent_settings, {''session'':inputs.session}], ''add'') }}'
      perms:
        inherit: true
        jobdb:
          secrets:
            resolve:
            - codex_api_key
outputs:
  response: '${{ (inputs.read_only ? (size(inputs.session)>0 ? states.resume_read_only : states.start_read_only)
    : (size(inputs.session)>0 ? states.resume_work : states.start_work)).outputs.?output_schema_valid.orValue(false)
    && (inputs.read_only ? (size(inputs.session)>0 ? states.resume_read_only : states.start_read_only) : (size(inputs.session)>0
    ? states.resume_work : states.start_work)).outputs.status == ''completed'' ? jq((inputs.read_only ? (size(inputs.session)>0
    ? states.resume_read_only : states.start_read_only) : (size(inputs.session)>0 ? states.resume_work : states.start_work)).outputs.response,
    ''with_entries(select(.value != null))'') : {''status'':''stuck'',''summary'':(inputs.read_only ? (size(inputs.session)>0
    ? states.resume_read_only : states.start_read_only) : (size(inputs.session)>0 ? states.resume_work : states.start_work)).outputs.?error_message.orValue(''The
    agent did not finish with a valid response; inspect the task output.'')}  }}'
  session: '${{ (inputs.read_only ? (size(inputs.session)>0 ? states.resume_read_only : states.start_read_only)
    : (size(inputs.session)>0 ? states.resume_work : states.start_work)).outputs.?session.orValue({}) }}'
  artifacts: '${{ (inputs.read_only ? (size(inputs.session)>0 ? states.resume_read_only : states.start_read_only)
    : (size(inputs.session)>0 ? states.resume_work : states.start_work)).artifacts }}'
