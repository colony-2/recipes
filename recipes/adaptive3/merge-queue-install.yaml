id: adaptive3-merge-queue-install
inputs:
  base: ${{ inputs.base }}
  head: ${{ inputs.head }}
  bundle: ${{ inputs.?bundle.orValue(null) }}
sequence:
- id: install
  when: inputs.head != inputs.base
  op: ./recipes/merge-queue
  artifacts:
    assembled.bundle: ${{ inputs.bundle }}
  inputs:
    action: install
    request:
      base: ${{ inputs.base }}
      head: ${{ inputs.head }}
outputs:
  head: ${{ inputs.head }}
