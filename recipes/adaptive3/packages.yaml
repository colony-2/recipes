id: adaptive3-packages
inputs:
  review_reply: ${{ inputs.?review_reply.orValue({}) }}
  retry: ${{ inputs.?retry.orValue({}) }}
  requests: ${{ inputs.requests }}
  reason: ${{ inputs.reason }}
  session: ${{ inputs.?session.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
  purpose: ${{ inputs.?purpose.orValue('implementation') }}
state:
  initial: prepare
  states:
    prepare:
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/packages.yaml
        inputs:
          requests: ${{ inputs.requests }}
          reason: ${{ inputs.reason }}
      - id: policy
        include: ../adaptive/package-policy.yaml
      - id: proposal
        include: ./agent.yaml
        inputs:
          prompt: '${{ sequence.prompts.outputs.propose + ''\nHuman revision: '' + json_stringify(inputs.feedback)
            }}'
          schema: ${{ sequence.schemas.outputs.execute }}
          read_only: true
          session: ${{ inputs.session }}
          agent_settings: ${{ inputs.agent_settings }}
          documents: ${{ inputs.feedback.?documents.orValue({}) }}
      - id: config
        include: ./tools.yaml
        inputs:
          check: package_config
          documents: ${{ sequence.proposal.outputs.artifacts }}
          requests: ${{ inputs.requests }}
      - id: files
        include: ./tools.yaml
        inputs:
          check: review_files
          documents: ${{ jq(sequence.proposal.outputs.artifacts, 'with_entries(select(.key | startswith("review/")))')
            }}
          title: ${{ sequence.proposal.outputs.response.?title.orValue('') }}
          primary: ${{ sequence.proposal.outputs.response.?primary.orValue('') }}
          document_details: ${{ sequence.proposal.outputs.response.?document_details.orValue([]) }}
      outputs:
        session: ${{ sequence.proposal.outputs.session }}
        documents: ${{ jq(sequence.proposal.outputs.artifacts, 'with_entries(select(.key | startswith("review/")))')
          }}
        approved: ${{ sequence.config.outputs.approved }}
        policy: ${{ sequence.policy.outputs.approved }}
        valid: ${{ sequence.config.outputs.result.status == 'passed' && sequence.files.outputs.result.status ==
          'passed' && sequence.proposal.outputs.response.?primary.orValue('') == 'review/README.md' }}
        findings: '${{ sequence.config.outputs.result.status != ''passed'' ? sequence.config.outputs.result : sequence.files.outputs.result.status != ''passed'' ? sequence.files.outputs.result : {''status'':''changes'',''summary'':''Use review/README.md as the package proposal primary.''} }}'
        title: ${{ sequence.proposal.outputs.response.?title.orValue('') }}
        document_metadata: ${{ sequence.files.outputs.document_metadata }}
      transitions:
      - to: done
        when: '!outputs.valid'
        payload:
          result: ${{ outputs.findings }}
      - to: launch
        when: inputs.requests.all(r, !r.reference.startsWith('pnpm:') && r.reference in outputs.policy && outputs.policy[r.reference] == r.check)
      - to: approval
        when: 'true'
      inputs:
        requests: ${{ inputs.requests }}
        reason: ${{ inputs.reason }}
        agent_settings: ${{ inputs.agent_settings }}
        feedback: ${{ transition.payload.?feedback.orValue({}) }}
        session: ${{ state_output('approval','session',state_output('prepare','session',inputs.session)) }}
    approval:
      include: ./review.yaml
      inputs:
        threads: ${{ state_output('approval','threads',{}) }}
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.reason }}
        title: ${{ states.prepare.outputs.title }}
        primary: review/README.md
        documents: ${{ states.prepare.outputs.documents }}
        document_metadata: ${{ states.prepare.outputs.document_metadata }}
        agent_settings: ${{ inputs.agent_settings }}
        decision: packages
        session: ${{ states.prepare.outputs.session }}
        assessor: ${{ states.prepare.outputs.session }}
      transitions:
      - to: record_decision
        when: 'true'
    record_decision:
      inputs:
        result: ${{ states.approval.outputs.result }}
        retry: ${{ state_output('record_decision','retry',inputs.retry) }}
      sequence:
      - id: progress
        include: ./retry.yaml
        inputs:
          previous: ${{ inputs.retry }}
          receipt: >-
            ${{ inputs.result.status == 'changes' ? inputs.result.?human.orValue({}).?receipt.orValue({}) : {} }}
      outputs:
        result: ${{ inputs.result }}
        retry: ${{ sequence.progress.outputs.change.retry }}
      transitions:
      - to: prepare
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'packages'
        payload:
          feedback: ${{ outputs.result }}
      - to: launch
        when: outputs.result.status == 'accepted'
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.result }}
          finding: ${{ states.approval.outputs.finding }}
    launch:
      id: launch
      op: recipes.run
      inputs:
        recipes:
        - cell_name: ${{ context.workflow.cell }}
          name: git+https://github.com/colony-2/recipes.git//recipes/adaptive3/package-probe.yaml@main
          title: '${{ ''Test requested tools: '' + jq(inputs.requests.map(r,r.reference),''join(", ") | .[:98]'')
            }}'
          inputs:
            config: ${{ states.prepare.outputs.documents['review/config.yaml'] }}
            requests: ${{ inputs.requests }}
            approved: ${{ states.prepare.outputs.approved }}
      transitions:
      - to: wait
        when: 'true'
    wait:
      id: wait
      op: recipe.await_result_soft
      inputs:
        target:
          job: ${{ states.launch.outputs.job_ids[0] }}
        wait:
          'on': job
          condition: complete
        return_when: terminal
      transitions:
      - to: adopt
        when: outputs.status == 'completed' && outputs.outputs.status == 'passed'
      - to: done
        when: 'true'
        payload:
          result:
            status: stuck
            summary: Approved package validation did not pass. Inspect the actual child result.
            child: ${{ outputs }}
    adopt:
      inputs:
        documents: ${{ states.prepare.outputs.documents }}
        approved: ${{ states.prepare.outputs.approved }}
        requests: ${{ inputs.requests }}
        session: ${{ state_output('approval','session',states.prepare.outputs.session) }}
      sequence:
      - id: check
        include: ./tools.yaml
        inputs:
          check: package_config
          documents: ${{ inputs.documents }}
          requests: ${{ inputs.requests }}
          approved: ${{ inputs.approved }}
          write: true
      outputs:
        result: ${{ sequence.check.outputs.result }}
        session: ${{ inputs.session }}
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.result }}
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
        finding: ${{ transition.payload.?finding.orValue(transition.payload.result) }}
outputs:
  review_reply: ${{ state_output('approval','review_reply',inputs.review_reply) }}
  finding: ${{ states.done.outputs.finding }}
  retry: ${{ state_output('record_decision','retry',inputs.retry) }}
  session: ${{ state_output('adopt','session',state_output('approval','session',state_output('prepare','session',inputs.session))) }}
  result: '${{ states.done.outputs.result.status == ''passed'' && state_exists(''approval'') ? jq([states.done.outputs.result,{''human'':states.approval.outputs.result}],
    ''add'') : states.done.outputs.result }}'
