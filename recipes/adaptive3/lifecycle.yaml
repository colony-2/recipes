id: adaptive3-lifecycle
inputs:
  basis: ${{ inputs.?basis.orValue({}) }}
  merge_state: ${{ inputs.?merge_state.orValue({}) }}
  accepted: ${{ inputs.?accepted.orValue({}) }}
  recovery: ${{ inputs.?recovery.orValue(false) }}
  prior_publication: ${{ inputs.?prior_publication.orValue(null) }}
  merge_queue: ${{ inputs.?merge_queue.orValue(false) }}
  purpose: ${{ inputs.purpose }}
  contribution: ${{ inputs.?contribution.orValue({}) }}
  queue_history: ${{ inputs.?queue_history.orValue({}) }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  finding: ${{ inputs.?finding.orValue({}) }}
  review_reply: ${{ inputs.?review_reply.orValue({}) }}
  settings: ${{ inputs.?settings.orValue({}) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  max_iterations: ${{ inputs.?max_iterations.orValue(4) }}
  sessions: ${{ inputs.?sessions.orValue({}) }}
  verification: ${{ inputs.?verification.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: execute
  states:
    execute:
      inputs:
        retry: ${{ transition.payload.?retry.orValue(state_output('cycle','retry',inputs.sessions.?retry.orValue({}))) }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        finding: ${{ transition.payload.?finding.orValue(inputs.finding) }}
        review_reply: ${{ transition.payload.?review_reply.orValue(inputs.review_reply) }}
        local_repair: ${{ transition.payload.?local_repair.orValue(false) }}
        agreements: ${{ transition.payload.?agreements.orValue(state_output('execute','agreements',inputs.sessions.?agreements.orValue([]))) }}
        session: ${{ transition.payload.?session.orValue(inputs.sessions[?vars.author].orValue({})) }}
        used: >-
          ${{ transition.payload.?fresh_instruction.orValue(false) ? 0 : transition.payload.?used.orValue(state_output('execute','used',0)) }}
        consulted: >-
          ${{ transition.payload.?fresh_instruction.orValue(false) ? 0 : transition.payload.?consulted.orValue(state_output('execute','consulted',0)) }}
        children: >-
          ${{ transition.payload.?fresh_instruction.orValue(false) ? 0 : transition.payload.?children.orValue(state_output('execute','children',0)) }}
        packages: >-
          ${{ transition.payload.?fresh_instruction.orValue(false) ? 0 : transition.payload.?packages.orValue(state_output('execute','packages',0)) }}
      sequence: []
      outputs:
        documents: ${{ inputs.documents }}
        review_reply: ${{ inputs.review_reply }}
        local_repair: ${{ inputs.local_repair }}
        finding: ${{ inputs.finding }}
        retry: ${{ inputs.retry }}
        agreements: ${{ inputs.agreements }}
        session: ${{ inputs.session }}
        used: ${{ inputs.used }}
        consulted: ${{ inputs.consulted }}
        children: ${{ inputs.children }}
        packages: ${{ inputs.packages }}
      transitions:
      - to: limit
        when: outputs.used >= vars.limits.work
        payload:
          loop: work
      - to: limit
        when: outputs.children > vars.limits.children
        payload:
          loop: children
      - to: cycle
        when: 'true'
    cycle:
      include: ./cycle.yaml
      inputs:
        presentation: ${{ state_output('cycle','presentation',inputs.sessions.?presentation.orValue({})) }}
        delegate: ${{ state_output('cycle','delegate',inputs.sessions.?backstop.orValue({})) }}
        threads: ${{ state_output('cycle','threads',inputs.sessions.?review_threads.orValue({})) }}
        retry: ${{ states.execute.outputs.retry }}
        merge_state: ${{ state_output('cycle','merge_state',inputs.merge_state) }}
        accepted: ${{ inputs.accepted }}
        recovery: ${{ inputs.recovery }}
        prior_publication: ${{ inputs.prior_publication }}
        merge_queue: ${{ inputs.merge_queue }}
        refresh: ${{ inputs.merge_queue && inputs.purpose=='implementation' && !state_exists('cycle') }}
        contribution: ${{ inputs.contribution }}
        queue_history: >-
          ${{ state_output('cycle','work',{}).?receiver.hasValue() ? states.cycle.outputs.work : inputs.queue_history }}
        plan: ${{ inputs.sessions.?plan.orValue({}) }}
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ inputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        documents: ${{ jq([states.execute.outputs.documents,states.execute.outputs.agreements],'.[0] + ([.[1][].documents] | add // {})') }}
        local_repair: ${{ states.execute.outputs.local_repair }}
        review_reply: ${{ states.execute.outputs.review_reply }}
        finding: ${{ states.execute.outputs.finding }}
        session: ${{ states.execute.outputs.session }}
        verification: ${{ state_output('cycle','verification',inputs.verification) }}
        approval: ${{ inputs.finding.?approval.orValue({}) }}
        specialists: ${{ state_output('cycle','specialists',inputs.sessions.?specialists.orValue({})) }}
        assessor: ${{ state_output('cycle','assessor',inputs.sessions.?assessor.orValue({})) }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: execute
        when: outputs.result.status == 'children'
        payload:
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.result }}
          review_reply: ${{ outputs.review_reply }}
          session: ${{ outputs.session }}
          used: ${{ states.execute.outputs.used }}
          children: ${{ states.execute.outputs.children+1 }}
      - to: done
        when: outputs.result.status == 'consult' && inputs.purpose == 'implementation' && outputs.result.consultation.mode == 'delivery'
          && inputs.sessions.?short_path.orValue(false) && !nonempty(outputs.result.consultation.?job.orValue(''))
        payload:
          retry: ${{ outputs.retry }}
          result: ${{ {'status':'changes','stage':'preparation','summary':'Review the newly required external assignment during Preparation.','consultation':outputs.result.consultation} }}
          documents: ${{ outputs.documents }}
      - to: consult
        when: outputs.result.status == 'consult'
      - to: limit
        when: outputs.result.status == 'packages' && states.execute.outputs.packages >= vars.limits.packages
        payload:
          loop: packages
      - to: packages
        when: outputs.result.status == 'packages'
      # Only native verify check names identify a repeated blocker. Free text can change
      # on every attempt, and older hooks may supply only a summary.
      - to: done
        when: inputs.purpose == 'implementation' && outputs.result.status == 'changes' && outputs.repair.repeated
        payload:
          retry: ${{ outputs.retry }}
          result: ${{ jq([outputs.result,{'status':'stuck','loop':'work'}],'add') }}
          documents: ${{ outputs.documents }}
      - to: execute
        when: outputs.result.status == 'changes' && (!has(outputs.result.stage) || outputs.result.stage == inputs.purpose)
        payload:
          documents: ${{ outputs.documents }}
          review_reply: ${{ outputs.review_reply }}
          finding: ${{ outputs.finding }}
          local_repair: true
          session: ${{ outputs.session }}
          fresh_instruction: ${{ outputs.retry.instructions != states.execute.outputs.retry.?instructions.orValue([]) }}
          used: >-
            ${{ inputs.purpose == 'implementation' && outputs.repair.advanced ? 0 : states.execute.outputs.used+1 }}
      - to: done
        when: 'true'
        payload:
          retry: ${{ outputs.retry }}
          result: ${{ outputs.result }}
          finding: ${{ outputs.finding }}
          documents: ${{ outputs.documents }}
    consult:
      include: ./consultation.yaml
      inputs:
        requester: ${{ states.cycle.outputs.session }}
        thread: ${{ states.cycle.outputs.result.consultation.?thread.orValue('') }}
        remaining: ${{ vars.limits.consultation - states.execute.outputs.consulted }}
        agreements: ${{ states.execute.outputs.agreements }}
        objective: ${{ inputs.request }}
        cell: ${{ states.cycle.outputs.result.consultation.cell }}
        request: ${{ states.cycle.outputs.result.consultation.request }}
        documents: ${{ states.cycle.outputs.documents }}
        mode: '${{ inputs.purpose in [''direction'',''preparation'',''advice''] && states.cycle.outputs.result.consultation.mode == ''delivery'' ? ''negotiate'' : states.cycle.outputs.result.consultation.mode
          }}'
        agent_settings: ${{ inputs.agent_settings }}
        job: ${{ states.cycle.outputs.result.consultation.?job.orValue('') }}
      transitions:
      - to: limit
        when: outputs.result.?loop.orValue('') == 'consultation'
        payload:
          loop: consultation
          consulted: ${{ states.execute.outputs.consulted + outputs.started }}
          problem: ${{ outputs.result }}
          agreements: ${{ outputs.agreements }}
      - to: execute
        when: 'true'
        payload:
          documents: ${{ states.cycle.outputs.documents }}
          agreements: ${{ outputs.agreements }}
          review_reply: ${{ states.cycle.outputs.review_reply }}
          finding: ${{ {'consultation':outputs.result,'documents':outputs.documents} }}
          session: ${{ states.cycle.outputs.session }}
          used: >-
            ${{ states.execute.outputs.used + (outputs.result.status == 'changes' ? 1 : 0) }}
          consulted: ${{ states.execute.outputs.consulted + outputs.started }}
    packages:
      include: ./packages.yaml
      inputs:
        retry: ${{ states.cycle.outputs.retry }}
        review_reply: ${{ states.cycle.outputs.review_reply }}
        requests: ${{ states.cycle.outputs.result.packages }}
        reason: ${{ states.cycle.outputs.result.summary }}
        agent_settings: ${{ inputs.agent_settings }}
        purpose: ${{ inputs.purpose }}
        session: ${{ state_output('packages','session',inputs.sessions.?packages.orValue({})) }}
      transitions:
      - to: done
        when: outputs.result.status == 'changes' && has(outputs.result.stage) && outputs.result.stage != inputs.purpose
        payload:
          retry: ${{ outputs.retry }}
          result: ${{ outputs.result }}
          finding: ${{ outputs.finding }}
          review_reply: ${{ outputs.review_reply }}
          documents: ${{ states.cycle.outputs.documents }}
      - to: execute
        when: 'true'
        payload:
          documents: ${{ states.cycle.outputs.documents }}
          finding: ${{ outputs.finding }}
          review_reply: ${{ outputs.review_reply }}
          session: ${{ states.cycle.outputs.session }}
          retry: ${{ outputs.retry }}
          fresh_instruction: ${{ outputs.retry.?instructions.orValue([]) != states.execute.outputs.retry.?instructions.orValue([]) }}
          packages: ${{ states.execute.outputs.packages+1 }}
    limit:
      sequence: []
      outputs:
        agreements: ${{ inputs.agreements }}
        result:
          status: stuck
          summary: >-
            ${{ inputs.loop == 'consultation' ? inputs.last_result.summary :
              'The '+inputs.loop+' allowance is used. Identify the next correction or decision.' }}
          loop: ${{ inputs.loop }}
          budget: ${{ inputs.budget }}
          last_result: ${{ inputs.last_result }}
        documents: ${{ inputs.documents }}
      inputs:
        documents: ${{ states.execute.outputs.documents }}
        loop: ${{ transition.payload.?loop.orValue('work') }}
        agreements: ${{ transition.payload.?agreements.orValue(states.execute.outputs.agreements) }}
        budget:
          stage: ${{ inputs.purpose }}
          counts:
            work: ${{ states.execute.outputs.used }}
            consultation: ${{ transition.payload.?consulted.orValue(states.execute.outputs.consulted) }}
            children: ${{ states.execute.outputs.children }}
            packages: ${{ states.execute.outputs.packages }}
          limits:
            work: ${{ vars.limits.work }}
            consultation: ${{ vars.limits.consultation }}
            children: ${{ vars.limits.children }}
            packages: ${{ vars.limits.packages }}
        last_result: ${{ transition.payload.?problem.orValue(state_output('cycle','result',{})) }}
    done:
      inputs:
        finding: ${{ transition.payload.?finding.orValue(transition.payload.result) }}
        review_reply: ${{ transition.payload.?review_reply.orValue(states.cycle.outputs.review_reply) }}
      sequence: []
      outputs:
        retry: ${{ transition.payload.retry }}
        result: ${{ transition.payload.result }}
        finding: ${{ inputs.finding }}
        review_reply: ${{ inputs.review_reply }}
        documents: ${{ transition.payload.documents }}
outputs:
  basis: ${{ inputs.basis }}
  budget:
    stage: ${{ inputs.purpose }}
    counts:
      work: ${{ state_output('execute','used',0) }}
      consultation: ${{ state_output('limit','result',{}).?budget.orValue({}).?counts.orValue({}).?consultation.orValue(state_output('execute','consulted',0)) }}
      children: ${{ state_output('execute','children',0) }}
      packages: ${{ state_output('execute','packages',0) }}
    limits:
      work: ${{ vars.limits.work }}
      consultation: ${{ vars.limits.consultation }}
      children: ${{ vars.limits.children }}
      packages: ${{ vars.limits.packages }}
  merge_state: ${{ state_output('cycle','merge_state',inputs.merge_state) }}
  accepted: ${{ inputs.accepted }}
  result: '${{ state_exists(''done'') ? states.done.outputs.result : states.limit.outputs.result }}'
  documents: '${{ state_exists(''done'') ? states.done.outputs.documents : states.limit.outputs.documents }}'
  work: ${{ state_output('cycle','work',{}) }}
  verification: ${{ state_output('cycle','verification',inputs.verification) }}
  patch: ${{ state_output('cycle','patch',null) }}
  candidate: ${{ state_output('cycle','candidate',{}) }}
  prior_finding: ${{ state_output('execute','finding',inputs.finding) }}
  finding: >-
    ${{ state_exists('done') ? states.done.outputs.finding : states.limit.outputs.result }}
  sessions: >-
    ${{ jq([inputs.sessions,{
      'presentation': state_output('cycle','presentation',inputs.sessions.?presentation.orValue({})),
      'backstop': state_output('cycle','delegate',inputs.sessions.?backstop.orValue({})),
      'review_threads': state_output('cycle','threads',inputs.sessions.?review_threads.orValue({})),
      'review_reply': state_output('done','review_reply',state_output('execute','review_reply',inputs.review_reply)),
      'retry': state_output('done','retry',state_output('execute','retry',inputs.sessions.?retry.orValue({}))),
      'agreements': state_output('limit','agreements',state_output('execute','agreements',inputs.sessions.?agreements.orValue([]))),
      vars.author: state_output('cycle','session',inputs.sessions[?vars.author].orValue({})),
      'assessor': state_output('cycle','assessor',inputs.sessions.?assessor.orValue({})),
      'packages': state_output('packages','session',inputs.sessions.?packages.orValue({})),
      'specialists': state_output('cycle','specialists',inputs.sessions.?specialists.orValue({}))
    }],'add') }}
catch:
- when: failure.kind != 'cancellation'
  continue:
    outputs:
      basis: ${{ inputs.basis }}
      budget: {}
      result:
        status: stuck
        summary: ${{ failure.message }}
        failure: ${{ failure }}
      documents: ${{ inputs.documents }}
      merge_state: ${{ state_output('cycle','merge_state',inputs.merge_state) }}
      accepted: ${{ inputs.accepted }}
      work: {}
      verification: ${{ inputs.verification }}
      candidate: {}
      patch: null
      prior_finding: ${{ inputs.finding }}
      finding: ${{ inputs.finding }}
      sessions: >-
        ${{ jq([inputs.sessions,{
          'presentation': state_output('cycle','presentation',inputs.sessions.?presentation.orValue({})),
          'backstop': state_output('cycle','delegate',inputs.sessions.?backstop.orValue({})),
          'review_threads': state_output('cycle','threads',inputs.sessions.?review_threads.orValue({})),
          'review_reply': state_output('execute','review_reply',inputs.review_reply),
          'retry': state_output('done','retry',state_output('execute','retry',inputs.sessions.?retry.orValue({}))),
          'agreements': state_output('limit','agreements',state_output('execute','agreements',inputs.sessions.?agreements.orValue([])))
        }],'add') }}
vars:
  author: '${{ inputs.purpose in [''direction'',''preparation''] ? ''planning'' : ''implementation'' }}'
  limits: >-
    ${{ jq([inputs.max_iterations,inputs.finding.?visit_allowance.orValue({})],
      '.[1] as $grant | {work:(if .[0]>=1 then (.[0]|floor) else 4 end), consultation:10, children:3, packages:3} | with_entries(.value = ([.value, ($grant[.key] // 0)] | max))') }}
