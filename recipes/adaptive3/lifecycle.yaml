id: adaptive3-lifecycle
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  settings: ${{ inputs.?settings.orValue({}) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  max_iterations: ${{ inputs.?max_iterations.orValue(4) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: execute
  states:
    execute:
      inputs:
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        feedback: ${{ transition.payload.?feedback.orValue(inputs.feedback) }}
        session: ${{ transition.payload.?session.orValue({}) }}
        used: ${{ transition.payload.?used.orValue(state_output('execute','used',vars.prior.?counts.orValue({}).?work.orValue(0)))
          }}
        consulted: ${{ transition.payload.?consulted.orValue(state_output('execute','consulted',vars.prior.?counts.orValue({}).?consultation.orValue(0)))
          }}
        children: ${{ transition.payload.?children.orValue(state_output('execute','children',vars.prior.?counts.orValue({}).?children.orValue(0)))
          }}
        packages: ${{ transition.payload.?packages.orValue(state_output('execute','packages',vars.prior.?counts.orValue({}).?packages.orValue(0)))
          }}
      sequence: []
      outputs:
        documents: ${{ inputs.documents }}
        feedback: ${{ inputs.feedback }}
        session: ${{ inputs.session }}
        used: ${{ inputs.used }}
        consulted: ${{ inputs.consulted }}
        children: ${{ inputs.children }}
        packages: ${{ inputs.packages }}
      transitions:
      - to: limit
        when: outputs.used >= vars.work_limit
        payload:
          loop: work
      - to: limit
        when: outputs.children > vars.children_limit
        payload:
          loop: children
      - to: cycle
        when: 'true'
    cycle:
      include: ./cycle.yaml
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ inputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        documents: ${{ states.execute.outputs.documents }}
        feedback: ${{ states.execute.outputs.feedback }}
        session: ${{ states.execute.outputs.session }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: execute
        when: outputs.result.status == 'children'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
          session: ${{ outputs.session }}
          used: ${{ states.execute.outputs.used }}
          children: ${{ states.execute.outputs.children+1 }}
      - to: limit
        when: outputs.result.status == 'consult' && states.execute.outputs.consulted >= vars.consultation_limit
        payload:
          loop: consultation
      - to: consult
        when: outputs.result.status == 'consult'
      - to: limit
        when: outputs.result.status == 'packages' && states.execute.outputs.packages >= vars.packages_limit
        payload:
          loop: packages
      - to: packages
        when: outputs.result.status == 'packages'
      - to: execute
        when: outputs.result.status == 'changes' && (!has(outputs.result.stage) || outputs.result.stage == inputs.purpose)
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
          session: '${{ has(outputs.result.human) ? {} : outputs.session }}'
          used: '${{ has(outputs.result.human) ? 0 : states.execute.outputs.used+1 }}'
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
    consult:
      include: ./consultation.yaml
      inputs:
        cell: ${{ states.cycle.outputs.result.consultation.cell }}
        request: ${{ states.cycle.outputs.result.consultation.request }}
        documents: ${{ states.cycle.outputs.documents }}
        mode: '${{ inputs.purpose in [''direction'',''preparation'',''advice''] ? ''advice'' : states.cycle.outputs.result.consultation.mode
          }}'
        agent_settings: ${{ inputs.agent_settings }}
        job: ${{ states.cycle.outputs.result.consultation.?job.orValue('') }}
      transitions:
      - to: execute
        when: 'true'
        payload:
          documents: ${{ states.cycle.outputs.documents }}
          feedback: ${{ {'consultation':outputs.result,'documents':outputs.documents} }}
          session: ${{ states.cycle.outputs.session }}
          used: ${{ states.execute.outputs.used }}
          consulted: ${{ states.execute.outputs.consulted+1 }}
    packages:
      include: ./packages.yaml
      inputs:
        requests: ${{ states.cycle.outputs.result.packages }}
        reason: ${{ states.cycle.outputs.result.summary }}
        agent_settings: ${{ inputs.agent_settings }}
        purpose: ${{ inputs.purpose }}
      transitions:
      - to: execute
        when: 'true'
        payload:
          documents: ${{ states.cycle.outputs.documents }}
          feedback: ${{ outputs.result }}
          session: '${{ has(outputs.result.human) ? {} : states.cycle.outputs.session }}'
          used: ${{ states.execute.outputs.used }}
          packages: ${{ states.execute.outputs.packages+1 }}
    limit:
      sequence: []
      outputs:
        result:
          status: stuck
          summary: ${{ 'The '+inputs.loop+' allowance is used. Explain the next correction or progress before granting
            more attempts.' }}
          loop: ${{ inputs.loop }}
          budget: ${{ inputs.budget }}
          last_result: ${{ inputs.last_result }}
        documents: ${{ inputs.documents }}
      inputs:
        documents: ${{ states.execute.outputs.documents }}
        loop: ${{ transition.payload.?loop.orValue('work') }}
        budget:
          stage: ${{ inputs.purpose }}
          counts:
            work: ${{ states.execute.outputs.used }}
            consultation: ${{ states.execute.outputs.consulted }}
            children: ${{ states.execute.outputs.children }}
            packages: ${{ states.execute.outputs.packages }}
          limits:
            work: ${{ vars.work_limit }}
            consultation: ${{ vars.consultation_limit }}
            children: ${{ vars.children_limit }}
            packages: ${{ vars.packages_limit }}
        last_result: ${{ state_output('cycle','result',{}) }}
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
        documents: ${{ transition.payload.documents }}
outputs:
  result: '${{ state_exists(''done'') ? states.done.outputs.result : states.limit.outputs.result }}'
  documents: '${{ state_exists(''done'') ? states.done.outputs.documents : states.limit.outputs.documents }}'
  work: ${{ state_output('cycle','work',{}) }}
  patch: ${{ state_output('cycle','patch',null) }}
  candidate: ${{ state_output('cycle','candidate',{}) }}
  feedback: ${{ state_output('execute','feedback',inputs.?feedback.orValue({})) }}
catch:
- when: failure.kind != 'cancellation'
  continue:
    outputs:
      result:
        status: stuck
        summary: ${{ failure.message }}
        failure: ${{ failure }}
      documents: ${{ inputs.documents }}
      work: {}
      candidate: {}
      patch: null
      feedback: ${{ inputs.?feedback.orValue({}) }}
vars:
  prior: '${{ inputs.feedback.?budget.orValue({}).?stage.orValue('''') == inputs.purpose ? inputs.feedback.budget
    : {} }}'
  work_limit: '${{ inputs.feedback.?budget.orValue({}).?stage.orValue('''') == inputs.purpose ? inputs.feedback.budget.?limits.orValue({}).?work.orValue((inputs.max_iterations
    >= 1 ? int(inputs.max_iterations) : 4)) : (inputs.max_iterations >= 1 ? int(inputs.max_iterations) : 4) }}'
  consultation_limit: '${{ inputs.feedback.?budget.orValue({}).?stage.orValue('''') == inputs.purpose ? inputs.feedback.budget.?limits.orValue({}).?consultation.orValue(3)
    : 3 }}'
  children_limit: '${{ inputs.feedback.?budget.orValue({}).?stage.orValue('''') == inputs.purpose ? inputs.feedback.budget.?limits.orValue({}).?children.orValue(3)
    : 3 }}'
  packages_limit: '${{ inputs.feedback.?budget.orValue({}).?stage.orValue('''') == inputs.purpose ? inputs.feedback.budget.?limits.orValue({}).?packages.orValue(3)
    : 3 }}'
