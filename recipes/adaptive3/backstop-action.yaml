schema_version: 2
id: backstop-action
input_schema:
  response: {type: object, required: true}
  destinations: {type: array, required: true}
  stage: {type: string, default_value: ''}
  human: {type: object, default_value: {}}
inputs:
  response: ${{ inputs.response }}
  destinations: ${{ inputs.destinations }}
  stage: ${{ inputs.stage }}
  human: ${{ inputs.?human.orValue({}) }}
sequence: []
outputs:
  eligible: ${{ inputs.response.status in ['ask','resume'] && inputs.response.?stage.orValue('') in inputs.destinations
    && (inputs.response.?instruction.orValue(null) == null || (inputs.response.status == 'resume' && inputs.response.stage == inputs.stage && inputs.stage in ['direction','preparation','implementation','outcome']
        && !inputs.response.instruction.scope_change && inputs.response.?additional_attempts.orValue(1) == 1)
      || (size(inputs.human)>0 && (!inputs.response.instruction.scope_change || inputs.response.stage == 'direction')))
    && (inputs.response.?destination.orValue(null) == null || (inputs.response.stage == 'configure' && inputs.response.destination in inputs.destinations))
    && jq(inputs.response, '(.action // "") | if type == "string" then test("[^[:space:]]") else false end')
    }}
