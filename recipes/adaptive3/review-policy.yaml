# Shared valid destinations; settings are consumed once by the caller.
id: adaptive3-review-policy
inputs:
  stage: ${{ inputs.stage }}
  recovery: ${{ inputs.?recovery.orValue(false) }}
sequence: []
outputs:
  destinations: ${{ vars.destinations[inputs.stage].filter(d, inputs.recovery || d != 'configure') }}
  setting:
    id: return_to
    control: choice
    label: Return to
    value: auto
    default: auto
    reset_label: Choose automatically
    schema:
      type: string
      enum: ${{ ['auto'] + vars.destinations[inputs.stage].filter(d, inputs.recovery || d != 'configure') }}
    choices: ${{ [{'value':'auto','label':'Auto'}] + vars.destinations[inputs.stage].filter(d, inputs.recovery || d != 'configure').map(d, {'value':d,'label':d}) }}
    applies_to: [revise]
    effect: Run the selected correction stage's complete cycle once, then return to Auto. Scope changes require Direction.
vars:
  destinations:
    configure: [configure]
    direction: [configure, direction]
    preparation: [configure, direction, preparation]
    implementation: [configure, direction, preparation, implementation]
    outcome: [configure, direction, preparation, implementation, outcome]
    integration: [configure, direction, preparation, implementation, outcome, integration]
    recovery: [configure, direction, preparation, implementation, outcome, integration]
    advice: [direction]
