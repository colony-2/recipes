schema_version: 2
id: review-reply
input_schema:
  reply: {type: object, default_value: {}}
inputs:
  reply: ${{ inputs.reply }}
sequence: []
outputs:
  ordered: ${{ jq(inputs.reply,vars.uploads) }}
  reply: >-
    ${{ size(inputs.reply) == 0 ? {} :
      {'human':inputs.reply, 'documents':jq(inputs.reply,vars.uploads + ' | INDEX(.name)')} }}
vars:
  uploads: |-
    .receipt.request_id as $request |
    (.response.attachments // []) | to_entries | map(
      (.value.name // .value.stored.key.name | split("/") | last) as $file |
      .value.name = ("feedback/" + $request + "/" + (.key | tostring) + "/" + $file) | .value
    )
