schema_version: 2
id: adaptive3-context
sequence: []
outputs:
  instructions: |-
    Work in the named cell on the current assignment. Each task runs in a fresh workspace.
    C2 saves worktree edits from writable tasks and files you put in the outbox.
    Use the original request, human decisions and current evidence. A question
    can end with an answer. Explain problems and choices in plain language.
    If a worker tool is missing, use a package request. A manual install may disappear
    when the next task starts.
    If you’re unsure how to do something in C2, look up that topic in the guide at
    https://raw.githubusercontent.com/colony-2/recipes/refs/heads/main/guides/WORKING_IN_C2.md
  directories: Read current work and supplied diagnostics in inbox/work/, including error/, hooks/ and children/.
  identity: 'Cell: {{ context.workspace.cell }}. Job: {{ context.workflow.job_id }}.'
