id: adaptive3-execute-prompts
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  guidance: ${{ inputs.?guidance.orValue('') }}
vars:
  assignments:
    direction: |
      Frame this request as a feature, bug, explanation or oversight assignment. Inspect
      existing behavior. Consult another cell when its code, API or responsibility affects
      the proposed change. Make reasonable local choices and explain consequential open
      questions in the one-pager. For delivery,
      write a readable one-pager, starting with the user problem and your recommendation: Problem Description; Non Goals; What we are planning to do;
      Compat/Upgrade (what existing users need to do); Key challenges/design questions & answers (question/answer table).
      Keep every consequential question; there is no question-count cap. Give alternatives
      and consequences where useful, not filler. Include useful UI mockups for visual changes.
      Use a descriptive title naming the proposed change. Human direction approval comes
      before delivery implementation. A straightforward explanation can produce an answer.
      Include an expected scope table: Cell | Core code | Tests | Docs. Give each affected
      cell a row, using none, small, medium or large in each category. No line-count estimates.
      Tests include frameworks, harnesses, fixtures and test implementations.
      On revision, update scope and Non Goals to reflect the latest human direction.
      If recovering prior work, inspect its actual results and human decisions; retrieve
      only useful outputs. Do not import its planning session or revive excluded requirements.
      Keep each section short except where important design questions need more space.
      Explain why each proposed change helps. Put detailed mechanics in supporting material.
    preparation: |-
      Develop the detail and test statements needed for the approved direction. A detailed
      design is useful only where needed. Test statements use Markdown, expectation language,
      filenames, priority, unit/integration and dependencies; each statement is at most 30 words.
      Cover positive and negative critical behavior. Do not expand a local validation request
      into production deployment or reintroduce excluded requirements. No internal handoff file
      is needed. Keep important approved material available in the work you return.
    implementation: |-
      Implement the agreed behavior in the managed repository, using current human direction,
      approved design and test expectations. Diagnose and correct failures with your tools.
      Obtain necessary external work through consultation. Run meaningful checks. Capture
      actual UI states for visual changes, inspect the images, and include selected individual
      captures in review/. A README mentioning a missing screenshot is not evidence.
      Keep code in the worktree. Summarize actual changes and tests in useful review material.
      The recipe will prepare and verify the candidate. Do not merge or push yourself.
    outcome: |-
      Prepare the human outcome review from the actual implementation, checks and owner work.
      Explain: What changed; What we needed others to do; How we tested; What we did not do;
      Public APIs or encapsulation changed; Differences from approved direction.
      Measure the actual candidate. Report additions/removals for core code, tests and docs,
      separately by cell, with per-file support. Test frameworks, harnesses and fixtures count
      as test code. Mark binary or uncountable changes honestly. Separate completed delegated
      work from pending work; retrieve its actual results before counting it. Do not invent
      counts or compare them with numerical estimates. Use Git numstat for the actual diff,
      then classify files by purpose; paths alone do not define test code.
      Retrieve useful prior captures/results using job inspection. Include the actual selected
      files, with working local links, under review/. Keep the approved direction and important
      open choices understandable. Do not edit implementation here: request the earlier stage
      through review/resolution if behavior needs correction. Preserve any approved patch and
      native receipt supplied in feedback for unchanged-rebase comparison.
    integration: |-
      Confirm the actual native integration and publication results against the accepted work.
      Report concrete omissions or failures. Do not repeat an already completed external effect.
    advice: |-
      You are the receiving owner. Investigate the request against your code and existing APIs.
      Speak directly: "I can do this, but ...". Challenge unnecessary APIs, wrong ownership or
      incorrect assumptions. Suggest the smallest useful change and explain differences.
      When work is needed, return assignment with your proposed feature, bug, explanation or
      oversight request and a descriptive title. Put useful supporting documents in review/.
      Do not implement delivery or require a handoff filename or an acknowledgement document.
      You may ask another owner through consultation; the dialogue remains inline.
      Delivery normally uses adaptive3. If an existing dedicated workflow is needed,
      return its selector as delivery_recipe and explain the choice. For creating cells,
      root can select git+https://github.com/colony-2/recipes.git//create.yaml@main.
      A delivery assignment without a descriptive title is incomplete. Correct it before submission.
sequence: []
outputs:
  task: |
    ${{ vars.assignments[inputs.purpose] }}

    Request: {{ inputs.request }}
    Repository-relative target: {{ inputs.target_directory }}
    Current findings: ${{ inputs.feedback.?summary.orValue('') }}
    Latest human words: ${{ inputs.feedback.?human.orValue({}).?fields.orValue({}).?feedback.orValue('') }}
    Owner reply: ${{ inputs.feedback.?consultation.orValue({}).?summary.orValue('') }}
    Owner job: ${{ inputs.feedback.?consultation.orValue({}).?child.orValue({}).?job_id.orValue('') }}
    Use job inspection for the referenced original results when needed.
    {{ inputs.guidance }}
    Read current diagnostic files in inbox/work/error when supplied.
    A consultation reply may have supporting files in inbox/work; inspect those before repeating the question.
    Previous approval request: ${{ inputs.feedback.?approval.orValue({}).?result.orValue({}).?receipt.orValue({}).?request_id.orValue('') }}
    When an approved edit changes, explain the difference and refer to its original approval.
    Read any original human notes in inbox/work/feedback/ and apply their scope changes.
    Child status: ${{ inputs.feedback.?consultation.orValue({}).?child.orValue({}).?status.orValue('') }}
    Child message: ${{ inputs.feedback.?consultation.orValue({}).?child.orValue({}).?message.orValue('') }}
    Jobs submitted by your last task: ${{ json_stringify(inputs.feedback.?children.orValue([])) }}
    These are results for you to act on. Read selected files in inbox/work/children/.
    Inspect the original job's tasks for partial work when no final result exists.
    Decide whether to recover useful work, correct and retry, adopt an existing attempt,
    or continue without it. Respect a stop instruction; a corrective cancellation can
    justify a corrected attempt. Do not repeat an unchanged attempt or duplicate active work.
    To adopt an existing job, return consult with its cell, request, mode and job ID.
    Return stuck only when you cannot resolve the problem. An invalid report can be
    corrected without repeating its already recorded child submissions.

    A successful child job may only have collected evidence. Read its actual findings
    before deciding what was accomplished and what still needs work.
