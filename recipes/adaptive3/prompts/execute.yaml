id: adaptive3-execute-prompts
inputs:
  history: ${{ inputs.?history.orValue({}) }}
  changed: ${{ inputs.?changed.orValue(false) }}
  choice: ${{ inputs.?choice.orValue('') }}
  approval_guidance: ${{ inputs.?approval_guidance.orValue('') }}
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  finding: ${{ inputs.?finding.orValue({}) }}
  review_reply: ${{ inputs.?review_reply.orValue({}) }}
  guidance: ${{ inputs.?guidance.orValue('') }}
vars:
  one_pager: |-
    Standard plan only. Use this Markdown outline for review/one-pager.md, the primary attachment.
    Use the same title for the heading and the attachment. Replace the prompts below with the proposal.

    # 1P: <what is proposed>
    On revision, open with what changed since the last version the human saw and why it matters.
    ## Problem Description
    Who has the problem, what happens today and what do you recommend?
    For a job started through consultation or negotiation, add “Why this job exists” after the opening.
    Name the requester, their goal and this cell’s contribution. Link the parent job and the originating
    exchange, including its report and transcript when available. Keep those links on revision.
    ## Non Goals
    What falls outside this proposal?
    ## What we are planning to do
    Describe the change to approve. Give expected scope by Cell | Core code | Tests | Docs, using
    none/small/medium/large. Tests include frameworks, harnesses and fixtures.
    ## Compat/Upgrade
    What must existing users or callers do? One line is enough if no action is needed.
    ## Key challenges/design questions & answers
    Use a Question | Answer table for consequential choices. Give the recommendation and reason,
    or say what is still open. Include only real questions.
  assignments:
    direction: |
      Frame the request as a feature, bug, explanation or oversight assignment. Inspect existing behavior.
      For an explanation, use Answer (what works today), Evidence (source or example) and
      Limits (relevant uncertainty). A direct answer can be one sentence.
      For delivery, choose delivery_route before writing. Choose short for a clear, bounded local change
      with a known check, such as a compatible dependency update. In the short Direction summary,
      give a few lines to the implementer. Assignment — change and source. Next action — how to make
      and check it. Where to find the work — relevant code or evidence. Say why it qualifies. Carry this handoff in summary. Leave primary null and write no planning documents.
      Choose standard for consequential choices, a migration, external delivery or requested plan review.
      Use the standard overview below and include useful UI mockups for visual changes.
      Other stages leave delivery_route null. Reflect the latest human direction when revising scope.
      If recovering prior work, inspect its actual results and human decisions; retrieve
      only useful outputs. Do not import its planning session or revive excluded requirements.
      If the direction names scoped tools, explain what the installation may run before
      scheduling consumption. Private pnpm installation permits direct, transitive and selected
      optional dependency builds, mutable transitives and repeated preparation after failures,
      worker changes or cache loss. Keep requested references and checks exact. Changed scope
      needs approval or a covering cell policy. Withdrawal and newer human direction take precedence.
      Baseline source and standing cell policy are distinct from personal job approval.
      Explain why each proposed change helps. Put detailed mechanics in supporting material.
    preparation: |-
      Update the Direction 1P and present it first. Link [Design](design.md) and [Tests](acceptance.md)
      near the top. Name any exact check the requester or cell requires and give its source.
      Use these Markdown outlines for the next two attachments.

      review/design.md (supporting order 0)
      # Design
      ## Approach
      Describe how the change works and which components change.
      ## Affected interfaces
      What will callers or other cells observe? Link any agreement this relies on.
      ## Tradeoffs
      Give the consequential choice, alternative and reason when relevant.

      review/acceptance.md (supporting order 1)
      # Tests
      ## What should work
      - <Observable behavior in 30 words or fewer. Cover critical success and failure cases.>
      ## How we could check it
      - <Behavior> — <suggested check>. <File, priority, unit/integration, dependencies>.
      - Required check, if any — <exact method and the request or cell contract that requires it>.

      Add useful supporting material after those three. Link each attached negotiation report from the 1P.
      Reports and transcripts are supplied by the recipe. Give other supporting files order 5 or greater.
      Reconcile all three documents with new information. Plan candidate checks using pre-merge evidence.
      When the assignment requests a release or deployment, assess that outcome after the release
      or deployment step. Respect exclusions in the approved direction. No internal handoff file
      is needed. Keep important approved material available in the work you return.
    implementation: |-
      Implement the agreed behavior in the managed repository, using current human direction
      and cell contracts. A designer’s example is a proposed check. You can replace it
      with equivalent evidence or correct an unsupported assumption. Explain the difference
      once. Preserve any method the requester explicitly chose. Diagnose and repair defects.
      Obtain necessary external work through consultation. Run focused local tests that exercise
      your fix, including edits to a verify hook. When they pass, return the candidate for review.
      If this turn ends with a concrete local fix you can still try, return repair with
      the failing check and the different action you will take. A repeated unsupported
      retry goes to the delegate. Return stuck for an impasse or external decision.
      The recipe runs the configured suite before merge and returns failures and diagnostics
      to you for repair. The recipe handles rebase, merge and publication. Capture
      actual UI states for visual changes, inspect the images, and include selected individual
      captures in review/. A README mentioning a missing screenshot is not evidence.
      Keep code in the worktree. Use the summary for the handoff. If a note is useful, use
      “What changed” (behavior and candidate), “Checks run” (result and evidence) and “Remaining gaps”.
      For a finished Git change, write commit.title as a short one-line Git subject and
      commit.body as prose explaining what changed and why. The recipe adds the job link
      and Git trailers. Leave commit null when there is no change ready to land.
    outcome: |-
      Compare the candidate to the exact approved plan in approved/ when supplied.
      Use this Markdown outline for the primary document.

      # <Result the person can now review>
      Say what they can accept or still need to decide. On a repeat review, say what changed
      since the version they last saw and why their answer matters.
      ## What changed
      Describe the observable result, relevant owner work, interface changes and differences from the plan.
      ## How we checked it
      Identify the candidate checked. For each promised behavior, give the check, observed result,
      passed/failed/skipped status and evidence link. Explain changes to a proposed method.
      ## What remains
      Name gaps, missing required checks, their impact and any decision needed. Distinguish required
      candidate evidence from an explicitly requested check on the published artifact. Name that check.

      Measure the actual candidate. Report additions/removals for core code, tests and docs,
      separately by cell, with per-file support. Test frameworks, harnesses and fixtures count
      as test code. Mark binary or uncountable changes honestly. Separate completed delegated
      work from pending work; retrieve its actual results before counting it. Do not invent
      counts or compare them with numerical estimates. Use Git numstat for the actual diff,
      then classify files by purpose; paths alone do not define test code.
      Retrieve useful prior captures/results using job inspection. Include the actual selected
      files, with working local links, under review/. Keep the approved direction and important
      open choices understandable. Do not edit implementation here: request the earlier stage
      through review/resolution if behavior needs correction. Preserve any approved patch and
      native receipt supplied in feedback for unchanged-rebase comparison.
    integration: |-
      Confirm the actual native integration and publication results against the accepted work.
      Report concrete omissions or failures. Do not repeat an already completed external effect.
    advice: |-
      You are the receiving owner. Investigate the request against your code and existing APIs.
      Answer a consultation with existing behavior or its limit. A question can end here.
      Only a requester asking for a change opens negotiation. Then you can decline or
      offer a specific assignment fitting this cell. Leave assignment null until you agree.
      Use a descriptive title for an offer. Put supporting files in review/ only when needed.
      Keep owner dialogue inline.
      Delivery normally uses adaptive3. If an existing dedicated workflow is needed,
      return its selector as delivery_recipe and explain the choice. For creating cells,
      root can select git+https://github.com/colony-2/recipes.git//create.yaml@main.
      A delivery assignment without a descriptive title is incomplete. Correct it before submission.
sequence: []
outputs:
  reader: |-
    ${{ size(inputs.history)>0 ? 'The last packet shown for this decision is in presented/. Its message and reply: ' + json_stringify(inputs.history) : 'This is the first presentation for this decision. Describe the proposal or delivered result directly.' }}
    Open the message and primary document with the decision and what matters. Compare revisions only with the packet the reader saw. Answer their question directly.
    ${{ inputs.purpose == 'outcome' ? (inputs.choice == 'accept_fully' ? 'They chose Take to Completion. Explain delivery and verification against the approved plan. Identify any new decision.' : inputs.changed ? 'Ask whether to merge. State what was delivered and verified.' : 'Ask whether to accept the result. State what was delivered and verified.') : '' }}
  planning_repair: |-
    Continue the current {{ inputs.purpose }} assignment. Finding from ${{ inputs.finding.?source.orValue('the previous turn') }}: ${{ inputs.finding.?summary.orValue('') }}
    Review reply and source: ${{ jq(inputs.review_reply.?submission.orValue({}), '{actor:.receipt.actor.kind,submission:.receipt.submission_id,choice:.response.direction,words:.response.feedback} | with_entries(select(.value != null)) | tojson') }}
    Current evidence: ${{ json_stringify(inputs.finding.?errors.orValue({}).map(k,k)) }}
    ${{ nonempty(inputs.approval_guidance) ? 'Approved guidance: ' + inputs.approval_guidance : '' }}
    Read the current packet and attached findings in inbox/work/. Fix the issue or cite the existing file and lines that settle it. Keep the packet when it already meets the request.
  repair: |-
    Continue the current implementation. Here is the finding:
    ${{ inputs.finding.?summary.orValue('') }}
    ${{ nonempty(inputs.review_reply.?submission.orValue({}).?response.orValue({}).?feedback.orValue('')) ? 'Review choice: ' + inputs.review_reply.submission.response.?direction.orValue('unrecorded') + '\nReview receipt (' + inputs.review_reply.submission.?receipt.orValue({}).?actor.orValue({}).?kind.orValue('source unrecorded') + '): ' + inputs.review_reply.submission.response.feedback : '' }}
    ${{ nonempty(inputs.approval_guidance) ? 'Guidance with the approved plan: ' + inputs.approval_guidance : '' }}
    Read attached diagnostics or review notes in inbox/work/. Fix the defect, or show
    how the current result meets the agreed behavior. For a finished Git change, update
    commit.title and commit.body to describe the whole change that will land.
  task: |
    Originating assignment (the sender may be another agent)

    {{ inputs.request }}

    ${{ vars.assignments[inputs.purpose] }}
    ${{ inputs.purpose in ['direction','preparation'] ? vars.one_pager : '' }}

    For a human review, write your message to the person in summary.
    Guidance can accompany any approval. Follow instructions and keep suggestions optional.
    For a child job or negotiated work, explain who asked and why in a short paragraph under “Why this job exists.”
    Use blockquotes only for direct quotations. For negotiated work, give the agreed
    scope, delivery status and a relative link to each report under negotiations/.
    These reports and transcripts are attached automatically; exclude them from your
    emitted files and document_details. For a direct child job, cite the parent and initiating task.
    When new external work or a material choice expands scope, request Preparation or
    Direction before undertaking it. Use status revise_plan for that implementation handoff.

    Describe new or changed attachments in document_details with their exact review/ path, a short
    title, why to open the file, role and reading order. Select one primary. The recipe reuses
    descriptions for unchanged files. Emitting files replaces your selection; emitting none keeps it.
    Negotiation reports and transcripts are added automatically.

    For delivery, name the owner and the thread ID from its accepted agreement (review/negotiations/<thread>/report.md).
    Describe the need in your own words. Choose an agreement that fits the current human decision.
    To amend it, open negotiation with that thread ID. A new agreement needs both sides to agree.
    Read available code or try the interface for ordinary questions. Consult an owner for a requirement,
    a suspected bug or a fact you cannot obtain, including behavior of a private interface.
    Try a local fixture when it can answer the question. If a failure also occurs on the unchanged base,
    record both runs and take that failure to its owner while repairing your own change.
    Open a needed negotiation yourself. Bring the person a material tradeoff or a specific grant they can make.
    When a review decision affects other owners, set share_review on each relevant consultation or delivery.
    Include the source job and receipt when starting a child directly. For a running sibling, cite the source
    in the next handoff. Before escalating a shared question, inspect the coordinator and relevant sibling reviews. Apply it or identify a concrete local conflict.
    Attribute proposals to their author. Quote a human decision from its receipt or original
    message. A parent’s interpretation stays a proposal unless the source supports it.
    Repository-relative target: {{ inputs.target_directory }}
    Backstop correction: ${{ inputs.finding.?instruction.orValue({}).?text.orValue('') }}
    Scope amendment: ${{ inputs.finding.?amendment.orValue({}).?instruction.orValue('') }}
    A scope amendment carries a review receipt. Verify a disputed attribution in the job record.
    Apply the precise instruction, explain the change from the earlier approval, update scope and
    Non Goals in Direction and affected tests in Preparation. Preserve missing evidence
    as missing. Do not add a new consequential choice without identifying it for review.

    Current findings: ${{ inputs.finding.?summary.orValue('') }}
    ${{ nonempty(inputs.approval_guidance) ? 'Guidance with the approved plan: ' + inputs.approval_guidance : '' }}
    Review choice: ${{ inputs.review_reply.?submission.orValue({}).?response.orValue({}).?direction.orValue('') }}
    Review receipt lists ${{ inputs.review_reply.?submission.orValue({}).?receipt.orValue({}).?actor.orValue({}).?kind.orValue('source unrecorded') }}: ${{ inputs.review_reply.?submission.orValue({}).?response.orValue({}).?feedback.orValue('') }}
    Owner reply: ${{ inputs.finding.?consultation.orValue({}).?summary.orValue('') }}
    Agreement thread: ${{ inputs.finding.?consultation.orValue({}).?thread.orValue('') }}
    Owner withdrawal: ${{ json_stringify(inputs.finding.?consultation.orValue({}).?child.orValue({}).?withdrawal.orValue(null)) }}
    Owner job: ${{ inputs.finding.?consultation.orValue({}).?child.orValue({}).?job_id.orValue('') }}
    Use job inspection for the referenced original results when needed.
    {{ inputs.guidance }}
    Read current diagnostic files in inbox/work/error when supplied.
    A consultation reply may have supporting files in inbox/work; inspect those before repeating the question.
    Previous approval request: ${{ inputs.finding.?approval.orValue({}).?result.orValue({}).?receipt.orValue({}).?request_id.orValue('') }}
    When an approved edit changes, explain the difference and refer to its original approval.
    Read any original human notes in inbox/work/feedback/ and apply their scope changes.
    Child status: ${{ inputs.finding.?consultation.orValue({}).?child.orValue({}).?status.orValue('') }}
    Child message: ${{ inputs.finding.?consultation.orValue({}).?child.orValue({}).?message.orValue('') }}
    Jobs submitted by your last task: ${{ json_stringify(inputs.finding.?children.orValue([])) }}
    These are results for you to act on. Read selected files in inbox/work/children/.
    Inspect the original job's tasks for partial work when no final result exists.
    Decide whether to recover useful work, correct and retry, adopt an existing attempt,
    or continue without it. Respect a stop instruction; a corrective cancellation can
    justify a corrected attempt. Do not repeat an unchanged attempt or duplicate active work.
    To adopt an existing job, return consult with its cell, request, mode and job ID.
    Return stuck only when you cannot resolve the problem. An invalid report can be
    corrected without repeating its already recorded child submissions.

    A withdrawn child returns its source and unfinished work. Close that assignment in the parent’s account,
    preserve any verification gap and continue the remaining assignments.
    A successful child job may only have collected evidence. Read its actual findings
    before deciding what was accomplished and what still needs work.
