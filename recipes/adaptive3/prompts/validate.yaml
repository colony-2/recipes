id: adaptive3-validate-prompts
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  checks: ${{ inputs.?checks.orValue({}) }}
  guidance: ${{ inputs.?guidance.orValue('') }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  specialist: ${{ inputs.?specialist.orValue('') }}
sequence: []
outputs:
  task: |
    Validate the complete {{ inputs.purpose }} assignment against: {{ inputs.request }}
    Inspect the actual work and current scope. Check factual claims, required behavior,
    relevant regressions, owner dependencies and meaningful test results. A superseded
    prerequisite is not a current blocker. Required failures remain failures.
    For visual changes inspect actual images and judge their relevance. Missing screenshots
    cannot be replaced by a sentence saying capture failed. Do not require deployment
    unless the assignment calls for it. Check all expectations for this purpose on every pass.
    Native checks: ${{ json_stringify(inputs.checks) }}
    Return passed, changes with concrete findings, or stuck. Do not repair the work.
    For advice, assess the receiver's facts, alternatives and proposed assignment.
    A clear, grounded disagreement can answer the consultation successfully.
    For direction and preparation, assess the proposed work and test expectations.
    Repository assessment guidance: {{ inputs.guidance }}
    Specialist assignment: {{ inputs.specialist }}
    Current correction: ${{ inputs.feedback.?summary.orValue('') }}
    Latest human direction: ${{ inputs.feedback.?human.orValue({}).?fields.orValue({}).?feedback.orValue('') }}
    Read original human notes in feedback/ when supplied. Assess the current agreed scope;
    human direction supersedes contradictory agent advice. Do not add excluded requirements.
    Identify concrete defects and evidence, and withdraw a finding when its premise was wrong.
    Optional specialist advice has no independent veto, but may reveal a real defect.
    A required incomplete check remains incomplete. Return all material current findings.
    For delivery Direction, require the per-cell Cell | Core code | Tests | Docs scope
    table, using none/small/medium/large rather than line estimates. For Outcome, check
    measured additions/removals by cell and category against the actual per-file diff
    and delegated results. Test frameworks, harnesses and fixtures are test code.
    Check binary/uncountable entries and distinguish pending from completed owner work.
    Read error/change-counts.tsv for this candidate's exact Git measurements. Missing,
    invented or inconsistent reports return changes with the specific correction.

    For human documents, check that a reader can quickly understand the user problem,
    proposed change, meaningful choices and remaining uncertainty. Ask for a concrete
    rewrite when jargon, third-person owner language or workflow bookkeeping obscures
    that meaning. Preserve useful detail and every consequential design question;
    length alone is not a defect. Use the same full validation on the revised result.
