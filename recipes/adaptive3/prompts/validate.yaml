id: adaptive3-validate-prompts
inputs:
  approval_guidance: ${{ inputs.?approval_guidance.orValue('') }}
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  checks: ${{ inputs.?checks.orValue({}) }}
  guidance: ${{ inputs.?guidance.orValue('') }}
  finding: ${{ inputs.?finding.orValue({}) }}
  review_reply: ${{ inputs.?review_reply.orValue({}) }}
  document_details: ${{ inputs.?document_details.orValue([]) }}
  specialist: ${{ inputs.?specialist.orValue('') }}
vars:
  planning_review: |-
    Review the promised behavior. Treat the author's proposed checks as suggestions unless the requester or cell requires them.
    Call a plan human-approved only when the person's words or review choice show they approved it.
    Favor the requester's simpler approach unless the extra step addresses a concrete risk.
    When asking for proof now, name the plan decision it could change or the requirement that makes it due now.
    Otherwise pass a sound plan and leave the check for implementation and verification.
  outcome_reporting: |-
    For Outcome, check measured additions/removals by cell and category against the actual
    per-file diff and delegated results. Test frameworks, harnesses and fixtures are test code.
    Check binary/uncountable entries and distinguish pending from completed owner work.
    Read error/change-counts.tsv for this candidate's exact Git measurements. Missing,
    invented or inconsistent reports return changes with the specific correction.
sequence: []
outputs:
  task: |
    Review the {{ inputs.purpose }} result for this request.

    {{ inputs.request }}

    For a finding, use Expected (the promise or contract and its source), Observed (the
    result and evidence) and Impact (who is affected and what needs repair). An observed
    defect can justify a repair. Label optional improvements as suggestions.
    Inspect the actual work and current scope. Check factual claims, required behavior,
    relevant regressions, owner dependencies and meaningful test results. A superseded
    prerequisite is not a current blocker. Required failures remain failures.
    For visual changes inspect actual images and judge their relevance. Missing screenshots
    cannot be replaced by a sentence saying capture failed. Assess the candidate using
    pre-merge evidence. When the assignment requests release or deployment, assess that
    outcome after the corresponding step. Apply this phase's criteria and recheck prior
    findings against the current result. Use matching managed verification evidence and run
    targeted checks when needed to resolve a concern.
    Inspect these producer document details against the actual selected files:
    ${{ json_stringify(inputs.document_details) }}
    Require useful titles and purposes explaining why each document matters. Misleading
    titles, irrelevant purposes or generic repeated descriptions need concrete rewrites.
    Integration produces no new document review: do not require producer details for
    the already accepted collection; retain its existing file checks.
    Native checks: ${{ json_stringify(inputs.checks) }}
    Return passed, changes with concrete findings, or stuck. Do not repair the work.
    For advice, assess the receiver's facts, alternatives and proposed assignment.
    A clear, grounded disagreement can answer the consultation successfully.
    ${{ inputs.purpose in ['direction','preparation'] ? vars.planning_review : '' }}
    Repository assessment guidance: {{ inputs.guidance }}
    Specialist assignment: {{ inputs.specialist }}
    Human-directed scope amendment: ${{ inputs.finding.?amendment.orValue({}).?instruction.orValue('') }}
    When an amendment is supplied, verify that the revised direction and test plan apply
    exactly the native human instruction, explain the change from prior approval, and
    introduce no additional consequential choice. Reject unrelated weakening or missing
    required evidence. The instruction authorizes only that precise edit; outcome and
    merge acceptance remain separate. Unresolved choices must return changes or stuck.

    Current correction: ${{ inputs.finding.?summary.orValue('') }}
    ${{ nonempty(inputs.approval_guidance) ? 'Guidance with the approved plan: ' + inputs.approval_guidance : '' }}
    Review choice: ${{ inputs.review_reply.?submission.orValue({}).?response.orValue({}).?direction.orValue('') }}
    Review receipt lists ${{ inputs.review_reply.?submission.orValue({}).?receipt.orValue({}).?actor.orValue({}).?kind.orValue('source unrecorded') }}: ${{ inputs.review_reply.?submission.orValue({}).?response.orValue({}).?feedback.orValue('') }}
    Read the original review notes in feedback/ when supplied. Assess the current agreed scope;
    human direction supersedes contradictory agent advice. Do not add excluded requirements.
    Identify concrete defects and evidence, and withdraw a finding when its premise was wrong.
    Optional specialist advice has no independent veto, but may reveal a real defect.
    A required incomplete check remains incomplete. Return all material current findings.
    For standard delivery Direction, check the per-cell scope table in the 1P.
    ${{ inputs.purpose == 'outcome' ? vars.outcome_reporting : '' }}

    A short Direction needs only a clear handoff for a bounded local change and a way to check it.
    Its first human review is the outcome. Preparation must contain the reconciled 1P, actionable design,
    promised behaviors, suggested checks and links to the relevant owner agreements.
    For an agent-requested job trace the request to its sender at Preparation and Outcome.
    At Outcome compare the candidate with the promises in approved/. Equivalent evidence
    can cover a designer’s proposed check. A missing explicitly required check or observed
    defect needs repair. Return covered when every promise and required check is evidenced.
    At Outcome, send a code defect or missing required implementation check directly to
    the author with repair_implementation. Use changes for a correction to the report.
    At Implementation, once behavior and required checks pass, use report_edit for a
    presentation-only correction. Tell the Outcome author exactly what to edit.
    Use passed when a valid outcome still needs a human decision, including ambiguous older
    approvals. Use revise_plan for a material change to promised behavior or external work.

    For human documents, check that a reader can quickly understand the user problem,
    proposed change, meaningful choices and remaining uncertainty. Ask for a concrete
    rewrite when jargon, third-person owner language or workflow bookkeeping obscures
    that meaning. Preserve useful detail and every consequential design question.
    Judge length and heading variations by whether they obscure the decision. Apply the same criteria to a revision.
