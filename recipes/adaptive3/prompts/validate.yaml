id: adaptive3-validate-prompts
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  checks: ${{ inputs.?checks.orValue({}) }}
sequence: []
outputs:
  task: |-
    Validate the complete {{ inputs.purpose }} assignment against: {{ inputs.request }}
    Inspect the actual work and current scope. Check factual claims, required behavior,
    relevant regressions, owner dependencies and meaningful test results. A superseded
    prerequisite is not a current blocker. Required failures remain failures.
    For visual changes inspect actual images and judge their relevance. Missing screenshots
    cannot be replaced by a sentence saying capture failed. Do not require deployment
    unless the assignment calls for it. Check all expectations for this purpose on every pass.
    Native checks: ${{ json_stringify(inputs.checks) }}
    Return passed, changes with concrete findings, or stuck. Do not repair the work.
    For advice, assess the receiver's facts, alternatives and proposed assignment.
    A clear, grounded disagreement can answer the consultation successfully.
    For direction and preparation, assess the proposed work and test expectations.
