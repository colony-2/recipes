id: adaptive3-backstop-prompts
inputs:
  stage: ${{ inputs.stage }}
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  prior_job: ${{ inputs.?prior_job.orValue('') }}
sequence: []
outputs:
  task: |
    Investigate why this job stopped and explain its current state. Scale the diagnosis
    to the situation. Establish the intended outcome, latest human direction, completed
    work and external effects, remaining work, and the exact failing boundary. Inspect
    earlier recovery attempts and available capabilities. Separate confirmed causes,
    plausible explanations and missing evidence. Explain realistic ways forward, who
    owns each action and which actions are available now. Recommend a path and state
    what it would accomplish. Identify any specific human decision or external
    prerequisite. Preserve completed work and approvals. Resume when there is a concrete,
    authorized correction; otherwise present the diagnosis and options for discussion.
    Current stage: {{ inputs.stage }}.
    Request: {{ inputs.request }}
    Problem: ${{ inputs.problem.?summary.orValue('') }}
    Child attempt: ${{ inputs.problem.?child.orValue({}).?job_id.orValue('') }}
    Child diagnostic: ${{ inputs.problem.?child.orValue({}).?failure_message.orValue('') }}
    Human choice: ${{ inputs.feedback.?fields.orValue({}).?decision.orValue('') }}
    Human words: ${{ inputs.feedback.?fields.orValue({}).?feedback.orValue('') }}
    Investigate through authorized read-only tools without asking permission to investigate.
    Use retained task results and native receipts to distinguish completed source work,
    merged/published effects, pending consumer work and failed recovery attempts. Explain
    the causal chain across separate failures, not just the last error. Attribute human
    instructions, generated plans and recipe constraints to their actual sources; retain
    original human wording when scope matters. Missing history is missing evidence.
    Do not replace this job,
    weaken required results or revive excluded requirements. Read a cancellation
    message: respect a stop request; a corrective cancellation can support a new
    attempt with the requested changes.
    Set action only for a concrete next step available now: establish its target, route,
    relevant execution scope and prerequisites. Say what Execute will attempt and its
    limited result. A destination alone does not establish readiness. An owner proposal,
    source fix, accepted child, approval or advertised readiness does not prove deployment
    or a working route. After a command fails, require evidence addressing that boundary
    before describing the same path as usable. Use proportionate checks; do not duplicate
    jobs or completed publication as probes. An authorized diagnostic can be available
    even when its result is unknown. Inspect existing owner attempts before requesting work.
    Return resume with action and stage only when existing authority justifies execution.
    Retain supported automatic corrections without a mandatory report or approval ritual.
    For discussion or an unavailable future repair, return ask, action: null, and stage:
    null (or a suggested allowed stage). Explain the specific prerequisite and its owner.
    For an available action needing a human decision, return ask with action and stage;
    state precisely what Apply authorizes and why that authorization is needed. Approval
    supplies no missing credentials, deployment, technical grants or usable owner route.
    A question-only human reply asks for an answer, not another automatic work allowance.

    Read any attached human notes in inbox/work/feedback/ before deciding the correction.
    Model changes come from human guidance. The native review has optional model and
    reasoning-effort fields. Use those to change invocation settings, including when a
    provider cannot run. Do not select replacements autonomously; explain what failed
    and ask the human to enter the choice if it was only discussed in prose.
    Prior job: {{ inputs.prior_job }}
    ${{ inputs.prior_job == '' ? '' : vars.recovery }}

    When a local allowance is exhausted, explain the correction or progress and propose
    a finite additional_attempts value (1–20) only with an available correction.
    Question-only discussion and settings reconsideration grant no attempts or stage work.

    Lead with the current result and recommended next step, including its specific
    prerequisite and what a human decision would authorize, if any. Write a complete,
    self-contained explanation within the summary limit; prioritize the next decision
    over secondary technical detail. Never end mid-sentence or omit realistic options
    to fit the limit. Simple failures can be brief; multiple failures need their separate causes,
    uncertainties, owners and realistic options. Return a descriptive title naming this
    problem. Speak directly as the cell's owner. Avoid words such as bootstrap when
    plain words can explain the actual action. Do not link to worker-local paths.
    You do not need to create a recovery document. If existing supporting documents
    help, return only those in review/ and name the useful first document in primary;
    use links relative to the attached collection. Otherwise return primary: null.
    Approval with new text or attachments requires you to reconsider the proposal.
    Incorporate a compatible refinement; ask again if the shown action is invalidated,
    replaced, conflicts with changed scope or leaves an essential choice unresolved.
    On question, answer and return ask. Settings reconsideration permits diagnosis only.
    Changing the model alone is not permission to change scope or skip checks.
    Review preparation findings: ${{ inputs.feedback.?validation.orValue({}).?summary.orValue('') }}
  message: Question or requested change
  notes: Attach notes or an annotated document (optional)
  question: Ask a question
  change: Request changes
  continue: Apply this correction
  retry: Try another
  attempts: attempts
  model_continue: Reconsider with these agent settings
  unreadable: I could not prepare a readable diagnosis or recovery choice. Describe what you need clarified or adjust the agent settings.
vars:
  recovery: |-
    When a prior job is supplied, inspect it before choosing the next stage. Read the latest
    human direction, actual approvals, useful task outputs, current children and completed
    merges/publication. Recover only useful files into outbox, keeping their relative links.
    Return the actual prior human receipt in approval with its source job and task; copy
    its approved patch only when available and needed, and name that outbox path in patch.
    Return publication only from an actual successful native merge result; include its
    source job and task and original merged_hash. Never infer approval or merge from an
    agent's summary. Leave these fields null when no such record applies. Report a denied
    or missing history read explicitly; it is not proof that approval never happened.
    Choose implementation to restore unfinished code in the managed workspace and rerun
    complete validation. Choose integration when merging is complete and only publication
    remains. Changed human scope goes back to direction. Do not repeat completed effects.
    Explain why the chosen stage has work left. Do not create a recovery or handoff file.
