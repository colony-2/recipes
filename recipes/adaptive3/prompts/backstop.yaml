id: adaptive3-backstop-prompts
inputs:
  stage: ${{ inputs.stage }}
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  prior_job: ${{ inputs.?prior_job.orValue('') }}
sequence: []
outputs:
  task: 'Investigate why this job stopped. Preserve useful work and completed external effects.

    Link the incoming and outgoing negotiation reports under negotiations/ and explain their status.
    These reports are attached automatically. Identify the parent goal and agreed assignment.
    Establish who requested the job and why, citing actual native records and original

    human words. Inspect retained tasks, relevant child results, failure diagnostics and

    useful background research. Mark unknown identity, rationale or history as unknown.

    Explain what completed, where work stopped, failed approaches, realistic options,

    prerequisites and owners, and a recommendation when supported.


    Current stage: {{ inputs.stage }}.

    Request: {{ inputs.request }}

    Problem: ${{ inputs.problem.?summary.orValue('''') }}

    Child attempt: ${{ inputs.problem.?child.orValue({}).?job_id.orValue('''') }}

    Human choice: ${{ inputs.feedback.?response.orValue({}).?direction.orValue('''') }}

    Human words: ${{ inputs.feedback.?response.orValue({}).?feedback.orValue('''') }}

    Full discussion: ${{ json_stringify(inputs.feedback.?conversation.orValue([])) }}

    Selected destination: ${{ inputs.feedback.?response.orValue({}).?settings.orValue({}).?return_to.orValue(''auto'')
    }}

    Review findings: ${{ inputs.feedback.?validation.orValue({}).?summary.orValue('''') }}


    Read original human notes in inbox/work/feedback/. Interpret intent in context;

    a polite request can be an instruction, including one sent through Ask a question.

    A genuine informational or hypothetical question remains discussion. For a clear

    current human instruction, set instruction to its precise interpretation and set

    scope_change accurately. Do not invent a human receipt or treat an older unrelated

    instruction, destination setting, model recommendation or question as authority.

    For an automatic correction or a question, instruction is null.


    Follow a precise human-directed requirement change without asking the human to

    approve the same edit again. Return to Direction for scope changes; update the

    scope and Non Goals, then present the revised design and acceptance criteria for a fresh Preparation decision. Removing a phone

    criterion is possible when explicitly requested; an absent phone run otherwise

    remains unmet. Preserve the literal human words and attachment sources. If an

    essential ambiguity, additional consequential choice or conflicting destination

    remains, return ask and identify that missing decision.


    Prefer one return to a phase in this job, carrying the requested correction in

    instruction and action. Configure may specify destination for the intended next

    phase; other returns set destination null. Allowed destinations have native entry

    prerequisites. A route does not supply missing plans, verification, authority or

    credentials. Never use an old acceptance for a changed candidate. A return setting

    applies once and then returns to Auto. Ask for an earlier phase or concrete external

    work when prerequisites are missing.


    Cancellation is manual for now. Do not cancel or implement native cancel/supersede. If the human explicitly needs a separate

    job, route the instruction to an execution phase that can use the existing create

    job operation, preserving exact requested recipe/instructions and useful work.

    Creating that job does not cancel this source. In general recover in this job;

    do not create replacement jobs to escape ordinary failures or exhausted allowances.


    Return resume only for an available concrete correction justified by current

    authority. Automatic corrections may choose a bounded extra revolution without

    human review; default additional_attempts to one, with integer choices 1–20.

    Extend only the paused loop at its matching phase. Two consecutive automatic

    recoveries are finite; phase hopping and questions do not reset that allowance.

    Repeated unchanged failure requires a different concrete correction or human help.

    A newly executed human instruction authorizes finite work, not a permanent grant.


    When human help is needed, return ask and fill report: origin (requester and

    rationale with sources), work (completed work and external effects), blocker

    (exact failure and unsuccessful approaches), options (choices with prerequisites

    and owners), recommendation when supported, and research with useful sources.

    Unknowns must be explicit. The recipe renders a primary Markdown report from

    these values and retains a readable fallback if diagnosis or file tools fail.

    Automatic resume may set report null. The recipe reserves review/backstop-report.md for its generated report. Supporting files must use other names and have complete details,

    working relative links, and a selected primary when returning a collection.


    Use status ask, action null and stage null for an unavailable repair or discussion.

    An available recommendation can offer Apply. Apply authorizes only its displayed

    action and accepts no new feedback or attachments. Give instructions authorizes

    the precise new instruction; do not require a second Apply for that same action.

    On document comments, revise the report before offering a changed recommendation.

    Review cannot change model or reasoning configuration.


    Investigate with authorized read-only tools. Return a self-contained summary and a

    descriptive title naming the problem. Keep selected supporting files under review/.

    Return document_details for the complete selected review/ collection, including

    reused files, with exact document_id, useful title, description, role and order.

    Exactly one primary must match primary; no files means [] and primary null.


    Prior job: {{ inputs.prior_job }}

    ${{ inputs.prior_job == '''' ? '''' : vars.recovery }}

    '
  message: Question or requested change
  notes: Attach notes or an annotated document (optional)
  question: Ask a question
  change: Give instructions
  continue: Apply this correction
  retry: Try another
  attempt: attempt
  attempts: attempts
  unreadable: I could not prepare a readable diagnosis or recovery choice. Ask a question or request changes
    to clarify the failure.
vars:
  recovery: 'When a prior job is supplied, inspect it before choosing the next stage. Read the latest

    human direction, actual approvals, useful task outputs, current children and completed

    merges/publication. Recover only useful files into outbox, keeping their relative links.

    Return the actual prior human receipt in approval with its source job and task; copy

    the exact Outcome confirm_coverage task as source_task for full Preparation acceptance;
    it binds the native plan receipt to the assessed candidate. Copy
    its approved patch only when available and needed, and name that outbox path in patch.

    Queued publication belongs to the receiver. Return queue_recovery from the original

    native grouped start item (receiver), canonical branch and Change-Id. Inspect that

    receiver''s retained merge and hook tasks. Resume its post-merge publication boundary;

    never resubmit or publish in a caller. An open receiver goal means repair is pending.

    Legacy queue receipts without an owner require diagnosis, not ordinary recovery.

    Return publication as a producer reference to check, only when resuming Integration

    for a completed target-cell merge. Include its exact source job and task and original

    merged_hash. It is a lookup hint, never trusted merge state. Dependency receipts

    stay supporting evidence when returning to Implementation or Outcome. Never infer approval or merge
    from an

    agent''s summary. Leave these fields null when no such record applies. Report a denied

    or missing history read explicitly; it is not proof that approval never happened.

    Choose implementation to restore unfinished code in the managed workspace and rerun

    complete validation. Choose integration when merging is complete and only publication

    remains. Changed human scope goes back to direction. Do not repeat completed effects.

    Explain why the chosen stage has work left. Do not create a recovery or handoff file.'
