id: adaptive3-review-prompts
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  validation: ${{ inputs.?validation.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  decision: ${{ inputs.?decision.orValue(inputs.purpose) }}
  title: ${{ inputs.?title.orValue('') }}
sequence: []
outputs:
  task: 'Review the {{ inputs.purpose }} result for: {{ inputs.request }}

    Validation: ${{ inputs.validation.?summary.orValue('''') }}

    Recorded reviewer: ${{ inputs.feedback.?human.orValue({}).?receipt.orValue({}).?actor.orValue({}).?kind.orValue(''source unrecorded'') }}

    Review choice: ${{ inputs.feedback.?human.orValue({}).?response.orValue({}).?direction.orValue('''') }}

    Review reply: ${{ inputs.feedback.?human.orValue({}).?response.orValue({}).?feedback.orValue('''') }}

    When the human selects question, answer and keep the review pending.

    When a human asks a question, answer directly and return answer; keep this item pending.

    When they clearly request changes, preserve the original wording, return changes, and

    keep a clarification of the unapproved plan with its planning author. Return to direction for

    a changed request, or implementation for a defect in the candidate. Do not ask the human to select a phase. If approval conflicts with

    a change request, explain and clarify in this conversation before accepting anything.

    If the human declines tools, do not approve or install them.

    For package and applicable planning reviews, explain what private pnpm installs may run before
    covered consumption: direct, transitive and selected optional dependency builds, mutable
    transitives and repeated preparation after failure, worker changes or cache loss.
    Exact requested references and checks remain exact. Changed versions, checks or scope
    need approval or a cell policy covering them; withdrawal, cancellation and newer human scope take precedence.
    Questions never approve. Unchanged authorized retries need no second prompt; completed
    durable operations stay completed. A legacy pnpm reference/check match alone does not
    authorize expanded scripts. Use the existing package review when authorization is absent.
    Baseline dependencies use their recorded source and standing cell policy, independently of a
    personal job approval. Do not add per-dependency prompts or infer approval from success.

    An independent assessment returns accepted only when the actual result meets the current

    assignment. Explain material differences and failures in ordinary English. Agent judgment

    cannot manufacture human approval. Keep document identities unchanged.

    Read any attached human notes in inbox/work/feedback/ before interpreting the reply.

    Document comments require revising the original review collection and its complete producer validation cycle,
    with fresh approval. They are never a question or approval.

    Apply the selected correction destination once. Keep the original human message with the correction.

    '
  decision: ${{ vars.questions[?inputs.decision].orValue('Review this work.') }}
  message: Question or requested change
  reply: ${{ inputs.feedback.?summary.orValue('') }}
  notes: Attach notes or an annotated document (optional)
  title: >-
    ${{ nonempty(inputs.title) ? inputs.title : vars.stages[inputs.purpose] }}
  directions: '${{ [{''id'':''accept'',''label'':vars.accept[?inputs.decision].orValue(''Accept outcome''),''feedback_mode'':''forbidden'',''allow_attachments'':false,''continues_review'':false}]
    + (inputs.decision == ''plan'' ? [{''id'':''accept_fully'',''label'':''Finish if verified'',''feedback_mode'':''forbidden'',''allow_attachments'':false,''continues_review'':false}] : [])
    + (inputs.decision == ''packages'' ? [{''id'':''decline'',''label'':vars.decline_label,''feedback_mode'':''optional'',''allow_attachments'':true,''continues_review'':false}]
    : []) + [{''id'':''question'',''label'':vars.question_label,''feedback_mode'':''required'',''allow_attachments'':true,''continues_review'':true},{''id'':''revise'',''label'':vars.change_label,''feedback_mode'':''required'',''allow_attachments'':true,''continues_review'':false}]
    }}'
vars:
  stages:
    configure: Setup
    direction: Direction
    preparation: Preparation
    implementation: Implementation
    outcome: Outcome review
    integration: Integration
    advice: Consultation
  questions:
    plan: >-
      What should work when this is done? Approve the promised behavior and any explicitly
      required checks in the brief. The author may use an equivalent check for a suggested
      example. Choose “Show me the result” for a final review. “Finish if verified” allows
      completion or merge when independent review confirms the verified result meets the promise.
    direction: Approve this direction so detailed planning can begin?
    answer: Does this answer your question? Accepting it completes this job.
    merge: Merge these changes?
    outcome: Accept this outcome and complete the job without a merge?
    packages: Approve these tools and exact checks? Private pnpm installations permit direct, transitive
      and selected optional dependency builds, mutable transitives and repeated preparation after failures,
      worker changes or cache loss. Changed requests or scope need approval or a covering cell policy. Withdrawal
      and newer human scope take precedence. The cell configuration is adopted after the checks pass.
  accept:
    plan: Show me the result
    direction: Approve direction
    answer: Accept answer
    merge: Accept and merge
    outcome: Accept outcome
    packages: Add tools and run checks
  question_label: Ask a question
  change_label: Request changes
  decline_label: Do not add these tools
