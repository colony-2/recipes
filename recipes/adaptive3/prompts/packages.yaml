id: adaptive3-package-prompts
inputs:
  requests: ${{ inputs.requests }}
  reason: ${{ inputs.reason }}
sequence: []
outputs:
  propose: |-
    Prepare a proposed worker configuration for these packages:
    ${{ json_stringify(inputs.requests) }}
    Reason: {{ inputs.reason }}
    Read the current .c2/config.yaml. Write the proposed actual config as review/config.yaml
    and a short review/README.md explaining the additions and probe commands. Preserve all
    unrelated settings. Do not install the proposal or run requested tools yet.
    Return a short review title naming the packages and why they are needed.
  install: |-
    The package configuration in work/review/config.yaml has been approved. Install that
    exact configuration as .c2/config.yaml, preserving unrelated current settings. Do not run
    requested tools in this task; a fresh task probes them. Report a conflict rather than
    silently overwriting concurrent unrelated settings.
  adopt: |-
    Adopt the approved, successfully probed configuration in work/review/config.yaml into
    .c2/config.yaml. Preserve unrelated current changes and report a conflict if the proposal
    no longer applies. Do not expand the approved package request.
