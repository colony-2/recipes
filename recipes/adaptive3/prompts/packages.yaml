id: adaptive3-package-prompts
inputs:
  requests: ${{ inputs.requests }}
  reason: ${{ inputs.reason }}
sequence: []
outputs:
  propose: |-
    Prepare a proposed worker configuration for these packages:
    ${{ json_stringify(inputs.requests) }}
    Reason: {{ inputs.reason }}
    Read the current .c2/config.yaml. Write the proposed config as review/config.yaml,
    preserving unrelated settings. Use this outline for review/README.md.

    ## Tools and purpose
    Name each exact package reference and why the assignment needs it.
    ## What installation can run
    Describe the effects the person would approve.
    ## How we will check
    Give the probe command for each requested package.

    Explain that authorizing a private pnpm installation permits builds
    for direct, transitive and selected optional dependencies, including mutable transitive
    resolutions and repeated preparation after failure, worker changes or cache loss.
    Requested references and checks stay exact. Changed versions, checks or installation
    scope need applicable authority; questions do not approve. Withdrawal, cancellation and
    newer human scope take precedence. Baseline recipe, repository, extension and early-hook
    dependencies use their source authority and standing cell policy; personal job approval
    does not universally precede installation. A legacy pnpm reference/check policy match
    alone cannot establish expanded script authority; use this existing review when needed.
    Do not install the proposal or run requested tools yet.
    Write the complete approval question in summary. Mention the installation effects the person would approve.
    Return a short review title naming the packages and why they are needed.
    Use review/README.md as primary.
    Describe each new or changed attachment with its exact document_id, title, purpose,
    role and reading order. The recipe reuses the approved descriptions for unchanged
    files. Include any optional earlier attachment you want to show again.
