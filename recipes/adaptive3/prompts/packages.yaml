id: adaptive3-package-prompts
inputs:
  requests: ${{ inputs.requests }}
  reason: ${{ inputs.reason }}
sequence: []
outputs:
  propose: |-
    Prepare a proposed worker configuration for these packages:
    ${{ json_stringify(inputs.requests) }}
    Reason: {{ inputs.reason }}
    Read the current .c2/config.yaml. Write the proposed actual config as review/config.yaml
    and a short review/README.md explaining the additions and probe commands. Preserve all
    unrelated settings. Do not install the proposal or run requested tools yet.
    Return a short review title naming the packages and why they are needed.
    Use review/README.md as primary.
    Return document_details for the complete current selected review/ collection, including
    reused files and images. Each item requires document_id (exact attachment key, including
    review/), title (useful plain text, 1–120 Unicode characters), description (why to open it,
    1–300 characters), role (primary, supporting or diagnostic), and order (integer 0–1000000).
    Use nonblank valid Unicode without control characters. Give each attachment exactly one
    item and exactly one primary role matching primary. Reading priority groups roles first,
    then order within each group; equal orders are allowed. Never infer purpose from a filename.
    If you emit any review/ files, describe the complete replacement collection. If you emit
    none, describe all reused selected files again. Exclude removed files; include selected
    owner evidence. No documents means document_details: [] and primary: null. Keep the
    collection focused and purposes concise; native combined presentation is limited to 65536
    JSON bytes. Rewrite overflow rather than truncating or silently discarding evidence.
  install: |-
    The package configuration in work/review/config.yaml has been approved. Install that
    exact configuration as .c2/config.yaml, preserving unrelated current settings. Do not run
    requested tools in this task; a fresh task probes them. Report a conflict rather than
    silently overwriting concurrent unrelated settings.
  adopt: |-
    Adopt the approved, successfully probed configuration in work/review/config.yaml into
    .c2/config.yaml. Preserve unrelated current changes and report a conflict if the proposal
    no longer applies. Do not expand the approved package request.
