id: adaptive3-resolver-prompts
inputs:
  stage: ${{ inputs.stage }}
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  prior_job: ${{ inputs.?prior_job.orValue('') }}
sequence: []
outputs:
  task: "Help get this job moving again. Current stage: {{ inputs.stage }}.\nRequest: {{ inputs.request }}\nProblem:\
    \ ${{ inputs.problem.?summary.orValue('') }}\nChild attempt: ${{ inputs.problem.?child.orValue({}).?job_id.orValue('')\
    \ }}\nChild diagnostic: ${{ inputs.problem.?child.orValue({}).?failure_message.orValue('') }}\nHuman choice:\
    \ ${{ inputs.feedback.?fields.orValue({}).?decision.orValue('') }}\nHuman words: ${{ inputs.feedback.?fields.orValue({}).?feedback.orValue('')\
    \ }}\nInspect the original failure, relevant job tasks, partial results and owner capabilities.\nFind a concrete\
    \ correction using available tools and owners. Do not replace this job,\nweaken required results or revive excluded\
    \ requirements. Read a cancellation\nmessage: respect a stop request; a corrective cancellation can support\
    \ a new\nattempt with the requested changes.\nReturn resume and the stage whose Execute should act on your correction.\
    \ If you need\nhuman direction, return ask with a clear explanation and focused question.\nA question-only human\
    \ reply asks for an answer, not another automatic work allowance.\n\nRead any attached human notes in inbox/work/feedback/\
    \ before deciding the correction.\nModel changes come from human guidance. The native review has optional model\
    \ and\nreasoning-effort fields. Use those to change invocation settings, including when a\nprovider cannot run.\
    \ Do not select replacements autonomously; explain what failed\nand ask the human to enter the choice if it\
    \ was only discussed in prose.\nPrior job: {{ inputs.prior_job }}\n${{ inputs.prior_job == '' ? '' : vars.recovery\
    \ }}\n\nWhen a local allowance is exhausted, explain the correction or progress and propose\na finite additional_attempts\
    \ value (1\u201320). Question-only discussion grants no attempts.\n"
  decision: Continue with this correction, or discuss it first.
  continue: Continue with this correction
  discuss: Ask a question or change the direction
  message: Question or direction
  notes: Attach notes or an annotated document (optional)
vars:
  recovery: |-
    When a prior job is supplied, inspect it before choosing the next stage. Read the latest
    human direction, actual approvals, useful task outputs, current children and completed
    merges/publication. Recover only useful files into outbox, keeping their relative links.
    Return the actual prior human receipt in approval with its source job and task; copy
    its approved patch only when available and needed, and name that outbox path in patch.
    Return publication only from an actual successful native merge result; include its
    source job and task and original merged_hash. Never infer approval or merge from an
    agent's summary. Leave these fields null when no such record applies. A denied or
    missing history read is a blocker to clarify, not proof that approval never happened.
    Choose implementation to restore unfinished code in the managed workspace and rerun
    complete validation. Choose integration when merging is complete and only publication
    remains. Changed human scope goes back to direction. Do not repeat completed effects.
    Explain why the chosen stage has work left. Do not create a recovery or handoff file.
