id: adaptive3-consultation-prompts
inputs:
  request: ${{ inputs.request }}
  sender: ${{ inputs.sender }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
sequence: []
outputs:
  task: |-
    I'm {{ inputs.sender }}. {{ inputs.request }}
    Negotiate the consumer outcome. For validation, ask what failed or what concrete risk
    needs evidence. Try the closest existing capability against the actual example. Weigh the
    cost of the consumer workaround against implementing and supporting a small owner fix.
    Decline speculative scope, ask a focused question, or offer a narrower enhancement.
    Use negotiation_reply question or alternative when the requester needs to respond.
    Include concrete behavior and a success check in any assignment.
    Can the current system do this? If a change is needed, propose the request you would
    implement, explain what you would change in shape and why, and name the work type.
    Our latest discussion: ${{ inputs.feedback.?summary.orValue('') }}
