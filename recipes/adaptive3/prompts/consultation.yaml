id: adaptive3-consultation-prompts
inputs:
  request: ${{ inputs.request }}
  sender: ${{ inputs.sender }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
sequence: []
outputs:
  task: |-
    I'm {{ inputs.sender }}. {{ inputs.request }}
    Can the current system do this? If a change is needed, propose the request you would
    implement, explain what you would change in shape and why, and name the work type.
    Our latest discussion: ${{ inputs.feedback.?summary.orValue('') }}
