id: adaptive3-consultation-prompts
inputs:
  request: ${{ inputs.request }}
  sender: ${{ inputs.sender }}
  mode: ${{ inputs.?mode.orValue('advice') }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
vars:
  advice: >-
    Answer — how this works today. Evidence — the source or example that shows it.
    Limits — any uncertainty that affects the caller. A short reply can be one sentence.
    If you need a fact, ask for it. Finish with your answer and leave assignment null.
  negotiate: >-
    The requester wants a change. Check the need against your cell’s goals.
    You can decline, ask a question or offer the smallest change you would deliver.
    Put only terms you agree to deliver in assignment. Explain any difference from the request.
sequence: []
outputs:
  task: |-
    {{ inputs.sender }} asks: {{ inputs.request }}
    ${{ inputs.mode == 'advice' ? vars.advice : vars.negotiate }}
    ${{ inputs.feedback.?summary.orValue('') }}
