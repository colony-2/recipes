id: adaptive3-discussion
inputs:
  proposed_action: ${{ inputs.?proposed_action.orValue('') }}
  proposed_stage: ${{ inputs.?proposed_stage.orValue('') }}
  instructions: ${{ inputs.?instructions.orValue(false) }}
  request: ${{ inputs.request }}
  prompt: ${{ inputs.prompt }}
  schema: ${{ inputs.schema }}
  documents: ${{ inputs.?documents.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: snapshot
  states:
    snapshot:
      include: ../review-v2.yaml
      inputs:
        request: ${{ inputs.request }}
      transitions:
      - to: build
        when: 'true'
    build:
      inputs:
        conversation: ${{ transition.payload.?conversation.orValue(inputs.request.?conversation.orValue([])) }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        session: ${{ transition.payload.?session.orValue(inputs.session) }}
        snapshot: ${{ transition.payload.?snapshot.orValue(states.snapshot.outputs.form.request) }}
      sequence:
      - id: form
        include: ../review-v2.yaml
        inputs:
          request: ${{ jq([inputs.snapshot,inputs.conversation], '.[0] + {conversation:.[1]}') }}
      outputs:
        form: ${{ sequence.form.outputs.form }}
        conversation: ${{ inputs.conversation }}
        documents: ${{ inputs.documents }}
        session: ${{ inputs.session }}
      transitions:
      - to: ask
        when: 'true'
    ask:
      id: ask
      op: input
      inputs:
        form: ${{ states.build.outputs.form }}
      transitions:
      - to: record
        when: 'true'
    record:
      inputs:
        native: ${{ states.ask.outputs }}
        conversation: ${{ states.build.outputs.conversation }}
        documents: ${{ states.build.outputs.documents }}
      sequence:
      - id: review_notes
        include: ./review-reply.yaml
        inputs:
          reply: ${{ inputs.native }}
      outputs:
        native: ${{ inputs.native }}
        review_reply: ${{ sequence.review_notes.outputs.reply }}
        conversation: ${{ jq([inputs.conversation,inputs.native,sequence.review_notes.outputs.ordered], vars.record) }}
        documents: ${{ jq([inputs.documents,sequence.review_notes.outputs.reply.documents],'add') }}
      transitions:
      - to: answer
        when: outputs.native.response.direction == 'question'
      - to: done
        when: 'true'
    answer:
      include: ./agent.yaml
      inputs:
        prompt: |-
          {{ inputs.prompt }}
          Answer the latest question directly, using the ordered discussion below. A review reply carries its recorded actor. Use that source when quoting it.
          ${{ inputs.instructions ? 'For Backstop, interpret intent in context. A polite request can be an instruction even on Ask a question. If the human clearly instructs a correction, return resume with instruction describing that exact change and its scope_change flag. Do not execute it here; the caller checks the recorded decision and prerequisites. Answer the question and reassess the blocker. If your answer identifies an available next step within the current assignment, return resume with its concrete action, stage, and instruction null. If human input is still needed, return ask and state the current remaining question in summary. An informational question supplies no new approval. Cancellation remains manual; prefer recovery in this job. Read attached notes before interpreting intent.' : 'This is discussion only. Do not revise documents, approve work, move stages, replenish attempts, or apply a correction, even if your answer proposes one.' }}
          Return the actual answer in summary. Read original documents and all discussion
          attachments in inbox/work/; feedback files have separate per-request paths.
          ${{ json_stringify(states.record.outputs.conversation) }}
        schema: ${{ inputs.schema }}
        documents: ${{ states.record.outputs.documents }}
        session: ${{ states.build.outputs.session }}
        read_only: true
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: inputs.instructions && outputs.response.status == 'resume' && outputs.response.?instruction.orValue(null) != null
        payload:
          session: ${{ outputs.session }}
          interpretation: ${{ outputs.response }}
      - to: append_answer
        when: 'true'
    append_answer:
      sequence: []
      outputs:
        conversation: ${{ inputs.record.conversation + [{'role':'agent','text':inputs.answer.response.summary,'attachments':jq([inputs.answer.artifacts,size(inputs.record.conversation)],
          '.[1] as $n | .[0] | to_entries | map(select(.key | startswith("review/")) | .value.name = ("answers/"
          + ($n|tostring) + "/" + .key) | .value)')}] }}
        documents: ${{ jq([inputs.record.documents,inputs.answer.artifacts,size(inputs.record.conversation)], '.[2]
          as $n | .[0] + (.[1] | with_entries(select(.key | startswith("review/")) | .key = "answers/" + ($n|tostring)
          + "/" + .key | .value.name = .key))') }}
        session: ${{ inputs.answer.session }}
      transitions:
      - to: done
        when: inputs.instructions && states.answer.outputs.response.status in ['ask','resume'] && nonempty(states.answer.outputs.response.?action.orValue('')) && states.answer.outputs.response.?stage.orValue(null) != null && (states.answer.outputs.response.action != inputs.proposed_action || states.answer.outputs.response.stage != inputs.proposed_stage)
        payload:
          record: ${{ {'native':states.record.outputs.native,'documents':outputs.documents,'conversation':outputs.conversation} }}
          interpretation: ${{ states.answer.outputs.response }}
          session: ${{ outputs.session }}
      - to: build
        when: 'true'
        payload:
          snapshot: >-
            ${{ inputs.instructions && states.answer.outputs.response.status == 'ask' && size(states.answer.outputs.response.summary)>0
              ? jq([states.build.outputs.form.request,states.answer.outputs.response.summary,states.answer.outputs.response.?action.orValue(null) == inputs.proposed_action && states.answer.outputs.response.?stage.orValue(null) == inputs.proposed_stage],
                '.[2] as $same | .[0] + {question:.[1]} | if $same then . else .directions |= map(select(.id != "continue")) end') : states.build.outputs.form.request }}
          conversation: ${{ outputs.conversation }}
          documents: ${{ outputs.documents }}
          session: ${{ outputs.session }}
      inputs:
        record: ${{ states.record.outputs }}
        answer: ${{ states.answer.outputs }}
    done:
      sequence: []
      outputs:
        native: ${{ inputs.record.native }}
        session: ${{ inputs.session }}
        conversation: ${{ inputs.record.conversation }}
        documents: ${{ inputs.record.documents }}
        interpretation: ${{ inputs.interpretation }}
      inputs:
        record: ${{ transition.payload.?record.orValue(states.record.outputs) }}
        interpretation: ${{ transition.payload.?interpretation.orValue({}) }}
        session: ${{ transition.payload.?session.orValue(states.build.outputs.session) }}
outputs:
  review_reply: ${{ states.record.outputs.review_reply }}
  interpretation: ${{ states.done.outputs.interpretation }}
  session: ${{ states.done.outputs.session }}
  native: ${{ states.done.outputs.native }}
  conversation: ${{ states.done.outputs.conversation }}
  documents: ${{ states.done.outputs.documents }}
  review_id: ${{ states.snapshot.outputs.form.request.review_id }}
vars:
  record: |-
    .[0] as $turns | .[1] as $native |
    ($turns | map(select(.role == "human" and .receipt.request_id == $native.receipt.request_id))) as $recorded |
    {role:"human",direction:$native.response.direction,text:$native.response.feedback,
     attachments:.[2],settings:$native.response.settings,receipt:$native.receipt} as $turn |
    if ($recorded|length) == 0 then $turns + [$turn]
    elif $recorded == [$turn] then $turns
    else error("Conflicting contributions for one native receipt") end
