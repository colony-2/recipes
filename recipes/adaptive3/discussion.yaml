id: adaptive3-discussion
inputs:
  instructions: ${{ inputs.?instructions.orValue(false) }}
  request: ${{ inputs.request }}
  previous: ${{ inputs.?previous.orValue({}) }}
  prompt: ${{ inputs.prompt }}
  schema: ${{ inputs.schema }}
  documents: ${{ inputs.?documents.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: snapshot
  states:
    snapshot:
      include: ../review-v2.yaml
      inputs:
        request: ${{ jq([inputs.request,inputs.previous], vars.open_revision) }}
      transitions:
      - to: ask
        when: 'true'
    ask:
      id: ask
      op: input
      inputs:
        form: ${{ transition.payload.?form.orValue(states.snapshot.outputs.form) }}
      transitions:
      - to: record
        when: 'true'
    record:
      inputs:
        native: ${{ states.ask.outputs }}
        presented: >-
          ${{ states.ask.outputs.?receipt.orValue({}).?actor.orValue({}).?kind.orValue('') == 'human'
            ? {'question':state_output('next_message','question',states.snapshot.outputs.form.request.question),
               'reply':states.ask.outputs.response,'receipt':states.ask.outputs.receipt,'documents':inputs.request.documents}
            : state_output('record','presented',inputs.previous.?presented.orValue(null)) }}
        documents: ${{ state_output('record','documents',jq([inputs.documents,inputs.previous.?feedback_files.orValue({})],'add')) }}
      sequence:
      - id: review_notes
        include: ./review-reply.yaml
        inputs:
          reply: ${{ json_parse(json_stringify(inputs.native)) }}
      outputs:
        presented: >-
          ${{ inputs.native.?receipt.orValue({}).?actor.orValue({}).?kind.orValue('') == 'human'
            ? jq([inputs.presented,{'notes':sequence.review_notes.outputs.reply.documents}],'add') : inputs.presented }}
        native: ${{ inputs.native }}
        review_reply: ${{ sequence.review_notes.outputs.reply }}
        documents: ${{ jq([inputs.documents,sequence.review_notes.outputs.reply.documents],'add') }}
      transitions:
      - to: answer
        when: outputs.native.response.direction == 'reply'
      - to: done
        when: 'true'
    answer:
      include: ./agent.yaml
      inputs:
        prompt: |-
          {{ inputs.prompt }}
          Your last message: ${{ state_output('next_message','question',states.snapshot.outputs.form.request.question) }}
          The person replied: ${{ states.record.outputs.native.response.feedback }}
          Selected destination: ${{ states.record.outputs.native.response.settings.?return_to.orValue('auto') }}
          Read any attached comments in inbox/work/feedback/. An attachment may contain the whole request.
          ${{ inputs.instructions ? 'Answer a question in summary. Keep the displayed proposal while explaining it. Use replace to change the displayed proposal. Use repair only when the reply reveals a concrete local action the author can already take. For an instruction, identify the specific request and any scope change.' : 'For a question, use answer. Write the complete next prompt in summary, answering the question and asking for the decision still open. For a requested edit, use changes and the stage that owns it. If the selected destination conflicts with an edit, explain and ask what to change in summary. Answer any accompanying question when presenting the revision.' }}
        schema: >-
          ${{ inputs.instructions ? jq(inputs.schema,'.properties.status.enum += ["replace","repair"]') : jq(inputs.schema,'.properties.status.enum = ["answer","changes"]') }}
        documents: ${{ states.record.outputs.documents }}
        session: ${{ state_output('next_message','session',inputs.session) }}
        read_only: true
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: >-
          outputs.valid_response && (inputs.instructions
          ? (outputs.response.status in ['replace','repair'] || (outputs.response.status in ['ask','resume'] && outputs.response.?instruction.orValue(null) != null))
          : outputs.response.status == 'changes' && (states.record.outputs.native.response.settings.?return_to.orValue('auto') == 'auto'
          || outputs.response.?stage.orValue(null) == null || outputs.response.stage == states.record.outputs.native.response.settings.return_to))
        payload:
          interpretation: >-
            ${{ outputs.response.status == 'replace' ? jq(outputs.response,'.status = "ask"') : outputs.response.status == 'repair' ? jq(outputs.response,'.status = "resume"') : outputs.response }}
      - to: next_message
        when: 'true'
    next_message:
      inputs:
        snapshot: ${{ states.snapshot.outputs.form.request }}
        session: ${{ states.answer.outputs.session }}
        question: >-
          ${{ !states.answer.outputs.valid_response ? 'Could you rephrase that so I can act on it?' :
            states.answer.outputs.response.summary }}
        conflict: ${{ !inputs.instructions && states.answer.outputs.valid_response && states.answer.outputs.response.status == 'changes' }}
      sequence:
      - id: form
        include: ../review-v2.yaml
        inputs:
          request: ${{ jq([inputs.snapshot,inputs.question,inputs.conflict], '.[2] as $conflict | .[0] + {question:.[1]} | if $conflict then .directions |= map(select(.id == "reply")) else . end') }}
      outputs:
        form: ${{ sequence.form.outputs.form }}
        question: ${{ inputs.question }}
        session: ${{ inputs.session }}
      transitions:
      - to: ask
        when: 'true'
        payload:
          form: ${{ outputs.form }}
    done:
      sequence: []
      outputs:
        interpretation: ${{ transition.payload.?interpretation.orValue({}) }}
outputs:
  review_reply: ${{ states.record.outputs.review_reply }}
  interpretation: ${{ states.done.outputs.interpretation }}
  reply_artifacts: ${{ state_output('answer','artifacts',{}) }}
  session: ${{ state_output('answer','session',inputs.session) }}
  native: ${{ states.record.outputs.native }}
  documents: ${{ states.record.outputs.documents }}
  review_id: ${{ states.snapshot.outputs.form.request.review_id }}
  thread:
    review_id: ${{ states.snapshot.outputs.form.request.review_id }}
    revision: ${{ states.snapshot.outputs.form.request.revision }}
    presented: ${{ states.record.outputs.presented }}
    documents: ${{ inputs.request.documents }}
    document_metadata: ${{ inputs.request.?document_metadata.orValue({}) }}
    feedback_files: ${{ jq(states.record.outputs.documents,'with_entries(select(.key|startswith("feedback/")))') }}
vars:
  open_revision: |-
    .[1] as $previous | .[0] | .conversation = [] |
    if (.overview_document_id // "") == "" then del(.overview_document_id) else . end |
    .directions = ([{id:"reply",label:"Revise",feedback_mode:"required",allow_attachments:true,continues_review:true}] + .directions) |
    if $previous.review_id then
      .review_id = $previous.review_id | .revision = ($previous.revision + (if .documents == $previous.documents then 0 else 1 end))
    else .revision = 1 end
