id: adaptive3-review
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  documents: ${{ inputs.?documents.orValue({}) }}
  title: ${{ inputs.?title.orValue('') }}
  primary: ${{ inputs.?primary.orValue('') }}
  document_metadata: ${{ inputs.?document_metadata.orValue({}) }}
  validation: ${{ inputs.?validation.orValue({}) }}
  finding: ${{ inputs.?finding.orValue({}) }}
  review_reply: ${{ inputs.?review_reply.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  assessor: ${{ inputs.?assessor.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
  decision: ${{ inputs.?decision.orValue(inputs.purpose) }}
  threads: ${{ inputs.?threads.orValue({}) }}
state:
  initial: setup
  states:
    setup:
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/review.yaml
        inputs:
          purpose: ${{ inputs.purpose }}
          request: ${{ inputs.request }}
          validation: ${{ inputs.validation }}
          finding: ${{ inputs.finding }}
          review_reply: ${{ inputs.review_reply }}
          decision: ${{ inputs.decision }}
          title: ${{ inputs.title }}
      - id: policy
        include: ./review-policy.yaml
        inputs:
          stage: ${{ inputs.purpose }}
      outputs:
        schema: ${{ sequence.schemas.outputs.review }}
        text: ${{ sequence.prompts.outputs }}
        setting: ${{ sequence.policy.outputs.setting }}
      transitions:
      - to: done
        when: inputs.decision == 'direction' && inputs.validation.?status.orValue('') == 'passed' && inputs.finding.?amendment.orValue({}).?human.orValue({}).?receipt.hasValue()
        payload:
          result:
            status: accepted
            stage: direction
            summary: Applied the precise human-directed scope amendment after validation.
            receipt: ${{ inputs.finding.amendment.human.receipt }}
            human: ${{ inputs.finding.amendment.human }}
      - to: compare
        when: inputs.decision in ['merge','outcome'] && inputs.finding.?approval.orValue({}).?result.orValue({}).?receipt.hasValue()
          && inputs.finding.approval.?patch.orValue(null) != null
      - to: discuss
        when: inputs.decision in ['plan','direction','answer','merge','outcome','packages']
      - to: done
        when: inputs.validation.?status.orValue('') == 'passed' && inputs.purpose in ['direction','preparation','implementation','advice']
        payload:
          result: ${{ {'status':'accepted','stage':inputs.purpose,'summary':inputs.validation.summary} }}
      - to: assess
        when: 'true'
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        validation: ${{ inputs.validation }}
        finding: ${{ inputs.finding }}
        review_reply: ${{ inputs.review_reply }}
        decision: ${{ inputs.decision }}
        title: ${{ inputs.title }}
    assess:
      include: ./agent.yaml
      inputs:
        prompt: ${{ states.setup.outputs.text.task }}
        schema: ${{ states.setup.outputs.schema }}
        documents: ${{ jq([inputs.documents,inputs.review_reply.?documents.orValue({})],'add') }}
        session: ${{ inputs.assessor }}
        read_only: true
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.response }}
    discuss:
      include: ./discussion.yaml
      inputs:
        previous: ${{ inputs.threads[?inputs.decision].orValue({}) }}
        request: '${{ jq([{''title'':states.setup.outputs.text.title,''question'':states.setup.outputs.text.decision,''documents'':inputs.documents,''document_metadata'':inputs.document_metadata,''directions'':states.setup.outputs.text.directions,''feedback'':{''label'':states.setup.outputs.text.message},''settings'':[states.setup.outputs.setting],''conversation'':[]},inputs.primary],
          ''.[0] + (if .[1] != "" then {overview_document_id:.[1]} else {} end)'') }}'
        prompt: ${{ states.setup.outputs.text.task }}
        schema: >-
          ${{ inputs.decision == 'packages' ? jq(states.setup.outputs.schema, '.properties.stage.enum += ["packages"]') : states.setup.outputs.schema }}
        documents: ${{ inputs.documents }}
        session: ${{ inputs.session }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: outputs.native.response.direction == 'accept' || (inputs.decision == 'plan' && outputs.native.response.direction == 'accept_fully')
        payload:
          result:
            status: accepted
            summary: The human accepted this result.
            receipt: ${{ outputs.native.receipt }}
            human: ${{ outputs.native }}
            review_id: ${{ outputs.review_id }}
            revision: ${{ outputs.thread.revision }}
            reviewed_documents: ${{ inputs.documents }}
            conversation: ${{ outputs.conversation }}
      - to: done
        when: outputs.native.response.direction == 'decline'
        payload:
          result:
            status: changes
            summary: The human declined these tools. Find another approach.
            human: ${{ outputs.native }}
            documents: ${{ outputs.documents }}
            conversation: ${{ outputs.conversation }}
      - to: done
        when: outputs.interpretation.?status.orValue('') == 'changes'
        payload:
          result: >-
            ${{ jq(outputs, '. as $reply | .interpretation + {human:.native,documents,conversation,review_id}
            | if ($reply.native.response.settings.return_to // "auto") == "auto" then . else .stage = $reply.native.response.settings.return_to end') }}
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
    compare:
      include: ./compare-approval.yaml
      inputs:
        approval: ${{ inputs.finding.approval }}
      transitions:
      - to: done
        when: outputs.equivalent
        payload:
          result: ${{ inputs.finding.approval.result }}
      - to: discuss
        when: 'true'
outputs:
  threads: >-
    ${{ state_exists('discuss') ? jq([inputs.threads,{inputs.decision:states.discuss.outputs.thread}],'add') : inputs.threads }}
  review_reply: ${{ state_output('discuss','review_reply',inputs.review_reply) }}
  finding: >-
    ${{ state_exists('discuss') && states.done.outputs.result.status == 'changes'
      ? {'summary':states.done.outputs.result.summary} : states.done.outputs.result }}
  result: ${{ states.done.outputs.result }}
  session: ${{ state_output('discuss','session',inputs.session) }}
  assessor: ${{ state_output('assess','session',inputs.assessor) }}
