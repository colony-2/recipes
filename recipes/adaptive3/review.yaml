id: adaptive3-review
inputs:
  purpose: ${{ inputs.purpose }}
  question: ${{ inputs.?question.orValue('') }}
  delegate: ${{ inputs.?delegate.orValue({}) }}
  request: ${{ inputs.request }}
  documents: ${{ inputs.?documents.orValue({}) }}
  title: ${{ inputs.?title.orValue('') }}
  primary: ${{ inputs.?primary.orValue('') }}
  document_metadata: ${{ inputs.?document_metadata.orValue({}) }}
  validation: ${{ inputs.?validation.orValue({}) }}
  finding: ${{ inputs.?finding.orValue({}) }}
  review_reply: ${{ inputs.?review_reply.orValue({}) }}
  session: ${{ inputs.?session.orValue({}) }}
  assessor: ${{ inputs.?assessor.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
  decision: ${{ inputs.?decision.orValue(inputs.purpose) }}
  threads: ${{ inputs.?threads.orValue({}) }}
state:
  initial: setup
  states:
    setup:
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/review.yaml
        inputs:
          purpose: ${{ inputs.purpose }}
          request: ${{ inputs.request }}
          validation: ${{ inputs.validation }}
          finding: ${{ inputs.finding }}
          review_reply: ${{ inputs.review_reply }}
          decision: ${{ inputs.decision }}
          title: ${{ inputs.title }}
      - id: policy
        include: ./review-policy.yaml
        inputs:
          stage: ${{ inputs.purpose }}
      outputs:
        schema: ${{ sequence.schemas.outputs.review }}
        text: ${{ sequence.prompts.outputs }}
        setting: ${{ sequence.policy.outputs.setting }}
      transitions:
      - to: done
        when: inputs.decision == 'direction' && inputs.validation.?status.orValue('') == 'passed' && inputs.finding.?amendment.orValue({}).?human.orValue({}).?receipt.hasValue()
        payload:
          result:
            status: accepted
            stage: direction
            summary: Applied the precise human-directed scope amendment after validation.
            receipt: ${{ inputs.finding.amendment.human.receipt }}
            human: ${{ inputs.finding.amendment.human }}
      - to: compare
        when: inputs.decision in ['merge','outcome'] && inputs.finding.?approval.orValue({}).?result.orValue({}).?receipt.hasValue()
          && inputs.finding.approval.?patch.orValue(null) != null
      - to: reconsider
        when: vars.previous.?approval.hasValue() && inputs.decision in ['plan','merge','outcome','answer']
      - to: discuss
        when: inputs.decision in ['plan','direction','answer','merge','outcome','packages']
      - to: done
        when: inputs.validation.?status.orValue('') == 'passed' && inputs.purpose in ['direction','preparation','implementation','advice']
        payload:
          result: ${{ {'status':'accepted','stage':inputs.purpose,'summary':inputs.validation.summary} }}
      - to: assess
        when: 'true'
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        validation: ${{ inputs.validation }}
        finding: ${{ inputs.finding }}
        review_reply: ${{ inputs.review_reply }}
        decision: ${{ inputs.decision }}
        title: ${{ inputs.title }}
    assess:
      include: ./agent.yaml
      inputs:
        prompt: ${{ states.setup.outputs.text.task }}
        schema: ${{ states.setup.outputs.schema }}
        documents: ${{ jq([inputs.documents,inputs.review_reply.?documents.orValue({})],'add') }}
        session: ${{ inputs.assessor }}
        read_only: true
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.response }}
    reconsider:
      include: ./agent.yaml
      inputs:
        prompt: |-
          Act as the requester's delegate. The person already approved the attached prior version.
          Their decision and words: ${{ json_stringify(vars.previous.approval.human.response) }}
          Latest reply: ${{ json_stringify(inputs.review_reply.?submission.orValue({}).?response.orValue({})) }}
          Original request

          {{ inputs.request }}

          Proposed review: {{ inputs.question }}
          Compare prior/ with the current documents. A wording repair or equivalent check can proceed under the existing plan.
          Return covered only for a plan fully within the original decision. Preserve its completion choice.
          Return repair for a concrete local correction. Return ask for a new tradeoff or an outcome needing approval.
          In summary tell the author what to fix, or ask the person for the open decision. For a changed candidate awaiting merge, ask whether to merge.
          Explain the material difference from the last packet the person saw. Internal drafts can stay out of the message.
        documents: ${{ jq([vars.previous.documents,inputs.documents], '(.[0] | with_entries(.key = "prior/" + .key | .value.name = .key)) + .[1]') }}
        session: ${{ inputs.delegate }}
        read_only: true
        agent_settings: ${{ inputs.agent_settings }}
        schema:
          type: object
          additionalProperties: false
          properties:
            status: {type: string, enum: [covered, repair, ask]}
            summary: {type: string, minLength: 1}
          required: [status, summary]
      transitions:
      - to: done
        when: outputs.valid_response && inputs.decision == 'plan' && outputs.response.status == 'covered'
        payload:
          result: ${{ jq(vars.previous, '.approval + {status:"accepted",review_id,revision,reviewed_documents:.documents}') }}
      - to: done
        when: outputs.valid_response && outputs.response.status == 'repair'
        payload:
          result: ${{ {'status':'changes','stage':inputs.purpose,'source':'delegate','summary':outputs.response.summary} }}
      - to: discuss
        when: 'true'
    discuss:
      include: ./discussion.yaml
      inputs:
        previous: ${{ inputs.threads[?inputs.decision].orValue({}) }}
        request:
          title: ${{ states.setup.outputs.text.title }}
          question: >-
            ${{ state_output('reconsider','response',{}).?status.orValue('') == 'ask' ? states.reconsider.outputs.response.summary :
              nonempty(inputs.question) ? inputs.question : states.setup.outputs.text.decision }}
          overview_document_id: ${{ inputs.primary }}
          documents: ${{ inputs.documents }}
          document_metadata: ${{ inputs.document_metadata }}
          directions: ${{ states.setup.outputs.text.directions }}
          feedback: {label: '${{ states.setup.outputs.text.message }}'}
          settings: ${{ [states.setup.outputs.setting] }}
        prompt: ${{ states.setup.outputs.text.task }}
        schema: >-
          ${{ inputs.decision == 'packages' ? jq(states.setup.outputs.schema, '.properties.stage.enum += ["packages"]') : states.setup.outputs.schema }}
        documents: ${{ inputs.documents }}
        session: ${{ inputs.session }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: outputs.native.response.direction == 'accept' || (inputs.decision == 'plan' && outputs.native.response.direction == 'accept_fully')
        payload:
          result:
            status: accepted
            summary: The human accepted this result.
            receipt: ${{ outputs.native.receipt }}
            human: ${{ outputs.native }}
            review_id: ${{ outputs.review_id }}
            revision: ${{ outputs.thread.revision }}
            reviewed_documents: ${{ inputs.documents }}
      - to: done
        when: outputs.native.response.direction == 'decline'
        payload:
          result:
            status: changes
            summary: The human declined these tools. Find another approach.
            human: ${{ outputs.native }}
            documents: ${{ outputs.documents }}
      - to: done
        when: outputs.interpretation.?status.orValue('') == 'changes'
        payload:
          result: >-
            ${{ jq(outputs, '. as $reply | .interpretation + {human:.native,documents,review_id}
            | if ($reply.native.response.settings.return_to // "auto") == "auto" then . else .stage = $reply.native.response.settings.return_to end') }}
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
    compare:
      include: ./compare-approval.yaml
      inputs:
        approval: ${{ inputs.finding.approval }}
      transitions:
      - to: done
        when: outputs.equivalent
        payload:
          result: ${{ inputs.finding.approval.result }}
      - to: reconsider
        when: vars.previous.?approval.hasValue()
      - to: discuss
        when: 'true'
outputs:
  delegate: ${{ state_output('reconsider','session',inputs.delegate) }}
  threads: >-
    ${{ state_exists('discuss') ? jq([inputs.threads,inputs.decision,states.discuss.outputs.thread,states.done.outputs.result],vars.record_thread) : inputs.threads }}
  review_reply: ${{ state_output('discuss','review_reply',inputs.review_reply) }}
  finding: >-
    ${{ state_exists('discuss') && states.done.outputs.result.status == 'changes'
      ? {'source':'review reply','summary':states.done.outputs.result.summary} : states.done.outputs.result }}
  result: ${{ states.done.outputs.result }}
  session: ${{ state_output('discuss','session',inputs.session) }}
  assessor: ${{ state_output('assess','session',inputs.assessor) }}
vars:
  record_thread: |
    .[3] as $result | .[2] as $thread | .[1] as $decision | .[0] |
    .[$decision] = ($thread + (if $result.status == "accepted" then {approval:($result | {human,receipt,summary})} else {} end))
  previous: ${{ inputs.threads[?inputs.decision].orValue({}) }}
