id: adaptive3-resolver
inputs:
  stage: ${{ inputs.stage }}
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
state:
  initial: setup
  states:
    setup:
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/resolver.yaml
        inputs:
          stage: ${{ inputs.stage }}
          request: ${{ inputs.request }}
          problem: ${{ inputs.problem }}
          feedback: ${{ inputs.feedback }}
      outputs:
        schema: ${{ sequence.schemas.outputs.resolver }}
        text: ${{ sequence.prompts.outputs }}
      transitions:
      - to: investigate
        when: 'true'
      inputs:
        stage: ${{ inputs.stage }}
        request: ${{ inputs.request }}
        problem: ${{ inputs.problem }}
        documents: ${{ inputs.documents }}
        feedback: ${{ inputs.feedback }}
    investigate:
      include: ./agent.yaml
      inputs:
        prompt: ${{ states.setup.outputs.text.task }}
        schema: ${{ jq([states.setup.outputs.schema,vars.destinations[inputs.stage]], '.[1] as $stages | .[0] |
          .properties.stage.enum = $stages') }}
        documents: ${{ jq([inputs.documents,inputs.problem.?errors.orValue({})], 'add') }}
        read_only: true
      transitions:
      - to: done
        when: outputs.response.status == 'resume' && inputs.feedback.?status.orValue('') != 'resume'
        payload:
          result: ${{ outputs.response }}
      - to: ask
        when: 'true'
      catch:
      - when: failure.kind != 'cancellation'
        to: ask
        payload:
          problem: ${{ failure }}
    ask:
      id: ask
      op: input
      inputs:
        form:
          title: '${{ ''Continue '' + inputs.stage + '': '' + jq(inputs.request,''split("\n")[0] | .[:85]'') }}'
          fields:
          - id: decision
            type: multiple_choice
            question: '${{ transition.payload.?clarification.orValue('''') + (transition.payload.?clarification.orValue('''')
              == '''' ? '''' : ''\n'') + (state_exists(''answer'') ? states.answer.outputs.response.summary : state_output(''investigate'',''response'',inputs.problem).summary)
              }}'
            required: true
            options:
            - value: continue
              label: ${{ states.setup.outputs.text.continue }}
            - value: revise
              label: ${{ states.setup.outputs.text.discuss }}
          - id: feedback
            type: paragraph_text
            question: ${{ states.setup.outputs.text.message }}
            required: false
          - id: annotations
            type: file_upload
            question: ${{ states.setup.outputs.text.notes }}
            required: false
          kind: review
          documents: ${{ inputs.documents }}
      transitions:
      - to: ask
        when: outputs.fields.decision == 'revise' && !nonempty(outputs.fields.?feedback.orValue('')) && size(outputs.?artifact_refs.orValue({}))
          == 0
        payload:
          clarification: Enter a question or requested change, or attach notes, then confirm.
      - to: done
        when: outputs.fields.decision == 'continue'
        payload:
          result:
            status: resume
            stage: '${{ state_exists(''answer'') ? states.answer.outputs.response.?stage.orValue(inputs.stage) :
              state_output(''investigate'',''response'',{}).?stage.orValue(inputs.stage) }}'
            summary: '${{ state_exists(''answer'') ? states.answer.outputs.response.summary : state_output(''investigate'',''response'',inputs.problem).summary
              }}'
            human: ${{ outputs }}
            documents: ${{ jq(outputs.?artifact_refs.orValue({}), 'with_entries(.key = "feedback/" + .key | .value.name
              = .key)') }}
      - to: answer
        when: 'true'
    answer:
      inputs:
        stage: ${{ inputs.stage }}
        request: ${{ inputs.request }}
        problem: ${{ inputs.problem }}
        feedback: ${{ states.ask.outputs }}
        schema: ${{ jq([states.setup.outputs.schema,vars.destinations[inputs.stage]], '.[1] as $stages | .[0] |
          .properties.stage.enum = $stages') }}
        documents: ${{ jq([inputs.documents,jq(states.ask.outputs.?artifact_refs.orValue({}), 'with_entries(.key
          = "feedback/" + .key | .value.name = .key)')], 'add') }}
        session: ${{ state_output('answer','session',state_output('investigate','session',{})) }}
      sequence:
      - id: prompts
        include: ./prompts/resolver.yaml
        inputs:
          stage: ${{ inputs.stage }}
          request: ${{ inputs.request }}
          problem: ${{ inputs.problem }}
          feedback: ${{ inputs.feedback }}
      - id: agent
        include: ./agent.yaml
        inputs:
          prompt: ${{ sequence.prompts.outputs.task }}
          schema: ${{ inputs.schema }}
          documents: ${{ inputs.documents }}
          read_only: true
          session: ${{ inputs.session }}
      outputs:
        response: ${{ sequence.agent.outputs.response }}
        session: ${{ sequence.agent.outputs.session }}
      transitions:
      - to: ask
        when: 'true'
      catch:
      - when: failure.kind != 'cancellation'
        to: ask
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
outputs:
  result: ${{ states.done.outputs.result }}
vars:
  destinations:
    configure:
    - configure
    direction:
    - configure
    - direction
    preparation:
    - configure
    - direction
    - preparation
    implementation:
    - configure
    - direction
    - preparation
    - implementation
    outcome:
    - configure
    - direction
    - preparation
    - implementation
    - outcome
    integration:
    - configure
    - direction
    - preparation
    - implementation
    - outcome
    - integration
