id: adaptive3-merge-queue-intake
inputs:
  branch: ${{ inputs.branch }}
  policy: ${{ inputs.policy }}
  appends: ${{ inputs.appends }}
sequence:
- id: inspect
  op: ./recipes/merge-queue
  const: true
  inputs:
    action: intake
    request:
      branch: ${{ inputs.branch }}
      policy: ${{ inputs.policy }}
      appends: ${{ inputs.appends }}
      repository: ${{ context.git.repo }}
outputs:
  intake: ${{ sequence.inspect.outputs.result }}
  artifacts: ${{ sequence.inspect.artifacts }}
