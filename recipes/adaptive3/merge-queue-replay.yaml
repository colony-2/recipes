id: adaptive3-merge-queue-replay
inputs:
  base: ${{ inputs.base }}
  branch: ${{ inputs.?branch.orValue('main') }}
  contributions: ${{ inputs.contributions }}
sequence:
- id: replay
  op: ./recipes/merge-queue
  const: true
  artifacts:
    ./: ${{ jq(inputs.contributions,vars.paths) }}
  inputs:
    action: assemble
    request:
      base: ${{ inputs.base }}
      branch: ${{ inputs.branch }}
      repository: ${{ context.git.repo }}
      contributions: >-
        ${{ inputs.contributions.map(c,{'changeid':c.changeid,'base_hash':c.base_hash,'head_hash':c.head_hash,
          'repository':c.repository,'repair_base':c.?repair.orValue({}).?base.orValue('')}) }}
outputs:
  assembly: ${{ sequence.replay.outputs.result }}
  artifacts: ${{ sequence.replay.artifacts }}
vars:
  paths: |
    [(. // [])[] | .changeid as $id |
      {key:("contributions/"+$id+".bundle"),value:(.thinpack_ref + {name:("contributions/"+$id+".bundle")})},
      (select(.repair != null) | {key:("repairs/"+$id+".diff"),value:(.repair.patch + {name:("repairs/"+$id+".diff")})})] |
    from_entries
