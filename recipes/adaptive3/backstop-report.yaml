id: adaptive3-backstop-report
inputs:
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  response: ${{ inputs.response }}
  documents: ${{ inputs.?documents.orValue({}) }}
  document_metadata: ${{ inputs.?document_metadata.orValue({}) }}
  negotiations: ${{ inputs.?negotiations.orValue({}) }}
  valid: ${{ inputs.?valid.orValue(false) }}
# Structured review/v2 snapshots require stored producer references. Materialize
# the native text once before the existing form builder freezes its request schema.
sequence:
- id: persist
  op: command_execution
  const: true
  artifacts:
    report.md:
      kind: value
      name: report.md
      format: text
      value: >-
        ${{ jq([inputs.request,inputs.problem,inputs.response,inputs.valid ? inputs.documents : inputs.negotiations, context.workflow.job_id], vars.program) }}
  inputs:
    env:
      REPORT_INBOX: ${{ context.environment.op.inbox }}
      REPORT_OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      set -eu
      mkdir -p "$REPORT_OUTBOX/review"
      cp "$REPORT_INBOX/report.md" "$REPORT_OUTBOX/review/backstop-report.md"

outputs:
  primary: review/backstop-report.md
  documents: >-
    ${{ jq([inputs.valid ? inputs.documents : inputs.negotiations, {'review/backstop-report.md':sequence.persist.artifacts['review/backstop-report.md']}], 'add') }}
  document_metadata: >-
    ${{ jq([inputs.negotiations, inputs.valid ? inputs.document_metadata : {}], vars.metadata) }}
vars:
  metadata: |
    (.[0] | with_entries(.value = (if (.key | endswith("/report.md"))
       then {title:"Negotiation report",description:"Read the original request and decision.",role:"supporting",order:2}
       else {title:"Negotiation transcript",description:"Read the exact exchange.",role:"supporting",order:4} end))) +
    (.[1] | with_entries(if .value.role == "primary" then .value.role = "supporting" else . end)) +
    {"review/backstop-report.md":{title:"Backstop diagnosis and options",description:"Read why this job exists, completed work, the blocker and available choices.",role:"primary",order:0}}
  program: |
    .[0] as $request | .[1] as $p | .[2] as $r | .[3] as $files | .[4] as $job |
    def block: @html | gsub("\\["; "&#91;") | gsub("\\]"; "&#93;") | split("\n") | map("> " + .) | join("\n");
    "# Backstop diagnosis and options\n\n## Why this job exists\n\n" +
    (($r.report.origin // "Requester and rationale are not established in the available diagnosis. The original request follows.") | block) +
    "\n\nOriginal request:\n\n" + ($request | block) +
    "\n\n## Work completed and external effects\n\n" +
    (($r.report.work // "Completed work and external effects have not been established. Inspect the retained job results before repeating any effect.") | block) +
    "\n\n## Where work stopped\n\n" +
    (($r.report.blocker // $p.summary // "The failing boundary has not been established.") | block) +
    "\n\nCurrent diagnosis:\n\n" + (($r.summary // "The diagnosis agent was unavailable.") | block) +
    "\n\n## Available options\n\n" +
    (($r.report.options // ["Give instructions for a correction in this job; the destination must have its required inputs.", "Supply the missing evidence or external prerequisite described above.", "Use the manual job cancellation control if you want to stop. Backstop cannot cancel this job."]) |
    to_entries | map(((.key+1|tostring) + ". " + .value) | block) | join("\n\n")) +
    "\n\n## Recommendation\n\n" +
    (($r.report.recommendation // $r.action // "No executable recommendation is established. Give instructions or clarify the missing prerequisite.") | block) +
    "\n\n## Background and sources\n\n" +
    (($r.report.research // "No additional background research was established by the diagnosis.") | block) +
    "\n\nSource job: `" + $job + "`. Retained task results remain available through job inspection.\n\n" +
    ($files | keys | map(select(. != "review/backstop-report.md")) |
    map("- [Supporting evidence](" + (ltrimstr("review/") | split("/") | map(@uri) | join("/")) + ")") | join("\n")) + "\n"
