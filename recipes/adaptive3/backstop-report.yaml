id: adaptive3-backstop-report
inputs:
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  response: ${{ inputs.response }}
  documents: ${{ inputs.?documents.orValue({}) }}
  document_metadata: ${{ inputs.?document_metadata.orValue({}) }}
  negotiations: ${{ inputs.?negotiations.orValue({}) }}
  valid: ${{ inputs.?valid.orValue(false) }}
# Structured review/v2 snapshots require stored producer references. Materialize
# the native text once before the existing form builder freezes its request schema.
sequence:
- id: persist
  op: command_execution
  const: true
  artifacts:
    report.md:
      kind: value
      name: report.md
      format: text
      value: >-
        ${{ jq([inputs.request,inputs.problem,inputs.response,inputs.valid ? inputs.documents : inputs.negotiations, context.workflow.job_id], vars.program) }}
  inputs:
    env:
      REPORT_INBOX: ${{ context.environment.op.inbox }}
      REPORT_OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      set -eu
      mkdir -p "$REPORT_OUTBOX/review"
      cp "$REPORT_INBOX/report.md" "$REPORT_OUTBOX/review/backstop-report.md"

outputs:
  question: >-
    ${{ inputs.valid ? inputs.response.summary : jq(inputs.response.summary, vars.link_text) }}
  primary: review/backstop-report.md
  documents: >-
    ${{ jq([inputs.valid ? inputs.documents : inputs.negotiations, {'review/backstop-report.md':sequence.persist.artifacts['review/backstop-report.md']}], 'add') }}
  document_metadata: >-
    ${{ jq([inputs.negotiations, inputs.valid ? inputs.document_metadata : {}], vars.metadata) }}
vars:
  link_text: |-
    gsub("\\[(?<label>[^\\]]+)\\]\\([^)]*\\)"; .label)
  metadata: |
    (.[0] | with_entries(.value = (if (.key | endswith("/report.md"))
       then {title:"Negotiation report",description:"Read the request and the receiving cell’s response.",role:"supporting",order:2}
       else {title:"Negotiation transcript",description:"Read the exact exchange.",role:"supporting",order:4} end))) +
    (.[1] | with_entries(if .value.role == "primary" then .value.role = "supporting" else . end)) +
    {"review/backstop-report.md":{title:"Decision and options",description:"See what stopped, what you can do and the evidence.",role:"primary",order:0}}
  program: |
    .[0] as $request | .[1] as $p | .[2] as $r | .[3] as $files | .[4] as $job |
    def prose: @html | gsub("\\["; "&#91;") | gsub("\\]"; "&#93;");
    def section($heading; $text):
      if ($text // "") == "" then "" else "\n\n## " + $heading + "\n\n" + ($text | prose) end;
    ($r.report.blocker // $p.summary // $r.summary // "The worker stopped before identifying the cause.") as $blocker |
    "# What needs your decision\n\n" +
    ($blocker | prose) +
    section("Suggested next step"; $r.action // $r.report.recommendation) +
    "\n\n## Your options\n\n" +
    (($r.report.options // ["Reply with instructions or the missing evidence.", "Use the job’s cancellation control to stop."]) |
     map("1. " + (prose | gsub("\n"; "\n   "))) | join("\n")) +
    (if $r.summary == $blocker then "" else section("Latest update"; $r.summary) end) +
    section("Work already done"; $r.report.work) +
    section("Original request"; $request) +
    section("Request source"; $r.report.origin) +
    section("Supporting evidence"; $r.report.research) +
    "\n\nSource job: `" + $job + "`.\n\n" +
    ($files | keys | map(select(. != "review/backstop-report.md")) |
    map("- [Supporting evidence](" + (ltrimstr("review/") | split("/") | map(@uri) | join("/")) + ")") | join("\n")) + "\n"
