id: adaptive3-specialists
inputs:
  checkpoint: ${{ inputs.checkpoint }}
  settings: ${{ inputs.?settings.orValue({}) }}
  request: ${{ inputs.request }}
  documents: ${{ inputs.?documents.orValue({}) }}
  purpose: ${{ inputs.purpose }}
  guidance: ${{ inputs.?guidance.orValue('') }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  sessions: ${{ inputs.?sessions.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: next
  states:
    next:
      inputs:
        index: ${{ transition.payload.?index.orValue(0) }}
        sessions: ${{ transition.payload.?sessions.orValue(inputs.sessions) }}
        results: ${{ transition.payload.?results.orValue([]) }}
      sequence: []
      outputs:
        index: ${{ inputs.index }}
        sessions: ${{ inputs.sessions }}
        results: ${{ inputs.results }}
      transitions:
      - to: review
        when: outputs.index < size(vars.requests)
      - to: done
        when: 'true'
    review:
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        documents: ${{ inputs.documents }}
        guidance: ${{ inputs.guidance }}
        feedback: ${{ inputs.feedback }}
        specialist: ${{ vars.requests[states.next.outputs.index] }}
        session: ${{ states.next.outputs.sessions[?vars.requests[states.next.outputs.index].key].orValue({}) }}
        agent_settings: ${{ inputs.agent_settings }}
      sequence:
      - id: schemas
        include: ./schemas.yaml
      - id: prompts
        include: ./prompts/validate.yaml
        inputs:
          purpose: ${{ inputs.purpose }}
          request: ${{ inputs.request }}
          guidance: ${{ inputs.guidance }}
          feedback: ${{ inputs.feedback }}
          specialist: '${{ inputs.specialist.role + '': '' + inputs.specialist.request }}'
      - id: agent
        include: ./agent.yaml
        inputs:
          prompt: ${{ sequence.prompts.outputs.task }}
          schema: ${{ sequence.schemas.outputs.validate }}
          documents: ${{ inputs.documents }}
          read_only: true
          session: ${{ inputs.session }}
          agent_settings: ${{ inputs.agent_settings }}
      outputs:
        result: ${{ sequence.agent.outputs.response }}
        session: ${{ sequence.agent.outputs.session }}
      transitions:
      - to: next
        when: 'true'
        payload:
          index: ${{ states.next.outputs.index+1 }}
          results: ${{ states.next.outputs.results + [{'required':vars.requests[states.next.outputs.index].required,'result':outputs.result}] }}
          sessions: '${{ size(outputs.?session.orValue({}))>0 ? jq([states.next.outputs.sessions,{vars.requests[states.next.outputs.index].key:outputs.session}], ''add'') : states.next.outputs.sessions }}'
      catch:
      - when: failure.kind != 'cancellation'
        continue:
          outputs:
            result:
              status: changes
              summary: ${{ failure.message }}
              failure: ${{ json_parse(json_stringify(failure)) }}
    done:
      include: ./diagnostics.yaml
      inputs:
        directory: error/specialists
        failure: ${{ states.next.outputs.results }}
vars:
  requests: ${{ inputs.settings.?consultations.orValue([]).filter(c,c.checkpoint == inputs.checkpoint) }}
outputs:
  sessions: ${{ states.next.outputs.sessions }}
  result: ${{ {'status':states.next.outputs.results.all(r,!r.required || r.result.status == 'passed') ? 'passed':'changes','summary':jq(states.next.outputs.results.map(r,r.result.summary),
    'join("\n")'),'assessments':states.next.outputs.results} }}
  artifacts: ${{ states.done.outputs.documents }}
