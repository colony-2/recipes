id: adaptive3-merge-queue-prepare
inputs:
  commit: ${{ inputs.?commit.orValue(null) }}
  previous: ${{ inputs.?previous.orValue({}) }}
sequence:
- id: identify
  op: ./recipes/merge-queue
  const: true
  inputs:
    action: prepare
    request:
      base: ${{ context.git.execution.base_hash }}
      previous: ${{ inputs.previous }}
- id: describe
  when: sequence.identify.outputs.result.changed && !sequence.identify.outputs.result.existing
  include: ./commit-message.yaml
  inputs:
    commit: ${{ inputs.commit }}
    change_id: ${{ sequence.identify.outputs.result.changeid }}
- id: squash
  op: squash
  when: has(sequence[?'describe'].orValue({}).?outputs.orValue({}).?result.orValue({}).message)
  inputs:
    commit_message: ${{ sequence.describe.outputs.result.message }}
outputs:
  result: ${{ jq(sequence[?'describe'].orValue({}).?outputs.orValue({}).?result.orValue({'status':'passed'}),'del(.message)') }}
  candidate: >-
    ${{ has(sequence[?'squash'].orValue({}).?outputs.orValue({}).squashed_hash) ? {
      'changeid':sequence.identify.outputs.result.changeid,
      'base_hash':sequence.squash.outputs.squashed_commits.base_hash,
      'head_hash':sequence.squash.outputs.squashed_hash,
      'thinpack_ref':sequence.squash.artifacts['__git_state_thin_pack__']
    } : (sequence.identify.outputs.result.existing ? inputs.previous : {}) }}
