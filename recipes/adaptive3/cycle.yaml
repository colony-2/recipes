id: adaptive3-cycle
inputs:
  retry: ${{ inputs.?retry.orValue({}) }}
  merge_state: ${{ inputs.?merge_state.orValue({}) }}
  accepted: ${{ inputs.?accepted.orValue({}) }}
  recovery: ${{ inputs.?recovery.orValue(false) }}
  prior_publication: ${{ inputs.?prior_publication.orValue(null) }}
  merge_queue: ${{ inputs.?merge_queue.orValue(false) }}
  refresh: ${{ inputs.?refresh.orValue(false) }}
  plan: ${{ inputs.?plan.orValue({}) }}
  purpose: ${{ inputs.purpose }}
  contribution: ${{ inputs.?contribution.orValue({}) }}
  queue_history: ${{ inputs.?queue_history.orValue({}) }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  local_repair: ${{ inputs.?local_repair.orValue(false) }}
  finding: ${{ inputs.?finding.orValue({}) }}
  review_reply: ${{ inputs.?review_reply.orValue({}) }}
  threads: ${{ inputs.?threads.orValue({}) }}
  delegate: ${{ inputs.?delegate.orValue({}) }}
  presentation: ${{ inputs.?presentation.orValue({}) }}
  settings: ${{ inputs.?settings.orValue({}) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  session: ${{ inputs.?session.orValue({}) }}
  assessor: ${{ inputs.?assessor.orValue({}) }}
  specialists: ${{ inputs.?specialists.orValue({}) }}
  verification: ${{ inputs.?verification.orValue({}) }}
  approval: ${{ inputs.?approval.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial:
  - to: candidate
    when: inputs.purpose == 'outcome'
  - to: execute
    when: 'true'
  states:
    candidate:
      include: ./tools.yaml
      inputs:
        check: approved_change
      transitions:
      - to: execute
        when: 'true'
    execute:
      include: ./execute.yaml
      inputs:
        merge_state: ${{ inputs.merge_state }}
        accepted: ${{ inputs.accepted }}
        recovery: ${{ inputs.recovery }}
        prior_publication: ${{ inputs.prior_publication }}
        merge_queue: ${{ inputs.merge_queue }}
        refresh: ${{ inputs.refresh }}
        contribution: ${{ inputs.contribution }}
        verification: ${{ inputs.verification }}
        queue_history: ${{ inputs.queue_history }}
        require_verification: ${{ inputs.require_verification }}
        plan: ${{ inputs.plan }}
        withdrawal_sources: ${{ vars.withdrawal_sources }}
        history: >-
          ${{ inputs.threads[?vars.decision[?inputs.purpose].orValue(state_output('candidate','result',{}).?changed.orValue(false) ? 'merge' : 'outcome')].orValue({}).?presented.orValue({}) }}
        changed: ${{ state_output('candidate','result',{}).?changed.orValue(false) }}
        measurements: ${{ jq(state_output('candidate','artifacts',{}),'with_entries(select(.key == "error/change-counts.tsv"))') }}
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        local_repair: ${{ inputs.local_repair }}
        finding: ${{ inputs.finding }}
        review_reply: ${{ inputs.review_reply }}
        settings: ${{ inputs.settings }}
        session: ${{ inputs.session }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: children
        when: size(outputs.jobs)>0
      - to: confirm_withdrawal
        when: outputs.response.status == 'withdrawn' && size(vars.withdrawal_sources)>0
      - to: done
        when: inputs.purpose == 'implementation' && outputs.response.status == 'repair'
        payload:
          result: >-
            ${{ {'status':inputs.finding.?author_retry.orValue(false) ? 'stuck' : 'changes',
              'author_retry':true,'source':'implementation author','summary':outputs.response.summary,'errors':jq(outputs.artifacts,'with_entries(select(.key | startswith("error/")))')} }}
          documents: ${{ outputs.documents }}
          session: ${{ outputs.session }}
      - to: done
        when: inputs.purpose == 'implementation' && outputs.response.status == 'revise_plan'
        payload:
          result: ${{ {'status':'changes','stage':'preparation','summary':outputs.response.summary} }}
          documents: ${{ outputs.documents }}
          session: ${{ outputs.session }}
      - to: done
        when: inputs.purpose == 'integration' && outputs.response.status == 'ready'
        payload:
          result: ${{ jq([outputs.response,{'status':'accepted'}], 'add') }}
          documents: ${{ outputs.documents }}
          session: ${{ inputs.session }}
      - to: validate
        when: outputs.response.status == 'ready' || (inputs.purpose == 'preparation' && outputs.response.status == 'revise_plan')
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.response }}
          documents: ${{ outputs.documents }}
          session: ${{ outputs.session }}
    confirm_withdrawal:
      include: ./agent.yaml
      inputs:
        prompt: |-
          Act as the requester’s delegate. The author thinks this assignment was withdrawn.
          Assignment: {{ inputs.request }}
          Author: {{ states.execute.outputs.response.summary }}
          Recorded replies: ${{ json_stringify(vars.withdrawal_sources) }}
          Close only if a person's actual words explicitly withdraw this assignment. Check the original job.
          For a reply, verify its words and human submission in input history. For a cancellation, read its recorded reason.
          Continue if the source or scope is uncertain.
          Cancelling a child, declining an option or withdrawing only one sibling leaves other work open.
          Select the source index. State what was withdrawn and what remains unverified.
        session: ${{ inputs.delegate }}
        read_only: true
        agent_settings: ${{ inputs.agent_settings }}
        schema:
          type: object
          additionalProperties: false
          properties:
            status: {type: string, enum: [withdrawn, continue]}
            source: {type: integer, minimum: 0}
            summary: {type: string, minLength: 1}
          required: [status, source, summary]
      transitions:
      - to: done
        when: outputs.valid_response && outputs.response.status == 'withdrawn' && outputs.response.source < size(vars.withdrawal_sources)
        payload:
          result: ${{ {'status':'withdrawn','summary':outputs.response.summary,'source':vars.withdrawal_sources[outputs.response.source]} }}
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
      - to: done
        when: 'true'
        payload:
          result: ${{ {'status':'changes','summary':outputs.response.summary} }}
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
    validate:
      include: ./validate.yaml
      inputs:
        measured: >-
          ${{ state_exists('candidate') ? states.candidate.outputs : {} }}
        presentation: ${{ inputs.presentation }}
        merge_queue: ${{ inputs.merge_queue }}
        plan: ${{ inputs.plan }}
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ states.execute.outputs.documents }}
        settings: ${{ inputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        finding: ${{ inputs.finding }}
        review_reply: ${{ inputs.review_reply }}
        work: ${{ states.execute.outputs.response }}
        session: ${{ inputs.assessor }}
        specialists: ${{ inputs.specialists }}
        verification: ${{ inputs.verification }}
        approval: ${{ inputs.approval }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: outputs.result.status == 'approved_rebase'
        payload:
          result: ${{ jq([outputs.result,{'status':'accepted','approval_reused':true}], 'add') }}
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
      - to: confirm_coverage
        when: inputs.purpose == 'outcome' && outputs.result.status == 'covered' && inputs.plan.?human.orValue({}).?response.orValue({}).?direction.orValue('') == 'accept_fully' && inputs.plan.?receipt.hasValue()
      - to: review
        when: outputs.result.status == 'passed' || (inputs.purpose == 'outcome' && outputs.result.status == 'covered')
      - to: done
        when: 'true'
        payload:
          result: '${{ jq([jq([outputs.result,{''source'':outputs.?source.orValue(''validation''),''errors'':outputs.artifacts}], ''add''),states.execute.outputs.response.?publication.hasValue()
            ? {''publication'':states.execute.outputs.response.publication} : {}], ''add'') }}'
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
    confirm_coverage:
      id: confirm_coverage
      op: command_execution
      const: true
      inputs:
        env:
          AUTHORIZATION: ${{ json_stringify({'receipt':inputs.plan.receipt,'review_id':inputs.plan.review_id,'revision':inputs.plan.revision,'documents':inputs.plan.documents,'patch':states.validate.outputs.patch}) }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          proof = json.loads(os.environ['AUTHORIZATION'])
          execution = json.loads(subprocess.check_output(['c2j', 'self', '--json']))['execution']
          print(json.dumps({**proof, 'source_job': execution['job_id'], 'source_task': execution['task_id']}))
          PY
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ jq([json_parse(outputs.stdout),{'status':'accepted','authorization':'preparation','summary':states.validate.outputs.result.summary},jq(states.validate.outputs.result,'{post_merge_check} | with_entries(select(.value != null))')],'add | del(.documents,.patch)') }}
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
    review:
      include: ./review.yaml
      inputs:
        threads: ${{ inputs.threads }}
        delegate: ${{ inputs.delegate }}
        question: ${{ states.execute.outputs.response.summary }}
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        documents: ${{ states.execute.outputs.documents }}
        title: ${{ states.execute.outputs.response.?title.orValue('') }}
        primary: ${{ states.execute.outputs.response.?primary.orValue('') }}
        validation: ${{ states.validate.outputs.result }}
        document_metadata: ${{ states.validate.outputs.document_metadata }}
        session: ${{ states.execute.outputs.session }}
        assessor: ${{ states.validate.outputs.session }}
        review_reply: ${{ inputs.review_reply }}
        agent_settings: ${{ inputs.agent_settings }}
        finding: ${{ inputs.finding }}
        decision: '${{ inputs.purpose == ''direction'' && states.execute.outputs.response.?work_kind.orValue('''')
          == ''explanation'' ? ''answer'' : inputs.purpose == ''direction'' ? ''framing'' : inputs.purpose == ''preparation'' ? ''plan'' : inputs.purpose == ''outcome'' && states.validate.outputs.candidate.?changed.orValue(false)
          ? ''merge'' : inputs.purpose }}'
      transitions:
      - to: done
        when: 'true'
        payload:
          result: '${{ jq([outputs.result,jq(states.validate.outputs.result,''{post_merge_check} | with_entries(select(.value != null))''),states.execute.outputs.response.?publication.hasValue() ? {''publication'':states.execute.outputs.response.publication}
            : {}], ''add'') }}'
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ outputs.session }}
    done:
      inputs:
        result: ${{ transition.payload.result }}
        checkpoints: ${{ state_output('validate','checkpoints',[]) }}
        purpose: ${{ inputs.purpose }}
        previous_failure: ${{ inputs.finding.?failed_checks.orValue([]) }}
        retry: ${{ inputs.retry }}
        documents: ${{ transition.payload.documents }}
        session: ${{ transition.payload.session }}
      sequence:
      - id: progress
        include: ./retry.yaml
        inputs:
          previous: ${{ inputs.retry }}
          previous_failure: ${{ inputs.previous_failure }}
          failed: ${{ inputs.result.?failed_checks.orValue([]) }}
          receipt: >-
            ${{ inputs.result.?status.orValue('') == 'changes' ? inputs.result.?human.orValue({}).?receipt.orValue({}) : {} }}
          checkpoints: >-
            ${{ inputs.checkpoints + (inputs.result.status == 'accepted' ? ['phase/' + inputs.purpose] : []) }}
      outputs:
        repair: ${{ sequence.progress.outputs.change.repair }}
        retry: ${{ sequence.progress.outputs.change.retry }}
        result: ${{ inputs.result }}
        documents: ${{ inputs.documents }}
        session: ${{ inputs.session }}
    children:
      include: ./children.yaml
      inputs:
        jobs: ${{ states.execute.outputs.jobs }}
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ {'status':'children','summary':states.execute.outputs.response.summary,'children':outputs.results,'documents':outputs.documents}
            }}
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
    failed:
      inputs:
        failure: ${{ transition.payload.failure }}
        publication: ${{ state_output('execute','response',{}).?publication.orValue(null) }}
      sequence:
      - id: diagnostics
        include: ./diagnostics.yaml
        inputs:
          failure: ${{ inputs.failure }}
      outputs:
        result: '${{ jq([{''status'':''stuck'',''summary'':inputs.failure.message,''failure'':inputs.failure,''errors'':sequence.diagnostics.outputs.documents},inputs.publication
          != null ? {''publication'':inputs.publication} : {}],''add'') }}'
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.result }}
          documents: ${{ state_output('execute','documents',inputs.documents) }}
          session: ${{ state_output('execute','session',inputs.session) }}
outputs:
  presentation: >-
    ${{ size(state_output('validate','document_metadata',{})) > 0 ?
      {'documents':states.execute.outputs.documents,'document_metadata':states.validate.outputs.document_metadata} : inputs.presentation }}
  delegate: ${{ state_output('confirm_withdrawal','session',state_output('review','delegate',inputs.delegate)) }}
  threads: ${{ state_output('review','threads',inputs.threads) }}
  review_reply: ${{ state_output('review','review_reply',inputs.review_reply) }}
  finding: ${{ state_output('review','finding',states.done.outputs.result) }}
  repair: ${{ states.done.outputs.repair }}
  retry: ${{ states.done.outputs.retry }}
  merge_state: ${{ state_output('execute','merge_state',inputs.merge_state) }}
  result: >-
    ${{ states.done.outputs.result.status == 'stuck' && size(vars.withdrawal_sources)>0
      ? jq([states.done.outputs.result,{'withdrawal_sources':vars.withdrawal_sources}],'add') : states.done.outputs.result }}
  documents: ${{ states.done.outputs.documents }}
  session: '${{ size(states.done.outputs.session)>0 ? states.done.outputs.session : inputs.session }}'
  specialists: ${{ state_output('validate','specialists',inputs.specialists) }}
  verification: ${{ state_output('validate','verification',inputs.verification) }}
  assessor: ${{ state_output('review','assessor',state_output('validate','session',inputs.assessor)) }}
  work: ${{ state_output('execute','response',{}) }}
  patch: ${{ state_output('validate','patch',null) }}
  candidate: ${{ state_output('validate','candidate',{}) }}
vars:
  decision: {preparation: plan, direction: answer, advice: '', implementation: '', integration: ''}
  withdrawal_sources: >-
    ${{ jq([inputs.finding, inputs.review_reply.?submission.orValue({}), context.workflow.job_id],
    '.[0] as $finding | .[1] as $reply | .[2] as $job |
    [if $reply.receipt.actor.kind == "human" and ($reply.receipt.submission_id // "") != "" and ($reply.response.feedback // "") != ""
    then {job_id:$job, receipt:$reply.receipt, message:$reply.response.feedback} else empty end] +
    [(($finding.children // []) + [$finding.consultation.child // empty])[] |
    if .status == "cancelled" and (.message // "") != "" then {job_id,message}
    elif .review_reply then {job_id} + .review_reply
    elif .withdrawal.status == "withdrawn" and .withdrawal.source.job_id then .withdrawal.source else empty end]') }}
catch:
- when: failure.kind != 'cancellation'
  to: failed
  payload:
    failure: ${{ json_parse(json_stringify(failure)) }}
