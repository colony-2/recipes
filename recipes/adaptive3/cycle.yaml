id: adaptive3-cycle
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
  settings: ${{ inputs.?settings.orValue({}) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  session: ${{ inputs.?session.orValue({}) }}
  agent_settings: ${{ inputs.?agent_settings.orValue({}) }}
state:
  initial: execute
  states:
    execute:
      include: ./execute.yaml
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ inputs.documents }}
        feedback: ${{ inputs.feedback }}
        settings: ${{ inputs.settings }}
        session: ${{ inputs.session }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: children
        when: size(outputs.jobs)>0
      - to: validate
        when: outputs.response.status == 'ready'
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.response }}
          documents: ${{ outputs.documents }}
          session: ${{ outputs.session }}
    validate:
      include: ./validate.yaml
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ states.execute.outputs.documents }}
        settings: ${{ inputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        feedback: ${{ inputs.feedback }}
        work: ${{ states.execute.outputs.response }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: review
        when: outputs.result.status == 'passed'
      - to: done
        when: 'true'
        payload:
          result: '${{ jq([jq([outputs.result,{''errors'':outputs.artifacts}], ''add''),states.execute.outputs.response.?publication.hasValue()
            ? {''publication'':states.execute.outputs.response.publication} : {}], ''add'') }}'
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
    review:
      include: ./review.yaml
      inputs:
        purpose: ${{ inputs.purpose }}
        request: ${{ inputs.request }}
        documents: ${{ states.execute.outputs.documents }}
        title: ${{ states.execute.outputs.response.?title.orValue('') }}
        primary: ${{ states.execute.outputs.response.?primary.orValue('') }}
        validation: ${{ states.validate.outputs.result }}
        feedback: ${{ inputs.feedback }}
        agent_settings: ${{ inputs.agent_settings }}
      transitions:
      - to: done
        when: 'true'
        payload:
          result: '${{ jq([outputs.result,states.execute.outputs.response.?publication.hasValue() ? {''publication'':states.execute.outputs.response.publication}
            : {}], ''add'') }}'
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
    done:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
        documents: ${{ transition.payload.documents }}
        session: ${{ transition.payload.session }}
    children:
      include: ./children.yaml
      inputs:
        jobs: ${{ states.execute.outputs.jobs }}
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ {'status':'children','summary':states.execute.outputs.response.summary,'children':outputs.results,'documents':outputs.documents}
            }}
          documents: ${{ states.execute.outputs.documents }}
          session: ${{ states.execute.outputs.session }}
    failed:
      inputs:
        failure: ${{ transition.payload.failure }}
        publication: ${{ state_output('execute','response',{}).?publication.orValue(null) }}
      sequence:
      - id: diagnostics
        include: ./diagnostics.yaml
        inputs:
          failure: ${{ inputs.failure }}
      outputs:
        result: '${{ jq([{''status'':''stuck'',''summary'':inputs.failure.message,''failure'':inputs.failure,''errors'':sequence.diagnostics.outputs.documents},inputs.publication
          != null ? {''publication'':inputs.publication} : {}],''add'') }}'
      transitions:
      - to: done
        when: 'true'
        payload:
          result: ${{ outputs.result }}
          documents: ${{ state_output('execute','documents',inputs.documents) }}
          session: {}
outputs:
  result: ${{ states.done.outputs.result }}
  documents: ${{ states.done.outputs.documents }}
  session: ${{ states.done.outputs.session }}
  work: ${{ state_output('execute','response',{}) }}
  patch: ${{ state_output('validate','patch',null) }}
  candidate: ${{ state_output('validate','candidate',{}) }}
catch:
- when: failure.kind != 'cancellation'
  to: failed
  payload:
    failure: ${{ json_parse(json_stringify(failure)) }}
