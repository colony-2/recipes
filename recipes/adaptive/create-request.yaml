id: adaptive-create-request
version: 1.0.0
inputs:
  request: ${{ inputs.request }}
  target: ${{ inputs.target }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  create_recipe: ${{ inputs.create_recipe }}
  documents: ${{ inputs.documents }}
workspace:
  cell: ${{ inputs.root_cell }}
  ref: ${{ inputs.root_ref }}
sequence:
- id: prompts
  include: ./prompts.yaml
- id: submit_creation
  op: recipes.run
  inputs:
    recipes: '${{ [{''cell_name'': context.workspace.cell, ''git'': {''base_repo'': context.git.repo, ''base_ref'': context.git.ref,
      ''base_hash'': context.git.resolved_hash}, ''name'': inputs.create_recipe, ''inputs'': {''prompt'': sequence.prompts.outputs.children.creation
      + inputs.request.request, ''root_cell'': inputs.root_cell, ''root_ref'': inputs.root_ref, ''documents'': jq([inputs.documents,
      {''create-request.json'': {''kind'': ''value'', ''name'': ''create-request.json'', ''format'': ''json'', ''value'':
      {''request'': inputs.request, ''target'': inputs.target, ''requester_job'': context.workflow.job_id} } }], ''add'')}
      }] }}'
- id: await_creation
  op: recipe.await_result_soft
  inputs:
    target:
      job: ${{ sequence.submit_creation.outputs.job_ids[0] }}
    wait:
      'on': job
      condition: complete
    return_when: terminal
outputs:
  job: '${{ {''job_id'': sequence.submit_creation.outputs.job_ids[0], ''kind'': ''create'', ''cell'': inputs.root_cell,
    ''target'': inputs.target, ''status'': sequence.await_creation.outputs.status, ''result'': sequence.await_creation.outputs.outputs,
    ''failure'': sequence.await_creation.outputs.failure_message} }}'
  documents: ${{ sequence.await_creation.outputs.outputs.?artifact_refs.orValue({}) }}
