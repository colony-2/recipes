id: adaptive-specialists
inputs:
  flow: ${{ inputs.flow }}
  checkpoint: ${{ inputs.checkpoint }}
state:
  initial: start
  states:
    start:
      inputs:
        flow: ${{ inputs.flow }}
        checkpoint: ${{ inputs.checkpoint }}
      sequence: []
      outputs:
        flow: '${{ jq([inputs.flow, {''specialist_round'': int(inputs.flow.?specialist_round.orValue(0)) + 1}], ''add'') }}'
        items: ${{ inputs.flow.?hook_settings.orValue({}).?consultations.orValue([]).filter(c, c.checkpoint == inputs.checkpoint)
          }}
      transitions:
      - to: pick
        when: 'true'
        payload:
          flow: ${{ outputs.flow }}
          items: ${{ outputs.items }}
          index: 0
    pick:
      inputs:
        flow: ${{ transition.payload.flow }}
        items: ${{ transition.payload.items }}
        index: ${{ transition.payload.index }}
      sequence: []
      outputs:
        flow: ${{ inputs.flow }}
        items: ${{ inputs.items }}
        index: ${{ inputs.index }}
      transitions:
      - to: consult
        when: int(outputs.index) < size(outputs.items)
        payload:
          flow: ${{ outputs.flow }}
          items: ${{ outputs.items }}
          index: ${{ outputs.index }}
      - to: done
        when: 'true'
        payload:
          flow: ${{ outputs.flow }}
          passed: true
    consult:
      inputs:
        flow: ${{ transition.payload.flow }}
        items: ${{ transition.payload.items }}
        index: ${{ transition.payload.index }}
      vars:
        item: ${{ transition.payload.items[int(transition.payload.index)] }}
        thread: ${{ 'configured_' + transition.payload.items[int(transition.payload.index)].key + '_' + string(transition.payload.flow.specialist_round)
          }}
      sequence:
      - id: expert
        include: ./inspect.yaml
        inputs:
          role: assessment
          request: ${{ inputs.flow.request }}
          documents: ${{ inputs.flow.documents }}
          assignment: '${{ ''Checkpoint: '' + vars.item.checkpoint + ''. '' + vars.item.role + '': '' + vars.item.request }}'
          evidence: '${{ {''checkpoint'': vars.item.checkpoint, ''required'': vars.item.required} }}'
          guidance: ${{ inputs.flow.hook_settings.?prompt_additions.orValue({})[?inputs.items[int(inputs.index)].checkpoint].orValue('')
            }}
      - id: evidence
        include: ./document-bindings.yaml
        inputs:
          annotations: ${{ sequence.expert.outputs.annotations }}
          prefix: ${{ 'specialists/' + vars.item.key + '/' }}
          documents: ${{ sequence.expert.outputs.artifact_refs }}
      outputs:
        flow: '${{ jq([inputs.flow, {''documents'': jq([inputs.flow.documents, sequence.evidence.outputs.documents], ''add''),
          ''annotations'': inputs.flow.?annotations.orValue([]) + sequence.evidence.outputs.annotations, ''specialist_reviews'':
          jq([inputs.flow.?specialist_reviews.orValue({}), {vars.thread: {''key'': vars.item.key, ''checkpoint'': vars.item.checkpoint,
          ''required'': vars.item.required, ''outcome'': ''completed'', ''assessment'': sequence.expert.outputs.response.verdict}
          }], ''add'')}], ''add'') }}'
        unresolved: false
        passed: ${{ !vars.item.required || sequence.expert.outputs.approved }}
        items: ${{ inputs.items }}
        index: ${{ int(inputs.index) + 1 }}
      transitions:
      - to: invalid
        when: outputs.unresolved
      - to: done
        when: '!outputs.passed'
        payload:
          flow: '${{ jq([outputs.flow, {''message'': ''A required specialist requested revision. Read the specialist findings
            and revise the current deliverable; agreement on findings is not approval.''}], ''add | del(.reuse_merge_approval)'')
            }}'
          passed: false
      - to: pick
        when: 'true'
        payload:
          flow: ${{ outputs.flow }}
          items: ${{ outputs.items }}
          index: ${{ outputs.index }}
    done:
      inputs:
        flow: ${{ transition.payload.flow }}
        passed: ${{ transition.payload.passed }}
      sequence: []
      outputs:
        flow: ${{ inputs.flow }}
        passed: ${{ inputs.passed }}
    invalid:
      id: invalid
      op: command_execution
      inputs:
        run: echo "Specialist consultation did not resolve; inspect its transcript" >&2; exit 1
outputs:
  flow: ${{ states.done.outputs.flow }}
  passed: ${{ states.done.outputs.passed }}
