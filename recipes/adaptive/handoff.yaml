id: adaptive-handoff
inputs:
  directory: ${{ inputs.directory }}
  documents: ${{ inputs.documents }}
sequence: []
outputs:
  valid: ${{ nonempty(inputs.directory) && inputs.directory.endsWith('/') && !inputs.directory.startsWith('/') &&
    !inputs.directory.contains('\\') && !inputs.directory.matches('(^|/)[.][.]?(/|$)') && (inputs.directory +
    'handoff.md') in inputs.documents && inputs.documents.all(k,!k.startsWith(inputs.directory) ||
    (!k.contains('\\') && !k.matches('(^|/)[.][.]?(/|$)'))) }}
  documents: ${{ jq({'directory':inputs.directory,'documents':inputs.documents}, '. as $v | .documents |
    with_entries(select(.key | startswith($v.directory)) | .key = (.key | ltrimstr($v.directory)) | .value.name =
    .key)') }}
