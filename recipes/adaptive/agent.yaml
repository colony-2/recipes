id: adaptive-agent
version: 1.0.0
inputs:
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.target_directory }}
  phase: ${{ inputs.phase }}
  assignment: ${{ inputs.?assignment.orValue('') }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.?documents.orValue({}) }}
  evidence_documents: ${{ inputs.?evidence_documents.orValue({}) }}
  guidance: ${{ inputs.?guidance.orValue('') }}
  retained_artifacts: ${{ inputs.?retained_artifacts.orValue({}) }}
vars:
  schema:
    type: object
    additionalProperties: false
    required:
    - next
    - summary
    - files
    - questions
    - consultations
    - keys
    properties:
      next:
        type: string
        enum:
        - continue
        - review
        - ask_user
        - consult
        - submit
        - blocked
        - redesign
        - outside
      summary:
        type: string
        minLength: 1
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - path
          - description
          properties:
            path:
              type: string
              minLength: 1
            description:
              type: string
              minLength: 1
            title: {}
            role: {}
            order: {}
            source_paths: {}
      questions:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          - type
          - question
          - required
          - options
          properties:
            id:
              type: string
              minLength: 1
            type:
              type: string
              enum:
              - paragraph_text
              - short_answer
              - multiple_choice
              - checkboxes
            question:
              type: string
              minLength: 1
            required:
              type: boolean
            options:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - value
                - label
                properties:
                  value:
                    type: string
                  label:
                    type: string
      consultations:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - key
          - kind
          - cell
          - ref
          - request
          - role
          properties:
            key:
              type: string
              pattern: ^[a-zA-Z0-9_-]+$
            kind:
              type: string
              enum:
              - feature
              - create
            cell:
              type: string
            ref:
              type: string
            request:
              type: string
              minLength: 1
            role:
              type: string
              minLength: 1
      keys:
        type: array
        items:
          type: string
          minLength: 1
sequence:
- id: prompts
  include: ./prompts.yaml
  inputs:
    request: ${{ inputs.request }}
    target_directory: ${{ inputs.target_directory }}
    phase: "${{ inputs.assignment == '' ? inputs.phase : inputs.assignment }}"
    guidance: ${{ inputs.guidance }}
- id: documents
  include: ./task-documents.yaml
  inputs:
    documents: ${{ inputs.documents }}
    evidence: ${{ inputs.evidence_documents }}
- id: turn
  include: ./agent-turn.yaml
  inputs:
    prompt: ${{ sequence.prompts.outputs.agent.task }}
    instructions: ${{ sequence.prompts.outputs.agent.instructions }}
    schema: ${{ vars.schema }}
    session: ${{ inputs.session }}
    documents: ${{ sequence.documents.outputs.documents }}
    read_only: ${{ inputs.phase != 'implement' || inputs.assignment == 'repair' }}
    retained_artifacts: ${{ inputs.retained_artifacts }}
    evidence_documents: ${{ sequence.documents.outputs.evidence }}
outputs:
  turn: ${{ sequence.turn.outputs }}
