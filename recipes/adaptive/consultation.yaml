schema_version: 2
id: adaptive-consultation
version: 0.1.0
input_schema:
  thread:
    type: string
    default_value: ''
  request:
    type: string
    default_value: ''
  consultant_cell:
    type: string
    default_value: ''
  consultant_role:
    type: string
    default_value: ''
  consultant_ref:
    type: string
    default_value: main
  requester_session:
    type: checkpoint
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  max_iterations:
    type: number
    default_value: 4
  continuation:
    type: artifact
    required: false
  direction:
    type: string
    default_value: ''
    description: Explicit expert direction authorizing a new bounded round of a saved unresolved thread.
  annotations:
    type: array
    default_value: []
    items:
      type: object
      properties:
        id:
          type: string
          required: true
        ref:
          type: artifact
          required: true
        descriptor:
          type: object
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ref:
                type: artifact
  depth:
    type: number
    default_value: 0
inputs:
  annotations: ${{ inputs.annotations }}
  thread: ${{ inputs.thread }}
  request: ${{ inputs.request }}
  consultant: "${{ {'cell': inputs.consultant_cell, 'role': inputs.consultant_role, 'ref': inputs.consultant_ref} }}"
  requester_session: ${{ inputs.?requester_session.orValue({}) }}
  documents: ${{ inputs.documents }}
  max_iterations: ${{ inputs.max_iterations }}
  continuation: ${{ inputs.?continuation.orValue(null) }}
  direction: ${{ inputs.direction }}
  depth: ${{ inputs.depth }}
state:
  initial: prompts
  states:
    prompts:
      include: ./prompts.yaml
      transitions:
      - to: restore_consultation_transcript
        when: inputs.continuation != null
      - to: start
        when: true
    restore_consultation_transcript:
      id: restore_consultation_transcript
      op: command_execution
      const: true
      artifacts:
        conversation.json: ${{ inputs.continuation }}
      inputs:
        env:
          INBOX: ${{ context.environment.op.inbox }}
        run: |
          cat "$INBOX/conversation.json"
      transitions:
      - to: start
        when: true
    start:
      inputs:
        annotations: ${{ inputs.annotations }}
        request: ${{ inputs.request }}
        consultant: ${{ inputs.consultant }}
        requester_session: ${{ inputs.requester_session }}
        documents: ${{ inputs.documents }}
        max_iterations: ${{ inputs.max_iterations }}
        continuation: ${{ json_parse(state_output('restore_consultation_transcript', 'stdout', '{}')) }}
        direction: ${{ inputs.direction }}
        cell: ${{ context.workspace.cell }}
        topic: ${{ inputs.thread }}
        thread: ${{ context.workflow.job_id + '/' + inputs.thread }}
        depth: ${{ inputs.depth }}
      sequence: []
      outputs:
        valid: |-
          ${{ inputs.max_iterations >= 1 && inputs.max_iterations == int(inputs.max_iterations)
              && inputs.documents.all(k, k == inputs.documents[k].name
                   && !(k in ['conversation.json', '__git_state_thin_pack__',
                              'diff_from_parent.diff', 'diff_from_base.diff']))
              && (size(inputs.continuation) == 0
                  ? nonempty(inputs.topic) && nonempty(inputs.request) && nonempty(inputs.consultant.?role.orValue(''))
                  : inputs.continuation.requester_cell == inputs.cell
                    && (inputs.direction == ''
                        || inputs.continuation.outcome in ['needs_review', 'declined', 'redirected'])) }}
        conversation: |-
          ${{ size(inputs.continuation) == 0
              ? {'exchange_number':0,'depth': inputs.depth, 'thread': inputs.thread,
                 'request': inputs.request,
                 'consultant': jq([{'cell': '', 'ref': 'main'}, inputs.consultant], 'add'),
                 'requester_cell': inputs.cell,
                 'requester_start_session': inputs.requester_session,
                 'requester_session': inputs.requester_session, 'consultant_session': {},
                 'iteration': 0, 'round_iterations': 0, 'round': 1,
                 'max_iterations': int(inputs.max_iterations),
                 'next': 'consultant', 'outcome': 'continue',
                 'message': inputs.request, 'direction': '',
                 'seen': {'requester': 0, 'consultant': 0},
                 'annotations': inputs.annotations, 'documents': inputs.documents, 'final_artifacts': {},
                 'transcript': [{'participant': 'requester', 'iteration': 1,
                   'thinking': inputs.request, 'files': inputs.documents}]}
              : inputs.direction == ''
                ? (inputs.continuation.outcome == 'failed' && inputs.continuation.?retryable.orValue(false)
                    ? jq([inputs.continuation, {'outcome': 'continue', 'error': ''}], 'add')
                    : inputs.continuation)
              : jq([inputs.continuation,
                    {'requester_session': size(inputs.requester_session) > 0
                        ? inputs.requester_session : inputs.continuation.requester_session,
                     'direction': inputs.direction,
                     'round': int(inputs.continuation.round) + 1,
                     'round_iterations': 0, 'max_iterations': int(inputs.max_iterations),
                     'next': 'requester', 'outcome': 'continue',
                     'annotations': inputs.continuation.?annotations.orValue([]) + inputs.annotations, 'documents': jq([inputs.continuation.documents, inputs.documents], 'add'),
                     'transcript': inputs.continuation.transcript + [
                       {'participant': 'expert', 'thinking': inputs.direction, 'files': inputs.documents}]}], 'add') }}
      transitions:
      - to: invalid
        when: '!outputs.valid'
      - to: current
        when: true
    current:
      inputs:
        negotiated: ${{ state_output('record', 'conversation', states.start.outputs.conversation) }}
        reviewed: ${{ state_output('expert_record', 'conversation', states.start.outputs.conversation) }}
        nested: ${{ state_output('downstream','conversation',{}) }}
      sequence: []
      outputs:
        conversation: |-
          ${{ size(inputs.nested) > 0 && int(inputs.nested.?exchange_number.orValue(0)) >= int(inputs.negotiated.?exchange_number.orValue(0)) && int(inputs.nested.round) >= int(inputs.reviewed.round) ? inputs.nested : int(inputs.reviewed.round) > int(inputs.negotiated.round) ? inputs.reviewed : inputs.negotiated }}
      transitions:
      - to: recovery
        when: outputs.conversation.outcome == 'recovery'
      - to: turn
        when: outputs.conversation.outcome == 'continue'
      - to: publish
        when: true
    turn:
      inputs:
        conversation: ${{ states.current.outputs.conversation }}
      sequence:
      - id: prompts
        include: ./prompts.yaml
        inputs:
          request: ${{ inputs.conversation.request }}
          participant: ${{ inputs.conversation.next }}
          thread: ${{ inputs.conversation.thread }}
          consultant_role: ${{ inputs.conversation.consultant.role }}
          reply_directory: ${{ 'iter' + string(int(inputs.conversation.iteration) + 1) + '/' + inputs.conversation.next
            + '/' }}
          message: ${{ inputs.conversation.message }}
          direction: "${{ inputs.conversation.direction != '' && int(inputs.conversation.?seen.orValue({'requester': 0, 'consultant':
            0})[inputs.conversation.next]) < int(inputs.conversation.round) ? inputs.conversation.direction : '' }}"
      - inputs:
          conversation: ${{ inputs.conversation }}
          prompt: ${{ sequence.prompts.outputs.consultation.task }}
          instructions: |-
            {{ sequence.prompts.outputs.consultation.instructions }}

            {{ sequence.prompts.outputs.consultation.setup }}
        vars:
          prefix: ${{ 'iter' + string(int(inputs.conversation.iteration) + 1) + '/' + inputs.conversation.next + '/' }}
          session: |-
            ${{ inputs.conversation.next == 'consultant'
                ? inputs.conversation.consultant_session : inputs.conversation.requester_session }}
          schema:
            type: object
            additionalProperties: false
            required:
            - outcome
            - thinking
            - files
            properties:
              outcome:
                type: string
                enum: |-
                  ${{ inputs.conversation.next == 'consultant'
                      ? ['continue', 'agreed', 'declined', 'redirected', 'needs_review']
                      : ['continue', 'needs_review', 'cancelled'] }}
              thinking:
                type: string
                minLength: 1
                description: Concise response and shareable explanation, including questions and remaining
                  disagreements.
              files:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - path
                  - description
                  properties:
                    path:
                      type: string
                      minLength: 1
                    description:
                      type: string
                      minLength: 1
                    title: {}
                    role: {}
                    order: {}
                    source_paths: {}
              requests:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - cell
                  - request
                  properties:
                    cell:
                      type: string
                      minLength: 1
                    request:
                      type: string
                      minLength: 1
                    ref:
                      type: string
                    role:
                      type: string
              review_title:
                type: string
          started: "${{ int(inputs.conversation.?seen.orValue({'requester': 0, 'consultant': 0})[inputs.conversation.next])
            > 0 }}"
        state:
          initial:
          - to: foreign
            when: inputs.conversation.next == 'consultant' && inputs.conversation.consultant.cell != ''
          - to: local
            when: true
          states:
            foreign:
              workspace:
                cell: ${{ inputs.conversation.consultant.cell }}
                ref: ${{ state_output('repair', 'base_hash', inputs.conversation.consultant.ref) }}
              include: ./agent-turn.yaml
              inputs:
                prompt: "${{ state_exists('repair') ? states.repair.outputs.prompt : inputs.prompt }}"
                instructions: ${{ inputs.instructions }}
                schema: ${{ vars.schema }}
                session: ${{ state_output('repair', 'session', vars.session) }}
                documents: ${{ state_output('repair', 'documents', inputs.conversation.documents) }}
                retained_artifacts: ${{ state_output('repair', 'artifacts', {}) }}
              transitions:
              - to: collect
                when: true
            local:
              include: ./agent-turn.yaml
              inputs:
                prompt: "${{ state_exists('repair') ? states.repair.outputs.prompt : inputs.prompt }}"
                instructions: ${{ inputs.instructions }}
                schema: ${{ vars.schema }}
                session: ${{ state_output('repair', 'session', vars.session) }}
                documents: ${{ state_output('repair', 'documents', inputs.conversation.documents) }}
                retained_artifacts: ${{ state_output('repair', 'artifacts', {}) }}
              transitions:
              - to: collect
                when: true
            collect:
              inputs:
                turn: "${{ state_exists('foreign') ? states.foreign.outputs : states.local.outputs }}"
                prefix: ${{ vars.prefix }}
                allowed: ${{ vars.schema.properties.outcome.enum }}
              sequence: []
              outputs:
                turn: ${{ inputs.turn }}
                valid: |-
                  ${{ size(inputs.turn.?issues.orValue([])) == 0 && inputs.turn.result.?status.orValue('failed') == 'completed'
                      && inputs.turn.result.?session.orValue(null) != null
                      && inputs.turn.result.?output_schema_valid.orValue(false)
                      && size(inputs.turn.jobs.?job_ids.orValue([])) == 0
                      && (size(inputs.turn.result.response.?requests.orValue([])) == 0 || inputs.turn.result.response.outcome in ['continue','needs_review']) && inputs.turn.result.response.outcome in inputs.allowed
                      && (inputs.turn.result.response.outcome != 'needs_review' || nonempty(inputs.turn.result.response.?review_title.orValue('')))
                                        && inputs.turn.result.response.files.all(f,
                           f.path.startsWith(inputs.prefix)
                           && !f.path.contains('\\') && !f.path.contains('/../') && !f.path.endsWith('/..')
                           && !f.path.contains('/./') && !f.path.endsWith('/.')
                           && !f.path.contains('//') && !f.path.endsWith('/')
                           && f.path in inputs.turn.artifacts)
                      && size(inputs.turn.result.response.files.map(f, f.path))
                           == size(jq(inputs.turn.result.response.files, 'map(.path) | unique')) }}
                issues: "${{ inputs.turn.?issues.orValue([]) + ['Return a completed response with a session checkpoint. List
                  each artifact once, using the current reply prefix ' + inputs.prefix + '. Only the consultant may declare
                  agreement. Do not submit jobs during consultation.']  + (inputs.turn.result.?response.orValue({}).?outcome.orValue('')
                  == 'needs_review' && !nonempty(inputs.turn.result.response.?review_title.orValue('')) ? ['Name the actual
                  human decision in review_title.'] : []) }}"
              transitions:
              - to: repair
                when: "!outputs.valid && outputs.turn.result.?status.orValue('failed') == 'completed' && size(outputs.turn.jobs.?job_ids.orValue([]))
                  == 0"
            repair:
              include: ./response-repair.yaml
              inputs:
                turn: ${{ states.collect.outputs.turn }}
                issues: ${{ states.collect.outputs.issues }}
                documents: ${{ state_output('repair', 'documents', inputs.conversation.documents) }}
                session: ${{ state_output('repair', 'session', vars.session) }}
                attempts: ${{ state_output('repair', 'attempts', 0) }}
              transitions:
              - to: abandoned
                when: '!outputs.retry'
              - to: foreign
                when: inputs.conversation.next == 'consultant' && inputs.conversation.consultant.cell != ''
              - to: local
                when: true
            abandoned:
              sequence: []
        outputs:
          valid: ${{ states.collect.outputs.valid }}
          turn: "${{ jq([states.collect.outputs.turn, state_exists('repair') ? {'repair_documents': states.repair.outputs.documents}
            : {}, state_exists('abandoned') ? {'repair_cancelled': true, 'artifacts': states.repair.outputs.artifacts} : {}],
            'add') }}"
        id: exchange
      outputs:
        valid: ${{ sequence.exchange.outputs.valid }}
        turn: ${{ sequence.exchange.outputs.turn }}
      transitions:
      - to: record
        when: outputs.valid
      - to: failed
        when: true
    record:
      inputs:
        previous: ${{ states.current.outputs.conversation }}
        turn: ${{ states.turn.outputs.turn }}
      sequence:
      - id: resolve
        inputs:
          previous: ${{ inputs.previous }}
          turn: ${{ inputs.turn }}
          depth: ${{ inputs.previous.?depth.orValue(0) }}
        sequence: []
        outputs:
          files: |-
            ${{ jq({'files': inputs.turn.result.response.files, 'artifacts': inputs.turn.artifacts},
                   '. as $v | $v.files | map({key: .path, value: $v.artifacts[.path]}) | from_entries') }}
          outcome: |-
            ${{ size(inputs.turn.result.response.?requests.orValue([])) > 0 ? (inputs.depth < 4 ? 'continue' : 'recovery') : inputs.turn.result.response.outcome == 'continue' && inputs.previous.next == 'consultant' && int(inputs.previous.round_iterations) + 1 >= int(inputs.previous.max_iterations) ? 'recovery' : inputs.turn.result.response.outcome }}
      outputs:
        conversation: |-
          ${{ jq([inputs.previous,
                {'exchange_number':int(inputs.previous.?exchange_number.orValue(0))+1,'review_title':inputs.turn.result.response.?review_title.orValue(''), 'review_documents':sequence.resolve.outputs.files,'outcome': sequence.resolve.outputs.outcome,
                 'message': inputs.turn.result.response.thinking,
                           'assessment': inputs.previous.next == 'consultant' ? inputs.turn.result.response.?assessment.orValue('') : '',
                 'seen': jq([inputs.previous.?seen.orValue({'requester': 0, 'consultant': 0}),
                             {inputs.previous.next: int(inputs.previous.round)}], 'add'),
                 'annotations': inputs.previous.?annotations.orValue([]) + inputs.turn.?annotations.orValue([]),
                 'next': inputs.previous.next == 'consultant' ? 'requester' : 'consultant',
                 'iteration': int(inputs.previous.iteration) + (inputs.previous.next == 'consultant' ? 1 : 0),
                 'round_iterations': int(inputs.previous.round_iterations) + (inputs.previous.next == 'consultant' ? 1 : 0),
                 'requester_session': inputs.previous.next == 'requester'
                    ? inputs.turn.result.session : inputs.previous.requester_session,
                 'consultant_session': inputs.previous.next == 'consultant'
                    ? inputs.turn.result.session : inputs.previous.consultant_session,
                 'consultant': inputs.previous.next == 'consultant' && inputs.previous.consultant.cell != ''
                    ? jq([inputs.previous.consultant, {'ref': inputs.turn.base_hash}], 'add')
                    : inputs.previous.consultant,
                 'documents': jq([inputs.previous.documents, sequence.resolve.outputs.files], 'add'),
                 'final_artifacts': sequence.resolve.outputs.outcome == 'continue' ? {} : sequence.resolve.outputs.files,
                 'transcript': inputs.previous.transcript + [
                   {'participant': inputs.previous.next,
                    'iteration': int(inputs.previous.iteration) + 1,
                    'outcome': inputs.turn.result.response.outcome,
                    'thinking': inputs.turn.result.response.thinking,
                    'files': inputs.turn.result.response.files,
                    'annotations': inputs.turn.?annotations.orValue([]), 'artifacts': sequence.resolve.outputs.files}]}], 'add') }}
      transitions:
      - to: downstream
        when: size(states.turn.outputs.turn.result.response.?requests.orValue([])) > 0 && inputs.depth < 4
      - to: current
        when: true
    failed:
      inputs:
        previous: ${{ states.current.outputs.conversation }}
        turn: ${{ states.turn.outputs.turn }}
      sequence: []
      outputs:
        conversation: |-
          ${{ jq([inputs.previous, {
           'outcome': inputs.turn.?repair_cancelled.orValue(false) ? 'cancelled' : 'failed',
           'retryable': !inputs.turn.?repair_cancelled.orValue(false),
           'requester_session': inputs.previous.next == 'requester' ? inputs.turn.?checkpoint.orValue(inputs.previous.requester_session) : inputs.previous.requester_session,
           'consultant_session': inputs.previous.next == 'consultant' ? inputs.turn.?checkpoint.orValue(inputs.previous.consultant_session) : inputs.previous.consultant_session,
           'documents': jq([inputs.previous.documents, inputs.turn.documents, inputs.turn.?repair_documents.orValue({})], 'add'),
           'pending_response': inputs.turn.result.?response.orValue({}),
           'error': inputs.turn.?repair_cancelled.orValue(false) ? 'Result correction cancelled by the reviewer; no agreement accepted.' : inputs.turn.result.?errorMessage.orValue('Consultation turn did not complete; no agreement accepted.')
           }], 'add') }}
      transitions:
      - to: recovery_failed
        when: true
    invalid:
      inputs:
        previous: |-
          ${{ inputs.continuation == null ? states.start.outputs.conversation
              : json_parse(states.restore_consultation_transcript.outputs.stdout) }}
      sequence: []
      outputs:
        conversation: |-
          ${{ jq([inputs.previous, {'outcome': 'failed', 'retryable': false,
                 'error': 'Invalid request, documents, iteration limit, requester workspace, or expert-directed continuation.'}], 'add') }}
      transitions:
      - to: publish
        when: true
    publish:
      inputs:
        conversation: |-
          ${{ state_output('invalid', 'conversation', state_output('failed', 'conversation',
              state_output('current', 'conversation', states.start.outputs.conversation))) }}
      sequence:
      - id: publish_consultation_transcript
        op: command_execution
        const: true
        inputs:
          env:
            INBOX: ${{ context.environment.op.inbox }}
            OUTBOX: ${{ context.environment.op.outbox }}
          run: |
            cp "$INBOX/conversation.json" "$OUTBOX/conversation.json"
        artifacts:
          conversation.json:
            kind: value
            name: conversation.json
            format: json
            value: ${{ inputs.conversation }}
      outputs:
        conversation: ${{ inputs.conversation }}
        transcript: ${{ sequence.publish_consultation_transcript.artifacts['conversation.json'] }}
      transitions:
      - to: report
        when: outputs.conversation.outcome == 'needs_review'
    report:
      inputs:
        conversation: ${{ states.publish.outputs.conversation }}
        transcript: ${{ states.publish.outputs.transcript }}
      sequence: []
      outputs:
        error: ''
        summary: {}
        review:
          documents: ${{ inputs.conversation.review_documents }}
          form:
            fields:
            - id: direction
              type: paragraph_text
              question: ${{ inputs.conversation.message }}
              required: true
      transitions:
      - to: request_consultation_direction
        when: states.publish.outputs.conversation.outcome == 'needs_review'
    request_consultation_direction:
      id: request_consultation_direction
      include: ./review.yaml
      inputs:
        title: ${{ states.publish.outputs.conversation.review_title }}
        documents: ${{ states.publish.outputs.conversation.documents }}
        fields: ${{ states.report.outputs.review.form.fields }}
        annotations: ${{ states.publish.outputs.conversation.?annotations.orValue([]) }}
        overview: "${{ size(states.publish.outputs.conversation.review_documents.filter(k,k == 'review.md' || k.endsWith('/review.md')))
          > 0 ? states.publish.outputs.conversation.review_documents.filter(k,k == 'review.md' || k.endsWith('/review.md'))[0]
          : 'review.md' }}"
        summary: ${{ states.publish.outputs.conversation.message }}
        brief: "${{ size(states.publish.outputs.conversation.review_documents.filter(k,k == 'review.md' || k.endsWith('/review.md')))
          > 0 ? states.publish.outputs.conversation.review_documents[states.publish.outputs.conversation.review_documents.filter(k,k
          == 'review.md' || k.endsWith('/review.md'))[0]] : null }}"
      transitions:
      - to: expert_record
        when: true
    expert_record:
      inputs:
        previous: ${{ states.publish.outputs.conversation }}
        response: ${{ states.request_consultation_direction.outputs.response }}
        review: ${{ states.request_consultation_direction.outputs.documents }}
        direction: ${{ states.request_consultation_direction.outputs.response.fields.direction }}
      sequence: []
      outputs:
        conversation: |-
          ${{ jq([inputs.previous,
                 {'outcome': 'continue', 'next': 'requester',
                  'round': int(inputs.previous.round) + 1, 'round_iterations': 0,
                  'direction': inputs.direction,
                  'documents': jq([inputs.previous.documents, inputs.review, inputs.response.?artifact_refs.orValue({})], 'add'),
                  'transcript': inputs.previous.transcript + [
                    {'participant': 'expert', 'thinking': inputs.direction,
                     'fields': inputs.response.fields, 'review': inputs.review,
                     'receipt': inputs.response.?receipt.orValue({}),
                     'files': inputs.response.?artifact_refs.orValue({})}]}], 'add') }}
      transitions:
      - to: current
        when: true
    downstream:
      workspace:
        cell: "${{ states.current.outputs.conversation.next == 'consultant' ? states.current.outputs.conversation.consultant.cell
          : states.current.outputs.conversation.requester_cell }}"
        ref: "${{ states.current.outputs.conversation.next == 'consultant' ? states.current.outputs.conversation.consultant.ref
          : context.git.ref }}"
      inputs:
        conversation: ${{ states.record.outputs.conversation }}
        participant: ${{ states.current.outputs.conversation.next }}
        requests: ${{ states.turn.outputs.turn.result.response.requests }}
        depth: ${{ inputs.depth }}
      sequence:
      - id: consult_owners
        op: recipes.run_and_wait
        inputs:
          wait:
            condition: success
            "on": goal
          recipes: |-
            ${{ jq({'requests':inputs.requests,'depth':inputs.depth,'documents':inputs.conversation.documents,'cell':context.workspace.cell,'repo':context.git.repo,'ref':context.git.ref,'hash':context.git.resolved_hash,'thread':inputs.conversation.thread,'iteration':inputs.conversation.iteration}, '. as $v | .requests | to_entries | map({cell_name:$v.cell,name:"git+https://github.com/colony-2/recipes.git//recipes/adaptive/consultation.yaml@main",git:{base_repo:$v.repo,base_ref:$v.ref,base_hash:$v.hash},inputs:{thread:($v.thread + "/downstream-" + ($v.iteration|tostring) + "-" + (.key|tostring)),request:.value.request,consultant_cell:.value.cell,consultant_ref:(.value.ref//"main"),consultant_role:(.value.role//"Owning cell: clarify the requested contract"),documents:$v.documents,depth:($v.depth+1)} })') }}
      outputs:
        conversation: |-
          ${{ jq([inputs.conversation, {'outcome':'continue','next':inputs.participant,'message':'Read the downstream consultation results in inbox and continue the original agreement. These are advice, not proof of implemented work.','documents':jq([inputs.conversation.documents, jq(sequence.consult_owners.outputs.outputs, vars.documents_query)], 'add')}], 'add') }}
      transitions:
      - to: current
        when: true
      vars:
        documents_query: |
          to_entries | map(.key as $i | .value as $result | "downstream/"+($i|tostring)+"/" as $prefix | [($result.outputs.final_artifacts // {} | to_entries | map({key:($prefix+.key),value:(.value + {name:($prefix+.key)})}) | from_entries),{($prefix+"outcome.md"):{kind:"value",name:($prefix+"outcome.md"),format:"text",value:("Outcome: "+($result.outputs.outcome//"unknown")+"\n"+($result.outputs.summary//"Read the supplied agreement."))} }] | add) | add // {}
    recovery:
      include: ./operational-failure.yaml
      inputs:
        reason: Consultation reached its bounded execution limit. Inspect the retained conversation and resume the
          responsible goal; a bound is not a product decision.
        documents: ${{ states.current.outputs.conversation.documents }}
    recovery_failed:
      include: ./operational-failure.yaml
      inputs:
        reason: ${{ states.failed.outputs.conversation.error }}
        documents: ${{ states.failed.outputs.conversation.documents }}
outputs:
  annotations: "${{ jq({'annotations': states.publish.outputs.conversation.?annotations.orValue([]), 'documents': states.publish.outputs.conversation.final_artifacts},
    '. as $v | [(.annotations // [])[] | select(.id as $id | $v.documents | has($id))]') }}"
  outcome: ${{ states.publish.outputs.conversation.outcome }}
  requester_session: ${{ states.publish.outputs.conversation.requester_session }}
  consultant_session: ${{ states.publish.outputs.conversation.consultant_session }}
  requester_start_session: ${{ states.publish.outputs.conversation.requester_start_session }}
  continuation: ${{ states.publish.outputs.transcript }}
  state: ${{ states.publish.outputs.conversation }}
  artifacts: ${{ states.publish.outputs.conversation.documents }}
  transcript: ${{ states.publish.outputs.transcript }}
  final_artifacts: ${{ states.publish.outputs.conversation.final_artifacts }}
  summary: ${{ states.publish.outputs.conversation.message }}
  review: "${{ state_exists('request_consultation_direction') ? jq([state_output('report', 'review', {}), {'documents':states.request_consultation_direction.outputs.documents}],
