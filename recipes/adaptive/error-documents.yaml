id: adaptive-error-documents
inputs:
  summary: ${{ inputs.summary }}
  artifacts: ${{ inputs.?artifacts.orValue({}) }}
  name: ${{ inputs.?name.orValue('failure.md') }}
sequence: []
outputs:
  documents: "${{ jq([inputs.artifacts, {inputs.name: {'kind':'value','name':'failure.md','format':'text','value':inputs.summary}
    }], vars.bindings) }}"
vars:
  bindings: |
    add | to_entries | map(
      .key = ("error/" + (if (.key|startswith("_c2j/execution/")) then (.key|ltrimstr("_c2j/execution/"))
        else (.key|ltrimstr("error/")) end)) | .value.name = .key) | from_entries
