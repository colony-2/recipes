id: adaptive-error-documents
inputs:
  summary: ${{ inputs.summary }}
  artifacts: ${{ inputs.?artifacts.orValue({}) }}
  failure: ${{ inputs.?failure.orValue({}) }}
  name: ${{ inputs.?name.orValue('failure.md') }}
  directory: ${{ inputs.?directory.orValue('error') }}
sequence: []
outputs:
  documents: ${{ jq(inputs, vars.bindings) }}
vars:
  # Each source keeps its complete relative path. Number diagnostic sets to
  # retain distinct logs with the same name in nested/wrapped failures.
  bindings: |
    def files($prefix): to_entries | map(
      select(.key != "__git_state_thin_pack__" and .key != "diff_from_parent.diff" and .key != "diff_from_base.diff")
      | .key = ($prefix + .key) | .value.name = .key);
    . as $input |
    [{key: (.directory + "/summary/" + .name), value: {
      kind: "value", name: (.directory + "/summary/" + .name), format: "text", value: .summary}}]
    + (.artifacts | files($input.directory + "/files/"))
    + ([.failure | .. | objects | (.diagnostics?, .artifacts?) | select(type == "object" and length > 0)]
       | unique | to_entries | map(
         . as $set | .value | files($input.directory + "/diagnostics/" + ($set.key|tostring) + "/")) | add // [])
    | from_entries
