id: adaptive-resolve-target
version: 1.0.0
inputs:
  cell: ${{ inputs.cell }}
  ref: ${{ inputs.ref }}
sequence:
- id: attempt
  inputs:
    cell: ${{ inputs.cell }}
    ref: ${{ inputs.ref }}
  sequence:
  - id: inspect
    workspace:
      cell: ${{ inputs.cell }}
      ref: ${{ inputs.ref }}
    inputs:
      cell: ${{ inputs.cell }}
      ref: ${{ inputs.ref }}
    sequence:
    - id: probe_target
      op: command_execution
      const: true
      inputs:
        # c2j resolves the registered repository and ref using its Git transport.
        run: git rev-parse HEAD
    outputs:
      target:
        cell: ${{ inputs.cell }}
        repo: ${{ context.git.repo }}
        ref: ${{ inputs.ref }}
        state: ready
        revision: ${{ jq(sequence.probe_target.outputs.stdout, 'split("\n")[0]') }}
        detail: ''
  outputs:
    target: ${{ sequence.inspect.outputs.target }}
  # Catch outside the workspace boundary, including failures during entry.
  catch:
  - when: failure.kind != 'cancellation'
    continue:
      outputs:
        target:
          cell: ${{ inputs.cell }}
          repo: ''
          ref: ${{ inputs.ref }}
          state: unknown
          detail: ${{ failure.message }}
outputs:
  target: ${{ sequence.attempt.outputs.target }}
