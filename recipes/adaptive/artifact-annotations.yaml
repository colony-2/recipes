id: adaptive-artifact-annotations
inputs:
  result: ${{ inputs.result }}
  artifacts: ${{ inputs.artifacts }}
  bound_inputs: ${{ inputs.?bound_inputs.orValue({}) }}
sequence:
- id: inventory
  inputs:
    result: ${{ inputs.result }}
    artifacts: ${{ inputs.artifacts }}
  sequence: []
  outputs:
    files: "${{ jq({'files': inputs.result.?response.orValue({}).?files.orValue([]), 'artifacts': inputs.artifacts}, vars.declared_files)
      }}"
- id: associate
  inputs:
    files: ${{ sequence.inventory.outputs.files }}
    available: "${{ jq({'files': sequence.inventory.outputs.files, 'artifacts': inputs.artifacts, 'bound': inputs.bound_inputs},
      vars.available_documents) }}"
    artifacts: ${{ inputs.artifacts }}
  sequence: []
  outputs:
    annotations: |-
      ${{ inputs.files.map(file, {
        'id': file.path,
        'lineage': [file.path],
        'origin': context.workflow.job_id + '/' + context.invocation.hash,
        'ref': inputs.artifacts[file.path],
        'descriptor': file,
        'sources': jq(file, vars.source_paths).map(path, {
          'requested': path,
          'match': path_match(path, jq(inputs.available, 'keys'))
        })
      }) }}
    available: ${{ inputs.available }}
outputs:
  annotations: |-
    ${{ jq({
      'annotations': sequence.associate.outputs.annotations,
      'documents': sequence.associate.outputs.available
    }, vars.resolve_sources) }}
vars:
  declared_files: |
    . as $context |
    [.files[]? |
     select(type == "object" and (.path | type == "string")) |
     select(.path as $path | $context.artifacts | has($path))]
  available_documents: |
    . as $context |
    .bound + (.files | map({key: .path, value: $context.artifacts[.path]}) | from_entries)
  source_paths: |
    if (.source_paths | type) == "array"
    then [.source_paths[] | select(type == "string")]
    else [] end
  resolve_sources: |
    .documents as $documents |
    .annotations | map(
      .sources |= map(
        if .match.status == "matched" then {
          id: .match.path,
          lineage: [.match.path],
          ref: $documents[.match.path]
        } else {
          requested: .requested,
          issue: .match.status
        } end
      )
    )
