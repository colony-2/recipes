id: adaptive-develop
version: 1.0.0
inputs:
  annotations: ${{ inputs.?annotations.orValue([]) }}
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  session: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  prior_rebase_repairs: ${{ inputs.?prior_rebase_repairs.orValue(0) }}
  prior_merge_chases: ${{ inputs.?prior_merge_chases.orValue(0) }}
  prior_dependencies: ${{ inputs.?prior_dependencies.orValue({}) }}
  prior_consultations: ${{ inputs.?prior_consultations.orValue({}) }}
  settings_artifact: ${{ inputs.?settings_artifact.orValue(null) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  design_required: ${{ inputs.design_required }}
  max_iterations: ${{ inputs.max_iterations }}
  prompt_additions: ${{ inputs.?prompt_additions.orValue({}) }}
  consultations: ${{ inputs.?consultations.orValue([]) }}
state:
  initial: prompts
  states:
    prompts:
      include: ./prompts.yaml
      transitions:
      - to: discover_root_cell
        when: true
    discover_root_cell:
      id: discover_root_cell
      op: command_execution
      const: true
      inputs:
        run: |
          if [ -f .c2/config.yaml ] && command -v c2j >/dev/null 2>&1; then
            c2j self --json
          else
            printf '{}'
          fi
      transitions:
      - to: start
        when: true
    start:
      inputs:
        documents: ${{ jq([json_parse(json_stringify(context.artifacts)), inputs.documents], 'add | with_entries(select(.key
          != "__git_state_thin_pack__" and .key != "diff_from_parent.diff" and .key != "diff_from_base.diff"))') }}
        root_cell: '${{ inputs.root_cell != '''' ? inputs.root_cell : json_parse(states.discover_root_cell.outputs.stdout).?root_repo.orValue('''')
          }}'
        root_ref: '${{ inputs.root_ref != '''' ? inputs.root_ref : json_parse(states.discover_root_cell.outputs.stdout).?root_ref.orValue(''main'')
          }}'
      sequence:
      - id: rebase_policy
        include: ./rebase-policy.yaml
        inputs: {}
      outputs:
        documents: ${{ inputs.documents }}
        root_cell: ${{ inputs.root_cell }}
        root_ref: ${{ inputs.root_ref }}
        rebase_policy: ${{ sequence.rebase_policy.outputs.predicate }}
      transitions:
      - to: reject_invalid_build_request
        when: '!nonempty(inputs.target_directory) || inputs.target_directory.startsWith(''/'') || inputs.target_directory.matches(''(^|/)[.][.](/|$)'')'
        payload:
          reason: Target directory must be a nonempty repository-relative path without parent traversal.
      - to: design_context
        when: inputs.design_required
        payload:
          phase: design
          documents: ${{ outputs.documents }}
      - to: dispatch
        when: true
        payload:
          phase: test-plan
          documents: ${{ outputs.documents }}
    dispatch:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.?annotations.orValue(inputs.annotations) }}
        phase: ${{ transition.payload.?phase.orValue(state_output('dispatch','phase',inputs.design_required ? 'design':'test-plan'))
          }}
        session: ${{ transition.payload.?session.orValue(state_output('record','session',inputs.session)) }}
        assignment: ${{ transition.payload.?assignment.orValue('') }}
        evidence_documents: ${{ transition.payload.?evidence_documents.orValue({}) }}
        retained_artifacts: ${{ transition.payload.?retained_artifacts.orValue({}) }}
        base_documents: ${{ transition.payload.?base_documents.orValue(transition.payload.documents) }}
        repair_attempts: ${{ transition.payload.?repair_attempts.orValue(0) }}
      sequence: []
      outputs:
        phase: ${{ inputs.phase }}
        session: ${{ inputs.session }}
        documents: ${{ jq(inputs.documents, 'with_entries(select((.key|startswith("error/")|not)))') }}
        annotations: ${{ inputs.annotations }}
        assignment: ${{ inputs.assignment }}
        evidence_documents: ${{ inputs.evidence_documents }}
        retained_artifacts: ${{ inputs.retained_artifacts }}
        base_documents: ${{ inputs.base_documents }}
        repair_attempts: ${{ inputs.repair_attempts }}
      transitions:
      - to: iteration_limit
        when: '(state_exists(''work'') ? size(states.work.runs) + 1 : 0) >= int(inputs.max_iterations) * (1 + (state_exists(''iteration_limit'')
          ? size(states.iteration_limit.runs) + 1 : 0))'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: work
        when: true
    work:
      inputs:
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        guidance: ${{ inputs.prompt_additions[?{'design':'design','test-plan':'test_plan','implement':'implementation'}[states.dispatch.outputs.phase]].orValue('')
          }}
        phase: ${{ states.dispatch.outputs.phase }}
        session: ${{ states.dispatch.outputs.session }}
        assignment: ${{ states.dispatch.outputs.assignment }}
        documents: ${{ states.dispatch.outputs.documents }}
        evidence_documents: ${{ states.dispatch.outputs.evidence_documents }}
        retained_artifacts: ${{ states.dispatch.outputs.retained_artifacts }}
      sequence:
      - id: agent
        include: ./agent.yaml
        inputs:
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          phase: ${{ inputs.phase }}
          session: ${{ inputs.session }}
          assignment: ${{ inputs.assignment }}
          documents: ${{ inputs.documents }}
          evidence_documents: ${{ inputs.evidence_documents }}
          retained_artifacts: ${{ inputs.retained_artifacts }}
          guidance: ${{ inputs.guidance }}
      - id: children
        include: ./validation-jobs.yaml
        inputs:
          jobs: ${{ sequence.agent.outputs.turn.jobs }}
          allowed: ${{ inputs.phase == 'implement' && inputs.assignment != 'repair' }}
      outputs:
        turn: ${{ sequence.agent.outputs.turn }}
        documents: ${{ jq([inputs.documents,sequence.children.outputs.documents], 'add') }}
        children_failed: ${{ sequence.children.outputs.failed }}
      transitions:
      - to: record
        when: true
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') && states.dispatch.outputs.evidence_documents.exists(k,
          failure.message.contains('"' + k + '"'))
        to: dispatch
        payload:
          documents: ${{ states.dispatch.outputs.documents }}
          annotations: ${{ states.dispatch.outputs.annotations }}
          evidence_documents: '${{ {''error/artifact-binding.md'': {''kind'':''value'',''name'':''error/artifact-binding.md'',''format'':''text'',''value'':failure.message
            + ''\nThe evidence could not be read. Repair or rerun the producing check; missing evidence is not success.''}
            } }}'
    record:
      inputs:
        turn: ${{ states.work.outputs.turn }}
        plan_keys: ${{ state_output('record','plan_keys',[]) }}
        session: ${{ states.dispatch.outputs.session }}
        assignment: ${{ states.dispatch.outputs.assignment }}
        base_documents: ${{ states.dispatch.outputs.base_documents }}
        documents: ${{ states.work.outputs.documents }}
        annotations: ${{ states.dispatch.outputs.annotations }}
        phase: ${{ states.dispatch.outputs.phase }}
      sequence: []
      outputs:
        issues: ${{ vars.issues }}
        session: ${{ inputs.turn.result.?session.orValue(inputs.session) }}
        documents: '${{ inputs.turn.result.?output_schema_valid.orValue(false) ? (jq([inputs.assignment == ''repair''
          ? inputs.base_documents : inputs.documents, jq({''files'':inputs.turn.result.?response.orValue({}).?files.orValue([]),''artifacts'':inputs.turn.artifacts},
          ''. as $v | $v.files | map(select(.path as $p | $v.artifacts | has($p)) | {key:.path,value:$v.artifacts[.path]})
          | from_entries'')], ''add'')) : inputs.documents }}'
        annotations: ${{ inputs.annotations + inputs.turn.?annotations.orValue([]) }}
        plan_keys: '${{ inputs.turn.result.?output_schema_valid.orValue(false) && inputs.turn.result.?response.orValue({}).?next.orValue('''')
          == ''review'' ? (inputs.phase in [''design'',''test-plan''] ? inputs.turn.result.response.keys : jq([inputs.plan_keys,inputs.turn.result.response.keys],
          ''add | unique'')) : inputs.plan_keys }}'
      vars:
        issues: |-
          ${{ (states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'ask_user' ? [] : states.work.outputs.turn.?issues.orValue([]))
           + (states.work.outputs.turn.result.?status.orValue('failed') != 'completed' ? ['Agent did not complete: ' + states.work.outputs.turn.result.?errorMessage.orValue('No completed response.')] : [])
           + (!states.work.outputs.turn.result.?output_schema_valid.orValue(false) ? ['The operation did not produce a schema-valid response. Correct the response using the supplied schema.'] : [])
           + (states.work.outputs.turn.result.?session.orValue(null) == null ? ['The response has no resumable session checkpoint.'] : [])
           + (size(states.work.outputs.turn.jobs.?job_ids.orValue([])) > 0 && (states.dispatch.outputs.phase != 'implement' || states.dispatch.outputs.assignment == 'repair') ? ['The agent submitted jobs directly; stop and review these effects before continuing.'] : [])
           + (states.work.outputs.turn.result.?status.orValue('failed') == 'completed' && states.work.outputs.turn.result.?output_schema_valid.orValue(false) ?
              (states.work.outputs.turn.result.response.next != 'ask_user' && states.work.outputs.turn.result.response.?files.orValue([]).exists(f, f.path.startsWith('/') || f.path.contains('..') || f.path.contains('\\') || f.path in ['__git_state_thin_pack__']) ? ['Select only safe deliverable artifact names, excluding workflow control files.'] : [])
            + (states.work.outputs.turn.result.response.next != 'ask_user' && size(states.work.outputs.turn.result.response.?files.orValue([]).map(f, f.path)) != size(jq(states.work.outputs.turn.result.response.?files.orValue([]), 'map(.path) | unique')) ? ['List each resolved artifact only once.'] : [])
            + (states.work.outputs.turn.result.response.next == 'review' && !states.work.outputs.turn.result.response.?files.orValue([]).exists(f, f.path == {'design': 'design.md', 'test-plan': 'test-statements.md', 'implement': 'implementation.md'}[states.dispatch.outputs.phase]) ? ['Review requires ' + {'design': 'design.md', 'test-plan': 'test-statements.md', 'implement': 'implementation.md'}[states.dispatch.outputs.phase] + ' in the returned files.'] : [])
            + (states.work.outputs.turn.result.response.next == 'ask_user' && (size(states.work.outputs.turn.result.response.questions) == 0 || states.work.outputs.turn.result.response.questions.exists(q, q.id == 'annotations')) ? ['ask_user requires focused questions; annotations is a reserved question id.'] : [])
            + (states.work.outputs.turn.result.response.next == 'consult' && size(states.work.outputs.turn.result.response.consultations) == 0 ? ['consult requires at least one consultation request.'] : [])
            + (states.work.outputs.turn.result.response.next == 'submit' && size(states.work.outputs.turn.result.response.keys) == 0 ? ['submit requires explicit prerequisite keys.'] : [])
           : []) + (states.dispatch.outputs.phase == 'implement' && states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'review' && !states.work.outputs.turn.result.response.?files.orValue([]).exists(f, f.path == 'test-results.md') ? ['Publish test-results.md mapping statement IDs to results and evidence.'] : []) + (states.dispatch.outputs.phase == 'implement' && states.work.outputs.turn.result.?response.orValue({}).?files.orValue([]).exists(f, f.path == 'test-statements.md') ? ['Formal expectations are fixed before implementation. Return redesign to update their plan with preserved expectations and any required deprecation.'] : []) }}
      transitions:
      - to: reject_invalid_build_request
        when: size(outputs.issues) > 0 && ((states.work.outputs.turn).result.?status.orValue('failed') != 'completed'
          || size((states.work.outputs.turn).jobs.?job_ids.orValue([])) > 0)
        payload:
          reason: ${{ jq(outputs.issues,'join("; ")') }}
      - to: repair
        when: size(outputs.issues) > 0
        payload:
          turn: ${{ (states.work.outputs.turn) }}
          issues: ${{ outputs.issues }}
          documents: ${{ states.dispatch.outputs.documents }}
          annotations: ${{ states.dispatch.outputs.annotations }}
      - to: stopped
        when: states.work.outputs.turn.result.response.next == 'outside' && !((state_output('coordinate','threads',inputs.prior_consultations)).exists(k,(state_output('coordinate','threads',inputs.prior_consultations))[k].status
          == 'running') || (state_output('coordinate','jobs',inputs.prior_dependencies)).exists(k,(state_output('coordinate','jobs',inputs.prior_dependencies))[k].status
          == 'running'))
        payload:
          disposition: outside
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: coordinate
        when: states.work.outputs.turn.result.response.next == 'outside' && ((state_output('coordinate','threads',inputs.prior_consultations)).exists(k,(state_output('coordinate','threads',inputs.prior_consultations))[k].status
          == 'running') || (state_output('coordinate','jobs',inputs.prior_dependencies)).exists(k,(state_output('coordinate','jobs',inputs.prior_dependencies))[k].status
          == 'running'))
        payload:
          action: blocked
          requests: []
          keys: ${{ jq([(state_output('coordinate','threads',inputs.prior_consultations)),(state_output('coordinate','jobs',inputs.prior_dependencies))],
            'add | to_entries | map(select(.value.status == "running") | .key)') }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: design_next
        when: states.work.outputs.turn.result.response.next == 'redesign'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: questions
        when: states.work.outputs.turn.result.response.next == 'ask_user'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: intervention
        when: (states.work.outputs.turn.result.response.next == 'blocked' && size(states.work.outputs.turn.result.response.keys)
          == 0) || states.work.outputs.children_failed
        payload:
          reason: '${{ states.work.outputs.children_failed ? ''An assigned validation child failed. Review jobs/ and
            resolve the failure or missing capability.'' : states.work.outputs.turn.result.response.summary }}'
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: coordinate
        when: states.work.outputs.turn.result.response.next in ['consult','submit','blocked']
        payload:
          action: ${{ states.work.outputs.turn.result.response.next }}
          requests: ${{ states.work.outputs.turn.result.response.consultations }}
          keys: ${{ states.work.outputs.turn.result.response.keys }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: states.work.outputs.turn.result.response.next == 'continue'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: coordinate
        when: (state_output('coordinate','threads',inputs.prior_consultations)).exists(k,(state_output('coordinate','threads',inputs.prior_consultations))[k].status
          == 'running') || (state_output('coordinate','jobs',inputs.prior_dependencies)).exists(k,(state_output('coordinate','jobs',inputs.prior_dependencies))[k].status
          == 'running')
        payload:
          action: blocked
          requests: []
          keys: ${{ jq([(state_output('coordinate','threads',inputs.prior_consultations)),(state_output('coordinate','jobs',inputs.prior_dependencies))],
            'add | to_entries | map(select(.value.status == "running") | .key)') }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: repair
        when: 'states.dispatch.outputs.phase == ''implement'' && (!outputs.plan_keys.all(k,k in (state_output(''coordinate'',''jobs'',inputs.prior_dependencies)))
          || !(state_output(''coordinate'',''jobs'',inputs.prior_dependencies)).all(k, (state_output(''coordinate'',''jobs'',inputs.prior_dependencies))[k].status
          == ''completed'' && ((state_output(''coordinate'',''jobs'',inputs.prior_dependencies))[k].kind == ''create''
          ? (state_output(''coordinate'',''jobs'',inputs.prior_dependencies))[k].?ready.orValue(false) : ((state_output(''coordinate'',''jobs'',inputs.prior_dependencies))[k].result.?merged.orValue(false)
          || (state_output(''coordinate'',''jobs'',inputs.prior_dependencies))[k].result.?disposition.orValue('''')
          in [''delegated'',''unchanged'']))))'
        payload:
          turn: ${{ (states.work.outputs.turn) }}
          issues:
          - Required child work has not succeeded. Reconcile recorded results; do not claim completion or duplicate
            jobs.
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: repair
        when: states.dispatch.outputs.phase in ['design','test-plan'] && !outputs.plan_keys.all(k,k in (state_output('coordinate','threads',inputs.prior_consultations))
          && (state_output('coordinate','threads',inputs.prior_consultations))[k].request.kind != 'expert' && (state_output('coordinate','threads',inputs.prior_consultations))[k].?result.orValue({}).?outcome.orValue('')
          == 'agreed')
        payload:
          turn: ${{ (states.work.outputs.turn) }}
          issues:
          - 'Prerequisite keys must identify agreed local serving requests. Return keys: [] when none are needed;
            return redesign to correct the design.'
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: test_next
        when: states.dispatch.outputs.phase == 'design'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: rebase
        when: states.dispatch.outputs.phase == 'implement'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: specialists
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    design_next:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
      sequence: []
      transitions:
      - to: design_context
        when: true
        payload:
          phase: design
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      outputs:
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
    test_next:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
      sequence: []
      transitions:
      - to: dispatch
        when: true
        payload:
          phase: test-plan
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      outputs:
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
    implementation_next:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
      sequence: []
      transitions:
      - to: dispatch
        when: true
        payload:
          phase: implement
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      outputs:
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
    coordinate:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        action: ${{ transition.payload.action }}
        requests: ${{ transition.payload.requests }}
        keys: ${{ transition.payload.keys }}
        consultation_recipe: ${{ inputs.consultation_recipe }}
        build_recipe: ${{ inputs.build_recipe }}
        create_recipe: ${{ inputs.create_recipe }}
        phase: ${{ states.dispatch.outputs.phase }}
        session: ${{ states.record.outputs.session }}
        coordinate_threads: ${{ state_output('coordinate','threads',inputs.prior_consultations) }}
        coordinate_jobs: ${{ state_output('coordinate','jobs',inputs.prior_dependencies) }}
        root_cell: ${{ states.start.outputs.root_cell }}
        root_ref: ${{ states.start.outputs.root_ref }}
      sequence:
      - id: coordinate
        include: ./coordinate.yaml
        inputs:
          phase: ${{ inputs.phase }}
          session: ${{ inputs.session }}
          documents: ${{ inputs.documents }}
          annotations: ${{ inputs.annotations }}
          threads: ${{ inputs.coordinate_threads }}
          jobs: ${{ inputs.coordinate_jobs }}
          root_cell: ${{ inputs.root_cell }}
          root_ref: ${{ inputs.root_ref }}
          consultation_recipe: ${{ inputs.consultation_recipe }}
          build_recipe: ${{ inputs.build_recipe }}
          create_recipe: ${{ inputs.create_recipe }}
          action: ${{ inputs.action }}
          requests: ${{ inputs.requests }}
          keys: ${{ inputs.keys }}
      outputs:
        valid: ${{ sequence.coordinate.outputs.valid }}
        session: ${{ sequence.coordinate.outputs.session }}
        documents: ${{ sequence.coordinate.outputs.documents }}
        annotations: ${{ sequence.coordinate.outputs.annotations }}
        threads: ${{ sequence.coordinate.outputs.threads }}
        jobs: ${{ sequence.coordinate.outputs.jobs }}
      transitions:
      - to: repair
        when: '!outputs.valid'
        payload:
          turn: ${{ jq([states.work.outputs.turn,{'result':jq([states.work.outputs.turn.result,{'session':outputs.session}],
            'add')}], 'add') }}
          issues:
          - Use agreed serving requests before submission, stable keys, and recorded child outcomes.
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: stopped
        when: states.work.outputs.turn.result.response.next == 'outside'
        payload:
          disposition: outside
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          session: ${{ outputs.session }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    questions:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        turn: ${{ states.work.outputs.turn }}
      sequence:
      - id: prompts
        include: ./prompts.yaml
      - id: review
        include: ./review.yaml
        inputs:
          annotations: ${{ inputs.annotations }}
          title: ${{ sequence.prompts.outputs.human.questions.title }}
          documents: ${{ inputs.documents }}
          fields: ${{ inputs.turn.result.response.questions +
            [{'id':'annotations','type':'file_upload','question':sequence.prompts.outputs.human.questions.annotations_question,'required':false}]
            }}
      - id: feedback
        include: ./feedback-documents.yaml
        inputs:
          fields: ${{ sequence.review.outputs.response.fields }}
          documents: ${{ sequence.review.outputs.response.?artifact_refs.orValue({}) }}
      outputs:
        documents: ${{ jq([inputs.documents,sequence.review.outputs.response.?artifact_refs.orValue({}),sequence.feedback.outputs.documents],
          'add') }}
        annotations: ${{ inputs.annotations }}
      transitions:
      - to: dispatch
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    assessment:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        request: ${{ inputs.prompt }}
        guidance: ${{ inputs.prompt_additions.?outcome_assessment.orValue('') }}
        previous_summary: ${{ state_output('assessment','response.summary','') }}
        previous_candidate: ${{ state_output('assessment','candidate.head','') }}
        agent_artifacts: ${{ states.verify.outputs.agent_artifacts }}
        candidate: ${{ states.prepare.outputs.candidate }}
      sequence:
      - id: assess
        include: ./inspect.yaml
        inputs:
          role: assessment
          request: ${{ inputs.request }}
          documents: ${{ inputs.documents }}
          evidence_documents: ${{ inputs.agent_artifacts }}
          guidance: ${{ inputs.guidance }}
      outputs:
        documents: ${{ sequence.assess.outputs.documents }}
        annotations: ${{ inputs.annotations + sequence.assess.outputs.annotations }}
        approved: ${{ sequence.assess.outputs.approved }}
        response: ${{ sequence.assess.outputs.response }}
        candidate: ${{ inputs.candidate }}
        next: ${{ sequence.assess.outputs.next }}
        previous_summary: ${{ inputs.previous_summary }}
        previous_candidate: ${{ inputs.previous_candidate }}
      transitions:
      - to: intervention
        when: outputs.next == 'intervention'
        payload:
          reason: ${{ outputs.response.summary }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: intervention
        when: '!outputs.approved && outputs.previous_summary == outputs.response.summary && outputs.previous_candidate
          == outputs.candidate.head'
        payload:
          reason: The same assessment finding recurred without a candidate change. Resolve the missing evidence, capability,
            or requirement described in feedback/.
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: accounting
        when: outputs.approved
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          assignment: '${{ outputs.next == ''validation'' ? ''validation'' : '''' }}'
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') && states.verify.outputs.agent_artifacts.exists(k,
          failure.message.contains('"' + k + '"'))
        to: dispatch
        payload:
          documents: ${{ transition.payload.documents }}
          annotations: ${{ transition.payload.annotations }}
          evidence_documents: '${{ {''error/artifact-binding.md'': {''kind'':''value'',''name'':''error/artifact-binding.md'',''format'':''text'',''value'':failure.message
            + ''\nThe evidence could not be read. Repair or rerun the producing check; missing evidence is not success.''}
            } }}'
    accounting:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        request: ${{ inputs.prompt }}
        guidance: ${{ inputs.prompt_additions.?outcome_assessment.orValue('') }}
        agent_artifacts: ${{ states.verify.outputs.agent_artifacts }}
        candidate: ${{ states.prepare.outputs.candidate }}
        hook_digest: ${{ states.prepare.outputs.hook_digest }}
      sequence:
      - id: review
        include: ./inspect.yaml
        inputs:
          role: summary
          request: ${{ inputs.request }}
          documents: ${{ inputs.documents }}
          evidence_documents: ${{ inputs.agent_artifacts }}
          guidance: ${{ inputs.guidance }}
      outputs:
        documents: ${{ sequence.review.outputs.documents }}
        annotations: ${{ inputs.annotations + sequence.review.outputs.annotations }}
        approved: ${{ sequence.review.outputs.approved }}
        response: ${{ sequence.review.outputs.response }}
        candidate: ${{ inputs.candidate }}
        hook_digest: ${{ inputs.hook_digest }}
        commit_message: ${{ jq([sequence.review.outputs.response.subject,sequence.review.outputs.response.summary,inputs.candidate.job_url],
          'join([10,10] | implode)') }}
      transitions:
      - to: accept
        when: outputs.approved
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') && states.verify.outputs.agent_artifacts.exists(k,
          failure.message.contains('"' + k + '"'))
        to: dispatch
        payload:
          documents: ${{ transition.payload.documents }}
          annotations: ${{ transition.payload.annotations }}
          evidence_documents: '${{ {''error/artifact-binding.md'': {''kind'':''value'',''name'':''error/artifact-binding.md'',''format'':''text'',''value'':failure.message
            + ''\nThe evidence could not be read. Repair or rerun the producing check; missing evidence is not success.''}
            } }}'
    rebase:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        resume_merge: ${{ transition.from == 'merge' }}
        merge_chases: '${{ state_output(''rebase'',''merge_chases'',inputs.prior_merge_chases) + (transition.from
          == ''merge'' ? 1 : 0) }}'
      sequence:
      - id: resolve_upstream_head
        op: command_execution
        const: true
        inputs:
          env:
            REPO: ${{ context.git.repo }}
            BRANCH: ${{ context.git.ref }}
          run: |
            set -eu
            git ls-remote --exit-code -- "$REPO" "refs/heads/${BRANCH#refs/heads/}"
      - id: rebase_candidate
        op: rebase
        retry:
          maximum_attempts: 1
        inputs:
          target_base_hash: ${{ jq(sequence.resolve_upstream_head.outputs.stdout, 'split("\t")[0]') }}
      outputs:
        resume_merge: ${{ inputs.resume_merge }}
        merge_chases: ${{ inputs.merge_chases }}
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
      transitions:
      - to: prepare
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      retry:
        maximum_attempts: 1
      catch:
      - id: repair_restored_rebase_conflict
        when: 'inputs.prior_rebase_repairs + (state_exists(''rebase_repair'') ? size(states.rebase_repair.runs) +
          1 : 0) < 2 && jq(json_parse(json_stringify(failure)),states.start.outputs.rebase_policy)'
        to: rebase_repair
        payload:
          documents: ${{ transition.payload.documents }}
          annotations: ${{ transition.payload.annotations }}
    rebase_repair:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        failure: ${{ transition.failure }}
      sequence:
      - id: recovery
        include: ./rebase-recovery.yaml
        inputs:
          failure: ${{ inputs.failure }}
      transitions:
      - to: dispatch
        when: true
        payload:
          phase: implement
          assignment: rebase
          evidence_documents: ${{ outputs.error_documents }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      outputs:
        error_documents: ${{ sequence.recovery.outputs.documents }}
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
    prepare:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ inputs.settings_artifact }}
      sequence:
      - id: prepare
        include: ./hook-prepare.yaml
        inputs:
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          documents: ${{ inputs.documents }}
          settings: ${{ inputs.settings }}
      - id: candidate
        include: ./git-candidate.yaml
      - id: identity
        include: ./hook-identity.yaml
      - id: errors
        include: ./error-documents.yaml
        inputs:
          summary: ${{ sequence.prepare.outputs.result.summary }}
          artifacts: ${{ sequence.prepare.outputs.artifact_refs }}
          name: preparation.md
      outputs:
        result: ${{ sequence.prepare.outputs.result }}
        candidate: ${{ sequence.candidate.outputs.candidate }}
        hook_digest: ${{ sequence.identity.outputs.digest }}
        documents: ${{ jq([inputs.documents,sequence.prepare.outputs.artifact_refs,sequence.candidate.outputs.documents],
          'add') }}
        error_documents: ${{ sequence.errors.outputs.documents }}
        annotations: ${{ inputs.annotations }}
      transitions:
      - to: dispatch
        when: outputs.result.status == 'failed'
        payload:
          evidence_documents: ${{ outputs.error_documents }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: specialists
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    design_context:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.?annotations.orValue(inputs.annotations) }}
        request: ${{ inputs.prompt }}
        consultations: ${{ inputs.consultations }}
        guidance: ${{ inputs.prompt_additions[?('before_design')].orValue('') }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ inputs.settings_artifact }}
      sequence:
      - id: research
        include: ./hook-before_design.yaml
        inputs:
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          documents: ${{ inputs.documents }}
          settings: ${{ inputs.settings }}
      - id: specialists
        include: ./specialists.yaml
        inputs:
          request: ${{ inputs.request }}
          consultations: ${{ inputs.consultations }}
          guidance: ${{ inputs.guidance }}
          checkpoint: ${{ 'before_design' }}
          documents: ${{ jq([inputs.documents,sequence.research.outputs.artifact_refs], 'add') }}
          annotations: ${{ inputs.annotations }}
      outputs:
        documents: ${{ sequence.specialists.outputs.documents }}
        annotations: ${{ sequence.specialists.outputs.annotations }}
        passed: ${{ sequence.specialists.outputs.passed }}
      transitions:
      - to: dispatch
        when: true
        payload:
          phase: design
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    specialists:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        request: ${{ inputs.prompt }}
        consultations: ${{ inputs.consultations }}
        guidance: ${{ inputs.prompt_additions[?(states.dispatch.outputs.phase == 'test-plan' ? 'plan_assessment':'outcome_assessment')].orValue('')
          }}
        phase: ${{ states.dispatch.outputs.phase }}
      sequence:
      - id: specialists
        include: ./specialists.yaml
        inputs:
          request: ${{ inputs.request }}
          consultations: ${{ inputs.consultations }}
          guidance: ${{ inputs.guidance }}
          checkpoint: ${{ inputs.phase == 'test-plan' ? 'plan_assessment':'outcome_assessment' }}
          documents: ${{ inputs.documents }}
          annotations: ${{ inputs.annotations }}
      outputs:
        documents: ${{ sequence.specialists.outputs.documents }}
        annotations: ${{ sequence.specialists.outputs.annotations }}
        passed: ${{ sequence.specialists.outputs.passed }}
      transitions:
      - to: implementation_next
        when: outputs.passed && states.dispatch.outputs.phase == 'test-plan'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: design_next
        when: '!outputs.passed && states.dispatch.outputs.phase == ''test-plan'''
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: verify
        when: outputs.passed
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    verify:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ inputs.settings_artifact }}
        require_verification: ${{ inputs.require_verification }}
        candidate: ${{ states.prepare.outputs.candidate }}
      sequence:
      - id: verify
        include: ./verify.yaml
        inputs:
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          settings: ${{ inputs.settings }}
          require_verification: ${{ inputs.require_verification }}
          documents: ${{ inputs.documents }}
          candidate: ${{ inputs.candidate.head }}
      outputs:
        allowed: ${{ sequence.verify.outputs.allowed }}
        result: ${{ sequence.verify.outputs.result }}
        artifact_refs: ${{ sequence.verify.outputs.artifact_refs }}
        agent_artifacts: ${{ sequence.verify.outputs.agent_artifacts }}
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
      transitions:
      - to: inspect_chased_candidate
        when: outputs.allowed && states.rebase.outputs.resume_merge
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: assessment
        when: outputs.allowed
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          evidence_documents: ${{ outputs.agent_artifacts }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    inspect_chased_candidate:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        agent_artifacts: ${{ states.verify.outputs.agent_artifacts }}
        hook_digest: ${{ states.prepare.outputs.hook_digest }}
        reviewed_candidate: ${{ states.accounting.outputs.candidate }}
        reviewed_hook_digest: ${{ states.accounting.outputs.hook_digest }}
      sequence:
      - id: candidate
        include: ./git-candidate.yaml
        inputs:
          documents: ${{ inputs.documents }}
          evidence_documents: ${{ inputs.agent_artifacts }}
      outputs:
        candidate: ${{ sequence.candidate.outputs.candidate }}
        documents: ${{ jq([inputs.documents,sequence.candidate.outputs.documents], 'add') }}
        reusable: ${{ (size(sequence.candidate.outputs.candidate.files) == 0 || sequence.candidate.outputs.candidate.change_digest
          == inputs.reviewed_candidate.change_digest) && inputs.hook_digest == inputs.reviewed_hook_digest }}
        annotations: ${{ inputs.annotations }}
      transitions:
      - to: stopped
        when: outputs.reusable && size(outputs.candidate.files) == 0
        payload:
          disposition: ${{ size(state_output('coordinate','jobs',inputs.prior_dependencies)) > 0 ? 'delegated':'unchanged'
            }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: merge
        when: outputs.reusable
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: assessment
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') && states.verify.outputs.agent_artifacts.exists(k,
          failure.message.contains('"' + k + '"'))
        to: dispatch
        payload:
          documents: ${{ transition.payload.documents }}
          annotations: ${{ transition.payload.annotations }}
          evidence_documents: '${{ {''error/artifact-binding.md'': {''kind'':''value'',''name'':''error/artifact-binding.md'',''format'':''text'',''value'':failure.message
            + ''\nThe evidence could not be read. Repair or rerun the producing check; missing evidence is not success.''}
            } }}'
    accept:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        review_hint: ${{ transition.payload.?review_hint.orValue(states.prompts.outputs.human.requested_changes) }}
        candidate: ${{ states.prepare.outputs.candidate }}
        artifact_refs: ${{ states.verify.outputs.artifact_refs }}
      sequence:
      - id: prompts
        include: ./prompts.yaml
      - id: outcome_review
        include: ./review.yaml
        inputs:
          annotations: ${{ inputs.annotations }}
          title: '${{ size(inputs.candidate.files) > 0 ? sequence.prompts.outputs.human.accept.title_changed : sequence.prompts.outputs.human.accept.title_unchanged
            }}'
          documents: ${{ jq([inputs.documents, inputs.artifact_refs], 'add') }}
          fields:
          - id: decision
            type: multiple_choice
            question: '${{ size(inputs.candidate.files) > 0 ? sequence.prompts.outputs.human.accept.decision_question_changed
              : sequence.prompts.outputs.human.accept.decision_question_unchanged }}'
            required: true
            options:
            - value: accept
              label: '${{ size(inputs.candidate.files) > 0 ? sequence.prompts.outputs.human.accept.accept_label_changed :
                sequence.prompts.outputs.human.accept.accept_label_unchanged }}'
            - value: revise
              label: ${{ sequence.prompts.outputs.human.accept.revise_label }}
            - value: redesign
              label: ${{ sequence.prompts.outputs.human.accept.redesign_label }}
            - value: cancel
              label: ${{ sequence.prompts.outputs.human.accept.cancel_label }}
          - id: feedback
            type: paragraph_text
            question: ${{ inputs.review_hint }}
            required: false
          - id: annotations
            type: file_upload
            question: ${{ sequence.prompts.outputs.human.accept.annotations_question }}
            required: false
      - id: feedback
        include: ./feedback-documents.yaml
        inputs:
          fields: ${{ sequence.outcome_review.outputs.response.fields }}
          documents: ${{ sequence.outcome_review.outputs.response.?artifact_refs.orValue({}) }}
      outputs:
        documents: ${{ jq([inputs.documents,sequence.outcome_review.outputs.response.?artifact_refs.orValue({}),sequence.feedback.outputs.documents],
          'add') }}
        annotations: ${{ inputs.annotations }}
        response: ${{ sequence.outcome_review.outputs.response }}
        changed: ${{ sequence.outcome_review.outputs.changed }}
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          disposition: cancelled
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: stopped
        when: outputs.response.fields.decision == 'accept' && !outputs.changed && size(states.prepare.outputs.candidate.files)
          == 0 && states.verify.outputs.allowed && states.assessment.outputs.approved
        payload:
          disposition: unchanged
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: merge
        when: outputs.response.fields.decision == 'accept' && !outputs.changed && size(states.prepare.outputs.candidate.files)
          > 0 && states.verify.outputs.allowed && states.assessment.outputs.approved
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: design_next
        when: outputs.response.fields.decision == 'redesign' && outputs.changed
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: outputs.changed
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: accept
        when: true
        payload:
          review_hint: ${{ states.prompts.outputs.human.revision_hint }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    merge:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        base: ${{ context.git.execution.base_hash }}
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ inputs.settings_artifact }}
        commit_message: ${{ states.accounting.outputs.commit_message }}
        artifact_refs: ${{ states.verify.outputs.artifact_refs }}
      sequence:
      - id: squash_reviewed_candidate
        op: squash
        inputs:
          author: ${{ context.git.?author.orValue('') }}
          commit_message: ${{ inputs.commit_message }}
      - id: merge_reviewed_candidate
        op: merge
        retry:
          maximum_attempts: 1
        inputs:
          repo_path: ${{ context.environment.op.worktree_path }}
          upstream_repo: ${{ context.git.repo }}
          upstream_branch: ${{ context.git.ref }}
      - id: publish
        include: ./hook-publish.yaml
        workspace:
          cell: ${{ context.git.repo }}
          ref: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        inputs:
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          documents: ${{ jq([inputs.documents, inputs.artifact_refs], 'add') }}
          settings: ${{ inputs.settings }}
          merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
          target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
          base: ${{ inputs.base }}
        catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              result: ${{ {'status':'failed','ok':false,'summary':failure.message,'failure':json_parse(json_stringify(failure))}
                }}
              artifact_refs: {}
      outputs:
        documents: ${{ jq([inputs.documents,sequence.publish.outputs.artifact_refs], 'add') }}
        annotations: ${{ inputs.annotations }}
        publication: ${{ sequence.publish.outputs.result }}
        merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
      transitions:
      - to: reject_invalid_build_request
        when: outputs.publication.status == 'failed'
        payload:
          reason: '${{ ''Merge succeeded but publication failed: '' + outputs.publication.summary }}'
      retry:
        maximum_attempts: 1
      catch:
      - id: chase_advanced_upstream
        when: failure.kind == 'task_error' && failure.code == 'MERGE_UPSTREAM_ADVANCED' && failure.node.op == 'merge'
          && failure.node.id == 'merge_reviewed_candidate' && state_output('rebase','merge_chases',inputs.prior_merge_chases)
          < 3
        to: rebase
        payload:
          documents: ${{ transition.payload.documents }}
          annotations: ${{ transition.payload.annotations }}
    stopped:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        disposition: ${{ transition.payload.disposition }}
      sequence: []
      outputs:
        documents: ${{ inputs.documents }}
        annotations: ${{ inputs.annotations }}
        disposition: ${{ inputs.disposition }}
    reject_invalid_build_request:
      id: reject_invalid_build_request
      op: command_execution
      inputs:
        run: exit 1
      catch:
      - when: true
        fail:
          code: BUILD_REJECTED
          message: ${{ transition.payload.reason }}
    repair:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        turn: ${{ transition.payload.turn }}
        issues: ${{ transition.payload.issues }}
        session: ${{ states.dispatch.outputs.session }}
        assignment: ${{ states.dispatch.outputs.assignment }}
        base_documents: ${{ states.dispatch.outputs.base_documents }}
        repair_attempts: ${{ states.dispatch.outputs.repair_attempts }}
      sequence:
      - id: errors
        include: ./error-documents.yaml
        inputs:
          name: response-corrections.md
          summary: ${{ jq(inputs.issues,'map("- " + .) | join("\n")') }}
      outputs:
        session: ${{ inputs.turn.result.?session.orValue(inputs.session) }}
        documents: ${{ jq([inputs.documents,inputs.turn.artifacts], 'add') }}
        base_documents: '${{ inputs.assignment == ''repair'' ? inputs.base_documents : inputs.documents }}'
        error_documents: ${{ sequence.errors.outputs.documents }}
        retained_artifacts: ${{ inputs.turn.artifacts }}
        attempts: ${{ inputs.repair_attempts + 1 }}
        annotations: ${{ inputs.annotations }}
      transitions:
      - to: iteration_limit
        when: outputs.attempts > 2
        payload:
          assignment: repair
          session: ${{ outputs.session }}
          base_documents: ${{ outputs.base_documents }}
          evidence_documents: ${{ outputs.error_documents }}
          retained_artifacts: ${{ outputs.retained_artifacts }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          assignment: repair
          session: ${{ outputs.session }}
          base_documents: ${{ outputs.base_documents }}
          evidence_documents: ${{ outputs.error_documents }}
          retained_artifacts: ${{ outputs.retained_artifacts }}
          repair_attempts: ${{ outputs.attempts }}
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
    iteration_limit:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        assignment: ${{ transition.payload.?assignment.orValue(states.dispatch.outputs.assignment) }}
        session: ${{ transition.payload.?session.orValue(states.dispatch.outputs.session) }}
        base_documents: ${{ transition.payload.?base_documents.orValue(states.dispatch.outputs.base_documents) }}
        evidence_documents: ${{ transition.payload.?evidence_documents.orValue(states.dispatch.outputs.evidence_documents)
          }}
        retained_artifacts: ${{ transition.payload.?retained_artifacts.orValue(states.dispatch.outputs.retained_artifacts)
          }}
      sequence:
      - id: prompts
        include: ./prompts.yaml
      - id: direction
        include: ./review.yaml
        inputs:
          title: ${{ sequence.prompts.outputs.human.iteration_limit.title }}
          documents: ${{ inputs.documents }}
          annotations: ${{ inputs.annotations }}
          fields:
          - id: decision
            type: multiple_choice
            question: ${{ sequence.prompts.outputs.human.iteration_limit.decision_question }}
            required: true
            options:
            - value: continue
              label: ${{ sequence.prompts.outputs.human.iteration_limit.continue_label }}
            - value: cancel
              label: ${{ sequence.prompts.outputs.human.iteration_limit.cancel_label }}
          - id: feedback
            type: paragraph_text
            question: ${{ sequence.prompts.outputs.human.iteration_limit.feedback_question }}
            required: false
      - id: feedback
        include: ./feedback-documents.yaml
        inputs:
          fields: ${{ sequence.direction.outputs.response.fields }}
          documents: ${{ sequence.direction.outputs.response.?artifact_refs.orValue({}) }}
      outputs:
        documents: ${{ jq([inputs.documents,sequence.direction.outputs.response.?artifact_refs.orValue({}),sequence.feedback.outputs.documents],
          'add') }}
        annotations: ${{ inputs.annotations }}
        response: ${{ sequence.direction.outputs.response }}
        assignment: ${{ inputs.assignment }}
        session: ${{ inputs.session }}
        base_documents: ${{ inputs.base_documents }}
        evidence_documents: ${{ inputs.evidence_documents }}
        retained_artifacts: ${{ inputs.retained_artifacts }}
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          disposition: cancelled
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
          assignment: ${{ outputs.assignment }}
          session: ${{ outputs.session }}
          base_documents: ${{ outputs.base_documents }}
          evidence_documents: ${{ outputs.evidence_documents }}
          retained_artifacts: ${{ outputs.retained_artifacts }}
    intervention:
      inputs:
        documents: ${{ transition.payload.documents }}
        annotations: ${{ transition.payload.annotations }}
        reason: ${{ transition.payload.?reason.orValue(states.prompts.outputs.human.blocker) }}
      sequence:
      - id: prompts
        include: ./prompts.yaml
      - id: request_intervention
        include: ./review.yaml
        inputs:
          title: ${{ sequence.prompts.outputs.human.intervention.title }}
          documents: ${{ inputs.documents }}
          annotations: ${{ inputs.annotations }}
          fields:
          - id: decision
            type: multiple_choice
            question: ${{ inputs.reason }}
            required: true
            options:
            - value: continue
              label: ${{ sequence.prompts.outputs.human.intervention.continue_label }}
            - value: redesign
              label: ${{ sequence.prompts.outputs.human.intervention.redesign_label }}
            - value: cancel
              label: ${{ sequence.prompts.outputs.human.intervention.cancel_label }}
          - id: feedback
            type: paragraph_text
            question: ${{ sequence.prompts.outputs.human.intervention.feedback_question }}
            required: true
          - id: annotations
            type: file_upload
            question: ${{ sequence.prompts.outputs.human.intervention.annotations_question }}
            required: false
      - id: feedback
        include: ./feedback-documents.yaml
        inputs:
          fields: ${{ sequence.request_intervention.outputs.response.fields }}
          documents: ${{ sequence.request_intervention.outputs.response.?artifact_refs.orValue({}) }}
      outputs:
        documents: ${{ jq([inputs.documents,sequence.request_intervention.outputs.response.?artifact_refs.orValue({}),sequence.feedback.outputs.documents],
          'add') }}
        annotations: ${{ inputs.annotations }}
        response: ${{ sequence.request_intervention.outputs.response }}
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          disposition: cancelled
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: design_next
        when: outputs.response.fields.decision == 'redesign'
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
      - to: dispatch
        when: true
        payload:
          documents: ${{ outputs.documents }}
          annotations: ${{ outputs.annotations }}
outputs:
  annotations: ${{ state_output('merge','annotations',state_output('stopped','annotations',state_output('record','annotations',inputs.annotations)))
    }}
  merged: ${{ nonempty(state_output('merge','merged_hash','')) }}
  merged_hash: ${{ state_output('merge','merged_hash','') }}
  target_branch: ${{ state_output('merge','target_branch','') }}
  session: ${{ state_output('record','session',inputs.session) }}
  assistant_summary: ${{ state_output('work','turn.result.response.summary','') }}
  disposition: '${{ state_exists(''merge'') ? ''implemented'' : state_output(''stopped'',''disposition'',''incomplete'')
    }}'
  result: ${{ state_output('work','turn.result.response',{}) }}
  artifact_refs: ${{ jq([state_output('merge','documents',state_output('stopped','documents',state_output('record','documents',states.start.outputs.documents))),state_output('verify','artifact_refs',{})],
    'add') }}
  consultations: ${{ state_output('coordinate','threads',inputs.prior_consultations) }}
  dependencies: ${{ state_output('coordinate','jobs',inputs.prior_dependencies) }}
  reviews: '${{ state_exists(''accept'') ? {''outcome'':states.accept.outputs.response.?receipt.orValue({})} : {}
    }}'
  verification: ${{ state_output('verify','result',{}) }}
  publication: ${{ state_output('merge','publication',{}) }}
