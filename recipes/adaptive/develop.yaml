id: adaptive-develop
version: 1.0.0
inputs:
  annotations: ${{ inputs.?annotations.orValue([]) }}
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  session: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  prior_rebase_repairs: ${{ inputs.?prior_rebase_repairs.orValue(0) }}
  prior_rebase_recovery_pending: ${{ inputs.?prior_rebase_recovery_pending.orValue(false) }}
  prior_rebase_recovery: ${{ inputs.?prior_rebase_recovery.orValue({}) }}
  prior_merge_chases: ${{ inputs.?prior_merge_chases.orValue(0) }}
  prior_dependencies: ${{ inputs.?prior_dependencies.orValue({}) }}
  prior_consultations: ${{ inputs.?prior_consultations.orValue({}) }}
  hook_settings: ${{ inputs.?hook_settings.orValue({}) }}
  settings_artifact: ${{ inputs.?settings_artifact.orValue(null) }}
  require_verification: ${{ inputs.?require_verification.orValue(false) }}
  design_required: ${{ inputs.design_required }}
  max_iterations: ${{ inputs.max_iterations }}
state:
  initial: discover_root_cell
  states:
    discover_root_cell:
      id: discover_root_cell
      op: command_execution
      const: true
      inputs:
        run: |
          if [ -f .c2/config.yaml ] && command -v c2j >/dev/null 2>&1; then
            c2j self --json
          else
            printf '{}'
          fi
      transitions:
      - to: start
        when: true
    start:
      inputs:
        annotations: ${{ inputs.annotations }}
        request: ${{ inputs.prompt }}
        directory: ${{ inputs.target_directory }}
        session: ${{ inputs.session }}
        documents: ${{ jq([json_parse(json_stringify(context.artifacts)), inputs.documents], 'add | with_entries(select(.key
          != "__git_state_thin_pack__" and .key != "diff_from_parent.diff" and .key != "diff_from_base.diff"))')
          }}
        root_cell: '${{ inputs.root_cell != '''' ? inputs.root_cell : json_parse(states.discover_root_cell.outputs.stdout).?root_repo.orValue('''')
          }}'
        root_ref: '${{ inputs.root_ref != '''' ? inputs.root_ref : json_parse(states.discover_root_cell.outputs.stdout).?root_ref.orValue(''main'')
          }}'
        consultation_recipe: ${{ inputs.consultation_recipe }}
        build_recipe: ${{ inputs.build_recipe }}
        create_recipe: ${{ inputs.create_recipe }}
        prior_rebase_repairs: ${{ inputs.prior_rebase_repairs }}
        prior_rebase_recovery_pending: ${{ inputs.prior_rebase_recovery_pending }}
        prior_rebase_recovery: ${{ inputs.prior_rebase_recovery }}
        prior_merge_chases: ${{ inputs.prior_merge_chases }}
        prior_dependencies: ${{ inputs.prior_dependencies }}
        prior_consultations: ${{ inputs.prior_consultations }}
        hook_settings: ${{ inputs.hook_settings }}
        settings_artifact: ${{ inputs.settings_artifact }}
        require_verification: ${{ inputs.require_verification }}
        design_required: ${{ inputs.design_required }}
        max_iterations: ${{ inputs.max_iterations }}
      sequence:
      - id: rebase_policy
        include: ./rebase-policy.yaml
      outputs:
        rebase_policy: ${{ sequence.rebase_policy.outputs.predicate }}
        valid: ${{ nonempty(inputs.directory) && !inputs.directory.startsWith('/') && !inputs.directory.matches('(^|/)[.][.](/|$)')
          }}
        flow: '${{ jq([{''phase'': inputs.design_required ? ''design'' : ''test-plan'', ''last_phase'': '''', ''message'':
          inputs.request, ''request'': inputs.request, ''target_directory'': inputs.directory, ''session'': inputs.session,
          ''annotations'': inputs.annotations, ''documents'': inputs.documents, ''threads'': inputs.prior_consultations,
          ''jobs'': inputs.prior_dependencies, ''merge_chases'': inputs.prior_merge_chases, ''rebase_repairs'':
          inputs.prior_rebase_repairs, ''rebase_recovery'': inputs.prior_rebase_recovery, ''rebase_recovery_pending'':
          inputs.prior_rebase_recovery_pending, ''iterations'': 0, ''max_iterations'': inputs.max_iterations, ''event'':
          ''start'', ''plan_keys'': [], ''reviews'': {}, ''root_cell'': inputs.root_cell, ''root_ref'': inputs.root_ref,
          ''consultation_recipe'': inputs.consultation_recipe, ''build_recipe'': inputs.build_recipe, ''create_recipe'':
          inputs.create_recipe}, {''hook_settings'': inputs.hook_settings, ''settings_artifact'': inputs.settings_artifact,
          ''require_verification'': inputs.require_verification}], ''add'') }}'
      transitions:
      - to: reject_invalid_build_request
        when: '!outputs.valid'
        payload:
          reason: Target directory must be a nonempty repository-relative path without parent traversal.
      - to: design_context
        when: outputs.flow.phase == 'design'
        payload:
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    work:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: agent
        include: ./agent.yaml
        inputs:
          flow: ${{ inputs.flow }}
          documents: ${{ inputs.flow.documents }}
      - id: children
        include: ./validation-jobs.yaml
        inputs:
          jobs: ${{ sequence.agent.outputs.turn.jobs }}
          allowed: ${{ inputs.flow.phase == 'implement' && !has(inputs.flow.repair_base_documents) }}
      outputs:
        flow: ${{ jq([inputs.flow, {'documents':jq([inputs.flow.documents, sequence.children.outputs.documents], 'add'), 'validation_failed':sequence.children.outputs.failed}],
          'add') }}
        turn: ${{ sequence.agent.outputs.turn }}
      transitions:
      - to: record
        when: true
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') && transition.payload.flow.?verification_artifacts.orValue({}).exists(k,
          [k, 'error/' + k, 'error/' + jq(k, 'ltrimstr("_c2j/execution/")'),
          'verification/' + jq(k, 'ltrimstr("_c2j/execution/")'), 'error/legacy/' + jq(k, 'ltrimstr("_c2j/command/")')].exists(name,
          failure.message.contains('"' + name + '"')))
        to: dispatch
        payload:
          flow: ${{ jq([transition.payload.flow, {'event':'verification', 'verification':{'status':'failed', 'summary':failure.message},
            'verification_artifacts':{} }], 'add | del(.reviews.outcome, .assessment, .commit_message, .reuse_merge_approval,
            .chase_pending)') }}
    record:
      inputs:
        previous: ${{ states.work.outputs.flow }}
        turn: ${{ states.work.outputs.turn }}
      sequence: []
      outputs:
        valid: ${{ size(vars.issues) == 0 }}
        flow: "${{ inputs.turn.result.?output_schema_valid.orValue(false) ? (jq([inputs.previous, {\n 'repair_attempts': 0,\
          \ 'repair_artifacts': {}, 'session': inputs.turn.result.?session.orValue(inputs.previous.session),\n 'last_phase':\
          \ inputs.previous.phase,\n 'plan_keys': inputs.turn.result.?response.orValue({}).?next.orValue('') == 'review' ?\
          \ (inputs.previous.phase in ['design', 'test-plan'] ? inputs.turn.result.response.keys : jq([inputs.previous.plan_keys,\
          \ inputs.turn.result.response.keys], 'add | unique')) : inputs.previous.plan_keys,\n 'result': inputs.turn.result.?response.orValue({}),\
          \ 'annotations': inputs.previous.?annotations.orValue([]) + inputs.turn.?annotations.orValue([]),\n 'documents':\
          \ jq([inputs.previous.?repair_base_documents.orValue(inputs.previous.documents),\n   jq({'files': inputs.turn.result.?response.orValue({}).?files.orValue([]),\
          \ 'artifacts': inputs.turn.artifacts},\n      '. as $v | $v.files | map(select(.path as $p | $v.artifacts | has($p))\
          \ | {key: .path, value: $v.artifacts[.path]}) | from_entries')], 'add')}], 'add | del(.repair_base_documents)'))\
          \ : inputs.previous }}"
        issues: ${{ vars.issues }}
        turn: ${{ inputs.turn }}
        previous: ${{ inputs.previous }}
      transitions:
      - to: reject_invalid_build_request
        when: '!outputs.valid && (outputs.turn.result.?status.orValue(''failed'') != ''completed'' || size(outputs.turn.jobs.?job_ids.orValue([]))
          > 0)'
        payload:
          reason: ${{ jq(outputs.issues, 'join("; ")') }}
      - to: repair
        when: '!outputs.valid'
        payload:
          flow: '${{ jq([outputs.previous, {''last_phase'': outputs.previous.phase}], ''add'') }}'
          turn: ${{ outputs.turn }}
          issues: ${{ outputs.issues }}
      - to: stopped
        when: outputs.flow.result.next == 'outside' && !outputs.flow.threads.exists(k, outputs.flow.threads[k].status == 'running')
          && !outputs.flow.jobs.exists(k, outputs.flow.jobs[k].status == 'running')
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''outside''}], ''add'') }}'
      - to: coordinate
        when: outputs.flow.result.next == 'outside' && (outputs.flow.threads.exists(k, outputs.flow.threads[k].status == 'running')
          || outputs.flow.jobs.exists(k, outputs.flow.jobs[k].status == 'running'))
        payload:
          action: blocked
          requests: []
          keys: ${{ jq([outputs.flow.threads, outputs.flow.jobs], 'add | to_entries | map(select(.value.status == "running")
            | .key)') }}
          flow: ${{ jq([outputs.flow, {'pending_outside':true}], 'add') }}
      - to: design_next
        when: outputs.flow.result.next == 'redesign'
        payload:
          flow: ${{ outputs.flow }}
      - to: questions
        when: outputs.flow.result.next == 'ask_user'
        payload:
          flow: ${{ outputs.flow }}
      - to: intervention
        when: (outputs.flow.result.next == 'blocked' && size(outputs.flow.result.keys) == 0) || outputs.flow.?validation_failed.orValue(false)
        payload:
          flow: '${{ jq([outputs.flow, {''intervention_reason'':outputs.flow.validation_failed ? ''An assigned validation
            child failed. Review jobs/ and resolve the validation failure or missing capability.'' : outputs.flow.result.summary}],
            ''add'') }}'
      - to: coordinate
        when: outputs.flow.result.next in ['consult', 'submit', 'blocked']
        payload:
          action: ${{ outputs.flow.result.next }}
          requests: ${{ outputs.flow.result.consultations }}
          keys: ${{ outputs.flow.result.keys }}
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: outputs.flow.result.next == 'continue'
        payload:
          flow: '${{ jq([outputs.flow, {''message'': ''Continue the current phase.''}], ''add'') }}'
      - to: coordinate
        when: outputs.flow.threads.exists(k, outputs.flow.threads[k].status == 'running') || outputs.flow.jobs.exists(k, outputs.flow.jobs[k].status
          == 'running')
        payload:
          action: ${{ 'blocked' }}
          requests: ${{ [] }}
          keys: ${{ jq([outputs.flow.threads, outputs.flow.jobs], 'add | to_entries | map(select(.value.status == "running")
            | .key)') }}
          flow: ${{ outputs.flow }}
      - to: repair
        when: 'outputs.flow.phase == ''implement'' && (!outputs.flow.plan_keys.all(k, k in outputs.flow.jobs) || !outputs.flow.jobs.all(k,
          outputs.flow.jobs[k].status == ''completed'' && (outputs.flow.jobs[k].kind == ''create'' ? outputs.flow.jobs[k].?ready.orValue(false)
          : (outputs.flow.jobs[k].result.?merged.orValue(false) || outputs.flow.jobs[k].result.?disposition.orValue('''')
          in [''delegated'', ''unchanged'']))))'
        payload:
          flow: ${{ outputs.previous }}
          turn: ${{ outputs.turn }}
          issues: ${{ ['Required child work has not succeeded. Reconcile recorded results; do not claim completion or duplicate
            jobs.'] }}
      - to: repair
        when: "outputs.flow.phase in ['design', 'test-plan'] && !outputs.flow.plan_keys.all(k,\n  k in outputs.flow.threads\
          \ && outputs.flow.threads[k].request.kind != 'expert'\n  && outputs.flow.threads[k].?result.orValue({}).?outcome.orValue('')\
          \ == 'agreed')"
        payload:
          flow: ${{ outputs.previous }}
          turn: ${{ outputs.turn }}
          issues: '${{ ["Design prerequisite keys must identify this build''s agreed non-expert serving requests in the workflow
            inputs. " + "Parent request identifiers are not local prerequisites. Return keys: [] when none are needed. " +
            (outputs.flow.phase == ''design'' ? "Correct the design review response before advancing to test-plan." : "Return
            next: redesign to correct the design''s prerequisite list before requesting test-plan review again.")] }}'
      - to: test_next
        when: outputs.flow.phase == 'design'
        payload:
          flow: ${{ outputs.flow }}
      - to: rebase
        when: outputs.flow.phase == 'implement'
        payload:
          flow: ${{ outputs.flow }}
      - to: specialists
        when: true
        payload:
          flow: ${{ outputs.flow }}
      vars:
        issues: "${{ (states.work.outputs.turn.result.?response.orValue({}).?next.orValue('') == 'ask_user' ? [] : states.work.outputs.turn.?issues.orValue([]))\n\
          \ + (states.work.outputs.turn.result.?status.orValue('failed') != 'completed' ? ['Agent did not complete: ' + states.work.outputs.turn.result.?errorMessage.orValue('No\
          \ completed response.')] : [])\n + (!states.work.outputs.turn.result.?output_schema_valid.orValue(false) ? ['The\
          \ operation did not produce a schema-valid response. Correct the response using the supplied schema.'] : [])\n +\
          \ (states.work.outputs.turn.result.?session.orValue(null) == null ? ['The response has no resumable session checkpoint.']\
          \ : [])\n + (size(states.work.outputs.turn.jobs.?job_ids.orValue([])) > 0 && (states.work.outputs.flow.phase !=\
          \ 'implement' || has(states.work.outputs.flow.repair_base_documents)) ? ['The agent submitted jobs directly; stop\
          \ and review these effects before continuing.'] : [])\n + (states.work.outputs.turn.result.?status.orValue('failed')\
          \ == 'completed' && states.work.outputs.turn.result.?output_schema_valid.orValue(false) ?\n    (states.work.outputs.turn.result.response.next\
          \ != 'ask_user' && states.work.outputs.turn.result.response.files.exists(f, f.path.startsWith('/') || f.path.contains('..')\
          \ || f.path.contains('\\\\') || f.path in ['__git_state_thin_pack__']) ? ['Select only safe deliverable artifact\
          \ names, excluding workflow control files.'] : [])\n  + (states.work.outputs.turn.result.response.next != 'ask_user'\
          \ && size(states.work.outputs.turn.result.response.files.map(f, f.path)) != size(jq(states.work.outputs.turn.result.response.files,\
          \ 'map(.path) | unique')) ? ['List each resolved artifact only once.'] : [])\n  + (states.work.outputs.turn.result.response.next\
          \ == 'review' && !states.work.outputs.turn.result.response.files.exists(f, f.path == {'design': 'design.md', 'test-plan':\
          \ 'test-statements.md', 'implement': 'implementation.md'}[states.work.outputs.flow.phase]) ? ['Review requires '\
          \ + {'design': 'design.md', 'test-plan': 'test-statements.md', 'implement': 'implementation.md'}[states.work.outputs.flow.phase]\
          \ + ' in the returned files.'] : [])\n  + (states.work.outputs.turn.result.response.next == 'ask_user' && (size(states.work.outputs.turn.result.response.questions)\
          \ == 0 || states.work.outputs.turn.result.response.questions.exists(q, q.id == 'annotations')) ? ['ask_user requires\
          \ focused questions; annotations is a reserved question id.'] : [])\n  + (states.work.outputs.turn.result.response.next\
          \ == 'consult' && size(states.work.outputs.turn.result.response.consultations) == 0 ? ['consult requires at least\
          \ one consultation request.'] : [])\n  + (states.work.outputs.turn.result.response.next == 'submit'\
          \ && size(states.work.outputs.turn.result.response.keys) == 0 ? ['submit requires explicit prerequisite\
          \ keys.'] : [])\n : []) + (states.work.outputs.flow.phase == 'implement' && states.work.outputs.turn.result.?response.orValue({}).?next.orValue('')\
          \ == 'review' && !states.work.outputs.turn.result.response.files.exists(f, f.path == 'test-results.md') ? ['Publish\
          \ test-results.md mapping statement IDs to results and evidence.'] : []) + (states.work.outputs.flow.phase == 'implement'\
          \ && states.work.outputs.turn.result.?response.orValue({}).?files.orValue([]).exists(f, f.path == 'test-statements.md')\
          \ ? ['Formal expectations are fixed before implementation. Return redesign to update their plan with preserved expectations\
          \ and any required deprecation.'] : []) }}"
    design_next:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: '${{ jq([inputs.flow, {''phase'': ''design'', ''event'': ''redesign''}], ''add | del(.reviews.outcome,
          .verification, .verification_artifacts, .assessment, .commit_message, .reviewed_change_digest, .reviewed_hook_digest)'')
          }}'
      transitions:
      - to: design_context
        when: true
        payload:
          flow: ${{ outputs.flow }}
    test_next:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: '${{ jq([inputs.flow, {''phase'': ''test-plan'', ''event'': ''test_statements''}], ''add'') }}'
      transitions:
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    coordinate:
      inputs:
        flow: ${{ transition.payload.flow }}
        action: ${{ transition.payload.action }}
        requests: ${{ transition.payload.requests }}
        keys: ${{ transition.payload.keys }}
      sequence:
      - id: coordinate
        include: ./coordinate.yaml
        inputs:
          flow: ${{ inputs.flow }}
          action: ${{ inputs.action }}
          requests: ${{ inputs.requests }}
          keys: ${{ inputs.keys }}
      outputs:
        valid: ${{ sequence.coordinate.outputs.valid }}
        flow: '${{ jq([sequence.coordinate.outputs.flow, {''event'': ''coordination''}], ''add'') }}'
      transitions:
      - to: repair
        when: '!outputs.valid'
        payload:
          flow: '${{ jq([outputs.flow, {''repair_attempts'': states.work.outputs.flow.?repair_attempts.orValue(0),
            ''repair_base_documents'': states.work.outputs.flow.?repair_base_documents.orValue(states.work.outputs.flow.documents)}],
            ''add'') }}'
          turn: '${{ jq([states.work.outputs.turn, {''result'': jq([states.work.outputs.turn.result, {''session'':
            outputs.flow.session}], ''add'')}], ''add'') }}'
          issues: ${{ ['Use agreed serving requests before submission, stable keys, and recorded child outcomes.']
            }}
      - to: stopped
        when: outputs.flow.?pending_outside.orValue(false)
        payload:
          flow: ${{ jq([outputs.flow, {'disposition':'outside'}], 'add') }}
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    questions:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: review
        include: ./review.yaml
        inputs:
          annotations: ${{ inputs.flow.?annotations.orValue([]) }}
          title: Clarify the current build
          documents: ${{ jq(inputs.flow.documents, 'del(."build-settings.json", ."configuration.md", ."design-context.md")')
            }}
          fields: '${{ inputs.flow.result.questions + [{''id'': ''annotations'', ''type'': ''file_upload'', ''question'':
            ''Optional supporting documents or annotations.'', ''required'': false}] }}'
      outputs:
        flow: '${{ jq([inputs.flow, {''documents'': sequence.review.outputs.documents, ''feedback_documents'': sequence.review.outputs.response.?artifact_refs.orValue({}),
          ''feedback'': sequence.review.outputs.response.fields, ''event'': ''human_answer''}], ''add'') }}'
      transitions:
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    assessment:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: assess
        include: ./inspect.yaml
        inputs:
          role: assessment
          request: ${{ inputs.flow.request }}
          documents: ${{ inputs.flow.documents }}
          evidence: '${{ {''verification'': inputs.flow.verification, ''dependencies'': inputs.flow.jobs} }}'
          evidence_documents: ${{ inputs.flow.verification_artifacts }}
          guidance: ${{ inputs.flow.hook_settings.?prompt_additions.orValue({}).?outcome_assessment.orValue('') }}
      outputs:
        flow: '${{ jq([inputs.flow, {''assessment'':sequence.assess.outputs.approved ? ''pass'' : ''revise'', ''assessment_next'':sequence.assess.outputs.next,
          ''documents'':sequence.assess.outputs.documents, ''annotations'':inputs.flow.annotations + sequence.assess.outputs.annotations,
          ''event'':''assessment'', ''last_finding'':sequence.assess.outputs.response.summary, ''last_finding_candidate'':inputs.flow.candidate.head}],
          ''add'') }}'
        next: ${{ sequence.assess.outputs.next }}
        previous: ${{ inputs.flow }}
        finding: ${{ sequence.assess.outputs.response.summary }}
      transitions:
      - to: intervention
        when: outputs.next == 'intervention'
        payload:
          flow: ${{ jq([outputs.flow, {'intervention_reason':outputs.finding}], 'add') }}
      - to: intervention
        when: outputs.flow.assessment != 'pass' && outputs.previous.?last_finding.orValue('') == outputs.finding && outputs.previous.?last_finding_candidate.orValue('')
          == outputs.previous.candidate.head
        payload:
          flow: ${{ jq([outputs.flow, {'intervention_reason':'The same assessment finding recurred without a candidate change.
            Resolve the missing evidence, capability, or requirement described in feedback/assessment.md.'}], 'add') }}
      - to: accounting
        when: outputs.flow.assessment == 'pass'
        payload:
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') && transition.payload.flow.?verification_artifacts.orValue({}).exists(k,
          [k, 'error/' + k, 'error/' + jq(k, 'ltrimstr("_c2j/execution/")'),
          'verification/' + jq(k, 'ltrimstr("_c2j/execution/")'), 'error/legacy/' + jq(k, 'ltrimstr("_c2j/command/")')].exists(name,
          failure.message.contains('"' + name + '"')))
        to: dispatch
        payload:
          flow: ${{ jq([transition.payload.flow, {'event':'verification', 'verification':{'status':'failed', 'summary':failure.message},
            'verification_artifacts':{} }], 'add | del(.reviews.outcome, .assessment, .commit_message, .reuse_merge_approval,
            .chase_pending)') }}
    implementation_next:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: '${{ jq([inputs.flow, {''phase'': ''implement'', ''event'': ''implementation''}], ''add'') }}'
      transitions:
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    rebase:
      retry:
        maximum_attempts: 1
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: resolve_upstream_head
        op: command_execution
        const: true
        inputs:
          env:
            REPO: ${{ context.git.repo }}
            BRANCH: ${{ context.git.ref }}
          run: |
            set -eu
            git ls-remote --exit-code -- "$REPO" "refs/heads/${BRANCH#refs/heads/}"
      - id: rebase_candidate
        op: rebase
        retry:
          maximum_attempts: 1
        inputs:
          target_base_hash: ${{ jq(sequence.resolve_upstream_head.outputs.stdout, 'split("\t")[0]') }}
      outputs:
        flow: ${{ jq(inputs.flow, 'del(.rebase_recovery_pending)') }}
      transitions:
      - to: prepare
        when: 'true'
        payload:
          flow: ${{ outputs.flow }}
      catch:
      - id: repair_restored_rebase_conflict
        when: transition.payload.flow.?rebase_repairs.orValue(0) < 2 && jq(json_parse(json_stringify(failure)),
          states.start.outputs.rebase_policy)
        to: rebase_repair
        payload:
          flow: ${{ transition.payload.flow }}
    rebase_repair:
      inputs:
        flow: ${{ transition.payload.flow }}
        failure: ${{ transition.failure }}
      sequence:
      - id: recovery
        include: ./rebase-recovery.yaml
        inputs:
          flow: ${{ inputs.flow }}
          failure: ${{ inputs.failure }}
      outputs:
        flow: ${{ sequence.recovery.outputs.flow }}
      transitions:
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    inspect_chased_candidate:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: candidate
        include: ./git-candidate.yaml
        inputs:
          documents: ${{ inputs.flow.documents }}
          evidence_documents: ${{ inputs.flow.verification_artifacts }}
      outputs:
        reusable: ${{ (size(sequence.candidate.outputs.candidate.files) == 0 || sequence.candidate.outputs.candidate.change_digest
          == inputs.flow.reviewed_change_digest) && inputs.flow.hook_digest == inputs.flow.?reviewed_hook_digest.orValue('')
          }}
        flow: '${{ jq([inputs.flow, {''chase_pending'': false, ''candidate_changed'': size(sequence.candidate.outputs.candidate.files)
          > 0, ''documents'': jq([inputs.flow.documents, sequence.candidate.outputs.documents], ''add'')}], ''add'')
          }}'
      transitions:
      - to: stopped
        when: outputs.reusable && !outputs.flow.candidate_changed
        payload:
          flow: ${{ jq([outputs.flow, {'disposition':size(outputs.flow.jobs)>0 ? 'delegated':'unchanged'}], 'add')
            }}
      - to: merge
        when: outputs.reusable
        payload:
          flow: ${{ outputs.flow }}
      - to: assessment
        when: true
        payload:
          flow: ${{ jq(outputs.flow, 'del(.reviews.outcome, .assessment, .commit_message, .reviewed_change_digest,
            .reuse_merge_approval)') }}
      catch:
      - when: failure.kind != 'cancellation' && failure.message.contains('artifact binding') && transition.payload.flow.?verification_artifacts.orValue({}).exists(k,
          [k, 'error/' + k, 'error/' + jq(k, 'ltrimstr("_c2j/execution/")'),
          'verification/' + jq(k, 'ltrimstr("_c2j/execution/")'), 'error/legacy/' + jq(k, 'ltrimstr("_c2j/command/")')].exists(name,
          failure.message.contains('"' + name + '"')))
        to: dispatch
        payload:
          flow: ${{ jq([transition.payload.flow, {'event':'verification', 'verification':{'status':'failed', 'summary':failure.message},
            'verification_artifacts':{} }], 'add | del(.reviews.outcome, .assessment, .commit_message, .reuse_merge_approval,
            .chase_pending)') }}
    verify:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: verify
        include: ./verify.yaml
        inputs:
          request: ${{ inputs.flow.request }}
          target_directory: ${{ inputs.flow.target_directory }}
          documents: ${{ inputs.flow.documents }}
          settings: ${{ inputs.flow.settings_artifact }}
          require_verification: ${{ inputs.flow.require_verification }}
          candidate: ${{ inputs.flow.candidate.head }}
      outputs:
        ok: ${{ sequence.verify.outputs.allowed }}
        flow: '${{ jq([inputs.flow, {''verification'': sequence.verify.outputs.evidence, ''verification_artifacts'':sequence.verify.outputs.artifact_refs,
          ''event'':''verification'', ''verification_allowed'':sequence.verify.outputs.allowed}], ''add'') }}'
      transitions:
      - to: inspect_chased_candidate
        when: outputs.ok && outputs.flow.?chase_pending.orValue(false)
        payload:
          flow: ${{ outputs.flow }}
      - to: assessment
        when: outputs.ok
        payload:
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: true
        payload:
          flow: ${{ jq(outputs.flow, 'del(.reviews.outcome, .assessment, .commit_message, .reviewed_change_digest,
            .reviewed_hook_digest, .reuse_merge_approval, .chase_pending, .review_hint)') }}
    accounting:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: review
        include: ./inspect.yaml
        inputs:
          role: summary
          request: ${{ inputs.flow.request }}
          documents: ${{ inputs.flow.documents }}
          evidence: '${{ {''verification'': inputs.flow.verification, ''dependencies'': inputs.flow.jobs, ''candidate'': inputs.flow.candidate}
            }}'
          evidence_documents: ${{ inputs.flow.verification_artifacts }}
          guidance: ${{ inputs.flow.hook_settings.?prompt_additions.orValue({}).?outcome_assessment.orValue('') }}
      outputs:
        approved: ${{ sequence.review.outputs.approved }}
        flow: '${{ jq([inputs.flow, {''reviewed_hook_digest'': inputs.flow.hook_digest, ''reviewed_change_digest'': inputs.flow.candidate.change_digest,
          ''commit_message'': jq([sequence.review.outputs.response.subject, sequence.review.outputs.response.summary, inputs.flow.candidate.job_url],
          ''join([10,10] | implode)''), ''documents'': sequence.review.outputs.documents, ''annotations'': inputs.flow.annotations
          + sequence.review.outputs.annotations, ''event'': ''merge_summary''}], ''add'') }}'
      transitions:
      - to: accept
        when: outputs.approved
        payload:
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    accept:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: outcome_review
        include: ./review.yaml
        inputs:
          annotations: ${{ inputs.flow.?annotations.orValue([]) }}
          title: '${{ inputs.flow.candidate_changed ? ''Review outcome, verification evidence, and file accounting'' : ''Review
            no-change rationale and verification evidence'' }}'
          documents: ${{ jq([inputs.flow.documents, inputs.flow.verification_artifacts], 'add') }}
          fields:
          - id: decision
            type: multiple_choice
            question: '${{ inputs.flow.candidate_changed ? ''Accept the file accounting, reported verification status, and
              proposed commit message in merge-review.md, and merge this candidate into the target branch?'' : ''Accept the
              rationale in merge-review.md that this request is satisfied without repository changes, and complete this job?''
              }}'
            required: true
            options:
            - value: accept
              label: '${{ inputs.flow.candidate_changed ? ''Accept and merge'' : ''Accept no-change outcome'' }}'
            - value: revise
              label: Revise implementation
            - value: redesign
              label: Change requirements or design
            - value: cancel
              label: Cancel
          - id: feedback
            type: paragraph_text
            question: ${{ inputs.flow.?review_hint.orValue('Requested changes or guidance (required when requesting changes).')
              }}
            required: false
          - id: annotations
            type: file_upload
            question: Optional annotated documents; uploads request revision and another review.
            required: false
      outputs:
        response: ${{ sequence.outcome_review.outputs.response }}
        changed: ${{ sequence.outcome_review.outputs.changed }}
        flow: '${{ jq([inputs.flow, {''documents'': jq([inputs.flow.documents, sequence.outcome_review.outputs.response.?artifact_refs.orValue({})],
          ''add''), ''feedback_documents'': sequence.outcome_review.outputs.response.?artifact_refs.orValue({}), ''feedback'':
          sequence.outcome_review.outputs.response.fields, ''reviews'': jq([inputs.flow.reviews, {''outcome'': sequence.outcome_review.outputs.response.?receipt.orValue({})}],
          ''add''), ''event'': ''human_outcome''}], ''add'') }}'
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''cancelled''}], ''add'') }}'
      - to: stopped
        when: outputs.response.fields.decision == 'accept' && !outputs.changed && !outputs.flow.candidate_changed && outputs.flow.verification.status
          in ['passed', 'skipped'] && outputs.flow.assessment == 'pass'
        payload:
          flow: '${{ jq([outputs.flow, {''disposition'': ''unchanged''}], ''add'') }}'
      - to: merge
        when: outputs.response.fields.decision == 'accept' && !outputs.changed && outputs.flow.verification.status in ['passed',
          'skipped'] && outputs.flow.assessment == 'pass' && outputs.flow.candidate_changed
        payload:
          flow: ${{ outputs.flow }}
      - to: design_next
        when: outputs.response.fields.decision == 'redesign' && outputs.changed
        payload:
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: outputs.changed
        payload:
          flow: ${{ outputs.flow }}
      - to: accept
        when: true
        payload:
          flow: '${{ jq([outputs.flow, {''review_hint'': ''Please describe the requested changes or attach annotated documents
            before requesting revision.''}], ''add'') }}'
    merge:
      retry:
        maximum_attempts: 1
      inputs:
        flow: ${{ transition.payload.flow }}
        base: ${{ context.git.execution.base_hash }}
      sequence:
      - id: squash_reviewed_candidate
        op: squash
        inputs:
          author: ${{ context.git.?author.orValue('') }}
          commit_message: ${{ inputs.flow.commit_message }}
      - id: merge_reviewed_candidate
        op: merge
        retry:
          maximum_attempts: 1
        inputs:
          repo_path: ${{ context.environment.op.worktree_path }}
          upstream_repo: ${{ context.git.repo }}
          upstream_branch: ${{ context.git.ref }}
      - id: publish
        include: ./hook-publish.yaml
        workspace:
          cell: ${{ context.git.repo }}
          ref: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        inputs:
          request: ${{ inputs.flow.request }}
          target_directory: ${{ inputs.flow.target_directory }}
          documents: ${{ jq([inputs.flow.documents, inputs.flow.verification_artifacts], 'add') }}
          settings: ${{ inputs.flow.settings_artifact }}
          merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
          target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
          base: ${{ inputs.base }}
        catch:
        - when: failure.kind != 'cancellation'
          continue:
            outputs:
              result: ${{ {'status':'failed','ok':false,'summary':failure.message,'failure':json_parse(json_stringify(failure))}
                }}
              artifact_refs: {}
      outputs:
        flow: '${{ jq([inputs.flow, {''disposition'': ''implemented'', ''publication'': sequence.publish.outputs.result,
          ''documents'': jq([inputs.flow.documents, sequence.publish.outputs.artifact_refs], ''add'')}], ''add'')
          }}'
        merged_hash: ${{ sequence.merge_reviewed_candidate.outputs.merged_hash }}
        target_branch: ${{ sequence.merge_reviewed_candidate.outputs.target_branch }}
      catch:
      - id: chase_advanced_upstream
        when: failure.kind == 'task_error' && failure.code == 'MERGE_UPSTREAM_ADVANCED' && failure.node.op == 'merge'
          && failure.node.id == 'merge_reviewed_candidate' && transition.payload.flow.merge_chases < 3
        to: rebase
        payload:
          flow: '${{ jq([transition.payload.flow, {''merge_chases'': int(transition.payload.flow.merge_chases) +
            1, ''chase_pending'': true}], ''add | del(.verification, .reuse_merge_approval, .review_hint)'') }}'
      transitions:
      - to: reject_invalid_build_request
        when: outputs.flow.publication.status == 'failed'
        payload:
          reason: '${{ ''Merge succeeded but publication failed: '' + outputs.flow.publication.summary }}'
    stopped:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence: []
      outputs:
        flow: ${{ inputs.flow }}
    reject_invalid_build_request:
      id: reject_invalid_build_request
      op: command_execution
      inputs:
        run: exit 1
      catch:
      - when: true
        fail:
          code: BUILD_REJECTED
          message: ${{ transition.payload.reason }}
    repair:
      inputs:
        flow: ${{ transition.payload.flow }}
        turn: ${{ transition.payload.turn }}
        issues: ${{ transition.payload.issues }}
      sequence: []
      outputs:
        flow: '${{ jq([inputs.flow, {''event'': ''response_invalid'', ''issues'': inputs.issues, ''session'': inputs.turn.result.?session.orValue(inputs.flow.session),
          ''repair_base_documents'': inputs.flow.?repair_base_documents.orValue(inputs.flow.documents), ''repair_artifacts'':
          inputs.turn.artifacts, ''documents'': jq([inputs.flow.documents, inputs.turn.artifacts], ''add''), ''repair_attempts'':
          int(inputs.flow.?repair_attempts.orValue(0)) + 1}], ''add'') }}'
      transitions:
      - to: iteration_limit
        when: outputs.flow.repair_attempts > 2
        payload:
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    design_context:
      inputs:
        flow: '${{ jq([transition.payload.flow, {''design_round'': int(transition.payload.flow.?design_round.orValue(0))
          + 1}], ''add'') }}'
      sequence:
      - id: research
        include: ./hook-before_design.yaml
        inputs:
          request: ${{ inputs.flow.request }}
          target_directory: ${{ inputs.flow.target_directory }}
          documents: ${{ inputs.flow.documents }}
          settings: ${{ inputs.flow.settings_artifact }}
      - id: specialists
        include: ./specialists.yaml
        inputs:
          checkpoint: before_design
          flow: '${{ jq([inputs.flow, {''documents'': jq([inputs.flow.documents, sequence.research.outputs.artifact_refs],
            ''add'')}], ''add'') }}'
      outputs:
        flow: '${{ jq([sequence.specialists.outputs.flow, {''design_context'': sequence.research.outputs.result,
          ''event'':''design_context''}], ''add'') }}'
        passed: ${{ sequence.specialists.outputs.passed }}
      transitions:
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
    prepare:
      inputs:
        flow: '${{ jq([transition.payload.flow, {''validation_round'': int(transition.payload.flow.?validation_round.orValue(0))
          + 1}], ''add'') }}'
      sequence:
      - id: prepare
        include: ./hook-prepare.yaml
        inputs:
          request: ${{ inputs.flow.request }}
          target_directory: ${{ inputs.flow.target_directory }}
          documents: ${{ inputs.flow.documents }}
          settings: ${{ inputs.flow.settings_artifact }}
      - id: candidate
        include: ./git-candidate.yaml
      - id: identity
        include: ./hook-identity.yaml
      outputs:
        passed: ${{ sequence.prepare.outputs.result.status in ['passed', 'skipped'] }}
        flow: '${{ jq([inputs.flow, {''candidate'': sequence.candidate.outputs.candidate, ''candidate_changed'':
          size(sequence.candidate.outputs.candidate.files) > 0, ''hook_digest'': sequence.identity.outputs.digest,
          ''documents'': jq([inputs.flow.documents, sequence.prepare.outputs.artifact_refs, sequence.candidate.outputs.documents],
          ''add''), ''preparation'': sequence.prepare.outputs.result, ''event'':''preparation''}], ''add'') }}'
      transitions:
      - to: dispatch
        when: '!outputs.passed'
        payload:
          flow: ${{ outputs.flow }}
      - to: specialists
        when: true
        payload:
          flow: ${{ outputs.flow }}
    specialists:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: specialists
        include: ./specialists.yaml
        inputs:
          flow: ${{ inputs.flow }}
          checkpoint: '${{ inputs.flow.phase == ''test-plan'' ? ''plan_assessment'' : ''outcome_assessment'' }}'
      outputs:
        flow: ${{ sequence.specialists.outputs.flow }}
        passed: ${{ sequence.specialists.outputs.passed }}
      transitions:
      - to: implementation_next
        when: outputs.passed && outputs.flow.phase == 'test-plan'
        payload:
          flow: ${{ outputs.flow }}
      - to: design_next
        when: '!outputs.passed && outputs.flow.phase == ''test-plan'''
        payload:
          flow: ${{ outputs.flow }}
      - to: verify
        when: outputs.passed
        payload:
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: 'true'
        payload:
          flow: ${{ outputs.flow }}
    dispatch:
      inputs:
        flow: ${{ jq(transition.payload.flow, 'del(.review_hint, .reuse_merge_approval, .chase_pending)') }}
      sequence: []
      outputs:
        flow: ${{ inputs.flow }}
      transitions:
      - to: iteration_limit
        when: outputs.flow.iterations >= outputs.flow.max_iterations
        payload:
          flow: ${{ outputs.flow }}
      - to: work
        when: true
        payload:
          flow: '${{ jq([outputs.flow, {''iterations'': int(outputs.flow.iterations) + 1}], ''add'') }}'
    iteration_limit:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: direction
        include: ./review.yaml
        inputs:
          title: Build needs direction after bounded attempts
          documents: ${{ inputs.flow.documents }}
          annotations: ${{ inputs.flow.annotations }}
          fields:
          - id: decision
            type: multiple_choice
            question: Continue with direction or cancel?
            required: true
            options:
            - value: continue
              label: Continue
            - value: cancel
              label: Cancel
          - id: feedback
            type: paragraph_text
            question: Direction for another bounded attempt.
            required: false
      outputs:
        response: ${{ sequence.direction.outputs.response }}
        changed: ${{ sequence.direction.outputs.changed }}
        flow: ${{ jq([inputs.flow, {'iterations':0, 'repair_attempts':0, 'feedback':sequence.direction.outputs.response.fields,
          'event':'human_direction'}], 'add') }}
      transitions:
      - to: stopped
        when: outputs.response.fields.decision == 'cancel'
        payload:
          flow: ${{ jq([outputs.flow, {'disposition':'cancelled'}], 'add') }}
      - to: dispatch
        when: outputs.response.fields.decision == 'continue'
        payload:
          flow: ${{ outputs.flow }}
      - to: iteration_limit
        when: true
        payload:
          flow: ${{ outputs.flow }}
    intervention:
      inputs:
        flow: ${{ transition.payload.flow }}
      sequence:
      - id: request_intervention
        include: ./review.yaml
        inputs:
          title: Resolve a specific build blocker
          documents: ${{ inputs.flow.documents }}
          annotations: ${{ inputs.flow.annotations }}
          fields:
          - id: decision
            type: multiple_choice
            question: ${{ inputs.flow.?intervention_reason.orValue('Resolve the reported blocker before retrying.') }}
            required: true
            options:
            - value: continue
              label: Capability or evidence supplied
            - value: redesign
              label: Change requirements or validation plan
            - value: cancel
              label: Cancel
          - id: feedback
            type: paragraph_text
            question: Describe the intervention, responsible actor, and what changed.
            required: true
          - id: annotations
            type: file_upload
            question: Supporting evidence or revised direction
            required: false
      outputs:
        decision: ${{ sequence.request_intervention.outputs.response.fields.decision }}
        flow: ${{ jq([inputs.flow, {'event':'human_direction', 'validation_failed':false, 'documents':sequence.request_intervention.outputs.documents,
          'feedback':sequence.request_intervention.outputs.response.fields, 'feedback_documents':sequence.request_intervention.outputs.response.?artifact_refs.orValue({})}],
          'add | del(.last_finding, .last_finding_candidate)') }}
      transitions:
      - to: stopped
        when: outputs.decision == 'cancel'
        payload:
          flow: ${{ jq([outputs.flow, {'disposition':'cancelled'}], 'add') }}
      - to: design_next
        when: outputs.decision == 'redesign'
        payload:
          flow: ${{ outputs.flow }}
      - to: dispatch
        when: true
        payload:
          flow: ${{ outputs.flow }}
outputs:
  annotations: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).?annotations.orValue([])
    }}
  merged: ${{ nonempty(state_output('merge', 'merged_hash', '')) }}
  merged_hash: ${{ state_output('merge', 'merged_hash', '') }}
  target_branch: ${{ state_output('merge', 'target_branch', '') }}
  session: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).session
    }}
  assistant_summary: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).result.?summary.orValue('')
    }}
  disposition: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).?disposition.orValue('incomplete')
    }}
  result: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).result }}
  artifact_refs: ${{ jq([state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).documents,
    state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).?verification_artifacts.orValue({})],
    'add') }}
  consultations: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).threads
    }}
  dependencies: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).jobs
    }}
  reviews: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).reviews
    }}
  verification: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).?verification.orValue({})
    }}
  publication: ${{ state_output('merge', 'flow', {}).?publication.orValue({}) }}
  rebase_repairs: ${{ state_output('merge', 'flow', state_output('stopped', 'flow', state_output('record', 'flow', {}))).?rebase_repairs.orValue(0)
    }}
