id: adaptive-validation-goals
inputs:
  jobs: ${{ inputs.?jobs.orValue({}) }}
  allowed: ${{ inputs.allowed }}
  targets: ${{ jq(inputs.jobs.?goal_ids.orValue([]),'unique').map(g,{'goal':g}) }}
state:
  initial: validate
  states:
    pick:
      inputs:
        allowed: ${{ inputs.allowed }}
        jobs: ${{ inputs.jobs }}
        index: ${{ transition.payload.?index.orValue(0) }}
        documents: ${{ transition.payload.?documents.orValue({}) }}
        failed: ${{ transition.payload.?failed.orValue(false) }}
      sequence: []
      outputs:
        index: ${{ inputs.index }}
        documents: ${{ inputs.documents }}
        failed: ${{ inputs.failed }}
      transitions:
      - to: await_validation_goal
        when: inputs.allowed && outputs.index < size(inputs.targets)
      - to: done
        when: true
    await_validation_goal:
      include: ./await-goal.yaml
      inputs:
        goal: ${{ inputs.targets[states.pick.outputs.index].goal }}
      transitions:
      - to: record
        when: true
    record:
      include: ./document-bindings.yaml
      inputs:
        prefix: ${{ 'goals/validation-' + states.await_validation_goal.outputs.result.goal_id + '/' }}
        documents: |-
          ${{ jq({'errors':states.await_validation_goal.outputs.errors,'result':states.await_validation_goal.outputs.result}, vars.status_documents) }}
      transitions:
      - to: pick
        when: true
        payload:
          index: ${{ states.pick.outputs.index + 1 }}
          documents: ${{ jq([states.pick.outputs.documents, outputs.documents], 'add') }}
          failed: |-
            ${{ states.pick.outputs.failed || states.await_validation_goal.outputs.result.status != 'completed' ||
              states.await_validation_goal.outputs.result.?outputs.orValue({}).?ok.orValue(true) == false ||
              states.await_validation_goal.outputs.result.?outputs.orValue({}).?status.orValue('passed') in ['failed', 'cancelled'] }}
    done:
      sequence: []
    validate:
      sequence: []
      transitions:
      - to: invalid
        when: inputs.allowed && size(inputs.jobs.?job_ids.orValue([]))>0 && size(inputs.jobs.?goal_ids.orValue([])) == 0
      - to: pick
        when: true
    invalid:
      include: ./operational-failure.yaml
      inputs:
        reason: Child submissions must expose native goal_ids. No job-ID fallback is supported.
outputs:
  documents: ${{ states.pick.outputs.documents }}
  failed: ${{ states.pick.outputs.failed }}
vars:
  status_documents: |
    . as $v |
    $v.errors + ($v.result.outputs.artifact_refs // {}) +
    {"status.md": {kind:"value", name:"status.md", format:"text", value:
      ("Validation goal: " + $v.result.goal_id + "\nSuccessful attempt: " +
       ($v.result.result.job // "") + "\nStatus: " + $v.result.status +
       "\nReported outcome: " + ($v.result.outputs.status // "not supplied") +
       "\n" + ($v.result.failure_message // ""))}}
