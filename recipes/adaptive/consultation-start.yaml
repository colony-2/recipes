id: adaptive-consultation-start
inputs:
  annotations: ${{ inputs.annotations }}
  request: ${{ inputs.request }}
  consultant: ${{ inputs.consultant }}
  requester_session: ${{ inputs.requester_session }}
  documents: ${{ inputs.documents }}
  max_iterations: ${{ inputs.max_iterations }}
  cell: ${{ inputs.cell }}
  topic: ${{ inputs.topic }}
  thread: ${{ inputs.thread }}
  depth: ${{ inputs.depth }}
  requester_ref: ${{ inputs.requester_ref }}
sequence: []
outputs:
  valid: |-
    ${{ inputs.max_iterations >= 1 && inputs.max_iterations == int(inputs.max_iterations)
        && inputs.documents.all(k, k == inputs.documents[k].name
             && !(k in ['conversation.json', '__git_state_thin_pack__',
                        'diff_from_parent.diff', 'diff_from_base.diff']))
        && nonempty(inputs.topic) && nonempty(inputs.request) && nonempty(inputs.consultant.?role.orValue('')) }}
  conversation: |-
    ${{ {'exchange_number':0,'depth': inputs.depth, 'thread': inputs.thread,
           'request': inputs.request,
           'consultant': jq([{'cell': '', 'ref': 'main'}, inputs.consultant], 'add'),
           'requester_cell': inputs.cell, 'requester_ref': inputs.requester_ref,
           'requester_start_session': inputs.requester_session,
           'requester_session': inputs.requester_session, 'consultant_session': {},
           'iteration': 0, 'round_iterations': 0, 'round': 1,
           'max_iterations': int(inputs.max_iterations),
           'next': 'consultant', 'outcome': 'continue',
           'message': inputs.request, 'direction': '',
           'seen': {'requester': 0, 'consultant': 0},
           'annotations': inputs.annotations, 'documents': inputs.documents, 'final_artifacts': {},
           'transcript': [{'participant': 'requester', 'iteration': 1,
             'thinking': inputs.request, 'files': inputs.documents}]} }}
