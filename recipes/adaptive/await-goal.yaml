id: adaptive-await-goal
inputs:
  goal: ${{ inputs.goal }}
state:
  initial: wait
  states:
    wait:
      id: wait
      op: recipe.await_result_soft
      inputs:
        target:
          goal: ${{ inputs.goal }}
        wait:
          condition: success
          "on": goal
        return_when: terminal
      transitions:
      - to: pick
        when: outputs.status != 'completed'
    pick:
      sequence: []
      inputs:
        index: ${{ transition.payload.?index.orValue(0) }}
      outputs:
        index: ${{ inputs.index }}
      transitions:
      - to: attempt
        when: outputs.index < size(states.wait.outputs.?goal_failure.orValue({}).?terminalJobIds.orValue([]))
    attempt:
      id: attempt
      op: recipe.await_result_soft
      inputs:
        target:
          job: ${{ states.wait.outputs.goal_failure.terminalJobIds[states.pick.outputs.index] }}
        wait:
          condition: complete
          "on": job
        return_when: current_status
      transitions:
      - to: evidence
        when: true
    evidence:
      include: ./error-documents.yaml
      inputs:
        name: ${{ 'attempt-' + string(states.pick.outputs.index) + '/failure.md' }}
        summary: ${{ states.attempt.outputs.?failure_message.orValue('The goal was explicitly failed.') }}
        artifacts: ${{ jq(states.attempt.outputs.?artifacts.orValue({}), 'with_entries(select(.key !=
          "__git_state_thin_pack__" and .key != "diff_from_parent.diff" and .key != "diff_from_base.diff")) | to_entries
          | map(.key = ("attempt-'+string(states.pick.outputs.index)+'/" + .key)) | from_entries') }}
      transitions:
      - to: pick
        when: true
        payload:
          index: ${{ states.pick.outputs.index + 1 }}
outputs:
  result: ${{ states.wait.outputs }}
  errors: "${{ state_exists('evidence') ? jq(states.evidence.runs.map(r,r.outputs.documents) + [states.evidence.outputs.documents],
    'add') : {} }}"
