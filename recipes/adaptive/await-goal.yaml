id: adaptive-await-goal
inputs:
  goal: ${{ inputs.goal }}
state:
  initial: wait
  states:
    wait:
      id: wait
      op: recipe.await_result_soft
      inputs:
        target:
          goal: ${{ inputs.goal }}
        wait:
          condition: success
          on: goal
        return_when: terminal
      transitions:
      - to: pick
        when: outputs.status != 'completed'
    pick:
      sequence: []
      inputs:
        index: ${{ transition.payload.?index.orValue(0) }}
      outputs:
        index: ${{ inputs.index }}
      transitions:
      - to: evidence
        when: outputs.index < size(states.wait.outputs.?goal_failure.orValue({}).?terminalJobIds.orValue([]))
    evidence:
      include: ./goal-attempt-errors.yaml
      inputs:
        job: ${{ states.wait.outputs.goal_failure.terminalJobIds[states.pick.outputs.index] }}
        directory: ${{ 'error/attempt-' + string(states.pick.outputs.index) }}
      transitions:
      - to: pick
        when: true
        payload:
          index: ${{ states.pick.outputs.index + 1 }}
outputs:
  result: ${{ states.wait.outputs }}
  errors: "${{ state_exists('evidence') ? jq(states.evidence.runs.map(r,r.outputs.documents) + [states.evidence.outputs.documents],
    'add') : {} }}"
