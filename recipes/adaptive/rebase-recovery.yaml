id: adaptive-rebase-recovery
inputs:
  failure: ${{ json_parse(json_stringify(inputs.failure)) }}
sequence:
- id: preserve_candidate
  op: command_execution
  inputs:
    env:
      BASE: ${{ inputs.failure.attrs.rebase.base_hash }}
      CANDIDATE: ${{ inputs.failure.attrs.rebase.candidate_hash }}
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      set -eu
      test "$(git rev-parse HEAD)" = "$CANDIDATE"
      test -z "$(git status --porcelain)"
      git diff --binary --no-ext-diff --no-renames "$BASE" "$CANDIDATE" > "$OUTBOX/candidate.diff"
      git log --format=fuller "$BASE..$CANDIDATE" > "$OUTBOX/commits.log"
      # Full candidate delta is durable evidence; only this known clean candidate is reset.
      git reset --hard "$BASE" >/dev/null
- id: adopt_recorded_target
  op: rebase
  retry:
    maximum_attempts: 1
  inputs:
    target_base_hash: ${{ inputs.failure.attrs.rebase.target_base_hash }}
- id: errors
  include: ./error-documents.yaml
  inputs:
    name: rebase/recovery.md
    summary: '${{ ''The recipe saved local changes and adopted the target. Reconcile the saved changes without rebasing.\nBase:
      '' + inputs.failure.attrs.rebase.base_hash + ''\nTarget: '' + inputs.failure.attrs.rebase.target_base_hash }}'
    artifacts: ${{ jq([inputs.failure.attrs.rebase.diagnostics, sequence.preserve_candidate.artifacts], 'add | to_entries
      | map(.key = ("rebase/" + (.key|ltrimstr("_c2j/rebase/"))) | .value.name = .key) | from_entries') }}
outputs:
  documents: ${{ sequence.errors.outputs.documents }}
