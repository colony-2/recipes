id: adaptive-goal-attempt-errors
inputs:
  job: ${{ inputs.job }}
  directory: ${{ inputs.?directory.orValue('error') }}
sequence:
- id: attempt
  op: recipe.await_result_soft
  inputs:
    target:
      job: ${{ inputs.job }}
    wait:
      condition: complete
      on: job
    return_when: current_status
- id: errors
  include: ./error-documents.yaml
  inputs:
    directory: ${{ inputs.directory }}
    summary: ${{ sequence.attempt.outputs.?failure_message.orValue('The goal was explicitly failed.') }}
    artifacts: ${{ sequence.attempt.outputs.?artifacts.orValue({}) }}
    failure: ${{ sequence.attempt.outputs.?outputs.orValue({}) }}
outputs:
  result: ${{ sequence.attempt.outputs }}
  documents: ${{ sequence.errors.outputs.documents }}
