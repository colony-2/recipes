id: adaptive-task-documents
inputs:
  documents: ${{ inputs.?documents.orValue({}) }}
  evidence: ${{ inputs.?evidence.orValue({}) }}
sequence: []
outputs:
  documents: ${{ jq(inputs.documents, vars.bindings) }}
  evidence: ${{ inputs.evidence }}
vars:
  bindings: |
    with_entries(select(.key != "build-settings.json" and .key != "context.json" and (.key|startswith("_c2j/")|not) and (.key|startswith("error/")|not))) |
    [., (to_entries | map(select(.key == "assessment.md" or (.key|startswith("specialists/"))) |
     .key = ("feedback/" + .key) | .value.name = .key) | from_entries)] | add
