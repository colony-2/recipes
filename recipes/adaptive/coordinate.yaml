id: adaptive-coordinate
inputs:
  requests: ${{ inputs.requests }}
  phase: ${{ inputs.phase }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  session: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  prefix: ${{ inputs.prefix }}
  history: ${{ inputs.?history.orValue([]) }}
  annotations: ${{ inputs.?annotations.orValue([]) }}
state:
  initial: validate
  states:
    validate:
      sequence: []
      transitions:
      - to: invalid
        when: (!nonempty(inputs.create_recipe) || !nonempty(inputs.root_cell)) &&
          inputs.requests.exists(r,r.?kind.orValue('') == 'create' || (r.action == 'execute' &&
          inputs.history.exists(h,h.action == 'consult' && h.reference == r.agreement && h.request.kind == 'create')))
      - to: invalid
        when: "size(inputs.requests) == 0 || inputs.requests.exists(r, r.action == 'consult' ? !nonempty(r.?request.orValue(''))
          || (!nonempty(r.?cell.orValue('')) && r.?kind.orValue('feature') == 'feature') : r.action == 'execute' ? inputs.phase
          != 'implement' || !inputs.history.exists(h,h.action == 'consult' && h.reference == r.agreement && h.result.outcome
          == 'agreed' && h.request.kind != 'expert') : r.action != 'await' || !nonempty(r.?goal.orValue('')))"
      - to: pick
        when: true
    pick:
      sequence: []
      inputs:
        index: ${{ transition.payload.?index.orValue(0) }}
        requests: ${{ inputs.requests }}
        prefix: ${{ inputs.prefix }}
      outputs:
        index: ${{ inputs.index }}
        request: ${{ inputs.requests[inputs.index] }}
        reference: ${{ inputs.prefix + '-' + string(inputs.index) }}
      transitions:
      - to: route
        when: outputs.request.action == 'consult'
      - to: execution
        when: outputs.request.action == 'execute'
      - to: await
        when: true
    route:
      include: ./route-target.yaml
      inputs:
        request: "${{ jq([{'kind':'feature','cell':'','ref':'main','role':'Owning cell: agree scope and acceptance outcomes'},states.pick.outputs.request],
          'add') }}"
        root_cell: ${{ inputs.root_cell }}
        root_ref: ${{ inputs.root_ref }}
        create_recipe: ${{ inputs.create_recipe }}
        documents: ${{ state_output('record','documents',inputs.documents) }}
      transitions:
      - to: invalid
        when: '!outputs.valid'
      - to: creation_result
        when: "!outputs.ready || states.pick.outputs.request.?kind.orValue('feature') == 'create'"
      - to: consult_inline
        when: inputs.consultation_recipe ==
          'git+https://github.com/colony-2/recipes.git//recipes/adaptive/consultation.yaml@main'
      - to: launch_consultation
        when: true
    consult_inline:
      include: ./consultation.yaml
      inputs:
        thread: ${{ states.pick.outputs.reference }}
        request: ${{ states.pick.outputs.request.request }}
        consultant_cell: ${{ states.route.outputs.target.cell }}
        consultant_ref: ${{ states.route.outputs.target.ref }}
        consultant_role: "${{ states.pick.outputs.request.?role.orValue('Owning cell: agree scope and acceptance outcomes')
          }}"
        requester_session: ${{ state_output('record','session',inputs.session) }}
        documents: ${{ states.route.outputs.documents }}
        annotations: ${{ state_output('record','annotations',inputs.annotations) }}
      transitions:
      - to: consulted
        when: true
        payload:
          result: ${{ outputs }}
    launch_consultation:
      id: launch_consultation
      op: recipes.run
      inputs:
        recipes:
        - cell_name: ${{ context.workspace.cell }}
          git:
            base_repo: ${{ context.git.repo }}
            base_ref: ${{ context.git.ref }}
            base_hash: ${{ context.git.resolved_hash }}
          name: ${{ inputs.consultation_recipe }}
          inputs:
            thread: ${{ states.pick.outputs.reference }}
            request: ${{ states.pick.outputs.request.request }}
            consultant_cell: ${{ states.route.outputs.target.cell }}
            consultant_ref: ${{ states.route.outputs.target.ref }}
            consultant_role: "${{ states.pick.outputs.request.?role.orValue('Owning cell: agree scope and acceptance outcomes')
              }}"
            requester_session: ${{ state_output('record','session',inputs.session) }}
            documents: ${{ states.route.outputs.documents }}
            annotations: ${{ state_output('record','annotations',inputs.annotations) }}
      transitions:
      - to: await_consultation
        when: true
    await_consultation:
      include: ./await-goal.yaml
      inputs:
        goal: ${{ states.launch_consultation.outputs.goal_ids[0] }}
      transitions:
      - to: consulted
        when: outputs.result.status == 'completed'
        payload:
          result: ${{ outputs.result.outputs }}
      - to: invalid
        when: true
    consulted:
      sequence: []
      inputs:
        result: ${{ transition.payload.result }}
      outputs:
        result: ${{ inputs.result }}
      transitions:
      - to: record
        when: true
        payload:
          record: ${{
            {'action':'consult','reference':states.pick.outputs.reference,'request':jq([{'kind':'feature','ref':'main'},states.pick.outputs.request],'add'),'target':states.route.outputs.target,'result':outputs.result,'creation':states.route.outputs.creation}
            }}
          documents: ${{ outputs.result.final_artifacts }}
          session: ${{ outputs.result.?requester_session.orValue(state_output('record','session',inputs.session)) }}
          annotations: ${{ outputs.result.?annotations.orValue([]) }}
    creation_result:
      sequence: []
      transitions:
      - to: record
        when: true
        payload:
          record: ${{
            {'action':'create','reference':states.pick.outputs.reference,'request':states.pick.outputs.request,'ready':states.route.outputs.ready,'result':states.route.outputs.creation}
            }}
          documents: ${{ states.route.outputs.documents }}
    execution:
      sequence: []
      outputs:
        agreement: ${{ inputs.agreement }}
        existing: ${{ inputs.existing }}
      transitions:
      - to: await
        when: size(outputs.existing) > 0
      - to: submit
        when: true
      inputs:
        agreement: "${{ (inputs.history + (state_exists('record') ? states.record.runs.map(r,r.outputs.record) + [states.record.outputs.record]
          : [])).filter(h,h.action == 'consult' && h.reference == states.pick.outputs.request.agreement)[0] }}"
        existing: "${{ (inputs.history + (state_exists('record') ? states.record.runs.map(r,r.outputs.record) + [states.record.outputs.record]
          : [])).filter(h,h.action == 'execute' && h.agreement == states.pick.outputs.request.agreement) }}"
    submit:
      workspace:
        cell: ${{ states.execution.outputs.agreement.target.cell }}
        ref: ${{ states.execution.outputs.agreement.target.ref }}
      inputs:
        agreement: ${{ states.execution.outputs.agreement }}
        root_cell: ${{ inputs.root_cell }}
        root_ref: ${{ inputs.root_ref }}
        build_recipe: ${{ inputs.build_recipe }}
        create_recipe: ${{ inputs.create_recipe }}
      sequence:
      - id: prompts
        include: ./prompts.yaml
        inputs:
          request: ${{ inputs.agreement.request.request }}
      - id: starter
        include: ./document-bindings.yaml
        inputs:
          prefix: consultation/
          documents: "${{ {'conversation.json': inputs.agreement.result.continuation} }}"
      - id: launch_prerequisite_build
        op: recipes.run
        inputs:
          recipes:
          - cell_name: ${{ context.workspace.cell }}
            git:
              base_repo: ${{ context.git.repo }}
              base_ref: ${{ context.git.ref }}
              base_hash: ${{ context.git.resolved_hash }}
            name: "${{ inputs.agreement.request.kind == 'create' ? inputs.create_recipe : inputs.build_recipe }}"
            inputs:
              prompt: ${{ sequence.prompts.outputs.children.prerequisite }}
              documents: ${{ jq([inputs.agreement.result.final_artifacts, sequence.starter.outputs.documents], 'add') }}
              annotations: ${{ inputs.agreement.result.?annotations.orValue([]) }}
              root_cell: ${{ inputs.root_cell }}
              root_ref: ${{ inputs.root_ref }}
      outputs:
        goal_id: ${{ sequence.launch_prerequisite_build.outputs.goal_ids[0] }}
      transitions:
      - to: record
        when: true
        payload:
          record: ${{
            {'action':'execute','agreement':states.pick.outputs.request.agreement,'goal_id':outputs.goal_id,'cell':states.execution.outputs.agreement.target.cell}
            }}
    await:
      include: ./await-goal.yaml
      inputs:
        goal: "${{ states.pick.outputs.request.action == 'await' ? states.pick.outputs.request.goal : states.execution.outputs.existing[0].goal_id
          }}"
      transitions:
      - to: record
        when: true
        payload:
          record: ${{ {'action':'await','goal_id':outputs.result.goal_id,'result':outputs.result} }}
          documents: ${{
            jq([outputs.result.?outputs.orValue({}).?final_artifacts.orValue(outputs.result.?outputs.orValue({}).?artifact_refs.orValue({})),outputs.errors],'add')
            }}
          annotations: ${{ outputs.result.?outputs.orValue({}).?annotations.orValue([]) }}
    record:
      inputs:
        record: ${{ transition.payload.record }}
        documents: ${{ transition.payload.?documents.orValue({}) }}
        session: ${{ transition.payload.?session.orValue(state_output('record','session',inputs.session)) }}
        annotations: ${{ transition.payload.?annotations.orValue([]) }}
        previous_documents: ${{ state_output('record','documents',inputs.documents) }}
        previous_annotations: ${{ state_output('record','annotations',inputs.annotations) }}
      sequence:
      - id: bind
        include: ./document-bindings.yaml
        inputs:
          documents: ${{ jq({'documents':inputs.documents,'record':inputs.record}, vars.status_documents) }}
          prefix: ${{ 'coordination/' + inputs.record.?reference.orValue(inputs.record.?goal_id.orValue('creation')) +
            '/' }}
          annotations: ${{ inputs.annotations }}
      outputs:
        record: ${{ inputs.record }}
        session: ${{ inputs.session }}
        annotations: ${{ inputs.previous_annotations + sequence.bind.outputs.annotations }}
        documents: ${{ jq([inputs.previous_documents,sequence.bind.outputs.documents], 'add') }}
      transitions:
      - to: pick
        when: states.pick.outputs.index + 1 < size(inputs.requests)
        payload:
          index: ${{ states.pick.outputs.index + 1 }}
    invalid:
      sequence: []
outputs:
  valid: ${{ !state_exists('invalid') }}
  records: "${{ (state_exists('record') ? states.record.runs.map(r,r.outputs.record) + [states.record.outputs.record] : [])
    }}"
  session: ${{ state_output('record','session',inputs.session) }}
  documents: ${{ state_output('record','documents',inputs.documents) }}
  annotations: ${{ state_output('record','annotations',inputs.annotations) }}
vars:
  status_documents: |
    . as $v | .record as $r |
    $v.documents + {"status.md": {kind:"value", name:"status.md", format:"text", value:
      (if $r.action == "consult" then
         "Agreement reference: " + $r.reference + "\nOwner: " + $r.target.cell + "\nOutcome: " + $r.result.outcome
       elif $r.action == "execute" then "Execution goal: " + $r.goal_id
       elif $r.action == "await" then "Goal: " + $r.goal_id + "\nStatus: " + $r.result.status
       else "Creation completed: " + ($r.ready | tostring) end)}}
