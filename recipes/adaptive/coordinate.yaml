id: adaptive-coordinate
inputs:
  requests: ${{ inputs.requests }}
  phase: ${{ inputs.phase }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  session: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  prefix: ${{ inputs.prefix }}
  history: ${{ inputs.?history.orValue([]) }}
  annotations: ${{ inputs.?annotations.orValue([]) }}
state:
  initial: validate
  states:
    validate:
      sequence: []
      transitions:
      - to: invalid
        when: (!nonempty(inputs.create_recipe) || !nonempty(inputs.root_cell)) &&
          inputs.requests.exists(r,r.?kind.orValue('') == 'create' || (r.action == 'execute' &&
          inputs.history.exists(h,h.action == 'consult' && h.reference == r.?agreement.orValue('') && h.request.kind ==
          'create')))
      - to: invalid
        when: "size(inputs.requests) == 0 || inputs.requests.exists(r, r.action == 'consult' ? !nonempty(r.?request.orValue(''))
          || (!nonempty(r.?cell.orValue('')) && r.?kind.orValue('feature') == 'feature') : r.action == 'execute' ? inputs.phase
          != 'implement' || !inputs.history.exists(h,h.action == 'consult' && h.reference == r.?agreement.orValue('') && h.result.outcome
          == 'agreed' && h.request.kind != 'expert') : r.action != 'await' || !nonempty(r.?job.orValue('')))"
      - to: invalid
        when: inputs.requests.exists(r,r.action == 'await' && !inputs.history.exists(h,h.action == 'execute' &&
          h.?job_id.orValue('') == r.?job.orValue('')))
      - to: await_requested
        when: inputs.requests.all(r,r.action == 'await')
      - to: pick
        when: true
    pick:
      sequence: []
      inputs:
        index: ${{ transition.payload.?index.orValue(0) }}
        requests: ${{ inputs.requests }}
        prefix: ${{ inputs.prefix }}
      outputs:
        index: ${{ inputs.index }}
        request: ${{ inputs.requests[inputs.index] }}
        reference: ${{ inputs.prefix + '-' + string(inputs.index) }}
      transitions:
      - to: route
        when: outputs.request.action == 'consult'
      - to: execution
        when: outputs.request.action == 'execute'
      - to: await
        when: true
    route:
      include: ./route-target.yaml
      inputs:
        request: "${{ jq([{'kind':'feature','cell':'','ref':'main','role':'Owning cell: agree scope and acceptance outcomes'},states.pick.outputs.request],
          'add') }}"
        root_cell: ${{ inputs.root_cell }}
        root_ref: ${{ inputs.root_ref }}
        create_recipe: ${{ inputs.create_recipe }}
        documents: ${{ state_output('record','documents',inputs.documents) }}
      transitions:
      - to: invalid
        when: '!outputs.valid'
        payload:
          reason: ${{ outputs.target.?detail.orValue('Unable to resolve the requested cell or ref.') }}
      - to: creation_result
        when: "!outputs.ready || states.pick.outputs.request.?kind.orValue('feature') == 'create'"
      - to: consult_fresh
        when: inputs.consultation_recipe ==
          'git+https://github.com/colony-2/recipes.git//recipes/adaptive/consultation.yaml@main' &&
          size(state_output('record','session',inputs.session)) == 0
      - to: consult_inline
        when: inputs.consultation_recipe ==
          'git+https://github.com/colony-2/recipes.git//recipes/adaptive/consultation.yaml@main'
      - to: launch_consultation
        when: true
    consult_fresh:
      include: ./consultation.yaml
      inputs:
        thread: ${{ states.pick.outputs.reference }}
        request: ${{ states.pick.outputs.request.request }}
        consultant_cell: ${{ states.route.outputs.target.cell }}
        consultant_ref: ${{ states.route.outputs.target.ref }}
        consultant_role: "${{ states.pick.outputs.request.?role.orValue('Owning cell: agree scope and acceptance outcomes')
          }}"
        documents: ${{ states.route.outputs.documents }}
        annotations: ${{ state_output('record','annotations',inputs.annotations) }}
      transitions:
      - to: consulted
        when: true
        payload:
          result: ${{ outputs }}
    consult_inline:
      include: ./consultation.yaml
      inputs:
        thread: ${{ states.pick.outputs.reference }}
        request: ${{ states.pick.outputs.request.request }}
        consultant_cell: ${{ states.route.outputs.target.cell }}
        consultant_ref: ${{ states.route.outputs.target.ref }}
        consultant_role: "${{ states.pick.outputs.request.?role.orValue('Owning cell: agree scope and acceptance outcomes')
          }}"
        requester_session: ${{ state_output('record','session',inputs.session) }}
        documents: ${{ states.route.outputs.documents }}
        annotations: ${{ state_output('record','annotations',inputs.annotations) }}
      transitions:
      - to: consulted
        when: true
        payload:
          result: ${{ outputs }}
    launch_consultation:
      id: launch_consultation
      op: recipes.run
      inputs:
        recipes:
        - cell_name: ${{ context.workspace.cell }}
          git:
            base_repo: ${{ context.git.repo }}
            base_ref: ${{ context.git.ref }}
            base_hash: ${{ context.git.resolved_hash }}
          name: ${{ inputs.consultation_recipe }}
          inputs: "${{ jq([{'thread': states.pick.outputs.reference, 'request': states.pick.outputs.request.request, 'consultant_cell':
            states.route.outputs.target.cell, 'consultant_ref': states.route.outputs.target.ref, 'consultant_role': states.pick.outputs.request.?role.orValue('Owning
            cell: agree scope and acceptance outcomes'), 'documents': states.route.outputs.documents, 'annotations': state_output('record','annotations',inputs.annotations)},
            size(state_output('record','session',inputs.session)) > 0 ? {'requester_session': state_output('record','session',inputs.session)}
            : {}], 'add') }}"
        wait:
          on: job
          condition: complete
      transitions:
      - to: await_consultation
        when: true
    await_consultation:
      include: ./await-child.yaml
      inputs:
        job: ${{ states.launch_consultation.outputs.job_ids[0] }}
      transitions:
      - to: consulted
        when: outputs.result.status == 'completed'
        payload:
          result: ${{ outputs.result.outputs }}
      - to: invalid
        when: true
        payload:
          reason: ${{ outputs.result.?failure_message.orValue('The consultation job did not return a usable result.') }}
    consulted:
      sequence: []
      inputs:
        result: ${{ transition.payload.result }}
      outputs:
        result: ${{ inputs.result }}
      transitions:
      - to: record
        when: true
        payload:
          record: ${{
            {'action':'consult','reference':states.pick.outputs.reference,'request':jq([{'kind':'feature','ref':'main'},states.pick.outputs.request],'add'),'target':states.route.outputs.target,'result':outputs.result,'creation':states.route.outputs.creation}
            }}
          documents: ${{ outputs.result.final_artifacts }}
          session: ${{ outputs.result.?requester_session.orValue(state_output('record','session',inputs.session)) }}
          annotations: ${{ outputs.result.?annotations.orValue([]) }}
    creation_result:
      sequence: []
      transitions:
      - to: record
        when: true
        payload:
          record: ${{
            {'action':'create','reference':states.pick.outputs.reference,'request':states.pick.outputs.request,'ready':states.route.outputs.ready,'result':states.route.outputs.creation}
            }}
          documents: ${{ states.route.outputs.documents }}
    execution:
      sequence: []
      outputs:
        agreement: ${{ inputs.agreement }}
        existing: ${{ inputs.existing }}
      transitions:
      - to: inspect_execution
        when: size(outputs.existing) > 0
      - to: submit
        when: true
      inputs:
        agreement: "${{ (inputs.history + (state_exists('record') ? states.record.runs.map(r,r.outputs.record) + [states.record.outputs.record]
          : [])).filter(h,h.action == 'consult' && h.reference == states.pick.outputs.request.agreement)[0] }}"
        existing: "${{ (inputs.history + (state_exists('record') ? states.record.runs.map(r,r.outputs.record) + [states.record.outputs.record]
          : [])).filter(h,h.action == 'execute' && h.agreement == states.pick.outputs.request.agreement) }}"
    submit:
      workspace:
        cell: ${{ states.execution.outputs.agreement.target.cell }}
        ref: ${{ states.execution.outputs.agreement.target.ref }}
      inputs:
        agreement: ${{ states.execution.outputs.agreement }}
        root_cell: ${{ inputs.root_cell }}
        root_ref: ${{ inputs.root_ref }}
        build_recipe: ${{ inputs.build_recipe }}
        create_recipe: ${{ inputs.create_recipe }}
        correction: ${{ states.pick.outputs.request.?request.orValue('') }}
        previous: "${{ size(states.execution.outputs.existing) > 0 ? states.execution.outputs.existing[size(states.execution.outputs.existing)-1].job_id
          : '' }}"
      sequence:
      - id: prompts
        include: ./prompts.yaml
        inputs:
          request: ${{ inputs.agreement.request.request }}
          guidance: "${{ inputs.previous != '' ? 'A previous job failed or did not finish this assignment. Start again from
            this checkout; its unpublished work and session are not carried over. Correction: ' + inputs.correction : inputs.correction
            }}"
      - id: starter
        include: ./document-bindings.yaml
        inputs:
          prefix: consultation/
          documents: "${{ {'conversation.json': inputs.agreement.result.continuation} }}"
      - id: launch_prerequisite_build
        op: recipes.run
        inputs:
          recipes:
          - cell_name: ${{ context.workspace.cell }}
            git:
              base_repo: ${{ context.git.repo }}
              base_ref: ${{ context.git.ref }}
              base_hash: ${{ context.git.resolved_hash }}
            name: "${{ inputs.agreement.request.kind == 'create' ? inputs.create_recipe : inputs.build_recipe }}"
            inputs:
              prompt: ${{ sequence.prompts.outputs.children.prerequisite }}
              documents: ${{ jq([inputs.agreement.result.final_artifacts, sequence.starter.outputs.documents], 'add') }}
              annotations: ${{ inputs.agreement.result.?annotations.orValue([]) }}
              root_cell: ${{ inputs.root_cell }}
              root_ref: ${{ inputs.root_ref }}
          wait:
            on: job
            condition: complete
      outputs:
        job_id: ${{ sequence.launch_prerequisite_build.outputs.job_ids[0] }}
        replaces: ${{ inputs.previous }}
      transitions:
      - to: record
        when: true
        payload:
          record: ${{
            {'action':'execute','agreement':states.pick.outputs.request.agreement,'job_id':outputs.job_id,'replaces':outputs.replaces,'cell':states.execution.outputs.agreement.target.cell}
            }}
    await:
      include: ./await-child.yaml
      inputs:
        job: "${{ states.pick.outputs.request.action == 'await' ? states.pick.outputs.request.job : states.execution.outputs.existing[size(states.execution.outputs.existing)-1].job_id
          }}"
      transitions:
      - to: record
        when: true
        payload:
          record: ${{ {'action':'await','job_id':outputs.result.job_id,'result':outputs.result} }}
          documents: ${{
            jq([outputs.result.?outputs.orValue({}).?final_artifacts.orValue(outputs.result.?outputs.orValue({}).?artifact_refs.orValue({})),outputs.errors],'add')
            }}
          annotations: ${{ outputs.result.?outputs.orValue({}).?annotations.orValue([]) }}
    record:
      inputs:
        record: ${{ transition.payload.record }}
        documents: ${{ transition.payload.?documents.orValue({}) }}
        session: ${{ transition.payload.?session.orValue(state_output('record','session',inputs.session)) }}
        annotations: ${{ transition.payload.?annotations.orValue([]) }}
        previous_documents: ${{ state_output('record','documents',inputs.documents) }}
        previous_annotations: ${{ state_output('record','annotations',inputs.annotations) }}
      sequence:
      - id: bind
        include: ./document-bindings.yaml
        inputs:
          documents: ${{ jq(inputs.documents,'with_entries(select(.key | startswith("error/") | not))') }}
          prefix: ${{ 'coordination/' + inputs.record.?reference.orValue(inputs.record.?job_id.orValue('creation')) +
            '/artifacts/' }}
          annotations: ${{ inputs.annotations }}
      - id: status
        include: ./document-bindings.yaml
        inputs:
          documents: ${{ jq({'record':inputs.record}, vars.status_documents) }}
          prefix: ${{ 'coordination/' + inputs.record.?reference.orValue(inputs.record.?job_id.orValue('creation')) +
            '/' }}
      outputs:
        record: ${{ inputs.record }}
        session: ${{ inputs.session }}
        annotations: ${{ inputs.previous_annotations + sequence.bind.outputs.annotations }}
        documents: ${{
          jq([inputs.previous_documents,sequence.bind.outputs.documents,sequence.status.outputs.documents,jq({'documents':inputs.documents,'job':inputs.record.?job_id.orValue(inputs.record.?reference.orValue('creation'))},
          ' . as $v | .documents | with_entries(select(.key | startswith("error/")) | .key = ("error/children/" + $v.job
          + "/" + (.key|ltrimstr("error/"))) | .value.name = .key)')], 'add') }}
      transitions:
      - to: pick
        when: states.pick.outputs.index + 1 < size(inputs.requests)
        payload:
          index: ${{ states.pick.outputs.index + 1 }}
    invalid:
      sequence: []
      inputs:
        reason: ${{ transition.payload.?reason.orValue('Return a valid consultation request or execute an accepted
          agreement. Execution requests require the implementation phase; use the agreement reference in
          coordination/.') }}
      outputs:
        reason: ${{ inputs.reason }}
    inspect_execution:
      include: ./await-child.yaml
      inputs:
        job: ${{ states.execution.outputs.existing[size(states.execution.outputs.existing)-1].job_id }}
        return_when: current_status
      transitions:
      - to: submit
        when: outputs.result.?outputs.orValue({}).?disposition.orValue('') != 'cancelled' &&
          outputs.result.?outputs.orValue({}).?status.orValue('') != 'cancelled' &&
          outputs.result.?failure_kind.orValue('') != 'cancellation' &&
          outputs.result.?outputs.orValue({}).?attrs.orValue({}).?c2j_failure.orValue({}).?kind.orValue('') !=
          'cancellation' && (nonempty(states.pick.outputs.request.?request.orValue('')) && (outputs.result.status in
          ['failed','timed_out'] || (outputs.result.status == 'completed' &&
          !(outputs.result.?outputs.orValue({}).?merged.orValue(false) ||
          outputs.result.?outputs.orValue({}).?disposition.orValue('') in ['unchanged','delegated']))))
      - to: await
        when: true
    await_requested:
      include: ./child-results.yaml
      inputs:
        jobs: ${{ {'job_ids':inputs.requests.map(r,r.job)} }}
        allowed: true
outputs:
  valid: ${{ !state_exists('invalid') }}
  records: "${{ state_exists('await_requested') ? states.await_requested.outputs.results.map(r,{'action':'await','job_id':r.job_id,'result':r})
    : jq((state_exists('record') ? states.record.runs.map(r,r.outputs.record) + [states.record.outputs.record] : []), vars.records)
    }}"
  session: ${{ state_output('record','session',inputs.session) }}
  documents: "${{ state_exists('await_requested') ? jq([inputs.documents,states.await_requested.outputs.documents],'add')
    : state_output('record','documents',inputs.documents) }}"
  annotations: ${{ state_output('record','annotations',inputs.annotations) }}
  issues: "${{ state_exists('invalid') ? [states.invalid.outputs.reason] : [] }}"
vars:
  status_documents: |
    . as $v | .record as $r |
    {"status.md": {kind:"value", name:"status.md", format:"text", value:
      (if $r.action == "consult" then
         "Agreement reference: " + $r.reference + "\nOwner: " + $r.target.cell + "\nOutcome: " + $r.result.outcome + "\n" + ($r.result.summary // "") +
             (($r.result.agreements // []) | to_entries | map("\nAccepted scope: " + $r.reference + "/advice-" + (.key|tostring) + " — " + .value.target.cell + ": " + .value.request.request) | join("")) +
             (($r.result.execution_requests // []) | map("\nImplementation requested in " + .cell + ": " + .request) | join(""))
       elif $r.action == "execute" then "Child job: " + $r.job_id + (if ($r.replaces // "") != "" then "\nReplaces: " + $r.replaces else "" end)
       elif $r.action == "await" then "Child job: " + $r.job_id + "\nStatus: " + $r.result.status + "\n" + (($r.result.failure_message // "")[:2000]) +
         ([$r.result.outputs.disposition // $r.result.outputs.status // (if $r.result.outputs.ok == false then "failed" else "" end), $r.result.outputs.assistant_summary // $r.result.outputs.summary // ""] |
          if .[0] != "" or .[1] != "" then "\nAssignment outcome: " + (.[0] | tostring) + "\n" + (.[1] | tostring | .[:2000]) else "" end)
       else "Creation completed: " + ($r.ready | tostring) end)}}
  records: |
    map(. as $record | [$record] +
      (($record.result.agreements // []) | to_entries | map(.value +
        {action:"consult",reference:($record.reference + "/advice-" + (.key|tostring))}))) | add // []
