id: adaptive-operational-failure
inputs:
  reason: ${{ inputs.reason }}
  documents: ${{ inputs.?documents.orValue({}) }}
  code: ${{ inputs.?code.orValue('ADAPTIVE_RECOVERY_REQUIRED') }}
sequence:
- id: stop_attempt
  workspace:
    cell: ${{ context.workflow.cell }}
    repo: ${{ context.git.repo }}
    ref: ${{ context.git.ref }}
    initial: empty
  op: command_execution
  artifacts:
    ./: ${{ inputs.documents }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      cp -R "$INBOX"/. "$OUTBOX"/
      exit 1
  retry:
    maximum_attempts: 1
  catch:
  - when: failure.kind != 'cancellation'
    fail:
      code: ${{ inputs.code }}
      message: ${{ inputs.reason }}
      cause: ${{ failure }}
