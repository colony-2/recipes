id: adaptive-feedback-documents
inputs:
  fields: ${{ inputs.?fields.orValue({}) }}
  documents: ${{ inputs.?documents.orValue({}) }}
sequence: []
outputs:
  documents: ${{ jq({'fields':inputs.fields,'documents':inputs.documents}, vars.bindings) }}
vars:
  bindings: |
    def words: if type == "string" then . elif type == "array" then map(tostring)|join(", ") else tostring end;
    [(.documents | to_entries | map(.key = ("feedback/human/" + .key) | .value.name = .key) | from_entries),
     ([.fields | to_entries[] | select(.key != "decision" and .key != "annotations") | "## " + .key + "\n" + (.value|words)] | join("\n\n") |
      if length > 0 then {"feedback/human-answers.md":{kind:"value",name:"feedback/human-answers.md",format:"text",value:.}} else {} end)] | add
