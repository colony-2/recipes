id: adaptive-approved-review-documents
inputs:
  reviews: ${{ inputs.reviews }}
vars:
  accepted: ${{ inputs.reviews.filter(r, r.response.fields.decision == 'accept' && !r.changed) }}
sequence: []
outputs:
  documents: >-
    ${{ jq(size(vars.accepted) == 0 ? {} : {
      'approved/merge-review.md': vars.accepted[size(vars.accepted)-1].review,
      'approved/merge-candidate.diff': vars.accepted[size(vars.accepted)-1].candidate_diff,
      'approved/merge-candidate.json': vars.accepted[size(vars.accepted)-1].candidate_inventory
    }, 'with_entries(.value.name = .key)') }}
