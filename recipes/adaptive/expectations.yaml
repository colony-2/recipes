id: adaptive-expectations
inputs:
  baseline: ${{ inputs.baseline }}
  proposed: ${{ inputs.proposed }}
state:
  initial:
  - to: unchanged
    when: inputs.proposed == null || inputs.proposed == inputs.baseline
  - to: changed
    when: inputs.baseline == null
  - to: compare
    when: true
  states:
    unchanged:
      sequence: []
    changed:
      sequence: []
    compare:
      id: compare
      op: command_execution
      const: true
      artifacts:
        baseline.md: ${{ inputs.baseline }}
        proposed.md: ${{ inputs.proposed }}
      inputs:
        env:
          INBOX: ${{ context.environment.op.inbox }}
        run: |
          if cmp -s "$INBOX/baseline.md" "$INBOX/proposed.md"; then printf same; else printf changed; fi
outputs:
  changed: ${{ state_exists('changed') || state_output('compare','stdout','same') != 'same' }}
