id: adaptive-hook-publish
inputs:
  request: ${{ inputs.?request.orValue('') }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  settings: ${{ inputs.?settings.orValue(null) }}
  merged_hash: ${{ inputs.merged_hash }}
  target_branch: ${{ inputs.target_branch }}
  base: ${{ inputs.base }}
sequence:
- id: invoke_hook
  const: true
  include:
    recipe: cell://.c2/recipes/hooks/build/publish.yaml
    if_missing:
      outputs:
        api_version: c2.build-hook/v1
        status: skipped
        summary: No repository publish hook is configured.
        artifact_refs: {}
  inputs:
    api_version: c2.build-hook/v1
    request: ${{ inputs.request }}
    target_directory: ${{ inputs.target_directory }}
    candidate: ${{ context.git.hash }}
    base: ${{ inputs.base }}
    documents: ${{ inputs.documents }}
    settings: ${{ inputs.settings }}
    merged_hash: ${{ inputs.merged_hash }}
    target_branch: ${{ inputs.target_branch }}
  expect_outputs:
    type: object
    additionalProperties: false
    required:
    - api_version
    - status
    - summary
    - artifact_refs
    properties:
      api_version:
        type: string
        enum:
        - c2.build-hook/v1
      status:
        type: string
        enum:
        - passed
        - failed
        - skipped
      summary:
        type: string
        minLength: 1
        maxLength: 8192
      artifact_refs:
        type: object
        maxProperties: 64
        propertyNames:
          not:
            enum:
            - __git_state_thin_pack__
            - diff_from_parent.diff
            - diff_from_base.diff
        additionalProperties:
          type: object
      failure:
        type: object
  catch:
  - when: failure.kind != 'cancellation'
    continue:
      outputs:
        api_version: c2.build-hook/v1
        status: failed
        summary: ${{ failure.message }}
        artifact_refs: {}
        failure: ${{ json_parse(json_stringify(failure)) }}
outputs:
  result: ${{ sequence.invoke_hook.outputs }}
  artifact_refs: ${{ sequence.invoke_hook.outputs.artifact_refs }}
