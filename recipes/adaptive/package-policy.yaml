id: adaptive-package-policy
sequence:
- id: policy
  const: true
  include:
    recipe: cell://.c2/recipes/hooks/build/package-policy.yaml
    if_missing:
      outputs:
        approved: {}
  expect_outputs:
    type: object
    additionalProperties: false
    required: [approved]
    properties:
      approved:
        type: object
        additionalProperties:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
outputs:
  approved: ${{ sequence.policy.outputs.approved }}
workspace:
  cell: ${{ context.workspace.cell }}
  ref: ${{ context.git.ref }}
