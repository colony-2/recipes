id: adaptive-response-repair
inputs:
  turn: ${{ inputs.turn }}
  issues: ${{ inputs.issues }}
  documents: ${{ inputs.documents }}
  session: ${{ inputs.?session.orValue({}) }}
  attempts: ${{ int(inputs.?attempts.orValue(0)) }}
state:
  initial: prompts
  states:
    prompts:
      include: ./prompts.yaml
      transitions:
      - to: automatic
        when: inputs.attempts < 2 && size(inputs.turn.result.?session.orValue(inputs.session)) > 0 &&
          size(inputs.turn.jobs.?job_ids.orValue([])) == 0
      - to: review
        when: true
    automatic:
      sequence: []
    review:
      include: ./review.yaml
      inputs:
        title: ${{ states.prompts.outputs.repair.title }}
        documents: ${{ jq([inputs.documents, inputs.turn.artifacts], 'add') }}
        annotations: ${{ inputs.turn.?annotations.orValue([]) }}
        fields:
        - id: decision
          type: multiple_choice
          question: ${{ jq(inputs.issues, 'join("; ")') }}
          required: true
          options:
          - value: retry
            label: ${{ states.prompts.outputs.repair.retry_label }}
          - value: cancel
            label: ${{ states.prompts.outputs.repair.cancel_label }}
        - id: feedback
          type: paragraph_text
          question: ${{ states.prompts.outputs.repair.feedback_question }}
          required: false
        - id: annotations
          type: file_upload
          question: ${{ states.prompts.outputs.repair.annotations_question }}
          required: false
      transitions:
      - to: review
        when: outputs.response.fields.decision == 'retry' && !outputs.changed
outputs:
  retry: ${{ state_exists('automatic') || states.review.outputs.response.fields.decision == 'retry' }}
  attempts: "${{ state_exists('automatic') ? inputs.attempts + 1 : 0 }}"
  session: ${{ inputs.turn.result.?session.orValue(inputs.session) }}
  artifacts: ${{ jq([inputs.turn.artifacts, state_output('review', 'response', {}).?artifact_refs.orValue({})], 'add') }}
  documents: >-
    ${{ jq([inputs.documents, inputs.turn.artifacts, state_output('review', 'documents', {}),
    {'error/response-corrections.md': {'kind':'value', 'name':'error/response-corrections.md', 'format':'text', 'value':jq(inputs.issues,
    'map("- " + .) | join("\n")')},
     'error/previous-response.json': {'kind':'value', 'name':'error/previous-response.json', 'format':'json', 'value':inputs.turn.result.?response.orValue({})}
    },
    state_exists('review') ? {'feedback/direction.md': {'kind':'value', 'name':'feedback/direction.md', 'format':'text',
    'value':state_output('review', 'response', {}).?fields.orValue({}).?feedback.orValue('')} } : {}], 'add') }}
  prompt: ${{ states.prompts.outputs.repair.prompt }}
  base_hash: ${{ inputs.turn.?base_hash.orValue('') }}
