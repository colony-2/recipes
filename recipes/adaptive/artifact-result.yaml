id: adaptive-artifact-result
version: 1.0.0
inputs:
  result: ${{ inputs.result }}
  artifacts: ${{ inputs.artifacts }}
  bound_inputs: ${{ inputs.?bound_inputs.orValue({}) }}
  fields: ${{ inputs.?fields.orValue(['files.*.path']) }}
sequence:
- id: inventory
  sequence: []
  outputs:
    artifacts: ${{ jq(inputs.artifacts, vars.inventory_filter) }}
    references: '${{ jq({''response'': inputs.result.?response.orValue({}), ''fields'': inputs.fields}, vars.reference_query)
      }}'
  inputs:
    artifacts: ${{ jq([inputs.bound_inputs,inputs.artifacts], 'add') }}
    result: ${{ inputs.result }}
    fields: ${{ inputs.fields }}
- id: match
  sequence: []
  outputs:
    matches: |-
      ${{ inputs.references.map(r,
        {'location': r.location, 'reference': r.reference,
         'match': path_match(r.reference, jq(inputs.artifacts, 'keys'))}) }}
  inputs:
    references: ${{ sequence.inventory.outputs.references }}
    artifacts: ${{ sequence.inventory.outputs.artifacts }}
- id: collect_annotations
  include: ./artifact-annotations.yaml
  inputs:
    result: '${{ jq({''result'': inputs.result, ''matches'': sequence.match.outputs.matches}, vars.apply_matches) }}'
    artifacts: ${{ sequence.inventory.outputs.artifacts }}
    bound_inputs: ${{ inputs.bound_inputs }}
outputs:
  annotations: ${{ sequence.collect_annotations.outputs.annotations }}
  result: '${{ jq({''result'': inputs.result, ''matches'': sequence.match.outputs.matches}, vars.apply_matches) }}'
  # Keep identities available for correcting a missing/mistyped declaration.
  # The inventory is not an inbox binding or a review document list.
  artifacts: ${{ sequence.inventory.outputs.artifacts }}
  documents: >-
    ${{ jq({'artifacts': sequence.inventory.outputs.artifacts, 'matches': sequence.match.outputs.matches},
      vars.selected_artifacts) }}
  matches: ${{ jq(sequence.match.outputs.matches, '. // []') }}
  issues: ${{ jq(sequence.match.outputs.matches, vars.issue_query) }}
  repair_documents: ${{
    jq({'artifacts':sequence.inventory.outputs.artifacts,'matches':sequence.match.outputs.matches},vars.repair_artifacts)
    }}
vars:
  selected_artifacts: |
    . as $v |
    [.matches[] | select(.match.status == "matched") | .match.path] | unique |
    map({key: ., value: $v.artifacts[.]}) | from_entries
  inventory_filter: |-
    with_entries(select(.key as $k |
      (["__git_state_thin_pack__", "diff_from_parent.diff", "diff_from_base.diff",
        "stdout.jsonl", "stderr.txt", "codex-progress.jsonl"] | index($k) | not)
      and ($k | startswith("__c2j_objects__/") | not)))
  reference_query: |-
    .fields as $fields | .response |
    [paths(strings) as $p |
     ($p | map(if type == "number" then "*" else . end) | join(".")) as $field |
     select($fields | index($field)) | {location: $p, reference: getpath($p)}]
  apply_matches: |-
    (.matches // []) as $matches | .result |
    reduce ($matches[] | select(.match.status == "matched")) as $m
    (.; .response |= setpath($m.location; $m.match.path))
  issue_query: |-
    (. // []) | map(select(.match.status != "matched")) |
    map("Artifact reference \"" + .reference + "\": " + .match.status +
        (if (.match.candidates | length) > 0 then "; candidates: " + (.match.candidates | tojson) else "" end))
  repair_artifacts: |
    . as $v |
    [.matches[] | if .match.status == "matched" then .match.path
     else (.match.candidates[]?),
          (select(.reference | endswith("/")) | .reference as $prefix |
           $v.artifacts | keys[] | select(startswith($prefix))) end] | unique |
    map(select(. as $p | $v.artifacts | has($p)) | {key:.,value:$v.artifacts[.]}) | from_entries
