id: adaptive-classify
version: 1.0.0
inputs:
  request: ${{ inputs.request }}
sequence:
- id: prompts
  include: ./prompts.yaml
- id: read_repository_context
  op: command_execution
  const: true
  execution_needs:
    packages:
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
  inputs:
    run: |
      python3 - <<'PYCODE'
      import json, os, pathlib
      complete = True
      def read(name):
          global complete
          path = pathlib.Path(name)
          if not path.exists():
              return ''
          try:
              # Bound model context; incomplete evidence cannot justify skipping design.
              with path.open('rb') as stream:
                  data = stream.read(65537)
              if len(data) > 65536:
                  complete = False
              return data[:65536].decode('utf-8')
          except (OSError, UnicodeError):
              complete = False
              return ''
      purpose = read('PURPOSE.md')
      architecture = read('ARCHITECTURE.md')
      readme = next((read(n) for n in ('README.md', 'README.rst', 'README', 'readme.md')
                     if pathlib.Path(n).is_file()), '')
      context = {'repository_purpose': purpose,
                 'repository_architecture': architecture + '\n\n' + readme,
                 'usable': complete and bool(purpose.strip() or readme.strip())}
      payload = json.dumps(context)
      (pathlib.Path(os.environ['OUTBOX']) / 'repository-context.json').write_text(payload, encoding='utf-8')
      # stdout is a diagnostic preview capped around 10 KB, not bulk JSON transport.
      # Leave headroom and count serialized bytes, including JSON escaping.
      if len(payload.encode('utf-8')) > 8000:
          payload = json.dumps({'repository_purpose': '', 'repository_architecture': '', 'usable': False})
      print(payload)
      PYCODE
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
- id: classify_request_complexity
  op: nix:github:colony-2/c2ops/published#jev
  const: true
  inputs:
    api_key: ${{ context.secrets.jev_api_key }}
    timeout_seconds: 60
    state:
      repository_purpose: ${{ json_parse(sequence.read_repository_context.outputs.stdout).repository_purpose }}
      repository_architecture: ${{ json_parse(sequence.read_repository_context.outputs.stdout).repository_architecture
        }}
      request: ${{ inputs.request }}
    questions:
      # Keep the existing Jev answer key; this question chooses design, not a build route.
      is_heavy:
        type: noul
        instructions: ${{ sequence.prompts.outputs.classify.instructions }}
        criteria: ${{ sequence.prompts.outputs.classify.criteria }}
  catch:
  - when: failure.kind != 'cancellation'
    continue:
      outputs:
        answers: {}
        unavailable: true
        error: ${{ failure.message }}
outputs:
  assessment: ${{ sequence.classify_request_complexity.outputs }}
  context_usable: ${{ !sequence.read_repository_context.outputs.?stdout_truncated.orValue(false) &&
    jq(sequence.read_repository_context.outputs.stdout, 'try (fromjson.usable == true) catch false') == true }}
  design_required: ${{ !(!sequence.read_repository_context.outputs.?stdout_truncated.orValue(false) &&
    jq(sequence.read_repository_context.outputs.stdout, 'try (fromjson.usable == true) catch false') == true &&
    jq(sequence.classify_request_complexity.outputs, 'try (.answers.is_heavy | .type == "noul" and (.noul | type ==
    "number" and . >= 0 and . <= 0.10)) catch false') == true) }}
  artifact_refs: ${{ sequence.read_repository_context.artifacts }}
