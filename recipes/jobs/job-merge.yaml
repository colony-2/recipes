id: job-merge
version: 0.2.0
desc: Squash, rebase, and merge the current workspace back to upstream (requires explicit approval)
input_schema:
  local_hash:
    type: string
    required: false
  upstream_repo:
    type: string
    required: false
  upstream_branch:
    type: string
    required: false
  commit_message:
    type: string
    required: false
inputs:
  local_hash: '${{ first_nonempty(inputs.?local_hash, context.git.?hash.orValue(""), "") }}'
  upstream_repo: '${{ first_nonempty(inputs.?upstream_repo, context.git.?repo.orValue(""), "") }}'
  upstream_branch: '${{ first_nonempty(inputs.?upstream_branch, context.git.?ref.orValue(""), "") }}'
  commit_message: '${{ first_nonempty(inputs.?commit_message, "") }}'
vars:
  local_hash: '${{ first_nonempty(context.git.?hash.orValue(""), inputs.?local_hash.orValue(""), "") }}'
state:
  initial:
    - to: collect_merge_details
      when: '!nonempty(first_nonempty(inputs.?upstream_repo.orValue(""), context.git.?repo.orValue(""), "")) || !nonempty(first_nonempty(inputs.?upstream_branch.orValue(""), context.git.?ref.orValue(""), "")) || !nonempty(inputs.?commit_message.orValue(""))'
    - to: request_merge_approval
      when: "true"
  states:
    collect_merge_details:
      id: collect_merge_details
      op: input
      transitions:
        - to: request_merge_approval
          when: "true"
      inputs:
        form:
          title: "Merge details"
          fields:
            - id: upstream_repo
              type: short_answer
              question: "Upstream repo (e.g. git@host:org/repo.git)"
              required: true
            - id: upstream_branch
              type: short_answer
              question: "Upstream branch (e.g. main)"
              required: true
            - id: commit_message
              type: paragraph_text
              question: "Squash commit message"
              required: true

    request_merge_approval:
      id: request_merge_approval
      op: input
      transitions:
        - to: complete_unchanged_job
          when: 'outputs.response == "merge" && !nonempty(vars.local_hash)'
        - to: publish_approved_changes
          when: 'outputs.response == "merge" && nonempty(vars.local_hash)'
          payload:
            upstream_repo: '${{ state_field("collect_merge_details", "upstream_repo", "") }}'
            upstream_branch: '${{ state_field("collect_merge_details", "upstream_branch", "") }}'
            commit_message: '${{ state_field("collect_merge_details", "commit_message", "") }}'
      inputs:
        form:
          title: "Approve merge"
          question: |
            This will run `squashrebasemerge` and fast-forward merge back to the upstream branch.

            Local hash: ${{ vars.local_hash }}
            Upstream repo: ${{ first_nonempty(state_field("collect_merge_details", "upstream_repo", ""), inputs.?upstream_repo.orValue(""), context.git.?repo.orValue(""), "") }}
            Upstream branch: ${{ first_nonempty(state_field("collect_merge_details", "upstream_branch", ""), inputs.?upstream_branch.orValue(""), context.git.?ref.orValue(""), "") }}
            Commit message:
            ${{ first_nonempty(state_field("collect_merge_details", "commit_message", ""), inputs.?commit_message.orValue(""), "") }}
          type: multiple_choice
          options:
            - value: merge
              label: Merge
            - value: cancel
              label: Cancel

    complete_unchanged_job:
      id: complete_unchanged_job
      op: sleep
      transitions: []
      inputs:
        duration: 1ms

    publish_approved_changes:
      id: publish_approved_changes
      op: squashrebasemerge
      vars:
        upstream_repo: '${{ first_nonempty(transition.?payload.upstream_repo, inputs.?upstream_repo.orValue(""), context.git.?repo.orValue(""), "") }}'
        upstream_branch: '${{ first_nonempty(transition.?payload.upstream_branch, inputs.?upstream_branch.orValue(""), context.git.?ref.orValue(""), "") }}'
        commit_message: '${{ first_nonempty(transition.?payload.commit_message, inputs.?commit_message.orValue(""), "Update") }}'
      inputs:
        repo_path: "{{ context.environment.op.worktree_path }}"
        local_hash: "${{ vars.local_hash }}"
        upstream_repo: "${{ vars.upstream_repo }}"
        upstream_branch: "${{ vars.upstream_branch }}"
        rebase: true
        author: '${{ context.git.?author.orValue("") }}'
        commit_message: "${{ vars.commit_message }}"

outputs:
  merged: "${{ nonempty(state_output('publish_approved_changes', 'merged_hash', '')) }}"
  merged_hash: "${{ state_output('publish_approved_changes', 'merged_hash', '') }}"
  target_branch: "${{ state_output('publish_approved_changes', 'target_branch', '') }}"
