id: superpowers-run-skill-repair-smoke
version: 0.1.0
desc: Proves codex/run_skill repair configuration and outputs are recipe-visible
sequence:
  - id: run_skill
    op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
    inputs:
      skill: superpowers-ticket-intake
      input:
        ticket_prompt: "Repair a malformed Superpowers output artifact."
        expected_phase: "intake"
      prompt: |
        Run the requested Superpowers/C2 intake skill.

        If the primary output artifact fails schema validation, repair only
        `superpowers/run-skill/result.json` and keep the same session.
      status_contract:
        path: superpowers/run-skill/latest-status.json
      output:
        from: artifact
        path: superpowers/run-skill/result.json
        format: json
        schema:
          type: object
          required:
            - summary
          properties:
            summary:
              type: string
        validation:
          on_error: incomplete
          repair:
            enabled: true
            max_attempts: 1

outputs:
  skill: "{{ sequence.run_skill.outputs.skill }}"
  status: "{{ sequence.run_skill.outputs.status }}"
  session_id: "{{ sequence.run_skill.outputs.sessionId }}"
  parsed_summary: "${{ sequence.run_skill.outputs.parsed_output.summary }}"
  output_schema_valid: "${{ sequence.run_skill.outputs.output_schema_valid }}"
  output_schema_errors: "${{ sequence.run_skill.outputs.output_schema_errors }}"
  output_repair_attempts: "${{ sequence.run_skill.outputs.output_repair_attempts }}"
  status_contract_present: "${{ sequence.run_skill.outputs.status_contract_present }}"
  status_contract_valid: "${{ sequence.run_skill.outputs.status_contract_valid }}"
  repaired_in_same_session: "${{ sequence.run_skill.outputs.sessionId != '' && sequence.run_skill.outputs.output_repair_attempts == 1 && sequence.run_skill.outputs.output_schema_valid }}"
