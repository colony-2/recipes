recipe: ../superpowers.yaml
cases:
- id: ts-094-debug-missing-reproduction
  type: integration_case
  inputs:
    prompt: debug missing repro
    mode: debug
    bug_report: failing command needs reproduction
  runtime: {}
  mocks:
    ops:
    - repeat: true
      match: {op: command_execution}
      behavior: {mode: passthrough}
  assertions:
  - {type: output_equals, path: debug_status, value: needs_repro_command}
  - {type: output_equals, path: workflow_status, value: needs_repro_command}
