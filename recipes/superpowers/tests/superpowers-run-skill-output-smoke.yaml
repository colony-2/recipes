id: superpowers-run-skill-output-smoke
version: 0.1.0
desc: Proves codex/run_skill exposes parsed artifact output and status-contract validation
sequence:
  - id: run_skill
    op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
    inputs:
      skill: superpowers-ticket-intake
      input:
        ticket_prompt: "Build a focused Superpowers recipe smoke."
        expected_phase: "intake"
      prompt: |
        Run the requested Superpowers/C2 intake skill.

        Produce the primary JSON output artifact at
        `superpowers/run-skill/result.json` and the status contract at
        `superpowers/run-skill/latest-status.json`.
      status_contract:
        path: superpowers/run-skill/latest-status.json
      output:
        from: artifact
        path: superpowers/run-skill/result.json
        format: json
        schema:
          type: object
          required:
            - summary
            - selected_skill
            - next_phase
          properties:
            summary:
              type: string
            selected_skill:
              type: string
            next_phase:
              type: string

outputs:
  skill: "{{ sequence.run_skill.outputs.skill }}"
  status: "{{ sequence.run_skill.outputs.status }}"
  session_id: "{{ sequence.run_skill.outputs.sessionId }}"
  parsed_summary: "${{ sequence.run_skill.outputs.parsed_output.summary }}"
  parsed_selected_skill: "${{ sequence.run_skill.outputs.parsed_output.selected_skill }}"
  parsed_next_phase: "${{ sequence.run_skill.outputs.parsed_output.next_phase }}"
  output_source: "{{ sequence.run_skill.outputs.output_source }}"
  output_path: "{{ sequence.run_skill.outputs.output_path }}"
  output_schema_valid: "${{ sequence.run_skill.outputs.output_schema_valid }}"
  output_repair_attempts: "${{ sequence.run_skill.outputs.output_repair_attempts }}"
  status_contract_present: "${{ sequence.run_skill.outputs.status_contract_present }}"
  status_contract_valid: "${{ sequence.run_skill.outputs.status_contract_valid }}"
  status_contract_status: "${{ sequence.run_skill.outputs.status_contract_json.status }}"
  run_skill_contract_valid: "${{ sequence.run_skill.outputs.output_schema_valid && sequence.run_skill.outputs.status_contract_present && sequence.run_skill.outputs.status_contract_valid }}"
