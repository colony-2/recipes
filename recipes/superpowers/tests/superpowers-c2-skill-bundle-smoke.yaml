id: superpowers-c2-skill-bundle-smoke
version: 0.1.0
desc: Validates the C2-adapted Superpowers skill bundle contract
input_schema:
  repo_root:
    type: string
    required: false
  skill_bundle_ref:
    type: string
    required: false
inputs:
  repo_root: '${{ first_nonempty(inputs.?repo_root, "/src") }}'
  skill_bundle_ref: '${{ first_nonempty(inputs.?skill_bundle_ref, "") }}'
sequence:
  - id: validate_bundle
    op: command_execution
    inputs:
      timeout: 30s
      working_directory: /tmp
      env:
        REPO_ROOT: "{{ inputs.repo_root }}"
      run: |
        set -euo pipefail

        root="${REPO_ROOT:-/src}"
        skill_root="$root/skills-bundle/.agents/skills"
        required_skills=(
          c2-superpowers-route
          c2-superpowers-brainstorm
          c2-superpowers-write-plan
          c2-superpowers-plan-review
          c2-superpowers-task-implementer
          c2-superpowers-spec-reviewer
          c2-superpowers-quality-reviewer
          c2-superpowers-debug
          c2-superpowers-verify
          c2-superpowers-finish
        )
        required_phrases=(
          "same-job Codex session"
          "C2 recipes own orchestration"
          "Do not dispatch subagents or child jobs"
          "Do not create git worktrees"
          "Do not make manual git commits"
          "status contract"
        )
        recipe_files=(
          recipes/superpowers/superpowers-route.yaml
          recipes/superpowers/superpowers-brainstorm.yaml
          recipes/superpowers/superpowers-write-plan.yaml
          recipes/superpowers/superpowers-plan-review.yaml
          recipes/superpowers/superpowers-execute-plan.yaml
          recipes/superpowers/superpowers-verify.yaml
          recipes/superpowers/superpowers-finish.yaml
          recipes/superpowers/superpowers-debug.yaml
          recipes/superpowers/superpowers.yaml
        )
        left_braces="$(printf '{%s' '{')"
        right_braces="$(printf '}%s' '}')"
        expected_skill_ref_template="$(printf '%s %s %s' "$left_braces" 'inputs.skill_bundle_ref' "$right_braces")"

        json_escape() {
          printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g'
        }

        skill_count=0
        actual_superpowers_skill_count=0
        missing_count=0
        unexpected_count=0
        violation_count=0
        recipe_skill_invocation_count=0
        skill_source_wiring_count=0
        skill_source_violation_count=0
        missing=""
        unexpected=""
        violations=""
        skill_source_violations=""

        for skill in "${required_skills[@]}"; do
          skill_count=$((skill_count + 1))
          dir="$skill_root/$skill"
          skill_md="$dir/SKILL.md"
          openai_yaml="$dir/agents/openai.yaml"

          if [ ! -f "$skill_md" ]; then
            missing_count=$((missing_count + 1))
            missing="$missing $skill/SKILL.md"
            continue
          fi
          if [ ! -f "$openai_yaml" ]; then
            missing_count=$((missing_count + 1))
            missing="$missing $skill/agents/openai.yaml"
          fi

          name="$(awk -F': *' '/^name: / { print $2; exit }' "$skill_md")"
          if [ "$name" != "$skill" ]; then
            violation_count=$((violation_count + 1))
            violations="$violations ${skill}:frontmatter-name"
          fi
          if ! grep -q '^description: ' "$skill_md"; then
            violation_count=$((violation_count + 1))
            violations="$violations ${skill}:missing-description"
          fi
          for phrase in "${required_phrases[@]}"; do
            if ! grep -Fq "$phrase" "$skill_md"; then
              violation_count=$((violation_count + 1))
              violations="$violations ${skill}:missing-${phrase// /_}"
            fi
          done
          if [ -f "$openai_yaml" ]; then
            if ! grep -q '^interface:' "$openai_yaml"; then
              violation_count=$((violation_count + 1))
              violations="$violations ${skill}:missing-openai-interface"
            fi
            if ! grep -q '^  default_prompt: ' "$openai_yaml"; then
              violation_count=$((violation_count + 1))
              violations="$violations ${skill}:missing-default-prompt"
            fi
          fi
        done

        for dir in "$skill_root"/c2-superpowers-*; do
          [ -d "$dir" ] || continue
          actual_superpowers_skill_count=$((actual_superpowers_skill_count + 1))
          actual_skill="$(basename "$dir")"
          expected=false
          for skill in "${required_skills[@]}"; do
            if [ "$actual_skill" = "$skill" ]; then
              expected=true
              break
            fi
          done
          if [ "$expected" != "true" ]; then
            unexpected_count=$((unexpected_count + 1))
            unexpected="$unexpected $actual_skill"
          fi
        done

        for recipe_file in "${recipe_files[@]}"; do
          path="$root/$recipe_file"
          if [ ! -f "$path" ]; then
            skill_source_violation_count=$((skill_source_violation_count + 1))
            skill_source_violations="$skill_source_violations ${recipe_file}:missing"
            continue
          fi

          prev_prev_line=""
          prev_line=""
          while IFS= read -r line || [ -n "$line" ]; do
            if [[ "$line" =~ ^([[:space:]]*)skill:\ c2-superpowers- ]]; then
              recipe_skill_invocation_count=$((recipe_skill_invocation_count + 1))
              indent="${BASH_REMATCH[1]}"
              expected_header="${indent}skills:"
              expected_item="${indent}  - \"${expected_skill_ref_template}\""
              if [ "$prev_prev_line" = "$expected_header" ] && [ "$prev_line" = "$expected_item" ]; then
                skill_source_wiring_count=$((skill_source_wiring_count + 1))
              else
                skill_source_violation_count=$((skill_source_violation_count + 1))
                skill_source_violations="$skill_source_violations ${recipe_file}:${recipe_skill_invocation_count}"
              fi
            fi
            prev_prev_line="$prev_line"
            prev_line="$line"
          done < "$path"
        done

        ok=false
        if [ "$missing_count" -eq 0 ] && [ "$unexpected_count" -eq 0 ] && [ "$violation_count" -eq 0 ] && [ "$skill_source_violation_count" -eq 0 ]; then
          ok=true
        fi

        out="{{ context.environment.op.outbox }}/superpowers/skills"
        mkdir -p "$out"
        cat > "$out/bundle-contract.json" <<JSON
        {
          "ok": $ok,
          "skill_count": $skill_count,
          "actual_superpowers_skill_count": $actual_superpowers_skill_count,
          "missing_count": $missing_count,
          "unexpected_count": $unexpected_count,
          "violation_count": $violation_count,
          "recipe_skill_invocation_count": $recipe_skill_invocation_count,
          "skill_source_wiring_count": $skill_source_wiring_count,
          "skill_source_violation_count": $skill_source_violation_count,
          "missing": "$(json_escape "$missing")",
          "unexpected": "$(json_escape "$unexpected")",
          "violations": "$(json_escape "$violations")",
          "skill_source_violations": "$(json_escape "$skill_source_violations")"
        }
        JSON
        cat "$out/bundle-contract.json"

outputs:
  ok: "${{ json_parse(sequence.validate_bundle.outputs.stdout).ok }}"
  skill_count: "${{ json_parse(sequence.validate_bundle.outputs.stdout).skill_count }}"
  actual_superpowers_skill_count: "${{ json_parse(sequence.validate_bundle.outputs.stdout).actual_superpowers_skill_count }}"
  missing_count: "${{ json_parse(sequence.validate_bundle.outputs.stdout).missing_count }}"
  unexpected_count: "${{ json_parse(sequence.validate_bundle.outputs.stdout).unexpected_count }}"
  violation_count: "${{ json_parse(sequence.validate_bundle.outputs.stdout).violation_count }}"
  recipe_skill_invocation_count: "${{ json_parse(sequence.validate_bundle.outputs.stdout).recipe_skill_invocation_count }}"
  skill_source_wiring_count: "${{ json_parse(sequence.validate_bundle.outputs.stdout).skill_source_wiring_count }}"
  skill_source_violation_count: "${{ json_parse(sequence.validate_bundle.outputs.stdout).skill_source_violation_count }}"
  has_recipe_skill_invocations: "${{ json_parse(sequence.validate_bundle.outputs.stdout).recipe_skill_invocation_count > 0 }}"
  all_recipe_skill_invocations_wired: "${{ json_parse(sequence.validate_bundle.outputs.stdout).recipe_skill_invocation_count == json_parse(sequence.validate_bundle.outputs.stdout).skill_source_wiring_count && json_parse(sequence.validate_bundle.outputs.stdout).skill_source_violation_count == 0 }}"
  missing: "${{ json_parse(sequence.validate_bundle.outputs.stdout).missing }}"
  unexpected: "${{ json_parse(sequence.validate_bundle.outputs.stdout).unexpected }}"
  violations: "${{ json_parse(sequence.validate_bundle.outputs.stdout).violations }}"
  skill_source_violations: "${{ json_parse(sequence.validate_bundle.outputs.stdout).skill_source_violations }}"
