id: superpowers-rule-gate-invalid-input-smoke
version: 0.1.0
desc: Negative smoke proving invalid rule_gate input fails validation instead of becoming policy data
sequence:
  - id: invalid_rule_gate
    op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
    inputs:
      rules:
        - id: missing_rule_type
          message: Invalid rule input must fail the node.

outputs:
  should_not_reach: true
