                      - done_with_concerns
                      - needs_context
                      - blocked
                      - needs_revision
                  summary:
                    type: string
                  validation_commands_run:
                    type: array
                    items:
                      type: string
                additionalProperties: true

          revise_tdd_after_quality:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: run_revision_green_test
                when: true
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                tdd_plan_json: "{{ states.collect_tdd_plan.outputs.stdout }}"
                red_summary: "{{ states.write_red_test.outputs.raw_output }}"
                green_summary: "{{ states.write_green_code.outputs.raw_output }}"
                refactor_summary: "{{ states.refactor_task.outputs.raw_output }}"
                spec_review: "{{ states.spec_review.outputs.raw_output }}"
                quality_review: "{{ states.quality_review.outputs.raw_output }}"
                revision_reason: quality_review
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Revise the selected TDD task to resolve the blocking quality
                review feedback. Preserve the RED test and keep the GREEN and
