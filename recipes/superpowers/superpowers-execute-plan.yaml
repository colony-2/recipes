id: superpowers-execute-plan
version: 0.1.0
desc: Execute one selected C2 Superpowers task boundary in the current job
input_schema:
  plan_json:
    type: string
    required: false
  task_id:
    type: string
    required: false
  skill_bundle_ref:
    type: string
    required: false
inputs:
  plan_json: '${{ inputs.?plan_json.orValue("") == "" || inputs.?plan_json.orValue("") == "null" ? "{}" : inputs.?plan_json.orValue("{}") }}'
  task_id: '${{ first_nonempty(inputs.?task_id, "") }}'
  skill_bundle_ref: '${{ first_nonempty(inputs.?skill_bundle_ref, "") }}'
state:
  initial: select_task
  states:
    select_task:
      op: command_execution
      transitions:
        - to: child_boundary_required
          when: json_parse(outputs.stdout).selected == true && json_parse(outputs.stdout).requires_child_job == true
        - to: run_tdd_task_boundary
          when: json_parse(outputs.stdout).selected == true && json_parse(outputs.stdout).selected_task.?requires_tdd.orValue(false) == true
        - to: run_task_boundary
          when: json_parse(outputs.stdout).selected == true && json_parse(outputs.stdout).requires_child_job != true
        - to: no_task_selected
          when: true
      inputs:
        timeout: 30s
        env:
          C2_PLAN_JSON: "{{ inputs.plan_json }}"
          C2_TASK_ID: "{{ inputs.task_id }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          python3 - <<'PY'
          import json
          import os
          import sys

          plan = json.loads(os.environ["C2_PLAN_JSON"])
          requested = os.environ.get("C2_TASK_ID", "")
          tasks = plan.get("tasks", [])
          by_id = {task.get("id", ""): task for task in tasks}

          selected = None
          if requested:
              selected = by_id.get(requested)
          if selected is None:
              for task_id in plan.get("ready_task_ids", []):
                  selected = by_id.get(task_id)
                  if selected is not None:
                      break
          if selected is None:
              for task in tasks:
                  if task.get("status", "pending") == "pending" and not task.get("dependencies", []):
                      selected = task
                      break
          if selected is None:
              print(json.dumps({
                  "selected": False,
                  "task_id": "",
                  "requires_child_job": False,
                  "child_job_reason": "",
                  "selected_task": {},
              }, sort_keys=True))
              sys.exit(0)

          result = {
              "selected": True,
              "task_id": selected.get("id", ""),
              "requires_child_job": bool(selected.get("requires_child_job", False)),
              "child_job_reason": selected.get("child_job_reason", ""),
              "selected_task": selected,
          }
          out = "{{ context.environment.op.outbox }}/superpowers/execution/selected-task.json"
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(result, fh, sort_keys=True)
              fh.write("\n")
          print(json.dumps(result, sort_keys=True))
          PY

    child_boundary_required:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        env:
          SELECTED_TASK_JSON: "{{ states.select_task.outputs.stdout }}"
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          printf '%s\n' "$SELECTED_TASK_JSON" > "{{ context.environment.op.outbox }}/superpowers/execution/child-boundary-required.json"
          printf '%s\n' "$SELECTED_TASK_JSON"

    no_task_selected:
      op: command_execution
      transitions: []
      inputs:
        timeout: 30s
        run: |
          set -euo pipefail
          mkdir -p "{{ context.environment.op.outbox }}/superpowers/execution"
          cat > "{{ context.environment.op.outbox }}/superpowers/execution/no-task-selected.json" <<'JSON'
          {"workflow_status":"no_task_selected","message":"No ready task was available for execution."}
          JSON
          cat "{{ context.environment.op.outbox }}/superpowers/execution/no-task-selected.json"

    run_task_boundary:
      inputs:
        selected_task_json: "{{ states.select_task.outputs.stdout }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
      state:
        initial: implement_task
        states:
          implement_task:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: spec_review
                when: true
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Implement exactly the selected task inside the current C2 job.

                The selected task JSON is provided in the invocation input.
                Do not create child jobs, create git worktrees, or make manual
                git commits. C2 owns git persistence and gates.

                Write:
                - `superpowers/tasks/<task-id>/implementation-summary.md`
                - `superpowers/tasks/latest-status.json`
                - `superpowers/tasks/result.json`
            status_contract:
              path: superpowers/tasks/latest-status.json
            output:
              from: artifact
              path: superpowers/tasks/result.json
              format: json
              schema: &task_result_schema
                type: object
                required:
                  - task_id
                  - status
                  - summary
                  - validation_commands_run
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - done
                      - done_with_concerns
                      - needs_context
                      - blocked
                      - needs_revision
                  summary:
                    type: string
                  validation_commands_run:
                    type: array
                    items:
                      type: string
                additionalProperties: true

          spec_review:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: quality_review
                when: outputs.parsed_output.?ok.orValue(false)
              - to: revise_after_spec
                when: outputs.parsed_output.?requires_revision.orValue(false) || !outputs.parsed_output.?ok.orValue(false)
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-spec-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.implement_task.outputs.raw_output }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Review the selected task for spec compliance only.

                Do not implement fixes. Do not create child jobs, worktrees, or
                manual commits. Write the spec review result artifact.
            status_contract:
              path: superpowers/tasks/spec-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/spec-review.json
              format: json
              schema: &review_result_schema
                type: object
                required:
                  - ok
                  - blocking_issues
                  - feedback
                  - requires_revision
                properties:
                  ok:
                    type: boolean
                  blocking_issues:
                    type: array
                    items:
                      type: string
                  feedback:
                    type: string
                  requires_revision:
                    type: boolean
                additionalProperties: true

          quality_review:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: task_gate
                when: outputs.parsed_output.?ok.orValue(false)
              - to: revise_after_quality
                when: outputs.parsed_output.?requires_revision.orValue(false) || !outputs.parsed_output.?ok.orValue(false)
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-quality-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.implement_task.outputs.raw_output }}"
                spec_review: "{{ states.spec_review.outputs.raw_output }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Review the selected task for quality, maintainability, test
                quality, compatibility, and C2 safety.

                Do not implement fixes. Do not create child jobs, worktrees, or
                manual commits. Write the quality review result artifact.
            status_contract:
              path: superpowers/tasks/quality-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/quality-review.json
              format: json
              schema: *review_result_schema

          revise_after_spec:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: spec_review_after_revision
                when: true
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.implement_task.outputs.raw_output }}"
                spec_review: "{{ states.spec_review.outputs.raw_output }}"
                revision_reason: spec_review
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Revise the selected task to resolve the blocking spec review
                feedback. Do not create child jobs, create worktrees, or make
                manual commits. Write the normal task result artifact after the
                revision.
            status_contract:
              path: superpowers/tasks/latest-status.json
            output:
              from: artifact
              path: superpowers/tasks/result.json
              format: json
              schema: *task_result_schema

          revise_after_quality:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: spec_review_after_revision
                when: true
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "{{ states.implement_task.outputs.raw_output }}"
                spec_review: "{{ states.spec_review.outputs.raw_output }}"
                quality_review: "{{ states.quality_review.outputs.raw_output }}"
                revision_reason: quality_review
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Revise the selected task to resolve the blocking quality review
                feedback while preserving spec compliance. Do not create child
                jobs, create worktrees, or make manual commits. Write the normal
                task result artifact after the revision.
            status_contract:
              path: superpowers/tasks/latest-status.json
            output:
              from: artifact
              path: superpowers/tasks/result.json
              format: json
              schema: *task_result_schema

          spec_review_after_revision:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: quality_review_after_revision
                when: outputs.parsed_output.?ok.orValue(false)
              - to: task_needs_revision
                when: true
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-spec-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "${{ first_nonempty(state_output('revise_after_spec', 'raw_output', ''), state_output('revise_after_quality', 'raw_output', ''), state_output('implement_task', 'raw_output', '')) }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Re-review the revised task for spec compliance only.

                Do not implement fixes. Do not create child jobs, worktrees, or
                manual commits. Write the spec review result artifact.
            status_contract:
              path: superpowers/tasks/spec-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/spec-review.json
              format: json
              schema: *review_result_schema

          quality_review_after_revision:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: task_gate_after_revision
                when: outputs.parsed_output.?ok.orValue(false)
              - to: task_needs_revision
                when: true
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-quality-reviewer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                implementer_summary: "${{ first_nonempty(state_output('revise_after_spec', 'raw_output', ''), state_output('revise_after_quality', 'raw_output', ''), state_output('implement_task', 'raw_output', '')) }}"
                spec_review: "{{ states.spec_review_after_revision.outputs.raw_output }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                Re-review the revised task for quality, maintainability, test
                quality, compatibility, and C2 safety. Do not implement fixes,
                create child jobs, create worktrees, or make manual commits.
            status_contract:
              path: superpowers/tasks/quality-review-status.json
            output:
              from: artifact
              path: superpowers/tasks/quality-review.json
              format: json
              schema: *review_result_schema

          task_gate:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions: []
            inputs:
              rules:
                - id: implementation_done
                  type: assert
                  value: '${{ states.implement_task.outputs.parsed_output.?status.orValue("") == "done" }}'
                  message: Implementer must report task status done.
                - id: spec_review_ok
                  type: assert
                  value: '${{ states.spec_review.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Spec review must pass.
                - id: quality_review_ok
                  type: assert
                  value: '${{ states.quality_review.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Quality review must pass.

          task_gate_after_revision:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions: []
            inputs:
              rules:
                - id: implementation_done_after_revision
                  type: assert
                  value: '${{ first_nonempty(state_output("revise_after_spec", "parsed_output.status", ""), state_output("revise_after_quality", "parsed_output.status", "")) == "done" }}'
                  message: Revision must report task status done.
                - id: spec_review_ok_after_revision
                  type: assert
                  value: '${{ states.spec_review_after_revision.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Spec review must pass after revision.
                - id: quality_review_ok_after_revision
                  type: assert
                  value: '${{ states.quality_review_after_revision.outputs.parsed_output.?ok.orValue(false) }}'
                  message: Quality review must pass after revision.

          task_needs_revision:
            op: command_execution
            transitions: []
            inputs:
              timeout: 30s
              run: |
                set -euo pipefail
                mkdir -p "{{ context.environment.op.outbox }}/superpowers/tasks"
                cat > "{{ context.environment.op.outbox }}/superpowers/tasks/revision-required.json" <<'JSON'
                {"task_status":"needs_revision","reason":"Review blockers remain after one recipe-owned revision pass."}
                JSON
                cat "{{ context.environment.op.outbox }}/superpowers/tasks/revision-required.json"
      transitions: []
      outputs:
        implementer_session_id: "${{ first_nonempty(state_output('revise_after_spec', 'sessionId', ''), state_output('revise_after_quality', 'sessionId', ''), state_output('implement_task', 'sessionId', '')) }}"
        revision_session_id: "${{ first_nonempty(state_output('revise_after_spec', 'sessionId', ''), state_output('revise_after_quality', 'sessionId', '')) }}"
        spec_reviewer_session_id: "${{ first_nonempty(state_output('spec_review_after_revision', 'sessionId', ''), state_output('spec_review', 'sessionId', '')) }}"
        quality_reviewer_session_id: "${{ first_nonempty(state_output('quality_review_after_revision', 'sessionId', ''), state_output('quality_review', 'sessionId', '')) }}"
        implementation_status: "${{ first_nonempty(state_output('revise_after_spec', 'parsed_output.status', ''), state_output('revise_after_quality', 'parsed_output.status', ''), state_output('implement_task', 'parsed_output.status', '')) }}"
        spec_review_ok: "${{ state_output('spec_review_after_revision', 'parsed_output.ok', false) || state_output('spec_review', 'parsed_output.ok', false) }}"
        quality_review_ok: "${{ state_output('quality_review_after_revision', 'parsed_output.ok', false) || state_output('quality_review', 'parsed_output.ok', false) }}"
        task_gate_ok: "${{ state_output('task_gate_after_revision', 'ok', false) || state_output('task_gate', 'ok', false) }}"
        revision_attempted: "${{ state_output('revise_after_spec', 'sessionId', '') != '' || state_output('revise_after_quality', 'sessionId', '') != '' }}"

    run_tdd_task_boundary:
      inputs:
        selected_task_json: "{{ states.select_task.outputs.stdout }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
      state:
        initial: collect_tdd_plan
        states:
          collect_tdd_plan:
            op: command_execution
            transitions:
              - to: write_red_test
                when: true
            inputs:
              timeout: 30s
              env:
                SELECTED_TASK_JSON: "{{ inputs.selected_task_json }}"
              run: |
                set -euo pipefail
                mkdir -p "{{ context.environment.op.outbox }}/superpowers/tasks/tdd"
                python3 - <<'PY'
                import json
                import os

                selected = json.loads(os.environ["SELECTED_TASK_JSON"])
                task = selected.get("selected_task", selected)
                tdd = task.get("tdd", {}) or {}
                validation_commands = task.get("validation_commands", []) or []
                first_validation = next((str(cmd).strip() for cmd in validation_commands if str(cmd).strip()), "")

                red_command = (
                    task.get("tdd_red_command")
                    or tdd.get("red_command")
                    or task.get("red_command")
                    or first_validation
                )
                green_command = (
                    task.get("tdd_green_command")
                    or tdd.get("green_command")
                    or task.get("green_command")
                    or red_command
                )
                refactor_command = (
                    task.get("tdd_refactor_command")
                    or tdd.get("refactor_verification_command")
                    or task.get("refactor_verification_command")
                    or green_command
                )
                expected_failure = (
                    task.get("tdd_expected_failure")
                    or tdd.get("red_expected_failure")
                    or task.get("red_expected_failure")
                    or ""
                )
                result = {
                    "task_id": task.get("id", selected.get("task_id", "")),
                    "requires_tdd": bool(task.get("requires_tdd", False)),
                    "red_command": red_command,
                    "red_expected_failure": expected_failure,
                    "green_command": green_command,
                    "refactor_verification_command": refactor_command,
                }
                out = "{{ context.environment.op.outbox }}/superpowers/tasks/tdd/plan.json"
                with open(out, "w", encoding="utf-8") as fh:
                    json.dump(result, fh, sort_keys=True)
                    fh.write("\n")
                print(json.dumps(result, sort_keys=True))
                PY

          write_red_test:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: run_red_test
                when: true
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                tdd_plan_json: "{{ states.collect_tdd_plan.outputs.stdout }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                RED phase for the selected task. Write only the failing
                behavioral test for the selected behavior. Do not implement
                production code, create child jobs, create worktrees, or make
                manual commits.

                Write `superpowers/tasks/tdd/red-result.json`.
            status_contract:
              path: superpowers/tasks/tdd/red-status.json
            output:
              from: artifact
              path: superpowers/tasks/tdd/red-result.json
              format: json
              schema:
                type: object
                required:
                  - task_id
                  - status
                  - summary
                  - red_command
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                  summary:
                    type: string
                  red_command:
                    type: string
                additionalProperties: true

          run_red_test:
            op: command_execution
            transitions:
              - to: assert_red
                when: true
            inputs:
              timeout: 60m
              continue_on_error: true
              env:
                WT: "{{ context.environment.op.worktree_path }}"
                TDD_PLAN_JSON: "{{ states.collect_tdd_plan.outputs.stdout }}"
              run: |
                set -uo pipefail
                OUT="{{ context.environment.op.outbox }}"
                mkdir -p "$OUT/superpowers/tasks/tdd"
                cd "$WT"

                python3 - <<'PY' > "$OUT/superpowers/tasks/tdd/red-command.sh"
                import json
                import os

                plan = json.loads(os.environ["TDD_PLAN_JSON"])
                command = plan.get("red_command", "").strip()
                print("set -euo pipefail")
                if not command:
                    print("echo 'No RED command was provided.'")
                    print("exit 2")
                else:
                    print(command)
                PY

                set +e
                bash "$OUT/superpowers/tasks/tdd/red-command.sh" 2>&1 | tee "$OUT/superpowers/tasks/tdd/red-output.txt"
                RC=${PIPESTATUS[0]}
                set -e
                exit "$RC"

          assert_red:
            op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
            transitions:
              - to: write_green_code
                when: outputs.?ok.orValue(false)
              - to: tdd_failed
                when: true
            inputs:
              rules:
                - id: red_command_present
                  type: assert
                  value: ${{ json_parse(states.collect_tdd_plan.outputs.stdout).red_command != "" }}
                  message: TDD RED command must be present.
                - id: red_command_failed
                  type: assert
                  value: ${{ states.run_red_test.outputs.exit_code != 0 }}
                  message: RED command must fail before GREEN implementation.
                - id: red_expected_failure_observed
                  type: assert
                  value: ${{ json_parse(states.collect_tdd_plan.outputs.stdout).red_expected_failure == "" || states.run_red_test.outputs.stdout.contains(json_parse(states.collect_tdd_plan.outputs.stdout).red_expected_failure) || states.run_red_test.outputs.stderr.contains(json_parse(states.collect_tdd_plan.outputs.stdout).red_expected_failure) }}
                  message: RED failure must match the expected failure when one is supplied.
                - id: red_output_schema_valid
                  type: assert
                  value: '${{ states.write_red_test.outputs.?output_schema_valid.orValue(false) }}'
                  message: RED phase must write the expected result artifact.

          write_green_code:
            op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
            transitions:
              - to: run_green_test
                when: true
            inputs:
              skills:
                - "{{ inputs.skill_bundle_ref }}"
              skill: c2-superpowers-task-implementer
              input:
                selected_task_json: "{{ inputs.selected_task_json }}"
                tdd_plan_json: "{{ states.collect_tdd_plan.outputs.stdout }}"
                red_exit_code: "${{ states.run_red_test.outputs.exit_code }}"
                red_stdout: "{{ states.run_red_test.outputs.stdout }}"
                red_stderr: "{{ states.run_red_test.outputs.stderr }}"
                skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
              prompt: |
                GREEN phase for the selected task. Implement the minimal code
                necessary to make the RED test pass. Do not create child jobs,
                create worktrees, or make manual commits.

                Write `superpowers/tasks/tdd/green-result.json`.
            status_contract:
              path: superpowers/tasks/tdd/green-status.json
            output:
              from: artifact
              path: superpowers/tasks/tdd/green-result.json
              format: json
              schema:
                type: object
                required:
                  - task_id
                  - status
                  - summary
                  - validation_commands_run
                properties:
                  task_id:
                    type: string
                  status:
                    type: string
                    enum:
                      - done
                      - done_with_concerns
                      - needs_context
                      - blocked
                      - needs_revision
                  summary:
                    type: string
                  validation_commands_run:
                    type: array
                    items:
                      type: string
                additionalProperties: true

          run_green_test:
            op: command_execution
            transitions:
              - to: assert_green
                when: true
            inputs:
              timeout: 60m
              continue_on_error: true
              env:
                WT: "{{ context.environment.op.worktree_path }}"
                TDD_PLAN_JSON: "{{ states.collect_tdd_plan.outputs.stdout }}"
              run: |
                set -uo pipefail
                OUT="{{ context.environment.op.outbox }}"
                mkdir -p "$OUT/superpowers/tasks/tdd"
                cd "$WT"

                python3 - <<'PY' > "$OUT/superpowers/tasks/tdd/green-command.sh"
                import json
                import os

                plan = json.loads(os.environ["TDD_PLAN_JSON"])
