        tdd_evidence_ok: "${{ state_output('assert_red', 'ok', false) && (state_output('assert_revision_green', 'ok', false) || state_output('assert_green', 'ok', false)) && (state_output('assert_revision_refactor', 'ok', false) || state_output('assert_refactor', 'ok', false)) }}"

outputs:
  selected_task_id: "${{ json_parse(state_output('select_task', 'stdout', '{}')).task_id }}"
  selected_task_json: "${{ state_output('select_task', 'stdout', '{}') }}"
