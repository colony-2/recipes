  revision_session_id: "${{ json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job ? '' : first_nonempty(state_output('run_task_boundary', 'revision_session_id', ''), state_output('run_tdd_task_boundary', 'revision_session_id', '')) }}"
  revision_attempted: "${{ !json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job && (state_output('run_task_boundary', 'revision_attempted', false) || state_output('run_tdd_task_boundary', 'revision_attempted', false)) }}"
  spec_reviewer_session_id: "${{ json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job ? '' : first_nonempty(state_output('run_task_boundary', 'spec_reviewer_session_id', ''), state_output('run_tdd_task_boundary', 'spec_reviewer_session_id', '')) }}"
  quality_reviewer_session_id: "${{ json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job ? '' : first_nonempty(state_output('run_task_boundary', 'quality_reviewer_session_id', ''), state_output('run_tdd_task_boundary', 'quality_reviewer_session_id', '')) }}"
  implementation_raw_output: "${{ json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job ? '' : first_nonempty(state_output('run_task_boundary', 'implementation_raw_output', ''), state_output('run_tdd_task_boundary', 'implementation_raw_output', '')) }}"
  implementation_status: "${{ json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job ? '' : first_nonempty(state_output('run_task_boundary', 'implementation_status', ''), state_output('run_tdd_task_boundary', 'implementation_status', '')) }}"
  spec_review_ok: "${{ json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job ? false : (state_output('run_task_boundary', 'spec_review_ok', false) || state_output('run_tdd_task_boundary', 'spec_review_ok', false)) }}"
  quality_review_ok: "${{ json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job ? false : (state_output('run_task_boundary', 'quality_review_ok', false) || state_output('run_tdd_task_boundary', 'quality_review_ok', false)) }}"
  task_gate_ok: "${{ json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job ? false : (state_output('run_task_boundary', 'task_gate_ok', false) || state_output('run_tdd_task_boundary', 'task_gate_ok', false)) }}"
  task_done: "${{ !json_parse(state_output('select_task', 'stdout', '{}')).requires_child_job && (state_output('run_task_boundary', 'task_gate_ok', false) || state_output('run_tdd_task_boundary', 'task_gate_ok', false)) }}"
  tdd_evidence_ok: "${{ state_output('run_tdd_task_boundary', 'tdd_evidence_ok', false) }}"
  tdd_red_exit_code: "${{ state_output('run_tdd_task_boundary', 'tdd_red_exit_code', -1) }}"
  tdd_green_exit_code: "${{ state_output('run_tdd_task_boundary', 'tdd_green_exit_code', -1) }}"
  tdd_refactor_exit_code: "${{ state_output('run_tdd_task_boundary', 'tdd_refactor_exit_code', -1) }}"
