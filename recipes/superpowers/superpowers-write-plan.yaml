id: superpowers-write-plan
version: 0.1.0
desc: Convert an approved C2 Superpowers design into an executable task plan
input_schema:
  prompt:
    type: string
    required: true
  design_json:
    type: string
    required: false
  user_feedback:
    type: string
    required: false
  skill_bundle_ref:
    type: string
    required: false
inputs:
  prompt: "{{ inputs.prompt }}"
  design_json: '${{ first_nonempty(inputs.?design_json, "{}") }}'
  user_feedback: '${{ first_nonempty(inputs.?user_feedback, "") }}'
  skill_bundle_ref: '${{ first_nonempty(inputs.?skill_bundle_ref, "") }}'
sequence:
  - id: write_plan
    op: nix:github:colony-2/c2ops/main#skill-run
    inputs:
      skills:
        - "{{ inputs.skill_bundle_ref }}"
      skill: c2-superpowers-write-plan
      input:
        ticket_prompt: "{{ inputs.prompt }}"
        design_json: "{{ inputs.design_json }}"
        user_feedback: "{{ inputs.user_feedback }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
      prompt: |
        Convert the approved design into a C2 Superpowers task plan.

        Use the `c2-superpowers-write-plan` contract. If a skill bundle ref is
        provided, it identifies the expected C2 Superpowers skills bundle:
        `{{ inputs.skill_bundle_ref }}`.

        Write:
        - `superpowers/plan/plan.md`
        - `superpowers/plan/plan.json`
        - `superpowers/plan/latest-status.json`

        Do not add manual commit steps. Do not create child jobs for ordinary
        dependent tasks. Mark a task `requires_child_job=true` only for a real
        C2 job boundary such as target-ref advancement, cross-cell work, reuse,
        true parallelism, or lifecycle isolation.

        For behavior-changing tasks that need TDD, set `requires_tdd=true` and
        include `tdd.red_command`, `tdd.green_command`, and
        `tdd.refactor_verification_command`. These commands are executed by the
        recipe gates; do not treat them as advisory text.
      status_contract:
        path: superpowers/plan/latest-status.json
      output:
        from: artifact
        path: superpowers/plan/plan.json
        format: json
        schema:
          type: object
          required:
            - plan_id
            - summary
            - tasks
            - ready_task_ids
            - validation_strategy
            - child_job_boundaries
          properties:
            plan_id:
              type: string
              minLength: 1
            summary:
              type: string
              minLength: 1
            tasks:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - id
                  - title
                  - status
                  - dependencies
                  - target_ref
                  - requires_child_job
                  - child_job_reason
                  - instructions
                  - validation_commands
                  - review_requirements
                properties:
                  id:
                    type: string
                    minLength: 1
                  title:
                    type: string
                    minLength: 1
                  status:
                    type: string
                  dependencies:
                    type: array
                    items:
                      type: string
                  target_ref:
                    type: string
                    minLength: 1
                  requires_child_job:
                    type: boolean
                  requires_tdd:
                    type: boolean
                  child_job_reason:
                    type: string
                  instructions:
                    type: string
                    minLength: 1
                  validation_commands:
                    type: array
                    items:
                      type: string
                  review_requirements:
                    type: array
                    items:
                      type: string
                  tdd:
                    type: object
                    required:
                      - red_command
                      - green_command
                      - refactor_verification_command
                    properties:
                      red_command:
                        type: string
                        minLength: 1
                      red_expected_failure:
                        type: string
                      green_command:
                        type: string
                        minLength: 1
                      refactor_verification_command:
                        type: string
                        minLength: 1
                    additionalProperties: true
            ready_task_ids:
              type: array
              minItems: 1
              items:
                type: string
            validation_strategy:
              type: object
            child_job_boundaries:
              type: array
              items:
                type: object
                required:
                  - task_id
                  - reason
                properties:
                  task_id:
                    type: string
                  reason:
                    type: string
                    minLength: 1
          additionalProperties: true

  - id: plan_gate
    op: nix:github:colony-2/c2ops/main#rule_gate
    inputs:
      rules:
        - id: plan_completed
          type: assert
          value: ${{ sequence.write_plan.outputs.?status.orValue("") == "completed" || sequence.write_plan.outputs.?status.orValue("") == "incomplete" }}
          message: Write-plan skill must return a normalized Codex status.
        - id: plan_output_schema_valid
          type: assert
          value: ${{ sequence.write_plan.outputs.?output_schema_valid.orValue(false) }}
          message: Plan artifact must match the C2 Superpowers task-plan schema.
        - id: plan_status_contract_valid
          type: assert
          value: ${{ sequence.write_plan.outputs.?status_contract_present.orValue(false) && sequence.write_plan.outputs.?status_contract_valid.orValue(false) }}
          message: Plan status contract must be present and valid.
        - id: ready_task_exists
          type: assert
          value: ${{ size(sequence.write_plan.outputs.parsed_output.?ready_task_ids.orValue([])) > 0 }}
          message: Plan must expose at least one ready task id.
        - id: child_job_reasons_required
          type: assert
          value: ${{ sequence.write_plan.outputs.parsed_output.?tasks.orValue([]).all(t, !t.requires_child_job || t.child_job_reason != "") }}
          message: Tasks that require child jobs must explain the C2 boundary.
        - id: child_job_boundaries_cover_required_tasks
          type: assert
          value: ${{ sequence.write_plan.outputs.parsed_output.?tasks.orValue([]).all(t, !t.requires_child_job || sequence.write_plan.outputs.parsed_output.?child_job_boundaries.orValue([]).exists(b, b.task_id == t.id && b.reason != "")) }}
          message: Every task requiring a child job must have a matching child_job_boundaries entry.
        - id: child_job_boundaries_match_child_tasks
          type: assert
          value: ${{ sequence.write_plan.outputs.parsed_output.?child_job_boundaries.orValue([]).all(b, sequence.write_plan.outputs.parsed_output.?tasks.orValue([]).exists(t, t.id == b.task_id && t.requires_child_job)) }}
          message: Child-job boundary entries must reference tasks marked requires_child_job=true.
        - id: tdd_tasks_include_recipe_commands
          type: assert
          value: ${{ sequence.write_plan.outputs.parsed_output.?tasks.orValue([]).all(t, !has(t.requires_tdd) || !t.requires_tdd || (has(t.tdd) && has(t.tdd.red_command) && t.tdd.red_command != "" && has(t.tdd.green_command) && t.tdd.green_command != "" && has(t.tdd.refactor_verification_command) && t.tdd.refactor_verification_command != "")) }}
          message: TDD tasks must include RED, GREEN, and refactor verification commands for recipe gates.

outputs:
  plan_ok: "${{ sequence.plan_gate.outputs.?ok.orValue(false) }}"
  plan_failed_rule_ids: "${{ sequence.plan_gate.outputs.?failed_rule_ids.orValue([]) }}"
  plan_failed_rule_count: "${{ size(sequence.plan_gate.outputs.?failed_rule_ids.orValue([])) }}"
  child_boundary_coverage_failed: '${{ "child_job_boundaries_cover_required_tasks" in sequence.plan_gate.outputs.?failed_rule_ids.orValue([]) }}'
  child_boundary_orphan_failed: '${{ "child_job_boundaries_match_child_tasks" in sequence.plan_gate.outputs.?failed_rule_ids.orValue([]) }}'
  plan_id: '${{ sequence.write_plan.outputs.parsed_output.?plan_id.orValue("") }}'
  summary: '${{ sequence.write_plan.outputs.parsed_output.?summary.orValue("") }}'
  plan_json: '${{ sequence.write_plan.outputs.?raw_output.orValue("{}") }}'
  tasks: "${{ sequence.write_plan.outputs.parsed_output.?tasks.orValue([]) }}"
  task_count: "${{ size(sequence.write_plan.outputs.parsed_output.?tasks.orValue([])) }}"
  ready_task_ids: "${{ sequence.write_plan.outputs.parsed_output.?ready_task_ids.orValue([]) }}"
  first_ready_task_id: '${{ jq(sequence.write_plan.outputs.?parsed_output.orValue({"ready_task_ids":[]}), ".ready_task_ids[0] // \"\"") }}'
  validation_strategy: "${{ sequence.write_plan.outputs.parsed_output.?validation_strategy.orValue({}) }}"
  child_job_boundaries: "${{ sequence.write_plan.outputs.parsed_output.?child_job_boundaries.orValue([]) }}"
  child_job_boundary_count: "${{ size(sequence.write_plan.outputs.parsed_output.?child_job_boundaries.orValue([])) }}"
  tdd_task_count: "${{ jq(sequence.write_plan.outputs.?parsed_output.orValue({\"tasks\":[]}), '.tasks | map(select(.requires_tdd == true)) | length') }}"
  first_task_tdd_red_command: "${{ jq(sequence.write_plan.outputs.?parsed_output.orValue({\"tasks\":[]}), '.tasks[0].tdd.red_command // \"\"') }}"
  first_task_tdd_green_command: "${{ jq(sequence.write_plan.outputs.?parsed_output.orValue({\"tasks\":[]}), '.tasks[0].tdd.green_command // \"\"') }}"
  first_task_tdd_refactor_command: "${{ jq(sequence.write_plan.outputs.?parsed_output.orValue({\"tasks\":[]}), '.tasks[0].tdd.refactor_verification_command // \"\"') }}"
  write_plan_session_id: '${{ sequence.write_plan.outputs.?sessionId.orValue("") }}'
  write_plan_session: '${{ sequence.write_plan.outputs.?session.orValue(null) }}'
  output_schema_valid: "${{ sequence.write_plan.outputs.?output_schema_valid.orValue(false) }}"
  status_contract_valid: "${{ sequence.write_plan.outputs.?status_contract_valid.orValue(false) }}"
