id: build-hook-settings-argument
inputs:
  settings: ${{ inputs.settings }}
state:
  initial:
  - to: provided
    when: inputs.settings != null
  - to: defaults
    when: 'true'
  states:
    provided:
      sequence: []
      outputs:
        artifact: ${{ inputs.settings }}
      inputs:
        settings: ${{ inputs.settings }}
    defaults:
      include: ./settings.yaml
      inputs:
        settings: {}
outputs:
  artifact: "${{ state_exists('provided') ? states.provided.outputs.artifact : states.defaults.outputs.artifact_refs['build-settings.json']
    }}"
