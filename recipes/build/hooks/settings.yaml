id: build-hook-settings
inputs:
  settings: ${{ inputs.settings }}
vars:
  normalized: "${{ jq([{'require_design': false, 'prompt_additions': {}, 'variables': {}, 'consultations': []},
    inputs.settings], 'add') }}"
outputs:
  settings: ${{ states.write.outputs.settings }}
  artifact_refs: ${{ states.write.outputs.artifact_refs }}
state:
  initial:
  - to: write
    when: size(json_stringify(vars.normalized)) <= 16000 && size(vars.normalized.consultations.map(c, c.key))
      == size(jq(vars.normalized.consultations, 'map(.key) | unique'))
  - to: invalid
    when: 'true'
  states:
    write:
      sequence: []
      outputs:
        settings: ${{ vars.normalized }}
        artifact_refs:
          build-settings.json:
            kind: value
            name: build-settings.json
            format: json
            value: ${{ vars.normalized }}
      inputs:
        settings: ${{ inputs.settings }}
    invalid:
      id: invalid
      op: command_execution
      const: true
      inputs:
        run: |-
          echo "Build settings exceed 16000 characters or contain duplicate consultation keys" >&2
          exit 1
