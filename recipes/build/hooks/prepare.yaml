id: build-hook-prepare
version: 1.0.0
inputs:
  request: ${{ inputs.?request.orValue('') }}
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
  documents: ${{ inputs.?documents.orValue({}) }}
  settings: ${{ inputs.?settings.orValue(null) }}
  round: ${{ inputs.?round.orValue(0) }}
sequence:
- id: capture_candidate
  op: command_execution
  const: true
  inputs:
    run: |
      set -eu
      case "$DIRECTORY" in ""|/*|..|../*|*/../*|*/..) echo "Invalid repository-relative target directory" >&2; exit 1;; esac
      test -d "$WORKTREE/$DIRECTORY" || { echo "Target directory does not exist" >&2; exit 1; }
      git rev-parse HEAD
    env:
      DIRECTORY: ${{ inputs.target_directory }}
      WORKTREE: ${{ context.environment.op.worktree_path }}
- id: resolve_settings
  include: ./settings-argument.yaml
  inputs:
    settings: ${{ inputs.settings }}
- id: invoke_hook
  include:
    recipe: cell://.c2/recipes/hooks/build/prepare.yaml
    if_missing:
      outputs:
        api_version: c2.build-hook/v1
        status: skipped
        summary: No repository prepare hook is configured.
        artifact_refs: {}
  inputs:
    api_version: c2.build-hook/v1
    request: ${{ inputs.request }}
    target_directory: ${{ inputs.target_directory }}
    candidate: ${{ context.git.hash }}
    base: ${{ context.git.execution.base_hash }}
    documents: ${{ inputs.documents }}
    settings: ${{ sequence.resolve_settings.outputs.artifact }}
  expect_outputs:
    type: object
    additionalProperties: false
    required:
    - api_version
    - status
    - summary
    - artifact_refs
    properties:
      api_version:
        type: string
        enum:
        - c2.build-hook/v1
      status:
        type: string
        enum:
        - passed
        - failed
        - skipped
      summary:
        type: string
        minLength: 1
        maxLength: 8192
      artifact_refs:
        type: object
        maxProperties: 64
        propertyNames:
          pattern: ^[a-zA-Z0-9_-][a-zA-Z0-9_./-]*$
        additionalProperties:
          type: object
- id: check_hook_candidate
  op: command_execution
  const: true
  inputs:
    run: |
      set -eu
      test -d "$TARGET" || { echo "Target directory does not exist" >&2; exit 1; }
      git rev-parse HEAD
    env:
      BEFORE: ${{ jq(sequence.capture_candidate.outputs.stdout, 'rtrimstr("\n")') }}
      TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
      STATUS: ${{ sequence.invoke_hook.outputs.status }}
- id: report
  include: ./report.yaml
  inputs:
    hook: prepare
    round: ${{ inputs.round }}
    candidate: ${{ jq(sequence.capture_candidate.outputs.stdout, 'rtrimstr("\n")') }}
    result_candidate: ${{ jq(sequence.check_hook_candidate.outputs.stdout, 'rtrimstr("\n")') }}
    result: ${{ sequence.invoke_hook.outputs }}
outputs:
  result: ${{ sequence.report.outputs.result }}
  artifact_refs: ${{ sequence.report.outputs.artifact_refs }}
  candidate: ${{ jq(sequence.check_hook_candidate.outputs.stdout, 'rtrimstr("\n")') }}
