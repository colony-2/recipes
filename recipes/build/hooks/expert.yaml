id: build-expert
inputs:
  thread: ${{ inputs.thread }}
  request: ${{ inputs.request }}
  consultant_role: ${{ inputs.consultant_role }}
  requester_session: ${{ inputs.requester_session }}
  documents: ${{ inputs.documents }}
state:
  initial:
  - to: resume
    when: size(inputs.requester_session) > 0
  - to: start
    when: 'true'
  states:
    resume:
      include: ../../kernel/consultation.yaml
      inputs:
        thread: ${{ inputs.thread }}
        request: ${{ inputs.request }}
        consultant_role: ${{ inputs.consultant_role }}
        requester_session: ${{ inputs.requester_session }}
        documents: ${{ inputs.documents }}
    start:
      include: ../../kernel/consultation.yaml
      inputs:
        thread: ${{ inputs.thread }}
        request: ${{ inputs.request }}
        consultant_role: ${{ inputs.consultant_role }}
        documents: ${{ inputs.documents }}
outputs:
  outcome: ${{ state_output('resume', 'outcome', state_output('start', 'outcome', '')) }}
  assessment: ${{ state_output('resume', 'assessment', state_output('start', 'assessment', '')) }}
  requester_session: ${{ state_output('resume', 'requester_session', state_output('start',
    'requester_session', {})) }}
  final_artifacts: ${{ state_output('resume', 'final_artifacts', state_output('start', 'final_artifacts', {}))
    }}
  transcript: ${{ state_output('resume', 'transcript', state_output('start', 'transcript', {})) }}
