id: skill-quality-smoke
version: 0.3.0
sequence:
  - id: prepare_worktree
    op: command_execution
    inputs:
      timeout: 5m
      working_directory: /tmp
      env:
        WT: "{{ context.environment.op.worktree_path }}"
      run: |
        set -euo pipefail
        mkdir -p "$WT"

  - id: triage_local
    op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@ded76dfbd877d3d0749e509844ecdbc57197b572
    inputs:
      sandbox:
        type: none
      worktree_path: "{{ context.environment.op.worktree_path }}"
      workdir_path: "{{ context.environment.op.workdir }}"
      artifact_inbox_path: "{{ context.environment.op.inbox }}"
      artifact_outbox_path: "{{ context.environment.op.outbox }}"
      skill: "c2-triage-cell-boundary"
      skills:
        - "gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7"
      prompt: |
        Follow the `c2-triage-cell-boundary` skill contract.

        Job Title: Improve recipe test execution guidance
        Job Description:
        Add non-breaking recipe test coverage and supporting guidance for the recipe-testing cell.

        Current Cell: recipe-tests
        Available Cells (name, description):
        [
          {"name":"recipe-tests","description":"Recipe authoring, testing, and workflow guidance."},
          {"name":"frontend","description":"UI implementation and styling."},
          {"name":"infra","description":"Infrastructure provisioning and deployment automation."}
        ]

        Decide if the current cell is appropriate to run the work.
        - Treat the current cell as appropriate ONLY if it is the best match among the Available Cells.
        - Prefer specialized cells over general-purpose cells when a specialized cell clearly matches.
        - If the current cell is not the best match, set cell_is_appropriate=false and choose the
          single best cell name from the Available Cells list (use the cell "name" value).
        - Use the cell descriptions to guide your choice and provide a concise rationale.

        Write JSON artifact files:
        - `{{ context.environment.op.outbox }}/triage/latest-status.json`
        - `{{ context.environment.op.outbox }}/triage/decision.md`

        JSON schema:
        {
          "cell_is_appropriate": boolean,
          "recommended_cell": string,
          "rationale": string
        }

        Final response must be ONLY the exact JSON object above.

  - id: triage_frontend
    op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@ded76dfbd877d3d0749e509844ecdbc57197b572
    inputs:
      sandbox:
        type: none
      worktree_path: "{{ context.environment.op.worktree_path }}"
      workdir_path: "{{ context.environment.op.workdir }}"
      artifact_inbox_path: "{{ context.environment.op.inbox }}"
      artifact_outbox_path: "{{ context.environment.op.outbox }}"
      skill: "c2-triage-cell-boundary"
      skills:
        - "gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7"
      prompt: |
        Follow the `c2-triage-cell-boundary` skill contract.

        Job Title: Redesign filter drawer interaction
        Job Description:
        Update the React filter drawer in the browser UI, change button spacing, and add a loading skeleton while results fetch.

        Current Cell: recipe-tests
        Available Cells (name, description):
        [
          {"name":"recipe-tests","description":"Recipe authoring, testing, and workflow guidance."},
          {"name":"frontend","description":"UI implementation and styling."},
          {"name":"infra","description":"Infrastructure provisioning and deployment automation."}
        ]

        Decide if the current cell is appropriate to run the work.
        - Treat the current cell as appropriate ONLY if it is the best match among the Available Cells.
        - Prefer specialized cells over general-purpose cells when a specialized cell clearly matches.
        - If the current cell is not the best match, set cell_is_appropriate=false and choose the
          single best cell name from the Available Cells list (use the cell "name" value).
        - Use the cell descriptions to guide your choice and provide a concise rationale.

        Write JSON artifact files:
        - `{{ context.environment.op.outbox }}/triage/latest-status.json`
        - `{{ context.environment.op.outbox }}/triage/decision.md`

        JSON schema:
        {
          "cell_is_appropriate": boolean,
          "recommended_cell": string,
          "rationale": string
        }

        Final response must be ONLY the exact JSON object above.

  - id: requirements_good
    op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@ded76dfbd877d3d0749e509844ecdbc57197b572
    inputs:
      sandbox:
        type: none
      worktree_path: "{{ context.environment.op.worktree_path }}"
      workdir_path: "{{ context.environment.op.workdir }}"
      artifact_inbox_path: "{{ context.environment.op.inbox }}"
      artifact_outbox_path: "{{ context.environment.op.outbox }}"
      skill: "c2-requirements-author"
      skills:
        - "gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7"
      prompt: |
        Follow the `c2-requirements-author` skill contract.
        Create a requirements bundle for this job and write artifacts directly.

        Job Title: Improve recipe test execution guidance
        Job Description:
        Add non-breaking recipe test coverage and supporting guidance for the recipe-testing cell.

        Current Cell: recipe-tests
        Available Cells (name, description):
        [
          {"name":"recipe-tests","description":"Recipe authoring, testing, and workflow guidance."},
          {"name":"frontend","description":"UI implementation and styling."},
          {"name":"infra","description":"Infrastructure provisioning and deployment automation."}
        ]

        User feedback to incorporate:
        Keep the change local to recipe authoring and testing.

        Requirements:
        - Produce one or more requirements.
        - Use stable IDs like REQ-1, REQ-2, ...
        - Include all requirement IDs in dependency_order in valid topological order.
        - Each requirement.target_cell MUST be one of the provided cell names.
        - requirements[].depends_on MUST reference only IDs in requirements[].
        - API changes MUST be backwards compatible. Do not include breaking changes.
        - Move answered details out of open_questions into scope/acceptance criteria.

        Write files under this absolute outbox directory:
        `{{ context.environment.op.outbox }}/requirements`

        Required files:
        1) `plan.json` as valid JSON with EXACT keys:
           - summary (string)
           - needs_cross_cell_support (boolean)
           - dependency_order (array of string)
           - requirements (array of objects)
           - notes_for_user_review (string)

        Each requirements[] object must include:
           - id, title, target_cell, depends_on, scope, api_changes, acceptance_criteria, risks, open_questions
        Each api_changes[] entry must include:
           - service, change_type, description, backwards_compatible, migration_plan

        2) `index.md` summary document.
        3) One markdown file per requirement: `<REQ-ID>.md`.

        Do not modify repo code for this step.
        Final response must be ONLY the exact `plan.json` object content (no markdown, no prose).

  - id: requirements_bad_seed
    op: command_execution
    inputs:
      timeout: 5m
      run: |
        set -euo pipefail
        OUT="{{ context.environment.op.outbox }}"
        mkdir -p "$OUT/bad-requirements"
        cat > "$OUT/bad-requirements/plan.json" <<'JSON'
        {
          "summary": "Break the recipe test CLI to simplify invocation.",
          "needs_cross_cell_support": false,
          "dependency_order": ["REQ-1"],
          "requirements": [
            {
              "id": "REQ-1",
              "title": "Remove the old case selection flag",
              "target_cell": "recipe-tests",
              "depends_on": [],
              "scope": "Delete the existing CLI flag and require a new incompatible replacement immediately.",
              "api_changes": [
                {
                  "service": "recipe-test-cli",
                  "change_type": "remove_flag",
                  "description": "Remove --case and require --case-id only.",
                  "backwards_compatible": false,
                  "migration_plan": "none"
                }
              ],
              "acceptance_criteria": [
                "Only the new flag is accepted."
              ],
              "risks": [
                "Existing callers will fail."
              ],
              "open_questions": []
            }
          ],
          "notes_for_user_review": ""
        }
        JSON

  - id: requirements_review_bad
    op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@ded76dfbd877d3d0749e509844ecdbc57197b572
    artifacts:
      plan.json: '${{ sequence.requirements_bad_seed.artifacts["bad-requirements/plan.json"] }}'
    inputs:
      sandbox:
        type: none
      worktree_path: "{{ context.environment.op.worktree_path }}"
      workdir_path: "{{ context.environment.op.workdir }}"
      artifact_inbox_path: "{{ context.environment.op.inbox }}"
      artifact_outbox_path: "{{ context.environment.op.outbox }}"
      skill: "c2-requirements-contrarian-review"
      skills:
        - "gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7"
      prompt: |
        Follow the `c2-requirements-contrarian-review` skill contract.
        You are a contrarian reviewer focused on API design and backwards compatibility.
        Be skeptical. Reject any backwards-incompatible change.
        Also verify API changes align with target cell ownership/scope.

        Current Cell: recipe-tests
        Available Cells (name, description):
        [
          {"name":"recipe-tests","description":"Recipe authoring, testing, and workflow guidance."},
          {"name":"frontend","description":"UI implementation and styling."},
          {"name":"infra","description":"Infrastructure provisioning and deployment automation."}
        ]
        Requirements plan artifact path: `{{ context.environment.op.inbox }}/plan.json`
        Read `plan.json` and evaluate it.

        Produce a review object:
        {
          "ok": boolean,
          "feedback": string,
          "blocking_issues": [string]
        }

        Write artifacts:
        - `{{ context.environment.op.outbox }}/requirements/api-review.json`
        - `{{ context.environment.op.outbox }}/requirements/api-review.md`

        Final response must be ONLY the exact review JSON object.

  - id: quality_assertions
    op: command_execution
    inputs:
      timeout: 5m
      env:
        EXPECTED_REF: "gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7"
        TRIAGE_SKILL_REF_RESOLVED: "${{ size(sequence.triage_local.outputs.skills_installed) > 0 ? sequence.triage_local.outputs.skills_installed[0] : \"\" }}"
        TRIAGE_LOCAL_OK: "${{ json_parse(sequence.triage_local.outputs.assistantSummary).cell_is_appropriate ? \"true\" : \"false\" }}"
        TRIAGE_LOCAL_RATIONALE_NONEMPTY: "${{ has(json_parse(sequence.triage_local.outputs.assistantSummary).rationale) && json_parse(sequence.triage_local.outputs.assistantSummary).rationale != \"\" ? \"true\" : \"false\" }}"
        TRIAGE_FRONTEND_REDIRECT: "${{ !json_parse(sequence.triage_frontend.outputs.assistantSummary).cell_is_appropriate ? \"true\" : \"false\" }}"
        TRIAGE_FRONTEND_TARGET: "${{ json_parse(sequence.triage_frontend.outputs.assistantSummary).recommended_cell }}"
        REQUIREMENTS_COUNT_NONZERO: "${{ size(json_parse(sequence.requirements_good.outputs.assistantSummary).requirements) > 0 ? \"true\" : \"false\" }}"
        REQUIREMENTS_CROSS_CELL_FALSE: "${{ json_parse(sequence.requirements_good.outputs.assistantSummary).needs_cross_cell_support == false ? \"true\" : \"false\" }}"
        REQUIREMENTS_TARGETS_VALID: "${{ json_parse(sequence.requirements_good.outputs.assistantSummary).requirements.all(r, has(r.target_cell) && (r.target_cell == \"recipe-tests\" || r.target_cell == \"frontend\" || r.target_cell == \"infra\")) ? \"true\" : \"false\" }}"
        REQUIREMENTS_ACCEPTANCE_NONEMPTY: "${{ json_parse(sequence.requirements_good.outputs.assistantSummary).requirements.all(r, has(r.acceptance_criteria) && size(r.acceptance_criteria) > 0) ? \"true\" : \"false\" }}"
        REQUIREMENTS_BAD_REVIEW_REJECTS: "${{ !json_parse(sequence.requirements_review_bad.outputs.assistantSummary).ok ? \"true\" : \"false\" }}"
        REQUIREMENTS_BAD_BLOCKERS_NONEMPTY: "${{ size(json_parse(sequence.requirements_review_bad.outputs.assistantSummary).blocking_issues) > 0 ? \"true\" : \"false\" }}"
        DIAGNOSTICS_PATH: "/tmp/skill-quality-live/assertions.json"
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        import sys

        expected_true = [
            "TRIAGE_LOCAL_OK",
            "TRIAGE_LOCAL_RATIONALE_NONEMPTY",
            "TRIAGE_FRONTEND_REDIRECT",
            "REQUIREMENTS_COUNT_NONZERO",
            "REQUIREMENTS_CROSS_CELL_FALSE",
            "REQUIREMENTS_TARGETS_VALID",
            "REQUIREMENTS_ACCEPTANCE_NONEMPTY",
            "REQUIREMENTS_BAD_REVIEW_REJECTS",
            "REQUIREMENTS_BAD_BLOCKERS_NONEMPTY",
        ]

        expected_values = {
            "TRIAGE_FRONTEND_TARGET": "frontend",
            "TRIAGE_SKILL_REF_RESOLVED": os.environ["EXPECTED_REF"],
        }

        diagnostics = {
            "expected_true": {},
            "expected_values": {},
            "failures": [],
        }
        failures = []
        for key in expected_true:
            actual = os.environ.get(key, "")
            diagnostics["expected_true"][key] = actual
            if actual.strip().lower() != "true":
                failures.append(f"{key}=true expected, got {actual!r}")

        for key, expected in expected_values.items():
            actual = os.environ.get(key, "")
            diagnostics["expected_values"][key] = {
                "actual": actual,
                "expected": expected,
            }
            if actual != expected:
                failures.append(f"{key}={expected!r} expected, got {actual!r}")

        diagnostics["failures"] = failures
        diagnostics_path = os.environ.get("DIAGNOSTICS_PATH")
        if diagnostics_path:
            os.makedirs(os.path.dirname(diagnostics_path), exist_ok=True)
            with open(diagnostics_path, "w", encoding="utf-8") as f:
                json.dump(diagnostics, f, indent=2, sort_keys=True)

        if failures:
            print("skill-quality assertion failures:", file=sys.stderr)
            for failure in failures:
                print(f"- {failure}", file=sys.stderr)
            sys.exit(1)

        print("skill-quality assertions passed")
        PY

outputs:
  triage_skill_ref_resolved: "${{ size(sequence.triage_local.outputs.skills_installed) > 0 ? sequence.triage_local.outputs.skills_installed[0] : \"\" }}"
  triage_local_ok: "${{ json_parse(sequence.triage_local.outputs.assistantSummary).cell_is_appropriate }}"
  triage_local_rationale_nonempty: "${{ has(json_parse(sequence.triage_local.outputs.assistantSummary).rationale) && json_parse(sequence.triage_local.outputs.assistantSummary).rationale != \"\" }}"
  triage_frontend_redirect: "${{ !json_parse(sequence.triage_frontend.outputs.assistantSummary).cell_is_appropriate }}"
  triage_frontend_target: "${{ json_parse(sequence.triage_frontend.outputs.assistantSummary).recommended_cell }}"
  requirements_count_nonzero: "${{ size(json_parse(sequence.requirements_good.outputs.assistantSummary).requirements) > 0 }}"
  requirements_cross_cell_false: "${{ json_parse(sequence.requirements_good.outputs.assistantSummary).needs_cross_cell_support == false }}"
  requirements_targets_valid: "${{ json_parse(sequence.requirements_good.outputs.assistantSummary).requirements.all(r, has(r.target_cell) && (r.target_cell == \"recipe-tests\" || r.target_cell == \"frontend\" || r.target_cell == \"infra\")) }}"
  requirements_acceptance_nonempty: "${{ json_parse(sequence.requirements_good.outputs.assistantSummary).requirements.all(r, has(r.acceptance_criteria) && size(r.acceptance_criteria) > 0) }}"
  requirements_bad_review_rejects: "${{ !json_parse(sequence.requirements_review_bad.outputs.assistantSummary).ok }}"
  requirements_bad_blockers_nonempty: "${{ size(json_parse(sequence.requirements_review_bad.outputs.assistantSummary).blocking_issues) > 0 }}"
