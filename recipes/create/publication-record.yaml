# Persist evidence before an operation that may fail. Final recipe outputs are
# unavailable on failure; these artifacts remain attached to completed steps.
id: creation-publication-record
inputs:
  created: ${{ inputs.created }}
  initializations: ${{ inputs.initializations }}
sequence:
- id: record
  op: command_execution
  const: true
  artifacts:
    created.json:
      kind: value
      name: created.json
      format: json
      value: ${{ inputs.created }}
    initializations.json:
      kind: value
      name: initializations.json
      format: json
      value: ${{ inputs.initializations }}
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      set -eu
      cp "$INBOX/created.json" "$OUTBOX/created.json"
      cp "$INBOX/initializations.json" "$OUTBOX/initializations.json"
outputs:
  created: ${{ inputs.created }}
  initializations: ${{ inputs.initializations }}
  artifact_refs: ${{ sequence.record.artifacts }}
