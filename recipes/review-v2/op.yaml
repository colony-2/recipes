name: build-review-v2
version: 1.0.0
description: Validate recipe-defined review declarations and generate native schemas.
command: [python3, ../review-v2.py]
input_schema:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request:
      type: object
output_schema:
  type: object
  additionalProperties: false
  required: [form]
  properties:
    form:
      type: object
