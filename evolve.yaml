id: evolve
version: 0.2.0
input_schema:
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .c2j
  type:
    type: string
    default_value: evolve
inputs:
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  type: ${{ inputs.type }}
desc: Design, review tests, implement, verify, and squash merge approved workflow changes
sequence:
- id: develop
  include: ./recipes/develop/develop.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    mode: evolve
    target_directory: ${{ inputs.target_directory }}
outputs:
  merged: ${{ sequence.develop.outputs.merged }}
  merged_hash: ${{ sequence.develop.outputs.merged_hash }}
  target_branch: ${{ sequence.develop.outputs.target_branch }}
  session_id: ${{ sequence.develop.outputs.session_id }}
  assistant_summary: ${{ sequence.develop.outputs.assistant_summary }}
  result: ${{ sequence.develop.outputs.result }}
  verification: ${{ sequence.develop.outputs.verification }}
  artifact_refs: ${{ sequence.develop.outputs.artifact_refs }}
  dependencies: ${{ sequence.develop.outputs.dependencies }}
  design: ${{ sequence.develop.outputs.design }}
  consultations: ${{ sequence.develop.outputs.consultations }}
  disposition: ${{ sequence.develop.outputs.disposition }}
