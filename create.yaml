id: create
version: 1.0.0
input_schema:
  prompt:
    type: string
    required: true
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
    default_value: ''
  root_ref:
    type: string
    default_value: ''
inputs:
  prompt: ${{ inputs.prompt }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
sequence:
- id: root
  workspace:
    cell: '${{ inputs.root_cell != '''' ? inputs.root_cell : context.git.repo }}'
    ref: '${{ inputs.root_ref != '''' ? inputs.root_ref : context.git.ref }}'
  inputs:
    prompt: ${{ inputs.prompt }}
    session: ${{ inputs.session }}
    documents: ${{ inputs.documents }}
  state:
    initial: review
    states:
      review:
        include: ./recipes/create/review.yaml
        inputs:
          prompt: ${{ inputs.prompt }}
          session: ${{ inputs.session }}
          documents: ${{ inputs.documents }}
        transitions:
        - to: publish
          when: outputs.approved
      publish:
        include: ./recipes/create/publish.yaml
        inputs:
          cells: ${{ states.review.outputs.cells }}
          documents: ${{ states.review.outputs.documents }}
        transitions:
        - to: register
          when: outputs.error == ''
      register:
        inputs:
          created: ${{ states.publish.outputs.created }}
          documents: ${{ state_output('registration_repair', 'documents', states.review.outputs.documents) }}
          session: ${{ state_output('registration_repair', 'session', states.review.outputs.session) }}
          read_only: ${{ state_exists('registration_repair') }}
          prompt: ${{ state_output('registration_repair', 'prompt', vars.initial_prompt) }}
          retained_artifacts: ${{ state_output('registration_repair', 'artifacts', {}) }}
        sequence:
        - id: records
          op: command_execution
          const: true
          inputs:
            env:
              OUTBOX: ${{ context.environment.op.outbox }}
              CREATED: ${{ json_stringify(inputs.created) }}
            run: |
              printf '%s\n' "$CREATED" > "$OUTBOX/created.json"
        - id: agent
          include: ./recipes/kernel/agent-turn.yaml
          inputs:
            read_only: ${{ inputs.read_only }}
            session: ${{ inputs.session }}
            documents: '${{ jq([inputs.documents, {''created.json'': sequence.records.artifacts[''created.json'']}],
              ''add'') }}'
            prompt: ${{ inputs.prompt }}
            schema:
              type: object
              additionalProperties: false
              required:
              - completed
              - summary
              properties:
                completed:
                  type: boolean
                summary:
                  type: string
                  minLength: 1
            retained_artifacts: ${{ inputs.retained_artifacts }}
        outputs:
          turn: ${{ sequence.agent.outputs }}
          records: ${{ sequence.records.artifacts['created.json'] }}
        transitions:
        - to: merge
          when: outputs.turn.result.?status.orValue('failed') == 'completed' && outputs.turn.result.?output_schema_valid.orValue(false)
            && outputs.turn.result.?response.orValue({}).?completed.orValue(false) && outputs.turn.result.?session.orValue(null)
            != null && size(outputs.turn.jobs.?job_ids.orValue([])) == 0 && 'completion.md' in outputs.turn.artifacts
        - to: registration_repair
          when: outputs.turn.result.?status.orValue('failed') == 'completed' && (!outputs.turn.result.?output_schema_valid.orValue(false)
            || outputs.turn.result.?response.orValue({}).?completed.orValue(false)) && size(outputs.turn.jobs.?job_ids.orValue([]))
            == 0
        - to: failed
          when: true
        vars:
          initial_prompt: |
            The approved cells have been published. Read created.json for the actual
            repository URLs, branches, and revisions. Apply only the root catalog
            changes described in the approved proposal, preserving existing entries.
            Register these cells through the project's existing .c2/config.yaml
            dependents format; update existing cell descriptions if appropriate.
            Do not introduce a second catalog. Check the configuration is valid and
            the created cells can be resolved through it.

            Do not create repositories, push commits, submit jobs, or implement
            product features. The workflow owns publication. Write completion.md
            in the outbox describing registered cells and any remaining work.
            Return completed=false if registration cannot be completed as approved.
      merge:
        op: squashrebasemerge
        inputs:
          commit_message: Register approved new cells
        catch:
        - when: true
          continue:
            outputs:
              error: ${{ failure.message }}
      failed:
        sequence: []
      registration_repair:
        include: ./recipes/kernel/repair.yaml
        inputs:
          turn: ${{ states.register.outputs.turn }}
          issues:
          - 'Registration evidence is incomplete. The cell repositories have already been published: do not publish
            them again. Return a valid completion response and completion.md documenting registration; return completed=false
            if registration cannot be completed.'
          documents: >-
            ${{ jq([states.review.outputs.documents, {'created.json': states.register.outputs.records}], 'add')
            }}
          session: ${{ states.review.outputs.session }}
          attempts: ${{ state_output('registration_repair', 'attempts', 0) }}
        transitions:
        - to: register
          when: outputs.retry
        - to: failed
          when: true
  outputs:
    disposition: |-
      ${{ state_exists('merge') ? (states.merge.outputs.?error.orValue('') == '' ? 'created' : 'registration_failed')
        : state_exists('register') ? 'registration_failed'
        : state_exists('publish') ? 'publication_failed' : states.review.outputs.disposition }}
    created_cells: ${{ state_output('publish', 'created', []) }}
    merged: ${{ state_exists('merge') && states.merge.outputs.?error.orValue('') == '' }}
    merged_hash: ${{ state_output('merge', 'merged_hash', '') }}
    session: >-
      ${{ state_exists('register') ? states.register.outputs.turn.result.?session.orValue(states.review.outputs.session)
      : states.review.outputs.session }}
    summary: >-
      ${{ state_exists('register') ? states.register.outputs.turn.result.?response.orValue({}).?summary.orValue('Root
      registration did not complete.') : states.review.outputs.summary }}
    error: |-
      ${{ state_exists('merge') ? states.merge.outputs.?error.orValue('')
        : state_exists('register') ? 'Cell repositories were published, but root registration did not complete.'
        : state_output('publish', 'error', '') }}
    review: ${{ states.review.outputs.review }}
    artifact_refs: |-
      ${{ jq([states.review.outputs.documents, state_exists('register')
        ? jq([{'created.json': states.register.outputs.records},
            jq(states.register.outputs.turn.artifacts, 'with_entries(select(.key == "completion.md"))')], 'add')
        : {}], 'add') }}
outputs:
  disposition: ${{ sequence.root.outputs.disposition }}
  created_cells: ${{ sequence.root.outputs.created_cells }}
  merged: ${{ sequence.root.outputs.merged }}
  merged_hash: ${{ sequence.root.outputs.merged_hash }}
  session: ${{ sequence.root.outputs.session }}
  summary: ${{ sequence.root.outputs.summary }}
  error: ${{ sequence.root.outputs.error }}
  review: ${{ sequence.root.outputs.review }}
  artifact_refs: ${{ sequence.root.outputs.artifact_refs }}
