schema_version: 2
id: create
version: 1.0.0
retry:
  maximum_attempts: 1
input_schema:
  title:
    type: string
    default_value: ''
  prompt:
    type: string
    required: true
  session:
    type: checkpoint
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
    default_value: root
  root_ref:
    type: string
    default_value: ""
  initialize_recipe:
    type: string
    default_value: git+https://github.com/colony-2/recipes.git//recipes/create/initialize.yaml@main
  annotations:
    type: array
    default_value: []
    items:
      type: object
      properties:
        id:
          type: string
          required: true
        ref:
          type: artifact
          required: true
        descriptor:
          type: object
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ref:
                type: artifact
inputs:
  title: ${{ inputs.title }}
  annotations: ${{ inputs.annotations }}
  prompt: ${{ inputs.prompt }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  initialize_recipe: ${{ inputs.initialize_recipe }}
sequence:
  - id: root
    workspace:
      cell: root
      ref: '${{ inputs.root_ref != '''' ? inputs.root_ref : context.git.ref }}'
    inputs:
      title: ${{ inputs.title }}
      annotations: ${{ inputs.annotations }}
      prompt: ${{ inputs.prompt }}
      session: ${{ inputs.session }}
      documents: ${{ inputs.documents }}
      initialize_recipe: ${{ inputs.initialize_recipe }}
    state:
      initial: ownership_guard
      states:
        review:
          include: ./recipes/create/review.yaml
          inputs:
            title: ${{ inputs.title }}
            annotations: ${{ inputs.annotations }}
            prompt: ${{ inputs.prompt }}
            session: ${{ inputs.session }}
            documents: ${{ inputs.documents }}
          transitions:
            - to: publish
              when: outputs.approved
        publish:
          include: ./recipes/create/publish.yaml
          inputs:
            cells: ${{ states.review.outputs.cells }}
            documents: ${{ states.review.outputs.documents }}
            initialize_recipe: ${{ inputs.initialize_recipe }}
            review: ${{ states.review.outputs.review }}
          transitions:
            - to: completed
              when: outputs.error == '' && size(states.review.outputs.cells) > 0 && size(outputs.created) == size(states.review.outputs.cells) && size(outputs.initializations) == size(states.review.outputs.cells) && outputs.initializations.all(i, i.status == 'completed' && i.error == '')
        ownership_guard:
          id: ownership_guard
          op: command_execution
          const: true
          inputs:
            env:
              OWNER: ${{ context.workflow.cell }}
              ROOT: ${{ context.workspace.cell }}
            run: |
              set -eu
              test "$OWNER" = root && test "$ROOT" = root || { echo "Creation must run as a root-owned job" >&2; exit 1; }
          transitions:
            - to: review
              when: true
        completed:
          sequence: []
    outputs:
      annotations: ${{ states.review.outputs.annotations }}
      disposition: '${{ state_exists(''completed'') ? ''created'' : state_exists(''publish'') ? ''publication_failed'' : states.review.outputs.disposition }}'
      created_cells: ${{ state_output('publish', 'created', []) }}
      merged: ${{ state_exists('completed') }}
      merged_hash: ""
      session: ${{ states.review.outputs.session }}
      summary: '${{ state_exists(''completed'') ? ''Every approved cell was registered and initialized.'' : states.review.outputs.summary }}'
      error: ${{ state_output('publish', 'error', '') }}
      review: ${{ states.review.outputs.review }}
      artifact_refs: '${{ jq([states.review.outputs.documents, {''created.json'': {''kind'': ''value'', ''name'': ''created.json'', ''format'': ''json'', ''value'': state_output(''publish'', ''created'', [])}, ''initializations.json'': {''kind'': ''value'', ''name'': ''initializations.json'', ''format'': ''json'', ''value'': state_output(''publish'', ''initializations'', [])} }, state_output(''publish'', ''artifact_refs'', {})], ''add'') }}'
      initializations: ${{ state_output('publish', 'initializations', []) }}
outputs:
  annotations: ${{ sequence.root.outputs.annotations }}
  disposition: ${{ sequence.root.outputs.disposition }}
  created_cells: ${{ sequence.root.outputs.created_cells }}
  merged: ${{ sequence.root.outputs.merged }}
  merged_hash: ${{ sequence.root.outputs.merged_hash }}
  session: ${{ sequence.root.outputs.session }}
  summary: ${{ sequence.root.outputs.summary }}
  error: ${{ sequence.root.outputs.error }}
  review: ${{ sequence.root.outputs.review }}
  artifact_refs: ${{ sequence.root.outputs.artifact_refs }}
  initializations: ${{ sequence.root.outputs.initializations }}
