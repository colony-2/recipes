schema_version: 2
id: adaptive3
version: 0.1.0
input_schema:
  title:
    type: string
    default_value: ''
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  documents:
    type: artifact_map
    default_value: {}
  require_verification:
    type: boolean
    default_value: false
  merge_queue:
    type: boolean
    default_value: true
    description: Use the grouped Adaptive3 merge queue. Set false to merge directly.
  max_iterations:
    type: number
    default_value: 4
  resume_from:
    type: string
    default_value: ''
  model:
    type: string
    default_value: ''
  reasoning_effort:
    type: string
    default_value: ''
inputs:
  title: ${{ inputs.title }}
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  documents: ${{ jq([context.artifacts,inputs.documents], 'add') }}
  require_verification: ${{ inputs.require_verification }}
  merge_queue: ${{ inputs.merge_queue }}
  max_iterations: ${{ inputs.max_iterations }}
  resume_from: ${{ inputs.resume_from }}
  model: ${{ inputs.model }}
  reasoning_effort: ${{ inputs.reasoning_effort }}
state:
  initial:
  - to: backstop
    when: inputs.resume_from != ''
    payload:
      stage: recovery
      problem:
        summary: Inspect previous work and current direction before choosing where to continue.
      documents: ${{ inputs.documents }}
  - to: configure
    when: 'true'
  states:
    configure:
      id: configure
      inputs:
        sessions: ${{ transition.payload.?sessions.orValue({}) }}
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        feedback: ${{ transition.payload.?feedback.orValue({}) }}
        destination: ${{ transition.payload.?destination.orValue('direction') }}
      sequence:
      - id: origin
        op: command_execution
        const: true
        when: '!inputs.documents.exists(k,k.startsWith("review/negotiations/")) || inputs.documents.exists(k,k.startsWith("review/negotiations/") && inputs.documents[k].kind == "value")'
        artifacts:
          ./: ${{ jq(inputs.documents,'with_entries(select((.key | startswith("review/negotiations/")) and .value.kind == "value"))') }}
        inputs:
          env:
            REQUEST: ${{ inputs.request }}
            INBOX: ${{ context.environment.op.inbox }}
            OUTBOX: ${{ context.environment.op.outbox }}
          run: |
            python3 - <<'PY'
            import json, os, shutil, subprocess
            from urllib.parse import quote
            from pathlib import Path
            inbox = Path(os.environ['INBOX'])
            inline = inbox / 'review/negotiations'
            if inline.is_dir():
                # Native review expects stored references. Materialize caller-provided
                # inline evidence once and pass existing stored references through.
                target = Path(os.environ['OUTBOX'], 'review/negotiations')
                shutil.copytree(inline, target)
                for report in target.glob('*/report.md'):
                    with report.open('a') as stream:
                        stream.write('\n<!-- Incoming assignment -->\n')
                raise SystemExit(0)
            info = json.loads(subprocess.check_output(['c2j', 'self', '--json']))
            parent = info['execution'].get('parent') or {}
            if parent.get('job_id'):
                job = parent['job_id']
                tenant = quote(os.environ['C2J_CURRENT_TENANT_ID'], safe='')
                out = Path(os.environ['OUTBOX'], 'review/negotiations/origin/report.md')
                out.parent.mkdir(parents=True, exist_ok=True)
                out.write_text(f"# Why this job was requested\n\nDirect assignment from {parent.get('cell_name') or 'parent agent'} "
                               f"in [job {job}](https://jobs.colony2.com/{tenant}/jobs/{quote(job, safe='')}).\n\n"
                               f"Initiating task: {parent.get('invocation_path') or parent.get('op_step') or job}\n\n"
                               f"<!-- Recorded exchange -->\n\n## Original request\n\n{os.environ['REQUEST']}\n")
            PY
      - id: hook
        include: ./recipes/adaptive3/hooks.yaml
        inputs:
          hook: configure
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          documents: ${{ inputs.documents }}
      outputs:
        sessions: ${{ inputs.sessions }}
        result: ${{ sequence.hook.outputs.result }}
        settings: ${{ sequence.hook.outputs.settings }}
        destination: ${{ inputs.destination }}
        documents: ${{ jq([inputs.documents,sequence.?origin.orValue({}).?artifacts.orValue({})],'.[0] + (.[1] | with_entries(select(.key | startswith("review/negotiations/"))))') }}
        feedback: ${{ inputs.feedback }}
      transitions:
      - to: direction
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'direction'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.feedback }}
      - to: preparation
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'preparation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.feedback }}
      - to: implementation
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'implementation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.feedback }}
      - to: outcome
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'outcome'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.feedback }}
      - to: integration
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'integration'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.feedback }}
      - to: backstop
        when: 'true'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: configure
          feedback: ${{ jq([outputs.feedback,{'destination':outputs.destination}],'add') }}
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
    direction:
      id: direction
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        sessions: ${{ jq(transition.payload.?sessions.orValue({}),'del(.plan,.short_path)') }}
        basis: ${{ transition.payload.finding.?amendment.orValue({}).?human.orValue({}).?receipt.orValue({}) }}
        purpose: direction
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        review_reply: ${{ transition.payload.?sessions.orValue({}).?review_reply.orValue({}) }}
        finding: ${{ transition.payload.finding }}
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value != ""))') }}
      transitions:
      - to: backstop
        when: outputs.result.status == 'stuck'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: direction
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
      - to: complete
        when: outputs.result.status == 'accepted' && outputs.work.?work_kind.orValue('') == 'explanation'
        payload:
          result: ${{ outputs }}
      - to: implementation
        when: outputs.result.status == 'accepted' && outputs.work.?delivery_route.orValue('standard') == 'short' && size(outputs.basis)==0 && !state_exists('preparation') && !outputs.sessions.?agreements.orValue([]).exists(a,nonempty(a.assignment))
          && !states.configure.outputs.settings.?require_design.orValue(false)
        payload:
          sessions: ${{ jq([outputs.sessions,{'short_path':true}],'add') }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.work }}
      - to: preparation
        when: outputs.result.status == 'accepted'
        payload:
          finding: >-
            ${{ outputs.prior_finding.?approval.hasValue() ? outputs.prior_finding : outputs.finding }}
          sessions: ${{ outputs.sessions }}
      - to: backstop
        when: 'true'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: direction
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
    preparation:
      id: preparation
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        sessions: ${{ jq(transition.payload.?sessions.orValue({}),'del(.plan,.short_path)') }}
        basis: ${{ {'decision':state_output('direction','result',{}).?receipt.orValue(state_output('direction','sessions',{}).?planning.orValue(null))} }}
        purpose: preparation
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(state_output('direction','documents',inputs.documents))
          }}
        review_reply: ${{ transition.payload.?sessions.orValue({}).?review_reply.orValue({}) }}
        finding: ${{ transition.payload.finding }}
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value != ""))') }}
      transitions:
      - to: backstop
        when: outputs.result.status == 'stuck'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: preparation
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
      - to: direction
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'direction'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: implementation
        when: outputs.result.status == 'accepted'
        payload:
          sessions: ${{ jq([outputs.sessions,outputs.result],vars.approve_plan) }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: backstop
        when: 'true'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: preparation
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
    implementation:
      id: implementation
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        sessions: ${{ transition.payload.?sessions.orValue({}) }}
        basis: ${{ {'decision':state_output('preparation','result',{}).?receipt.orValue(state_output('direction','result',{}).?receipt.orValue(state_output('direction','sessions',{}).?planning.orValue(null)))} }}
        purpose: implementation
        merge_queue: ${{ inputs.merge_queue }}
        verification: >-
          ${{ state_output('implementation','basis',{}) == {'decision':state_output('preparation','result',{}).?receipt.orValue(state_output('direction','result',{}).?receipt.orValue(state_output('direction','sessions',{}).?planning.orValue(null)))} ? state_output('implementation','verification',{}) : {} }}
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(state_output('preparation','documents',state_output('direction','documents',inputs.documents)))
          }}
        review_reply: ${{ transition.payload.?sessions.orValue({}).?review_reply.orValue({}) }}
        finding: ${{ transition.payload.finding }}
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value != ""))') }}
      transitions:
      - to: backstop
        when: outputs.result.status == 'stuck'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: implementation
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
      - to: direction
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'direction'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: preparation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'preparation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: integration
        when: outputs.result.status == 'accepted' && outputs.result.?approval_reused.orValue(false)
        payload:
          sessions: ${{ outputs.sessions }}
          accepted: ${{ outputs.prior_finding.approval }}
          documents: ${{ outputs.documents }}
          finding: {}
      - to: outcome
        when: outputs.result.status == 'accepted'
        payload:
          finding: ${{ jq([outputs.prior_finding,outputs.finding], 'add') }}
          sessions: ${{ outputs.sessions }}
      - to: backstop
        when: 'true'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: implementation
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
    outcome:
      id: outcome
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        sessions: ${{ transition.payload.?sessions.orValue({}) }}
        basis: ${{ {'basis':state_output('implementation','basis',{}),'candidate':state_output('implementation','candidate',{}),'verification':state_output('implementation','verification',{})} }}
        purpose: outcome
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(state_output('implementation','documents',inputs.documents))
          }}
        review_reply: ${{ transition.payload.?sessions.orValue({}).?review_reply.orValue({}) }}
        finding: ${{ transition.payload.finding }}
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value != ""))') }}
      transitions:
      - to: complete
        when: outputs.result.status == 'accepted' && !outputs.candidate.changed
        payload:
          result: ${{ outputs }}
      - to: backstop
        when: outputs.result.status == 'stuck'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: outcome
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
      - to: direction
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'direction'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: preparation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'preparation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: implementation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'implementation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: integration
        when: outputs.result.status == 'accepted'
        payload:
          finding: ${{ outputs.finding }}
          sessions: ${{ outputs.sessions }}
          accepted: ${{ {'result':outputs.result,'patch':outputs.patch,'contribution':state_output('implementation','verification',{}).?contribution.orValue({})} }}
      - to: backstop
        when: 'true'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: outcome
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
    integration:
      id: integration
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        sessions: ${{ transition.payload.?sessions.orValue({}) }}
        purpose: integration
        accepted: >-
          ${{ transition.payload.?accepted.orValue(
            !state_exists('outcome') && !state_exists('implementation') && inputs.resume_from != '' && size(state_output('integration','merge_state',{}))==0
              ? transition.payload.finding.?approval.orValue(state_output('integration','accepted',{}))
              : state_output('integration','accepted',{})) }}
        merge_state: ${{ state_output('integration','merge_state',{}) }}
        recovery: ${{ !state_exists('outcome') && !state_exists('implementation') && inputs.resume_from != '' }}
        prior_publication: ${{ transition.payload.finding.?publication.orValue(null) }}
        merge_queue: ${{ inputs.merge_queue }}
        contribution: ${{ state_output('implementation','verification',{}).?contribution.orValue({}) }}
        verification: ${{ state_output('implementation','verification',{}) }}
        queue_history: >-
          ${{ jq(state_output('integration','result',{}),
            '{initial_submitted_at, rejected_changeid, errors, status, receiver, branch, changeid} | with_entries(select(.value != null))') }}
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(state_output('outcome','documents',inputs.documents))
          }}
        review_reply: ${{ transition.payload.?sessions.orValue({}).?review_reply.orValue({}) }}
        finding: ${{ transition.payload.finding }}
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value != ""))') }}
      transitions:
      - to: chase
        when: outputs.result.?failure.orValue({}).?code.orValue('') == 'MERGE_UPSTREAM_ADVANCED'
          && outputs.result.failure.?node.orValue({}).?id.orValue('') == 'merge'
        payload:
          sessions: ${{ outputs.sessions }}
      - to: backstop
        when: outputs.result.status == 'stuck'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: integration
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
      - to: direction
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'direction'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: preparation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'preparation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: implementation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'implementation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: outcome
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'outcome'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.finding }}
      - to: complete
        when: outputs.result.status == 'accepted'
        payload:
          result: ${{ outputs }}
      - to: backstop
        when: 'true'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: integration
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.prior_finding }}
    backstop:
      inputs:
        sessions: ${{ transition.payload.?sessions.orValue({}) }}
        stage: ${{ transition.payload.stage }}
        problem: ${{ transition.payload.problem }}
        documents: >-
          ${{ jq([state_output('configure','documents',inputs.documents),transition.payload.documents,transition.payload.?sessions.orValue({}).?agreements.orValue([])],
            '(.[0] | with_entries(select(.key|startswith("review/negotiations/")))) + .[1] + ([.[2][].documents] | add // {})') }}
        request: ${{ inputs.prompt }}
        feedback: ${{ transition.payload.?feedback.orValue(state_output('backstop','result',{})) }}
        agent_settings: ${{ jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value != ""))') }}
        prior_job: >-
          ${{ transition.payload.stage == 'recovery' || (transition.payload.stage == 'integration' && !state_exists('outcome') && !state_exists('implementation'))
            ? inputs.resume_from : '' }}
        retry: ${{ transition.payload.?sessions.orValue({}).?retry.orValue({}) }}
        direction:
          short_path: ${{ transition.payload.?sessions.orValue({}).?short_path.orValue(false) }}
          source: ${{ state_output('direction','sessions',{}).?planning.orValue(null) }}
          result: ${{ state_output('direction','result',{}) }}
        preparation:
          result: ${{ state_output('preparation','result',{}) }}
          basis: ${{ state_output('preparation','basis',{}) }}
        implementation:
          result: ${{ state_output('implementation','result',{}) }}
          basis: ${{ state_output('implementation','basis',{}) }}
          candidate: ${{ state_output('implementation','candidate',{}) }}
          verification: ${{ state_output('implementation','verification',{}) }}
        outcome:
          result: ${{ state_output('outcome','result',{}) }}
          basis: ${{ state_output('outcome','basis',{}) }}
        publication_recovery: ${{ transition.payload.stage == 'integration' && size(state_output('integration','merge_state',{}))>0 }}
        prior_job_recovery: ${{ inputs.resume_from != '' && !state_exists('direction') && !state_exists('implementation') }}
      sequence:
      - id: policy
        include: ./recipes/adaptive3/backstop-policy.yaml
        inputs:
          direction: ${{ inputs.direction }}
          preparation: ${{ inputs.preparation }}
          implementation: ${{ inputs.implementation }}
          outcome: ${{ inputs.outcome }}
          publication_recovery: ${{ inputs.publication_recovery }}
          prior_job_recovery: ${{ inputs.prior_job_recovery }}
      - id: backstop
        include: ./recipes/adaptive3/backstop.yaml
        inputs:
          stage: ${{ inputs.stage }}
          problem: ${{ inputs.problem }}
          documents: ${{ inputs.documents }}
          request: ${{ inputs.request }}
          feedback: ${{ inputs.feedback }}
          agent_settings: ${{ inputs.agent_settings }}
          prior_job: ${{ inputs.prior_job }}
          review_reply: ${{ inputs.sessions.?review_reply.orValue({}) }}
          session: ${{ inputs.sessions.?backstop.orValue({}) }}
          retry: ${{ inputs.retry }}
          presentation: ${{ inputs.sessions.?presentation.orValue({}) }}
          automatic: ${{ inputs.retry.?automatic_used.orValue(0) < 2 }}
          prerequisites: ${{ sequence.policy.outputs.prerequisites }}
      - id: dispatch
        include: ./recipes/adaptive3/backstop-return.yaml
        inputs:
          result: ${{ sequence.backstop.outputs.result }}
          problem: ${{ inputs.problem }}
          retry: ${{ sequence.backstop.outputs.retry }}
      outputs:
        sessions: ${{ jq([inputs.sessions,{'review_reply':sequence.backstop.outputs.review_reply,'backstop':sequence.backstop.outputs.session,'retry':sequence.dispatch.outputs.retry}], 'add') }}
        result: ${{ sequence.dispatch.outputs.result }}
        handoff: ${{ jq([inputs.problem,sequence.dispatch.outputs.result], '(.[0] | del(.budget,.visit_allowance)) + .[1]') }}
        documents: ${{ sequence.backstop.outputs.documents }}
        problem: ${{ inputs.problem }}
        stage: ${{ inputs.stage }}
        feedback: ${{ inputs.feedback }}
      transitions:
      - to: configure
        when: '!state_exists(''configure'') && outputs.result.stage != ''configure'''
        payload:
          sessions: ${{ outputs.sessions }}
          destination: ${{ outputs.result.stage }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.handoff }}
      - to: configure
        when: outputs.result.stage == 'configure'
        payload:
          sessions: ${{ outputs.sessions }}
          destination: >-
            ${{ outputs.result.?destination.orValue(null) != null ? outputs.result.destination : (outputs.stage in ['direction','preparation','implementation','outcome','integration'] ? outputs.stage : outputs.feedback.?destination.orValue('direction')) }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.handoff }}
      - to: direction
        when: outputs.result.stage == 'direction'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.handoff }}
      - to: preparation
        when: outputs.result.stage == 'preparation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.handoff }}
      - to: implementation
        when: outputs.result.stage == 'implementation'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.handoff }}
      - to: outcome
        when: outputs.result.stage == 'outcome'
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.handoff }}
      - to: integration
        when: outputs.result.stage == 'integration'
        payload:
          accepted: >-
            ${{ state_output('outcome','result',{}).?receipt.hasValue() ? {'result':states.outcome.outputs.result,'patch':state_output('outcome','patch',null),'contribution':state_output('implementation','verification',{}).?contribution.orValue({})} : state_output('integration','accepted',{}) }}
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          finding: ${{ outputs.handoff }}
    complete:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
    chase:
      inputs:
        sessions: ${{ transition.payload.?sessions.orValue({}) }}
        used: ${{ transition.payload.?sessions.orValue({}).?retry.orValue({}).?merge_used.orValue(0)+1 }}
        limit: ${{ transition.payload.?sessions.orValue({}).?retry.orValue({}).?merge_limit.orValue(3) }}
        documents: ${{ states.integration.outputs.documents }}
        feedback: '${{ jq([states.integration.outputs.prior_finding,{''failure'':states.integration.outputs.result.failure,''summary'':states.integration.outputs.result.summary,''approval'':state_exists(''outcome'')
          ? {''result'':states.outcome.outputs.result,''patch'':states.outcome.outputs.patch} : states.integration.outputs.prior_finding.?approval.orValue({})}],''add'')
          }}'
      sequence: []
      outputs:
        sessions: ${{ jq([inputs.sessions,inputs.used], '.[1] as $used | .[0] | .retry.merge_used = $used') }}
        used: ${{ inputs.used }}
        limit: ${{ inputs.limit }}
        documents: ${{ inputs.documents }}
        feedback: ${{ inputs.feedback }}
      transitions:
      - to: recheck_merge
        when: outputs.used <= outputs.limit
        payload:
          sessions: ${{ outputs.sessions }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: backstop
        when: 'true'
        payload:
          sessions: ${{ outputs.sessions }}
          stage: implementation
          documents: ${{ outputs.documents }}
          problem: ${{ jq([outputs.feedback,{'status':'stuck','loop':'merge','summary':'Repeated upstream changes
            have used the merge allowance. Decide the next correction before trying another complete cycle.'}],'add')
            }}
          feedback: ${{ outputs.feedback }}
    recheck_merge:
      include: ./recipes/adaptive3/recheck-merge.yaml
      inputs:
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        settings: ${{ states.configure.outputs.settings }}
        documents: ${{ states.chase.outputs.documents }}
        feedback: ${{ states.chase.outputs.feedback }}
        require_verification: ${{ inputs.require_verification }}
      transitions:
      - to: integration
        when: outputs.result.status == 'equivalent'
        payload:
          accepted: ${{ states.chase.outputs.feedback.approval }}
          sessions: ${{ states.chase.outputs.sessions }}
          documents: ${{ states.chase.outputs.documents }}
          finding: ${{ {'approval':states.chase.outputs.feedback.approval} }}
      - to: outcome
        when: outputs.result.status == 'review'
        payload:
          sessions: ${{ states.chase.outputs.sessions }}
          documents: ${{ states.chase.outputs.documents }}
          finding: ${{ outputs.result }}
      - to: implementation
        when: outputs.result.status == 'changes'
        payload:
          sessions: ${{ states.chase.outputs.sessions }}
          documents: ${{ states.chase.outputs.documents }}
          finding: ${{ jq([{'approval':states.chase.outputs.feedback.approval},outputs.result], 'add') }}
      - to: backstop
        when: 'true'
        payload:
          sessions: ${{ states.chase.outputs.sessions }}
          stage: implementation
          problem: ${{ outputs.result }}
          documents: ${{ states.chase.outputs.documents }}

outputs:
  summary: ${{ states.complete.outputs.result.work.summary }}
  work_kind: ${{ states.complete.outputs.result.work.?work_kind.orValue(state_output('outcome','work',{}).?work_kind.orValue(state_output('implementation','work',{}).?work_kind.orValue(state_output('preparation','work',{}).?work_kind.orValue(state_output('direction','work',{}).?work_kind.orValue('oversight')))))
    }}
  artifact_refs: >-
    ${{ jq([states.complete.outputs.result.documents,
      states.complete.outputs.result.work.?publish.orValue({}).?artifact_refs.orValue({})],
      '.[0] + (.[1] | with_entries(.key = "publication/" + .key | .value.name = .key))') }}
  reviews: '${{ (state_output(''direction'',''result'',{}).?human.hasValue() ? [states.direction.outputs.result] : []) + (state_output(''preparation'',''result'',{}).?human.hasValue() ? [states.preparation.outputs.result] : []) + (state_exists(''outcome'')
    ? [states.outcome.outputs.result] : []) }}'
  merge: ${{ states.complete.outputs.result.work.?publication.orValue({}) }}
  publication: ${{ states.complete.outputs.result.work.?publish.orValue({}) }}
  queue_publication: ${{ states.complete.outputs.result.work.?queue_publication.orValue({}) }}
vars:
  approve_plan: |
    .[1] as $approval | .[0] + {plan:{
      documents:$approval.reviewed_documents,
      receipt:$approval.receipt, human:$approval.human, review_id:$approval.review_id, revision:$approval.revision}}
