schema_version: 2
id: adaptive3
version: 0.2.0
input_schema:
  title:
    type: string
    default_value: ''
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  documents:
    type: artifact_map
    default_value: {}
  require_verification:
    type: boolean
    default_value: false
  merge_queue:
    type: boolean
    default_value: true
    description: Use the grouped Adaptive3 merge queue. Set false to merge directly.
  max_iterations:
    type: number
    default_value: 4
  resume_from:
    type: string
    default_value: ''
  model:
    type: string
    default_value: ''
  reasoning_effort:
    type: string
    default_value: ''
inputs:
  request: >-
    ${{ nonempty(inputs.title) ? '# ' + inputs.title + '\n\n' + inputs.prompt : inputs.prompt }}
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  documents: ${{ jq([context.artifacts,inputs.documents], 'add') }}
  require_verification: ${{ inputs.require_verification }}
  merge_queue: ${{ inputs.merge_queue }}
  max_iterations: ${{ inputs.max_iterations }}
  resume_from: ${{ inputs.resume_from }}
  model: ${{ inputs.model }}
  reasoning_effort: ${{ inputs.reasoning_effort }}
state:
  initial: configure
  states:
    configure:
      id: configure
      inputs:
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
      sequence:
      - id: origin
        op: command_execution
        const: true
        when: '!inputs.documents.exists(k,k.startsWith("review/negotiations/")) || inputs.documents.exists(k,k.startsWith("review/negotiations/") && inputs.documents[k].kind == "value")'
        artifacts:
          ./: ${{ jq(inputs.documents,'with_entries(select((.key | startswith("review/negotiations/")) and .value.kind == "value"))') }}
        inputs:
          env:
            REQUEST: ${{ inputs.request }}
            INBOX: ${{ context.environment.op.inbox }}
            OUTBOX: ${{ context.environment.op.outbox }}
          run: |
            python3 - <<'PY'
            import json, os, shutil, subprocess
            from urllib.parse import quote
            from pathlib import Path
            inbox = Path(os.environ['INBOX'])
            inline = inbox / 'review/negotiations'
            if inline.is_dir():
                # Native review expects stored references. Materialize caller-provided
                # inline evidence once and pass existing stored references through.
                target = Path(os.environ['OUTBOX'], 'review/negotiations')
                shutil.copytree(inline, target)
                for report in target.glob('*/report.md'):
                    with report.open('a') as stream:
                        stream.write('\n<!-- Incoming assignment -->\n')
                raise SystemExit(0)
            info = json.loads(subprocess.check_output(['c2j', 'self', '--json']))
            parent = info['execution'].get('parent') or {}
            if parent.get('job_id'):
                job = parent['job_id']
                tenant = quote(os.environ['C2J_CURRENT_TENANT_ID'], safe='')
                out = Path(os.environ['OUTBOX'], 'review/negotiations/origin/report.md')
                out.parent.mkdir(parents=True, exist_ok=True)
                out.write_text(f"# Why this job was requested\n\nDirect assignment from {parent.get('cell_name') or 'parent agent'} "
                               f"in [job {job}](https://jobs.colony2.com/{tenant}/jobs/{quote(job, safe='')}).\n\n"
                               f"Initiating task: {parent.get('invocation_path') or parent.get('op_step') or job}\n\n"
                               f"<!-- Recorded exchange -->\n\n## Original request\n\n{os.environ['REQUEST']}\n")
            PY
      - id: hook
        include: ./recipes/adaptive3/hooks.yaml
        inputs:
          hook: configure
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          documents: ${{ inputs.documents }}
      outputs:
        result: ${{ sequence.hook.outputs.result }}
        settings: ${{ sequence.hook.outputs.settings }}
        documents: ${{ jq([inputs.documents,sequence.hook.outputs.?artifacts.orValue({}),sequence.?origin.orValue({}).?artifacts.orValue({})],'.[0] + .[1] + (.[2] | with_entries(select(.key | startswith("review/negotiations/"))))') }}
      transitions:
      - to: delegate
        when: 'true'
    delegate:
      include: ./recipes/adaptive3/delegate.yaml
      inputs:
        request: ${{ inputs.request }}
        resume_from: ${{ inputs.resume_from }}
        record: ${{ state_output('dispatch','record',{'documents':states.configure.outputs.documents,'configuration':states.configure.outputs.result.status,'settings':states.configure.outputs.settings}) }}
        last: ${{ state_output('dispatch','result',states.configure.outputs.result) }}
        settings: ${{ state_output('dispatch','record',{}).?settings.orValue(states.configure.outputs.settings) }}
        session: ${{ state_output('delegate','session',{}) }}
        agent_settings: ${{ vars.agent_settings }}
      transitions:
      - to: complete
        when: outputs.action.primitive in ['finish','withdraw'] && outputs.allowed
      - to: dispatch
        when: 'true'
    dispatch:
      include: ./recipes/adaptive3/dispatch.yaml
      inputs:
        action: ${{ states.delegate.outputs.action }}
        issue: ${{ states.delegate.outputs.issue }}
        resume_from: ${{ inputs.resume_from }}
        recovery_patch: ${{ states.delegate.outputs.?patch.orValue(null) }}
        request: ${{ inputs.request }}
        record: ${{ state_output('dispatch','record',{'documents':states.configure.outputs.documents,'configuration':states.configure.outputs.result.status,'settings':states.configure.outputs.settings}) }}
        visits: ${{ state_output('dispatch','visits',0)+1 }}
        budget: >-
          ${{ 16 * (inputs.max_iterations > 0 ? int(inputs.max_iterations) : 4) }}
        settings: ${{ state_output('dispatch','record',{}).?settings.orValue(states.configure.outputs.settings) }}
        target_directory: ${{ inputs.target_directory }}
        require_verification: ${{ inputs.require_verification }}
        merge_queue: ${{ inputs.merge_queue }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ vars.agent_settings }}
      transitions:
      - to: delegate
        when: 'true'
    complete:
      status: null
      inputs:
        record: ${{ states.dispatch.outputs.record }}
      sequence: []
      outputs:
        record: ${{ inputs.record }}
        integration: ${{ inputs.record.?integration.orValue({}) }}
outputs:
  summary: ${{ states.delegate.outputs.action.instruction }}
  work_kind: ${{ states.complete.outputs.record.?kind.orValue('oversight') }}
  artifact_refs: ${{ jq([states.complete.outputs.record.documents,jq(states.complete.outputs.record,'if .handoff and .outcome_patch then {"candidate.diff":.outcome_patch} else {} end'), states.complete.outputs.integration.?publish.orValue({}).?artifact_refs.orValue({})], '.[0] + .[1] + (.[2] | with_entries(.key = "publication/" + .key | .value.name = .key))') }}
  reviews: ${{ states.complete.outputs.record.?reviews.orValue([]) }}
  withdrawal: >-
    ${{ jq([states.delegate.outputs.action,states.complete.outputs.record], 'if .[0].primitive=="withdraw" then {status:"withdrawn",summary:.[0].instruction,source:.[1].human_instruction} else null end') }}
  merge: ${{ states.complete.outputs.integration.?publication.orValue({}) }}
  publication: ${{ states.complete.outputs.integration.?publish.orValue({}) }}
  consumer_check: ${{ states.complete.outputs.record.?consumer.orValue(null) }}
  queue_publication: ${{ states.complete.outputs.integration.?queue_publication.orValue({}) }}
vars:
  agent_settings: ${{ {'model':inputs.model,'reasoning_effort':inputs.reasoning_effort} }}
