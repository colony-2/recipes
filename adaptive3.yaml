schema_version: 2
id: adaptive3
version: 0.1.0
input_schema:
  title:
    type: string
    default_value: ''
  prompt:
    type: string
    required: true
  target_directory:
    type: string
    default_value: .
  documents:
    type: artifact_map
    default_value: {}
  require_verification:
    type: boolean
    default_value: false
  max_iterations:
    type: number
    default_value: 4
  resume_from:
    type: string
    default_value: ''
  model:
    type: string
    default_value: ''
  reasoning_effort:
    type: string
    default_value: ''
inputs:
  title: ${{ inputs.title }}
  prompt: ${{ inputs.prompt }}
  target_directory: ${{ inputs.target_directory }}
  documents: ${{ jq([context.artifacts,inputs.documents], 'add') }}
  require_verification: ${{ inputs.require_verification }}
  max_iterations: ${{ inputs.max_iterations }}
  resume_from: ${{ inputs.resume_from }}
  model: ${{ inputs.model }}
  reasoning_effort: ${{ inputs.reasoning_effort }}
state:
  initial:
  - to: resolve
    when: inputs.resume_from != ''
    payload:
      stage: recovery
      problem:
        summary: Inspect previous work and current direction before choosing where to continue.
      documents: ${{ inputs.documents }}
  - to: configure
    when: 'true'
  states:
    configure:
      id: configure
      inputs:
        request: ${{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        feedback: ${{ transition.payload.?feedback.orValue({}) }}
        destination: ${{ transition.payload.?destination.orValue('direction') }}
      sequence:
      - id: hook
        include: ./recipes/adaptive3/hooks.yaml
        inputs:
          hook: configure
          request: ${{ inputs.request }}
          target_directory: ${{ inputs.target_directory }}
          documents: ${{ inputs.documents }}
      outputs:
        result: ${{ sequence.hook.outputs.result }}
        settings: ${{ sequence.hook.outputs.settings }}
        destination: ${{ inputs.destination }}
        documents: ${{ inputs.documents }}
        feedback: ${{ inputs.feedback }}
      transitions:
      - to: direction
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'direction'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: preparation
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'preparation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: implementation
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'implementation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: outcome
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'outcome'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: integration
        when: outputs.result.status in ['passed','skipped'] && outputs.destination == 'integration'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: resolve
        when: 'true'
        payload:
          stage: configure
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
    direction:
      id: direction
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        purpose: direction
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(inputs.documents) }}
        feedback: ${{ transition.payload.?feedback.orValue({}) }}
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ state_output('resolve','agent_settings',jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value
          != ""))')) }}
      transitions:
      - to: resolve
        when: outputs.result.status == 'stuck'
        payload:
          stage: direction
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: complete
        when: outputs.result.status == 'accepted' && outputs.work.?work_kind.orValue('') == 'explanation'
        payload:
          result: ${{ outputs }}
      - to: preparation
        when: outputs.result.status == 'accepted'
      - to: resolve
        when: 'true'
        payload:
          stage: direction
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
    preparation:
      id: preparation
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        purpose: preparation
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(state_output('direction','documents',inputs.documents))
          }}
        feedback: '${{ transition.payload.?feedback.orValue(state_output(''direction'',''feedback'',{}).?approval.hasValue()
          ? state_output(''direction'',''feedback'',{}) : state_output(''direction'',''result'',{})) }}'
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ state_output('resolve','agent_settings',jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value
          != ""))')) }}
      transitions:
      - to: resolve
        when: outputs.result.status == 'stuck'
        payload:
          stage: preparation
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: direction
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'direction'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: implementation
        when: outputs.result.status == 'accepted'
      - to: resolve
        when: 'true'
        payload:
          stage: preparation
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
    implementation:
      id: implementation
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        purpose: implementation
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(state_output('preparation','documents',inputs.documents))
          }}
        feedback: '${{ transition.payload.?feedback.orValue(state_output(''preparation'',''feedback'',{}).?approval.hasValue()
          ? state_output(''preparation'',''feedback'',{}) : state_output(''preparation'',''result'',{})) }}'
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ state_output('resolve','agent_settings',jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value
          != ""))')) }}
      transitions:
      - to: resolve
        when: outputs.result.status == 'stuck'
        payload:
          stage: implementation
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: direction
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'direction'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: preparation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'preparation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: outcome
        when: outputs.result.status == 'accepted'
      - to: resolve
        when: 'true'
        payload:
          stage: implementation
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
    outcome:
      id: outcome
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        purpose: outcome
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(state_output('implementation','documents',inputs.documents))
          }}
        feedback: '${{ transition.payload.?feedback.orValue(state_output(''implementation'',''feedback'',{}).?approval.hasValue()
          ? state_output(''implementation'',''feedback'',{}) : state_output(''implementation'',''result'',{})) }}'
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ state_output('resolve','agent_settings',jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value
          != ""))')) }}
      transitions:
      - to: complete
        when: outputs.result.status == 'accepted' && !outputs.candidate.changed
        payload:
          result: ${{ outputs }}
      - to: resolve
        when: outputs.result.status == 'stuck'
        payload:
          stage: outcome
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: direction
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'direction'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: preparation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'preparation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: implementation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'implementation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: integration
        when: outputs.result.status == 'accepted'
      - to: resolve
        when: 'true'
        payload:
          stage: outcome
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
    integration:
      id: integration
      include: ./recipes/adaptive3/lifecycle.yaml
      inputs:
        purpose: integration
        request: |-
          {{ inputs.title }}
          {{ inputs.prompt }}
        target_directory: ${{ inputs.target_directory }}
        documents: ${{ transition.payload.?documents.orValue(state_output('outcome','documents',inputs.documents))
          }}
        feedback: '${{ transition.payload.?feedback.orValue(state_output(''outcome'',''feedback'',{}).?approval.hasValue()
          ? state_output(''outcome'',''feedback'',{}) : state_output(''outcome'',''result'',{})) }}'
        settings: ${{ states.configure.outputs.settings }}
        require_verification: ${{ inputs.require_verification }}
        max_iterations: ${{ inputs.max_iterations }}
        agent_settings: ${{ state_output('resolve','agent_settings',jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value
          != ""))')) }}
      transitions:
      - to: chase
        when: outputs.result.?failure.orValue({}).?code.orValue('') == 'MERGE_UPSTREAM_ADVANCED'
      - to: resolve
        when: outputs.result.status == 'stuck'
        payload:
          stage: integration
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: direction
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'direction'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: preparation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'preparation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: implementation
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'implementation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: outcome
        when: outputs.result.status == 'changes' && outputs.result.?stage.orValue('') == 'outcome'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.result }}
      - to: complete
        when: outputs.result.status == 'accepted'
        payload:
          result: ${{ outputs }}
      - to: resolve
        when: 'true'
        payload:
          stage: integration
          problem: ${{ outputs.result }}
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
    resolve:
      inputs:
        stage: ${{ transition.payload.stage }}
        problem: ${{ transition.payload.problem }}
        documents: ${{ transition.payload.documents }}
        request: ${{ inputs.prompt }}
        feedback: ${{ transition.payload.?feedback.orValue(state_output('resolve','result',{})) }}
        agent_settings: ${{ state_output('resolve','agent_settings',jq({'model':inputs.model,'reasoning_effort':inputs.reasoning_effort},'with_entries(select(.value
          != ""))')) }}
        prior_job: '${{ transition.payload.stage == ''recovery'' ? inputs.resume_from : '''' }}'
        automatic_used: ${{ state_output('resolve','automatic_used',0) }}
        merge_limit: ${{ state_output('resolve','merge_limit',3) }}
      sequence:
      - id: resolver
        include: ./recipes/adaptive3/resolver.yaml
        inputs:
          stage: ${{ inputs.stage }}
          problem: ${{ inputs.problem }}
          documents: ${{ inputs.documents }}
          request: ${{ inputs.request }}
          feedback: ${{ inputs.feedback }}
          agent_settings: ${{ inputs.agent_settings }}
          prior_job: ${{ inputs.prior_job }}
          automatic: ${{ inputs.automatic_used < 2 }}
      outputs:
        result: ${{ jq([sequence.resolver.outputs.result,inputs.problem],'.[0] as $r | .[1] as $p | $r + (if $p.budget
          then {budget:($p.budget | .limits[$p.loop] += ([$r.additional_attempts // 4,1] | max | [.,20] | min))}
          else {} end)') }}
        documents: ${{ sequence.resolver.outputs.documents }}
        problem: ${{ inputs.problem }}
        agent_settings: ${{ sequence.resolver.outputs.agent_settings }}
        automatic_used: '${{ sequence.resolver.outputs.result.?human.orValue({}).?fields.orValue({}).?decision.orValue('''')
          == ''continue'' ? 0 : inputs.automatic_used+1 }}'
        merge_limit: '${{ inputs.merge_limit + (inputs.problem.?loop.orValue('''') == ''merge'' ? int(sequence.resolver.outputs.result.?additional_attempts.orValue(4))
          : 0) }}'
      transitions:
      - to: configure
        when: '!state_exists(''configure'') && outputs.result.stage != ''configure'''
        payload:
          destination: ${{ outputs.result.stage }}
          documents: ${{ outputs.documents }}
          feedback: ${{ jq([outputs.problem,outputs.result], 'add') }}
      - to: configure
        when: outputs.result.stage == 'configure'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ jq([outputs.problem,outputs.result], 'add') }}
      - to: direction
        when: outputs.result.stage == 'direction'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ jq([outputs.problem,outputs.result], 'add') }}
      - to: preparation
        when: outputs.result.stage == 'preparation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ jq([outputs.problem,outputs.result], 'add') }}
      - to: implementation
        when: outputs.result.stage == 'implementation'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ jq([outputs.problem,outputs.result], 'add') }}
      - to: outcome
        when: outputs.result.stage == 'outcome'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ jq([outputs.problem,outputs.result], 'add') }}
      - to: integration
        when: outputs.result.stage == 'integration'
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ jq([outputs.problem,outputs.result], 'add') }}
    complete:
      sequence: []
      outputs:
        result: ${{ transition.payload.result }}
    chase:
      inputs:
        used: ${{ state_output('chase','used',0)+1 }}
        limit: ${{ state_output('resolve','merge_limit',3) }}
        documents: ${{ states.integration.outputs.documents }}
        feedback: '${{ jq([states.integration.outputs.feedback,{''failure'':states.integration.outputs.result.failure,''summary'':states.integration.outputs.result.summary,''approval'':state_exists(''outcome'')
          ? {''result'':states.outcome.outputs.result,''patch'':states.outcome.outputs.patch} : states.integration.outputs.feedback.?approval.orValue({})}],''add'')
          }}'
      sequence: []
      outputs:
        used: ${{ inputs.used }}
        limit: ${{ inputs.limit }}
        documents: ${{ inputs.documents }}
        feedback: ${{ inputs.feedback }}
      transitions:
      - to: implementation
        when: outputs.used <= outputs.limit
        payload:
          documents: ${{ outputs.documents }}
          feedback: ${{ outputs.feedback }}
      - to: resolve
        when: 'true'
        payload:
          stage: implementation
          documents: ${{ outputs.documents }}
          problem: ${{ jq([outputs.feedback,{'status':'stuck','loop':'merge','summary':'Repeated upstream changes
            have used the merge allowance. Decide the next correction before trying another complete cycle.'}],'add')
            }}
          feedback: ${{ outputs.feedback }}
outputs:
  summary: ${{ states.complete.outputs.result.work.summary }}
  work_kind: ${{ states.complete.outputs.result.work.?work_kind.orValue(state_output('outcome','work',{}).?work_kind.orValue(state_output('implementation','work',{}).?work_kind.orValue(state_output('preparation','work',{}).?work_kind.orValue(state_output('direction','work',{}).?work_kind.orValue('oversight')))))
    }}
  artifact_refs: ${{ states.complete.outputs.result.documents }}
  reviews: '${{ (state_exists(''direction'') ? [states.direction.outputs.result] : []) + (state_exists(''outcome'')
    ? [states.outcome.outputs.result] : []) }}'
  merge: ${{ states.complete.outputs.result.work.?publication.orValue({}) }}
  publication: ${{ states.complete.outputs.result.work.?publish.orValue({}) }}
