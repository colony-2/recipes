recipe: fixtures/accounting-stale.yaml
cases:
- id: changed-candidate-invalidates-accounting
  type: integration_case
  runtime:
    cells:
      root:
        files:
          candidate.txt: original
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: stale
    value: true
  - type: output_equals
    path: approved
    value: false
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.endsWith("render_file_accounting") || c.op in ["merge", "squashrebasemerge"])'
