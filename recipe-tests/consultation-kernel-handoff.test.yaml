recipe: fixtures/consultation-kernel-handoff.yaml
cases:
- id: expert-discussion
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Client application
          candidate.txt: original
        file_sources:
          consultation-test-statements.md: consultation-kernel-statements.md
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
    observe_files:
    - candidate.txt
    - experiment.txt
  inputs:
    foreign: false
    use_summary: false
  mocks:
    ops:
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@5166aec516e5a1958601121d5a3753072acf8dd3
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            ready: true
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: caller
                iteration: 0
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@5166aec516e5a1958601121d5a3753072acf8dd3
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: continue
            thinking: 'consultant reply 1: continue'
            files:
            - path: iter1/consultant/spec.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter1/consultant/spec.md: '# Proposed constraints'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
          worktree:
            experiment.txt: Discard this experiment
            candidate.txt: Unaccepted experiment
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@5166aec516e5a1958601121d5a3753072acf8dd3
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: continue
            thinking: 'requester reply 2: continue'
            files:
            - path: iter2/requester/tests.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter2/requester/tests.md: '# Acceptance outcomes'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: requester
                iteration: 2
          worktree:
            experiment.txt: Discard this experiment
            candidate.txt: Unaccepted experiment
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@5166aec516e5a1958601121d5a3753072acf8dd3
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 2: agreed'
            files:
            - path: iter2/consultant/spec.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter2/consultant/spec.md: '# Final; security finding remains blocking'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 2
          worktree:
            experiment.txt: Discard this experiment
            candidate.txt: Unaccepted experiment
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@5166aec516e5a1958601121d5a3753072acf8dd3
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            ready: true
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: caller-final
                iteration: 0
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.outcome
    value: agreed
  - type: cel_true
    expr: outputs.result.requester_start_session == outputs.seed
  - type: cel_true
    expr: outputs.result.requester_session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[2].outputs.session
  - type: cel_true
    expr: outputs.result.consultant_session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[3].outputs.session
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[2].inputs.inputs.session
      == outputs.seed
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[3].inputs.inputs.session
      == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].outputs.session
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[4].inputs.inputs.session
      == outputs.result.requester_session
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].worktree["candidate.txt"]
      == "unmerged candidate\n"
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[2].worktree["candidate.txt"]
      == "unmerged candidate\n"
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).all(c,
      !("experiment.txt" in c.worktree))
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].artifacts["iter1/requester/brief.md"]
      == "# Request\nInspect the current candidate.\n"
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[4].artifacts["iter2/consultant/spec.md"].contains("blocking")
  - type: cel_true
    expr: repositories.B.new_commits == 0
  - type: cel_true
    expr: repositories.root.new_commits == 0
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[2].inputs.inputs.prompt.contains("Purpose:")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[2].inputs.inputs.prompt.contains("You
      are the requester")
  - type: cel_true
    expr: '!("instructions" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[2].inputs.inputs)'
  - type: cel_true
    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[3].inputs.inputs.prompt.contains("Purpose:")'
