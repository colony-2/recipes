- id: validator-operation-failure-retries-without-model-replay
  type: integration_case
  runtime:
    cells:
      root:
        files:
          candidate.txt: original
  mocks:
    ops:
    - match:
        node_path: accounting-fixture/review/build-merge-review/accounting/accounting-response/validate/sequence/validate_accounting
      behavior:
        mode: return
        outputs:
          success: false
          exit_code: 1
          stdout: ''
          stderr: Temporary validator runtime failure
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            subject: Update requested behavior
            review_message: The requested behavior is implemented. Checks are recorded.
            files:
            - path: candidate.txt
              change: M
              reason: Implement the requested behavior.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: reviewer
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.approved
    value: true
  - type: cel_true
    expr: size(calls.filter(c, c.op == "extension_execution")) == 1 && size(reviews) == 0
  - type: cel_true
    expr: size(calls.filter(c, c.node_path.endsWith("validate_accounting"))) == 2
