recipe: fixtures/accounting-repair.yaml
cases:
- id: repairs-empty-response
  type: integration_case
  runtime:
    cells:
      root:
        files:
          candidate.txt: original
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            subject: Update requested behavior
            review_message: The requested behavior is implemented. Checks are recorded.
            files: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: reviewer
        artifacts:
          review.json: Complete accounting exists here but response.files is authoritative.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            subject: Update requested behavior
            review_message: The requested behavior is implemented. Checks are recorded.
            files:
            - &id001
              path: candidate.txt
              change: M
              reason: Implement the requested behavior.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: reviewer
    - &id002
      repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.approved
    value: true
  - type: cel_true
    expr: size(calls.filter(c, c.op == "extension_execution")) == 2
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution")[1].inputs.inputs.session == calls.filter(c, c.op == "extension_execution")[0].outputs.session
  - type: cel_true
    expr: 'calls.filter(c, c.op == "extension_execution")[1].artifacts["repair.json"].contains("Missing file: candidate.txt")'
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution")[1].artifacts["review.json"].contains("authoritative")
  - type: cel_true
    expr: '!calls.exists(c, c.op in ["merge", "squashrebasemerge", "recipes.run"]) && size(reviews) == 0'
