recipe: fixtures/build-classify.yaml
cases:
- id: confident-light
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          PURPOSE.md: Own the widget library.
          README.md: Python widgets.
          ARCHITECTURE.md: A small Python module.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.02
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: light
    value: true
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution")[0].inputs.inputs.state.repository_purpose.contains("widget
      library")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution")[0].inputs.inputs.state.repository_architecture.contains("small
      Python module")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution")[0].inputs.inputs.state.request == "Correct the README
      typo."
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution")[0].inputs.inputs.api_key["$c2j_secret"] == "jev_api_key"
