recipe: fixtures/creation-routing.yaml
cases:
- id: explicit-create-routes-to-root-once
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Requester
        file_sources:
          .c2/recipes/creation-outcome.yaml: fixtures/creation-outcome.yaml
      R:
        files:
          PURPOSE.md: Project architecture
          creation-result.json: '{"disposition":"created","merged":true,"created_cells":[{"cell":"absent","repo":"https://example.test/absent.git","ref":"main","revision":"published"}]}'
        file_sources:
          .c2/recipes/creation-outcome.yaml: fixtures/creation-outcome.yaml
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: valid
    value: true
  - type: cel_true
    expr: size(calls.filter(c, c.op == "recipes.run")) == 1
  - type: cel_true
    expr: calls.filter(c, c.op == "recipes.run")[0].cell == "R"
  - type: cel_true
    expr: '!calls.exists(c, c.op == "extension_execution")'
  - type: output_equals
    path: flow.threads.new_cell.result.outcome
    value: agreed
