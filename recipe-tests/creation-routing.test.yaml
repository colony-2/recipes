recipe: fixtures/creation-routing.yaml
cases:
  - id: adaptive-published
    type: integration_case
    runtime:
      cells:
        root: {}
        alpha: {}
        beta: {}
    mocks:
      ops:
        - match:
            op: recipes.run
          behavior:
            mode: return
            outputs:
              job_ids:
                - creation-result
        - match:
            op: recipe.await_result_soft
          behavior:
            mode: return
            fixture_refs:
              alpha_repo:
                cell: alpha
                field: repo
            outputs_fixture_expr: '{"status": "completed", "outputs": {"disposition": "created", "merged": true, "merged_hash": "", "created_cells": [{"cell": "alpha", "repo": alpha_repo, "ref": "refs/heads/main", "revision": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}], "artifact_refs": {}}}'
        - match:
            op: command_execution
          repeat: true
          required: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.result.ready == true && outputs.continued == true
      - type: cel_true
        expr: '!calls.exists(c, c.op == "thinpackrebase")'
      - type: cel_true
        expr: calls.filter(c, c.op == "recipes.run")[0].inputs.recipes[0].inputs.prompt.contains("exact initial purposes") && !calls.filter(c, c.op == "recipes.run")[0].inputs.recipes[0].inputs.prompt.contains("root configuration")
      - type: cel_true
        expr: outputs.result.target.state == "ready"
