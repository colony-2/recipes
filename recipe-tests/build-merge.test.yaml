  - type: cel_true
    expr: size(calls.filter(c, c.op == "extension_execution" && c.node_path.contains("/accounting/"))) == 2
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.node_path.contains("/work/"))[3].inputs.inputs.session
      == calls.filter(c, c.op == "extension_execution" && c.node_path.contains("/work/"))[2].outputs.session
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.node_path.contains("/work/"))[3].artifacts["merge-review.md"].contains("Explain
      the migration impact")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.node_path.contains("/accounting/")).all(c, !("session"
      in c.inputs.inputs))
