recipe: fixtures/build-merge.yaml
cases:
- id: file-accounting-rebases-and-publishes-reviewed-message
  type: integration_case
  runtime:
    secrets:
      codex_api_key: synthetic-build-credential
    config:
      codex_api_base_url: https://fixture.invalid/v1
    cells:
      root:
        files:
          candidate.txt: original
          obsolete.txt: obsolete content
    observe_files:
    - candidate.txt
    - unapproved.txt
    - obsolete.txt
    - added document.md
    - upstream.txt
    responses:
    - node_path: build-merge-fixture/develop/root/approval/sequence/plan_review/kernel-review/request_human_review
      fields:
        decision: approve
    - node_path: build-merge-fixture/develop/root/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  mocks:
    ops:
    - &approved_accounting
      repeat: true
      match:
        node_path: build-merge-fixture/develop/root/accounting/sequence/review/build-merge-review/reviewer/kernel-agent-turn/start_read_only_session/start_read_only_session
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            subject: Improve requested behavior with verified coverage
            review_message: Implement the approved behavior and verify it with build.sh. Independent assessment
              and file accounting found the changes appropriate.
            files:
            - path: build.sh
              change: A
              reason: Exercise the approved behavior with an automated check.
            - path: candidate.txt
              change: M
              reason: Implement the approved behavior in this file.
            - path: obsolete.txt
              change: D
              reason: Remove the obsolete implementation as requested.
            - path: added document.md
              change: A
              reason: Document the approved behavior for users.
    - &design
      match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: design response
            files:
            - path: design.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          design.md: '# design evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: design
                turn: 1review
    - &test_plan
      match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: test-plan response
            files:
            - path: test-statements.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: test-plan
                turn: 1review
          artifact_files:
            test-statements.md: build-kernel-statements.md
    - &plan_assessment
      match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Independent plan assessment
            assessment: pass
            files:
            - path: iter1/consultant/plan-review.md
              description: Review evidence
        artifacts:
          iter1/consultant/plan-review.md: '# Independent findings'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                expert: plan
    - &implementation
      match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: implement response
            files:
            - path: implementation.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          implementation.md: '# implement evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: implement
                turn: 1review
          worktree:
            candidate.txt: implemented behavior
            build.sh: '#!/bin/sh

              test "$(cat candidate.txt)" = "implemented behavior"

              test -f upstream.txt

              test ! -e obsolete.txt

              '
    - &outcome_assessment
      match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Independent outcome assessment
            assessment: pass
            files:
            - path: iter1/consultant/outcome-review.md
              description: Review evidence
        artifacts:
          iter1/consultant/outcome-review.md: '# Independent findings'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                expert: outcome
    - &commands
      repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: build.merged
    value: true
  - type: output_equals
    path: build.verification.status
    value: passed
  - type: cel_true
    expr: repositories.root.new_commits == 2
  - type: cel_true
    expr: repositories.root.files["candidate.txt"] == "implemented behavior" && !("obsolete.txt" in repositories.root.files)
      && "upstream.txt" in repositories.root.files
  - type: cel_true
    expr: calls.filter(c, c.op in ["rebase", "squash", "merge"]).map(c, c.op) == ["rebase", "squash", "merge"]
  - type: cel_true
    expr: '!calls.exists(c, c.op == "squashrebasemerge")'
  - type: cel_true
    expr: outputs.commit_message == calls.filter(c, c.op == "squash")[0].inputs.commit_message
  - type: cel_true
    expr: 'outputs.commit_message.startsWith("Improve requested behavior with verified coverage\n\n") && outputs.commit_message.contains("Job:
      https://jobs.colony2.com/0/jobs/" + calls.filter(c, c.op == "squash")[0].job_id)'
  - type: cel_true
    expr: calls.filter(c, c.op == "merge")[0].outputs.merged_hash == calls.filter(c, c.op == "squash")[0].outputs.squashed_hash
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.node_path.contains("/accounting/")).all(c, !("session"
      in c.inputs.inputs) && c.worktree["upstream.txt"] == "Concurrent upstream work\n")
  - type: cel_true
    expr: size(reviews) == 2 && "merge-review.md" in reviews[1].form.documents
  - type: cel_true
    expr: calls.filter(c, c.node_path.contains("/accounting/") && c.op == "extension_execution")[0].artifacts["merge-candidate.json"].contains("obsolete.txt")
  - type: cel_true
    expr: '"merge-review.md" in outputs.build.artifact_refs'
  - type: cel_true
    expr: >-
      calls.filter(c, c.node_path.endsWith("/inspect_commit"))[0].artifacts["merge-review.md"].contains("Remove the obsolete implementation as requested.")
      && calls.filter(c, c.node_path.endsWith("/inspect_commit"))[0].artifacts["merge-review.md"].contains("Document the approved behavior for users.")
      && calls.filter(c, c.node_path.endsWith("/inspect_commit"))[0].artifacts["merge-review.md"].contains("Implement the approved behavior in this file.")
  - type: cel_true
    expr: >-
      calls.filter(c, c.op == "extension_execution" && c.node_path.contains("/assessment/"))[1].worktree["upstream.txt"] == "Concurrent upstream work\n"
