recipe: fixtures/agent-failure.yaml
cases:
- id: propagate-fresh
  type: recipe_case
  options:
    validation_mode: path_only
  inputs:
    read_only: false
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: fail
        error:
          message: Agent transport unavailable
  assertions:
  - type: output_equals
    path: propagated
    value: true
  - type: output_equals
    path: failure.message
    value: Agent transport unavailable
  - type: cel_true
    expr: outputs.failure.node.path.contains("/fresh/")
  - type: cel_true
    expr: '!calls.exists(c, c.op == "command_execution")'
- id: propagate-resume
  type: recipe_case
  options:
    validation_mode: path_only
  inputs:
    read_only: false
    session: &id001
      $c2j_object: v1
      type: c2ops.codex.session/v1
      tenant_id: test
      sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      artifact:
        jobId: seed
        taskOrdinal: 1
        name: __c2j_objects__/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.tar
        sizeBytes: 100
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: fail
        error:
          message: Agent transport unavailable
  assertions:
  - type: output_equals
    path: propagated
    value: true
  - type: output_equals
    path: failure.message
    value: Agent transport unavailable
  - type: cel_true
    expr: outputs.failure.node.path.contains("/resume/")
  - type: cel_true
    expr: '!calls.exists(c, c.op == "command_execution")'
- id: propagate-read_fresh
  type: recipe_case
  options:
    validation_mode: path_only
  inputs:
    read_only: true
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: fail
        error:
          message: Agent transport unavailable
  assertions:
  - type: output_equals
    path: propagated
    value: true
  - type: output_equals
    path: failure.message
    value: Agent transport unavailable
  - type: cel_true
    expr: outputs.failure.node.path.contains("/read_fresh/")
  - type: cel_true
    expr: '!calls.exists(c, c.op == "command_execution")'
- id: propagate-read_resume
  type: recipe_case
  options:
    validation_mode: path_only
  inputs:
    read_only: true
    session: *id001
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: fail
        error:
          message: Agent transport unavailable
  assertions:
  - type: output_equals
    path: propagated
    value: true
  - type: output_equals
    path: failure.message
    value: Agent transport unavailable
  - type: cel_true
    expr: outputs.failure.node.path.contains("/read_resume/")
  - type: cel_true
    expr: '!calls.exists(c, c.op == "command_execution")'
