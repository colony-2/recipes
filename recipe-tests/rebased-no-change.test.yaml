recipe: fixtures/rebased-no-change.yaml
cases:
- id: rebased-away-change-still-requires-human-review
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          PURPOSE.md: Own widget documentation.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
              target_directory: ${{ inputs.target_directory }}
            sequence:
            - id: run_suite
              op: command_execution
              const: true
              inputs:
                env:
                  TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  cd "$TARGET" || exit 1
                  if (
                  test "$(cat candidate.txt)" = corrected
                  ) > "$OUTBOX/tests.log" 2>&1; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.run_suite.outputs.stdout }}
              summary: Fixture repository checks completed.
              artifact_refs: "${{ {'tests.log': sequence.run_suite.artifacts['tests.log']} }}"
    observe_files:
    - candidate.txt
    responses:
    - node_path:
        rebased-no-change/develop/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: The existing documentation already satisfies the request.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget documentation
            review_message: Upstream already applied the requested correction. The rebased candidate is empty
              and the content check confirms the requirement is satisfied.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          artifact_files:
            test-statements.md: completion-review-statements.md
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews) == 1
  - type: cel_true
    expr: outputs.disposition == "unchanged" && !outputs.merged
  - type: cel_true
    expr: '!calls.exists(c, c.op in ["squash", "merge"])'
  - type: cel_true
    expr: calls.exists(c, c.op == "rebase")
  - type: cel_true
    expr: outputs.review_document.contains("## No-change rationale") &&
      outputs.review_document.contains("Upstream already applied")
