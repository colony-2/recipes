# Shared anchors reuse identical fixtures; each case declares its own outcome assertions.
recipe: fixtures/completion-review.yaml
cases:
- id: missing-purpose-cannot-complete-without-human-acceptance
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          candidate.txt: original
          README.md: Widget documentation owner
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
              target_directory: ${{ inputs.target_directory }}
            sequence:
            - id: run_suite
              op: command_execution
              const: true
              inputs:
                env:
                  TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  cd "$TARGET" || exit 1
                  if (
                  test ! -e PURPOSE.md
                  ) > "$OUTBOX/tests.log" 2>&1; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.run_suite.outputs.stdout }}
              summary: Fixture repository checks completed.
              artifact_refs: "${{ {'tests.log': sequence.run_suite.artifacts['tests.log']} }}"
    observe_files:
    - candidate.txt
    - PURPOSE.md
    responses:
    - node_path:
        completion-review/build/root/run/light/light/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: cancel
  inputs:
    prompt: Create root PURPOSE.md from repository evidence.
  mocks: &id007
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: PURPOSE.md remains absent; implementation did not occur.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget documentation
            review_message: This is not a successful documentation-refresh outcome. The prior consultant
              restriction prevented implementation.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          artifact_files:
            test-statements.md: completion-review-statements.md
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: disposition
    value: cancelled
  - type: cel_true
    expr: size(reviews) == 1 && "synopsis.md" in reviews[0].form.documents
  - type: cel_true
    expr: '!outputs.merged && repositories.root.new_commits == 0'
  - type: cel_true
    expr: '!("PURPOSE.md" in repositories.root.files)'
  - type: cel_true
    expr: '!calls.exists(c, c.op in ["squash", "merge"])'
  - type: cel_true
    expr: calls.filter(c,
      c.node_path.endsWith("/render_change_synopsis"))[0].inputs.env.RESPONSE.contains("not a successful
      documentation-refresh outcome")
  - type: cel_true
    expr: outputs.review_document.contains("## No-change rationale") && outputs.review_document.contains("not
      a successful documentation-refresh outcome")
- id: unchanged-revision-requires-work-and-another-review
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          PURPOSE.md: Own widget documentation.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
              target_directory: ${{ inputs.target_directory }}
            sequence:
            - id: run_suite
              op: command_execution
              const: true
              inputs:
                env:
                  TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  cd "$TARGET" || exit 1
                  if (
                  case "$(cat candidate.txt)" in original|corrected) exit 0;; *) exit 1;; esac
                  ) > "$OUTBOX/tests.log" 2>&1; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.run_suite.outputs.stdout }}
              summary: Fixture repository checks completed.
              artifact_refs: "${{ {'tests.log': sequence.run_suite.artifacts['tests.log']} }}"
    observe_files:
    - candidate.txt
    responses:
    - node_path:
        completion-review/build/root/run/light/light/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: revise
        feedback: The documentation needs correction; implement the request.
    - node_path:
        completion-review/build/root/run/light/light/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Correct the widget documentation.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: The existing documentation already satisfies the request.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget documentation
            review_message: README and candidate.txt already describe the requested behavior; inspection and
              the content check confirm no repository changes are needed.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          artifact_files:
            test-statements.md: completion-review-statements.md
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs: &id009
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Correct the widget documentation.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget documentation
            review_message: Correct the documented widget behavior. Verify the updated content with an
              automated check.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          worktree:
            candidate.txt: corrected
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews) == 2
  - type: cel_true
    expr: outputs.merged && outputs.disposition == "implemented"
  - type: cel_true
    expr: repositories.root.files["candidate.txt"] == "corrected"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "merge")) == 1
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[1].inputs.inputs.session == calls.filter(c, c.op ==
      "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
- id: heavy-no-change-rationale-requires-human-acceptance
