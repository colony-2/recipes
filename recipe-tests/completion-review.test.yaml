  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          candidate.txt: original
          README.md: Widget documentation owner
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
              target_directory: ${{ inputs.target_directory }}
            sequence:
            - id: run_suite
              op: command_execution
              const: true
              inputs:
                env:
                  TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  cd "$TARGET" || exit 1
                  if (
                  test ! -e PURPOSE.md
                  ) > "$OUTBOX/tests.log" 2>&1; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.run_suite.outputs.stdout }}
              summary: Fixture repository checks completed.
              artifact_refs: "${{ {'tests.log': sequence.run_suite.artifacts['tests.log']} }}"
    observe_files:
    - candidate.txt
    - PURPOSE.md
    responses:
    - node_path:
        completion-review/build/root/run/light/light/light-develop/repair/sequence/repair/result-repair/review/review/kernel-review/request_human_review
      fields:
        decision: cancel
  inputs:
    prompt: Create root PURPOSE.md from repository evidence.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: PURPOSE.md remains absent; implementation did not occur.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget documentation
            review_message: '   '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          artifact_files:
            test-statements.md: completion-review-statements.md
      repeat: true
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.disposition == "cancelled" && !outputs.merged
  - type: cel_true
    expr: size(reviews) == 1 && reviews[0].form.title == "Agent result needs correction"
  - type: cel_true
    expr: '!calls.exists(c, c.op == "input" && c.node_path.contains("/accept/"))'
  - type: cel_true
    expr: '!calls.exists(c, c.op in ["squash", "merge"])'
  - type: cel_true
    expr: repositories.root.new_commits == 0
