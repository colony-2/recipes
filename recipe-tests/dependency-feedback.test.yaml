recipe: fixtures/dependency-feedback.yaml
cases:
- id: feedback-retains-completed-dependencies
  type: integration_case
  inputs:
    prompt: Integrate child outcomes
    instructions: Coordinate approved work
    target_directory: .
    result_schema_json: '{"type": "object", "required": ["next", "summary"], "properties": {"next": {"enum": ["done",
      "ask_user"]}, "summary": {"type": "string"}}}'
  runtime:
    cells:
      root: {}
      B: {}
      C: {}
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/main#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: agent
        artifacts:
          result.json: '{"summary": "agent outcome 1", "next": "ask_user"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: agent
                turn: 1
          children:
          - recipe: fixtures/dependency-success.yaml
            cell: B
          - recipe: fixtures/dependency-success.yaml
            cell: C
    - match:
        selector: nix:github:colony-2/c2ops/main#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: agent
        artifacts:
          result.json: '{"summary": "agent outcome 2", "next": "done"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: agent
                turn: 2
    - match:
        selector: nix:github:colony-2/c2ops/main#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: agent
        artifacts:
          result.json: '{"next": "done", "summary": "Revised after feedback"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: agent
                turn: 3
    - repeat: true
      match:
        selector: nix:github:colony-2/c2ops/main#rule_gate
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - repeat: true
      match:
        node_path: dependency-success/evidence
        cell: B
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          evidence.txt: Dependency evidence
    - repeat: true
      match:
        node_path: dependency-success/evidence
        cell: C
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          evidence.txt: Dependency evidence
  assertions:
  - type: cel_true
    expr: size(outputs.dependencies) == 2
  - type: cel_true
    expr: outputs.valid == true
  - type: cel_true
    expr: outputs.completed == true
  - type: cel_true
    expr: outputs.dependencies.exists(k,"evidence.txt" in outputs.dependencies[k].artifacts)
  - type: cel_true
    expr: outputs.result.next == "done"
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].inputs.inputs.session
      == calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
  - type: cel_true
    expr: outputs.dependencies.all(k,calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].inputs.inputs.prompt.contains(k))
  - type: cel_true
    expr: outputs.dependencies.all(k, outputs.dependencies[k].artifacts.all(a, "dependencies/"+k+"/"+a in calls.filter(c,c.op
      == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].artifacts))
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].artifacts.all(k,!k.startsWith("dependencies/")
      || calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].artifacts[k].contains("evidence"))
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).size() == 3
  - type: cel_true
    expr: outputs.dependencies == outputs.original_dependencies
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.session
      == calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].outputs.session
  - type: cel_true
    expr: outputs.dependencies.all(k,calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.prompt.contains(k))
  - type: cel_true
    expr: outputs.dependencies.all(k,outputs.dependencies[k].artifacts.all(a,"dependencies/"+k+"/"+a in calls.filter(c,c.op
      == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].artifacts))
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.prompt.contains("Keep
      the completed dependency and revise this cell only")
  - type: cel_true
    expr: calls.filter(c,c.node_path == "dependency-success/evidence").size() == 2
