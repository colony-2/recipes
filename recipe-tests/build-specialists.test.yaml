recipe: fixtures/build-specialists.yaml
cases:
- id: required-pass
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  inputs:
    required: true
  mocks:
    ops:
    - repeat: true
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Security review completed.
            assessment: pass
            files:
            - path: iter1/consultant/security.md
              description: Security findings
        artifacts:
          iter1/consultant/security.md: '# Security findings'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                expert: security
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: passed
    value: true
  - type: cel_true
    expr: size(outputs.flow.specialist_reviews) == 2
  - type: cel_true
    expr: size(calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))) == 2
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution").all(c, c.inputs.inputs.instructions.contains("Inspect tenant
      isolation carefully.") || c.inputs.inputs.prompt.contains("Inspect tenant isolation carefully."))
