recipe: inspection-recovery.yaml
cases:
- id: task-inspection-selects-failed-work-and-applies-it-in-a-fresh-child
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Parent repository
          .c2/recipes/delivery.yaml: |
            id: delivery
            inputs:
              documents: ${{ inputs.documents }}
            sequence:
            - id: handoff
              op: command_execution
              const: true
              artifacts:
                ./: ${{ inputs.documents }}
              inputs:
                run: if grep -q "Use the corrected probe." "$INBOX/handoff.md"; then echo true; else echo false; fi
                env:
                  INBOX: ${{ context.environment.op.inbox }}
            - id: prepare_work
              op: command_execution
              inputs:
                env:
                  CORRECTED: ${{ jq(sequence.handoff.outputs.stdout, 'split("\\n")[0]') }}
                  INBOX: ${{ context.environment.op.inbox }}
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  set -eu
                  test ! -f parent-only.txt
                  test ! -f unfinished-child.txt
                  c2j job log self --json >/dev/null
                  if [ "$CORRECTED" = false ]; then
                    echo unpublished-child-work > unfinished-child.txt
                    echo 'Selected output from the failed attempt.' > "$OUTBOX/useful.md"
                    echo 'Unrelated historical output' > "$OUTBOX/unrelated.md"
                    parent=$(sed 's/.*Parent: //' "$INBOX/handoff.md")
                    export PRODUCER="$parent"
                    python3 - <<'PYCODE'
                  import json, os, pathlib, subprocess, tempfile
                  def call(*args):
                      return subprocess.check_output(['c2j', *args], text=True)
                  parent = os.environ['PRODUCER']
                  log = json.loads(call('job', 'log', parent, '--json'))
                  task = next(t['id'] for t in log['tasks'] if t.get('path', '').endswith('/parent_work'))
                  items = json.loads(call('job', 'artifacts', parent, '--task', task, '--json'))['artifacts']
                  assert any(a['name'] == 'required.md' for a in items)
                  assert any(a['name'] == 'unrelated-parent.md' for a in items)
                  scratch = pathlib.Path(tempfile.mkdtemp())
                  call('job', 'artifact', parent, '--task', task, '--name', 'required.md', '--output', str(scratch/'required.md'))
                  assert (scratch/'required.md').read_text() == 'essential-parent-evidence\n'
                  assert not (scratch/'unrelated-parent.md').exists()
                  assert not (pathlib.Path(os.environ['INBOX'])/'required.md').exists()
                  (pathlib.Path(os.environ['OUTBOX'])/'parent-access.log').write_text('Retrieved selected parent evidence without submission permission.\n')
                  PYCODE
                  else
                    test ! -f "$INBOX/unrelated.md"
                    test -f "$INBOX/useful.md"
                    git apply --3way "$INBOX/changes.patch"
                    test "$(cat unfinished-child.txt)" = unpublished-child-work
                  fi
              artifacts:
                ./: ${{ inputs.documents }}
              perms:
                inherit: true
                jobdb:
                  jobs:
                    submit: false
            - id: probe
              op: command_execution
              inputs:
                env:
                  CORRECTED: ${{ jq(sequence.handoff.outputs.stdout, 'split("\\n")[0]') }}
                run: |
                  if [ "$CORRECTED" = false ]; then echo original-probe-failure >&2; exit 9; fi
                  echo corrected-probe-passed > child-success.txt
            outputs:
              disposition: unchanged
              merged: false
            schema_version: 2
            input_schema:
              prompt:
                type: string
                required: true
              session:
                type: checkpoint
                object_type: c2ops.codex.session/v1
                required: false
              documents:
                type: artifact_map
                default_value: {}
              root_cell:
                type: string
                default_value: ''
              root_ref:
                type: string
                default_value: main
              annotations:
                type: array
                default_value: []
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      required: true
                    ref:
                      type: artifact
                      required: true
                    descriptor:
                      type: object
                    sources:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          ref:
                            type: artifact
      owner:
        files:
          README.md: Serving repository
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.failed.records[0].result.status == "failed" && outputs.failed.records[0].result.terminal
  - type: cel_true
    expr: outputs.completed.records[0].result.status == "completed" &&
      outputs.completed.records[0].result.outputs.disposition == "unchanged"
  - type: cel_true
    expr: outputs.first.records[0].job_id != outputs.replacement.records[0].job_id &&
      outputs.replacement.records[0].replaces == outputs.first.records[0].job_id
  - type: cel_true
    expr: outputs.repeat.records[0].job_id == outputs.replacement.records[0].job_id && size(calls.filter(c,c.op ==
      "recipes.run")) == 2
  - type: cel_true
    expr: size(reviews) == 0 && calls.exists(c,c.node_path.endsWith("/check_parent"))
  - type: cel_true
    expr: outputs.failed.documents.exists(k,k.startsWith("error/children/") && k.endsWith("probe.log"))
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/recover_selected")) && size(calls.filter(c,c.op == "recipes.run"))
      == 2
  inputs:
    target_cell: root
