recipe: ../../build.yaml
cases:
- id: empty-key-blocker-requests-intervention
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
    responses:
    - node_path: build/workflow/adaptive-build/run/adaptive-develop/intervention/sequence/request_intervention/adaptive-review/request_human_review
      fields:
        decision: cancel
        feedback: Runner unavailable; stop this build.
  inputs:
    prompt: Explain why no changes are needed.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            questions: []
            consultations: []
            keys: []
        artifacts:
          test-statements.md: '# Expectations

            - T1 [Critical] [integration] [README.md] [Git] Existing behavior remains available.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: blocked
            summary: Docker is unavailable; a runner owner must supply it.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
            consultations: []
            keys: []
        artifacts:
          implementation.md: '# Outcome

            Already satisfied.'
          test-results.md: '# Results

            T1 passed; existing behavior inspected.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: disposition
    value: cancelled
  - type: cel_true
    expr: size(reviews) == 1 && reviews[0].form.title == "Resolve a specific build blocker"
