recipe: ../../build.yaml
cases:
- id: unexplained-blocker-gets-three-correction-turns
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
    responses: []
  inputs:
    prompt: Explain why no changes are needed.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths:
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior remains
            available."
          handoff.md: "# Execution assignment\nComplete the requested bounded work against test-statements.md. Use settled
            decisions and preserve existing behavior."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: blocked
            summary: Docker is unavailable; a runner owner must supply it.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: blocked
            summary: Docker is unavailable; a runner owner must supply it.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: blocked
            summary: Docker is unavailable; a runner owner must supply it.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: blocked
            summary: Docker is unavailable; a runner owner must supply it.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews)==0
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution" && has(c.inputs.inputs.prompt) &&
      c.inputs.inputs.prompt.contains("This remains the current phase"))) == 3
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/stop_attempt"))
  expect_error: Three correction turns did not resolve the blocker
