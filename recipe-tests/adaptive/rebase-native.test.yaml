recipe: rebase-native.yaml
cases:
- id: clean-restored-candidate-repaired-and-refreshed
  type: integration_case
  runtime:
    cells:
      root:
        files:
          candidate.txt: original
    observe_files:
    - candidate.txt
    - upstream.txt
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.refreshed && outputs.flow.rebase_repairs == 1 && outputs.flow.merge_chases == 2
  - type: cel_true
    expr: outputs.flow.event == "rebase_conflict" && !has(outputs.flow.reviews.outcome) && !has(outputs.flow.verification)
  - type: cel_true
    expr: size(calls.filter(c, c.op == "rebase")) == 3
  - type: cel_true
    expr: calls.exists(c, c.node_path.endsWith("/adopt_recorded_target") && c.op == "rebase")
  - type: cel_true
    expr: '!calls.exists(c, c.op == "command_execution" && c.inputs.run.contains("git rebase"))'
