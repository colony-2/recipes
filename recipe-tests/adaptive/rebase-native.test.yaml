recipe: rebase-native.yaml
cases:
- id: clean-restored-candidate-repaired-and-refreshed
  type: integration_case
  runtime:
    cells:
      root:
        files:
          candidate.txt: original
    observe_files:
    - candidate.txt
    - upstream.txt
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.refreshed && "design.md" in outputs.documents && "test-statements.md" in outputs.documents
  - type: cel_true
    expr: '"error/rebase/conflict.diff" in outputs.documents && "error/rebase/candidate.diff" in outputs.documents'
  - type: cel_true
    expr: size(calls.filter(c, c.op == "rebase")) == 3
  - type: cel_true
    expr: calls.exists(c, c.node_path.endsWith("/adopt_recorded_target") && c.op == "rebase")
  - type: cel_true
    expr: '!calls.exists(c, c.op == "command_execution" && c.inputs.run.contains("git rebase"))'
  - type: cel_true
    expr: '!("old-checks.log" in outputs.documents)'
