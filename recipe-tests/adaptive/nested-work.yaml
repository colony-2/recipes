id: nested-work
sequence:
- id: consult
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    phase: implement
    root_cell: root
    root_ref: main
    consultation_recipe: git+https://github.com/colony-2/recipes.git//recipes/adaptive/consultation.yaml@main
    build_recipe: dependency
    create_recipe: unused
    session: &id001 {}
    documents: &id002 {}
    prefix: advice
    requests:
    - action: consult
      cell: B
      request: Clarify the dependency and agree needed work.
- id: execute
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    phase: implement
    root_cell: root
    root_ref: main
    consultation_recipe: git+https://github.com/colony-2/recipes.git//recipes/adaptive/consultation.yaml@main
    build_recipe: dependency
    create_recipe: unused
    session: *id001
    documents: *id002
    prefix: execute
    requests: ${{ [{'action':'execute','agreement':sequence.consult.outputs.records.filter(r,r.action == 'consult' &&
      r.target.cell == 'C')[0].reference}] }}
    history: ${{ sequence.consult.outputs.records }}
- id: await
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    phase: implement
    root_cell: root
    root_ref: main
    consultation_recipe: git+https://github.com/colony-2/recipes.git//recipes/adaptive/consultation.yaml@main
    build_recipe: dependency
    create_recipe: unused
    session: *id001
    documents: *id002
    prefix: await
    requests: ${{ [{'action':'await','job':sequence.execute.outputs.records[0].job_id}] }}
    history: ${{ sequence.execute.outputs.records }}
outputs:
  consult: ${{ sequence.consult.outputs }}
  execute: ${{ sequence.execute.outputs }}
  result: ${{ sequence.await.outputs }}
