schema_version: 2
id: packages-fixture
input_schema:
  packages:
    type: array
    items:
      type: object
    required: true
inputs:
  packages: ${{ inputs.packages }}
sequence:
- id: packages
  include: ../../recipes/adaptive/packages.yaml
  inputs:
    packages: ${{ inputs.packages }}
    summary: Run the required linter.
    check_recipe: package-check
- id: observe_config
  op: command_execution
  const: true
  inputs:
    run: cat .c2/config.yaml
outputs:
  adopted: ${{ sequence.packages.outputs.adopted }}
  feedback: ${{ sequence.packages.outputs.feedback }}
  goal_id: ${{ sequence.packages.outputs.goal_id }}
  config: ${{ sequence.observe_config.outputs.stdout }}
