recipe: agent-prompt.yaml
cases:
- id: design-prompt-is-a-task
  type: integration_case
  runtime:
    secrets:
      codex_api_key: synthetic
  inputs:
    request: Preserve filters in CSV export
    target_directory: services/orders
    documents:
      build-settings.json:
        kind: value
        name: build-settings.json
        format: json
        value:
          internal: internal-setting-sentinel
    guidance: Preserve CSV API
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Done
            files: []
            questions: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
  assertions:
  - type: cel_true
    expr: calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("Preserve filters in CSV export")
  - type: cel_true
    expr: calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("Preserve CSV API")
  - type: cel_true
    expr: '!calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("internal-setting-sentinel") && !calls.filter(c, c.node_path.endsWith("/start_read_only_session")
      || c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("Workflow inputs:")'
  - type: cel_true
    expr: '!calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("A cell is")'
  - type: cel_true
    expr: calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.instructions.contains("c2j self")
  - type: cel_true
    expr: '!has(calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].artifacts) || !("build-settings.json" in calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].artifacts)'
- id: response-repair-replaces-phase
  type: integration_case
  runtime:
    secrets:
      codex_api_key: synthetic
  inputs:
    phase: implement
    request: Preserve filters in CSV export
    target_directory: services/orders
    documents:
      build-settings.json:
        kind: value
        name: build-settings.json
        format: json
        value:
          internal: internal-setting-sentinel
    assignment: repair
    evidence_documents:
      error/response-corrections.md:
        kind: value
        name: error/response-corrections.md
        format: text
        value: Missing file
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Done
            files: []
            questions: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
  assertions:
  - type: cel_true
    expr: calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("Correct the response") && !calls.filter(c,
      c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("Complete the request")
  - type: cel_true
    expr: '"error/response-corrections.md" in calls.filter(c, c.node_path.endsWith("/start_read_only_session") || c.node_path.endsWith("/start_implementation_session"))[0].artifacts'
- id: missing-evidence-selects-validation-assignment
  type: integration_case
  runtime:
    secrets:
      codex_api_key: synthetic
  inputs:
    phase: implement
    request: Preserve filters in CSV export
    target_directory: services/orders
    documents:
      build-settings.json:
        kind: value
        name: build-settings.json
        format: json
        value:
          internal: internal-setting-sentinel
    assignment: validation
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Done
            files: []
            questions: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("Preserve repository code and formal expectations")
- id: failure-files-need-no-parallel-state
  type: integration_case
  runtime:
    secrets:
      codex_api_key: synthetic
  inputs:
    request: Repair the failed check
    phase: implement
    evidence_documents:
      error/validate_export.log:
        kind: value
        name: error/validate_export.log
        format: text
        value: "Command: validate-export\n[stderr] unexpected filter"
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Done
            files: []
            questions: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("errors in the error directory") &&
      !calls.filter(c,c.node_path.endsWith("/start_implementation_session"))[0].inputs.inputs.prompt.contains("validate_export.log")
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/start_implementation_session"))[0].artifacts["error/validate_export.log"].contains("unexpected filter")
