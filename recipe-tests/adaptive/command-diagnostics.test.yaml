- id: missing-command-diagnostics-preserves-original-failure
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: '[invalid'
  assertions:
  - type: cel_true
    expr: outputs.first.result.status == "failed" && size(outputs.first.artifact_refs) == 0
  - type: cel_true
    expr: outputs.first.result.summary.contains("yaml")
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
