id: child-results-fixture
sequence:
- id: start
  op: recipes.run
  inputs:
    recipes: >-
      ${{ [{'cell_name':context.workspace.cell, 'git':{'base_repo':context.git.repo,
      'base_ref':context.git.ref,'base_hash':context.git.resolved_hash}, 'name':'validate', 'inputs':{} }] }}
- id: consume
  include: ../../recipes/adaptive/child-results.yaml
  inputs:
    jobs: ${{ sequence.start.outputs }}
    allowed: true
- id: read
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.consume.outputs.documents }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: find "$INBOX/results" -type f -exec cat {} \;
outputs:
  results: ${{ sequence.consume.outputs.results }}
  documents: ${{ sequence.consume.outputs.documents }}
  failed: ${{ sequence.consume.outputs.failed }}
  text: ${{ sequence.read.outputs.stdout }}
