recipe: ../../build.yaml
cases:
- id: command-diagnostics-reach-repair-agent
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
          .c2/recipes/hooks/build/verify.yaml: |
            id: diagnostic-hook
            inputs:
              request: ${{ inputs.request }}
            sequence:
            - id: nested
              include: ./checks.yaml
              inputs:
                request: ${{ inputs.request }}
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Command succeeded.
              artifact_refs: {}
          .c2/recipes/hooks/build/checks.yaml: |
            id: nested-checks
            inputs:
              request: ${{ inputs.request }}
            sequence:
            - id: validate
              op: command_execution
              const: true
              inputs:
                run: 'printf ''checking initial tools\n''; printf ''Required tool unavailable:
                  go\n'' >&2; exit 7'
                env:
                  ATTEMPT: ${{ inputs.request }}
    responses:
    - node_path:
        build/workflow/adaptive-build/run/adaptive-develop/accept/sequence/outcome_review/adaptive-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Explain why no changes are needed.
    require_verification: false
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            questions: []
        artifacts:
          test-statements.md: |-
            # Expectations
            - T1 [Critical] [integration] [README.md] [Git] Existing behavior remains available.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: |-
            # Outcome
            Already satisfied.
          test-results.md: |-
            # Results
            T1 passed; existing behavior inspected.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: |-
            # Outcome
            Already satisfied.
          test-results.md: |-
            # Results
            T1 passed; existing behavior inspected.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            .c2/recipes/hooks/build/checks.yaml: |
              id: nested-checks
              inputs:
                request: ${{ inputs.request }}
              sequence:
              - id: validate
                op: command_execution
                const: true
                inputs:
                  run: printf 'checking Docker\n'; printf 'Docker socket unavailable\n' >&2; exit
                    8
                  env:
                    ATTEMPT: ${{ inputs.request }}
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: |-
            # Outcome
            Already satisfied.
          test-results.md: |-
            # Results
            T1 passed; existing behavior inspected.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            .c2/recipes/hooks/build/verify.yaml: |
              id: fixture-verify
              sequence: []
              outputs:
                api_version: c2.build-hook/v1
                status: passed
                summary: Required checks completed.
                artifact_refs: {}
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: |-
            # Review
            Evidence checked.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: |-
            # Review
            Evidence checked.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merged && outputs.verification.status == "passed"
  - type: cel_true
    expr: size(reviews) == 1
  - type: cel_true
    expr: size(calls.filter(c, c.op == "rebase")) == 3
  - type: cel_true
    expr: size(calls.filter(c, c.node_path.endsWith("/resume_implementation_session") && has(c.artifacts) &&
      "error/diagnostics/0/_c2j/execution/validate.log" in c.artifacts)) == 2
  - type: cel_true
    expr: 'calls.filter(c, c.node_path.endsWith("/resume_implementation_session") && has(c.artifacts) && "error/diagnostics/0/_c2j/execution/validate.log"
      in c.artifacts)[0].artifacts["error/diagnostics/0/_c2j/execution/validate.log"].contains("Required tool unavailable:
      go")'
  - type: cel_true
    expr: calls.filter(c, c.node_path.endsWith("/resume_implementation_session") && has(c.artifacts) &&
      "error/diagnostics/0/_c2j/execution/validate.log" in
      c.artifacts)[1].artifacts["error/diagnostics/0/_c2j/execution/validate.log"].contains("Docker socket unavailable")
  - type: cel_true
    expr: calls.filter(c, c.node_path.endsWith("/resume_implementation_session") && has(c.artifacts) &&
      "error/diagnostics/0/_c2j/execution/validate.log" in c.artifacts).all(c, c.inputs.inputs.prompt.contains("error/")
      && !c.inputs.inputs.prompt.contains("Workflow inputs:"))
