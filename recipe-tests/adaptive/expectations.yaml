schema_version: 2
id: expectations-fixture
input_schema:
  baseline:
    type: artifact
    required: false
  proposed:
    type: artifact
    required: false
sequence:
- id: compare
  include: ../../recipes/adaptive/expectations.yaml
  inputs:
    baseline: ${{ inputs.?baseline.orValue(null) }}
    proposed: ${{ inputs.?proposed.orValue(null) }}
outputs:
  changed: ${{ sequence.compare.outputs.changed }}
inputs:
  baseline: ${{ inputs.?baseline.orValue(null) }}
  proposed: ${{ inputs.?proposed.orValue(null) }}
