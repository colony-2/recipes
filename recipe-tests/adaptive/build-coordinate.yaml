schema_version: 2
id: coordination-fixture
version: '1'
input_schema:
  consultation_recipe:
    type: string
    default_value: consultation
inputs:
  consultation_recipe: ${{ inputs.consultation_recipe }}
workspace:
  cell: ${{ context.workflow.cell }}
  ref: ${{ context.git.ref }}
sequence:
- id: seed
  op: command_execution
  inputs:
    run: 'true'
- id: launch
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    requests:
    - kind: feature
      cell: B
      ref: main
      request: Agree a compatible API.
      role: Assess scope and compatibility.
      action: consult
    - kind: feature
      cell: R
      ref: main
      request: Update worker architecture documentation.
      role: Assess existing owners for overlap and document worker boundaries.
      action: consult
    phase: design
    session: ${{ sequence.seed.outputs.session }}
    documents: ${{ {} }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    annotations: ${{ [] }}
    prefix: request-0
    history: []
- id: independent
  op: command_execution
  inputs:
    run: 'true'
- id: await_consultations
  inputs:
    result: ${{ sequence.launch.outputs }}
    session: ${{ sequence.independent.outputs.session }}
  sequence: []
  outputs:
    records: ${{ inputs.result.records }}
    documents: ${{ inputs.result.documents }}
    annotations: ${{ inputs.result.annotations }}
    session: ${{ inputs.session }}
- id: submit
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    session: ${{ sequence.await_consultations.outputs.session }}
    documents: ${{ sequence.await_consultations.outputs.documents }}
    annotations: ${{ sequence.await_consultations.outputs.annotations }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    phase: implement
    prefix: request-1
    requests:
    - action: execute
      agreement: request-0-0
    - action: execute
      agreement: request-0-1
    history: ${{ sequence.launch.outputs.records }}
- id: repeat_submit
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    session: ${{ sequence.submit.outputs.session }}
    documents: ${{ sequence.submit.outputs.documents }}
    annotations: ${{ sequence.submit.outputs.annotations }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    phase: implement
    prefix: request-2
    requests:
    - action: execute
      agreement: request-0-0
    - action: execute
      agreement: request-0-1
    history: ${{ sequence.launch.outputs.records + sequence.submit.outputs.records }}
- id: await_jobs
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    session: ${{ sequence.repeat_submit.outputs.session }}
    documents: ${{ sequence.repeat_submit.outputs.documents }}
    annotations: ${{ sequence.repeat_submit.outputs.annotations }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    phase: implement
    prefix: request-3
    requests: ${{ sequence.submit.outputs.records.map(r,{'action':'await','goal':r.goal_id}) }}
    history: ${{ sequence.launch.outputs.records + sequence.submit.outputs.records + sequence.repeat_submit.outputs.records }}
- id: read_evidence
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.await_jobs.outputs.documents }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      test -f "$INBOX/coordination/request-0-0/iter1/consultant/spec.md"
      test -f "$INBOX/coordination/request-0-1/iter1/consultant/spec.md"
      ! cmp -s "$INBOX/coordination/request-0-0/iter1/consultant/spec.md" "$INBOX/coordination/request-0-1/iter1/consultant/spec.md"
outputs:
  valid: ${{ sequence.await_jobs.outputs.valid }}
  independent_session: ${{ sequence.independent.outputs.session }}
  session: ${{ sequence.await_jobs.outputs.session }}
  documents: ${{ sequence.await_jobs.outputs.documents }}
  annotations: ${{ sequence.await_jobs.outputs.annotations }}
  agreements: ${{ sequence.launch.outputs.records }}
  executions: ${{ sequence.submit.outputs.records }}
  results: ${{ sequence.await_jobs.outputs.records }}
