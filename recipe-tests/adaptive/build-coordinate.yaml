id: coordination-fixture
version: '1'
input_schema:
  consultation_recipe:
    type: string
    default_value: consultation
inputs:
  consultation_recipe: ${{ inputs.consultation_recipe }}
workspace:
  cell: ${{ context.git.repo }}
  ref: ${{ context.git.ref }}
sequence:
- id: seed
  op: command_execution
  inputs:
    run: 'true'
- id: launch
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    action: consult
    requests:
    - key: api
      kind: feature
      cell: B
      ref: main
      request: Agree a compatible API.
      role: Assess scope and compatibility.
    - key: worker
      kind: feature
      cell: R
      ref: main
      request: Update worker architecture documentation.
      role: Assess existing owners for overlap and document worker boundaries.
    phase: design
    session: ${{ sequence.seed.outputs.session }}
    documents: ${{ {} }}
    threads: ${{ {} }}
    jobs: ${{ {} }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    annotations: ${{ [] }}
- id: independent
  op: command_execution
  inputs:
    run: 'true'
- id: await_consultations
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    action: blocked
    keys:
    - api
    - worker
    session: ${{ sequence.independent.outputs.session }}
    documents: ${{ sequence.launch.outputs.documents }}
    annotations: ${{ sequence.launch.outputs.annotations }}
    threads: ${{ sequence.launch.outputs.threads }}
    jobs: ${{ sequence.launch.outputs.jobs }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    phase: design
- id: submit
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    action: submit
    keys:
    - api
    - worker
    session: ${{ sequence.await_consultations.outputs.session }}
    documents: ${{ sequence.await_consultations.outputs.documents }}
    annotations: ${{ sequence.await_consultations.outputs.annotations }}
    threads: ${{ sequence.await_consultations.outputs.threads }}
    jobs: ${{ sequence.await_consultations.outputs.jobs }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    phase: implement
- id: repeat_submit
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    action: submit
    keys:
    - api
    - worker
    session: ${{ sequence.submit.outputs.session }}
    documents: ${{ sequence.submit.outputs.documents }}
    annotations: ${{ sequence.submit.outputs.annotations }}
    threads: ${{ sequence.submit.outputs.threads }}
    jobs: ${{ sequence.submit.outputs.jobs }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    phase: implement
- id: await_jobs
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    action: blocked
    keys:
    - api
    - worker
    session: ${{ sequence.repeat_submit.outputs.session }}
    documents: ${{ sequence.repeat_submit.outputs.documents }}
    annotations: ${{ sequence.repeat_submit.outputs.annotations }}
    threads: ${{ sequence.repeat_submit.outputs.threads }}
    jobs: ${{ sequence.repeat_submit.outputs.jobs }}
    root_cell: R
    root_ref: main
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: dependency
    create_recipe: dependency
    phase: implement
- id: read_evidence
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.await_jobs.outputs.documents }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      test -f "$INBOX/consultations/api/iter1/consultant/spec.md"
      test -f "$INBOX/consultations/worker/iter1/consultant/spec.md"
      ! cmp -s "$INBOX/consultations/api/iter1/consultant/spec.md" "$INBOX/consultations/worker/iter1/consultant/spec.md"
outputs:
  valid: ${{ sequence.await_jobs.outputs.valid }}
  independent_session: ${{ sequence.independent.outputs.session }}
  session: ${{ sequence.await_jobs.outputs.session }}
  documents: ${{ sequence.await_jobs.outputs.documents }}
  annotations: ${{ sequence.await_jobs.outputs.annotations }}
  threads: ${{ sequence.await_jobs.outputs.threads }}
  jobs: ${{ sequence.await_jobs.outputs.jobs }}
