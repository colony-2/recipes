id: foreign-evidence-fixture
sequence:
- id: start
  inputs:
    recipes: ${{ [{'cell_name':context.workspace.cell, 'git':{'base_repo':context.git.repo,'base_ref':context.git.ref,'base_hash':context.git.resolved_hash},
      'name':'evidence', 'inputs':{} }] }}
  op: recipes.run
- id: wait
  inputs:
    return_when: terminal
    target:
      job: ${{ sequence.start.outputs.job_ids[0] }}
    wait:
      condition: complete
      'on': job
  op: recipe.await_result_soft
- id: candidate
  op: command_execution
  const: true
  inputs:
    run: git rev-parse HEAD
- id: check
  include: ../../recipes/adaptive/verify.yaml
  inputs:
    candidate: ${{ jq(sequence.candidate.outputs.stdout, 'rtrimstr("\\n")') }}
    settings:
      kind: value
      name: settings.json
      format: json
      value:
        report: ${{ sequence.wait.outputs.outputs.artifact_refs['tests.log'] }}
- id: read_evidence
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.check.outputs.artifact_refs }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: cat "$INBOX/tests.log" 2>/dev/null || test ! -f "$INBOX/tests.log"
outputs:
  ok: ${{ sequence.check.outputs.ok }}
  allowed: ${{ sequence.check.outputs.allowed }}
  result: ${{ sequence.check.outputs.result }}
  evidence: ${{ sequence.check.outputs.evidence }}
  artifact_refs: ${{ sequence.check.outputs.artifact_refs }}
  review_documents: ${{ sequence.check.outputs.review_documents }}
  log: ${{ sequence.read_evidence.outputs.stdout }}
