schema_version: 2
id: inbox-binding
input_schema:
  read_only:
    type: boolean
    default_value: true
  resume:
    type: boolean
    default_value: false
inputs:
  read_only: ${{ inputs.read_only }}
  resume: ${{ inputs.resume }}
sequence:
- id: session
  op: command_execution
  inputs:
    run: 'true'
- id: agent
  include: ../../recipes/adaptive/agent-turn.yaml
  inputs:
    prompt: Read evidence.json.
    read_only: ${{ inputs.read_only }}
    session: '${{ inputs.resume ? sequence.session.outputs.session : {} }}'
    schema:
      type: object
    documents:
      evidence.json:
        kind: value
        name: evidence.json
        format: text
        value: Reviewer copy
    evidence_documents:
      evidence.json:
        kind: value
        name: evidence.json
        format: text
        value: Original execution evidence
- id: candidate
  include: ../../recipes/adaptive/git-candidate.yaml
  inputs:
    documents:
      evidence.json:
        kind: value
        name: evidence.json
        format: text
        value: Reviewer copy
    evidence_documents:
      evidence.json:
        kind: value
        name: evidence.json
        format: text
        value: Original execution evidence
outputs:
  candidate: ${{ sequence.candidate.outputs.candidate }}
  result: ${{ sequence.agent.outputs.result }}
