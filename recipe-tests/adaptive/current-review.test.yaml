recipe: current-review.yaml
cases:
- id: stale-brief-is-not-reused
  type: integration_case
  inputs: {}
  runtime:
    responses:
    - node_path: current-review/review/adaptive-review/request_human_review
      fields:
        duration: '30'
  assertions:
  - type: cel_true
    expr: reviews[0].form.title == "Choose retention duration" && !("old.log" in reviews[0].form.documents)
  - type: cel_true
    expr: size(reviews[0].form.documents) == 1 && !outputs.brief.contains("STALE") && outputs.brief.contains("How many days")
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
- id: current-brief-cites-evidence
  type: integration_case
  inputs:
    brief:
      kind: value
      name: review.md
      format: text
      value: Current retention decision
  runtime:
    responses:
    - node_path: current-review/review/adaptive-review/request_human_review
      fields:
        duration: '30'
  assertions:
  - type: cel_true
    expr: reviews[0].form.title == "Choose retention duration" && !("old.log" in reviews[0].form.documents)
  - type: cel_true
    expr: size(reviews[0].form.documents) == 2 && outputs.brief == "Current retention decision"
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
