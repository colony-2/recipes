schema_version: 2
id: adaptive-resume-fixture
input_schema:
  direction:
    type: string
    default_value: ''
inputs:
  direction: ${{ inputs.direction }}
sequence:
- id: first
  include: ../../recipes/adaptive/consultation.yaml
  inputs:
    thread: compatibility
    request: Agree the API contract.
    consultant_cell: B
    consultant_role: Own the serving API.
    max_iterations: 2
- id: second
  include: ../../recipes/adaptive/consultation.yaml
  inputs:
    continuation: ${{ sequence.first.outputs.continuation }}
    direction: ${{ inputs.direction }}
    max_iterations: 2
outputs:
  first: ${{ sequence.first.outputs }}
  second: ${{ sequence.second.outputs }}
