schema_version: 2
id: prerequisite-fixture
input_schema:
  dependencies:
    type: object
    default_value: {}
inputs:
  dependencies: ${{ inputs.dependencies }}
sequence:
- id: build
  include: ../../recipes/adaptive/develop.yaml
  inputs:
    prompt: Integrate the serving change.
    target_directory: .
    session: {}
    documents: {}
    root_cell: ''
    root_ref: main
    consultation_recipe: consultation
    build_recipe: build
    create_recipe: create
    design_required: false
    max_iterations: 12
    prior_dependencies: ${{ inputs.dependencies }}
    prior_consultations:
      service:
        request:
          kind: feature
        status: completed
        result:
          outcome: agreed
outputs:
  result: ${{ sequence.build.outputs }}
