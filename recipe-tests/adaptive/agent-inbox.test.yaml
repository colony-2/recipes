recipe: agent-inbox.yaml
cases:
- id: initial-inbox-has-no-workflow-blob
  type: integration_case
  inputs:
    documents:
      design.md:
        kind: value
        name: design.md
        format: text
        value: Design
      build-settings.json:
        kind: value
        name: build-settings.json
        format: json
        value:
          private: setting
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: size(outputs.documents) == 1 && "design.md" in outputs.documents
  - type: cel_true
    expr: size(outputs.evidence) == 0
  runtime: {}
- id: current-log-and-feedback-materialize
  type: integration_case
  inputs:
    documents:
      error/old.log:
        kind: value
        name: old.log
        format: text
        value: old
      assessment.md:
        kind: value
        name: assessment.md
        format: text
        value: A finding
    feedback_documents:
      comments.md:
        kind: value
        name: comments.md
        format: text
        value: Check escaping
    error_summary: Command failed
    errors:
      _c2j/execution/check_export.log:
        kind: value
        name: _c2j/execution/check_export.log
        format: text
        value: "Working directory: . (relative to worktree)\nCommand: test-export\n[stderr] bad filters"
    feedback: Preserve filters
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: '"error/check_export.log" in outputs.evidence'
  - type: cel_true
    expr: '!("error/old.log" in outputs.documents)'
  - type: cel_true
    expr: '"feedback/assessment.md" in outputs.documents && "feedback/human/comments.md" in outputs.documents'
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/read"))[0].artifacts["error/check_export.log"].contains("bad filters")
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/read"))[0].artifacts["feedback/human-answers.md"].contains("Preserve
      filters")
  runtime: {}
- id: required-skip-has-actionable-error
  type: integration_case
  inputs:
    error_summary: |-
      No verify hook
      Verification is required
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: outputs.evidence["error/verification.md"].value.contains("Verification is required")
  runtime: {}
- id: historical-streams-remain-separate
  type: integration_case
  inputs:
    error_summary: Historical failure
    errors:
      _c2j/command/stdout.txt:
        kind: value
        name: stdout.txt
        format: text
        value: out
      _c2j/command/stderr.txt:
        kind: value
        name: stderr.txt
        format: text
        value: err
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: '"error/legacy/stdout.txt" in outputs.evidence && "error/legacy/stderr.txt" in outputs.evidence'
  runtime: {}
- id: repair-inbox-is-not-implementation
  type: integration_case
  inputs:
    error_summary: Missing implementation.md
    error_name: response-corrections.md
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: outputs.evidence["error/response-corrections.md"].value.contains("Missing implementation.md")
  runtime: {}
- id: success-log-is-not-an-error
  type: integration_case
  inputs:
    evidence:
      verification/check.log:
        kind: value
        name: check.log
        format: text
        value: passed
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: '"verification/check.log" in outputs.evidence && !outputs.documents.exists(k,k.startsWith("error/"))'
  runtime: {}
- id: rebase-diagnostics-survive-filtering
  type: integration_case
  inputs:
    errors:
      rebase/conflict.diff:
        kind: value
        name: conflict.diff
        format: text
        value: conflict
    error_summary: Preserve changes and reconcile the adopted target.
    error_name: rebase/recovery.md
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: '"error/rebase/conflict.diff" in outputs.evidence && "error/rebase/recovery.md" in outputs.evidence'
  runtime: {}
- id: preparation-failure-has-current-log
  type: integration_case
  inputs:
    error_summary: Missing build tool
    error_name: preparation.md
    errors:
      prepare/prepare.log:
        kind: value
        name: prepare.log
        format: text
        value: missing build tool
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: '"error/prepare/prepare.log" in outputs.evidence && "error/preparation.md" in outputs.evidence'
  runtime: {}
- id: optional-skip-log-is-not-an-error
  type: integration_case
  inputs:
    evidence:
      verification/check.log:
        kind: value
        name: check.log
        format: text
        value: passed
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: '"verification/check.log" in outputs.evidence && !outputs.documents.exists(k,k.startsWith("error/"))'
  runtime: {}
