recipe: package-adoption-guard.yaml
cases:
- id: changed-parent-config-is-not-overwritten
  type: integration_case
  inputs:
    base: stale
    validated: not-this-config
  runtime:
    cells:
      root:
        files:
          .c2/config.yaml: "packages: []\noperator: concurrent\n"
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: 'outputs.rejected && outputs.config.contains("operator: concurrent")'
