recipe: package-adoption-guard.yaml
cases:
- id: changed-parent-config-is-not-overwritten
  type: integration_case
  inputs:
    base: stale
    validated: 752682c3ed33a74b74200ec98e3c4a36f8bc4f27704f6ad152818aa571dffb64
  runtime:
    cells:
      root:
        files:
          .c2/config.yaml: |
            packages: []
            operator: concurrent
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: 'outputs.rejected && outputs.config.contains("operator: concurrent")'
  - type: cel_true
    expr: outputs.reason.contains("Cell config changed after approval")
- id: different-validated-config-is-not-adopted
  type: integration_case
  inputs:
    base: c9718e48da02cee4fe0384f2f76748075e34bfb7292df3e3bf1000688f39dc7c
    validated: not-this-config
  runtime:
    cells:
      root:
        files:
          .c2/config.yaml: |
            packages: []
            operator: concurrent
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: 'outputs.rejected && outputs.config.contains("operator: concurrent")'
  - type: cel_true
    expr: outputs.reason.contains("Successful goal did not validate this config")
- id: matching-base-and-validation-adopt-exact-candidate
  type: integration_case
  inputs:
    base: c9718e48da02cee4fe0384f2f76748075e34bfb7292df3e3bf1000688f39dc7c
    validated: 752682c3ed33a74b74200ec98e3c4a36f8bc4f27704f6ad152818aa571dffb64
  runtime:
    cells:
      root:
        files:
          .c2/config.yaml: |
            packages: []
            operator: concurrent
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: '!outputs.rejected && outputs.config == "packages: []\noperator: original"'
