recipe: verification.yaml
cases:
- id: pass
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
              target_directory: ${{ inputs.target_directory }}
            sequence:
            - id: run_suite
              op: command_execution
              const: true
              inputs:
                env:
                  TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  cd "$TARGET" || exit 1
                  if (
                  bash ./build.sh
                  ) > "$OUTBOX/tests.log" 2>&1; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.run_suite.outputs.stdout }}
              summary: Fixture repository checks completed.
              artifact_refs: "${{ {'tests.log': sequence.run_suite.artifacts['tests.log']} }}"
          component/build.sh: echo verified
  inputs:
    target_directory: component
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: passed
  - type: output_equals
    path: allowed
    value: true
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.endsWith("/render_hook_report") || c.node_path.endsWith("/check_hook_candidate"))'
  - type: output_equals
    path: log
    value: verified
  - type: cel_true
    expr: '"tests.log" in outputs.artifact_refs && outputs.artifact_refs["tests.log"].name == "tests.log"'
- id: fail
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
