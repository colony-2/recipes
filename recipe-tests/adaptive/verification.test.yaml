              status: passed
              summary: Checks passed but the hook report is invalid.
              artifact_refs:
                tests.log:
                  kind: stored
                  name: tests.log
                  stored:
                    key:
                      jobId: missing-fixture-job
                      taskOrdinal: 0
                      name: tests.log
                      sizeBytes: 123
