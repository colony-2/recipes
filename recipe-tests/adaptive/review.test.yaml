recipe: review.yaml
cases:
- id: annotations-prioritize-current-documents
  type: integration_case
  runtime:
    responses:
    - node_path: review-fixture/review/adaptive-review/request_human_review
      fields:
        decision: accept
  assertions:
  - type: cel_true
    expr: reviews[0].form.overview_document_id == "merge-review.md"
  - type: cel_true
    expr: reviews[0].form.document_metadata["test-statements.md"].role == "primary" && reviews[0].form.document_metadata["test-statements.md"].order
      == 1
  - type: cel_true
    expr: reviews[0].form.document_metadata["extra.md"].title == "Additional evidence"
  - type: cel_true
    expr: reviews[0].form.document_metadata["extra.md"].source_document_ids == ["test-results.md"]
  - type: cel_true
    expr: reviews[0].form.document_metadata["assessment.md"].title == "Independent findings"
  - type: cel_true
    expr: reviews[0].form.document_metadata["test-results.md"].title == "Test outcomes and gaps"
