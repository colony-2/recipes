recipe: validation-goals.yaml
cases:
- id: automatic-validation-child-is-consumed
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/validate.yaml: |
            id: child-validation
            sequence: []
            outputs:
              status: passed
              artifact_refs:
                validation.md:
                  kind: value
                  name: validation.md
                  format: text
                  value: Verified the assigned fixture.
  assertions:
  - type: output_equals
    path: failed
    value: false
  - type: cel_true
    expr: 'outputs.documents.exists(k, k.startsWith("goals/validation-") && k.endsWith("/validation.md"))'
- id: semantic-child-failure-is-not-success
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/validate.yaml: |
            id: child-validation
            sequence: []
            outputs:
              status: failed
              artifact_refs: {}
  assertions:
  - type: output_equals
    path: failed
    value: true
