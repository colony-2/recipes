recipe: failure-export.yaml
cases:
- id: failure-retains-supplied-recovery-document-without-collision
  type: integration_case
  runtime: {}
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.failure.code == "ADAPTIVE_RECOVERY_REQUIRED" && outputs.failure.reason == "Required source publication is unavailable."
  - type: cel_true
    expr: size(reviews) == 0 && calls.exists(c,c.node_path.endsWith("/verify_files"))
