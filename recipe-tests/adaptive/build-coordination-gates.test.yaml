recipe: build-coordinate-gates.yaml
cases:
- id: missing-owner
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Caller
      B:
        files:
          README.md: Registered execution owner
  inputs:
    phase: implement
    root_cell: root
    build_recipe: build
    requests:
    - action: execute
      handoff: work/api/
    documents:
      work/api/handoff.md:
        kind: value
        name: work/api/handoff.md
        format: text
        value: Complete the bounded API change.
  assertions:
  - type: cel_true
    expr: '!outputs.valid && !calls.exists(c,c.op == "recipes.run") && size(reviews)==0'
  - type: cel_true
    expr: size(calls)==0
