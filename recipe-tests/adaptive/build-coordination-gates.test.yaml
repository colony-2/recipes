- id: unknown-dependency-cannot-wait
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Caller
  inputs:
    phase: implement
    root_cell: R
    build_recipe: build
    consultation_recipe: consultation
    history:
    - action: consult
      reference: api
      request:
        kind: feature
        cell: B
        ref: main
        request: Compatible API
        role: API owner
      target:
        cell: B
        ref: main
      result:
        outcome: agreed
    requests:
    - action: await
      job: ''
  assertions:
  - type: output_equals
    path: valid
    value: false
  - type: cel_true
    expr: '!calls.exists(c, c.op == "recipes.run" || c.op == "recipe.await_result_soft")'
- id: unrecorded-job-cannot-be-awaited
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Caller
  inputs:
    phase: implement
    root_cell: R
    build_recipe: build
    consultation_recipe: consultation
    history:
    - action: consult
      reference: api
      request:
        kind: feature
        cell: B
        ref: main
        request: Compatible API
        role: API owner
      target:
        cell: B
        ref: main
      result:
        outcome: agreed
    requests:
    - action: await
      job: unrecorded-job
  assertions:
  - type: cel_true
    expr: '!outputs.valid && !calls.exists(c,c.op=="recipes.run" || c.op=="recipe.await_result_soft")'
