recipe: build-coordinate-gates.yaml
cases:
- id: missing-consultation-cannot-submit
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Caller
  inputs:
    phase: implement
    root_cell: R
    build_recipe: build
    consultation_recipe: consultation
    history: []
    requests:
    - action: execute
      agreement: api
  assertions:
  - type: output_equals
    path: valid
    value: false
  - type: cel_true
    expr: '!calls.exists(c, c.op == "recipes.run" || c.op == "recipe.await_result_soft")'
