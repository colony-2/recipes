recipe: build-coordinate-gates.yaml
cases:
- id: missing-consultation-cannot-submit
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Caller
  inputs:
    action: submit
    keys_json: '["api"]'
    phase: implement
    root_cell: R
    build_recipe: build
    consultation_recipe: consultation
  assertions:
  - type: output_equals
    path: valid
    value: false
  - type: cel_true
    expr: '!calls.exists(c, c.op == "recipes.run" || c.op == "recipe.await_result_soft")'
- id: design-cannot-submit
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Caller
  inputs:
    action: submit
    keys_json: '["api"]'
    threads_json: '{"api": {"request": {"key": "api", "kind": "feature", "cell": "B", "ref": "main", "request": "Compatible
      API", "role": "API owner"}, "status": "completed", "result": {"outcome": "agreed"}}}'
    root_cell: R
    build_recipe: build
    consultation_recipe: consultation
  assertions:
  - type: output_equals
    path: valid
    value: false
  - type: cel_true
    expr: '!calls.exists(c, c.op == "recipes.run" || c.op == "recipe.await_result_soft")'
