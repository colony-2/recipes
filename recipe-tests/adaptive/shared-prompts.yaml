id: shared-prompts-fixture
input_schema:
  request:
    type: string
    default_value: Preserve CSV filters
inputs:
  request: ${{ inputs.request }}
sequence:
- id: prompts
  include: ../../recipes/adaptive/prompts.yaml
  inputs:
    request: ${{ inputs.request }}
    target_directory: services/orders
    phase: design
    guidance: Preserve compatibility.
- id: consume
  op: command_execution
  const: true
  inputs:
    env:
      PROMPT: |-
        {{ sequence.prompts.outputs.agent.task }}

        {{ sequence.prompts.outputs.turn.directories }}
        inbox: {{ context.environment.op.inbox }}
        outbox: {{ context.environment.op.outbox }}
        {{ sequence.prompts.outputs.turn.artifacts }}
      INSTRUCTIONS: |
        {{ sequence.prompts.outputs.turn.instructions }}{{ sequence.prompts.outputs.agent.instructions }}
      INBOX: ${{ context.environment.op.inbox }}
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      set -eu
      printf '%s' "$PROMPT" > "$OUTBOX/prompt.md"
      printf '%s' "$INSTRUCTIONS" > "$OUTBOX/instructions.md"
      cp test-statements.md "$OUTBOX/test-statements.md"
      cp readability-statements.md "$OUTBOX/readability-statements.md"
      printf '%s\n' "$PROMPT"
outputs:
  prompt: ${{ sequence.consume.outputs.stdout }}
  artifact_refs: ${{ sequence.consume.artifacts }}
