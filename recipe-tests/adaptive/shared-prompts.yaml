id: shared-prompts-fixture
input_schema:
  request:
    type: string
    default_value: Preserve CSV filters
inputs:
  request: ${{ inputs.request }}
sequence:
- id: prompts
  include: ../../recipes/adaptive/prompts.yaml
- id: consume
  op: command_execution
  const: true
  inputs:
    env:
      PROMPT: '{{ printf sequence.prompts.outputs.turn.prompt (printf sequence.prompts.outputs.agent.task inputs.request "services/orders" sequence.prompts.outputs.agent.phases.design "Preserve compatibility.") context.environment.op.inbox context.environment.op.outbox }}'
      INSTRUCTIONS: '{{ printf sequence.prompts.outputs.turn.instructions sequence.prompts.outputs.agent.instructions }}'
      INBOX: ${{ context.environment.op.inbox }}
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      set -eu
      printf '%s' "$PROMPT" > "$OUTBOX/prompt.md"
      printf '%s' "$INSTRUCTIONS" > "$OUTBOX/instructions.md"
      cp test-statements.md "$OUTBOX/test-statements.md"
      printf '%s\n' "$PROMPT"
outputs:
  prompt: ${{ sequence.consume.outputs.stdout }}
  artifact_refs: ${{ sequence.consume.artifacts }}
