id: standalone-adaptive
sequence:
- id: start
  op: recipes.run
  inputs:
    recipes: ${{ [{'cell_name':context.workspace.cell, 'git':{'base_repo':context.git.repo,'base_ref':context.git.ref,'base_hash':context.git.resolved_hash},
      'name':'build', 'inputs':{'prompt':'Confirm the existing behavior.'} }] }}
- id: wait
  op: recipe.await_result_soft
  inputs:
    target:
      job: ${{ sequence.start.outputs.job_ids[0] }}
    wait:
      'on': job
      condition: complete
    return_when: terminal
outputs:
  status: ${{ sequence.wait.outputs.status }}
  build: ${{ sequence.wait.outputs.outputs }}
  failure: ${{ sequence.wait.outputs.failure_message }}
