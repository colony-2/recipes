schema_version: 2
id: standalone-adaptive
sequence:
- id: start
  op: recipes.run
  inputs:
    recipes:
    - cell_name: ${{ context.workspace.cell }}
      git:
        base_repo: ${{ context.git.repo }}
        base_ref: ${{ context.git.ref }}
        base_hash: ${{ context.git.resolved_hash }}
      name: build
      inputs:
        prompt: Confirm the existing behavior.
        annotations: ${{ inputs.annotations }}
        documents: ${{ inputs.documents }}
- id: wait
  op: recipe.await_result_soft
  inputs:
    target:
      job: ${{ sequence.start.outputs.job_ids[0] }}
    wait:
      'on': job
      condition: complete
    return_when: terminal
outputs:
  status: ${{ sequence.wait.outputs.status }}
  build: ${{ sequence.wait.outputs.outputs }}
  failure: ${{ sequence.wait.outputs.failure_message }}
input_schema:
  annotations:
    type: array
    default_value: []
    items:
      type: object
      properties:
        id:
          type: string
          required: true
        ref:
          type: artifact
          required: true
        descriptor:
          type: object
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ref:
                type: artifact
  documents:
    type: artifact_map
    default_value: {}
inputs:
  annotations: ${{ inputs.annotations }}
  documents: ${{ inputs.documents }}
