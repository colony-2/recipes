recipe: ../../recipes/adaptive/consultation.yaml
cases:
- id: serving-first-response-agreement
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Client application
          candidate.txt: original
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
    observe_files:
    - candidate.txt
    - experiment.txt
    secrets:
      codex_api_key: synthetic
  inputs:
    thread: validation-api
    request: Provide a compatible validation API.
    consultant_cell: B
    consultant_role: Own the serving API; assess scope and compatibility.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 1: agreed'
            files:
            - path: iter1/consultant/feature-spec.md
              description: Consultation document
        artifacts:
          iter1/consultant/feature-spec.md: '# Accepted feature'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
  assertions:
  - type: cel_true
    expr: '!("state" in outputs) && !("continuation" in outputs) && !("transcript" in outputs)'
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("restore_consultation_transcript") || c.node_path.contains("publish_consultation_transcript"))'
  - type: output_equals
    path: outcome
    value: agreed
  - type: cel_true
    expr: '!calls.exists(c, c.op.startsWith("recipe.run") || c.op == "squashrebasemerge")'
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution" && c.cell == "B")) >= 1
  - type: cel_true
    expr: outputs.consultant_session == calls.filter(c, c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].outputs.session
  - type: cel_true
    expr: outputs.requester_session == outputs.requester_start_session
  - type: cel_true
    expr: '"iter1/consultant/feature-spec.md" in outputs.final_artifacts'
  - type: cel_true
    expr: '!calls.exists(c, c.op == "extension_execution" && c.inputs.selector.contains("rule_gate"))'
  - type: cel_true
    expr: '!calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.output.schema.properties.exists(k,k
      == "assessment")'
