          PURPOSE.md: Client application
          candidate.txt: original
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
    observe_files:
    - candidate.txt
    - experiment.txt
    secrets:
      codex_api_key: synthetic
  inputs:
    thread: validation-api
    request: Provide a compatible validation API.
    consultant_cell: B
    consultant_role: Own the serving API; assess scope and compatibility.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: continue
            thinking: 'consultant reply 1: continue'
            files:
            - path: iter1/consultant/feature-spec.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter1/consultant/feature-spec.md: '# Proposed feature'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: continue
            thinking: 'requester reply 2: continue'
            files:
            - path: iter2/requester/test-statements.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter2/requester/test-statements.md: '# Acceptance outcomes'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: requester
                iteration: 2
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 2: agreed'
            files:
            - path: iter2/consultant/feature-spec.md
              description: Consultation document
            - path: iter2/consultant/test-statements.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter2/consultant/feature-spec.md: '# Accepted feature'
          iter2/consultant/test-statements.md: '# Accepted tests'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 2
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: outcome
    value: agreed
  - type: cel_true
    expr: '!calls.exists(c, c.op.startsWith("recipe.run") || c.op == "squashrebasemerge")'
  - type: output_equals
    path: state.iteration
    value: 2
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.session
      == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
  - type: cel_true
    expr: outputs.requester_session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].outputs.session
  - type: cel_true
    expr: outputs.consultant_session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].outputs.session
  - type: cel_true
    expr: '!("instructions" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs)'
  - type: cel_true
    expr: '"instructions" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs'
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].artifacts["iter1/consultant/feature-spec.md"]
      == "# Proposed feature"
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].artifacts["iter2/requester/test-statements.md"]
      == "# Acceptance outcomes"
  - type: cel_true
    expr: size(outputs.artifacts) == 4
  - type: cel_true
    expr: '!calls.exists(c, c.op == "extension_execution" && c.inputs.selector.contains("rule_gate"))'
  - type: cel_true
    expr: 'calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.instructions.contains("Purpose:
      Provide a compatible validation API.")'
  - type: cel_true
    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("Consultant
      assignment:")'
  - type: cel_true
    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.prompt.contains("Purpose:")'
  - type: cel_true
    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.prompt.contains("iter1/consultant/feature-spec.md")'
  - type: cel_true
    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.prompt.contains("iter2/requester/test-statements.md")
