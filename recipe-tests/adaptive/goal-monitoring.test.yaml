recipe: goal-monitoring.yaml
cases:
- id: successful-goal-replaces-failed-attempt
  type: integration_case
  mocks:
    ops:
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: return
        outputs:
          status: completed
          goal_id: one-goal
          goal_state: SUCCEEDED
          result:
            goal: one-goal
            job: replacement-attempt
          outputs:
            status: passed
            artifact_refs:
              validation.md:
                kind: value
                name: validation.md
                format: text
                value: Validated by the replacement attempt
    - match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: '!outputs.failed && size(calls.filter(c,c.op == "recipe.await_result_soft"))
      == 1 && calls[0].inputs.target.goal == "one-goal" && calls[0].inputs.wait.on
      == "goal" && calls[0].inputs.wait.condition == "success"'
  - type: cel_true
    expr:
      outputs.documents["goals/validation-one-goal/status.md"].value.contains("replacement-attempt")
  - type: output_equals
    path: status_text
    value: "Validation goal: one-goal\nSuccessful attempt: replacement-attempt\nStatus:
      completed\nReported outcome: passed"
  runtime: {}
- id: explicitly-failed-goal-without-outputs-is-blocking
  type: integration_case
  mocks:
    ops:
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: return
        outputs:
          status: failed
          goal_id: one-goal
          goal_state: FAILED
          failure_message: Validation goal was explicitly failed.
          goal_failure:
            terminalJobIds: []
    - match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: failed
    value: true
  - type: cel_true
    expr:
      outputs.documents["goals/validation-one-goal/status.md"].value.contains("explicitly
      failed")
  runtime: {}
