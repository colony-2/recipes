schema_version: 2
id: current-review
input_schema:
  brief:
    type: artifact
    required: false
inputs:
  brief: ${{ inputs.?brief.orValue(null) }}
sequence:
- id: review
  include: ../../recipes/adaptive/review.yaml
  inputs:
    title: Choose retention duration
    overview: review.md
    brief: ${{ inputs.brief }}
    summary: The retention policy has not been decided.
    documents:
      review.md:
        kind: value
        name: review.md
        format: text
        value: 'STALE: approve unrelated merge'
      old.log:
        kind: value
        name: old.log
        format: text
        value: unrelated history
      retention.md:
        kind: value
        name: retention.md
        format: text
        value: Current retention evidence
    annotations:
    - id: review.md
      ref:
        kind: value
        name: review.md
        format: text
        value: Current retention decision
      sources:
      - id: retention.md
        ref:
          kind: value
          name: retention.md
          format: text
          value: Current retention evidence
      - requested: superseded.md
        issue: missing
    fields:
    - id: duration
      type: short_answer
      question: How many days should records be retained?
      required: true
- id: read
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.review.outputs.documents }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: cat "$INBOX/review.md"
outputs:
  response: ${{ sequence.review.outputs.response }}
  brief: ${{ sequence.read.outputs.stdout }}
