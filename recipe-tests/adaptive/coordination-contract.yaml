schema_version: 2
id: coordination-contract
input_schema:
  requests:
    type: array
    items:
      type: object
    required: true
  history:
    type: array
    items:
      type: object
    default_value: []
  phase:
    type: string
    default_value: implement
  documents:
    type: artifact_map
    default_value: {}
inputs:
  requests: ${{ inputs.requests }}
  history: ${{ inputs.history }}
  phase: ${{ inputs.phase }}
  documents: ${{ inputs.documents }}
sequence:
- id: coordinate
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    requests: ${{ inputs.requests }}
    history: ${{ inputs.history }}
    phase: ${{ inputs.phase }}
    root_cell: root
    root_ref: main
    consultation_recipe: consultation
    build_recipe: build
    create_recipe: create
    session: {}
    documents: ${{ inputs.documents }}
    annotations: []
    prefix: request-1
outputs:
  result: ${{ sequence.coordinate.outputs }}
