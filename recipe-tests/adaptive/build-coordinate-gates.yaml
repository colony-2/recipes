id: coordination-gates
version: '1'
input_schema:
  action:
    type: string
    required: true
  requests_json:
    type: string
    default_value: '[]'
  keys_json:
    type: string
    default_value: '[]'
  arguments_json:
    type: string
    required: true
inputs:
  action: ${{ inputs.action }}
  requests_json: ${{ inputs.requests_json }}
  keys_json: ${{ inputs.keys_json }}
  arguments_json: ${{ inputs.arguments_json }}
sequence:
- id: coordinate
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    action: ${{ inputs.action }}
    requests: ${{ json_parse(inputs.requests_json) }}
    keys: ${{ json_parse(inputs.keys_json) }}
    phase: ${{ json_parse(inputs.arguments_json).?phase.orValue('design') }}
    session: ${{ json_parse(inputs.arguments_json).?session.orValue({}) }}
    documents: ${{ json_parse(inputs.arguments_json).?documents.orValue({}) }}
    annotations: ${{ json_parse(inputs.arguments_json).?annotations.orValue([]) }}
    threads: ${{ json_parse(inputs.arguments_json).?threads.orValue({}) }}
    jobs: ${{ json_parse(inputs.arguments_json).?jobs.orValue({}) }}
    root_cell: ${{ json_parse(inputs.arguments_json).?root_cell.orValue('') }}
    root_ref: ${{ json_parse(inputs.arguments_json).?root_ref.orValue('main') }}
    consultation_recipe: ${{ json_parse(inputs.arguments_json).?consultation_recipe.orValue('') }}
    build_recipe: ${{ json_parse(inputs.arguments_json).?build_recipe.orValue('') }}
    create_recipe: ${{ json_parse(inputs.arguments_json).?create_recipe.orValue('') }}
outputs:
  valid: ${{ sequence.coordinate.outputs.valid }}
  session: ${{ sequence.coordinate.outputs.session }}
  documents: ${{ sequence.coordinate.outputs.documents }}
  annotations: ${{ sequence.coordinate.outputs.annotations }}
  threads: ${{ sequence.coordinate.outputs.threads }}
  jobs: ${{ sequence.coordinate.outputs.jobs }}
