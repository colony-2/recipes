id: coordination-gates
version: '1'
input_schema:
  action:
    type: string
    required: true
  requests_json:
    type: string
    default_value: '[]'
  keys_json:
    type: string
    default_value: '[]'
  phase:
    type: string
    default_value: design
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  annotations_json:
    type: string
    default_value: '[]'
  threads_json:
    type: string
    default_value: '{}'
  jobs_json:
    type: string
    default_value: '{}'
  root_cell:
    type: string
    default_value: ''
  root_ref:
    type: string
    default_value: main
  consultation_recipe:
    type: string
    default_value: ''
  build_recipe:
    type: string
    default_value: ''
  create_recipe:
    type: string
    default_value: ''
inputs:
  action: ${{ inputs.action }}
  requests_json: ${{ inputs.requests_json }}
  keys_json: ${{ inputs.keys_json }}
  phase: ${{ inputs.phase }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  annotations_json: ${{ inputs.annotations_json }}
  threads_json: ${{ inputs.threads_json }}
  jobs_json: ${{ inputs.jobs_json }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
sequence:
- id: coordinate
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    action: ${{ inputs.action }}
    requests: ${{ json_parse(inputs.requests_json) }}
    keys: ${{ json_parse(inputs.keys_json) }}
    phase: ${{ inputs.phase }}
    session: ${{ inputs.session }}
    documents: ${{ inputs.documents }}
    annotations: ${{ json_parse(inputs.annotations_json) }}
    threads: ${{ json_parse(inputs.threads_json) }}
    jobs: ${{ json_parse(inputs.jobs_json) }}
    root_cell: ${{ inputs.root_cell }}
    root_ref: ${{ inputs.root_ref }}
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: ${{ inputs.build_recipe }}
    create_recipe: ${{ inputs.create_recipe }}
outputs:
  valid: ${{ sequence.coordinate.outputs.valid }}
  session: ${{ sequence.coordinate.outputs.session }}
  documents: ${{ sequence.coordinate.outputs.documents }}
  annotations: ${{ sequence.coordinate.outputs.annotations }}
  threads: ${{ sequence.coordinate.outputs.threads }}
  jobs: ${{ sequence.coordinate.outputs.jobs }}
