schema_version: 2
id: coordination-gates
version: '1'
input_schema:
  phase:
    type: string
    default_value: design
  session:
    type: checkpoint
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
    default_value: ''
  root_ref:
    type: string
    default_value: main
  consultation_recipe:
    type: string
    default_value: ''
  build_recipe:
    type: string
    default_value: ''
  create_recipe:
    type: string
    default_value: ''
  requests:
    type: array
    default_value: []
    items:
      type: object
  annotations:
    type: array
    default_value: []
    items:
      type: object
      properties:
        id:
          type: string
          required: true
        ref:
          type: artifact
          required: true
        descriptor:
          type: object
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ref:
                type: artifact
  history:
    type: array
    items:
      type: object
    default_value: []
inputs:
  requests: ${{ inputs.requests }}
  phase: ${{ inputs.phase }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  annotations: ${{ inputs.annotations }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
  consultation_recipe: ${{ inputs.consultation_recipe }}
  build_recipe: ${{ inputs.build_recipe }}
  create_recipe: ${{ inputs.create_recipe }}
  history: ${{ inputs.history }}
sequence:
- id: coordinate
  include: ../../recipes/adaptive/coordinate.yaml
  inputs:
    requests: ${{ inputs.requests }}
    phase: ${{ inputs.phase }}
    session: ${{ inputs.session }}
    documents: ${{ inputs.documents }}
    annotations: ${{ inputs.annotations }}
    root_cell: ${{ inputs.root_cell }}
    root_ref: ${{ inputs.root_ref }}
    consultation_recipe: ${{ inputs.consultation_recipe }}
    build_recipe: ${{ inputs.build_recipe }}
    create_recipe: ${{ inputs.create_recipe }}
    history: ${{ inputs.history }}
    prefix: request-1
outputs:
  valid: ${{ sequence.coordinate.outputs.valid }}
  session: ${{ sequence.coordinate.outputs.session }}
  documents: ${{ sequence.coordinate.outputs.documents }}
  annotations: ${{ sequence.coordinate.outputs.annotations }}
  records: ${{ sequence.coordinate.outputs.records }}
