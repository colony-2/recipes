recipe: child-results.yaml
cases:
- id: automatic-validation-child-is-consumed
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/validate.yaml: |
            id: child-validation
            sequence: []
            outputs:
              status: passed
              artifact_refs:
                validation.md:
                  kind: value
                  name: validation.md
                  format: text
                  value: Verified the assigned fixture.
  assertions:
  - type: output_equals
    path: failed
    value: false
  - type: cel_true
    expr: 'outputs.documents.exists(k, k.startsWith("results/") && k.endsWith("/validation.md"))'
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
- id: semantic-child-failure-is-not-success
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/validate.yaml: |
            id: child-validation
            sequence: []
            outputs:
              status: failed
              artifact_refs: {}
  assertions:
  - type: output_equals
    path: failed
    value: true
  - type: cel_true
    expr: 'outputs.text.contains("Assignment outcome: failed")'
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
- id: child-status-file-cannot-be-overwritten-by-summary
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/validate.yaml: |
            id: child-validation
            sequence: []
            outputs:
              status: passed
              artifact_refs:
                status.md:
                  kind: value
                  name: status.md
                  format: text
                  value: Original producer evidence.
  assertions:
  - type: cel_true
    expr: '!outputs.failed && outputs.text.contains("Original producer evidence.") && outputs.text.contains("Child job:")'
  - type: cel_true
    expr: outputs.documents.all(k,outputs.documents[k].name == k)
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
