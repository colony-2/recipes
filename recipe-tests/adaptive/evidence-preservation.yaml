id: evidence-preservation
sequence:
- id: collect
  include: ../../recipes/adaptive/error-documents.yaml
  inputs:
    summary: Generated summary
    artifacts: ${{ inputs.artifacts }}
    failure: ${{ inputs.failure }}
- id: read
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.collect.outputs.documents }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: find "$INBOX" -type f -exec cat {} \;
outputs:
  documents: ${{ sequence.collect.outputs.documents }}
  text: ${{ sequence.read.outputs.stdout }}
schema_version: 2
input_schema:
  artifacts:
    type: artifact_map
    default_value: {}
  failure:
    type: object
    default_value: {}
inputs:
  artifacts: ${{ inputs.artifacts }}
  failure: ${{ inputs.failure }}
