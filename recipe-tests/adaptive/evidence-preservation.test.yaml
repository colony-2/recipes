recipe: evidence-preservation.yaml
cases:
- id: all-distinct-source-paths-survive
  type: integration_case
  inputs:
    artifacts:
      failure.md:
        kind: value
        name: failure.md
        format: text
        value: Original failure
      _c2j/execution/check.log:
        kind: value
        name: _c2j/execution/check.log
        format: text
        value: Runner log
      check.log:
        kind: value
        name: check.log
        format: text
        value: Hook log
      summary/failure.md:
        kind: value
        name: summary/failure.md
        format: text
        value: Summary-like file
      error/failure.md:
        kind: value
        name: error/failure.md
        format: text
        value: Prefixed file
  runtime: {}
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(outputs.documents) == 6
  - type: cel_true
    expr: outputs.text.contains("Generated summary")
  - type: cel_true
    expr: outputs.text.contains("Original failure")
  - type: cel_true
    expr: outputs.text.contains("Runner log")
  - type: cel_true
    expr: outputs.text.contains("Hook log")
  - type: cel_true
    expr: outputs.text.contains("Summary-like file")
  - type: cel_true
    expr: outputs.text.contains("Prefixed file")
- id: same-named-diagnostics-in-distinct-causes-survive
  type: integration_case
  inputs:
    artifacts:
      failure.md:
        kind: value
        name: failure.md
        format: text
        value: Original failure
      _c2j/execution/check.log:
        kind: value
        name: _c2j/execution/check.log
        format: text
        value: Runner log
      check.log:
        kind: value
        name: check.log
        format: text
        value: Hook log
      summary/failure.md:
        kind: value
        name: summary/failure.md
        format: text
        value: Summary-like file
      error/failure.md:
        kind: value
        name: error/failure.md
        format: text
        value: Prefixed file
    failure:
      attrs:
        command:
          diagnostics:
            check.log:
              kind: value
              name: check.log
              format: text
              value: Outer diagnostic
      cause:
        attrs:
          command:
            diagnostics:
              check.log:
                kind: value
                name: check.log
                format: text
                value: Inner diagnostic
  runtime: {}
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(outputs.documents) == 8
  - type: cel_true
    expr: outputs.text.contains("Generated summary")
  - type: cel_true
    expr: outputs.text.contains("Original failure")
  - type: cel_true
    expr: outputs.text.contains("Runner log")
  - type: cel_true
    expr: outputs.text.contains("Hook log")
  - type: cel_true
    expr: outputs.text.contains("Summary-like file")
  - type: cel_true
    expr: outputs.text.contains("Prefixed file")
  - type: cel_true
    expr: outputs.text.contains("Outer diagnostic") && outputs.text.contains("Inner diagnostic")
