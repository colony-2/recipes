        op: recipes.run
      behavior:
        mode: return
        outputs:
          job_ids:
          - build-attempt
    - match:
        op: recipes.run
      behavior:
        mode: return
        outputs:
          job_ids:
          - replacement-attempt
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: return
        outputs:
          job_id: build-attempt
          status: failed
          terminal: true
          goal_state: OPEN
          failure_message: Probe failed
          outputs: {}
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: return
        outputs:
          job_id: build-attempt
          status: failed
          terminal: true
          goal_state: OPEN
          failure_message: Probe failed
          outputs: {}
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: return
        outputs:
          job_id: replacement-attempt
          status: completed
          terminal: true
          goal_state: OPEN
          failure_message: ''
          outputs:
            disposition: unchanged
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews)==1 && outputs.disposition == "unchanged"
  - type: cel_true
    expr: size(calls.filter(c,c.op == "recipes.run")) == 2
  - type: cel_true
    expr: outputs.coordination.exists(r,r.action == "await" && r.result.status == "failed") &&
      outputs.coordination.exists(r,r.action == "await" && r.result.status == "completed")
  - type: cel_true
    expr: outputs.coordination.exists(r,r.action == "execute" && r.replaces != "")
  - type: cel_true
    expr: calls.exists(c,c.op == "extension_execution" && has(c.inputs.inputs.prompt) &&
      c.inputs.inputs.prompt.contains("Inspect the failed child"))
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.endsWith("/stop_attempt"))'
