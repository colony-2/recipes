- id: parent-recovers-failed-child-before-outcome-review
  type: integration_case
  runtime:
    cell: gitvend
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      gitvend:
        files:
          README.md: A bounded application.
          .c2/recipes/delivery.yaml: |
            id: delivery
            inputs:
              corrected: ${{ inputs.prompt.contains('Use the corrected probe.') }}
            sequence:
            - id: prepare_work
              op: command_execution
              inputs:
                env:
                  CORRECTED: ${{ string(inputs.corrected) }}
                run: |
                  set -eu
                  test ! -f parent-only.txt
                  test ! -f unfinished-child.txt
                  if [ "$CORRECTED" = false ]; then echo unpublished-child-work > unfinished-child.txt; fi
            - id: probe
              op: command_execution
              inputs:
                env:
                  CORRECTED: ${{ string(inputs.corrected) }}
                run: |
                  if [ "$CORRECTED" = false ]; then echo original-probe-failure >&2; exit 9; fi
                  echo corrected-probe-passed > child-success.txt
            outputs:
              disposition: unchanged
              merged: false
            schema_version: 2
            input_schema:
              prompt:
                type: string
                required: true
              session:
                type: checkpoint
                object_type: c2ops.codex.session/v1
                required: false
              documents:
                type: artifact_map
                default_value: {}
              root_cell:
                type: string
                default_value: ''
              root_ref:
                type: string
                default_value: main
              annotations:
                type: array
                default_value: []
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      required: true
                    ref:
                      type: artifact
                      required: true
                    descriptor:
                      type: object
                    sources:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          ref:
                            type: artifact
      owner:
        files:
          README.md: API owner
    responses:
    - node_path:
        build/workflow/adaptive-build/run/adaptive-develop/accept/sequence/outcome_review/adaptive-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Explain why no changes are needed.
    title: Preserve 100% of behavior — title
    build_recipe: delivery
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
