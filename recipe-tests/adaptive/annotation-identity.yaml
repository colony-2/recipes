schema_version: 2
id: annotation-identity-fixture
input_schema:
  current_content:
    type: string
    default_value: Accepted report
inputs:
  current_content: ${{ inputs.current_content }}
sequence:
- id: annotate
  include: ../../recipes/adaptive/artifact-annotations.yaml
  inputs:
    result:
      response:
        files:
        - path: report.md
          title: Accepted evidence
          source_paths:
          - inbox/input.md
          - detail.md
          - missing.md
          - ../outside.md
          - false
        - path: never-produced.md
          title: Must not be annotated
        - path: 12
    artifacts:
      report.md:
        kind: value
        name: report.md
        format: text
        value: Accepted report
    bound_inputs:
      input.md:
        kind: value
        name: input.md
        format: text
        value: Source evidence
      first/detail.md:
        kind: value
        name: first/detail.md
        format: text
        value: First detail
      second/detail.md:
        kind: value
        name: second/detail.md
        format: text
        value: Second detail
- id: child
  include: ../../recipes/adaptive/document-bindings.yaml
  inputs:
    prefix: child/
    documents:
      report.md:
        kind: value
        name: report.md
        format: text
        value: ${{ inputs.current_content }}
    annotations: ${{ sequence.annotate.outputs.annotations }}
- id: parent
  include: ../../recipes/adaptive/document-bindings.yaml
  inputs:
    prefix: jobs/acceptance/
    documents: ${{ sequence.child.outputs.documents }}
    annotations: ${{ sequence.child.outputs.annotations }}
outputs:
  original: ${{ sequence.annotate.outputs.annotations }}
  annotations: ${{ sequence.parent.outputs.annotations }}
  documents: ${{ sequence.parent.outputs.documents }}
