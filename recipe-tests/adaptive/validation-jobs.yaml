id: validation-jobs-fixture
sequence:
- id: start
  op: recipes.run
  inputs:
    recipes: >-
      ${{ [{'cell_name':context.workspace.cell, 'git':{'base_repo':context.git.repo,
      'base_ref':context.git.ref,'base_hash':context.git.resolved_hash}, 'name':'validate', 'inputs':{} }] }}
- id: consume
  include: ../../recipes/adaptive/validation-jobs.yaml
  inputs:
    jobs: ${{ sequence.start.outputs }}
    allowed: true
outputs:
  documents: ${{ sequence.consume.outputs.documents }}
  failed: ${{ sequence.consume.outputs.failed }}
