recipe: artifact-selection.yaml
cases:
- id: many-incidental-files
  type: integration_case
  inputs:
    path: report.md
  runtime:
    cells:
      root:
        file_sources:
          artifact-selection-statements.md: artifact-selection-statements.md
    responses:
    - node_path: artifact-selection-fixture/review/adaptive-response-repair/decision/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: stop
  mocks:
    ops:
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          errorMessage: Explanation unavailable
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: size(outputs.selected) == 2 && size(outputs.repaired) == 1 && outputs.same_identity
  - type: cel_true
    expr: outputs.contents == "Retained on the producerSelected detail"
  - type: cel_true
    expr: size(outputs.issues) == 0
  - type: cel_true
    expr: size(reviews)==1 && outputs.recovery_code=="ADAPTIVE_STOPPED_BY_USER"
- id: missing-deliverable
  type: integration_case
  inputs:
    path: missing.md
  runtime:
    cells:
      root:
        file_sources:
          artifact-selection-statements.md: artifact-selection-statements.md
    responses:
    - node_path: artifact-selection-fixture/review/adaptive-response-repair/decision/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: stop
  mocks:
    ops:
    - *id001
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: size(outputs.selected) == 1 && size(outputs.repaired) == 1 && outputs.same_identity
  - type: cel_true
    expr: outputs.contents == "Retained on the producerSelected detail"
  - type: cel_true
    expr: size(outputs.issues) == 1
  - type: cel_true
    expr: size(reviews)==1 && outputs.recovery_code=="ADAPTIVE_STOPPED_BY_USER"
- id: ambiguous-deliverable
  type: integration_case
  inputs:
    path: ambiguous.md
  runtime:
    cells:
      root:
        file_sources:
          artifact-selection-statements.md: artifact-selection-statements.md
    responses:
    - node_path: artifact-selection-fixture/review/adaptive-response-repair/decision/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: stop
  mocks:
    ops:
    - *id001
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: size(outputs.selected) == 1 && size(outputs.repaired) == 1 && outputs.same_identity
  - type: cel_true
    expr: outputs.contents == "Retained on the producerSelected detail"
  - type: cel_true
    expr: size(outputs.issues) == 1
  - type: cel_true
    expr: size(reviews)==1 && outputs.recovery_code=="ADAPTIVE_STOPPED_BY_USER"
