recipe: review-self-source.yaml
cases:
- id: revised-document-can-request-direction
  type: integration_case
  runtime:
    responses:
    - node_path: review-self-source/ask/adaptive-review/request_human_review
      fields:
        acceptance_executor: Use the configured Docker runner.
  assertions:
  - type: cel_true
    expr: outputs.response.fields.acceptance_executor == "Use the configured Docker runner."
  - type: cel_true
    expr: reviews[0].form.document_metadata["environment-check.log"].source_document_ids == ["test-results.md"]
  - type: cel_true
    expr: reviews[0].form.document_metadata["environment-check.log"].title == "Docker failure evidence"
- id: reused-document-can-request-direction
  type: integration_case
  inputs:
    log: Previous Docker failure
  runtime:
    responses:
    - node_path: review-self-source/ask/adaptive-review/request_human_review
      fields:
        acceptance_executor: Use the configured Docker runner.
  assertions:
  - type: cel_true
    expr: outputs.response.fields.acceptance_executor == "Use the configured Docker runner."
  - type: cel_true
    expr: reviews[0].form.document_metadata["environment-check.log"].source_document_ids == ["test-results.md"]
