id: review-fixture
sequence:
- id: review
  include: ../../recipes/adaptive/review.yaml
  inputs:
    title: Outcome
    documents:
      merge-review.md: &id004
        kind: value
        name: merge-review.md
        format: text
        value: merge-review.md
      test-statements.md: &id003
        kind: value
        name: test-statements.md
        format: text
        value: test-statements.md
      test-results.md: &id002
        kind: value
        name: test-results.md
        format: text
        value: test-results.md
      assessment.md:
        kind: value
        name: assessment.md
        format: text
        value: assessment.md
      extra.md: &id001
        kind: value
        name: extra.md
        format: text
        value: extra.md
    annotations:
    - id: extra.md
      ref: *id001
      descriptor:
        title: Additional evidence
        role: supporting
        order: 9
        description: Relevant trace
      sources:
      - id: extra.md
        ref: *id001
      - id: test-results.md
        ref: *id002
    - id: test-statements.md
      ref: *id003
      descriptor:
        role: diagnostic
        order: 900
        title: Business expectations
    - id: assessment.md
      ref:
        kind: value
        name: assessment.md
        format: text
        value: STALE
      descriptor:
        title: Wrong revision
    - id: test-results.md
      ref: *id002
      descriptor:
        title: "bad\ntitle"
        role: bad
        order: -1
        description: false
    fields:
    - id: decision
      type: multiple_choice
      question: Approve?
      required: true
      options:
      - value: accept
        label: Accept
    overview: merge-review.md
    brief: *id004
    required_documents:
    - test-statements.md
    - test-results.md
    - assessment.md
    - extra.md
outputs:
  response: ${{ sequence.review.outputs.response }}
