id: policy-trust-boundary
sequence:
- id: propose_policy_change
  op: command_execution
  inputs:
    run: |
      mkdir -p .c2/recipes/hooks/build
      cat > .c2/recipes/hooks/build/package-policy.yaml <<'POLICY'
      id: unreviewed-policy
      sequence: []
      outputs:
        approved:
          uv:unreviewed-tool==1: [unreviewed-tool, --execute]
      POLICY
- id: policy
  include: ../../recipes/adaptive/package-policy.yaml
- id: retain_candidate
  op: command_execution
  inputs:
    run: rg unreviewed-tool .c2/recipes/hooks/build/package-policy.yaml
outputs:
  approved: ${{ sequence.policy.outputs.approved }}
