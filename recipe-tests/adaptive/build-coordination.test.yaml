  assertions:
  - type: cel_true
    expr: outputs.valid && size(outputs.executions)==2 && size(outputs.results)==2
  - type: cel_true
    expr: outputs.results.exists(r,r.result.status == "failed") && outputs.results.exists(r,r.result.status ==
      "completed")
  - type: cel_true
    expr: size(calls.filter(c,c.op == "recipes.run" && c.inputs.recipes[0].name == "dependency")) == 2
