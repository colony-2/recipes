recipe: build-coordinate.yaml
cases:
- id: parallel-consultations-and-checkpoint-handoff
  type: integration_case
  runtime:
    cells:
      root:
        files:
          candidate.txt: original
        file_sources:
          .c2/recipes: ../../recipes/adaptive
          .c2/recipes/dependency.yaml: ../fixtures/build-dependency.yaml
      B:
        files:
          PURPOSE.md: API owner
      R:
        files:
          PURPOSE.md: Project root
    observe_files:
    - candidate.txt
  mocks:
    ops:
    - match:
        node_path: coordination-fixture/seed
      behavior:
        mode: return
        outputs:
          success: true
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: seed
          worktree:
            candidate.txt: unmerged requester work
    - match:
        node_path: coordination-fixture/independent
      behavior:
        mode: return
        outputs:
          success: true
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: independent
          worktree:
            candidate.txt: later independent work
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 1: agreed'
            files:
            - path: iter1/consultant/spec.md
              description: Consultation document
        artifacts:
          iter1/consultant/spec.md: '# Agreed API'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: R
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 1: agreed'
            files:
            - path: iter1/consultant/spec.md
              description: Consultation document
        artifacts:
          iter1/consultant/spec.md: '# Worker purpose, alternatives, and technology guidance'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: valid
    value: true
  - type: cel_true
    expr: size(outputs.agreements) == 2
  - type: cel_true
    expr: size(outputs.executions) == 2
  - type: cel_true
    expr: outputs.session == outputs.independent_session
  - type: cel_true
    expr: outputs.results[0].result.outputs.starter == {}
  - type: cel_true
    expr: outputs.results[1].result.outputs.starter == {}
  - type: cel_true
    expr: '"consultation/conversation.json" in outputs.results[0].result.outputs.documents'
  - type: cel_true
    expr: outputs.agreements[1].request.cell == "R"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "recipes.run")) == 4
  - type: cel_true
    expr: repositories.root.new_commits == 0
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).filter(c, c.cell == "R")[0].inputs.inputs.instructions.contains("existing owners for overlap")
  - type: cel_true
    expr: '"coordination/request-0-0/iter1/consultant/spec.md" in outputs.documents && "coordination/request-0-1/iter1/consultant/spec.md" in outputs.documents'
  - type: cel_true
    expr: outputs.documents["coordination/request-0-0/iter1/consultant/spec.md"].stored == outputs.agreements[0].result.final_artifacts["iter1/consultant/spec.md"].stored
  - type: cel_true
    expr: outputs.results[0].result.status in ["completed","failed"] && outputs.results[1].result.status=="completed"
