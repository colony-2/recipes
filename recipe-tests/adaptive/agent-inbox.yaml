id: agent-inbox-fixture
inputs:
  arguments: ${{ json_parse(inputs.data_json) }}
sequence:
- id: errors
  include: ../../recipes/adaptive/error-documents.yaml
  inputs:
    summary: ${{ inputs.arguments.?error_summary.orValue('') }}
    name: ${{ inputs.arguments.?error_name.orValue('verification.md') }}
    artifacts: ${{ inputs.arguments.?errors.orValue({}) }}
- id: feedback
  include: ../../recipes/adaptive/feedback-documents.yaml
  inputs:
    fields: ${{ inputs.arguments.?feedback.orValue({}) }}
    documents: ${{ inputs.arguments.?feedback_documents.orValue({}) }}
- id: files
  include: ../../recipes/adaptive/task-documents.yaml
  inputs:
    documents: ${{ jq([inputs.arguments.documents,sequence.feedback.outputs.documents], 'add') }}
    evidence: '${{ inputs.arguments.?error_summary.orValue('''') != '''' ? sequence.errors.outputs.documents : inputs.arguments.evidence
      }}'
- id: read
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.files.outputs.documents }}
    .: ${{ sequence.files.outputs.evidence }}
  inputs:
    run: find "$INBOX" -type f -print | sort
    env:
      INBOX: ${{ context.environment.op.inbox }}
outputs:
  documents: ${{ sequence.files.outputs.documents }}
  evidence: ${{ sequence.files.outputs.evidence }}
input_schema:
  data_json:
    type: string
    default_value: '{}'
