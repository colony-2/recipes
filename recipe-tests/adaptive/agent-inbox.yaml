id: agent-inbox-fixture
inputs:
  flow: ${{ json_parse(inputs.data_json).flow }}
  documents: ${{ json_parse(inputs.data_json).documents }}
  evidence: ${{ json_parse(inputs.data_json).evidence }}
sequence:
- id: files
  include: ../../recipes/adaptive/task-documents.yaml
  inputs:
    flow: ${{ inputs.flow }}
    documents: ${{ inputs.documents }}
    evidence: ${{ inputs.evidence }}
- id: read
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.files.outputs.documents }}
    .: ${{ sequence.files.outputs.evidence }}
  inputs:
    run: find "$INBOX" -type f -print | sort
    env:
      INBOX: ${{ context.environment.op.inbox }}
outputs:
  documents: ${{ sequence.files.outputs.documents }}
  evidence: ${{ sequence.files.outputs.evidence }}
input_schema:
  data_json:
    type: string
    default_value: '{}'
