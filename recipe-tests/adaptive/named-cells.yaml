schema_version: 2
id: named-cell-routing
input_schema:
  cell:
    type: string
    required: true
  ref:
    type: string
    default_value: main
inputs:
  cell: ${{ inputs.cell }}
  ref: ${{ inputs.ref }}
sequence:
- id: resolve
  include: ../../recipes/adaptive/resolve-target.yaml
  inputs:
    cell: ${{ inputs.cell }}
    ref: ${{ inputs.ref }}
outputs:
  target: ${{ sequence.resolve.outputs.target }}
  owner: ${{ context.workflow.cell }}
