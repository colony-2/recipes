recipe: expectations.yaml
cases:
- id: unchanged-republished-baseline
  type: integration_case
  inputs:
    baseline:
      kind: value
      name: test-statements.md
      format: text
      value: Expectation
    proposed:
      kind: value
      name: republished.md
      format: text
      value: Expectation
  assertions:
  - type: output_equals
    path: changed
    value: false
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
- id: changed-baseline
  type: integration_case
  inputs:
    baseline:
      kind: value
      name: test-statements.md
      format: text
      value: Expectation
    proposed:
      kind: value
      name: republished.md
      format: text
      value: Weakened
  assertions:
  - type: output_equals
    path: changed
    value: true
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
- id: no-new-baseline
  type: integration_case
  inputs:
    baseline:
      kind: value
      name: test-statements.md
      format: text
      value: Expectation
  assertions:
  - type: output_equals
    path: changed
    value: false
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
