id: command-diagnostics
sequence:
- id: candidate
  op: command_execution
  const: true
  inputs:
    run: git rev-parse HEAD
- id: first
  include: ../../recipes/adaptive/verify.yaml
  inputs:
    request: first
    candidate: ${{ sequence.candidate.outputs.stdout }}
- id: read_first
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.first.outputs.artifact_refs }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      if [ -f "$INBOX/_c2j/execution/validate.log" ]; then cat "$INBOX/_c2j/execution/validate.log"; fi
- id: second
  include: ../../recipes/adaptive/verify.yaml
  inputs:
    request: second
    candidate: ${{ sequence.candidate.outputs.stdout }}
- id: read_second
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.second.outputs.artifact_refs }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      if [ -f "$INBOX/_c2j/execution/validate.log" ]; then cat "$INBOX/_c2j/execution/validate.log"; fi
outputs:
  first: ${{ sequence.first.outputs }}
  first_streams: ${{ sequence.read_first.outputs.stdout }}
  second: ${{ sequence.second.outputs }}
  second_streams: ${{ sequence.read_second.outputs.stdout }}
