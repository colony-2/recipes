schema_version: 2
id: scheduling-test
input_schema:
  summary:
    type: string
inputs:
  summary: ${{ inputs.summary }}
sequence:
- id: intent
  include: ../../recipes/adaptive/scheduling.yaml
  inputs:
    summary: ${{ inputs.summary }}
- id: intent_v2
  include: ../../recipes/adaptive2/scheduling.yaml
  inputs:
    summary: ${{ inputs.summary }}
outputs:
  decision: ${{ sequence.intent.outputs.decision }}
  decision_v2: ${{ sequence.intent_v2.outputs.decision }}
