recipe: classify.yaml
cases:
- id: individual-field-truncation
  type: integration_case
  inputs:
    mode: purpose-only
  runtime:
    secrets:
      jev_api_key: synthetic
    cells:
      root:
        file_sources:
          classify-statements.md: classify-statements.md
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: outputs.context_usable && !outputs.design_required
  - type: cel_true
    expr: >-
      calls.filter(c, c.op == 'extension_execution')[0].inputs.inputs.state.context_truncated &&
      size(calls.filter(c, c.op == 'extension_execution')[0].inputs.inputs.state.repository_purpose) > 0 &&
      size(calls.filter(c, c.op == 'extension_execution')[0].inputs.inputs.state.repository_purpose) < 3000
