schema_version: 2
id: phase-persistence
input_schema:
  request:
    type: string
    default_value: ''
  target_directory:
    type: string
    default_value: .
  phase:
    type: string
    default_value: design
  assignment:
    type: string
    default_value: ''
  guidance:
    type: string
    default_value: ''
  documents:
    type: artifact_map
    default_value: {}
  evidence_documents:
    type: artifact_map
    default_value: {}
  session:
    type: checkpoint
    object_type: c2ops.codex.session/v1
    required: false
inputs:
  request: ${{ inputs.request }}
  target_directory: ${{ inputs.target_directory }}
  phase: ${{ inputs.phase }}
  assignment: ${{ inputs.assignment }}
  guidance: ${{ inputs.guidance }}
  documents: ${{ inputs.documents }}
  evidence_documents: ${{ inputs.evidence_documents }}
  session: ${{ inputs.?session.orValue({}) }}
sequence:
- id: turn
  include: ../../recipes/adaptive/agent.yaml
  inputs:
    request: ${{ inputs.request }}
    target_directory: ${{ inputs.target_directory }}
    phase: ${{ inputs.phase }}
    assignment: ${{ inputs.assignment }}
    guidance: ${{ inputs.guidance }}
    documents: ${{ inputs.documents }}
    evidence_documents: ${{ inputs.evidence_documents }}
    session: ${{ inputs.session }}
- id: read_next_checkout
  op: command_execution
  const: true
  inputs:
    run: if test -f implementation.txt; then cat implementation.txt; else echo absent; fi
outputs:
  turn: ${{ sequence.turn.outputs.turn }}
  persisted: ${{ sequence.read_next_checkout.outputs.stdout }}
