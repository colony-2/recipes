recipe: scheduling.yaml
cases:
- id: scheduling-wait
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
  inputs:
    summary: Child is running; check again next turn.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      repeat: true
      behavior:
        mode: return
        outputs:
          answers:
            independent:
              type: noul
              noul: 0.01
  assertions:
  - type: cel_true
    expr: outputs.decision_v2 == outputs.decision
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution").all(c, !("timeout_seconds" in c.inputs.inputs))
  - type: output_equals
    path: decision
    value: wait
