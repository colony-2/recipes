recipe: shared-prompts.yaml
cases:
- id: text-include-adds-no-worker-task
  type: integration_case
  runtime:
    cells:
      root:
        file_sources:
          test-statements.md: shared-prompts-statements.md
          readability-statements.md: readability-statements.md
          schema-v2-statements.md: schema-v2-statements.md
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: >-
      size(calls) == 1 && calls[0].op == "command_execution"
  - type: cel_true
    expr: >-
      outputs.prompt.contains("Request: Preserve CSV filters") && outputs.prompt.contains("Develop design.md") && outputs.prompt.contains("Preserve compatibility.")
  - type: cel_true
    expr: >-
      outputs.prompt.contains("inbox: " + calls[0].inputs.env.INBOX) && outputs.prompt.contains("outbox: " + calls[0].inputs.env.OUTBOX)
  - type: cel_true
    expr: >-
      calls[0].inputs.env.INSTRUCTIONS.contains("Run c2j self") && calls[0].inputs.env.INSTRUCTIONS.contains("A cell is the entire repository.")
  - type: cel_true
    expr: '"test-statements.md" in outputs.artifact_refs && "prompt.md" in outputs.artifact_refs && "instructions.md" in outputs.artifact_refs'
- id: formatting-and-template-syntax-remain-data
  type: integration_case
  inputs:
    request: 'Keep 100% of %s and {{ inputs.not_a_variable }} and ${{ 1 + 2 }} literal.'
  runtime:
    cells:
      root:
        file_sources:
          test-statements.md: shared-prompts-statements.md
          readability-statements.md: readability-statements.md
          schema-v2-statements.md: schema-v2-statements.md
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: >-
      size(calls) == 1
  - type: cel_true
    expr: >-
      outputs.prompt.contains("Keep 100% of %s and {{ inputs.not_a_variable }} and ${{ 1 + 2 }} literal.")
