id: consultation-candidate
sequence:
- id: candidate
  op: command_execution
  inputs:
    run: echo unpublished-requester-change > candidate.txt
- id: consult
  include: ../../recipes/adaptive/consultation.yaml
  inputs:
    thread: candidate
    request: Agree the interface.
    consultant_cell: B
    consultant_role: API owner
- id: check
  op: command_execution
  inputs:
    run: "test \"$(cat candidate.txt)\" = unpublished-requester-change\ntest ! -f experiment.txt\n"
outputs:
  result: ${{ sequence.consult.outputs }}
