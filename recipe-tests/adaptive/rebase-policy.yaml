schema_version: 2
id: rebase-policy-fixture
input_schema:
  rebase_repairs:
    type: number
    default_value: 0
  failure:
    type: object
    default_value: {}
inputs:
  failure: ${{ inputs.failure }}
  rebase_repairs: ${{ inputs.rebase_repairs }}
sequence:
- id: policy
  include: ../../recipes/adaptive/rebase-policy.yaml
  inputs:
    failure: ${{ inputs.failure }}
    rebase_repairs: ${{ inputs.rebase_repairs }}
outputs:
  eligible: ${{ sequence.policy.outputs.eligible }}
