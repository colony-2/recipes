id: job-monitoring
input_schema:
  allowed:
    type: boolean
    default_value: true
  wait:
    type: boolean
    default_value: true
inputs:
  allowed: ${{ inputs.?allowed.orValue(true) }}
  wait: ${{ inputs.wait }}
sequence:
- id: monitor
  include: ../../recipes/adaptive/child-results.yaml
  inputs:
    jobs:
      job_ids: [earlier, later]
    allowed: ${{ inputs.allowed }}
    wait: ${{ inputs.wait }}
outputs:
  result: ${{ sequence.monitor.outputs }}
