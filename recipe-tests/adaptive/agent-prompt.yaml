id: agent-prompt-fixture
input_schema:
  arguments_json:
    type: string
    default_value: '{}'
inputs:
  arguments_json: ${{ inputs.arguments_json }}
sequence:
- id: turn
  include: ../../recipes/adaptive/agent.yaml
  inputs:
    documents: ${{ json_parse(inputs.arguments_json).?documents.orValue({}) }}
    phase: ${{ json_parse(inputs.arguments_json).?phase.orValue('') }}
    request: ${{ json_parse(inputs.arguments_json).?request.orValue('') }}
    target_directory: ${{ json_parse(inputs.arguments_json).?target_directory.orValue('') }}
    session: ${{ json_parse(inputs.arguments_json).?session.orValue({}) }}
    assignment: ${{ json_parse(inputs.arguments_json).?assignment.orValue('') }}
    guidance: ${{ json_parse(inputs.arguments_json).?guidance.orValue('') }}
    evidence_documents: ${{ json_parse(inputs.arguments_json).?evidence_documents.orValue({}) }}
outputs:
  turn: ${{ sequence.turn.outputs.turn }}
