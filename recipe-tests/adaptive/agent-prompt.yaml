id: agent-prompt-fixture
input_schema:
  flow_json:
    type: string
    default_value: '{}'
inputs:
  flow_json: ${{ inputs.flow_json }}
sequence:
- id: turn
  include: ../../recipes/adaptive/agent.yaml
  inputs:
    flow: ${{ json_parse(inputs.flow_json) }}
    documents: ${{ json_parse(inputs.flow_json).?documents.orValue({}) }}
outputs:
  turn: ${{ sequence.turn.outputs.turn }}
