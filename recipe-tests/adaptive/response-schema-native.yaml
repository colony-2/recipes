schema_version: 2
id: response-schema-native
input_schema:
  family:
    type: string
    required: true
  participant:
    type: string
    default_value: consultant
  response:
    type: object
    required: true
inputs:
  family: ${{ inputs.family }}
  participant: ${{ inputs.participant }}
  response: ${{ inputs.response }}
sequence:
- id: schemas
  include: ../../recipes/response-schemas.yaml
  inputs:
    participant: ${{ inputs.participant }}
- id: validate
  op: nix:github:colony-2/c2ops/published#codex
  const: true
  inputs:
    prompt: "This is a response-schema transport test. Return exactly this JSON value as your final answer. Do not call tools
      or perform repository work.\n${{ json_stringify(inputs.response) }}"
    output:
      schema: ${{ sequence.schemas.outputs[inputs.family] }}
      max_repair_attempts: 0
    api:
outputs:
  mode: ${{ sequence.validate.outputs.schema_mode }}
  valid: ${{ sequence.validate.outputs.output_schema_valid }}
  status: ${{ sequence.validate.outputs.status }}
