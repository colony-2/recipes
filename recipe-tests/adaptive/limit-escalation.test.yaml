recipe: build.yaml
cases:
- id: retained-adaptive-limit-continues
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
    responses:
    - node_path: build/workflow/adaptive-build/run/adaptive-develop/autonomous_limit/sequence/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
    - node_path: build/workflow/adaptive-build/run/adaptive-develop/accept/sequence/outcome_review/adaptive-review/request_human_review
      fields:
        decision: accept
    observe_files:
    - candidate.txt
  inputs:
    prompt: Explain why no changes are needed.
    max_iterations: 1
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths:
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior remains available."
          handoff.md: "# Execution assignment\nComplete the requested bounded work against test-statements.md. Use settled decisions and preserve existing behavior."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: continue
            summary: The candidate is saved; one verification problem remains.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            candidate.txt: corrected
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merged && size(reviews)==2 && repositories.root.files["candidate.txt"]=="corrected"
