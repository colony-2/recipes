recipe: annotation-identity.yaml
cases:
- id: aliases-preserve-identity-and-unresolved-sources
  type: integration_case
  runtime: {}
  assertions:
  - type: cel_true
    expr: size(outputs.original) == 1 && size(outputs.annotations) == 1
  - type: cel_true
    expr: outputs.annotations[0].id == "jobs/acceptance/child/report.md" && outputs.annotations[0].lineage == ["report.md", "child/report.md", "jobs/acceptance/child/report.md"]
  - type: cel_true
    expr: outputs.annotations[0].sources[0].id == "input.md" && outputs.annotations[0].sources[0].ref.value == "Source evidence"
  - type: cel_true
    expr: outputs.annotations[0].sources[1].issue == "ambiguous" && outputs.annotations[0].sources[2].issue == "not_found" && outputs.annotations[0].sources[3].issue == "invalid"
  - type: cel_true
    expr: size(outputs.annotations[0].sources) == 4 && !("inventory" in outputs.annotations[0])
- id: stale-description-cannot-follow-replaced-document
  type: integration_case
  inputs:
    current_content: Different report
  runtime: {}
  assertions:
  - type: cel_true
    expr: size(outputs.original) == 1 && size(outputs.annotations) == 0
  - type: cel_true
    expr: outputs.documents["jobs/acceptance/child/report.md"].value == "Different report"
