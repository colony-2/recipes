recipe: ../../build.yaml
cases:
- id: direct-no-change
  type: integration_case
  runtime:
    cell: gitvend
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      gitvend:
        files:
          README.md: A bounded application.
    responses:
    - node_path: build/workflow/adaptive-build/run/adaptive-develop/accept/sequence/outcome_review/adaptive-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Explain why no changes are needed.
    title: Preserve 100% of behavior — title
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior remains available."
        effects:
          artifact_files:
            title-statements.md: title-statements.md
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.title == "Preserve 100% of behavior — title"
  - type: cel_true
    expr: >-
      calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#jev"))[0].inputs.inputs.state.request
      == "Title: Preserve 100% of behavior — title\n\nExplain why no changes are needed."
  - type: cel_true
    expr: >-
      calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("Title:
      Preserve 100% of behavior — title\n\nExplain why no changes are needed.")
  - type: output_equals
    path: disposition
    value: unchanged
  - type: cel_true
    expr: size(calls.filter(c, c.op == "input")) == 1
  - type: cel_true
    expr: reviews[0].form.overview_document_id == "merge-review.md"
  - type: cel_true
    expr: reviews[0].form.document_metadata["test-statements.md"].role == "supporting"
  - type: cel_true
    expr: '!calls.exists(c, has(c.artifacts) && ("context.json" in c.artifacts || "feedback.json" in c.artifacts))'
  - type: cel_true
    expr: calls.all(c, c.cell == "gitvend")
