recipe: inbox-smoke.yaml
cases:
- id: native-log-inbox-and-retained-statements
  type: integration_case
  runtime:
    cells:
      root:
        file_sources:
          test-statements.md: direct-state-statements.md
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: status
    value: passed
  - type: cel_true
    expr: '"test-statements.md" in outputs.artifact_refs && "exercise_failure.log" in outputs.artifact_refs && "results.md"
      in outputs.artifact_refs'
  - type: cel_true
    expr: '"_c2j/execution/check_inbox.log" in outputs.artifact_refs'
