- id: investigation-finishes-with-specific-unavailability
  type: integration_case
  runtime:
    cell: gitvend
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      gitvend:
        files:
          README.md: A bounded application.
    responses:
    - node_path:
        build/workflow/adaptive-build/run/adaptive-develop/accept/sequence/outcome_review/adaptive-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Investigate the historical recovery failure. Deliver findings or item-specific unavailability. Do not
      repair or certify the parent recovery outcome.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths: null
            questions: []
        artifacts:
          test-statements.md: |
            # Investigation acceptance
            - I1 [Critical] [integration] [report.md] [JobDB] Each requested item has retrieved evidence or a specific unavailability finding.
          handoff.md: |
            # Investigation assignment
            Report evidence or item-specific unavailability. Parent recovery remains separate and is not certified by this report.
        effects:
          artifact_files:
            operational-outcomes-statements.md: operational-outcomes-statements.md
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: |
            # Findings
            The historical input bytes have expired. The producer job and task were located; retrieval returned unavailable. Parent recovery remains unresolved.
          test-results.md: |
            # Results
            I1 passed: input bytes unavailable, with producer location and failed retrieval recorded. No product behavior or recovery has been certified.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: |
            # Assessment
            Approve the investigation report: I1 requires evidence or specific unavailability. Parent recovery remains unresolved.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: |
            # Decision
            Accept the completed investigation.
            # Summary
            Historical bytes expired; producer identified.
            # Evidence and limitations
            I1 met; parent recovery is unresolved.
            # Recommendation
            Accept findings without certifying parent recovery.
            # Read more
            implementation.md and test-results.md.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.disposition == "unchanged" && size(reviews) == 1
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.endsWith("/stop_attempt") || c.node_path.contains("/questions/"))'
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution" && c.node_path.contains("/work/"))) == 2
