recipe: ../../build.yaml
cases:
- id: explicit-failure-ends-attempt-immediately
  type: integration_case
  runtime:
    cell: gitvend
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      gitvend:
        files:
          README.md: A bounded application.
    responses: []
  inputs:
    prompt: Explain why no changes are needed.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths: null
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior remains
            available."
          handoff.md: "# Execution assignment\nComplete the requested bounded work against test-statements.md. Use settled
            decisions and preserve existing behavior."
        effects:
          artifact_files:
            operational-outcomes-statements.md: operational-outcomes-statements.md
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: fail
            summary: Required publication is unavailable; return this unmet need to the parent.
            files:
            - path: recovery.md
              description: Exact unmet input and attempted retrieval
              title: Unmet input
              role: primary
              order: 0
              source_paths: null
            questions: []
        artifacts:
          recovery.md: |
            # Missing source
            The producer task retains the commit, but normal module resolution requires publication.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews) == 0
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution" && c.node_path.contains("/work/"))) == 2
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/stop_attempt"))
  expect_error: Required publication is unavailable; return this unmet need to the parent.
