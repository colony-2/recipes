recipe: native-state-boundary.yaml
cases:
- id: suspended-parent-native-values-control
  type: integration_case
  runtime: {}
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: outcome
    value: agreed
  - type: output_equals
    path: direction
    value: Keep validation opt in.
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("inspect_restored_parent")).size() == 1
  - type: cel_true
    expr: '"direction.md" in outputs.documents && !("state" in outputs)'
