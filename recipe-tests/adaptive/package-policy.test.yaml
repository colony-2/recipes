recipe: package-policy.yaml
cases:
- id: exact-allowlist-authorizes-probe
  type: integration_case
  inputs:
    policy:
      uv:ruff==0.11.2:
      - ruff
      - --version
  runtime:
    cells:
      root:
        files:
          .c2/config.yaml: "packages: []\n"
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: output_equals
    path: needs_approval
    value: false
  - type: cel_true
    expr: 'outputs.config.contains("packages: []") && size(calls) == 2'
- id: different-probe-needs-approval
  type: integration_case
  inputs:
    policy:
      uv:ruff==0.11.2:
      - ruff
      - check
  runtime:
    cells:
      root:
        files:
          .c2/config.yaml: "packages: []\n"
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: output_equals
    path: needs_approval
    value: true
  - type: cel_true
    expr: 'outputs.config.contains("packages: []") && size(calls) == 2'
- id: unlisted-package-needs-approval
  type: integration_case
  inputs:
    policy: {}
  runtime:
    cells:
      root:
        files:
          .c2/config.yaml: "packages: []\n"
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: output_equals
    path: needs_approval
    value: true
  - type: cel_true
    expr: 'outputs.config.contains("packages: []") && size(calls) == 2'
