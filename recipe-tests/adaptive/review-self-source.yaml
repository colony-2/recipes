schema_version: 2
id: review-self-source
input_schema:
  log:
    type: string
    default_value: Current Docker failure
inputs:
  log: ${{ inputs.log }}
  documents:
    environment-check.log:
      kind: value
      name: environment-check.log
      format: text
      value: ${{ inputs.log }}
    test-results.md:
      kind: value
      name: test-results.md
      format: text
      value: Acceptance requires Docker access.
sequence:
- id: annotate
  include: ../../recipes/adaptive/artifact-annotations.yaml
  inputs:
    bound_inputs:
      environment-check.log:
        kind: value
        name: environment-check.log
        format: text
        value: Previous Docker failure
    artifacts: ${{ inputs.documents }}
    result:
      response:
        files:
        - path: environment-check.log
          title: Docker failure evidence
          description: Preserved command diagnostics.
          role: diagnostic
          source_paths:
          - inbox/environment-check.log
          - outbox/test-results.md
        - path: test-results.md
          description: Acceptance results and missing prerequisites.
          source_paths: []
- id: ask
  include: ../../recipes/adaptive/review.yaml
  inputs:
    title: Acceptance needs Docker access
    documents: ${{ inputs.documents }}
    annotations: ${{ sequence.annotate.outputs.annotations }}
    fields:
    - id: acceptance_executor
      type: paragraph_text
      question: Which Docker endpoint should acceptance use?
      required: true
    overview: review.md
    summary: Integration acceptance needs a Docker endpoint.
    required_documents:
    - environment-check.log
    - test-results.md
outputs:
  response: ${{ sequence.ask.outputs.response }}
