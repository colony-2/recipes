recipe: recovery.yaml
cases:
- id: correction-exhaustion-needs-no-product-answer
  type: integration_case
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: outputs.result.failed && outputs.result.code == "ADAPTIVE_RECOVERY_REQUIRED" && size(reviews) == 0
  runtime: {}
- id: preparation-failure-hands-off-to-parent
  type: integration_case
  inputs:
    kind: agent
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: fail
        error:
          message: repository package preparation unavailable
        artifacts:
          _c2j/preparation.json: '{"setup":"unavailable"}'
  assertions:
  - type: cel_true
    expr: outputs.result.failed && outputs.result.code == "AGENT_EXECUTION_RECOVERY_REQUIRED" && size(reviews)==0
  runtime: {}
