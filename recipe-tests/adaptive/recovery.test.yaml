recipe: recovery.yaml
cases:
- id: correction-exhaustion-offers-safe-direction
  type: integration_case
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          errorMessage: Explanation unavailable
  assertions:
  - type: cel_true
    expr: '!outputs.result.retry && outputs.result.code == "ADAPTIVE_STOPPED_BY_USER" && size(reviews)==1 && size(outputs.result.review_receipts)==1'
  runtime:
    responses:
    - node_path: recovery-fixture/correction/correction/adaptive-response-repair/decision/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: stop
- id: preparation-failure-hands-off-to-parent
  type: integration_case
  inputs:
    kind: agent
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: fail
        error:
          message: repository package preparation unavailable
        artifacts:
          _c2j/preparation.json: '{"setup":"unavailable"}'
  assertions:
  - type: cel_true
    expr: outputs.result.failed && outputs.result.code == "AGENT_EXECUTION_RECOVERY_REQUIRED" && size(reviews)==0
  runtime: {}
