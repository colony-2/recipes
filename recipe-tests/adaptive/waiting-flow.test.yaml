recipe: ../../build.yaml
cases:
- id: wait-uses-durable-child-collection
  type: integration_case
  runtime:
    cell: gitvend
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      gitvend:
        files:
          README.md: A bounded application.
      owner:
        files:
          README.md: API owner
    responses:
    - node_path:
        build/workflow/adaptive-build/run/adaptive-develop/accept/sequence/outcome_review/adaptive-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Explain why no changes are needed.
    title: Preserve 100% of behavior — title
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: gitvend
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths:
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior remains
            available."
          handoff.md: "# Execution assignment\nComplete the requested bounded work against test-statements.md. Use settled
            decisions and preserve existing behavior."
        effects:
          artifact_files:
            title-statements.md: title-statements.md
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: gitvend
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: coordinate
            summary: Obtain the external API change
            requests:
            - action: consult
              cell: owner
              request: 'Enhancement: implement the required API'
            files: []
        effects:
          artifact_files:
            title-statements.md: title-statements.md
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: owner
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Owner agrees to implement the API.
            files:
            - path: iter1/consultant/spec.md
              description: API agreement
        artifacts:
          iter1/consultant/spec.md: Owner will implement the agreed API.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: owner
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: gitvend
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: coordinate
            summary: Obtain the external API change
            requests:
            - action: execute
              cell: owner
              handoff: work/owner/
            files:
            - path: work/owner/handoff.md
              description: Accepted API execution handoff
        effects:
          artifact_files:
            title-statements.md: title-statements.md
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
        artifacts:
          work/owner/handoff.md: 'Implement the required API. '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: gitvend
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: wait
            summary: Only the child result remains.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: gitvend
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: gitvend
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: gitvend
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - match:
        op: recipes.run
      behavior:
        mode: return
        outputs:
          goal_ids:
          - build-goal
          job_ids:
          - build-attempt
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: return
        outputs:
          job_id: build-attempt
          status: running
          terminal: false
          goal_state: OPEN
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: return
        outputs:
          status: completed
          failure_message: ''
          outputs:
            merged: true
            disposition: merged
          job_id: build-attempt
  assertions:
  - type: cel_true
    expr: outputs.coordination.exists(r,r.action=="await" && r.job_id=="build-attempt" &&
      r.result.status=="completed") && size(reviews)==1
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.await_result_soft").map(c,c.inputs.return_when) ==
      ["current_status","terminal"]
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution" && c.node_path.contains("/work/") &&
      c.inputs.selector.endsWith("#codex"))) == 5
