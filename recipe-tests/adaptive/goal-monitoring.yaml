schema_version: 2
id: goal-monitoring
sequence:
- id: monitor
  include: ../../recipes/adaptive/validation-goals.yaml
  inputs:
    jobs:
      job_ids:
      - failed-attempt
      - replacement-attempt
      goal_ids:
      - one-goal
      - one-goal
    allowed: true
- id: read_status
  op: command_execution
  const: true
  artifacts:
    status.md: ${{ sequence.monitor.outputs.documents['goals/validation-one-goal/status.md'] }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: cat "$INBOX/status.md"
outputs:
  failed: ${{ sequence.monitor.outputs.failed }}
  documents: ${{ sequence.monitor.outputs.documents }}
  status_text: ${{ sequence.read_status.outputs.stdout }}
