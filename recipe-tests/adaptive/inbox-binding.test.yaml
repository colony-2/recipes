recipe: inbox-binding.yaml
cases:
- id: readonly-fresh-overlapping-evidence
  type: integration_case
  runtime: {}
  inputs:
    read_only: true
    resume: false
  mocks:
    ops:
    - match:
        node_path: inbox-binding/session
      behavior:
        mode: return
        outputs:
          success: true
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: prior
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            files: []
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution")[0].artifacts["evidence.json"] == "Original execution evidence"
  - type: cel_true
    expr: size(outputs.candidate.files) == 0 && outputs.result.status == "completed"
