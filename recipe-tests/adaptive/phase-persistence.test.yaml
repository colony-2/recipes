recipe: phase-persistence.yaml
cases:
- id: design-recovery-discards
  type: integration_case
  runtime:
    secrets:
      codex_api_key: synthetic
  inputs:
    phase: design
    assignment: recovery
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Done
            files: []
            questions: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            implementation.txt: "implemented in a writable phase\n"
    - match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: outputs.persisted.contains("absent")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution")[0].inputs.inputs.instructions.contains("c2j job snapshot")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution")[0].inputs.inputs.prompt.contains("Develop design.md")
