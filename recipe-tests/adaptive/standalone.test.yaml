  assertions:
  - type: cel_true
    expr: outputs.status == "completed" && outputs.build.disposition == "unchanged" && size(reviews) == 1
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.contains("kernel"))'
  - type: cel_true
    expr: outputs.build.annotations.exists(a, a.id == "requirements.md" && a.descriptor.title == "Agreed requirements")
  - type: cel_true
    expr: reviews.exists(r, "requirements.md" in r.form.document_metadata && r.form.document_metadata["requirements.md"].title == "Agreed requirements")
  - type: cel_true
    expr: '!outputs.build.artifact_refs.exists(k, k.startsWith("__review_annotations__/"))'
  inputs:
    documents:
      requirements.md:
        kind: value
        name: requirements.md
        format: text
        value: Keep the documented behavior.
    annotations:
    - id: requirements.md
      ref:
        kind: value
        name: requirements.md
        format: text
        value: Keep the documented behavior.
      descriptor:
        title: Agreed requirements
      sources: []
