recipe: consultation-continuation.yaml
cases:
- id: fresh-consultation-has-no-checkpoint-api
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Client application
          candidate.txt: original
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
    observe_files:
    - candidate.txt
    - experiment.txt
    secrets:
      codex_api_key: synthetic
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 1: agreed'
            files:
            - path: iter1/consultant/feature-spec.md
              description: Consultation document
        artifacts:
          iter1/consultant/feature-spec.md: '# Accepted feature'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
  assertions:
  - type: cel_true
    expr: outputs.outcome == "agreed"
  - type: cel_true
    expr: '!("state" in outputs) && !("continuation" in outputs) && !("transcript" in outputs)'
  - type: cel_true
    expr: outputs.consultant_session == calls.filter(c,c.op == "extension_execution")[0].outputs.session
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution")) == 1
  - type: cel_true
    expr: '!calls.exists(c,c.op == "recipes.run") && size(reviews) == 0'
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("restore_consultation_transcript") || c.node_path.contains("publish_consultation_transcript"))'
- id: native-nested-advice-returns-once
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Client application
          candidate.txt: original
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
      jobdb:
        files:
          PURPOSE.md: Own pagination
    observe_files:
    - candidate.txt
    - experiment.txt
    secrets:
      codex_api_key: synthetic
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: continue
            thinking: Need JobDB contract advice before agreeing.
            files:
            - path: iter1/consultant/feature-spec.md
              description: Consultation document
            requests:
            - cell: jobdb
              request: Clarify the existing pagination contract.
              action: consult
        artifacts:
          iter1/consultant/feature-spec.md: '# Accepted feature'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: jobdb
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'jobdb advice: agreed'
            files:
            - path: iter1/consultant/contract.md
              description: Advice
        artifacts:
          iter1/consultant/contract.md: Use cursor pagination.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: jobdb
                iteration: 1
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 1: agreed'
            files:
            - path: iter2/consultant/spec.md
              description: Consultation document
        artifacts:
          iter2/consultant/spec.md: Accepted after downstream advice.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
  assertions:
  - type: cel_true
    expr: outputs.outcome == "agreed"
  - type: cel_true
    expr: '!("state" in outputs) && !("continuation" in outputs) && !("transcript" in outputs)'
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution")) == 3
  - type: cel_true
    expr: '!calls.exists(c,c.op == "recipes.run") && size(reviews) == 0'
  - type: cel_true
    expr: outputs.artifacts.exists(k,k.startsWith("downstream/"))
