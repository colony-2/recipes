recipe: approval-equivalence.yaml
cases:
- id: neighboring-context
  type: integration_case
  inputs:
    extra: ''
  runtime:
    cells:
      root:
        files:
          candidate.txt: "original\nStable context A\nStable context B\nNeighboring test name\nContext 0\nContext 1\nContext 2\nContext 3\nContext 4\nContext 5\nContext 6\nContext 7\nContext 8\nContext 9\nContext 10\nContext 11\n"
          image.bin: original image
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: candidate.approval_equivalent
    value: true
  - type: cel_true
    expr: outputs.old.change_digest != outputs.candidate.change_digest
