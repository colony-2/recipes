recipe: prerequisite.yaml
cases:
- id: advisory-agreement-does-not-create-execution-obligation
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
    responses: []
  inputs: {}
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior remains available."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: outside
            summary: Complete bounded work.
            files: []
            questions: []
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
  assertions:
  - type: cel_true
    expr: outputs.result.disposition == "outside" && !outputs.result.merged
  - type: cel_true
    expr: '!calls.exists(c, c.op == "input" || c.op == "merge" || c.op == "rebase")'
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.contains("/resume_read_only_session/"))'
