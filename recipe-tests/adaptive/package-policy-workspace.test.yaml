recipe: package-policy-workspace.yaml
cases:
- id: candidate-cannot-grant-itself-package-approval
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Cell with no published package policy.
  mocks:
    ops:
    - match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: size(outputs.approved) == 0
- id: published-package-policy-remains-in-effect
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/package-policy.yaml: |
            id: published-policy
            sequence: []
            outputs:
              approved:
                uv:ruff==0.11.2: [ruff, --version]
  mocks:
    ops:
    - match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: size(outputs.approved) == 1 && outputs.approved["uv:ruff==0.11.2"] == ["ruff", "--version"]
