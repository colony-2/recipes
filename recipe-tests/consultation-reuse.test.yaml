recipe: fixtures/consultation-reuse.yaml
cases:
- id: reuse
  type: integration_case
  runtime:
    cells:
      root:
        files:
          AGENTS.md: 'Instructions for root

            '
          app.txt: 'application

            '
      B:
        files:
          AGENTS.md: 'Instructions for B

            '
          app.txt: 'application

            '
    observe_files:
    - AGENTS.md
    - app.txt
    - experiment.txt
    - implementation.txt
    - .c2j/implementation.txt
  mocks:
    ops:
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: design
        artifacts:
          result.json: '{"summary": "design outcome", "next": "consult", "consultation": {"cell": "B", "message": "Discuss
            ownership and error handling.", "ref": "main"}}'
          design.md: '# Design 1


            Requested behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: design
                turn: 1
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: consult
        artifacts:
          result.json: '{"summary": "B owns validation. Reject invalid tokens.", "next": "done"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consult
                turn: 1
          worktree:
            experiment.txt: Discard experiment
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: design
        artifacts:
          result.json: '{"summary": "design outcome", "next": "redesign"}'
          design.md: '# Design 2


            Requested behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: design
                turn: 2
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: implement
        artifacts:
          result.json: '{"summary": "implement outcome", "next": "consult", "consultation": {"cell": "B", "message":
            "Discuss ownership and error handling.", "ref": "main"}}'
          implementation.md: '# Implementation 3


            Behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: implement
                turn: 3
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: consult
        artifacts:
          result.json: '{"summary": "B owns validation. Reject invalid tokens.", "next": "done"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consult
                turn: 3
          worktree:
            experiment.txt: Discard experiment
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: implement
        artifacts:
          result.json: '{"next": "redesign", "summary": "Please approve external work"}'
          implementation.md: '# Implementation 4


            Behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: implement
                turn: 4
    - repeat: true
      match:
        selector: git+https://github.com/colony-2/c2ops.git//rule_gate@main
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.valid && outputs.result.completed
  - type: cel_true
    expr: outputs.result.consultations.B.session.type == "c2ops.codex.session/v1"
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.cell ==
      "B").size() == 2
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.cell ==
      "B")[1].inputs.inputs.session.type == "c2ops.codex.session/v1"
  - type: cel_true
    expr: outputs.result.result.next == "redesign"
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).map(c,c.cell) == ["root",
      "B", "root", "root", "B", "root"]
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).all(c, !("experiment.txt"
      in c.worktree))
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).all(c, c.worktree["AGENTS.md"]
      == "Instructions for " + c.cell + "\n" && c.worktree["app.txt"] == "application\n")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[2].inputs.inputs.session
      == calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[0].outputs.session
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[4].inputs.inputs.session
      == calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].outputs.session
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[5].inputs.inputs.session
      == calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[3].outputs.session
