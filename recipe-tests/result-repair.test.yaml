recipe: fixtures/result-repair.yaml
cases:
- id: automatic-preserves-session-and-documents
  type: integration_case
  runtime: {}
  inputs:
    attempts: 0
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Existing design
        artifacts:
          design.md: '# Existing design'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: 1
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.retry
    value: true
  - type: output_equals
    path: result.attempts
    value: 1
  - type: cel_true
    expr: outputs.result.session == outputs.seed
  - type: cel_true
    expr: outputs.evidence.contains("# Existing design") && outputs.evidence.contains("Existing design")
  - type: cel_true
    expr: '"design.md" in outputs.result.artifacts'
  - type: cel_true
    expr: '!calls.exists(c, c.op == "input")'
