    expr: outputs.merged && outputs.verification.status == "passed"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "merge")) == 1 && size(calls.filter(c, c.op == "rebase")) == 2
  - type: cel_true
    expr: size(reviews) == 2
  - type: cel_true
    expr: repositories.root.files[".c2/recipes/hooks/build/verify.yaml"].contains("repaired-verify")
  - type: cel_true
    expr: "calls.exists(c, c.node_path.contains(\"/work/sequence/agent/\") && \"verification.md\" in c.artifacts\
      \ &&\n    c.node_path.contains(\"/resume_implementation_session/\") && has(c.inputs.inputs.session) &&\n \
      \   !c.artifacts[\"context.json\"].contains('\"reuse_merge_approval\":') &&\n    !c.artifacts[\"context.json\"\
      ].contains('\"reviewed_change_digest\":'))"
  - type: cel_true
    expr: calls.exists(c, c.node_path.contains("/work/sequence/agent/") && "verification.md" in c.artifacts && c.artifacts["verification.md"].contains("skipped"))
  - type: cel_true
    expr: size(calls.filter(c, c.node_path.contains("/assessment/") && c.op == "extension_execution")) == 3
- id: verification-repair-agent-error-propagates
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          PURPOSE.md: Own widget documentation.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: "id: broad-artifact-verify\nsequence:\n- id: checks\n  op: command_execution\n\
            \  const: true\n  inputs:\n    env:\n      OUTBOX: ${{ context.environment.op.outbox }}\n    run: printf\
            \ 'Checks passed\\n' > \"$OUTBOX/tests.log\"\noutputs:\n  api_version: c2.build-hook/v1\n  status: passed\n\
            \  summary: Tests passed; exporting all operation artifacts is invalid.\n  artifact_refs: ${{ sequence.checks.artifacts\
            \ }}\n"
    observe_files:
    - candidate.txt
    - .c2/recipes/hooks/build/verify.yaml
    expect_error: Implementation repair agent crashed
  inputs:
    prompt: Correct the widget documentation.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Correct the widget documentation.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget documentation
            review_message: Correct the documented widget behavior. Verify the updated content with an automated
              check.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          worktree:
            candidate.txt: corrected
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: fail
        error:
          message: Implementation repair agent crashed
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: '!calls.exists(c, c.op in ["squash", "merge"]) && size(reviews) == 0'
  - type: cel_true
    expr: calls.exists(c, c.node_path.contains("/work/sequence/agent/") && "hooks/verify/1/failure.json" in c.artifacts)
