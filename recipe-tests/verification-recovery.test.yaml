recipe: ../build.yaml
cases:
- id: light-invalid-report-returns-to-implementation
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          PURPOSE.md: Own widget documentation.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: "id: broad-artifact-verify\nsequence:\n- id: checks\n  op: command_execution\n\
            \  const: true\n  inputs:\n    env:\n      OUTBOX: ${{ context.environment.op.outbox }}\n    run: printf\
            \ 'Checks passed\\n' > \"$OUTBOX/tests.log\"\noutputs:\n  api_version: c2.build-hook/v1\n  status: passed\n\
            \  summary: Tests passed; exporting all operation artifacts is invalid.\n  artifact_refs: ${{ sequence.checks.artifacts\
            \ }}\n"
    observe_files:
    - candidate.txt
    - .c2/recipes/hooks/build/verify.yaml
    responses:
    - node_path: build/run/light/light/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Correct the widget documentation.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Correct the widget documentation.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget documentation
            review_message: Correct the documented widget behavior. Verify the updated content with an automated
              check.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          worktree:
            candidate.txt: corrected
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Repair verification and rerun the requested checks.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget documentation
            review_message: Correct the documented widget behavior. Verify the updated content with an automated
              check.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          worktree:
            .c2/recipes/hooks/build/verify.yaml: "id: repaired-verify\nsequence:\n- id: checks\n  op: command_execution\n\
              \  const: true\n  inputs:\n    env:\n      OUTBOX: ${{ context.environment.op.outbox }}\n    run:\
              \ printf 'Checks passed\\n' > \"$OUTBOX/tests.log\"\noutputs:\n  api_version: c2.build-hook/v1\n \
              \ status: passed\n  summary: Checks passed with explicit evidence.\n  artifact_refs: \"${{ {'tests.log':\
              \ sequence.checks.artifacts['tests.log']} }}\"\n"
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merged && outputs.verification.status == "passed"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "merge")) == 1 && size(calls.filter(c, c.op == "rebase")) == 2
  - type: cel_true
    expr: size(reviews) == 1
  - type: cel_true
    expr: repositories.root.files[".c2/recipes/hooks/build/verify.yaml"].contains("repaired-verify")
  - type: cel_true
    expr: "calls.exists(c, c.node_path.contains(\"/work/sequence/agent/\") && \"verification.md\" in c.artifacts\
      \ &&\n    c.node_path.contains(\"/resume_implementation_session/\") && has(c.inputs.inputs.session) &&\n \
      \   !c.artifacts[\"context.json\"].contains('\"reuse_merge_approval\":') &&\n    !c.artifacts[\"context.json\"\
      ].contains('\"reviewed_change_digest\":'))"
  - type: cel_true
    expr: "calls.exists(c, c.node_path.contains(\"/work/sequence/agent/\") && \"hooks/verify/1/failure.json\" in\
      \ c.artifacts &&\n    c.artifacts[\"verification.md\"].contains(\"__git_state_thin_pack__\") &&\n    c.artifacts[\"\
      hooks/verify/1/failure.json\"].contains(\"HOOK_ARTIFACT_INVALID\"))"
  - type: cel_true
    expr: size(calls.filter(c, c.node_path.contains("/report/build-hook-report/invalid/"))) == 1
- id: heavy-invalid-report-returns-to-implementation
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
      codex_api_key: synthetic-build-credential
    config:
      codex_api_base_url: https://fixture.invalid/v1
    cells:
      root:
        files:
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: "id: broad-artifact-verify\nsequence:\n- id: checks\n  op: command_execution\n\
            \  const: true\n  inputs:\n    env:\n      OUTBOX: ${{ context.environment.op.outbox }}\n    run: printf\
            \ 'Checks passed\\n' > \"$OUTBOX/tests.log\"\noutputs:\n  api_version: c2.build-hook/v1\n  status: passed\n\
            \  summary: Tests passed; exporting all operation artifacts is invalid.\n  artifact_refs: ${{ sequence.checks.artifacts\
            \ }}\n"
    observe_files:
    - candidate.txt
    - .c2/recipes/hooks/build/verify.yaml
    - unapproved.txt
    responses:
    - node_path: build/run/heavy/heavy/develop/approval/sequence/plan_review/kernel-review/request_human_review
      fields:
        decision: approve
    - node_path: build/run/heavy/heavy/develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Improve the requested behavior.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.99
    - repeat: true
      match:
        node_path: build/run/heavy/heavy/develop/accounting/sequence/review/build-merge-review/reviewer/kernel-agent-turn/start_read_only_session/start_read_only_session
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            subject: Improve requested behavior with verified coverage
            review_message: Implement the approved behavior and verify it with build.sh. Independent assessment
              and file accounting found the changes appropriate.
            files:
            - path: build.sh
              change: A
              reason: Exercise the approved behavior with an automated check.
            - path: candidate.txt
              change: M
              reason: Implement the approved behavior in this file.
            - path: .c2/recipes/hooks/build/verify.yaml
              change: M
              reason: Repair verification so the requested checks run and export valid evidence.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: design response
            files:
            - path: design.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          design.md: '# design evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: design
                turn: 1review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: test-plan response
            files:
            - path: test-statements.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: test-plan
                turn: 1review
          artifact_files:
            test-statements.md: verification-recovery-statements.md
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Independent plan assessment
            assessment: pass
            files:
            - path: iter1/consultant/plan-review.md
              description: Review evidence
        artifacts:
          iter1/consultant/plan-review.md: '# Independent findings'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                expert: plan
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: implement response
            files:
            - path: implementation.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          implementation.md: '# implement evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: implement
                turn: 1review
          worktree:
            candidate.txt: implemented behavior
            build.sh: '#!/bin/sh

              test "$(cat candidate.txt)" = "implemented behavior"

              '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
