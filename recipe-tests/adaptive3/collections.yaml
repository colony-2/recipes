schema_version: 2
id: collection-transport-test
input_schema:
  count:
    type: number
    required: true
inputs:
  count: ${{ inputs.count }}
sequence:
- id: produce
  op: command_execution
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
      COUNT: ${{ string(inputs.count) }}
    run: |
      python3 - <<'PY'
      import os, pathlib
      root=pathlib.Path(os.environ['OUTBOX'])/'review'; root.mkdir()
      for i in range(int(os.environ['COUNT'])):
          (root/f'capture-{i:04d}.txt').write_text(f'Selected capture {i}\n')
      PY
- id: handoff
  artifacts:
    work/: ${{ sequence.produce.artifacts }}
  op: command_execution
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
      COUNT: ${{ string(inputs.count) }}
    run: |
      python3 - <<'PY'
      import os, pathlib
      root=pathlib.Path(os.environ['INBOX'])/'work'/'review'
      files=list(root.glob('capture-*.txt'))
      assert len(files)==int(os.environ['COUNT'])
      assert (root/'capture-0000.txt').read_text()=='Selected capture 0\n'
      print(len(files))
      PY
outputs:
  count: ${{ inputs.count }}
  references: ${{ size(sequence.produce.artifacts) }}
  reference_bytes: ${{ size(json_stringify(sequence.produce.artifacts)) }}
  delivered: ${{ json_parse(sequence.handoff.outputs.stdout) }}
