recipe: agent-settings.yaml
cases:
- id: guide-and-worker-defaults-in-a-consuming-cell
  type: integration_case
  runtime: &runtime {config: {codex_model: from-worker, codex_reasoning_effort: medium}, cells: {root: {files: {README.md: A consuming cell.}}}}
  inputs:
    prompt: Find a worker for the Docker check.
    schema: &schema {type: object, properties: {status: {type: string}}, required: [status], additionalProperties: false}
  mocks: &mock
    ops:
    - match: {selector: 'nix:github:colony-2/c2ops/published#codex'}
      behavior: {mode: return, outputs: {status: completed, output_schema_valid: true, response: {status: passed}}}
  assertions:
  - type: cel_true
    expr: >-
      size(calls)==1 && calls[0].node_path.contains('start_read_only') &&
      calls[0].inputs.inputs.model == 'from-worker' && calls[0].inputs.inputs.reasoning_effort == 'medium' &&
      calls[0].inputs.inputs.instructions.contains('use a package request') &&
      calls[0].inputs.inputs.instructions.contains('A manual install may disappear') &&
      calls[0].inputs.inputs.instructions.contains('fresh workspace') &&
      calls[0].inputs.inputs.instructions.contains('outbox')
  - &guide_at_start
    type: cel_true
    expr: >-
      calls[0].inputs.inputs.instructions.contains('https://raw.githubusercontent.com/colony-2/recipes/refs/heads/main/guides/WORKING_IN_C2.md') &&
      !calls[0].inputs.inputs.prompt.contains('WORKING_IN_C2.md') &&
      (!has(calls[0].artifacts) || !('C2-guide.md' in calls[0].artifacts))
- id: writable-author-gets-only-the-requested-override
  type: integration_case
  runtime: *runtime
  inputs:
    prompt: Fix the issue.
    schema: *schema
    read_only: false
    agent_settings: {model: '', reasoning_effort: high}
  mocks: *mock
  assertions:
  - type: cel_true
    expr: size(calls)==1 && calls[0].node_path.contains('start_work') && calls[0].inputs.inputs.model == 'from-worker' && calls[0].inputs.inputs.reasoning_effort == 'high'
  - *guide_at_start
