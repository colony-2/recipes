recipe: ../../adaptive3.yaml
cases:
- id: configure-return-retains-the-chosen-preparation-destination
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/preparation/preparation/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    merge_queue: false
    prompt: Add a marker file.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Requested outcome

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: stuck
            summary: Refresh configuration before completing Preparation.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Test plan'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            stage: configure
            destination: preparation
            instruction: null
            report: null
            additional_attempts: 1
            action: Rerun Configure and continue Preparation using the current approved Direction.
            summary: Refresh configuration for the paused plan.
            title: Refresh configuration
            primary: null
            document_details: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Test plan'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/one-pager.md
            work_kind: feature
            document_details:
            - {document_id: review/design.md, title: Design, description: Review the implementation plan., role: supporting, order: 0}
            - {document_id: review/acceptance.md, title: Acceptance criteria, description: Review the required checks., role: supporting, order: 1}
            - document_id: review/one-pager.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/one-pager.md: 'Restore saved drafts. [Design](design.md) and [Acceptance criteria](acceptance.md).'
          review/design.md: Persist drafts and restore the most recent save after restart.
          review/acceptance.md: Drafts survive restart in a browser.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            commit: {title: Record the completed marker, body: Write the marker so completion is visible.}
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
          worktree:
            marker.txt: 'done

              '
        artifacts:
          review/README.md: '# Implementation'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Outcome

            A marker was added.'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: calls.exists(c,c.node_path.contains("/direction/") && c.op=="extension_execution" && has(c.inputs.inputs.prompt)
      && c.inputs.inputs.prompt.contains("what the installation may run before") && c.inputs.inputs.prompt.contains("Private
      pnpm installation permits direct, transitive and selected") && c.inputs.inputs.prompt.contains("optional dependency
      builds, mutable transitives"))
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/direction/")
      && c.node_path.contains("/execute/")).size()==1
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/preparation/")
      && c.node_path.contains("/execute/")).size()==2
  - type: cel_true
    expr: size(reviews)==2
