recipe: packages.yaml
cases:
- id: human-denial-does-not-probe
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: packages-test/packages/adaptive3-packages/approval/approval/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: revise
        feedback: Do not add pytest. Use the existing test tool.
        attachments: []
        settings: {}
    observe_files:
    - .c2/config.yaml
  inputs:
    requests:
    - reference: uv:pytest
      check:
      - pytest
      - --version
    reason: Run project tests
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Add pytest for local tests.
            title: Add pytest for local tests
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            - document_id: review/config.yaml
              title: Supporting evidence
              description: Check the evidence for this result.
              role: supporting
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Add pytest for local tests.
        artifacts:
          review/README.md: '# Add pytest

            Run local tests.'
          review/config.yaml: 'packages: ["uv:pytest"]

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Use the existing test tool.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Use the existing test tool.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="changes"
  - type: cel_true
    expr: '!calls.exists(c,c.op=="recipes.run" || c.node_path.contains("/adopt/"))'
- id: human-approval-precedes-failed-probe
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Project
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: packages-test/packages/adaptive3-packages/approval/approval/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - .c2/config.yaml
  inputs:
    requests:
    - reference: uv:pytest
      check:
      - pytest
      - --version
    reason: Run local tests
  mocks:
    ops:
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Add pytest for local tests.
            title: Approve pytest for local tests
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            - document_id: review/config.yaml
              title: Supporting evidence
              description: Check the evidence for this result.
              role: supporting
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Add pytest for local tests.
        artifacts:
          review/README.md: '# Add pytest

            Run local tests.'
          review/config.yaml: 'packages: ["uv:pytest"]

            '
    - match:
        op: recipes.run
      behavior:
        mode: return
        effects:
          children:
          - recipe: child.yaml
            cell: root
            inputs:
              fail: true
            await: terminal
            bind: probe
        outputs_expr: '{"job_ids":[children.probe]}'
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="stuck" && outputs.result.child.status=="failed"
  - type: cel_true
    expr: size(calls.filter(c,c.op=="recipes.run"))==1
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/adopt/"))'
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: events.filter(e,e.kind=="response_release")[0].position < events.filter(e,e.kind=="child_submitted")[0].position
  - type: cel_true
    expr: calls.filter(c,c.op=="recipes.run").all(c,c.inputs.recipes[0].inputs.config==c.inputs.recipes[0].inputs.approved.config
      && c.inputs.recipes[0].inputs.requests==c.inputs.recipes[0].inputs.approved.requests)
- id: policy-approval-precedes-failed-probe
