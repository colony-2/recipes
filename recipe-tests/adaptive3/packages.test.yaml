    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Adopted the validated config.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Adopted the validated config.
          worktree:
