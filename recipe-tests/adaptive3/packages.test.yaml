    responses:
    - node_path: packages-test/packages/adaptive3-packages/approval/approval/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - .c2/config.yaml
  inputs:
    requests:
    - reference: uv:pytest==8.3.5
      check:
      - pytest
      - --version
    reason: Run local tests
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Add pytest for local tests.
            title: Approve pytest for local tests
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Approve pytest for local tests
              description: Review the requested tools and their purpose.
              role: primary
              order: 10
            - document_id: review/config.yaml
              title: Proposed package configuration
              description: Check the exact portable tools proposed for this project.
              role: supporting
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Add pytest for local tests.
        artifacts:
          review/README.md: '# Add pytest

            Run local tests.'
          review/config.yaml: 'packages: ["nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3",
            "uv:pytest==8.3.5"]

            '
    - match:
        op: recipes.run
      behavior:
        mode: return
        effects:
          children:
          - recipe: package-probe.yaml
            cell: root
            inputs:
              config:
                kind: value
                name: review/config.yaml
                format: text
                value: 'packages: ["nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3",
                  "uv:pytest==8.3.5"]

                  '
              requests:
              - reference: uv:pytest==8.3.5
                check:
                - pytest
                - --version
            await: terminal
            bind: probe
          worktree:
            .c2/config.yaml: 'packages: []

              '
        outputs_expr: '{"job_ids":[children.probe]}'
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: events.filter(e,e.kind=="response_release")[0].position < events.filter(e,e.kind=="child_submitted")[0].position
  - type: cel_true
    expr: events.filter(e,e.kind=="child_terminal")[0].position < events.filter(e,e.kind=="operation_entry" && e.node_path.contains("/adopt/"))[0].position
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/probe/probe") && c.outputs.stdout.contains("pytest 8.3.5"))
  - type: cel_true
    expr: outputs.result.status=="changes" && outputs.result.summary=="Current configuration conflicts with approved
      baseline"
  - type: cel_true
    expr: 'calls.filter(c,c.node_path.contains("/adopt/") && c.op=="command_execution").all(c,c.worktree[".c2/config.yaml"]=="packages:
      []\n")'
  - type: cel_true
    expr: calls.filter(c,c.op=="recipes.run").all(c,c.inputs.recipes[0].inputs.config==c.inputs.recipes[0].inputs.approved.config
      && c.inputs.recipes[0].inputs.requests==c.inputs.recipes[0].inputs.approved.requests)
