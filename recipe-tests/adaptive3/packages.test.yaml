        attachments: []
        settings: {}
    observe_files:
    - .c2/config.yaml
  inputs:
    requests: &id002
    - reference: uv:pytest==8.3.5
      check:
      - pytest
      - --version
    reason: Run local tests
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Add pytest for local tests.
            title: Approve pytest for local tests
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            - document_id: review/config.yaml
              title: Supporting evidence
              description: Check the evidence for this result.
              role: supporting
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Add pytest for local tests.
        artifacts:
          review/README.md: '# Add pytest

            Run local tests.'
          review/config.yaml: 'packages: ["uv:pytest==8.3.5"]

            '
    - match:
        op: recipes.run
      behavior:
        mode: return
        effects:
          children:
          - recipe: package-probe.yaml
            cell: root
            inputs:
              config:
                kind: value
                name: review/config.yaml
                format: text
                value: 'packages: ["uv:pytest==8.3.5"]

                  '
              requests: *id002
            await: terminal
            bind: probe
        outputs_expr: '{"job_ids":[children.probe]}'
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.session ==
      calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/prepare/"))[0].outputs.session
  - type: cel_true
    expr: outputs.result.status=="passed"
  - type: cel_true
    expr: events.filter(e,e.kind=="response_release")[0].position < events.filter(e,e.kind=="child_submitted")[0].position
  - type: cel_true
    expr: events.filter(e,e.kind=="child_terminal")[0].position < events.filter(e,e.kind=="operation_entry" && e.node_path.contains("/adopt/"))[0].position
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/probe/probe") && c.outputs.stdout.contains("pytest 8.3.5"))
  - type: cel_true
    expr: calls.filter(c,c.op=="recipes.run").all(c,c.inputs.recipes[0].inputs.config==c.inputs.recipes[0].inputs.approved.config
      && c.inputs.recipes[0].inputs.requests==c.inputs.recipes[0].inputs.approved.requests)
