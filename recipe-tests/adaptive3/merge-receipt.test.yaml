  id: cell-producer
  runtime:
    cells:
      root:
        files:
          README.md: Target repository
        file_sources:
          receipt-producer.yaml: receipt-producer.yaml
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
          receipt-proxy/op.yaml: receipt-proxy/op.yaml
      upstream:
        files:
          README.md: Distinct upstream repository
        file_sources:
          receipt-producer.yaml: receipt-producer.yaml
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
          receipt-proxy/op.yaml: receipt-proxy/op.yaml
    responses:
      - node_path: receipt-producer/approve
        response:
          direction: accept
          feedback: ""
          attachments: []
          settings: {}
        cell: upstream
  inputs:
    scenario: cell
  assertions:
    - type: cel_true
      expr: '!("marker.txt" in repositories.root.files) && repositories.upstream.files["marker.txt"]=="accepted change\n"'
    - type: cel_true
      expr: size(calls.filter(c,c.op=="merge"))==1
    - type: cel_true
      expr: outputs.result.status=="stuck"
    - type: cel_true
