          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
          receipt-proxy/op.yaml: receipt-proxy/op.yaml
    responses:
      - node_path: receipt-producer/approve
        response:
          direction: accept
          feedback: ""
          attachments: []
          settings: {}
        cell: upstream
  inputs:
    scenario: dependency
  assertions:
    - type: cel_true
      expr: repositories.root.files["marker.txt"]=="target accepted\n" && repositories.upstream.files["marker.txt"]=="accepted change\n"
    - type: cel_true
      expr: size(calls.filter(c,c.op=="merge" && c.cell=="root"))==1 && size(calls.filter(c,c.op=="merge" && c.cell=="upstream"))==1
    - type: cel_true
      expr: outputs.result.status=="ready" && outputs.result.publication.merged_hash!=outputs.original.merged_hash
