recipe: diagnostic-child.yaml
cases:
- id: negative-finding-is-successful-collection
  type: integration_case
  inputs:
    passes: false
    acceptance: false
  assertions:
  - type: output_equals
    path: probe_passed
    value: false
  - type: cel_true
    expr: outputs.summary.contains("not importable")
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  runtime: {}
- id: negative-acceptance-fails
  type: integration_case
  inputs:
    passes: false
    acceptance: true
  expect_error: command execution failed
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  runtime: {}
- id: positive-acceptance-passes
  type: integration_case
  inputs:
    passes: true
    acceptance: true
  assertions:
  - type: output_equals
    path: probe_passed
    value: true
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  runtime: {}
