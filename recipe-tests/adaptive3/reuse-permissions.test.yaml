  mocks: &continuation_commands
    ops:
      - match:
          op: command_execution
        repeat: true
        behavior:
          mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="failed"
  - type: cel_true
    expr: '!outputs.probe.probe_published'
  - type: cel_true
