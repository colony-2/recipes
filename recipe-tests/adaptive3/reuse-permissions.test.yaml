- id: denied-include
  type: integration_case
  runtime:
    secrets:
      codex_api_key: synthetic-test-key
    cells:
      root:
        files:
          README.md: Fixture consumer.
          .c2/recipes/reuse-probe.yaml: '{"schema_version": 2, "id": "reuse-probe", "input_schema": {"prompt": {"type":
            "string"}}, "sequence": [{"id": "work", "include": "FOREIGN", "perms": {"jobdb": {}}, "inputs": {"purpose":
            "advice", "request": "Explain current draft storage."}}], "outputs": {"result": "${{ sequence.work.outputs.result
            }}"}}'
        file_sources:
          .test/library/recipes: ../../recipes
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      required: false
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: (outputs.result.status=="completed" && outputs.result.outputs.result.status=="stuck") || outputs.result.status
      in ["failed","rejected"]
  - type: cel_true
    expr: '(outputs.result.status == "rejected" ? outputs.submission_error : outputs.result.status == "failed" ?
      outputs.result.failure_message : outputs.result.outputs.result.summary).contains("codex_api_key")'
