# Complete isolated build and native task credential boundaries.
- id: relative-build
  type: integration_case
  inputs:
    scenario: relative-build
  runtime: &continuation_runtime
    secrets:
      codex_api_key: synthetic-model-key
      checkout_read: synthetic-read-key
      checkout_write: synthetic-write-key
      checkout_alternate: synthetic-alternate-key
      unrelated_token: synthetic-unrelated-key
    config:
      _c2j_git_profile_read:
        version: 1
        entries:
          - url: https://fixture.invalid/
            username: fixture
            secret_ref: checkout_read
      _c2j_git_profile_write:
        version: 1
        entries:
          - url: https://fixture.invalid/
            username: fixture
            secret_ref: checkout_write
      _c2j_git_profile_alternate:
        version: 1
        entries:
          - url: https://fixture.invalid/
            username: fixture
            secret_ref: checkout_alternate
      git-profile-ro: read
      git-profile-rw: write
    cells:
      root:
        files:
          README.md: |
            Application baseline.
        file_sources:
          .test/library/build.yaml: ../../build.yaml
          .test/library/adaptive3.yaml: ../../adaptive3.yaml
          .test/library/recipes: ../../recipes
          .test/continuation-permissions.py: fixtures/continuation-permissions.py
      outside:
        files:
          README.md: |
            Excluded target.
    observe_files:
      - recovered.txt
      - marker.txt
      - continuation.yaml
      - build.yaml
      - adaptive3.yaml
      - recipes
      - .test
    responses:
      - node_path: continuation-caller/continuation/continuation-body/build/root/workflow/adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
        response:
          direction: accept
          feedback: ""
          attachments: []
          settings: {}
      - node_path: continuation-caller/continuation/continuation-body/build/root/workflow/adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
        response:
          direction: accept
          feedback: ""
          attachments: []
          settings: {}
  mocks: &continuation_models
    ops:
      - match:
          selector: nix:github:colony-2/c2ops/published#codex
        behavior:
          mode: return
          outputs:
            status: completed
            output_schema_valid: true
            response:
              status: ready
              summary: Current work is ready.
              title: Review the requested outcome
              primary: review/README.md
              work_kind: feature
              document_details:
                - document_id: review/README.md
                  title: Requested outcome
                  description: Read the proposed result and decision.
                  role: primary
                  order: 10
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: Current work is ready.
          artifacts:
            review/README.md: |
              # Requested outcome
      - match:
          selector: nix:github:colony-2/c2ops/published#codex
        behavior:
          mode: return
          outputs:
            status: completed
            output_schema_valid: true
            response:
              status: passed
              summary: Checked the assignment.
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: Checked the assignment.
      - match:
          selector: nix:github:colony-2/c2ops/published#codex
        behavior:
          mode: return
          outputs:
            status: completed
            output_schema_valid: true
            response:
              status: ready
              summary: Current work is ready.
              title: Review the requested outcome
              primary: review/README.md
              work_kind: feature
              document_details:
                - document_id: review/README.md
                  title: Requested outcome
                  description: Read the proposed result and decision.
                  role: primary
                  order: 10
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: Current work is ready.
          artifacts:
            review/README.md: '# Test plan'
      - match:
          selector: nix:github:colony-2/c2ops/published#codex
        behavior:
          mode: return
          outputs:
            status: completed
            output_schema_valid: true
            response:
              status: passed
              summary: Checked the assignment.
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: Checked the assignment.
      - match:
          selector: nix:github:colony-2/c2ops/published#codex
        behavior:
          mode: return
          outputs:
            status: completed
            output_schema_valid: true
            response:
              status: ready
              summary: Current work is ready.
              title: Review the requested outcome
              primary: review/README.md
              work_kind: feature
              document_details:
                - document_id: review/README.md
                  title: Requested outcome
                  description: Read the proposed result and decision.
                  role: primary
                  order: 10
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: Current work is ready.
            worktree:
              marker.txt: |
                done
          artifacts:
            review/README.md: '# Implementation'
      - match:
          selector: nix:github:colony-2/c2ops/published#codex
        behavior:
          mode: return
          outputs:
            status: completed
            output_schema_valid: true
            response:
              status: passed
              summary: Checked the assignment.
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: Checked the assignment.
      - match:
          selector: nix:github:colony-2/c2ops/published#codex
        behavior:
          mode: return
          outputs:
            status: completed
            output_schema_valid: true
            response:
              status: ready
              summary: Current work is ready.
              title: Review the requested outcome
              primary: review/README.md
              work_kind: feature
              document_details:
                - document_id: review/README.md
                  title: Requested outcome
                  description: Read the proposed result and decision.
                  role: primary
                  order: 10
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: Current work is ready.
          artifacts:
            review/README.md: |-
              # Outcome
              A marker was added.
      - match:
          selector: nix:github:colony-2/c2ops/published#codex
        behavior:
          mode: return
          outputs:
            status: completed
            output_schema_valid: true
            response:
              status: passed
              summary: Checked the assignment.
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: Checked the assignment.
      - match:
          op: command_execution
        repeat: true
        behavior:
          mode: passthrough
      - match:
          op: squash
        repeat: true
        behavior:
          mode: passthrough
      - match:
          op: merge
        repeat: true
        behavior:
          mode: passthrough
      - match:
          selector: ./recipes/review-v2
        repeat: true
        behavior:
          mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="completed" && outputs.result.outputs.result.result.merge.merged_hash!=""
  - type: cel_true
    expr: outputs.probe.read.resolved && outputs.probe.publication.resolved && outputs.probe.probe_published
  - type: cel_true
    expr: repositories.root.files["recovered.txt"]=="saved application draft\n" && repositories.root.files["marker.txt"]=="done\n"
  - type: cel_true
    expr: calls.exists(c,c.op=="merge" && c.node_path.endsWith("/publication_credentials")) && size(calls.filter(c,c.op=="merge"))==2
  - type: cel_true
    expr: outputs.result.outputs.result.preflight.submission_allowed==true
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/start_work/start_work") && c.worktree["recovered.txt"]=="saved application draft\n")
  - type: cel_true
    expr: outputs.probe.application_files==["README.md","marker.txt","recovered.txt"] && outputs.probe.application_hash==outputs.result.outputs.result.result.merge.merged_hash
  - type: cel_true
    expr: size(outputs.result.outputs.result.child_jobs)==1
  - type: cel_true
    expr: outputs.probe.publication.profile_secret=="checkout_write"
  - type: cel_true
    expr: calls.exists(c,c.op=="command_execution" && c.node_path.endsWith("/preflight") && c.inputs.env.MODEL=="[REDACTED]")
