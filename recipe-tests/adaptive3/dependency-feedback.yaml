schema_version: 2
id: dependency-feedback-test
input_schema:
  workflow_inputs:
    type: object
    required: true
inputs:
  workflow_inputs: ${{ inputs.workflow_inputs }}
sequence:
- id: workflow
  op: recipe.run_and_get_result
  inputs:
    # Pair the caller and receiver from this disposable fixture, including its queue op.
    name: ${{ 'git+' + context.git.repo + '//adaptive3.yaml@main' }}
    inputs: ${{ inputs.workflow_inputs }}
outputs:
  work_kind: ${{ sequence.workflow.outputs.outputs.work_kind }}
  merge: ${{ sequence.workflow.outputs.outputs.merge }}
  reviews: ${{ sequence.workflow.outputs.outputs.reviews }}
