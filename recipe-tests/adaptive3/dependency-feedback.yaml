schema_version: 2
id: dependency-feedback-test
input_schema:
  workflow_inputs:
    type: object
    required: true
inputs:
  workflow_inputs: ${{ inputs.workflow_inputs }}
sequence:
- id: submit
  op: recipes.run
  inputs:
    git_ref: ${{ context.git.ref }}
    recipes: ${{ [{'name':'git+' + context.git.repo + '//adaptive3.yaml@main','cell_name':context.workflow.cell,'inputs':inputs.workflow_inputs,'git':{'base_repo':context.git.repo,'base_ref':context.git.ref,'base_hash':context.git.resolved_hash} }] }}
- id: workflow
  op: recipe.await_result
  inputs:
    target: {job: "${{ sequence.submit.outputs.job_ids[0] }}"}
outputs:
  work_kind: ${{ sequence.workflow.outputs.outputs.work_kind }}
  merge: ${{ sequence.workflow.outputs.outputs.merge }}
  reviews: ${{ sequence.workflow.outputs.outputs.reviews }}
