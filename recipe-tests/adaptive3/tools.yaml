schema_version: 2
id: tools-test
input_schema:
  check:
    type: string
    required: true
  documents:
    type: artifact_map
    default_value: {}
  title:
    type: string
    default_value: ''
  primary:
    type: string
    default_value: ''
  requests:
    type: array
    default_value: []
    items:
      type: object
  adopted:
    type: boolean
    default_value: false
inputs:
  check: ${{ inputs.check }}
  documents: ${{ inputs.documents }}
  title: ${{ inputs.title }}
  primary: ${{ inputs.primary }}
  requests: ${{ inputs.requests }}
  adopted: ${{ inputs.adopted }}
sequence:
- id: tools
  include: ../../recipes/adaptive3/tools.yaml
  inputs:
    check: ${{ inputs.check }}
    documents: ${{ inputs.documents }}
    title: ${{ inputs.title }}
    primary: ${{ inputs.primary }}
    requests: ${{ inputs.requests }}
    adopted: ${{ inputs.adopted }}
outputs:
  result: ${{ sequence.tools.outputs.result }}
  artifacts: ${{ sequence.tools.outputs.artifacts }}
