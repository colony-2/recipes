schema_version: 2
id: tools-test
input_schema:
  check:
    type: string
    required: true
  documents:
    type: artifact_map
    default_value: {}
  title:
    type: string
    default_value: ''
  primary:
    type: string
    default_value: ''
  document_details:
    type: array
    default_value: []
    items:
      type: object
  requests:
    type: array
    default_value: []
    items:
      type: object
  write:
    type: boolean
    default_value: false
  approved:
    type: object
    default_value: {}
inputs:
  check: ${{ inputs.check }}
  documents: ${{ inputs.documents }}
  title: ${{ inputs.title }}
  primary: ${{ inputs.primary }}
  document_details: ${{ inputs.document_details }}
  requests: ${{ inputs.requests }}
  write: ${{ inputs.write }}
  approved: ${{ inputs.approved }}
sequence:
- id: tools
  include: ../../recipes/adaptive3/tools.yaml
  inputs:
    check: ${{ inputs.check }}
    documents: ${{ inputs.documents }}
    title: ${{ inputs.title }}
    primary: ${{ inputs.primary }}
    document_details: ${{ inputs.document_details }}
    requests: ${{ inputs.requests }}
    write: ${{ inputs.write }}
    approved: ${{ inputs.approved }}
outputs:
  result: ${{ sequence.tools.outputs.result }}
  artifacts: ${{ sequence.tools.outputs.artifacts }}
  document_metadata: ${{ sequence.tools.outputs.document_metadata }}
