name: receipt-proxy-fixture
version: 1.0.0
python:
  requires-python: ">=3.10"
  dependencies: []
command: [python3, -c, 'import json,sys; json.dump({"output":json.load(sys.stdin)["receipt"]},sys.stdout)']
input_schema:
  type: object
  required: [receipt]
  properties:
    receipt: {type: object}
output_schema:
  type: object
