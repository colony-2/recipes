recipe: package-binding-child.yaml
cases:
- id: native-child-consumes-original-stored-proposal-binding
  type: integration_case
  runtime:
    observe_files: [.c2/config.yaml]
    cells:
      root:
        files:
          README.md: Stored proposal identity must survive a real child submission.
        file_sources:
          .c2/recipes/package-probe.yaml: ../../recipes/adaptive3/package-probe.yaml
          .c2/recipes/tools.yaml: ../../recipes/adaptive3/tools.yaml
  mocks:
    ops:
    - match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: outputs.child.status=="completed" && outputs.child.outputs.status=="passed" && outputs.result.status=="passed"
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/probe/probe") && c.outputs.stdout.contains("pytest 8.3.5"))
  - type: cel_true
    expr: events.filter(e,e.kind=="fixture_return" && e.node_path.endsWith("/probe/probe"))[0].position < events.filter(e,e.kind=="operation_entry" && e.node_path.contains("/adopt/"))[0].position
