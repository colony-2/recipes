recipe: collections.yaml
cases:
- id: native-collection-32-files
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Collection fixture
  inputs:
    count: 32
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.delivered==32 && outputs.references>=32 && outputs.reference_bytes>32*100
- id: native-collection-1024-files
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Collection fixture
  inputs:
    count: 1024
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.delivered==1024 && outputs.references>=1024 && outputs.reference_bytes>1024*100
