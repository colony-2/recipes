id: scenario-verify
inputs:
  candidate: ${{ inputs.candidate }}
sequence:
- id: check
  op: command_execution
  const: true
  inputs:
    env:
      CANDIDATE: ${{ inputs.candidate }}
    run: |
      set -eu
      test "$(git rev-parse HEAD)" = "$CANDIDATE"
      test ! -e rejected.txt
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: Checked this assembled tip.
  artifact_refs: {}
