id: ordinary-scenario
sequence:
- id: edit
  op: command_execution
  inputs: {run: "printf 'ordinary\n' > ordinary.txt"}
- id: execute
  include: ../../../../recipes/adaptive3/execute.yaml
  inputs:
    purpose: integration
    verification:
      commit_message: "Record the marker\n\nPreserve the accepted marker.\n\nJob: https://jobs.colony2.com/fixture/jobs/implement"
    request: Publish the ordinary candidate
    target_directory: .
    documents: {}
    settings: {}
