schema_version: 2
id: scenario-receiver
input_schema:
  branch: {type: string}
  verification_policy: {type: object}
inputs:
  branch: ${{ inputs.branch }}
  verification_policy: ${{ inputs.verification_policy }}
sequence:
- id: production
  include: ../../merge-batch.yaml
  inputs:
    branch: ${{ inputs.branch }}
    verification_policy: ${{ inputs.verification_policy }}
outputs:
  version: ${{ sequence.production.outputs.version }}
  branch: ${{ sequence.production.outputs.branch }}
  requested: ${{ sequence.production.outputs.requested }}
  results: ${{ sequence.production.outputs.results }}
  publication: ${{ sequence.production.outputs.publication }}
  artifact_refs: ${{ sequence.production.outputs.artifact_refs }}
