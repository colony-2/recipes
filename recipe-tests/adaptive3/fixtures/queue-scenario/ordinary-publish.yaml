id: ordinary-source
inputs:
  candidate: ${{ inputs.candidate }}
  merged_hash: ${{ inputs.merged_hash }}
  target_branch: ${{ inputs.target_branch }}
sequence:
- id: source
  op: command_execution
  const: true
  inputs:
    env:
      CANDIDATE: ${{ inputs.candidate }}
      MERGED: ${{ inputs.merged_hash }}
      BRANCH: ${{ inputs.target_branch }}
    run: |
      set -eu
      test "$(git rev-parse HEAD)" = "$MERGED"
      test "$CANDIDATE" = "$MERGED"
      test "$BRANCH" = refs/heads/main
      test "$(cat ordinary.txt)" = ordinary
      test ! -e advanced.txt
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: Checked the ordinary source.
  artifact_refs: {}
