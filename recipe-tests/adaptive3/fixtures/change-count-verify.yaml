id: change-count-verify
sequence:
- id: check_one
  op: command_execution
  inputs:
    run: test -f README.md
- id: check_two
  op: command_execution
  inputs:
    run: |-
      git rev-parse --git-dir >/dev/null
      if [ -f feature.txt ]; then cat feature.txt; fi
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: Both required checks passed.
  artifact_refs: {}
