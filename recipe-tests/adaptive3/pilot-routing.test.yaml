recipe: ../../adaptive3.yaml
cases:
- id: dispatch-returns-original-result-to-next-delegate-turn
  type: integration_case
  runtime: {}
  inputs:
    prompt: Add the native verify hook.
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: return
        outputs:
          stdout: ''
    includes:
      root/configure/[1]:
      - mode: return
        outputs:
          result:
            status: passed
          settings: {}
      root/delegate:
      - mode: return
        outputs:
          action:
            primitive: present
            instruction: Add the native verify hook.
            documents: []
            presentation: question
          allowed: true
          issue: ''
          session: {}
      - mode: return
        outputs:
          action:
            primitive: withdraw
            instruction: The requester withdrew the assignment.
            documents: []
            presentation: question
          allowed: true
          issue: ''
          session: {}
      root/dispatch:
      - mode: return
        outputs:
          visits: 1
          record:
            documents: {}
            kind: feature
            step: 1
            human_instruction: {job_id: parent, message: Stop the work., receipt: {actor: {kind: human}}}
            reply:
              submission:
                response:
                  feedback: Stop the work.
                receipt:
                  actor:
                    kind: human
          result:
            summary: The requester withdrew the assignment.
            step: 1
  assertions:
  - type: cel_true
    expr: include_calls.filter(c,c.node_path=='root/dispatch').map(c,c.inputs.action.primitive)==['present']
  - type: cel_true
    expr: include_calls.filter(c,c.node_path=='root/delegate')[1].inputs.last.summary==outputs.summary && include_calls.filter(c,c.node_path=='root/delegate')[1].inputs.record.step==1
  - type: cel_true
    expr: outputs.withdrawal.source.receipt.actor.kind=='human' && outputs.merge=={}
