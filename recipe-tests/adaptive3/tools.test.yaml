recipe: tools.yaml
cases:
- id: valid-links
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses: []
  inputs:
    check: review_files
    documents:
      review/README.md:
        kind: value
        name: review/README.md
        format: text
        value: |
          # Review
          [detail](detail.md)
      review/detail.md:
        kind: value
        name: review/detail.md
        format: text
        value: '# Details'
    title: Review usable files
    primary: review/README.md
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: passed
  - type: cel_true
    expr: size(outputs.result.summary)<200
- id: missing-link
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses: []
  inputs:
    check: review_files
    documents:
      review/README.md:
        kind: value
        name: review/README.md
        format: text
        value: |
          # Review
          [missing](absent.png)
      review/detail.md:
        kind: value
        name: review/detail.md
        format: text
        value: '# Details'
    title: Review usable files
    primary: review/README.md
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: changes
  - type: cel_true
    expr: size(outputs.result.summary)<200
