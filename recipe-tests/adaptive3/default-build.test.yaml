recipe: ../../build.yaml
cases:
- id: default-public-explanation
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: build/workflow/adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  inputs:
    prompt: Explain this project.
    title: Review the requested default build
    type: build
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.exists(c,c.node_path.startsWith("build/workflow/adaptive3/")) && !calls.exists(c,c.node_path.contains("adaptive2"))
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.inputs.inputs.prompt.contains("Review the requested default
      build"))
