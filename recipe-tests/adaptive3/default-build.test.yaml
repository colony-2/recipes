    - *id003
    - &id014
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: outcome
            instruction: Outcome the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id015
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects: *author_session
        artifacts:
          review/README.md: |-
            # Outcome
            A marker was added.
    - *id002
    - *id003
    - &id016
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: The checks passed. May we finish this result?
            documents: []
