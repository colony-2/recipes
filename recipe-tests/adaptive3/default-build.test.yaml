recipe: default-build.yaml
cases:
- id: default-public-explanation
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources: &build_sources
          build.yaml: ../../build.yaml
          adaptive3.yaml: ../../adaptive3.yaml
          merge-batch.yaml: ../../merge-batch.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
          recipes/adaptive: ../../recipes/adaptive
          recipes/kernel: ../../recipes/kernel
          recipes/review-v2.yaml: ../../recipes/review-v2.yaml
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: build/workflow/adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    build_inputs:
      prompt: Explain this project.
      title: Review the requested default build
      type: build
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge" || has(c.inputs.grouping))'
  - type: cel_true
    expr: calls.exists(c,c.node_path.startsWith("build/workflow/adaptive3/")) && !calls.exists(c,c.node_path.contains("adaptive2"))
  - type: cel_true
    expr: calls.exists(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.inputs.inputs.prompt.contains("Review
      the requested default build"))
- id: default-public-feature-queued-merge
  type: integration_case
  runtime:
    backend: sqlite
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence:
            - id: verify_marker
              op: command_execution
              inputs:
                run: test "$(cat marker.txt)" = done
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Marker verified.
              artifact_refs: {}
          .c2/recipes/hooks/build/publish.yaml: |
            id: publish
            inputs:
              candidate: ${{ inputs.candidate }}
            sequence:
            - id: publish_marker
              op: command_execution
              inputs:
                env:
                  CANDIDATE: ${{ inputs.candidate }}
                run: |
                  set -eu
                  test "$(git rev-parse HEAD)" = "$CANDIDATE"
                  test "$(cat marker.txt)" = done
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Published the caller commit.
              artifact_refs: {}
        file_sources: *build_sources
    responses:
    - node_path: build/workflow/adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
