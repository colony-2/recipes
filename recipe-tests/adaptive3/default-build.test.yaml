- id: equivalent-merge-retry-uses-original-approval
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/verify.yaml: |
            id: concurrent-upstream
            sequence:
            - id: verify_candidate
              op: command_execution
              inputs:
                run: |
                  set -eu
                  grep -Fx done marker.txt
                  upstream=$(git remote get-url origin)
                  if [ ! -f "$upstream/upstream.txt" ]; then
                    printf 'concurrent upstream change\n' > "$upstream/upstream.txt"
                    git -C "$upstream" add upstream.txt
                    git -C "$upstream" commit -m 'Advance upstream during first verification'
                  fi
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Candidate verified.
              artifact_refs: {}
        file_sources: *build_sources
    responses:
    - node_path: build/workflow/adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: question
        feedback: Why add this marker?
        attachments: []
        settings: {}
    - node_path: build/workflow/adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: build/workflow/adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
    - upstream.txt
  inputs:
    build_inputs:
      prompt: Add a marker file.
      require_verification: true
      title: Review the requested default build
      type: build
      merge_queue: false
  mocks:
    ops:
    - *write_direction
    - *assess_direction
    - *answer_question
    - *prepare_plan
    - *assess_plan
    - *implement_change
    - *assess_implementation
    - *write_outcome
    - *assess_outcome
    - *run_commands
    - *run_rebase
    - *run_squash
    - *run_merge
    - *run_review
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.node_path.contains("/adaptive3-discussion/answer/") && c.op=="extension_execution")[0].inputs.inputs.session ==
      calls.filter(c,c.node_path.contains("/direction/") && c.node_path.contains("/adaptive3-execute/work/") && c.op=="extension_execution")[0].outputs.session
  - type: cel_true
    expr: outputs.merge.merged_hash != "" && repositories.root.files["upstream.txt"] == "concurrent upstream change\n"
  - type: cel_true
    expr: size(reviews) == 3 && size(calls.filter(c,c.op=="merge" && c.node_path.startsWith("build/workflow/adaptive3/"))) == 2
  - type: cel_true
    expr: '!calls.exists(c,has(c.inputs.grouping))'
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.endsWith("/verify_candidate"))) == 2
  - type: cel_true
    expr: calls.exists(c,c.node_path.contains("/recheck_merge/") && c.node_path.endsWith("/approved_change"))
  - type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt))) == 9
- id: default-repository-improvement-hooks
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A cell for recipe improvement.
          .c2/recipes/hooks/build/verify.yaml: |
