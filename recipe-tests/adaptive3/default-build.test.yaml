      match:
        op: rebase
      repeat: true
      behavior:
        mode: passthrough
    - &id019
      match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - &id020
      match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - &id021
      match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/merge-queue
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash.matches("^[0-9a-f]{40}$") && outputs.publication.status=="passed"
  - type: cel_true
    expr: size(calls.filter(c,c.op=="recipes.run" && c.inputs.recipes.exists(r,has(r.grouping))))==1
  - type: cel_true
    expr: size(calls.filter(c,c.op=="merge"))==1 && calls.exists(c,c.op=="merge" && c.node_path.startsWith("adaptive3-merge-batch/"))
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/publish_marker")).size()==1 && calls.filter(c,c.node_path.endsWith("/publish_marker")).all(c,c.node_path.startsWith("adaptive3-merge-batch/"))
  - type: cel_true
    expr: reviews[0].form.request.review_id==reviews[1].form.request.review_id && reviews[0].form.request.documents=={} &&
      reviews[1].form.request.documents=={}
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.startsWith('build/workflow/adaptive3/') && c.op=='extension_execution' && has(c.inputs.inputs.instructions)))==4
      && calls.filter(c,c.op=='extension_execution' && has(c.inputs.inputs.session)).all(c,!has(c.inputs.inputs.instructions))
  - type: cel_true
    expr: repositories.root.files['marker.txt']=='done\n' && size(calls.filter(c,c.node_path.endsWith('/verify_marker')))==1
  - type: cel_true
    expr: reviews[1].form.request.question.contains('lets callers see') && reviews[1].form.request.review_id==reviews[0].form.request.review_id
- id: equivalent-merge-retry-uses-original-approval
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/verify.yaml: |
            id: concurrent-upstream
            sequence:
            - id: verify_candidate
              op: command_execution
              inputs:
                run: |
                  set -eu
                  grep -Fx done marker.txt
                  upstream=$(git remote get-url origin)
                  if [ ! -f "$upstream/upstream.txt" ]; then
                    printf 'concurrent upstream change\n' > "$upstream/upstream.txt"
                    git -C "$upstream" add upstream.txt
                    git -C "$upstream" commit -m 'Advance upstream during first verification'
                  fi
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Candidate verified.
              artifact_refs: {}
        file_sources:
          build.yaml: ../../build.yaml
          adaptive3.yaml: ../../adaptive3.yaml
          merge-batch.yaml: ../../merge-batch.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
          recipes/adaptive: ../../recipes/adaptive
          recipes/kernel: ../../recipes/kernel
          recipes/review-v2.yaml: ../../recipes/review-v2.yaml
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: build/workflow/adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: reply
        feedback: Why add this marker?
        attachments: []
        settings: {}
    - node_path: build/workflow/adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: build/workflow/adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
    - upstream.txt
  inputs:
    build_inputs:
      prompt: Add a marker file.
      require_verification: true
      title: Review the requested default build
      type: build
      merge_queue: false
  mocks:
    ops:
    - *id001
    - *id006
    - *id002
    - *id003
    - *id007
    - *id008
    - *id002
    - *id003
    - *id009
    - *id010
    - *id011
    - *id012
    - *id013
    - *id003
    - *id014
    - *id015
    - *id002
    - *id003
    - *id016
    - *id017
    - *id013
    - *id017
    - *id004
    - *id005
    - *id018
    - *id019
    - *id020
    - *id021
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != "" && repositories.root.files["upstream.txt"] == "concurrent upstream change\n"
  - type: cel_true
    expr: size(reviews) == 3 && size(calls.filter(c,c.op=="merge" && c.node_path.startsWith("build/workflow/adaptive3/")))
      == 2
  - type: cel_true
    expr: reviews[0].form.request.review_id==reviews[1].form.request.review_id && reviews[0].form.request.documents=={} &&
      reviews[1].form.request.documents=={}
  - type: cel_true
    expr: reviews[1].form.request.question.contains('lets callers see') && reviews[1].form.request.review_id==reviews[0].form.request.review_id
- id: default-repository-improvement-hooks
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A cell for recipe improvement.
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            sequence:
            - id: check_repository_guidance
              op: command_execution
              const: true
              inputs:
                env:
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  set -eu
                  test -s guides/self-improvement/README.md
                  test -s guides/self-improvement/BACKGROUND.md
                  test -s guides/self-improvement/AUDITING.md
                  test -s guides/self-improvement/IMPROVING.md
                  test -s AGENTS.md
                  test -s guides/README.md
                  test -s guides/RECIPE_IMPROVEMENT_GUIDE.md
                  test -s .agents/skills/audit-recipe-jobs/SKILL.md
                  test -s .agents/skills/audit-recipe-jobs/agents/openai.yaml
                  cp self-improvement-statements.md "$OUTBOX/test-statements.md"
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Backgrounders are available and verification ran.
              artifact_refs: {}
        file_sources:
          build.yaml: ../../build.yaml
          adaptive3.yaml: ../../adaptive3.yaml
          merge-batch.yaml: ../../merge-batch.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
          recipes/adaptive: ../../recipes/adaptive
          recipes/kernel: ../../recipes/kernel
          recipes/review-v2.yaml: ../../recipes/review-v2.yaml
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
          guides/self-improvement/README.md: ../../guides/self-improvement/README.md
          guides/self-improvement/BACKGROUND.md: ../../guides/self-improvement/BACKGROUND.md
          guides/self-improvement/AUDITING.md: ../../guides/self-improvement/AUDITING.md
          guides/self-improvement/IMPROVING.md: ../../guides/self-improvement/IMPROVING.md
          self-improvement-statements.md: statements.md
          AGENTS.md: ../../AGENTS.md
          guides/README.md: ../../guides/README.md
          guides/RECIPE_IMPROVEMENT_GUIDE.md: ../../guides/RECIPE_IMPROVEMENT_GUIDE.md
          .agents/skills/audit-recipe-jobs/SKILL.md: ../../.agents/skills/audit-recipe-jobs/SKILL.md
          .agents/skills/audit-recipe-jobs/agents/openai.yaml: ../../.agents/skills/audit-recipe-jobs/agents/openai.yaml
    responses:
    - node_path: build/workflow/adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: build/workflow/adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    build_inputs:
      prompt: |-
        Use $audit-recipe-jobs to audit job behavior and implement justified recipe improvements.

        JobDB: http://audit.invalid/c2
        Scope: Jobs created from 2026-11-07T00:00:00Z to 2026-11-08T00:00:00Z; include failed and successful jobs.
        Constraints: Preserve 100% of accepted scope.
        Do not modify audited jobs.
        Inspect review questions and child recovery.
      title: Recipe improvement fixture
      type: build
      documents:
        previous-audit.md:
          kind: value
          name: previous-audit.md
          format: text
          value: 'Prior cohort: repeated requests for retained inputs.'
      require_verification: true
      merge_queue: false
  mocks:
    ops:
    - *id001
    - *id006
    - *id002
    - *id003
    - *id007
    - *id008
    - *id002
    - *id003
    - *id009
    - *id011
    - *id012
    - *id013
    - *id003
    - *id014
    - *id015
    - *id002
    - *id003
    - *id016
    - *id017
    - *id004
    - *id005
    - *id019
    - *id020
    - *id021
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: calls.exists(c,c.node_path.startsWith("build/workflow/adaptive3/")) && !calls.exists(c,c.node_path.contains("adaptive2"))
  - type: cel_true
    expr: calls.exists(c,c.op=="command_execution" && c.inputs.run.contains("test -s guides/self-improvement/README.md"))
