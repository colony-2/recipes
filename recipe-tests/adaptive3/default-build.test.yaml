        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && has(c.inputs.inputs.instructions)))==3
  - type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && has(c.inputs.inputs.session)))==5
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).all(c,!c.node_path.contains("/integration/"))
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: calls.exists(c,c.node_path.startsWith("build/workflow/adaptive3/")) && !calls.exists(c,c.node_path.contains("adaptive2"))
  - type: cel_true
    expr: calls.exists(c,c.op=="command_execution" && c.inputs.run.contains("test -s guides/self-improvement/README.md"))
