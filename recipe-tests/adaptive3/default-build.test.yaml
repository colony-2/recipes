recipe: default-build.yaml
cases:
- id: default-public-explanation
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          build.yaml: ../../build.yaml
          adaptive3.yaml: ../../adaptive3.yaml
          merge-batch.yaml: ../../merge-batch.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
          recipes/adaptive: ../../recipes/adaptive
          recipes/kernel: ../../recipes/kernel
          recipes/review-v2.yaml: ../../recipes/review-v2.yaml
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
  inputs:
    build_inputs:
      prompt: Explain this project.
      title: Review the requested default build
      type: build
  mocks:
    ops:
    - &id001
      match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Direction the assigned work.
            documents: []
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects: &author_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &id002
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Assess the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id003
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - &id004
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: finish
            instruction: The requested work is complete.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id005
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge" || has(c.inputs.grouping))'
  - type: cel_true
    expr: calls.exists(c,c.node_path.startsWith("build/workflow/adaptive3/")) && !calls.exists(c,c.node_path.contains("adaptive2"))
  - type: cel_true
    expr: calls.exists(c,has(c.inputs.inputs.prompt) && c.inputs.inputs.prompt.contains('# Review the requested default build\n\nExplain
      this project.'))
- id: default-public-feature-queued-merge
  type: integration_case
  runtime:
    backend: sqlite
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence:
            - id: verify_marker
              op: command_execution
              inputs:
                run: test "$(cat marker.txt)" = done
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Marker verified.
              artifact_refs: {}
          .c2/recipes/hooks/build/publish.yaml: |
            id: publish
            inputs:
              candidate: ${{ inputs.candidate }}
            sequence:
            - id: publish_marker
              op: command_execution
              inputs:
                env:
                  CANDIDATE: ${{ inputs.candidate }}
                run: |
                  set -eu
                  test "$(git rev-parse HEAD)" = "$CANDIDATE"
                  test "$(cat marker.txt)" = done
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Published the caller commit.
              artifact_refs: {}
        file_sources:
          build.yaml: ../../build.yaml
          adaptive3.yaml: ../../adaptive3.yaml
          merge-batch.yaml: ../../merge-batch.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
          recipes/adaptive: ../../recipes/adaptive
          recipes/kernel: ../../recipes/kernel
          recipes/review-v2.yaml: ../../recipes/review-v2.yaml
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: build/workflow/adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: reply
        feedback: Why add this marker?
        attachments: []
        settings: {}
    - node_path: build/workflow/adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: build/workflow/adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    build_inputs:
      prompt: Add a marker file.
      title: Review the requested default build
      type: build
      require_verification: true
  mocks:
    ops:
    - *id001
    - &id006
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects: *author_session
        artifacts:
          review/README.md: |
            # Requested outcome
    - *id002
    - *id003
    - &id007
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: preparation
            instruction: Preparation the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id008
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/design.md
              title: Design
              description: Review how the marker will be written.
              role: supporting
              order: 0
            - document_id: review/acceptance.md
              title: Acceptance criteria
              description: Review the expected marker contents.
              role: supporting
              order: 1
            - document_id: review/one-pager.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/one-pager.md
            work_kind: feature
        effects:
          objects: *author_session
        artifacts:
          review/one-pager.md: Add the marker. [Design](design.md) and [Acceptance criteria](acceptance.md).
          review/design.md: Write the requested marker to the repository.
          review/acceptance.md: The marker contains the requested value.
    - *id002
    - *id003
    - &id009
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: Shall we make this change?
            documents: []
            presentation: plan
        effects:
          objects: *checked_session
    - &id010
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: The marker lets callers see that the job finished. Shall we add it?
            documents: []
            presentation: plan
        effects:
          objects: *checked_session
    - &id011
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: implement
            instruction: Implement the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id012
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
