recipe: publication-ref.yaml
cases:
  - id: same-cell-implicit
    type: integration_case
    runtime:
      cells:
        root:
          files:
            published.txt: root-published
          file_sources:
            .c2/recipes/publication-probe.yaml: publication-probe.yaml
        storage:
          files:
            published.txt: storage-published
          file_sources:
            .c2/recipes/publication-probe.yaml: publication-probe.yaml
      observe_files:
        - published.txt
        - caller-only.txt
    inputs:
      cell: root
      explicit_workspace: false
    mocks:
      ops:
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: ready
                summary: I can publish the local API independently.
                title: Publish the local API enhancement
                assignment: Implement the local API enhancement.
                work_kind: feature
                delivery_recipe: publication-probe
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: publication-ref
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: passed
                summary: Assignment checked.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: publication-ref
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: accepted
                summary: Assignment accepted.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: publication-ref
        - match:
            op: command_execution
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.result.status=="ready" && outputs.result.child.status=="completed"
      - type: cel_true
        expr: size(calls.filter(c,c.op=="recipes.run"))==1 && calls.filter(c,c.op=="recipes.run").all(c,c.inputs.git_ref=="main" && c.inputs.recipes[0].git.base_ref=="main")
      - type: cel_true
        expr: outputs.caller_saved=="unpublished-caller"
      - type: cel_true
        expr: calls.filter(c,c.op=="extension_execution").all(c,!("caller-only.txt" in c.worktree))
      - type: cel_true
        expr: calls.exists(c,c.node_path=="publication-probe/inspect_start" && c.cell=="root" && c.worktree["published.txt"]=="root-published" && !("caller-only.txt" in c.worktree))
