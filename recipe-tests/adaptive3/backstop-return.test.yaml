recipe: backstop-return.yaml
cases:
- id: reentry-starts-fresh-work-visit
  type: integration_case
  runtime: {}
  inputs:
    result:
      status: resume
      stage: implementation
      additional_attempts: 1
    problem: &id001
      loop: work
      budget: &id002
        stage: implementation
        counts:
          work: 3
        limits:
          work: 3
  assertions:
  - type: cel_true
    expr: '!has(outputs.result.budget) && !has(outputs.result.visit_allowance)'
  - type: cel_true
    expr: outputs.retry.automatic_used==1
- id: phase-hop-does-not-replenish-another-budget
  type: integration_case
  runtime: {}
  inputs:
    result:
      status: resume
      stage: direction
      additional_attempts: 1
    problem: *id001
  assertions:
  - type: cel_true
    expr: '!has(outputs.result.budget)'
  - type: cel_true
    expr: outputs.retry.automatic_used==1
- id: new-human-instruction-renews-finite-automatic-allowance
  type: integration_case
  runtime: {}
  inputs:
    result:
      status: resume
      stage: implementation
      additional_attempts: 1
      human:
        receipt:
          submission_id: native-2
    problem: *id001
    retry: {automatic_used: 2, instructions: [native-1]}
  assertions:
  - type: cel_true
    expr: outputs.retry.automatic_used==1 && outputs.retry.instructions==["native-1","native-2"]
- id: duplicate-human-receipt-does-not-renew-allowance
  type: integration_case
  runtime: {}
  inputs:
    result:
      status: resume
      stage: implementation
      additional_attempts: 1
      human:
        receipt:
          submission_id: native-1
    problem: *id001
    retry: {automatic_used: 2, instructions: [native-1]}
  assertions:
  - type: cel_true
    expr: outputs.retry.automatic_used==3 && outputs.retry.instructions==["native-1"]
- id: merge-allowance-does-not-change-for-direction
  type: integration_case
  runtime: {}
  inputs:
    result:
      status: resume
      stage: direction
      additional_attempts: 1
    problem:
      loop: merge
      budget: *id002
  assertions:
  - type: cel_true
    expr: outputs.merge_limit==3 && !has(outputs.result.budget)
