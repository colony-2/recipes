schema_version: 2
id: package-restore-proposal
sequence:
- id: write_proposal
  op: command_execution
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      mkdir -p .c2 "$OUTBOX/review" "$OUTBOX/error"
      printf 'packages: []\nname: proposal-workspace\n' > .c2/config.yaml
      printf 'proposal\n' > candidate.txt
      printf 'name: retained-candidate\npackages: ["nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3", "pnpm:typescript@5.7.3"]\n' > "$OUTBOX/review/config.yaml"
      printf '# Configuration\n[Details](detail.md)\n' > "$OUTBOX/review/README.md"
      printf 'Retain all candidate settings.\n' > "$OUTBOX/review/detail.md"
      printf 'Not a review document.\n' > "$OUTBOX/error/proposal.log"
outputs:
  artifact_refs: ${{ sequence.write_proposal.artifacts }}
