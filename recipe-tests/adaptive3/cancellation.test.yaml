recipe: ../../adaptive3.yaml
cases:
- id: native-human-cancellation-stays-cancelled
  type: integration_case
  inputs:
    prompt: Explain the project.
  runtime:
    backend: sqlite
    cells:
      root:
        files:
          README.md: Keep this work when the human stops the job.
    controls:
      snapshot:
        files:
        - README.md
      barriers:
      - id: direction
        match:
          selector: nix:github:colony-2/c2ops/published#codex
          node_path: adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/execute/execute/adaptive3-execute/work/work/adaptive3-agent/start_read_only/start_read_only
          cell: root
          occurrence: 1
          attempt: 1
      actions:
      - 'on': direction.entered
        do: cancel_job
  assertions:
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/backstop/") || c.op=="recipes.run" || c.op=="merge")'
