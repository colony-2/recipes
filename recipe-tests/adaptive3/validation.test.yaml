recipe: ../../build.yaml
cases:
- id: required-specialist-repeats-full-validation
  type: integration_case
  runtime:
    cells: &id008
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/configure.yaml: |
            id: configure
            sequence: []
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Review tenant isolation.
              artifact_refs: {}
              settings:
                prompt_additions:
                  plan_assessment: Preserve the explicitly local scope; no deployment.
                consultations:
                - key: security
                  checkpoint: before_design
                  role: Security reviewer
                  request: Check isolation between users.
                  required: true
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
  inputs:
    prompt: Explain this project.
    title: Review the requested default build
    type: build
  mocks:
    ops:
    - &id001
      match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Direction the assigned work.
            documents: []
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - &id002
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects: &author_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &id003
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Assess the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id005
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Explain which user can read the saved draft.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Explain which user can read the saved draft.
    - &id004
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - *id001
    - *id002
    - *id003
    - &id009
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: The corrected proposal isolates each user.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The corrected proposal isolates each user.
    - *id004
    - &id006
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: finish
            instruction: The requested work is complete.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id007
      match:
        op: command_execution
      repeat: true
      required: false
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/review_files/")))==2
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.node_path.contains("/validate/")).all(c,c.inputs.inputs.prompt.contains("Preserve
      the explicitly local scope; no deployment."))
