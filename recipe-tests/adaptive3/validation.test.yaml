recipe: ../../build.yaml
cases:
- id: required-specialist-repeats-full-validation
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/configure.yaml: |
            id: configure
            sequence: []
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Review tenant isolation.
              artifact_refs: {}
              settings:
                prompt_additions:
                  plan_assessment: Preserve the explicitly local scope; no deployment.
                consultations:
                - key: security
                  checkpoint: before_design
                  role: Security reviewer
                  request: Check isolation between users.
                  required: true
    responses:
    - node_path: build/workflow/adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  inputs:
    prompt: Explain this project.
    title: Review the requested default build
    type: build
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Explain which user can read the saved draft.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Explain which user can read the saved draft.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: The corrected proposal isolates each user.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The corrected proposal isolates each user.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      required: false
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/execute/") && c.op=="extension_execution"))==2
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/review_files/")))==2
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/validate/")).all(c,c.inputs.inputs.prompt.contains("Preserve
      the explicitly local scope; no deployment."))
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && c.inputs.inputs.prompt.contains("Explain
      which user"))
