  inputs:
    purpose: implementation
    request: Use the owner result to complete the local implementation.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/change.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: The owner result is sufficient; continue this implementation.
            title: Review the implemented change
            primary: review/change.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The owner result is sufficient; continue this implementation.
          children:
          - recipe: ../../ask.yaml
            cell: root
            inputs:
              title: Confirm staging version
              question: Are staging workers running abc123?
            bind: question
        artifacts:
          review/change.md: '# Current implementation

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/change.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: The owner result is sufficient; continue this implementation.
            title: Review the implemented change
            primary: review/change.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The owner result is sufficient; continue this implementation.
        artifacts:
          review/change.md: '# Current implementation

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: The local work and owner outcome satisfy the request.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The local work and owner outcome satisfy the request.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: size(events.filter(e,e.kind=="child_submitted"))==1
  - type: cel_true
    expr: size(calls.filter(c,c.op=="recipe.await_result_soft"))==1
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && c.inputs.inputs.prompt.contains(calls.filter(w,w.op=="recipe.await_result_soft")[0].inputs.target.job)
      && c.inputs.inputs.prompt.contains("completed"))
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/backstop/"))'
  - type: cel_true
    expr: calls.filter(c,c.op=="recipe.await_result_soft")[0].inputs.target.job==events.filter(e,e.kind=="child_submitted")[0].job_id
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/"))[1].node_path.contains("/resume_work/")
  - &resume_without_guide
    type: cel_true
    expr: >-
      calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/resume_work/")).all(c,
        !("instructions" in c.inputs.inputs) && !c.inputs.inputs.prompt.contains("WORKING_IN_C2.md") &&
        (!has(c.artifacts) || !("C2-guide.md" in c.artifacts)))
  - type: cel_true
    expr: size(reviews)==1 && reviews[0].form.request.question=="Are staging workers running abc123?"
  - type: cel_true
    expr: events.filter(e,e.kind=="response_release")[0].job_id==events.filter(e,e.kind=="child_submitted")[0].job_id
  - type: cel_true
    expr: calls.filter(c,c.op=="recipe.await_result_soft")[0].outputs.outputs.native.receipt==reviews[0].receipt
      && calls.filter(c,c.op=="recipe.await_result_soft")[0].outputs.outputs.native.response.feedback.size()>2000
