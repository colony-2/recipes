- id: exhausted-upstream-chases-never-enter-healthy-publisher
  type: integration_case
  inputs:
    scenario: ordinary
  runtime:
    backend: sqlite
    cells:
      root:
        file_sources:
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence:
            - id: advance
              op: command_execution
              const: true
              inputs:
                run: 'set -eu

                  writer=$(mktemp -d)

                  trap ''rm -rf "$writer"'' EXIT

                  git clone -q --branch main "$(git remote get-url origin)" "$writer"

                  git -C "$writer" -c user.name=Race -c user.email=race@example.test commit -q
                  --allow-empty -m ''Advance every checked base''

                  git -C "$writer" push -q origin HEAD:refs/heads/main

                  '
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Checked assembled source.
              artifact_refs: {}
          .c2/recipes/hooks/build/publish.yaml: |
            id: selection-publish
            inputs:
              candidate: ${{ inputs.candidate }}
              merged_hash: ${{ inputs.merged_hash }}
              branch: ${{ inputs.target_branch }}
            sequence:
            - id: source
              op: command_execution
              const: true
              inputs:
                env:
                  CANDIDATE: ${{ inputs.candidate }}
                  MERGED: ${{ inputs.merged_hash }}
                  BRANCH: ${{ inputs.branch }}
                run: |
                  set -eu
                  test "$(git rev-parse HEAD)" = "$CANDIDATE"
                  test "$CANDIDATE" = "$MERGED"
                  test "$BRANCH" = refs/heads/main
                  test -f change.txt
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Published the selected native source.
              artifact_refs: {}
  mocks:
    ops:
    - match:
        selector: ./recipes/merge-queue
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.op=='merge').size()==4 && !calls.exists(c,c.node_path.endsWith('/selection-publish/source'))
  expect_error: Target branch advanced beyond the prepared base
- id: failed-final-verification-never-enters-healthy-publisher
  type: integration_case
  runtime:
    backend: sqlite
    cells:
      root:
        file_sources:
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence:
            - id: test
              op: command_execution
              inputs:
                run: |
                  if [ -f change.txt ] && { [ -f program ] || [ -f third.txt ]; }; then
                    echo failed
                  else
                    echo passed
                  fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.test.outputs.stdout }}
              summary: Older work and younger work are incompatible.
              artifact_refs: {}
          .c2/recipes/hooks/build/publish.yaml: |
            id: selection-publish
            inputs:
              candidate: ${{ inputs.candidate }}
              merged_hash: ${{ inputs.merged_hash }}
              branch: ${{ inputs.target_branch }}
            sequence:
            - id: source
              op: command_execution
              const: true
              inputs:
                env:
                  CANDIDATE: ${{ inputs.candidate }}
                  MERGED: ${{ inputs.merged_hash }}
                  BRANCH: ${{ inputs.branch }}
                run: |
                  set -eu
                  test "$(git rev-parse HEAD)" = "$CANDIDATE"
                  test "$CANDIDATE" = "$MERGED"
                  test "$BRANCH" = refs/heads/main
                  test -f change.txt
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Published the selected native source.
              artifact_refs: {}
  inputs:
    scenario: ordinary
  mocks:
    ops:
    - match:
        node_path: merge-queue-selection-test/batch/adaptive3-merge-queue-batch/land/land/adaptive3-merge-queue-land/final/final/adaptive3-merge-queue-check/verify/adaptive3-verify-candidate/run/run/adaptive3-hooks/verify/verify/root/test
      behavior:
        mode: return
        outputs:
          success: true
          exit_code: 0
          stdout: failed
          stderr: ''
    - match:
        selector: ./recipes/merge-queue
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: '!calls.exists(c,c.op==''merge'' || c.node_path.endsWith(''/selection-publish/source''))
      && calls.exists(c,c.node_path.contains(''/final/'') && c.outputs.stdout==''failed'')'
  - type: cel_true
    expr: >-
      repositories.root.new_commits==0 && !calls.exists(c,c.node_path.contains('adaptive3-merge-queue-land/install/'))
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith('/operational/command_execution') &&
      c.inputs.env.REASON.contains('The selected stack failed its final verification'))
  expect_error: operational.command_execution] command execution failed
