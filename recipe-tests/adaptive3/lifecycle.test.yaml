- id: native-failure-log-reaches-repair
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Project
          .c2/recipes/hooks/build/verify.yaml: |
            id: base-verify
            sequence: []
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Original hook passed.
              artifact_refs: {}
    responses: []
  inputs:
    purpose: implementation
    request: Repair the failing verification.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
          worktree:
            .c2/recipes/hooks/build/verify.yaml: |
              id: candidate-verify
              sequence:
              - id: probe
                op: command_execution
                inputs:
                  run: |
                    if [ ! -f fixed.txt ]; then echo missing-fixed >&2; exit 9; fi
              outputs:
                api_version: c2.build-hook/v1
                status: passed
                summary: Candidate hook passed.
                artifact_refs: {}
        artifacts:
          review/README.md: '# Requested outcome

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
          worktree:
            fixed.txt: 'fixed

              '
        artifacts:
          review/README.md: '# Requested outcome

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: calls.exists(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.node_path.contains("/execute/")
      && has(c.artifacts) && c.artifacts.exists(k,k.contains("error/hooks/verify/") && c.artifacts[k].contains("missing-fixed")))
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.endsWith("/probe")))==2
  - type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/")))==2
  - type: cel_true
    expr: >-
      calls.exists(c,c.node_path.endsWith('/resume_work/resume_work') &&
        c.inputs.inputs.prompt.contains('Continue the current implementation.') &&
        !c.inputs.inputs.prompt.contains('Originating assignment') &&
        size(c.inputs.inputs.prompt)<size(calls.filter(a,a.node_path.endsWith('/start_work/start_work'))[0].inputs.inputs.prompt))
