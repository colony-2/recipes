  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: calls.exists(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.inputs.inputs.prompt.contains("Exclude
      concurrent reopen. Keep the work local."))
  - type: cel_true
    expr: reviews[0].form.request.documents["review/README.md"].stored.key != reviews[1].form.request.documents["review/README.md"].stored.key
  - type: cel_true
    expr: reviews[1].form.request.documents == outputs.documents
  - type: cel_true
    expr: calls.filter(c,c.op=="command_execution" && c.node_path.contains("review_files")).size()==2
  - type: cel_true
    expr: calls.filter(c,c.op=="command_execution" && c.node_path.contains("review_files"))[1].artifacts["review/README.md"].contains("Keep
      concurrent reopen out of scope")
