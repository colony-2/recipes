          README.md: A small project.
    responses:
    - node_path: lifecycle-test/lifecycle/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: revise
        feedback: Exclude concurrent reopen. Keep the work local.
    - node_path: lifecycle-test/lifecycle/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  inputs:
    purpose: direction
    request: Draft saving.
    max_iterations: 1
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Follow the requested new scope.
            stage: direction
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Follow the requested new scope.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |-
            # Scope
            Keep concurrent reopen out of scope.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.inputs.inputs.prompt.contains("Exclude concurrent reopen.
      Keep the work local."))
  - type: cel_true
    expr: reviews[0].form.documents["review/README.md"].stored.key != reviews[1].form.documents["review/README.md"].stored.key
  - type: cel_true
    expr: reviews[1].form.documents == outputs.documents
  - type: cel_true
    expr: calls.filter(c,c.op=="command_execution" && c.node_path.contains("review_files")).size()==2
  - type: cel_true
    expr: calls.filter(c,c.op=="command_execution" && c.node_path.contains("review_files"))[1].artifacts["review/README.md"].contains("Keep
      concurrent reopen out of scope")
- id: automatic-limit-keeps-work-for-resolution
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses: []
  inputs:
    purpose: implementation
    request: Fix it.
    max_iterations: 1
  mocks:
    ops:
    - match:
