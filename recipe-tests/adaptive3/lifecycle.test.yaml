recipe: lifecycle.yaml
cases:
- id: invalid-review-files-block-verification
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A project.
          .c2/recipes/hooks/build/verify.yaml: "id: verify-fixture\nsequence:\n- id: check_one\n  op: command_execution\n\
            \  inputs:\n    run: test -f README.md\n- id: check_two\n  op: command_execution\n  inputs:\n    run:\
            \ test -d .git || git rev-parse --git-dir >/dev/null\noutputs:\n  api_version: c2.build-hook/v1\n  status:\
            \ passed\n  summary: Both checks passed.\n  artifact_refs: {}\n"
    responses: []
  inputs:
    purpose: implementation
    request: Fix the review links.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Review

            [missing](absent.md)'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Correct review

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.endsWith("/check_one")))==1
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.endsWith("/check_two")))==1
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.node_path.contains("/execute/")).size()==2
