recipe: lifecycle.yaml
cases:
- id: correction-repeats-every-check
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A project.
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify-fixture
            sequence:
            - id: check_one
              op: command_execution
              inputs:
                run: test -f README.md
            - id: check_two
              op: command_execution
              inputs:
                run: test -d .git || git rev-parse --git-dir >/dev/null
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Both checks passed.
              artifact_refs: {}
    responses: []
  inputs:
    purpose: implementation
    request: Fix the review links.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |-
            # Review
            [missing](absent.md)
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Correct review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: accepted
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.endsWith("/check_one")))==2
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.endsWith("/check_two")))==2
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/")).size()==2
- id: human-changes-reset-automatic-allowance
  type: integration_case
  runtime:
    cells:
      root:
