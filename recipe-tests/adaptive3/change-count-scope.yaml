schema_version: 2
id: change-count-scope-test
input_schema:
  purpose:
    type: string
    required: true
inputs:
  purpose: ${{ inputs.purpose }}
sequence:
- id: general
  include: ../../recipes/adaptive3/prompts/validate.yaml
  inputs:
    purpose: ${{ inputs.purpose }}
    request: Preserve meaningful validation.
- id: specialist
  include: ../../recipes/adaptive3/prompts/validate.yaml
  inputs:
    purpose: ${{ inputs.purpose }}
    request: Preserve meaningful validation.
    specialist: 'Security reviewer: Check isolation.'
- id: validate
  include: ../../recipes/adaptive3/validate.yaml
  inputs:
    purpose: ${{ inputs.purpose }}
    request: Preserve meaningful validation.
    require_verification: true
    work:
      title: Check local result
      primary: review/one-pager.md
      document_details:
      - {document_id: review/design.md, title: Design, description: Plan, role: supporting, order: 0}
      - {document_id: review/acceptance.md, title: Criteria, description: Expectations, role: supporting, order: 1}
      - document_id: review/one-pager.md
        title: Agreed local result
        description: Check the local result and its evidence.
        role: primary
        order: 0
    documents:
      review/one-pager.md:
        kind: value
        name: review/one-pager.md
        format: text
        value: '[Design](design.md) and [Criteria](acceptance.md)'
      review/design.md: {kind: value, name: review/design.md, format: text, value: Design}
      review/acceptance.md: {kind: value, name: review/acceptance.md, format: text, value: Criteria}
    settings:
      consultations:
      - key: direction
        checkpoint: before_design
        role: Security reviewer
        request: Check isolation.
        required: true
      - key: preparation
        checkpoint: plan_assessment
        role: Security reviewer
        request: Check isolation.
        required: true
      - key: implementation
        checkpoint: outcome_assessment
        role: Security reviewer
        request: Check isolation.
        required: true
outputs:
  general: ${{ sequence.general.outputs.task }}
  specialist: ${{ sequence.specialist.outputs.task }}
  result: ${{ sequence.validate.outputs.result }}
