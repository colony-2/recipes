recipe: ../../adaptive3.yaml
cases:
- id: delegate-owns-next-action
  type: integration_case
  runtime:
    cells: &review_cell
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
  inputs:
    prompt: Explain how the review works.
  mocks:
    ops:
    - &command_result
      match:
        op: command_execution
      behavior:
        mode: return
        outputs:
          stdout: ''
    - &choose_direction
      match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Inspect the review
            documents: []
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - &authored_answer
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects: &author_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &choose_assess
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Check the explanation
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &assessment_passed
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - &choose_finish
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: finish
            instruction: Replies stay in the same review.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &command_passthrough
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    includes:
      root/configure/[1]:
      - mode: return
        outputs:
          result:
            status: passed
          settings: {}
  assertions:
  - type: output_equals
    path: summary
    value: Replies stay in the same review.
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: size(reviews)==0 && calls.exists(c,c.op=='extension_execution' && has(c.inputs.inputs.session) && has(c.inputs.inputs.prompt)
      && c.inputs.inputs.prompt.contains('Choose what this job should do next.'))
- id: batch-answers-return-to-the-planner
  type: integration_case
  runtime:
    cells: *review_cell
    responses:
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: send
        feedback: ''
        settings:
          q0: other
          other0: Only ask me when the job needs a decision.
          q1: skip
        attachments: []
  inputs: &interview_request
    prompt: Explain how the review works.
  mocks: &interview_script
    ops:
    - *command_result
    - *choose_direction
    - *authored_answer
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: prepare_interview
            instruction: Check the underlying proposal.
            documents:
            - review/README.md
            presentation: question
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            questions:
            - question: Would shorter reviews solve the problem?
              choices:
              - 'Yes'
              - Only if there are fewer interruptions
            - question: Who should see a routine retry?
              choices:
              - Everyone
              - Only the job owner
        effects:
          objects: *author_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: Which changes would help?
            documents: []
            presentation: interview
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Reconsider the framing in light of the answers.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - *authored_answer
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Check the revised explanation.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - *assessment_passed
    - *choose_finish
    - *command_passthrough
    - &native_review
      match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
    includes:
      root/configure/[1]:
      - mode: return
        outputs:
          result:
            status: passed
          settings: {}
  assertions:
  - &exact_choices
    type: cel_true
    expr: size(reviews)==1 && reviews[0].form.request.documents=={} && reviews[0].form.request.settings[0].choices.map(c,c.label)==['Skip','Yes','Only
      if there are fewer interruptions','Other']
  - &exact_reply
    type: cel_true
    expr: calls.exists(c,c.node_path.contains('/author/') && has(c.inputs.inputs.prompt) && c.inputs.inputs.prompt.contains('Only
      ask me when the job needs a decision.') && c.inputs.inputs.prompt.contains('Only the job owner') && c.inputs.inputs.prompt.contains('submission_id'))
      && size(outputs.reviews)==1 && outputs.merge=={}
- id: delegate-screens-the-exact-package-proposal-before-probe
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Project
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - .c2/config.yaml
  inputs:
    prompt: Explain the test environment.
  mocks:
    ops:
    - *command_result
    - *choose_direction
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: packages
            summary: I need pytest for this check.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            packages:
            - reference: uv:pytest
              check:
              - pytest
              - --version
        effects:
          objects: *author_session
        artifacts:
          review/README.md: |
            # Requested outcome
    - &choose_packages
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: packages
            instruction: May we use pytest to check this project?
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Add pytest for local tests.
            title: Approve pytest for local tests
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            - document_id: review/config.yaml
              title: Supporting evidence
              description: Check the evidence for this result.
              role: supporting
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Add pytest for local tests.
        artifacts:
          review/README.md: |-
            # Add pytest
            Run local tests.
          review/config.yaml: |
            packages: ["uv:pytest"]
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: May we use pytest to check this project?
            documents: []
            presentation: packages
        effects:
          objects: *checked_session
    - *choose_packages
    - *choose_direction
    - *authored_answer
    - *choose_assess
    - *assessment_passed
    - *choose_finish
    - match:
        op: recipes.run
      behavior:
        mode: return
        effects:
          children:
          - recipe: child.yaml
            cell: root
            inputs:
              fail: true
            await: terminal
            bind: probe
        outputs_expr: '{"job_ids":[children.probe]}'
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: passthrough
    - *command_passthrough
    - *native_review
    includes:
      root/configure/[1]:
      - mode: return
        outputs:
          result:
            status: passed
          settings: {}
  assertions:
  - type: cel_true
    expr: size(reviews)==1 && reviews[0].form.request.directions.map(d,d.id)==['reply','accept'] && calls.filter(c,c.op=='recipes.run')[0].inputs.recipes[0].inputs.config.stored.key==reviews[0].form.request.documents['review/config.yaml'].stored.key
  - type: cel_true
    expr: size(calls.filter(c,c.op=='recipes.run'))==1 && !calls.exists(c,c.node_path.contains('/adopt/'))
- id: worker-reopens-after-answer-before-planner
  type: integration_case
  runtime:
    cells: *review_cell
    responses:
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: send
        feedback: ''
        settings:
          q0: other
          other0: Only ask me when the job needs a decision.
          q1: skip
        attachments: []
    backend: sqlite
    controls:
      scenario:
        jobs:
          root:
            root: true
        dispatch_holds:
        - id: handoff
          job: root
          task:
            task_type: extension_execution:extension_execution
            node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/author/sequence/work/adaptive3-execute/work/work/adaptive3-agent/resume_read_only/resume_read_only
            attempt: 1
            occurrence: 1
        events:
        - id: held
          kind: dispatch
          hold: handoff
        actions:
        - id: stop
          after_all:
          - held
          do: stop_worker
        - id: reopen
          after_all:
          - stop
          do: reopen_runtime
        - id: release
          after_all:
          - reopen
          do: release
          target: handoff
        - id: start
          after_all:
          - release
          do: start_worker
        outcomes:
          root:
            status: completed
  inputs: *interview_request
  mocks: *interview_script
  assertions:
  - *exact_choices
  - *exact_reply
  - type: cel_true
    expr: controls.scenario.actions.map(a,a.id)==['stop','reopen','release','start'] && calls.filter(c,c.op=='input').size()==1
- id: delegate-negotiates-the-request-with-the-owning-cell
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
      storage:
        files:
          README.md: Versioned storage
  inputs:
    prompt: Ask storage for a change to keep old saves. Return the agreed terms.
  mocks:
    ops:
    - *command_result
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: negotiate
            instruction: Request retained saves.
            documents: []
            presentation: question
            coordination:
              cell: storage
              request: I want to retain old saves.
              share_review: false
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: ready
            summary: I suggest keeping three distinct saves.
            assignment: 'Feature: retain three distinct saves.'
            work_kind: feature
            title: Use the existing version history API
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: I suggest keeping three distinct saves.
    - *assessment_passed
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: agree
            summary: These terms solve the consumer need.
    - *choose_direction
    - *authored_answer
    - *choose_assess
    - *assessment_passed
    - *choose_finish
    - *command_passthrough
    includes:
      root/configure/[1]:
      - mode: return
        outputs:
          result:
            status: passed
          settings: {}
  assertions:
  - type: cel_true
    expr: size(reviews)==0 && !calls.exists(c,c.op=='recipes.run') && calls.exists(c,c.cell=='storage' && c.op=='extension_execution')
      && outputs.artifact_refs.exists(k,k.endsWith('/report.md')) && outputs.artifact_refs.exists(k,k.endsWith('/transcript.md'))
- id: invalid-delegate-responses-stop-after-three-attempts
  type: integration_case
  runtime: {}
  inputs: {prompt: Explain the retry rules.}
  mocks:
    includes:
      root/configure/[1]: [{mode: return, outputs: {result: {status: passed}, settings: {}}}]
    ops:
    - *command_result
    - match: *codex
      repeat: true
      behavior:
        mode: return
        outputs: {status: completed, output_schema_valid: false, response: {}}
    - *command_passthrough
  expect_error: Delegate dispatch stopped at its attempt limit.
  assertions:
  - type: cel_true
    expr: size(calls.filter(c,c.op=='extension_execution'))==3 && size(reviews)==0 && calls.exists(c,c.node_path.endsWith('/exhausted/command_execution'))
