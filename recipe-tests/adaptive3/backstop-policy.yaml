schema_version: 2
id: backstop-policy-test
input_schema:
  direction: {type: object, default_value: {}}
  preparation: {type: object, default_value: {}}
  implementation: {type: object, default_value: {}}
  outcome: {type: object, default_value: {}}
inputs:
  direction: ${{ inputs.direction }}
  preparation: ${{ inputs.preparation }}
  implementation: ${{ inputs.implementation }}
  outcome: ${{ inputs.outcome }}
sequence:
- id: policy
  include: ../../recipes/adaptive3/backstop-policy.yaml
  inputs:
    direction: ${{ inputs.direction }}
    preparation: ${{ inputs.preparation }}
    implementation: ${{ inputs.implementation }}
    outcome: ${{ inputs.outcome }}
outputs:
  prerequisites: ${{ sequence.policy.outputs.prerequisites }}
