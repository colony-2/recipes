recipe: backstop.yaml
cases:
- id: discuss-before-continuing
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: revise
        feedback: Why is the browser needed?
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: Use the existing remote browser.
  inputs:
    stage: implementation
    request: Fix the UI
    problem:
      status: stuck
      summary: Browser unavailable
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            summary: May I use the existing remote browser?
            stage: implementation
            title: Restore progress on implementation
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: May I use the existing remote browser?
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            summary: The remote browser captures the same application.
            stage: implementation
            title: Restore progress on implementation
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The remote browser captures the same application.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: Use the existing remote browser.
            title: Use the existing remote browser
            primary: null
            additional_attempts: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Use the existing remote browser.
  assertions:
  - type: cel_true
    expr: size(reviews)==2
  - type: cel_true
    expr: outputs.result.human.fields.feedback=="Use the existing remote browser."
- id: continue-rereads-annotated-notes
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: ''
      attachments:
        annotations: fixtures/scope.md
  inputs:
    stage: implementation
    request: Fix the UI
    problem:
      status: stuck
      summary: Browser unavailable
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            summary: Revise direction to use the existing remote browser.
            stage: direction
            title: Restore progress on direction
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: May I use the existing remote browser?
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: direction
            summary: Revise direction to use the existing remote browser.
            title: Use the existing remote browser
            primary: null
            additional_attempts: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Revise direction to use the existing remote browser.
  assertions:
  - type: cel_true
    expr: outputs.result.summary=="Revise direction to use the existing remote browser."
  - type: cel_true
    expr: outputs.result.stage=="direction"
  - type: cel_true
    expr: '"feedback/scope.md" in outputs.result.documents && outputs.result.documents["feedback/scope.md"].name=="feedback/scope.md"'
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution"))==2 && calls.filter(c,c.op=="extension_execution")[1].inputs.inputs.prompt.contains("Read
      any attached human notes")
