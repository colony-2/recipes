cases:
- id: discuss-before-continuing
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: question
        feedback: Why is the browser needed?
        attachments: []
        settings: {}
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: continue
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    stage: implementation
    request: Fix the UI
    problem:
      status: stuck
      summary: Browser unavailable
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            summary: May I use the existing remote browser?
            stage: implementation
            title: Restore progress on implementation
            primary: null
            document_details: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: May I use the existing remote browser?
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            summary: The remote browser captures the same application.
            stage: implementation
            title: Restore progress on implementation
            primary: null
            document_details: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The remote browser captures the same application.
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews)==2
  - type: cel_true
    expr: outputs.result.human.response.feedback=="" && outputs.result.conversation[0].text=="Why is the browser
      needed?"
