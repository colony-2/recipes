    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: 'The scope changed: support desktop only.'
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: ''
  inputs:
    stage: implementation
    request: Fix the UI
    problem:
      status: stuck
      summary: Browser unavailable
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: Use the existing remote browser.
            title: Use the existing remote browser
            primary: null
            additional_attempts: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Use the existing remote browser.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: direction
            summary: Revise the one-pager for desktop only.
            title: Use the existing remote browser
            primary: null
            additional_attempts: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Revise the one-pager for desktop only.
  assertions:
  - type: output_equals
    path: result.stage
    value: direction
  - type: cel_true
    expr: size(reviews)==2 && reviews[1].form.fields[0].question.contains("desktop only")
  - type: cel_true
    expr: 'calls.filter(c,c.op=="extension_execution")[1].inputs.inputs.prompt.contains("The scope changed: support
      desktop only.")'
- id: question-does-not-grant-attempts
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: question
        feedback: What does another attempt do?
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: ''
  inputs:
    stage: implementation
    request: Fix the UI
    problem:
      status: stuck
      summary: Browser unavailable
      loop: correction
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: Use the existing remote browser.
            title: Use the existing remote browser
            primary: null
            additional_attempts: 3
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Use the existing remote browser.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: It reruns the complete implementation cycle with the working browser.
            title: Use the existing remote browser
            primary: null
            additional_attempts: 3
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: It reruns the complete implementation cycle with the working browser.
  assertions:
  - type: cel_true
    expr: size(reviews)==2 && outputs.result.additional_attempts==3
  - type: cel_true
    expr: "reviews.all(r,r.form.title.startsWith(\"Backstop \u2014 \") && r.form.fields[0].options[0].label==\"\
      Try another 3 attempts\")"
- id: unattached-correction-link-is-not-shown
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: revise
        feedback: Use the remote browser and rerun validation.
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: ''
  inputs:
    stage: implementation
    request: Fix the UI
    problem:
      status: stuck
      summary: Browser unavailable
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: Approve [this correction](/tmp/private/correction.md).
            title: Use the existing remote browser
            primary: null
            additional_attempts: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Approve [this correction](/tmp/private/correction.md).
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: Use the remote browser and rerun validation.
            title: Use the existing remote browser
            primary: null
            additional_attempts: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Use the remote browser and rerun validation.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: reviews[0].form.fields[0].question.contains("could not prepare a readable diagnosis") && !reviews[0].form.fields[0].question.contains("/tmp/private")
  - type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution"))==2
  - type: cel_true
    expr: '!reviews[0].form.fields[0].options.exists(o,o.value=="continue") && !reviews[0].form.fields[0].question.contains("Additional
      attempts")'
- id: selected-correction-opens-first
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: ''
  inputs:
    stage: implementation
    request: Fix the UI
    problem:
      status: stuck
      summary: Browser unavailable
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: The browser now starts. [Details](review/correction.md).
            title: Use the existing remote browser
            primary: review/correction.md
            additional_attempts: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The browser now starts. [Details](review/correction.md).
        artifacts:
          review/correction.md: '# Restore image checks

            Use the remote browser.'
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: reviews[0].form.overview_document_id=="review/correction.md" && "review/correction.md" in reviews[0].form.documents
- id: invalid-report-keeps-native-review
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: revise
        feedback: Reread the original error and retry validation.
    - node_path: backstop-test/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: ''
  inputs:
    stage: implementation
    request: Fix the UI
    problem:
      status: stuck
      summary: Browser unavailable
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: false
          response: {}
          error_message: The agent did not return a usable report.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: Rerun full validation with the working browser.
            title: Retry browser validation
            primary: null
            additional_attempts: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Rerun full validation with the working browser.
  assertions:
  - type: cel_true
    expr: "size(reviews)==2 && reviews[0].form.title==\"Backstop \u2014 Agent needs help\""
  - type: cel_true
    expr: reviews[0].form.fields[0].question.contains("usable report")
  - type: cel_true
    expr: outputs.result.status=="resume" && outputs.result.stage=="implementation"
  - type: cel_true
    expr: '!reviews[0].form.fields[0].options.exists(o,o.value=="continue") && !reviews[0].form.fields[0].question.contains("Additional
      attempts")'
