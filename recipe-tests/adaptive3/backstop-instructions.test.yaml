recipe: backstop.yaml
cases:
- type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Disposable validation project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: reply
        feedback: '  Remove the phone acceptance criterion only.

          Keep the browser requirement. ${{ literal }}'
        attachments: []
        settings:
          return_to: direction
  inputs:
    stage: implementation
    request: Validate the local correction.
    problem:
      status: stuck
      summary: Validation interrupted.
      loop: work
    automatic: false
    prerequisites:
      configure: true
      direction: true
      preparation: true
      implementation: true
      outcome: false
      integration: false
  id: human-instruction-routes-once-with-native-authority
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun local validation with the available browser.
            stage: implementation
            summary: The local prerequisite passed. Apply authorizes rerunning validation only.
            title: Resume local validation
            primary: null
            additional_attempts: null
            document_details: []
            report:
              origin: Human asks to improve Backstop; original request is retained.
              work: Implementation saved; no external effect repeated.
              blocker: Phone run unavailable.
              options:
              - Supply a phone.
              - Remove phone criterion.
              recommendation: Ask for a phone or an explicit scope instruction.
              research: No additional research.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The local prerequisite passed. Apply authorizes rerunning validation only.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Remove only the phone criterion, retain browser validation.
            stage: direction
            summary: The local prerequisite passed. Apply authorizes rerunning validation only.
            title: Resume local validation
            primary: null
            additional_attempts: null
            document_details: []
            report: null
            instruction:
              text: Remove only the phone acceptance criterion. Keep browser validation.
              scope_change: true
            destination: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The local prerequisite passed. Apply authorizes rerunning validation only.
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: outputs.result.stage=="direction" && outputs.result.status=="resume"
  - type: cel_true
    expr: outputs.result.amendment.human.response.feedback=="  Remove the phone acceptance criterion only.\nKeep
      the browser requirement. ${{ literal }}"
  - type: cel_true
    expr: outputs.result.amendment.human.receipt.request_id==reviews[0].request_id && outputs.result.amendment.human.receipt.submission_id!=""
  - type: cel_true
    expr: reviews[0].form.request.overview_document_id=="review/backstop-report.md"
  - type: cel_true
    expr: reviews[0].form.request.documents["review/backstop-report.md"].kind=="stored"
  - type: cel_true
    expr: outputs.result.primary=="review/backstop-report.md" && size(outputs.result.document_details.filter(d,d.role=="primary"))==1
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge" || c.op=="recipe.create_job")'
