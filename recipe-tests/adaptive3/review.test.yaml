- id: preparation-exact-human-correction
  type: integration_case
  runtime: &independent_runtime
    cells:
      root:
        files:
          README.md: Drafts
  inputs:
    purpose: preparation
    decision: preparation
    title: Check the current human scope
    feedback: &human_correction
      status: changes
      summary: Generated advice says deployment is required.
      human:
        response:
          direction: revise
          feedback: "  Keep this local — 日本語🙂.\nNo deployment.  "
      response:
        direction: accept
        feedback: STALE-DIRECT-DIRECTION
  mocks: &independent_mocks
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: accepted
            summary: Scripted reviewer ran; assertions check the actual delivered prompt.
  assertions: &exact_human_assertions
  - type: output_equals
    path: result.status
    value: accepted
  - type: cel_true
    expr: >-
      size(calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)
      && c.node_path.contains("/assess/")))==1 && size(reviews)==0
  - type: cel_true
    expr: >-
      calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).all(c,
      c.inputs.inputs.prompt.contains("Human choice: revise\nHuman message:   Keep this local — 日本語🙂.\nNo deployment.  \n")
      && !c.inputs.inputs.prompt.contains("STALE-DIRECT-DIRECTION"))
- id: implementation-exact-human-correction
  type: integration_case
  runtime: *independent_runtime
  inputs:
    purpose: implementation
    decision: implementation
    title: Check the current human scope
    feedback: *human_correction
  mocks: *independent_mocks
  assertions: *exact_human_assertions
- id: preparation-without-human-feedback
  type: integration_case
  runtime: *independent_runtime
  inputs:
    purpose: preparation
    decision: preparation
    title: Check the current human scope
  mocks: *independent_mocks
  assertions: &absent_human_assertions
  - type: output_equals
    path: result.status
    value: accepted
  - type: cel_true
    expr: >-
      size(calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)
      && c.node_path.contains("/assess/")))==1 && size(reviews)==0
  - type: cel_true
    expr: >-
      calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).all(c,
      c.inputs.inputs.prompt.contains("Human choice: \nHuman message: \nWhen the human selects question"))
- id: implementation-without-human-feedback
  type: integration_case
  runtime: *independent_runtime
  inputs:
    purpose: implementation
    decision: implementation
    title: Check the current human scope
  mocks: *independent_mocks
  assertions: *absent_human_assertions
- id: stale-direct-feedback-is-not-human-direction
  type: integration_case
  runtime: *independent_runtime
  inputs:
    purpose: implementation
    decision: implementation
    title: Check the current human scope
    feedback:
      response:
        direction: accept
        feedback: STALE-DIRECT-DIRECTION
  mocks: *independent_mocks
  assertions:
  - type: output_equals
    path: result.status
    value: accepted
  - type: cel_true
    expr: >-
      size(calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)))==1
      && calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).all(c,
      c.inputs.inputs.prompt.contains("Human choice: \nHuman message: \nWhen the human selects question")
      && !c.inputs.inputs.prompt.contains("STALE-DIRECT-DIRECTION"))
