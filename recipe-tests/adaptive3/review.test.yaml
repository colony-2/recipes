recipe: review.yaml
cases:
- id: direction-decision
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Drafts
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: review-test/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    purpose: direction
    decision: direction
    title: Keep saved drafts after a restart
  assertions:
  - type: output_equals
    path: result.status
    value: accepted
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: reviews[0].form.request.directions[0].label=="Approve direction"
  - type: cel_true
    expr: reviews[0].form.title=="Direction \u2014 Keep saved drafts after a restart"
  - type: cel_true
    expr: reviews[0].form.request.directions.exists(o,o.id=="question" && o.label=="Ask
      a question") && reviews[0].form.request.directions.exists(o,o.id=="revise" &&
      o.label=="Request changes")
  - type: cel_true
    expr: '!reviews[0].form.request.directions.exists(d,d.id=="annotate") && reviews[0].form.request.question.contains("There
      are no attached review documents")'
  mocks:
    ops:
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
