- id: question-keeps-approval-pending
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Drafts
    responses:
    - node_path: review-test/review/adaptive3-review/ask/ask
      fields:
        decision: question
        feedback: What happens after a restart?
    - node_path: review-test/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  inputs:
    purpose: direction
    decision: direction
    title: Keep saved drafts after a restart
  assertions:
  - type: output_equals
    path: result.status
    value: accepted
  - type: cel_true
    expr: size(reviews)==2 && reviews[0].form.title==reviews[1].form.title
  - type: cel_true
    expr: reviews[1].form.fields[0].question.contains("Saved drafts return")
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Saved drafts return when you reopen the app.
            stage: direction
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Saved drafts return when you reopen the app.
- id: empty-question-reopens-without-agent
