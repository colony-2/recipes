- id: question-keeps-approval-pending
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Drafts
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: review-test/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: question
        feedback: What happens after a restart?
        attachments: []
        settings: {}
    - node_path: review-test/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: question
        feedback: '  Does that change the scope?

          '
        attachments: []
        settings: {}
    - node_path: review-test/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    purpose: direction
    decision: direction
    title: Keep saved drafts after a restart
  assertions:
  - type: output_equals
    path: result.status
    value: accepted
  - type: cel_true
    expr: size(reviews)==3 && reviews.all(r,r.form.request.review_id==reviews[0].form.request.review_id)
      && reviews[0].request_id!=reviews[1].request_id && reviews[1].request_id!=reviews[2].request_id
  - type: cel_true
    expr: size(reviews[2].form.request.conversation)==4 && reviews[2].form.request.conversation[0].text=="What
      happens after a restart?" && reviews[2].form.request.conversation[1].text=="Saved
      drafts return when you reopen the app." && reviews[2].form.request.conversation[2].text=="  Does
      that change the scope?\n" && reviews[2].form.request.conversation[3].text=="No
      scope change is authorized by this question."
  - type: cel_true
    expr: reviews[2].form.request.conversation[0].receipt.request_id==reviews[0].request_id
      && reviews[2].form.request.conversation[2].receipt.request_id==reviews[1].request_id
      && outputs.result.receipt.request_id==reviews[2].request_id
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt))).size()==2
      && calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)))[1].inputs.inputs.prompt.contains("What
      happens after a restart?") && !calls.exists(c,c.op=="merge")
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Saved drafts return when you reopen the app.
            stage: direction
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Saved drafts return when you reopen the app.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: No scope change is authorized by this question.
            stage: direction
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Saved drafts return when you reopen the app.
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
