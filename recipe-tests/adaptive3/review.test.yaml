  - type: cel_true
    expr: '!calls.exists(c,c.op=="extension_execution")'
- id: change-request-preserves-human-words
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Drafts
    responses:
    - node_path: review-test/review/adaptive3-review/ask/ask
      fields:
        decision: revise
        feedback: Keep only the latest saved draft.
  inputs:
    purpose: direction
    decision: direction
    title: Keep saved drafts after a restart
  assertions:
  - type: output_equals
    path: result.status
    value: changes
  - type: cel_true
    expr: outputs.result.human.fields.feedback=="Keep only the latest saved draft."
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Keep one saved draft.
            stage: direction
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Keep one saved draft.
