recipe: review.yaml
cases:
- id: direction-decision
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Drafts
    responses:
    - node_path: review-test/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  inputs:
    purpose: direction
    decision: direction
    title: Keep saved drafts after a restart
  assertions:
  - type: output_equals
    path: result.status
    value: accepted
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: reviews[0].form.fields[0].options[0].label=="Approve direction"
  - type: cel_true
    expr: reviews[0].form.title=="Direction \u2014 Keep saved drafts after a restart"
  - type: cel_true
    expr: reviews[0].form.fields[0].options.exists(o,o.value=="question" && o.label=="Ask a question") && reviews[0].form.fields[0].options.exists(o,o.value=="revise"
      && o.label=="Request changes")
