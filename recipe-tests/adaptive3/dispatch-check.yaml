schema_version: 2
id: delegate-dispatch-fixture
input_schema:
  action: {type: object, required: true}
  record: {type: object, required: true}
  settings: {type: object, default_value: {}}
  valid: {type: boolean, default_value: true}
inputs:
  action: ${{ inputs.action }}
  valid: ${{ inputs.valid }}
  record: ${{ inputs.record }}
  settings: ${{ inputs.settings }}
sequence:
- id: check
  include: ../../recipes/adaptive3/dispatch-check.yaml
  inputs:
    action: ${{ inputs.action }}
    valid: ${{ inputs.valid }}
    record: ${{ inputs.record }}
    settings: ${{ inputs.settings }}
outputs:
  issue: ${{ sequence.check.outputs.issue }}
