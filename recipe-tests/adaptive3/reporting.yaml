schema_version: 2
id: reporting-test
sequence:
- id: candidate
  op: command_execution
  inputs:
    run: |-
      mkdir -p harness docs
      printf 'new one\nnew two\n' > core.txt
      printf 'test harness\n' > harness/runner.py
      printf 'Usage\n' > docs/guide.md
      printf '\000binary' > image.bin
- id: outcome
  include: ../../recipes/adaptive3/lifecycle.yaml
  inputs:
    purpose: outcome
    request: Report the actual root changes and the completed storage work separately. Test harnesses count as tests.
outputs:
  result: ${{ sequence.outcome.outputs.result }}
  documents: ${{ sequence.outcome.outputs.documents }}
