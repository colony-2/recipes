schema_version: 2
id: review-test
input_schema:
  purpose:
    type: string
    required: true
  decision:
    type: string
    required: true
  title:
    type: string
    required: true
inputs:
  purpose: ${{ inputs.purpose }}
  decision: ${{ inputs.decision }}
  title: ${{ inputs.title }}
sequence:
- id: review
  include: ../../recipes/adaptive3/review.yaml
  inputs:
    purpose: ${{ inputs.purpose }}
    decision: ${{ inputs.decision }}
    title: ${{ inputs.title }}
    request: Preserve drafts across restart.
outputs:
  result: ${{ sequence.review.outputs.result }}
