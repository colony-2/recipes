    expr: outputs.result.status=="accepted" && !calls.exists(c,c.op=="recipes.run")
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/execute/")).size()==2
      && calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.inputs.inputs.session)).size()==1
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/validate/")).size()==1
      && !calls.exists(c,c.node_path.contains("/adopt/"))
