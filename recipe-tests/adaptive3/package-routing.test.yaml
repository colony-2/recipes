recipe: lifecycle.yaml
cases:
- id: package-destination-escapes-containing-lifecycle
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: lifecycle-test/lifecycle/adaptive3-lifecycle/packages/packages/adaptive3-packages/approval/approval/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: revise
        feedback: Revise the verification plan before adding tools.
        attachments: []
        settings:
          return_to: preparation
  inputs:
    purpose: implementation
    request: Run local tests.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: packages
            summary: Request the test tool.
            packages:
            - reference: uv:pytest
              check:
              - pytest
              - --version
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Add pytest for local tests.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Add pytest for local tests.
            title: Add pytest for local tests
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Add pytest
              description: Read the proposed result and supporting evidence.
              role: primary
              order: 10
            - document_id: review/config.yaml
              title: 'packages: ["uv:pytest"]'
              description: Read the proposed result and supporting evidence.
              role: supporting
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Add pytest for local tests.
        artifacts:
          review/README.md: '# Add pytest

            Run local tests.'
          review/config.yaml: 'packages: ["uv:pytest"]

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Use the existing test tool.
            stage: preparation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Use the existing test tool.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="changes" && outputs.result.stage=="preparation" && outputs.result.human.response.settings.return_to=="preparation"
      && !calls.exists(c,c.op=="recipes.run")
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/execute/")).size()==1
      && !calls.exists(c,c.node_path.contains("/adopt/"))
