schema_version: 2
id: consultation-test
input_schema:
  cell:
    type: string
    required: true
  request:
    type: string
    required: true
  mode:
    type: string
    default_value: advice
inputs:
  cell: ${{ inputs.cell }}
  request: ${{ inputs.request }}
  mode: ${{ inputs.mode }}
sequence:
- id: consultation
  include: ../../recipes/adaptive3/consultation.yaml
  inputs:
    cell: ${{ inputs.cell }}
    request: ${{ inputs.request }}
    mode: "${{ inputs.mode == 'delivery' ? 'negotiate' : inputs.mode }}"
- id: delivery
  include: ../../recipes/adaptive3/consultation.yaml
  when: inputs.mode == 'delivery' && nonempty(sequence.consultation.outputs.agreement.?assignment.orValue(''))
  inputs:
    cell: ${{ inputs.cell }}
    mode: delivery
    request: Please deliver the agreed behavior.
    thread: ${{ sequence.consultation.outputs.agreement.thread }}
    agreements: ${{ sequence.consultation.outputs.agreements }}
outputs:
  result: ${{ sequence.?delivery.orValue(sequence.consultation).outputs.result }}
  documents: ${{ sequence.?delivery.orValue(sequence.consultation).outputs.documents }}
  agreement: ${{ sequence.?delivery.orValue(sequence.consultation).outputs.agreement }}
