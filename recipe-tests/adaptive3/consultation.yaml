schema_version: 2
id: consultation-test
input_schema:
  cell:
    type: string
    required: true
  request:
    type: string
    required: true
  mode:
    type: string
    default_value: advice
inputs:
  cell: ${{ inputs.cell }}
  request: ${{ inputs.request }}
  mode: ${{ inputs.mode }}
sequence:
- id: consultation
  include: ../../recipes/adaptive3/consultation.yaml
  inputs:
    cell: ${{ inputs.cell }}
    request: ${{ inputs.request }}
    mode: ${{ inputs.mode }}
outputs:
  result: ${{ sequence.consultation.outputs.result }}
  documents: ${{ sequence.consultation.outputs.documents }}
