recipe: package-probe.yaml
cases:
- id: fresh-task-probes-approved-package
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses: []
  inputs:
    config:
      kind: value
      name: review/config.yaml
      format: text
      value: |
        packages: ["uv:pytest==8.3.5"]
    requests:
    - reference: uv:pytest==8.3.5
      check:
      - pytest
      - --version
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Installed the approved config.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Installed the approved config.
          worktree:
            .c2/config.yaml: |
              packages: ["uv:pytest==8.3.5"]
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.status=="passed"
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/probe/probe") && c.outputs.stdout.contains("pytest 8.3.5"))
