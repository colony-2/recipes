recipe: package-probe.yaml
cases:
- id: fresh-task-probes-approved-package
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses: []
    observe_files:
    - .c2/config.yaml
  inputs:
    config:
      kind: value
      name: review/config.yaml
      format: text
      value: 'packages: ["uv:pytest==8.3.5"]

        '
    requests:
    - reference: uv:pytest==8.3.5
      check:
      - pytest
      - --version
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.status=="passed"
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/probe/probe") && c.outputs.stdout.contains("pytest 8.3.5"))
  - type: cel_true
    expr: '!calls.exists(c,c.op=="extension_execution")'
  - type: cel_true
    expr: calls.filter(c,c.node_path.contains("/install/") && c.op=="command_execution").all(c,!(".c2/config.yaml"
      in c.worktree))
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/probe/probe")).all(c,c.worktree[".c2/config.yaml"].contains("uv:pytest==8.3.5"))
- id: duplicate-keys-never-stage-or-prepare-proposed-package
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/config.yaml: |
            packages: []
    observe_files:
    - .c2/config.yaml
  inputs:
    config:
      kind: value
      name: review/config.yaml
      format: text
      value: |
        packages: ["uv:pytest==8.3.5"]
        packages: ["uv:pytest==8.3.5"]
    requests:
    - reference: uv:pytest==8.3.5
      check: [pytest, --version]
  mocks:
    ops:
    - match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: outputs.status=="changes" && outputs.summary.contains("Duplicate YAML mapping key")
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.endsWith("/probe/probe"))'
  - type: cel_true
    expr: >-
      size(calls.filter(c,c.op=="command_execution"))==2
      && calls.filter(c,c.op=="command_execution").all(c,
        c.outputs.stdout.contains('"approved": {}')
        && c.outputs.stdout.contains('"written": false')
        && c.worktree[".c2/config.yaml"]=="packages: []\n")
