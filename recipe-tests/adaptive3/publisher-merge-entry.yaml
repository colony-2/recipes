schema_version: 2
id: publisher-merge-entry
input_schema:
  change:
    type: string
    required: true
  merge_queue:
    type: boolean
    default_value: true
inputs:
  change: ${{ inputs.change }}
  merge_queue: ${{ inputs.merge_queue }}
sequence:
- id: fixture
  op: recipe.run_and_get_result
  inputs:
    # Keep the receiver and inline verification child on this fixture revision.
    name: ${{ 'git+' + context.git.repo + '//recipe-tests/adaptive3/publisher-merge.yaml@main' }}
    inputs:
      change: ${{ inputs.change }}
      merge_queue: ${{ inputs.merge_queue }}
outputs:
  result: ${{ sequence.fixture.outputs.outputs.result }}
  candidate: ${{ sequence.fixture.outputs.outputs.candidate }}
