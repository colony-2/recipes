recipe: package-types.yaml
cases:
- id: proposal-false-zero-rejects-without-writing
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/config.yaml: 'custom: false

            packages: []

            '
    observe_files:
    - .c2/config.yaml
  inputs:
    config:
      kind: value
      name: review/config.yaml
      format: text
      value: 'custom: 0

        packages: ["uv:pytest==8.3.5"]

        '
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="changes" && outputs.unchanged
  - type: cel_true
    expr: outputs.result.summary=="Unrelated configuration changed"
