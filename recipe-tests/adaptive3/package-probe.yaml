schema_version: 2
id: package-probe-test
input_schema:
  config:
    type: artifact
    required: true
  approved:
    type: object
    default_value: {}
  requests:
    type: array
    items:
      type: object
    required: true
inputs: &id001
  config: ${{ inputs.config }}
  requests: ${{ inputs.requests }}
  approved: ${{ inputs.approved }}
sequence:
- id: validate
  include: ../../recipes/adaptive3/tools.yaml
  inputs:
    check: package_config
    documents:
      review/config.yaml: ${{ inputs.config }}
    requests: ${{ inputs.requests }}
- id: probe
  include: ../../recipes/adaptive3/package-probe.yaml
  inputs:
    config: ${{ inputs.config }}
    requests: ${{ inputs.requests }}
    approved: '${{ size(inputs.approved)>0 ? inputs.approved : sequence.validate.outputs.approved }}'
outputs:
  status: ${{ sequence.probe.outputs.status }}
  summary: ${{ sequence.probe.outputs.summary }}
