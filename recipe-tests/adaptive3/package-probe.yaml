schema_version: 2
id: package-probe-test
input_schema:
  config:
    type: artifact
    required: true
  requests:
    type: array
    items:
      type: object
    required: true
inputs: &id001
  config: ${{ inputs.config }}
  requests: ${{ inputs.requests }}
sequence:
- id: probe
  include: ../../recipes/adaptive3/package-probe.yaml
  inputs: *id001
outputs:
  status: ${{ sequence.probe.outputs.status }}
  summary: ${{ sequence.probe.outputs.summary }}
