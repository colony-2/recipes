schema_version: 2
id: backstop-test
input_schema:
  stage:
    type: string
    required: true
  request:
    type: string
    required: true
  problem:
    type: object
    required: true
inputs:
  stage: ${{ inputs.stage }}
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
sequence:
- id: backstop
  include: ../../recipes/adaptive3/backstop.yaml
  inputs:
    stage: ${{ inputs.stage }}
    request: ${{ inputs.request }}
    problem: ${{ inputs.problem }}
outputs:
  result: ${{ sequence.backstop.outputs.result }}
