recipe: cycle.yaml
cases:
- id: one-pager-and-dialogue
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: |-
            # Notebook
            Owns a local notebook UI.
          README.md: The notebook stores the active draft only in memory. There is no server or account. Users should
            recover their latest unsent draft when they reopen this browser.
          app.js: |
            let draft = "";
            export function updateDraft(value) { draft = value; }
            export function getDraft() { return draft; }
    responses:
    - node_path: cycle-test/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: discuss
        message: Will drafts survive closing the browser?
    - node_path: cycle-test/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        message: ''
  inputs:
    purpose: direction
    request: Add durable draft saving to this local notebook. Keep cloud sync out of scope.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: size(reviews)==2
live: true
