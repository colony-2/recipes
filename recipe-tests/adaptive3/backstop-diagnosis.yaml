# One read-only diagnostic turn. This uses the production assignment, schemas and
# agent activity; it does not invoke Execute or authorize any stage work.
schema_version: 2
id: backstop-diagnosis-test
input_schema:
  prompt:
    type: string
    default_value: ''
  title:
    type: string
    default_value: ''
  request:
    type: string
    required: true
  problem:
    type: object
    required: true
  feedback:
    type: object
    default_value: {}
inputs:
  request: ${{ inputs.request }}
  problem: ${{ inputs.problem }}
  feedback: ${{ inputs.?feedback.orValue({}) }}
sequence:
- id: schemas
  include: ../../recipes/adaptive3/schemas.yaml
- id: prompt
  include: ../../recipes/adaptive3/prompts/backstop.yaml
  inputs:
    stage: integration
    request: ${{ inputs.request }}
    problem: ${{ inputs.problem }}
    feedback: ${{ inputs.feedback }}
- id: diagnose
  include: ../../recipes/adaptive3/agent.yaml
  inputs:
    prompt: ${{ sequence.prompt.outputs.task }}
    schema: ${{ sequence.schemas.outputs.backstop }}
    read_only: true
    documents: ${{ context.artifacts }}
outputs:
  response: ${{ sequence.diagnose.outputs.response }}
