recipe: review.yaml
cases:
- id: delegate-reuses-the-approved-version-and-guidance
  type: integration_case
  runtime: {}
  inputs: &repeated
    title: Drafts
    purpose: preparation
    decision: plan
    question: I clarified the wording. Shall we proceed?
    threads:
      plan:
        review_id: drafts
        revision: 2
        documents: {}
        approval:
          human: {response: {direction: accept, feedback: Show the empty state in the final review.}}
          receipt: {request_id: accepted-v2, submission_id: original}
          summary: Approved local drafts.
  mocks:
    ops:
    - match: {selector: 'nix:github:colony-2/c2ops/published#codex'}
      behavior:
        mode: return
        outputs: {status: completed, output_schema_valid: true, response: {status: covered, summary: The approved behavior and checks still apply.}}
  assertions:
  - type: cel_true
    expr: >-
      size(reviews)==0 && outputs.result.receipt.request_id=='accepted-v2' && outputs.result.revision==2 &&
      outputs.result.human.response.direction=='accept' && outputs.result.human.response.feedback.contains('empty state') &&
      calls.exists(c,c.node_path.contains('/reconsider/') && c.inputs.inputs.prompt.contains('empty state'))
- id: delegate-sends-trivial-repair-to-the-author
  type: integration_case
  runtime: {}
  inputs: *repeated
  mocks:
    ops:
    - match: {selector: 'nix:github:colony-2/c2ops/published#codex'}
      behavior:
        mode: return
        outputs: {status: completed, output_schema_valid: true, response: {status: repair, summary: Fix the two blank rows.}}
  assertions:
  - {type: cel_true, expr: "size(reviews)==0 && outputs.result.stage=='preparation' && outputs.result.summary=='Fix the two blank rows.'"}
- id: changed-promise-gets-a-human-decision
  type: integration_case
  runtime:
    cells:
      root:
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: review-test/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response: {direction: accept_fully, feedback: Keep the local copy as well., attachments: [], settings: {}}
  inputs: *repeated
  mocks:
    ops:
    - match: {selector: 'nix:github:colony-2/c2ops/published#codex'}
      behavior:
        mode: return
        outputs: {status: completed, output_schema_valid: true, response: {status: ask, summary: 'Sync now needs an account. Should we include it?'}}
    - match: {selector: ./recipes/review-v2}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: >-
      size(reviews)==1 && reviews[0].form.request.title=='Drafts' &&
      reviews[0].form.request.question=='Sync now needs an account. Should we include it?' &&
      reviews[0].form.request.review_id=='drafts' && outputs.result.human.response.feedback=='Keep the local copy as well.' &&
      outputs.result.receipt.request_id==reviews[0].request_id
