recipe: ../../recipes/adaptive3/package-probe.yaml
cases:
- type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
    observe_files:
    - .c2/config.yaml
  inputs:
    config:
      kind: value
      name: review/config.yaml
      format: text
      value: 'packages: ["uv:c2-recipes-missing-preparation-fixture-78f203==0.0.0"]

        '
    requests: &id001
    - reference: uv:c2-recipes-missing-preparation-fixture-78f203==0.0.0
      check:
      - python3
      - -c
      - print("PROBE BODY MUST NOT RUN")
    approved:
      baseline:
        present: false
        value: {}
      proposed:
        packages:
        - uv:c2-recipes-missing-preparation-fixture-78f203==0.0.0
      requests: *id001
      config:
        kind: value
        name: review/config.yaml
        format: text
        value: 'packages: ["uv:c2-recipes-missing-preparation-fixture-78f203==0.0.0"]

          '
      sha256: 28571c09bdc2129e763e8b90ba0bf0a306c7e4670d9f043eb903c911a2688c8f
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  id: fresh-preparation-failure-never-runs-probe-body
  assertions:
  - type: cel_true
    expr: outputs.status=="changes"
  - type: cel_true
    expr: 'calls.exists(c,c.node_path.contains("/install/") && c.op=="command_execution" && c.outputs.stdout.contains(''"status":
      "passed"''))'
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.endsWith("/probe/probe"))'
  - type: cel_true
    expr: 'outputs.failure.kind=="task_error" && outputs.failure.node.path=="adaptive3-package-probe/probe/probe"
      && outputs.summary.contains("tool setup failed: prepare uv:c2-recipes-missing-preparation-fixture-78f203==0.0.0")'
