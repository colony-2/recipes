schema_version: 2
id: context-routing-test
input_schema:
  purpose:
    type: string
    required: true
inputs:
  purpose: ${{ inputs.purpose }}
sequence:
- id: context
  include: ../../recipes/adaptive3/prompts/context.yaml
- id: lifecycle
  include: ../../recipes/adaptive3/lifecycle.yaml
  inputs:
    purpose: ${{ inputs.purpose }}
    request: Explain where this project stores drafts.
outputs:
  result: ${{ sequence.lifecycle.outputs.result }}
  instructions: ${{ sequence.context.outputs.instructions }}
