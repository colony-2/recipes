recipe: lifecycle.yaml
cases:
- id: successful-child-returns-to-requester
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Parent
      storage:
        files:
          README.md: Storage
  inputs:
    purpose: implementation
    request: Use the owner result to complete the local implementation.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response: &id001
            status: ready
            summary: The owner result is sufficient; continue this implementation.
            title: Review the implemented change
            primary: review/change.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The owner result is sufficient; continue this implementation.
          children:
          - recipe: child.yaml
            cell: storage
            inputs:
              fail: false
            await: terminal
            bind: requested
        artifacts:
          review/change.md: |
            # Current implementation
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response: *id001
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The owner result is sufficient; continue this implementation.
        artifacts:
          review/change.md: |
            # Current implementation
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response: &id002
            status: passed
            summary: The local work and owner outcome satisfy the request.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The local work and owner outcome satisfy the request.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response: &id003
            status: accepted
            summary: The implementation is ready.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The implementation is ready.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: size(events.filter(e,e.kind=="child_submitted"))==1
  - type: cel_true
    expr: size(calls.filter(c,c.op=="recipe.await_result_soft"))==1
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && c.inputs.inputs.prompt.contains(calls.filter(w,w.op=="recipe.await_result_soft")[0].inputs.target.job)
      && c.inputs.inputs.prompt.contains("completed"))
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/resolver/"))'
