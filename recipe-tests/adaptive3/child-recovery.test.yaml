- id: corrective-cancellation-reaches-requester
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Parent
      storage:
        files:
          README.md: Storage
  inputs:
    purpose: implementation
    request: Use the owner result to complete the local implementation.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: consult
            summary: Ask storage to retain three saves.
            consultation:
              cell: storage
              request: Retain three saves.
              mode: delivery
              job: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Ask storage to retain three saves.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: I can implement that.
            assignment: Retain three saves.
            title: Retain three saves
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: I can implement that.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Owner request is clear.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Owner request is clear.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: accepted
            summary: Owner request is ready.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Owner request is ready.
    - match:
        op: recipes.run
      behavior:
        mode: return
        outputs:
          job_ids:
          - cancelled-fixture-attempt
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: return
        outputs:
          job_id: cancelled-fixture-attempt
          status: cancelled
          failure_message: Stop this approach. Use our existing retention API.
          artifacts:
            _c2j/execution/check.log:
              kind: value
              name: _c2j/execution/check.log
              format: text
              value: Original child diagnostic bytes.
            _c2j/git-stderr.txt:
              kind: value
              name: _c2j/git-stderr.txt
              format: text
              value: Original gateway failure.
          outputs: {}
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: The owner result is sufficient; continue this implementation.
            title: Review the implemented change
            primary: review/change.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The owner result is sufficient; continue this implementation.
        artifacts:
          review/change.md: |
            # Current implementation
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: The local work and owner outcome satisfy the request.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The local work and owner outcome satisfy the request.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: accepted
            summary: The implementation is ready.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The implementation is ready.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted" && size(calls.filter(c,c.op=="recipes.run"))==1
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.cell=="root" && c.inputs.inputs.prompt.contains("cancelled-fixture-attempt")
      && c.inputs.inputs.prompt.contains("Stop this approach. Use our existing retention API."))
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.artifacts) &&
      c.artifacts.exists(k,k.contains("/errors/") && c.artifacts[k].contains("Original child diagnostic bytes.")))
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.artifacts) &&
      c.artifacts.exists(k,k.contains("/errors/") && k.endsWith("git-stderr.txt") && c.artifacts[k].contains("Original
      gateway failure.")))
