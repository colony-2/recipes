schema_version: 2
id: agreement-reference
input_schema:
  shared_review: {type: object, default_value: {}}
  cell: {type: string, required: true}
  mode: {type: string, required: true}
  request: {type: string, required: true}
  agreements: {type: array, default_value: []}
  thread: {type: string, default_value: ''}
inputs:
  shared_review: ${{ inputs.shared_review }}
  cell: ${{ inputs.cell }}
  mode: ${{ inputs.mode }}
  request: ${{ inputs.request }}
  agreements: ${{ inputs.agreements }}
  thread: ${{ inputs.thread }}
sequence:
- id: consult
  include: ../../recipes/adaptive3/consultation.yaml
  inputs:
    cell: ${{ inputs.cell }}
    shared_review: ${{ inputs.shared_review }}
    mode: ${{ inputs.mode }}
    thread: ${{ inputs.thread }}
    request: ${{ inputs.request }}
    agreements: ${{ inputs.agreements }}
outputs:
  started: ${{ sequence.consult.outputs.started }}
  agreement: ${{ sequence.consult.outputs.agreement }}
  agreements: ${{ sequence.consult.outputs.agreements }}
  result: ${{ sequence.consult.outputs.result }}
