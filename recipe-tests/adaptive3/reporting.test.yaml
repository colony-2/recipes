recipe: reporting.yaml
cases:
- id: incomplete-measurements-return-to-the-writer
  type: integration_case
  runtime: &id005
    cells:
      root:
        files:
          core.txt: |
            old
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: reporting-test/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  mocks:
    ops:
    - match: &id001
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs: &id002
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/changes.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            - document_id: review/evidence/completed-storage.md
              title: Completed storage measurements
              description: Check the completed delegated result used in the storage totals.
              role: supporting
              order: 10
            - document_id: review/evidence/pending-search.md
              title: Pending search work
              description: Confirm that unfinished owner work is excluded from the reported totals.
              role: supporting
              order: 20
            status: ready
            summary: Review the measured changes.
            title: Merge the local draft check
            primary: review/changes.md
            work_kind: feature
        effects: &id003
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Review the measured changes.
        artifacts:
          review/changes.md: |
            # Changes
            Added draft checks; measured per-cell and per-file reports are absent.
          review/evidence/completed-storage.md: |
            Completed storage result: api.go +4/-2; api_test.go +3/-0. Required checks passed.
          review/evidence/pending-search.md: |
            Search work is still pending. No completed result or measurements are available.
    - match: *id001
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: 'Missing measured report: provide per-file and per-cell/category totals; count harnesses as
              tests, mark binaries uncountable and verify completed storage evidence.'
        effects: &id006
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Report actual per-cell additions/removals and per-file support; include harness code under
                  tests.
    - &id007
      match: *id001
      behavior:
        mode: return
        outputs: *id002
        effects: *id003
        artifacts:
          review/changes.md: |
            # Merge the local draft check

            ## What changed

            | Cell | Core + / - | Tests + / - | Docs + / - |
            | --- | --- | --- | --- |
            | root | 2 / 1 | 1 / 0 | 1 / 0 |
            | storage | 4 / 2 | 3 / 0 | 0 / 0 |

            Root: core.txt +2/-1; harness/runner.py +1/-0 (test framework);
            docs/guide.md +1/-0. image.bin is binary, no line count.
            Storage's completed result reports api.go +4/-2 and api_test.go +3/-0.
            No pending work is included in these totals.

            Completed storage evidence: [retrieved result](evidence/completed-storage.md).
            Search remains pending and is excluded: [owner status](evidence/pending-search.md).
          review/evidence/completed-storage.md: |
            Completed storage result: api.go +4/-2; api_test.go +3/-0. Required checks passed.
          review/evidence/pending-search.md: |
            Search work is still pending. No completed result or measurements are available.
    - &id008
      match: *id001
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Counts and classifications match the candidate and supplied completed owner results.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Counts and classifications match the candidate and supplied completed owner results.
    - &id009
      match:
        op: command_execution
      repeat: true
      behavior: &id004
        mode: passthrough
    - &id010
      match:
        selector: ./recipes/review-v2
      repeat: true
      behavior: *id004
  assertions:
  - &id011
    type: cel_true
    expr: outputs.result.status=="accepted" && size(reviews)==1
  - &id012
    type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/validate/") && has(c.inputs.inputs.prompt)))==2
  - &id013
    type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.inputs.inputs.prompt)))==2
  - &id014
    type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/approved_change/")))==2
  - &id015
    type: cel_true
    expr: outputs.reference.counts.contains("2\t1\tcore.txt\n") && outputs.reference.counts.contains("1\t0\tharness/runner.py\n")
      && outputs.reference.counts.contains("1\t0\tdocs/guide.md\n") && outputs.reference.counts.contains("-\t-\timage.bin\n")
  - &id016
    type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/validate/") && has(c.inputs.inputs.prompt)).all(c,"work/error/change-counts.tsv"
      in c.artifacts && c.artifacts["work/error/change-counts.tsv"]==outputs.reference.counts && "work/candidate.diff"
      in c.artifacts && c.artifacts["work/candidate.diff"]==outputs.reference.patch)
  - &id017
    type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/validate/") && has(c.inputs.inputs.prompt)).all(c,c.artifacts["work/review/evidence/completed-storage.md"].contains("api.go
      +4/-2; api_test.go +3/-0") && c.artifacts["work/review/evidence/pending-search.md"].contains("still pending"))
  - &id018
    type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/validate/") && has(c.inputs.inputs.prompt)).all(c,c.inputs.inputs.prompt.contains("Read
      error/change-counts.tsv") && c.inputs.inputs.prompt.contains("invented or inconsistent reports return changes")
      && c.inputs.inputs.prompt.contains("Test frameworks, harnesses and fixtures are test code"))
  - &id019
    type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.inputs.inputs.prompt))[1].artifacts["work/review/evidence/completed-storage.md"].contains("Completed
      storage result")
  - type: cel_true
    expr: 'calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.inputs.inputs.prompt))[1].inputs.inputs.prompt.contains("Missing
      measured report: provide per-file and per-cell/category totals; count harnesses as tests, mark binaries uncountable
      and verify completed storage evidence.")'
- id: invented-counts-return-to-the-writer
  type: integration_case
  runtime: *id005
  mocks:
    ops:
    - match: *id001
      behavior:
        mode: return
        outputs: *id002
        effects: *id003
        artifacts:
          review/changes.md: |
            # Merge the local draft check

            ## What changed

            | Cell | Core + / - | Tests + / - | Docs + / - |
            | --- | --- | --- | --- |
            | root | 900 / 1 | 1 / 0 | 1 / 0 |
            | storage | 4 / 2 | 3 / 0 | 0 / 0 |

            Root: core.txt +900/-1; harness/runner.py +1/-0 (test framework);
            docs/guide.md +1/-0. image.bin is binary, no line count.
            Storage's completed result reports api.go +4/-2 and api_test.go +3/-0.
            No pending work is included in these totals.

            Completed storage evidence: [retrieved result](evidence/completed-storage.md).
            Search remains pending and is excluded: [owner status](evidence/pending-search.md).
          review/evidence/completed-storage.md: |
            Completed storage result: api.go +4/-2; api_test.go +3/-0. Required checks passed.
          review/evidence/pending-search.md: |
            Search work is still pending. No completed result or measurements are available.
    - match: *id001
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: 'Invented count: core.txt is +2/-1, not +900/-1. Correct the per-file entry and root core totals
              against native measurements.'
        effects: *id006
    - *id007
    - *id008
    - *id009
    - *id010
  assertions:
  - *id011
  - *id012
  - *id013
  - *id014
  - *id015
  - *id016
  - *id017
  - *id018
  - *id019
  - type: cel_true
    expr: 'calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.inputs.inputs.prompt))[1].inputs.inputs.prompt.contains("Invented
      count: core.txt is +2/-1, not +900/-1. Correct the per-file entry and root core totals against native measurements.")'
