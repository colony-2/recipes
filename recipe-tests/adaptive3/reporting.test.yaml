  - *id017
  - *id018
  - *id019
  - type: cel_true
    expr: 'calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.inputs.inputs.prompt))[1].inputs.inputs.prompt.contains("Inconsistent
      totals: root core is +2/-1 and tests +1/-0. Keep harness/runner.py in tests; correct the category totals.")'
- id: complete-report-needs-no-correction
  type: integration_case
  runtime: *id005
  mocks:
    ops:
    - *id007
    - *id008
    - *id009
    - *id010
  assertions:
  - *id011
  - type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/validate/") && has(c.inputs.inputs.prompt)))==1
  - type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.inputs.inputs.prompt)))==1
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/approved_change/")))==1
  - *id015
  - *id016
  - *id017
  - *id018
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.inputs.inputs.prompt))[0].artifacts["work/evidence/completed-storage.md"].contains("Completed
      storage result")
