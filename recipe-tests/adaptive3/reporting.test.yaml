  type: integration_case
  runtime: *id005
  mocks:
    ops:
    - match: *id001
      behavior:
        mode: return
        outputs: *id002
        effects: *id003
        artifacts:
          review/changes.md: |
            # Merge the local draft check

            ## What changed

            | Cell | Core + / - | Tests + / - | Docs + / - |
            | --- | --- | --- | --- |
            | root | 3 / 1 | 0 / 0 | 1 / 0 |
            | storage | 4 / 2 | 3 / 0 | 0 / 0 |

