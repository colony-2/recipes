recipe: reporting.yaml
cases:
- id: incomplete-measurements-return-to-the-writer
  type: integration_case
  runtime:
    cells:
      root:
        files:
          core.txt: |
            old
    responses:
    - node_path: reporting-test/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Review the measured changes.
            title: Merge the local draft check
            primary: review/changes.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Review the measured changes.
        artifacts:
          review/changes.md: |
            # Changes
            Added draft checks.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Report actual per-cell additions/removals and per-file support; include harness code under
              tests.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Report actual per-cell additions/removals and per-file support; include harness code under
                  tests.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Review the measured changes.
            title: Merge the local draft check
            primary: review/changes.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Review the measured changes.
        artifacts:
          review/changes.md: |
            # Merge the local draft check

            ## What changed

            | Cell | Core + / - | Tests + / - | Docs + / - |
            | --- | --- | --- | --- |
            | root | 2 / 1 | 1 / 0 | 1 / 0 |
            | storage | 4 / 2 | 3 / 0 | 0 / 0 |

            Root: core.txt +2/-1; harness/runner.py +1/-0 (test framework);
            docs/guide.md +1/-0. image.bin is binary, no line count.
            Storage's completed result reports api.go +4/-2 and api_test.go +3/-0.
            No pending work is included in these totals.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Counts and classifications match the candidate and supplied completed owner results.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Counts and classifications match the candidate and supplied completed owner results.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted" && size(reviews)==1
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/approved_change/")))==2
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/validate/")).all(c,c.inputs.inputs.prompt.contains("Test
      frameworks, harnesses and fixtures are test code"))
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && c.inputs.inputs.prompt.contains("Report
      actual per-cell"))
