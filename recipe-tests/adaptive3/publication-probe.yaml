schema_version: 2
id: publication-probe
input_schema:
  prompt:
    type: string
  documents:
    type: object
sequence:
- id: inspect_start
  op: command_execution
  inputs:
    run: |
      python3 - <<'PY'
      import json, pathlib, subprocess
      print(json.dumps({
          'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
          'published': pathlib.Path('published.txt').read_text().strip(),
          'candidate': pathlib.Path('caller-only.txt').exists(),
      }))
      PY
outputs:
  startup: ${{ json_parse(sequence.inspect_start.outputs.stdout) }}
