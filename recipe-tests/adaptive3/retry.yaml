schema_version: 2
id: retry-test
input_schema:
  previous: {type: object, required: true}
  receipt: {type: object, default_value: {}}
  checkpoints: {type: array, default_value: []}
  dispatch: {type: boolean, default_value: false}
inputs:
  previous: ${{ inputs.previous }}
  receipt: ${{ inputs.receipt }}
  checkpoints: ${{ inputs.checkpoints }}
  dispatch: ${{ inputs.dispatch }}
sequence:
- id: update
  include: ../../recipes/adaptive3/retry.yaml
  inputs:
    previous: ${{ inputs.previous }}
    receipt: ${{ inputs.receipt }}
    checkpoints: ${{ inputs.checkpoints }}
    dispatch: ${{ inputs.dispatch }}
outputs:
  event: ${{ sequence.update.outputs.change.event }}
  retry: ${{ sequence.update.outputs.change.retry }}
