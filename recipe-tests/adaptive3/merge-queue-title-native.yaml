# Strict metadata-only receiver for controlled native grouping and replay checks.
schema_version: 2
id: merge-queue-title-native
input_schema:
  branch: {type: string, required: true}
  verification_policy: {type: object, required: true}
inputs:
  branch: ${{ inputs.branch }}
  verification_policy: ${{ inputs.verification_policy }}
sequence:
- id: metadata
  op: command_execution
  const: true
  inputs:
    run: |
      python3 - <<'PY'
      import json, subprocess
      dag = json.loads(subprocess.check_output(['c2j', 'job', 'dag', 'self', '--subtree', '--json']))
      assert dag['coverage']['complete'], dag['coverage']
      own = [node for node in dag['nodes'] if node['id'] == dag['selected']['id']]
      assert len(own) == 1, dag
      print(json.dumps({'id': own[0]['id'], 'title': own[0]['title']}))
      PY
outputs:
  metadata: ${{ json_parse(sequence.metadata.outputs.stdout) }}
  version: 1
  branch: ${{ inputs.branch }}
  requested: ${{ jq(context.grouping.appends.map(a,a.content.changeid), 'sort') }}
  results: >-
    ${{ context.grouping.appends.map(a,{'changeid': a.content.changeid, 'status': 'fail-conflict'}) }}
