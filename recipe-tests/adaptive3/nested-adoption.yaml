schema_version: 2
id: nested-adoption-test
sequence:
- id: existing
  op: recipes.run
  inputs:
    recipes:
    - cell_name: storage
      name: unused-by-fixture
      title: Existing storage attempt
- id: owner
  include: ../../recipes/adaptive3/consultation.yaml
  inputs:
    cell: storage
    request: Can we use the existing delivered result?
    mode: advice
outputs:
  result: ${{ sequence.owner.outputs.result }}
  existing: ${{ sequence.existing.outputs.job_ids[0] }}
