recipe: retry.yaml
cases:
- id: first-failed-check-gets-a-repair
  type: integration_case
  runtime: {}
  inputs: {failed: [restore]}
  assertions: [{type: output_equals, path: repair.repeated, value: false}]
- id: same-check-after-repair-stops
  type: integration_case
  runtime: {}
  inputs: {previous_failure: [restore], failed: [restore]}
  assertions: [{type: output_equals, path: repair.repeated, value: true}]
- id: independent-check-now-passes
  type: integration_case
  runtime: {}
  inputs: {previous_failure: [restore], failed: [reload], checkpoints: [verify/restore]}
  assertions: [{type: output_equals, path: repair.advanced, value: true}, {type: output_equals, path: repair.repeated, value: false}]
- id: summary-alone-keeps-the-finite-visit-limit
  type: integration_case
  runtime: {}
  inputs: {previous: {checkpoints: [verify/save]}, checkpoints: [verify/save]}
  assertions: [{type: output_equals, path: repair.advanced, value: false}, {type: output_equals, path: repair.repeated, value: false}]
