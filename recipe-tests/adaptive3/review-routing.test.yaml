recipe: review.yaml
cases:
- id: explicit-direction-destination
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Drafts
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: review-test/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: revise
        feedback: Keep the current scope.
        attachments: []
        settings:
          return_to: direction
  inputs:
    purpose: outcome
    decision: outcome
    title: Saved drafts
    with_documents: true
  assertions:
  - type: cel_true
    expr: outputs.result.status=="changes" && outputs.result.stage=="direction" &&
      outputs.result.human.response.settings.return_to=="direction"
  - type: cel_true
    expr: size(reviews)==1 && reviews[0].form.request.directions.exists(d,d.id=="annotate")
      && !calls.exists(c,c.op=="merge")
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Revise the selected work.
            stage: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Keep one saved draft.
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
