    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
