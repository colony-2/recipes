  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: calls.filter(c,c.op=="input" && c.node_path.contains("/direction/")).size()==0
  - type: cel_true
    expr: calls.filter(c,c.op=="command_execution" && c.node_path.endsWith("/verify_browser")).size()==2
