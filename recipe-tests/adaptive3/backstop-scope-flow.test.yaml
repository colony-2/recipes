recipe: ../../adaptive3.yaml
cases:
- id: phone-criterion-amendment-refreshes-plan-verification-and-outcome
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/verify.yaml: "id: browser-verification\nsequence:\n- id: verify_browser\n  op:\
            \ command_execution\n  inputs:\n    run: test \"$(cat marker.txt)\" = done\noutputs:\n  api_version:\
            \ c2.build-hook/v1\n  status: passed\n  summary: Browser validation passed. Phone evidence is a separate\
            \ outcome requirement.\n  artifact_refs: {}\n"
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/preparation/preparation/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept_fully
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: reply
        feedback: Remove only the phone acceptance criterion. Keep browser validation.
        attachments: []
        settings: {}
    - node_path: adaptive3/preparation/preparation/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    merge_queue: false
    prompt: Save drafts across restart. Require browser and phone validation.
    require_verification: true
  mocks:
