recipe: ../../adaptive3.yaml
cases:
- id: phone-criterion-amendment-refreshes-plan-verification-and-outcome
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/verify.yaml: |
            id: browser-verification
            sequence:
            - id: verify_browser
              op: command_execution
              inputs:
                run: test "$(cat marker.txt)" = done
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Browser validation passed. Phone evidence is a separate outcome requirement.
              artifact_refs: {}
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept_fully
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: reply
        feedback: Remove only the phone acceptance criterion. Keep browser validation.
        attachments: []
        settings: {}
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    merge_queue: false
    prompt: Save drafts across restart. Require browser and phone validation.
    require_verification: true
  mocks:
    ops:
    - &id003
      match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Direction the assigned work.
            documents: []
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects: &author_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &id001
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Assess the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id002
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - &id004
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: preparation
            instruction: Preparation the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/one-pager.md
            work_kind: feature
            document_details:
            - document_id: review/design.md
              title: Design
              description: Review the implementation plan.
              role: supporting
              order: 0
            - document_id: review/acceptance.md
              title: Acceptance criteria
              description: Review the required checks.
              role: supporting
              order: 1
            - document_id: review/one-pager.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects: *author_session
        artifacts:
          review/one-pager.md: Restore saved drafts. [Design](design.md) and [Acceptance criteria](acceptance.md).
          review/design.md: Persist drafts and restore the most recent save after restart.
          review/acceptance.md: Drafts survive restart in a browser and on a phone.
