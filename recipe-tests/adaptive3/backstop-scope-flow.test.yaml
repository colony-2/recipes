  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: calls.exists(c,c.node_path.contains("/direction/") && c.op=="extension_execution" && has(c.inputs.inputs.prompt)
      && c.inputs.inputs.prompt.contains("what the installation may run before") && c.inputs.inputs.prompt.contains("Private
      pnpm installation permits direct, transitive and selected") && c.inputs.inputs.prompt.contains("optional dependency
      builds, mutable transitives"))
  - type: cel_true
    expr: size(reviews)==4 && reviews[1].form.request.title=="Phone evidence needs a decision" && "review/acceptance.md" in reviews[2].form.request.documents
  - type: cel_true
    expr: reviews[0].form.request.review_id==reviews[2].form.request.review_id && reviews.map(r,r.form.request.revision)==[1,1,2,1]
      && reviews[2].form.request.conversation[0].receipt.request_id==reviews[0].request_id
      && reviews[0].request_id!=reviews[2].request_id && reviews[0].form.request.documents!=reviews[2].form.request.documents
      && reviews[1].form.request.review_id!=reviews[0].form.request.review_id && reviews[3].form.request.review_id!=reviews[0].form.request.review_id
  - type: cel_true
    expr: calls.filter(c,c.op=="input" && c.node_path.contains("/direction/")).size()==0
  - type: cel_true
    expr: calls.filter(c,c.op=="command_execution" && c.node_path.endsWith("/verify_browser")).size()==2
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/preparation/")
      && c.node_path.contains("/execute/")).size()==2
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/direction/")
      && c.node_path.contains("/execute/"))[1].inputs.inputs.prompt.contains("Remove only the phone")
