schema_version: 2
id: child-fixture
input_schema:
  fail:
    type: boolean
    default_value: false
inputs:
  fail: ${{ inputs.fail }}
sequence:
- id: result
  op: command_execution
  inputs:
    env:
      FAIL: ${{ string(inputs.fail) }}
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |-
      printf retained > "$OUTBOX/result.txt"
      if [ "$FAIL" = true ]; then echo fixture-failure >&2; exit 9; fi
      printf completed
outputs:
  summary: Owner completed the agreed request.
  status: passed
  artifact_refs: ${{ sequence.result.artifacts }}
