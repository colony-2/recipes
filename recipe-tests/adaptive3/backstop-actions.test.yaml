recipe: backstop.yaml
cases:
- type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Disposable validation project.
    responses: []
  inputs:
    stage: implementation
    request: Validate the local correction.
    problem:
      status: stuck
      summary: Validation interrupted.
      loop: work
  id: available-action-resumes-automatically
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun local validation with the available browser.
            stage: implementation
            summary: The local prerequisite passed. Apply authorizes rerunning validation only.
            title: Resume local validation
            primary: null
            additional_attempts: 3
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The local prerequisite passed. Apply authorizes rerunning validation only.
  assertions:
  - type: cel_true
    expr: size(reviews)==0
  - type: cel_true
    expr: outputs.result.status=="resume" && outputs.result.action=="Rerun local validation with the available browser."
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution").all(c,c.inputs.inputs.output.schema.properties.stage.enum.exists(s,s==null)
      && !c.inputs.inputs.output.schema.properties.stage.enum.exists(s,s=="integration"))
