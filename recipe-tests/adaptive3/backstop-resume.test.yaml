          review/README.md: '# Outcome

            A marker was added.'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/direction/"))'
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/preparation/"))'
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)))[0].node_path.contains("/backstop/")
  - type: cel_true
    expr: calls.exists(c,c.node_path.contains("/implementation/") && (c.op=="extension_execution" && has(c.inputs.inputs.prompt))
      && c.inputs.inputs.prompt.contains("original-request"))
  - type: cel_true
    expr: calls.exists(c,c.node_path.contains("/implementation/") && c.node_path.contains("/review_files/"))
  - type: output_equals
    path: work_kind
    value: bug
  - type: cel_true
    expr: '[0,1,2].all(i,calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)))[i].node_path.contains("/backstop/"))'
  - type: cel_true
    expr: '!reviews[0].form.request.directions.exists(o,o.id=="continue") &&
      !reviews[1].form.request.directions.exists(o,o.id=="continue") && reviews[2].form.request.directions.exists(o,o.id=="continue")'
