recipe: ../../adaptive3.yaml
cases:
- id: diagnosis-does-not-enter-configure-fallback
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: reply
        feedback: What remains?
        attachments: []
        settings: {}
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: reply
        feedback: The prerequisite is now available; reconsider the correction.
        attachments: []
        settings: {}
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: continue
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    merge_queue: false
    prompt: Add a marker file.
    resume_from: previous-job
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: null
            stage: integration
            summary: Source was delivered; the route needed for recovery remains unavailable. Discuss the prerequisite.
            title: Restore progress on implementation
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Approved direction
              description: The existing scope and approval for the work to resume.
              role: primary
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The original direction remains approved. Restore the unfinished implementation and validate
                  it completely.
        artifacts:
          review/README.md: '# Approved direction

            Preserve the current scope.

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: null
            stage: integration
            summary: Source was delivered; the route needed for recovery remains unavailable. Discuss the prerequisite.
            title: Restore progress on implementation
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Approved direction
              description: The existing scope and approval for the work to resume.
              role: primary
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The original direction remains approved. Restore the unfinished implementation and validate
                  it completely.
        artifacts:
          review/README.md: '# Approved direction

            Preserve the current scope.

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            instruction: {text: Reconsider the recovery now that the prerequisite is available., scope_change: false}
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: implementation
            summary: The original direction remains approved. Restore the unfinished implementation and validate
              it completely.
            approval:
              source_job: previous-job
              source_task: original-human-review
              receipt:
                actor:
                  id: human
                  kind: human
                request_id: original-request
                submission_id: original-decision
                submitted_at: '2026-11-12T11:00:00Z'
              patch: null
            title: Restore progress on implementation
            primary: review/README.md
            document_details:
            - document_id: review/README.md
              title: Approved direction
              description: The existing scope and approval for the work to resume.
              role: primary
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The original direction remains approved. Restore the unfinished implementation and validate
                  it completely.
        artifacts:
          review/README.md: '# Approved direction

            Preserve the current scope.

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            commit: {title: Record the completed marker, body: Write the marker so completion is visible.}
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: bug
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 0
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
          worktree:
            marker.txt: 'done

              '
        artifacts:
          review/README.md: '# Implementation'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: bug
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 0
        effects:
          objects:
