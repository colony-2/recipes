schema_version: 2
id: validate-amendment-notes
sequence:
- id: evidence
  op: command_execution
  inputs:
    env:
      REPORT_OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      mkdir -p "$REPORT_OUTBOX/review" "$REPORT_OUTBOX/feedback/native" "$REPORT_OUTBOX/prior"
      printf '# Current direction\n\nKeep browser validation. Phone criterion removed by instruction.\n' > "$REPORT_OUTBOX/review/direction.md"
      printf 'Remove only the phone criterion. 日本語 template-like text\n' > "$REPORT_OUTBOX/feedback/native/notes.md"
      printf '# Earlier direction\n' > "$REPORT_OUTBOX/prior/direction.md"
- id: validate
  include: ../../recipes/adaptive3/validate.yaml
  inputs:
    purpose: direction
    request: Keep saved drafts with browser validation.
    documents: ${{ {'review/direction.md':sequence.evidence.artifacts['review/direction.md']} }}
    finding:
      amendment:
        instruction: Apply only the attached scope instruction.
        documents:
          feedback/native/notes.md: ${{ sequence.evidence.artifacts['feedback/native/notes.md'] }}
          review/direction.md: ${{ sequence.evidence.artifacts['prior/direction.md'] }}
    work:
      status: ready
      title: Updated validation scope
      primary: review/direction.md
      document_details:
      - document_id: review/direction.md
        title: Current validation scope
        description: Check the precise amendment against the original instruction.
        role: primary
        order: 0
outputs:
  result: ${{ sequence.validate.outputs.result }}
