recipe: duplicate-config-keys.yaml
cases:
- id: duplicate-proposal-before-binding
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Disposable package configuration fixture.
          .c2/config.yaml: |
            packages: []
    observe_files:
    - .c2/config.yaml
  inputs:
    check: package_config
    documents:
      review/config.yaml:
        kind: value
        name: review/config.yaml
        format: text
        value: |
          packages: ["uv:pytest==8.3.5"]
          packages: ["uv:pytest==8.3.5"]
    requests: &id001
    - reference: uv:pytest==8.3.5
      check:
      - pytest
      - --version
    write: false
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: changes
  - type: cel_true
    expr: size(calls.filter(c,c.op=="command_execution"))==2
  - type: cel_true
    expr: 'outputs.config=="packages: []\n"'
  - type: cel_true
    expr: outputs.result.summary.contains("Duplicate YAML mapping key")
  - type: cel_true
    expr: 'calls.filter(c,c.node_path.endsWith("/package_config/package_config")).all(c,c.outputs.stdout.contains(''"approved":
      {}'') && c.outputs.stdout.contains(''"written": false''))'
