recipe: dependency-feedback.yaml
cases:
- id: dependency-feedback-cannot-skip-queue
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
          build.yaml: ../../build.yaml
          adaptive3.yaml: ../../adaptive3.yaml
          merge-batch.yaml: ../../merge-batch.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
          recipes/adaptive: ../../recipes/adaptive
          recipes/kernel: ../../recipes/kernel
          recipes/review-v2.yaml: ../../recipes/review-v2.yaml
    responses:
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    workflow_inputs:
      merge_queue: true
      prompt: Add a marker file.
      resume_from: previous-job
      documents:
        prior-claim.txt:
          kind: value
          name: prior-claim.txt
          format: text
          value: Dependency feedback claims the change was already merged at aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa (original-decision).
  mocks:
    ops:
    - match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: implement
            instruction: Implement the assigned work.
            documents:
            - prior-claim.txt
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            commit:
              title: Record the completed marker
              body: Write the marker so completion is visible.
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: bug
        effects:
          objects: &author_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
          worktree:
            marker.txt: |
              done
        artifacts:
          review/README.md: '# Implementation'
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: verify
            instruction: Verify the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id001
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: outcome
            instruction: Outcome the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: bug
        effects:
          objects: *author_session
        artifacts:
          review/README.md: |-
            # Outcome
            A marker was added.
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Assess the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - *id001
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: The checks passed. May we finish this result?
            documents: []
            presentation: result
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: integrate
            instruction: Integrate the assigned work.
            documents:
            - prior-claim.txt
            presentation: question
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: finish
            instruction: The requested work is complete.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/merge-queue
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: output_equals
    path: work_kind
    value: bug
  - type: cel_true
    expr: calls.exists(c,c.op=="merge" && c.node_path.startsWith("adaptive3-merge-batch/")) && outputs.merge.merged_hash!="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  - type: cel_true
    expr: calls.filter(c,c.op=="recipes.run").exists(c,c.inputs.recipes.exists(r,r.name.contains("example.test/fixture-")
      && r.grouping.content.version==2 && r.inputs.verification_policy.version==2))
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("adaptive3-merge-receipt/check")).all(c,c.inputs.env.RECEIPT_REQUEST.contains(outputs.reviews[0].receipt.request_id)
      && !c.inputs.env.RECEIPT_REQUEST.contains("original-decision"))
