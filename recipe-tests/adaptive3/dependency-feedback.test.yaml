recipe: dependency-feedback.yaml
cases:
  - id: dependency-feedback-cannot-skip-queue
    type: integration_case
    runtime:
      cells:
        root:
          files:
            README.md: A small project.
          file_sources:
            recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
            recipes/review-v2.py: ../../recipes/review-v2.py
            build.yaml: ../../build.yaml
            adaptive3.yaml: ../../adaptive3.yaml
            merge-batch.yaml: ../../merge-batch.yaml
            merge-check.yaml: ../../merge-check.yaml
            recipes/adaptive3: ../../recipes/adaptive3
            recipes/merge-queue: ../../recipes/merge-queue
            recipes/adaptive: ../../recipes/adaptive
            recipes/kernel: ../../recipes/kernel
            recipes/review-v2.yaml: ../../recipes/review-v2.yaml
      responses:
        - node_path: adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
          response:
            direction: accept
            feedback: ""
            attachments: []
            settings: {}
      observe_files:
        - marker.txt
    inputs:
      workflow_inputs:
        merge_queue: true
        prompt: Add a marker file.
        resume_from: previous-job
    mocks:
      ops:
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                document_details:
                  - document_id: review/README.md
                    title: Supporting evidence
                    description: Check the evidence for this result.
                    role: supporting
                    order: 0
                status: resume
                action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
                stage: implementation
                summary: The original direction remains approved. Restore the unfinished implementation and validate it completely.
                approval:
                  source_job: previous-job
                  source_task: original-human-review
                  receipt:
                    actor:
                      id: human
                      kind: human
                    request_id: original-request
                    submission_id: original-decision
                    submitted_at: "2026-11-12T11:00:00Z"
                  patch: null
                title: Restore progress on implementation
                primary: null
                publication:
                  source_job: upstream-job
                  source_task: upstream-merge
                  merged_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  target_branch: refs/heads/main
                  publication_branch: refs/heads/main
                  publication_disposition: published
                  candidate_sha: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  candidate_subject: Upstream dependency
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: The original direction remains approved. Restore the unfinished implementation and validate it completely.
            artifacts:
              review/README.md: |
                # Approved direction
                Preserve the current scope.
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                document_details:
                  - document_id: review/README.md
                    title: Requested outcome
                    description: Read the proposed result and decision.
                    role: primary
                    order: 10
                status: ready
                summary: Current work is ready.
                title: Review the requested outcome
                primary: review/README.md
                work_kind: bug
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: Current work is ready.
              worktree:
                marker.txt: |
                  done
            artifacts:
              review/README.md: '# Implementation'
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: passed
                summary: Checked the assignment.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: Checked the assignment.
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                document_details:
                  - document_id: review/README.md
                    title: Requested outcome
                    description: Read the proposed result and decision.
                    role: primary
                    order: 10
                status: ready
                summary: Current work is ready.
                title: Review the requested outcome
                primary: review/README.md
                work_kind: bug
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: Current work is ready.
            artifacts:
              review/README.md: |-
                # Outcome
                A marker was added.
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: passed
                summary: Checked the assignment.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: Checked the assignment.
        - match:
            op: command_execution
          repeat: true
          behavior:
            mode: passthrough
        - match:
            op: squash
          repeat: true
          behavior:
            mode: passthrough
        - match:
            op: merge
          repeat: true
          behavior:
            mode: passthrough
        - match:
            selector: ./recipes/review-v2
          repeat: true
          behavior:
            mode: passthrough
        - match:
            selector: ./recipes/merge-queue
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.merge.merged_hash != ""
      - type: cel_true
        expr: repositories.root.files["marker.txt"] == "done\n"
      - type: cel_true
        expr: '!calls.exists(c,c.node_path.contains("/direction/"))'
      - type: cel_true
        expr: '!calls.exists(c,c.node_path.contains("/preparation/"))'
      - type: cel_true
        expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)))[0].node_path.contains("/backstop/")
      - type: cel_true
        expr: calls.exists(c,c.node_path.contains("/implementation/") && (c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.inputs.inputs.prompt.contains("original-request"))
      - type: cel_true
        expr: calls.exists(c,c.node_path.contains("/implementation/") && c.node_path.contains("/review_files/"))
      - type: output_equals
        path: work_kind
        value: bug
      - type: cel_true
        expr: calls.exists(c,c.op=="merge" && c.node_path.startsWith("adaptive3-merge-batch/")) && outputs.merge.merged_hash!="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      - type: cel_true
        expr: calls.filter(c,c.op=="recipes.run").exists(c,c.inputs.recipes.exists(r,r.name.contains("example.test/fixture-") && r.grouping.content.version==2 && r.inputs.verification_policy.version==2))
      - type: cel_true
        expr: calls.filter(c,c.node_path.endsWith("adaptive3-merge-receipt/check")).all(c,c.inputs.env.RECEIPT_REQUEST.contains(outputs.reviews[0].receipt.request_id) && !c.inputs.env.RECEIPT_REQUEST.contains("original-decision"))
