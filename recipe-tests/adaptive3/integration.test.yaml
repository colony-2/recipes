recipe: integration.yaml
cases:
- id: approval-unchanged-rebase
  type: integration_case
  runtime:
    cells:
      root:
        files:
          candidate.txt: |
            original
            Context one
            Context two
            Neighboring test name
            Context four
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: approval-test/first_review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    extra: ''
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: rebase
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: outputs.result.status=="accepted"
