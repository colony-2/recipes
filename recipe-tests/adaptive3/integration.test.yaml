recipe: integration.yaml
cases:
- id: approval-unchanged-rebase
  type: integration_case
  runtime:
    cells:
      root:
        files:
          candidate.txt: |
            original
            Context one
            Context two
            Neighboring test name
            Context four
    responses:
    - node_path: approval-test/first_review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  inputs:
    extra: ''
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: rebase
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: outputs.result.status=="accepted"
