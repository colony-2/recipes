recipe: backstop-validation-notes.yaml
cases:
- id: amendment-validation-reads-original-notes-and-current-direction
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Scope amendment validation fixture.
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: The current scope applies only the original human instruction.
  assertions:
  - type: output_equals
    path: result.status
    value: passed
  - type: cel_true
    expr: calls.filter(c,c.op=='extension_execution' && has(c.inputs.inputs.prompt)).all(c,c.artifacts['work/feedback/native/notes.md'].contains('Remove only the phone criterion.') && c.artifacts['work/review/direction.md'].startsWith('# Current direction'))
