# External agent decisions are scripted; review/discussion code executes unchanged.
id: scripted-browser-agent
inputs:
  prompt: ${{ inputs.prompt }}
  documents: ${{ inputs.?documents.orValue({}) }}
sequence:
- id: read
  op: command_execution
  artifacts:
    work/: ${{ inputs.documents }}
  inputs:
    env:
      AGENT_INBOX: ${{ context.environment.op.inbox }}
      AGENT_PROMPT: ${{ inputs.prompt }}
    run: |
      python3 - <<'PY'
      import pathlib,json,os
      root=pathlib.Path(os.environ['AGENT_INBOX'])/'work'
      document=(root/'review/design.md').read_text()
      notes=sorted(p.read_text() for p in (root/'feedback').rglob('notes.md'))
      edit_request='Please clarify restoration in the direction document.'
      text=os.environ['AGENT_PROMPT']
      if 'Do the original notes still apply?' in text:
          assert document=='# Revised saved drafts\n\nRevised original after explicit correction.\n'
          assert sorted(notes)==sorted(['first note','second note',edit_request])
          response={'status':'answer','stage':None,'summary':'Both original notes are available with the revised plan.'}
      elif edit_request in notes:
          assert 'Original bytes 日本語.' in document
          response={'status':'changes','stage':'direction','summary':'Clarify restoration in the direction document.'}
      else:
          assert notes in (['first note'], ['first note','second note'])
          assert 'Original bytes 日本語.' in document
          response={'status':'answer','stage':None,'summary':'Actual first answer.' if 'Second question?' not in text else 'Actual second answer.'}
      print(json.dumps(response))
      PY
outputs:
  valid_response: true
  response: ${{ json_parse(sequence.read.outputs.stdout) }}
  session: {}
  artifacts: {}
