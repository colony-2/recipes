schema_version: 2
id: browser-backstop
input_schema:
  prompt: {type: string, default_value: ''}
  external_document: {type: object, default_value: {}}
sequence:
- id: backstop
  include: adaptive3/backstop.yaml
  inputs:
    automatic: false
    stage: implementation
    request: Keep saved drafts after a restart; validate in the browser and on a phone.
    problem:
      summary: Browser validation passed. A required phone run is missing and no phone is available.
      loop: work
    prerequisites:
      configure: true
      direction: true
      preparation: true
      implementation: true
      outcome: false
      integration: false
outputs:
  result: ${{ sequence.backstop.outputs.result }}
  artifact_refs: ${{ sequence.backstop.outputs.documents }}
