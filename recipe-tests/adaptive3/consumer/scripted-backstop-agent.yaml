# Script only the external diagnosis. Production Backstop, forms and input run unchanged.
id: scripted-backstop-agent
inputs:
  prompt: ${{ inputs.prompt }}
sequence: []
outputs:
  session: {}
  artifacts: {}
  response: >-
    ${{ inputs.prompt.contains('Human choice: revise') ?
      {'status':'resume','stage':'direction','action':'Remove only the phone criterion; retain browser validation.',
       'instruction':{'text':'Remove only the phone acceptance criterion. Keep browser validation.','scope_change':true},
       'destination':null,'report':null,'additional_attempts':1,'summary':'Apply the precise human scope instruction in Direction.',
       'title':'Update the validation scope','primary':null,'document_details':[]} :
      {'status':'ask','stage':null,'action':null,'instruction':null,'destination':null,'additional_attempts':1,
       'summary':'Browser validation passed. Phone validation remains unmet. Give instructions or supply access to a phone.',
       'title':'Phone validation needs a decision','primary':null,'document_details':[],
       'report':{'origin':'A human requested saved drafts that survive a restart, with browser and phone validation. The original request is retained below.',
                 'work':'Implementation is saved and browser validation passed. No merge or publication has occurred.',
                 'blocker':'The required phone run is missing. The worker has no phone or device service, so another identical attempt will not establish it.',
                 'options':['Provide a phone or an approved device service and return to Implementation.','Instruct Backstop to remove the phone criterion in Direction while keeping browser validation.','Use the manual cancellation control to stop this job.'],
                 'recommendation':'Provide a phone if mobile support is still required. Otherwise give a precise scope instruction; Backstop will apply that instruction without a second Apply.',
                 'research':'The retained browser result covers the browser only. No phone evidence or device-service access has been established.'} } }}
