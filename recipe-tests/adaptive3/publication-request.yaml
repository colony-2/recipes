schema_version: 2
id: publication-request
input_schema:
  cell:
    type: string
    required: true
  mode:
    type: string
    default_value: delivery
inputs:
  cell: ${{ inputs.cell }}
  mode: ${{ inputs.mode }}
sequence:
  - id: save_candidate
    op: command_execution
    inputs:
      run: echo unpublished-caller > caller-only.txt
  - id: consultation
    include: ../../recipes/adaptive3/consultation.yaml
    inputs:
      cell: ${{ inputs.cell }}
      request: Implement the bounded local API enhancement and publish it independently.
      mode: "${{ inputs.mode == 'delivery' ? 'negotiate' : inputs.mode }}"
  - id: delivery
    include: ../../recipes/adaptive3/consultation.yaml
    when: inputs.mode == 'delivery' && nonempty(sequence.consultation.outputs.agreement.?assignment.orValue(''))
    inputs:
      cell: ${{ inputs.cell }}
      mode: delivery
      request: Please deliver the agreed behavior.
      thread: ${{ sequence.consultation.outputs.agreement.thread }}
      agreements: ${{ sequence.consultation.outputs.agreements }}
  - id: inspect_parent
    op: command_execution
    inputs:
      run: cat caller-only.txt
outputs:
  result: ${{ sequence.?delivery.orValue(sequence.consultation).outputs.result }}
  caller_saved: ${{ sequence.inspect_parent.outputs.stdout }}
