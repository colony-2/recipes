recipe: lifecycle.yaml
cases:
- id: prepare-diagnostics-return-to-the-working-agent
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Parent
          .c2/recipes/hooks/build/prepare.yaml: "id: prepare\nsequence:\n- id: probe\n  op: command_execution\n\
            \  inputs:\n    run: |-\n      if [ ! -f repaired.txt ]; then echo prepare-needs-repair >&2; exit\
            \ 7; fi\n      printf ok\noutputs:\n  api_version: c2.build-hook/v1\n  status: passed\n  summary:\
            \ Prepared.\n  artifact_refs: {}\n"
  inputs:
    purpose: implementation
    request: Complete the local change.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/change.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: The owner result is sufficient; continue this implementation.
            title: Review the implemented change
            primary: review/change.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The owner result is sufficient; continue this implementation.
        artifacts:
          review/change.md: '# Current implementation

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/change.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            commit: {title: Repair the candidate, body: Update the affected behavior and check the result.}
            summary: The owner result is sufficient; continue this implementation.
            title: Review the implemented change
            primary: review/change.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The owner result is sufficient; continue this implementation.
          worktree:
            repaired.txt: 'repaired

              '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: The local work and owner outcome satisfy the request.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The local work and owner outcome satisfy the request.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted"
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/")).size()==2
  - type: cel_true
    expr: calls.exists(c,c.op=="extension_execution" && c.node_path.contains("/execute/") && has(c.artifacts)
      && c.artifacts.exists(k,k.contains("error/hooks/prepare/") && c.artifacts[k].contains("prepare-needs-repair")))
  - type: cel_true
    expr: '"review/change.md" in outputs.documents'
- id: publish-failure-preserves-the-completed-merge-and-log
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Parent
          .c2/recipes/hooks/build/publish.yaml: "id: publish\nsequence:\n- id: publish\n  op: command_execution\n\
            \  inputs:\n    run: echo publish-needs-repair >&2; exit 9\noutputs:\n  api_version: c2.build-hook/v1\n\
            \  status: passed\n  summary: Published.\n  artifact_refs: {}\n"
  inputs:
    purpose: integration
    verification: {commit_message: "Record the local change\n\nCapture the accepted work.\n\nJob: https://jobs.colony2.com/fixture/jobs/implement"}
    request: Complete the local change.
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="stuck"
  - type: cel_true
    expr: size(outputs.result.publication.merged_hash)>0
  - type: cel_true
    expr: outputs.result.errors.exists(k,k.contains("error/hooks/publish/") && k.endsWith(".log"))
  - type: cel_true
    expr: calls.filter(c,c.op=="merge").size()==1
