schema_version: 2
id: adoption-test
sequence:
- id: existing
  op: recipes.run
  inputs:
    recipes:
    - cell_name: storage
      name: unused-by-fixture
      title: Existing storage attempt
- id: consultation
  include: ../../recipes/adaptive3/consultation.yaml
  inputs:
    cell: storage
    request: Consume the existing storage attempt.
    mode: delivery
    job: ${{ sequence.existing.outputs.job_ids[0] }}
outputs:
  existing: ${{ sequence.existing.outputs.job_ids[0] }}
  result: ${{ sequence.consultation.outputs.result }}
  documents: ${{ sequence.consultation.outputs.documents }}
