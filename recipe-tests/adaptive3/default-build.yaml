schema_version: 2
id: public-build-fixture
input_schema:
  build_inputs:
    type: object
    required: true
inputs:
  build_inputs: ${{ inputs.build_inputs }}
sequence:
- id: build
  op: recipe.run_and_get_result
  inputs:
    # Resolve the build and its queue children from the same fixture repository.
    name: ${{ 'git+' + context.git.repo + '//build.yaml@main' }}
    inputs: ${{ inputs.build_inputs }}
outputs:
  work_kind: ${{ sequence.build.outputs.outputs.work_kind }}
  merge: ${{ sequence.build.outputs.outputs.merge }}
  publication: ${{ sequence.build.outputs.outputs.publication }}
