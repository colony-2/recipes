recipe: consultation.yaml
cases:
- id: negotiate-without-delivery
  type: integration_case
  runtime: &owner_cells
    cells:
      root:
        files:
          README.md: Notebook
      storage:
        files:
          README.md: Versioned storage
    responses: []
  inputs:
    cell: storage
    mode: negotiate
    request: I want to retain old saves.
  mocks:
    ops:
    - &counteroffer
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: ready
            summary: I suggest keeping three distinct saves.
            assignment: 'Feature: retain three distinct saves.'
            work_kind: feature
            title: Use the existing version history API
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: I suggest keeping three distinct saves.
    - &valid_advice
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - &agree_terms
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: agree
            summary: These terms solve the consumer need.
    - &run_command
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.assignment.contains("three distinct saves")
  - type: cel_true
    expr: '!calls.exists(c,c.op=="recipes.run")'
  - type: cel_true
    expr: calls.exists(c,c.cell=="storage" && c.op=="extension_execution")
  - type: cel_true
    expr: outputs.agreement.documents.exists(k,k.endsWith("/report.md")) && outputs.agreement.documents.exists(k,k.endsWith("/transcript.md"))
- id: nested-owner-advice
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Notebook
      storage:
        files:
          README.md: Storage
      history:
        files:
          README.md: History
    responses: []
  inputs:
    cell: storage
    request: Can we retain old saves?
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: consult
            summary: Check the retention API.
            consultation:
              cell: history
              request: Do you already retain versions?
              mode: advice
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Check the retention API.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: ready
            summary: I retain three versions.
            assignment: 'Explanation: use the existing history API.'
            work_kind: explanation
            title: Use the existing version history API
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: I retain three versions.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: ready
            summary: Use our existing three-version history API.
            assignment: 'Explanation: use existing history.'
            work_kind: explanation
            title: Use the existing version history API
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Use our existing three-version history API.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: '!calls.exists(c,c.op=="recipes.run")'
  - type: cel_true
    expr: calls.exists(c,c.cell=="history" && c.op=="extension_execution")
  - type: cel_true
    expr: outputs.result.summary.contains("existing") && outputs.result.assignment == "" && !calls.exists(c,c.node_path.contains("/respond/"))
- id: delivery-receiver-request-and-result
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Notebook
      storage:
        files:
          README.md: Storage
    responses: []
  inputs:
    cell: storage
    request: Retain three saves.
    mode: delivery
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: ready
            summary: I can retain three saves.
            assignment: 'Feature: retain three distinct saves.'
            title: Retain three distinct saves
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: I can retain three saves.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: agree
            summary: These terms solve the consumer need.
    - match:
        op: recipes.run
      behavior:
        mode: return
        effects:
          children:
          - recipe: child.yaml
            cell: storage
            inputs:
              fail: false
            await: terminal
            bind: delivery
        outputs_expr: '{"job_ids":[children.delivery]}'
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="ready"
  - type: cel_true
    expr: size(calls.filter(c,c.op=="recipes.run"))==1
  - type: cel_true
    expr: 'calls.exists(c,c.op=="recipes.run" && c.inputs.recipes[0].inputs.prompt=="Feature: retain three distinct
      saves." && c.inputs.recipes[0].name.endsWith("adaptive3.yaml@main"))'
  - type: cel_true
    expr: ("children/" + outputs.result.child.job_id + "/results/result.txt") in outputs.documents
