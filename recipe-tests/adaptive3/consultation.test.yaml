- id: requester-answers-before-agreeing
  type: integration_case
  runtime: *owner_cells
  inputs:
    cell: storage
    mode: negotiate
    request: I want draft recovery after reopening.
  mocks:
    ops:
    - match: {selector: 'nix:github:colony-2/c2ops/published#codex'}
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response: {status: ready, negotiation_reply: question, summary: "Which version was lost?", document_details: []}
    - *valid_advice
    - match: {selector: 'nix:github:colony-2/c2ops/published#codex'}
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response: {status: reply, summary: The previous autosave disappears after reopening.}
    - *counteroffer
    - *valid_advice
    - *agree_terms
    - *run_command
  assertions:
  - type: cel_true
    expr: outputs.agreement.assignment.contains("three distinct saves") && !calls.exists(c,c.op=="recipes.run")
  - type: cel_true
    expr: >-
      calls.exists(c,c.node_path.endsWith("/write") && c.inputs.env.CONTENT.contains("previous autosave")
      && c.inputs.env.CONTENT.contains("Which version was lost?") && c.inputs.env.CONTENT.contains("These terms solve the consumer need."))
- id: requester-declines-delivery
  type: integration_case
  runtime: *owner_cells
  inputs: {cell: storage, request: Retain every version., mode: delivery}
  mocks:
    ops:
    - *counteroffer
    - *valid_advice
    - match: {selector: 'nix:github:colony-2/c2ops/published#codex'}
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response: {status: close, summary: The existing API covers our actual case.}
    - *run_command
  assertions:
  - type: cel_true
    expr: outputs.agreement.assignment=="" && !calls.exists(c,c.op=="recipes.run")
- id: explanation-ends-even-if-owner-offers-work
  type: integration_case
  runtime: *owner_cells
  inputs: {cell: storage, request: 'How do I restore a saved version?', mode: advice}
  mocks:
    ops: [*counteroffer, *valid_advice, *run_command]
  assertions:
  - type: cel_true
    expr: outputs.result.summary.contains('three distinct saves') && outputs.result.assignment=='' && outputs.agreement=={}
  - type: cel_true
    expr: '!calls.exists(c,c.op=="recipes.run" || c.node_path.contains("/respond/") || c.node_path.contains("/record/"))'
