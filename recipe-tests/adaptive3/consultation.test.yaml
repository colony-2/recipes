- id: delivery-receiver-request-and-result
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Notebook
      storage:
        files:
          README.md: Storage
    responses: []
  inputs:
    cell: storage
    request: Retain three saves.
    mode: delivery
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: I can retain three saves.
            assignment: 'Feature: retain three distinct saves.'
            title: Retain three distinct saves
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: I can retain three saves.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: accepted
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: recipes.run
      behavior:
        mode: return
        effects:
          children:
          - recipe: child.yaml
            cell: storage
            inputs:
              fail: false
            await: terminal
            bind: delivery
        outputs_expr: '{"job_ids":[children.delivery]}'
    - match:
        op: recipe.await_result_soft
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="ready"
  - type: cel_true
    expr: size(calls.filter(c,c.op=="recipes.run"))==1
  - type: cel_true
    expr: 'calls.exists(c,c.op=="recipes.run" && c.inputs.recipes[0].inputs.prompt=="Feature: retain three distinct
      saves." && c.inputs.recipes[0].name.endsWith("adaptive3.yaml@main"))'
  - type: cel_true
    expr: ("children/" + outputs.result.child.job_id + "/results/result.txt") in outputs.documents
