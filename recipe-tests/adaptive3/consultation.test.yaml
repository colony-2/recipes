recipe: consultation.yaml
cases:
- id: inline-owner-advice
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Notebook
      storage:
        files:
          README.md: Versioned storage
    responses: []
  inputs:
    cell: storage
    request: Can we retain old saves?
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: I suggest keeping three distinct saves.
            assignment: 'Feature: retain three distinct saves.'
            work_kind: feature
            title: Use the existing version history API
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: I suggest keeping three distinct saves.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: accepted
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.assignment.contains("three distinct saves")
  - type: cel_true
    expr: '!calls.exists(c,c.op=="recipes.run")'
  - type: cel_true
    expr: calls.exists(c,c.cell=="storage" && c.op=="extension_execution")
