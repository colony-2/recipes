        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: direction
            summary: The provider was unavailable; this correction uses the installed tools.
            title: Restore progress on direction
            primary: null
            document_details: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The provider was unavailable; this correction uses the installed tools.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Requested outcome

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: size(reviews)==3
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.node_path.contains("/backstop/")).size()==4
- id: merge-chase-limit-survives-earlier-stage-visits
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/verify.yaml: "id: advance-upstream\nsequence:\n- id: concurrent-change\n  op:\
            \ command_execution\n  const: true\n  inputs:\n    run: |\n      set -eu\n      repo=$(git remote get-url\
            \ origin)\n      count=0\n      if [ -f \"$repo/upstream-count\" ]; then count=$(cat \"$repo/upstream-count\"\
            ); fi\n      if [ \"$count\" -lt 4 ]; then\n        count=$((count + 1))\n        echo \"$count\" >\
            \ \"$repo/upstream-count\"\n        git -C \"$repo\" add upstream-count\n        git -C \"$repo\" commit\
            \ -m \"Concurrent upstream change $count\"\n      fi\noutputs:\n  api_version: c2.build-hook/v1\n  status:\
            \ passed\n  summary: Verified the candidate; upstream may have advanced concurrently.\n  artifact_refs:\
            \ {}\n"
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/preparation/preparation/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    merge_queue: false
    prompt: Add a marker file.
  mocks:
