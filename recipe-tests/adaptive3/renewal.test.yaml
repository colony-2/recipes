    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: rebase
      repeat: true
      behavior:
