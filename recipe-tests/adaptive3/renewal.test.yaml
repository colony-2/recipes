- id: backstop-renews-only-the-paused-work-loop
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  inputs:
    prompt: Explain this project.
    max_iterations: 1
  mocks:
    ops:
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &id002
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: changes
            summary: Still making progress; complete the explanation.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Still making progress; complete the explanation.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            stage: direction
            summary: Complete the two remaining sections.
            additional_attempts: 2
            title: Restore progress on direction
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Complete the two remaining sections.
    - *id001
    - *id002
    - *id001
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - &id010
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/execute/")).size()==3
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && c.node_path.contains("/backstop/")).size()==1
