- id: merge-chase-limit-survives-earlier-stage-visits
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/verify.yaml: |
            id: advance-upstream
            sequence:
            - id: concurrent-change
              op: command_execution
              const: true
              inputs:
                run: |
                  set -eu
                  repo=$(git remote get-url origin)
                  count=0
                  if [ -f "$repo/upstream-count" ]; then count=$(cat "$repo/upstream-count"); fi
                  if [ "$count" -lt 4 ]; then
                    count=$((count + 1))
                    echo "$count" > "$repo/upstream-count"
                    git -C "$repo" add upstream-count
                    git -C "$repo" commit -m "Concurrent upstream change $count"
                  fi
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Verified the candidate; upstream may have advanced concurrently.
              artifact_refs: {}
    responses:
    - node_path: adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
    - node_path: adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
    observe_files:
    - marker.txt
  inputs:
    prompt: Add a marker file.
