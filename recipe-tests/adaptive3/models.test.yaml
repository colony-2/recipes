recipe: ../../build.yaml
cases:
- id: worker-config-defaults
  type: integration_case
  runtime:
    cells: &id001
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    config:
      codex_model: worker-model
      codex_reasoning_effort: medium
  inputs:
    prompt: Explain this project.
    title: Review the requested default build
    type: build
  mocks:
    ops:
    - &id002
      match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Direction the assigned work.
            documents: []
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - &id003
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &id004
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Assess the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id005
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - &id006
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: finish
            instruction: The requested work is complete.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id007
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.exists(c,c.node_path.startsWith("build/workflow/adaptive3/")) && !calls.exists(c,c.node_path.contains("adaptive2"))
  - type: cel_true
    expr: calls.exists(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.inputs.inputs.prompt.contains("Review
      the requested default build"))
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt))).all(c,c.inputs.inputs.model=="worker-model"
      && c.inputs.inputs.reasoning_effort=="medium")
- id: job-model-overrides-config-independently
  type: integration_case
  runtime:
    cells: *id001
    config:
      codex_model: worker-model
      codex_reasoning_effort: medium
  inputs:
    prompt: Explain this project.
    title: Review the requested default build
    type: build
    model: job-model
  mocks:
    ops:
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.exists(c,c.node_path.startsWith("build/workflow/adaptive3/")) && !calls.exists(c,c.node_path.contains("adaptive2"))
  - type: cel_true
    expr: calls.exists(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.inputs.inputs.prompt.contains("Review
      the requested default build"))
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt))).all(c,c.inputs.inputs.model=="job-model"
      && c.inputs.inputs.reasoning_effort=="medium")
- id: unspecified-settings-are-omitted
  type: integration_case
  runtime:
    cells: *id001
    config: {}
  inputs:
    prompt: Explain this project.
    title: Review the requested default build
    type: build
  mocks:
    ops:
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.exists(c,c.node_path.startsWith("build/workflow/adaptive3/")) && !calls.exists(c,c.node_path.contains("adaptive2"))
  - type: cel_true
    expr: calls.exists(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt)) && c.inputs.inputs.prompt.contains("Review
      the requested default build"))
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt))).all(c,(!has(c.inputs.inputs.model)
      || c.inputs.inputs.model==null) && (!has(c.inputs.inputs.reasoning_effort) || c.inputs.inputs.reasoning_effort==null))
- id: unavailable-provider-does-not-offer-model-edits
  type: integration_case
  runtime:
    cells: *id001
  inputs:
    prompt: Explain this project.
    title: Review the requested default build
    type: build
    model: unavailable
    reasoning_effort: low
  mocks:
    ops:
    - match: *codex
      behavior:
        mode: fail
        error:
          message: Original provider unavailable
    - &id008
      match: *codex
      behavior:
        mode: fail
        error:
          message: Backstop provider unavailable
    - *id008
    - *id007
  assertions:
  - type: cel_true
    expr: size(reviews)==0 && calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).all(c,c.inputs.inputs.model=="unavailable"
      && c.inputs.inputs.reasoning_effort=="low") && !calls.exists(c,c.op=="merge")
  expect_error: Delegate dispatch stopped
