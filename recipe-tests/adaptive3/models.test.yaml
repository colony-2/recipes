- id: unavailable-provider-does-not-offer-model-edits
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: build/workflow/adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: settings
        feedback: Use the alternate provider.
        attachments: []
        settings:
          model: unavailable-too
          reasoning_effort: high
  inputs:
    prompt: Explain this project.
    title: Review the requested default build
    type: build
    model: unavailable
    reasoning_effort: low
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: fail
        error:
          message: Original provider unavailable
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: fail
        error:
          message: Backstop provider unavailable
    - match:
        op: command_execution
        node_path: build/workflow/adaptive3/configure/configure/origin
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews)==0 && calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).all(c,c.inputs.inputs.model=="unavailable"
      && c.inputs.inputs.reasoning_effort=="low") && !calls.exists(c,c.op=="merge")
  expect_error: jsonschema validation failed
