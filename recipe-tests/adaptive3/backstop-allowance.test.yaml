- type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Disposable validation project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: continue
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    stage: implementation
    request: Validate the local correction.
    problem:
      status: stuck
      summary: Validation interrupted.
      loop: work
  id: displayed-default-matches-the-applied-allowance
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            action: Rerun local validation with the available browser.
            stage: implementation
            summary: The local prerequisite passed. Apply authorizes rerunning validation only.
            title: Resume local validation
            primary: null
            additional_attempts: null
            document_details: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The local prerequisite passed. Apply authorizes rerunning validation only.
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews)==1
  - type: cel_true
    expr: reviews[0].form.request.directions.exists(o,o.id=="continue")
  - type: cel_true
    expr: outputs.result.status=="resume" && outputs.result.action=="Rerun local validation with the available browser."
  - type: cel_true
    expr: outputs.result.human.receipt.request_id==reviews[0].request_id
  - type: cel_true
    expr: calls.filter(c,(c.op=="extension_execution" && has(c.inputs.inputs.prompt))).all(c,c.inputs.inputs.output.schema.properties.stage.enum.exists(s,s==null)
      && !c.inputs.inputs.output.schema.properties.stage.enum.exists(s,s=="integration"))
  - type: output_equals
    path: result.additional_attempts
    value: 1
  - type: cel_true
    expr: reviews[0].form.request.directions[0].label == "Try another 1 attempt"
