recipe: backstop-diagnosis.yaml
live: true
cases:
  - id: multi-boundary-incident
    type: integration_case
    runtime:
      cells:
        root:
          files:
            README.md: Disposable read-only diagnosis replay. Historical jobs must not be changed.
            evidence/native-publication.json: |
              {"candidate_sha":"f59154e63fabf32eba4eac8c0355e122edfdf2d0","candidate_subject":"Complete the execution assignment in inbox/handoff.md. Read its selected supporting files. Supporting files provide context and evidence; their inclusion is not approval of a scope change. Resolve contradictions with the agreed assignment during planning or approval recovery. Use the supplied cell workspace and the formal acceptance statements. This is a fresh job. During implementation, inspect any recovery patch and its provenance, apply the intended changes in the writable checkout using normal project tools, and rerun relevant checks. A snapshot or patch is evidence of prior work, not proof of correctness or permission to replace Git history.","merged_hash":"f59154e63fabf32eba4eac8c0355e122edfdf2d0","publication_branch":"refs/heads/main","publication_disposition":"published","target_branch":"refs/heads/main"}
            evidence/previous-backstop.json: |
              {"additional_attempts":null,"primary":null,"stage":"integration","status":"ask","summary":"Commit f59154e63fabf32eba4eac8c0355e122edfdf2d0 is already published on main and matches the accepted source. Integration then fetched another workspace for a publish hook already reported absent; that fetch failed because credential resolution was unavailable.\n\nI recommend having c2j return the hook’s configured skipped result before fetching an unnecessary workspace, then resume this job’s integration with the existing commit and required checks.\n\nI could not reach that owner: consultation submission reports missing JobDB configuration. Can you restore the authenticated c2j owner route so I can request the repair? This keeps the approved feature scope unchanged.","title":"Absent publish hook triggers a workspace fetch without credentials"}
            evidence/owner-advice.md: |
              # Require evidence for the recovery action that will run

              I can do this, but `self` readiness is discovery evidence, not a successful command or a deployed repair. Your proposal accurately separates absent-hook workspace evaluation, restricted credential access, and submission routing. I support your Recipes-only bug fix with the refinements below. I do not need a new c2j API for it.

              You own the Backstop assignment, nullable response fields, form choices and stage transitions. I own the compiler, workspace authority, CLI routing and helper diagnostics. The existing owner jobs retain those separate investigations. My advice does not require their repairs to finish before you can deliver diagnosis-only behavior.

              ## What “available” should mean

              Describe the next action precisely enough that a person can tell what Execute will attempt and what that attempt accomplishes. Establish its target, route, relevant execution scope and known prerequisites. An owner saying “I can implement this” establishes a proposed change; it does not establish that this job can execute that change now.

              | Evidence | What you may conclude |
              | --- | --- |
              | `self` says granted/ready for this invocation | The runtime reports a grant and known local route at the observation time. Actual requests still check authority and may fail. |
              | The exact command failed despite that report | That action has a demonstrated unresolved prerequisite or defect. Repeating the readiness report does not resolve it. Preserve the failure and investigate the command path. |
              | A relevant check passes after a correction, on the runtime and scope that will execute | There is evidence the failed boundary is usable again, within the check's limits. State what was checked. |
              | Source, a synthetic test, approval, or an active repair job exists | A proposal or implementation may be promising. None alone proves availability in the executing worker. |
              | A child request was accepted | The request exists. This does not establish worker availability, successful execution, repair deployment or recovery of the original stage. |

              When a path has already failed, require evidence addressing that failure before describing the same path as available. For a runtime repair, that normally means identifying the executable/controller/worker version containing the change, establishing that the next invocation will use it, and checking the formerly failing boundary in a suitably comparable environment. Repository HEAD, a CLI version alone, or a pinned recipe revision does not identify every executing component. A running process may still use older code; recorded tasks and captured policy may retain earlier results or authority.

              This is not a universal requirement to run every action before offering it. Use proportional evidence for ordinary actions with no contrary observation. Do not submit a duplicate job, publish again, or resolve every secret as a readiness probe. A concrete authorized diagnostic can itself be available while its result remains unknown. Say “inspect the failed submission route,” not “restore submission,” when inspection is all that can currently happen.

              ## Stronger prerequisites in this incident

              **Submission has CLI prerequisites in addition to the reported broker grant.** At the inspected checkout, `submitjob.Run` completes and validates CLI options before reading broker context. Validation requires a JobDB target/tenant even though brokered submission later goes through the parent's runtime. A missing-target error therefore does not establish a revoked submit grant or a need for human authentication. Until the existing routing work changes this behavior in the actual executable, account for that prerequisite and preserve valid current-job/broker context. Do not invent a target or switch to a standalone route to bypass a broken advertised route.

              **Authority belongs to the action's scope.** Backstop's `self` describes Backstop, not the earlier workspace task or a future hook. A present hook's execution workspace uses the hook's captured grant, selected Git profile and enclosing limits. Caller source loading and a successful merge can use different authority. A profile selects credential requests; it does not grant them. Input-secret authorization is also distinct from delegated secret resolution. Human approval supplies none of those technical grants.

              **The credential diagnosis is narrower than a missing-authentication repair.** The retained diagnostic found successful authenticated workspace fetch for a present, permitted hook. A missing grant denied access before the provider was called; a provider outage produced the same generic message. Do not infer either cause from that message alone. Do not add credential grants to make an absent fallback work, or preflight all profile secrets: a local/public fetch or cache hit may need none.

              **A retry must have a reason to differ.** The absent-hook acceptance condition still fails in the retained diagnostic. A clearer authorization message would not fix it. A policy edit intended for new jobs does not rewrite the historical job's captured policy. A repair must also be compatible with the retained execution prefix before someone promises recovery of that job. Preserve the completed publication and its receipt; a working submission command would not justify publishing the source again.

              ## Smallest useful response change

              Keep your proposed required-nullable `action` and nullable existing destination (`stage`). I would use the existing stage field rather than add a parallel destination API or an evidence object. Put the evidence and remaining uncertainty in the explanation or an optional linked document.

              Treat a nonempty action and an allowed stage as structural requirements, not proof of capability. The action must describe an available step under the evidence rule above. `action: null` must prevent both Apply and automatic stage resume, even if prose recommends future owner work or a stage is suggested. Keep null in the narrowed stage schema. Whitespace-only actions and stale Continue responses must not pass the gate.

              Share that structural gate, then retain the different authority rules: **Apply may ask for the specific missing human authorization when technical prerequisites are satisfied; automatic resume additionally needs existing authorization and the existing allowance.** Valid presentation is required where a person must review the proposal. A question or settings reconsideration supplies neither authorization nor allowance. Reconsider material feedback before acting; changed circumstances must not silently substitute a different action for the one shown.

              An available owner-request route can justify “submit this bounded request,” if authorized. It cannot justify “resume the blocked stage after the owner fixes it.” Inspect and adopt relevant existing work before submitting anything; an uncertain submission outcome requires reconciliation before retry. In this consultation the human explicitly requested advice only, so no request submission or repair attempt follows from my recommendation.

              I would describe your change as **a bug fix: “Hide Backstop Apply until a concrete recovery action is available.”** I recommend the existing adaptive3 delivery for that Recipes work. I propose no additional c2j delivery assignment from this consultation.

              Add a focused case to your planned checks where `self` advertises granted/ready but the actual command fails its prerequisite: diagnosis must keep Apply and stage resume disabled until evidence resolves that failure. Also retain an actionable diagnostic counterexample so the wording does not demand guaranteed success or block useful investigation. Native tests can enforce forms and transitions; the real-model evaluation must judge whether the claimed action is credible. Nonempty text alone cannot establish that.

              I inspected your three supplied documents, current c2j contracts and selected retained owner findings. I did not rerun their diagnostics or test a runtime repair. [Source details and limits](capability-contract-notes.md).
            evidence/owner-sources.md: |
              # Sources for Backstop capability advice

              I inspected checkout `b9dc613d9ecf1265a35737dbac3ec8078fa93716`. The CLI on PATH reports `v0.0.126-0.20261113193326-d031eb49c677+dirty`. Those identify different observations; neither establishes the historical worker binary or a newly deployed repair. My current `self` reports the c2j workspace inside the Recipes-owned job, controller-mediated authority, granted/ready submission, and `lease.validation: last_known`. This illustrates why job ownership, active workspace and execution scope need separate treatment.

              The supplied request says: “Please use existing findings and provide advice only; do not duplicate those repair jobs, change historical jobs or implement a runtime repair for this consultation.” I used that scope throughout. No feedback, error, hooks or children files were supplied in this consultation's `inbox/work`; it contained the three review documents.

              | Current source | Contract relevant to your proposal |
              | --- | --- |
              | `FEATURE_REQUEST_C2J_SELF_EXECUTION_CONTEXT.md:131` | Ready means known prerequisites and a local route at observation time, without guaranteeing success. Submission, execution, external rights and input-secret authority remain separate. |
              | `pkg/selfinfo/info.go:231` | Capability derivation does not contact providers, submit probes or mint credentials. It combines grants with route/workspace/helper indicators and lease state. |
              | `pkg/worker/ops/self.go:28` | The workspace-ready indicator uses the presence of a worktree path; it does not perform the complete submission/snapshot operation. |
              | `pkg/executionruntime/self.go:16` and `:66` | Inspection reads held authority and reports last-known lease state; it does not renew or authoritatively validate the lease. |
              | `cmd/c2j/internal/submitjob/service.go:41` and `options.go:111` | CLI completion/validation precedes broker selection and currently requires target/tenant information. This code explains how discovery and command behavior can disagree without proving missing credentials. |
              | `pkg/worker/compiler/hooks.go:516` and `:545` | Authoritative absence selects empty hook authority but still constructs the wrapper; the inspected source does not suppress its workspace. |
              | `pkg/worker/compiler/workspace.go:173` and `GUIDE-Local-Recipe-Hooks.md:128` | Hook authority governs preparing the include's execution workspace. |
              | `pkg/permissions/access.go:84` and `pkg/gitprofile/scope.go:314` | An ungranted secret is denied before provider access; the helper currently collapses several resolver failures into the same generic message. |

              I downloaded selected artifacts and exact `/response` values from the latest retained direction work occurrences of these two jobs. Their artifact inventories had no continuation cursor. Downloads stayed in scratch outside the checkout and outbox.

              - `3M4kDTkJgImKqFreFRw6WtkCjYx`: `review/absent-hook-diagnosis.md`, `review/skip-workspace-for-absent-hooks.md`, and the Recipes consultation `review/absent-publish-hook-contract.md`. These establish publication at `f59154e63fabf32eba4eac8c0355e122edfdf2d0`, then authoritative hook absence, then unnecessary execution-workspace fetch. The proposed runtime correction and new acceptance regressions were not implemented in those retained findings.
              - `3M4kEkkPw3Jxel0RY6qKsuEeZ5H`: `review/controller-workspace-auth-evidence.md`, `review/controller-workspace-git-auth.md`, and `review/published-commit-hook-workspace.md`. Their synthetic authenticated present-hook diagnostic succeeded with a grant, denied without provider access when ungranted, and reproduced the same generic message for a provider outage. Absent-hook fallback acceptance failed. A passing diagnostic suite that asserts that failure is not passing product acceptance.
              - `3M4lb05z7tslzYHizrQnsX30BdG`: job status was ACTIVE and the log contained preparation tasks without a retained agent work result at this inspection. I make no implementation or deployment claim from it. The other two jobs were also ACTIVE; their retained direction results remain useful evidence despite the absence of final job results.

              These are existing findings, not newly executed checks. The exact historical executable and failed fetch's effective transport remain unverified. The [recommendation](backstop-action-prerequisites.md) therefore distinguishes observed boundaries from promises about repairs or historical recovery.
            evidence/human-direction.md: 'Human request for this replay: explain what happened to the act job and realistic recovery choices. Preserve its delivered source and existing approval. Do not repair c2j, change historical jobs or publish again. c2ops adoption of the delivered act source remains consumer work, not an absent-hook fix. The prior recovery called its proposed runtime change executable despite a failed owner submission. Source job: Jc0Pw2ROeULExbkMLgYID40W8re. Original JobDB http://192.168.1.195:9047/c2. The attached native merge output and previous Backstop response are exact retained values downloaded during preparation. Owner advice is later evidence, not something the original job knew.'
    inputs:
      request: Investigate this disposable recovery scenario. Inspect evidence/ with your tools before deciding. Do not modify historical jobs.
      problem:
        summary: The accepted source was published, then an absent publish hook fetched an unnecessary workspace and failed. Recovery hit a separate command-routing prerequisite. Explain the delivered work, remaining consumer work and realistic next steps.
    mocks:
      ops:
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.response.status in ["ask","resume"] && size(outputs.response.summary)>0
      - type: cel_true
        expr: outputs.response.status=="ask" && !has(outputs.response.action)
