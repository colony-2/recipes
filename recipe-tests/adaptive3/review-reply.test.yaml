recipe: ../../recipes/adaptive3/review-reply.yaml
cases:
- id: same-filename-uploads-keep-their-order-and-producer
  type: integration_case
  runtime: {}
  inputs:
    reply:
      receipt: {request_id: review-7, submission_id: correction, actor: {kind: automation}}
      response:
        feedback: Read both notes in order.
        attachments:
        - {kind: stored, stored: {key: {jobId: first, taskOrdinal: 8, name: review/notes.md}}}
        - {kind: stored, name: notes.md, stored: {key: {jobId: second, taskOrdinal: 3, name: original.md}}}
  assertions:
  - type: cel_true
    expr: >-
      outputs.reply.human.receipt.submission_id=='correction' &&
      outputs.reply.human.response.feedback=='Read both notes in order.' &&
      outputs.ordered.map(a,a.name)==['feedback/review-7/0/notes.md','feedback/review-7/1/notes.md'] &&
      outputs.ordered.map(a,a.stored.key.jobId)==['first','second'] &&
      outputs.ordered.all(a,outputs.reply.documents[a.name]==a)
- id: no-submission
  type: integration_case
  runtime: {}
  assertions:
  - {type: output_equals, path: reply, value: {}}
  - {type: output_equals, path: ordered, value: []}
