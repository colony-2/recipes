schema_version: 2
id: lifecycle-test
input_schema:
  review_reply: {type: object, default_value: {}}
  finding: {type: object, default_value: {}}
  sessions: {type: object, default_value: {}}
  purpose:
    type: string
    required: true
  request:
    type: string
    required: true
  max_iterations:
    type: number
    default_value: 0
  require_verification:
    type: boolean
    default_value: false
inputs:
  finding: ${{ inputs.finding }}
  review_reply: ${{ inputs.review_reply }}
  sessions: ${{ inputs.sessions }}
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  max_iterations: ${{ inputs.max_iterations }}
  require_verification: ${{ inputs.require_verification }}
sequence:
- id: lifecycle
  include: ../../recipes/adaptive3/lifecycle.yaml
  inputs:
    finding: ${{ inputs.finding }}
    review_reply: ${{ inputs.review_reply }}
    sessions: ${{ inputs.sessions }}
    purpose: ${{ inputs.purpose }}
    request: ${{ inputs.request }}
    max_iterations: ${{ inputs.max_iterations }}
    require_verification: ${{ inputs.require_verification }}
outputs:
  budget: ${{ sequence.lifecycle.outputs.budget }}
  retry: ${{ sequence.lifecycle.outputs.sessions.?retry.orValue({}) }}
  result: ${{ sequence.lifecycle.outputs.result }}
  documents: ${{ sequence.lifecycle.outputs.documents }}
