schema_version: 2
id: lifecycle-test
input_schema:
  purpose:
    type: string
    required: true
  request:
    type: string
    required: true
  max_iterations:
    type: number
    default_value: 0
  require_verification:
    type: boolean
    default_value: false
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
  max_iterations: ${{ inputs.max_iterations }}
  require_verification: ${{ inputs.require_verification }}
sequence:
- id: lifecycle
  include: ../../recipes/adaptive3/lifecycle.yaml
  inputs:
    purpose: ${{ inputs.purpose }}
    request: ${{ inputs.request }}
    max_iterations: ${{ inputs.max_iterations }}
    require_verification: ${{ inputs.require_verification }}
outputs:
  result: ${{ sequence.lifecycle.outputs.result }}
  documents: ${{ sequence.lifecycle.outputs.documents }}
