recipe: package-probe-boundary.yaml
cases:
- type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
    observe_files:
    - .c2/config.yaml
  inputs:
    config:
      kind: value
      name: review/config.yaml
      format: text
      value: 'packages: ["uv:pytest==8.3.5"]

        '
    requests:
    - reference: uv:pytest==8.3.5
      check:
      - pytest
      - --version
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  id: legacy-caller-fails-before-write
  assertions:
  - type: cel_true
    expr: outputs.status=="changes" && outputs.summary=="No validated approved proposal binding"
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.endsWith("/probe/probe"))'
  - type: cel_true
    expr: calls.filter(c,c.op=="command_execution").all(c,!(".c2/config.yaml" in c.worktree))
  - type: cel_true
    expr: outputs.config==null
