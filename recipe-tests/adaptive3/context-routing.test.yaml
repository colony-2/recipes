recipe: context-routing.yaml
cases:
  - id: fresh-implementation-and-independent-validation
    type: integration_case
    runtime:
      cells:
        root:
          files:
            README.md: A local notebook.
    inputs:
      purpose: implementation
    mocks:
      ops:
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: ready
                summary: Drafts are held in memory.
                title: Where drafts are stored
                work_kind: explanation
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: publication-ref
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: passed
                summary: Answer checked.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: publication-ref
        - match:
            op: command_execution
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.result.status=="accepted"
      - type: cel_true
        expr: size(calls.filter(c,c.op=="extension_execution"))==2
      - type: cel_true
        expr: calls.filter(c,c.op=="extension_execution").all(c,c.inputs.inputs.instructions==outputs.instructions && !("session" in c.inputs.inputs))
  - id: fresh-advice-and-independent-validation
    type: integration_case
    runtime:
      cells:
        root:
          files:
            README.md: A local notebook.
    inputs:
      purpose: advice
    mocks:
      ops:
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: ready
                summary: Drafts are held in memory.
                title: Where drafts are stored
                work_kind: explanation
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: publication-ref
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                status: passed
                summary: Answer checked.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    label: publication-ref
        - match:
            op: command_execution
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.result.status=="accepted"
      - type: cel_true
        expr: size(calls.filter(c,c.op=="extension_execution"))==2
      - type: cel_true
        expr: calls.filter(c,c.op=="extension_execution").all(c,c.inputs.inputs.instructions==outputs.instructions && !("session" in c.inputs.inputs))
