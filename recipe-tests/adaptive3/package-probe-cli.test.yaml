      false'') && !(".c2/config.yaml" in c.worktree))'
  - type: cel_true
    expr: size(outputs.jobs)==1 && outputs.submission.returncode==0 && outputs.child.status=="completed" && outputs.child.outputs.status=="changes"
      && outputs.child.outputs.summary=="No validated approved proposal binding"
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.endsWith("/probe/probe"))'
  - type: cel_true
    expr: calls.all(c,!(".c2/config.yaml" in c.worktree))
- id: unknown
  type: integration_case
