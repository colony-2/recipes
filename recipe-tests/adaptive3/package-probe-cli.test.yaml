recipe: package-probe-cli.yaml
cases:
- id: title
  type: integration_case
  runtime: &id001
    observe_files:
    - .c2/config.yaml
    - prompt-must-not-run
    - title-must-not-run
    cells:
      root:
        files:
          README.md: Disposable CLI submission fixture.
        file_sources:
          .c2/recipes/package-probe.yaml: ../../recipes/adaptive3/package-probe.yaml
          .c2/recipes/tools.yaml: ../../recipes/adaptive3/tools.yaml
  inputs:
    scenario: title
  mocks: &id002
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.validation.result.status=="passed"
  - type: cel_true
    expr: 'calls.filter(c,c.node_path.contains("/validate/") && c.op=="command_execution").all(c,c.outputs.stdout.contains(''"written":
      false'') && !(".c2/config.yaml" in c.worktree))'
  - type: cel_true
    expr: size(outputs.jobs)==1 && outputs.submission.returncode==0 && outputs.child.status=="completed" && outputs.child.outputs.status=="passed"
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/probe/probe")).size()==1
  - type: cel_true
    expr: 'calls.exists(c,c.node_path.endsWith("/probe/probe") && c.outputs.stdout.contains(''Probe: ["pytest",
      "--version"]'') && c.outputs.stdout.contains("pytest 8.3.5") && c.worktree[".c2/config.yaml"].contains("uv:pytest==8.3.5"))'
  - type: cel_true
    expr: calls.all(c,!("prompt-must-not-run" in c.worktree) && !("title-must-not-run" in c.worktree))
- id: no-title
