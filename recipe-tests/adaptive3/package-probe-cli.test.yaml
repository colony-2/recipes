  - type: cel_true
    expr: 'calls.filter(c,c.node_path.contains("/validate/") && c.op=="command_execution").all(c,c.outputs.stdout.contains(''"written":
      false'') && !(".c2/config.yaml" in c.worktree))'
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/install/") || c.node_path.endsWith("/probe/probe"))'
  - type: cel_true
    expr: size(outputs.jobs)==1 && outputs.submission.returncode==0 && outputs.child.status=="failed" && outputs.child.failure_message.contains("field
