  - type: cel_true
    expr: 'calls.exists(c,c.node_path.endsWith("/probe/probe") && c.outputs.stdout.contains(''Probe: ["pytest",
      "--version"]'') && c.outputs.stdout.contains("pytest 8.3.5") && c.worktree[".c2/config.yaml"].contains("uv:pytest==8.3.5"))'
  - type: cel_true
    expr: calls.all(c,!("prompt-must-not-run" in c.worktree) && !("title-must-not-run" in c.worktree))
- id: missing-binding
  type: integration_case
