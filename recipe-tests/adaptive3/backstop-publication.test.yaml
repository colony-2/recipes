  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: size(calls.filter(c,c.op=="merge"))==1
  - type: cel_true
    expr: size(reviews)==5 && !reviews[2].form.fields[0].options.exists(o,o.value=="continue") && !reviews[3].form.fields[0].options.exists(o,o.value=="continue")
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/publish_effect")).all(c,c.inputs.env.MERGED_HASH==outputs.merge.merged_hash)
  - type: cel_true
    expr: calls.filter(c,c.node_path.contains("/backstop/") && c.op=="extension_execution").all(c,c.inputs.inputs.prompt.contains("published"
      ) || c.inputs.inputs.prompt.contains("publication"))
  - type: cel_true
    expr: outputs.reviews[0].receipt==reviews[0].receipt && outputs.reviews[1].receipt==reviews[1].receipt
  - type: cel_true
    expr: outputs.merge.merged_hash==calls.filter(c,c.op=="merge")[0].outputs.merged_hash
