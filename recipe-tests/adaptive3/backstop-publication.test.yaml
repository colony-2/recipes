    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: ask
            action: null
            summary: The native merge already completed. The publication prerequisite is unresolved; discuss the
              remaining work.
            stage: integration
            title: Restore progress on integration
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Retry publication using the existing merge.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: resume
            action: null
            summary: The native merge already completed. The publication prerequisite is unresolved; discuss the
              remaining work.
            stage: integration
            title: Restore progress on integration
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Retry publication using the existing merge.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: resume
            action: Run the remaining publication check with the existing merged hash.
            summary: The disposable publication check is available. Apply authorizes only that check.
            stage: integration
            title: Restore progress on integration
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Retry publication using the existing merge.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: size(calls.filter(c,c.op=="merge"))==1
  - type: cel_true
    expr: size(reviews)==5 && !reviews[2].form.request.directions.exists(o,o.id=="continue") && !reviews[3].form.request.directions.exists(o,o.id=="continue")
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("/publish_effect")).all(c,c.inputs.env.MERGED_HASH==outputs.merge.merged_hash)
  - type: cel_true
    expr: calls.filter(c,c.node_path.contains("/backstop/") && (c.op=="extension_execution" && has(c.inputs.inputs.prompt))).all(c,c.inputs.inputs.prompt.contains("published"
      ) || c.inputs.inputs.prompt.contains("publication"))
  - type: cel_true
    expr: outputs.reviews[0].receipt==reviews[0].receipt && outputs.reviews[1].receipt==reviews[1].receipt
  - type: cel_true
    expr: outputs.merge.merged_hash==calls.filter(c,c.op=="merge")[0].outputs.merged_hash
