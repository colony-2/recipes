recipe: ../../adaptive3.yaml
cases:
- id: diagnosis-and-discussion-preserve-real-merge
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/publish.yaml: |
            id: publish-fixture
            outputs:
              api_version: c2.build-hook/v1
              artifact_refs: {}
              status: passed
              summary: Published.
            sequence:
            - id: publish_effect
              inputs:
                run: printf published
                env:
                  MERGED_HASH: ${{ inputs.merged_hash }}
              op: command_execution
            inputs:
              merged_hash: ${{ inputs.merged_hash }}
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: question
        feedback: What was already delivered?
        attachments: []
        settings: {}
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: revise
        feedback: The prerequisite is now available; reconsider the correction.
        attachments: []
        settings: {}
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: continue
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    merge_queue: false
    prompt: Add a marker file.
  mocks:
    ops:
    - match:
        op: command_execution
        node_path: adaptive3/integration/integration/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/execute/execute/adaptive3-execute/publish/publish/adaptive3-hooks/publish/publish/publish-fixture/publish_effect
      behavior:
        mode: fail
        error:
          message: Temporary publication failure
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 0
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 0
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Test plan'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 0
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
          worktree:
            marker.txt: |
              done
        artifacts:
          review/README.md: '# Implementation'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
