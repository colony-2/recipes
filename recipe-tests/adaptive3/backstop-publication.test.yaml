- id: diagnosis-and-settings-preserve-real-merge
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/publish.yaml: "id: publish-fixture\noutputs:\n  api_version: c2.build-hook/v1\n\
            \  artifact_refs: {}\n  status: passed\n  summary: Published.\nsequence:\n- id: publish_effect\n  inputs:\n\
            \    run: printf published\n    env:\n      MERGED_HASH: ${{ inputs.merged_hash }}\n  op: command_execution\n\
            inputs:\n  merged_hash: ${{ inputs.merged_hash }}\n"
    responses:
    - node_path: adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
    - node_path: adaptive3/outcome/outcome/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: question
        feedback: What was already delivered?
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: settings
        model: chosen-model
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: ''
    observe_files:
    - marker.txt
  inputs:
    prompt: Add a marker file.
