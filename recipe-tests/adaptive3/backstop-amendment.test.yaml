recipe: review.yaml
cases:
- id: validated-scope-instruction-needs-no-second-direction-approval
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Disposable fixture.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses: []
  inputs:
    purpose: direction
    decision: direction
    title: Remove only the phone criterion
    validation:
      status: passed
      summary: Exact amendment only.
    feedback:
      amendment:
        instruction: Remove only the phone criterion.
        human:
          receipt:
            submission_id: native-instruction
            request_id: backstop-request
          response:
            direction: revise
            feedback: Remove only the phone criterion.
  assertions:
  - type: cel_true
    expr: size(reviews)==0 && outputs.result.status=="accepted" && outputs.result.receipt.submission_id=="native-instruction"
- id: unvalidated-scope-instruction-cannot-skip-review
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Disposable fixture.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: review-test/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    purpose: direction
    decision: direction
    title: Remove only the phone criterion
    validation:
      status: changes
      summary: Browser requirement was also removed.
    feedback:
      amendment:
        instruction: Remove only the phone criterion.
        human:
          receipt:
            submission_id: native-instruction
            request_id: backstop-request
          response:
            direction: revise
            feedback: Remove only the phone criterion.
  assertions:
  - type: cel_true
    expr: size(reviews)==1 && outputs.result.receipt.submission_id!="native-instruction"
  mocks:
    ops:
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
