schema_version: 2
id: validation-feedback-test
input_schema:
  feedback:
    type: object
    default_value: {}
inputs:
  feedback: ${{ inputs.feedback }}
sequence:
- id: validate
  include: ../../recipes/adaptive3/validate.yaml
  inputs:
    purpose: preparation
    request: Preserve the agreed local scope.
    feedback: ${{ inputs.feedback }}
    work:
      title: Preserve the agreed local scope
      primary: review/README.md
      document_details:
      - document_id: review/README.md
        title: Agreed local scope
        description: Check the accepted scope before assessing the correction.
        role: primary
        order: 0
    documents:
      review/README.md:
        kind: value
        name: review/README.md
        format: text
        value: '# Agreed local scope'
    settings:
      consultations:
      - key: security
        checkpoint: plan_assessment
        role: Security reviewer
        request: Check isolation between users.
        required: true
outputs:
  result: ${{ sequence.validate.outputs.result }}
