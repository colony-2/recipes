    cells:
      root:
        file_sources:
          .c2/recipes/hooks/build/publish.yaml: ./fixtures/queue-publish-failed.yaml
          merge-batch.yaml: ../../merge-batch.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
        files:
          README.md: A merge queue test cell.
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            inputs:
              candidate: ${{ inputs.candidate }}
            sequence:
            - id: check
              op: command_execution
              inputs:
                env:
                  EXPECTED: ${{ inputs.candidate }}
                run: |
                  test "$(git rev-parse HEAD)" = "$EXPECTED"
                  test "$(cat contribution.txt)" = queue-ready
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Verified the assembled commit.
              artifact_refs: {}
  mocks:
    ops:
    - match: {selector: ./recipes/merge-queue}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: squash}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: merge}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: outputs.result.status=='stuck' && outputs.result.receiver.job_id!='' && !outputs.verified
  - type: cel_true
    expr: calls.filter(c,c.op=='recipes.run').size()==1 && calls.filter(c,c.op=='merge').size()==1
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith('/publish_source')).size()==1 && calls.filter(c,c.node_path.endsWith('/publish_source')).all(c,c.job_id==outputs.result.receiver.job_id && c.inputs.env.MERGED==calls.filter(m,m.op=='merge')[0].outputs.merged_hash)
