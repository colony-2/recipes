- id: successor-captures-fresh-time-preserving-contribution-age
  type: integration_case
  runtime: *cell
  inputs: {retry_after_advance: true}
  mocks:
    ops:
    - match: {node_path: merge-queue-caller-test/candidate/submit/adaptive3-merge-queue-submit/submit/sequence/capture_batch_start}
      behavior:
        mode: return
        outputs: {stdout: '2090-04-01 12:25:00 UTC', stderr: '', exit_code: 0, success: true, timed_out: false, error_message: ''}
    - match: {node_path: merge-queue-caller-test/candidate/repeat/adaptive3-merge-queue-submit/submit/sequence/capture_batch_start}
      behavior:
        mode: return
        outputs: {stdout: '2090-04-01 13:05:00 UTC', stderr: '', exit_code: 0, success: true, timed_out: false, error_message: ''}
    - *queue_op
    - *command_op
    - *squash_op
    - *merge_op
  assertions:
  - type: cel_true
    expr: |
      outputs.verified && outputs.repeated.status=='passed' &&
      outputs.repeated.publication==outputs.result.publication &&
      outputs.repeated.initial_submitted_at==outputs.result.initial_submitted_at &&
      outputs.repeated.initial_submitted_at < '2090-04-01'
  - type: cel_true
    expr: |
      calls.filter(c,c.op=='recipe.run_and_get_result').size()==2 &&
      calls.filter(c,c.op=='recipe.run_and_get_result')[0].outputs.outputs.metadata.title=='Merge queue: root/refs/heads/main (2090-04-01 12:25:00 UTC)' &&
      calls.filter(c,c.op=='recipe.run_and_get_result')[1].outputs.outputs.metadata.title=='Merge queue: root/refs/heads/main (2090-04-01 13:05:00 UTC)' &&
      calls.filter(c,c.op=='recipe.run_and_get_result')[0].outputs.outputs.metadata.id!=calls.filter(c,c.op=='recipe.run_and_get_result')[1].outputs.outputs.metadata.id &&
      calls.filter(c,c.op=='recipe.run_and_get_result')[0].inputs.grouping.key==calls.filter(c,c.op=='recipe.run_and_get_result')[1].inputs.grouping.key

