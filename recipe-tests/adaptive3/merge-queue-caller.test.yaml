- id: grouped-caller-forwards-saved-verification-and-publishes-once
  type: integration_case
  inputs: {saved_receipt: true}
  runtime: *cell
  mocks: *native
  assertions:
  - type: cel_true
    expr: outputs.verified && outputs.result.status=='passed' && outputs.result.publication.merged_hash==outputs.candidate.head_hash
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith('/verify/root/check')).size()==1 &&
      calls.filter(c,c.node_path.endsWith('/publish_marker')).size()==1 &&
      calls.exists(c,c.node_path.contains('adaptive3-merge-batch/') && has(c.outputs.result) && has(c.outputs.result.reused) && c.outputs.result.reused)
