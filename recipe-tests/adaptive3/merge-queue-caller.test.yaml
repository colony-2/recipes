recipe: merge-queue-caller.yaml
cases:
- id: grouped-receiver-verifies-and-returns-the-callers-landed-hash
  type: integration_case
  runtime: &cell
    backend: sqlite
    cells:
      root: &root_cell
        file_sources: &queue_sources
          merge-batch.yaml: merge-queue-title-receiver.yaml
          merge-batch-implementation.yaml: ../../merge-batch.yaml
          .c2/recipes/hooks/build/publish.yaml: ./fixtures/queue-publish.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
          read-rejection.py: read-rejection.py
        files:
          README.md: A merge queue test cell.
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            inputs:
              candidate: ${{ inputs.candidate }}
            sequence:
            - id: check
              op: command_execution
              inputs:
                env:
                  EXPECTED: ${{ inputs.candidate }}
                run: |
                  test "$(git rev-parse HEAD)" = "$EXPECTED"
                  test "$(cat contribution.txt)" = queue-ready
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Verified the assembled commit.
              artifact_refs: {}
  mocks: &native
    ops:
    - &queue_op
      match: {selector: ./recipes/merge-queue}
      repeat: true
      behavior: {mode: passthrough}
    - &command_op
      match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
    - &squash_op
      match: {op: squash}
      repeat: true
      behavior: {mode: passthrough}
    - &merge_op
      match: {op: merge}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: outputs.verified && outputs.result.status=='passed' && outputs.result.publication.merged_hash==outputs.candidate.head_hash
  - type: cel_true
    expr: |
      calls.exists(c,c.op=='recipe.await_result_soft' && has(c.outputs.outputs.metadata) &&
        c.outputs.outputs.metadata.title.matches('^Merge queue: root/refs/heads/main [(][0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2} UTC[)]$') &&
        c.outputs.outputs.metadata.id!='')
  - type: cel_true
    expr: outputs.result.queue_publication.source==outputs.result.publication && outputs.result.publish.status=='passed'
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith('/publish_source')).size()==1 && calls.filter(c,c.node_path.endsWith('/publish_source')).all(c,c.job_id==outputs.result.queue_publication.owner_job && c.node_path.contains('adaptive3-merge-batch/'))
  - type: cel_true
    expr: outputs.result.initial_submitted_at.matches('^[0-9A-Z:.\\-]+$')
- id: retry-recognizes-a-landed-id-behind-a-newer-tip
  type: integration_case
  inputs: {retry_after_advance: true}
  runtime: *cell
  mocks: *native
  assertions:
  - type: cel_true
    expr: outputs.repeated.status=='passed' && outputs.repeated.publication==outputs.result.publication && outputs.repeated.queue_publication.reason=='no-new-merge' && outputs.repeated.queue_publication.source==null
  - type: cel_true
    expr: outputs.repeated.initial_submitted_at==outputs.result.initial_submitted_at && calls.filter(c,c.node_path.endsWith('/publish_source')).size()==1
  - type: cel_true
    expr: calls.filter(c,c.op=='merge' && c.node_path.contains('adaptive3-merge-batch/')).size()==1
- id: another-items-success-cannot-release-publication
  type: integration_case
  runtime:
    backend: sqlite
    cells:
      root:
        file_sources:
          recipes/merge-queue: ../../recipes/merge-queue
        files:
          merge-batch.yaml: |
            schema_version: 2
            id: foreign-receipt
            input_schema:
              branch: {type: string}
              verification_policy: {type: object}
            inputs:
              branch: ${{ inputs.branch }}
            sequence: []
            outputs:
              version: 2
              branch: ${{ inputs.branch }}
              requested: ${{ context.grouping.appends.map(a,a.content.changeid) }}
              publication:
                owner_job: ${{ context.workflow.job_id }}
                source: null
                reason: no-new-merge
                result:
                  api_version: c2.build-hook/v1
                  status: skipped
                  summary: No new merge.
                  artifact_refs: {}
              results:
              - changeid: '000000000000000000000000001'
                status: success
                hash: '0123456789abcdef0123456789abcdef01234567'
  mocks: &without_merge
    ops:
    - match: {selector: ./recipes/merge-queue}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: squash}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: outputs.result.status=='stuck' && !has(outputs.result.publication) && !outputs.verified
- id: an-unreachable-hash-cannot-release-publication
  type: integration_case
  runtime:
    backend: sqlite
    cells:
      root:
        file_sources:
          recipes/merge-queue: ../../recipes/merge-queue
        files:
          merge-batch.yaml: |
            schema_version: 2
            id: unreachable-receipt
            input_schema:
              branch: {type: string}
              verification_policy: {type: object}
            inputs:
              branch: ${{ inputs.branch }}
            sequence: []
            outputs:
              version: 2
              branch: ${{ inputs.branch }}
              requested: ${{ context.grouping.appends.map(a,a.content.changeid) }}
              publication:
                owner_job: ${{ context.workflow.job_id }}
                source: null
                reason: no-new-merge
                result:
                  api_version: c2.build-hook/v1
                  status: skipped
                  summary: No new merge.
                  artifact_refs: {}
              results:
              - changeid: ${{ context.grouping.appends[0].content.changeid }}
                status: success
                hash: '0123456789abcdef0123456789abcdef01234567'
  mocks: *without_merge
  assertions:
  - type: cel_true
    expr: outputs.result.status=='stuck' && !has(outputs.result.publication) && !outputs.verified
  - type: cel_true
    expr: outputs.result.summary.contains('could not be confirmed')
- id: rejected-only-candidate-returns-original-logs-after-one-baseline-check
  type: integration_case
  inputs: {read_rejection: true}
  runtime:
    backend: sqlite
    cells:
      root:
        file_sources: *queue_sources
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence:
            - id: health
              op: command_execution
              const: true
              inputs:
                env:
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  set -eu
                  if test -f contribution.txt; then
                    echo 'Expected an activity selector.' > "$OUTBOX/restoration.log"
                    echo 'Expected an artifact error.' > "$OUTBOX/input-failure.log"
                    echo failed
                  else
                    echo passed
                  fi
            - id: capture_origin
              op: command_execution
              const: true
              artifacts:
                original.json:
                  kind: value
                  format: json
                  value: ${{ jq(sequence.health.artifacts,'with_entries(select(.key | endswith(".log")))') }}
              inputs:
                env:
                  INBOX: ${{ context.environment.op.inbox }}
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: cp "$INBOX/original.json" "$OUTBOX/diagnostic-origin.json"
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.health.outputs.stdout }}
              summary: Checked worker health.
              artifact_refs: ${{ jq([jq(sequence.health.artifacts,'with_entries(select(.key | endswith(".log")))'),{'diagnostic-origin.json':sequence.capture_origin.artifacts['diagnostic-origin.json']}],'add') }}
  mocks: *without_merge
  assertions:
  - type: cel_true
    expr: outputs.rejection_verified && outputs.result.status=='changes' && outputs.result.stage=='implementation' && outputs.result.rejected_changeid==outputs.candidate.changeid
  - type: cel_true
    expr: >-
      ['restoration.log','input-failure.log'].all(name,
        outputs.result.errors.exists(key,outputs.result.errors[key].stored.key.name==name))
  - type: cel_true
    expr: |
      calls.filter(c,c.node_path.endsWith('/health')).map(c,c.outputs.stdout)==['failed','passed'] &&
      calls.filter(c,c.node_path.endsWith('/health')).exists(c,c.node_path.contains('/full/')) &&
      calls.filter(c,c.node_path.endsWith('/health')).exists(c,c.node_path.contains('/baseline/')) &&
      !calls.exists(c,c.node_path.contains('adaptive3-merge-queue-land/final/') || c.node_path.contains('adaptive3-merge-queue-land/install/'))
  - type: cel_true
    expr: >-
      repositories.root.new_commits==0 && repositories.root.head==outputs.candidate.base_hash &&
      !calls.exists(c,c.op=='merge' || c.node_path.endsWith('/publish_source')) &&
      calls.exists(c,c.op=='recipe.await_result_soft' && c.outputs.outputs.publication.reason=='no-new-merge' &&
        c.outputs.outputs.publication.source==null && c.outputs.outputs.publication.owner_job==c.inputs.target.job &&
        c.outputs.outputs.requested==[outputs.candidate.changeid] &&
        c.outputs.outputs.results.size()==1 && c.outputs.outputs.results[0].changeid==outputs.candidate.changeid &&
        c.outputs.outputs.results[0].status=='fail-validation')
  - type: cel_true
    expr: >-
      ['restoration.log','input-failure.log'].all(name,
        calls.filter(c,c.node_path.endsWith('/health') && c.node_path.contains('/full/')).size()==1 &&
        calls.exists(c,c.node_path.endsWith('/health') && c.node_path.contains('/full/') &&
          outputs.result.errors.exists(alias,outputs.result.errors[alias].stored.key.name==name &&
            outputs.result.errors[alias].stored.key.jobId==c.job_id &&
            calls.exists(reader,reader.node_path.endsWith('/read_rejection') && reader.job_id!=c.job_id))))
- id: failed-baseline-keeps-receiver-failure-operational
  type: integration_case
  runtime:
    backend: sqlite
    cells:
      root:
        file_sources: *queue_sources
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence: []
            outputs:
              api_version: c2.build-hook/v1
              status: failed
              summary: Worker health failed on every commit.
              artifact_refs: {}
  mocks: *without_merge
  assertions:
  - type: cel_true
    expr: outputs.result.status=='stuck' && !has(outputs.result.rejected_changeid)
  - type: cel_true
    expr: calls.exists(c,c.op=='command_execution' && has(c.inputs.env) && has(c.inputs.env.REASON) && c.inputs.env.REASON.contains('Verification failed on the published baseline'))
  - type: cel_true
    expr: >-
      outputs.result.failure.outputs.attrs.c2j_failure.attrs.command.diagnostics.exists(k,
        outputs.result.failure.outputs.attrs.c2j_failure.attrs.command.diagnostics[k].stored.key.jobId==outputs.result.receiver.job_id)
  - type: cel_true
    expr: >-
      repositories.root.new_commits==0 && repositories.root.head==outputs.candidate.base_hash &&
      !calls.exists(c,c.op=='merge' || c.node_path.endsWith('/publish_source') ||
        c.node_path.contains('adaptive3-merge-queue-land/install/'))
- id: unchanged-rejection-does-not-resubmit
  type: integration_case
  inputs: {retry_rejection: true}
  runtime:
    backend: sqlite
    cells:
      root:
        file_sources:
          recipes/merge-queue: ../../recipes/merge-queue
        files:
          merge-batch.yaml: |
            schema_version: 2
            id: conflict-receipt
            input_schema:
              branch: {type: string}
              verification_policy: {type: object}
            inputs:
              branch: ${{ inputs.branch }}
            sequence: []
            outputs:
              version: 2
              branch: ${{ inputs.branch }}
              requested: ${{ context.grouping.appends.map(a,a.content.changeid) }}
              publication:
                owner_job: ${{ context.workflow.job_id }}
                source: null
                reason: no-new-merge
                result:
                  api_version: c2.build-hook/v1
                  status: skipped
                  summary: No new merge.
                  artifact_refs: {}
              results:
              - changeid: ${{ context.grouping.appends[0].content.changeid }}
                status: fail-conflict
  mocks: *without_merge
  assertions:
  - type: cel_true
    expr: outputs.result.status=='changes' && outputs.result.stage=='implementation' &&
      outputs.repeated.status=='stuck' && outputs.result.rejected_changeid==outputs.repeated.rejected_changeid
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/repeat/") && c.node_path.endsWith("/submit/sequence/batch"))'

