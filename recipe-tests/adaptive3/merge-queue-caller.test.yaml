      behavior:
        mode: return
        outputs: {stdout: '2024-04-01 12:25:00 UTC', stderr: '', exit_code: 0, success: true, timed_out: false, error_message: ''}
    - match: {selector: ./recipes/merge-queue}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: squash}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: merge}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - type: cel_true
    expr: outputs.verified && outputs.result.status=='passed'
  - type: cel_true
    expr: |
      calls.exists(c,c.op=='recipe.run_and_get_result' && has(c.outputs.outputs.metadata) &&
        c.outputs.outputs.metadata.title=='Merge queue: root/refs/heads/main (2024-04-01 12:25:00 UTC)' &&
        c.outputs.outputs.metadata.id!='')

