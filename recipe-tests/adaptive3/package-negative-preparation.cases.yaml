# Invoked only by checks/package_negative_preparation.py with a case-owned target, cache and allowlisted synthetic uv.
recipe: package-negative-preparation.yaml
cases:
- id: symlink-healthy
  type: integration_case
  runtime: &runtime
    backend: sqlite
    observe_files:
    - .c2/config.yaml
    cells:
      root:
        files:
          .c2/config.yaml: 'packages: ["uv:a3-prior==1"]

            custom: retained

            '
        file_sources:
          observer/op.yaml: preparation-observer/op.yaml
    controls:
      snapshot:
        files: []
      barriers:
      - id: observe
        match:
          selector: ./observer
          node_path: package-negative-preparation/ready
          cell: root
          occurrence: 1
          attempt: 1
        stdout: '{"output":{"observed":true}}'
      actions:
      - 'on': observe.entered
        do: release
  inputs:
    mode: healthy
    addition: uv:a3-addition-symlink==1
    tool: a3-addition-symlink
    target: REPLACED_BY_CASE_OWNED_TARGET
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: controls.complete && controls.final_snapshot.complete && size(controls.errors)==0
      && size(controls.final_snapshot.errors)==0
  - type: cel_true
    expr: outputs.stage.status=="passed"
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/probe/probe") && c.outputs.stdout.contains("native-preparation-marker
      a3-addition-symlink==1"))
- id: symlink-rejected
  type: integration_case
  runtime: *runtime
  inputs:
    mode: symlink
    addition: uv:a3-addition-symlink==1
    tool: a3-addition-symlink
    target: REPLACED_BY_CASE_OWNED_TARGET
  mocks:
    ops:
    - match:
