      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: controls.complete && controls.final_snapshot.complete && size(controls.errors)==0
      && size(controls.final_snapshot.errors)==0
  - type: cel_true
    expr: outputs.stage.status=="changes" && outputs.stage.summary.contains("expected
      a regular config file in a real .c2 directory") && !calls.exists(c,c.node_path.endsWith("/probe/probe"))
