recipe: ../../adaptive3.yaml
cases:
- id: prior-job-configure-omitted-returns-to-direction
  type: integration_case
  runtime:
    cells: &id001
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/configure.yaml: |
            id: recovery-configure-hook
            sequence:
            - id: record
              op: command_execution
              inputs:
                run: printf 'Configured for recovery'
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: ${{ sequence.record.outputs.stdout }}
              artifact_refs: {}
              settings:
                require_design: false
                prompt_additions: {}
                variables: {}
                consultations: []
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
  inputs:
    title: Explain the recovered behavior
    prompt: Stop delivery. Explain the local behavior only.
    resume_from: previous-job
  mocks:
    ops:
    - &id002
      match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Direction the assigned work.
            documents: []
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - &id003
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &id004
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Assess the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id005
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - &id006
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: finish
            instruction: The requested work is complete.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id007
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("recovery-configure-hook/record")).size()==1
- id: prior-job-configure-null-returns-to-direction
  type: integration_case
  runtime:
    cells: *id001
  inputs:
    title: Explain the recovered behavior
    prompt: Stop delivery. Explain the local behavior only.
    resume_from: previous-job
  mocks:
    ops:
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("recovery-configure-hook/record")).size()==1
- id: prior-job-configure-explicit-direction-returns-to-direction
  type: integration_case
  runtime:
    cells: *id001
  inputs:
    title: Explain the recovered behavior
    prompt: Stop delivery. Explain the local behavior only.
    resume_from: previous-job
  mocks:
    ops:
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("recovery-configure-hook/record")).size()==1
