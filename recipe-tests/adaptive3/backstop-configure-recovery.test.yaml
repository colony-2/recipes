# Recover through real Configure and Direction; only external agent decisions are scripted.
recipe: ../../adaptive3.yaml
cases:
- id: prior-job-configure-omitted-returns-to-direction
  type: integration_case
  runtime: &recovery_runtime
    cells:
      root:
        files:
          README.md: A small project.
          .c2/recipes/hooks/build/configure.yaml: |
            id: recovery-configure-hook
            sequence:
            - id: record
              op: command_execution
              inputs:
                run: printf 'Configured for recovery'
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: ${{ sequence.record.outputs.stdout }}
              artifact_refs: {}
              settings:
                require_design: false
                prompt_additions: {}
                variables: {}
                consultations: []
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  inputs: &recovery_inputs
    prompt: Stop delivery. Explain the local behavior only.
    resume_from: previous-job
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: resume
            action: Refresh Configure before reviewing recovered work as an explanation.
            stage: configure
            summary: Refresh configuration, then review current scope.
            title: Restore progress on direction
            primary: null
            instruction: null
            report: null
            additional_attempts: 1
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Refresh configuration, then review current scope.
    - &direction_author
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &direction_validator
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - &native_commands
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - &native_review
      match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions: &recovery_assertions
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("recovery-configure-hook/record")).size()==1
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/backstop/")).size()==1
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt) && c.node_path.contains("/direction/")
      && c.node_path.contains("/execute/")).size()==1
  - type: cel_true
    expr: size(reviews)==1 && outputs.reviews[0].receipt.request_id!=""
- id: prior-job-configure-null-returns-to-direction
  type: integration_case
  runtime: *recovery_runtime
  inputs: *recovery_inputs
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: resume
            action: Refresh Configure before reviewing recovered work as an explanation.
            stage: configure
            summary: Refresh configuration, then review current scope.
            title: Restore progress on direction
            primary: null
            instruction: null
            report: null
            additional_attempts: 1
            destination: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Refresh configuration, then review current scope.
    - *direction_author
    - *direction_validator
    - *native_commands
    - *native_review
  assertions: *recovery_assertions
