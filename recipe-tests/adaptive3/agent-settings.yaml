schema_version: 2
id: agent-settings-test
input_schema:
  prompt: {type: string, required: true}
  schema: {type: object, required: true}
  read_only: {type: boolean, default_value: true}
  agent_settings: {type: object, default_value: {}}
inputs:
  prompt: ${{ inputs.prompt }}
  schema: ${{ inputs.schema }}
  read_only: ${{ inputs.read_only }}
  agent_settings: ${{ inputs.agent_settings }}
sequence:
- id: author
  include: ../../recipes/adaptive3/agent.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    schema: ${{ inputs.schema }}
    read_only: ${{ inputs.read_only }}
    agent_settings: ${{ inputs.agent_settings }}
