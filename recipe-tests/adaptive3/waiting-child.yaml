schema_version: 2
id: waiting-child
sequence:
- id: release
  op: input
  inputs:
    form:
      kind: review
      title: Release fixture work
      fields:
      - id: decision
        type: multiple_choice
        question: Release?
        required: true
        options:
        - value: continue
          label: Continue
- id: result
  op: command_execution
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
    run: printf retained > "$OUTBOX/result.txt"
outputs:
  summary: Existing owner work is complete.
  artifact_refs: ${{ sequence.result.artifacts }}
