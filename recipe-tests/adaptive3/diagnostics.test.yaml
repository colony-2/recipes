recipe: diagnostics.yaml
cases:
- id: wrapped-causes-preserve-paths-and-bytes
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Diagnostics
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="passed" && outputs.result.logs==2
  - type: cel_true
    expr: outputs.documents.filter(k,k.endsWith("/sub/check.log")).size()==2
