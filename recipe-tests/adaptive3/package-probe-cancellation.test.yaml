recipe: package-probe-cli.yaml
cases:
- id: probe-cancellation-escapes-catch
  type: integration_case
  runtime:
    observe_files:
    - .c2/config.yaml
    - prompt-must-not-run
    - title-must-not-run
    cells:
      root:
        files:
          README.md: Disposable CLI submission fixture.
        file_sources:
          .c2/recipes/package-probe.yaml: ../../recipes/adaptive3/package-probe.yaml
          .c2/recipes/tools.yaml: ../../recipes/adaptive3/tools.yaml
  inputs:
    scenario: cancellation
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.validation.result.status=="passed"
  - type: cel_true
    expr: 'calls.filter(c,c.node_path.contains("/validate/") && c.op=="command_execution").all(c,c.outputs.stdout.contains(''"written":
      false'') && !(".c2/config.yaml" in c.worktree))'
  - type: cel_true
    expr: size(outputs.jobs)==1 && outputs.child.status=="failed" && outputs.child.outputs.attrs.c2j_failure.kind=="cancellation"
      && !("status" in outputs.child.outputs)
  - type: cel_true
    expr: 'calls.exists(c,c.node_path.contains("/install/") && c.outputs.stdout.contains(''"written": true''))'
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/probe/probe"))
