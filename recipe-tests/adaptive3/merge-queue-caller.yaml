schema_version: 2
id: merge-queue-caller-test
input_schema:
  branch:
    type: string
    default_value: main
  saved_receipt:
    type: boolean
    default_value: false
  missing_document:
    type: boolean
    default_value: false
  replace_hook:
    type: boolean
    default_value: false
  retry_after_advance:
    type: boolean
    default_value: false
  retry_rejection:
    type: boolean
    default_value: false
  read_rejection:
    type: boolean
    default_value: false
inputs:
  branch: ${{ inputs.branch }}
  saved_receipt: ${{ inputs.saved_receipt }}
  missing_document: ${{ inputs.missing_document }}
  replace_hook: ${{ inputs.replace_hook }}
  retry_after_advance: ${{ inputs.retry_after_advance }}
  retry_rejection: ${{ inputs.retry_rejection }}
  read_rejection: ${{ inputs.read_rejection }}
sequence:
- id: initialize_branch
  when: inputs.branch!='main'
  op: command_execution
  const: true
  inputs:
    env:
      QUEUE_BRANCH: ${{ inputs.branch }}
    run: git push origin "HEAD:refs/heads/$QUEUE_BRANCH"
- id: candidate
  inputs:
    branch: ${{ inputs.branch }}
    saved_receipt: ${{ inputs.saved_receipt }}
    missing_document: ${{ inputs.missing_document }}
    replace_hook: ${{ inputs.replace_hook }}
    retry_after_advance: ${{ inputs.retry_after_advance }}
    retry_rejection: ${{ inputs.retry_rejection }}
    read_rejection: ${{ inputs.read_rejection }}
  workspace:
    cell: ${{ context.workflow.cell }}
    ref: ${{ inputs.branch }}
  sequence:
  - id: work
    op: command_execution
    inputs:
      env:
        OUTBOX: ${{ context.environment.op.outbox }}
        REPLACE_HOOK: ${{ string(inputs.replace_hook) }}
      run: |
        if [ "$REPLACE_HOOK" = true ]; then
          sed -i 's/id: queue-publish-source-probe/id: contributed-publish-source-probe/' .c2/recipes/hooks/build/publish.yaml
        fi
        printf 'queue-ready\n' > contribution.txt
        mkdir -p "$OUTBOX/review"
        printf 'selected-document\n' > "$OUTBOX/review/note.txt"
  - id: prepare
    include: ../../recipes/adaptive3/merge-queue-prepare.yaml
    inputs:
      message: Add the queue fixture
  - id: verify
    when: inputs.saved_receipt
    include: ../../recipes/adaptive3/verify-candidate.yaml
    inputs:
      request: Check the caller candidate before queue submission.
      target_directory: .
      documents: {}
      settings: {}
      require_verification: true
  - id: submit
    include: ../../recipes/adaptive3/merge-queue-submit.yaml
    inputs:
      documents:
        review/note.txt: >-
          ${{ inputs.missing_document ? jq(sequence.work.artifacts['review/note.txt'],'.stored.key.name="missing-note.txt"') : sequence.work.artifacts['review/note.txt'] }}
      contribution: ${{ sequence.prepare.outputs.candidate }}
      verification: ${{ sequence[?'verify'].orValue({}).?outputs.orValue({}).?receipt.orValue({}) }}
      receiver: ${{ 'git+' + context.git.repo + '//merge-batch.yaml@main' }}
      require_verification: true
      target_directory: .
      settings: {}
  - id: read_rejection
    when: inputs.read_rejection && sequence.submit.outputs.result.status=='changes' && sequence.submit.outputs.result.stage=='implementation'
    op: command_execution
    const: true
    artifacts:
      change-id.txt:
        kind: value
        format: text
        value: ${{ sequence.prepare.outputs.candidate.changeid }}
      returned.json:
        kind: value
        format: json
        value: ${{ sequence.submit.outputs.result.errors }}
      errors/: ${{ sequence.submit.outputs.result.errors }}
    inputs:
      env:
        INBOX: ${{ context.environment.op.inbox }}
        OUTBOX: ${{ context.environment.op.outbox }}
      run: python3 read-rejection.py "$INBOX" "$OUTBOX"
  - id: read_target
    when: sequence.submit.outputs.result.status=='passed'
    op: command_execution
    const: true
    workspace:
      cell: ${{ context.workflow.cell }}
      ref: ${{ inputs.branch }}
    inputs:
      env:
        LANDED: ${{ sequence.submit.outputs.result.?publication.orValue({}).?merged_hash.orValue('') }}
        CHANGE_ID: ${{ sequence.prepare.outputs.candidate.changeid }}
      run: |
        set -eu
        test "$(git rev-parse HEAD)" = "$LANDED"
        test "$(cat contribution.txt)" = queue-ready
        test "$(git log -1 --format='%(trailers:key=Change-Id,valueonly)' | tr -d '\n')" = "$CHANGE_ID"
  - id: read_publication
    when: sequence.submit.outputs.result.status=='passed' && sequence.submit.outputs.result.publish.status=='passed'
    op: command_execution
    const: true
    artifacts:
      shared/: ${{ sequence.submit.outputs.result.publish.artifact_refs }}
    inputs:
      env:
        SOURCE: ${{ sequence.submit.outputs.result.queue_publication.source.merged_hash }}
        OWNER: ${{ sequence.submit.outputs.result.queue_publication.owner_job }}
        INBOX: ${{ context.environment.op.inbox }}
      run: |
        set -eu
        test -f "$INBOX/shared/source.txt"
        grep -Fx "source=$SOURCE" "$INBOX/shared/source.txt"
        grep -Fx "owner=$OWNER" "$INBOX/shared/source.txt"
  - id: advance
    when: inputs.retry_after_advance
    workspace:
      cell: ${{ context.workflow.cell }}
      ref: ${{ inputs.branch }}
    sequence:
    - id: unrelated
      op: command_execution
      inputs:
        run: printf 'later\n' > later.txt
    - id: merge
      op: merge
  - id: repeat
    when: inputs.retry_after_advance || inputs.retry_rejection
    include: ../../recipes/adaptive3/merge-queue-submit.yaml
    inputs:
      documents:
        review/note.txt: >-
          ${{ inputs.missing_document ? jq(sequence.work.artifacts['review/note.txt'],'.stored.key.name="missing-note.txt"') : sequence.work.artifacts['review/note.txt'] }}
      contribution: ${{ sequence.prepare.outputs.candidate }}
      verification: ${{ sequence[?'verify'].orValue({}).?outputs.orValue({}).?receipt.orValue({}) }}
      queue_history: ${{ sequence.submit.outputs.result }}
      receiver: ${{ 'git+' + context.git.repo + '//merge-batch.yaml@main' }}
      require_verification: true
      target_directory: .
      settings: {}
  outputs:
    result: ${{ sequence.submit.outputs.result }}
    repeated: ${{ sequence[?'repeat'].orValue({}).?outputs.orValue({}).?result.orValue({}) }}
    verified: ${{ sequence[?'read_target'].orValue({}).?outputs.orValue({}).?success.orValue(false) }}
    rejection_verified: ${{ sequence[?'read_rejection'].orValue({}).?outputs.orValue({}).?success.orValue(false) }}
    candidate: ${{ sequence.prepare.outputs.candidate }}
outputs:
  result: ${{ sequence.candidate.outputs.result }}
  repeated: ${{ sequence.candidate.outputs.repeated }}
  verified: ${{ sequence.candidate.outputs.verified }}
  rejection_verified: ${{ sequence.candidate.outputs.rejection_verified }}
  candidate: ${{ sequence.candidate.outputs.candidate }}
