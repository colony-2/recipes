schema_version: 2
id: cycle-test
input_schema:
  purpose:
    type: string
    required: true
  request:
    type: string
    required: true
inputs:
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
sequence:
- id: cycle
  include: ../../recipes/adaptive3/cycle.yaml
  inputs:
    purpose: ${{ inputs.purpose }}
    request: ${{ inputs.request }}
outputs:
  result: ${{ sequence.cycle.outputs.result }}
  documents: ${{ sequence.cycle.outputs.documents }}
