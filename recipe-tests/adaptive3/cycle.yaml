schema_version: 2
id: cycle-test
input_schema:
  threads: {type: object, default_value: {}}
  plan: {type: object, default_value: {}}
  finding: {type: object, default_value: {}}
  retry: {type: object, default_value: {}}
  purpose:
    type: string
    required: true
  request:
    type: string
    required: true
inputs:
  threads: ${{ inputs.threads }}
  plan: ${{ inputs.plan }}
  finding: ${{ inputs.finding }}
  retry: ${{ inputs.retry }}
  purpose: ${{ inputs.purpose }}
  request: ${{ inputs.request }}
sequence:
- id: cycle
  include: ../../recipes/adaptive3/cycle.yaml
  inputs:
    retry: ${{ inputs.retry }}
    threads: ${{ inputs.threads }}
    plan: ${{ inputs.plan }}
    finding: ${{ inputs.finding }}
    purpose: ${{ inputs.purpose }}
    request: ${{ inputs.request }}
outputs:
  retry: ${{ sequence.cycle.outputs.retry }}
  result: ${{ sequence.cycle.outputs.result }}
  documents: ${{ sequence.cycle.outputs.documents }}
