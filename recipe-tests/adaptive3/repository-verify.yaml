schema_version: 2
id: repository-verify-test
sequence:
- id: verify
  include: ../../.c2/recipes/hooks/build/verify.yaml
  inputs:
    api_version: c2.build-hook/v1
    request: Check the candidate repository.
    target_directory: nested
    candidate: ${{ context.git.hash }}
    base: ${{ context.git.execution.base_hash }}
- id: inspect
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.verify.outputs.artifact_refs }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      cat "$INBOX/tests.log"
      if [ -f "$INBOX/test-reports.tar.gz" ]; then
        tar -tzf "$INBOX/test-reports.tar.gz"
      fi
outputs:
  diagnostics: ${{ sequence.inspect.outputs.stdout }}
  result: ${{ sequence.verify.outputs }}
