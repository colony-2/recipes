recipe: backstop.yaml
cases:
- id: preparation-instruction-authorizes-first-backstop-decision
  type: integration_case
  runtime: {}
  inputs:
    stage: preparation
    request: Add tenant switching.
    automatic: false
    problem:
      status: changes
      stage: implementation
      summary: Revise the design before implementation.
      human:
        response: {direction: revise, feedback: Put the switch in the About menu., settings: {}, attachments: []}
        receipt: {request_id: preparation-review, submission_id: menu-revision}
  mocks:
    ops:
    - match: &agent {selector: 'nix:github:colony-2/c2ops/published#codex'}
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response: &resume
            status: resume
            action: Update the tenant switch placement in the plan.
            stage: direction
            instruction: {text: Put the switch in the About menu., scope_change: true}
            destination: null
            summary: Revise the plan for the requested dropdown.
            title: Revise the tenant menu
            primary: null
            document_details: []
            report: null
            additional_attempts: null
  assertions:
  - {type: cel_true, expr: 'size(reviews)==0 && outputs.result.stage=="direction"'}
  - {type: cel_true, expr: 'outputs.result.amendment.human.receipt.submission_id=="menu-revision" && outputs.result.amendment.human.response.feedback=="Put the switch in the About menu."'}
- id: a-question-reveals-an-available-check
  type: integration_case
  runtime:
    cells: &form_files
      root:
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response: {direction: question, feedback: "Why do we need a builder?", settings: {}, attachments: []}
  inputs:
    stage: direction
    request: Publish the tested outputs.
    automatic: true
    problem: {status: stuck, summary: The native build worker is unavailable.}
  mocks:
    ops:
    - &missing_builder
      match: *agent
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            <<: *resume
            status: ask
            stage: null
            action: null
            instruction: null
            summary: Who operates the build worker?
    - &inspect_handoff
      match: *agent
      repeat: true
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            <<: *resume
            stage: direction
            action: Check for trusted outputs for this merge.
            instruction: null
            summary: The hook can publish existing tested outputs. Inspect the existing handoff.
    - &form
      match: {selector: ./recipes/review-v2}
      repeat: true
      behavior: {mode: passthrough}
    - &commands
      match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - {type: cel_true, expr: 'size(reviews)==1 && outputs.result.action=="Check for trusted outputs for this merge."'}
  - {type: cel_true, expr: '!has(outputs.result.human) && !has(outputs.result.amendment)'}
- id: discussion-replaces-an-obsolete-question-and-apply-choice
  type: integration_case
  runtime:
    cells:
      root:
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response: {direction: question, feedback: "Why is a builder needed?", settings: {}, attachments: []}
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response: {direction: revise, feedback: Use the published operating procedure., settings: {}, attachments: []}
  inputs:
    stage: direction
    request: Publish the tested outputs.
    problem: {status: stuck, summary: Build worker unavailable.}
  mocks:
    ops:
    - match: *agent
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            <<: *resume
            status: ask
            instruction: null
            action: Investigate the build worker.
            summary: Who is the builder operator?
    - match: *agent
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            <<: *resume
            status: ask
            stage: null
            action: null
            instruction: null
            summary: Which procedure identifies the trusted outputs?
    - match: *agent
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            <<: *resume
            action: Read the published procedure.
            instruction: {text: Use the published operating procedure., scope_change: false}
    - match: {selector: ./recipes/review-v2}
      repeat: true
      behavior: {mode: passthrough}
    - match: {op: command_execution}
      repeat: true
      behavior: {mode: passthrough}
  assertions:
  - {type: cel_true, expr: 'size(reviews)==2 && reviews[0].form.request.directions.exists(d,d.id=="continue")'}
  - {type: cel_true, expr: 'reviews[1].form.request.question=="Which procedure identifies the trusted outputs?" && !reviews[1].form.request.directions.exists(d,d.id=="continue")'}
  - {type: cel_true, expr: 'outputs.result.stage=="direction" && outputs.result.human.response.direction=="revise"'}

- id: instruction-renews-returns-even-when-the-first-retry-stays-blocked
  type: integration_case
  runtime:
    cells: *form_files
    responses:
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response: {direction: revise, feedback: Try the operator lookup again., settings: {}, attachments: []}
    - node_path: backstop-test/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response: {direction: question, feedback: "Why is a builder needed?", settings: {}, attachments: []}
  inputs:
    stage: direction
    request: Publish the tested outputs.
    automatic: false
    problem: {status: stuck, summary: Build worker unavailable.}
  mocks:
    ops:
    - *missing_builder
    - *missing_builder
    - *inspect_handoff
    - *form
    - *commands
  assertions:
  - {type: cel_true, expr: 'size(reviews)==2 && outputs.result.action=="Check for trusted outputs for this merge."'}
  - {type: cel_true, expr: '!has(outputs.result.human)'}
