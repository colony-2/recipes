schema_version: 2
id: packages-test
input_schema:
  requests:
    type: array
    items:
      type: object
    required: true
  reason:
    type: string
    required: true
inputs:
  requests: ${{ inputs.requests }}
  reason: ${{ inputs.reason }}
sequence:
- id: packages
  include: ../../recipes/adaptive3/packages.yaml
  inputs:
    requests: ${{ inputs.requests }}
    reason: ${{ inputs.reason }}
outputs:
  result: ${{ sequence.packages.outputs.result }}
