recipe: lifecycle.yaml
cases:
- id: document-comments-repeat-full-cycle
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: lifecycle-test/lifecycle/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: annotate
        feedback: Explain restoration more clearly.
        attachments: []
        settings: {}
    - node_path: lifecycle-test/lifecycle/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    purpose: direction
    request: Explain this project.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and supporting evidence.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Requested outcome

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and supporting evidence.
              role: primary
              order: 10
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: '# Requested outcome


            Restoration reopens the saved draft.

            '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="accepted" && size(reviews)==2 && reviews[0].form.request.review_id!=reviews[1].form.request.review_id
  - type: cel_true
    expr: reviews[0].form.request.documents!=reviews[1].form.request.documents && size(reviews[1].form.request.conversation)==0
      && reviews[1].form.request.settings[0].value=="auto"
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).size()==4 && calls.filter(c,c.op=="extension_execution"
      && has(c.inputs.inputs.prompt))[2].inputs.inputs.prompt.contains("Explain restoration more clearly.")
  - type: cel_true
    expr: outputs.result.receipt.request_id==reviews[1].request_id && !calls.exists(c,c.op=="merge")
