schema_version: 2
id: ask-live
input_schema:
  scenario:
    type: string
    required: true
inputs:
  scenario: ${{ inputs.scenario }}
sequence:
- id: sources
  op: command_execution
  inputs: {run: unused}
- id: lifecycle
  include: ../../recipes/adaptive3/lifecycle.yaml
  inputs:
    purpose: implementation
    max_iterations: 3
    request: |
      Complete the isolated consumer acceptance task described in README.md.
      This is a test environment with no production deployment effects. Treat its
      source and publication facts as the environment's actual facts. Use your
      installed Adaptive instructions and tools to decide how to proceed.
      The source delivery is not yet complete. Submit the supplied source fixture
      once as a child in your cell, using c2j submit with a positional prompt,
      --advanced-recipe and --json, then let Adaptive wait. Its selector is
      git+https://{{ sequence.sources.outputs.library }}//source.yaml@main
      Its publication facts are fixed in that isolated source; no mode input is needed.
      For any human question, the candidate selector in this isolated environment
      is git+https://{{ sequence.sources.outputs.library }}//ask.yaml@main
      (use this actual candidate source instead of the public main selector).
      The fixture operator contributes text using the default reply form; omit
      directions for compatibility with that operator's response channel.
      Use mktemp for scratch files; concurrent samples share the host's /tmp.
      Do not modify the fixture programs or invent publication evidence.
      Record your outcome in review/result.md with a valid document_details entry.
      If a dependency remains unresolved, report it as unresolved. Do not request
      real deployment, contact external operators, merge, or publish anything.
- id: observations
  op: command_execution
  inputs:
    run: |
      if [ -f evidence/checks.jsonl ]; then cat evidence/checks.jsonl; fi
outputs:
  result: ${{ sequence.lifecycle.outputs.result }}
  checks: ${{ sequence.observations.outputs.stdout }}
  documents: ${{ sequence.lifecycle.outputs.documents }}
