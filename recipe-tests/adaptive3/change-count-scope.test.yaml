recipe: change-count-scope.yaml
cases:
- id: direction-generated-instructions
  type: integration_case
  runtime: &id001
    cells:
      root:
        files:
          README.md: |
            A small project.
        file_sources:
          .c2/recipes/hooks/build/verify.yaml: fixtures/change-count-verify.yaml
  inputs:
    purpose: direction
  mocks: &id002
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked current scope.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - &id003
    type: cel_true
    expr: outputs.result.status=="passed"
  - &id004
    type: cel_true
    expr: ([outputs.general,outputs.specialist] + calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).map(c,c.inputs.inputs.prompt)).all(p,p.contains("Check
      factual claims, required behavior,") && p.contains("relevant regressions, owner dependencies and meaningful
      test results.") && p.contains("Required failures remain failures.") && p.contains("A required incomplete check
      remains incomplete.") && p.contains("human direction supersedes contradictory agent advice.") && p.contains("Return
      all material current findings.") && p.contains("Inspect these producer document details") && p.contains("For
      human documents, check"))
  - &id005
    type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)))==2
  - &id006
    type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/assess/") && c.op=="extension_execution"))==1
  - &id007
    type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/specialists/") && c.op=="extension_execution"))==1
  - &id008
    type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/approved_change/")))==0
  - &id009
    type: cel_true
    expr: ([outputs.general,outputs.specialist] + calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).map(c,c.inputs.inputs.prompt)).all(p,!p.contains("change-counts.tsv")
      && !p.contains("reports return changes") && !p.contains("measured additions/removals") && !p.contains("binary/uncountable
      entries"))
  - &id010
    type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).all(c,!("work/error/change-counts.tsv"
      in c.artifacts))
  - type: cel_true
    expr: ([outputs.general,outputs.specialist] + calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).map(c,c.inputs.inputs.prompt)).all(p,p.contains("Cell
      | Core code | Tests | Docs") && p.contains("none/small/medium/large rather than line estimates"))
- id: preparation-generated-instructions
  type: integration_case
  runtime: *id001
  inputs:
    purpose: preparation
  mocks: *id002
  assertions: &id011
  - *id003
  - *id004
  - *id005
  - *id006
  - *id007
  - *id008
  - *id009
  - *id010
- id: implementation-generated-instructions
  type: integration_case
  runtime: *id001
  inputs:
    purpose: implementation
  mocks: *id002
  assertions: *id011
- id: outcome-generated-instructions
  type: integration_case
  runtime: *id001
  inputs:
    purpose: outcome
  mocks: *id002
  assertions:
  - *id003
  - *id004
  - &id012
    type: cel_true
    expr: size(calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)))==1
  - *id006
  - &id013
    type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/specialists/") && c.op=="extension_execution"))==0
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/approved_change/")))==1
  - type: cel_true
    expr: ([outputs.general,outputs.specialist] + calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).map(c,c.inputs.inputs.prompt)).all(p,p.contains("measured
      additions/removals by cell and category") && p.contains("per-file diff") && p.contains("delegated results")
      && p.contains("Test frameworks, harnesses and fixtures are test code") && p.contains("binary/uncountable entries")
      && p.contains("distinguish pending from completed owner work") && p.contains("Read error/change-counts.tsv")
      && p.contains("Missing,\ninvented or inconsistent reports return changes with the specific correction."))
  - type: cel_true
    expr: calls.filter(c,c.op=="extension_execution" && has(c.inputs.inputs.prompt)).all(c,"work/error/change-counts.tsv"
      in c.artifacts && "work/candidate.diff" in c.artifacts)
- id: integration-generated-instructions
  type: integration_case
  runtime: *id001
  inputs:
    purpose: integration
  mocks: *id002
  assertions: &id014
  - *id003
  - *id004
  - *id012
  - *id006
  - *id013
  - *id008
  - *id009
  - *id010
- id: advice-generated-instructions
  type: integration_case
  runtime: *id001
  inputs:
    purpose: advice
  mocks: *id002
  assertions: *id014
