schema_version: 2
id: backstop-return-test
input_schema:
  result: {type: object, required: true}
  problem: {type: object, required: true}
  retry: {type: object, default_value: {}}
inputs:
  result: ${{ inputs.result }}
  problem: ${{ inputs.problem }}
  retry: ${{ inputs.retry }}
sequence:
- id: dispatch
  include: ../../recipes/adaptive3/backstop-return.yaml
  inputs:
    result: ${{ inputs.result }}
    problem: ${{ inputs.problem }}
    retry: ${{ inputs.retry }}
outputs:
  result: ${{ sequence.dispatch.outputs.result }}
  retry: ${{ sequence.dispatch.outputs.retry }}
  merge_limit: ${{ sequence.dispatch.outputs.retry.merge_limit }}
