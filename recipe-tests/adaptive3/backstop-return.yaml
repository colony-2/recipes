schema_version: 2
id: backstop-return-test
input_schema:
  result: {type: object, required: true}
  problem: {type: object, required: true}
  automatic_used: {type: number, default_value: 0}
  last_authorization: {type: object, default_value: {}}
inputs:
  result: ${{ inputs.result }}
  problem: ${{ inputs.problem }}
  automatic_used: ${{ inputs.automatic_used }}
  last_authorization: ${{ inputs.last_authorization }}
sequence:
- id: dispatch
  include: ../../recipes/adaptive3/backstop-return.yaml
  inputs:
    result: ${{ inputs.result }}
    problem: ${{ inputs.problem }}
    automatic_used: ${{ inputs.automatic_used }}
    last_authorization: ${{ inputs.last_authorization }}
outputs:
  result: ${{ sequence.dispatch.outputs.result }}
  automatic_used: ${{ sequence.dispatch.outputs.automatic_used }}
  authorization: ${{ sequence.dispatch.outputs.authorization }}
  merge_limit: ${{ sequence.dispatch.outputs.merge_limit }}
