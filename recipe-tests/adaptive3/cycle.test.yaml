  - type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/execute/") && (c.op=="extension_execution" && has(c.inputs.inputs.prompt))))==1
  - type: cel_true
    expr: >-
      calls.exists(c,c.node_path.contains("/resume_read_only/") && c.op=="extension_execution" &&
        has(c.inputs.inputs.prompt) && !("instructions" in c.inputs.inputs) &&
        !c.inputs.inputs.prompt.contains("WORKING_IN_C2.md") &&
        (!has(c.artifacts) || !("C2-guide.md" in c.artifacts)))
