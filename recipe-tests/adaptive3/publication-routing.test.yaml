recipe: publication-routing.yaml
cases:
- id: ordinary-full-hash-recovery-after-advancement
  type: integration_case
  inputs: {mode: ordinary}
  runtime: &runtime
    backend: sqlite
    cells:
      root:
        file_sources:
          merge-batch.yaml: ../../merge-batch.yaml
          merge-check.yaml: ../../merge-check.yaml
          recipes/adaptive3: ../../recipes/adaptive3
          recipes/merge-queue: ../../recipes/merge-queue
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence: []
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Checked the candidate.
              artifact_refs: {}
          .c2/recipes/hooks/build/publish.yaml: |
            id: source-probe
            inputs:
              merged: ${{ inputs.merged_hash }}
              candidate: ${{ inputs.candidate }}
              branch: ${{ inputs.target_branch }}
            sequence:
            - id: source_probe
              op: command_execution
              inputs:
                env:
                  MERGED: ${{ inputs.merged }}
                  CANDIDATE: ${{ inputs.candidate }}
                  BRANCH: ${{ inputs.branch }}
                run: |
                  set -eu
                  test "$(git rev-parse HEAD)" = "$MERGED"
                  test "$MERGED" = "$CANDIDATE"
                  test "$BRANCH" = refs/heads/main
                  test "$(cat contribution.txt)" = queue-ready
                  test ! -f later.txt
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Published the recorded source.
              artifact_refs: {}
  mocks: &native
    ops:
    - {match: {selector: ./recipes/merge-queue}, repeat: true, behavior: {mode: passthrough}}
    - {match: {op: command_execution}, repeat: true, behavior: {mode: passthrough}}
    - {match: {op: squash}, repeat: true, behavior: {mode: passthrough}}
    - {match: {op: merge}, repeat: true, behavior: {mode: passthrough}}
  assertions:
  - type: cel_true
    expr: outputs.result.status=='ready' && outputs.result.publication==outputs.receipt && outputs.receipt.merged_hash.matches('^[0-9a-f]{40}$')
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith('/source_probe')).size()==1 && calls.filter(c,c.op=='merge').size()==2
- id: native-receiver-recovery-never-publishes-in-caller-with-queue-disabled
  type: integration_case
  inputs: {mode: receiver}
  runtime: *runtime
  mocks: *native
  assertions:
  - type: cel_true
    expr: outputs.result.status=='ready' && outputs.result.queue_publication==outputs.queued.queue_publication
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith('/source_probe')).size()==1 && calls.filter(c,c.node_path.endsWith('/source_probe')).all(c,c.job_id==outputs.queued.queue_publication.owner_job)
  - type: cel_true
    expr: calls.filter(c,c.op=='recipes.run').size()==1 && calls.filter(c,c.op=='merge').size()==1
- id: missing-queue-owner-cannot-fall-back-to-ordinary-publication
  type: integration_case
  inputs: {mode: missing-owner}
  runtime: *runtime
  mocks:
    ops:
    - {match: {selector: ./recipes/merge-queue}, repeat: true, behavior: {mode: passthrough}}
    - {match: {op: command_execution}, repeat: true, behavior: {mode: passthrough}}
    - {match: {op: squash}, repeat: true, behavior: {mode: passthrough}}
  assertions:
  - type: cel_true
    expr: outputs.result.status=='stuck' && outputs.result.summary.contains('original receiver')
  - type: cel_true
    expr: "!calls.exists(c,c.node_path.endsWith('/source_probe') || c.op=='recipes.run' || c.op=='merge')"
- id: legacy-queue-publication-evidence-does-not-authorize-caller-hook
  type: integration_case
  inputs: {mode: legacy}
  runtime: *runtime
  mocks: *native
  assertions:
  - type: cel_true
    expr: outputs.result.status=='stuck' && outputs.result.summary.contains('Cannot reuse prior merge')
  - type: cel_true
    expr: "!calls.exists(c,c.node_path.endsWith('/source_probe') || c.op=='recipes.run') && calls.filter(c,c.op=='merge').size()==1"
- id: legacy-receipt-stays-ambiguous-with-queue-disabled
  type: integration_case
  inputs: {mode: legacy-disabled}
  runtime: *runtime
  mocks: *native
  assertions:
  - type: cel_true
    expr: outputs.result.status=='stuck' && outputs.result.summary.contains('Cannot reuse prior merge')
  - type: cel_true
    expr: "!calls.exists(c,c.node_path.endsWith('/source_probe') || c.op=='recipes.run') && calls.filter(c,c.op=='merge').size()==1"
- id: moving-reference-is-not-native-full-hash-recovery
  type: integration_case
  inputs: {mode: ordinary-moving}
  runtime: *runtime
  mocks: *native
  assertions:
  - type: cel_true
    expr: outputs.result.status=='stuck' && outputs.result.summary.contains('Cannot reuse prior merge')
  - type: cel_true
    expr: "!calls.exists(c,c.node_path.endsWith('/source_probe') || c.op=='recipes.run') && calls.filter(c,c.op=='merge').size()==1"
- id: absent-queue-handle-does-not-hijack-ordinary-merge-retry
  type: integration_case
  inputs: {mode: ordinary-null-receiver}
  runtime: *runtime
  mocks: *native
  assertions:
  - type: cel_true
    expr: outputs.result.status=='ready' && outputs.result.publication==outputs.receipt
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith('/source_probe')).size()==1 && calls.filter(c,c.op=='merge').size()==1 && !calls.exists(c,c.op=='recipes.run')
