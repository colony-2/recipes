schema_version: 2
id: diagnostic-child
input_schema:
  passes:
    type: boolean
    default_value: false
  acceptance:
    type: boolean
    default_value: false
inputs:
  passes: ${{ inputs.passes }}
  acceptance: ${{ inputs.acceptance }}
sequence:
- id: probe
  op: command_execution
  inputs:
    env:
      PASSES: ${{ string(inputs.passes) }}
      ACCEPTANCE: ${{ string(inputs.acceptance) }}
    run: if [ "$PASSES" = true ]; then echo "Import check passed"; else echo "Pillow is still not importable"; if
      [ "$ACCEPTANCE" = true ]; then exit 9; fi; fi
outputs:
  summary: '${{ inputs.passes ? ''Pillow imports successfully.'' : ''Pillow is still not importable; this diagnostic
    did not repair it.'' }}'
  probe_passed: ${{ inputs.passes }}
