recipe: ../../adaptive3.yaml
cases:
- id: resume-approved-implementation
  type: integration_case
  runtime:
    cells: &id002
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    merge_queue: false
    prompt: Add a marker file.
    resume_from: previous-job
  mocks:
    ops:
    - match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: implement
            instruction: Implement the assigned work.
            documents: []
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            commit:
              title: Record the completed marker
              body: Write the marker so completion is visible.
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: bug
        effects:
          objects: &author_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
          worktree:
            marker.txt: |
              done
        artifacts:
          review/README.md: '# Implementation'
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: verify
            instruction: Verify the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id001
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: outcome
            instruction: Outcome the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: bug
        effects:
          objects: *author_session
        artifacts:
          review/README.md: |-
            # Outcome
            A marker was added.
    - &id003
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Assess the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - *id001
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: The checks passed. May we finish this result?
            documents: []
            presentation: result
        effects:
          objects: *checked_session
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: integrate
            instruction: Integrate the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id004
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: finish
            instruction: The requested work is complete.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id005
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - &id008
      match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: output_equals
    path: work_kind
    value: bug
  - type: cel_true
    expr: size(calls.filter(c,c.op=="merge"))==1 && outputs.merge.merged_hash!="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  - type: cel_true
    expr: calls.filter(c,c.node_path.endsWith("adaptive3-merge-receipt/check")).all(c,c.inputs.env.RECEIPT_REQUEST.contains(outputs.reviews[0].receipt.request_id)
      && !c.inputs.env.RECEIPT_REQUEST.contains("original-decision"))
- id: resume-changed-human-scope
  type: integration_case
  runtime:
    cells: *id002
  inputs:
    prompt: Stop delivery. Explain the local behavior only.
    resume_from: previous-job
  mocks:
    ops:
    - &id006
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Direction the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id007
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects: *author_session
        artifacts:
          review/README.md: |
            # Requested outcome
    - *id003
    - *id001
    - *id004
    - *id005
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
- id: unreadable-history-asks-before-any-stage
  type: integration_case
  runtime:
    cells: *id002
    responses:
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: reply
        feedback: Treat this as a fresh explanation; do not infer approval from the old job.
        attachments: []
        settings: {}
  inputs:
    prompt: Explain this project.
    resume_from: inaccessible-job
  mocks:
    ops:
    - match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: History access was denied. What work should we resume?
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - *id006
    - *id007
    - *id003
    - *id001
    - *id004
    - *id005
    - *id008
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: size(reviews)==1 && reviews[0].form.request.question.contains("History access was denied")
