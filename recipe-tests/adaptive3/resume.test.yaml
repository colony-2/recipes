      && c.inputs.inputs.prompt.contains("changes this to an explanation"))
- id: unreadable-history-asks-before-any-stage
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
    responses:
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: reply
        feedback: Treat this as a fresh explanation; do not infer approval from the old job.
        attachments: []
        settings: {}
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: continue
        feedback: ''
        attachments: []
        settings: {}
    - node_path: adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/discuss/discuss/adaptive3-discussion/ask/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
  inputs:
    prompt: Explain this project.
    resume_from: inaccessible-job
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: ask
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: direction
            summary: History access was denied. May I start a fresh explanation, or can you grant access to the
              prior job?
            title: Restore progress on direction
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: History access was denied. May I start a fresh explanation, or can you grant access to the
                  prior job?
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details: []
            status: ask
            instruction: {text: Start a fresh explanation under the current request., scope_change: false}
            action: Rerun the stated stage after correcting its local prerequisite, preserving completed effects.
            stage: direction
            summary: Start a fresh explanation with no inferred prior approval.
            title: Start a fresh explanation
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: History access was denied. May I start a fresh explanation, or can you grant access to the
                  prior job?
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: size(reviews)==3 && reviews[0].form.request.question.contains("History access was denied")
