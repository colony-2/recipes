          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: calls.exists(c,c.node_path.contains("/direction/") && c.op=="extension_execution" && c.inputs.inputs.prompt.contains("changes
      this to an explanation"))
- id: resume-publication-after-merge
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Merged project
          .c2/recipes/hooks/build/publish.yaml: |
            id: publish
            sequence:
            - id: publish
              op: command_execution
              inputs:
                run: printf published
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Published the original merged change.
              artifact_refs: {}
  inputs:
    prompt: Complete publication of the approved change.
    resume_from: previous-job
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            stage: integration
            summary: The recorded native merge completed. Only publication remains.
            publication:
              source_job: previous-job
              source_task: original-native-merge
              merged_hash: main
              target_branch: refs/heads/main
              publication_branch: refs/heads/main
              publication_disposition: merged
              candidate_sha: original-candidate
              candidate_subject: Approved local change
            title: Restore progress on integration
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The recorded native merge completed. Only publication remains.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: The original change is published.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: The original change is published.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: accepted
            summary: Publication is complete.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Publication is complete.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge" || c.op=="squash")'
  - type: cel_true
    expr: outputs.merge.merged_hash=="main"
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/publish/publish/root/publish"))
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/direction/"))'
- id: unreadable-history-asks-before-any-stage
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: A small project.
    responses:
    - node_path: adaptive3/backstop/sequence/backstop/adaptive3-backstop/ask/ask
      fields:
        decision: continue
        feedback: Treat this as a fresh explanation; do not infer approval from the old job.
    - node_path: adaptive3/direction/direction/adaptive3-lifecycle/cycle/cycle/adaptive3-cycle/review/review/adaptive3-review/ask/ask
      fields:
        decision: accept
        feedback: ''
  inputs:
    prompt: Explain this project.
    resume_from: inaccessible-job
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ask
            stage: direction
            summary: History access was denied. May I start a fresh explanation, or can you grant access to the
              prior job?
            title: Restore progress on direction
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: History access was denied. May I start a fresh explanation, or can you grant access to the
                  prior job?
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            stage: direction
            summary: Start a fresh explanation with no inferred prior approval.
            title: Start a fresh explanation
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: History access was denied. May I start a fresh explanation, or can you grant access to the
                  prior job?
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
  - type: cel_true
    expr: size(reviews)==2 && reviews[0].form.fields[0].question.contains("History access was denied")
