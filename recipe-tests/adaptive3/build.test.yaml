recipe: ../../adaptive3.yaml
cases:
- id: public-explanation
  type: integration_case
  runtime:
    cells: &id001
      root:
        files:
          README.md: A small project.
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
  inputs:
    prompt: Explain this project.
  mocks:
    ops:
    - &id002
      match: &codex
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: direction
            instruction: Direction the assigned work.
            documents: []
            presentation: question
        effects:
          objects: &checked_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - &id007
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects: &author_session
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - &id003
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: assess
            instruction: Assess the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id004
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects: *checked_session
    - &id005
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: finish
            instruction: The requested work is complete.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id006
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: '!calls.exists(c,c.op=="merge")'
- id: public-feature-native-merge
  type: integration_case
  runtime:
    cells: *id001
    responses:
