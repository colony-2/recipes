        direction: accept
        feedback: Show the marker in the final review.
        attachments: []
        settings: {}
    - node_path: adaptive3/dispatch/dispatch/adaptive3-dispatch/present/sequence/show/delegate-present/ask
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    observe_files:
    - marker.txt
  inputs:
    merge_queue: false
    prompt: Add a marker file.
  mocks:
    ops:
    - *id002
    - &id008
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects: *author_session
        artifacts:
          review/README.md: |
            # Requested outcome
    - *id003
    - *id004
    - &id009
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: preparation
            instruction: Preparation the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id010
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/one-pager.md
            work_kind: feature
            document_details:
            - document_id: review/design.md
              title: Design
              description: Review how the marker will be written.
              role: supporting
              order: 0
            - document_id: review/acceptance.md
              title: Acceptance criteria
              description: Review the expected marker contents.
              role: supporting
              order: 1
            - document_id: review/one-pager.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects: *author_session
        artifacts:
          review/one-pager.md: Add the marker. [Design](design.md) and [Acceptance criteria](acceptance.md).
          review/design.md: Write the requested marker to the repository.
          review/acceptance.md: The marker contains the requested value.
    - *id003
    - *id004
    - &id011
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: Shall we make this change?
            documents: []
            presentation: plan
        effects:
          objects: *checked_session
    - &id012
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: implement
            instruction: Finish the marker, including the final newline.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id013
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            commit:
              title: Record the completed marker
              body: |-
                Write the marker so completion is visible.
                Preserve its final newline.
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects: *author_session
          worktree:
            marker.txt: |
              done
        artifacts:
          review/README.md: '# Implementation'
    - &id014
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: verify
            instruction: Verify the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - *id004
    - &id015
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: outcome
            instruction: Outcome the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - &id016
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: feature
            document_details:
            - document_id: review/README.md
              title: Requested outcome
              description: Read the proposed result and decision.
              role: primary
              order: 10
        effects:
          objects: *author_session
        artifacts:
          review/README.md: |-
            # Outcome
            A marker was added.
    - *id003
    - *id004
    - &id017
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: present
            instruction: The checks passed. May we finish this result?
            documents: []
            presentation: result
        effects:
          objects: *checked_session
    - &id018
      match: *codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            primitive: integrate
            instruction: Integrate the assigned work.
            documents: []
            presentation: question
        effects:
          objects: *checked_session
    - *id005
    - *id006
    - &id019
      match:
        op: squash
      repeat: true
      behavior:
        mode: passthrough
    - &id020
      match:
        op: merge
      repeat: true
      behavior:
        mode: passthrough
    - &id021
      match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merge.merged_hash != ""
  - type: cel_true
    expr: repositories.root.files["marker.txt"] == "done\n"
  - type: cel_true
    expr: |
      calls.exists(c,c.op=='squash' && c.inputs.commit_message.startsWith(
        'Record the completed marker\n\nWrite the marker so completion is visible.\nPreserve its final newline.\n\nJob: https://jobs.colony2.com/') &&
