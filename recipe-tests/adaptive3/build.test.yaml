  inputs:
    prompt: Explain the project.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: fail
        error:
          message: Transient model transport error
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: resume
            summary: Retry the original explanation.
            stage: direction
            title: Restore progress on direction
            primary: null
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Retry the original explanation.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: ready
            summary: Current work is ready.
            title: Review the requested outcome
            primary: review/README.md
            work_kind: explanation
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Current work is ready.
        artifacts:
          review/README.md: |
            # Requested outcome
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            status: passed
            summary: Checked the assignment.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                label: Checked the assignment.
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.work_kind=="explanation"
