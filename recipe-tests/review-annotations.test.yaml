recipe: fixtures/review-annotations.yaml
cases:
- id: heavy-valid
  type: integration_case
  runtime:
    responses:
    - node_path: annotation-handoff/review/kernel-review/request_human_review
      fields:
        decision: accept
  inputs:
    variant: heavy
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Ready for human review.
            files:
            - path: report.md
              description: Acceptance evidence and limitations.
              title: Measured acceptance outcomes
              role: primary
              order: 0
              source_paths:
              - input.md
              - report.md
              - missing.md
            questions: []
            consultations: []
            keys: []
        artifacts:
          report.md: '# Acceptance evidence


            Mandatory check failed; retain this limitation.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: 1
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: response.fields.decision
    value: accept
  - type: cel_true
    expr: size(outputs.annotations) == 1 && outputs.annotations[0].id == "jobs/acceptance/child/report.md"
  - type: cel_true
    expr: outputs.annotations[0].lineage == ["report.md", "child/report.md", "jobs/acceptance/child/report.md"]
  - type: cel_true
    expr: outputs.annotations[0].sources[0].id == "input.md" && outputs.presentation.mode == "legacy"
  - type: cel_true
    expr: calls.exists(c, c.op == "input" && "jobs/acceptance/child/report.md" in c.inputs.form.documents && !("document_metadata"
      in c.inputs.form) && !("overview_document_id" in c.inputs.form))
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.contains("repair"))'
  - type: cel_true
    expr: calls.exists(c, c.op == "extension_execution" && "title" in c.inputs.inputs.output.schema.properties.files.items.properties
      && "source_paths" in c.inputs.inputs.output.schema.properties.files.items.properties)
