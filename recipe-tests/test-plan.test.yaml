recipe: ../recipes/develop/test-plan.yaml
cases:
- id: present
  type: integration_case
  inputs:
    prompt: Write a test plan
  runtime: {}
  mocks:
    ops:
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: plan
        artifacts:
          result.json: '{"summary": "plan outcome 1", "next": "review"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: plan
                turn: 1
          worktree:
            .c2j/test-plan.md: '# Maintained test plan

              '
    - repeat: true
      match:
        selector: git+https://github.com/colony-2/c2ops.git//rule_gate@main
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: valid
    value: true
  - type: cel_true
    expr: ("test_statements" in outputs.review_documents) == true
- id: missing
  type: integration_case
  inputs:
    prompt: Write a test plan
  runtime: {}
  mocks:
    ops:
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: plan
        artifacts:
          result.json: '{"summary": "plan outcome 1", "next": "review"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: plan
                turn: 1
    - repeat: true
      match:
        selector: git+https://github.com/colony-2/c2ops.git//rule_gate@main
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: valid
    value: false
  - type: cel_true
    expr: ("test_statements" in outputs.review_documents) == false
