recipe: ../recipes/develop/agent.yaml
cases:
- id: success
  type: integration_case
  inputs:
    prompt: Integrate child outcomes
    instructions: Coordinate approved work
    target_directory: .
    result_schema_json: '{"type": "object", "required": ["next", "summary"], "properties": {"next": {"enum": ["done",
      "ask_user"]}, "summary": {"type": "string"}}}'
  runtime:
    cells:
      root: {}
      B: {}
      C: {}
  mocks:
    ops:
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: agent
        artifacts:
          result.json: '{"summary": "agent outcome 1", "next": "ask_user"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: agent
                turn: 1
          children:
          - recipe: fixtures/dependency-success.yaml
            cell: B
          - recipe: fixtures/dependency-success.yaml
            cell: C
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: agent
        artifacts:
          result.json: '{"summary": "agent outcome 2", "next": "done"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: agent
                turn: 2
    - repeat: true
      match:
        selector: git+https://github.com/colony-2/c2ops.git//rule_gate@main
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - repeat: true
      match:
        node_path: dependency-success/evidence
        cell: B
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          evidence.txt: Dependency evidence
    - repeat: true
      match:
        node_path: dependency-success/evidence
        cell: C
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          evidence.txt: Dependency evidence
  assertions:
  - type: cel_true
    expr: size(outputs.dependencies) == 2
  - type: cel_true
    expr: outputs.valid == true
  - type: cel_true
    expr: outputs.completed == true
  - type: cel_true
    expr: outputs.dependencies.exists(k,"evidence.txt" in outputs.dependencies[k].artifacts)
  - type: cel_true
    expr: outputs.result.next == "done"
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).size() == 2
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].inputs.inputs.session
      == calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[0].outputs.session
  - type: cel_true
    expr: outputs.dependencies.all(k,calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].inputs.inputs.prompt.contains(k))
  - type: cel_true
    expr: outputs.dependencies.all(k, outputs.dependencies[k].artifacts.all(a, "dependencies/"+k+"/"+a in calls.filter(c,c.op
      == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].artifacts))
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].artifacts.all(k,!k.startsWith("dependencies/")
      || calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@"))[1].artifacts[k].contains("evidence"))
