recipe: ../build.yaml
cases:
- id: local-change-one-review
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          PURPOSE.md: Own widget documentation.
          candidate.txt: original
    observe_files:
    - candidate.txt
    responses:
    - node_path: build/run/light/light/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Correct the widget documentation.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Correct the widget documentation.
            files: []
            questions: []
            consultations: []
            keys: []
            verification_command: test "$(cat candidate.txt)" = corrected
            subject: Correct widget documentation
            review_message: Correct the documented widget behavior. Verify the updated content with an automated
              check.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          worktree:
            candidate.txt: corrected
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: process
    value: light
  - type: output_equals
    path: merged
    value: true
  - type: output_equals
    path: verification.status
    value: passed
  - type: cel_true
    expr: size(reviews) == 1
  - type: cel_true
    expr: repositories.root.new_commits == 1
  - type: cel_true
    expr: repositories.root.files["candidate.txt"] == "corrected"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))) ==
      1
  - type: cel_true
    expr: size(calls.filter(c, c.op == "squash")) == 1 && size(calls.filter(c, c.op == "rebase")) == 1 &&
      size(calls.filter(c, c.op == "merge")) == 1
  - type: cel_true
    expr: calls.filter(c, c.op == "squash")[0].inputs.commit_message.contains("https://jobs.colony2.com/")
- id: unchanged-requires-human-review
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
    cells:
      root:
        files:
          PURPOSE.md: Own widget documentation.
          candidate.txt: original
    observe_files:
    - candidate.txt
    responses:
    - node_path: build/run/light/light/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Correct the widget documentation.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: The existing documentation already satisfies the request.
            files: []
            questions: []
            consultations: []
            keys: []
            verification_command: test "$(cat candidate.txt)" = original
            subject: Correct widget documentation
            review_message: README and candidate.txt already describe the requested behavior; inspection and the
              content check confirm no repository changes are needed.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          artifact_files:
            test-statements.md: completion-review-statements.md
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: process
    value: light
  - type: output_equals
    path: merged
    value: false
  - type: output_equals
    path: disposition
    value: unchanged
  - type: cel_true
    expr: '!calls.exists(c, c.op in ["rebase", "squash", "merge"])'
  - type: cel_true
    expr: size(reviews) == 1 && "synopsis.md" in reviews[0].form.documents
  - type: cel_true
    expr: reviews[0].form.title.contains("no-change rationale")
  - type: cel_true
    expr: reviews[0].form.fields[0].question.contains("satisfied without repository changes")
  - type: cel_true
    expr: outputs.reviews.outcome != {}
  - type: cel_true
    expr: repositories.root.new_commits == 0
  - type: cel_true
    expr: outputs.verification.status == "passed"
  - type: cel_true
    expr: calls.filter(c, c.node_path.endsWith("/render_change_synopsis"))[0].inputs.env.RESPONSE.contains("already
      describe the requested behavior")
