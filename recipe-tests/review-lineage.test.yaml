recipe: fixtures/review-lineage.yaml
cases:
- id: competing-occurrences-forward
  type: integration_case
  inputs: {reverse: false}
  runtime:
    responses:
    - node_path: lineage-review/review/kernel-review/request_human_review
      fields: {decision: accept}
    cells:
      root:
        file_sources:
          recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
  mocks:
    ops:
    - repeat: true
      match: {op: command_execution}
      behavior: {mode: passthrough}
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.presentation.diagnostics.exists(n, n.contains("Ambiguous attachment lineage omitted for report"))
  - type: cel_true
    expr: calls.exists(c, c.op == "input" && "report" in c.inputs.form.documents && !("document_metadata" in
      c.inputs.form) && !("overview_document_id" in c.inputs.form))
- id: competing-occurrences-reverse
  type: integration_case
  inputs: {reverse: true}
  runtime:
    responses:
    - node_path: lineage-review/review/kernel-review/request_human_review
      fields: {decision: accept}
    cells:
      root:
        file_sources:
          recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
  mocks:
    ops:
    - repeat: true
      match: {op: command_execution}
      behavior: {mode: passthrough}
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.presentation.diagnostics.exists(n, n.contains("Ambiguous attachment lineage omitted for report"))
  - type: cel_true
    expr: calls.exists(c, c.op == "input" && "report" in c.inputs.form.documents && !("document_metadata" in
      c.inputs.form) && !("overview_document_id" in c.inputs.form))
