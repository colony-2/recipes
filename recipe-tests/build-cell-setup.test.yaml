# Real orchestration and Git; only model decisions are mocked. Requires Nix/c2ops.
# Run: c2j test run --file recipe-tests/build-cell-setup.test.yaml --case-timeout 10m
recipe: ../build.yaml
cases:
- id: missing-mandate-child-build-refresh-parent
  type: integration_case
  inputs:
    prompt: Original feature request
    target_directory: component
  runtime:
    cells:
      root:
        file_sources:
          .c2j/recipes/build.yaml: ../build.yaml
          .c2j/recipes/recipes/develop: ../recipes/develop
    responses:
    - node_path: build/develop/root/approve_plan/input
      fields:
        decision: approve
    - node_path: build/develop/root/accept/input
      fields:
        decision: satisfied
    - node_path: build/develop/root/approve_plan/input
      fields:
        decision: approve
    - node_path: build/develop/root/accept/input
      fields:
        decision: satisfied
    observe_files:
    - .c2j/mandate.md
    - component/feature.txt
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: design
        artifacts:
          result.json: '{"summary": "design outcome 1", "next": "review"}'
          design.md: '# Design 1


            Requested behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: design
                turn: 1
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: review
        artifacts:
          result.json: '{"summary": "review outcome 1", "next": "done"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: review
                turn: 1
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: plan
        artifacts:
          result.json: '{"summary": "plan outcome 1", "next": "review"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: plan
                turn: 1
          worktree:
            .c2j/test-plan.md: '# Test plan


              - Requested behavior works. Files: build.sh; critical; integration; dependencies: bash.

              - Invalid behavior is rejected. Files: build.sh; critical; integration; dependencies: bash.

              '
    - match:
