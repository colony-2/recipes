    - repeat: true
      match:
        selector: nix:github:colony-2/c2ops/published#rule_gate
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merged == true && repositories.root.new_commits == 2
  - type: cel_true
    expr: repositories.root.files[".c2j/mandate.md"].contains("identity cell")
  - type: cel_true
    expr: repositories.root.files["component/feature.txt"] == "implemented\n"
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result").size() == 1
  - type: cel_true
    expr: calls.filter(c,c.node_path == "build/setup/cell-setup/refresh/thinpackrebase").size() == 1
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result")[0].inputs.inputs.bootstrap_mandate == true
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result")[0].inputs.inputs.target_directory == "."
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result")[0].cell == "root"
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).size() == 14
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("Initialize
      this cell")
  - type: cel_true
    expr: '!calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("Original
      feature request")'
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[7].inputs.inputs.prompt.contains("Original
      feature request")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[7].worktree[".c2j/mandate.md"].contains("identity
      cell")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).all(c,c.inputs.inputs.prompt.contains("entire
      repository") && c.inputs.inputs.prompt.contains("not a file"))
  - type: cel_true
    expr: reviews.size() == 4
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).all(c,
      c.inputs.inputs.artifact_inbox_path.endsWith("/inbox") && c.inputs.inputs.artifact_outbox_path.endsWith("/outbox")
      && !c.inputs.inputs.worktree_path.endsWith("/.c2j"))
