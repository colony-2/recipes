recipe: fixtures/consultation-kernel-retry.yaml
cases:
- id: retry-preserves-budget-and-participant
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Client application
          candidate.txt: original
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
    observe_files:
    - candidate.txt
    - experiment.txt
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: continue
            thinking: 'consultant reply 1: continue'
            files: []
            assessment: not_applicable
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: continue
            thinking: 'requester reply 2: continue'
            files: []
            assessment: not_applicable
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: requester
                iteration: 2
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: error
          errorMessage: Agent returned an unsuccessful result
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 2: agreed'
            files:
            - path: iter2/consultant/spec.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter2/consultant/spec.md: '# Accepted after retry'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 2
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: first.outcome
    value: failed
  - type: output_equals
    path: first.state.iteration
    value: 1
  - type: output_equals
    path: second.outcome
    value: agreed
  - type: output_equals
    path: second.state.iteration
    value: 2
  - type: output_equals
    path: second.state.round
    value: 1
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[3].inputs.inputs.session
      == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
  - type: cel_true
    expr: outputs.second.requester_session == outputs.first.requester_session
