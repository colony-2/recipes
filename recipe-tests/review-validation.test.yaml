recipe: fixtures/review-validation.yaml
cases:
- id: production-validator-and-artifacts
  type: integration_case
  runtime:
    cells:
      root:
        file_sources:
          recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.contains("production validator and artifact checks")
