recipe: fixtures/registered-cell-publication-denied.yaml
cases:
  - id: registration-does-not-grant-child-submission
    type: integration_case
    runtime:
      cells:
        root:
          file_sources:
            .c2/recipes/initialize.yaml: ../recipes/create/initialize.yaml
        alpha: {}
        beta: {}
    mocks:
      ops:
        - match:
            node_path: registered-cell-publication-denied/run/registered-cell-publication/publish/publish-cells/publish/sequence/register_cell/register-cell/register
          behavior:
            mode: return
            outputs:
              success: true
          artifacts:
            registration.json: '{"name":"alpha","id":"fixture-registration"}'
        - match:
            op: command_execution
          behavior:
            mode: passthrough
          repeat: true
    assertions:
      - type: cel_true
        expr: calls.exists(c, c.node_path.endsWith("/register") && c.outputs.success)
      - type: cel_true
        expr: '!calls.exists(c, c.op == "squashrebasemerge")'
      - type: cel_true
        expr: repositories.root.new_commits == 0 && repositories.alpha.new_commits == 0
    expect_error: permission
