recipe: ../../build.yaml
cases:
- id: audit-and-no-change-use-normal-adaptive-flow
  type: integration_case
  runtime:
    cell: recipes
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      recipes:
        files:
          README.md: A cell for recipe improvement.
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            sequence:
            - id: check_repository_guidance
              op: command_execution
              const: true
              inputs:
                env:
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  set -eu
                  test -s guides/self-improvement/README.md
                  test -s guides/self-improvement/BACKGROUND.md
                  test -s guides/self-improvement/AUDITING.md
                  test -s guides/self-improvement/IMPROVING.md
                  test -s AGENTS.md
                  test -s guides/README.md
                  test -s guides/RECIPE_IMPROVEMENT_GUIDE.md
                  test -s .agents/skills/audit-recipe-jobs/SKILL.md
                  test -s .agents/skills/audit-recipe-jobs/agents/openai.yaml
                  cp self-improvement-statements.md "$OUTBOX/test-statements.md"
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Backgrounders are available and verification ran.
              artifact_refs: {}
        file_sources:
          guides/self-improvement/README.md: ../../guides/self-improvement/README.md
          guides/self-improvement/BACKGROUND.md: ../../guides/self-improvement/BACKGROUND.md
          guides/self-improvement/AUDITING.md: ../../guides/self-improvement/AUDITING.md
          guides/self-improvement/IMPROVING.md: ../../guides/self-improvement/IMPROVING.md
          self-improvement-statements.md: statements.md
          AGENTS.md: ../../AGENTS.md
          guides/README.md: ../../guides/README.md
          guides/RECIPE_IMPROVEMENT_GUIDE.md: ../../guides/RECIPE_IMPROVEMENT_GUIDE.md
          .agents/skills/audit-recipe-jobs/SKILL.md: ../../.agents/skills/audit-recipe-jobs/SKILL.md
          .agents/skills/audit-recipe-jobs/agents/openai.yaml:
            ../../.agents/skills/audit-recipe-jobs/agents/openai.yaml
    responses:
    - node_path:
        build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - node_path:
        build/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: "Use $audit-recipe-jobs to audit job behavior and implement justified recipe improvements.\n\n\
      JobDB: http://audit.invalid/c2\nScope: Jobs created from 2026-11-07T00:00:00Z to 2026-11-08T00:00:00Z;
      include failed and successful jobs.\nConstraints: Preserve 100% of accepted scope.\nDo not modify audited
      jobs.\nInspect review questions and child recovery."
    title: Recipe improvement fixture
    documents:
      previous-audit.md:
        kind: value
        name: previous-audit.md
        format: text
        value: 'Prior cohort: repeated requests for retained inputs.'
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: oversight
            summary: Agree on the requested outcome before implementation.
            files:
            - path: one-pager.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for recipes oversight: preserve the requested behavior'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions:
            review_title: 'Approve 1p for recipes oversight: preserve the requested behavior'
            requests:
            packages:
        artifacts:
          one-pager.md: "# Preserve the requested behavior\n\n## Problem Description\nThe requested outcome
            needs verification.\n\n## Non Goals\nUnrelated changes.\n\n## What we are planning to do\nImplement
            the request and verify its acceptance checks.\n\n## Compat/Upgrade\nKeep existing interfaces.\n\
            \n## Key challenges/design questions & answers\n| Question | Answer |\n| --- | --- |\n| What proves
            completion? | The approved test statements. |\n"
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Audit complete; no new recipe change justified.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths:
            - path: audit.md
              description: audit.md
              title: audit.md
              role: supporting
              order: 2
              source_paths:
            - path: inventory.md
              description: inventory.md
              title: inventory.md
              role: supporting
              order: 2
              source_paths:
            - path: improvement-plan.md
              description: improvement-plan.md
              title: improvement-plan.md
              role: supporting
              order: 2
              source_paths:
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior
            remains available."
          handoff.md: |
            # Execution handoff
            Read audit.md and improvement-plan.md. Validate the no-change conclusion and prepare the normal outcome review.
          audit.md: |
            # Audit
            Two fixture jobs inspected: one completed, one bounded failure. No new local defect found.
          inventory.md: |
            # Inventory
            fixture-completed: completed; fixture-failed: failed; recipe version recorded.
          improvement-plan.md: |
            # Improvement plan
            No code change justified; retain the audit and observe the next cohort.
          scratch-not-selected.txt: Unrelated downloaded history must stay on its producing task.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Audit complete; no new recipe change justified.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            - path: audit.md
              description: audit.md
              title: audit.md
              role: supporting
              order: 2
              source_paths:
            - path: inventory.md
              description: inventory.md
              title: inventory.md
              role: supporting
              order: 2
              source_paths:
            - path: improvement-plan.md
              description: improvement-plan.md
              title: improvement-plan.md
              role: supporting
              order: 2
              source_paths:
            questions: []
        artifacts:
          implementation.md: |
            # Implementation versus plan
            The audit found no new local defect. No code changes; limitations and next-cohort expectations retained.
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
          audit.md: |
            # Audit
            Two fixture jobs inspected: one completed, one bounded failure. No new local defect found.
          inventory.md: |
            # Inventory
            fixture-completed: completed; fixture-failed: failed; recipe version recorded.
          improvement-plan.md: |
            # Improvement plan
            No code change justified; retain the audit and observe the next cohort.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.disposition == "unchanged" && !outputs.merged && size(reviews) == 2
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))) ==
      5
  - type: cel_true
    expr: calls.all(c,c.cell == "recipes")
  - type: cel_true
    expr: '!calls.exists(c,c.op == "recipes.run" || c.node_path.contains("/assignment/"))'
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].node_path.endsWith("/start_read_only_session") &&
      calls.filter(c,c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[2].node_path.endsWith("/start_implementation_session")
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/check_repository_guidance"))
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("http://audit.invalid/c2")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("Jobs created from
      2026-11-07T00:00:00Z to 2026-11-08T00:00:00Z; include failed and successful jobs.")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("Preserve 100% of accepted
      scope.\nDo not modify audited jobs.")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("Inspect review questions
      and child recovery.")
  - type: cel_true
    expr: '"previous-audit.md" in calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].artifacts'
  - type: cel_true
    expr: '"audit.md" in calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].artifacts
      && "improvement-plan.md" in calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].artifacts
      && !("scratch-not-selected.txt" in calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].artifacts)'
  - type: cel_true
    expr: '"audit.md" in outputs.artifact_refs && "improvement-plan.md" in outputs.artifact_refs'
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("one-pager.md")
  - type: cel_true
    expr: size(calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#jev"))) == 0
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("$audit-recipe-jobs")
