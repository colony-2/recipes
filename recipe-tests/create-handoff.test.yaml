recipe: fixtures/create-handoff.yaml
cases:
  - id: creation-resumes-consultant-and-publishes-independent-history
    type: integration_case
    runtime:
      cells:
        root:
          files:
            PURPOSE.md: Project root
            keep.txt: original
          file_sources:
            .c2/recipes/initialize.yaml: ../recipes/create/initialize.yaml
            recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
        alpha: {}
        beta: {}
      responses:
        - node_path: create-handoff/create/root/root/review/review/creation-review/review/sequence/review/kernel-review/request_human_review
          fields:
            decision: approve
    mocks:
      ops:
        - match:
            node_path: create-handoff/create/root/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
          repeat: true
          behavior:
            mode: return
            outputs:
              success: true
            artifacts:
              registration.json: '{"id":"pre-registered-fixture"}'
        - match:
            node_path: create-handoff/starter
          behavior:
            mode: return
            outputs:
              success: true
            artifacts:
              conversation.json: '{"outcome":"agreed","thinking":"Approved root eligibility consultation"}'
              notes.md: Keep the original creation request and reviewed purposes.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    phase: root-consultant
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            artifacts:
              proposal.md: |-
                # Proposed cells
                Project fit, excluded alternatives, technology guidance and repository identities.
              cells/alpha/PURPOSE.md: |
                # alpha
                Approved responsibilities.
              cells/beta/PURPOSE.md: |
                # beta
                Approved responsibilities.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    phase: creation-review
            fixture_refs:
              alpha_repo:
                cell: alpha
                field: repo
              beta_repo:
                cell: beta
                field: repo
            outputs_fixture_expr: '{"status": "completed", "output_schema_valid": true, "response": {"outcome": "review", "summary": "Creation proposal", "cells": [{"name": "alpha", "repo": alpha_repo, "purpose_path": "cells/alpha/PURPOSE.md"}, {"name": "beta", "repo": beta_repo, "purpose_path": "cells/beta/PURPOSE.md"}], "files": [{"path": "proposal.md", "description": "Review document"}, {"path": "cells/alpha/PURPOSE.md", "description": "Review document"}, {"path": "cells/beta/PURPOSE.md", "description": "Review document"}], "questions": []}}'
        - repeat: true
          match:
            op: command_execution
          behavior:
            mode: passthrough
        - match:
            selector: ./recipes/kernel/render
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.result.disposition == "created"
      - type: cel_true
        expr: size(calls.filter(c, c.op == "squashrebasemerge")) == 2 && size(calls.filter(c, c.op == "merge")) == 0 && size(calls.filter(c, c.op == "squash")) == 0 && !calls.exists(c, c.op == "rebase")
      - type: cel_true
        expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.session == calls.filter(c, c.node_path == "create-handoff/starter")[0].outputs.session
      - type: cel_true
        expr: '!("instructions" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs)'
      - type: cel_true
        expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].artifacts["consultation/conversation.json"].contains("root eligibility")
      - type: cel_true
        expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("cell creation decision")
      - type: cel_true
        expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("This cell encompasses")'
      - type: cel_true
        expr: outputs.result.merged && outputs.result.merged_hash == "" && outputs.result.error == "" && size(outputs.result.created_cells) == 2 && size(outputs.result.initializations) == 2
      - type: cel_true
        expr: outputs.result.session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
      - type: cel_true
        expr: outputs.result.review.request_id != "" && outputs.result.review.actor.id == "recipe-test"
      - type: cel_true
        expr: '"proposal.md" in outputs.result.artifact_refs && "created.json" in outputs.result.artifact_refs && "initializations.json" in outputs.result.artifact_refs && "consultation/conversation.json" in outputs.result.artifact_refs'
      - type: cel_true
        expr: outputs.result.annotations.exists(a, a.id == "incoming-notes" && a.descriptor.title == "Original creation guidance" && a.ref.stored.key == outputs.result.artifact_refs["consultation/notes.md"].stored.key) && outputs.result.annotations.exists(a, a.id == "proposal.md" && a.ref == outputs.result.artifact_refs["proposal.md"])
