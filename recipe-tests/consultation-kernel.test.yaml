  assertions:
  - type: output_equals
    path: outcome
    value: agreed
  - type: cel_true
    expr: '!calls.exists(c, c.op.startsWith("recipe.run") || c.op == "squashrebasemerge")'
  - type: output_equals
    path: state.iteration
    value: 2
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.session
      == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
  - type: cel_true
    expr: outputs.requester_session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].outputs.session
  - type: cel_true
    expr: outputs.consultant_session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].outputs.session
  - type: cel_true
    expr: '!("instructions" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs)'
  - type: cel_true
    expr: '"instructions" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs'
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].artifacts["iter1/consultant/feature-spec.md"]
      == "# Proposed feature"
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].artifacts["iter2/requester/test-statements.md"]
      == "# Acceptance outcomes"
