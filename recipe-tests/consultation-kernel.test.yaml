recipe: ../recipes/kernel/consultation.yaml
cases:
- id: first-response-agreement
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Client application
          candidate.txt: original
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
    observe_files:
    - candidate.txt
    - experiment.txt
  inputs:
    thread: validation-api
    request: Provide a compatible validation API.
    consultant_cell: B
    consultant_role: Own the serving API; assess scope and compatibility.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 1: agreed'
            files:
            - path: iter1/consultant/feature-spec.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter1/consultant/feature-spec.md: '# Accepted feature'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: outcome
    value: agreed
  - type: cel_true
    expr: '!calls.exists(c, c.op.startsWith("recipe.run") || c.op == "squashrebasemerge")'
  - type: output_equals
    path: state.iteration
    value: 1
  - type: cel_true
    expr: outputs.consultant_session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
  - type: cel_true
    expr: outputs.requester_session == outputs.requester_start_session
  - type: cel_true
    expr: '"iter1/consultant/feature-spec.md" in outputs.final_artifacts'
  - type: cel_true
    expr: '!calls.exists(c, c.op == "extension_execution" && c.inputs.selector.contains("rule_gate"))'
