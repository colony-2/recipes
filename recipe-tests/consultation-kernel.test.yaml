    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("Consultant
      assignment:")'
  - type: cel_true
    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.prompt.contains("Purpose:")'
  - type: cel_true
    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.prompt.contains("iter1/consultant/feature-spec.md")'
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.prompt.contains("iter2/requester/test-statements.md")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].artifacts["iter1/consultant/feature-spec.md"]
      == "# Proposed feature"
