recipe: ../recipes/kernel/consultation.yaml
cases:
- id: consultation-propagates-failure
  type: recipe_case
  options:
    validation_mode: path_only
  inputs:
    thread: failure-probe
    request: Assess this candidate.
    consultant_role: Assess the current candidate.
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: fail
        error:
          message: Assessment transport unavailable
  assertions:
  - type: cel_true
    expr: '!calls.exists(c, c.op == "command_execution")'
  expect_error: Assessment transport unavailable
