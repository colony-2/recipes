recipe: fixtures/build-failure.yaml
cases:
- id: build-agent-error-keeps-origin
  type: integration_case
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: fail
        error:
          message: Agent transport unavailable
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: propagated
    value: true
  - type: output_equals
    path: failure.message
    value: Agent transport unavailable
  - type: cel_true
    expr: outputs.failure.node.path.contains("kernel-agent-turn/start_read_only_session/")
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.contains("/failed/") || c.node_path.contains("/rejected/"))'
  runtime: {}
- id: invalid-directory-reports-reason
  type: integration_case
  runtime: {}
  inputs:
    target_directory: ../outside
  mocks:
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: propagated
    value: true
  - type: output_equals
    path: failure.code
    value: BUILD_REJECTED
  - type: output_equals
    path: failure.message
    value: Target directory must be a nonempty repository-relative path without parent traversal.
  - type: cel_true
    expr: '!calls.exists(c, c.op == "extension_execution" || c.op in ["squashrebasemerge", "squash", "merge"])'
- id: assessment-error-keeps-origin
  type: integration_case
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: design ready
            files:
            - path: design.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          design.md: '# Review evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: 0
    - match:
        op: extension_execution
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: test-plan ready
            files:
            - path: test-statements.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          test-statements.md: '# Review evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: 1
    - match:
        op: extension_execution
      behavior:
        mode: fail
        error:
          message: Agent transport unavailable
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: propagated
    value: true
  - type: output_equals
    path: failure.message
    value: Agent transport unavailable
  - type: cel_true
    expr: outputs.failure.node.path.contains("/assessment/") &&
      outputs.failure.node.path.contains("kernel-agent-turn/start_read_only_session/")
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.contains("/failed/") || c.node_path.contains("/rejected/"))'
  runtime: {}
- id: returned-failure-reports-agent-message
  type: integration_case
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: return
        outputs:
          status: failed
          errorMessage: Agent stopped before completing the request.
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: failure.code
    value: BUILD_REJECTED
  - type: cel_true
    expr: outputs.failure.message.contains("Agent stopped before completing the request.") &&
      !outputs.failure.message.contains("exit status 1")
  - type: cel_true
    expr: '!calls.exists(c, c.op in ["squashrebasemerge", "squash", "merge"])'
  runtime: {}
- id: completed-agent-result-keeps-normal-routing
  type: integration_case
  mocks:
    ops:
    - match:
        op: extension_execution
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: outside
            summary: Request belongs to another cell.
            files: []
            questions: []
            consultations: []
            keys: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: 0
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: propagated
    value: false
  - type: output_equals
    path: build.disposition
    value: outside
  - type: cel_true
    expr: '!calls.exists(c, c.op in ["squashrebasemerge", "squash", "merge"] || c.node_path.contains("/rejected/"))'
  runtime: {}
