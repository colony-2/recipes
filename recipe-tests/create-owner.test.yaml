recipe: ../create.yaml
cases:
- id: foreign-job-cannot-create-through-root-workspace
  type: integration_case
  inputs:
    prompt: Attempt cell creation from a non-root job.
  runtime:
    cell: app
    cells:
      app: {}
      root: {}
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
  expect_error: command execution failed
  assertions:
  - type: cel_true
    expr: size(calls) == 1 && calls[0].cell == 'root' && calls[0].inputs.env.OWNER == 'app'
  - type: cel_true
    expr: '!calls.exists(c, c.op == "recipes.run" || c.op == "input")'
