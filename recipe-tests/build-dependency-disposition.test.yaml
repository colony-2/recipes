recipe: ../build.yaml
cases:
- id: heavy-accepts-successful-unmerged-child
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
      codex_api_key: synthetic-build-credential
    config:
      codex_api_base_url: https://fixture.invalid/v1
    cells:
      root:
        files:
          candidate.txt: original
        file_sources:
          .c2/recipes: ../recipes/kernel
          .c2/recipes/dependency.yaml: fixtures/light-dependency.yaml
      B:
        files:
          PURPOSE.md: Own API docs.
    observe_files:
    - candidate.txt
    - unapproved.txt
    responses:
    - node_path: build/run/heavy/heavy/develop/approval/sequence/plan_review/kernel-review/request_human_review
      fields:
        decision: approve
    - node_path: build/run/heavy/heavy/develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Improve the requested behavior.
    consultation_recipe: consultation
    build_recipe: dependency
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.99
    - repeat: true
      match:
        node_path: build/run/heavy/heavy/develop/accounting/sequence/review/build-merge-review/reviewer/kernel-agent-turn/start_read_only_session/start_read_only_session
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            subject: Improve requested behavior with verified coverage
            review_message: Implement the approved behavior and verify it with build.sh. Independent assessment
              and file accounting found the changes appropriate.
            files:
            - path: build.sh
              change: A
              reason: Exercise the approved behavior with an automated check.
            - path: candidate.txt
              change: M
              reason: Implement the approved behavior in this file.
    - match:
        node_path: consultation/report/report/consultation-report/summarize/summarize/kernel-agent-turn/start_read_only_session/start_read_only_session
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Agreed API documentation request.
            final_paths: []
            questions: []
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: serving
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: The documentation request fits this cell.
            assessment: not_applicable
            files:
            - path: iter1/consultant/spec.md
              description: Agreed scope
        artifacts:
          iter1/consultant/spec.md: '# Agreed documentation update'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: serving
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: consult
            summary: design response
            files: []
            questions: []
            consultations:
            - key: api
              kind: feature
              cell: B
              ref: main
              request: Update API docs.
              role: Agree the bounded documentation update.
            keys: []
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: design
                turn: 1review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: blocked
            summary: design response
            files: []
            questions: []
            consultations: &id001 []
            keys:
            - api
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: design
                turn: 1review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: design response
            files:
            - path: design.md
              description: Review evidence
            questions: []
            consultations: []
            keys:
            - api
        artifacts:
          design.md: '# design evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: design
                turn: 1review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: test-plan response
            files:
            - path: test-statements.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: test-plan
                turn: 1review
          artifact_files:
            test-statements.md: build-kernel-statements.md
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Independent plan assessment
            assessment: pass
            files:
            - path: iter1/consultant/plan-review.md
              description: Review evidence
        artifacts:
          iter1/consultant/plan-review.md: '# Independent findings'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                expert: plan
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: submit
            summary: implement response
            files: []
            questions: []
            consultations: *id001
            keys:
            - api
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: implement
                turn: 1review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: implement response
            files:
            - path: implementation.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          implementation.md: '# implement evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: implement
                turn: 1review
          worktree:
            candidate.txt: implemented behavior
            build.sh: '#!/bin/sh

              test "$(cat candidate.txt)" = "implemented behavior"

              '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: implement response
            files:
            - path: implementation.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          implementation.md: '# implement evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: implement
                turn: 1review
          worktree:
            candidate.txt: implemented behavior
            build.sh: '#!/bin/sh

              test "$(cat candidate.txt)" = "implemented behavior"

              '
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Independent outcome assessment
            assessment: pass
            files:
            - path: iter1/consultant/outcome-review.md
              description: Review evidence
        artifacts:
          iter1/consultant/outcome-review.md: '# Independent findings'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                expert: outcome
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: merged
    value: true
  - type: output_equals
    path: process
    value: heavy
  - type: cel_true
    expr: outputs.dependencies.api.status == "completed"
  - type: cel_true
    expr: outputs.dependencies.api.result.disposition == "unchanged" && !outputs.dependencies.api.result.merged
  - type: cel_true
    expr: size(reviews) == 2
  - type: cel_true
    expr: size(calls.filter(c, c.op == "recipes.run")) == 2
