recipe: fixtures/review-annotation-overflow.yaml
cases:
- id: presentation-budget-preserves-evidence
  type: integration_case
  runtime:
    responses:
    - node_path: annotation-overflow/review/kernel-review/request_human_review
      fields:
        decision: revise
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: response.fields.decision
    value: revise
  - type: cel_true
    expr: calls.exists(c, c.op == "input" && size(c.inputs.form.documents) == 202)
  - type: cel_true
    expr: outputs.presentation.diagnostics.exists(n, n.contains("more than 128 sources"))
  - type: cel_true
    expr: outputs.presentation.diagnostics.exists(n, n.contains("Presentation budget"))
  - type: cel_true
    expr: outputs.presentation.association_count == 200
