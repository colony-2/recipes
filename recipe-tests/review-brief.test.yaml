recipe: fixtures/review-brief.yaml
cases:
- id: material-limits
  type: integration_case
  runtime:
    responses:
    - node_path: review-brief-fixture/review/kernel-review/request_human_review
      fields:
        decision: approve
  inputs:
    evidence: |-
      Use two modes.

      Postgres is unverified; purge remains unsupported.
    context_json: '{"phase": "design", "plan_keys": [], "approved": []}'
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: changed
    value: false
  - type: output_equals
    path: decision
    value: approve
  - type: cel_true
    expr: '!calls.exists(c, c.op == "extension_execution")'
  - type: cel_true
    expr: calls.exists(c, c.op == "input" && !("context.json" in c.inputs.form.documents) && "design.md" in c.inputs.form.documents)
  - type: cel_true
    expr: outputs.checked.contains("Postgres is unverified") && outputs.checked.contains("purge remains unsupported")
