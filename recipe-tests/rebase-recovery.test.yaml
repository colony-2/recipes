recipe: fixtures/merge-chase.yaml
cases:
- id: light-rebase-repair-agent-fails
  type: integration_case
  inputs:
    advances: 1
    fail_after_rebase: false
    conflict: true
  runtime:
    secrets:
      jev_api_key: synthetic-jev
      codex_api_key: synthetic-codex
    cells:
      root:
        files:
          PURPOSE.md: Own widget behavior.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: "id: concurrent-writer-verify\nsequence:\n- id: checks\n  op: command_execution\n\
            \  const: true\n  inputs:\n    run: |\n      if bash ./build.sh; then printf passed; else printf failed;\
            \ fi\noutputs:\n  api_version: c2.build-hook/v1\n  status: \"${{ sequence.checks.outputs.stdout.endsWith('passed')\
            \ ? 'passed' : 'failed' }}\"\n  summary: Concurrent-writer verification completed.\n  artifact_refs:\
            \ {}\n"
    observe_files:
    - candidate.txt
    - upstream.txt
    - repair.txt
    responses:
    - node_path: merge-chase/build/root/run/light/light/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Correct widget behavior.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget behavior
            review_message: The corrected behavior passes repository verification.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          worktree:
            candidate.txt: corrected
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: fail
        error:
          message: Conflict repair agent failed
  assertions:
  - type: cel_true
    expr: outputs.failed && outputs.failure.message.contains("Conflict repair agent failed")
  - type: cel_true
    expr: size(calls.filter(c, c.op == "merge")) == 1 && size(calls.filter(c, c.op == "rebase")) == 2
  - type: cel_true
    expr: calls.exists(c, ("rebase-repair-1/failure.json" in c.artifacts) && c.artifacts["rebase-repair-1/failure.json"].contains('"code":"REBASE_CONFLICT"')
      && ("rebase-repair-1/_c2j/rebase/replayed-commit.patch" in c.artifacts))
