recipe: fixtures/creation-coordination.yaml
cases:
  - id: adaptive-creation-continues-to-serving-cell
    type: integration_case
    inputs:
      version: adaptive
    runtime:
      cells:
        root:
          file_sources:
            .c2/create-result.yaml: fixtures/creation-result.yaml
            .c2/serving.yaml: fixtures/serving-after-creation.yaml
        alpha:
          files:
            PURPOSE.md: Reviewed alpha responsibility
    mocks:
      ops:
        - match:
            op: command_execution
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.result.valid && size(outputs.result.records) == 2
      - type: cel_true
        expr: outputs.result.records[0].action == "create" && outputs.result.records[0].ready && outputs.result.records[0].request.request == "Create alpha as approved."
      - type: cel_true
        expr: outputs.result.records[0].result.result.outputs.merged && outputs.result.records[0].result.result.outputs.merged_hash == "" && outputs.result.records[0].result.result.outputs.review.request_id == "approved-creation-review"
      - type: cel_true
        expr: outputs.result.records[1].action == "consult" && outputs.result.records[1].target.cell == "alpha" && outputs.result.records[1].target.ref == "main" && outputs.result.records[1].target.revision == outputs.result.records[0].result.result.outputs.created_cells[0].revision
      - type: cel_true
        expr: '!calls.exists(c, c.op == "thinpackrebase" || c.op == "merge" || c.op == "squash")'
      - type: cel_true
        expr: calls.filter(c, c.op == "recipes.run").size() == 2 && calls.filter(c, c.op == "recipes.run")[1].inputs.recipes[0].inputs.consultant_cell == "alpha"
      - type: cel_true
        expr: outputs.result.documents.exists(k, k.endsWith("proposal.md"))
  - id: adaptive2-creation-continues-to-serving-cell
    type: integration_case
    inputs:
      version: adaptive2
    runtime:
      cells:
        root:
          file_sources:
            .c2/create-result.yaml: fixtures/creation-result.yaml
            .c2/serving.yaml: fixtures/serving-after-creation.yaml
        alpha:
          files:
            PURPOSE.md: Reviewed alpha responsibility
    mocks:
      ops:
        - match:
            op: command_execution
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.result.valid && size(outputs.result.records) == 2
      - type: cel_true
        expr: outputs.result.records[0].action == "create" && outputs.result.records[0].ready && outputs.result.records[0].request.request == "Create alpha as approved."
      - type: cel_true
        expr: outputs.result.records[0].result.result.outputs.merged && outputs.result.records[0].result.result.outputs.merged_hash == "" && outputs.result.records[0].result.result.outputs.review.request_id == "approved-creation-review"
      - type: cel_true
        expr: outputs.result.records[1].action == "consult" && outputs.result.records[1].target.cell == "alpha" && outputs.result.records[1].target.ref == "main" && outputs.result.records[1].target.revision == outputs.result.records[0].result.result.outputs.created_cells[0].revision
      - type: cel_true
        expr: '!calls.exists(c, c.op == "thinpackrebase" || c.op == "merge" || c.op == "squash")'
      - type: cel_true
        expr: calls.filter(c, c.op == "recipes.run").size() == 2 && calls.filter(c, c.op == "recipes.run")[1].inputs.recipes[0].inputs.consultant_cell == "alpha"
      - type: cel_true
        expr: outputs.result.documents.exists(k, k.endsWith("proposal.md"))
