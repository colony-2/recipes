recipe: forms.yaml
cases:
- id: clean-approval
  type: integration_case
  runtime:
    responses:
    - node_path: generated-review/contribute
      response:
        direction: accept
        feedback: ''
        attachments: []
        settings: {}
    cells:
      root:
        file_sources:
          recipes/review-v2/op.yaml: ../../recipes/review-v2/op.yaml
          recipes/review-v2.py: ../../recipes/review-v2.py
  inputs:
    request:
      title: Keep saved drafts
      question: Approve the direction?
      documents: {}
      directions:
      - id: accept
        label: Approve direction
        feedback_mode: forbidden
        allow_attachments: false
        continues_review: false
      - id: question
        label: Ask a question
        feedback_mode: required
        allow_attachments: true
        continues_review: true
      feedback:
        label: Question or requested change
      conversation: []
      settings:
      - id: unfamiliar
        control: text
        label: Fixture phrase
        value: saved
        default: null
        reset_label: Use fixture default
        schema:
          type:
          - string
          - 'null'
          minLength: 1
        applies_to:
        - question
        effect: Changes the fixture output phrase.
  assertions:
  - type: output_equals
    path: native.response.direction
    value: accept
  - type: cel_true
    expr: size(reviews)==1 && reviews[0].form.presentation.type=="review/v2" && !has(reviews[0].form.kind)
      && !has(reviews[0].form.fields)
  - type: cel_true
    expr: outputs.native.receipt.request_id==reviews[0].request_id
  mocks:
    ops:
    - match:
        selector: ./recipes/review-v2
      repeat: true
      behavior:
        mode: passthrough
