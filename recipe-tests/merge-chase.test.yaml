recipe: fixtures/merge-chase.yaml
cases:
- id: light-0-advances
  type: integration_case
  inputs:
    advances: 0
    fail_after_rebase: false
  runtime:
    secrets:
      jev_api_key: synthetic-jev
      codex_api_key: synthetic-codex
    cells:
      root:
        files:
          PURPOSE.md: Own widget behavior.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: |
            id: concurrent-writer-verify
            sequence:
            - id: checks
              op: command_execution
              const: true
              inputs:
                run: |
                  if bash ./build.sh; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: "${{ sequence.checks.outputs.stdout.endsWith('passed') ? 'passed' : 'failed' }}"
              summary: Concurrent-writer verification completed.
              artifact_refs: {}
    observe_files:
    - candidate.txt
    - upstream.txt
    - repair.txt
    responses:
    - node_path:
        merge-chase/build/root/run/light/light/light-develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  mocks:
    ops:
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy:
              type: noul
              noul: 0.01
    - &id002
      match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Correct widget behavior.
            files: []
            questions: []
            consultations: []
            keys: []
            subject: Correct widget behavior
            review_message: The corrected behavior passes repository verification.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: light
          worktree:
            candidate.txt: corrected
    - &id003
      repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.failed == false
  - type: cel_true
    expr: outputs.build.merged
  - type: cel_true
    expr: repositories.root.files["candidate.txt"] == "corrected"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "merge")) == 1
  - type: cel_true
    expr: size(calls.filter(c, c.op == "rebase")) == 1
  - type: cel_true
    expr: size(calls.filter(c,
      c.node_path.endsWith("/development-verify/check/build-hook-verify/check_hook_candidate"))) == 1
  - type: cel_true
    expr: size(reviews) == 1
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.contains("/failed/") || c.node_path.contains("/reject_invalid_build_request/"))'
