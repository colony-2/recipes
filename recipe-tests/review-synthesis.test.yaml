recipe: fixtures/review-synthesis.yaml
cases:
- id: valid
  type: integration_case
  runtime:
    cells:
      root:
        file_sources:
          recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - match:
        selector: nix:github:colony-2/c2ops/published#llm
      behavior:
        mode: return
        outputs:
          response:
            decision_context:
            - text: Concise reviews are proposed.
              sources:
              - design.md
              facts:
              - fact-1
            changes: []
            risks: []
            evidence_limits: []
            consultation_outcomes: []
            source_document_ids:
            - design.md
          model: configured-test-model
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("load_retry_bundle"))'
  - type: output_equals
    path: result.attempts
    value: 1
  - type: output_equals
    path: result.valid
    value: true
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#llm")).size() == 1
  - type: output_equals
    path: mode
    value: synthesis
