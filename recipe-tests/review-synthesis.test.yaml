recipe: fixtures/review-synthesis.yaml
cases:
- id: valid
  type: integration_case
  runtime: {}
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - match:
        selector: nix:github:colony-2/c2ops/published#llm
      behavior:
        mode: return
        outputs:
          response:
            decision_context:
            - text: Concise reviews are proposed.
              sources:
              - design.md
              facts:
              - fact-1
            changes: []
            risks: []
            evidence_limits: []
            consultation_outcomes: []
            source_document_ids:
            - design.md
          model: configured-test-model
  assertions:
  - type: output_equals
    path: result.attempts
    value: 1
  - type: output_equals
    path: result.valid
    value: true
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution").size() == 1
