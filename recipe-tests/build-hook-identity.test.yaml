recipe: fixtures/build-hook-identity.yaml
cases:
- id: include-outside-hooks-invalidates-review
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence:
            - id: checks
              include: ../../../../checks.yaml
          checks.yaml: |
            id: checks
            sequence: []
  inputs:
    command: 'printf "\n# Changed checks\n" >> checks.yaml'
  mocks:
    ops:
    - repeat: true
      match: {op: command_execution}
      behavior: {mode: passthrough}
  assertions:
  - type: output_equals
    path: changed
    value: true
- id: absent-hooks-ignore-unrelated-change
  type: integration_case
  runtime: {}
  inputs:
    command: 'printf changed > unrelated.txt'
  mocks:
    ops:
    - repeat: true
      match: {op: command_execution}
      behavior: {mode: passthrough}
  assertions:
  - type: output_equals
    path: changed
    value: false
- id: external-selector-invalidates-on-new-candidate
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: verify
            sequence:
            - id: checks
              op: nix:github:colony-2/c2ops/published#gha
  inputs:
    command: 'printf changed > unrelated.txt'
  mocks:
    ops:
    - repeat: true
      match: {op: command_execution}
      behavior: {mode: passthrough}
  assertions:
  - type: output_equals
    path: changed
    value: true
