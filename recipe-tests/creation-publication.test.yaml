- id: catalog-advancement-propagates-without-rebase
  type: integration_case
  inputs:
    prompt: Create the approved cells.
    advance_catalog: true
    capture_failure: true
  runtime: *creation_runtime
  mocks:
    ops:
    - match:
        node_path:
          create-main/run/create/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
      repeat: true
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          registration.json: '{"id":"pre-registered-fixture"}'
    - *proposal
    - *registration
    - *commands
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.failed && outputs.failure.code == "MERGE_UPSTREAM_ADVANCED"
  - type: cel_true
    expr: outputs.failure.node.op == "merge" && outputs.failure.node.id == "merge_cell_catalog"
  - type: cel_true
    expr: outputs.failure.attrs.phase == "push" &&
      outputs.failure.attrs.push_error.contains("fixture-catalog-advanced")
  - type: cel_true
    expr: '!calls.exists(c, (c.op == "rebase" || (c.op == "squashrebasemerge" && c.cell == "root"))) && size(calls.filter(c,
      c.op == "merge" && c.cell == "root")) == 1'
  - type: cel_true
    expr: size(calls.filter(c, c.op == "recipes.run")) == 2 && size(reviews) == 1
  - type: cel_true
    expr: repositories.root.new_commits == 1 && !(".c2/config.yaml" in repositories.root.files)
  - type: cel_true
    expr: calls.exists(c, c.op == "squashrebasemerge" && c.cell == "alpha" && "outputs" in c &&
      size(c.outputs.merged_hash) == 40) && calls.exists(c, c.op == "squashrebasemerge" && c.cell == "beta" &&
      "outputs" in c && size(c.outputs.merged_hash) == 40)
