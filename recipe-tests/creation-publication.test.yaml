# Seeded cells are already registered by c2j test. Mock only that command here;
# cell-registration.test.yaml covers native registration and rejection.
# Publication cases also need generated repository identities in mock proposals:
# see ../guides/FEATURE_REQUEST_C2J_RUNTIME_FIXTURE_REFERENCES.md. Keep them enabled.
# Real child jobs and Git pushes; only model decisions and targeted routing errors are mocked.
recipe: fixtures/create-main.yaml
cases:
- id: initial-push-rejection-fails-creation
  type: integration_case
  inputs:
    prompt: Create the approved cells.
    reject_publication: alpha
  runtime: &creation_runtime
    cells:
      root:
        files:
          PURPOSE.md: Project root
          keep.txt: original
        file_sources:
          .c2/recipes/initialize.yaml: ../recipes/create/initialize.yaml
          recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
      alpha: {}
      beta: {}
    responses:
    - node_path:
        create-main/run/create/root/review/review/creation-review/review/sequence/review/kernel-review/request_human_review
      fields:
        decision: approve
  mocks:
    ops:
    - match:
        node_path:
          create-main/run/create/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
      repeat: true
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          registration.json: '{"id":"pre-registered-fixture"}'
    - &proposal
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: review
            summary: Creation proposal
            cells:
            - name: alpha
              repo: alpha
              purpose_path: cells/alpha/PURPOSE.md
            - name: beta
              repo: beta
              purpose_path: cells/beta/PURPOSE.md
            files:
            - path: proposal.md
              description: Review document
            - path: cells/alpha/PURPOSE.md
              description: Review document
            - path: cells/beta/PURPOSE.md
              description: Review document
            - path: root-config.yaml
              description: Exact approved root configuration
            questions: []
        artifacts:
          proposal.md: |-
            # Proposed cells
            Project fit, excluded alternatives, technology guidance and root catalog entries.
          cells/alpha/PURPOSE.md: |
            # alpha
            Approved responsibilities.
          cells/beta/PURPOSE.md: |
            # beta
            Approved responsibilities.
          root-config.yaml: |
            dependents:
              - repo: alpha
                ref: main
              - repo: beta
                ref: main
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: creation-review
    - &commands
      repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: repositories.root.new_commits == 0
  - type: cel_true
    expr: '!calls.exists(c, (c.op == "rebase" || (c.op == "squashrebasemerge" && c.cell == "root")))'
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.contains("/apply_catalog/") || (c.op == "merge" && c.cell == "root"))'
  - type: cel_true
    expr: size(calls.filter(c, c.op == "recipes.run")) == 1
  - type: cel_true
    expr: repositories.alpha.new_commits == 0 && repositories.beta.new_commits == 0
  - type: cel_true
    expr: calls.exists(c, c.node_path.endsWith("record_pending/creation-publication-record/record") &&
      c.outputs.success && c.artifacts["initializations.json"].contains("job_id") &&
      c.artifacts["initializations.json"].contains("pending"))
  expect_error: publication-denied
- id: later-push-rejection-retains-published-cell
  type: integration_case
  inputs:
    prompt: Create the approved cells.
    reject_publication: beta
  runtime: *creation_runtime
  mocks:
    ops:
    - match:
        node_path:
          create-main/run/create/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
      repeat: true
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          registration.json: '{"id":"pre-registered-fixture"}'
    - *proposal
    - *commands
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: repositories.root.new_commits == 0
  - type: cel_true
    expr: '!calls.exists(c, (c.op == "rebase" || (c.op == "squashrebasemerge" && c.cell == "root")))'
  - type: cel_true
    expr: '!calls.exists(c, c.node_path.contains("/apply_catalog/") || (c.op == "merge" && c.cell == "root"))'
  - type: cel_true
    expr: size(calls.filter(c, c.op == "recipes.run")) == 2
  - type: cel_true
    expr: calls.exists(c, c.op == "squashrebasemerge" && c.cell == "alpha" && "outputs" in c &&
      size(c.outputs.merged_hash) == 40) && repositories.beta.new_commits == 0
  - type: cel_true
    expr: calls.exists(c, c.node_path.endsWith("record_pending/creation-publication-record/record") &&
      c.outputs.success && c.artifacts["created.json"].contains('"cell":"alpha"') &&
      c.artifacts["created.json"].contains("revision") &&
      c.artifacts["initializations.json"].contains('"name":"beta"'))
  expect_error: publication-denied
- id: catalog-push-rejection-fails-creation
  type: integration_case
  inputs:
    prompt: Create the approved cells.
    reject_publication: root
  runtime: *creation_runtime
  mocks:
    ops:
    - match:
        node_path:
          create-main/run/create/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
      repeat: true
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          registration.json: '{"id":"pre-registered-fixture"}'
    - *proposal
    - &registration
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            completed: true
            summary: Registered published cells
        artifacts:
          completion.md: |-
            # Created cells
            Continue with feature consultations.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: registered
          worktree:
            CELL_DESCRIPTIONS.md: |-
              # Cells
              alpha and beta: approved responsibilities.
            .c2/config.yaml: |
              dependents:
                - repo: alpha
                  ref: main
                - repo: beta
                  ref: main
    - *commands
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: repositories.root.new_commits == 0
  - type: cel_true
    expr: '!calls.exists(c, (c.op == "rebase" || (c.op == "squashrebasemerge" && c.cell == "root")))'
  - type: cel_true
    expr: calls.exists(c, c.op == "squashrebasemerge" && c.cell == "alpha" && "outputs" in c &&
      size(c.outputs.merged_hash) == 40) && calls.exists(c, c.op == "squashrebasemerge" && c.cell == "beta" &&
      "outputs" in c && size(c.outputs.merged_hash) == 40)
  - type: cel_true
    expr: calls.exists(c, c.node_path.endsWith("record_completed/creation-publication-record/record") &&
      c.outputs.success && c.artifacts["created.json"].contains('"cell":"alpha"') &&
      c.artifacts["created.json"].contains('"cell":"beta"'))
  expect_error: publication-denied
- id: initial-403-preserves-original-failure
  type: integration_case
  inputs:
    prompt: Create the approved cells.
    capture_failure: true
  runtime: *creation_runtime
  mocks:
    ops:
    - match:
        node_path:
          create-main/run/create/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
      repeat: true
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          registration.json: '{"id":"pre-registered-fixture"}'
    - match:
        op: squashrebasemerge
        cell: alpha
      behavior:
        mode: fail
        error:
          message: 'HTTP 403: no discoverable writable refs'
    - *proposal
    - *commands
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.failed && outputs.failure.kind == "task_error" && !has(outputs.failure.code)
  - type: cel_true
    expr: outputs.failure.node.op == "squashrebasemerge" && outputs.failure.node.id == "publish_new_cell"
  - type: cel_true
    expr: 'outputs.failure.message == "HTTP 403: no discoverable writable refs"'
  - type: cel_true
    expr: '!calls.exists(c, (c.op == "rebase" || (c.op == "squashrebasemerge" && c.cell == "root")))'
  - type: cel_true
    expr: repositories.root.new_commits == 0
