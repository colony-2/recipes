recipe: ../create.yaml
cases:
  - id: title-rejects-numeric
    type: integration_case
    runtime: {}
    inputs:
      prompt: Create the approved cells.
      title: 42
    expect_error: field 'title' has wrong type
    assertions:
      - type: cel_true
        expr: size(calls) == 0 && size(reviews) == 0
  - id: title-rejects-boolean
    type: integration_case
    runtime: {}
    inputs:
      prompt: Create the approved cells.
      title: false
    expect_error: field 'title' has wrong type
    assertions:
      - type: cel_true
        expr: size(calls) == 0 && size(reviews) == 0
  - id: title-rejects-list
    type: integration_case
    runtime: {}
    inputs:
      prompt: Create the approved cells.
      title: []
    expect_error: field 'title' has wrong type
    assertions:
      - type: cel_true
        expr: size(calls) == 0 && size(reviews) == 0
  - id: title-rejects-object
    type: integration_case
    runtime: {}
    inputs:
      prompt: Create the approved cells.
      title: {}
    expect_error: field 'title' has wrong type
    assertions:
      - type: cel_true
        expr: size(calls) == 0 && size(reviews) == 0
  - id: title-rejects-null
    type: integration_case
    runtime: {}
    inputs:
      prompt: Create the approved cells.
      title: null
    expect_error: field 'title' is nil
    assertions:
      - type: cel_true
        expr: size(calls) == 0 && size(reviews) == 0
  - id: title-cannot-replace-prompt
    type: integration_case
    runtime: {}
    inputs:
      title: Create gamma
    expect_error: required field 'prompt' is missing
    assertions:
      - type: cel_true
        expr: size(calls) == 0 && size(reviews) == 0
