recipe: ../recipes/develop/cell-setup.yaml
cases:
- id: existing-root-mandate
  type: integration_case
  inputs:
    prompt: Original feature request
    bootstrap_mandate: false
  runtime:
    cells:
      root:
        files:
          .c2j/mandate.md: 'Own repository behavior.

            '
  mocks:
    ops:
    - &id001
      match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  assertions:
  - type: cel_true
    expr: '!calls.exists(c,c.op == "recipe.run_and_get_result" || c.node_path == "cell-setup/refresh/thinpackrebase")'
  - type: cel_true
    expr: outputs.prompt == "Original feature request"
- id: bootstrap-does-not-recurse
  type: integration_case
  inputs:
    prompt: Original feature request
    bootstrap_mandate: true
  runtime:
    cells:
      root:
        files: {}
  mocks:
    ops:
    - *id001
  assertions:
  - type: cel_true
    expr: '!calls.exists(c,c.op == "recipe.run_and_get_result" || c.node_path == "cell-setup/refresh/thinpackrebase")'
  - type: cel_true
    expr: outputs.prompt.contains("Initialize this cell")
  - type: cel_true
    expr: outputs.prompt.contains("A comprehensive dependency inventory is not required")
  - type: cel_true
    expr: outputs.prompt.contains("normal dependency") && outputs.prompt.contains("c2j cells --json")
  - type: cel_true
    expr: outputs.prompt.contains("likely have") && outputs.prompt.contains("influence over")
- id: unmerged-child
  type: integration_case
  inputs:
    prompt: Original feature request
  expect_error: 'command execution failed: exit status 1'
  runtime:
    cells:
      root: {}
  mocks:
    ops:
    - *id001
    - match:
        op: recipe.run_and_get_result
      behavior:
        mode: return
        outputs:
          outputs:
            merged: false
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result").size() == 1
  - type: cel_true
    expr: '!calls.exists(c,c.node_path in ["cell-setup/refresh/thinpackrebase", "cell-setup/verify/command_execution"])'
- id: missing-merge-hash
  type: integration_case
  inputs:
    prompt: Original feature request
  expect_error: 'command execution failed: exit status 1'
  runtime:
    cells:
      root: {}
  mocks:
    ops:
    - *id001
    - match:
        op: recipe.run_and_get_result
      behavior:
        mode: return
        outputs:
          outputs:
            merged: true
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result").size() == 1
  - type: cel_true
    expr: '!calls.exists(c,c.node_path in ["cell-setup/refresh/thinpackrebase", "cell-setup/verify/command_execution"])'
- id: failed-child
  type: integration_case
  inputs:
    prompt: Original feature request
  expect_error: initialization failed
  runtime:
    cells:
      root: {}
  mocks:
    ops:
    - *id001
    - match:
        op: recipe.run_and_get_result
      behavior:
        mode: fail
        error:
          message: initialization failed
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result").size() == 1
  - type: cel_true
    expr: '!calls.exists(c,c.node_path in ["cell-setup/refresh/thinpackrebase", "cell-setup/verify/command_execution"])'
- id: refresh-failure
  type: integration_case
  inputs:
    prompt: Original feature request
  expect_error: refresh failed
  runtime:
    cells:
      root: {}
  mocks:
    ops:
    - *id001
    - match:
        op: recipe.run_and_get_result
      behavior:
        mode: return
        outputs:
          outputs:
            merged: true
            merged_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    - match:
        node_path: cell-setup/refresh/thinpackrebase
      behavior:
        mode: fail
        error:
          message: refresh failed
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result").size() == 1
  - type: cel_true
    expr: '!calls.exists(c,c.node_path == "cell-setup/verify/command_execution")'
- id: missing-refreshed-mandate
  type: integration_case
  inputs:
    prompt: Original feature request
  expect_error: 'command execution failed: exit status 1'
  runtime:
    cells:
      root: {}
  mocks:
    ops:
    - *id001
    - match:
        op: recipe.run_and_get_result
      behavior:
        mode: return
        outputs:
          outputs:
            merged: true
            merged_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    - match:
        node_path: cell-setup/refresh/thinpackrebase
      behavior:
        mode: return
        outputs:
          success: true
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result").size() == 1
  - type: cel_true
    expr: calls.exists(c,c.node_path == "cell-setup/verify/command_execution")
- id: child-merge-refresh-real-git
  type: integration_case
  inputs:
    prompt: Original feature request
  runtime:
    cells:
      root:
        file_sources:
          .c2j/recipes/build.yaml: fixtures/mandate-build.yaml
          .c2j/recipes/cell-setup.yaml: ../recipes/develop/cell-setup.yaml
    observe_files:
    - .c2j/mandate.md
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.prompt == "Original feature request"
  - type: cel_true
    expr: repositories.root.new_commits == 1
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result").size() == 1
  - type: cel_true
    expr: calls.filter(c,c.node_path == "cell-setup/refresh/thinpackrebase").size() == 1
  - type: cel_true
    expr: calls.filter(c,c.node_path == "cell-setup/refresh/thinpackrebase")[0].inputs.target_base_hash ==
      repositories.root.head
  - type: cel_true
    expr: calls.filter(c,c.node_path == "cell-setup/verify/command_execution")[0].worktree[".c2j/mandate.md"].contains("identity
      cell")
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result")[0].inputs.cell_name == "root"
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result")[0].inputs.inputs.bootstrap_mandate == true
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result")[0].inputs.inputs.prompt.contains("likely intended
      purpose")
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.run_and_get_result")[0].inputs.inputs.prompt.contains("relies on other
      cells")
  - type: cel_true
    expr: '!calls.filter(c,c.op == "recipe.run_and_get_result")[0].inputs.inputs.prompt.contains("Original feature
      request")'
  - type: cel_true
    expr: calls.filter(c,c.node_path == "cell-setup/verify/command_execution")[0].job_id == calls.filter(c,c.op
      == "recipe.run_and_get_result")[0].job_id
