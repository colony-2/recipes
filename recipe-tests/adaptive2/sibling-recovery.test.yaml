recipe: sibling-recovery.yaml
cases:
- id: recovery-child-can-read-previous-sibling-approval
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
        file_sources:
          .c2/recipes/prior-approval.yaml: approved-source.yaml
          .c2/adaptive: ../../recipes/adaptive
          .c2/recipes: ../../recipes/adaptive2
          .c2/adaptive2: ../../recipes/adaptive2
          .c2/response-schemas.yaml: ../../recipes/response-schemas.yaml
    responses:
    - node_path: prior-approved-work/direction/sequence/review
      fields:
        decision: accept
    - node_path: adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
    observe_files:
    - candidate.txt
    - seed.txt
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Approved scope and tests are unchanged; continue implementation.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            candidate.txt: corrected
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status=="completed" && outputs.result.outputs.merged && size(reviews)==2
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/direction/sequence/review/adaptive2-review/"))'
