            | Core code | 100 | 0 |

            | Tests | 0 | 0 |

            | Docs | 0 | 0 |

            Scope: final local diff. Assumes one new file.

            '
        effects: *id009
    - *id010
    - *id011
    - *id012
    - match: *id002
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Explain material difference with evidence before human review.
            files: *id013
            verdict: revise
            subject: Improve candidate
            next: implementation
        artifacts:
          merge-review.md: '# Incomplete accounting

            Missing material explanation.'
          line-counts.md: '| Path | Change | Category | Added | Removed |

            | --- | --- | --- | ---: | ---: |

            | candidate.txt | A | Core code | 1 | 0 |

            No binary changes.

            '
        effects: *id005
    - match: *id002
      behavior:
        mode: return
        outputs: *id014
        artifacts:
          implementation.md: '# Outcome

            Report correction: candidate.txt contains one reused line; no scope change.'
          test-results.md: '# Results

            T1 passed; existing behavior inspected.'
        effects: *id015
    - *id012
    - match: *id002
      behavior:
        mode: return
        outputs: *id016
        artifacts:
          merge-review.md: '# Merge requested file

            | Category | Est. + | Actual + | Δ + | Est. - | Actual - | Δ - |

            | --- | ---: | ---: | --- | ---: | ---: | --- |

            | Core code | 100 | **⚠ 1** | **⚠ -99 (-99%)** | 0 | 0 | 0 (n/a) |

            | Tests | 0 | 0 | 0 (n/a) | 0 | 0 | 0 (n/a) |

            | Docs | 0 | 0 | 0 (n/a) | 0 | 0 | 0 (n/a) |

            Δ shows lines (%); n/a means zero baseline. ⚠ marks a substantial surprise: candidate.txt reuses existing behavior in one line rather than
            the anticipated larger implementation. Outcome is unchanged; the smaller surface reduces review risk.

            [Counts](line-counts.md)

            [Approved direction](approved-direction/one-pager.md)

            [Candidate](merge-candidate.json)

            Delegated work is unfinished and excluded from local counts.

            '
          line-counts.md: '| Path | Change | Category | Added | Removed |

            | --- | --- | --- | ---: | ---: |

            | candidate.txt | A | Core code | 1 | 0 |

            No binary changes.

            '
        effects: *id005
    - *id017
  assertions:
  - *id018
  - type: cel_true
    expr: size(calls.filter(c, c.op == "rebase")) == 2 && size(calls.filter(c, c.op == "merge")) == 1
  - *id019
  - *id020
  - *id021
  - *id022
  - *id023
  - *id024
  - *id025
  - type: cel_true
    expr: 'calls.exists(c, c.op == "extension_execution" && c.inputs.inputs.prompt.contains("Prepare merge-review.md")
      && "approved-direction/one-pager.md" in c.artifacts && c.artifacts["approved-direction/one-pager.md"] == "#
      Preserve the requested behavior\n\n## Problem Description\nThe requested outcome needs verification.\n\n##
      Non Goals\nUnrelated changes.\n\n## What we are planning to do\nImplement the request and verify its acceptance
      checks.\n\n## Compat/Upgrade\nKeep existing interfaces.\n\n## Key challenges/design questions & answers\n|
      Question | Answer |\n| --- | --- |\n| What proves completion? | The approved test statements. |\n\n| Category
      | Added | Removed |\n| --- | ---: | ---: |\n| Core code | 100 | 0 |\n| Tests | 0 | 0 |\n| Docs | 0 | 0 |\nScope:
      final local diff. Assumes one new file.\n")'
  - *id026
  - *id027
  - *formatting_contract
  - *id028
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution").size() == 8
