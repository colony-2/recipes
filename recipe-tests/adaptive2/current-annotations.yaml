schema_version: 2
id: current-annotations-fixture
input_schema:
  documents:
    type: artifact_map
    default_value:
      report.md: &id001
        kind: value
        name: report.md
        format: text
        value: Current report
      copy/report.md:
        kind: value
        name: copy/report.md
        format: text
        value: Current report
  annotations:
    type: array
    items:
      type: object
    default_value:
    - &id002
      id: report.md
      ref: *id001
      lineage:
      - original.md
      - report.md
      origin:
        job_id: producer
        invocation: task
      descriptor:
        title: Old description
      sources:
      - id: check.log
        ref:
          kind: value
          name: check.log
          format: text
          value: Passed
        lineage:
        - check.log
      - requested: missing.md
        issue: not_found
    - *id002
    - id: report.md
      ref:
        kind: value
        name: report.md
        format: text
        value: Current report
      lineage:
      - original.md
      - report.md
      origin:
        job_id: producer
        invocation: task
      descriptor:
        title: Current description
      sources:
      - id: check.log
        ref:
          kind: value
          name: check.log
          format: text
          value: Passed
        lineage:
        - check.log
      - requested: missing.md
        issue: not_found
    - id: report.md
      ref:
        kind: value
        name: report.md
        format: text
        value: Superseded report
      lineage:
      - original.md
      - report.md
      origin:
        job_id: producer
        invocation: task
      descriptor:
        title: Stale description
      sources:
      - id: check.log
        ref:
          kind: value
          name: check.log
          format: text
          value: Passed
        lineage:
        - check.log
      - requested: missing.md
        issue: not_found
    - id: copy/report.md
      ref:
        kind: value
        name: report.md
        format: text
        value: Current report
      lineage:
      - original.md
      - report.md
      - copy/report.md
      origin:
        job_id: producer
        invocation: task
      descriptor:
        title: Alias description
      sources:
      - id: check.log
        ref:
          kind: value
          name: check.log
          format: text
          value: Passed
        lineage:
        - check.log
      - requested: missing.md
        issue: not_found
    - id: removed.md
      ref:
        kind: value
        name: report.md
        format: text
        value: Current report
      lineage:
      - original.md
      - report.md
      origin:
        job_id: producer
        invocation: task
      descriptor:
        title: Old description
      sources:
      - id: check.log
        ref:
          kind: value
          name: check.log
          format: text
          value: Passed
        lineage:
        - check.log
      - requested: missing.md
        issue: not_found
inputs:
  documents: ${{ inputs.documents }}
  annotations: ${{ inputs.annotations }}
sequence:
- id: select
  include: ../../recipes/adaptive2/current-annotations.yaml
  inputs:
    documents: ${{ inputs.documents }}
    annotations: ${{ inputs.annotations }}
outputs:
  annotations: ${{ sequence.select.outputs.annotations }}
