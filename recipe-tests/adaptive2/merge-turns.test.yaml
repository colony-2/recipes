recipe: merge-turns.yaml
cases:
- id: direct-3-upstream-advances
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          PURPOSE.md: Own widget behavior.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: "id: concurrent-writer-verify\nsequence:\n- id: checks\n  op: command_execution\n\
            \  const: true\n  inputs:\n    run: |\n      if bash ./build.sh; then printf passed; else printf failed;
            fi\noutputs:\n  api_version: c2.build-hook/v1\n  status: \"${{ sequence.checks.outputs.stdout.endsWith('passed')
            ? 'passed' : 'failed' }}\"\n  summary: Concurrent-writer verification completed.\n  artifact_refs: {}\n"
    responses:
    - node_path:
        merge-chase/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - node_path:
        merge-chase/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
    observe_files:
    - candidate.txt
    - upstream.txt
  inputs:
    advances: 3
  mocks:
    ops:
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: feature
            summary: Keep unfinished notes when navigating away.
            files:
            - path: one-pager.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for notebook feature: save drafts while typing'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions:
            review_title: 'Approve 1p for notebook feature: save drafts while typing'
            requests:
            packages:
        artifacts:
          one-pager.md: "# Save drafts\n\n## Problem Description\nPeople lose text.\n\n## Key challenges/design
            questions & answers\n| Question | Answer |\n| --- | --- |\n| Offline? | Excluded. |\n"
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - &id002
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths:
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior
            remains available."
          handoff.md: "# Execution assignment\nComplete the requested bounded work against test-statements.md. Use
            settled decisions and preserve existing behavior."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id003
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            candidate.txt: corrected
    - &id004
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id005
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id006
      repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: '!outputs.failed && outputs.build.merged'
  - type: cel_true
    expr: size(calls.filter(c, c.op == "merge")) == 4
  - type: cel_true
    expr: size(calls.filter(c, c.op == "rebase")) == 4
  - type: cel_true
    expr: size(reviews) == 2
  - type: cel_true
    expr: repositories.root.files["candidate.txt"] == "corrected"
- id: direct-4-upstream-advances
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          PURPOSE.md: Own widget behavior.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: "id: concurrent-writer-verify\nsequence:\n- id: checks\n  op: command_execution\n\
            \  const: true\n  inputs:\n    run: |\n      if bash ./build.sh; then printf passed; else printf failed;
            fi\noutputs:\n  api_version: c2.build-hook/v1\n  status: \"${{ sequence.checks.outputs.stdout.endsWith('passed')
            ? 'passed' : 'failed' }}\"\n  summary: Concurrent-writer verification completed.\n  artifact_refs: {}\n"
    responses:
    - node_path:
        merge-chase/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - node_path:
        merge-chase/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
    observe_files:
    - candidate.txt
    - upstream.txt
  inputs:
    advances: 4
  mocks:
    ops:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
  assertions:
  - type: cel_true
    expr: outputs.failed && outputs.failure.code == "MERGE_UPSTREAM_ADVANCED"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "merge")) == 4
  - type: cel_true
    expr: size(reviews) == 2
- id: new-human-approval-renews-merge-retries
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          PURPOSE.md: Own widget behavior.
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: "id: concurrent-writer-verify\nsequence:\n- id: checks\n  op: command_execution\n\
            \  const: true\n  inputs:\n    run: |\n      if bash ./build.sh; then printf passed; else printf failed;
            fi\noutputs:\n  api_version: c2.build-hook/v1\n  status: \"${{ sequence.checks.outputs.stdout.endsWith('passed')
            ? 'passed' : 'failed' }}\"\n  summary: Concurrent-writer verification completed.\n  artifact_refs: {}\n"
    responses:
    - node_path:
        merge-chase/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - node_path:
        merge-chase/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - node_path:
        merge-chase/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
    observe_files:
    - candidate.txt
    - upstream.txt
  inputs:
    advances: 4
    fail_after_rebase: true
  mocks:
    ops:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - &id007
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            candidate.txt: corrected
            repair.txt: repaired
    - *id004
    - *id005
    - *id006
  assertions:
  - type: cel_true
    expr: '!outputs.failed'
  - type: cel_true
    expr: size(reviews) == 3
  - type: cel_true
    expr: reviews[2].form.documents["approved/merge-review.md"].stored.key ==
      reviews[1].form.documents["merge-review.md"].stored.key
  - type: cel_true
    expr: reviews[2].form.documents["approved/merge-candidate.diff"].stored.key ==
      reviews[1].form.documents["merge-candidate.diff"].stored.key
  - type: cel_true
    expr: reviews[2].form.documents["merge-candidate.diff"].stored.key !=
      reviews[2].form.documents["approved/merge-candidate.diff"].stored.key
  - type: cel_true
    expr: reviews[2].form.overview_document_id == "merge-review.md" &&
      reviews[2].form.document_metadata["approved/merge-review.md"].role == "supporting" &&
      reviews[2].form.document_metadata["approved/merge-candidate.diff"].role == "diagnostic"
  - type: cel_true
    expr: calls.filter(c,c.node_path.contains("/accounting/") && c.op ==
      "extension_execution")[1].artifacts["approved/merge-review.md"] == "# Review\nEvidence checked."
  - type: cel_true
    expr: calls.filter(c,c.node_path.contains("/assessment/") && c.op ==
      "extension_execution")[1].artifacts["approved/merge-candidate.diff"].contains("+corrected")
  - type: cel_true
    expr: size(calls.filter(c,c.op == "merge")) == 4
  - type: cel_true
    expr: size(calls.filter(c,c.node_path.contains("/accounting/") && c.op == "extension_execution")) == 2
