recipe: legacy-limit-decision.yaml
cases:
- id: legacy-stop-retains-incomplete-action
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: stop
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
  assertions:
  - type: output_equals
    path: action
    value: stop
  - type: cel_true
    expr: size(reviews)==1 && reviews[0].form.fields[0].options.exists(o,o.value ==
      "stop" && o.label == "Stop this attempt and keep the results") && !reviews[0].form.fields[0].options.exists(o,o.value
      == "answer")
