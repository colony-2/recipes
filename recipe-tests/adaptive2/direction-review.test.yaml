              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
