recipe: ../../recipes/adaptive2/build.yaml
cases:
- id: direction-cancel-stops-before-implementation
  type: integration_case
  inputs:
    prompt: Save drafts while typing.
  runtime:
    cell: notebook
    cells:
      notebook:
        files:
          PURPOSE.md: Own a notebook application.
          README.md: A small notebook.
    responses:
    - node_path:
        adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: cancel
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: feature
            summary: Keep unfinished notes when navigating away.
            files:
            - path: one-pager.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for notebook feature: save drafts while typing'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions:
            review_title: 'Approve 1p for notebook feature: save drafts while typing'
            requests:
            packages:
        artifacts:
          one-pager.md: "# Save drafts\n\n## Problem Description\nPeople lose text.\n\n## Key challenges/design questions
            & answers\n| Question | Answer |\n| --- | --- |\n| Offline? | Excluded. |\n"
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: disposition
    value: cancelled
  - type: cel_true
    expr: reviews.size() == 1 && calls.filter(c,c.op == "extension_execution").size() == 1
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("start_implementation_session") || c.op == "merge")'
  - type: review_document_exists
    node_path:
      adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
    path: one-pager.md
  - type: cel_true
    expr: >-
      calls.filter(c,c.op == "extension_execution").all(c,
      c.inputs.inputs.prompt.contains("Select consequential choices a reviewer could reasonably challenge") &&
      c.inputs.inputs.prompt.contains("credible alternatives when they exist") &&
      c.inputs.inputs.prompt.contains("consequences that justify the choice") &&
      c.inputs.inputs.prompt.contains("decision or evidence needed to resolve them") &&
      c.inputs.inputs.prompt.contains("Do not invent alternatives or questions") &&
      c.inputs.inputs.prompt.contains("no substantive rows") &&
      c.inputs.inputs.prompt.contains("Problem Description; Non Goals; What we are planning to do; Compat/Upgrade;") &&
      c.inputs.inputs.prompt.contains("a two-column question/answer table") &&
      c.inputs.inputs.prompt.contains("There is no word, page, or question-count limit") &&
      !c.inputs.inputs.prompt.contains("Preserve EVERY") &&
      !c.inputs.inputs.prompt.contains("largest section") &&
      c.inputs.inputs.instructions.contains("Select design questions") &&
      !c.inputs.inputs.instructions.contains("Keep every important"))
- id: explanation-finishes-without-approval
  type: integration_case
  inputs:
    prompt: Save drafts while typing.
  runtime:
    cell: notebook
    cells:
      notebook:
        files:
          PURPOSE.md: Own a notebook application.
          README.md: A small notebook.
    responses: []
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: explanation
            summary: Keep unfinished notes when navigating away.
            files:
            - path: answer.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for notebook feature: save drafts while typing'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions:
            review_title: 'Approve 1p for notebook feature: save drafts while typing'
            requests:
            packages:
        artifacts:
          answer.md: "# Why drafts disappear\nThe application only saves when Save is pressed.\n"
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: disposition
    value: unchanged
  - type: output_equals
    path: work_kind
    value: explanation
  - type: cel_true
    expr: reviews.size() == 0 && !calls.exists(c,c.op == "input" || c.op == "merge")
- id: direction-revision-preserves-human-feedback
  type: integration_case
  inputs:
    prompt: Save drafts while typing. Remove manual save.
  runtime:
    cell: notebook
    cells:
      notebook:
        files:
          PURPOSE.md: Own a notebook application.
          README.md: A small notebook.
    responses:
    - node_path:
        adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: revise
        feedback: 'The scope has changed: keep manual save as well.'
    - node_path:
        adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: cancel
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: feature
            summary: Keep unfinished notes when navigating away.
            files:
            - path: one-pager.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for notebook feature: save drafts while typing'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions:
            review_title: 'Approve 1p for notebook feature: save drafts while typing'
            requests:
            packages:
        artifacts:
          one-pager.md: "# Save drafts\n\n## Problem Description\nPeople lose text.\n\n## Key challenges/design questions
            & answers\n| Question | Answer |\n| --- | --- |\n| Offline? | Excluded. |\n"
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: feature
            summary: Keep unfinished notes when navigating away.
            files:
            - path: one-pager.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for notebook feature: save drafts while typing'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions:
            review_title: 'Approve 1p for notebook feature: save drafts while typing'
            requests:
            packages:
        artifacts:
          one-pager.md: "# Save drafts and keep manual save\nThe manual save action remains available.\n"
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: disposition
    value: cancelled
  - type: cel_true
    expr: reviews.size() == 2
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution")[1].artifacts.exists(k,k.startsWith("feedback/"))
  - type: cel_true
    expr: 'calls.filter(c,c.op == "extension_execution")[1].artifacts["feedback/human-answers.md"].contains("The scope has changed: keep manual save as well.")'
  - type: cel_true
    expr: 'calls.filter(c,c.op == "extension_execution").all(c,c.inputs.inputs.prompt.contains("Original request:") && c.inputs.inputs.instructions.contains("supersedes conflicting earlier requests or plans"))'
  - type: cel_true
    expr: 'calls.filter(c,c.op == "extension_execution")[1].inputs.inputs.prompt.contains("Revise the proposal using the latest human feedback") && !calls.filter(c,c.op == "extension_execution")[0].inputs.inputs.prompt.contains("Revise the proposal using the latest human feedback")'
  - type: cel_true
    expr: 'calls.filter(c,c.op == "extension_execution").size() == 2 && calls.filter(c,c.op == "extension_execution").all(c,c.node_path.endsWith("/start_read_only_session") && !has(c.inputs.inputs.session)) && !calls.exists(c,c.op == "recipes.run" || c.op == "merge")'
  - type: cel_true
    expr: 'reviews[1].form.documents["one-pager.md"].stored.key != reviews[0].form.documents["one-pager.md"].stored.key'
