schema_version: 2
id: limit-parent
sequence:
- id: submit
  op: recipes.run
  inputs:
    recipes:
    - cell_name: ${{ context.workflow.cell }}
      name: limit-child
      inputs: {}
- id: wait
  include: ../../recipes/adaptive/await-child.yaml
  inputs:
    job: ${{ sequence.submit.outputs.job_ids[0] }}
- id: inspect
  op: command_execution
  const: true
  inputs:
    env:
      CHILD_JOB: ${{ sequence.submit.outputs.job_ids[0] }}
    run: c2j job show "$CHILD_JOB" --json
outputs:
  child: ${{ sequence.wait.outputs.result }}
  runtime_status: ${{ json_parse(sequence.inspect.outputs.stdout).job.completion_status }}
