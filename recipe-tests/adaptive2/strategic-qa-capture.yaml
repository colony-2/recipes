schema_version: 2
id: strategic-qa-capture
input_schema:
  title:
    type: string
  type:
    type: string
  prompt:
    type: string
sequence:
- id: strategic_fork
  include: ../../recipes/adaptive2/agent.yaml
  inputs:
    request: Users lose unfinished notes when switching notes. Add saving while typing, keep manual Save, and show saving and failure states. Decide whether to reuse the existing conditional-save API or add a separate autosave endpoint. The storage README and implementation describe the existing contract; use that evidence to recommend a direction. Prepare only a direction review; no UI mockup is needed.
    target_directory: recipe-tests/adaptive2/fixtures/notebook
    phase: design
    guidance: >-
      This is a bounded direction-document evaluation. Read the notebook fixture and the sibling storage
      fixture README and implementation as repository evidence supplied by their owners. Do not change
      application files or request implementation. The notebook fixture is the evaluated application;
      the enclosing recipes repository is only the evaluation harness. Stop after producing one-pager.md.
- id: unresolved_retention
  include: ../../recipes/adaptive2/agent.yaml
  inputs:
    request: Users need to recover earlier saved versions of notes. Propose version retention and restoration through the existing conditional save. We do not yet know required recovery history or the storage budget. Explain a proposed direction and any consequential decision that remains unresolved. Prepare only a direction review; no UI mockup is needed.
    target_directory: recipe-tests/adaptive2/fixtures/notebook
    phase: design
    guidance: >-
      This is a bounded direction-document evaluation. Read the notebook fixture and the sibling storage
      fixture README and implementation as repository evidence supplied by their owners. Do not change
      application files or request implementation. The notebook fixture is the evaluated application;
      the enclosing recipes repository is only the evaluation harness. Stop after producing one-pager.md.
- id: simple_label
  include: ../../recipes/adaptive2/agent.yaml
  inputs:
    request: Change the manual Save button label to Save note. Keep its behavior and the existing API unchanged. Prepare only a direction review; no UI mockup is needed.
    target_directory: recipe-tests/adaptive2/fixtures/notebook
    phase: design
    guidance: >-
      This is a bounded direction-document evaluation. Read the notebook fixture and the sibling storage
      fixture README and implementation as repository evidence supplied by their owners. Do not change
      application files or request implementation. The notebook fixture is the evaluated application;
      the enclosing recipes repository is only the evaluation harness. Stop after producing one-pager.md.
outputs:
  strategic_fork: ${{ sequence.strategic_fork.outputs.turn }}
  unresolved_retention: ${{ sequence.unresolved_retention.outputs.turn }}
  simple_label: ${{ sequence.simple_label.outputs.turn }}
