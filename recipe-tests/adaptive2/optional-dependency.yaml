id: optional-native-dependency
inputs:
  enabled: ${{ inputs.enabled }}
  fail: ${{ inputs.fail }}
state:
  initial:
  - to: launch
    when: inputs.enabled
  - to: skip
    when: true
  states:
    skip:
      sequence: []
    launch:
      op: recipes.run
      inputs:
        recipes:
        - cell_name: root
          name: diagnostic
          inputs:
            fail: ${{ inputs.fail }}
      transitions:
      - to: collect
        when: true
    collect:
      include: ../../recipes/adaptive/await-child.yaml
      inputs:
        job: ${{ states.launch.outputs.job_ids[0] }}
outputs:
  result: ${{ state_output('collect','result',{}) }}
