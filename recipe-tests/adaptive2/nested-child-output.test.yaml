recipe: nested-child-output.yaml
cases:
  - id: shared-child-collection
    type: integration_case
    runtime:
      secrets:
        jev_api_key: synthetic
        codex_api_key: synthetic
      cells:
        root:
          files:
            README.md: A bounded application.
        delivery:
          files:
            PURPOSE.md: Own disposable delivery evidence.
            .c2/recipes/grandchild.yaml: |
              id: nested-grandchild
              sequence: []
              outputs:
                disposition: unchanged
                coordination: ${{ [{'action':'consult','transcript':jq(null, '"GRANDCHILD_HISTORY_ONLY:" + ("g" * 80000)')}] }}
                transcript: GRANDCHILD_TRANSCRIPT_ONLY
      responses:
        - node_path: nested-child-output/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
          fields:
            decision: accept
        - node_path: nested-child-output/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
          fields:
            decision: accept
      observe_files:
        - candidate.txt
    inputs:
      prompt: Preserve selected delivery evidence.
    mocks:
      ops:
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
            cell: root
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                next: review
                work_kind: feature
                summary: Agree on the requested outcome before implementation.
                files:
                  - path: one-pager.md
                    description: Direction for saving unfinished notes
                    title: 'Approve 1p for root feature: preserve the requested behavior'
                    role: primary
                    order: 0
                    source_paths:
                      - request.md
                questions: null
                review_title: 'Approve 1p for root feature: preserve the requested behavior'
                requests: null
                packages: null
            artifacts:
              one-pager.md: |
                # Preserve the requested behavior

                ## Problem Description
                The requested outcome needs verification.

                ## Non Goals
                Unrelated changes.

                ## What we are planning to do
                Implement the request and verify its acceptance checks.

                ## Compat/Upgrade
                Keep existing interfaces.

                ## Key challenges/design questions & answers
                | Question | Answer |
                | --- | --- |
                | What proves completion? | The approved test statements. |
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    turn: shape
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
            cell: root
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                next: review
                summary: Complete bounded work.
                files:
                  - path: test-statements.md
                    description: test-statements.md
                    title: test-statements.md
                    role: primary
                    order: 0
                  - path: handoff.md
                    description: Settled execution assignment
                    title: Execution handoff
                    role: supporting
                    order: 1
                    source_paths: null
                questions: []
            artifacts:
              test-statements.md: |-
                # Expectations
                - T1 [Critical] [integration] [README.md] [Git] Existing behavior remains available.
              handoff.md: |-
                # Execution assignment
                Complete the requested bounded work against test-statements.md. Use settled decisions and preserve existing behavior.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    turn: review
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
            cell: root
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                next: continue
                summary: Collect bounded delivery results before assessing the candidate.
                files:
                  - path: delivery-scope.md
                    description: Required delivery scope
            artifacts:
              delivery-scope.md: Both disposable deliveries are required; read their selected evidence.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    turn: review
              children:
                - recipe: fixtures/nested-delivery.yaml
                  cell: delivery
                  await: terminal
                  bind: first
                - recipe: fixtures/nested-delivery.yaml
                  cell: delivery
                  await: terminal
                  bind: second
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
            cell: root
          behavior:
            mode: return
            artifacts:
              implementation.md: |-
                # Outcome
                Already satisfied.
              test-results.md: |-
                # Results
                T1 passed; existing behavior inspected.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    turn: review
              worktree:
                candidate.txt: corrected
            outputs_expr: '{"status": "completed", "output_schema_valid": true, "response": {"next": "review", "summary": "Complete bounded work.", "files": [{"path": "implementation.md", "description": "implementation.md", "title": "implementation.md", "role": "primary", "order": 0}, {"path": "test-results.md", "description": "test-results.md", "title": "test-results.md", "role": "primary", "order": 1}, {"path": "results/" + children.first + "/artifacts/evidence.txt", "description": "First selected evidence"}, {"path": "results/" + children.second + "/artifacts/evidence.txt", "description": "Second selected evidence"}], "questions": []}}'
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
            cell: root
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                summary: Complete bounded work.
                files:
                  - path: assessment.md
                    description: assessment.md
                    title: assessment.md
                    role: primary
                    order: 0
                verdict: approve
                subject: Improve candidate
            artifacts:
              assessment.md: |-
                # Review
                Evidence checked.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    turn: review
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
            cell: root
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                summary: Complete bounded work.
                files:
                  - path: merge-review.md
                    description: merge-review.md
                    title: merge-review.md
                    role: primary
                    order: 0
                verdict: approve
                subject: Improve candidate
            artifacts:
              merge-review.md: |-
                # Review
                Evidence checked.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    turn: review
        - repeat: true
          match:
            op: command_execution
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.collected_results.size() == 2 && !outputs.collector_failed && outputs.collected_results.all(r,r.status == "completed" && r.outputs.disposition == "unchanged" && !("coordination" in r.outputs) && !("transcript" in r.outputs) && !("unrelated_result" in r.outputs) && !("merged" in r.outputs) && !("ok" in r.outputs))
      - type: cel_true
        expr: outputs.coordination_valid && outputs.coordinated_records.filter(r,r.action == "await").size() == 2 && outputs.coordinated_records.filter(r,r.action == "await").all(r,r.result.status == "completed" && r.result.outputs.disposition == "unchanged" && !("coordination" in r.result.outputs) && !("transcript" in r.result.outputs) && !("unrelated_result" in r.result.outputs) && !("merged" in r.result.outputs) && !("ok" in r.result.outputs))
      - type: cel_true
        expr: outputs.build_output.merged && outputs.build_output.disposition == "implemented"
      - type: cel_true
        expr: outputs.output_bytes > 0 && outputs.output_bytes < 262144
      - type: cel_true
        expr: outputs.inspected.contains("bytes and stored identity preserved") && outputs.inspected.contains("retrieved from child and grandchild producers")
      - type: cel_true
        expr: outputs.build_output.coordination.filter(r,r.action == "await").size() >= 2
      - type: cel_true
        expr: outputs.build_output.coordination.filter(r,r.action == "await").all(r,r.result.status == "completed" && r.result.outputs.disposition == "unchanged" && r.result.outputs.summary == "Delivery verified; selected evidence is available." && !("merged" in r.result.outputs) && !("ok" in r.result.outputs) && !("coordination" in r.result.outputs) && !("transcript" in r.result.outputs) && !("unrelated_result" in r.result.outputs))
      - type: cel_true
        expr: outputs.history_omitted
      - type: cel_true
        expr: calls.exists(c,c.op == "recipe.await_result_soft" && c.node_path.contains("/build/") && c.node_path.contains("adaptive-child-results"))
      - type: cel_true
        expr: calls.filter(c,c.op == "recipes.run").size() == 2
      - type: cel_true
        expr: repositories.root.files["candidate.txt"] == "corrected"
