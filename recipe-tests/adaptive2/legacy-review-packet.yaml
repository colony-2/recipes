schema_version: 2
id: review-packet
sequence:
- id: inspect
  include: ./fixtures/legacy-inspect.yaml
  inputs:
    role: summary
    request: Show the updated phone view.
    documents: {}
- id: review
  include: ../../recipes/adaptive2/review.yaml
  inputs:
    title: Review phone view
    overview: merge-review.md
    brief: ${{ sequence.inspect.outputs.documents['merge-review.md'] }}
    documents: ${{ sequence.inspect.outputs.documents }}
    annotations: ${{ sequence.inspect.outputs.annotations }}
    fields:
    - id: decision
      type: multiple_choice
      question: Merge these changes?
      required: true
      options:
      - value: accept
        label: Merge
outputs:
  documents: ${{ sequence.review.outputs.documents }}
  annotations: ${{ sequence.inspect.outputs.annotations }}
