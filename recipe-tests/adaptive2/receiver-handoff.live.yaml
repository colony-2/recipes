recipe: consultation.yaml
live: true
cases:
- id: storage-authors-draft-history-feature
  type: integration_case
  inputs:
    request: I'm notebook. People sometimes overwrite a note and need the earlier text back. I'd like you to
      keep its last three saved versions; I've put the proposed requirements in inbox/request.md. Does this
      fit what you provide, and what would you change?
    documents:
      request.md:
        kind: value
        name: request.md
        format: text
        value: |
          # Feature request: recover earlier drafts

          People need to recover a note they accidentally overwrote, even after closing the browser or
          moving to another device. I propose keeping the last three saved versions and adding a restore
          operation. I will handle choosing and previewing a version in notebook.

          Please check whether you already support this or would recommend another approach. Keep existing
          clients working. Explain any choices about retention, repeated saves, empty text, large drafts,
          and another tab editing the same note. Recommend sensible defaults for the open choices.
  runtime:
    cell: notebook
    cells:
      notebook:
        file_sources:
          PURPOSE.md: fixtures/notebook/PURPOSE.md
          README.md: fixtures/notebook/README.md
          import_notes.py: fixtures/notebook/import_notes.py
          index.html: fixtures/notebook/index.html
          test_import_notes.py: fixtures/notebook/test_import_notes.py
      storage:
        file_sources:
          PURPOSE.md: fixtures/storage/PURPOSE.md
          README.md: fixtures/storage/README.md
          drafts.py: fixtures/storage/drafts.py
          test_drafts.py: fixtures/storage/test_drafts.py
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: outcome
    value: agreed
  - type: output_equals
    path: work_kind
    value: feature
  - type: cel_true
    expr: outputs.handoff != "" && outputs.handoff + "handoff.md" in outputs.documents
