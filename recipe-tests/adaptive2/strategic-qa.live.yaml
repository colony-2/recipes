recipe: live-review.yaml
live: true
cases:
- id: strategic-fork
  type: integration_case
  inputs:
    prompt: Users lose unfinished notes when switching notes. Add saving while typing, keep manual Save, and show saving and failure states. Decide whether to reuse the existing conditional-save API or add a separate autosave endpoint. The storage README and implementation describe the existing contract; use that evidence to recommend a direction. Prepare only a direction review; no UI mockup is needed.
  runtime:
    cell: notebook
    cells:
      notebook:
        file_sources:
          PURPOSE.md: fixtures/notebook/PURPOSE.md
          README.md: fixtures/notebook/README.md
          import_notes.py: fixtures/notebook/import_notes.py
          index.html: fixtures/notebook/index.html
          test_import_notes.py: fixtures/notebook/test_import_notes.py
      storage:
        file_sources:
          PURPOSE.md: fixtures/storage/PURPOSE.md
          README.md: fixtures/storage/README.md
          drafts.py: fixtures/storage/drafts.py
          test_drafts.py: fixtures/storage/test_drafts.py
    observe:
      scopes:
      - node_path:
          adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/work/sequence/agent/adaptive2-agent/turn/adaptive2-agent-turn/start_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - one-pager.md
        - progress.md
        - mockup.html
        - answer.md
      - node_path:
          adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/work/sequence/agent/adaptive2-agent/turn/adaptive2-agent-turn/resume_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - one-pager.md
        - progress.md
        - mockup.html
        - answer.md
      limits:
        records: 40
        bytes: 262144
    responses:
    - node_path:
        adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: cancel
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "input" && c.node_path ==
      "adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review")
      && !calls.exists(c,c.node_path.contains("start_implementation_session"))
  - type: output_equals
    path: disposition
    value: cancelled
