recipe: live-review.yaml
live: true
cases:
- id: draft-saving-direction
  type: integration_case
  inputs:
    prompt: Users lose unfinished notes when they move to another note. Add saving while typing and clear
      saving, saved, failed, and conflict states. Keep manual Save. I think storage may need a new autosave
      endpoint; consult storage about whether this is really needed. For now exclude offline editing and
      collaboration. Prepare a direction review and a proposed UI in mockup.html. Consider navigation during
      saving, slow or failed requests, two tabs, lost responses, draft size, accessibility, and recovery
      without overwriting text. Recommend practical choices; keep every consequential question in the
      one-pager.
  runtime:
    cell: notebook
    cells: &id001
      notebook:
        file_sources:
          PURPOSE.md: fixtures/notebook/PURPOSE.md
          README.md: fixtures/notebook/README.md
          import_notes.py: fixtures/notebook/import_notes.py
          index.html: fixtures/notebook/index.html
          test_import_notes.py: fixtures/notebook/test_import_notes.py
      storage:
        file_sources:
          PURPOSE.md: fixtures/storage/PURPOSE.md
          README.md: fixtures/storage/README.md
          drafts.py: fixtures/storage/drafts.py
          test_drafts.py: fixtures/storage/test_drafts.py
    observe:
      scopes:
      - node_path:
          adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/work/sequence/agent/adaptive2-agent/turn/adaptive2-agent-turn/start_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - one-pager.md
        - progress.md
        - mockup.html
        - answer.md
      - node_path:
          adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/work/sequence/agent/adaptive2-agent/turn/adaptive2-agent-turn/resume_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - one-pager.md
        - progress.md
        - mockup.html
        - answer.md
      limits:
        records: 40
        bytes: 262144
    responses:
    - node_path:
        adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: cancel
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "input" && c.node_path ==
      "adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review")
      && !calls.exists(c,c.node_path.contains("start_implementation_session"))
  - type: output_equals
    path: disposition
    value: cancelled
- id: import-last-note-direction
  type: integration_case
  inputs:
    prompt: Our notebook text importer sometimes silently loses the final note. People report this with files
      edited by hand, but we do not know the cause. Please find the cause and fix it, preserving the existing
      behavior for blank lines and Unicode.
  runtime:
    cell: notebook
    cells: *id001
    observe:
      scopes:
      - node_path:
          adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/work/sequence/agent/adaptive2-agent/turn/adaptive2-agent-turn/start_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - one-pager.md
        - progress.md
        - mockup.html
        - answer.md
      - node_path:
          adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/work/sequence/agent/adaptive2-agent/turn/adaptive2-agent-turn/resume_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - one-pager.md
        - progress.md
        - mockup.html
        - answer.md
      limits:
        records: 40
        bytes: 262144
    responses:
    - node_path:
        adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: cancel
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "input" && c.node_path ==
      "adaptive2-live-review/build/adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review")
      && !calls.exists(c,c.node_path.contains("start_implementation_session"))
  - type: output_equals
    path: disposition
    value: cancelled
