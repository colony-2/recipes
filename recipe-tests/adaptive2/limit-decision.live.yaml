recipe: limit-decision.yaml
live: true
cases:
- id: live-implementation-choice-brief
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: allowance
    value: 2
  - type: cel_true
    expr: size(outputs.receipts) == 1 && size(reviews) == 1
- id: live-mechanical-report-brief
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: allowance
    value: 2
  - type: cel_true
    expr: size(outputs.receipts) == 1 && size(reviews) == 1
  inputs:
    request: Show the implemented phone view in the merge review.
    summary: The implementation and screenshots are saved. The gallery still points at an image omitted from the review attachments.
    issues:
    - Two report corrections still leave the phone image unavailable in the final form.
    kind: correction
- id: live-scope-choice-brief
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: allowance
    value: 2
  - type: cel_true
    expr: size(outputs.receipts) == 1 && size(reviews) == 1
  inputs:
    request: Import contacts without silently losing any contact.
    summary: The importer reads every row. Some contacts share a name and have no email or phone; automatic matching cannot establish identity.
    issues:
    - Silently combining these contacts would violate the agreed no-loss requirement.
    kind: implementation
