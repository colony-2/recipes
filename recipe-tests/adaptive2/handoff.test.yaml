    expr: calls.exists(c,c.cell == "storage" && has(c.artifacts) && "handoff.md" in c.artifacts &&
      "recovery/notes.md" in c.artifacts && c.artifacts["recovery/notes.md"].contains("failed attempt"))
- id: missing-assignment-cannot-start-child
  type: integration_case
  inputs:
    omit_handoff: true
  runtime: *handoff_runtime
  mocks: *handoff_mocks
  assertions:
  - type: cel_true
    expr: '!outputs.valid && !calls.exists(c,c.op == "recipes.run")'
- id: unsafe-directory-cannot-start-child
  type: integration_case
  inputs:
    directory: ../work/
  runtime: *handoff_runtime
  mocks: *handoff_mocks
  assertions:
  - type: cel_true
    expr: '!outputs.valid && !calls.exists(c,c.op == "recipes.run")'
