      fields:
        action: answer
        feedback: Please fix it now?
    expect_error: no input response fixture for review-packet/inspect/adaptive2-inspect/escalate/escalate/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
  mocks:
    ops:
    - &id002
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
