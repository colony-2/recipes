  - type: cel_true
    expr: size(outputs.annotations) == 3 && outputs.annotations.all(a, a.id in outputs.documents && a.ref.kind == outputs.documents[a.id].kind && a.ref.stored == outputs.documents[a.id].stored)
  - type: cel_true
    expr: outputs.annotations.filter(a, a.id == "merge-review.md")[0].sources.map(s, s.id) == ["screenshots.md", "evidence/phone.png"]
  - type: review_document_exists
    node_path: review-packet/review/adaptive2-review/request_human_review
    path: evidence/phone.png
