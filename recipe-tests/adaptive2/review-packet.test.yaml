recipe: review-packet.yaml
cases:
- id: accounting-repairs-gallery-before-human
  type: integration_case
  runtime:
    responses:
    - node_path: review-packet/review/adaptive2-review/request_human_review
      fields:
        decision: accept
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            next: complete
            summary: The phone view matches the request.
            subject: Improve phone view
            files:
            - path: merge-review.md
              description: Review
              source_paths:
              - screenshots.md
            - path: screenshots.md
              description: Gallery
              source_paths:
              - evidence/phone.png
            - path: evidence/phone.png
              description: Phone screenshot
        artifacts:
          merge-review.md: "# Phone view\n[Images](screenshots.md)"
          screenshots.md: '![Phone](evidence/phone.png)'
          evidence/phone.png: image bytes
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: summary
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            next: complete
            summary: The phone view matches the request.
            subject: Improve phone view
            files:
            - path: merge-review.md
              description: Review
              source_paths:
              - screenshots.md
              - evidence/phone.png
            - path: screenshots.md
              description: Gallery
              source_paths:
              - evidence/phone.png
            - path: evidence/phone.png
              description: Phone screenshot
        artifacts:
          merge-review.md: "# Phone view\n[Images](screenshots.md)"
          screenshots.md: '![Phone](evidence/phone.png)'
          evidence/phone.png: image bytes
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: summary
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews) == 1 && calls.filter(c,c.op == "extension_execution").size() == 2
  - type: cel_true
    expr: size(outputs.annotations) == 3 && outputs.annotations.all(a, a.id in outputs.documents && a.ref.kind == outputs.documents[a.id].kind && a.ref.stored == outputs.documents[a.id].stored)
  - type: cel_true
    expr: outputs.annotations.filter(a, a.id == "merge-review.md")[0].sources.map(s, s.id) == ["screenshots.md", "evidence/phone.png"]
  - type: review_document_exists
    node_path: review-packet/review/adaptive2-review/request_human_review
    path: evidence/phone.png
- id: gallery-correction-limit-four-new-attempts
  type: integration_case
  runtime:
    responses:
    - node_path: review-packet/inspect/adaptive2-inspect/escalate/escalate/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: increase
    - node_path: review-packet/review/adaptive2-review/request_human_review
      fields:
        decision: accept
  mocks:
    ops:
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
