              description: Review
              source_paths:
              - screenshots.md
            - path: screenshots.md
              description: Gallery
              source_paths:
              - evidence/phone.png
            - path: evidence/phone.png
              description: Phone screenshot
        artifacts:
          merge-review.md: '# Phone view

            [Images](screenshots.md)'
          screenshots.md: '![Phone](evidence/phone.png)'
          evidence/phone.png: image bytes
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: summary
    - *id002
    - *id002
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            answer: The saved work stays paused until you explicitly resolve this decision.
  assertions:
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution").size()==5 && calls.filter(c,c.node_path.contains("/evaluate/") && c.op == "extension_execution").size()==3
      && calls.filter(c,c.op == "input").size()==2
  - type: cel_true
    expr: calls.filter(c,c.node_path.contains("/discuss/") && c.op == "extension_execution").all(c,c.node_path.endsWith("/start_read_only_session") && !has(c.inputs.inputs.session))
