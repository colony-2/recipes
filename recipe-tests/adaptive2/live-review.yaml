schema_version: 2
id: adaptive2-live-review
input_schema:
  prompt:
    type: string
inputs:
  prompt: ${{ inputs.prompt }}
sequence:
- id: build
  include: ../../recipes/adaptive2/build.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
- id: retain_review_packet
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.build.outputs.artifact_refs }}
  inputs:
    run: test -s "$INBOX/one-pager.md"
    env:
      INBOX: ${{ context.environment.op.inbox }}
outputs:
  disposition: ${{ sequence.build.outputs.disposition }}
  artifact_refs: ${{ sequence.build.outputs.artifact_refs }}
