schema_version: 2
id: limit-trial
sequence:
- id: decide
  include: ../../recipes/adaptive2/limit-decision.yaml
  inputs:
    request: ${{ inputs.request }}
    summary: ${{ inputs.summary }}
    issues: ${{ inputs.issues }}
    documents: {}
    allowance: 2
    used: 2
    kind: ${{ inputs.kind }}
    can_resume: true
    can_fresh: true
    allow_scope: true
outputs:
  action: ${{ sequence.decide.outputs.action }}
  allowance: ${{ sequence.decide.outputs.allowance }}
  receipts: ${{ sequence.decide.outputs.receipts }}
input_schema:
  request:
    type: string
    default_value: Import contacts without duplicates.
  summary:
    type: string
    default_value: Reading files works; ambiguous names remain.
  kind:
    type: string
    default_value: implementation
  issues:
    type: array
    default_value:
    - Two attempts still leave duplicate records.
    items:
      type: string
inputs:
  request: ${{ inputs.request }}
  summary: ${{ inputs.summary }}
  kind: ${{ inputs.kind }}
  issues: ${{ inputs.issues }}
