schema_version: 2
id: recovery-status
sequence:
- id: coordinate
  include: ../../recipes/adaptive2/coordinate.yaml
  inputs:
    requests:
    - action: execute
      cell: storage
      handoff: work/storage/
      replaces: prior-attempt
      resume_from: prior-approved-job
    phase: implement
    root_cell: root
    root_ref: main
    consultation_recipe: consultation
    build_recipe: build
    create_recipe: create
    session: {}
    documents:
      work/storage/handoff.md:
        kind: value
        name: work/storage/handoff.md
        format: text
        value: Receiver's recovered assignment.
    prefix: recovery
    history: []
outputs:
  valid: ${{ sequence.coordinate.outputs.valid }}
  records: ${{ sequence.coordinate.outputs.records }}
  issues: ${{ sequence.coordinate.outputs.issues }}
