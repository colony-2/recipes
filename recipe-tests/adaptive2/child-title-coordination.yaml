schema_version: 2
id: child-title-coordination
input_schema:
  request_fields:
    type: object
    default_value: {}
  create:
    type: boolean
    default_value: false
  inline:
    type: boolean
    default_value: false
inputs:
  request_fields: ${{ inputs.request_fields }}
  create: ${{ inputs.create }}
  inline: ${{ inputs.inline }}
sequence:
- id: coordinate
  include: ../../recipes/adaptive2/coordinate.yaml
  inputs:
    requests: '${{ [jq([{''action'':''consult'',''cell'':''storage'',''ref'':''main'',''request'':''Preserve earlier
      note versions.'',''kind'':inputs.create ? ''create'' : ''feature''}, inputs.request_fields], ''add'')] }}'
    phase: implement
    root_cell: root
    root_ref: main
    consultation_recipe: '${{ inputs.inline ? ''git+https://github.com/colony-2/recipes.git//recipes/adaptive2/consultation.yaml@main''
      : ''consult-child'' }}'
    build_recipe: unused
    create_recipe: create-child
    session: {}
    documents: {}
    prefix: titles
outputs:
  valid: ${{ sequence.coordinate.outputs.valid }}
  records: ${{ sequence.coordinate.outputs.records }}
