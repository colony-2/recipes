recipe: visual-review-live.yaml
live: true
cases:
- id: actual-phone-screenshot-packet
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Own this static notebook page.
          index.html: <!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:18px system-ui;margin:24px;background:#f5f7fb;color:#172033}button{background:#777;color:white;border:0;border-radius:8px;padding:12px 24px;font:inherit}textarea{display:block;width:95%;height:150px;margin:16px 0;padding:8px;font:inherit}</style><h1>Quick note</h1><label for="note">Your note</label><textarea id="note">Remember to check the garden.</textarea><button>Save</button><p>Saved just now</p></html>
    responses:
    - node_path: visual-live/review/adaptive2-review/request_human_review
      fields:
        decision: done
    observe:
      scopes:
      - node_path: visual-live/capture
        outputs:
        - success
        retain_artifacts:
        - phone.png
      - node_path: visual-live/assess/adaptive2-inspect/evaluate/sequence/agent/adaptive2-agent-turn/start_read_only_session/start_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - phone.png
      - node_path: visual-live/assess/adaptive2-inspect/evaluate/sequence/agent/adaptive2-agent-turn/resume_read_only_session/resume_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - phone.png
      - node_path: visual-live/summarize/adaptive2-inspect/evaluate/sequence/agent/adaptive2-agent-turn/start_read_only_session/start_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - phone.png
      - node_path: visual-live/summarize/adaptive2-inspect/evaluate/sequence/agent/adaptive2-agent-turn/resume_read_only_session/resume_read_only_session
        outputs:
        - status
        - response
        retain_artifacts:
        - phone.png
      limits:
        records: 50
        bytes: 1000000
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.assessed && outputs.summary_approved && size(reviews)==1
  - type: review_document_exists
    node_path: visual-live/review/adaptive2-review/request_human_review
    path: phone.png
