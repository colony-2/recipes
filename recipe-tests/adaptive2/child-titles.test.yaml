- id: title-cannot-bypass-tampered-handoff
  type: integration_case
  inputs:
    request_fields:
      title: Preserve earlier note versions
    tamper: true
  runtime: *id001
  mocks: *id002
  assertions:
  - type: cel_true
    expr: '!outputs.valid && !calls.exists(c,c.op == "recipes.run")'
- id: title-cannot-bypass-unsafe-handoff
  type: integration_case
  inputs:
    request_fields:
      title: Preserve earlier note versions
    directory: ../work/
  runtime: *id001
  mocks: *id002
  assertions:
