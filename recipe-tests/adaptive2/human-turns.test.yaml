recipe: ../../build.yaml
cases:
- id: human-questions-do-not-exhaust-one-turn-allowance
  type: integration_case
  inputs:
    prompt: Save drafts while typing.
    max_iterations: 1
  runtime:
    cell: notebook
    cells:
      notebook:
        files:
          PURPOSE.md: Own a notebook application.
          README.md: A small notebook.
    responses:
    - node_path:
        build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - &id008
      node_path:
        build/workflow/adaptive2-workflow/run/adaptive2-develop/questions/sequence/review/adaptive2-review/request_human_review
      fields:
        keep_manual: yes
    - node_path:
        build/workflow/adaptive2-workflow/run/adaptive2-develop/questions/sequence/review/adaptive2-review/request_human_review
      fields:
        keep_manual: yes
    - node_path:
        build/workflow/adaptive2-workflow/run/adaptive2-develop/questions/sequence/review/adaptive2-review/request_human_review
      fields:
        keep_manual: yes
    - node_path:
        build/workflow/adaptive2-workflow/run/adaptive2-develop/questions/sequence/review/adaptive2-review/request_human_review
      fields:
        keep_manual: yes
    - node_path:
        build/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
  mocks:
    ops:
    - &id002
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: feature
            summary: Keep unfinished notes when navigating away.
            files:
            - path: one-pager.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for notebook feature: save drafts while typing'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions:
            review_title: 'Approve 1p for notebook feature: save drafts while typing'
            requests:
            packages:
        artifacts:
          one-pager.md: "# Save drafts\n\n## Problem Description\nPeople lose text.\n\n## Key challenges/design
            questions & answers\n| Question | Answer |\n| --- | --- |\n| Offline? | Excluded. |\n"
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - &id003
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths:
            questions: []
        artifacts:
          test-statements.md: "# Expectations\n- T1 [Critical] [integration] [README.md] [Git] Existing behavior
            remains available."
          handoff.md: "# Execution assignment\nComplete the requested bounded work against test-statements.md. Use
            settled decisions and preserve existing behavior."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: ask_user
            summary: Choose the save behavior.
            review_title: Keep manual save available?
            questions:
            - id: keep_manual
              type: multiple_choice
              question: Keep manual save?
              required: true
              options:
              - value: yes
                label: Keep it
              - value: no
                label: Remove it
            files: []
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: ask_user
    - *id001
    - *id001
    - *id001
    - &id004
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id005
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id006
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id007
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: disposition
    value: unchanged
  - type: cel_true
    expr: reviews.size() == 6
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.node_path.contains("/work/")).size() == 7
