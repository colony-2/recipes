  assertions:
  - type: output_equals
    path: disposition
    value: unchanged
  - type: cel_true
    expr: calls.filter(c,c.op == "recipes.run").size() == 1
  - *id010
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.node_path.contains("/work/"))[1].artifacts["coordination/request-0-0/artifacts/iter1/consultant/work/old-evidence.txt"].contains("Historical")
  - type: cel_true
    expr: '!("coordination/request-0-0/artifacts/iter1/consultant/work/old-evidence.txt" in calls.filter(c,c.op
      == "extension_execution" && c.node_path.contains("/work/"))[2].artifacts)'
  - type: cel_true
    expr: outputs.coordination.exists(c,c.action == "consult" && c.result.outcome == "agreed" && !("final_artifacts" in c.result)) && calls.exists(c,c.op == "extension_execution" && c.cell == "notebook" && has(c.artifacts) && "coordination/request-0-0/artifacts/iter1/consultant/work/old-evidence.txt" in c.artifacts && c.artifacts["coordination/request-0-0/artifacts/iter1/consultant/work/old-evidence.txt"].contains("Historical"))
  - type: cel_true
    expr: '!("coordination/request-0-0/artifacts/iter1/consultant/work/old-evidence.txt" in outputs.artifact_refs)'
  - type: cel_true
    expr: calls.exists(c,c.cell == "storage" && has(c.artifacts) && "handoff.md" in c.artifacts && !("old-evidence.txt"
      in c.artifacts))
