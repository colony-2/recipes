recipe: child-title-coordination.yaml
cases:
- id: consultation-title-explicit
  type: integration_case
  inputs:
    create: false
    request_fields:
      title: Preserve earlier note versions
  runtime: &id001
    cell: notebook
    cells:
      notebook:
        files:
          PURPOSE.md: Own notebook.
          .c2/recipes/consult-child.yaml: "id: strict-consultation\ninput_schema:\n  annotations:\n    default_value:\
            \ []\n    items:\n      type: object\n    type: array\n  consultant_cell:\n    default_value: ''\n \
            \   type: string\n  consultant_ref:\n    default_value: ''\n    type: string\n  consultant_role:\n \
            \   default_value: ''\n    type: string\n  documents:\n    default_value: {}\n    type: artifact_map\n\
            \  request:\n    default_value: ''\n    type: string\n  thread:\n    default_value: ''\n    type: string\n\
            outputs:\n  agreements: []\n  annotations: []\n  final_artifacts: {}\n  outcome: answered\n  reply:\
            \ Earlier versions can be retained.\nschema_version: 2\nsequence: []\n"
          .c2/recipes/create-child.yaml: "id: strict-creation\ninput_schema:\n  documents:\n    default_value: {}\n\
            \    type: artifact_map\n  prompt:\n    default_value: ''\n    type: string\n  root_cell:\n    default_value:\
            \ ''\n    type: string\n  root_ref:\n    default_value: ''\n    type: string\noutputs:\n  disposition:\
            \ unchanged\n  merged: false\nschema_version: 2\nsequence: []\n"
      storage:
        files:
          PURPOSE.md: Own versions.
      root:
        files:
          PURPOSE.md: Own cell creation.
  mocks: &id002
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].title == "Preserve earlier note versions"
      && !("title" in c.inputs.recipes[0].inputs)) && calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].inputs.request
      == "Preserve earlier note versions." && c.inputs.recipes[0].inputs.consultant_cell == "storage")
- id: consultation-title-omitted
  type: integration_case
  inputs:
    create: false
    request_fields: {}
  runtime: *id001
  mocks: *id002
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].title == "Consult storage about delegated
      work" && !("title" in c.inputs.recipes[0].inputs)) && calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].inputs.request
      == "Preserve earlier note versions." && c.inputs.recipes[0].inputs.consultant_cell == "storage")
- id: consultation-title-null
  type: integration_case
  inputs:
    create: false
    request_fields:
      title: null
  runtime: *id001
  mocks: *id002
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].title == "Consult storage about delegated
      work" && !("title" in c.inputs.recipes[0].inputs)) && calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].inputs.request
      == "Preserve earlier note versions." && c.inputs.recipes[0].inputs.consultant_cell == "storage")
- id: consultation-title-blank
  type: integration_case
  inputs:
    create: false
    request_fields:
      title: " \t\n "
  runtime: *id001
  mocks: *id002
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].title == "Consult storage about delegated
      work" && !("title" in c.inputs.recipes[0].inputs)) && calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].inputs.request
      == "Preserve earlier note versions." && c.inputs.recipes[0].inputs.consultant_cell == "storage")
- id: creation-title-explicit
  type: integration_case
  inputs:
    create: true
    request_fields:
      title: Preserve earlier note versions
  runtime: *id001
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].title == "Preserve earlier note versions"
      && !("title" in c.inputs.recipes[0].inputs)) && calls.exists(c,c.op == "recipes.run" && c.cell == "root" &&
      c.inputs.recipes[0].inputs.documents["create-request.json"].value.request.request == "Preserve earlier note
      versions.")
- id: creation-title-omitted
  type: integration_case
  inputs:
    create: true
    request_fields: {}
  runtime: *id001
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].title == "Create requested cell" && !("title"
      in c.inputs.recipes[0].inputs)) && calls.exists(c,c.op == "recipes.run" && c.cell == "root" && c.inputs.recipes[0].inputs.documents["create-request.json"].value.request.request
      == "Preserve earlier note versions.")
- id: creation-title-null
  type: integration_case
  inputs:
    create: true
    request_fields:
      title: null
  runtime: *id001
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].title == "Create requested cell" && !("title"
      in c.inputs.recipes[0].inputs)) && calls.exists(c,c.op == "recipes.run" && c.cell == "root" && c.inputs.recipes[0].inputs.documents["create-request.json"].value.request.request
      == "Preserve earlier note versions.")
- id: creation-title-blank
  type: integration_case
  inputs:
    create: true
    request_fields:
      title: " \t\n "
  runtime: *id001
  assertions:
  - type: cel_true
    expr: calls.exists(c,c.op == "recipes.run" && c.inputs.recipes[0].title == "Create requested cell" && !("title"
      in c.inputs.recipes[0].inputs)) && calls.exists(c,c.op == "recipes.run" && c.cell == "root" && c.inputs.recipes[0].inputs.documents["create-request.json"].value.request.request
      == "Preserve earlier note versions.")
- id: inline-consultation-does-not-launch-child
  type: integration_case
  inputs:
    inline: true
    request_fields:
      title: Preserve earlier note versions
  runtime: *id001
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: storage
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: answered
            reply: Fix stale writes in storage.
            work_kind: bug
            handoff: null
            files:
            - path: iter1/consultant/summary.md
              description: Consultation evidence
            - path: iter1/consultant/work/handoff.md
              description: Consultation evidence
            requests: null
            review_title: null
        artifacts:
          iter1/consultant/summary.md: '# Storage: prevent conflicting writes

            Preserve both drafts. The requester questioned retry behavior.

            '
          iter1/consultant/work/handoff.md: '# Storage bug: reject stale draft writes

            Work type: bug.

            Expected: stale writes fail. Observed: overwrite.

            Acceptance: preserve the earlier write and return a conflict.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                participant: consultant
                iteration: 1
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.valid && !calls.exists(c,c.op == "recipes.run")
