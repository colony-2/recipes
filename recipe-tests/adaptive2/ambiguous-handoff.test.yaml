recipe: ambiguous-handoff.yaml
cases:
- id: ambiguous-acceptance-cannot-authorize-third-assignment
  type: integration_case
  runtime: {}
  mocks: &commands
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: valid
    value: false
  - type: cel_true
    expr: outputs.reason.contains("Several accepted assignments")
- id: selected-original-disambiguates-acceptance
  type: integration_case
  runtime: {}
  inputs:
    known: true
  mocks: *commands
  assertions:
  - type: output_equals
    path: valid
    value: true
