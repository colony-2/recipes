id: optional-dependency-discussion
inputs:
  enabled: ${{ inputs.enabled }}
  dependencies: ${{ inputs.dependencies }}
  documents: ${{ inputs.documents }}
state:
  initial:
  - to: ask
    when: inputs.enabled
  - to: skip
    when: true
  states:
    skip:
      sequence: []
    ask:
      include: ../../recipes/adaptive2/dependency-discussion.yaml
      inputs:
        dependencies: ${{ inputs.dependencies }}
        documents: ${{ inputs.documents }}
outputs:
  documents: ${{ state_output('ask','documents',inputs.documents) }}
  response: ${{ state_output('ask','response',{}) }}
