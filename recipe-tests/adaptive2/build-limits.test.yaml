recipe: ../../recipes/adaptive2/build.yaml
cases:
- id: implementation-limit-continues-with-retained-candidate
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
    responses:
    - node_path: adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - node_path: adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/autonomous_limit/sequence/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
    - node_path: adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
    observe_files:
    - candidate.txt
  inputs:
    prompt: Explain why no changes are needed.
    max_iterations: 1
  mocks:
    ops:
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: feature
            summary: Agree on the requested outcome before implementation.
            files:
            - path: one-pager.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for root feature: preserve the requested behavior'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions: null
            review_title: 'Approve 1p for root feature: preserve the requested behavior'
            requests: null
            packages: null
        artifacts:
          one-pager.md: '# Preserve the requested behavior


            ## Problem Description

            The requested outcome needs verification.


            ## Non Goals

            Unrelated changes.


            ## What we are planning to do

            Implement the request and verify its acceptance checks.


            ## Compat/Upgrade

            Keep existing interfaces.


            ## Key challenges/design questions & answers

            | Question | Answer |

            | --- | --- |

            | What proves completion? | The approved test statements. |

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - &id002
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths: null
            questions: []
        artifacts:
          test-statements.md: '# Expectations

            - T1 [Critical] [integration] [README.md] [Git] Existing behavior remains available.'
          handoff.md: '# Execution assignment

            Complete the requested bounded work against test-statements.md. Use settled decisions and preserve existing behavior.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id003
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: continue
            summary: The candidate is saved; one verification problem remains.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: '# Outcome

            Already satisfied.'
          test-results.md: '# Results

            T1 passed; existing behavior inspected.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            candidate.txt: corrected
    - &id004
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
    - &id007
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: '# Outcome

            Already satisfied.'
          test-results.md: '# Results

            T1 passed; existing behavior inspected.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id008
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: '# Review

            Evidence checked.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id009
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: '# Review

            Evidence checked.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - &id005
      match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.merged && outputs.disposition == "implemented"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "rebase")) == 1 && size(calls.filter(c, c.op == "merge")) == 1
  - type: cel_true
    expr: repositories.root.files["candidate.txt"] == "corrected"
  - type: cel_true
    expr: calls.filter(c, c.op == "squash")[0].inputs.commit_message.startsWith("Improve candidate\n\n")
  - type: output_equals
    path: process
    value: adaptive2
  - type: cel_true
    expr: size(reviews) == 3 && calls.filter(c,c.node_path.contains("/work/") && c.op == "extension_execution").size() == 4
- id: new-implementation-form-rejects-legacy-stop
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
    responses:
    - node_path: adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - node_path: adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/autonomous_limit/sequence/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: stop
    observe_files:
    - candidate.txt
    expect_error: 'fields.action: invalid multiple_choice answer'
  inputs:
    prompt: Explain why no changes are needed.
    max_iterations: 1
  mocks:
    ops:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
  assertions:
  - type: cel_true
    expr: '!calls.exists(c,c.op in ["merge","squash"]) && calls.filter(c,c.node_path.contains("/work/") && c.op == "extension_execution").size()==3'
