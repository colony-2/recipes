recipe: accepted-recovery.yaml
cases:
- id: recovery-source-cannot-bypass-current-assignment
  type: integration_case
  inputs:
    changed: true
  runtime: {}
  assertions:
  - type: cel_true
    expr: '!outputs.accepted.valid && outputs.accepted.reason.contains("assignment was changed")'
  - type: cel_true
    expr: '"error/rejected-handoff/handoff.md" in outputs.accepted.rejected && outputs.accepted.restored["work/storage/handoff.md"].value
      == "Receiver owns draft persistence."'
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
- id: unchanged-current-assignment-still-accepted
  type: integration_case
  runtime: {}
  assertions:
  - type: cel_true
    expr: outputs.accepted.valid && size(outputs.accepted.rejected)==0
- id: supporting-files-can-change-without-reopening-assignment
  type: integration_case
  inputs:
    supporting:
      evidence.md:
        kind: value
        name: evidence.md
        format: text
        value: Updated observations.
      regression.log:
        kind: value
        name: regression.log
        format: text
        value: New failure evidence.
  runtime: {}
  assertions:
  - type: cel_true
    expr: outputs.accepted.valid && size(outputs.accepted.rejected)==0
  - type: cel_true
    expr: outputs.accepted.documents['evidence.md'].value == 'Updated observations.' && outputs.accepted.documents['regression.log'].value == 'New failure evidence.'
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/compare")) && size(outputs.accepted.restored) == 1'
