recipe: accepted-recovery.yaml
cases:
- id: recovery-source-cannot-bypass-current-assignment
  type: integration_case
  inputs:
    changed: true
  runtime: {}
  assertions:
  - type: cel_true
    expr: '!outputs.accepted.valid && outputs.accepted.reason.contains("assignment was changed")'
  - type: cel_true
    expr: '"error/rejected-handoff/handoff.md" in outputs.accepted.rejected && outputs.accepted.restored["work/storage/handoff.md"].value
      == "Receiver owns draft persistence."'
  mocks:
    ops:
    - match:
        op: command_execution
      behavior:
        mode: passthrough
- id: unchanged-current-assignment-still-accepted
  type: integration_case
  runtime: {}
  assertions:
  - type: cel_true
    expr: outputs.accepted.valid && size(outputs.accepted.rejected)==0
