- id: unknown-retention-changes-decision
  type: integration_case
  inputs:
    parent: true
    own_cell: notebook
    message: People need to recover at least three previous saved versions. The local
      storage contract documents save/load but says nothing about retention or history.
      This repository has no storage implementation or retained consultation results.
      Decide whether to reuse storage or request new history support; ask its owner
      for a bounded explanation if needed. Publish answer.md explaining your next
      action.
  runtime:
    cell: notebook
    cells:
      notebook:
        files:
          PURPOSE.md: Own notebook UI; storage owns persistence.
          CONTRACT.md: storage save(note, text) and load(note) persist the current
