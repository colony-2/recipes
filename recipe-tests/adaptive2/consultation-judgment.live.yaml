# Responses require semantic review against CJ-04–CJ-08; output presence is not a behavior pass.
recipe: consultation-judgment.yaml
live: true
cases:
- id: receiver-corrects-false-premise
  type: integration_case
  inputs:
    message: I own notebook. People need drafts to survive process restart. Storage
      only keeps drafts in memory, so I propose a new persistent backend. Does that
      fit your code and what would you change?
  runtime:
    cell: storage
    cells:
      storage:
        files:
          PURPOSE.md: Own draft persistence and restore APIs.
          drafts.py: "import sqlite3\n\ndef save(path, text):\n    with sqlite3.connect(path)\
            \ as db:\n        db.execute(\"CREATE TABLE IF NOT EXISTS drafts (text\
            \ TEXT)\")\n        db.execute(\"INSERT INTO drafts VALUES (?)\", (text,))\n\
            \ndef history(path):\n    with sqlite3.connect(path) as db:\n        return\
            \ db.execute(\"SELECT rowid, text FROM drafts ORDER BY rowid DESC\").fetchall()\n\
            \ndef restore(path, version):\n    with sqlite3.connect(path) as db:\n\
            \        text = db.execute(\"SELECT text FROM drafts WHERE rowid = ?\"\
            , (version,)).fetchone()[0]\n    save(path, text)\n"
          CONTRACT.md: save commits each version to SQLite on disk. history returns
            all saved versions. restore appends a selected version as a new save.
            Existing clients remain supported.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: has(outputs.response)
