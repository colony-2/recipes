recipe: limit-decision.yaml
cases:
- id: continue-uses-exact-allowance-with-fallback
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
  mocks:
    ops:
    - &id001
      match: &id002
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
  assertions:
  - type: output_equals
    path: allowance
    value: 2
  - type: cel_true
    expr: size(outputs.receipts) == 1 && size(reviews) == 1
  - type: review_document_exists
    node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
    path: limit-review.md
  - type: cel_true
    expr: reviews[0].form.fields[0].options[0].value == "answer" && reviews[0].form.fields[0].options[0].label == "respond only" && reviews[0].form.fields[0].options.filter(o,o.value
      != "answer").all(o,o.label.startsWith("[Resolve]")) && !reviews[0].form.fields[0].options.exists(o,o.value == "stop")
