- id: respond-only-repeated-history
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: answer
        feedback: Implement it now?
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: answer
        feedback: Why that limit?
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
  mocks:
    ops:
    - *id001
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            answer: First answer.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            answer: Second answer.
  assertions:
  - type: output_equals
    path: action
    value: continue
  - type: output_equals
    path: allowance
    value: 2
  - type: cel_true
    expr: size(reviews)==3 && size(outputs.receipts)==3 && size(outputs.discussion)==2 && outputs.discussion[0].question == "Implement it now?" && outputs.discussion[0].answer
      == "First answer." && outputs.discussion[1].answer == "Second answer." && outputs.discussion[0].receipt == outputs.receipts.filter(r,r.request_id == outputs.discussion[0].receipt.request_id)[0]
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution").size() == 3 && calls.filter(c,c.op == "extension_execution").all(c,c.node_path.endsWith("/start_read_only_session")
      && !has(c.inputs.inputs.session)) && !calls.exists(c,c.op in ["merge","squash","recipes.run","command_execution"])
  - type: cel_true
    expr: calls.filter(c,c.node_path.contains("/discuss/"))[1].artifacts["resolver-context.json"].contains("First answer.") && calls.filter(c,c.node_path.contains("/discuss/"))[1].artifacts["resolver-context.json"].contains("Implement
      it now?")
  - type: cel_true
    expr: calls.filter(c,c.op == "input")[1].inputs.form.documents["limit-review.md"].value.contains("First answer.") && calls.filter(c,c.op == "input")[2].inputs.form.documents["limit-review.md"].value.contains("First
      answer.") && calls.filter(c,c.op == "input")[2].inputs.form.documents["limit-review.md"].value.contains("Second answer.")
  - type: cel_true
    expr: outputs.discussion[0].receipt == reviews[0].receipt && outputs.discussion[1].receipt == reviews[1].receipt && reviews[0].request_id != reviews[1].request_id
      && outputs.discussion[0].review_documents["limit-review.md"] == calls.filter(c,c.op == "input")[0].inputs.form.documents["limit-review.md"]
