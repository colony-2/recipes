- id: contradictory-feedback-asks-again
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
        feedback: Stop this work now.
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: increase
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            consistent: false
            explanation: Choose Stop or confirm that work should continue; the current message asks for both.
  assertions:
  - type: output_equals
    path: allowance
    value: 4
  - type: cel_true
    expr: size(reviews)==2 && size(outputs.receipts)==2
- id: invalid-explanation-uses-safe-fallback
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: false
          response:
            approach:
              invalid: object
  assertions:
  - type: output_equals
    path: allowance
    value: 2
  - type: cel_true
    expr: size(outputs.receipts) == 1 && size(reviews) == 1
  - type: review_document_exists
    node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
    path: limit-review.md
  - type: cel_true
    expr: reviews[0].form.fields[0].options.exists(o,o.value == "fresh")
  inputs:
    kind: correction
- id: feedback-check-failure-asks-again
  type: integration_case
  runtime:
    responses:
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: continue
        feedback: Stop this work now.
    - node_path: limit-trial/decide/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: increase
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: fail
        error:
          message: Model transport unavailable
  assertions:
  - type: output_equals
    path: allowance
    value: 4
  - type: cel_true
    expr: size(reviews)==2 && size(outputs.receipts)==2
