schema_version: 2
id: response-repair-probe
input_schema:
  kind:
    type: string
    default_value: correction
  attempts:
    type: number
    default_value: 2
  checkpoint:
    type: boolean
    default_value: true
  submitted_children:
    type: boolean
    default_value: false
inputs:
  kind: ${{ inputs.kind }}
  attempts: ${{ inputs.attempts }}
  checkpoint: ${{ inputs.checkpoint }}
  submitted_children: ${{ inputs.submitted_children }}
state:
  initial: choose
  states:
    choose:
      sequence: []
      transitions:
      - to: agent
        when: inputs.kind == 'agent'
      - to: correction
        when: true
    correction:
      include: ../../recipes/adaptive2/response-repair.yaml
      inputs:
        turn:
          result:
            response: {}
          documents: {}
          artifacts: {}
          jobs: "${{ inputs.submitted_children ? {'job_ids':['already-submitted']} : {} }}"
        issues:
        - Missing response artifacts
        documents: {}
        attempts: ${{ inputs.attempts }}
        session: "${{ inputs.checkpoint ? {'task_id':'fixture-checkpoint'} : {} }}"
      catch:
      - when: true
        continue:
          outputs:
            failed: true
            code: ${{ failure.code }}
            cause: ${{ failure }}
    agent:
      include: ../../recipes/adaptive/agent-turn.yaml
      inputs:
        prompt: Resume checks
        schema:
          type: object
        documents: {}
        read_only: false
      catch:
      - when: true
        continue:
          outputs:
            failed: true
            code: ${{ failure.code }}
            cause: ${{ failure }}
outputs:
  result: "${{ state_exists('agent') ? states.agent.outputs : states.correction.outputs }}"
