schema_version: 2
id: child-limit
outputs:
  complete: true
state:
  initial: decision
  states:
    decision:
      include: ./adaptive2/limit-decision.yaml
      inputs:
        request: Finish checking the contact importer.
        summary: The importer is saved; duplicate matching remains.
        issues:
        - Two different checks still find duplicate contacts.
        allowance: 2
        used: 2
        kind: implementation
        can_resume: true
      transitions:
      - to: stop
        when: outputs.action == 'stop'
      - to: finish
        when: true
    stop:
      include: ./adaptive/operational-failure.yaml
      inputs:
        code: ADAPTIVE_STOPPED_BY_USER
        reason: The human stopped this attempt at an automatic-work limit. Work remains incomplete; retained results are not approval to publish or silently retry. Separately running children may continue.
        documents: ${{ states.decision.outputs.documents }}
    finish:
      sequence: []
