schema_version: 2
id: budget-probe
input_schema:
  receipts:
    type: array
    items:
      type: object
    default_value: []
  work:
    type: array
    items:
      type: object
    default_value: []
  phase:
    type: string
    default_value: implement
  assignment:
    type: string
    default_value: ''
inputs:
  receipts: ${{ inputs.receipts }}
  work: ${{ inputs.work }}
  phase: ${{ inputs.phase }}
  assignment: ${{ inputs.assignment }}
sequence:
- id: budget
  include: ../../recipes/adaptive2/autonomous-budget.yaml
  inputs:
    receipts: ${{ inputs.receipts }}
    work: ${{ inputs.work }}
    phase: ${{ inputs.phase }}
    assignment: ${{ inputs.assignment }}
    limit: 1
outputs:
  human_round: ${{ sequence.budget.outputs.human_round }}
  human_reply: ${{ sequence.budget.outputs.human_reply }}
  used: ${{ sequence.budget.outputs.used }}
  exhausted: ${{ sequence.budget.outputs.exhausted }}
