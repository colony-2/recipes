schema_version: 2
id: budget-probe
input_schema:
  receipts:
    type: array
    items:
      type: object
    default_value: []
  work:
    type: array
    items:
      type: object
    default_value: []
  phase:
    type: string
    default_value: implement
  assignment:
    type: string
    default_value: ''
  override_round:
    type: number
    default_value: -1
  override_allowance:
    type: number
    default_value: 0
  limit:
    type: number
    default_value: 1
inputs:
  receipts: ${{ inputs.receipts }}
  work: ${{ inputs.work }}
  phase: ${{ inputs.phase }}
  assignment: ${{ inputs.assignment }}
  override_round: ${{ inputs.override_round }}
  override_allowance: ${{ inputs.override_allowance }}
  limit: ${{ inputs.limit }}
sequence:
- id: budget
  include: ../../recipes/adaptive2/autonomous-budget.yaml
  inputs:
    receipts: ${{ inputs.receipts }}
    work: ${{ inputs.work }}
    phase: ${{ inputs.phase }}
    assignment: ${{ inputs.assignment }}
    limit: ${{ inputs.limit }}
    override_round: ${{ inputs.override_round }}
    override_allowance: ${{ inputs.override_allowance }}
outputs:
  human_round: ${{ sequence.budget.outputs.human_round }}
  human_reply: ${{ sequence.budget.outputs.human_reply }}
  used: ${{ sequence.budget.outputs.used }}
  exhausted: ${{ sequence.budget.outputs.exhausted }}
  limit: ${{ sequence.budget.outputs.limit }}
