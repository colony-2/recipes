schema_version: 2
id: recovery-approval-guards
input_schema:
  source_cell:
    type: string
    default_value: storage
inputs:
  source_cell: ${{ inputs.source_cell }}
sequence:
- id: source
  op: recipes.run
  inputs:
    recipes:
    - cell_name: ${{ inputs.source_cell }}
      name: terminal-source
    wait:
      on: job
      condition: complete
- id: await_source
  include: ../../recipes/adaptive/await-child.yaml
  inputs:
    job: ${{ sequence.source.outputs.job_ids[0] }}
- id: approval
  include: ../../recipes/adaptive2/recovery-approval.yaml
  inputs:
    source_job: ${{ sequence.source.outputs.job_ids[0] }}
outputs:
  valid: ${{ sequence.approval.outputs.valid }}
  reason: ${{ sequence.approval.outputs.reason }}
