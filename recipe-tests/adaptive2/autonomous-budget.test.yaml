recipe: autonomous-budget.yaml
cases:
- id: saved-receipt-replay-does-not-renew
  type: integration_case
  inputs:
    receipts:
    - &id001
      request_id: review-1
      submission_id: answer-1
      actor: &id002
        kind: human
        id: reviewer
    - *id001
    work:
    - &id003
      human_round: 1
      human_reply: false
      phase: implement
      assignment: ''
      next: continue
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: true
  - type: output_equals
    path: human_round
    value: 1
- id: new-human-submission-renews
  type: integration_case
  inputs:
    receipts:
    - *id001
    - request_id: review-1
      submission_id: answer-2
      actor: *id002
    work:
    - *id003
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: false
  - type: output_equals
    path: human_round
    value: 2
- id: automatic-policy-is-not-human-input
  type: integration_case
  inputs:
    receipts:
    - {}
    work:
    - human_round: 0
      human_reply: false
      phase: implement
      assignment: ''
      next: continue
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: true
  - type: output_equals
    path: human_round
    value: 0
- id: grant-renews-only-its-round
  type: integration_case
  inputs:
    receipts:
    - &id004
      request_id: review-1
      submission_id: answer-1
      actor:
        kind: human
        id: reviewer
    - *id004
    work:
    - human_round: 1
      human_reply: false
      phase: implement
      assignment: ''
      next: continue
    override_round: 1
    override_allowance: 4
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: false
  - type: output_equals
    path: limit
    value: 4
- id: next-human-decision-expires-override
  type: integration_case
  inputs:
    receipts:
    - *id001
    - *id001
    - request_id: different
      submission_id: human-2
    work:
    - human_round: 1
      human_reply: false
      phase: implement
      assignment: ''
      next: continue
    override_round: 1
    override_allowance: 4
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: false
  - type: output_equals
    path: limit
    value: 1
- id: replayed-grant-does-not-renew
  type: integration_case
  inputs:
    receipts:
    - &id005
      request_id: review-1
      submission_id: answer-1
      actor:
        kind: human
        id: reviewer
    - *id005
    work:
    - *id003
    - *id003
    - *id003
    - *id003
    override_round: 1
    override_allowance: 4
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: true
  - type: output_equals
    path: limit
    value: 4
- id: disabled-budget-stays-disabled
  type: integration_case
  inputs:
    receipts:
    - &id006
      request_id: review-1
      submission_id: answer-1
      actor:
        kind: human
        id: reviewer
    - *id006
    work:
    - human_round: 1
      human_reply: false
      phase: implement
      assignment: ''
      next: continue
    override_round: 1
    override_allowance: 4
    limit: 0
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
