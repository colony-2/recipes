recipe: autonomous-budget.yaml
cases:
- id: saved-receipt-replay-does-not-renew
  type: integration_case
  inputs:
    receipts:
    - &id001
      request_id: review-1
      submission_id: answer-1
      actor: &id002
        kind: human
        id: reviewer
    - *id001
    work:
    - &id003
      human_round: 1
      human_reply: false
      phase: implement
      assignment: ''
      next: continue
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: true
  - type: output_equals
    path: human_round
    value: 1
- id: new-human-submission-renews
  type: integration_case
  inputs:
    receipts:
    - *id001
    - request_id: review-1
      submission_id: answer-2
      actor: *id002
    work:
    - *id003
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: false
  - type: output_equals
    path: human_round
    value: 2
- id: automatic-policy-is-not-human-input
  type: integration_case
  inputs:
    receipts:
    - {}
    work:
    - human_round: 0
      human_reply: false
      phase: implement
      assignment: ''
      next: continue
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  assertions:
  - type: output_equals
    path: exhausted
    value: true
  - type: output_equals
    path: human_round
    value: 0
