    cells:
      root:
        files:
          README.md: A bounded application.
        file_sources:
          .c2/recipes/prior-approval.yaml: approved-source.yaml
    responses:
    - node_path: prior-approved-work/direction/sequence/review
      fields:
        decision: revise
    - node_path: approved-recovery/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
    - node_path: approved-recovery/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
