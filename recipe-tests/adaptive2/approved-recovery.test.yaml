        decision: accept
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews) == 1 && !calls.exists(c,c.op == "extension_execution")
  - type: cel_true
    expr: size(calls.filter(c,c.op == "recipes.run")) == 1
