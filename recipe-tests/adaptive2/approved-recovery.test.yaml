recipe: approved-recovery.yaml
cases:
- id: approved-recovery-persists-candidate-without-new-direction
  type: integration_case
  inputs:
    history_rounds: 105
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
        file_sources:
          .c2/recipes/prior-approval.yaml: approved-source.yaml
    responses:
    - node_path: prior-approved-work/direction/sequence/review
      fields:
        decision: accept
    - node_path: approved-recovery/build/root/workflow/adaptive2-workflow/run/adaptive2-develop/accept/sequence/outcome_review/adaptive2-review/request_human_review
      fields:
        decision: accept
    observe_files:
    - candidate.txt
    - seed.txt
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Approved scope and tests are unchanged; continue implementation.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: implementation.md
              description: implementation.md
              title: implementation.md
              role: primary
              order: 0
            - path: test-results.md
              description: test-results.md
              title: test-results.md
              role: primary
              order: 1
            questions: []
        artifacts:
          implementation.md: "# Outcome\nAlready satisfied."
          test-results.md: "# Results\nT1 passed; existing behavior inspected."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
          worktree:
            candidate.txt: corrected
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: assessment.md
              description: assessment.md
              title: assessment.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          assessment.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            summary: Complete bounded work.
            files:
            - path: merge-review.md
              description: merge-review.md
              title: merge-review.md
              role: primary
              order: 0
            verdict: approve
            subject: Improve candidate
        artifacts:
          merge-review.md: "# Review\nEvidence checked."
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: merged
    value: true
  - type: cel_true
    expr: reviews.size() == 2
  - type: cel_true
    expr: calls.exists(c,c.node_path.contains("start_implementation_session") && c.worktree["seed.txt"].contains("Recovered candidate"))
  - type: cel_true
    expr: '!calls.exists(c,c.node_path.contains("/direction/sequence/review/adaptive2-review/"))'
- id: unavailable-source-stops-before-design-or-implementation
  type: integration_case
  inputs:
    source_job: nonexistent-recovery-source
  runtime:
    expect_error: Recovery approval inspection failed
    cells:
      root:
        files:
          README.md: A bounded application.
        file_sources:
          .c2/recipes/prior-approval.yaml: approved-source.yaml
    responses:
    - node_path: prior-approved-work/direction/sequence/review
      fields:
        decision: accept
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: size(reviews) == 1 && !calls.exists(c,c.op == "extension_execution")
  - type: cel_true
    expr: size(calls.filter(c,c.op == "recipes.run")) == 1
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("/inspect_approval"))
- id: active-source-stops-before-duplicate-work
