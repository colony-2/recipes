recipe: response-schema-contract.yaml
cases:
- id: agent-requests-satisfy-strict-provider-contract
  type: integration_case
  runtime: {}
  assertions:
  - type: cel_true
    expr: >-
      outputs.agent.properties.requests.items.properties.all(k,
        k in outputs.agent.properties.requests.items.required) &&
      outputs.agent.properties.requests.items.required.all(k,
        k in outputs.agent.properties.requests.items.properties)
  - type: cel_true
    expr: >-
      'resume_from' in outputs.agent.properties.requests.items.required &&
      'null' in outputs.agent.properties.requests.items.properties.resume_from.type
  - type: cel_true
    expr: >-
      outputs.agent.properties.requests.items.properties.dependency.properties.all(k,
        k in outputs.agent.properties.requests.items.properties.dependency.required) &&
      outputs.agent.properties.requests.items.properties.dependency.required.all(k,
        k in outputs.agent.properties.requests.items.properties.dependency.properties)
