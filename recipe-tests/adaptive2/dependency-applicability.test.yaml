  assertions:
  - type: cel_true
    expr: outputs.merged && outputs.disposition == "implemented"
  - type: cel_true
    expr: size(calls.filter(c, c.op == "rebase")) == 1 && size(calls.filter(c, c.op == "merge")) == 1
  - type: cel_true
    expr: repositories.root.files["candidate.txt"] == "corrected"
  - type: cel_true
    expr: calls.filter(c, c.op == "squash")[0].inputs.commit_message.startsWith("Improve candidate\n\n")
  - type: output_equals
    path: process
    value: adaptive2
  - type: cel_true
    expr: size(reviews) == 4
  - type: cel_true
    expr: size(events.filter(e,e.kind == "child_submitted")) == 2
  - type: cel_true
    expr: calls.exists(c,c.op == "recipe.await_result_soft" && c.outputs.status == "failed" && c.outputs.failure_message.contains("exit
      status 7"))
  - type: cel_true
    expr: outputs.coordination.exists(h,h.action == "reconcile" && h.dependency.decision == "local" && outputs.coordination.exists(a,a.action
      == "await" && a.job_id == h.job_id && a.result.status == "failed" && a.result.failure_message.contains("exit status
      7")))
  - type: cel_true
    expr: outputs.coordination.exists(h,h.action == "await" && h.result.status == "completed" && "handoff.md" in h.result.outputs.artifact_refs)
  - type: cel_true
    expr: calls.exists(c,c.node_path.endsWith("start_read_only_session/start_read_only_session") && has(c.outputs.response.next)
      && c.outputs.response.next == "coordinate")
  - type: cel_true
    expr: reviews.exists(r,r.node_path.contains("/questions/") && r.form.title == "Resolve remaining ownership" && r.receipt.submission_id
      != "")
  - type: cel_true
    expr: outputs.verification.status == "passed" && calls.exists(c,c.node_path.endsWith("dependency-current-verification/check")
      && c.outputs.stdout == "passed")
