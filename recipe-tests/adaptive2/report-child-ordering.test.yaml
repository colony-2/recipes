recipe: ../../recipes/adaptive2/build.yaml
cases:
- id: before-first-report-terminal-failed-report-correction
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic
      codex_api_key: synthetic
    cells:
      root:
        files:
          README.md: A bounded application.
      diagnostic:
        files:
          PURPOSE.md: Own disposable diagnostics.
      storage:
        files:
          PURPOSE.md: Own advice.
    responses:
    - node_path: adaptive2-build/workflow/adaptive2-workflow/run/adaptive2-develop/direction/sequence/review/adaptive2-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Explain why no changes are needed.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            work_kind: feature
            summary: Agree on the requested outcome before implementation.
            files:
            - path: one-pager.md
              description: Direction for saving unfinished notes
              title: 'Approve 1p for root feature: preserve the requested behavior'
              role: primary
              order: 0
              source_paths:
              - request.md
            questions: null
            review_title: 'Approve 1p for root feature: preserve the requested behavior'
            requests: null
            packages: null
        artifacts:
          one-pager.md: '# Preserve the requested behavior


            ## Problem Description

            The requested outcome needs verification.


            ## Non Goals

            Unrelated changes.


            ## What we are planning to do

            Implement the request and verify its acceptance checks.


            ## Compat/Upgrade

            Keep existing interfaces.


            ## Key challenges/design questions & answers

            | Question | Answer |

            | --- | --- |

            | What proves completion? | The approved test statements. |

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: shape
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: Complete bounded work.
            files:
            - path: test-statements.md
              description: test-statements.md
              title: test-statements.md
              role: primary
              order: 0
            - path: handoff.md
              description: Settled execution assignment
              title: Execution handoff
              role: supporting
              order: 1
              source_paths: null
            questions: []
        artifacts:
          test-statements.md: '# Expectations

            - T1 [Critical] [integration] [README.md] [Git] Existing behavior remains available.'
          handoff.md: '# Execution assignment

            Complete the requested bounded work against test-statements.md. Use settled decisions and preserve existing behavior.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: coordinate
            summary: Ask the owner using retained evidence.
            files:
            - path: work/advice/
              description: work/advice/
            requests:
            - &id001
              action: consult
              cell: storage
              request: Explain the diagnostic evidence and safe next step.
              ref: main
              handoff: work/advice/
        artifacts:
          work/advice/request.md: Please assess the diagnostic.
          work/advice/probe.log: 'diagnostic evidence: exact retained bytes'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: report
          children:
          - recipe: fixtures/report-child.yaml
            cell: diagnostic
            inputs:
              fail: true
            await: terminal
            bind: diagnostic
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: coordinate
            summary: Ask the owner using retained evidence.
            files:
            - path: work/advice/request.md
              description: work/advice/request.md
            - path: work/advice/probe.log
              description: work/advice/probe.log
            requests:
            - *id001
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: report
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: storage
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: answered
            reply: Keep the diagnostic and address unfinished parent work.
            files:
            - path: iter1/consultant/summary.md
              description: iter1/consultant/summary.md
        artifacts:
          iter1/consultant/summary.md: Diagnostic advice; unfinished work remains.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: report
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        artifacts:
          diagnostic-scope.md: '# Diagnostic scope

            This failed diagnostic supplies evidence to the completed consultation. No source deliverable depends on diagnostic
            success. Preserve the actual failure and unfinished parent outcome.'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: report
        outputs_expr: '{"status": "completed", "output_schema_valid": true, "response": {"next": "coordinate", "summary":
          "Retain diagnostic failure as evidence; no delivery requirement depends on this diagnostic succeeding.", "files":
          [{"path": "diagnostic-scope.md", "description": "Diagnostic applicability evidence"}], "requests": [{"action": "reconcile",
          "dependency": {"job": children.diagnostic, "outcome": "Bounded diagnostic for consultation", "decision": "unnecessary",
          "rationale": "The bounded diagnostic supplies retained evidence, not a required acceptance outcome; parent work
          remains unfinished.", "evidence": ["diagnostic-scope.md"], "assignment": "", "acceptance": "", "continuations":
          []}}]}}'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: outside
            summary: Retain the evidence; unfinished parent work is not approved.
            files:
            - path: implementation.md
              description: implementation.md
            - path: test-results.md
              description: test-results.md
        artifacts:
          implementation.md: Unfinished parent work.
          test-results.md: Diagnostic only; acceptance remains open.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                turn: report
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: '!outputs.merged && !calls.exists(c,c.op == "merge")'
  - type: cel_true
    expr: size(calls.filter(c,c.cell == "diagnostic" && c.node_path == "report-child/probe")) == 1
  - type: cel_true
    expr: calls.exists(c,c.cell == "root" && c.node_path.contains("/resume_read_only_session/") && c.inputs.inputs.prompt.contains("report-only"))
  - type: cel_true
    expr: 'calls.exists(c,c.cell == "storage" && "probe.log" in c.artifacts && c.artifacts["probe.log"] == "diagnostic evidence:
      exact retained bytes")'
  - type: cel_true
    expr: 'calls.exists(c,c.cell == "root" && c.op == "extension_execution" && c.artifacts.exists(k,k.startsWith("results/")
      && k.endsWith("/status.md") && c.artifacts[k].contains("Status: failed")))'
  - type: cel_true
    expr: calls.filter(c,c.op == "recipe.await_result_soft").all(c,c.inputs.target.job == calls.filter(c,c.node_path == "report-child/probe")[0].job_id)
  - type: cel_true
    expr: calls.exists(c,c.cell == "root" && c.artifacts.exists(k,k.startsWith("error/children/") && c.artifacts[k].contains("native
      diagnostic failure evidence")))
  - type: cel_true
    expr: size(events.filter(e,e.kind == "child_submitted")) == 1 && events.exists(t,t.kind == "child_terminal" && events.exists(s,s.kind
      == "child_submitted" && s.job_id == t.job_id && s.position < t.position) && events.exists(r,r.kind == "fixture_return"
      && r.job_id == t.parent_job_id && r.node_path == t.node_path && r.position > t.position))
