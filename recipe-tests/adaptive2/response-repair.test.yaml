recipe: response-repair.yaml
cases:
- id: adaptive-response-repair-exhausted
  type: integration_case
  inputs:
    attempts: 2
  mocks:
    ops:
    - &id001
      match:
        op: command_execution
      behavior:
        mode: passthrough
      repeat: true
  runtime: {}
  assertions:
  - type: cel_true
    expr: 'outputs.result.failed && outputs.result.code == "ADAPTIVE_RESPONSE_REPAIR_EXHAUSTED" && outputs.result.cause.message.contains("Two
      automatic response corrections did not resolve: Missing response artifacts") && reviews.size() == 0'
- id: adaptive-response-repair-unavailable
  type: integration_case
  inputs:
    attempts: 0
  mocks:
    ops:
    - *id001
  runtime: {}
  assertions:
  - type: cel_true
    expr: 'outputs.result.failed && outputs.result.code == "ADAPTIVE_RESPONSE_REPAIR_UNAVAILABLE" && outputs.result.cause.message.contains("Response
      correction cannot safely resume this task: Missing response artifacts") && reviews.size() == 0'
