recipe: response-repair.yaml
cases:
- id: exhausted-correction-continues
  type: integration_case
  inputs:
    attempts: 2
    checkpoint: true
  mocks:
    ops:
    - &id001
      match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
  runtime:
    responses:
    - node_path: response-repair-probe/correction/correction/adaptive2-response-repair/decision/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: increase
  assertions:
  - type: cel_true
    expr: outputs.result.retry && outputs.result.allowance == 4 && outputs.result.limit == 6 && size(outputs.result.review_receipts)
      == 1
- id: missing-checkpoint-rebuilds-report
  type: integration_case
  inputs:
    attempts: 0
    checkpoint: false
  mocks:
    ops:
    - *id001
  runtime:
    responses:
    - node_path: response-repair-probe/correction/correction/adaptive2-response-repair/decision/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: fresh
  assertions:
  - type: cel_true
    expr: outputs.result.retry && size(outputs.result.session) == 0 && size(outputs.result.review_receipts) == 1
- id: submitted-side-effects-do-not-get-blind-retry
  type: integration_case
  inputs:
    submitted_children: true
    attempts: 2
  runtime:
    responses:
    - node_path: response-repair-probe/correction/correction/adaptive2-response-repair/decision/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: fresh
  mocks:
    ops:
    - *id001
  assertions:
  - type: cel_true
    expr: outputs.result.retry && size(outputs.result.session) == 0 && size(reviews)==1 && size(calls.filter(c,c.op
      == 'submit')) == 0
- id: synthetic-recorded-child-requires-resolution-before-allowance
  type: integration_case
  inputs:
    submitted_children: true
    attempts: 0
  runtime:
    responses:
    - node_path: response-repair-probe/correction/correction/adaptive2-response-repair/decision/decision/adaptive2-limit-decision/ask/sequence/review/adaptive2-review/request_human_review
      fields:
        action: fresh
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: failed
          output_schema_valid: false
          errorMessage: Explanation unavailable
  assertions:
  - type: cel_true
    expr: outputs.result.retry && size(outputs.result.session) == 0 && size(reviews)==1 && size(calls.filter(c,c.op
      == 'submit')) == 0
  - type: cel_true
    expr: '"error/submitted-jobs.json" in outputs.result.documents && calls.exists(c,c.op == "extension_execution"
      && "error/submitted-jobs.json" in c.artifacts && c.artifacts["error/submitted-jobs.json"].contains("already-submitted"))'
