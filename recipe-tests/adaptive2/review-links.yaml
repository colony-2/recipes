schema_version: 2
id: review-link-check
input_schema:
  documents:
    type: artifact_map
    default_value: {}
sequence:
- id: check
  include: ../../recipes/adaptive2/review-links.yaml
  inputs:
    documents: ${{ inputs.documents }}
outputs:
  issues: ${{ sequence.check.outputs.issues }}
inputs:
  documents: ${{ inputs.documents }}
