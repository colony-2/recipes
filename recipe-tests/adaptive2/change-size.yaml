schema_version: 2
id: change-size-probe
sequence:
- id: empty
  include: ../../recipes/adaptive/git-candidate.yaml
- id: edit
  op: command_execution
  inputs:
    run: |
      python3 - <<'PY'
      from pathlib import Path
      Path('core.py').write_text('new\nextra\n')
      Path('tests/case.py').write_text('test\nextra\nthird\n')
      Path('docs/guide.md').write_text('guide\n')
      Path('old.txt').rename('moved.txt')
      Path('empty.txt').touch()
      Path('odd\tname\n.txt').write_text('odd\n')
      Path('image.bin').write_bytes(b'\0binary')
      Path('mode.sh').chmod(0o755)
      PY
- id: first
  include: ../../recipes/adaptive/git-candidate.yaml
- id: followup
  op: command_execution
  inputs:
    run: |
      printf 'new\nextra\nanother\n' > core.py
- id: second
  include: ../../recipes/adaptive/git-candidate.yaml
  inputs:
    approved_candidate: ${{ sequence.first.outputs.candidate }}
    approved_diff: ${{ sequence.first.outputs.documents['merge-candidate.diff'] }}
outputs:
  empty: ${{ sequence.empty.outputs.candidate }}
  first: ${{ sequence.first.outputs.candidate }}
  second: ${{ sequence.second.outputs.candidate }}
