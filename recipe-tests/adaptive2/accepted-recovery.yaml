schema_version: 2
id: accepted-recovery
input_schema:
  changed:
    type: boolean
    default_value: false
  supporting:
    type: artifact_map
    default_value: {}
inputs:
  changed: ${{ inputs.changed }}
  supporting: ${{ inputs.supporting }}
sequence:
- id: accepted
  include: ../../recipes/adaptive2/accepted-handoff.yaml
  inputs:
    cell: storage
    directory: work/storage/
    resume_from: previously-approved-storage-job
    documents: >-
      ${{ jq([inputs.supporting, {'handoff.md': {'kind':'value','name':'handoff.md','format':'text',
      'value':inputs.changed ? 'Requester changed the scope.' : 'Receiver owns draft persistence.'} }], 'add') }}
    agreements:
    - cell: storage
      directory: work/storage/
      result:
        outcome: agreed
        work_kind: feature
        handoff: receiver/
        final_artifacts:
          receiver/evidence.md:
            kind: value
            name: receiver/evidence.md
            format: text
            value: Earlier observations.
          receiver/handoff.md:
            kind: value
            name: receiver/handoff.md
            format: text
            value: Receiver owns draft persistence.
outputs:
  accepted: ${{ sequence.accepted.outputs }}
