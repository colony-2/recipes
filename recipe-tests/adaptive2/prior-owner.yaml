schema_version: 2
id: prior-owner
sequence:
- id: assignment
  op: command_execution
  const: true
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      mkdir -p "$OUTBOX/recovery"
      printf '# Storage feature: preserve drafts\nImplement candidate.txt.\n' > "$OUTBOX/handoff.md"
      printf '# Tests\nCandidate behavior remains available.\n' > "$OUTBOX/test-statements.md"
      printf 'Use the saved receiver assignment.\n' > "$OUTBOX/recovery/provenance.md"
      printf 'Unrelated parent detail.\n' > "$OUTBOX/unrelated.md"
- id: approval
  include: ./approved-source.yaml
outputs:
  artifact_refs: ${{ sequence.assignment.artifacts }}
