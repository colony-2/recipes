<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Notebook</title>
<h1>Notebook</h1>
<label>Note <input id="note" value="welcome"></label>
<button id="open">Open</button>
<p><textarea id="text" rows="12" cols="60" aria-label="Note text"></textarea></p>
<button id="save">Save</button>
<p id="status" role="status"></p>
<script>
let version = 0;
const editor = document.querySelector('#text');
const status = document.querySelector('#status');
const note = document.querySelector('#note');
document.querySelector('#open').onclick = async () => {
  const response = await fetch('/drafts/' + encodeURIComponent(note.value));
  const draft = await response.json();
  editor.value = draft.text;
  version = draft.version;
  status.textContent = '';
};
document.querySelector('#save').onclick = async () => {
  const response = await fetch('/drafts/' + encodeURIComponent(note.value), {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text: editor.value, version})
  });
  if (!response.ok) { status.textContent = 'Save failed'; return; }
  version = (await response.json()).version;
  status.textContent = 'Saved';
};
</script>
</html>
