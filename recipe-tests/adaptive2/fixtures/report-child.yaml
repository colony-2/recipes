schema_version: 2
id: report-child
input_schema:
  fail:
    type: boolean
    default_value: false
inputs:
  fail: ${{ inputs.fail }}
sequence:
- id: probe
  op: command_execution
  inputs:
    run: |
      echo 'native diagnostic retained'
      if [ "$FAIL_PROBE" = true ]; then
        echo 'native diagnostic failure evidence' >&2
        exit 7
      fi
      echo 'native successful diagnostic artifact' > "$OUTBOX/diagnostic.txt"
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
      FAIL_PROBE: ${{ string(inputs.fail) }}
outputs:
  artifact_refs: ${{ sequence.probe.artifacts }}
  disposition: unchanged
  summary: ${{ sequence.probe.outputs.stdout }}
