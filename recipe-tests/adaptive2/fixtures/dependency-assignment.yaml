id: corrected-dependency-assignment
sequence:
- id: write_assignment
  op: command_execution
  inputs:
    run: echo 'Recipes owns the remaining local candidate. T1 requires current verification; prior diagnostic failure is preserved.' > "$OUTBOX/handoff.md"
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
outputs:
  disposition: unchanged
  artifact_refs: ${{ sequence.write_assignment.artifacts }}
