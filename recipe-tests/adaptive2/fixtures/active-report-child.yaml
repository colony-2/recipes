schema_version: 2
id: active-report-child
input_schema:
  fail:
    type: boolean
    default_value: false
inputs:
  fail: ${{ inputs.fail }}
sequence:
- id: release
  op: input
  inputs:
    form:
      request:
        title: Release diagnostic after report corrections
      response_schema:
        type: object
- id: probe
  op: command_execution
  inputs:
    run: "echo 'native diagnostic retained'\nif [ \"$FAIL_PROBE\" = true ]; then\n  echo 'native diagnostic failure\
      \ evidence' >&2\n  exit 7\nfi\necho 'native successful diagnostic artifact' > \"$OUTBOX/diagnostic.txt\"\n"
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
      FAIL_PROBE: ${{ string(inputs.fail) }}
outputs:
  artifact_refs: ${{ sequence.probe.artifacts }}
  disposition: unchanged
  summary: ${{ sequence.probe.outputs.stdout }}
