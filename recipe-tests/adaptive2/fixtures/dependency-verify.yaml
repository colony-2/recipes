id: dependency-current-verification
sequence:
- id: check
  op: command_execution
  const: true
  inputs:
    run: |
      if test "$(cat candidate.txt)" = corrected && ! test -f force-verification-failure; then printf passed; else printf failed; fi
outputs:
  api_version: c2.build-hook/v1
  status: ${{ sequence.check.outputs.stdout }}
  summary: Check the actual current local candidate content.
  artifact_refs: {}
