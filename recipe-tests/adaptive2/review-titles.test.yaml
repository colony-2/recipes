recipe: review-titles.yaml
cases:
- id: exact-path-without-title
  type: integration_case
  runtime: &runtime
    responses:
    - node_path: review-titles/review/adaptive2-review/request_human_review
      fields:
        decision: accept
  mocks: &commands
    ops:
    - match:
        op: command_execution
      repeat: true
      behavior:
        mode: passthrough
  assertions: &accepted
  - type: output_equals
    path: response.fields.decision
    value: accept
  - type: cel_true
    expr: size(reviews) == 1 && calls.filter(c,c.op == "input").size() == 1 && !outputs.changed
  - type: cel_true
    expr: calls.exists(c,c.node_path == "review-titles/compare_bytes") && !calls.exists(c,c.op == "extension_execution" || c.node_path.contains("repair"))
  - type: cel_true
    expr: outputs.expected.all(id, reviews[0].form.document_metadata[id].title == outputs.expected[id])
  - type: cel_true
    expr: reviews[0].form.document_metadata.all(id, size(reviews[0].form.document_metadata[id].title) <= 120)
  - type: cel_true
    expr: size(outputs.documents) == size(outputs.original) - 1 && !("unselected.md" in outputs.documents) && outputs.documents.all(id, outputs.documents[id] == outputs.original[id])
  - type: cel_true
    expr: reviews[0].form.documents == outputs.documents && outputs.documents.all(id, outputs.documents[id].kind == "stored" && outputs.documents[id].name == id)
  - type: cel_true
    expr: outputs.expected.all(id, reviews[0].form.document_metadata[id].role == "diagnostic" && reviews[0].form.document_metadata[id].order == 17 && reviews[0].form.document_metadata[id].description == "Original evidence description" && reviews[0].form.document_metadata[id].source_document_ids == ["source.md"])
  - type: cel_true
    expr: reviews[0].form.overview_document_id == "merge-review.md" && reviews[0].form.document_metadata["merge-review.md"].title == "Merge decision" && reviews[0].form.document_metadata["merge-review.md"].role == "primary" && reviews[0].form.document_metadata["merge-review.md"].order == 0
  - type: cel_true
    expr: reviews[0].form.document_metadata["test-statements.md"].title == outputs.mapped_title && reviews[0].form.document_metadata["test-statements.md"].role == "supporting" && reviews[0].form.document_metadata["test-statements.md"].order == 1
  - type: cel_true
    expr: reviews[0].form.fields == [{"id":"decision","type":"multiple_choice","question":"Merge these changes?","required":true,"options":[{"value":"accept","label":"Merge"},{"value":"revise","label":"Revise"}],"validation":{}}]
- id: exact-path-with-explicit-title
  type: integration_case
  runtime: *runtime
  mocks: *commands
  inputs:
    samples:
      evidence/iter1/consultant/api-question/evidence/draft-conflict-evidence-023-preserve-original-write-and-review-accepted-retry-contract.md:
        descriptor:
          title: Preserve original write and accept retry
        expected: Preserve original write and accept retry
  assertions: *accepted
