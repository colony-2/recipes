recipe: ../build.yaml
cases:
- id: build-without-purpose
  type: integration_case
  runtime:
    secrets:
      jev_api_key: synthetic-jev
      codex_api_key: synthetic-build-credential
    config:
      codex_api_base_url: https://fixture.invalid/v1
    cells:
      root:
        files:
          candidate.txt: original
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
              target_directory: ${{ inputs.target_directory }}
            sequence:
            - id: run_suite
              op: command_execution
              const: true
              inputs:
                env:
                  TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  cd "$TARGET" || exit 1
                  if (
                  bash ./build.sh
                  ) > "$OUTBOX/tests.log" 2>&1; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.run_suite.outputs.stdout }}
              summary: Fixture repository checks completed.
              artifact_refs: "${{ {'tests.log': sequence.run_suite.artifacts['tests.log']} }}"
    observe_files:
    - candidate.txt
    - unapproved.txt
    responses:
    - node_path:
        build/run/heavy/heavy/develop/approval/sequence/plan_review/kernel-review/request_human_review
      fields:
        decision: approve
    - node_path:
        build/run/heavy/heavy/develop/accept/sequence/outcome_review/kernel-review/request_human_review
      fields:
        decision: accept
  inputs:
    prompt: Improve the requested behavior.
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#jev
      behavior:
        mode: return
        outputs:
          answers:
            is_heavy: {type: noul, noul: 0.99}
    - repeat: true
      match:
        node_path:
          build/run/heavy/heavy/develop/accounting/sequence/review/build-merge-review/reviewer/kernel-agent-turn/start_read_only_session/start_read_only_session
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            verdict: approve
            subject: Improve requested behavior with verified coverage
            review_message: Implement the approved behavior and verify it with build.sh. Independent
              assessment and file accounting found the changes appropriate.
            files:
            - path: build.sh
              change: A
              reason: Exercise the approved behavior with an automated check.
            - path: candidate.txt
              change: M
              reason: Implement the approved behavior in this file.
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: design response
            files:
            - path: design.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          design.md: '# design evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: design
                turn: 1review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: test-plan response
            files:
            - path: test-statements.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts: {}
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: test-plan
                turn: 1review
          artifact_files:
            test-statements.md: build-kernel-statements.md
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Independent plan assessment
            assessment: pass
            files:
            - path: iter1/consultant/plan-review.md
              description: Review evidence
        artifacts:
          iter1/consultant/plan-review.md: '# Independent findings'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                expert: plan
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            next: review
            summary: implement response
            files:
            - path: implementation.md
              description: Review evidence
            questions: []
            consultations: []
            keys: []
        artifacts:
          implementation.md: '# implement evidence'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: implement
                turn: 1review
          worktree:
            candidate.txt: implemented behavior
            build.sh: |
              #!/bin/sh
              test "$(cat candidate.txt)" = "implemented behavior"
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: Independent outcome assessment
            assessment: pass
            files:
            - path: iter1/consultant/outcome-review.md
              description: Review evidence
        artifacts:
          iter1/consultant/outcome-review.md: '# Independent findings'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                expert: outcome
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: merged
    value: true
  - type: output_equals
    path: disposition
    value: implemented
  - type: output_equals
    path: verification.status
    value: passed
  - type: cel_true
    expr: repositories.root.new_commits == 1
  - type: cel_true
    expr: repositories.root.files["candidate.txt"] == "implemented behavior"
  - type: cel_true
    expr: '!calls.exists(c, c.op == "extension_execution" && c.inputs.selector.contains("rule_gate"))'
  - type: cel_true
    expr: '!calls.exists(c, c.op.startsWith("recipe.run") || c.op == "recipes.run")'
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.instructions.contains("root PURPOSE.md")
  - type: cel_true
    expr: '!("instructions" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].inputs.inputs)'
  - type: cel_true
    expr: '!("instructions" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[3].inputs.inputs)'
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[3].inputs.inputs.session == calls.filter(c, c.op ==
      "extension_execution" && c.inputs.selector.endsWith("#codex"))[1].outputs.session
  - type: cel_true
    expr: '!calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.contains("result.json")'
  - type: cel_true
    expr: size(reviews) == 2
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[3].artifacts["test-statements.md"].contains("Build kernel test
      statements")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[4].worktree["candidate.txt"] == "implemented behavior"
  - type: cel_true
    expr: |-
      calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).all(c,
        c.inputs.inputs.prompt.contains("inbox: " + c.inputs.inputs.artifact_inbox_path)
        && c.inputs.inputs.prompt.contains("outbox: " + c.inputs.inputs.artifact_outbox_path)
        && c.inputs.inputs.prompt.contains("Omit the outbox/")
        && c.inputs.inputs.prompt.contains("relative to"))
