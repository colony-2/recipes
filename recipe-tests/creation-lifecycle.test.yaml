recipe: fixtures/create-main.yaml
cases:
  - id: required-wait-holds-until-real-initialization-is-released
    type: integration_case
    inputs:
      prompt: Create the approved cells.
    runtime:
      cells:
        root:
          files:
            PURPOSE.md: Project root
            keep.txt: original
          file_sources:
            .c2/recipes/initialize.yaml: fixtures/held-initialize.yaml
            recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
            .c2/recipes/initialize-real.yaml: ../recipes/create/initialize.yaml
        alpha: {}
        beta: {}
      responses:
        - node_path: create-main/run/create/root/review/review/creation-review/review/sequence/review/kernel-review/request_human_review
          fields:
            decision: approve
        - node_path: held-initialize/release
          cell: alpha
          response: {}
          after_call:
            node_path: create-main/run/create/root/publish/publish/publish-cells/publish/sequence/cell/await_initialization
            cell: alpha
            occurrence: 1
        - node_path: held-initialize/release
          cell: beta
          response: {}
          after_call:
            node_path: create-main/run/create/root/publish/publish/publish-cells/publish/sequence/cell/await_initialization
            cell: beta
            occurrence: 1
      observe_files:
        - .c2/config.yaml
        - keep.txt
        - PURPOSE.md
        - concurrent.txt
    mocks:
      ops:
        - match:
            node_path: create-main/run/create/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
          repeat: true
          behavior:
            mode: return
            outputs:
              success: true
            artifacts:
              registration.json: '{"id":"pre-registered-fixture"}'
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            artifacts:
              proposal.md: |-
                # Proposed cells
                Project fit, excluded alternatives, technology guidance and repository identities.
              cells/alpha/PURPOSE.md: |
                # alpha
                Approved responsibilities.
              cells/beta/PURPOSE.md: |
                # beta
                Approved responsibilities.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    phase: creation-review
            fixture_refs:
              alpha_repo:
                cell: alpha
                field: repo
              beta_repo:
                cell: beta
                field: repo
            outputs_fixture_expr: '{"status": "completed", "output_schema_valid": true, "response": {"outcome": "review", "summary": "Creation proposal", "cells": [{"name": "alpha", "repo": alpha_repo, "purpose_path": "cells/alpha/PURPOSE.md"}, {"name": "beta", "repo": beta_repo, "purpose_path": "cells/beta/PURPOSE.md"}], "files": [{"path": "proposal.md", "description": "Review document"}, {"path": "cells/alpha/PURPOSE.md", "description": "Review document"}, {"path": "cells/beta/PURPOSE.md", "description": "Review document"}], "questions": []}}'
        - repeat: true
          match:
            op: command_execution
          behavior:
            mode: passthrough
        - match:
            selector: ./recipes/kernel/render
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: repositories.root.new_commits == 0
      - type: cel_true
        expr: '!calls.exists(c, (c.op == "rebase" || (c.op == "squashrebasemerge" && c.cell == "root")))'
      - type: cel_true
        expr: calls.exists(c, c.op == "squashrebasemerge" && c.cell == "alpha" && "outputs" in c && size(c.outputs.merged_hash) == 40) && calls.exists(c, c.op == "squashrebasemerge" && c.cell == "beta" && "outputs" in c && size(c.outputs.merged_hash) == 40)
      - type: cel_true
        expr: calls.exists(c, c.node_path.endsWith("record_completed/creation-publication-record/record") && c.outputs.success && c.artifacts["created.json"].contains('"cell":"alpha"') && c.artifacts["created.json"].contains('"cell":"beta"'))
      - type: cel_true
        expr: outputs.disposition == "created" && outputs.merged && outputs.merged_hash == ""
      - type: cel_true
        expr: repositories.root.changed_files.size() == 0
      - type: cel_true
        expr: size(events.filter(e, e.kind == "gate_eligible")) == 2 && size(events.filter(e, e.kind == "response_release" && e.node_path == "held-initialize/release")) == 2
      - type: cel_true
        expr: events.filter(e, e.kind == "gate_eligible").all(g, events.exists(r, r.kind == "response_release" && r.response_index == g.response_index && r.position > g.position))
  - id: native-child-timeout-prevents-creation
    type: integration_case
    inputs:
      prompt: Create the approved cells.
      capture_failure: true
    runtime:
      cells:
        root:
          files:
