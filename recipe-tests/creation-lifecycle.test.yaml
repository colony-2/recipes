            artifacts:
              proposal.md: |-
                # Proposed cells
                Project fit, excluded alternatives, technology guidance and repository identities.
              cells/alpha/PURPOSE.md: |
                # alpha
                Approved responsibilities.
              cells/beta/PURPOSE.md: |
                # beta
                Approved responsibilities.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    phase: creation-review
            fixture_refs:
              alpha_repo:
                cell: alpha
                field: repo
              beta_repo:
                cell: beta
                field: repo
            outputs_fixture_expr: '{"status": "completed", "output_schema_valid": true, "response": {"outcome": "review", "summary": "Creation proposal", "cells": [{"name": "alpha", "repo": alpha_repo, "purpose_path": "cells/alpha/PURPOSE.md"}, {"name": "beta", "repo": beta_repo, "purpose_path": "cells/beta/PURPOSE.md"}], "files": [{"path": "proposal.md", "description": "Review document"}, {"path": "cells/alpha/PURPOSE.md", "description": "Review document"}, {"path": "cells/beta/PURPOSE.md", "description": "Review document"}], "questions": []}}'
        - repeat: true
          match:
            op: command_execution
          behavior:
            mode: passthrough
        - match:
            selector: ./recipes/kernel/render
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.failed && !("merged" in outputs)
      - type: cel_true
        expr: outputs.failure.node.op == "recipe.await_result"
      - type: cel_true
        expr: '!calls.exists(c, c.op == "squashrebasemerge")'
      - type: cel_true
        expr: size(calls.filter(c, c.op == "recipes.run")) == 1
      - type: cel_true
        expr: calls.exists(c, c.node_path.endsWith("record_pending/creation-publication-record/record") && c.artifacts["initializations.json"].contains("pending") && c.artifacts["initializations.json"].contains("job_id"))
      - type: cel_true
        expr: outputs.failure.kind == "timeout" && outputs.failure.code == "timeout_total" && outputs.failure.message.contains("scope total timed out")
