recipe: fixtures/build-coordinate-gates.yaml
cases:
- id: unapproved-agreement-cannot-submit
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Caller
  inputs:
    flow_json: '{"phase": "implement", "session": {}, "documents": {}, "threads": {"api": {"request":
      {"key": "api", "kind": "feature", "cell": "B", "ref": "main", "request": "Compatible API", "role":
      "API owner"}, "status": "completed", "result": {"outcome": "agreed"}}}, "jobs": {}, "approved":
      [], "root_cell": "R", "root_ref": "main", "build_recipe": "build", "consultation_recipe": "consultation",
      "create_recipe": ""}'
    action: submit
    keys_json: '["api"]'
    requests_json: '[]'
  assertions:
  - type: output_equals
    path: valid
    value: false
  - type: cel_true
    expr: '!calls.exists(c, c.op == "recipes.run" || c.op == "recipe.await_result_soft")'
