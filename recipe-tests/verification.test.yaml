recipe: ../recipes/develop/verify.yaml
cases:
- id: pass
  type: integration_case
  runtime:
    command_sandbox: none
    cells:
      root:
        files:
          .c2j/build.sh: 'printf ''verified output\n''

            '
  inputs:
    target_directory: .c2j
    timeout: 1s
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: true
  - type: output_equals
    path: result.status
    value: passed
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
- id: fail
  type: integration_case
  runtime:
    command_sandbox: none
    cells:
      root:
        files:
          .c2j/build.sh: 'echo failed; exit 7

            '
  inputs:
    target_directory: .c2j
    timeout: 1s
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: false
  - type: output_equals
    path: result.status
    value: failed
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
- id: timeout
  type: integration_case
  runtime:
    command_sandbox: none
    cells:
      root:
        files:
          .c2j/build.sh: 'echo starting; sleep 5

            '
  inputs:
    target_directory: .c2j
    timeout: 1s
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: false
  - type: output_equals
    path: result.status
    value: failed
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
  - type: output_equals
    path: result.timed_out
    value: true
- id: missing
  type: integration_case
  runtime:
    command_sandbox: none
    cells:
      root:
        files: {}
  inputs:
    target_directory: .c2j
    timeout: 1s
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: true
  - type: output_equals
    path: result.status
    value: skipped
  - type: cel_true
    expr: size(outputs.artifact_refs) == 1 && "verification.md" in outputs.artifact_refs
