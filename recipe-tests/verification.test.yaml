recipe: fixtures/verification.yaml
cases:
- id: pass
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/build.sh: |
            printf 'verified output\n'
  inputs:
    target_directory: .c2
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: true
  - type: output_equals
    path: result.status
    value: passed
  - type: output_equals
    path: result.timed_out
    value: false
  - type: cel_true
    expr: calls.filter(c, c.op == "command_execution").all(c, !("timeout" in c.inputs))
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
- id: fail
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/build.sh: |
            echo failed; exit 7
  inputs:
    target_directory: .c2
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: false
  - type: output_equals
    path: result.status
    value: failed
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
- id: external-timeout
  type: integration_case
  runtime: {}
  inputs:
    target_directory: .c2
  mocks:
    ops:
    - match:
        node_path: verification-fixture/check/development-verify/run_repository_checks
      behavior:
        mode: return
        outputs:
          stdout: ran
          stderr: ''
          success: false
          exit_code: -1
          timed_out: true
        artifacts:
          build.log: |
            starting
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: false
  - type: output_equals
    path: result.status
    value: failed
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
  - type: output_equals
    path: result.timed_out
    value: true
- id: missing
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/README.md: This target has no build script.
  inputs:
    target_directory: .c2
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: false
  - type: output_equals
    path: result.status
    value: skipped
  - type: cel_true
    expr: size(outputs.artifact_refs) == 1 && "verification.md" in outputs.artifact_refs
- id: missing-target-directory
  type: integration_case
  runtime:
    cells:
      root:
        files:
          build.sh: |
            printf 'This root script must not run for a missing target.\n'
  inputs:
    target_directory: missing-target
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: false
  - type: output_equals
    path: result.status
    value: failed
  - type: cel_true
    expr: size(outputs.artifact_refs) == 1 && !("build.log" in outputs.artifact_refs)
- id: script-and-explicit-command
  type: integration_case
  runtime:
    cells:
      root:
        files:
          build.sh: 'printf "script-ran\n"

            '
  inputs:
    target_directory: .
    command: printf "extra-ran\n"
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: passed
  - type: output_equals
    path: result.exit_code
    value: 0
  - type: cel_true
    expr: outputs.build_log.contains("script-ran")
  - type: cel_true
    expr: outputs.build_log.contains("extra-ran")
- id: script-failure-cannot-be-bypassed
  type: integration_case
  runtime:
    cells:
      root:
        files:
          build.sh: 'printf "script-failed\n"; exit 7

            '
  inputs:
    target_directory: .
    command: printf "must-not-run\n"
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: failed
  - type: output_equals
    path: result.exit_code
    value: 7
  - type: cel_true
    expr: outputs.build_log.contains("script-failed")
  - type: cel_true
    expr: '!outputs.build_log.contains("must-not-run")'
- id: explicit-command-failure
  type: integration_case
  runtime:
    cells:
      root:
        files:
          build.sh: 'printf "script-ran\n"

            '
  inputs:
    target_directory: .
    command: printf "extra-failed\n"; exit 9
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: failed
  - type: output_equals
    path: result.exit_code
    value: 9
  - type: cel_true
    expr: outputs.build_log.contains("script-ran")
  - type: cel_true
    expr: outputs.build_log.contains("extra-failed")
