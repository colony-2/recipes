recipe: ../recipes/develop/verify.yaml
cases:
- id: pass
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2j/build.sh: 'printf ''verified output\n''

            '
  inputs:
    target_directory: .c2j
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: true
  - type: output_equals
    path: result.status
    value: passed
  - type: output_equals
    path: result.timed_out
    value: false
  - type: cel_true
    expr: calls.filter(c, c.op == "command_execution").all(c, !("timeout" in c.inputs))
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
- id: fail
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2j/build.sh: 'echo failed; exit 7

            '
  inputs:
    target_directory: .c2j
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: false
  - type: output_equals
    path: result.status
    value: failed
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
# Preserve timeout evidence from the runtime without imposing a recipe deadline.
- id: external-timeout
  type: integration_case
  runtime: {}
  inputs:
    target_directory: .c2j
  mocks:
    ops:
    - match:
        node_path: development-verify/execute
      behavior:
        mode: return
        outputs:
          stdout: ran
          stderr: ''
          success: false
          exit_code: -1
          timed_out: true
        artifacts:
          build.log: |
            starting
    - match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: false
  - type: output_equals
    path: result.status
    value: failed
  - type: cel_true
    expr: size(outputs.artifact_refs) == 2 && "verification.md" in outputs.artifact_refs
  - type: output_equals
    path: result.timed_out
    value: true
- id: missing
  type: integration_case
  runtime:
    cells:
      root:
        files: {}
  inputs:
    target_directory: .c2j
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: ok
    value: true
  - type: output_equals
    path: result.status
    value: skipped
  - type: cel_true
    expr: size(outputs.artifact_refs) == 1 && "verification.md" in outputs.artifact_refs
