  - type: cel_true
    expr: outputs.result.failure.message.contains('command execution failed') && outputs.result.failure.node.path != ""
  - type: cel_true
    expr: >-
      calls.exists(c, c.node_path.endsWith("/read_evidence") &&
      "verification.md" in c.artifacts && "hooks/verify/0/failure.json" in c.artifacts &&
      c.artifacts["verification.md"].contains("Verification failed"))
- id: relative-include
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: relative-verify
            sequence:
            - id: checks
              include: ./suite.yaml
            outputs:
              api_version: ${{ sequence.checks.outputs.api_version }}
              status: ${{ sequence.checks.outputs.status }}
              summary: ${{ sequence.checks.outputs.summary }}
              artifact_refs: ${{ sequence.checks.outputs.artifact_refs }}
          .c2/recipes/hooks/build/suite.yaml: |
            id: fixture-suite
            sequence: []
            outputs:
              api_version: c2.build-hook/v1
              status: passed
              summary: Fixture suite completed.
              artifact_refs: {}
  inputs: {}
  mocks:
