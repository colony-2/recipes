recipe: fixtures/verification.yaml
cases:
- id: pass
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
              target_directory: ${{ inputs.target_directory }}
            sequence:
            - id: run_suite
              op: command_execution
              const: true
              inputs:
                env:
                  TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  cd "$TARGET" || exit 1
                  if (
                  bash ./build.sh
                  ) > "$OUTBOX/tests.log" 2>&1; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.run_suite.outputs.stdout }}
              summary: Fixture repository checks completed.
              artifact_refs: "${{ {'tests.log': sequence.run_suite.artifacts['tests.log']} }}"
          component/build.sh: echo verified
  inputs:
    target_directory: component
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: passed
  - type: output_equals
    path: allowed
    value: true
  - type: cel_true
    expr: outputs.log.contains("verified")
- id: fail
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            inputs:
              target_directory: ${{ inputs.target_directory }}
            sequence:
            - id: run_suite
              op: command_execution
              const: true
              inputs:
                env:
                  TARGET: '{{ context.environment.op.worktree_path }}/{{ inputs.target_directory }}'
                  OUTBOX: ${{ context.environment.op.outbox }}
                run: |
                  cd "$TARGET" || exit 1
                  if (
                  bash ./build.sh
                  ) > "$OUTBOX/tests.log" 2>&1; then printf passed; else printf failed; fi
            outputs:
              api_version: c2.build-hook/v1
              status: ${{ sequence.run_suite.outputs.stdout }}
              summary: Fixture repository checks completed.
              artifact_refs: "${{ {'tests.log': sequence.run_suite.artifacts['tests.log']} }}"
          build.sh: echo failed; exit 7
  inputs: {}
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: failed
  - type: output_equals
    path: allowed
    value: false
  - type: cel_true
    expr: outputs.log.contains("failed")
- id: missing
  type: integration_case
  runtime:
    cells:
      root:
        files:
          build.sh: echo MUST_NOT_RUN; exit 1
  inputs: {}
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: result.status
    value: skipped
  - type: output_equals
    path: allowed
    value: true
  - type: output_equals
    path: ok
    value: false
- id: required-missing
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  inputs:
    require_verification: true
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: allowed
    value: false
- id: required-skip
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: |
            id: fixture-verify
            sequence: []
            outputs:
              api_version: c2.build-hook/v1
              status: skipped
              summary: Fixture verify completed.
              artifact_refs: {}
  inputs:
    require_verification: true
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: allowed
    value: false
- id: missing-target-directory
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: Fixture
  inputs:
    target_directory: missing
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status == "failed" && !outputs.ok && !outputs.allowed
  - type: cel_true
    expr: outputs.result.failure.message.contains('command execution failed') && outputs.result.failure.node.path != ""
  - type: cel_true
    expr: >-
      calls.exists(c, c.node_path.endsWith("/read_evidence") &&
      "verification.md" in c.artifacts && "hooks/verify/0/failure.json" in c.artifacts &&
      c.artifacts["verification.md"].contains("Verification failed"))
- id: invalid-yaml
  type: integration_case
  runtime:
    cells:
      root:
        files:
          .c2/recipes/hooks/build/verify.yaml: 'sequence: [ broken'
  inputs: {}
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.status == "failed" && !outputs.ok && !outputs.allowed
  - type: cel_true
    expr: outputs.result.failure.message.contains('yaml') && outputs.result.failure.node.path != ""
  - type: cel_true
    expr: >-
      calls.exists(c, c.node_path.endsWith("/read_evidence") &&
      "verification.md" in c.artifacts && "hooks/verify/0/failure.json" in c.artifacts &&
      c.artifacts["verification.md"].contains("Verification failed"))
