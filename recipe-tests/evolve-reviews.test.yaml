recipe: ../evolve.yaml
cases:
- id: reviews-annotations-redesign-approval
  type: integration_case
  inputs:
    prompt: Improve requested behavior
  runtime:
    cells:
      root:
        files:
          .c2j/mandate.md: 'Own requested behavior.

            '
          AGENTS.md: 'Preserve existing behavior.

            '
    responses:
    - node_path: evolve/develop/root/approve_plan/input
      fields:
        decision: revise
        feedback: Include the annotations
      attachments:
        annotated_design: fixtures/design-edits.md
    - node_path: evolve/develop/root/approve_plan/input
      fields:
        decision: revise
        feedback: Text-only follow-up
    - node_path: evolve/develop/root/approve_plan/input
      fields:
        decision: approve
    - node_path: evolve/develop/root/accept/input
      fields:
        decision: revise
      attachments:
        annotated_outcome: fixtures/outcome-edits.md
    - node_path: evolve/develop/root/accept/input
      fields:
        decision: redesign
        feedback: Change the requirements
    - node_path: evolve/develop/root/approve_plan/input
      fields:
        decision: approve
    - node_path: evolve/develop/root/accept/input
      fields:
        decision: satisfied
      attachments:
        annotated_outcome: fixtures/last-edits.md
    - node_path: evolve/develop/root/accept/input
      fields:
        decision: satisfied
