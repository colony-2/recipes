      the requirements")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.node_path.contains("/implementation/")).filter(c,has(c.inputs.inputs.session)).size()
      == 3
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.node_path.contains("/design/"))[1].artifacts["prior/review/design-edits.md"].contains("CriticMarkup")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.node_path.contains("/implementation/"))[1].artifacts["prior/review/outcome-edits.md"].contains("CriticMarkup")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.node_path.contains("/implementation/"))[3].artifacts["prior/review/last-edits.md"].contains("CriticMarkup")
