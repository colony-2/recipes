  assertions:
  - type: cel_true
    expr: outputs.merged && outputs.verification.ok
  - type: cel_true
    expr: size(reviews) == 8
  - type: cel_true
    expr: reviews.filter(r, r.form.title == "Approve design and test plan").all(r, size(r.form.documents) == 2 && "design"
      in r.form.documents && "test_statements" in r.form.documents)
  - type: cel_true
    expr: reviews.filter(r, r.form.title == "Review verified outcome").all(r, size(r.form.documents) == 4 && "implement"
      in r.form.documents && "verification" in r.form.documents)
  - type: cel_true
    expr: calls.filter(c, c.op == "squashrebasemerge").size() == 1
  - type: cel_true
    expr: outputs.review_documents == reviews[7].form.documents
  - type: cel_true
    expr: outputs.reviews.outcome.request_id == reviews[7].form.request_id
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.node_path.contains("/design/")).size()
      == 4
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.node_path.contains("/implementation/")).size()
      == 4
