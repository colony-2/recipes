recipe: ../recipes/develop/implement.yaml
cases:
- id: advice
  type: integration_case
  inputs:
    prompt: Implement client behavior
    dependency_history_json: '{"previous-child": {"job_id": "previous-child", "terminal": true, "status": "completed", "outputs":
      {"value": "previous evidence"}, "artifacts": {}, "failure_kind": "", "failure_message": "", "started_at": "", "finished_at":
      "", "partial_outputs_available": false, "partial_artifacts_available": false}}'
    target_directory: .
    mode: build
  runtime:
    command_sandbox: none
    cells:
      root:
        files:
          AGENTS.md: 'Instructions for root

            '
          .c2j/mandate.md: 'Own service behavior.

            '
          app.txt: 'application

            '
      B:
        files:
          AGENTS.md: 'Instructions for B

            '
          .c2j/mandate.md: 'Own service behavior.

            '
          app.txt: 'application

            '
      C:
        files:
          AGENTS.md: 'Instructions for C

            '
          .c2j/mandate.md: 'Own service behavior.

            '
          app.txt: 'application

            '
  mocks:
    ops:
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: implement
        artifacts:
          result.json: '{"summary": "Local candidate", "next": "consult", "consultation": {"cell": "B", "ref": "main", "message":
            "Reject invalid tokens while preserving valid requests."}}'
          implementation.md: '# Implementation 1


            Behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: implement
                turn: 1
          worktree:
            implementation.txt: 'Local candidate

              '
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: consult
        artifacts:
          result.json: '{"next": "done", "summary": "Reject invalid tokens; preserve valid requests."}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consult
                turn: 1
          worktree:
            experiment.txt: must be discarded
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: implement
        artifacts:
          result.json: '{"next": "review", "summary": "Local outcome"}'
          implementation.md: '# Implementation 2


            Behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: implement
                turn: 2
    - repeat: true
      match:
        selector: git+https://github.com/colony-2/c2ops.git//rule_gate@main
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.valid && outputs.completed
  - type: cel_true
    expr: outputs.result.next == "review"
  - type: cel_true
    expr: 'outputs.dependencies == {"previous-child": {"job_id": "previous-child", "terminal": true, "status": "completed",
      "outputs": {"value": "previous evidence"}, "artifacts": {}, "failure_kind": "", "failure_message": "", "started_at":
      "", "finished_at": "", "partial_outputs_available": false, "partial_artifacts_available": false}}'
  - type: cel_true
    expr: outputs.consultations.all(k, outputs.consultations[k].session.type == "c2ops.codex.session/v1" && size(outputs.consultations[k])
      == 2)
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.cell == "root").size()
      == 2
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.cell == "root")[1].inputs.inputs.session.type
      == "c2ops.codex.session/v1"
  - type: cel_true
    expr: repositories.all(k,repositories[k].clean && repositories[k].new_commits == 0 && size(repositories[k].changed_files)
      == 0)
