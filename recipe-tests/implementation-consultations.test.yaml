recipe: ../recipes/develop/agent.yaml
cases:
- id: advice
  type: integration_case
  inputs:
    phase: implement
    prompt: Implement client behavior
    dependency_history_json: '{"previous-child": {"job_id": "previous-child", "terminal": true, "status": "completed",
      "outputs": {"value": "previous evidence"}, "artifacts": {}, "failure_kind": "", "failure_message": "", "started_at":
      "", "finished_at": "", "partial_outputs_available": false, "partial_artifacts_available": false}}'
    target_directory: .
    mode: build
  runtime:
    cells:
      root:
        files:
          AGENTS.md: 'Instructions for root

            '
          .c2j/mandate.md: 'Own service behavior.

            '
          app.txt: 'application

            '
      B:
        files:
          AGENTS.md: 'Instructions for B

            '
          .c2j/mandate.md: 'Own service behavior.

            '
          app.txt: 'application

            '
      C:
        files:
          AGENTS.md: 'Instructions for C

            '
          .c2j/mandate.md: 'Own service behavior.

            '
          app.txt: 'application

            '
    observe_files:
    - AGENTS.md
    - app.txt
    - experiment.txt
    - implementation.txt
    - .c2j/implementation.txt
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/main#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: implement
        artifacts:
          result.json: '{"summary": "Local candidate", "next": "consult", "consultation": {"cell": "B", "ref": "main",
            "message": "Reject invalid tokens while preserving valid requests."}}'
          implementation.md: '# Implementation 1


            Behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: implement
                turn: 1
          worktree:
            implementation.txt: 'Local candidate

              '
    - match:
        selector: nix:github:colony-2/c2ops/main#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: consult
        artifacts:
          result.json: '{"next": "done", "summary": "Reject invalid tokens; preserve valid requests."}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consult
                turn: 1
          worktree:
            experiment.txt: must be discarded
    - match:
        selector: nix:github:colony-2/c2ops/main#codex
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: implement
        artifacts:
          result.json: '{"next": "review", "summary": "Local outcome"}'
          implementation.md: '# Implementation 2


            Behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: implement
                turn: 2
    - repeat: true
      match:
        selector: nix:github:colony-2/c2ops/main#rule_gate
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.valid && outputs.completed
  - type: cel_true
    expr: outputs.result.next == "review"
  - type: cel_true
    expr: 'outputs.dependencies == {"previous-child": {"job_id": "previous-child", "terminal": true, "status": "completed",
      "outputs": {"value": "previous evidence"}, "artifacts": {}, "failure_kind": "", "failure_message": "", "started_at":
      "", "finished_at": "", "partial_outputs_available": false, "partial_artifacts_available": false}}'
  - type: cel_true
    expr: outputs.consultations.all(k, outputs.consultations[k].session.type == "c2ops.codex.session/v1" && size(outputs.consultations[k])
      == 2)
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).filter(c,c.cell ==
      "root").size() == 2
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).filter(c,c.cell ==
      "root")[1].inputs.inputs.session.type == "c2ops.codex.session/v1"
  - type: cel_true
    expr: repositories.all(k,repositories[k].clean && repositories[k].new_commits == 0 && size(repositories[k].changed_files)
      == 0)
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).map(c,c.cell) == ["root",
      "B", "root"]
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).all(c, !("experiment.txt"
      in c.worktree))
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex")).all(c, c.worktree["AGENTS.md"]
      == "Instructions for " + c.cell + "\n" && c.worktree["app.txt"] == "application\n")
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].inputs.inputs.session
      == calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[2].worktree["implementation.txt"]
      == "Local candidate\n"
  - type: cel_true
    expr: 'outputs.dependencies == {"previous-child": {"job_id": "previous-child", "terminal": true, "status": "completed",
      "outputs": {"value": "previous evidence"}, "artifacts": {}, "failure_kind": "", "failure_message": "", "started_at":
      "", "finished_at": "", "partial_outputs_available": false, "partial_artifacts_available": false}}'
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.endsWith("#codex") && c.cell == "root").all(c,c.inputs.inputs.prompt.contains("\"dependencies\":{\"previous-child\":{\"artifacts\":{},\"failure_kind\":\"\",\"failure_message\":\"\",\"finished_at\":\"\",\"job_id\":\"previous-child\",\"outputs\":{\"value\":\"previous
      evidence\"},\"partial_artifacts_available\":false,\"partial_outputs_available\":false,\"started_at\":\"\",\"status\":\"completed\",\"terminal\":true}}"))
