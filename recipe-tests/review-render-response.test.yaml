recipe: fixtures/review-render-response.yaml
cases:
- id: direct-render-fresh
  type: integration_case
  runtime:
    cells:
      root:
        file_sources:
          recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
  inputs:
    age_seconds: 0
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - repeat: true
      match:
        selector: ./recipes/kernel/render
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: mode
    value: synthesis
  - type: cel_true
    expr: size(outputs.documents) == 2 && outputs.documents.all(k, outputs.documents[k].kind == "stored")
- id: direct-render-aged
  type: integration_case
  runtime:
    cells:
      root:
        file_sources:
          recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
  inputs:
    age_seconds: 200
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - repeat: true
      match:
        selector: ./recipes/kernel/render
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: mode
    value: synthesis
  - type: cel_true
    expr: size(outputs.documents) == 2 && outputs.documents.all(k, outputs.documents[k].kind == "stored")
