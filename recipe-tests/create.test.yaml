# Seeded cells are already registered by c2j test. Mock only that command here;
# cell-registration.test.yaml covers native registration and rejection.
# Publication cases also need generated repository identities in mock proposals:
# see ../guides/FEATURE_REQUEST_C2J_RUNTIME_FIXTURE_REFERENCES.md. Keep them enabled.
recipe: fixtures/create-main.yaml
cases:
- id: create-approved-set
  type: integration_case
  inputs:
    prompt: Create the approved cells.
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Project root
          keep.txt: original
        file_sources:
          .c2/recipes/initialize.yaml: ../recipes/create/initialize.yaml
          recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
      alpha: {}
      beta: {}
    responses:
    - node_path:
        create-main/run/create/root/review/review/creation-review/review/sequence/review/kernel-review/request_human_review
      fields:
        decision: approve
  mocks:
    ops:
    - match:
        node_path:
          create-main/run/create/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
      repeat: true
      behavior:
        mode: return
        outputs:
          success: true
        artifacts:
          registration.json: '{"id":"pre-registered-fixture"}'
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: review
            summary: Creation proposal
            cells:
            - name: alpha
              repo: alpha
              purpose_path: cells/alpha/PURPOSE.md
            - name: beta
              repo: beta
              purpose_path: cells/beta/PURPOSE.md
            files:
            - path: proposal.md
              description: Review document
            - path: cells/alpha/PURPOSE.md
              description: Review document
            - path: cells/beta/PURPOSE.md
              description: Review document
            - path: root-config.yaml
              description: Exact approved root configuration
            questions: []
        artifacts:
          proposal.md: |-
            # Proposed cells
            Project fit, excluded alternatives, technology guidance and root catalog entries.
          cells/alpha/PURPOSE.md: |
            # alpha
            Approved responsibilities.
          cells/beta/PURPOSE.md: |
            # beta
            Approved responsibilities.
          root-config.yaml: |
            dependents:
              - repo: alpha
                ref: main
              - repo: beta
                ref: main
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: creation-review
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            completed: true
            summary: Registered published cells
        artifacts:
          completion.md: |-
            # Created cells
            Continue with feature consultations.
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                phase: registered
          worktree:
            CELL_DESCRIPTIONS.md: |-
              # Cells
              alpha and beta: approved responsibilities.
            .c2/config.yaml: |
              dependents:
                - repo: alpha
                  ref: main
                - repo: beta
                  ref: main
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
    - match:
        selector: ./recipes/kernel/render
      repeat: true
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.disposition == "created" && size(outputs.created_cells) == 2
  - type: cel_true
    expr: size(reviews) == 1
  - type: cel_true
    expr: repositories.root.new_commits == 1 && !("PURPOSE.md" in repositories.root.changed_files)
  - type: cel_true
    expr: repositories.root.files[".c2/config.yaml"].contains("alpha")
  - type: cel_true
    expr: size(calls.filter(c, c.op == "squashrebasemerge")) == 2 && size(calls.filter(c, c.op == "merge")) == 1 &&
      size(calls.filter(c, c.op == "squash")) == 1 && !calls.exists(c, c.op == "rebase")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[1].artifacts["created.json"].contains("revision")
  - type: cel_true
    expr: calls.filter(c, c.op == "extension_execution" &&
      c.inputs.selector.endsWith("#codex"))[1].inputs.inputs.session == calls.filter(c, c.op == "extension_execution"
      && c.inputs.selector.endsWith("#codex"))[0].outputs.session
  - type: cel_true
    expr: outputs.created_cells.all(c, c.ref == "refs/heads/main")
  - type: cel_true
    expr: '!("ref" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.output.schema.properties.cells.items.properties)'
  - type: cel_true
    expr: calls.filter(c, c.op == "squashrebasemerge").filter(c, c.cell in ["alpha", "beta"]).all(c, c.job_id !=
      calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].job_id)
