recipe: fixtures/create-main.yaml
cases:
  - id: create-approved-set
    type: integration_case
    inputs:
      title: "Create gamma — \"quoted\" and 'single'\n${{ inputs.not_a_real_field }} {{ unknown }}"
      prompt: Create the approved cells.
    runtime:
      cells:
        root:
          files:
            PURPOSE.md: Project root
            keep.txt: original
          file_sources:
            .c2/recipes/initialize.yaml: ../recipes/create/initialize.yaml
            recipes/kernel/render/op.yaml: ../recipes/kernel/render/op.yaml
        alpha: {}
        beta: {}
      responses:
        - node_path: create-main/run/create/root/review/review/creation-review/review/sequence/review/kernel-review/request_human_review
          fields:
            decision: approve
    mocks:
      ops:
        - match:
            node_path: create-main/run/create/root/publish/publish/publish-cells/publish/sequence/register_cell/register-cell/register
          repeat: true
          behavior:
            mode: return
            outputs:
              success: true
            artifacts:
              registration.json: '{"id":"pre-registered-fixture"}'
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            artifacts:
              proposal.md: |-
                # Proposed cells
                Project fit, excluded alternatives, technology guidance and repository identities.
              cells/alpha/PURPOSE.md: |
                # alpha
                Approved responsibilities.
              cells/beta/PURPOSE.md: |
                # beta
                Approved responsibilities.
            effects:
              objects:
                session:
                  type: c2ops.codex.session/v1
                  metadata:
                    phase: creation-review
            fixture_refs:
              alpha_repo:
                cell: alpha
                field: repo
              beta_repo:
                cell: beta
                field: repo
            outputs_fixture_expr: '{"status": "completed", "output_schema_valid": true, "response": {"outcome": "review", "summary": "Creation proposal", "cells": [{"name": "alpha", "repo": alpha_repo, "purpose_path": "cells/alpha/PURPOSE.md"}, {"name": "beta", "repo": beta_repo, "purpose_path": "cells/beta/PURPOSE.md"}], "files": [{"path": "proposal.md", "description": "Review document"}, {"path": "cells/alpha/PURPOSE.md", "description": "Review document"}, {"path": "cells/beta/PURPOSE.md", "description": "Review document"}], "questions": []}}'
        - repeat: true
          match:
            op: command_execution
          behavior:
            mode: passthrough
        - match:
            selector: ./recipes/kernel/render
          repeat: true
          behavior:
            mode: passthrough
    assertions:
      - type: cel_true
        expr: outputs.disposition == "created" && size(outputs.created_cells) == 2
      - type: cel_true
        expr: size(reviews) == 1
      - type: cel_true
        expr: repositories.root.new_commits == 0 && !("PURPOSE.md" in repositories.root.changed_files)
      - type: cel_true
        expr: '!(".c2/config.yaml" in repositories.root.files)'
      - type: cel_true
        expr: size(calls.filter(c, c.op == "squashrebasemerge")) == 2 && size(calls.filter(c, c.op == "merge")) == 0 && size(calls.filter(c, c.op == "squash")) == 0 && !calls.exists(c, c.op == "rebase")
      - type: cel_true
        expr: outputs.session == calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].outputs.session
      - type: cel_true
        expr: outputs.created_cells.all(c, c.ref == "refs/heads/main")
      - type: cel_true
        expr: '!("ref" in calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.output.schema.properties.cells.items.properties)'
      - type: cel_true
        expr: calls.filter(c, c.op == "squashrebasemerge").filter(c, c.cell in ["alpha", "beta"]).all(c, c.job_id != calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].job_id)
      - type: cel_true
        expr: outputs.merged && outputs.merged_hash == "" && outputs.root_preserved && size(outputs.initializations) == 2
      - type: cel_true
        expr: size(calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))) == 1
      - type: cel_true
        expr: '!calls.exists(c, c.node_path.contains("catalog") || ("run" in c.inputs && c.inputs.run.contains("cell add")))'
      - type: cel_true
        expr: reviews.all(r, !r.form.documents.exists(k, k.endsWith("root-config.yaml")))
      - type: cel_true
        expr: >-
          calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))[0].inputs.inputs.prompt.startsWith("Request title:\nCreate gamma — \"quoted\" and 'single'\n${{ inputs.not_a_real_field }} {{ unknown }}\n\nCreate the approved cells.")
      - type: cel_true
        expr: outputs.created_cells.all(c, c.cell in ["alpha", "beta"])
      - type: cel_true
        expr: reviews.all(r, r.form.title == "Review proposed cells")
