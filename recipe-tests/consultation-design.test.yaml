recipe: fixtures/consultation-design.yaml
cases:
- id: design
  type: integration_case
  runtime:
    cells:
      root: {}
      B: {}
  mocks:
    ops:
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: design
        artifacts:
          result.json: '{"summary": "design outcome", "next": "consult", "consultation": {"cell": "B", "message": "Discuss
            ownership and error handling.", "ref": "main"}}'
          design.md: '# Design 1


            Requested behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: design
                turn: 1
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: consult
        artifacts:
          result.json: '{"summary": "B owns validation. Reject invalid tokens.", "next": "done"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consult
                turn: 1
          worktree:
            experiment.txt: Discard experiment
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: design
        artifacts:
          result.json: '{"summary": "design outcome", "next": "consult", "consultation": {"cell": "B", "message": "Discuss
            ownership and error handling.", "ref": "main"}}'
          design.md: '# Design 2


            Requested behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: design
                turn: 2
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: consult
        artifacts:
          result.json: '{"summary": "B owns validation. Reject invalid tokens.", "next": "done"}'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consult
                turn: 2
          worktree:
            experiment.txt: Discard experiment
    - match:
        selector: git+https://github.com/colony-2/c2ops.git//codex@ded76dfbd877d3d0749e509844ecdbc57197b572
        cell: root
      behavior:
        mode: return
        outputs:
          status: completed
          sessionId: design
        artifacts:
          result.json: '{"summary": "design outcome", "next": "review"}'
          design.md: '# Design 3


            Requested behavior works.

            '
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: design
                turn: 3
    - repeat: true
      match:
        selector: git+https://github.com/colony-2/c2ops.git//rule_gate@main
      behavior:
        mode: passthrough
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: outputs.result.valid && outputs.result.completed
  - type: cel_true
    expr: outputs.result.consultations.B.session.type == "c2ops.codex.session/v1"
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.cell == "B").size()
      == 2
  - type: cel_true
    expr: calls.filter(c,c.op == "extension_execution" && c.inputs.selector.contains("//codex@")).filter(c,c.cell == "B")[1].inputs.inputs.session.type
      == "c2ops.codex.session/v1"
