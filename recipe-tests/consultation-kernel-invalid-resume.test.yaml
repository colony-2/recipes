recipe: fixtures/consultation-kernel-invalid-resume.yaml
cases:
- id: invalid-direction-cannot-open-retry-budget
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Client application
          candidate.txt: original
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
    observe_files:
    - candidate.txt
    - experiment.txt
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: error
          errorMessage: Agent returned an unsuccessful result
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: first.outcome
    value: failed
  - type: output_equals
    path: invalid.outcome
    value: failed
  - type: output_equals
    path: invalid.state.retryable
    value: false
  - type: output_equals
    path: invalid.state.round
    value: 1
  - type: output_equals
    path: retry_invalid.outcome
    value: failed
  - type: output_equals
    path: retry_invalid.state.round
    value: 1
  - type: cel_true
    expr: size(calls.filter(c, c.op == "extension_execution" && c.inputs.selector.endsWith("#codex"))) == 1
