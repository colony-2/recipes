recipe: fixtures/payload-consultation.yaml
cases:
- id: large-transcript-stays-stored
  type: integration_case
  runtime:
    cells:
      root:
        files:
          PURPOSE.md: Client application
          candidate.txt: original
      B:
        files:
          PURPOSE.md: Serving API
          candidate.txt: target
    observe_files:
    - candidate.txt
    - experiment.txt
  inputs:
    bytes: 524288
    marker: "λ \"quoted\" \\ backslash\n$(touch SHOULD_NOT_EXIST) `literal` $HOME ${{ literal }}"
  mocks:
    ops:
    - match:
        selector: nix:github:colony-2/c2ops/published#codex
        cell: B
      behavior:
        mode: return
        outputs:
          status: completed
          output_schema_valid: true
          response:
            outcome: agreed
            thinking: 'consultant reply 1: agreed'
            files:
            - path: iter1/consultant/feature-spec.md
              description: Consultation document
            assessment: not_applicable
        artifacts:
          iter1/consultant/feature-spec.md: '# Accepted feature'
        effects:
          objects:
            session:
              type: c2ops.codex.session/v1
              metadata:
                session_id: consultant
                iteration: 1
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: output_equals
    path: checked
    value: stored transcript preserved
  - type: output_equals
    path: kind
    value: stored
