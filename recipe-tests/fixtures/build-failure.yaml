id: build-failure-fixture
input_schema:
  target_directory: {type: string, default_value: .}
inputs:
  target_directory: ${{ inputs.?target_directory.orValue('.') }}
catch:
- when: true
  continue:
    outputs:
      propagated: true
      failure: ${{ json_parse(json_stringify(failure)) }}
sequence:
- id: build
  include: ../../recipes/develop/develop.yaml
  inputs:
    prompt: Exercise build failure propagation.
    target_directory: ${{ inputs.target_directory }}
    session: {}
    documents: {}
    root_cell: ''
    root_ref: ''
    consultation_recipe: consultation
    build_recipe: build
    create_recipe: create
outputs:
  propagated: false
  build: ${{ sequence.build.outputs }}
