id: creation-coordination
input_schema:
  version:
    type: string
    default_value: adaptive
inputs:
  version: ${{ inputs.version }}
state:
  initial: choose
  states:
    choose:
      sequence: []
      transitions:
        - to: adaptive
          when: inputs.version == 'adaptive'
        - to: adaptive2
          when: true
    adaptive:
      include: ../../recipes/adaptive/coordinate.yaml
      inputs:
        requests:
          - action: consult
            kind: create
            cell: alpha
            request: Create alpha as approved.
          - action: consult
            kind: feature
            cell: alpha
            ref: main
            request: Agree the separate feature delivery.
        phase: design
        root_cell: root
        root_ref: main
        consultation_recipe: ${{ 'git+' + context.git.repo + '//.c2/serving.yaml@main' }}
        build_recipe: unused-build
        create_recipe: ${{ 'git+' + context.git.repo + '//.c2/create-result.yaml@main' }}
        session: {}
        documents: {}
        annotations: []
        prefix: creation-continuation
        history: []
    adaptive2:
      include: ../../recipes/adaptive2/coordinate.yaml
      inputs:
        requests:
          - action: consult
            kind: create
            cell: alpha
            request: Create alpha as approved.
          - action: consult
            kind: feature
            cell: alpha
            ref: main
            request: Agree the separate feature delivery.
        phase: design
        root_cell: root
        root_ref: main
        consultation_recipe: ${{ 'git+' + context.git.repo + '//.c2/serving.yaml@main' }}
        build_recipe: unused-build
        create_recipe: ${{ 'git+' + context.git.repo + '//.c2/create-result.yaml@main' }}
        session: {}
        documents: {}
        annotations: []
        prefix: creation-continuation
        history: []
outputs:
  result: '${{ state_exists(''adaptive'') ? states.adaptive.outputs : states.adaptive2.outputs }}'
