id: consultation-reuse
version: '1'
sequence:
- id: design
  include: ../../recipes/develop/design.yaml
  inputs:
    prompt: Implement client behavior
- id: implementation
  include: ../../recipes/develop/implement.yaml
  inputs:
    prompt: Implement client behavior
    consultation_history_json: ${{ json_stringify(sequence.design.outputs.consultations)
      }}
outputs:
  result: ${{ sequence.implementation.outputs }}
