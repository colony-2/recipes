id: hooks-fixture
sequence:
- id: configure
  include: ../../recipes/build/hooks/configure.yaml
  inputs:
    request: Test hooks
    target_directory: .
- id: research
  include: ../../recipes/build/hooks/before_design.yaml
  inputs:
    settings: ${{ sequence.configure.outputs.settings_artifact }}
- id: prepare
  include: ../../recipes/build/hooks/prepare.yaml
  inputs:
    settings: ${{ sequence.configure.outputs.settings_artifact }}
- id: check
  include: ../../recipes/develop/verify.yaml
  inputs:
    request: Test hooks
    target_directory: .
    settings: ${{ sequence.configure.outputs.settings_artifact }}
outputs:
  settings: ${{ sequence.configure.outputs.settings }}
  verification: ${{ sequence.check.outputs.result }}
  artifact_refs: ${{ sequence.check.outputs.artifact_refs }}
  preparation: ${{ sequence.prepare.outputs.result }}
  research: ${{ sequence.research.outputs.result }}
input_schema:
  prompt:
    type: string
    default_value: Check build hooks
