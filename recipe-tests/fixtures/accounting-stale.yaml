id: accounting-stale
sequence:
- id: candidate
  include: ../../recipes/kernel/git-candidate.yaml
- id: change_candidate
  op: command_execution
  inputs:
    run: printf 'a later candidate\n' > candidate.txt
- id: accounting
  include: ../../recipes/develop/accounting.yaml
  inputs:
    request: Review the captured candidate.
    candidate: ${{ sequence.candidate.outputs.candidate }}
    documents: ${{ sequence.candidate.outputs.documents }}
    instructions: Review the captured candidate without editing it.
    schema: {}
    turn:
      result:
        status: completed
        output_schema_valid: true
        response:
          verdict: approve
          subject: Keep the existing behavior
          review_message: The original candidate had no changes.
          files: []
      artifacts: {}
      jobs: {}
      issues: []
outputs:
  approved: ${{ sequence.accounting.outputs.approved }}
  stale: ${{ sequence.accounting.outputs.stale }}
