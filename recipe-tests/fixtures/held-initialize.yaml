schema_version: 2
id: held-initialize
input_schema:
  cell: {type: string, required: true}
  purpose: {type: artifact, required: true}
  approval: {type: artifact, required: true}
inputs:
  cell: ${{ inputs.cell }}
  purpose: ${{ inputs.purpose }}
  approval: ${{ inputs.approval }}
sequence:
  - id: release
    op: input
    inputs:
      form:
        request: {title: Release fixture initialization}
        response_schema: {type: object}
  - id: initialize
    include: ./initialize-real.yaml
    inputs:
      cell: ${{ inputs.cell }}
      purpose: ${{ inputs.purpose }}
      approval: ${{ inputs.approval }}
outputs:
  error: ${{ sequence.initialize.outputs.error }}
  published: ${{ sequence.initialize.outputs.published }}
