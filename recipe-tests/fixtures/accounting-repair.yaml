id: accounting-fixture
sequence:
- id: change
  op: command_execution
  inputs:
    run: if [ "$UNCHANGED" != true ]; then printf "requested change\n" > candidate.txt; fi
    env:
      UNCHANGED: ${{ string(inputs.unchanged) }}
- id: review
  include: ../../recipes/develop/merge-review.yaml
  inputs:
    request: Update candidate behavior.
    documents: {}
outputs:
  result: ${{ sequence.review.outputs }}
input_schema:
  unchanged:
    type: boolean
    default_value: false
inputs:
  unchanged: ${{ inputs.unchanged }}
