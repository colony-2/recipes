id: creation-result
input_schema:
  prompt:
    type: string
  root_cell:
    type: string
  root_ref:
    type: string
  documents:
    type: artifact_map
sequence:
  - id: published
    workspace:
      cell: alpha
      ref: main
    sequence: []
    outputs:
      cell: ${{ context.workspace.cell }}
      repo: ${{ context.git.repo }}
      ref: main
      revision: ${{ context.git.resolved_hash }}
outputs:
  disposition: created
  merged: true
  merged_hash: ""
  created_cells: ${{ [sequence.published.outputs] }}
  review:
    request_id: approved-creation-review
  artifact_refs:
    proposal.md:
      kind: value
      name: proposal.md
      format: text
      value: Reviewed alpha identity and initial purpose.
schema_version: 2
