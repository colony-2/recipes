id: consultation-kernel-invalid-resume
version: '1'
sequence:
- id: first
  include: ../../recipes/kernel/consultation.yaml
  inputs:
    thread: invalid-reopen
    request: Agree acceptance outcomes.
    consultant_cell: B
    consultant_role: Assess the serving feature.
- id: invalid
  include: ../../recipes/kernel/consultation.yaml
  inputs:
    continuation: ${{ sequence.first.outputs.continuation }}
    direction: Reopen this failed execution as a new negotiation round.
- id: retry_invalid
  include: ../../recipes/kernel/consultation.yaml
  inputs:
    continuation: ${{ sequence.invalid.outputs.continuation }}
outputs:
  first: ${{ sequence.first.outputs }}
  invalid: ${{ sequence.invalid.outputs }}
  retry_invalid: ${{ sequence.retry_invalid.outputs }}
