id: consultation-feedback
version: '1'
sequence:
- id: implementation
  include: ../../recipes/develop/implement.yaml
  inputs:
    prompt: Implement client behavior
- id: revision
  include: ../../recipes/develop/implement.yaml
  inputs:
    prompt: Implement client behavior
    feedback: Ask the dependency owner a follow-up question
    session: ${{ sequence.implementation.outputs.session }}
    consultation_history_json: ${{ json_stringify(sequence.implementation.outputs.consultations)
      }}
    dependency_history_json: ${{ json_stringify(sequence.implementation.outputs.dependencies)
      }}
outputs:
  result: ${{ sequence.revision.outputs }}
