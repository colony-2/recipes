id: consultation-kernel-resume
version: '1'
input_schema:
  direction: {type: string, default_value: ''}
inputs:
  direction: ${{ inputs.direction }}
sequence:
- id: first
  include: ../../recipes/kernel/consultation.yaml
  inputs:
    thread: compatibility
    request: Agree an API compatibility policy.
    consultant_cell: B
    consultant_role: Serve the API and assess compatibility.
    max_iterations: 1
- id: second
  include: ../../recipes/kernel/consultation.yaml
  inputs:
    continuation: ${{ sequence.first.outputs.continuation }}
    direction: ${{ inputs.direction }}
    max_iterations: 2
outputs:
  first: ${{ sequence.first.outputs }}
  second: ${{ sequence.second.outputs }}
