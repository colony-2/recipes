id: repair-fixture
version: '1'
input_schema:
  attempts:
    type: number
    default_value: 0
inputs:
  attempts: ${{ inputs.attempts }}
sequence:
- id: seed
  op: nix:github:colony-2/c2ops/published#codex
  inputs:
    api:
      api_key: ${{ context.secrets.?codex_api_key.orValue(null) }}
    prompt: Provide a saved response for correction.
    output:
      schema:
        type: object
        properties:
          summary:
            type: string
        required:
        - summary
        additionalProperties: false
- id: repair
  include: ../../recipes/kernel/repair.yaml
  inputs:
    turn: '${{ {''result'': sequence.seed.outputs, ''artifacts'': sequence.seed.artifacts, ''jobs'': {} } }}'
    issues:
    - 'Artifact reference reply.md is ambiguous: choose design.md or tests.md.'
    documents: {}
    attempts: ${{ inputs.attempts }}
- id: inspect
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.repair.outputs.documents }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      cat "$INBOX/design.md"
      cat "$INBOX/repair.json"
outputs:
  result: ${{ sequence.repair.outputs }}
  seed: ${{ sequence.seed.outputs.session }}
  evidence: ${{ sequence.inspect.outputs.stdout }}
