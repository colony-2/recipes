id: build-handoff
version: '1'
sequence:
- id: starter
  op: command_execution
  inputs:
    run: 'true'
- id: namespace
  include: ../../recipes/kernel/artifact-namespace.yaml
  inputs:
    prefix: consultation/
    documents: '${{ {''conversation.json'': sequence.starter.artifacts[''conversation.json'']} }}'
- id: run
  include: ../../build.yaml
  inputs:
    prompt: Implement the agreed feature.
    session: ${{ sequence.starter.outputs.session }}
    documents: ${{ sequence.namespace.outputs.documents }}
outputs:
  merged: ${{ sequence.run.outputs.merged }}
