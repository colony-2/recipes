id: payload-build
input_schema:
  bytes:
    type: number
    required: true
  marker:
    type: string
    required: true
inputs:
  request: ${{ jq(double(inputs.bytes), '"x" * .') + inputs.marker }}
sequence:
- id: build
  include: ../../build.yaml
  inputs:
    prompt: ${{ inputs.request }}
outputs:
  disposition: ${{ sequence.build.outputs.disposition }}
