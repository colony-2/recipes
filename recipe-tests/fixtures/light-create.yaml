id: light-create-fixture
sequence:
- id: prepare
  include: ./prepare-create-remotes.yaml
- id: build
  include: ../../build.yaml
  inputs:
    prompt: Create alpha and beta with the proposed responsibilities; no feature implementation requested.
    root_cell: ${{ context.git.repo }}
    root_ref: main
    create_recipe: reviewed-create
    build_recipe: dependency
outputs:
  result: ${{ sequence.build.outputs }}
