id: specialists-fixture
inputs:
  required: ${{ inputs.?required.orValue(true) }}
sequence:
- id: review
  include: ../../recipes/build/hooks/specialists.yaml
  inputs:
    checkpoint: plan_assessment
    flow:
      session: {}
      documents: {}
      hook_settings:
        prompt_additions:
          plan_assessment: Inspect tenant isolation carefully.
        consultations:
        - key: security
          checkpoint: plan_assessment
          role: Security architect
          request: Review authorization boundaries.
          required: ${{ inputs.required }}
- id: again
  include: ../../recipes/build/hooks/specialists.yaml
  inputs:
    checkpoint: plan_assessment
    flow: ${{ sequence.review.outputs.flow }}
outputs:
  passed: ${{ sequence.review.outputs.passed }}
  flow: ${{ sequence.again.outputs.flow }}
input_schema:
  required:
    type: boolean
    default_value: true
