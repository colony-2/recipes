id: verification-fixture
input_schema:
  target_directory:
    type: string
    default_value: .
  require_verification:
    type: boolean
    default_value: false
inputs:
  target_directory: ${{ inputs.target_directory }}
  require_verification: ${{ inputs.require_verification }}
sequence:
- id: check
  include: ../../recipes/develop/verify.yaml
  inputs:
    target_directory: ${{ inputs.target_directory }}
    require_verification: ${{ inputs.require_verification }}
- id: read_evidence
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.check.outputs.artifact_refs }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      if [ -f "$INBOX/hooks/verify/0/tests.log" ]; then cat "$INBOX/hooks/verify/0/tests.log"; fi
outputs:
  ok: ${{ sequence.check.outputs.ok }}
  allowed: ${{ sequence.check.outputs.allowed }}
  result: ${{ sequence.check.outputs.result }}
  evidence: ${{ sequence.check.outputs.evidence }}
  artifact_refs: ${{ sequence.check.outputs.artifact_refs }}
  review_documents: ${{ sequence.check.outputs.review_documents }}
  log: ${{ sequence.read_evidence.outputs.stdout }}
