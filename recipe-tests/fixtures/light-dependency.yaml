id: dependency
version: '1'
input_schema:
  prompt:
    type: string
    required: true
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: true
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
    default_value: ''
  root_ref:
    type: string
    default_value: main
inputs:
  prompt: ${{ inputs.prompt }}
  session: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
sequence:
- id: record
  op: command_execution
  const: true
  artifacts:
    ./: ${{ inputs.documents }}
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
    run: '[ ! -f fail ] || exit 1

      printf ''# Dependency outcome\n'' > "$OUTBOX/dependency.md"'
outputs:
  merged: false
  disposition: unchanged
  starter: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  artifact_refs: '${{ {''dependency.md'': sequence.record.artifacts[''dependency.md'']} }}'
