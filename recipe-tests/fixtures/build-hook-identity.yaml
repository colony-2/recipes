id: hook-identity-fixture
input_schema:
  command:
    type: string
    required: true
inputs:
  command: ${{ inputs.command }}
sequence:
- id: before
  include: ../../recipes/build/hooks/identity.yaml
- id: change
  op: command_execution
  inputs:
    run: ${{ inputs.command }}
- id: after
  include: ../../recipes/build/hooks/identity.yaml
outputs:
  changed: ${{ sequence.before.outputs.digest != sequence.after.outputs.digest }}
