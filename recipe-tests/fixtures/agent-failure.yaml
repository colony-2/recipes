id: agent-failure-fixture
input_schema:
  read_only: {type: boolean, default_value: true}
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
inputs:
  read_only: ${{ inputs.read_only }}
  session: ${{ inputs.?session.orValue({}) }}
catch:
- when: true
  continue:
    outputs:
      propagated: true
      failure: ${{ json_parse(json_stringify(failure)) }}
sequence:
- id: turn
  include: ../../recipes/kernel/agent-turn.yaml
  inputs:
    prompt: Exercise failure propagation.
    schema: {type: object}
    read_only: ${{ inputs.read_only }}
    session: ${{ inputs.session }}
outputs:
  propagated: false
  turn: ${{ sequence.turn.outputs }}
