id: completion-review
input_schema:
  prompt: {type: string, required: true}
  build_recipe: {type: string, default_value: build}
inputs:
  prompt: ${{ inputs.prompt }}
  build_recipe: ${{ inputs.build_recipe }}
sequence:
- id: build
  include: ../../build.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    build_recipe: ${{ inputs.build_recipe }}
    target_directory: .
    documents: {}
    root_cell: ''
    root_ref: ''
    consultation_recipe: consultation
    create_recipe: create
- id: read_review_documents
  op: command_execution
  const: true
  artifacts:
    ./: ${{ sequence.build.outputs.artifact_refs }}
  inputs:
    env:
      INBOX: ${{ context.environment.op.inbox }}
    run: |
      for name in synopsis.md merge-review.md; do
        if [ -f "$INBOX/$name" ]; then cat "$INBOX/$name"; fi
      done
outputs:
  disposition: ${{ sequence.build.outputs.disposition }}
  merged: ${{ sequence.build.outputs.merged }}
  dependencies: ${{ sequence.build.outputs.dependencies }}
  reviews: ${{ sequence.build.outputs.reviews }}
  review_document: ${{ sequence.read_review_documents.outputs.stdout }}
