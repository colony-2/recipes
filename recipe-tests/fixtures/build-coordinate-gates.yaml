id: coordination-gates
version: '1'
input_schema:
  flow_json:
    type: string
    required: true
  action:
    type: string
    required: true
  requests_json:
    type: string
    default_value: '[]'
  keys_json:
    type: string
    default_value: '[]'
inputs:
  flow_json: ${{ inputs.flow_json }}
  action: ${{ inputs.action }}
  requests_json: ${{ inputs.requests_json }}
  keys_json: ${{ inputs.keys_json }}
sequence:
- id: coordinate
  include: ../../recipes/develop/coordinate.yaml
  inputs:
    flow: ${{ json_parse(inputs.flow_json) }}
    action: ${{ inputs.action }}
    requests: ${{ json_parse(inputs.requests_json) }}
    keys: ${{ json_parse(inputs.keys_json) }}
outputs:
  valid: ${{ sequence.coordinate.outputs.valid }}
  flow: ${{ sequence.coordinate.outputs.flow }}
