schema_version: 2
id: dependency
version: '1'
input_schema:
  prompt:
    type: string
    required: true
  session:
    type: checkpoint
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
    default_value: ''
  root_ref:
    type: string
    default_value: main
  annotations:
    type: array
    default_value: []
    items:
      type: object
      properties:
        id:
          type: string
          required: true
        ref:
          type: artifact
          required: true
        descriptor:
          type: object
        sources:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ref:
                type: artifact
inputs:
  prompt: ${{ inputs.prompt }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  annotations: ${{ inputs.annotations }}
sequence:
- id: record
  op: command_execution
  const: true
  artifacts:
    ./: ${{ inputs.documents }}
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |-
      [ ! -f fail ] || exit 1
      printf '# Dependency outcome\n' > "$OUTBOX/dependency.md"
outputs:
  merged: true
  disposition: created
  starter: ${{ inputs.session }}
  documents: ${{ inputs.documents }}
  artifact_refs: '${{ {''dependency.md'': sequence.record.artifacts[''dependency.md'']} }}'
  annotations: ${{ inputs.annotations }}
