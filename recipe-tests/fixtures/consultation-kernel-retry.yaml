id: consultation-kernel-retry
version: '1'
sequence:
- id: first
  include: ../../recipes/kernel/consultation.yaml
  inputs:
    thread: retry-test
    request: Agree acceptance outcomes.
    consultant_cell: B
    consultant_role: Assess the serving feature.
- id: second
  include: ../../recipes/kernel/consultation.yaml
  inputs:
    continuation: ${{ sequence.first.outputs.continuation }}
outputs:
  first: ${{ sequence.first.outputs }}
  second: ${{ sequence.second.outputs }}
