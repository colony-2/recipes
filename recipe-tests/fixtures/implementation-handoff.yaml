id: implementation-handoff
input_schema:
  prompt:
    type: string
    required: true
  session:
    type: object
    object_type: c2ops.codex.session/v1
    required: false
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
    default_value: ''
  root_ref:
    type: string
    default_value: main
inputs:
  prompt: ${{ inputs.prompt }}
  session: ${{ inputs.?session.orValue({}) }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
sequence:
- id: develop
  include: ./light/develop.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    target_directory: .
    session: ${{ inputs.session }}
    documents: ${{ inputs.documents }}
    root_cell: ${{ inputs.root_cell }}
    root_ref: ${{ inputs.root_ref }}
    build_recipe: dependency
outputs:
  merged: ${{ sequence.develop.outputs.merged }}
  disposition: ${{ sequence.develop.outputs.disposition }}
  artifact_refs: ${{ sequence.develop.outputs.artifact_refs }}
