schema_version: 2
id: cancelled-initialize
input_schema:
  cell: {type: string, required: true}
  purpose: {type: artifact, required: true}
  approval: {type: artifact, required: true}
sequence:
  - id: cancelled
    op: command_execution
    inputs:
      run: exit 9
    catch:
      - when: true
        fail:
          kind: cancellation
          code: cancelled
          message: Initialization cancelled; retain the original publication evidence.
