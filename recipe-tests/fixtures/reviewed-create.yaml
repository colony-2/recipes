id: reviewed-create-fixture
input_schema:
  prompt:
    type: string
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
  root_ref:
    type: string
inputs:
  prompt: ${{ inputs.prompt }}
  documents: ${{ inputs.documents }}
  root_cell: ${{ inputs.root_cell }}
  root_ref: ${{ inputs.root_ref }}
sequence:
- id: create
  include: ../create.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    documents: ${{ inputs.documents }}
    root_cell: ${{ inputs.root_cell }}
    root_ref: ${{ inputs.root_ref }}
    initialize_recipe: ${{ 'git+file://' + context.git.repo + '//.c2/recipes/initialize.yaml@main' }}
outputs:
  disposition: ${{ sequence.create.outputs.disposition }}
  merged: ${{ sequence.create.outputs.merged }}
  created_cells: ${{ sequence.create.outputs.created_cells }}
  artifact_refs: ${{ sequence.create.outputs.artifact_refs }}
