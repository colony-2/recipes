id: serving-after-creation
input_schema:
  thread:
    type: string
  request:
    type: string
  consultant_cell:
    type: string
  consultant_ref:
    type: string
  consultant_role:
    type: string
  documents:
    type: artifact_map
  annotations:
    type: array
    items:
      type: object
inputs:
  cell: ${{ inputs.consultant_cell }}
  ref: ${{ inputs.consultant_ref }}
sequence:
  - id: destination
    workspace:
      cell: ${{ inputs.cell }}
      ref: ${{ inputs.ref }}
    sequence: []
    outputs:
      revision: ${{ context.git.resolved_hash }}
outputs:
  outcome: agreed
  summary: Serving-cell agreement; feature implementation remains separate work.
  thinking: Fixture serving-cell agreement.
  handoff: accepted/
  work_kind: feature
  failure_code: ""
  execution_requests: []
  agreements: []
  review_receipts: []
  final_artifacts:
    accepted/handoff.md:
      kind: value
      name: accepted/handoff.md
      format: text
      value: ${{ 'Serving alpha at ' + sequence.destination.outputs.revision + '. Implement the feature in a subsequent delivery.' }}
schema_version: 2
