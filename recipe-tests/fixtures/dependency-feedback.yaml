id: dependency-feedback
version: '1'
sequence:
- id: first
  include: ../../recipes/develop/agent.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    instructions: ${{ inputs.instructions }}
    target_directory: ${{ inputs.target_directory }}
    result_schema_json: ${{ inputs.result_schema_json }}
- id: later
  include: ../../recipes/develop/agent.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    instructions: ${{ inputs.instructions }}
    target_directory: ${{ inputs.target_directory }}
    result_schema_json: ${{ inputs.result_schema_json }}
    feedback: Keep the completed dependency and revise this cell only
    session: ${{ sequence.first.outputs.session }}
    dependency_history_json: ${{ json_stringify(sequence.first.outputs.dependencies) }}
outputs:
  dependencies: ${{ sequence.later.outputs.dependencies }}
  valid: ${{ sequence.later.outputs.valid }}
  completed: ${{ sequence.later.outputs.completed }}
  result: ${{ sequence.later.outputs.result }}
  original_dependencies: ${{ sequence.first.outputs.dependencies }}
input_schema:
  prompt:
    type: string
    required: true
  instructions:
    type: string
    required: true
  target_directory:
    type: string
    required: true
  result_schema_json:
    type: string
    required: true
inputs:
  prompt: ${{ inputs.prompt }}
  instructions: ${{ inputs.instructions }}
  target_directory: ${{ inputs.target_directory }}
  result_schema_json: ${{ inputs.result_schema_json }}
