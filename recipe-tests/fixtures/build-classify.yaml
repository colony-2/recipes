id: classification-fixture
version: '1'
input_schema:
  oversized_context:
    type: boolean
    default_value: false
inputs:
  oversized_context: ${{ inputs.oversized_context }}
sequence:
- id: seed_oversized_context
  op: command_execution
  inputs:
    env:
      OVERSIZED: ${{ string(inputs.oversized_context) }}
    run: |
      if [ "$OVERSIZED" = true ]; then
        printf 'x%65536s' '' > PURPOSE.md
      fi
- id: classify
  include: ../../recipes/build/classify.yaml
  inputs:
    request: Correct the README typo.
outputs:
  assessment: ${{ sequence.classify.outputs.assessment }}
  light: ${{ sequence.classify.outputs.light }}
  context_usable: ${{ sequence.classify.outputs.context_usable }}
