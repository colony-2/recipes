id: creation-outcome
input_schema:
  prompt:
    type: string
  documents:
    type: artifact_map
    default_value: {}
  root_cell:
    type: string
  root_ref:
    type: string
sequence:
- id: outcome
  op: command_execution
  const: true
  inputs:
    run: cat creation-result.json
outputs:
  disposition: ${{ json_parse(sequence.outcome.outputs.stdout).disposition }}
  merged: ${{ json_parse(sequence.outcome.outputs.stdout).merged }}
  created_cells: ${{ json_parse(sequence.outcome.outputs.stdout).created_cells }}
