id: lineage-review
input_schema:
  reverse:
    type: boolean
    default_value: false
inputs:
  reverse: ${{ inputs.reverse }}
sequence:
- id: review
  include: ../../recipes/kernel/review.yaml
  inputs:
    title: Review competing artifact occurrences
    documents: {report: {kind: value, format: text, value: Original evidence.}}
    annotations: >-
      ${{ inputs.reverse ? [vars.second, vars.first] : [vars.first, vars.second] }}
    checkpoint: {phase: implement}
    fields:
    - id: decision
      type: multiple_choice
      question: Accept?
      required: true
      options:
      - {value: accept, label: Accept}
      - {value: revise, label: Revise}
outputs:
  presentation: ${{ sequence.review.outputs.presentation }}
  response: ${{ sequence.review.outputs.response }}
vars:
  first:
    id: report
    ref: {kind: value, format: text, value: Original evidence.}
    origin: first
    lineage: [first, report]
    descriptor: {title: First, role: primary}
    sources: []
  second:
    id: report
    ref: {kind: value, format: text, value: Original evidence.}
    origin: second
    lineage: [second, report]
    descriptor: {title: Second, role: diagnostic}
    sources: []
