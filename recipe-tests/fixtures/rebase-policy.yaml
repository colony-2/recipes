id: rebase-policy-fixture
input_schema:
  failure_json: {type: string, default_value: '{}'}
  rebase_repairs: {type: number, default_value: 0}
inputs:
  failure_json: ${{ inputs.failure_json }}
  rebase_repairs: ${{ inputs.rebase_repairs }}
sequence:
- id: policy
  include: ../../recipes/kernel/rebase-policy.yaml
  inputs:
    failure: ${{ json_parse(inputs.failure_json) }}
    rebase_repairs: ${{ inputs.rebase_repairs }}
outputs:
  eligible: ${{ sequence.policy.outputs.eligible }}
