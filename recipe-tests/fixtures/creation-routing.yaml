id: route-fixture
input_schema:
  kind:
    type: string
    default_value: create
  cell:
    type: string
    default_value: absent
  root_cell:
    type: string
    default_value: R
inputs:
  kind: ${{ inputs.kind }}
  cell: ${{ inputs.cell }}
  root_cell: ${{ inputs.root_cell }}
sequence:
- id: coordinate
  include: ../../recipes/light/coordinate.yaml
  inputs:
    flow:
      session: {}
      documents: {}
      threads: {}
      jobs: {}
      root_cell: ${{ inputs.root_cell }}
      root_ref: main
      create_recipe: creation-outcome
      build_recipe: build
    action: consult
    requests:
    - key: new_cell
      kind: ${{ inputs.kind }}
      cell: ${{ inputs.cell }}
      ref: main
      request: Create a new cell owning widgets.
      role: Own widgets.
- id: repeat
  include: ../../recipes/light/coordinate.yaml
  inputs:
    flow: ${{ sequence.coordinate.outputs.flow }}
    action: consult
    requests:
    - key: new_cell
      kind: ${{ inputs.kind }}
      cell: ${{ inputs.cell }}
      ref: main
      request: Create a new cell owning widgets.
      role: Own widgets.
outputs:
  flow: ${{ sequence.repeat.outputs.flow }}
  valid: ${{ sequence.repeat.outputs.valid }}
