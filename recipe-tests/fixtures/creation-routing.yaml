id: creation-routing
state:
  initial: adaptive
  states:
    adaptive:
      include: ../../recipes/adaptive/route-target.yaml
      inputs:
        request:
          kind: create
          cell: alpha
          ref: main
          request: Create alpha with its reviewed purpose.
        root_cell: root
        root_ref: main
        create_recipe: fixture-creation
        documents: {}
      transitions:
        - to: continue
          when: outputs.ready
    continue:
      op: command_execution
      const: true
      inputs:
        run: printf 'Serving consultation may proceed\n'
outputs:
  result: ${{ states.adaptive.outputs }}
  continued: ${{ state_exists('continue') }}
