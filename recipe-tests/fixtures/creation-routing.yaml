id: creation-routing
input_schema:
  version:
    type: string
    default_value: adaptive
inputs:
  version: ${{ inputs.version }}
state:
  initial: choose
  states:
    choose:
      sequence: []
      transitions:
        - to: adaptive
          when: inputs.version == 'adaptive'
        - to: adaptive2
          when: true
    adaptive:
      include: ../../recipes/adaptive/route-target.yaml
      inputs:
        request:
          kind: create
          cell: alpha
          ref: main
          request: Create alpha with its reviewed purpose.
        root_cell: root
        root_ref: main
        create_recipe: fixture-creation
        documents: {}
      transitions:
        - to: continue
          when: outputs.ready
    adaptive2:
      include: ../../recipes/adaptive2/route-target.yaml
      inputs:
        request:
          kind: create
          cell: alpha
          ref: main
          request: Create alpha with its reviewed purpose.
        root_cell: root
        root_ref: main
        create_recipe: fixture-creation
        documents: {}
      transitions:
        - to: continue
          when: outputs.ready
    continue:
      op: command_execution
      const: true
      inputs:
        run: printf 'Serving consultation may proceed\n'
outputs:
  result: '${{ state_exists(''adaptive'') ? states.adaptive.outputs : states.adaptive2.outputs }}'
  continued: ${{ state_exists('continue') }}
