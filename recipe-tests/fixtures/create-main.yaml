id: create-main
version: '1'
input_schema:
  prompt:
    type: string
    required: true
  occupied:
    type: string
    default_value: ''
inputs:
  prompt: ${{ inputs.prompt }}
  occupied: ${{ inputs.?occupied.orValue('') }}
sequence:
- id: prepare
  include: ./prepare-create-remotes.yaml
  inputs:
    occupied: ${{ inputs.occupied }}
- id: run
  include: ../../create.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
outputs:
  disposition: ${{ sequence.run.outputs.disposition }}
  created_cells: ${{ sequence.run.outputs.created_cells }}
  merged: ${{ sequence.run.outputs.merged }}
  merged_hash: ${{ sequence.run.outputs.merged_hash }}
  session: ${{ sequence.run.outputs.session }}
  summary: ${{ sequence.run.outputs.summary }}
  error: ${{ sequence.run.outputs.error }}
  review: ${{ sequence.run.outputs.review }}
  artifact_refs: ${{ sequence.run.outputs.artifact_refs }}
