id: create-main
version: '1'
input_schema:
  prompt:
    type: string
    required: true
  occupied:
    type: string
    default_value: ''
  reject_publication:
    type: string
    default_value: ''
  capture_failure:
    type: boolean
    default_value: false
  advance_catalog:
    type: boolean
    default_value: false
inputs:
  prompt: ${{ inputs.prompt }}
  occupied: ${{ inputs.?occupied.orValue('') }}
  reject_publication: ${{ inputs.?reject_publication.orValue('') }}
  capture_failure: ${{ inputs.?capture_failure.orValue(false) }}
  advance_catalog: ${{ inputs.?advance_catalog.orValue(false) }}
# Optional test boundary: production create remains uncaught. Most failure tests
# use expect_error; this boundary is only for inspecting structured identity.
catch:
- when: inputs.capture_failure
  continue:
    outputs:
      failed: true
      failure: ${{ json_parse(json_stringify(failure)) }}
sequence:
- id: prepare
  include: ./prepare-create-remotes.yaml
  inputs:
    occupied: ${{ inputs.occupied }}
    reject_publication: ${{ inputs.reject_publication }}
    advance_catalog: ${{ inputs.advance_catalog }}
- id: run
  include: ../../create.yaml
  inputs:
    prompt: ${{ inputs.prompt }}
    initialize_recipe: ${{ 'git+file://' + context.git.repo + '//.c2/recipes/initialize.yaml@main' }}
outputs:
  failed: false
  disposition: ${{ sequence.run.outputs.disposition }}
  created_cells: ${{ sequence.run.outputs.created_cells }}
  merged: ${{ sequence.run.outputs.merged }}
  merged_hash: ${{ sequence.run.outputs.merged_hash }}
  session: ${{ sequence.run.outputs.session }}
  summary: ${{ sequence.run.outputs.summary }}
  error: ${{ sequence.run.outputs.error }}
  review: ${{ sequence.run.outputs.review }}
  artifact_refs: ${{ sequence.run.outputs.artifact_refs }}
