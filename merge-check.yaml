schema_version: 2
id: adaptive3-merge-check
version: 1.0.0
perms:
  inherit: true
  jobdb:
    jobs:
      submit: false
input_schema:
  base:
    type: string
    required: true
  branch:
    type: string
    required: true
  contributions:
    type: array
    required: true
    items:
      type: object
  policy:
    type: object
    required: true
inputs:
  base: ${{ inputs.base }}
  branch: ${{ inputs.branch }}
  contributions: ${{ inputs.contributions }}
  policy: ${{ inputs.policy }}
workspace:
  cell: ${{ context.workflow.cell }}
  ref: ${{ inputs.base }}
sequence:
- id: check
  include: ./recipes/adaptive3/merge-queue-check.yaml
  inputs:
    base: ${{ inputs.base }}
    branch: ${{ inputs.branch }}
    contributions: ${{ inputs.contributions }}
    policy: ${{ inputs.policy }}
outputs:
  assembly: ${{ sequence.check.outputs.assembly }}
  artifacts: ${{ sequence.check.outputs.artifacts }}
  policy: ${{ sequence.check.outputs.policy }}
  verified_head: ${{ sequence.check.outputs.verified_head }}
  verification: ${{ sequence.check.outputs.verification }}
