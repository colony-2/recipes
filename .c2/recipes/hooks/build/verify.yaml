id: repository-build-verify
input_schema:
  api_version:
    type: string
    required: true
  request:
    type: string
    required: true
  target_directory:
    type: string
    required: true
  candidate:
    type: string
    required: true
  base:
    type: string
    required: true
  documents:
    type: artifact_map
    default_value: {}
  settings:
    type: artifact
    required: false
sequence:
- id: run_repository_suite
  op: command_execution
  const: true
  execution_needs:
    packages:
      # Go 1.26.8 builds the same source pin used in CI.
      - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#go
  inputs:
    env:
      REPO: ${{ context.environment.op.worktree_path }}
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      set -eu
      cd "$REPO"
      scratch=$(mktemp -d)
      trap 'rm -rf "$scratch"' EXIT
      if (
        bash scripts/install-c2j.sh "$scratch" &&
        PATH="$scratch/bin:$PATH" bash scripts/test-recipes.sh "$scratch/results"
      ) > "$OUTBOX/tests.log" 2>&1; then
        printf passed
      else
        if [ -d "$scratch/results" ]; then
          tar -czf "$OUTBOX/test-reports.tar.gz" -C "$scratch/results" .
        fi
        printf failed
      fi
outputs:
  api_version: c2.build-hook/v1
  status: ${{ sequence.run_repository_suite.outputs.stdout }}
  summary: "${{ 'Repository checks ' + sequence.run_repository_suite.outputs.stdout + '. See tests.log.' }}"
  artifact_refs: ${{ jq(sequence.run_repository_suite.artifacts, 'with_entries(select(.key == "tests.log" or .key == "test-reports.tar.gz"))') }}
