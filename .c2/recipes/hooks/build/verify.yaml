id: repository-build-verify
input_schema:
  api_version:
    type: string
    required: true
  request:
    type: string
    required: true
  target_directory:
    type: string
    required: true
  candidate:
    type: string
    required: true
  base:
    type: string
    required: true
  documents:
    type: artifact_map
    default_value: {}
  settings:
    type: artifact
    required: false
inputs:
  candidate: ${{ inputs.candidate }}
  base: ${{ inputs.base }}
sequence:
- id: run_repository_suite
  op: command_execution
  const: true
  execution_needs:
    python:
      requires-python: ">=3.10"
      dependencies:
        - PyYAML==6.0.3
        - Pillow==12.0.0
        - jsonschema==4.26.0
    packages:
      - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#cmark
      - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#yq-go
      - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#git
      # Go 1.26.8 builds the same source pin used in CI.
      - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#go
      # Reap orphaned fixture subprocesses even when the worker's PID 1 does not.
      - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#tini
  inputs:
    env:
      REPO: ${{ context.environment.op.worktree_path }}
      OUTBOX: ${{ context.environment.op.outbox }}
      CANDIDATE: ${{ inputs.candidate }}
      BASE: ${{ inputs.base }}
    run: |
      set -eu
      cd "$REPO"
      scratch=$(mktemp -d)
      trap 'rm -rf "$scratch"' EXIT
      if (
        printf 'Recipes candidate: '
        git rev-parse HEAD &&
        printf 'Required c2j: ' &&
        cat .c2j-version &&
        printf 'Candidate: %s\nBase: %s\nRuntime pin: ' "$CANDIDATE" "$BASE"
        cat .c2j-version
        bash scripts/install-c2j.sh "$scratch" &&
        git rev-parse HEAD &&
        cat .c2j-version &&
        git --version &&
        tini --version &&
        PATH="$scratch/bin:$PATH" tini -s -- bash scripts/test-recipes.sh "$scratch/results"
      ) > "$OUTBOX/tests.log" 2>&1; then
        printf passed
      else
        if [ -d "$scratch/results" ]; then
          tar -czf "$OUTBOX/test-reports.tar.gz" -C "$scratch/results" .
        fi
        printf failed
      fi
outputs:
  api_version: c2.build-hook/v1
  status: ${{ sequence.run_repository_suite.outputs.stdout }}
  summary: "${{ 'Repository checks ' + sequence.run_repository_suite.outputs.stdout + '. See tests.log.' }}"
  artifact_refs: ${{ jq(sequence.run_repository_suite.artifacts, 'with_entries(select(.key == "tests.log" or .key == "test-reports.tar.gz"))') }}
