id: new-ticket-outcome-determination
version: 0.2.0
desc: Determine and maintain cell test statements and validation plan before implementation
input_schema:
  prompt:
    type: string
    required: true
  user_feedback:
    type: string
    required: false
inputs:
  prompt: "{{ inputs.prompt }}"
  user_feedback: '${{ first_nonempty(inputs.?user_feedback, "") }}'
sequence:
  - id: load_cells
    op: command_execution
    inputs:
      timeout: 30s
      env:
        C2_USER_FEEDBACK: "{{ inputs.user_feedback }}"
      run: |
        set -euo pipefail
        mkdir -p "{{ context.environment.op.outbox }}/feedback" "{{ context.environment.op.outbox }}/requirements" "{{ context.environment.op.outbox }}/implementation" "{{ context.environment.op.outbox }}/outcome"
        printf '%s' "$C2_USER_FEEDBACK" > "{{ context.environment.op.outbox }}/feedback/user-feedback.md"
        : > "{{ context.environment.op.outbox }}/requirements/plan.json"
        : > "{{ context.environment.op.outbox }}/requirements/index.md"
        : > "{{ context.environment.op.outbox }}/implementation/plan.json"
        : > "{{ context.environment.op.outbox }}/implementation/index.md"
        : > "{{ context.environment.op.outbox }}/outcome/plan.json"
        : > "{{ context.environment.op.outbox }}/outcome/review.json"
        : > "{{ context.environment.op.outbox }}/outcome/tests-index.md"
        : > "{{ context.environment.op.outbox }}/outcome/validation-commands.txt"
        c2j cells --json

  - id: build_outcome_bundle
    op: git+https://github.com/colony-2/c2ops.git//codex@main
    artifacts:
      submitted/: '${{ context.artifacts }}'
      feedback/user-feedback.md: '${{ sequence.load_cells.artifacts["feedback/user-feedback.md"] }}'
      requirements/plan.json: '${{ "requirements/plan.json" in context.artifacts ? context.artifacts["requirements/plan.json"] : sequence.load_cells.artifacts["requirements/plan.json"] }}'
      requirements/index.md: '${{ "requirements/index.md" in context.artifacts ? context.artifacts["requirements/index.md"] : sequence.load_cells.artifacts["requirements/index.md"] }}'
      implementation/plan.json: '${{ "implementation/plan.json" in context.artifacts ? context.artifacts["implementation/plan.json"] : sequence.load_cells.artifacts["implementation/plan.json"] }}'
      implementation/index.md: '${{ "implementation/index.md" in context.artifacts ? context.artifacts["implementation/index.md"] : sequence.load_cells.artifacts["implementation/index.md"] }}'
      outcome/plan.json: '${{ "outcome/plan.json" in context.artifacts ? context.artifacts["outcome/plan.json"] : sequence.load_cells.artifacts["outcome/plan.json"] }}'
      outcome/review.json: '${{ "outcome/review.json" in context.artifacts ? context.artifacts["outcome/review.json"] : sequence.load_cells.artifacts["outcome/review.json"] }}'
      outcome/tests-index.md: '${{ "outcome/tests-index.md" in context.artifacts ? context.artifacts["outcome/tests-index.md"] : sequence.load_cells.artifacts["outcome/tests-index.md"] }}'
      outcome/validation-commands.txt: '${{ "outcome/validation-commands.txt" in context.artifacts ? context.artifacts["outcome/validation-commands.txt"] : sequence.load_cells.artifacts["outcome/validation-commands.txt"] }}'
    inputs:
      worktree_path: "{{ context.environment.op.worktree_path }}"
      workdir_path: "{{ context.environment.op.workdir }}"
      artifact_inbox_path: "{{ context.environment.op.inbox }}"
      artifact_outbox_path: "{{ context.environment.op.outbox }}"
      skill: "c2-test-statement-curator"
      skill_mode: "enforce"
      skills:
        - "gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7"
      prompt: |
        Follow the `c2-test-statement-curator` skill contract.
        Build an outcome-determination bundle for this job before implementation starts.

        Ticket prompt:
        {{ inputs.prompt }}

        Submitted artifacts directory:
        `{{ context.environment.op.inbox }}/submitted`

        Do not expect submitted file contents to be embedded in this prompt. If
        submitted artifacts are present, read them from the submitted artifacts
        directory.

        Current Cell: {{ context.workflow.cell }}
        Available Cells JSON: ${{ sequence.load_cells.outputs.stdout }}
        Available Cell Names JSON: ${{ json_stringify(jq(json_parse(sequence.load_cells.outputs.stdout), 'map(.name // .short_name // .repo // "") | map(select(. != ""))')) }}

        Input artifacts:
        - `{{ context.environment.op.inbox }}/requirements/plan.json`
        - `{{ context.environment.op.inbox }}/requirements/index.md`
        - `{{ context.environment.op.inbox }}/implementation/plan.json`
        - `{{ context.environment.op.inbox }}/implementation/index.md`

        Prior outcome artifacts may be present:
        - `{{ context.environment.op.inbox }}/outcome/plan.json`
        - `{{ context.environment.op.inbox }}/outcome/review.json`
        - `{{ context.environment.op.inbox }}/outcome/tests-index.md`
        - `{{ context.environment.op.inbox }}/outcome/validation-commands.txt`

        Authoritative test statement location in the cell repo:
        - `.c2/tests/*.md` (relative to the current cell root)

        User feedback artifact path:
        `{{ context.environment.op.inbox }}/feedback/user-feedback.md`

        Requirements:
        - Identify current test statements relevant to this job and this cell.
        - Decide whether test statements need to be altered before implementation.
        - Keep expectations backwards compatible.
        - Test statements MUST be markdown.
        - Each test statement line must be 30 words or fewer.
        - Each statement must include filename(s), importance, unit/integration + dependencies, and polarity.
        - Include positive and negative cases for critical behavior and integration points.
        - Avoid trivial getter/setter checks.

        Write files under this absolute outbox directory:
        `{{ context.environment.op.outbox }}/outcome`

        Required files:
        1) `plan.json` as valid JSON with EXACT keys:
           - summary (string)
           - current_test_statements_summary (string)
           - test_statement_updates_required (boolean)
           - test_statement_repo_glob (string)
           - validation_commands (string)
           - notes_for_user_review (string)
        2) `tests-index.md` (lists statement files under `.c2/tests/`)
        3) `validation-commands.txt` (newline-separated commands)
        4) `index.md`

        Also update or create test statement markdown files under `.c2/tests/*.md`.
        Do not modify source code for this step; only `.c2/tests/*.md` is allowed in repo changes.

        Final response must be ONLY the exact `plan.json` object content (no markdown, no prose).

  - id: contrarian_outcome_review
    op: git+https://github.com/colony-2/c2ops.git//codex@main
    artifacts:
      plan.json: '${{ sequence.build_outcome_bundle.artifacts["outcome/plan.json"] }}'
      tests-index.md: '${{ sequence.build_outcome_bundle.artifacts["outcome/tests-index.md"] }}'
    inputs:
      worktree_path: "{{ context.environment.op.worktree_path }}"
      workdir_path: "{{ context.environment.op.workdir }}"
      artifact_inbox_path: "{{ context.environment.op.inbox }}"
      artifact_outbox_path: "{{ context.environment.op.outbox }}"
      skill: "c2-outcome-contrarian-review"
      skill_mode: "enforce"
      skills:
        - "gitl.colony2.com/jnadeau/skills/.agents/skills@1362438426e25c733174ea85f248db11af99a8a7"
      prompt: |
        Follow the `c2-outcome-contrarian-review` skill contract.
        You are a contrarian reviewer for outcome determination and test statement quality.
        Be skeptical and block weak or incompatible outcomes.

        Review artifacts:
        - `{{ context.environment.op.inbox }}/plan.json`
        - `{{ context.environment.op.inbox }}/tests-index.md`
        - Cell repo statements under `.c2/tests/*.md`

        Validate:
        - Statements are markdown.
        - Each statement is 30 words or fewer.
        - Each statement includes filename(s), importance, test type + dependencies, and polarity.
        - Critical behavior includes both positive and negative statements.
        - Statements match requirements/implementation plan scope and avoid backwards-incompatible expectations.
        - Validation commands are sufficient for the stated outcomes.

        Produce a review object:
        {
          "ok": boolean,
          "feedback": string,
          "blocking_issues": [string]
        }

        Write artifacts:
        - `{{ context.environment.op.outbox }}/outcome/review.json`
        - `{{ context.environment.op.outbox }}/outcome/review.md`

        `review.md` format:
        - `# Outcome review (contrarian)`
        - `ok: \`<bool>\``
        - `## Feedback`
        - `## Blocking issues` (bulleted list or `(none)`)

        Final response must be ONLY the exact review JSON object.

outputs:
  plan_json: "{{ sequence.build_outcome_bundle.outputs.assistantSummary }}"
  summary: "${{ json_parse(sequence.build_outcome_bundle.outputs.assistantSummary).summary }}"
  current_test_statements_summary: "${{ json_parse(sequence.build_outcome_bundle.outputs.assistantSummary).current_test_statements_summary }}"
  test_statement_updates_required: "${{ json_parse(sequence.build_outcome_bundle.outputs.assistantSummary).test_statement_updates_required }}"
  test_statement_repo_glob: "${{ json_parse(sequence.build_outcome_bundle.outputs.assistantSummary).test_statement_repo_glob }}"
  validation_commands: "${{ json_parse(sequence.build_outcome_bundle.outputs.assistantSummary).validation_commands }}"
  notes_for_user_review: "${{ json_parse(sequence.build_outcome_bundle.outputs.assistantSummary).notes_for_user_review }}"
  review_ok: "${{ json_parse(sequence.contrarian_outcome_review.outputs.assistantSummary).ok }}"
  review_feedback: "${{ json_parse(sequence.contrarian_outcome_review.outputs.assistantSummary).feedback }}"
  review_blocking_issues: "${{ json_parse(sequence.contrarian_outcome_review.outputs.assistantSummary).blocking_issues }}"
