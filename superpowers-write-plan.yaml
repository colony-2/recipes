id: superpowers-write-plan
version: 0.1.0
desc: Convert an approved C2 Superpowers design into an executable task plan
input_schema:
  prompt:
    type: string
    required: true
  design_json:
    type: string
    required: false
  user_feedback:
    type: string
    required: false
  skill_bundle_ref:
    type: string
    required: false
inputs:
  prompt: "{{ inputs.prompt }}"
  design_json: '${{ first_nonempty(inputs.?design_json, "{}") }}'
  user_feedback: '${{ first_nonempty(inputs.?user_feedback, "") }}'
  skill_bundle_ref: '${{ first_nonempty(inputs.?skill_bundle_ref, "") }}'
sequence:
  - id: write_plan
    op: git+https://github.com/colony-2/c2ops.git//codex/run_skill@main
    inputs:
      skill: c2-superpowers-write-plan
      input:
        ticket_prompt: "{{ inputs.prompt }}"
        design_json: "{{ inputs.design_json }}"
        user_feedback: "{{ inputs.user_feedback }}"
        skill_bundle_ref: "{{ inputs.skill_bundle_ref }}"
      prompt: |
        Convert the approved design into a C2 Superpowers task plan.

        Use the `c2-superpowers-write-plan` contract. If a skill bundle ref is
        provided, it identifies the expected C2 Superpowers skills bundle:
        `{{ inputs.skill_bundle_ref }}`.

        Write:
        - `superpowers/plan/plan.md`
        - `superpowers/plan/plan.json`
        - `superpowers/plan/latest-status.json`

        Do not add manual commit steps. Do not create child jobs for ordinary
        dependent tasks. Mark a task `requires_child_job=true` only for a real
        C2 job boundary such as target-ref advancement, cross-cell work, reuse,
        true parallelism, or lifecycle isolation.
      status_contract:
        path: superpowers/plan/latest-status.json
      output:
        from: artifact
        path: superpowers/plan/plan.json
        format: json
        schema:
          type: object
          required:
            - plan_id
            - summary
            - tasks
            - ready_task_ids
            - validation_strategy
            - child_job_boundaries
          properties:
            plan_id:
              type: string
              minLength: 1
            summary:
              type: string
              minLength: 1
            tasks:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - id
                  - title
                  - status
                  - dependencies
                  - target_ref
                  - requires_child_job
                  - child_job_reason
                  - instructions
                  - validation_commands
                  - review_requirements
                properties:
                  id:
                    type: string
                    minLength: 1
                  title:
                    type: string
                    minLength: 1
                  status:
                    type: string
                  dependencies:
                    type: array
                    items:
                      type: string
                  target_ref:
                    type: string
                    minLength: 1
                  requires_child_job:
                    type: boolean
                  child_job_reason:
                    type: string
                  instructions:
                    type: string
                    minLength: 1
                  validation_commands:
                    type: array
                    items:
                      type: string
                  review_requirements:
                    type: array
                    items:
                      type: string
            ready_task_ids:
              type: array
              minItems: 1
              items:
                type: string
            validation_strategy:
              type: object
            child_job_boundaries:
              type: array
              items:
                type: object
                required:
                  - task_id
                  - reason
                properties:
                  task_id:
                    type: string
                  reason:
                    type: string
                    minLength: 1
          additionalProperties: true

  - id: plan_gate
    op: git+https://github.com/colony-2/c2ops.git//rule_gate@main
    inputs:
      rules:
        - id: plan_completed
          type: assert
          value: ${{ sequence.write_plan.outputs.status == "completed" || sequence.write_plan.outputs.status == "incomplete" }}
          message: Write-plan skill must return a normalized Codex status.
        - id: plan_output_schema_valid
          type: assert
          value: ${{ sequence.write_plan.outputs.output_schema_valid }}
          message: Plan artifact must match the C2 Superpowers task-plan schema.
        - id: plan_status_contract_valid
          type: assert
          value: ${{ sequence.write_plan.outputs.status_contract_present && sequence.write_plan.outputs.status_contract_valid }}
          message: Plan status contract must be present and valid.
        - id: ready_task_exists
          type: assert
          value: ${{ size(sequence.write_plan.outputs.parsed_output.ready_task_ids) > 0 }}
          message: Plan must expose at least one ready task id.
        - id: child_job_reasons_required
          type: assert
          value: ${{ sequence.write_plan.outputs.parsed_output.tasks.all(t, !t.requires_child_job || t.child_job_reason != "") }}
          message: Tasks that require child jobs must explain the C2 boundary.

outputs:
  plan_ok: "${{ sequence.plan_gate.outputs.ok }}"
  plan_failed_rule_ids: "${{ sequence.plan_gate.outputs.failed_rule_ids }}"
  plan_id: "${{ sequence.write_plan.outputs.parsed_output.plan_id }}"
  summary: "${{ sequence.write_plan.outputs.parsed_output.summary }}"
  tasks: "${{ sequence.write_plan.outputs.parsed_output.tasks }}"
  task_count: "${{ size(sequence.write_plan.outputs.parsed_output.tasks) }}"
  ready_task_ids: "${{ sequence.write_plan.outputs.parsed_output.ready_task_ids }}"
  first_ready_task_id: "${{ sequence.write_plan.outputs.parsed_output.ready_task_ids[0] }}"
  validation_strategy: "${{ sequence.write_plan.outputs.parsed_output.validation_strategy }}"
  child_job_boundaries: "${{ sequence.write_plan.outputs.parsed_output.child_job_boundaries }}"
  child_job_boundary_count: "${{ size(sequence.write_plan.outputs.parsed_output.child_job_boundaries) }}"
  write_plan_session_id: "{{ sequence.write_plan.outputs.sessionId }}"
  output_schema_valid: "${{ sequence.write_plan.outputs.output_schema_valid }}"
  status_contract_valid: "${{ sequence.write_plan.outputs.status_contract_valid }}"
