schema_version: 2
id: python-dependency-repro
sequence:
- id: import_pillow
  op: command_execution
  const: true
  execution_needs:
    packages:
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#python3Packages.pillow
    - nix:github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#cmark
  inputs:
    run: |
      set -eu
      command -v python3
      python3 -u - <<'PY'
      import json, sys
      print(json.dumps({"executable": sys.executable, "version": sys.version, "import_paths": sys.path}))
      import PIL
      from PIL import Image
      print(json.dumps({"pillow": PIL.__file__, "image_size": Image.new("RGB", (2, 2)).size}))
      PY
