schema_version: 2
id: live-document-details-check
input_schema:
  prompt:
    type: string
    required: true
  title:
    type: string
    default_value: ''
  type:
    type: string
    default_value: build
inputs:
  request: ${{ inputs.prompt }}
sequence:
- id: writing
  include: ../../recipes/adaptive3/lifecycle.yaml
  inputs:
    purpose: preparation
    request: ${{ inputs.request }}
outputs:
  result: ${{ sequence.writing.outputs.result }}
  documents: ${{ sequence.writing.outputs.documents }}
