recipe: recommendations.yaml
cases:
  - id: baseline-fresh-context
    type: integration_case
    runtime: {}
    inputs:
      variant: baseline
      scenario: provider-adoption
    mocks:
      ops:
        - match:
            selector: nix:github:colony-2/c2ops/published#codex
          behavior:
            mode: return
            outputs:
              status: completed
              output_schema_valid: true
              response:
                next_action: Plan delivery
          effects:
            objects:
              session:
                type: c2ops.codex.session/v1
                metadata:
                  label: recommendation-routing
    assertions:
      - type: cel_true
        expr: outputs.schema_valid && outputs.status=="completed"
      - type: cel_true
        expr: size(calls)==1 && calls[0].inputs.inputs.instructions==outputs.instructions && !("session" in calls[0].inputs.inputs)
      - type: cel_true
        expr: calls[0].inputs.inputs.prompt.contains(outputs.facts)
