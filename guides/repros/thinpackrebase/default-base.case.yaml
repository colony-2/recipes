# Regression: failed on v0.0.77; passes with c2j ee1420b12dee and later.
# Run explicitly to verify the installed runner's native defaults.
recipe: default-base.yaml
cases:
- id: native-default-base
  type: integration_case
  runtime:
    cells:
      root:
        files:
          README.md: 'Native refresh reproduction.'
  mocks:
    ops:
    - repeat: true
      match:
        op: command_execution
      behavior:
        mode: passthrough
  assertions:
  - type: cel_true
    expr: calls.exists(c, c.op == "thinpackrebase" && has(c.outputs.new_base_hash))
