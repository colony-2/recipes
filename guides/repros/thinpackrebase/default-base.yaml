id: thinpackrebase-default-base-repro
version: '1'
input_schema:
  prompt:
    type: string
    default_value: Diagnose the native Git base default
sequence:
- id: inspect
  op: command_execution
  inputs:
    working_directory: '{{ context.environment.op.worktree_path }}'
    env:
      RENDERED_BASE: '{{ context.git.resolved_hash }}'
    run: |
      set -eu
      actual_head=$(git rev-parse HEAD)
      printf '{"head":"%s","rendered_base":"%s"}' "$actual_head" "$RENDERED_BASE"
- id: refresh
  op: thinpackrebase
  inputs:
    repo_path: '{{ context.environment.op.worktree_path }}'
    target_base_hash: ${{ json_parse(sequence.inspect.outputs.stdout).head }}
    base_repo: ${{ context.git.repo }}
