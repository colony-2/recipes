id: repository-build-before_design
inputs:
  candidate: ${{ inputs.candidate }}
sequence:
- id: run_before_design
  op: command_execution
  const: true
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      ./scripts/research-alternatives.sh
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: before_design completed.
  artifact_refs: {}
