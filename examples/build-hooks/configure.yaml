id: repository-build-configure
sequence: []
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: Use design research and security assessments.
  artifact_refs: {}
  settings:
    require_design: true
    prompt_additions:
      design: Compare alternatives and explain operational costs.
      test_plan: Include negative authorization and cross-tenant cases.
    variables:
      deployment_tier: internal
    consultations:
    - key: security_design
      checkpoint: plan_assessment
      role: Security architect
      request: Assess trust boundaries, authorization, and the proposed negative tests.
      required: true
    - key: security_outcome
      checkpoint: outcome_assessment
      role: Security reviewer
      request: Inspect the implemented trust boundaries and negative tests.
      required: true
