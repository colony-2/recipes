id: repository-build-publish
inputs:
  candidate: ${{ inputs.candidate }}
  merged_hash: ${{ inputs.merged_hash }}
sequence:
- id: run_publish
  op: command_execution
  const: true
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
      MERGED_HASH: ${{ inputs.merged_hash }}
    run: |
      ./scripts/publish.sh "$MERGED_HASH"
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: publish completed.
  artifact_refs: {}
