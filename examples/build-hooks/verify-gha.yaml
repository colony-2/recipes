# Install as .c2/recipes/hooks/build/verify.yaml and choose your workflow.
id: build-verify-github-actions
sequence:
- id: checks
  op: nix:github:colony-2/c2ops/published#gha
  inputs:
    workflow: ci.yml
    backend: local
    timeout: 20m
    continue_on_error: true
outputs:
  api_version: c2.build-hook/v1
  status: "${{ sequence.checks.outputs.status == 'success' ? 'passed' : 'failed' }}"
  summary: "${{ 'CI workflow completed with status ' + sequence.checks.outputs.status }}"
  artifact_refs: {}
