id: repository-build-prepare
inputs:
  candidate: ${{ inputs.candidate }}
sequence:
- id: run_prepare
  op: command_execution
  const: false
  inputs:
    env:
      OUTBOX: ${{ context.environment.op.outbox }}
    run: |
      ./scripts/prepare-candidate.sh
outputs:
  api_version: c2.build-hook/v1
  status: passed
  summary: prepare completed.
  artifact_refs: {}
