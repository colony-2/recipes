schema_version: 2
id: adaptive3-merge-batch
version: 1.0.0
input_schema:
  branch:
    type: string
    required: true
  verification_policy:
    type: object
    required: true
inputs:
  branch: ${{ inputs.branch }}
  policy: ${{ inputs.verification_policy }}
sequence:
- id: batch
  include: ./recipes/adaptive3/merge-queue-batch.yaml
  inputs:
    branch: ${{ inputs.branch }}
    policy: ${{ inputs.policy }}
    appends: ${{ context.grouping.appends }}
    check_recipe: >-
      ${{ 'git+' + context.recipe_source.?repo.orValue('https://github.com/colony-2/recipes.git') + '//merge-check.yaml@' +
        context.recipe_source.?ref.orValue('main') }}
outputs:
  version: ${{ sequence.batch.outputs.version }}
  branch: ${{ sequence.batch.outputs.branch }}
  requested: ${{ sequence.batch.outputs.requested }}
  results: ${{ sequence.batch.outputs.results }}
