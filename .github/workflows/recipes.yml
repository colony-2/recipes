name: Recipe tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    name: Recipes / pinned c2j runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false

      - name: Install pinned c2j runtime
        run: |
          mkdir -p "$RUNNER_TEMP/recipe-results"
          bash scripts/install-c2j.sh "$RUNNER_TEMP/c2j" | tee "$RUNNER_TEMP/recipe-results/runtime-install.txt"
          echo "$RUNNER_TEMP/c2j/bin" >> "$GITHUB_PATH"
          {
            "$RUNNER_TEMP/c2j/bin/c2j" version
            cat .c2j-version
            git rev-parse HEAD
          } | tee "$RUNNER_TEMP/recipe-results/c2j-version.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '12.10.1'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # 31.11.3
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = false

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: colony2
          skipPush: true

      - name: Record Nix version
        run: nix --version | tee "$RUNNER_TEMP/recipe-results/nix-version.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Run repository checks and deterministic recipe suites
        run: |
          uv pip install --system PyYAML==6.0.3 Pillow==12.0.0 jsonschema==4.26.0
          nix shell \
            github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#cmark \
            github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#yq-go \
            github:NixOS/nixpkgs/e7439b6b14ad3cc35d05608ebca9bce01a25f5f8#git \
            --command bash scripts/test-recipes.sh "$RUNNER_TEMP/recipe-results"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recipe-test-results
          path: ${{ runner.temp }}/recipe-results
          retention-days: 14
