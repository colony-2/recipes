version: 1
sources:
  c2j:
    version: v0.0.36
    source: installed c2j and github.com/colony-2/c2j
  c2ops:
    source: github.com/colony-2/c2ops op.yaml manifests
core_ops:
  - name: command_execution
    category: shell
    use: Bounded shell commands, validation commands, and light file generation.
    reference: content/ops/core.md
    accepts_artifacts: true
  - name: input
    category: human_input
    use: Structured human input and approval checkpoints.
    reference: content/ops/core.md
  - name: sleep
    category: orchestration
    use: Explicit waits and backoff.
    reference: content/ops/core.md
  - name: recipe.run_and_get_result
    category: child_recipe
    use: Start one child recipe and wait for its result.
    reference: content/ops/core.md
  - name: recipes.run
    category: child_recipe
    use: Start multiple child recipes without waiting.
    reference: content/ops/core.md
  - name: recipes.run_and_wait
    category: child_recipe
    use: Start multiple child recipes and wait for terminal status.
    reference: content/ops/core.md
  - name: recipe.await_result
    category: child_recipe
    use: Wait for one previously-started child recipe.
    reference: content/ops/core.md
  - name: recipe.await_result_soft
    category: child_recipe
    use: Wait for a child recipe and return terminal failure as data.
    reference: content/ops/core.md
  - name: recipe.get_result
    category: child_recipe
    use: Fetch a completed child recipe result.
    reference: content/ops/core.md
  - name: thinpackrebase
    category: git
    use: Rebase persisted recipe git state.
    reference: content/reference/git-state.md
  - name: squashrebasemerge
    category: git
    use: Squash and merge persisted recipe git state.
    reference: content/reference/git-state.md
c2ops:
  - name: codex
    selector: nix:github:colony-2/c2ops/main#codex
    category: agent
    required_inputs: [prompt]
    use: Agentic Codex coding or review work.
    reference: content/ops/c2ops.md
  - name: skill.run
    selector: nix:github:colony-2/c2ops/main#skill-run
    category: agent
    required_inputs: [skill]
    use: Run one Codex skill with structured output and status-contract validation.
    reference: content/ops/c2ops.md
  - name: llm2
    selector: nix:github:colony-2/c2ops/main#llm2
    category: llm
    required_inputs: [default_provider, default_model]
    use: Enhanced model call with structured output, file context, and tools.
    reference: content/ops/c2ops.md
  - name: rule_gate
    selector: nix:github:colony-2/c2ops/main#rule_gate
    category: policy
    required_inputs: [rules]
    use: Deterministic policy rules over assertions, files, JSON, schemas, and child status.
    reference: content/patterns/rule-gates.md
    validated_example: docs/examples/recipes/rule-gate.yaml
  - name: gha
    selector: nix:github:colony-2/c2ops/main#gha
    category: ci
    required_inputs: [workflow]
    use: Run one GitHub Actions workflow.
    reference: content/ops/c2ops.md
  - name: gha-many
    selector: nix:github:colony-2/c2ops/main#gha-many
    category: ci
    required_inputs: [workflows]
    use: Run multiple GitHub Actions workflows.
    reference: content/ops/c2ops.md
  - name: aider
    selector: nix:github:colony-2/c2ops/main#aider
    category: agent
    required_inputs: [prompt]
    use: Aider-backed agentic coding through extension execution.
    reference: content/ops/c2ops.md
  - name: litellm
    selector: nix:github:colony-2/c2ops/main#litellm
    category: llm
    required_inputs: [provider, model, prompt]
    use: LiteLLM-backed LLM request compatible with legacy LLM shape.
    reference: content/ops/c2ops.md
  - name: llm
    selector: nix:github:colony-2/c2ops/main#llm
    category: llm
    required_inputs: [provider, model, prompt]
    use: Legacy LLM inference through extension execution.
    reference: content/ops/c2ops.md
  - name: pydantic
    selector: nix:github:colony-2/c2ops/main#pydantic
    category: llm
    required_inputs: [default_provider, default_model]
    use: PydanticAI-backed LLM2-compatible request.
    reference: content/ops/c2ops.md

