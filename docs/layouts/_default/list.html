{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ if .Pages }}
    <div class="children">
      <h2>Pages</h2>
      <ul>
        {{ range .Pages.ByWeight }}
          <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
            {{ with .Summary }}<div class="meta">{{ . | plainify }}</div>{{ end }}
          </li>
        {{ end }}
      </ul>
    </div>
  {{ end }}
{{ end }}
