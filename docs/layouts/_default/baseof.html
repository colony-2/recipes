<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17202a;
        --muted: #566573;
        --line: #d8dee4;
        --panel: #f6f8fa;
        --accent: #0969da;
        --code: #24292f;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.55;
        background: #fff;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .shell {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
        min-height: 100vh;
      }
      nav {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 24px 20px;
      }
      nav h1 {
        margin: 0 0 18px;
        font-size: 1.05rem;
      }
      nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      nav li { margin: 7px 0; }
      main {
        max-width: 980px;
        padding: 42px 48px 72px;
      }
      h1, h2, h3 { line-height: 1.2; }
      h1 { margin-top: 0; font-size: 2.1rem; }
      h2 { margin-top: 2rem; border-bottom: 1px solid var(--line); padding-bottom: 0.25rem; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
      th { background: var(--panel); }
      code {
        color: var(--code);
        background: var(--panel);
        border-radius: 4px;
        padding: 0.1rem 0.25rem;
      }
      pre {
        overflow-x: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }
      pre code {
        background: transparent;
        padding: 0;
      }
      .children {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
      }
      .children li { margin: 0.5rem 0; }
      .meta { color: var(--muted); }
      @media (max-width: 800px) {
        .shell { display: block; }
        nav { border-right: 0; border-bottom: 1px solid var(--line); }
        main { padding: 28px 20px 52px; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <nav aria-label="Site navigation">
        <h1><a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></h1>
        <ul>
          {{ range site.Sections.ByWeight }}
            <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
          {{ end }}
        </ul>
      </nav>
      <main>
        {{ block "main" . }}{{ end }}
      </main>
    </div>
  </body>
</html>
