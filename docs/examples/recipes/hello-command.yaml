id: docs-hello-command
version: 0.1.0
desc: Minimal c2j command execution example.
input_schema:
  name:
    type: string
    required: false
    default_value: world
inputs:
  name: "{{ inputs.name }}"
sequence:
  - id: greet
    op: command_execution
    inputs:
      timeout: 30s
      env:
        NAME: "{{ inputs.name }}"
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        print(json.dumps({"greeting": "hello " + os.environ["NAME"]}))
        PY
outputs:
  greeting: '${{ json_parse(sequence.greet.outputs.stdout).greeting }}'

