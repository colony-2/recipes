id: docs-input-autofill
version: 0.1.0
desc: Structured input with autofill for non-interactive tests.
sequence:
  - id: approve
    op: input
    inputs:
      form:
        title: "Approval"
        fields:
          - id: decision
            type: multiple_choice
            question: Continue?
            required: true
            options:
              - value: approve
                label: Approve
              - value: reject
                label: Reject
        autofill:
          fields:
            decision: approve
          user_id: docs

  - id: summarize
    op: command_execution
    inputs:
      timeout: 30s
      env:
        DECISION: "{{ sequence.approve.outputs.fields.decision }}"
      run: |
        set -euo pipefail
        printf 'decision=%s' "$DECISION"
outputs:
  decision: "{{ sequence.approve.outputs.fields.decision }}"
  summary: "{{ sequence.summarize.outputs.stdout }}"

