id: docs-artifact-handoff
version: 0.1.0
desc: Produce an outbox artifact and bind it into a later op inbox.
sequence:
  - id: write_payload
    op: command_execution
    inputs:
      timeout: 30s
      working_directory: "{{ context.environment.op.outbox }}"
      run: |
        set -euo pipefail
        mkdir -p reports
        printf 'artifact handoff ok\n' > reports/result.txt

  - id: read_payload
    op: command_execution
    artifacts:
      result.txt: '${{ sequence.write_payload.artifacts["reports/result.txt"] }}'
    inputs:
      timeout: 30s
      working_directory: "{{ context.environment.op.inbox }}"
      run: |
        set -euo pipefail
        cat result.txt
outputs:
  content: "{{ sequence.read_payload.outputs.stdout }}"
  artifact_name: reports/result.txt

