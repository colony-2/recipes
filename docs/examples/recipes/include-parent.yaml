id: docs-include-parent
version: 0.1.0
desc: Inline include parent example.
input_schema:
  subject:
    type: string
    required: false
    default_value: includes
inputs:
  subject: "{{ inputs.subject }}"
sequence:
  - id: child
    include: ./include-child.yaml
    inputs:
      subject: "{{ inputs.subject }}"
outputs:
  child_message: "{{ sequence.child.outputs.message }}"

