id: docs-include-child
version: 0.1.0
desc: Inline include child example.
input_schema:
  subject:
    type: string
    required: true
inputs:
  subject: "{{ inputs.subject }}"
sequence:
  - id: write_message
    op: command_execution
    inputs:
      timeout: 30s
      env:
        SUBJECT: "{{ inputs.subject }}"
      run: |
        set -euo pipefail
        printf 'child handled %s' "$SUBJECT"
outputs:
  message: "{{ sequence.write_message.outputs.stdout }}"

