baseURL = "https://docs.example.invalid/c2j/"
locale = "en-US"
title = "c2j Authoring Reference"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"

[params]
  description = "A verified reference for authoring c2 recipes with c2j."

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
