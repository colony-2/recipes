baseURL = "https://docs.example.invalid/c2j/"
locale = "en-US"
title = "c2j Authoring Reference"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"

[params]
  themeVariant = ["relearn-light", "relearn-dark"]
  collapsibleMenu = true
  disableLandingPageButton = true

[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.imports]]
    path = "github.com/McShelby/hugo-theme-relearn"
